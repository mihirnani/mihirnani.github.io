const STAGE0 = {
  id: "alphabet", short: "Αβ", icon: "Αβ", label: "The Alphabet – Πρῶτα γράμματα",
  tagline: "Every letter, from zero",
  desc: "Four short units that assume nothing: the letters you already half-know, the genuinely new ones, the diphthongs and the marks, and then real reading practice. Finish this stage and Greek script is simply how you read.",
  units: [
{
  id: "z1", title: "The familiar fourteen", subtitle: "More than half the alphabet is already yours",
  grammar: `<p class="lead">Nobody starts Greek from nothing. The Latin alphabet you read every day is the Greek alphabet's grandchild (by way of the Etruscans), and fourteen Greek letters still look and sound close enough to their descendants that you can read them today, in your first hour.</p>
<h3>The letters you can already read</h3>
<table class="gr"><tr><th>Letter</th><th>Name</th><th>Sound</th><th>Try it</th></tr>
<tr><td lang="grc">Α α</td><td>alpha</td><td>a as in <i>father</i></td><td lang="grc">α</td></tr>
<tr><td lang="grc">Β β</td><td>beta</td><td>b as in <i>bed</i></td><td lang="grc">βα</td></tr>
<tr><td lang="grc">Γ γ</td><td>gamma</td><td>hard g as in <i>go</i></td><td lang="grc">γα</td></tr>
<tr><td lang="grc">Δ δ</td><td>delta</td><td>d as in <i>dog</i></td><td lang="grc">δα</td></tr>
<tr><td lang="grc">Ε ε</td><td>epsilon</td><td>short e as in <i>pet</i></td><td lang="grc">δε</td></tr>
<tr><td lang="grc">Ι ι</td><td>iota</td><td>i as in <i>machine</i></td><td lang="grc">δι</td></tr>
<tr><td lang="grc">Κ κ</td><td>kappa</td><td>k as in <i>skill</i></td><td lang="grc">κι</td></tr>
<tr><td lang="grc">Λ λ</td><td>lambda</td><td>l as in <i>lamp</i></td><td lang="grc">λα</td></tr>
<tr><td lang="grc">Μ μ</td><td>mu</td><td>m as in <i>mother</i></td><td lang="grc">μα</td></tr>
<tr><td lang="grc">Ν ν</td><td>nu</td><td>n as in <i>net</i></td><td lang="grc">να</td></tr>
<tr><td lang="grc">Ο ο</td><td>omicron</td><td>short o as in <i>got</i></td><td lang="grc">το</td></tr>
<tr><td lang="grc">Π π</td><td>pi</td><td>p as in <i>spin</i></td><td lang="grc">πο</td></tr>
<tr><td lang="grc">Σ σ ς</td><td>sigma</td><td>s as in <i>sing</i></td><td lang="grc">σο</td></tr>
<tr><td lang="grc">Τ τ</td><td>tau</td><td>t as in <i>stop</i></td><td lang="grc">τα</td></tr></table>
<h3>The two shapes of sigma</h3>
<p>Sigma is written <b lang="grc">σ</b> everywhere except at the end of a word, where it becomes <b lang="grc">ς</b>: <b lang="grc">σοφός</b> has both. One letter, two costumes – like our handwritten vs printed forms.</p>
<h3>One early warning</h3>
<p>Lower-case <b lang="grc">ν</b> is <i>n</i>, not v. It is the only real trap in this batch (the capitals Ν, Β, Γ, Δ behave). Say <i>nu</i> out loud every time you see it this week and the trap never springs.</p>
<h3>Read your first words</h3>
<p>With these fourteen letters you can already read real Greek words. Sound each one out, left to right. Greek spelling is far more phonetic than English, and in the forms introduced here every letter shown contributes to the reading:</p>
<table class="gr"><tr><th>Word</th><th>Sound it out</th><th>Meaning</th></tr>
<tr><td lang="grc">δέκα</td><td>DE-ka</td><td>ten (as in <i>decade</i>)</td></tr>
<tr><td lang="grc">μέλι</td><td>ME-li</td><td>honey (as in <i>mellifluous</i>)</td></tr>

  id: "z2", title: "The new ten", subtitle: "η, θ, ξ, ρ, υ, φ, χ, ψ, ω, ζ – and the false friends",
  grammar: `<p class="lead">Ten letters remain. A few are genuinely new shapes; the dangerous ones are the <b>false friends</b> – Greek letters that look like Latin letters and are not. Meet them squarely once and they never trouble you again.</p>
<h3>The false friends – read this table twice</h3>
<table class="gr"><tr><th>Letter</th><th>It is…</th><th>It is NOT…</th></tr>
<tr><td lang="grc">Η η</td><td>ēta – a long open <b>e</b> (as in <i>air</i>)</td><td>the letter H</td></tr>
<tr><td lang="grc">Ρ ρ</td><td>rho – <b>r</b> (lightly trilled)</td><td>the letter P</td></tr>
<tr><td lang="grc">Υ υ</td><td>upsilon – French <b>u</b> / German <b>ü</b></td><td>a simple y or v</td></tr>
<tr><td lang="grc">Χ χ</td><td>chi – aspirated <b>k</b>: k + a puff of breath, as in <i>can</i></td><td>the x of <i>box</i> – nor the fricative of <i>loch</i>, a later (Koine and modern) value</td></tr>
<tr><td lang="grc">Ω ω</td><td>ōmega – long open <b>o</b> (as in <i>saw</i>)</td><td>a w</td></tr></table>
<h3>The rest of the new ten</h3>
<table class="gr"><tr><th>Letter</th><th>Name</th><th>Sound</th></tr>
<tr><td lang="grc">Ζ ζ</td><td>zeta</td><td>a double consonant; often restored <i>zd</i> in Classical Attic (the exact value is debated)</td></tr>
<tr><td lang="grc">Θ θ</td><td>theta</td><td>aspirated t – t + puff of air (later the <i>th</i> of <i>thin</i>)</td></tr>
<tr><td lang="grc">Ξ ξ</td><td>xi</td><td>ks as in <i>box</i></td></tr>
<tr><td lang="grc">Φ φ</td><td>phi</td><td>aspirated p – p + puff (later f)</td></tr>
<tr><td lang="grc">Ψ ψ</td><td>psi</td><td>ps as in <i>lapse</i></td></tr></table>
<h3>Long and short vowels</h3>
<p>Greek hears vowel length the way music hears note length. ε and ο are always short; <b lang="grc">η</b> and <b lang="grc">ω</b> are their long partners; α, ι, υ can be either. Length is meaningful: <b lang="grc">λόγος</b> and a hypothetical λώγος would be different words, and all Greek poetry is built on the long/short rhythm.</p>
<h3>The system behind nine letters</h3>
<p>The stops arrange themselves into three tidy rows – plain, voiced, aspirated:</p>
<table class="gr"><tr><th></th><th>plain</th><th>voiced</th><th>aspirated</th></tr>
<tr><th scope="row">lip letters</th><td lang="grc">π</td><td lang="grc">β</td><td lang="grc">φ</td></tr>
<tr><th scope="row">tooth letters</th><td lang="grc">τ</td><td lang="grc">δ</td><td lang="grc">θ</td></tr>
<tr><th scope="row">throat letters</th><td lang="grc">κ</td><td lang="grc">γ</td><td lang="grc">χ</td></tr></table>
<p>This is not trivia: it predicts spellings all through the course (π + σ → ψ, κ + σ → ξ), and it explains why English transliterates θ, φ, χ as <i>th, ph, ch</i> – each was its plain partner plus a puff of breath.</p>
<h3>Two small sound-rules</h3>
<p><b>γ before κ, γ, χ, ξ</b> is pronounced <i>ng</i>: <b lang="grc">ἄγγελος</b> is <i>angelos</i>, messenger. ξ and ψ transparently write two sounds (ks, ps). ζ also counts as a double consonant for metre, but its exact reconstructed sound varies by period and dialect; <i>zd</i> is a common restoration for Classical Attic.</p>
<div class="tip"><b>Drill now.</b> Run the Alphabet trainer's Letters drill until the false friends feel boring. Boredom is the goal: it means the letters have moved from puzzle to print.</div>`,

    { t: "mcq", form: "χ", q: "In restored classical pronunciation, this letter is:", opts: ["an aspirated k – k plus a puff of breath", "the x of box", "the fricative ch of loch", "sh"], a: 0, ex: "In 5th-century Attic, φ θ χ were aspirated STOPS – p, t, k with extra breath (as in <i>pan, tan, can</i>). The fricative values (f, th of <i>thin</i>, ch of <i>loch</i>) are later, Koine-to-modern developments. χάος is classical <i>kʰaos</i>." },

    { t: "mcq", q: "Complete the aspirated row: π→φ, τ→θ, κ→___", opts: ["χ", "ξ", "ψ", "ζ"], a: 0, ex: "The three aspirates are φ, θ, χ – their plain partners plus breath. The double letters ζ, ξ, ψ are a different family." },
    { t: "fill", q: "Transliterate: <b lang='grc'>ψυχή</b> (soul)", a: ["psyche", "psuche", "psychē"], ex: "ψ = ps, υ = y/u, χ = ch, η = ē: psychē – psychology's first half." },
    { t: "fill", q: "Transliterate: <b lang='grc'>θεός</b> (god)", a: ["theos"], ex: "θ = th: theos, as in theology. In the classical period it was a t with a puff – which is exactly why the Romans wrote 'th'." },
    { t: "fill", q: "Transliterate: <b lang='grc'>ξένος</b> (stranger, guest)", a: ["xenos"], ex: "ξ = x/ks: xenos – as in xenophobia, and its kindlier cousin philoxenia, love of guests." },
    { t: "mcq", form: "ἄγγελος", q: "The γγ in this word is pronounced:", opts: ["ng", "gg as in bigger", "j", "silently"], a: 0, ex: "γ nasalises before κ γ χ ξ: angelos, 'messenger' – later 'angel'. Same rule in ἀνάγκη (necessity): a-NANG-kē." },
    { t: "pick", q: "Click the word that contains a FALSE FRIEND letter (looks Latin, isn't).", s: "μέλι ῥυθμός δέκα", a: "ῥυθμός", ex: "ῥυθμός packs two: ρ (r, not p) and υ (u-vowel). μέλι and δέκα are all familiar letters." },

    { t: "fill", q: "Type the Greek letter for the ASPIRATED k (k + breath).", a: ["χ"], ex: "χ (chi) – classical kʰ, the breathy partner of κ; first letter of χάος and χαρακτήρ. (Only in later Greek did it become the loch-fricative.)" }
  ]

{
  id: "z3", title: "Diphthongs & the marks", subtitle: "Six vowel-pairs, two breathings, three accents, one hidden iota",
  grammar: `<p class="lead">Two short systems complete the script. Diphthongs are vowel-pairs pronounced as one glide – six matter. The marks above and below the letters look forbidding on the page and take an afternoon to learn: two breathings, three accents, one subscript iota, and two punctuation signs.</p>
<h3>The six diphthongs</h3>
<table class="gr"><tr><th>Diphthong</th><th>Sound</th><th>Example</th></tr>
<tr><td lang="grc">αι</td><td><i>eye</i></td><td lang="grc">καί – and</td></tr>
<tr><td lang="grc">ει</td><td><i>ay</i> in <i>they</i></td><td lang="grc">εἰμί – I am</td></tr>
<tr><td lang="grc">οι</td><td><i>oy</i> in <i>boy</i></td><td lang="grc">οἶκος – house</td></tr>
<tr><td lang="grc">αυ</td><td><i>ow</i> in <i>cow</i></td><td lang="grc">αὐτός – self</td></tr>
<tr><td lang="grc">ευ</td><td>e + u in one glide</td><td lang="grc">εὖ – well (as in eu-phoria)</td></tr>
<tr><td lang="grc">ου</td><td><i>oo</i> in <i>food</i></td><td lang="grc">οὐρανός – sky</td></tr></table>
<p><small>A refinement you can postpone: by the classical period ει and ου were in fact pronounced as simple long vowels (roughly <i>ay</i>/<i>ey</i> and <i>oo</i>), and the spellings are also used for the "spurious diphthongs" that arise from contraction – which is why ε + ε gives ει and ε + ο gives ου in the contract verbs later on.</small></p>
<h3>Breathings – where the h went</h3>
<p>Greek writes no letter h. Instead, every word beginning with a vowel (or ρ) carries a small hook over its first vowel:</p>
<table class="gr"><tr><th>Mark</th><th>Name</th><th>Effect</th><th>Example</th></tr>
<tr><td lang="grc">ἁ</td><td>rough breathing ( ῾ )</td><td>say h first</td><td lang="grc">ὁδός = hodos, road</td></tr>
<tr><td lang="grc">ἀ</td><td>smooth breathing ( ᾿ )</td><td>no h</td><td lang="grc">ἀγορά = agora</td></tr></table>
<p>On a diphthong the breathing rides the <i>second</i> vowel: <b lang="grc">οἶκος</b>, <b lang="grc">εὑρίσκω</b>. Initial υ and ρ are always rough – hence English <i>hy-</i> and <i>rh-</i> spellings (hydrogen, rhetoric).</p>
<h3>Accents – three shapes, one habit</h3>
<table class="gr"><tr><th>Sign</th><th>Name</th><th>Originally</th><th>You do</th></tr>
<tr><td lang="grc">ά</td><td>acute</td><td>pitch rises</td><td rowspan="3">stress that syllable</td></tr>
<tr><td lang="grc">ᾶ</td><td>circumflex</td><td>rise-and-fall (long vowels only)</td></tr>
<tr><td lang="grc">ὰ</td><td>grave</td><td>an acute muted before the next word</td></tr></table>
<p>For now your whole duty is: <b>stress the marked syllable</b>. The placement rules can wait (they live in the Reference when you want them); the reading habit cannot.</p>
<h3>Iota subscript</h3>
<p>Under the long vowels <b lang="grc">ᾳ ῃ ῳ</b> hides a tiny iota – once pronounced, later silent, always meaningful: it will distinguish grammatical forms for you throughout the course. Train your eye to see it now.</p>
<h3>Punctuation</h3>
<p>Comma and full stop as in English; the raised dot <b>·</b> is a semicolon/colon; and the Greek question mark is <b>;</b> – <b lang="grc">τί;</b> means <i>what?</i></p>
<div class="pitfall"><b>The complete mark-list</b> – this is truly all of it:<ul><li>῾ rough (h) · ᾿ smooth (no h)</li><li>ά acute · ᾶ circumflex · ὰ grave – stress here</li><li>ͺ iota subscript – a silent, meaningful iota</li><li>¨ diaeresis – two vowels sounded separately, not as a diphthong: ὀϊστός</li><li>· raised dot (colon) · ; question mark</li></ul>Everything else you will ever see is a combination of these.</div>`,
  examples: [
    ["καί", "kai – 'and': the eye-diphthong, with an acute."],
    ["οἶκος", "oikos – 'house': smooth breathing + circumflex sharing the diphthong. Economy is οἶκος + νόμος, house-law."],
    ["ὁδός", "hodos – 'road': rough breathing = h. An ἔξοδος is the road out."],
    ["εὑρίσκω", "heuriskō – 'I find': rough breathing on the diphthong ευ. Its perfect is εὕρηκα – eureka."],
    ["τῇ ᾠδῇ", "tē(i) ō(i)dē(i) – 'for the song': three iota subscripts in two words. ᾠδή, song, is the -ody of melody and parody."]
  ],

    ["αι", "diphthong: eye (καί)"],

    ["οι", "diphthong: oy (οἶκος)"],

    ["ου", "diphthong: oo (οὐρανός)"],
    ["῾ (ἁ)", "rough breathing: say h"],
    ["᾿ (ἀ)", "smooth breathing: no h"],
    ["ά ᾶ ὰ", "acute, circumflex, grave: stress here"],
    ["ᾳ ῃ ῳ", "iota subscript: silent, grammatical"],

  ],
  exercises: [
    { t: "mcq", form: "οὐ", q: "This diphthong sounds like:", opts: ["oo in food", "ow in cow", "oy in boy", "eye"], a: 0, ex: "ου = oo. οὐρανός is <i>oo-ra-nos</i>. (And οὐ happens to be the Greek word for 'not' – you will meet it constantly.)" },
    { t: "mcq", form: "αι", q: "And this one?", opts: ["eye", "ay in they", "ah-ee separately", "oo"], a: 0, ex: "αι is the vowel of <i>eye</i>: καί rhymes with 'sky'. The ay of <i>they</i> is ει." },
    { t: "mcq", form: "ὁ", q: "The mark over this vowel means:", opts: ["pronounce h before it", "no h", "stress it", "it is long"], a: 0, ex: "The rough breathing ( ῾ ): ὁ = 'ho'. Its mirror-twin ( ᾿ ) is the smooth breathing, the explicit absence of h." },
    { t: "mcq", q: "Which initial letters ALWAYS carry the rough breathing?", opts: ["υ and ρ", "α and ε", "η and ω", "ι and ο"], a: 0, ex: "ὕδωρ (hydōr), ῥήτωρ (rhētōr): always rough – which is why English writes hydro- and rh-." },
    { t: "mcq", q: "On a diphthong, breathing and accent sit on:", opts: ["the second vowel", "the first vowel", "both", "neither"], a: 0, ex: "οἶκος, αὐτός, εὑρίσκω: the marks ride the second letter of the pair. Seeing οἶ- and reading 'hoy…?' – no: smooth breathing, so plain 'oy'." },
    { t: "mcq", q: "Your practical rule for ALL THREE accents, for now:", opts: ["stress the marked syllable", "sing a rising tone", "lengthen the vowel", "pause after the word"], a: 0, ex: "Acute, circumflex, grave – all become stress in modern reading practice. The ancient pitch-music is real history, but stress is the working convention." },
    { t: "mcq", form: "ᾠδή", q: "The mark under the ω is:", opts: ["iota subscript – a silent iota", "a comma", "a breathing", "decoration"], a: 0, ex: "ᾠδή (song) begins with ō + silent iota. The subscript distinguishes grammatical forms all through Greek – small, silent, load-bearing." },
    { t: "fill", q: "Transliterate: <b lang='grc'>εὑρίσκω</b> (I find) – remember the rough breathing.", a: ["heurisko", "heuriskō"], ex: "Rough breathing on ευ → heu-: heuriskō. Its perfect εὕρηκα is the most famous first-person verb in science." },
    { t: "fill", q: "Transliterate: <b lang='grc'>οἶκος</b> (house)", a: ["oikos"], ex: "Smooth breathing (no h) + oy-diphthong: oikos. Economy, ecology, ecumenical – the house grew large." },
    { t: "pick", q: "Click the word with a ROUGH breathing.", s: "ἀγορὰ καὶ ὁδὸς καὶ οἶκος", a: "ὁδὸς", ex: "ὁδός = hodos. ἀγορά and οἶκος are smooth. (The grave accents on -ὰ and -ὸς are acutes muted before a following word – normal connected-text spelling.)" },
    { t: "mcq", q: "What does <b>;</b> mean at the end of a Greek sentence?", opts: ["it is a question", "a pause", "end of paragraph", "quotation"], a: 0, ex: "τί λέγεις; = 'what are you saying?' The raised dot · is the Greek colon. Reading punctuation is part of reading." },
    { t: "fill", q: "Type the Greek for 'and' – the most common word in the language (accent optional).", a: ["καί", "και", "καὶ"], ex: "καί. One diphthong, one acute, endless use. You now read every mark in it knowingly." }
  ]
},
{
  id: "z4", title: "Reading practice – words, names, sentences", subtitle: "From deciphering to reading",
  grammar: `<p class="lead">You know every letter and every mark. This unit turns knowledge into fluency: syllables, stress, real names, loanwords you already own, and your first complete Greek sentence. After it, the course proper begins – and script will never again be the hard part.</p>
<h3>How to break words into syllables</h3>
<p>Greek syllables are simple: each vowel or diphthong anchors one syllable, and a single consonant between vowels goes with the following vowel: <b lang="grc">ἄν-θρω-πος</b>, <b lang="grc">φι-λο-σο-φί-α</b>, <b lang="grc">οὐ-ρα-νός</b>. Read syllable by syllable at first – speed follows accuracy, never the reverse.</p>
<h3>Names you can already read</h3>
<table class="gr"><tr><th>Greek</th><th>Read it</th></tr>
<tr><td lang="grc">Σωκράτης</td><td>Sō-KRA-tēs</td></tr>
<tr><td lang="grc">Πλάτων</td><td>PLA-tōn</td></tr>
<tr><td lang="grc">Ὅμηρος</td><td>HO-mē-ros (rough breathing!)</td></tr>

  grammar: `<p class="lead">Polytonic Greek decorates its vowels with small marks. They look daunting and are not: two breathings, three accents, one subscript – six marks, each with one job. And with them comes the single most useful word in the language: the definite article.</p>
<h3>Breathings</h3>
<p>Every word that begins with a vowel (or with ρ) carries a breathing on its first vowel:</p>
<table class="gr"><tr><th>Mark</th><th>Name</th><th>Effect</th><th>Example</th></tr>
<tr><td lang="grc">ἁ ( ῾ )</td><td>rough</td><td>pronounce <i>h</i> first</td><td lang="grc">ὁδός = hodos, road</td></tr>
<tr><td lang="grc">ἀ ( ᾿ )</td><td>smooth</td><td>no <i>h</i></td><td lang="grc">ἀγορά = agora, marketplace</td></tr></table>
<p>Initial υ and ρ always take the rough breathing (ὕδωρ <i>hydōr</i>, ῥήτωρ <i>rhētōr</i>) – which is why English writes <i>hydro-</i> and <i>rh-</i>.</p>
<h3>Accents</h3>
<p>Ancient accent was musical – a rise of pitch, not a thump of stress. Three signs:</p>
<table class="gr"><tr><th>Sign</th><th>Name</th><th>What it marks</th></tr>
<tr><td lang="grc">ά</td><td>acute</td><td>rising pitch; on any of the last three syllables</td></tr>
<tr><td lang="grc">ᾶ</td><td>circumflex</td><td>rise-and-fall; only on long vowels, only on the last two syllables</td></tr>
<tr><td lang="grc">ὰ</td><td>grave</td><td>an acute "switched off" on a final syllable when another word follows directly</td></tr></table>
<p>For now, do two things only: <b>pronounce</b> the accented syllable with stress, and <b>notice</b> accents when two words differ only by accent (εἰμί <i>I am</i> vs εἶμι <i>I shall go</i>). The full placement rules are in the Reference when you want them.</p>
<h3>Iota subscript</h3>
<p>Under long ᾳ ῃ ῳ hides a tiny iota, once pronounced, later silent – but preserved in writing because it carries grammar: <b lang="grc">τῇ χώρᾳ</b> (dative, "to/for the land") differs from <b lang="grc">ἡ χώρα</b> (nominative) precisely by those subscripts.</p>
<h3>The article: ὁ, ἡ, τό</h3>
<p>Greek has a definite article ("the"), and it is a gift. It is declined fully – by gender, number and case – and it agrees with its noun, so it <i>announces</i> the gender and case of what follows before you reach the noun. Learn its forms early and Greek sentences begin to parse themselves. The nominatives:</p>
<table class="gr"><tr><th></th><th>masculine</th><th>feminine</th><th>neuter</th></tr>
<tr><th scope="row">singular</th><td lang="grc">ὁ</td><td lang="grc">ἡ</td><td lang="grc">τό</td></tr>
<tr><th scope="row">plural</th><td lang="grc">οἱ</td><td lang="grc">αἱ</td><td lang="grc">τά</td></tr></table>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ἡ σοφία ἀρχὴ τῆς ἀρετῆς.</div><p>ἡ announces a feminine nominative: σοφία, "wisdom", is the subject. ἀρχή stands without an article – predicate: "is a beginning". τῆς is the feminine genitive singular article: "of virtue". <i>Wisdom is the beginning of virtue.</i> Notice there is no word for "is": Greek freely omits ἐστί in such sentences.</p></div>
<div class="tip"><b>Question mark.</b> The Greek question mark is the semicolon <b>;</b> – <b lang="grc">τίς εἶ;</b> "who are you?" The raised dot <b>·</b> does the work of our colon or semicolon.</div>`,

{
  id: "g3", title: "First declension & the nominal sentence", subtitle: "Feminine nouns in -η and -α; subjects and predicates",
  grammar: `<p class="lead">Greek, like Latin, stamps a noun's role onto its ending. The first declension – mostly feminine nouns in -η or -α – is where that system is easiest to see, because the article declines in step with the noun and doubles every signal.</p>
<h3>The case idea</h3>
<p>Five cases do the work in Greek (there is no separate locative, and the vocative is marginal in prose):</p>
<table class="gr"><tr><th>Case</th><th>Core job</th><th>Rough English</th></tr>
<tr><td>Nominative</td><td>subject; predicate after "to be"</td><td>the land …</td></tr>
<tr><td>Genitive</td><td>possession; "of"; separation "from"</td><td>of the land</td></tr>
<tr><td>Dative</td><td>indirect object; "to/for"; instrument; place</td><td>to/for/with the land</td></tr>
<tr><td>Accusative</td><td>direct object; motion towards; extent</td><td>the land (object)</td></tr>
<tr><td>Vocative</td><td>address</td><td>O land!</td></tr></table>
<h3>χώρα and τιμή</h3>
<p>Two patterns, differing only in whether the singular keeps α or η. After ε, ι or ρ the α stays (χώρα, οἰκία, ἀγορά); otherwise η rules (τιμή, ἀρχή, ψυχή):</p>
<table class="gr"><tr><th></th><th colspan="2">ἡ χώρα, land</th><th colspan="2">ἡ τιμή, honour</th></tr>
<tr><th></th><th>sing.</th><th>plur.</th><th>sing.</th><th>plur.</th></tr>
<tr><th scope="row">Nom.</th><td lang="grc">χώρα</td><td lang="grc">χῶραι</td><td lang="grc">τιμή</td><td lang="grc">τιμαί</td></tr>
<tr><th scope="row">Gen.</th><td lang="grc">χώρας</td><td lang="grc">χωρῶν</td><td lang="grc">τιμῆς</td><td lang="grc">τιμῶν</td></tr>
<tr><th scope="row">Dat.</th><td lang="grc">χώρᾳ</td><td lang="grc">χώραις</td><td lang="grc">τιμῇ</td><td lang="grc">τιμαῖς</td></tr>
<tr><th scope="row">Acc.</th><td lang="grc">χώραν</td><td lang="grc">χώρας</td><td lang="grc">τιμήν</td><td lang="grc">τιμάς</td></tr></table>
<p>The article walks alongside: ἡ, τῆς, τῇ, τήν; αἱ, τῶν, ταῖς, τάς. Read article + ending together and the case is unmistakable even when (as with χώρας) two forms look alike.</p>
<div class="tip"><b>Attic τα.</b> Where other dialects say θάλασσα and γλῶσσα, Attic says <b lang="grc">θάλαττα</b> and <b lang="grc">γλῶττα</b>. You will see the -σσ- spellings in Koine and in Herodotus; both are correct in their own dialect.</div>
<h3>Word order and the nominal sentence</h3>
<p>Because endings mark the roles, order is free – and Greek uses that freedom for emphasis. The plainest statement pattern is noun-with-article (subject) + bare noun or adjective (predicate), with no verb "to be" expressed:</p>
<p class="ruleline" lang="grc">ἡ ψυχὴ ἀθάνατος. – The soul (is) immortal.</p>
<p>The article marks the subject; the bare predicate needs none. When ἐστί does appear, it usually adds emphasis or begins the sentence: <b lang="grc">ἔστι θεός</b> – "there <i>is</i> a god."</p>
<div class="pitfall"><b>Pitfalls</b><ul><li>χώρας is genitive singular <i>and</i> accusative plural. The article disambiguates: τῆς χώρας vs τὰς χώρας.</li><li>The dative singular hides its iota under the vowel: χώρᾳ, τιμῇ. No subscript, no dative.</li><li>Genitive plural of this declension is always circumflexed -ῶν: χωρῶν, τιμῶν.</li></ul></div>`,

<p>Two facts about neuters that hold for the whole language: nominative and accusative are always identical, and – strangest rule in Greek – <b>a neuter plural subject takes a singular verb</b>: <b lang="grc">τὰ δῶρα καλά ἐστιν</b>, "the gifts are (is) fine."</p>

{
  id: "g5", title: "Cases at work & prepositions", subtitle: "Genitive, dative, accusative – and the little words that steer them",
  grammar: `<p class="lead">You know the forms; now put them to work. Each oblique case has a personality of its own, and the prepositions – tiny, ancient, endlessly reused – select cases according to sense. Master this unit and you can read every spatial and causal phrase in simple Greek.</p>
<h3>The genitive: of, from</h3>
<p>Possession and source: <b lang="grc">ἡ τοῦ ἀνθρώπου οἰκία</b>, "the man's house". Note the elegant Attic habit of tucking the genitive <i>inside</i> the article-noun sandwich: ἡ <b>τοῦ ἀνθρώπου</b> οἰκία. The genitive also expresses separation ("away from"), and after certain verbs, the thing heard or touched: <b lang="grc">ἀκούω τοῦ φίλου</b>, "I listen to my friend".</p>
<h3>The dative: to, for, with, in</h3>
<p>The recipient (τῷ φίλῳ πέμπω), the instrument (<b lang="grc">τῇ γλώττῃ λέγει</b>, "he speaks with his tongue"), the manner, and – with ἐν – the place where.</p>
<h3>The accusative: object, towards, extent</h3>
<p>The direct object; the goal of motion with εἰς or πρός; extent of space and time: <b lang="grc">τρεῖς ἡμέρας μένει</b>, "he stays for three days".</p>
<h3>Prepositions choose cases by meaning</h3>
<table class="gr"><tr><th>Preposition</th><th>+ case</th><th>Meaning</th></tr>
<tr><td lang="grc">ἐν</td><td>dative</td><td>in, within (place where)</td></tr>
<tr><td lang="grc">εἰς</td><td>accusative</td><td>into, to (motion towards)</td></tr>
<tr><td lang="grc">ἐκ / ἐξ</td><td>genitive</td><td>out of (ἐξ before vowels)</td></tr>
<tr><td lang="grc">ἀπό</td><td>genitive</td><td>away from</td></tr>
<tr><td lang="grc">πρός</td><td>accusative</td><td>towards, to (a person)</td></tr>
<tr><td lang="grc">σύν</td><td>dative</td><td>together with</td></tr>
<tr><td lang="grc">μετά</td><td>genitive</td><td>with, among</td></tr>
<tr><td lang="grc">μετά</td><td>accusative</td><td>after</td></tr>
<tr><td lang="grc">διά</td><td>genitive</td><td>through</td></tr>
<tr><td lang="grc">διά</td><td>accusative</td><td>because of</td></tr></table>
<p>μετά and διά are the lesson within the lesson: <b>the same preposition changes meaning with the case it governs</b>. μετὰ τῶν φίλων, "with one's friends"; μετὰ τὴν νίκην, "after the victory". διὰ τῆς χώρας, "through the land"; διὰ τὴν εἰρήνην, "because of the peace". The case is not decoration – it is half the meaning.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ἐκ τῆς οἰκίας εἰς τὴν ἀγορὰν φέρει ὁ δοῦλος τὰ δῶρα.</div><p>Two prepositional phrases frame the sentence: ἐκ τῆς οἰκίας "out of the house" (genitive), εἰς τὴν ἀγοράν "into the marketplace" (accusative). Subject ὁ δοῦλος, object τὰ δῶρα, verb φέρει. <i>The slave carries the gifts from the house into the agora.</i> Greek loves to set the scene first and deliver subject and verb afterwards.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>ἐν + dative is place <i>where</i>; εἰς + accusative is place <i>to which</i>. ἐν τῇ ἀγορᾷ ἐστιν· εἰς τὴν ἀγορὰν ἔρχεται.</li><li>ἐκ becomes ἐξ before a vowel: ἐξ ἀγορᾶς.</li><li>Do not translate a preposition until you have seen its case.</li></ul></div>`,

{
  id: "g6", title: "Adjectives, position & particles", subtitle: "Agreement, the attributive sandwich, and μέν … δέ",
  grammar: `<p class="lead">Two ideas complete your foundation. First: adjectives agree, and <i>where</i> they stand relative to the article changes what they mean. Second: Greek sentences are stitched together by particles – untranslatable little words that tell you the shape of the thought before you have read it.</p>
<h3>Agreement</h3>
<p>An adjective matches its noun in gender, number and case – not necessarily in spelling: <b lang="grc">ἡ ἀγαθὴ ὁδός</b> is correct (feminine noun in -ος, feminine adjective in -η). ἀγαθός declines exactly like λόγος (masc.), τιμή (fem.), δῶρον (neut.), so you already know every form.</p>
<h3>Attributive and predicate position</h3>
<p>This is the heart of the unit. With the article present, position is meaning:</p>
<table class="gr"><tr><th>Pattern</th><th>Name</th><th>Meaning</th></tr>
<tr><td lang="grc">ὁ ἀγαθὸς ἄνθρωπος<br>ὁ ἄνθρωπος ὁ ἀγαθός</td><td>attributive (inside the article group)</td><td>the good man</td></tr>
<tr><td lang="grc">ἀγαθὸς ὁ ἄνθρωπος<br>ὁ ἄνθρωπος ἀγαθός</td><td>predicate (outside it)</td><td>the man is good</td></tr></table>
<p>So a single word's placement turns a phrase into a sentence. <b lang="grc">καλὴ ἡ νῆσος</b> is not "the beautiful island" but a complete statement: "the island is beautiful."</p>
<h3>μέν … δέ</h3>
<p>The most Greek of all habits: laying out a thought in two balanced halves. μέν flags "here is the first half"; δέ answers "and here is the other":</p>
<p class="ruleline" lang="grc">ὁ μὲν βίος βραχύς, ἡ δὲ τέχνη μακρά.</p>
<p>"Life is short, art long" (after Hippocrates). Neither particle translates well – "on the one hand / on the other" is far too heavy. Read them as signposts: μέν says <i>a contrast is coming</i>; δέ delivers it. Both stand second in their phrase (the "postpositive" position), never first.</p>
<h3>Other particles you will meet at once</h3>
<table class="gr"><tr><th>Particle</th><th>Feel</th></tr>
<tr><td lang="grc">δέ</td><td>and, but – the default connector of Greek prose</td></tr>
<tr><td lang="grc">γάρ</td><td>for, because – explains what came before (postpositive)</td></tr>
<tr><td lang="grc">οὖν</td><td>therefore, then (postpositive)</td></tr>
<tr><td lang="grc">ἀλλά</td><td>but (strong); stands first</td></tr>
<tr><td lang="grc">τε … καί</td><td>both … and</td></tr></table>
<div class="tip"><b>Reading rule.</b> Almost every sentence of connected Greek prose after the first is joined to what precedes by a particle – δέ, γάρ, οὖν, ἀλλά. If a sentence seems to begin with no connector, look again: one is probably hiding in second position.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>μέν and δέ never stand first in their clause. ὁ μὲν φίλος…, never μὲν ὁ φίλος.</li><li>Agreement is by form-class, not look-alike endings: ἡ ἀγαθὴ ὁδός, τῇ ἀγαθῇ ὁδῷ.</li><li>Predicate position has no article before the adjective – that absence <i>is</i> the verb "to be".</li></ul></div>`,
  examples: [
    ["ὁ σοφὸς ἄνθρωπος τὴν ἡσυχίαν φιλεῖ.", "The wise man loves quiet – attributive."],
    ["σοφὸς ὁ ἄνθρωπος.", "The man is wise – predicate position, complete sentence."],
    ["ὁ μὲν λέγει, ὁ δὲ γράφει.", "One man speaks, the other writes – bare articles with μέν/δέ as 'the one … the other'."],
    ["ἡ ψυχὴ ἀθάνατος, τὸ δὲ σῶμα θνητόν.", "The soul is immortal, but the body mortal."],
    ["καλὸν ἡ ἀλήθεια· χαλεπὸν γάρ.", "Truth is a fine thing – for it is hard. (γάρ explains, standing second.)"]
  ],
  vocab: [
    ["σοφός, -ή, -όν", "wise, skilled"],
    ["δίκαιος, -α, -ον", "just"],

  grammar: `<p class="lead">A standalone course owes you the everyday layer textbooks postpone: how Greeks counted, dated, greeted, and asked after each other. None of it is hard, all of it appears constantly in real texts – and the numbers hide one delightful grammatical fossil.</p>
<h3>The numbers one to ten</h3>
<table class="gr"><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
<tr><td lang="grc">εἷς, μία, ἕν</td><td lang="grc">δύο</td><td lang="grc">τρεῖς, τρία</td><td lang="grc">τέτταρες</td><td lang="grc">πέντε</td><td lang="grc">ἕξ</td><td lang="grc">ἑπτά</td><td lang="grc">ὀκτώ</td><td lang="grc">ἐννέα</td><td lang="grc">δέκα</td></tr></table>
<p>Only the first four decline. <b lang="grc">εἷς, μία, ἕν</b> ("one") has three genders – the feminine μία is the same root in a different (zero-grade) shape, *sm-ih₂ beside *sem-s – an Indo-European inheritance. From five to ten the numbers are frozen, indeclinable. Larger landmarks: ἑκατόν 100, χίλιοι 1,000, μύριοι 10,000 – and <b lang="grc">μυρίοι</b>, accented differently, means "countless": accent as grammar once again. The Greeks who fought their way to the sea in Xenophon's Anabasis were οἱ Μύριοι, "the Ten Thousand".</p>
<h3>Telling time without a clock</h3>
<p>The cases you know already carry Greek's whole time-system:</p>
<table class="gr"><tr><th>Case</th><th>Meaning</th><th>Example</th></tr>
<tr><td>genitive</td><td>time within which</td><td lang="grc">νυκτός – by night · ἡμέρας – by day</td></tr>
<tr><td>dative</td><td>point in time</td><td lang="grc">τῇ τρίτῃ ἡμέρᾳ – on the third day</td></tr>
<tr><td>accusative</td><td>duration</td><td lang="grc">τρεῖς ἡμέρας – for three days</td></tr></table>
<p>Three cases, three questions: when-ish? at what point? for how long? This little table repays more than many a paradigm – it recurs on nearly every page of narrative prose.</p>
<h3>The everyday phrasebook</h3>
<table class="gr"><tr><th>Greek</th><th>Use</th></tr>
<tr><td lang="grc">χαῖρε / χαίρετε</td><td>hello & farewell (lit. "rejoice!") – to one / to many</td></tr>
<tr><td lang="grc">πῶς ἔχεις;</td><td>how are you? (lit. "how do you hold?")</td></tr>
<tr><td lang="grc">καλῶς ἔχω</td><td>I'm well – ἔχω + adverb = to be in a state</td></tr>
<tr><td lang="grc">τί ἐστι τοῦτο;</td><td>what is this?</td></tr>
<tr><td lang="grc">οὐδὲν διαφέρει</td><td>it makes no difference</td></tr>
<tr><td lang="grc">ὦ φίλε</td><td>my friend! (the vocative, usually with ὦ)</td></tr></table>
<p>The vocative – the case of address – is mostly identical to the nominative; the second declension is the exception you will actually meet: <b lang="grc">ὦ φίλε</b> – and a few third-declension nouns have their own, such as <b lang="grc">ὦ Σώκρατες</b> (from Σωκράτης). When Greeks called to each other, the -ε did the calling.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">πέντε ἡμέρας ἐν τῇ νήσῳ μένομεν, τῇ δὲ ἕκτῃ πρὸς τὰς Ἀθήνας πλέομεν.</div><p>πέντε ἡμέρας – accusative of duration: "for five days". τῇ ἕκτῃ (sc. ἡμέρᾳ) – dative of the point: "on the sixth". <i>For five days we stay on the island, and on the sixth we sail for Athens.</i> Note how the article alone (τῇ ἕκτῃ) lets "day" go unsaid.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>μία (one, fem.) is not from the εἷς-stem; μίαν ἡμέραν = "for one day".</li><li>δύο is happy with plural nouns and barely declines; leave it alone.</li><li>Accusative for duration even where English says "in": τρεῖς ἡμέρας ἐποίησεν – "he did it in/over three days" (of extent).</li></ul></div>`,

{
  id: "m1", title: "Third declension I – consonant stems", subtitle: "φύλαξ, σῶμα, γέρων: find the stem, know the noun",
  grammar: `<p class="lead">The third declension frightens beginners because its nominatives look chaotic: φύλαξ, σῶμα, γέρων, νύξ. The chaos is superficial. One set of endings serves them all; what varies is the <b>stem</b>, and the genitive singular always reveals it. Learn nouns as a pair – nominative + genitive – and the declension becomes routine.</p>
<h3>One set of endings</h3>
<table class="gr"><tr><th></th><th>masc./fem. sing.</th><th>plur.</th><th>neuter sing.</th><th>plur.</th></tr>
<tr><th scope="row">Nom.</th><td>varies</td><td lang="grc">-ες</td><td>bare stem</td><td lang="grc">-α</td></tr>
<tr><th scope="row">Gen.</th><td lang="grc">-ος</td><td lang="grc">-ων</td><td lang="grc">-ος</td><td lang="grc">-ων</td></tr>
<tr><th scope="row">Dat.</th><td lang="grc">-ι</td><td lang="grc">-σι(ν)</td><td lang="grc">-ι</td><td lang="grc">-σι(ν)</td></tr>
<tr><th scope="row">Acc.</th><td lang="grc">-α / -ν</td><td lang="grc">-ας</td><td>= nom.</td><td lang="grc">-α</td></tr></table>
<h3>Three model nouns</h3>
<table class="gr"><tr><th></th><th lang="grc">ὁ φύλαξ, φύλακος<br><small>guard (stem φυλακ-)</small></th><th lang="grc">τὸ σῶμα, σώματος<br><small>body (stem σωματ-)</small></th><th lang="grc">ὁ γέρων, γέροντος<br><small>old man (stem γεροντ-)</small></th></tr>
<tr><th scope="row">Nom. sg.</th><td lang="grc">φύλαξ</td><td lang="grc">σῶμα</td><td lang="grc">γέρων</td></tr>
<tr><th scope="row">Gen. sg.</th><td lang="grc">φύλακος</td><td lang="grc">σώματος</td><td lang="grc">γέροντος</td></tr>
<tr><th scope="row">Dat. sg.</th><td lang="grc">φύλακι</td><td lang="grc">σώματι</td><td lang="grc">γέροντι</td></tr>
<tr><th scope="row">Acc. sg.</th><td lang="grc">φύλακα</td><td lang="grc">σῶμα</td><td lang="grc">γέροντα</td></tr>
<tr><th scope="row">Nom. pl.</th><td lang="grc">φύλακες</td><td lang="grc">σώματα</td><td lang="grc">γέροντες</td></tr>
<tr><th scope="row">Dat. pl.</th><td lang="grc">φύλαξι(ν)</td><td lang="grc">σώμασι(ν)</td><td lang="grc">γέρουσι(ν)</td></tr>
<tr><th scope="row">Acc. pl.</th><td lang="grc">φύλακας</td><td lang="grc">σώματα</td><td lang="grc">γέροντας</td></tr></table>
<p>Where did the nominatives come from? φυλακ + ς → φύλαξ (κ+σ = ξ). σωματ- drops its τ word-finally (Greek allows no final τ): σῶμα. γεροντ + ς would give -ντς, which Greek refuses; instead the ς is dropped and the vowel lengthened: γέρων. The dative plural repeats the same phonetics: φύλαξι, σώμασι (τ falls before σ), γέρουσι (ντ falls, ο lengthens to ου).</p>
<div class="tip"><b>The golden habit.</b> From now on, learn every third-declension noun with its genitive: ἡ νύξ, νυκτός (night); ὁ παῖς, παιδός (child); τὸ ὄνομα, ὀνόματος (name). The genitive gives the stem; the stem gives everything.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>-ος here is genitive <b>singular</b>, not a second-declension nominative: φύλακος = "of a guard". The article prevents all confusion: τοῦ φύλακος.</li><li>Neuters keep the rules you know: nom. = acc., and neuter plural subject → singular verb: τὰ σώματα θνητά ἐστιν.</li><li>All -μα nouns (σῶμα, ὄνομα, πρᾶγμα) are neuter with stems in -ματ-. No exceptions.</li></ul></div>`,

{
  id: "m2", title: "Third declension II – πόλις, βασιλεύς, γένος", subtitle: "The vowel stems: city, king, and the sigma that vanishes",
  grammar: `<p class="lead">Three families of third-declension nouns dominate Greek civilisation itself: πόλις (city), βασιλεύς (king), γένος (race, kind). Their stems end in vowels or a disappearing sigma, which makes their forms contract – and makes them, once seen clearly, unmistakable on the page.</p>
<h3>πόλις, πόλεως – the city</h3>
<table class="gr"><tr><th></th><th>sing.</th><th>plur.</th></tr>
<tr><th scope="row">Nom.</th><td lang="grc">πόλις</td><td lang="grc">πόλεις</td></tr>
<tr><th scope="row">Gen.</th><td lang="grc">πόλεως</td><td lang="grc">πόλεων</td></tr>
<tr><th scope="row">Dat.</th><td lang="grc">πόλει</td><td lang="grc">πόλεσι(ν)</td></tr>
<tr><th scope="row">Acc.</th><td lang="grc">πόλιν</td><td lang="grc">πόλεις</td></tr></table>
<p>The genitive πόλεως keeps an accent that seems to break the rules – a fossil of an older long vowel (πόληος). Like it decline δύναμις (power), φύσις (nature), ὕβρις (insolence), and dozens of abstracts in -σις: γένεσις, κρίσις, ποίησις – words that became <i>genesis</i>, <i>crisis</i>, <i>poetry</i>.</p>
<h3>βασιλεύς, βασιλέως – the king</h3>
<table class="gr"><tr><th></th><th>sing.</th><th>plur.</th></tr>
<tr><th scope="row">Nom.</th><td lang="grc">βασιλεύς</td><td lang="grc">βασιλῆς / βασιλεῖς</td></tr>
<tr><th scope="row">Gen.</th><td lang="grc">βασιλέως</td><td lang="grc">βασιλέων</td></tr>
<tr><th scope="row">Dat.</th><td lang="grc">βασιλεῖ</td><td lang="grc">βασιλεῦσι(ν)</td></tr>
<tr><th scope="row">Acc.</th><td lang="grc">βασιλέα</td><td lang="grc">βασιλέας</td></tr></table>
<p>So too ἱππεύς (horseman), ἱερεύς (priest), and the great -εύς names: Ὀδυσσεύς, Ἀχιλλεύς, Ζεύς (gen. Διός – suppletive and worth memorising outright).</p>
<h3>γένος, γένους – the σ-stem neuters</h3>
<p>Stem γενεσ-: the σ drops between vowels and the vowels contract:</p>
<table class="gr"><tr><th></th><th>sing.</th><th>plur.</th></tr>
<tr><th scope="row">Nom./Acc.</th><td lang="grc">γένος</td><td lang="grc">γένη</td></tr>
<tr><th scope="row">Gen.</th><td lang="grc">γένους</td><td lang="grc">γενῶν</td></tr>
<tr><th scope="row">Dat.</th><td lang="grc">γένει</td><td lang="grc">γένεσι(ν)</td></tr></table>
<p>Like it: ἔθνος (nation), τεῖχος (wall), ὄρος (mountain), ἔτος (year), and – a word you will read in Thucydides and John alike – τέλος (end).</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ὁ βασιλεὺς τὰ τῆς πόλεως τείχη λύει.</div><p>ὁ βασιλεύς – subject. τὰ … τείχη – neuter plural of τεῖχος, object; sandwiched inside is τῆς πόλεως, genitive of πόλις. λύει – 3rd singular. <i>The king destroys the city's walls.</i> Three declension-families in seven words – and the article guided you through all of them.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>πόλεις is both nominative and accusative plural. Article or context decides: αἱ πόλεις vs τὰς πόλεις.</li><li>γένους is genitive singular (γενεσ-ος contracted), not a plural of any kind.</li><li>Do not confuse ὄρος (mountain, neuter) with ὅρος (boundary, masculine) – the breathing is the only visible difference.</li></ul></div>`,
  examples: [
    ["ἡ πόλις τοὺς νόμους φυλάττει.", "The city guards its laws."],
    ["ὁ τῶν Περσῶν βασιλεὺς μεγάλην δύναμιν ἔχει.", "The king of the Persians has great power."],
    ["τὰ τείχη τῆς πόλεως μακρά ἐστιν.", "The walls of the city are long – the Long Walls of Athens were exactly that."],
    ["τὸ γένος τῶν ἀνθρώπων θνητόν.", "The race of men is mortal."],
    ["οἱ ἱππῆς πρὸς τὸ ὄρος βαίνουσιν.", "The horsemen ride towards the mountain."]
  ],
  vocab: [

  exercises: [
    { t: "parse", form: "τῆς πόλεως", q: "Parse:", opts: ["genitive singular", "accusative plural", "nominative plural", "dative singular"], a: 0, ex: "πόλεως is the famous genitive of the -ις class – 'of the city'. Its odd accent (acute on the antepenult despite the long ending) is an inherited fossil, not an error." },
    { t: "parse", form: "τὰς πόλεις", q: "Parse:", opts: ["accusative plural", "nominative singular", "genitive singular", "dative plural"], a: 0, ex: "πόλεις serves as both nominative and accusative plural; the article τάς marks this one accusative: 'the cities' as object." },
    { t: "fill", q: "Give the accusative singular: τὴν ___ (the city).", a: ["πόλιν", "πολιν"], ex: "πόλιν – the ι-stem keeps its iota in the accusative: τὴν πόλιν. Compare δύναμιν, φύσιν, ὕβριν." },
    { t: "fill", q: "Give the genitive singular: τοῦ ___ (of the king – βασιλεύς).", a: ["βασιλέως", "βασιλεως"], ex: "βασιλέως, like πόλεως: the -εύς class and the -ις class share this genitive shape. τοῦ βασιλέως = 'of the king' – in classical Athens, 'the King' unqualified usually meant the king of Persia." },
    { t: "fill", q: "τὰ ___ τῆς πόλεως (the walls – nominative/accusative plural of τεῖχος).", a: ["τείχη", "τειχη"], ex: "σ-stem neuter plural: τείχεσ-α → τείχη. Genitive τειχῶν, dative τείχεσι. The Long Walls – τὰ μακρὰ τείχη – joined Athens to its harbour." },
    { t: "trans", form: "τὸ γένος", q: "Put it into the genitive singular (article + noun).", a: ["τοῦ γένους", "του γενους"], ex: "γένεσ-ος → γένους by loss of σ and contraction. Not a plural, despite appearances – the article τοῦ says singular." },
    { t: "mcq", q: "Which set belongs to the same family as πόλις?", opts: ["γένεσις, κρίσις, ποίησις", "βασιλεύς, ἱερεύς", "γένος, τεῖχος", "λόγος, νόμος"], a: 0, ex: "The -σις abstracts decline like πόλις and name processes: γένεσις 'becoming', κρίσις 'judgement', ποίησις 'making'. English took all three." },
    { t: "mcq", q: "The genitive of Ζεύς is:", opts: ["Διός", "Ζέως", "Ζηνός only", "Ζεῦ"], a: 0, ex: "Ζεύς, Διός, Διί, Δία – an ancient suppletive paradigm (poetry also uses Ζηνός). Hence Διόσκουροι, 'sons of Zeus'." },
    { t: "pick", q: "Click the direct object.", s: "ὁ βασιλεὺς τὰ τείχη λύει", a: "τείχη", ex: "τὰ τείχη, neuter plural accusative. After the Peloponnesian War the Spartans made Athens do exactly this to its own walls, to the sound of flutes – Xenophon reports it." },
    { t: "pick", q: "Click the word meaning 'nature'.", s: "ἡ φύσις κρύπτεσθαι φιλεῖ", a: "φύσις", ex: "Heraclitus' saying: 'nature loves to hide'. You can already parse ἡ φύσις and φιλεῖ; the middle infinitive κρύπτεσθαι ('to hide itself') arrives next unit." },
    { t: "mcq", q: "ὄρος and ὅρος differ:", opts: ["by breathing: mountain vs boundary", "by accent only: both mean mountain", "not at all", "by gender only"], a: 0, ex: "τὸ ὄρος (smooth) = mountain; ὁ ὅρος (rough) = boundary, definition – whence 'horizon' (ὁρίζων, the bounding circle). Breathings carry meaning; read them." },
    { t: "trans", form: "ἡ δύναμις", q: "Put it into the dative singular (article + noun).", a: ["τῇ δυνάμει", "τη δυναμει"], ex: "τῇ δυνάμει – dative in -ει like πόλει. 'By power / with force': a phrase you will meet in Thucydides on nearly every page." }
  ]
},
{
  id: "m3", title: "The middle & passive voices", subtitle: "λύομαι: doing for oneself, and being done to",
  grammar: `<p class="lead">Greek has a voice English lacks: the <b>middle</b>, in which the subject acts with reference to itself – for its own benefit, on its own body, within its own sphere. In the present tense the middle and the passive share one set of forms; context and verb-sense tell them apart, and a family of common verbs uses these forms with no active at all.</p>
<h3>The forms</h3>
<table class="gr"><tr><th></th><th>sing.</th><th>plur.</th></tr>
<tr><th scope="row">1st</th><td lang="grc">λύομαι</td><td lang="grc">λυόμεθα</td></tr>
<tr><th scope="row">2nd</th><td lang="grc">λύῃ / λύει</td><td lang="grc">λύεσθε</td></tr>
<tr><th scope="row">3rd</th><td lang="grc">λύεται</td><td lang="grc">λύονται</td></tr></table>
<p>Infinitive λύεσθαι. The 2nd singular λύῃ is a contraction of λύεσαι – the σ that vanishes between vowels again.</p>
<h3>What the middle means</h3>
<table class="gr"><tr><th>Active</th><th>Middle</th></tr>
<tr><td lang="grc">λούω <small>I wash (someone)</small></td><td lang="grc">λούομαι <small>I wash myself, bathe</small></td></tr>
<tr><td lang="grc">παύω <small>I stop (someone)</small></td><td lang="grc">παύομαι <small>I cease</small></td></tr>
<tr><td lang="grc">πείθω <small>I persuade</small></td><td lang="grc">πείθομαι <small>I obey (+ dat.) – let myself be persuaded</small></td></tr>
<tr><td lang="grc">ἄρχω <small>I rule (+ gen.)</small></td><td lang="grc">ἄρχομαι <small>I begin</small></td></tr>
<tr><td lang="grc">φέρω <small>I carry</small></td><td lang="grc">φέρομαι <small>I carry off for myself, win</small></td></tr></table>
<p>The middle is not reflexive decoration; it often creates what is effectively a new verb. Treat each middle as a vocabulary item with its own sense.</p>
<h3>Deponents</h3>
<p>Many indispensable verbs are middle-only – "deponent". Their form is middle, their meaning plain:</p>
<p class="ruleline" lang="grc">γίγνομαι <small>become, happen</small> · ἔρχομαι <small>come, go</small> · βούλομαι <small>wish</small> · δύναμαι <small>be able</small> · οἴομαι <small>think</small> · μάχομαι <small>fight (+ dat.)</small> · αἰσθάνομαι <small>perceive</small></p>
<h3>The passive and its agent</h3>
<p>The same forms serve as a true passive. The doer is expressed by <b lang="grc">ὑπό</b> + genitive:</p>
<p class="ruleline" lang="grc">οἱ νόμοι ὑπὸ τῆς πόλεως φυλάττονται. – The laws are guarded by the city.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οἱ παῖδες τῷ διδασκάλῳ πείθονται.</div><p>πείθονται is middle: not "are persuaded" here but "obey" – and its object stands in the dative. <i>The children obey their teacher.</i> When a middle has an idiomatic sense, the case it governs usually shifts too; learn verb + case as one package.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Do not translate every -εται as passive. παύεται is "he ceases", not "he is stopped" – unless an agent phrase or context forces the passive.</li><li>ἔρχομαι looks passive, means "I come". Deponents never translate as passives.</li><li>ὑπό + genitive = agent ("by someone"); dative alone = instrument ("by/with something"): λίθῳ, "with a stone".</li></ul></div>`,
  examples: [
    ["ὁ ἥλιος παύεται τῆς ἡμέρας.", "The sun ceases from day – i.e. sets; middle παύομαι + genitive of separation."],
    ["οἱ στρατιῶται τῷ στρατηγῷ πείθονται.", "The soldiers obey the general – middle + dative."],
    ["ἡ πόλις ὑπὸ τῶν νόμων ἄρχεται.", "The city is ruled by its laws – true passive with ὑπό + gen."],
    ["γίγνεται ὁ παῖς ἀνήρ.", "The boy becomes a man – deponent γίγνομαι with predicate nominative."],
    ["βουλόμεθα τὴν εἰρήνην.", "We want peace."]
  ],
  vocab: [
    ["γίγνομαι", "I become, am born; happen"],
    ["ἔρχομαι", "I come, go"],
    ["βούλομαι", "I wish, want"],

    ["οἴομαι", "I think, suppose"],
    ["μάχομαι", "I fight (+ dat.)"],
    ["αἰσθάνομαι", "I perceive, notice"],
    ["πείθω / πείθομαι", "persuade / obey (+ dat.)"],
    ["παύω / παύομαι", "stop (someone) / cease"],
    ["ἄρχω / ἄρχομαι", "rule (+ gen.) / begin"],

  exercises: [
    { t: "parse", form: "λύονται", q: "Parse:", opts: ["3rd plural middle/passive", "3rd singular active", "1st plural middle", "2nd plural active"], a: 0, ex: "-ονται is the 3rd plural middle/passive ending: 'they release for themselves' or 'they are released' – sense and context decide which." },
    { t: "mcq", q: "παύεται, with no agent expressed, most naturally means:", opts: ["he ceases", "he is being stopped", "he stops someone", "stop!"], a: 0, ex: "The middle of παύω is intransitive: 'cease'. παύεται λέγων – 'he stops speaking'. The passive reading needs support from context or a ὑπό-phrase." },
    { t: "mcq", q: "A deponent verb is one that:", opts: ["has middle form but plain active meaning", "cannot be conjugated", "is always passive in sense", "lacks a present tense"], a: 0, ex: "γίγνομαι, ἔρχομαι, βούλομαι and their kin simply have no active forms. Their -ομαι is a fact of morphology, not of meaning: ἔρχομαι = 'I come'." },
    { t: "fill", q: "οἱ παῖδες τῷ γέροντι ___ (obey – from πείθω, middle, 3rd plural).", a: ["πείθονται", "πειθονται"], ex: "πείθονται + dative = obey: 'the children obey the old man'. Active πείθουσι would mean 'they persuade (someone)'." },
    { t: "fill", q: "ἡ ἀρχὴ τοῦ ἔργου ___ (begins/happens – γίγνομαι, 3rd singular).", a: ["γίγνεται", "γιγνεται"], ex: "γίγνεται – 'comes to be'. This verb will follow you through all of Greek literature: πάντα γίγνεται, 'everything is in becoming'." },
    { t: "fill", q: "Express the agent: οἱ νόμοι ___ τῶν ἀγαθῶν φυλάττονται (the laws are guarded BY the good).", a: ["ὑπὸ", "ὑπό", "υπο"], ex: "ὑπό + genitive marks the personal agent of a passive verb: ὑπὸ τῶν ἀγαθῶν. A bare dative would suggest the instrument instead." },
    { t: "trans", form: "λύει", q: "Turn this 3rd singular active into the corresponding middle/passive form.", a: ["λύεται", "λυεται"], ex: "λύει → λύεται. Active -ει pairs with middle -εται through the whole ω-conjugation." },
    { t: "trans", form: "βούλομαι", q: "Make it 1st person plural (we wish).", a: ["βουλόμεθα", "βουλομεθα"], ex: "-όμεθα is the 1st plural middle ending: βουλόμεθα. Note the accent gliding to the new syllable." },
    { t: "pick", q: "Click the deponent verb.", s: "οἱ ἱππῆς πρὸς τὸ ὄρος ἔρχονται", a: "ἔρχονται", ex: "ἔρχονται – middle in form, 'they go' in plain meaning. The horsemen go towards the mountain." },
    { t: "parse", form: "μάχεσθαι", q: "Parse:", opts: ["present middle infinitive", "3rd singular middle", "imperative", "future active"], a: 0, ex: "-εσθαι is the middle/passive infinitive: 'to fight'. δύναμαι μάχεσθαι, 'I am able to fight' – deponent chained to deponent, perfectly ordinary Greek." },
    { t: "mcq", q: "ἄρχομαι differs from ἄρχω how?", opts: ["middle 'begin' vs active 'rule'", "they are identical", "passive only", "the middle is poetic"], a: 0, ex: "ἄρχω + gen. = rule over; ἄρχομαι = begin (ἄρχομαι τοῦ λόγου, 'I begin my speech'). One root, two verbs – the middle voice at its most creative." },
    { t: "mcq", q: "In <b lang='grc'>λίθῳ τὸ τεῖχος λύεται</b>, λίθῳ expresses:", opts: ["the instrument – 'by means of a stone'", "the agent – 'by Mr. Stone'", "place where", "possession"], a: 0, ex: "Things that do the deed stand in the bare dative (instrument); persons take ὑπό + genitive (agent). 'The wall is being broken with a stone.'" }
  ]
},
{
  id: "m4", title: "The imperfect & the augment", subtitle: "ἔλυον: past time as a running film",
  grammar: `<p class="lead">Greek has two everyday past tenses, and the difference between them is the difference between film and photograph. The imperfect is the film: action ongoing, repeated, attempted, unfolding. Its badge is the <b>augment</b> – a syllable ἐ- prefixed to the verb – plus the "secondary" endings.</p>
<h3>Forms of ἔλυον</h3>
<table class="gr"><tr><th></th><th>active sing.</th><th>active plur.</th><th>middle sing.</th><th>middle plur.</th></tr>
<tr><th scope="row">1st</th><td lang="grc">ἔλυον</td><td lang="grc">ἐλύομεν</td><td lang="grc">ἐλυόμην</td><td lang="grc">ἐλυόμεθα</td></tr>
<tr><th scope="row">2nd</th><td lang="grc">ἔλυες</td><td lang="grc">ἐλύετε</td><td lang="grc">ἐλύου</td><td lang="grc">ἐλύεσθε</td></tr>
<tr><th scope="row">3rd</th><td lang="grc">ἔλυε(ν)</td><td lang="grc">ἔλυον</td><td lang="grc">ἐλύετο</td><td lang="grc">ἐλύοντο</td></tr></table>
<p>Note the ambush: <b>ἔλυον is both 1st singular and 3rd plural</b>. Context or an expressed subject decides.</p>
<h3>The augment</h3>
<ul><li>Consonant-initial verbs prefix ἐ-: λύω → ἔλυον, γράφω → ἔγραφον.</li>
<li>Vowel-initial verbs lengthen instead: ἄγω → ἦγον, ἐθέλω → ἤθελον, ὁράω → ἑώρων (irregular). α and ε lengthen to η; ο to ω.</li>
<li>Compound verbs augment <i>after</i> the prefix, whose final vowel drops: ἀποπέμπω → ἀπέπεμπον, ἐκβαίνω → ἐξέβαινον.</li></ul>
<h3>What the imperfect says</h3>
<table class="gr"><tr><th>Shade</th><th>Example</th></tr>
<tr><td>ongoing ("was …ing")</td><td lang="grc">ἔγραφον – I was writing</td></tr>
<tr><td>habitual ("used to")</td><td lang="grc">οἱ παῖδες ἐμάνθανον – the children used to learn</td></tr>
<tr><td>attempted ("tried to")</td><td lang="grc">ἔπειθον αὐτόν – I tried to persuade him</td></tr>
<tr><td>beginning ("began to")</td><td lang="grc">ἐμάχοντο – they began fighting</td></tr></table>
<p>The imperfect of εἰμί: ἦ/ἦν, ἦσθα, ἦν, ἦμεν, ἦτε, ἦσαν – supplied by memory, used on every page: <b lang="grc">ἐν ἀρχῇ ἦν ὁ λόγος</b>.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οἱ φύλακες νυκτὸς τὰ τείχη ἐφύλαττον.</div><p>ἐφύλαττον – augment ἐ- + φυλαττ- + secondary ending -ον, here 3rd plural (subject expressed). Imperfect because guarding is a continuing duty, not a single event: <i>By night the guards kept watch over the walls.</i></p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>The augment exists only in the indicative. (Infinitives and participles of past tenses have none – remember this when the aorist arrives.)</li><li>ἦν can be "he was" or "I was". ἦ is unambiguous 1st singular but rarer.</li><li>Compounds: the augment goes inside – ἀπ-έ-πεμπον, not ἐ-αποπεμπον.</li></ul></div>`,
  examples: [
    ["ἐν ἀρχῇ ἦν ὁ λόγος.", "In the beginning was the Word – the imperfect of εἰμί (John 1:1)."],
    ["οἱ παῖδες ἐμάνθανον τὰ γράμματα.", "The children were learning their letters."],
    ["ἔπειθον τὸν βασιλέα, ἀλλ᾽ οὐκ ἤθελεν ἀκούειν.", "I tried to persuade the king, but he refused to listen – conative imperfect."],
    ["ὁ στρατηγὸς τοὺς στρατιώτας ἀπέπεμπεν.", "The general was sending the soldiers away – compound augmented inside."],
    ["ἡμεῖς μὲν ἐγράφομεν, ὑμεῖς δὲ ἐλέγετε.", "We were writing while you were talking."]
  ],

  id: "m5", title: "The aorist", subtitle: "ἔλυσα, ἔλαβον: the snapshot past – and aspect, Greek's deepest idea",
  grammar: `<p class="lead">The aorist is the photograph: an action grasped whole, as one event. Beside the imperfect's running film, it is the tense of "and then – and then – and then". Greek forms it two ways, and the distinction it draws – <b>aspect</b>, the shape of an action rather than its time – is the single deepest idea in the Greek verb.</p>
<h3>First (sigmatic) aorist: ἔλυσα</h3>
<p>Most verbs: augment + stem + σα:</p>
<table class="gr"><tr><th></th><th>sing.</th><th>plur.</th></tr>
<tr><th scope="row">1st</th><td lang="grc">ἔλυσα</td><td lang="grc">ἐλύσαμεν</td></tr>
<tr><th scope="row">2nd</th><td lang="grc">ἔλυσας</td><td lang="grc">ἐλύσατε</td></tr>
<tr><th scope="row">3rd</th><td lang="grc">ἔλυσε(ν)</td><td lang="grc">ἔλυσαν</td></tr></table>
<p>Infinitive λῦσαι (no augment!). The σ collides with stem-final consonants exactly as in the noun system: πέμπω → ἔπεμψα, γράφω → ἔγραψα, διώκω → ἐδίωξα, πείθω → ἔπεισα.</p>
<h3>Second aorist: ἔλαβον</h3>
<p>A large class of common verbs instead uses a <b>different stem</b> with the imperfect's endings:</p>
<table class="gr"><tr><th>Present</th><th>Aorist</th><th></th></tr>
<tr><td lang="grc">λαμβάνω</td><td lang="grc">ἔλαβον</td><td>took</td></tr>
<tr><td lang="grc">λείπω</td><td lang="grc">ἔλιπον</td><td>left</td></tr>
<tr><td lang="grc">φεύγω</td><td lang="grc">ἔφυγον</td><td>fled</td></tr>
<tr><td lang="grc">εὑρίσκω</td><td lang="grc">ηὗρον / εὗρον</td><td>found</td></tr>
<tr><td lang="grc">ἄγω</td><td lang="grc">ἤγαγον</td><td>led</td></tr>
<tr><td lang="grc">λέγω</td><td lang="grc">εἶπον</td><td>said</td></tr>
<tr><td lang="grc">ὁράω</td><td lang="grc">εἶδον</td><td>saw</td></tr>
<tr><td lang="grc">ἔρχομαι</td><td lang="grc">ἦλθον</td><td>came, went</td></tr>
<tr><td lang="grc">γίγνομαι</td><td lang="grc">ἐγενόμην</td><td>became</td></tr></table>
<p>εἶπον, εἶδον, ἦλθον are suppletive – different roots entirely, like English go/went. They are also among the commonest words in the language: there is no reading Greek without them.</p>
<h3>Aspect, not time</h3>
<p>Imperfect vs aorist is not "distant past vs recent past". It is <i>how you view the act</i>:</p>
<p class="ruleline" lang="grc">οἱ στρατιῶται ἐμάχοντο· τέλος δὲ ἔφυγον.<br><small>The soldiers were fighting (film) – and finally they fled (snapshot).</small></p>
<p>Outside the indicative – in infinitives, and later in subjunctives, optatives and imperatives – the aorist loses past time altogether and keeps <i>only</i> aspect: λύειν "to be releasing", λῦσαι "to release (once)". That is why the aorist infinitive has no augment: the augment is the mark of past <i>time</i>, and only the indicative has time.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ἦλθον, εἶδον, ἐνίκησα.</div><p>Three aorists – came, saw, conquered. Plutarch reports Caesar's dispatch in exactly this Greek. Three snapshots, no film: the aorist is the tense of pure event, and no other tense could carry this sentence's speed.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Do not build second aorists with σ: ἔλαβον, never ἐλάβσα.</li><li>ἤγαγον (led) is aorist; ἦγον (was leading) is imperfect. Both augmented, different stems.</li><li>Aorist infinitive: λῦσαι, λαβεῖν, ἰδεῖν, ἐλθεῖν – augmentless, and (for 2nd aorists) accented on the ending.</li></ul></div>`,

  id: "m6", title: "The future & the contract verbs", subtitle: "λύσω and the melted vowels of ποιέω, τιμάω, δηλόω",
  grammar: `<p class="lead">Two final pieces complete the everyday verb. The future is the σ-system without an augment – easy. The contract verbs – stems in ε, α, ο that melt into their endings – are less a new conjugation than a set of three small arithmetic tables that Attic applies with perfect consistency.</p>
<h3>The future: λύσω</h3>
<p>Present endings on stem + σ: λύσω, λύσεις, λύσει, λύσομεν, λύσετε, λύσουσι(ν). The familiar consonant arithmetic applies: πέμψω, γράψω, διώξω, πείσω. No augment – the augment belongs to past time only.</p>
<p>Two wrinkles worth knowing now: several common verbs have a <b>middle future</b> with active meaning – ἀκούσομαι (I shall hear), ὄψομαι (I shall see), ἔσομαι (I shall be), λήψομαι (I shall take); and stems in λ, μ, ν, ρ form a "contracted future" without σ: μενῶ (I shall remain), βαλῶ (I shall throw).</p>
<h3>The contract verbs</h3>
<p>Verbs whose stem ends in a vowel contract it with the ending's vowel. Attic never leaves them uncontracted; the rules are few:</p>
<table class="gr"><tr><th>ε-stems (ποιέω)</th><th>α-stems (τιμάω)</th><th>ο-stems (δηλόω)</th></tr>
<tr><td>ε + ε → ει<br>ε + ο → ου<br>ε + long vowel: ε drops</td><td>α + ε/η → α<br>α + ο/ου/ω → ω<br>ι goes subscript</td><td>ο + ε/ο/ου → ου<br>ο + η/ω → ω<br>ο + ει/ῃ → οι</td></tr></table>
<table class="gr"><tr><th></th><th lang="grc">ποιέω → ποιῶ<br><small>make, do</small></th><th lang="grc">τιμάω → τιμῶ<br><small>honour</small></th><th lang="grc">δηλόω → δηλῶ<br><small>show</small></th></tr>
<tr><th scope="row">1 sg.</th><td lang="grc">ποιῶ</td><td lang="grc">τιμῶ</td><td lang="grc">δηλῶ</td></tr>
<tr><th scope="row">2 sg.</th><td lang="grc">ποιεῖς</td><td lang="grc">τιμᾷς</td><td lang="grc">δηλοῖς</td></tr>
<tr><th scope="row">3 sg.</th><td lang="grc">ποιεῖ</td><td lang="grc">τιμᾷ</td><td lang="grc">δηλοῖ</td></tr>
<tr><th scope="row">1 pl.</th><td lang="grc">ποιοῦμεν</td><td lang="grc">τιμῶμεν</td><td lang="grc">δηλοῦμεν</td></tr>
<tr><th scope="row">2 pl.</th><td lang="grc">ποιεῖτε</td><td lang="grc">τιμᾶτε</td><td lang="grc">δηλοῦτε</td></tr>
<tr><th scope="row">3 pl.</th><td lang="grc">ποιοῦσι(ν)</td><td lang="grc">τιμῶσι(ν)</td><td lang="grc">δηλοῦσι(ν)</td></tr></table>
<p>In the future, contract verbs simply lengthen the stem vowel before σ: ποιήσω, τιμήσω, δηλώσω. (α after ε, ι, ρ stays: ἐάσω from ἐάω.)</p>
<p>You have been reading contract verbs since Stage Α΄ without knowing it: φιλεῖ (loves), οἰκοῦμεν (we dwell), ὁρᾷ (sees), νικῶσι (they conquer) are all contractions. Now the machinery behind them is yours.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οἱ Ἕλληνες τοὺς θεοὺς τιμῶσι καὶ ἀεὶ τιμήσουσιν.</div><p>τιμῶσι – present, α + ου → ω: "honour". τιμήσουσιν – future, stem lengthened to τιμη- + σ: "will honour". <i>The Greeks honour the gods and always will.</i></p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>τιμᾷ (3rd singular) hides its iota subscript. τιμα + ει → τιμᾷ; without the subscript you have written a different (nonexistent) form.</li><li>λύσω is future; ἔλυσα is aorist. Same σ, different function – the augment is the tell.</li><li>μενῶ (future of μένω) differs from μένω only by accent. Accents are grammar here, not garnish.</li></ul></div>`,

    { t: "fill", q: "ὁ χρόνος ___ τὴν ἀλήθειαν (WILL show – δηλόω).", a: ["δηλώσει", "δηλωσει"], ex: "Stem lengthens (ο → ω) + σ: δηλώσει. Present δηλοῖ, future δηλώσει, aorist ἐδήλωσα – one pattern for all ο-contracts." },

{
  id: "m7", title: "The passive system", subtitle: "ἐλύθην, λυθήσομαι: the -θη- forms that unlock narrative prose",
  grammar: `<p class="lead">In the present and imperfect, middle and passive share their forms. In the aorist and future, the passive strikes out on its own with the unmistakable marker <b>-θη-</b>. These forms saturate real narrative – "the city <i>was taken</i>", "he <i>was persuaded</i>" – and once the -θη- flag is in your eye, they read themselves.</p>
<h3>The aorist passive: ἐλύθην</h3>

<p>Augment + stem + θη + the <i>active-looking</i> secondary endings – a historical oddity you can simply enjoy: the aorist passive dresses as an active. Infinitive <b lang="grc">λυθῆναι</b>, participle <b lang="grc">λυθείς, λυθεῖσα, λυθέν</b> (you met λυθείς-type forms in the Aesop fables: ἐλήφθη, προσεδέθη, φοβηθέντες).</p>
<h3>The sound-changes at the seam</h3>
<p>The θ fuses with stem-final consonants by the aspiration row you learned with the alphabet:</p>
<table class="gr"><tr><th>Stem ends in</th><th>Result</th><th>Example</th></tr>
<tr><td>π / β</td><td lang="grc">-φθη-</td><td lang="grc">πέμπω → ἐπέμφθην</td></tr>
<tr><td>κ / γ</td><td lang="grc">-χθη-</td><td lang="grc">ἄγω → ἤχθην · διώκω → ἐδιώχθην</td></tr>
<tr><td>τ / δ / ζ</td><td lang="grc">-σθη-</td><td lang="grc">πείθω → ἐπείσθην · νομίζω → ἐνομίσθην</td></tr></table>
<p>A sizeable family forms a <b>second aorist passive</b> without θ: ἐγράφην (γράφω), ἐφάνην (φαίνω – "appeared"), ἐβλάβην (βλάπτω). Same endings, no θ; the augmentless participle -είς endings still give them away: γραφείς, φανείς.</p>
<h3>The future passive: λυθήσομαι</h3>
<p>Aorist-passive stem + σ + middle endings: <b lang="grc">λυθήσομαι</b> "I shall be released", πεμφθήσεται "it will be sent", ληφθήσονται "they will be taken". Recognise, don't memorise: -θησ- = future passive, every time.</p>
<h3>Deponent housekeeping</h3>
<p>Some deponents take this passive-shaped aorist with plain active meaning – "passive deponents": <b lang="grc">ἐβουλήθην</b> (I wanted), <b lang="grc">ἐδυνήθην</b> (I was able), <b lang="grc">ἐφοβήθην</b> (I feared), <b lang="grc">ᾠήθην</b> (I thought – you met it in the Θάλαττα reading). Others keep the middle shape: ἐγενόμην, ἐμαχεσάμην. The dictionary's sixth principal part settles each verb once and for all.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ἡ πόλις ὑπὸ τῶν πολεμίων ἐλήφθη, τὰ δὲ τείχη ἐλύθη.</div><p>ἐλήφθη – aorist passive of λαμβάνω (stem ληβ- + θη → ληφθη-): "was taken", with ὑπό + genitive for the agent. ἐλύθη – "were destroyed": neuter plural subject (τὰ τείχη), singular verb, as always. <i>The city was taken by the enemy, and its walls were pulled down.</i></p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>ἐλύθη looks active-ish (no -μαι/-το anywhere) but is passive. The -θη- is the badge; trust it over the endings.</li><li>ἐφοβήθην means "I feared", not "I was feared" – passive deponents translate active. μὴ φοβηθῇς: "don't be afraid."</li><li>Future passive λυθήσομαι vs future middle λύσομαι: the -θη- decides. ἀκούσομαι is middle-for-active ("I shall hear"); ἀκουσθήσομαι is true passive ("I shall be heard").</li></ul></div>`,

<h3>αὐτός – three jobs, decided by position</h3>
<table class="gr"><tr><th>Use</th><th>Pattern</th><th>Meaning</th></tr>

<p>So position relative to the article – the skill you built in Stage Α΄ – now pays double: αὐτός changes meaning by it. And in the nominative, αὐτός is never merely "he": it is always emphatic, "he himself".</p>
<h3>οὗτος and ἐκεῖνος – this and that</h3>
<p>οὗτος, αὕτη, τοῦτο (this, the one just mentioned) and ἐκεῖνος, ἐκείνη, ἐκεῖνο (that, the more remote) both stand in <b>predicate position</b> with the article, unlike English: <b lang="grc">οὗτος ὁ ἀνήρ</b> – "this man"; <b lang="grc">ἐκείνη ἡ νῆσος</b> – "that island". A bare οὗτος can carry contempt in oratory ("this fellow here" – Demosthenes' favourite jab at his opponent), while ἐκεῖνος can carry reverence ("that great man").</p>
<h3>The relative ὅς, ἥ, ὅ</h3>
<p>Declines like the article without its τ- (plus ὅ for the neuter): ὅς, οὗ, ᾧ, ὅν… The rule that governs it:</p>
<p class="ruleline">A relative pronoun takes its <b>gender and number</b> from its antecedent, but its <b>case</b> from its own clause.</p>
<p class="ruleline" lang="grc">ὁ ἀνὴρ ὃν εἶδες σοφός ἐστιν. – The man whom you saw is wise.</p>
<p>ὅν is masculine singular (agreeing with ἀνήρ) but accusative (object of εἶδες). Beware the look-alikes: ὅς/ἥ (relative, rough breathing) vs the article ὁ/ἡ; ὅ (relative, accented) vs τό.</p>
<h3>Personal pronouns</h3>
<p>ἐγώ, ἐμοῦ/μου, ἐμοί/μοι, ἐμέ/με; σύ, σοῦ/σου… The short forms are enclitic and unemphatic; the long forms carry stress or follow prepositions. For possession, the genitive does the everyday work: ὁ πατήρ μου, "my father". The nominatives appear only for contrast: <b lang="grc">ἐγὼ μὲν λέγω, σὺ δὲ οὐκ ἀκούεις</b>.</p>
<div class="pitfall"><b>Pitfalls</b><ul><li>ὁ αὐτὸς φίλος = "the same friend"; αὐτὸς ὁ φίλος = "the friend himself". One slot apart, worlds apart.</li><li>αὕτη (this, fem.) vs αὐτή (she herself) – breathing and accent are the only difference. Likewise αὐτοῦ (of him) vs αὑτοῦ (of himself, reflexive).</li><li>τοῦτο with a neuter plural: ταῦτα – probably the most frequent single word of connected Greek argument ("these things / this").</li></ul></div>`,

  id: "s2", title: "Participles I – forms & first uses", subtitle: "λύων, λύουσα, λῦον: the verb-adjective Greek cannot live without",
  grammar: `<p class="lead">If one word-class defines Greek style, it is the participle – a verb wearing an adjective's clothes. Greek has participles for every tense and voice, declines them all, and uses them where English spends whole clauses. Learn to ride participles and Greek prose suddenly moves <i>with</i> you.</p>
<h3>The forms</h3>
<table class="gr"><tr><th>Participle</th><th>masc.</th><th>fem.</th><th>neut.</th><th>Declines like</th></tr>
<tr><td>present active</td><td lang="grc">λύων</td><td lang="grc">λύουσα</td><td lang="grc">λῦον</td><td>γέρων-type + 1st decl.</td></tr>
<tr><td>present middle/passive</td><td lang="grc">λυόμενος</td><td lang="grc">λυομένη</td><td lang="grc">λυόμενον</td><td>ἀγαθός</td></tr>
<tr><td>aorist active</td><td lang="grc">λύσας</td><td lang="grc">λύσασα</td><td lang="grc">λῦσαν</td><td>3rd + 1st decl.</td></tr>
<tr><td>aorist middle</td><td lang="grc">λυσάμενος</td><td lang="grc">λυσαμένη</td><td lang="grc">λυσάμενον</td><td>ἀγαθός</td></tr>
<tr><td>2nd aorist active</td><td lang="grc">λαβών</td><td lang="grc">λαβοῦσα</td><td lang="grc">λαβόν</td><td>like λύων</td></tr></table>
<p>Genitives: λύοντος, λυούσης· λύσαντος· λαβόντος. The -μενος forms are as tame as any adjective. Note εἰμί's participle: ὤν, οὖσα, ὄν (being) – genitive ὄντος, whence "ontology".</p>
<p>Aspect once more: the <i>present</i> participle = action alongside the main verb ("while doing"); the <i>aorist</i> participle = action before it ("having done"). Time relative to the main verb, not absolute.</p>
<h3>Attributive use</h3>
<p>With the article, a participle is a compact relative clause:</p>
<p class="ruleline" lang="grc">οἱ φεύγοντες – those who flee, the exiles · ὁ ταῦτα εἰπών – the man who said this</p>
<h3>Circumstantial use</h3>
<p>Without the article, a participle agreeing with a noun folds a whole adverbial clause into one word – while, after, because, although, as the context suggests:</p>
<p class="ruleline" lang="grc">ταῦτα εἰπὼν ἀπῆλθεν. – Having said this, he left.</p>
<p class="ruleline" lang="grc">γελῶν εἶπεν. – He said it laughing.</p>
<p>Greek narrative chains such participles before a single main verb – "having risen, having taken his cloak, going to the agora, he greeted…" – where English would write four sentences. The particles ἅτε (because) and καίπερ (although) pin down the flavour when it matters: <b lang="grc">καίπερ σοφὸς ὤν</b>, "although being wise".</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οἱ στρατιῶται τὴν πόλιν λαβόντες τὰ τείχη ἔλυσαν.</div><p>λαβόντες – aorist participle, nominative plural, agreeing with στρατιῶται: "having taken". Aorist because the taking preceded the destroying. <i>The soldiers took the city and (then) destroyed its walls</i> – Greek says it with one finite verb and one participle, and prefers it that way.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>A participle agrees in gender, number and case – find its noun before translating: λαβόντες must belong to a masculine plural nominative.</li><li>λύουσα (fem. participle) vs λύουσι (3rd plural verb or dat. pl. participle): read the whole ending.</li><li>Aorist participle ≠ past time; it means <i>prior</i> action, even in a future sentence: ταῦτα εἰπὼν πείσει αὐτούς, "by saying this he will persuade them".</li></ul></div>`,

  id: "s3", title: "Participles II – genitive absolute & supplementary", subtitle: "τοῦ στρατηγοῦ κελεύοντος: the free-floating clause",
  grammar: `<p class="lead">Two constructions complete the participle. The genitive absolute lets Greek attach background circumstances to a sentence whose subject is someone else entirely; the supplementary participle completes the meaning of certain verbs – and with verbs of knowing and perceiving it quietly becomes a form of indirect statement.</p>
<h3>The genitive absolute</h3>
<p>When the participle's noun plays <b>no role</b> in the main clause, both go into the genitive and stand apart – "absolute" (loosened) from the syntax:</p>
<p class="ruleline" lang="grc">τοῦ στρατηγοῦ κελεύοντος, οἱ στρατιῶται ἐμάχοντο.<br><small>With the general giving the order, the soldiers fought.</small></p>
<p class="ruleline" lang="grc">νυκτὸς γενομένης, ἀπῆλθον.<br><small>Night having fallen, they departed.</small></p>
<p>Latin's ablative absolute is the same idea in a different case. Translate flexibly: "when night fell", "since the general ordered it", "although…" – the participle's aspect and the context choose the conjunction for you.</p>
<div class="pitfall"><b>The one rule that matters</b><ul><li>If the noun <i>does</i> appear in the main clause, Greek does not use the absolute – it simply agrees the participle with the noun in its proper case: τὸν στρατηγὸν εἴδομεν κελεύοντα, "we saw the general (as he was) giving orders".</li></ul></div>
<h3>Supplementary participles</h3>
<p>Some verbs are incomplete without a participle:</p>
<table class="gr"><tr><th>Verb</th><th>With participle</th></tr>
<tr><td lang="grc">τυγχάνω</td><td lang="grc">τυγχάνει ὤν – he happens to be</td></tr>
<tr><td lang="grc">λανθάνω</td><td lang="grc">λανθάνει ποιῶν – he does it unnoticed</td></tr>
<tr><td lang="grc">φθάνω</td><td lang="grc">φθάνει ἐλθών – he arrives first</td></tr>
<tr><td lang="grc">παύομαι</td><td lang="grc">παύεται λέγων – he stops speaking</td></tr>
<tr><td lang="grc">χαίρω</td><td lang="grc">χαίρει μανθάνων – he enjoys learning</td></tr></table>
<p>τυγχάνω, λανθάνω and φθάνω invert English's structure: Greek makes "happen/escape-notice/anticipate" the main verb and the real action a participle. <b lang="grc">ἔτυχε παρών</b> – "he happened to be present."</p>
<h3>Knowing and perceiving</h3>
<p>οἶδα (know), αἰσθάνομαι (perceive), ἀκούω, ὁράω take a participle where English takes a "that"-clause:</p>
<p class="ruleline" lang="grc">οἶδα αὐτὸν σοφὸν ὄντα. – I know that he is wise (literally: I know him being wise).</p>
<p>Keep this pattern warm: in the next unit it joins the accusative-and-infinitive as one of Greek's three ways of reporting.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">τῶν πολεμίων φευγόντων, οἱ Ἕλληνες ἐπαύσαντο διώκοντες.</div><p>Genitive absolute: τῶν πολεμίων φευγόντων, "as the enemy fled" – the enemy plays no part in the main clause. Then a supplementary participle: ἐπαύσαντο διώκοντες, "they ceased pursuing". <i>With the enemy in flight, the Greeks gave up the chase.</i> Two participle constructions, one crisp sentence.</p></div>`,

{
  id: "s4", title: "Infinitives & indirect statement", subtitle: "φησὶ τὸν ἄνδρα σοφὸν εἶναι: three ways to report",
  grammar: `<p class="lead">How do you say "He says that…"? Greek has three answers, and – with a tidiness that seems almost designed – <i>the choice depends on the main verb</i>. Verbs of saying split between ὅτι-clauses and the accusative-and-infinitive; verbs of knowing and perceiving take the participle you already know. Master the triage and reported speech loses its terrors.</p>
<h3>Route 1: ὅτι / ὡς + indicative</h3>
<p>After λέγω and most verbs of announcing: <b lang="grc">λέγει ὅτι ὁ ἀνὴρ σοφός ἐστιν</b> – "he says that the man is wise". The reported clause keeps its original tense. ὡς instead of ὅτι adds a shade of "he alleges".</p>
<h3>Route 2: accusative + infinitive</h3>
<p>After φημί (say, claim), νομίζω (think), οἴομαι, δοκέω, and ἡγέομαι: the subject of the report goes accusative, its verb becomes an infinitive:</p>
<p class="ruleline" lang="grc">φησὶ τὸν ἄνδρα σοφὸν εἶναι. – He says the man is wise.</p>
<p>The infinitive's tense carries <b>relative time</b>: present εἶναι = same time; aorist λῦσαι = before; future λύσειν = after. <b lang="grc">νομίζω αὐτὸν ἐλθεῖν</b>, "I think he came"; <b lang="grc">νομίζω αὐτὸν ἥξειν</b>, "I think he will come".</p>
<p>One elegant economy: when the report's subject is the <b>same</b> as the speaker's, it is simply omitted and any predicate stays nominative: <b lang="grc">φησὶ σοφὸς εἶναι</b> – "he says he (himself) is wise". φησὶ αὐτὸν σοφὸν εἶναι would mean he is calling <i>someone else</i> wise.</p>
<h3>Route 3: participle (from last unit)</h3>
<p>After οἶδα, αἰσθάνομαι, and friends: <b lang="grc">οἶδα αὐτὸν σοφὸν ὄντα</b>. Three routes, chosen by the reporting verb – say (ὅτι/φημί+inf.), think (infinitive), know/perceive (participle).</p>
<h3>Other infinitive workhorses</h3>
<ul><li>After verbs of will: βούλομαι λέγειν, "I want to speak"; κελεύω σε ἐλθεῖν, "I order you to come".</li>
<li>The articular infinitive – the article turns any infinitive into a noun: <b lang="grc">τὸ ἀδικεῖν</b>, "doing wrong"; <b lang="grc">διὰ τὸ φεύγειν</b>, "on account of fleeing".</li>
<li>Result with ὥστε: <b lang="grc">οὕτω σοφός ἐστιν ὥστε πάντας πείθειν</b> – "so wise that he persuades everyone".</li>
<li>Impersonals: δεῖ and χρή + accusative + infinitive: <b lang="grc">δεῖ σε μάχεσθαι</b>, "you must fight"; ἔξεστι, "it is permitted".</li></ul>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οἱ Ἕλληνες ἐνόμιζον τοὺς θεοὺς πάντα ὁρᾶν.</div><p>νομίζω → accusative + infinitive: τοὺς θεούς (subject, accusative) + ὁρᾶν (present infinitive of ὁράω, contracted: same time as the thinking). <i>The Greeks believed that the gods see everything.</i></p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>The negative inside infinitive-reports is οὐ after verbs of saying/thinking… except φημί, which prefers <b>οὔ φημι</b> – "I deny": οὔ φησι ταῦτα εἶναι, "he says this is NOT so".</li><li>Do not export English "that": there is no ὅτι after φημί or νομίζω.</li><li>An aorist infinitive in report = prior time, not past tense as such.</li></ul></div>`,

/* ------------------------------------------------- alphabet trainer */
function viewAlpha() {
  return `<h1>Alphabet trainer</h1><p class="sub">Twenty-four letters, two breathings, three accents. Learn to read the script fluently before anything else – it repays the effort within days.</p>
<div class="card"><h2 style="margin-top:0">Drills</h2>
<p>Three drills, each a fresh random round every time. Do <b>Letters</b> until it feels boring, then <b>Marks</b>, then <b>Reading words</b>.</p>
<button class="btn primary" onclick="go('alphaquiz/letters')">Letters</button>
<button class="btn primary" onclick="go('alphaquiz/marks')">Marks – breathings &amp; accents</button>
<button class="btn primary" onclick="go('alphaquiz/words')">Reading words</button></div>
<h2>The letters</h2>
<div class="alphagrid">${ALPHA.map(a => `<div class="alphacell"><span class="gl" lang="grc">${a.u} ${a.l}</span><div class="nm">${a.name}</div><small>${a.sound}</small><small>transliterated <b>${a.tr}</b></small></div>`).join("")}</div>
<div class="card grammar"><h3 style="margin-top:0">Beyond the letters</h3>
<p><b>Breathings.</b> Every word beginning with a vowel (or ρ) carries a breathing over its first vowel: <b lang="grc">ἁ</b> (rough) is pronounced with an <i>h</i> – <b lang="grc">ὁδός</b> <i>hodos</i>; <b lang="grc">ἀ</b> (smooth) means no <i>h</i> – <b lang="grc">ἀγορά</b> <i>agora</i>. Initial <b lang="grc">ὑ</b> and <b lang="grc">ῥ</b> always take the rough breathing.</p>
<p><b>Accents.</b> Acute <b lang="grc">ά</b>, grave <b lang="grc">ὰ</b> (an acute flattened on a final syllable before another word), circumflex <b lang="grc">ᾶ</b> (a rise-and-fall, only on long vowels, only on the last two syllables). Ancient accent was musical pitch, not stress; most modern readers render all three as stress, which is a perfectly good convention.</p>
<p><b>Iota subscript.</b> The tiny iota under <b lang="grc">ᾳ ῃ ῳ</b> is a real iota that ceased to be pronounced; it distinguishes the dative <b lang="grc">τῇ χώρᾳ</b> from other forms, so never ignore it when reading endings.</p>
<p><b>Two sigmas.</b> σ everywhere except word-finally, where it becomes ς: <b lang="grc">σοφός</b>, <b lang="grc">λόγος</b>.</p>
<p><b>Punctuation.</b> The comma and full stop are as in English; the raised dot <b>·</b> is a semicolon/colon; the Greek question mark is <b>;</b> – <b lang="grc">τί λέγεις;</b> means <i>what are you saying?</i></p></div>`;
}
function alphaLetterQs() {
  const qs = [];
  shuffled(ALPHA).slice(0, 10).forEach(a => {
    const wrong = shuffled(ALPHA.filter(x => x.name !== a.name)).slice(0, 3);
    if (Math.random() < 0.5)
      qs.push({ t: "mcq", form: a.u + " " + a.l, q: "Name this letter.", opts: [a.name, ...wrong.map(w => w.name)], a: 0, ex: `<b lang="grc">${a.u} ${a.l}</b> is <b>${a.name}</b> – ${a.sound}; transliterated <i>${a.tr}</i>.` });
    else
      qs.push({ t: "mcq", q: `Which letter is <b>${a.name}</b> (${a.sound})?`, opts: [a.u + " " + a.l, ...wrong.map(w => w.u + " " + w.l)], a: 0, ex: `<b>${a.name}</b> is written <b lang="grc">${a.u} ${a.l}</b> and transliterated <i>${a.tr}</i>.` });
  });
  return qs;
}
function alphaWordQs() {
  return shuffled(TRANSLIT).slice(0, 10).map(w =>
    ({ t: "fill", form: w[0], q: `Transliterate this word into Latin letters${w[2] ? ` – it means <i>${w[2]}</i>` : ""}.`, a: [w[1]], ex: `<b lang="grc">${w[0]}</b> → <b>${w[1]}</b>${w[2] ? ` (${w[2]})` : ""}.${w[3] ? " " + w[3] : ""}` }));
}
function viewAlphaQuiz(mode) {
  const banks = { letters: alphaLetterQs, marks: () => prepare(ALPHA_MARKS, 10), words: alphaWordQs };
  const label = { letters: "Letters", marks: "Breathings & accents", words: "Reading words" }[mode] || "Letters";
  const qs = (banks[mode] || banks.letters)();
  quiz = { title: "Alphabet – " + label, back: "alpha", kind: "alpha", qs: mode === "marks" ? qs : prepare(qs, 10), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>Alphabet – ${label}</h1><p class="sub">${quiz.qs.length} questions · a fresh draw every round · ${strictOn() ? "strict polytonic spelling for typed answers" : "accents and breathings optional in typed answers"}</p><div id="quizbox"></div>`;
}

/* ------------------------------------------------- principal parts */
function viewParts() {
  return `<h1>Principal parts</h1><p class="sub">Greek verbs are memorised in six principal parts: present, future, aorist, perfect active, perfect middle/passive, aorist passive. These ${PP.length} verbs cover a remarkable share of real prose.</p>
<div class="card"><p>The drill asks for one part at a time. ${strictOn() ? "Strict mode requires the full accented form." : "Loose mode accepts the form without accents or breathings."} Little is a better use of memory in Greek than these rows.</p>
<button class="btn primary" onclick="go('partsquiz')">Drill principal parts</button>
<button class="btn" onclick="addPartsCards()">Add all ${PP.length} verbs to flashcards</button></div>
<div class="card labtable"><table class="gr pptable ppgr"><tr><th>Meaning</th><th>Present</th><th>Future</th><th>Aorist</th><th>Perfect</th><th>Perf. m/p</th><th>Aor. passive</th></tr>
${PP.map(v => `<tr><td>${v.en}</td>${v.p.map(x => `<td lang="grc">${x || " – "}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
const PP_NAMES = ["present", "future", "aorist", "perfect active", "perfect middle/passive", "aorist passive"];
function partsQs() {
  const qs = [];
  const hasPart = x => x && x.trim() && x.trim() !== "–";
  shuffled(PP.filter(v => v.p.some((x, i) => i > 0 && hasPart(x)))).slice(0, 10).forEach(v => {
    const idxs = v.p.map((x, i) => i).filter(i => i > 0 && hasPart(v.p[i]));
    const idx = idxs[Math.floor(Math.random() * idxs.length)];
    if (Math.random() < 0.35) {
      const wrong = shuffled(PP.filter(x => x !== v && hasPart(x.p[idx]))).slice(0, 3);
      qs.push({ t: "mcq", form: v.p[0], q: `Which is the <b>${PP_NAMES[idx]}</b> of <b lang="grc">${v.p[0]}</b> (${v.en})?`, opts: [v.p[idx], ...wrong.map(w => w.p[idx])], a: 0, ex: `<b lang="grc">${v.p.join(", ")}</b> – ${v.en}.` });
    } else {
      qs.push({ t: "fill", form: v.p[0], q: `Type the <b>${PP_NAMES[idx]}</b> of <b lang="grc">${v.p[0]}</b> (${v.en}).`, a: [v.p[idx]], ex: `<b lang="grc">${v.p.join(", ")}</b> – ${v.en}.` });
    }
  });
  return qs;
}
function viewPartsQuiz() {
  quiz = { title: "Principal parts", back: "parts", kind: "parts", qs: partsQs(), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>Principal parts drill</h1><p class="sub">${quiz.qs.length} questions · ${strictOn() ? "strict polytonic spelling required for typed answers" : "accents and breathings optional in typed answers"}</p><div id="quizbox"></div>`;
}
function addPartsCards() {
  PP.forEach(v => { store.data.extraCards["pp:" + v.p[0]] = { la: v.p[0], en: v.en + " – " + v.p.slice(1).map(x => x || " – ").join(", "), source: "Principal parts" }; });
  store.save(); renderSidebar();
  const tip = $("#glosstip");
  tip.innerHTML = `<div class="glosstip">${PP.length} principal-part cards added to your deck.</div>`;
  clearTimeout(showGloss.t); showGloss.t = setTimeout(() => { tip.innerHTML = ""; }, 4000);
}

  return `<h1>Flashcards</h1><p class="sub">Course vocabulary, any reading glossaries you add, and the principal parts if you add them.</p>
<div class="stats"><div class="stat"><b>${due}</b><small>due for review</small></div><div class="stat"><b>${fresh}</b><small>new, not yet seen</small></div><div class="stat"><b>${total}</b><small>cards in your deck</small></div><div class="stat"><b>${whole}</b><small>in the whole course</small></div></div>
<div class="card"><p>Reviews use an expanding interval. <b>Again</b> brings the card back later in this same session and resets it to tomorrow; <b>Easy</b> expands the interval fastest. Each session mixes the cards due for review with up to ${NEW_PER_SESSION} new ones, so the deck grows at a sustainable pace.</p>
<p class="scopeline">Deck: <b>${scope === "all" ? "the entire course" : "units you have reached"}</b> – <button class="btn small" onclick="store.data.settings.cardScope='${scope === "all" ? "reached" : "all"}';store.save();render()">switch to ${scope === "all" ? "units reached" : "the whole course"}</button></p>
<button class="btn primary" ${count ? "" : "disabled"} onclick="go('flashrun')">Review ${count} card${count === 1 ? "" : "s"}</button></div>
<div class="card"><h2 style="margin-top:0">Keyboard</h2><p><b>Space</b> or <b>Enter</b> reveals the answer; <b>1</b> Again, <b>2</b> Hard, <b>3</b> Good, <b>4</b> Easy.</p></div>`;
}
let fc = null;
function startFlash() {
  const q = shuffled(dueCards()).concat(shuffled(newCards()).slice(0, NEW_PER_SESSION)).slice(0, 30);
  fc = { q, i: 0, reveal: false, dir: null, seen: 0, again: {} };
  renderFlash();
}
function renderFlash() {
  applyTheme(); renderSidebar();
  const m = $("#main");
  if (!fc || fc.i >= fc.q.length) {
    const n = fc ? fc.seen : 0;
    if (n) { activity("flash", null, { n }); store.save(); }
    m.innerHTML = `<div class="card" style="text-align:center;padding:35px"><h1>Review complete</h1><p>${n} card${n === 1 ? "" : "s"} reviewed.</p><button class="btn primary" onclick="go('flash')">Back</button></div>`;
    fc = null;
    return;
  }
  const c = fc.q[fc.i];
  if (!fc.dir) fc.dir = store.data.settings.direction === "mix" ? (Math.random() < .5 ? "la" : "en") : store.data.settings.direction;
  const front = fc.dir === "la" ? c.la : c.en, back = fc.dir === "la" ? c.en : c.la;
  m.innerHTML = `<div class="flashstage"><p class="sub">${fc.i + 1}/${fc.q.length} · ${esc(c.source)}</p>
<button class="flashcard" type="button" id="fcard" onclick="revealCard()"><span class="front" ${fc.dir === "la" ? 'lang="grc"' : ""}>${esc(front)}</span>${fc.reveal ? `<span class="back" ${fc.dir === "en" ? 'lang="grc"' : ""}>${esc(back)}</span>` : `<small style="margin-top:18px;color:var(--muted)">click, tap, or press Space to reveal</small>`}</button>
${fc.reveal ? `<div class="grades"><button type="button" onclick="grade(0)"><b>Again</b><small>1</small></button><button type="button" onclick="grade(1)"><b>Hard</b><small>2</small></button><button type="button" onclick="grade(2)"><b>Good</b><small>3</small></button><button type="button" onclick="grade(3)"><b>Easy</b><small>4</small></button></div>` : ""}
<p class="sub" style="margin-top:14px"><button class="btn small" onclick="fc=null;go('flash')">End session</button></p></div>`;
  setTimeout(() => { const b = $("#fcard"); if (b) b.focus(); }, 0);
}
function revealCard() { if (fc && !fc.reveal) { fc.reveal = true; renderFlash(); } }
function grade(g) {
  if (!fc || !fc.reveal) return;
  const c = fc.q[fc.i], old = store.data.cards[c.id] || { iv: 0, ease: 2.3 };
  // First exposure uses short learning steps; after that, SM-2-style growth.
  // Good is ease-neutral (only Easy raises ease), so intervals stay honest.
  const days = old.iv
    ? [1, Math.max(2, old.iv * 1.2), Math.max(3, old.iv * old.ease), Math.max(5, old.iv * (old.ease + .4))][g]
    : [1, 1, 2, 5][g];
  store.data.cards[c.id] = { iv: days, ease: Math.max(1.5, Math.min(2.8, old.ease + [-0.2, -0.15, 0, 0.15][g])), due: Date.now() + days * 86400000 };
  store.save();
  fc.seen++;
  if (g === 0 && (fc.again[c.id] || 0) < 2) { fc.again[c.id] = (fc.again[c.id] || 0) + 1; fc.q.push(c); }
  fc.i++; fc.reveal = false; fc.dir = null;
  renderFlash();
}

/* ---------------------------------------------- reference, lab, settings */
function viewReference() {
  return `<h1>Grammar reference</h1><p class="sub">Compact tables for consultation, not a substitute for the course sequence.</p>` +
    REFS.map(r => `<details class="card"><summary><b>${r.title}</b></summary><div class="grammar">${r.body}</div></details>`).join("");
}
let labId = PARADIGMS[0].id;
function viewLab() {
  const p = PARADIGMS.find(x => x.id === labId) || PARADIGMS[0];
  return `<h1>Morphology tables</h1><p class="sub">${PARADIGMS.length} complete paradigms – the article, all three declensions, adjectives, pronouns, the full λύω system, contract and -μι verbs, and the irregulars.</p>
<label class="visually-hidden" for="labsel">Choose a paradigm</label>
<select class="select" id="labsel" onchange="labId=this.value;render()">${PARADIGMS.map(x => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${x.name}</option>`).join("")}</select>
<div class="card labtable"><h2 style="margin-top:0" lang="grc">${p.name}</h2><table class="gr"><tr>${p.headers.map(h => `<th>${h}</th>`).join("")}</tr>${p.rows.map(row => `<tr>${row.map((c, i) => i === 0 ? `<th scope="row">${c}</th>` : `<td lang="grc">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function viewSettings() {
  const s = store.data.settings;
  return `<h1>Settings</h1>
<div class="card"><h2 style="margin-top:0">Appearance</h2>
<label>Theme<br><select class="select" onchange="store.data.settings.theme=this.value;store.save();render()">${["system", "light", "dark"].map(t => `<option value="${t}" ${s.theme === t ? "selected" : ""}>${t[0].toUpperCase() + t.slice(1)}</option>`).join("")}</select></label></div>
<div class="card"><h2 style="margin-top:0">Flashcards</h2>
<label>Direction<br><select class="select" onchange="store.data.settings.direction=this.value;store.save()">${[["mix", "Mixed"], ["la", "Greek → English"], ["en", "English → Greek"]].map(([v, t]) => `<option value="${v}" ${s.direction === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<label style="display:block;margin-top:12px">Deck<br><select class="select" onchange="store.data.settings.cardScope=this.value;store.save();render()">${[["reached", "Only units I have reached"], ["all", "The entire course"]].map(([v, t]) => `<option value="${v}" ${(s.cardScope || "reached") === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<p class="sub" style="margin:10px 0 0">Keeping the deck to units you have reached is what makes the interval scheduling meaningful; the whole course at once is ${totalCourseCards()} cards on day one.</p></div>
<div class="card"><h2 style="margin-top:0">Answer checking</h2>
<label>Typed answers<br><select class="select" onchange="store.data.settings.strict=this.value==='strict';store.save();render()">${[["loose", "Loose – accents and breathings optional"], ["strict", "Strict – full polytonic orthography required"]].map(([v, t]) => `<option value="${v}" ${(s.strict ? "strict" : "loose") === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<p class="sub" style="margin:10px 0 0">Loose mode folds away breathings, accents and iota subscripts, so δίδωσι and διδωσι both pass – and it also accepts a plain Latin transliteration (<i>logos</i> for λόγος, <i>didosi</i> for δίδωσι), so no Greek keyboard is needed at all – right for a learner still fighting the script. Strict mode demands the exact classical orthography, final sigma included, and adds a row of diacritic keys to the on-screen keypad (type the letter, then the mark: breathing before accent). Switch to strict once accents start to feel like information rather than decoration – because they are.</p></div>
<div class="card"><h2 style="margin-top:0">Audio</h2>
<p class="sub" style="margin-top:0">This course ships no audio, deliberately. Browser and operating-system text-to-speech cannot be relied on to model restored Classical pronunciation; available Greek voices are ordinarily Modern Greek, whose sound system (itacism, stress accent, fricative φ θ χ) is precisely what this course is not trying to teach. Rather than fake it, the course describes each sound in the Alphabet stage and lets the metre units teach rhythm. If you want a human model, recordings of Iliad 1 in restored pronunciation by classicists are easy to find and pair naturally with Stage Ε΄.</p></div>
<div class="card"><h2 style="margin-top:0">Progress data</h2><p class="sub" style="margin-top:0">Progress lives in this browser only. Export it if you clear site data or move device.</p>
<button class="btn" onclick="exportData()">Export progress</button> <button class="btn" onclick="document.getElementById('importfile').click()">Import progress</button> <button class="btn" onclick="resetData()">Reset</button></div>
<div class="card"><h2 style="margin-top:0">About and sources</h2>
<p><i>Hellenike</i> is a complete, self-contained reading course: it begins at the alphabet's first letter, builds Classical Attic stage by stage, and ends with Homeric Greek and a guided Homer reader. It does not claim conversational fluency or a CEFR level.</p>
<p>The ${controlledCount()} controlled readings and the Aesop chapters are <b>original or adapted compositions written for this app</b>, each deliberately restricted to the grammar taught up to its stage. They are not ancient texts and are not presented as such. The authentic passages are drawn from public-domain editions and are identified individually; texts in other dialects (Epic, Ionic, Aeolic, Koine) are tagged.</p>
<p>Grammar explanations, translations and learning notes were prepared for this app with AI assistance and remain under human editorial review. If you find an error in the Greek, that is a bug worth reporting.</p><p>Hellenike is part of <a href="https://naniwadekar.com/">Curiosities</a>.</p></div>`;
}
function exportData() {
  const b = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "hellenike-progress.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function resetData() {
  if (confirm("Delete all Greek-course progress on this device?")) {
    store.data = JSON.parse(JSON.stringify(defaults)); store.save(); render();
  }
}

/* ----------------------------------------------------------- wiring, PWA */
document.addEventListener("click", e => {
  const w = e.target.closest && e.target.closest(".word[data-g]");
  if (w) { const p = route().split("/"); if (p[0] === "read") showGloss(p[1], w.dataset.g); }
});
document.addEventListener("keydown", e => {
  if (!fc || route() !== "flashrun") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (!fc.reveal && (e.key === " " || e.key === "Enter")) { e.preventDefault(); revealCard(); return; }
  if (fc.reveal && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); grade(Number(e.key) - 1); }
});
$("#importfile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("shape");
      const clean = JSON.parse(JSON.stringify(defaults));
      ["completed", "scores", "readingDone", "chapterDone", "histDone", "cards", "extraCards"].forEach(k => {
        if (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) clean[k] = d[k];
      });
      if (d.settings && typeof d.settings === "object") clean.settings = Object.assign({}, defaults.settings, d.settings);
      if (Array.isArray(d.activity)) clean.activity = d.activity.slice(0, 200);
      store.data = clean; store.save(); render();
      alert("Progress imported.");
    } catch (err) { alert("That file is not valid progress data."); }
    e.target.value = "";
  };
  rd.readAsText(f);
});
$("#menubtn").onclick = () => {
  const open = $("#sidebar").classList.toggle("open");
  $("#menubtn").setAttribute("aria-expanded", String(open));
};
let lastRead = null;
addEventListener("hashchange", () => {
  $("#sidebar").classList.remove("open");
  $("#menubtn").setAttribute("aria-expanded", "false");
  const p = route().split("/");
  const here = p[0] === "read" ? p[1] : null;
  if (here !== lastRead) aid = { gloss: false, notes: false, translation: false };
  lastRead = here;
  render();
});
// Only repaint the theme on an OS light/dark flip – a full render() would
// rebuild (and so reset) any quiz or flashcard session in progress.
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change", () => { if (store.data.settings.theme === "system") applyTheme(); });

// PWA: the manifest, icons and service worker are shipped as separate files
// alongside this page. Keep them in the same directory.
if ("serviceWorker" in navigator) {
  addEventListener("load", async () => {
    try {
      await navigator.serviceWorker.register(
        "/more/ancient-greek-sw.js",
        { scope: "/more/ancient-greek.html" }
      );
    } catch (error) {
      console.warn("Hellenike offline support was not installed:", error);
    }
  });
}

render();
</script>
</body>
</html>

  grammar: `<p class="lead">The indicative states; the subjunctive projects – things aimed at, feared, proposed, or generally true. Its forms are the easiest in the Greek verb: lengthen the theme vowel (ω/η everywhere) and you have it. Its uses are a short, learnable list.</p>
<h3>Forms</h3>
<table class="gr"><tr><th></th><th>present act.</th><th>aorist act.</th><th>aorist middle</th></tr>
<tr><th scope="row">1 sg.</th><td lang="grc">λύω</td><td lang="grc">λύσω</td><td lang="grc">λύσωμαι</td></tr>
<tr><th scope="row">2 sg.</th><td lang="grc">λύῃς</td><td lang="grc">λύσῃς</td><td lang="grc">λύσῃ</td></tr>
<tr><th scope="row">3 sg.</th><td lang="grc">λύῃ</td><td lang="grc">λύσῃ</td><td lang="grc">λύσηται</td></tr>
<tr><th scope="row">1 pl.</th><td lang="grc">λύωμεν</td><td lang="grc">λύσωμεν</td><td lang="grc">λυσώμεθα</td></tr>
<tr><th scope="row">2 pl.</th><td lang="grc">λύητε</td><td lang="grc">λύσητε</td><td lang="grc">λύσησθε</td></tr>
<tr><th scope="row">3 pl.</th><td lang="grc">λύωσι(ν)</td><td lang="grc">λύσωσι(ν)</td><td lang="grc">λύσωνται</td></tr></table>
<p>Note: the aorist subjunctive has <b>no augment</b> (aspect only, no past time) and εἰμί's subjunctive is bare vowels: ὦ, ᾖς, ᾖ, ὦμεν, ἦτε, ὦσι(ν).</p>
<h3>Independent uses</h3>
<table class="gr"><tr><th>Use</th><th>Example</th></tr>
<tr><td>hortatory (1st pl.)</td><td lang="grc">ἴωμεν. – Let us go.</td></tr>
<tr><td>deliberative question</td><td lang="grc">τί εἴπω; – What am I to say?</td></tr>
<tr><td>prohibition (μή + aor. subj.)</td><td lang="grc">μὴ φοβηθῇς. – Don't be afraid.</td></tr></table>
<h3>Purpose clauses</h3>
<p>ἵνα (also ὅπως, ὡς) + subjunctive; negative ἵνα μή:</p>
<p class="ruleline" lang="grc">μανθάνομεν ἵνα σοφοὶ γενώμεθα. – We learn in order to become wise.</p>
<h3>Fear clauses</h3>
<p>φοβοῦμαι μή + subjunctive – "I fear that (something may happen)"; μή οὐ if you fear it may <i>not</i>:</p>
<p class="ruleline" lang="grc">φοβοῦμαι μὴ οἱ πολέμιοι ἔλθωσιν. – I fear the enemy may come.</p>
<h3>General conditions and ἄν</h3>
<p>The subjunctive pairs with the particle ἄν in clauses of general or future condition: ἐάν (= εἰ + ἄν) + subjunctive, "if ever / if (in the future)"; ὅταν, "whenever"; ὃς ἄν, "whoever":</p>
<p class="ruleline" lang="grc">ἐὰν ζητῇς, εὑρήσεις. – If you seek, you will find.</p>
<p class="ruleline" lang="grc">ὅταν ἡ νὺξ γένηται, οἱ φύλακες ἔρχονται. – Whenever night falls, the guards come.</p>
<p>ἄν itself is untranslatable – a small flag meaning "contingent". Watch where it stands and with what mood; it will organise the entire theory of conditions in the next unit.</p>
<div class="pitfall"><b>Pitfalls</b><ul><li>λύσῃς (aorist subj.) has σ but no augment. ἔλυσας is its indicative cousin.</li><li>Aspect still rules: present subjunctive = ongoing, aorist = single act. μὴ κλέπτε "stop stealing (habitually)!" vs μὴ κλέψῃς "don't steal (it)!"</li><li>λύῃ could be 2nd sg. middle indicative or 3rd sg. subjunctive – context and the presence of ἵνα/ἐάν/μή decide.</li></ul></div>`,

  id: "s6", title: "The optative & conditions", subtitle: "εἴθε γένοιτο: wishes, possibilities, and the full map of if",
  grammar: `<p class="lead">The optative is the subjunctive's gentler sibling – the mood of wish, of remote possibility, and of subordinate clauses after past tenses. It is also the last piece needed to draw the complete map of Greek conditional sentences, one of the glories of the language.</p>
<h3>Forms – the ι-mood</h3>
<p>The optative's badge is ι in the ending:</p>
<table class="gr"><tr><th></th><th>present</th><th>aorist</th></tr>
<tr><th scope="row">1 sg.</th><td lang="grc">λύοιμι</td><td lang="grc">λύσαιμι</td></tr>
<tr><th scope="row">2 sg.</th><td lang="grc">λύοις</td><td lang="grc">λύσαις</td></tr>
<tr><th scope="row">3 sg.</th><td lang="grc">λύοι</td><td lang="grc">λύσαι</td></tr>
<tr><th scope="row">1 pl.</th><td lang="grc">λύοιμεν</td><td lang="grc">λύσαιμεν</td></tr>
<tr><th scope="row">3 pl.</th><td lang="grc">λύοιεν</td><td lang="grc">λύσαιεν</td></tr></table>
<p>εἰμί: εἴην, εἴης, εἴη… γίγνομαι: γενοίμην, γένοιο, γένοιτο.</p>
<h3>Independent uses</h3>
<table class="gr"><tr><th>Use</th><th>Example</th></tr>
<tr><td>wish (often with εἴθε/εἰ γάρ)</td><td lang="grc">εἴθε γένοιτο. – May it come to pass!</td></tr>
<tr><td>potential (with ἄν)</td><td lang="grc">λέγοι ἄν τις… – One might say…</td></tr></table>
<p>μὴ γένοιτο – "may it not happen!" – is the emphatic "God forbid!" of Greek from Euripides to Paul's letters. And the polite potential – <b lang="grc">οὐκ ἂν λέγοιμι</b>, "I wouldn't like to say" – is the sound of cultivated Attic conversation.</p>
<h3>In subordinate clauses after past tenses</h3>
<p>After a past main verb, purpose and fear clauses may soften subjunctive → optative: <b lang="grc">ἦλθεν ἵνα ἴδοι</b>, "he came in order to see". This "sequence of moods" is a courtesy, not an obligation – writers keep the subjunctive for vividness.</p>
<h3>The map of conditions</h3>
<table class="gr"><tr><th>Type</th><th>Protasis (if…)</th><th>Apodosis (then…)</th><th>Example</th></tr>
<tr><td>simple fact</td><td lang="grc">εἰ + indic.</td><td>indic.</td><td>if he is here, he is helping</td></tr>
<tr><td>future open</td><td lang="grc">ἐάν + subj.</td><td>future indic.</td><td lang="grc">ἐὰν ζητῇς, εὑρήσεις</td></tr>
<tr><td>future remote ("should–would")</td><td lang="grc">εἰ + opt.</td><td lang="grc">opt. + ἄν</td><td lang="grc">εἰ ζητοίης, εὕροις ἄν</td></tr>
<tr><td>present unreal</td><td lang="grc">εἰ + imperfect</td><td lang="grc">imperfect + ἄν</td><td lang="grc">εἰ ἐζήτεις, ηὕρισκες ἄν</td></tr>
<tr><td>past unreal</td><td lang="grc">εἰ + aorist</td><td lang="grc">aorist + ἄν</td><td lang="grc">εἰ ἐζήτησας, ηὗρες ἄν</td></tr></table>
<p>Read the table by its logic: <b>indicative</b> for reality (and, with past tenses + ἄν, for reality contrary to fact); <b>subjunctive</b> for the open future; <b>optative</b> for the remote future. The mood is a dial of likelihood.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">εἰ μὴ Ἀλέξανδρος ἤμην, Διογένης ἂν ἤμην.</div><p>Both clauses imperfect indicative, ἄν in the second: present-unreal. Plutarch's Alexander: <i>"If I were not Alexander, I would be Diogenes."</i> Grammar and wit in seven words.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>λύσαι (aorist optative 3rd sg.) is distinguished only by its accent from λῦσαι (aorist active infinitive <i>and</i> aorist middle imperative). Context – above all the presence of ἄν or εἴθε – decides.</li><li>ἄν + optative = potential ("would/might"); ἄν + past indicative = unreal ("would have"). Never optative for unreality.</li><li>In conditions the negative of the protasis is μή, of the apodosis οὐ: εἰ μὴ ζητεῖς, οὐχ εὑρίσκεις.</li></ul></div>`,

    { t: "fill", q: "___ γένοιτο (may it NOT happen – supply the negative).", a: ["μὴ", "μή", "μη"], ex: "μὴ γένοιτο. Wishes take μή, the negative of things projected rather than asserted. Paul uses this exact phrase ten times in Romans alone (fourteen in the whole New Testament)." },

    { t: "mcq", q: "After a past-tense main verb, a purpose clause may shift:", opts: ["subjunctive → optative", "optative → subjunctive", "indicative → infinitive", "nothing may change"], a: 0, ex: "ἔρχεται ἵνα ἴδῃ (present: subjunctive) but ἦλθεν ἵνα ἴδοι (past: optative allowed). Keeping the subjunctive after a past verb is also correct – it is the 'vivid' choice." },

{
  id: "a1", title: "The -μι verbs", subtitle: "δίδωμι, τίθημι, ἵστημι: the ancient conjugation",
  grammar: `<p class="lead">A small, ancient family of verbs skips the theme vowel and attaches endings directly to the stem: the -μι verbs. They are few, but they include give, put, set, send-forth, show and be – words no page of Greek does without. The trick to them is one idea: <b>long stem-vowel in the singular, short in the plural</b>.</p>
<h3>The big three, present indicative</h3>
<table class="gr"><tr><th></th><th lang="grc">δίδωμι <small>give (stem δο/δω)</small></th><th lang="grc">τίθημι <small>put (stem θε/θη)</small></th><th lang="grc">ἵστημι <small>set up (stem στα/στη)</small></th></tr>
<tr><th scope="row">1 sg.</th><td lang="grc">δίδωμι</td><td lang="grc">τίθημι</td><td lang="grc">ἵστημι</td></tr>
<tr><th scope="row">2 sg.</th><td lang="grc">δίδως</td><td lang="grc">τίθης</td><td lang="grc">ἵστης</td></tr>
<tr><th scope="row">3 sg.</th><td lang="grc">δίδωσι(ν)</td><td lang="grc">τίθησι(ν)</td><td lang="grc">ἵστησι(ν)</td></tr>
<tr><th scope="row">1 pl.</th><td lang="grc">δίδομεν</td><td lang="grc">τίθεμεν</td><td lang="grc">ἵσταμεν</td></tr>
<tr><th scope="row">2 pl.</th><td lang="grc">δίδοτε</td><td lang="grc">τίθετε</td><td lang="grc">ἵστατε</td></tr>
<tr><th scope="row">3 pl.</th><td lang="grc">διδόασι(ν)</td><td lang="grc">τιθέασι(ν)</td><td lang="grc">ἱστᾶσι(ν)</td></tr></table>
<p>Each reduplicates its present with ι (δί-δωμι, τί-θημι, ἵ-στημι from σι-στημι). The aorists you must simply befriend: <b lang="grc">ἔδωκα, ἔθηκα, ἔστησα/ἔστην</b> – the κ-aorists of give and put are unique to this family, and ἵστημι has two aorists with different meanings: ἔστησα "I set (something) up" (transitive), ἔστην "I stood" (intransitive).</p>
<h3>The others you will meet</h3>
<p><b lang="grc">ἵημι</b> (send forth; ἀφίημι, let go, forgive), <b lang="grc">δείκνυμι</b> (show), <b lang="grc">φημί</b> (say – already yours), <b lang="grc">εἰμί</b> (be), and <b lang="grc">εἶμι</b> (go – future in sense in Attic). Compounds of the big three are everywhere: ἀποδίδωμι give back, παραδίδωμι hand over (whence "tradition" via Latin), ἐπιτίθημι impose, ἀνίστημι raise up.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οἱ θεοὶ τοῖς ἀνθρώποις πάντα τὰ ἀγαθὰ διδόασιν.</div><p>διδόασι – 3rd plural (short stem-vowel: plural), with dative of recipient. <i>The gods give humankind all good things.</i></p></div>
<div class="tip"><b>Reading strategy.</b> You do not need to generate every -μι form; you need to <i>recognise</i> stems. See δο/δω → think give; θε/θη → put; στα/στη → stand; ε/ἡ (from ἵημι) → send. Compounds keep the stems visible: παρα-δί-δωμι, κατ-έ-στη.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>δίδωσι is 3rd singular, διδόασι 3rd plural – the vowel-length rule at work.</li><li>ἔστην (I stood) vs ἔστησα (I set up): intransitive vs transitive, a distinction Greek never blurs.</li><li>τίθημι's θε- stem surfaces in θέσις, "a placing" – the word behind thesis, synthesis, hypothesis.</li></ul></div>`,

{
  id: "a2", title: "The perfect system", subtitle: "λέλυκα, οἶδα: the present of a completed past",
  grammar: `<p class="lead">The perfect is not "another past tense". It is a present tense describing the <b>state that results from a completed action</b>: τέθνηκε does not narrate a dying but states a fact of now – "he is dead". Its badge is reduplication: the stem's first consonant doubled with ε.</p>
<h3>Forms</h3>
<table class="gr"><tr><th></th><th>perfect active</th><th>perfect middle/passive</th></tr>
<tr><th scope="row">1 sg.</th><td lang="grc">λέλυκα</td><td lang="grc">λέλυμαι</td></tr>
<tr><th scope="row">2 sg.</th><td lang="grc">λέλυκας</td><td lang="grc">λέλυσαι</td></tr>
<tr><th scope="row">3 sg.</th><td lang="grc">λέλυκε(ν)</td><td lang="grc">λέλυται</td></tr>
<tr><th scope="row">1 pl.</th><td lang="grc">λελύκαμεν</td><td lang="grc">λελύμεθα</td></tr>
<tr><th scope="row">2 pl.</th><td lang="grc">λελύκατε</td><td lang="grc">λέλυσθε</td></tr>
<tr><th scope="row">3 pl.</th><td lang="grc">λελύκασι(ν)</td><td lang="grc">λέλυνται</td></tr></table>
<p>Reduplication rules: consonant + ε (λύω → λέλυκα; γράφω → γέγραφα – note that an initial aspirate reduplicates with the corresponding plain stop: θύω → τέθυκα, φαίνω → πέφηνα, χωρέω → κεχώρηκα); vowel-initial and cluster-initial verbs usually just augment: ἐλπίζω → ἤλπικα. The pluperfect adds an augment to the perfect stem and means "had": ἐλελύκη.</p>
<h3>Perfects that live as presents</h3>
<table class="gr"><tr><th>Perfect</th><th>Meaning now</th><th>From</th></tr>
<tr><td lang="grc">οἶδα</td><td>I know</td><td>root ἰδ-, "have seen"</td></tr>
<tr><td lang="grc">τέθνηκα</td><td>I am dead</td><td lang="grc">ἀποθνῄσκω</td></tr>
<tr><td lang="grc">ἕστηκα</td><td>I stand</td><td lang="grc">ἵστημι</td></tr>
<tr><td lang="grc">μέμνημαι</td><td>I remember</td><td lang="grc">μιμνῄσκω</td></tr>
<tr><td lang="grc">πέποιθα</td><td>I trust</td><td lang="grc">πείθω</td></tr>
<tr><td lang="grc">γέγονα</td><td>I have become, am</td><td lang="grc">γίγνομαι</td></tr></table>
<p>οἶδα conjugates its own way – οἶδα, οἶσθα, οἶδε, ἴσμεν, ἴστε, ἴσασι – and is among the ten commonest verbs in Greek. Its infinitive is εἰδέναι, its participle εἰδώς.</p>
<h3>Hearing the perfect</h3>
<p class="ruleline" lang="grc">γέγραφα τὴν ἐπιστολήν. – I have written the letter (it stands finished, here).</p>
<p class="ruleline" lang="grc">ἔγραψα τὴν ἐπιστολήν. – I wrote the letter (event, then).</p>
<p>The most famous perfect in world literature is a cry from the geometer's bath: <b lang="grc">εὕρηκα</b> – "I have found it – and the finding stands!" And John's Gospel closes Jesus' life with one word of the same shape: <b lang="grc">τετέλεσται</b>, "it stands accomplished" (perfect middle of τελέω).</p>
<div class="pitfall"><b>Pitfalls</b><ul><li>Reduplication (λέλυκα) is not augment (ἔλυσα): the perfect keeps its reduplication in every mood – infinitive λελυκέναι, participle λελυκώς.</li><li>Do not translate every perfect with English "have …ed"; state-perfects need a present: ἕστηκα "I stand", not "I have stood".</li><li>οἶσθα is 2nd singular of οἶδα (not a different verb): οἶσθα ὅτι… "you know that…".</li></ul></div>`,
  examples: [
    ["εὕρηκα.", "Eureka! I have found it – Archimedes' perfect: the discovery stands."],
    ["γέγραφα τοὺς νόμους καὶ κεῖνται ἐν τῇ ἀγορᾷ.", "I have written the laws, and they stand (published) in the agora."],
    ["ὁ βασιλεὺς τέθνηκεν.", "The king is dead – a state, announced with the perfect."],
    ["μέμνημαι τῶν λόγων ὧν εἶπες.", "I remember the words you said – perfect-as-present + genitive."],
    ["τετέλεσται.", "It is finished / stands accomplished – John 19:30."]
  ],

    { t: "mcq", q: "The Greek perfect essentially expresses:", opts: ["a present state resulting from a past action", "remote past time", "repeated past action", "future certainty"], a: 0, ex: "τέθνηκε = 'he is (now) dead'; εὕρηκα = 'I have it found'. Where English 'have done' is often mere past, the Greek perfect always keeps one foot planted in the present." },
    { t: "parse", form: "λελύκασι", q: "Parse:", opts: ["3rd plural perfect active", "3rd plural present", "aorist", "pluperfect"], a: 0, ex: "Reduplication λε- + κ-stem + -ασι: 'they have released (and it stays released)'. The κ before the ending is the first-perfect marker." },
    { t: "mcq", q: "Reduplication differs from augment in that it:", opts: ["persists in every mood and form of the perfect", "appears only in the indicative", "marks past time", "is optional"], a: 0, ex: "The augment (past time) lives only in the indicative; reduplication (completed aspect) is part of the perfect stem itself: infinitive λελυκέναι, participle λελυκώς, all reduplicated." },
    { t: "fill", q: "Give the perfect of γράφω, 1st singular: ___ (I have written).", a: ["γέγραφα", "γεγραφα"], ex: "γε- + γραφ + α: γέγραφα. 'What I have written, I have written' – ὃ γέγραφα, γέγραφα – is Pilate's perfect in John 19:22: the text stands." },

    { t: "mcq", q: "Socrates' famous stance 'I know that I know nothing' uses οἶδα: <b lang='grc'>οἶδα οὐδὲν εἰδώς</b>. εἰδώς is:", opts: ["the participle of οἶδα", "an adjective 'wise'", "a noun 'knowledge'", "the infinitive"], a: 0, ex: "εἰδώς, εἰδυῖα, εἰδός – participle of οἶδα: 'knowing'. The construction is the supplementary participle from Stage Γ΄: 'I know, (as one) knowing nothing'." },
    { t: "trans", form: "ἔγραψε τὴν ἐπιστολήν", q: "Shift the aspect: 'he HAS written the letter' (perfect).", a: ["γέγραφε τὴν ἐπιστολήν", "γέγραφεν τὴν ἐπιστολήν", "γεγραφε την επιστολην", "γεγραφεν την επιστολην"], ex: "ἔγραψε narrates; γέγραφε presents the finished letter. Aspect to the end: event vs resulting state." },

    { t: "pick", q: "Click the perfect verb.", s: "ὁ μὲν βασιλεὺς τέθνηκεν οἱ δὲ πολῖται μάχονται", a: "τέθνηκεν", ex: "τέθνηκεν – reduplicated state-perfect: 'the king is dead; the citizens fight on'. Present μάχονται beside it shows both tenses working in one now." },
    { t: "mcq", q: "The pluperfect (ἐλελύκη) means:", opts: ["had done – a past state", "does habitually", "will have done", "might do"], a: 0, ex: "Augment + reduplicated stem: the perfect's state relocated to the past: 'I had (already) released'. Rarer than in Latin – Greek usually lets the aorist carry sequence." },
    { t: "fill", q: "___ – Archimedes' cry, 'I have found it!'", a: ["εὕρηκα", "ευρηκα", "ηὕρηκα", "ηυρηκα"], ex: "εὕρηκα, perfect of εὑρίσκω. Not ηὗρον ('I found – event') but the perfect: the discovery is made and possessed. California stamped it on its state seal." },

  ]
},
{
  id: "a3", title: "Comparison & adverbs", subtitle: "σοφώτερος, ἄριστος: degrees of everything",
  grammar: `<p class="lead">Greek compares adjectives with two regular suffixes, keeps a set of irregular comparatives for its commonest ideas – better, worse, greater, more – and turns any adjective into an adverb with a single letter. This unit is short on theory and long on forms you will now recognise everywhere.</p>
<h3>Regular comparison</h3>
<table class="gr"><tr><th>Positive</th><th>Comparative</th><th>Superlative</th></tr>
<tr><td lang="grc">σοφός wise</td><td lang="grc">σοφώτερος</td><td lang="grc">σοφώτατος</td></tr>
<tr><td lang="grc">δίκαιος just</td><td lang="grc">δικαιότερος</td><td lang="grc">δικαιότατος</td></tr>
<tr><td lang="grc">χαλεπός difficult</td><td lang="grc">χαλεπώτερος</td><td lang="grc">χαλεπώτατος</td></tr></table>
<p>(ω after a short syllable, ο after a long – a detail your eye will absorb from reading.) The comparative declines like ἀγαθός; the superlative likewise.</p>
<h3>The irregulars that matter</h3>
<table class="gr"><tr><th>Positive</th><th>Comparative</th><th>Superlative</th></tr>
<tr><td lang="grc">ἀγαθός good</td><td lang="grc">ἀμείνων / βελτίων</td><td lang="grc">ἄριστος / βέλτιστος</td></tr>
<tr><td lang="grc">κακός bad</td><td lang="grc">κακίων / χείρων</td><td lang="grc">κάκιστος / χείριστος</td></tr>
<tr><td lang="grc">μέγας great</td><td lang="grc">μείζων</td><td lang="grc">μέγιστος</td></tr>
<tr><td lang="grc">πολύς much/many</td><td lang="grc">πλείων</td><td lang="grc">πλεῖστος</td></tr>
<tr><td lang="grc">ὀλίγος little/few</td><td lang="grc">ἐλάττων</td><td lang="grc">ἐλάχιστος</td></tr>
<tr><td lang="grc">καλός fine</td><td lang="grc">καλλίων</td><td lang="grc">κάλλιστος</td></tr></table>
<p>ἄριστος gave "aristocracy" (rule of the best); μέγιστος survives in "Hermes Trismegistus"; πλεῖστος in "Pleistocene". The -ίων comparatives decline like σώφρων (3rd declension): μείζων, μείζονος.</p>
<h3>Two ways to say "than"</h3>
<p class="ruleline" lang="grc">ὁ Σωκράτης σοφώτερός ἐστιν ἢ ἐγώ. – with ἤ + same case</p>
<p class="ruleline" lang="grc">ὁ Σωκράτης σοφώτερός ἐστιν ἐμοῦ. – with the bare genitive of comparison</p>
<h3>Adverbs</h3>
<p>Swap the genitive plural's -ων for -ως: σοφός → σοφῶς (wisely), καλός → καλῶς (well, finely), κακός → κακῶς (badly). The comparative adverb is the neuter singular (σοφώτερον), the superlative the neuter plural (σοφώτατα). And with superlatives, ὡς adds "as … as possible": <b lang="grc">ὡς τάχιστα</b> – as quickly as possible.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οὐδὲν κτῆμα κάλλιόν ἐστι φίλου ἀγαθοῦ.</div><p>κάλλιον – neuter comparative of καλός; φίλου ἀγαθοῦ – genitive of comparison. <i>No possession is finer than a good friend.</i></p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>The comparative can also mean "rather/too …": σοφώτερος alone may be "rather wise".</li><li>μείζων hides its declension: acc. μείζω (from μείζονα), nom. pl. μείζους. Recognise, don't panic.</li><li>καλῶς ἔχει = "it is well" – ἔχω + adverb expresses states: πῶς ἔχεις; "how are you?"</li></ul></div>`,
  examples: [
    ["ἡ σοφία κρείττων ἐστὶ τοῦ πλούτου.", "Wisdom is stronger than wealth – genitive of comparison."],
    ["οἱ ἄριστοι τὴν πόλιν ἦγον.", "The best men were leading the city – whence 'aristocracy'."],
    ["πλείονα ἔχει ἢ οἱ ἄλλοι πάντες.", "He has more than all the others – ἤ + same case."],
    ["ὡς τάχιστα ἦλθεν.", "He came as quickly as possible."],
    ["πῶς ἔχεις; – καλῶς ἔχω.", "How are you? – I am well. ἔχω + adverb = to be in a state."]
  ],

  grammar: `<p class="lead">Statements are only half of speech. This unit assembles the grammar of the other half – commands, prohibitions, questions direct and indirect – and sorts Greek's two negatives once and for all.</p>
<h3>The imperative</h3>
<table class="gr"><tr><th></th><th>present</th><th>aorist</th></tr>
<tr><th scope="row">2 sg.</th><td lang="grc">λῦε</td><td lang="grc">λῦσον</td></tr>
<tr><th scope="row">2 pl.</th><td lang="grc">λύετε</td><td lang="grc">λύσατε</td></tr>
<tr><th scope="row">3 sg.</th><td lang="grc">λυέτω <small>let him…</small></td><td lang="grc">λυσάτω</td></tr>
<tr><th scope="row">2 sg. middle</th><td lang="grc">λύου</td><td lang="grc">λῦσαι</td></tr></table>
<p>Aspect chooses between the columns: present for ongoing or general commands, aorist for the single act. The Delphic maxims are aorists – <b lang="grc">γνῶθι σεαυτόν</b>, "know thyself" (root aorist of γιγνώσκω): one decisive act of recognition. εἰμί's imperative: ἴσθι, ἔστω ("be!", "let it be" – ἔστω is still the mathematician's "let x be…").</p>
<h3>Prohibitions</h3>
<p class="ruleline">μή + present imperative = stop / don't (as a practice): <span lang="grc">μὴ κλέπτε</span>.<br>μή + aorist subjunctive = don't (this once): <span lang="grc">μὴ κλέψῃς</span>.</p>
<h3>Questions</h3>
<p>Direct questions may be bare (marked only by ;), or flagged: <b lang="grc">ἆρα</b> (neutral), <b lang="grc">ἆρ᾽ οὐ</b> (expecting yes – "surely…?"), <b lang="grc">ἆρα μή / μῶν</b> (expecting no – "surely not…?"), or built on a question word:</p>
<table class="gr"><tr><th lang="grc">τίς;</th><th lang="grc">τί;</th><th lang="grc">ποῦ;</th><th lang="grc">ποῖ;</th><th lang="grc">πόθεν;</th><th lang="grc">πότε;</th><th lang="grc">πῶς;</th><th lang="grc">διὰ τί;</th></tr>
<tr><td>who?</td><td>what? why?</td><td>where?</td><td>whither?</td><td>whence?</td><td>when?</td><td>how?</td><td>why?</td></tr></table>
<p>Each interrogative keeps its own fixed accent: τίς and τί always an acute that never becomes grave, while ποῦ, ποῖ, πῶς and the rest carry the circumflexes and acutes shown above – which distinguishes them from the <i>indefinite</i> enclitics: τις "someone", ποτε "once". <b lang="grc">τί λέγει;</b> "what does he say?" vs <b lang="grc">λέγει τι</b> "he says something".</p>
<p>Indirect questions keep the direct form's tense and may swap τίς for ὅστις: <b lang="grc">ἐρωτᾷ τίς (ὅστις) εἶ</b> – "he asks who you are". Yes/no indirects use εἰ ("whether"), alternatives πότερον … ἤ.</p>
<h3>οὐ vs μή – the grand division</h3>
<table class="gr"><tr><th lang="grc">οὐ</th><th lang="grc">μή</th></tr>
<tr><td>denies facts: indicative statements, assertions</td><td>rejects projections: commands, wishes, purpose, conditions, generic participles &amp; infinitives</td></tr></table>
<p>The compounds pair up likewise: οὐδείς/μηδείς (no one), οὔποτε/μήποτε (never), οὐκέτι/μηκέτι (no longer). Greek piles negatives for emphasis without cancelling: <b lang="grc">οὐδεὶς οὐδὲν λέγει</b> – "nobody says anything".</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ἆρ᾽ οὐκ οἶσθα ὅστις εἶ καὶ πόθεν ἥκεις;</div><p>ἆρ᾽ οὐ – "surely you know…?" Then two stacked indirect questions: ὅστις εἶ ("who you are"), πόθεν ἥκεις ("where you have come from"). The grammar of Socratic conversation in one line.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>λῦσαι again! Here it can also be aorist middle imperative. The count of look-alikes is now three; context has never yet failed a reader.</li><li>τίς (acute, question) vs τις (enclitic, "some"): the accent is the meaning.</li><li>Answering questions: Greek has no one word for "yes" – it echoes the verb (λέγεις; – λέγω, "Do you say so? – I do") or uses ναί, μάλιστα, πάνυ γε.</li></ul></div>`,

  id: "a5", title: "Particles & the shape of a sentence", subtitle: "γάρ, οὖν, δή, τοι: reading Greek the Greek way",
  grammar: `<p class="lead">By now you know nearly all the forms. What separates a decoder from a reader is the layer above the forms: the particles that map each sentence's logic, and a method for walking through a long period without losing the thread. This unit is that method.</p>
<h3>The particle map</h3>
<table class="gr"><tr><th>Particle</th><th>Position</th><th>What it signals</th></tr>
<tr><td lang="grc">δέ</td><td>2nd</td><td>next item – mild "and/but"; the default connector</td></tr>
<tr><td lang="grc">γάρ</td><td>2nd</td><td>what follows explains what preceded</td></tr>
<tr><td lang="grc">οὖν</td><td>2nd</td><td>resuming or concluding: "so, then"</td></tr>
<tr><td lang="grc">δή</td><td>2nd</td><td>emphasis, often with a knowing tone: "precisely, of course"</td></tr>
<tr><td lang="grc">μήν</td><td>2nd</td><td>strong assertion: "truly"; καὶ μήν "moreover, look!"</td></tr>
<tr><td lang="grc">τοι</td><td>2nd, enclitic</td><td>appeal to the listener: "you know, mark you"</td></tr>
<tr><td lang="grc">ἄρα</td><td>2nd</td><td>realisation or inference: "so, as it turns out"</td></tr>
<tr><td lang="grc">γε</td><td>enclitic, after its word</td><td>limiting spotlight: "at least, at any rate"</td></tr>
<tr><td lang="grc">ἀλλά</td><td>1st</td><td>sharp turn: "but, no – "</td></tr>
<tr><td lang="grc">καίτοι</td><td>1st</td><td>"and yet"</td></tr>
<tr><td lang="grc">τοίνυν</td><td>2nd</td><td>"well then" – moving the argument on</td></tr></table>
<p>Particles are the punctuation Greek never wrote and the tone of voice writing cannot carry. δέ strings narrative beads; γάρ opens the explanatory aside; οὖν closes it and resumes; δή winks. A page of Plato conducts you with these signals from thought to thought – once you stop skipping them.</p>
<h3>How to read a long sentence</h3>
<ol><li><b>Ride the articles.</b> Every ὁ/τῶν/τοῖς announces a noun-phrase and its case before the noun arrives.</li>
<li><b>Bank the participles.</b> Circumstantial participles are stage-setting: hold each as "having X-ed…" and wait for the finite verb.</li>
<li><b>μέν opens a bracket; δέ closes it.</b> When you see μέν, expect its partner; the sentence's architecture is symmetrical.</li>
<li><b>The verb is the keystone.</b> Attic likes to withhold it; when it lands, everything banked clicks into place. Resist rearranging into English order too early.</li>
<li><b>Particles are the road signs.</b> γάρ = "explanation coming"; οὖν = "aside over"; ἄρα = "surprise conclusion".</li></ol>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">οἱ μὲν οὖν στρατιῶται, τῶν πολεμίων ἤδη φευγόντων, παυσάμενοι τῆς μάχης πρὸς τὴν θάλατταν κατέβησαν.</div><p>οἱ μέν οὖν – resuming (οὖν) and opening a bracket (μέν) on "the soldiers". Genitive absolute banked: "the enemy now fleeing". Aorist middle participle banked: "having ceased from battle" (παύομαι + genitive). Then the keystone verb: κατέβησαν, "went down". <i>So the soldiers, now that the enemy were fleeing, broke off the fight and went down to the sea.</i> – Nothing here is hard; it is only <i>ordered</i> in the Greek way.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Never translate δή as "indeed" every time – feel for its irony or emphasis; sometimes silence renders it best.</li><li>γε clings to the word before it and limits precisely that word: ἔγωγε "I at least".</li><li>An untranslated particle is not an unread particle: register each one's signal, then let English do without it.</li></ul></div>`,

    { t: "mcq", q: "Which particle CANNOT stand first in its clause?", opts: ["γάρ", "ἀλλά", "καίτοι", "καί"], a: 0, ex: "γάρ (with δέ, οὖν, δή, μέν, τοι, ἄρα…) is postpositive – glued to second position. ἀλλά and καίτοι head their clauses. Position is part of each particle's identity." },

    { t: "fill", q: "τί ___ ποιῶμεν; (what THEN are we to do – the concluding particle).", a: ["οὖν", "ουν"], ex: "οὖν draws the thread together: 'so, then'. τί οὖν; alone – 'well, what then?' – is the perpetual next-step of a Platonic dialogue." },

    { t: "mcq", q: "In the reading method, what should you do when you meet μέν?", opts: ["expect a δέ and hold the two halves as a pair", "translate it as 'indeed' and move on", "stop reading", "assume a question"], a: 0, ex: "μέν is an opened bracket. The sentence promises symmetry; carrying that expectation is what makes long periods navigable rather than baffling." },

    { t: "pick", q: "Click the inference-particle.", s: "θνητὸς ἄρα καὶ ὁ Σωκράτης", a: "ἄρα", ex: "ἄρα marks the conclusion clicking shut: 'so Socrates too is mortal'. The logic-textbook syllogism keeps its Greek accent to this day." },
    { t: "mcq", q: "καὶ μήν at the start of a speaker's turn usually signals:", opts: ["'moreover / look now' – a fresh point or entrance", "denial", "farewell", "a quotation"], a: 0, ex: "In drama καὶ μήν often announces someone's arrival ('and look, here comes…'); in argument, a new supporting point. A stage-direction disguised as grammar." },

{
  id: "a6", title: "Beyond Attic – the dialects & the long afterlife", subtitle: "Homer, Herodotus, Sappho, the Koine: one language, many voices",
  grammar: `<p class="lead">You have learned Attic, the dialect of Athens' golden age – the right base camp. But Greek literature speaks in several voices, and the Reading Room ahead contains four of them. This unit is your field guide: what changes, what stays, and why the differences exist at all.</p>
<h3>Why dialects?</h3>
<p>Greece was never one state. Each city wrote its own Greek; literary genres then froze particular dialects – epic remained Ionic-coloured forever because Homer was; choral lyric stayed Doric; Athens' prestige eventually made Attic the schoolroom norm. All are mutually intelligible siblings.</p>
<h3>Ionic (Herodotus)</h3>
<table class="gr"><tr><th>Attic</th><th>Ionic</th></tr>
<tr><td lang="grc">θάλαττα, γλῶττα</td><td lang="grc">θάλασσα, γλῶσσα</td></tr>
<tr><td lang="grc">χώρα, ἡμέρα</td><td lang="grc">χώρη, ἡμέρη <small>(η even after ρ)</small></td></tr>
<tr><td lang="grc">πράττω</td><td lang="grc">πρήσσω</td></tr></table>
<p>Herodotus reads like Attic with a soft accent – expect η where Attic keeps α, σσ for ττ, and uncontracted vowels (ποιέειν for ποιεῖν).</p>
<h3>Homeric (epic)</h3>
<p>An artificial bardic blend, mainly old Ionic with Aeolic layers. Its signatures:</p>
<ul><li>No syllabic augment required: <b lang="grc">λῦσε</b> for ἔλυσε, βῆ for ἔβη.</li><li>Genitives in -οιο (πολέμοιο), datives in -εσσι, infinitives in -μεν/-μεναι (ἔμμεναι = εἶναι).</li><li>The article is still mostly a demonstrative: ὁ δέ = "but he".</li><li>Tmesis – preverb split from verb: κατὰ δάκρυ χέουσα, "shedding down a tear".</li></ul>
<h3>Aeolic (Sappho, Alcaeus)</h3>
<p>The dialect of Lesbos. Its signatures include <b>characteristically recessive accentuation</b> (apart from the ordinary complications of clitics), even where Attic accents the ending (Aeolic πόταμος beside Attic ποταμός); <b>psilosis</b> – no rough breathing, so no initial h at all; <b>doubled consonants</b> where Attic has a long vowel or diphthong from compensatory lengthening (ἔμμι = εἰμί "I am", σελάννα = σελήνη "moon"); and distinctive small words like κῆνος = ἐκεῖνος "that one". The numeral πέμπε = πέντε "five" preserves a labial where Attic-Ionic developed τ – an old inherited difference, not a swap Aeolic made. You need only enough to read Sappho with notes – and Sappho is worth it.</p>
<h3>The Koine – Greek goes global</h3>
<p>After Alexander (d. 323 BC), a simplified, Attic-based "common" (κοινή) Greek became the lingua franca from Egypt to the Indus. Its drift, visible in the Septuagint and the New Testament:</p>
<ul><li>The optative fades; ἵνα + subjunctive expands (even toward "that" = infinitive's old jobs).</li><li>-μι verbs regularise (δίδω beside δίδωμι); the dual is gone.</li><li>θάλασσα-forms win (Attic ττ loses); vocabulary simplifies: everything is καί … καί … .</li><li>Pronunciation slides toward modern Greek: η, ι, υ, ει, οι converge on "ee" (itacism).</li></ul>
<p>Your Attic reads the Koine with very little friction – the Koine's grammar is largely a subset of what you know, which is a large part of why Attic-first is a sensible road: it gives you the morphological and syntactic foundation from which the other dialects' differences can be learned efficiently, as differences. Koine develops through Byzantine/Medieval Greek into Modern Greek: νερό (water) ultimately continues τὸ νεαρόν (ὕδωρ), "the fresh (water)". Greek has remarkable historical continuity, but Homeric epic is an archaic poetic register, not a form that simply remained unchanged in everyday speech.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">Μῆνιν ἄειδε, θεά, Πηληϊάδεω Ἀχιλῆος</div><p>Homer, Iliad 1.1. μῆνιν – accusative first: "the wrath" is the poem's subject in every sense. ἄειδε – present imperative, uncontracted (Attic ᾆδε): "sing!". θεά – vocative: the Muse. Πηληϊάδεω – Ionic genitive in -εω (Attic -ου): "of the son of Peleus". Ἀχιλῆος – genitive, epic single-λ spelling. You can now parse the most famous line in Greek.</p></div>

  grammar: `<p class="lead">Homer is verse before he is anything else, and the verse is the dactylic hexameter: six metrical feet built from long and short syllables. You learned in the Alphabet stage that Greek hears vowel length; the hexameter is that hearing made music. Learn to feel it and Homer's lines will carry you instead of you carrying them.</p>
<h3>The recipe</h3>
<p>Each of the six feet is either a <b>dactyl</b> (– ⏑ ⏑, long-short-short, like the joints of a finger – δάκτυλος means finger) or a <b>spondee</b> (– –, two longs). The fifth foot is almost always a dactyl; the sixth is always two syllables:</p>
<p class="ruleline">– ⏑⏑ | – ⏑⏑ | – ⏑⏑ | – ⏑⏑ | – ⏑⏑ | – ×</p>
<h3>What makes a syllable long?</h3>
<ul><li><b>By nature:</b> it contains η, ω, a diphthong, or a naturally long α, ι, υ.</li>
<li><b>By position:</b> its vowel – even a short one – is followed by two consonants or a double letter (ζ, ξ, ψ).</li></ul>
<p>As a first-pass rule, a syllable not made long by nature or by position is short. Real scansion adds refinements (correption, where a long vowel before another vowel may scan short; mute-plus-liquid clusters that can leave a syllable short; synizesis), and the reader notes flag these when they bite. But nature and position will carry you through the great majority of feet.</p>
<h3>The first line of the Iliad, scanned</h3>
<p class="ruleline" lang="grc">Μῆνιν ἄειδε, θεά, Πηληϊάδεω Ἀχιλῆος</p>
<p class="ruleline">Μῆ-νιν ἄ- | ει-δε, θε- | ά, Πη- | λη-ϊ-ά- | δεω Ἀ-χι- | λῆ-ος<br>– ⏑⏑ | – ⏑⏑ | – – | – ⏑⏑ | – ⏑⏑ | – ⏑</p>
<p>Μῆ- is long by nature (η); -νιν and ἄ- are short; -ει- long (diphthong); δεω scans as one long syllable (the two vowels slurred together – <b>synizesis</b>). Read it aloud with the rhythm DUM-da-da DUM-da-da DUM-DUM DUM-da-da DUM-da-da DUM-da, and you are chanting as the bards chanted.</p>
<h3>Three habits of the verse</h3>
<ul><li><b>The caesura</b> – a word-break mid-line, usually in the third foot, where the voice takes a breath: Μῆνιν ἄειδε, θεά, ‖ Πηληϊάδεω Ἀχιλῆος.</li>
<li><b>Elision</b> – a final short vowel drops before a following vowel, marked with an apostrophe: μυρί᾽ for μυρία, ἄλγε᾽ for ἄλγεα.</li>
<li><b>Correption</b> – a long vowel at word-end may shorten before a following vowel. File it; do not fret over it.</li></ul>
<div class="tip"><b>Practice.</b> Chant the metrical skeleton (DUM-da-da ×5 + DUM-DUM) until it is a heartbeat, then lay Μῆνιν ἄειδε over it. One line truly owned teaches more scansion than a chapter of theory. The metre will also silently teach you vowel-lengths you never memorised.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Do not scan by stress – scan by length. The written accents mark pitch, not the metre's beat.</li><li>A short vowel before two consonants is long <i>by position</i> though it never changes its sound-quality: ἄν-δρα begins long.</li><li>The apostrophe of elision (μυρί᾽) is not a breathing mark; it hangs at word-end, not over a vowel.</li></ul></div>`,

{
  id: "h2", title: "Homeric grammar I – nouns & pronouns", subtitle: "-οιο, -εσσι, -ηφι: the older endings, and the article that still points",
  grammar: `<p class="lead">Homeric Greek is not broken Attic. It is a <i>Kunstsprache</i> – an artificial poetic language built up over centuries of oral tradition, mainly on old Ionic with Aeolic layers, keeping whatever forms the hexameter found useful, old and new side by side. Many of its endings are older than their Attic counterparts, which Attic later wore smooth; learn to see through them and the familiar declensions reappear underneath.</p>
<h3>The noun: older endings beside the ones you know</h3>
<table class="gr"><tr><th>Function</th><th>Attic</th><th>Homer also uses</th><th>Example</th></tr>
<tr><td>gen. sg. (2nd decl.)</td><td lang="grc">-ου</td><td lang="grc">-οιο</td><td lang="grc">πολέμοιο – of war</td></tr>
<tr><td>gen. sg. (1st decl. masc.)</td><td lang="grc">-ου</td><td lang="grc">-αο / -εω</td><td lang="grc">Πηληϊάδεω</td></tr>
<tr><td>gen. pl. (1st decl.)</td><td lang="grc">-ων</td><td lang="grc">-άων / -έων</td><td lang="grc">θεάων – of goddesses</td></tr>
<tr><td>dat. pl. (3rd decl.)</td><td lang="grc">-σι</td><td lang="grc">-εσσι</td><td lang="grc">κύνεσσι – for dogs</td></tr>
<tr><td>dat. pl. (1st/2nd decl.)</td><td lang="grc">-αις / -οις</td><td lang="grc">-ῃσι / -οισι</td><td lang="grc">θεοῖσι, πύλῃσι</td></tr>
<tr><td>instrumental/locative</td><td>(lost)</td><td lang="grc">-φι</td><td lang="grc">βίηφι – by force</td></tr></table>
<p>Also: place-suffixes <b lang="grc">-δε</b> (whither: οἶκόνδε, homeward), <b lang="grc">-θεν</b> (whence: οὐρανόθεν, from heaven), <b lang="grc">-θι</b> (where: αὐτόθι, on the spot).</p>
<h3>The article is still a pointer</h3>
<p>In Homer ὁ, ἡ, τό is mostly a demonstrative or third-person pronoun, not "the":</p>
<p class="ruleline" lang="grc">ὁ δ᾽ ἤϊε νυκτὶ ἐοικώς. – And HE went, like the night.</p>
<p>τόν, τήν at a clause's start usually mean "him", "her": τὸν δ᾽ ἀπαμειβόμενος… "answering HIM…". Where Attic uses the article as "the", Homer very often uses nothing at all: μῆνιν, not τὴν μῆνιν. The forms τοί and ταί appear beside οἱ and αἱ.</p>
<h3>The epic pronouns you must simply know</h3>
<table class="gr"><tr><th>Epic</th><th>Attic</th><th>Meaning</th></tr>
<tr><td lang="grc">μιν</td><td lang="grc">αὐτόν, αὐτήν</td><td>him, her (acc.)</td></tr>
<tr><td lang="grc">σφι(ν) / σφισι</td><td lang="grc">αὐτοῖς</td><td>to them</td></tr>
<tr><td lang="grc">τοι</td><td lang="grc">σοι</td><td>to you (also the particle 'you know')</td></tr>
<tr><td lang="grc">ἑ, ἕο, εὗ</td><td lang="grc">αὐτόν, αὑτοῦ</td><td>him(self)</td></tr>
<tr><td lang="grc">ἄμμες / ὔμμες</td><td lang="grc">ἡμεῖς / ὑμεῖς</td><td>we / you (Aeolic layer)</td></tr></table>
<h3>Spelling flexibilities</h3>
<p>The bard chooses word-shapes by metrical need: πτόλις beside πόλις, πτόλεμος beside πόλεμος, οὔνομα beside ὄνομα, εἰν beside ἐν. Treat these as the same words in different metrical clothing – because that is what they are.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">βῆ δὲ κατ᾽ Οὐλύμποιο καρήνων</div><p>Οὐλύμποιο – the -οιο genitive of Ὄλυμπος (with the epic spelling Οὔλυμπος for metre): "down from Olympus' peaks" (κάρηνα, heads/peaks). Iliad 1.44: Apollo descending in anger. One old ending, and the line opens.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>-οιο is genitive singular, not some exotic plural: πολέμοιο = πολέμου.</li><li>τοι is two words: the dative "to you" AND the particle "mark you". Metre and sense decide; both are common.</li><li>Do not "correct" Homer to Attic in your head – read the old forms as old, and they quickly become transparent.</li></ul></div>`,

  grammar: `<p class="lead">The epic verb differs from Attic in a handful of systematic ways: archaic retentions, dialectal alternatives, and forms favoured by the metre. Master five recurring habits and a large share of Homeric verb-forms becomes readable.</p>
<h3>1. The augment is optional</h3>
<p>The past-tense ἐ- that Attic demands, the bard adds or omits as metre pleases:</p>
<table class="gr"><tr><th>Homer</th><th>Attic</th><th></th></tr>
<tr><td lang="grc">λῦσε</td><td lang="grc">ἔλυσε</td><td>he released</td></tr>
<tr><td lang="grc">βῆ</td><td lang="grc">ἔβη</td><td>he strode</td></tr>
<tr><td lang="grc">ἔθηκε / θῆκε</td><td lang="grc">ἔθηκε</td><td>he laid</td></tr>
<tr><td lang="grc">ἴδεν / εἶδεν</td><td lang="grc">εἶδεν</td><td>he saw</td></tr></table>
<p>Reading rule: a secondary ending (-ε, -ον, -το…) marks past time even with no augment in sight.</p>
<h3>2. The iterative -εσκ-</h3>
<p>Epic can build a "used to / kept on" form: <b lang="grc">ἔχεσκον</b> "I used to have", <b lang="grc">φύγεσκε</b> "he kept escaping", <b lang="grc">εἴπεσκε</b> "he would say". Recognise -εσκ- and translate with habitual force.</p>
<h3>3. Uncontracted and doubled vowels</h3>
<p>Where Attic melts vowels, epic often leaves them open: ὁράασθαι beside ὁρᾶσθαι, φιλέει beside φιλεῖ, νόος beside νοῦς. Sometimes epic even <i>stretches</i> a contracted form back out for metre (diektasis): ὁρόωντες. The uncontracted spellings are a gift – the verb's anatomy is visible.</p>
<h3>4. Old infinitives and subjunctives</h3>
<ul><li>Infinitives in <b lang="grc">-μεν / -μεναι</b>: ἔμμεν, ἔμμεναι = εἶναι (to be); ἀκουέμεν = ἀκούειν; δόμεναι = δοῦναι.</li>
<li>Short-vowel subjunctives: <b lang="grc">ἴομεν</b> "let us go" where Attic writes ἴωμεν.</li>
<li><b lang="grc">κε(ν)</b> is epic's second ἄν – same particle-force, different shape: εἴ κεν … "if ever…".</li></ul>
<h3>5. εἰμί and friends in epic dress</h3>
<table class="gr"><tr><th>Epic</th><th>Attic</th><th></th></tr>
<tr><td lang="grc">ἐσσί</td><td lang="grc">εἶ</td><td>you are</td></tr>
<tr><td lang="grc">ἔσσεται / ἔσται</td><td lang="grc">ἔσται</td><td>will be</td></tr>
<tr><td lang="grc">ἔην / ἦεν</td><td lang="grc">ἦν</td><td>was</td></tr>
<tr><td lang="grc">ἔασι</td><td lang="grc">εἰσί</td><td>they are</td></tr></table>
<p>And one small giant: <b lang="grc">φάτο</b> (= ἔφη, middle) "he spoke", in the speech-closing formula ὣς φάτο, "so he spoke".</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ὣς ἔφατ᾽ εὐχόμενος, τοῦ δ᾽ ἔκλυε Φοῖβος Ἀπόλλων</div><p>ὣς ἔφατ᾽ – "so he spoke" (middle imperfect of φημί, elided). εὐχόμενος – "praying", the present participle you know. τοῦ – "him", the pointing article-pronoun, genitive after ἔκλυε ("heard him" – verbs of hearing take the genitive, exactly as in Stage Α΄). <i>So he spoke in prayer, and Phoebus Apollo heard him.</i> Iliad 1.43 – every element is course-grammar in older clothes.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>βῆ is not a root or an exclamation: it is unaugmented ἔβη, "he went". Secondary ending = past.</li><li>-εσκε is iterative, not a mood: φύγεσκε, "he kept escaping".</li><li>κε(ν) = ἄν. εἴ κε = ἐάν. Do not hunt the dictionary for a separate word.</li></ul></div>`,

  id: "h4", title: "Formulas, epithets & the singer's craft", subtitle: "Why Achilles is swift-footed even when sitting down",
  grammar: `<p class="lead">Homer's most famous feature is repetition: rosy-fingered Dawn, swift-footed Achilles, the wine-dark sea, and whole lines recurring dozens of times. For centuries readers called it primitive. In the 1920s a young American scholar, Milman Parry, showed it is the opposite: a precision toolkit for composing perfect hexameters <i>live, in performance</i> – and the fingerprint of a poetry composed before writing.</p>
<h3>The economy of formulas</h3>
<p>For each frequently-needed idea (a hero's name, the sea, dawn, speaking), epic keeps a small stock of phrases, each a different metrical shape, so that one fits wherever the line has room:</p>
<table class="gr"><tr><th>Need</th><th>Formula</th><th>Shape/slot</th></tr>
<tr><td>Achilles, end of line</td><td lang="grc">πόδας ὠκὺς Ἀχιλλεύς</td><td>fills the line-end from mid-fourth foot</td></tr>
<tr><td>Achilles, longer slot</td><td lang="grc">ποδάρκης δῖος Ἀχιλλεύς</td><td>a foot earlier</td></tr>
<tr><td>Odysseus</td><td lang="grc">πολύμητις Ὀδυσσεύς · πολύτλας δῖος Ὀδυσσεύς</td><td>two lengths</td></tr>
<tr><td>Hera</td><td lang="grc">θεὰ λευκώλενος Ἥρη · βοῶπις πότνια Ἥρη</td><td>two lengths</td></tr>
<tr><td>dawn comes</td><td lang="grc">ἦμος δ᾽ ἠριγένεια φάνη ῥοδοδάκτυλος Ἠώς</td><td>a whole line</td></tr>
<tr><td>speech begins</td><td lang="grc">καί μιν φωνήσας ἔπεα πτερόεντα προσηύδα</td><td>a whole line</td></tr>
<tr><td>speech ends</td><td lang="grc">ὣς φάτο</td><td>line-opening</td></tr></table>
<p>Parry's decisive observation: the system is <b>thrifty</b>. For each grammatical case and metrical slot there is usually exactly <i>one</i> epithet-phrase per hero – no wasteful synonyms. That is the signature of a tradition engineered by generations of performing singers, not of one writer's stylistic whim.</p>
<h3>Reading epithets well</h3>
<p>The epithet is <i>ornamental</i> – it belongs to the character, not the moment. Ships are "swift" while beached; Achilles is "swift-footed" while sulking in his tent. Do not squeeze irony from every occurrence; the epithet is the hero's heraldry, and its stability is the point. (And then, once in a while, the poet <i>does</i> aim it: when "swift-footed" Achilles finally runs down Hector, the old badge blazes.)</p>
<h3>Type-scenes</h3>
<p>Larger units repeat too: arming for battle, sacrifice and feast ("they put their hands to the good things lying ready"), hospitality (bathe the guest, feed him, only then ask his name), supplication. The audience knew the template; the artistry lives in each retelling's variations – an arming scene stretched to four lines for a minor fighter becomes sixty for Achilles.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">ἦμος δ᾽ ἠριγένεια φάνη ῥοδοδάκτυλος Ἠώς</div><p>ἦμος δ᾽ – "and when…"; ἠριγένεια – "early-born"; φάνη – unaugmented aorist passive of φαίνω (Stage Β΄'s ἐφάνην!), "appeared"; ῥοδοδάκτυλος Ἠώς – "rosy-fingered Dawn". <i>And when early-born rosy-fingered Dawn appeared…</i> This line opens the day some twenty times in the Odyssey – a sunrise the audience could sing along to.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Do not translate a fixed epithet with fresh emphasis every time ("the notably swift-footed…"); once established, it should read like a surname.</li><li>Repetition in Homer is structure, not laziness: cutting it in translation cuts the architecture.</li><li>πολύτροπον, πολύμητις, πολύτλας – the πολυ- compounds are characterisation in a single word; slow down for them.</li></ul></div>`,

  grammar: `<p class="lead">Half of reading Homer fluently is a modest stock of words that Attic prose rarely uses but epic cannot do without: connective particles, older pronouns, and the great nouns of the heroic world. This unit is that word-hoard – learn it and the density of glosses you need per line collapses.</p>
<h3>The epic connectives</h3>
<table class="gr"><tr><th>Word</th><th>Meaning</th><th>Attic feel</th></tr>
<tr><td lang="grc">αὐτάρ / ἀτάρ</td><td>but, then, next</td><td>δέ writ large</td></tr>
<tr><td lang="grc">ἠδέ</td><td>and</td><td>καί</td></tr>
<tr><td lang="grc">ἠμέν … ἠδέ</td><td>both … and</td><td>τε … καί</td></tr>
<tr><td lang="grc">ἄρα / ῥα / ἄρ</td><td>so, then, as you'd expect</td><td>the story-glue particle</td></tr>
<tr><td lang="grc">περ</td><td>even, though (enclitic)</td><td>καίπερ's live half</td></tr>
<tr><td lang="grc">τε (generalising)</td><td>(marks a general truth)</td><td>untranslated</td></tr>
<tr><td lang="grc">ἦμος … τῆμος</td><td>when … then</td><td>ὅτε … τότε</td></tr></table>
<h3>The heroic lexicon</h3>
<table class="gr"><tr><th>Epic</th><th>Meaning</th><th>Attic says</th></tr>
<tr><td lang="grc">ἄναξ, ἄνακτος</td><td>lord, king</td><td lang="grc">βασιλεύς</td></tr>
<tr><td lang="grc">δῶμα / δόμος</td><td>house, hall</td><td lang="grc">οἰκία</td></tr>
<tr><td lang="grc">μέγαρον</td><td>great hall</td><td>– </td></tr>
<tr><td lang="grc">φρήν, φρενός / θυμός / κῆρ</td><td>mind / spirit / heart</td><td lang="grc">ψυχή, νοῦς</td></tr>
<tr><td lang="grc">ἠΰς / ἐσθλός</td><td>good, noble</td><td lang="grc">ἀγαθός</td></tr>
<tr><td lang="grc">αὐδάω / προσαυδάω</td><td>speak (to)</td><td lang="grc">λέγω πρός</td></tr>
<tr><td lang="grc">ἔγχος / δόρυ</td><td>spear</td><td>– </td></tr>
<tr><td lang="grc">κλέος</td><td>fame, glory (what the song preserves)</td><td lang="grc">δόξα</td></tr>
<tr><td lang="grc">νόστος</td><td>homecoming</td><td>– </td></tr>
<tr><td lang="grc">ξεῖνος</td><td>guest-friend, stranger (Attic ξένος)</td><td lang="grc">ξένος</td></tr></table>
<p>Two of these are worth a pause. <b lang="grc">κλέος ἄφθιτον</b>, "imperishable fame", is what Achilles trades his life for – a phrase with exact cognates in Sanskrit poetry, meaning the ideal is older than Greek itself. And <b lang="grc">νόστος</b>, homecoming, names the Odyssey's whole genre; joined to ἄλγος (pain) it later made "nostalgia".</p>
<h3>Tmesis – the preverb set free</h3>
<p>In Homer a compound verb's prefix often floats apart from its verb: <b lang="grc">κατὰ δάκρυ χέουσα</b> – "pouring down a tear" (= καταχέουσα δάκρυ). This is not violence to the compound: the compounds had not yet fused when the epic language formed. Read prefix and verb as partners across the gap.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="grc">αὐτὰρ ὁ τοῖσιν ἀφείλετο νόστιμον ἦμαρ</div><p>αὐτάρ – "but"; ὁ – "he" (the pointing article); τοῖσιν – "from them" (epic dative); ἀφείλετο – "took away" (aorist middle of ἀφαιρέω); νόστιμον ἦμαρ – "the day of homecoming" (ἦμαρ = epic for ἡμέρα). <i>But he took from them their homecoming day.</i> Odyssey 1.9 – the crew's doom in six words, nearly all of them from this unit.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>ἄρα rarely needs translating; it is narrative lubricant ("so, then, as it turned out"). Register it, drop it.</li><li>θυμός, φρήν, κῆρ overlap but are not identical: θυμός is the surging spirit, φρένες the deliberating mind, κῆρ the feeling heart.</li><li>ξεῖνος means guest-friend under divine protection – 'stranger' is too cold; Zeus ξένιος guards the relationship.</li></ul></div>`,

  grammar: `<p class="lead">Everything converges here. You will now walk through the openings of both poems clause by clause – not as quotations to admire but as Greek to <i>parse</i> – and then set a course for reading beyond this app. The chaptered <b>First Homer Reader</b> in the Reading Room is this unit's companion: open it when you finish.</p>
<h3>The Iliad's proem, grammatically</h3>
<p class="ruleline" lang="grc">Μῆνιν ἄειδε, θεά, Πηληϊάδεω Ἀχιλῆος οὐλομένην…</p>
<ul><li><b lang="grc">Μῆνιν</b> – accusative first: the poem's subject-matter fronted. Not just anger: μῆνις is wrath of cosmic register, elsewhere reserved for gods.</li>
<li><b lang="grc">ἄειδε</b> – present imperative to the Muse: the poet begins by claiming his song is received, not invented.</li>
<li><b lang="grc">Πηληϊάδεω Ἀχιλῆος</b> – two genitives (epic -εω; single-λ Ἀχιλῆος for metre) hanging on Μῆνιν.</li>
<li><b lang="grc">οὐλομένην</b> – the enjambed adjective: "ruinous" lands at the next line's start like a verdict. Then the relative clause ἣ … ἔθηκε ("which laid countless woes"), the κ-aorist of τίθημι you know.</li></ul>
<h3>The Odyssey's proem, grammatically</h3>
<p class="ruleline" lang="grc">Ἄνδρα μοι ἔννεπε, Μοῦσα, πολύτροπον, ὃς μάλα πολλὰ πλάγχθη…</p>
<ul><li><b lang="grc">Ἄνδρα</b> – again the object fronted: a MAN (unnamed for twenty lines – the poem withholds Ὀδυσσεύς like a riddle).</li>
<li><b lang="grc">μοι</b> – "for me": the singer inserts himself with a dative the length of a breath.</li>
<li><b lang="grc">πολύτροπον</b> – "of many turns": travels and tricks in one epithet; the poem in one word.</li>
<li><b lang="grc">πλάγχθη</b> – unaugmented aorist passive (= ἐπλάγχθη): "was driven wandering". Your Β΄7 passive plus your Ε΄3 augment-rule, in line two of the Odyssey.</li></ul>
<p>Notice what the two openings share: object first, an imperative to the Muse, the theme compressed into the opening word – wrath; a man. Every epic since, from Vergil's <i>arma virumque cano</i> onward, argues with these two sentences.</p>
<h3>How to keep reading after this course</h3>
<ol><li><b>Start where the commentary is thickest.</b> Standard school texts of Iliad 1 and Odyssey 1, 6, 9 exist precisely for readers at your stage – Steadman's editions (free online) gloss every uncommon word below the text; Draper's Iliad 1 and Pharr's <i>Homeric Greek</i> are classic ladders.</li>
<li><b>Use Perseus and Scaife.</b> Every word of Homer is a click away from its parse and dictionary entry; the links under each Reading-Room text lead there.</li>
<li><b>Read aloud, in metre, daily.</b> Twenty lines a day beats two hundred on Sunday. The formulas will begin completing themselves – that is the tradition working in you, exactly as it worked in its first audiences.</li>
<li><b>Keep the SRS running.</b> Add each reading's glossary to your flashcards; the epic word-hoard compounds fast.</li></ol>
<div class="tip"><b>Your graduation text.</b> Open the <b>First Homer Reader</b> in the Reading Room: six chapters, all real Homer – both proems, the plague of Iliad 1, Zeus' nod, the great formulas, and the leaves of Glaucus. When its last chapter is marked read, you are no longer studying towards Homer. You are reading him.</div>`,

{
  id: "c2", title: "Ἐν τῇ ἀγορᾷ – In the agora", author: "Controlled Greek", work: "Original graded reading", level: "First Steps", kind: "Controlled",
  text: "ἐν τῇ ἀγορᾷ πολλοὶ ἄνθρωποί εἰσιν· οἱ μὲν πωλοῦσιν, οἱ δὲ ἀγοράζουσιν. ὁ γεωργὸς ἐλάας καὶ οἶνον καὶ σῦκα πωλεῖ. ὁ δὲ ναύτης ἐκ τῆς θαλάττης ἥκει καὶ θαυμαστοὺς λόγους λέγει· «ἐν ταῖς νήσοις καλαὶ οἰκίαι εἰσί, καὶ ἐν τῇ θαλάττῃ δεινὰ ζῷα.»\nοἱ μὲν ἄνθρωποι τοὺς τοῦ ναύτου λόγους ἡδέως ἀκούουσιν· ὁ δὲ σοφὸς οὐ πιστεύει. «οἱ ναῦται,» λέγει, «ἀεὶ θαυμαστὰ λέγουσιν.» ἔπειτα οἱ μὲν πρὸς τὰς οἰκίας βαίνουσιν, οἱ δὲ ἐν τῇ ἀγορᾷ μένουσιν. ἡ γὰρ ἀγορὰ τοῖς ἀνθρώποις φίλη ἐστίν· ἐνταῦθα γὰρ καὶ ἀγοράζουσι καὶ λέγουσι καὶ ἀκούουσιν.",
  translation: "In the agora there are many people: some are selling, others buying. The farmer sells olives and wine and figs. And the sailor has come from the sea and tells amazing tales: 'On the islands there are beautiful houses, and in the sea terrible creatures.' The people listen to the sailor's words with pleasure; but the wise man does not believe. 'Sailors,' he says, 'always tell amazing things.' Then some walk off to their houses, others stay in the agora. For the agora is dear to the people: there they buy, and talk, and listen.",
  gloss: { "πωλοῦσιν": "they sell", "ἀγοράζουσιν": "they buy (from ἀγορά itself)", "σῦκα": "figs", "ναύτης": "sailor (masc. noun of the 1st declension)", "ἥκει": "has come, is here", "θαυμαστοὺς": "amazing, marvellous", "δεινὰ": "terrible, strange, uncanny", "ζῷα": "animals, creatures", "ἡδέως": "gladly, with pleasure", "πιστεύει": "believes, trusts (+ dat.)", "ἐνταῦθα": "there, in that place" },
  notes: ["οἱ μὲν … οἱ δέ – bare articles with μέν/δέ: 'some … others'. This tiny idiom organises the whole first paragraph.",
    "τοὺς τοῦ ναύτου λόγους – a double sandwich: the genitive phrase τοῦ ναύτου sits inside τοὺς … λόγους.",
    "ναύτης belongs to the small class of masculine first-declension nouns (like στρατιώτης, πολίτης, ποιητής): feminine-looking endings, masculine article.",
    "δεινός is a word to watch through this course: 'terrible', 'strange', and eventually 'clever' – Sophocles' famous chorus calls man the δεινότατον of all things."],
  license: "Original composition for this course, written within Stage Α΄ grammar. Free to reuse."
},
{
  id: "c3", title: "Ὁ διδάσκαλος – The teacher", author: "Controlled Greek", work: "Original graded reading", level: "Core Morphology", kind: "Controlled",
  text: "διδάσκαλος ἦν ἐν τῇ πόλει, γέρων σοφός. ὁ γέρων τοὺς παῖδας τὰ γράμματα ἐδίδασκεν. οἱ παῖδες τῷ διδασκάλῳ ἐπείθοντο· τὸν γὰρ γέροντα ἐφίλουν. πολλὰ δὲ πράγματα ἐμάνθανον· τὰ ὀνόματα τῶν θεῶν, τοὺς νόμους τῆς πόλεως, τοὺς λόγους τῶν ποιητῶν.\nνυκτὸς δὲ ὁ διδάσκαλος μόνος ἔμενε καὶ τὰ βιβλία ἀνεγίγνωσκεν. ἡμέρας δὲ πάλιν ἐδίδασκεν. οἱ δὲ τῶν παίδων πατέρες χάριν εἶχον τῷ γέροντι· «σὺ γάρ,» ἔλεγον, «τοὺς παῖδας ἀγαθοὺς ποιεῖς. ἡ γὰρ παιδεία ἀρχὴ τῆς ἀρετῆς ἐστιν.»",
  translation: "There was a teacher in the city, a wise old man. The old man taught the children their letters. The children obeyed the teacher, for they loved the old man. And they learned many things: the names of the gods, the laws of the city, the words of the poets. At night the teacher stayed alone and read his books. By day he taught again. And the children's fathers were grateful to the old man. 'For you,' they said, 'make the children good. Education is the beginning of excellence.'",
  gloss: { "ἐδίδασκεν": "was teaching, used to teach (imperfect – his life's routine)", "ἐπείθοντο": "obeyed (middle of πείθω + dat.)", "ἐφίλουν": "they loved (imperfect of φιλέω)", "ἐμάνθανον": "they were learning", "ποιητῶν": "of the poets", "μόνος": "alone", "ἀνεγίγνωσκεν": "used to read (compound: augment inside, ἀν-ε-γίγνωσκεν)", "πάλιν": "again", "πατέρες": "fathers (πατήρ, πατρός)", "χάριν εἶχον": "were grateful (idiom: 'held gratitude' + dat.)", "παιδεία": "education, upbringing" },
  notes: ["Nearly every verb is imperfect: this is a portrait of habitual life, not a story of events. One aorist would change the genre.",
    "νυκτός … ἡμέρας – bare genitives of time within which: 'by night … by day'.",
    "Third-declension forms from Stage Β΄ are everywhere: γέροντα, πράγματα, ὀνόματα, πόλεως, πατέρες, χάριν.",
    "ἀνεγίγνωσκεν shows the compound augment: ἀνα + ε + γιγνωσκ- with the prefix's vowel elided."],
  license: "Original composition for this course, written within Stage Β΄ grammar. Free to reuse."
},
{
  id: "c4", title: "Οἱ ναῦται – The sailors", author: "Controlled Greek", work: "Original graded reading", level: "Core Morphology", kind: "Controlled",
  text: "οἱ ναῦται ἅμα τῇ ἡμέρᾳ ἐκ τοῦ λιμένος ἐξέπλευσαν. πρῶτον μὲν καλὸς ἦν ὁ πλοῦς· ἔπειτα δὲ χειμὼν ἐγένετο, καὶ ὁ ἄνεμος δεινὸς ἦν. οἱ μὲν ναῦται ἐφοβοῦντο, ὁ δὲ κυβερνήτης ἐβόησεν· «ὦ φίλοι, ἡ τέχνη ἡμᾶς σώσει.» οἱ οὖν ναῦται τῷ κυβερνήτῃ ἐπείθοντο καὶ σὺν πολλῷ πόνῳ τὴν ναῦν ἐφύλαττον.\nτέλος δὲ ὁ μὲν ἄνεμος ἐπαύσατο, ἡ δὲ θάλαττα πάλιν ἡσυχίαν εἶχεν. οἱ ναῦται εἰς τὸν λιμένα ἦλθον καὶ τοῖς θεοῖς ἔθυσαν· «ὑμεῖς γάρ,» εἶπον, «ἡμᾶς ἐκ τοῦ κινδύνου ἐσώσατε.» ὁ δὲ κυβερνήτης ἐγέλασε καὶ εἶπεν· «οἱ θεοὶ καὶ ἡ τέχνη.»",
  translation: "At daybreak the sailors sailed out of the harbour. At first the voyage was fair; then a storm arose, and the wind was terrible. The sailors were afraid, but the helmsman shouted: 'Friends, our skill will save us!' So the sailors obeyed the helmsman, and with much labour kept the ship safe. At last the wind ceased, and the sea was calm again. The sailors came into the harbour and sacrificed to the gods. 'For you,' they said, 'saved us from danger.' But the helmsman laughed and said: 'The gods – and skill.'",
  gloss: { "ἅμα τῇ ἡμέρᾳ": "at daybreak (idiom: 'together with the day')", "λιμένος": "harbour (λιμήν, λιμένος)", "ἐξέπλευσαν": "sailed out (aorist of ἐκπλέω)", "πλοῦς": "voyage", "χειμὼν": "storm; winter", "ἐγένετο": "arose, came about (aorist of γίγνομαι)", "ἄνεμος": "wind", "ἐφοβοῦντο": "were afraid (imperfect middle)", "κυβερνήτης": "helmsman, pilot – whence 'govern' and 'cybernetics'", "ἐβόησεν": "shouted (aorist of βοάω)", "πόνῳ": "labour, toil (dat.)", "ναῦν": "ship (acc. of ναῦς)", "ἐπαύσατο": "ceased (aorist middle of παύω)", "ἔθυσαν": "they sacrificed (aorist of θύω)", "ἐγέλασε": "laughed (aorist of γελάω)" },
  notes: ["Aspect on display: the storm's events are aorists (ἐγένετο, ἐβόησεν, ἐπαύσατο), the continuing states imperfects (ἦν, ἐφοβοῦντο, ἐφύλαττον, εἶχεν).",
    "ἐπαύσατο – the middle of παύω from Stage Β΄: the wind 'ceased' of itself.",
    "κυβερνήτης: the steersman's title travelled from Greek to Latin (gubernator) to English 'governor' – and back to Greek roots again in 'cybernetics'.",
    "ἅμα τῇ ἡμέρᾳ is Xenophon's standard phrase for dawn departures; you will meet it again in the Anabasis reading."],
  license: "Original composition for this course, written within Stage Β΄ grammar. Free to reuse."
},
{
  id: "c5", title: "Ἐπιστολὴ στρατιώτου – A soldier's letter", author: "Controlled Greek", work: "Original graded reading", level: "Core Morphology", kind: "Controlled",
  text: "ὁ στρατιώτης τῇ μητρὶ ἐπιστολὴν ἔγραψεν·\n«χαῖρε, ὦ μῆτερ. ἤλθομεν διὰ χώρας μακρᾶς καὶ ὀρῶν δεινῶν. εἴδομεν πόλεις πολλὰς καὶ ποταμοὺς βαθεῖς. οἱ βάρβαροι ἐμαχέσαντο μὲν ἀνδρείως, ἡμεῖς δὲ ἐνικήσαμεν. νῦν δὲ εἰρήνην ἔχομεν, καὶ ἐγὼ ὑγιαίνω. μετὰ δὲ τὸν πόλεμον οἴκαδε ἥξω καὶ σὲ πάλιν ὄψομαι. ἐλπίδα οὖν ἀγαθὴν ἔχε.»\nἡ δὲ μήτηρ τὴν ἐπιστολὴν πολλάκις ἀνεγίγνωσκεν· ἅμα μὲν γὰρ ἔχαιρεν, ἅμα δὲ ἐφοβεῖτο. ἡ γὰρ τῶν μητέρων ψυχὴ ἀεὶ περὶ τῶν παίδων φροντίζει.",
  translation: "The soldier wrote a letter to his mother: 'Greetings, mother. We marched through a long country and over terrible mountains. We saw many cities and deep rivers. The barbarians fought bravely, but we conquered. Now we have peace, and I am well. After the war I shall come home and see you again. So keep good hope.' And the mother read the letter many times over: for she rejoiced and feared at once. A mother's soul is always anxious about her children.",
  gloss: { "μητρὶ": "mother (dat. of μήτηρ)", "ἔγραψεν": "wrote (aorist)", "ἤλθομεν": "we came/marched (aorist of ἔρχομαι)", "ὀρῶν": "mountains (gen. pl. of ὄρος)", "εἴδομεν": "we saw (aorist of ὁράω)", "ποταμοὺς": "rivers", "βαθεῖς": "deep", "βάρβαροι": "barbarians – non-Greek speakers, whose speech sounded like 'bar-bar'", "ἐμαχέσαντο": "fought (aorist of μάχομαι)", "ἀνδρείως": "bravely, manfully", "ὑγιαίνω": "I am healthy – whence 'hygiene'", "οἴκαδε": "homeward", "ὄψομαι": "I shall see (future of ὁράω)", "πολλάκις": "many times, often", "φροντίζει": "is anxious, gives thought (περί + gen.)" },
  notes: ["The letter itself is nearly all aorists – events of the campaign, each viewed whole. The frame around it returns to imperfects (ἀνεγίγνωσκεν, ἔχαιρεν, ἐφοβεῖτο): her reading and feeling are ongoing.",
    "ὄψομαι and ἥξω – future forms from the end of Stage Β΄; ὁράω's future is middle in form.",
    "ἔχε – 'keep, hold!': a present imperative, glossed here ahead of its formal introduction in Stage Δ΄.",
    "βάρβαρος is onomatopoeic, not (originally) pejorative: those whose speech sounded like 'bar-bar'. Herodotus uses it of the Persians with respect."],
  license: "Original composition for this course, written within Stage Β΄ grammar. Free to reuse."
},
{
  id: "c6", title: "Ἡ ἑορτή – The festival", author: "Controlled Greek", work: "Original graded reading", level: "Core Morphology", kind: "Controlled",
  text: "αὔριον ἐν τῇ πόλει ἑορτὴ ἔσται. οἱ πολῖται τοὺς θεοὺς τιμήσουσιν· πέμψουσι γὰρ πομπὴν πρὸς τὸ ἱερόν, καὶ οἱ ἱερῆς θύσουσιν. οἱ μὲν παῖδες χορεύσουσιν, αἱ δὲ κόραι στεφάνους οἴσουσιν. ἔπειτα οἱ πολῖται δεῖπνον ἕξουσι καὶ οἶνον πίονται.\nὁ δὲ γέρων τοῖς παισὶ λέγει· «καλὴ ἡ ἑορτή. ἐν γὰρ ταῖς ἑορταῖς τὴν πόλιν αὐτὴν ὁρῶμεν· οἱ γὰρ πολῖται ἓν γίγνονται. καὶ ὑμεῖς, ὦ παῖδες, ταῦτα μαθήσεσθε καὶ τοῖς παισὶ τοῖς ὑμετέροις παραδώσετε. οὕτω γὰρ αἱ πόλεις σῴζονται.»",
  translation: "Tomorrow there will be a festival in the city. The citizens will honour the gods: they will send a procession to the temple, and the priests will sacrifice. The boys will dance, and the girls will carry garlands. Then the citizens will hold a feast and drink wine. And the old man says to the children: 'The festival is a fine thing. For in festivals we see the city itself: the citizens become one. And you, children, will learn these things and hand them on to your own children. That is how cities are preserved.'",
  gloss: { "αὔριον": "tomorrow", "ἑορτὴ": "festival, feast", "ἔσται": "will be (future of εἰμί)", "πομπὴν": "procession – whence 'pomp'", "ἱερόν": "temple, sanctuary", "ἱερῆς": "priests (nom. pl. of ἱερεύς)", "χορεύσουσιν": "will dance (χορός: dance, chorus)", "στεφάνους": "garlands, crowns – whence the name Stephen", "οἴσουσιν": "will carry (suppletive future of φέρω)", "πίονται": "will drink (future of πίνω, middle in form)", "ἓν": "one (neuter of εἷς)", "μαθήσεσθε": "you will learn (future of μανθάνω)", "παραδώσετε": "you will hand over/on (future of παραδίδωμι)", "οὕτω": "thus, in this way" },
  notes: ["A future-tense text: ἔσται, τιμήσουσιν, πέμψουσι, θύσουσιν, χορεύσουσιν, οἴσουσιν – including the irregular futures of εἰμί, φέρω, πίνω and μανθάνω, which are best met early and often.",
    "οἴσουσιν: φέρω's future comes from a different root entirely (οἰ-), like English go/went.",
    "τὴν πόλιν αὐτήν – 'the city itself': αὐτός in predicate position, previewing Stage Γ΄.",
    "παραδώσετε – 'you will hand on': the same παραδίδωμι that gives παράδοσις, 'tradition'."],
  license: "Original composition for this course, written within Stage Β΄ grammar (with two Stage Γ΄ forms glossed). Free to reuse."
},
{
  id: "c7", title: "Ὁ φιλόσοφος – The philosopher", author: "Controlled Greek", work: "Original graded reading", level: "Syntax", kind: "Controlled",
  text: "ἦν ἐν τῇ πόλει φιλόσοφός τις. οὗτος ὁ ἀνὴρ πλοῦτον μὲν οὐκ εἶχεν, σοφίαν δὲ ἐζήτει. καθ᾽ ἡμέραν δὲ ἐν τῇ ἀγορᾷ μένων τοὺς πολίτας ἠρώτα· «τί ἐστιν ἡ ἀρετή; τί ἡ δικαιοσύνη;» οἱ μὲν ἀπεκρίνοντο, οἱ δὲ ἐγέλων, οἱ δὲ ὠργίζοντο.\nὁ δὲ φιλόσοφος οὐκ ἐπαύετο ζητῶν. «νομίζω γάρ,» ἔφη, «τὸν βίον ἄνευ τοῦ ζητεῖν οὐδενὸς ἄξιον εἶναι. ὁ μὲν γὰρ πλοῦτος ἀπολείπει τοὺς ἀνθρώπους, ἡ δὲ σοφία ἀεὶ μένει.» νυκτὸς δὲ γενομένης οἴκαδε ἀπῆλθεν, οὐδὲν μὲν ἔχων, πολλὰ δὲ μαθών.",
  translation: "There was in the city a certain philosopher. This man had no wealth, but he sought wisdom. Every day, staying in the agora, he would ask the citizens: 'What is virtue? What is justice?' Some answered, some laughed, some grew angry. But the philosopher did not stop seeking. 'For I believe,' he said, 'that life without seeking is worth nothing. Wealth abandons men, but wisdom remains always.' And when night had fallen he went off home – having nothing, but having learned much.",
  gloss: { "τις": "a certain, some (enclitic indefinite)", "οὗτος": "this (demonstrative, predicate position)", "καθ᾽ ἡμέραν": "every day, daily", "μένων": "staying (present participle)", "ἠρώτα": "kept asking (imperfect of ἐρωτάω)", "δικαιοσύνη": "justice, righteousness", "ἀπεκρίνοντο": "answered (imperfect of ἀποκρίνομαι)", "ὠργίζοντο": "grew angry", "ἐπαύετο ζητῶν": "stopped seeking (παύομαι + participle)", "ἔφη": "he said (from φημί)", "ἄνευ": "without (+ gen.)", "τοῦ ζητεῖν": "seeking (articular infinitive)", "οὐδενὸς ἄξιον": "worth nothing (gen. of value)", "γενομένης": "having come about (aorist participle – genitive absolute)", "μαθών": "having learned (aorist participle of μανθάνω)" },
  notes: ["Stage Γ΄ machinery throughout: the participles μένων, ζητῶν, ἔχων, μαθών; the genitive absolute νυκτὸς γενομένης; indirect statement with νομίζω + accusative and infinitive; the articular infinitive τοῦ ζητεῖν.",
    "The closing pair οὐδὲν μὲν ἔχων, πολλὰ δὲ μαθών balances a present participle of state against an aorist participle of achievement.",
    "The portrait is Socratic without naming Socrates; his own formulation – 'the unexamined life is not worth living for a human being' (ὁ ἀνεξέταστος βίος οὐ βιωτὸς ἀνθρώπῳ) – awaits you in the Apology.",
    "οἱ μὲν … οἱ δὲ … οἱ δέ: the μέν/δέ chain can run to three or more members."],
  license: "Original composition for this course, written within Stage Γ΄ grammar. Free to reuse."
},
{
  id: "c8", title: "Περὶ τῶν ἄστρων – On the stars", author: "Controlled Greek", work: "Original graded reading", level: "Syntax", kind: "Controlled",
  text: "οἱ μὲν παλαιοὶ ἐνόμιζον τοὺς ἀστέρας θεοὺς εἶναι· ἔλεγον γὰρ ὅτι οἱ θεοὶ ἐν τῷ οὐρανῷ οἰκοῦσιν. οἱ δὲ φιλόσοφοι νυκτὸς τοὺς ἀστέρας ὁρῶντες ἐζήτουν ἵνα τὴν ἀλήθειαν μανθάνωσιν· «διὰ τί οἱ μὲν ἀστέρες ἀεὶ τὴν αὐτὴν ὁδὸν ἔχουσιν, ἡ δὲ σελήνη ἀεὶ μεταβάλλει;»\nκαὶ ὁ μὲν Θαλῆς ἔφη ὕδωρ εἶναι τὴν τῶν πάντων ἀρχήν, ὁ δὲ Ἡράκλειτος τὸ πῦρ. ἡμεῖς δὲ ταῦτα οὔπω σαφῶς γιγνώσκομεν. δεῖ οὖν ἀεὶ ζητεῖν, ἵνα σοφοὶ γιγνώμεθα· ὁ γὰρ οὐρανὸς μέγα βιβλίον ἐστίν, ὃ οἱ θεοὶ τοῖς ἀνθρώποις ἅπαξ ἔδειξαν; οὐχί· ἀλλὰ πᾶσιν ἀνθρώποις ἀεὶ ἀνεῳγμένον κεῖται.",
  translation: "The ancients believed that the stars were gods, for they said that the gods dwell in the sky. But the philosophers, watching the stars by night, kept searching in order to learn the truth: 'Why do the stars always keep the same path, while the moon is always changing?' And Thales said that water was the origin of all things; Heraclitus, fire. We do not yet know these things clearly. So one must always keep seeking, in order that we may become wise: for the sky is a great book – not one the gods showed to men once, but one that lies open to all people, always.",
  gloss: { "παλαιοὶ": "the ancients, people of old", "ἀστέρας": "stars (acc. pl. of ἀστήρ)", "ὁρῶντες": "watching (participle of ὁράω)", "ἵνα": "in order that (+ subjunctive)", "μανθάνωσιν": "they may learn (subjunctive)", "σελήνη": "moon", "μεταβάλλει": "changes", "Θαλῆς": "Thales of Miletus, first of the philosophers", "Ἡράκλειτος": "Heraclitus of Ephesus", "πῦρ": "fire", "οὔπω": "not yet", "σαφῶς": "clearly", "γιγνώμεθα": "we may become (subjunctive)", "ἀνεῳγμένον": "opened, standing open (perfect participle)", "κεῖται": "lies" },
  notes: ["Purpose clauses with ἵνα + subjunctive twice (μανθάνωσιν, γιγνώμεθα), and indirect statement in both constructions: ὅτι + indicative after ἔλεγον, accusative + infinitive after ἐνόμιζον and ἔφη.",
    "The rhetorical self-correction (οὐχί· ἀλλὰ …) is a genuine Greek mannerism – the writer stages a wrong thought to reject it.",
    "Thales and Heraclitus reappear with their own words in the Reading Room and in the history chapters.",
    "ἀνεῳγμένον κεῖται – 'lies open': a perfect participle of state, glossed ahead of Stage Δ΄."],
  license: "Original composition for this course, written within Stage Γ΄ grammar (one Stage Δ΄ form glossed). Free to reuse."
},
{
  id: "c9", title: "Ἡ ἐκκλησία – The assembly", author: "Controlled Greek", work: "Original graded reading", level: "Reading Greek", kind: "Controlled",
  text: "οἱ Ἀθηναῖοι ἐκκλησίαν ἐποίησαν περὶ πολέμου καὶ εἰρήνης. πρῶτος δὲ ἀνέστη ῥήτωρ νέος, ὃς ἔφη δεῖν εὐθὺς μάχεσθαι· «ἐὰν γὰρ νῦν μὴ μαχώμεθα,» ἔφη, «ὕστερον μετανοήσομεν. οἱ γὰρ πολέμιοι ἀσθενεῖς εἰσιν· ἡ δὲ τύχη τοῖς τολμῶσι δίδωσι τὴν νίκην.»\nἔπειτα δὲ γέρων ἀνέστη καὶ εἶπεν· «ὦ ἄνδρες, ὁ πόλεμος πολλὰ μὲν λαμβάνει, ὀλίγα δὲ δίδωσιν. εἰ τὴν εἰρήνην φυλάττοιμεν, εὐδαίμονες ἂν εἴημεν· εἰ δὲ πόλεμον ποιοῖμεν, τίς οἶδεν εἰ σωθησόμεθα; μὴ γένοιτο πεῖραν λαβεῖν. μηδεὶς οὖν ταχέως ψηφιζέσθω· ἡ γὰρ σπουδὴ κακὴ σύμβουλος.» τέλος δὲ ὁ δῆμος τοὺς τοῦ γέροντος λόγους ἐδέξατο καὶ τὴν εἰρήνην ἐψηφίσατο.",
  translation: "The Athenians held an assembly about war and peace. First there rose a young orator, who said they must fight at once: 'If we do not fight now,' he said, 'we shall repent later. The enemy are weak – and fortune gives victory to the daring.' Then an old man rose and said: 'Gentlemen, war takes much and gives little. If we were to keep the peace, we would be happy; if we were to make war – may we never learn by experience! Let no one, then, vote in haste: haste is a bad counsellor.' In the end the people accepted the old man's words and voted for peace.",
  gloss: { "ἐκκλησίαν": "assembly (of the citizens) – later 'church'", "ἀνέστη": "stood up, rose (intransitive aorist of ἀνίστημι)", "ῥήτωρ": "orator, public speaker", "δεῖν": "that it is necessary (infinitive of δεῖ, in indirect statement)", "εὐθὺς": "at once, immediately", "μαχώμεθα": "we fight (subjunctive after ἐάν)", "μετανοήσομεν": "we shall repent, change our minds", "ἀσθενεῖς": "weak", "τολμῶσι": "the daring (participle of τολμάω, dat. pl.)", "εἴημεν": "we would be (optative of εἰμί)", "μὴ γένοιτο": "may it not happen!", "πεῖραν λαβεῖν": "to take the test – learn by experience", "ψηφιζέσθω": "let him vote (3rd person imperative; ψῆφος = pebble/ballot)", "σπουδὴ": "haste; zeal", "σύμβουλος": "adviser, counsellor", "ἐδέξατο": "accepted, received", "ἐψηφίσατο": "voted (for)" },
  notes: ["The two speeches embody two condition-types from Stage Γ΄: the young man's vivid ἐάν + subjunctive with future apodosis, the old man's remote εἰ + optative … ἂν εἴημεν.",

    "μὴ γένοιτο and the third-person imperative ψηφιζέσθω show the moods doing civic work.",

{
  id: "c10", title: "Κροῖσος καὶ Σόλων – Croesus and Solon", author: "Controlled Greek (after Herodotus)", work: "Original graded reading", level: "Reading Greek", kind: "Controlled",
  text: "Κροῖσος ὁ τῶν Λυδῶν βασιλεὺς πλουσιώτατος ἦν, καὶ ἐνόμιζεν ἑαυτὸν πάντων ἀνθρώπων εὐδαιμονέστατον εἶναι. ἐλθόντος δέ ποτε εἰς τὰς Σάρδεις Σόλωνος τοῦ Ἀθηναίου, ὁ βασιλεὺς πάντα τὸν πλοῦτον δείξας ἠρώτησεν· «ὦ ξένε, τίνα ἤδη εὐδαιμονέστατον ἑώρακας;»\nὁ δὲ Σόλων «Τέλλον,» ἔφη, «τὸν Ἀθηναῖον· οὗτος γὰρ βίον μὲν ἱκανὸν εἶχε, παῖδας δὲ ἀγαθούς, τέλος δὲ κάλλιστον· ὑπὲρ γὰρ τῆς πατρίδος μαχόμενος ἀπέθανεν.» ὁ οὖν Κροῖσος χαλεπῶς ἔφερεν· «τὸν δὲ ἐμὸν πλοῦτον,» ἔφη, «οὐδενὸς ἄξιον νομίζεις;» ὁ δὲ Σόλων· «μηδένα πρὸ τοῦ τέλους μακάριζε· πολλοὺς γὰρ ὁ θεὸς εὐδαίμονας δείξας ἔπειτα ἀνέτρεψεν.»\nὕστερον δὲ ὁ Κροῖσος, τὴν ἀρχὴν ὑπὸ Κύρου ἀπολέσας, ἔγνω τοὺς τοῦ Σόλωνος λόγους ἀληθεῖς ὄντας, καὶ τρὶς ἐκ τῆς πυρᾶς «ὦ Σόλων» ἐβόησεν.",
  translation: "Croesus, king of the Lydians, was exceedingly rich, and believed himself the happiest of all men. Once, when Solon the Athenian came to Sardis, the king showed him all his wealth and asked: 'Stranger, who is the happiest man you have yet seen?' And Solon said: 'Tellus the Athenian. For he had a sufficient livelihood, and good children, and the finest of ends: he died fighting for his country.' Croesus took this badly: 'And my wealth,' he said, 'you count as worth nothing?' But Solon replied: 'Call no one blessed before the end. The god has shown many men happiness – and then overturned them.' Later Croesus, having lost his empire to Cyrus, recognised that Solon's words were true, and three times from the pyre he cried out: 'O Solon!'",
  gloss: { "Λυδῶν": "of the Lydians (kingdom in western Asia Minor)", "πλουσιώτατος": "richest (superlative)", "εὐδαιμονέστατον": "happiest, most blessed", "Σάρδεις": "Sardis, Croesus' capital", "δείξας": "having shown (aorist participle of δείκνυμι)", "ξένε": "stranger, guest-friend (vocative)", "ἑώρακας": "you have seen (perfect of ὁράω)", "ἱκανὸν": "sufficient, enough", "πατρίδος": "fatherland (gen.)", "χαλεπῶς ἔφερεν": "took it hard (idiom)", "μακάριζε": "call blessed! (imperative)", "ἀνέτρεψεν": "overturned (aorist of ἀνατρέπω)", "ἀπολέσας": "having lost (aorist participle of ἀπόλλυμι)", "ἔγνω": "recognised (root aorist of γιγνώσκω)", "ὄντας": "being (participle in indirect statement)", "τρὶς": "three times", "πυρᾶς": "pyre (gen.)" },
  notes: ["The full Stage Δ΄ toolkit: superlatives (πλουσιώτατος, εὐδαιμονέστατον, κάλλιστον), the perfect ἑώρακας, -μι verb forms (δείξας from δείκνυμι), and indirect statement with the participle (ἔγνω … ἀληθεῖς ὄντας).",
    "μηδένα πρὸ τοῦ τέλους μακάριζε – 'count no man happy before the end' – is the moral Herodotus hangs the whole Croesus story on (Histories 1.32).",
    "In Herodotus, Cyrus hears the cry, asks its meaning, and spares Croesus. The original (in Ionic dialect) is Histories 1.29–33 and 1.86 – within your reach after this course.",
    "χαλεπῶς φέρειν, 'bear hardly' = resent: one of many ἔχω/φέρω + adverb idioms."],

  text: "ἐπεὶ δὲ οἱ πρῶτοι ἐγένοντο ἐπὶ τοῦ ὄρους καὶ κατεῖδον τὴν θάλατταν, κραυγὴ πολλὴ ἐγένετο. ἀκούσας δὲ ὁ Ξενοφῶν καὶ οἱ ὀπισθοφύλακες ᾠήθησαν ἔμπροσθεν ἄλλους ἐπιτίθεσθαι πολεμίους […] ἐπειδὴ δὲ ἡ βοὴ πλείων τε ἐγίγνετο καὶ ἐγγύτερον, ἐδόκει δὴ μεῖζόν τι εἶναι τῷ Ξενοφῶντι· καὶ ἀναβὰς ἐφ᾽ ἵππον ἐβοήθει· καὶ τάχα δὴ ἀκούουσι βοώντων τῶν στρατιωτῶν «θάλαττα θάλαττα» καὶ παρεγγυώντων. ἔνθα δὴ ἔθεον πάντες […] ἐπεὶ δὲ ἀφίκοντο πάντες ἐπὶ τὸ ἄκρον, ἐνταῦθα δὴ περιέβαλλον ἀλλήλους καὶ στρατηγοὺς καὶ λοχαγοὺς δακρύοντες.",

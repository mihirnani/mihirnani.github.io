{
  id: "r7", title: "A possession for all time", author: "Thucydides", work: "History 1.22 (abridged)", level: "Advanced prose", kind: "History", dialect: "Attic",
  text: "καὶ ἐς μὲν ἀκρόασιν ἴσως τὸ μὴ μυθῶδες αὐτῶν ἀτερπέστερον φανεῖται· ὅσοι δὲ βουλήσονται τῶν τε γενομένων τὸ σαφὲς σκοπεῖν καὶ τῶν μελλόντων ποτὲ αὖθις κατὰ τὸ ἀνθρώπινον τοιούτων καὶ παραπλησίων ἔσεσθαι, ὠφέλιμα κρίνειν αὐτὰ ἀρκούντως ἕξει. κτῆμά τε ἐς αἰεὶ μᾶλλον ἢ ἀγώνισμα ἐς τὸ παραχρῆμα ἀκούειν ξύγκειται.",
  translation: "For listening, perhaps, the absence of the fabulous from my history will seem the less delightful. But if those who wish to examine the plain truth of what happened – and of what, human nature being what it is, will some day happen again in the same or similar ways – judge this work useful, that is enough. It is composed as a possession for all time rather than a prize-performance for the moment's hearing.",
  gloss: { "ἀκρόασιν": "listening, recitation", "μυθῶδες": "the fabulous, story-element", "ἀτερπέστερον": "less delightful (comparative)", "φανεῖται": "will appear (future of φαίνομαι)", "τὸ σαφὲς": "the clear truth (article + adjective as noun)", "σκοπεῖν": "to examine", "μελλόντων": "of things to come", "κατὰ τὸ ἀνθρώπινον": "in accordance with the human condition", "παραπλησίων": "closely similar", "ὠφέλιμα": "useful", "ἀρκούντως ἕξει": "it will suffice (ἔχω + adverb)", "κτῆμά": "possession", "ἐς αἰεὶ": "for ever (older Attic spelling of εἰς ἀεί)", "ἀγώνισμα": "competition-piece, showpiece", "ἐς τὸ παραχρῆμα": "for the immediate moment", "ξύγκειται": "is composed (older Attic ξυν- for συν-)" },
  notes: ["Thucydides' statement of method – history stripped of myth, written for permanent use – set the terms of the discipline for good. κτῆμα ἐς αἰεί is among the most quoted phrases in Greek.",
    "His prose compresses hard: article + neuter adjective as abstract noun (τὸ μυθῶδες, τὸ σαφές, τὸ ἀνθρώπινον) is his signature move – grammar you learned in Stage Α΄, pushed to its limit.",
    "Older Attic spellings ἐς and ξυν- (for εἰς, συν-) mark his generation's orthography.",
    "The implicit target of ἀγώνισμα is Herodotus, whose Histories were recited to applause. Thucydides is defining himself against his great predecessor – read both proems side by side."],
  license: "Public-domain Greek text (abridged) from standard editions.", source: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0199"
},
{
  id: "r8", title: "In the beginning was the Word", author: "Gospel of John", work: "John 1:1–5", level: "Intermediate", kind: "Scripture", dialect: "Koine",
  text: "Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος. οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν. πάντα δι᾽ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν ὃ γέγονεν. ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων· καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.",
  translation: "In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things came to be through him, and without him not one thing came to be that has come to be. In him was life, and the life was the light of humankind; and the light shines in the darkness, and the darkness did not overcome it.",
  gloss: { "ἀρχῇ": "beginning (dat.) – the same ἀρχή you met in Stage Α΄", "λόγος": "word, reason, account", "πρὸς": "with, in relation to (+ acc. – a Koine nuance)", "χωρὶς": "without, apart from (+ gen.)", "οὐδὲ ἕν": "not even one thing", "γέγονεν": "has come to be (perfect of γίγνομαι)", "ζωὴ": "life", "φῶς": "light (τὸ φῶς, φωτός)", "σκοτίᾳ": "darkness (dat.)", "φαίνει": "shines", "κατέλαβεν": "seized / overcame / comprehended (aorist of καταλαμβάνω)" },
  notes: ["The tense architecture is deliberate theology: ἦν (imperfect – continuous being) for the Word, ἐγένετο (aorist – coming to be) for everything created, γέγονεν (perfect) for creation as it now stands. Every distinction is from your Stage Β΄ and Δ΄ units.",
    "κατέλαβεν is a famous double meaning: καταλαμβάνω is both 'seize/overcome' and 'grasp/comprehend'. The darkness neither extinguished nor understood the light – Greek says both at once.",
    "The vocabulary is almost entirely from this course's first two stages: the Koine's plainness is real, and it is why John is many learners' first continuous Greek text.",
    "John's opening deliberately echoes the Septuagint's Ἐν ἀρχῇ ἐποίησεν ὁ θεός (the previous reading's text) – a Greek allusion to a Greek translation of Hebrew scripture."],
  license: "Public-domain Greek text (standard editions of the Greek New Testament).", source: "https://en.wikisource.org/wiki/New_Testament_(Greek)"
},
{
  id: "r9", title: "Let there be light", author: "Septuagint", work: "Genesis 1:1–5 (excerpts)", level: "Intermediate", kind: "Scripture", dialect: "Koine",
  text: "Ἐν ἀρχῇ ἐποίησεν ὁ θεὸς τὸν οὐρανὸν καὶ τὴν γῆν. ἡ δὲ γῆ ἦν ἀόρατος καὶ ἀκατασκεύαστος, καὶ σκότος ἐπάνω τῆς ἀβύσσου, καὶ πνεῦμα θεοῦ ἐπεφέρετο ἐπάνω τοῦ ὕδατος. καὶ εἶπεν ὁ θεός· γενηθήτω φῶς· καὶ ἐγένετο φῶς. καὶ εἶδεν ὁ θεὸς τὸ φῶς ὅτι καλόν· καὶ διεχώρισεν ὁ θεὸς ἀνὰ μέσον τοῦ φωτὸς καὶ ἀνὰ μέσον τοῦ σκότους. καὶ ἐκάλεσεν ὁ θεὸς τὸ φῶς ἡμέραν καὶ τὸ σκότος ἐκάλεσεν νύκτα.",
  translation: "In the beginning God made the sky and the earth. And the earth was unseen and unformed, and darkness was over the deep, and the breath of God moved over the water. And God said: let light come to be – and light came to be. And God saw the light, that it was good; and God divided between the light and the darkness. And God called the light Day, and the darkness he called Night.",
  gloss: { "ἐποίησεν": "made (aorist of ποιέω)", "ἀόρατος": "unseen, invisible (ἀ- + ὁράω)", "ἀκατασκεύαστος": "unformed, unfurnished", "σκότος": "darkness (τὸ σκότος, -ους)", "ἐπάνω": "above, over (+ gen.)", "ἀβύσσου": "the deep, abyss (ἄ-βυσσος: 'bottomless')", "πνεῦμα": "breath, wind, spirit", "ἐπεφέρετο": "was borne along, moved (imperfect passive)", "γενηθήτω": "let it come to be (aorist imperative of γίγνομαι)", "διεχώρισεν": "divided, separated", "ἀνὰ μέσον": "between (Hebraism: 'up the middle of')", "ἐκάλεσεν": "called, named" },
  notes: ["The Septuagint (LXX): the Greek translation of the Hebrew Bible made in Alexandria from the 3rd century BC – the Bible of the earliest church and a monument of Koine.",
    "γενηθήτω φῶς – a third-person aorist imperative (Stage Δ΄ grammar): 'let light COME TO BE'. Compare the philosophical ἔστω ('let it be assumed') – the LXX chose becoming over being.",
    "Translation Greek: καὶ … καὶ … καὶ mirrors Hebrew narrative style, and ἀνὰ μέσον … καὶ ἀνὰ μέσον calques a Hebrew idiom. Reading the LXX teaches Koine and translationese at once.",
    "εἶδεν … ὅτι καλόν – 'saw the light, that it was good': the object anticipated before the ὅτι-clause, a pattern (prolepsis) you will also meet in classical prose."],
  license: "Public-domain Greek text (standard editions of the Septuagint).", source: "https://en.wikisource.org/wiki/Septuagint"
},
{
  id: "r10", title: "Everything flows", author: "Heraclitus", work: "Fragments (DK 12, 119, 123, with the ancient παντα-ῥεῖ paraphrase)", level: "Intermediate", kind: "Philosophy", dialect: "Ionic",
  text: "ποταμοῖσι τοῖσιν αὐτοῖσιν ἐμβαίνουσιν ἕτερα καὶ ἕτερα ὕδατα ἐπιρρεῖ.\n\nπάντα ῥεῖ καὶ οὐδὲν μένει.\n\nἦθος ἀνθρώπῳ δαίμων.\n\nφύσις κρύπτεσθαι φιλεῖ.",
  translation: "Upon those who step into the same rivers, different and different waters flow. – Everything flows and nothing remains. – Character, for a human being, is fate. – Nature loves to hide.",
  gloss: { "ποταμοῖσι": "rivers (Ionic dat. pl.)", "τοῖσιν αὐτοῖσιν": "the same (Ionic dat.: 'the same rivers')", "ἐμβαίνουσιν": "for those stepping in (participle, dat. pl.)", "ἕτερα καὶ ἕτερα": "different and again different", "ἐπιρρεῖ": "flows on, flows in succession", "ῥεῖ": "flows (whence 'rheum', 'rheology')", "ἦθος": "character, habit – whence 'ethics'", "δαίμων": "guiding spirit; destiny, fate", "κρύπτεσθαι": "to hide (itself) – middle infinitive", "φιλεῖ": "loves, tends to" },
  notes: ["Heraclitus of Ephesus (c. 500 BC), 'the obscure', wrote in riddling Ionic prose. Only fragments survive, quoted by later authors – you are reading the wreckage of a book, and the wreckage founded process philosophy.",
    "The river fragment (DK 12) is likely his actual wording; the slogan πάντα ῥεῖ is the ancient paraphrase of it, not his own sentence – Plato's wording (Cratylus 402a) is πάντα χωρεῖ καὶ οὐδὲν μένει, and πάντα ῥεῖ itself comes from Simplicius – a lesson in how fragments reach us.",
    "ἦθος ἀνθρώπῳ δαίμων: four words, no verb (the nominal sentence from Stage Α΄), and a whole ethics – your character, not the gods, is your destiny.",
    "φύσις κρύπτεσθαι φιλεῖ uses the middle infinitive from Stage Β΄: nature loves to hide ITSELF."],
  license: "Public-domain fragments as transmitted in ancient quotations (Diels–Kranz numbering).", source: "https://en.wikisource.org/wiki/Fragments_of_Heraclitus"
},
{
  id: "r11", title: "What is up to us", author: "Epictetus", work: "Enchiridion 1 (opening)", level: "Intermediate", kind: "Philosophy", dialect: "Koine",
  text: "Τῶν ὄντων τὰ μέν ἐστιν ἐφ᾽ ἡμῖν, τὰ δὲ οὐκ ἐφ᾽ ἡμῖν. ἐφ᾽ ἡμῖν μὲν ὑπόληψις, ὁρμή, ὄρεξις, ἔκκλισις καὶ ἑνὶ λόγῳ ὅσα ἡμέτερα ἔργα· οὐκ ἐφ᾽ ἡμῖν δὲ τὸ σῶμα, ἡ κτῆσις, δόξαι, ἀρχαὶ καὶ ἑνὶ λόγῳ ὅσα οὐχ ἡμέτερα ἔργα.",
  translation: "Of things that exist, some are up to us and some are not up to us. Up to us are judgement, impulse, desire, aversion – in a word, whatever is our own doing. Not up to us are the body, possessions, reputations, offices – in a word, whatever is not our own doing.",
  gloss: { "τῶν ὄντων": "of the things that are (participle of εἰμί as noun)", "ἐφ᾽ ἡμῖν": "up to us, in our power (ἐπί + dat.)", "ὑπόληψις": "judgement, opinion", "ὁρμή": "impulse (to act)", "ὄρεξις": "desire, reaching-for", "ἔκκλισις": "aversion, turning-away", "ἑνὶ λόγῳ": "in one word, in short", "ὅσα": "as many things as, whatever", "κτῆσις": "possession, property", "δόξαι": "reputations, opinions of others", "ἀρχαὶ": "public offices (the ἀρχή of Stage Α΄, in its political sense)" },
  notes: ["Epictetus was born a slave in Phrygia and became Rome's most influential Stoic teacher; the Enchiridion ('Handbook') is his pupil Arrian's digest of his lectures.",
    "The whole of Stoic practice hangs on this first sentence's μέν/δέ – the Stage Α΄ particle pair, here dividing the universe in two.",
    "τῶν ὄντων and ὅσα ἡμέτερα ἔργα: participles and article-phrases as nouns – the compression tools this course has been building are the entire syntax here.",
    "Notice how readable philosophical Koine is for you now: this text is regularly given to first-year students as their first unabridged classical author."],
  license: "Public-domain Greek text from standard editions.", source: "https://en.wikisource.org/wiki/Enchiridion_of_Epictetus"
},
{
  id: "r12", title: "At dawn, tell yourself", author: "Marcus Aurelius", work: "Meditations 2.1 (opening, abridged)", level: "Advanced prose", kind: "Philosophy", dialect: "Koine",
  text: "Ἕωθεν προλέγειν ἑαυτῷ· συντεύξομαι περιέργῳ, ἀχαρίστῳ, ὑβριστῇ, δολερῷ, βασκάνῳ, ἀκοινωνήτῳ· πάντα ταῦτα συμβέβηκεν ἐκείνοις παρὰ τὴν ἄγνοιαν τῶν ἀγαθῶν καὶ κακῶν.",
  translation: "At dawn, say to yourself beforehand: I shall meet the meddling, the ungrateful, the insolent, the treacherous, the envious, the unneighbourly. All this has befallen them through ignorance of what is good and what is evil.",
  gloss: { "Ἕωθεν": "at dawn, from early morning", "προλέγειν": "to say beforehand (infinitive as self-command)", "συντεύξομαι": "I shall meet with (future of συντυγχάνω + dat.)", "περιέργῳ": "meddling, busybody", "ἀχαρίστῳ": "ungrateful (ἀ- + χάρις)", "ὑβριστῇ": "insolent (the ὕβρις-man)", "δολερῷ": "treacherous, deceitful", "βασκάνῳ": "envious, malicious", "ἀκοινωνήτῳ": "unsociable, refusing community", "συμβέβηκεν": "has befallen (perfect of συμβαίνω)", "παρὰ τὴν ἄγνοιαν": "because of ignorance", "ἄγνοιαν": "ignorance (ἀ- + γιγνώσκω)" },
  notes: ["A Roman emperor writing his private notebook – in Greek: by the second century AD, Greek was the natural language of philosophical self-examination even for the master of the Latin West.",
    "The bare infinitive προλέγειν as a self-directed command ('to tell oneself…') is the Meditations' characteristic note-form grammar.",
    "The string of datives after συντεύξομαι is a Stage Β΄ construction (τυγχάνω-family + dative); the negated-adjective coinages (ἀ-χάριστος, ἀ-κοινώνητος) show Greek's alpha-privative at work – English 'a-moral', 'a-symmetry' copies it.",
    "συμβέβηκεν – the perfect of state: their condition stands accomplished through ignorance. Stoic doctrine (no one does wrong willingly) carried by a tense."],
  license: "Public-domain Greek text (abridged) from standard editions.", source: "https://en.wikisource.org/wiki/Meditations"
},
{
  id: "r13", title: "All men desire to know", author: "Aristotle", work: "Metaphysics 980a (opening)", level: "Advanced prose", kind: "Philosophy", dialect: "Attic",
  text: "Πάντες ἄνθρωποι τοῦ εἰδέναι ὀρέγονται φύσει. σημεῖον δ᾽ ἡ τῶν αἰσθήσεων ἀγάπησις· καὶ γὰρ χωρὶς τῆς χρείας ἀγαπῶνται δι᾽ αὑτάς, καὶ μάλιστα τῶν ἄλλων ἡ διὰ τῶν ὀμμάτων.",
  translation: "All human beings by nature desire to know. A sign of this is our delight in the senses: even apart from their usefulness they are loved for their own sake, and above all the others, the sense that works through the eyes.",
  gloss: { "τοῦ εἰδέναι": "knowing (articular infinitive of οἶδα, gen. after ὀρέγονται)", "ὀρέγονται": "reach out for, desire (+ gen.)", "φύσει": "by nature (dative of manner)", "σημεῖον": "sign, evidence", "αἰσθήσεων": "of the senses (αἴσθησις – whence 'aesthetics')", "ἀγάπησις": "delight in, love (the noun of ἀγαπάω)", "χωρὶς τῆς χρείας": "apart from usefulness", "δι᾽ αὑτάς": "for their own sake", "μάλιστα": "most of all", "ὀμμάτων": "eyes (τὸ ὄμμα, ὄμματος)" },
  notes: ["The first sentence of the Metaphysics – Aristotle's justification of the whole scientific enterprise in six words: curiosity is human nature.",
    "τοῦ εἰδέναι – the articular infinitive (Stage Γ΄) in the genitive, because ὀρέγομαι 'reach for' takes the genitive of the thing reached for: grammar mirroring the metaphor.",
    "φύσει, the bare dative of manner: 'by nature'. The φύσις/νόμος (nature/convention) distinction organised a century of Greek thought before Aristotle folded it into science.",
    "His preference for sight (ἡ διὰ τῶν ὀμμάτων sc. αἴσθησις – note the article carrying the ellipsis) begins the West's long romance of knowledge-as-vision: 'theory' itself is from θεωρέω, to behold."],
  license: "Public-domain Greek text from standard editions.", source: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0051"
},
{
  id: "r14", title: "Best is water", author: "Pindar", work: "Olympian 1, lines 1–11 (the whole first strophe)", level: "Advanced poetry", kind: "Lyric poetry", dialect: "Doric",
  text: "ἄριστον μὲν ὕδωρ, ὁ δὲ χρυσὸς αἰθόμενον πῦρ\nἅτε διαπρέπει νυκτὶ μεγάνορος ἔξοχα πλούτου·\nεἰ δ᾽ ἄεθλα γαρύεν\nἔλδεαι, φίλον ἦτορ,\nμηκέθ᾽ ἁλίου σκόπει\nἄλλο θαλπνότερον ἐν ἁμέρᾳ φαεννὸν ἄστρον ἐρήμας δι᾽ αἰθέρος,\nμηδ᾽ Ὀλυμπίας ἀγῶνα φέρτερον αὐδάσομεν·\nὅθεν ὁ πολύφατος ὕμνος ἀμφιβάλλεται\nσοφῶν μητίεσσι, κελαδεῖν\nΚρόνου παῖδ᾽ ἐς ἀφνεὰν ἱκομένους\nμάκαιραν Ἱέρωνος ἑστίαν,",
  translation: "Best is water; but gold, like fire blazing in the night, shines preeminent amid lordly wealth. But if you desire to sing of games, my heart, look no further than the sun for another star shining warmer by day through the empty sky, nor let us proclaim any contest greater than Olympia – whence the much-voiced hymn is cast about the minds of poets, to celebrate the son of Kronos, as they come to the rich and blessed hearth of Hieron,",
  gloss: { "ἄριστον": "best (superlative of ἀγαθός)", "αἰθόμενον": "blazing (participle of αἴθομαι)", "ἅτε": "just as, like (lyric)", "διαπρέπει": "shines out, is conspicuous", "νυκτὶ": "at night (dative of time)", "μεγάνορος": "lordly, man-exalting (μέγας + ἀνήρ)", "ἔξοχα": "preeminently, above all", "ἄεθλα": "games, contests (lyric for ἆθλα)", "γαρύεν": "to sing of (Doric infinitive; Attic γηρύειν)", "ἔλδεαι": "you desire (2 sg. middle)", "φίλον ἦτορ": "dear heart (the poet addresses himself)", "μηκέθ᾽": "no longer (μηκέτι, elided and aspirated)", "ἁλίου": "than the sun (Doric for ἡλίου; genitive of comparison)", "σκόπει": "look for (imperative)", "θαλπνότερον": "warmer (comparative)", "ἁμέρᾳ": "by day (Doric for ἡμέρᾳ)", "φαεννὸν": "shining (lyric for φαεινόν)", "ἐρήμας": "empty (Doric genitive)", "αἰθέρος": "sky, upper air", "φέρτερον": "mightier, greater", "αὐδάσομεν": "let us proclaim (short-vowel aorist subjunctive)", "ὅθεν": "whence", "πολύφατος": "much-voiced, famous", "ἀμφιβάλλεται": "is cast about (like a garment)", "μητίεσσι": "minds, skills (dative plural of μῆτις)", "κελαδεῖν": "to celebrate aloud", "ἀφνεὰν": "rich (Doric accusative)", "ἱκομένους": "coming to (aorist participle of ἱκνέομαι)", "μάκαιραν": "blessed", "ἑστίαν": "hearth" },
  notes: ["Composed for Hieron, tyrant of Syracuse, after his racehorse Pherenikos won at Olympia in 476 BC. The opening priamel – water, gold, the sun, and at the summit Olympia – is the most celebrated in Greek poetry: a ladder of supreme things built to crown the games.",
    "The dialect is literary Doric, the conventional dress of choral lyric whoever the poet: long alpha where Attic-Ionic has eta (ἁλίου, ἁμέρᾳ, ἀφνεάν) and the Doric infinitive γαρύεν.",
    "The metre is aeolic – cola built on choriambic nuclei – one of the two great families of Pindaric verse (the other is dactylo-epitrite). Victory odes were sung and danced by a chorus in strophe, antistrophe and epode; this strophe's eleven lines end mid-sentence, the music carrying straight on.",
    "The sentence runs over into the antistrophe, where Hieron 'wields the scepter of law in flock-rich Sicily'. A strophe is a unit of music, not of sense.",
    "This is the poem that gave later Europe the tag 'water is best' – and the whole institution of the victory ode its model: praise of the victor folded into myth (the rest of the ode retells Pelops) and gnomic wisdom."],
  license: "Public-domain Greek text (Sandys' edition) via the Perseus Digital Library.", source: "https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0033.tlg001.perseus-grc2:1"
},
{
  id: "r15", title: "Children of old Cadmus", author: "Sophocles", work: "Oedipus Tyrannus, lines 1–13", level: "Advanced poetry", kind: "Drama", dialect: "Attic",
  text: "ὦ τέκνα, Κάδμου τοῦ πάλαι νέα τροφή,\nτίνας ποθ᾽ ἕδρας τάσδε μοι θοάζετε\nἱκτηρίοις κλάδοισιν ἐξεστεμμένοι;\nπόλις δ᾽ ὁμοῦ μὲν θυμιαμάτων γέμει,\nὁμοῦ δὲ παιάνων τε καὶ στεναγμάτων·\nἁγὼ δικαιῶν μὴ παρ᾽ ἀγγέλων, τέκνα,\nἄλλων ἀκούειν αὐτὸς ὧδ᾽ ἐλήλυθα,\nὁ πᾶσι κλεινὸς Οἰδίπους καλούμενος.\nἀλλ᾽ ὦ γεραιέ, φράζ᾽, ἐπεὶ πρέπων ἔφυς\nπρὸ τῶνδε φωνεῖν, τίνι τρόπῳ καθέστατε,\nδείσαντες ἢ στέρξαντες; ὡς θέλοντος ἂν\nἐμοῦ προσαρκεῖν πᾶν· δυσάλγητος γὰρ ἂν\nεἴην τοιάνδε μὴ οὐ κατοικτίρων ἕδραν.",
  translation: "My children, latest brood nurtured of ancient Cadmus, why ever do you sit before me at these altars, wreathed with suppliant branches, while the city is filled at once with incense-smoke, at once with paeans and with groans? Thinking it right, children, not to hear this from messengers – from others – I have come myself, I who am called Oedipus, famous to all. Come, old man – since it befits you to speak for these – tell me: in what state do you sit here, in fear or in desire? Know that I am willing to give every aid; hard-hearted indeed would I be, did I not pity such a supplication as this.",
  gloss: { "τέκνα": "children (vocative)", "τοῦ πάλαι": "of old (article + adverb)", "νέα τροφή": "young brood (literally 'new nurture')", "ποθ᾽": "ever (ποτέ, elided and aspirated)", "ἕδρας": "sittings, supplications", "θοάζετε": "you sit (a disputed verb: 'sit' or 'press eagerly')", "ἱκτηρίοις κλάδοισιν": "with suppliant branches (olive boughs wound with wool)", "ἐξεστεμμένοι": "wreathed (perfect participle)", "ὁμοῦ": "at once, together", "θυμιαμάτων": "incense-offerings", "γέμει": "is full of (+ genitive)", "παιάνων": "paeans – hymns to the healer Apollo", "στεναγμάτων": "groans", "ἁγὼ": "which I (crasis: ἃ ἐγώ)", "δικαιῶν": "thinking it right (participle of δικαιόω)", "ὧδ᾽": "here, thus", "ἐλήλυθα": "I have come (perfect of ἔρχομαι)", "κλεινὸς": "famous", "καλούμενος": "called (passive participle)", "γεραιέ": "old man (vocative)", "φράζ᾽": "tell! (imperative, elided)", "πρέπων ἔφυς": "you are naturally fitted (πρέπω + ἔφυν)", "πρὸ τῶνδε": "on behalf of these", "καθέστατε": "you are set here (perfect of καθίστημι)", "δείσαντες": "in fear (aorist participle of δείδω)", "στέρξαντες": "in longing/acceptance (aorist participle of στέργω)", "προσαρκεῖν": "to give aid", "δυσάλγητος": "hard-hearted, unfeeling", "μὴ οὐ κατοικτίρων": "did I not pity (double negative after a negated main clause)", "ἕδραν": "supplication" },
  notes: ["The opening tableau of the play (Athens, ca. 429–425 BC): plague-stricken Thebans sit as suppliants before the palace, and Oedipus – at the height of his power – comes out in person to hear them.",
    "The dramatic irony begins with the first line: the 'famous' solver of riddles who insists on first-hand knowledge (αὐτὸς … ἐλήλυθα) is the one man ignorant of who he is, and his fatherly ὦ τέκνα is addressed, unknowingly, to the city he has polluted.",
    "The metre is iambic trimeter, the conversational verse of tragic dialogue: three pairs of iambs (x – ⏑ –), close enough to speech-rhythm that Aristotle called it the most speakable of metres.",
    "Two boundary phenomena from the crasis-and-elision reference card appear here in the wild: ἁγώ = ἃ ἐγώ (line 6) and the elisions ποθ᾽, φράζ᾽, ὧδ᾽.",
    "Line 13's μὴ οὐ κατοικτίρων is the classic double negative after a negated leading idea (δυσάλγητος ἂν εἴην = 'I would NOT be unmoved') – Stage Γ΄ grammar, on a tragic stage."],
  license: "Public-domain Greek text (Storr's edition) via the Perseus Digital Library.", source: "https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0011.tlg004.perseus-grc2:1-13"
},
{
  id: "r16", title: "Behold what I, a god, suffer", author: "Aeschylus (attributed)", work: "Prometheus Bound, lines 88–100", level: "Advanced poetry", kind: "Drama", dialect: "Attic",
  text: "ὦ δῖος αἰθὴρ καὶ ταχύπτεροι πνοαί,\nποταμῶν τε πηγαί, ποντίων τε κυμάτων\nἀνήριθμον γέλασμα, παμμῆτόρ τε γῆ,\nκαὶ τὸν πανόπτην κύκλον ἡλίου καλῶ.\nἴδεσθέ μ᾽ οἷα πρὸς θεῶν πάσχω θεός.\nδέρχθηθ᾽ οἵαις αἰκείαισιν\nδιακναιόμενος τὸν μυριετῆ\nχρόνον ἀθλεύσω.\nτοιόνδ᾽ ὁ νέος ταγὸς μακάρων\nἐξηῦρ᾽ ἐπ᾽ ἐμοὶ δεσμὸν ἀεικῆ.\nφεῦ φεῦ, τὸ παρὸν τό τ᾽ ἐπερχόμενον\nπῆμα στενάχω, πῇ ποτε μόχθων\nχρὴ τέρματα τῶνδ᾽ ἐπιτεῖλαι.",
  translation: "O divine sky, and swift-winged breezes, and springs of rivers, and numberless laughter of the sea's waves, and Earth, mother of all – and on the all-seeing circle of the sun I call: behold me, what things I, a god, suffer at the hands of gods! See with what torments I am racked, torments I shall wrestle with through time of ten thousand years. Such is the shameful bond the new commander of the blessed ones has devised against me. Alas, alas! I groan for the present woe and for the woe to come – where ever must an end to these toils arise?",
  gloss: { "δῖος": "divine, of Zeus's sky", "αἰθὴρ": "upper air, bright sky", "ταχύπτεροι πνοαί": "swift-winged breezes", "πηγαί": "springs", "ποντίων": "of the sea", "ἀνήριθμον γέλασμα": "numberless laughter (the glitter of waves)", "παμμῆτόρ": "all-mother (vocative)", "πανόπτην": "all-seeing", "ἴδεσθέ": "behold! (aorist middle imperative)", "οἷα": "what sort of things (exclamatory)", "πρὸς θεῶν": "at the hands of gods (πρός + genitive of agent)", "δέρχθηθ᾽": "see! (aorist imperative of δέρκομαι)", "αἰκείαισιν": "torments, outrages", "διακναιόμενος": "being worn away, racked", "μυριετῆ": "of ten thousand years", "ἀθλεύσω": "I shall struggle through (future)", "ταγὸς": "commander, marshal", "μακάρων": "of the blessed ones (the gods)", "ἐξηῦρ᾽": "devised (aorist of ἐξευρίσκω, elided)", "δεσμὸν ἀεικῆ": "shameful bond", "τὸ παρὸν": "the present (woe) – article + participle", "ἐπερχόμενον": "coming upon, approaching", "πῆμα": "woe, suffering", "στενάχω": "I groan for", "πῇ ποτε": "where ever?", "μόχθων": "of toils", "τέρματα": "ends, limits", "ἐπιτεῖλαι": "to arise (aorist infinitive of ἐπιτέλλω)" },
  notes: ["Kratos, Bia and Hephaestus have just nailed Prometheus to the Scythian crag and gone. These are his first words, alone on stage: a solemn invocation of the elements – air, winds, waters, earth, sun – as witnesses that a god suffers at the hands of gods, under the 'new commander' Zeus.",
    "The metre shifts mid-speech: 88–92 are spoken iambic trimeters; at 93 the verse slides into chanted anapaests – one of this play's peculiarities, a lone actor moving between speech and recitative.",
    "ἀνήριθμον γέλασμα, 'the numberless laughter of the waves', is among the most famous phrases in Greek drama.",
    "The play is transmitted under Aeschylus's name, but on grounds of style, metre and theology many scholars deny it to him (a common suggestion is his son Euphorion, perhaps in the 440s–430s BC) – hence 'attributed'. The grandeur is Aeschylean whoever wrote it.",
    "ἴδεσθέ μ᾽ οἷα … πάσχω θεός packs the whole play into a line: the juxtaposition πρὸς θεῶν πάσχω θεός – god suffering from gods – is the scandal the trilogy explores."],
  license: "Public-domain Greek text (Smyth's edition) via the Perseus Digital Library.", source: "https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0085.tlg003.perseus-grc2:88-100"
},
{
  id: "r17", title: "It is called a democracy", author: "Thucydides", work: "History 2.37.1 – Pericles' Funeral Oration", level: "Advanced prose", kind: "History", dialect: "Attic",
  text: "χρώμεθα γὰρ πολιτείᾳ οὐ ζηλούσῃ τοὺς τῶν πέλας νόμους, παράδειγμα δὲ μᾶλλον αὐτοὶ ὄντες τισὶν ἢ μιμούμενοι ἑτέρους. καὶ ὄνομα μὲν διὰ τὸ μὴ ἐς ὀλίγους ἀλλ᾽ ἐς πλείονας οἰκεῖν δημοκρατία κέκληται· μέτεστι δὲ κατὰ μὲν τοὺς νόμους πρὸς τὰ ἴδια διάφορα πᾶσι τὸ ἴσον, κατὰ δὲ τὴν ἀξίωσιν, ὡς ἕκαστος ἔν τῳ εὐδοκιμεῖ, οὐκ ἀπὸ μέρους τὸ πλέον ἐς τὰ κοινὰ ἢ ἀπ᾽ ἀρετῆς προτιμᾶται, οὐδ᾽ αὖ κατὰ πενίαν, ἔχων γέ τι ἀγαθὸν δρᾶσαι τὴν πόλιν, ἀξιώματος ἀφανείᾳ κεκώλυται.",
  translation: "For we enjoy a form of government that does not emulate the laws of our neighbours; rather, we are ourselves a model to some than imitators of others. And in name, because it is administered with a view not to the few but to the many, it is called a democracy; yet as regards the laws, all share equality for the settlement of their private disputes, while as regards public standing, according as each man wins esteem in some field, he is preferred for public honours not by rotation more than for excellence; nor again, on the score of poverty, is any man barred by the obscurity of his rank, so long as he has some good to do the city.",
  gloss: { "χρώμεθα": "we use, enjoy (χράομαι + dative)", "πολιτείᾳ": "constitution, form of government", "ζηλούσῃ": "emulating (participle, agreeing with πολιτείᾳ)", "τῶν πέλας": "of our neighbours (article + adverb as noun)", "παράδειγμα": "model, example", "μιμούμενοι": "imitating", "οἰκεῖν": "to be run, administered (of a city)", "δημοκρατία κέκληται": "it has been called a democracy (perfect of καλέω)", "μέτεστι": "there is a share (impersonal + dative)", "πρὸς τὰ ἴδια διάφορα": "for private disputes", "τὸ ἴσον": "equality (article + neuter adjective)", "ἀξίωσιν": "esteem, public standing", "ἔν τῳ": "in some field (τῳ = τινι, the enclitic indefinite)", "εὐδοκιμεῖ": "wins repute", "ἀπὸ μέρους": "by rotation, by class (a disputed phrase)", "ἐς τὰ κοινὰ": "for public office", "ἀπ᾽ ἀρετῆς": "for excellence", "προτιμᾶται": "is preferred in honour", "κατὰ πενίαν": "on the score of poverty", "δρᾶσαι": "to do (aorist infinitive of δράω)", "ἀξιώματος ἀφανείᾳ": "by obscurity of standing", "κεκώλυται": "is barred (perfect passive of κωλύω)" },
  notes: ["From the funeral oration Thucydides gives Pericles over the Athenian dead of the war's first winter (431/430 BC), spoken at the public tomb in the Kerameikos – the most quoted ancient description of democracy.",
    "The rhetoric balances clause against clause: name versus reality (ὄνομα μέν … μέτεστι δέ), law versus esteem, class versus excellence. Read it aloud and the μέν/δέ architecture of Stage Α΄ carries the whole period.",
    "The unnamed 'neighbours' whose laws Athens does not copy are Sparta – the whole speech is a portrait of Athens drawn against a Spartan shadow.",
    "Note the compressed idiom: τῶν πέλας (article + adverb = 'those near by'), ἔν τῳ with the bare enclitic indefinite, and the older Attic ἐς for εἰς that you met in the 1.22 reading.",
    "Whether ἀπὸ μέρους means 'by rotation of office' or 'by class' is a long-standing dispute; either way the contrast with ἀπ᾽ ἀρετῆς – merit – is the point."],
  license: "Public-domain Greek text (the Oxford text of Stuart Jones) via the Perseus Digital Library.", source: "https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0003.tlg001.perseus-grc2:2.37"
},
{
  id: "r18", title: "The golden race", author: "Hesiod", work: "Works and Days, lines 109–120", level: "Advanced poetry", kind: "Epic poetry", dialect: "Epic",
  text: "χρύσεον μὲν πρώτιστα γένος μερόπων ἀνθρώπων\nἀθάνατοι ποίησαν Ὀλύμπια δώματ᾽ ἔχοντες.\nοἳ μὲν ἐπὶ Κρόνου ἦσαν, ὅτ᾽ οὐρανῷ ἐμβασίλευεν·\nὥστε θεοὶ δ᾽ ἔζωον ἀκηδέα θυμὸν ἔχοντες\nνόσφιν ἄτερ τε πόνων καὶ ὀιζύος· οὐδέ τι δειλὸν\nγῆρας ἐπῆν, αἰεὶ δὲ πόδας καὶ χεῖρας ὁμοῖοι\nτέρποντ᾽ ἐν θαλίῃσι κακῶν ἔκτοσθεν ἁπάντων·\nθνῇσκον δ᾽ ὥσθ᾽ ὕπνῳ δεδμημένοι· ἐσθλὰ δὲ πάντα\nτοῖσιν ἔην· καρπὸν δ᾽ ἔφερε ζείδωρος ἄρουρα\nαὐτομάτη πολλόν τε καὶ ἄφθονον· οἳ δ᾽ ἐθελημοὶ\nἥσυχοι ἔργ᾽ ἐνέμοντο σὺν ἐσθλοῖσιν πολέεσσιν.\nἀφνειοὶ μήλοισι, φίλοι μακάρεσσι θεοῖσιν.",
  translation: "Golden was the race of mortal men that the immortals who hold Olympian homes made first of all. They lived in the time of Kronos, when he was king in heaven; like gods they lived, with carefree heart, apart from and without toils and misery; nor did wretched old age press upon them, but ever the same in feet and hands they took delight in feasts, beyond the reach of all evils. They died as if overcome by sleep; and all good things were theirs: the grain-giving earth bore fruit of itself, much and unstinting; and they, at their ease, quietly tended their works amid abundant good things, rich in flocks, dear to the blessed gods.",
  gloss: { "χρύσεον": "golden (uncontracted epic form)", "πρώτιστα": "first of all", "μερόπων ἀνθρώπων": "of mortal men (epic formula)", "ἀθάνατοι": "the immortals", "ἐπὶ Κρόνου": "in the time of Kronos (ἐπί + genitive)", "ἐμβασίλευεν": "was king (imperfect)", "ὥστε": "like, as (epic usage – not 'so that' here)", "ἔζωον": "they lived (epic imperfect of ζάω)", "ἀκηδέα": "carefree (α-privative + κῆδος, 'care')", "νόσφιν": "apart from", "ὀιζύος": "misery (genitive of ὀιζύς)", "δειλὸν": "wretched", "γῆρας": "old age", "ἐπῆν": "was upon them (imperfect of ἔπειμι)", "ὁμοῖοι": "unchanged, ever the same", "θαλίῃσι": "in feasts (Ionic dative plural)", "ἔκτοσθεν": "beyond, outside of (+ genitive)", "θνῇσκον": "they died (imperfect)", "δεδμημένοι": "overcome (perfect participle of δάμνημι)", "ἔην": "was (epic for ἦν)", "ζείδωρος ἄρουρα": "the grain-giving earth (epic formula)", "αὐτομάτη": "of its own accord", "ἄφθονον": "unstinting, ungrudging", "ἐθελημοὶ": "willing, at their ease", "ἐνέμοντο": "they tended, occupied (imperfect middle of νέμω)", "πολέεσσιν": "many (epic dative plural of πολύς)", "ἀφνειοὶ μήλοισι": "rich in flocks", "μακάρεσσι": "to the blessed ones (epic dative)" },
  notes: ["This opens the Myth of the Five Races (109–201), Hesiod's second explanation to his brother Perses – after Pandora – of why life is hard: humanity has declined from a golden race under Kronos, through silver, bronze and the heroes, to Hesiod's own race of iron.",
    "The golden race's effortless plenty – the earth bearing αὐτομάτη, 'of itself' – is the exact negative of the poem's great theme, the necessity of labour. Hesiod is the other epic poet: same hexameter and dialect as Homer, but a farmer's didactic voice, roughly contemporary (c. 700 BC).",
    "Epic dialect forms to notice: uncontracted χρύσεον, Ionic θαλίῃσι, epic πολέεσσιν and μακάρεσσι, ἔην for ἦν – all familiar from the Homer units.",
    "The preceding line 108 is deleted by many editors, which is why the standard excerpt begins at 109.",
    "The dream of a 'golden age' – the phrase itself – descends from this passage through Latin (aurea aetas) into every European language."],
  license: "Public-domain Greek text (Evelyn-White's edition) via the Perseus Digital Library.", source: "https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0020.tlg002.perseus-grc2:109-120"
},
{
  id: "r19", title: "Would that the Argo had never flown", author: "Euripides", work: "Medea, lines 1–8", level: "Advanced poetry", kind: "Drama", dialect: "Attic",
  text: "Εἴθ᾽ ὤφελ᾽ Ἀργοῦς μὴ διαπτάσθαι σκάφος\nΚόλχων ἐς αἶαν κυανέας Συμπληγάδας,\nμηδ᾽ ἐν νάπαισι Πηλίου πεσεῖν ποτε\nτμηθεῖσα πεύκη, μηδ᾽ ἐρετμῶσαι χέρας\nἀνδρῶν ἀρίστων, οἳ τὸ πάγχρυσον δέρας\nΠελίᾳ μετῆλθον. οὐ γὰρ ἂν δέσποιν᾽ ἐμὴ\nΜήδεια πύργους γῆς ἔπλευσ᾽ Ἰωλκίας\nἔρωτι θυμὸν ἐκπλαγεῖσ᾽ Ἰάσονος·",
  translation: "Would that the Argo's hull had never winged its way through the dark Clashing Rocks to the land of the Colchians, and that the pine had never fallen, felled in the glens of Pelion, nor fitted with oars the hands of the best of men, who went to fetch the all-golden fleece for Pelias. For then my mistress Medea would not have sailed to the towers of the land of Iolcus, her heart struck senseless with love for Jason;",
  gloss: { "Εἴθ᾽ ὤφελ᾽": "would that … never (εἴθε + ὤφελον + infinitive: the unattainable wish)", "Ἀργοῦς": "of the Argo", "διαπτάσθαι": "to have flown through (aorist infinitive of διαπέτομαι)", "σκάφος": "hull", "Κόλχων": "of the Colchians", "αἶαν": "land (poetic)", "κυανέας Συμπληγάδας": "the dark Clashing Rocks", "νάπαισι": "glens", "Πηλίου": "of Pelion, the Thessalian mountain", "τμηθεῖσα": "felled (aorist passive participle of τέμνω)", "πεύκη": "pine", "ἐρετμῶσαι": "to fit with oars", "χέρας": "hands (poetic accusative)", "πάγχρυσον δέρας": "all-golden fleece", "Πελίᾳ": "for Pelias, the usurper king of Iolcus", "μετῆλθον": "went to fetch", "δέσποιν᾽": "mistress (elided δέσποινα)", "πύργους": "towers", "Ἰωλκίας": "of Iolcus", "ἔρωτι": "with love (dative of cause)", "ἐκπλαγεῖσ᾽": "struck out of her senses (aorist passive participle of ἐκπλήσσω)" },
  notes: ["The play's opening (Athens, 431 BC – the same spring the Peloponnesian War began): Medea's old Nurse, alone before the house in Corinth, wishes the whole story undone before it starts.",
    "The counterfactual runs the chain of causes backwards – no Argo, no felled pine, no heroes' voyage, no Medea in Greece. The ancient commentators already noticed the reversed order (the ship sails before its timber falls) and defended it as the leap of an anguished mind.",
    "Grammar in action: εἴθε + ὤφελον + infinitive is the unattainable wish, and οὐ γὰρ ἄν + aorist (ἔπλευσ᾽) the unreal past – the condition map of Stage Γ΄ powering the most famous prologue in tragedy.",
    "The excerpt ends at the strong pause (the raised dot) after Ἰάσονος; the Nurse's sentence in fact runs on for several more lines – tragic periods breathe long.",
    "Metre: iambic trimeter, as in the Sophocles reading."],
  license: "Public-domain Greek text (Gilbert Murray's Oxford text) via the Perseus Digital Library.", source: "https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0006.tlg003.perseus-grc2:1-8"
},
{
  id: "r20", title: "Brekekekex koax koax", author: "Aristophanes", work: "Frogs, lines 209–221", level: "Advanced poetry", kind: "Drama", dialect: "Attic",
  text: "βρεκεκεκὲξ κοὰξ κοάξ,\nβρεκεκεκὲξ κοὰξ κοάξ.\nλιμναῖα κρηνῶν τέκνα,\nξύναυλον ὕμνων βοὰν\nφθεγξώμεθ᾽, εὔγηρυν ἐμὰν ἀοιδάν,\nκοὰξ κοάξ,\nἣν ἀμφὶ Νυσήιον\nΔιὸς Διόνυσον ἐν\nΛίμναισιν ἰαχήσαμεν,\nἡνίχ᾽ ὁ κραιπαλόκωμος\nτοῖς ἱεροῖσι Χύτροισι\nχωρεῖ κατ᾽ ἐμὸν τέμενος λαῶν ὄχλος.\nβρεκεκεκὲξ κοὰξ κοάξ.",
  translation: "Brekekekex koax koax, brekekekex koax koax! Marsh-children of the springs, let us sound forth our cry in concert with the pipes, my sweet-voiced song – koax koax! – the song we shouted for Nysean Dionysus son of Zeus in the Marshes, when the hungover-revelling crowd of people at the holy Feast of Pots comes streaming through my precinct. Brekekekex koax koax!",
  gloss: { "βρεκεκεκὲξ κοὰξ κοάξ": "the frogs' croak – pure onomatopoeia, and the most famous nonsense in Greek", "λιμναῖα": "of the marsh", "κρηνῶν τέκνα": "children of the springs", "ξύναυλον": "in concert with the pipe (ξυν- + αὐλός)", "ὕμνων βοὰν": "cry of hymns", "φθεγξώμεθ᾽": "let us sound forth (hortatory subjunctive, elided)", "εὔγηρυν": "sweet-voiced", "ἐμὰν ἀοιδάν": "my song (Doric colouring: long alpha for Attic ἐμὴν ᾠδήν)", "Νυσήιον": "Nysean – of Nysa, Dionysus's legendary mountain", "Λίμναισιν": "in the Marshes – Dionysus's actual Athenian precinct ἐν Λίμναις", "ἰαχήσαμεν": "we shouted, raised the cry", "ἡνίχ᾽": "when (ἡνίκα, elided and aspirated)", "ὁ κραιπαλόκωμος": "hungover-revelling (κραιπάλη 'hangover' + κῶμος 'revel' – a comic coinage)", "ἱεροῖσι Χύτροισι": "at the holy Feast of Pots (the Chytroi, third day of the Anthesteria)", "τέμενος": "precinct", "λαῶν ὄχλος": "crowd of people" },
  notes: ["Frogs (405 BC): the god Dionysus, despairing of tragedy after Euripides' death, rows across the infernal lake to fetch him back from Hades – and is serenaded, and taunted, by a chorus of frogs he cannot see. He tries to out-croak them; the frogs win.",
    "This is comedy's counterweight to everything else in the Reading Room: the same lyric machinery as Pindar (hortatory subjunctive, Doric alpha, cult allusion) put to the service of a croak.",
    "The frogs' self-portrait is precise Athenian religion: Dionysus ἐν Λίμναις ('in the Marshes') was a real sanctuary, opened once a year at the Anthesteria, whose third day was the Chytroi, the 'Pots'. The joke lands because the geography is true.",
    "The chorus of frogs sings only in this scene – yet gave the play its name, and European culture one of its most durable earworms.",
    "Lyric metre, iambo-trochaic; the refrain itself scans as an iambic dimeter with resolutions. Comic coinages like κραιπαλόκωμος are a genre signature – comedy invents words the way epic inherits them."],
  license: "Public-domain Greek text (Hall and Geldart's Oxford text) via the Perseus Digital Library.", source: "https://scaife.perseus.org/reader/urn:cts:greekLit:tlg0019.tlg009.perseus-grc2:209-221"
},
{
  id: "r21", title: "If you had suffered such things", author: "Lysias", work: "On the Murder of Eratosthenes 1", level: "Intermediate", kind: "Oratory", dialect: "Attic",
  text: "περὶ πολλοῦ ἂν ποιησαίμην, ὦ ἄνδρες, τὸ τοιούτους ὑμᾶς ἐμοὶ δικαστὰς περὶ τούτου τοῦ πράγματος γενέσθαι, οἷοίπερ ἂν ὑμῖν αὐτοῖς εἴητε τοιαῦτα πεπονθότες· εὖ γὰρ οἶδ᾽ ὅτι, εἰ τὴν αὐτὴν γνώμην περὶ τῶν ἄλλων ἔχοιτε, ἥνπερ περὶ ὑμῶν αὐτῶν, οὐκ ἂν εἴη ὅστις οὐκ ἐπὶ τοῖς γεγενημένοις ἀγανακτοίη, ἀλλὰ πάντες ἂν περὶ τῶν τὰ τοιαῦτα ἐπιτηδευόντων τὰς ζημίας μικρὰς ἡγοῖσθε.",

{
  id: "r22", title: "Not histories, but lives", author: "Plutarch", work: "Life of Alexander 1.1–3", level: "Advanced prose", kind: "Biography", dialect: "Koine",
  text: "τὸν Ἀλεξάνδρου τοῦ βασιλέως βίον καὶ τοῦ Καίσαρος, ὑφ᾽ οὗ κατελύθη Πομπήϊος, ἐν τούτῳ τῷ βιβλίῳ γράφοντες, διὰ τὸ πλῆθος τῶν ὑποκειμένων πράξεων οὐδὲν ἄλλο προεροῦμεν ἢ παραιτησόμεθα τοὺς ἀναγινώσκοντας, ἐὰν μὴ πάντα μηδὲ καθ᾽ ἕκαστον ἐξειργασμένως τι τῶν περιβοήτων ἀπαγγέλλωμεν, ἀλλὰ ἐπιτέμνοντες τὰ πλεῖστα, μὴ συκοφαντεῖν.\nοὔτε γὰρ ἱστορίας γράφομεν, ἀλλὰ βίους, οὔτε ταῖς ἐπιφανεστάταις πράξεσι πάντως ἔνεστι δήλωσις ἀρετῆς ἢ κακίας, ἀλλὰ πρᾶγμα βραχὺ πολλάκις καὶ ῥῆμα καὶ παιδιά τις ἔμφασιν ἤθους ἐποίησε μᾶλλον ἢ μάχαι μυριόνεκροι καὶ παρατάξεις αἱ μέγισται καὶ πολιορκίαι πόλεων.\nὥσπερ οὖν οἱ ζῳγράφοι τὰς ὁμοιότητας ἀπὸ τοῦ προσώπου καὶ τῶν περὶ τὴν ὄψιν εἰδῶν, οἷς ἐμφαίνεται τὸ ἦθος, ἀναλαμβάνουσιν, ἐλάχιστα τῶν λοιπῶν μερῶν φροντίζοντες, οὕτως ἡμῖν δοτέον εἰς τὰ τῆς ψυχῆς σημεῖα μᾶλλον ἐνδύεσθαι καὶ διὰ τούτων εἰδοποιεῖν τὸν ἑκάστου βίον, ἐάσαντας ἑτέροις τὰ μεγέθη καὶ τοὺς ἀγῶνας.",
  translation: "In writing in this book the life of King Alexander and of Caesar, by whom Pompey was overthrown, because of the multitude of deeds that form our subject we shall make no other preface than to beg our readers not to cavil if we do not report everything, nor any one of the celebrated exploits exhaustively, but abridge most of them. For it is not histories we are writing, but lives; nor is there always in the most illustrious deeds a revelation of virtue or vice, but often a small thing – a remark, a jest – has produced a clearer impression of character than battles with their tens of thousands of dead, the greatest marshalings of armies, and sieges of cities. So, just as painters catch their likenesses from the face and the look about the eyes, in which character shows itself, taking the least account of the remaining parts, so must it be granted to us to enter rather into the signs of the soul, and by these to portray the life of each man, leaving to others the grand deeds and the contests.",
  gloss: { "ὑφ᾽ οὗ κατελύθη": "by whom (Pompey) was overthrown", "ὑποκειμένων": "underlying, forming the subject", "προεροῦμεν": "we shall say by way of preface (future of προλέγω)", "παραιτησόμεθα": "we shall beg the indulgence of", "τοὺς ἀναγινώσκοντας": "our readers", "ἐξειργασμένως": "exhaustively, in full detail", "περιβοήτων": "celebrated, famous", "ἐπιτέμνοντες": "abridging, cutting short", "συκοφαντεῖν": "to cavil (literally, to play the informer)", "ἱστορίας": "histories", "βίους": "lives", "ἐπιφανεστάταις": "most illustrious", "δήλωσις": "revelation, display", "πρᾶγμα βραχὺ": "a small thing", "ῥῆμα": "a remark, a phrase", "παιδιά": "a jest", "ἔμφασιν ἤθους": "an impression of character", "μυριόνεκροι": "with tens of thousands of dead (a coinage: μυρίοι + νεκροί)", "παρατάξεις": "pitched battle-lines", "πολιορκίαι": "sieges", "ζῳγράφοι": "painters (ζῷον + γράφω – note the subscript)", "τὰς ὁμοιότητας": "the likenesses", "ἀναλαμβάνουσιν": "catch, take up", "δοτέον": "it must be granted (verbal adjective in -τέον)", "σημεῖα": "signs", "εἰδοποιεῖν": "to portray, give form to", "ἐάσαντας": "leaving (aorist participle of ἐάω)" },
  notes: ["The preface to the paired Lives of Alexander and Caesar – the most famous statement of what biography is for: character over event, the telling anecdote over the great battle.",
    "οὔτε γὰρ ἱστορίας γράφομεν, ἀλλὰ βίους is the sentence by which the genre defined itself, and Plutarch's Parallel Lives – a Greek paired with a Roman, compared – carried it through Shakespeare (via North's translation) into every modern biography.",

  id: "r23", title: "I am telling the truth when I say I lie", author: "Lucian", work: "A True Story 1.4", level: "Advanced prose", kind: "Fiction", dialect: "Koine",
  text: "τούτοις οὖν ἐντυχὼν ἅπασιν, τοῦ ψεύσασθαι μὲν οὐ σφόδρα τοὺς ἄνδρας ἐμεμψάμην, ὁρῶν ἤδη σύνηθες ὂν τοῦτο καὶ τοῖς φιλοσοφεῖν ὑπισχνουμένοις· ἐκεῖνο δὲ αὐτῶν ἐθαύμασα, εἰ ἐνόμιζον λήσειν οὐκ ἀληθῆ συγγράφοντες. διόπερ καὶ αὐτὸς ὑπὸ κενοδοξίας ἀπολιπεῖν τι σπουδάσας τοῖς μεθ᾽ ἡμᾶς, ἵνα μὴ μόνος ἄμοιρος ὦ τῆς ἐν τῷ μυθολογεῖν ἐλευθερίας, ἐπεὶ μηδὲν ἀληθὲς ἱστορεῖν εἶχον — οὐδὲν γὰρ ἐπεπόνθειν ἀξιόλογον — ἐπὶ τὸ ψεῦδος ἐτραπόμην πολὺ τῶν ἄλλων εὐγνωμονέστερον· κἂν ἓν γὰρ δὴ τοῦτο ἀληθεύσω λέγων ὅτι ψεύδομαι. οὕτω δ᾽ ἄν μοι δοκῶ καὶ τὴν παρὰ τῶν ἄλλων κατηγορίαν ἐκφυγεῖν αὐτὸς ὁμολογῶν μηδὲν ἀληθὲς λέγειν. γράφω τοίνυν περὶ ὧν μήτε εἶδον μήτε ἔπαθον μήτε παρ᾽ ἄλλων ἐπυθόμην, ἔτι δὲ μήτε ὅλως ὄντων μήτε τὴν ἀρχὴν γενέσθαι δυναμένων. διὸ δεῖ τοὺς ἐντυγχάνοντας μηδαμῶς πιστεύειν αὐτοῖς.",
  translation: "So when I had read all these authors, I did not much blame the men for their lying, seeing that this was by now habitual even among those professing philosophy; but I did wonder at them for thinking they would escape notice writing untruths. Therefore, as I too, out of vanity, was eager to leave something behind for posterity, so that I alone should not be excluded from the freedom of storytelling – since I had nothing true to relate, for nothing worth mentioning had ever happened to me – I turned to lying, far more honestly than the others: for I shall tell the truth in this one thing at least, in saying that I lie. In this way I think I can even escape the accusation the world brings against the rest, since I myself admit that I am saying nothing true. I write, therefore, about things I neither saw nor experienced nor learned from others – things, moreover, that do not exist at all and could not possibly come to be. Accordingly my readers should by no means believe them.",
  gloss: { "ἐντυχὼν": "having read, come upon (aorist participle of ἐντυγχάνω)", "τοῦ ψεύσασθαι": "for their lying (articular infinitive, genitive of cause)", "ἐμεμψάμην": "I blamed (aorist of μέμφομαι)", "σύνηθες": "habitual, customary", "ὑπισχνουμένοις": "those professing (+ φιλοσοφεῖν)", "ἐθαύμασα": "I wondered at", "λήσειν": "that they would escape notice (future infinitive of λανθάνω)", "συγγράφοντες": "writing (the participle carries the point: caught in the act)", "κενοδοξίας": "vanity, empty glory", "τοῖς μεθ᾽ ἡμᾶς": "for those after us – posterity", "ἄμοιρος": "without a share in (+ genitive)", "μυθολογεῖν": "storytelling", "ἱστορεῖν": "to relate (as fact)", "ἐπεπόνθειν": "I had experienced (pluperfect of πάσχω)", "ἀξιόλογον": "worth mentioning", "ἐτραπόμην": "I turned (aorist middle of τρέπω)", "εὐγνωμονέστερον": "more honestly (comparative adverb)", "ἀληθεύσω": "I shall tell the truth", "ψεύδομαι": "I am lying – the famous confession", "κατηγορίαν": "accusation", "ὁμολογῶν": "admitting", "ἐπυθόμην": "I learned by inquiry (aorist of πυνθάνομαι)", "τὴν ἀρχὴν": "at all (adverbial accusative)", "τοὺς ἐντυγχάνοντας": "readers", "μηδαμῶς": "by no means" },
  notes: ["The end of the preface to A True Story, Lucian's parody of travellers' tales (2nd century AD): having skewered Ctesias and company – and Odysseus as the arch-liar of them all – Lucian announces the one honest lie in literature. The voyage (to the Moon, the belly of a whale, the Isle of the Blest) launches in the very next sentence.",
    "This paragraph is the founding manifesto of self-conscious fiction: a narrator who tells you he is lying, and is therefore the only truthful author on the shelf. Its descendants run from Thomas More and Swift to modern metafiction.",
    "The triple μήτε εἶδον μήτε ἔπαθον μήτε … ἐπυθόμην turns the historian's standard credentials (autopsy, experience, inquiry – Herodotus's own ἱστορίη) inside out, one by one.",
    "The Greek is Second Sophistic Atticism: a Syrian author of the Roman empire writing more 'classically' than the classics, playing the classical historian's forms for laughs. Note ἐπεπόνθειν, a genuine pluperfect in the wild.",
    "κἂν ἓν γὰρ δὴ τοῦτο ἀληθεύσω λέγων ὅτι ψεύδομαι – compare the liar's paradox of Epimenides; Lucian defuses it by cheerfully embracing it."],

}

<p>Primary endings go with present, future, perfect, subjunctive; secondary with imperfect, aorist, pluperfect, optative. Augment = past time, indicative only. Reduplication = perfect, all moods.</p>` },
{ title: "Principal parts – what each supplies", body: `<p>Learn verbs in six principal parts: <b lang="grc">λύω, λύσω, ἔλυσα, λέλυκα, λέλυμαι, ἐλύθην</b>.</p>

<p>The Principal Parts lab drills the classic irregular rows – λαμβάνω, φέρω, ὁράω, ἔρχομαι and their kin.</p>` },
{ title: "Accent rules in ten lines", body: `<ol><li>Accent falls on one of the last three syllables only.</li>
<li>If the final syllable is long, the accent cannot reach the antepenult: ἄνθρωπος but ἀνθρώπου.</li>
<li>The circumflex needs a long vowel/diphthong, and only on the last two syllables.</li>
<li>A long penult with accent, before a short final, takes the circumflex: δῶρον, γλῶττα.</li>
<li>Final acute → grave before another word: καλὸς ἀνήρ.</li>
<li>Verbs are recessive: the accent retreats as far as rule 2 allows (λύομεν, ἐλύσαμεν).</li>
<li>Nouns keep their accent where the nominative put it, as far as the rules allow (persistent).</li>
<li>First-declension genitive plural is always -ῶν.</li>
<li>Final -αι and -οι count as short for accent (λύεται, ἄνθρωποι) – except in the optative (λύσαι, λύοι).</li>
<li>Enclitics (μου, τις, ἐστι, γε, τε…) lean on the word before, which may take a second acute: ἄνθρωπός τις.</li></ol>` },
{ title: "Particles cheat-sheet", body: `<table class="gr"><tr><th>Particle</th><th>Signal</th></tr>
<tr><td lang="grc">μέν … δέ</td><td>two halves of a contrast; both second position</td></tr>
<tr><td lang="grc">δέ</td><td>default connector: "and/but"</td></tr>
<tr><td lang="grc">γάρ</td><td>explanation of the previous sentence</td></tr>
<tr><td lang="grc">οὖν</td><td>"so, then" – conclusion or resumption</td></tr>
<tr><td lang="grc">δή</td><td>emphasis, often ironic: "precisely"</td></tr>
<tr><td lang="grc">ἄρα</td><td>inference or realisation: "so, it turns out"</td></tr>
<tr><td lang="grc">γε</td><td>"at least" – limits the word before it</td></tr>
<tr><td lang="grc">τοι</td><td>"mark you" – appeal to the hearer</td></tr>
<tr><td lang="grc">μήν / καὶ μήν</td><td>strong assertion / "moreover, look!"</td></tr>
<tr><td lang="grc">ἀλλά</td><td>sharp "but" – first position</td></tr>
<tr><td lang="grc">τε … καί</td><td>"both … and"</td></tr>
<tr><td lang="grc">καί (adverbial)</td><td>"even, also" before a single word</td></tr></table>` },
{ title: "Conditions – the complete map", body: `<table class="gr"><tr><th>Type</th><th>If-clause</th><th>Then-clause</th><th>Feel</th></tr>
<tr><td>Simple fact</td><td lang="grc">εἰ + indicative</td><td>indicative</td><td>if it is so, then…</td></tr>
<tr><td>Future open</td><td lang="grc">ἐάν + subjunctive</td><td>future indicative</td><td>if (ever) it happens…</td></tr>
<tr><td>Future remote</td><td lang="grc">εἰ + optative</td><td lang="grc">optative + ἄν</td><td>should it happen, it would…</td></tr>
<tr><td>Present unreal</td><td lang="grc">εἰ + imperfect</td><td lang="grc">imperfect + ἄν</td><td>if it were (but it isn't)</td></tr>
<tr><td>Past unreal</td><td lang="grc">εἰ + aorist</td><td lang="grc">aorist + ἄν</td><td>if it had (but it didn't)</td></tr></table>
<p>Negatives: μή in the if-clause, οὐ in the then-clause. General relatives and temporals follow the same logic: ὃς ἄν / ὅταν + subjunctive.</p>` },
{ title: "Subjunctive vs optative – who does what", body: `<table class="gr"><tr><th>Job</th><th>Subjunctive</th><th>Optative</th></tr>
<tr><td>exhortation</td><td lang="grc">ἴωμεν – let's go</td><td>– </td></tr>

<tr><td>wish</td><td>– </td><td lang="grc">εἴθε γένοιτο</td></tr>

<tr><td>purpose (ἵνα)</td><td>after present main verb</td><td>allowed after past main verb</td></tr>
<tr><td>fear (μή)</td><td>after present main verb</td><td>allowed after past main verb</td></tr>
<tr><td>conditions</td><td lang="grc">ἐάν + subj. (open future)</td><td lang="grc">εἰ + opt. (remote)</td></tr></table>
<p>Rule of thumb: subjunctive projects forward vividly; optative holds things at arm's length – in wishes, possibilities, and past-tense subordination.</p>` },
{ title: "The three routes of indirect statement", body: `<table class="gr"><tr><th>After…</th><th>Construction</th><th>Example</th></tr>
<tr><td lang="grc">λέγω, ἀγγέλλω</td><td>ὅτι / ὡς + indicative</td><td lang="grc">λέγει ὅτι ἥκουσιν</td></tr>
<tr><td lang="grc">φημί, νομίζω, οἴομαι, ἡγέομαι, δοκέω</td><td>accusative + infinitive</td><td lang="grc">φησὶν αὐτοὺς ἥκειν</td></tr>
<tr><td lang="grc">οἶδα, αἰσθάνομαι, ὁράω, ἀκούω</td><td>participle (agreeing acc. or nom.)</td><td lang="grc">οἶδεν αὐτοὺς ἥκοντας</td></tr></table>
<p>Infinitive/participle tense = time relative to the main verb (present = same, aorist = before, future = after). Same subject → no accusative, predicate nominative: φησὶ σοφὸς εἶναι. Negative: οὐ – but οὔ φημι = "I deny".</p>` },
{ title: "A reading procedure for long sentences", body: `<ol><li>Read the whole sentence aloud once – do not translate yet.</li>
<li>Mark the finite verb(s); everything else hangs from them.</li>
<li>Ride the articles: each one opens a noun-phrase and names its case.</li>
<li>Bank participles and genitive absolutes as "having…/while…" clauses.</li>
<li>When you meet μέν, expect δέ; when you meet γάρ or οὖν, note what is being explained or concluded.</li>
<li>Reach the main verb; let the banked pieces click into place around it.</li>
<li>Only now produce English – and resist reordering until the Greek order has taught you its emphasis.</li></ol>
<p>Speed comes from repetition of this loop, not from skipping steps.</p>` },
{ title: "Pronunciation schemes compared", body: `<table class="gr"><tr><th></th><th>Restored classical (this course)</th><th>Erasmian (classroom)</th><th>Modern Greek</th></tr>
<tr><td lang="grc">η</td><td>long open e (air)</td><td>ay</td><td>ee</td></tr>
<tr><td lang="grc">ει</td><td>ay (they)</td><td>ay / eye</td><td>ee</td></tr>
<tr><td lang="grc">οι</td><td>oy</td><td>oy</td><td>ee</td></tr>
<tr><td lang="grc">υ</td><td>French u</td><td>oo / ü</td><td>ee</td></tr>
<tr><td lang="grc">β</td><td>b</td><td>b</td><td>v</td></tr>
<tr><td lang="grc">φ θ χ</td><td>aspirated p, t, k</td><td>f, th, kh</td><td>f, th (thin), kh</td></tr>
<tr><td>accents</td><td>musical pitch</td><td>stress</td><td>stress</td></tr></table>
<p>Any consistent scheme works for learning; what matters is that every word has one sound in your head. This course's audio-free design means your inner voice is the instrument – tune it once, early.</p>` },
{ title: "Crasis and elision – words that run together", body: `<p>Real Greek pages are full of words fused or clipped at their boundaries. Nothing new is being said – you just need to recognise the spellings.</p>
<p><b>Elision</b> drops a short final vowel before a following vowel, marked with an apostrophe: <b lang="grc">δ᾽</b> = δέ, <b lang="grc">ἀλλ᾽</b> = ἀλλά, <b lang="grc">ἐπ᾽ αὐτῷ</b> = ἐπὶ αὐτῷ, <b lang="grc">οὐδ᾽</b> = οὐδέ. Before a rough breathing the consonant aspirates: <b lang="grc">ἀφ᾽ οὗ</b> = ἀπὸ οὗ, <b lang="grc">καθ᾽ ἡμέραν</b> = κατὰ ἡμέραν. You met elision in the epic units; prose uses it constantly too.</p>
<p><b>Crasis</b> fuses a word (usually καί or the article) with the next, marked by a breathing-like sign (coronis) <i>inside</i> the new word:</p>
<table class="gr"><tr><th>Written</th><th>Stands for</th><th>Meaning</th></tr>
<tr><td lang="grc">κἀγώ</td><td lang="grc">καὶ ἐγώ</td><td>and I / I too</td></tr>
<tr><td lang="grc">κἄν</td><td lang="grc">καὶ ἄν / καὶ ἐάν</td><td>even if</td></tr>
<tr><td lang="grc">τἆλλα</td><td lang="grc">τὰ ἄλλα</td><td>the rest</td></tr>
<tr><td lang="grc">τοὔνομα</td><td lang="grc">τὸ ὄνομα</td><td>the name</td></tr>
<tr><td lang="grc">ἁνήρ / ὡνήρ</td><td lang="grc">ὁ ἀνήρ</td><td>the man (the second form is dialectal – Sappho's ὤνηρ)</td></tr>
<tr><td lang="grc">ἁγώ</td><td lang="grc">ἃ ἐγώ</td><td>(the things) which I… – Sophocles, OT 6</td></tr></table>
<p>Rule of thumb: an apostrophe at the end of a word is elision; a breathing-shaped mark in the middle of a word is crasis. When a form looks impossible, try splitting it into καί or an article plus what follows – that solves nine cases in ten. You will meet κἀγώ on your first page of Plato or the New Testament.</p>` }

function bareAns(s) { const t = String(s).normalize("NFC"); return plain(t) === t.replace(/ς/g, "σ"); }
// In strict mode, drop unaccented convenience variants whenever a fully
// marked sibling exists in the same answer list.
function answerSet(arr) {
  if (!strictOn()) return arr;
  const keep = arr.filter(a => !(bareAns(a) && arr.some(b => !bareAns(b))));
  return keep.length ? keep : arr;
}
function anorm(s) { return strictOn() ? snorm(s) : norm(s); }
function shuffled(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function route() { return location.hash.replace(/^#\/?/, "") || "home"; }
function go(r) { location.hash = "#/" + r; }
function allUnits() { return COURSE.flatMap(l => l.units.map(u => ({ ...u, level: l }))); }
function unit(id) { return allUnits().find(u => u.id === id); }
function reading(id) { return READINGS.find(r => r.id === id); }
function doneLevel(l) { return l.units.filter(u => store.data.completed[u.id]).length; }
function applyTheme() {
  let t = store.data.settings.theme;
  if (t === "system") t = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.content = t === "dark" ? "#0d0d0f" : "#ece3d1";
}
function activity(type, id, extra) {
  store.data.activity.unshift(Object.assign({ type, id, at: Date.now() }, extra || {}));
  store.data.activity = store.data.activity.slice(0, 200);
}
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
}

/* ------------------------------------------------------- course sequence */
function reachedUnitIds() {
  const ids = [];
  for (const u of allUnits()) { ids.push(u.id); if (!store.data.completed[u.id]) break; }
  return ids;
}
function nextUnitRoute() {
  const u = allUnits().find(x => !store.data.completed[x.id]);
  return u ? "unit/" + u.id + "/lesson" : "readings";
}

/* ------------------------------------------------------------ flashcards */
function allCards() {
  const scope = store.data.settings.cardScope || "reached";
  const reach = new Set(reachedUnitIds());
  const c = [];
  allUnits().forEach(u => {
    if (scope === "all" || reach.has(u.id))
      u.vocab.forEach((v, i) => c.push({ id: "u:" + u.id + ":" + i, la: v[0], en: v[1], source: u.title }));
  });
  Object.entries(store.data.extraCards).forEach(([id, x]) => c.push(Object.assign({ id }, x)));
  return c;
}
function controlledCount() { return READINGS.filter(r => r.kind === "Controlled").length; }
function authenticCount() { return READINGS.length - controlledCount(); }
function totalCourseCards() { return allUnits().reduce((n, u) => n + u.vocab.length, 0) + Object.keys(store.data.extraCards).length; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => store.data.cards[c.id] && (store.data.cards[c.id].due || 0) <= now);
}
function newCards() { return allCards().filter(c => !store.data.cards[c.id]); }
const NEW_PER_SESSION = 10;
function sessionCount() { return Math.min(dueCards().length + Math.min(newCards().length, NEW_PER_SESSION), 30); }

/* ------------------------------------------------------------------ quiz */
let quiz = null;
const QUIZ_LEN = 8, REVIEW_LEN = 15;
const isChoice = e => e.t === "mcq" || e.t === "parse";
function prepare(exercises, n) {
  return shuffled(exercises).slice(0, n).map(e => {
    if (!isChoice(e)) return Object.assign({}, e);
    const order = shuffled(e.opts.map((_, i) => i));
    return Object.assign({}, e, { opts: order.map(i => e.opts[i]), a: order.indexOf(e.a) });
  });
}
function viewQuiz(id) {
  const u = unit(id);
  if (!u) return viewHome();
  const bank = u.exercises.map((e, idx) => Object.assign({}, e, { exKey: u.id + ":" + idx }));
  quiz = { title: u.title, unitId: u.id, back: "unit/" + u.id + "/practice", kind: "unit", qs: prepare(bank, QUIZ_LEN), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>${u.title}</h1><p class="sub">Practice · ${quiz.qs.length} of ${u.exercises.length} questions, drawn at random</p><div id="quizbox"></div>`;
}
// Weighted sample without replacement: exercises you have missed recently
// (and, mildly, ones not seen lately) come back more often than pure chance.
function weightedSample(pool, n, wf) {
  const items = pool.map(x => ({ x, w: Math.max(wf(x), 0.01) }));
  const out = [];
  while (items.length && out.length < n) {
    let t = items.reduce((s, i) => s + i.w, 0), r = Math.random() * t, k = 0;
    for (; k < items.length - 1; k++) { r -= items[k].w; if (r <= 0) break; }
    out.push(items.splice(k, 1)[0].x);
  }
  return out;
}
function viewReview() {
  const reach = reachedUnitIds();
  const pool = allUnits().filter(u => reach.includes(u.id))
    .flatMap(u => u.exercises.map((e, idx) => Object.assign({}, e, { from: u.title, exKey: u.id + ":" + idx })));
  if (pool.length < 4)
    return `<h1>Mixed review</h1><p class="sub">Cumulative practice across everything you have studied.</p><div class="card"><p>Complete a unit or two first – this pulls its questions from the units you have reached, in random order, so that older material keeps coming back.</p><button class="btn primary" onclick="go('${nextUnitRoute()}')">Go to the next unit</button></div>`;
  const picked = weightedSample(pool, REVIEW_LEN, e => 1 + 2 * Math.min((store.data.ex[e.exKey] || {}).w || 0, 4));
  quiz = { title: "Mixed review", back: "review", kind: "review", qs: prepare(picked, REVIEW_LEN), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>Mixed review</h1><p class="sub">${quiz.qs.length} questions drawn from the units you have reached – ones you have missed before are drawn more often</p><div id="quizbox"></div>`;
}
function quizEndButtons(pct) {
  if (quiz.kind === "unit")
    return `<button class="btn primary" onclick="go('${quiz.back}')">Back to unit</button> <button class="btn" onclick="go('review')">Mixed review</button>`;
  if (quiz.kind === "alpha" || quiz.kind === "parts")
    return `<button class="btn primary" onclick="render()">Another round</button> <button class="btn" onclick="go('${quiz.back}')">Done</button>`;
  return `<button class="btn primary" onclick="render()">Another round</button> <button class="btn" onclick="go('home')">Done</button>`;
}
function renderQuestion() {
  if (!quiz) return;
  const box = $("#quizbox");
  if (!box) return;
  if (quiz.i >= quiz.qs.length) {
    const pct = Math.round(100 * quiz.score / quiz.qs.length);
    if (quiz.kind === "unit") {
      store.data.scores[quiz.unitId] = Math.max(store.data.scores[quiz.unitId] || 0, pct);
      if (pct >= 75) store.data.completed[quiz.unitId] = true;
      activity("unit", quiz.unitId, { pct });
    } else if (quiz.kind === "alpha") activity("alpha", null, { pct });
    else if (quiz.kind === "parts") activity("parts", null, { pct });
    else activity("review", null, { pct });
    store.save();
    box.innerHTML = `<div class="card" style="text-align:center;padding:35px"><div style="font-size:50px;font-weight:700">${pct}%</div><p>${quiz.score} of ${quiz.qs.length} correct.${quiz.kind === "unit" ? (pct >= 75 ? " Unit marked complete." : " Review the lesson and try again.") : ""}</p>` + quizEndButtons(pct) + `</div>`;
    renderSidebar();
    return;
  }
  const e = quiz.qs[quiz.i];
  quiz.answered = false;
  let controls;
  if (isChoice(e))
    controls = `<div class="opts">${e.opts.map((o, i) => `<button class="opt" type="button" onclick="answerMCQ(${i})">${o}</button>`).join("")}</div>`;
  else if (e.t === "pick")
    controls = `<div class="picksent" lang="grc">${e.s.split(/\s+/).map((w, i) => `<button class="pickword" type="button" onclick="answerPick(${i})">${esc(w)}</button>`).join(" ")}</div>`;
  else
    controls = `<div class="answerrow"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="${strictOn() ? "Type the exact form – breathings and accents required" : e.t === "trans" ? "Type the new form – accents optional, Latin letters accepted" : "Type the missing form – accents optional, Latin letters accepted"}" onkeydown="if(event.key==='Enter'){event.preventDefault();answerText()}"><button class="btn primary" id="checkbtn" type="button" onclick="answerText()">Check</button></div>` + keypad();
  const label = { parse: "Parse the form", trans: "Transform", pick: "Click the word", fill: "Complete", mcq: "Choose" }[e.t] || "";
  box.innerHTML = `<div class="progress"><i style="width:${100 * quiz.i / quiz.qs.length}%"></i></div>
<div class="exercise"><span class="pill">${quiz.i + 1}/${quiz.qs.length}</span> <span class="pill acc">${label}</span>${e.from ? ` <span class="pill">${esc(e.from)}</span>` : ""}
${e.form ? `<div class="formbox" lang="grc">${e.form}</div>` : ""}<p>${e.q}</p>${controls}<div id="feedback" role="status" aria-live="polite"></div></div>
<button class="btn" onclick="endPractice()">End practice</button>`;
  setTimeout(() => { const a = $("#answer"); if (a) a.focus(); }, 0);
}
function endPractice() {
  const b = quiz ? quiz.back : "home";
  quiz = null;
  if (route() === b) go("home"); else go(b);
}
// A small on-screen keyboard so that no Greek keyboard layout is required.
function keypad() {
  const rows = "αβγδεζηθικλμνξοπρστυφχψως";
  let html = `<div class="keypad" aria-label="Greek letters">${[...rows].map(c => `<button type="button" tabindex="-1" onclick="typeChar('${c}')">${c}</button>`).join("")}</div>`;
  if (strictOn()) {
    // Combining marks for strict mode: type the letter first, then the mark.
    const marks = [["0313", "smooth breathing"], ["0314", "rough breathing"], ["0301", "acute"], ["0300", "grave"], ["0342", "circumflex"], ["0345", "iota subscript"]];
    html += `<div class="keypad" aria-label="Diacritics – press after the letter">${marks.map(([m, t]) => `<button type="button" tabindex="-1" title="${t}" onclick="typeChar('\\u${m}')">\u25CC${String.fromCharCode(parseInt(m, 16))}</button>`).join("")}</div>`;
  }
  return html;
}
function typeChar(c) {
  const a = $("#answer");
  if (!a || a.disabled) return;
  const s = a.selectionStart ?? a.value.length, e = a.selectionEnd ?? a.value.length;
  a.value = a.value.slice(0, s) + c + a.value.slice(e);
  a.focus(); a.setSelectionRange(s + 1, s + 1);
}
function answerMCQ(i) {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i];
  [...document.querySelectorAll(".opt")].forEach((b, j) => {
    b.disabled = true;
    if (j === e.a) b.classList.add("correct"); else if (j === i) b.classList.add("wrong");
  });
  finishAnswer(i === e.a, e);
}
function answerPick(i) {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i], words = e.s.split(/\s+/);
  // Exact (diacritic-sensitive) match first: pick exercises often test
  // precisely the accent or breathing that loose norm() folds away.
  const strip = w => String(w).normalize("NFC").replace(/[.,;:·!?“”"«»()\[\]]/g, "");
  let target = words.findIndex(w => strip(w) === strip(e.a));
  if (target < 0) target = words.findIndex(w => norm(w) === norm(e.a));
  const ok = target >= 0 ? strip(words[i]) === strip(words[target]) : norm(words[i]) === norm(e.a);
  [...document.querySelectorAll(".pickword")].forEach((b, j) => {
    b.disabled = true;
    if (ok ? j === i : j === target) b.classList.add("correct");
    else if (!ok && j === i) b.classList.add("wrong");
  });
  finishAnswer(ok, e);
}
// Compare one expected answer with the typed value. Latin-script answers
// (transliterations) always use loose folding – macrons are untypeable –
// and in loose mode a Greek answer may also be typed in Latin letters.
function cmpAns(a, v) {
  if (!isGreekAns(a)) return norm(a) === norm(v);
  if (strictOn()) return snorm(a) === snorm(v);
  return norm(a) === norm(v) || (!isGreekAns(v) && latinize(a) === latinize(v));
}
function answerText() {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i], input = $("#answer"), v = input ? input.value : "";
  if (!norm(v)) { const f = $("#feedback"); if (f) f.innerHTML = `<div class="feedback no">Type an answer first.</div>`; return; }
  if (input) input.disabled = true;
  const btn = $("#checkbtn"); if (btn) btn.disabled = true;
  finishAnswer(answerSet(e.a).some(a => cmpAns(a, v)), e, v);
}
function finishAnswer(ok, e, typed) {
  quiz.answered = true;
  if (ok) quiz.score++;
  if (e.exKey) {
    const x = store.data.ex[e.exKey] || { w: 0 };
    x.w = ok ? Math.max(0, (x.w || 0) - 1) : Math.min(5, (x.w || 0) + 1);
    x.at = Date.now();
    if (x.w) store.data.ex[e.exKey] = x; else delete store.data.ex[e.exKey];
  }
  const expected = isChoice(e) ? e.opts[e.a] : esc(Array.isArray(e.a) ? e.a[0] : e.a);
  // Diagnose the near-miss: right letters, wrong (or wrongly ordered) marks.
  let msg = ok ? "Correct." : "Not quite. Expected: " + expected;
  if (!ok && typed != null && !isChoice(e) && e.t !== "pick") {
    const as = Array.isArray(e.a) ? e.a : [e.a];
    if (as.some(a => isGreekAns(a) && norm(a) === norm(typed)))
      msg = "Right word, wrong marks – breathing or accent. Expected: " + expected +
        (strictOn() ? " <small>(type the letter, then breathing, then accent)</small>" : "");
  }
  $("#feedback").innerHTML =
    `<div class="feedback ${ok ? "ok" : "no"}">${msg}</div>` +
    (e.ex ? `<div class="why">${e.ex}</div>` : "") +
    `<button class="btn small" id="nextq" style="margin-top:10px" type="button" onclick="quiz.i++;renderQuestion()">Next</button>`;
  setTimeout(() => { const n = $("#nextq"); if (n) n.focus(); }, 0);
}

function readingCards() {

function viewReadings() {

<div class="readfilter">${["all"].concat(kinds).map(k => `<button class="btn small ${readKind === k ? "primary" : ""}" onclick="readKind='${esc(k)}';render()">${k === "all" ? "All" : k}</button>`).join("")}</div>
<div id="readlist">${readingCards()}</div>`;
}

let aid = { gloss: false, notes: false, translation: false };
function glossedText(r) { return glossify(r.text, r.gloss); }
function glossify(text, gloss) {
  const raw = text;
  const br = s => esc(s).replace(/\n/g, "<br>");
  if (!aid.gloss) return br(raw);
  const entries = Object.keys(gloss || {}).map(k => ({ key: k, disp: k }))
    .filter(e => e.disp).sort((a, b) => b.disp.length - a.disp.length);
  if (!entries.length) return br(raw);
  const alt = entries.map(e => e.disp.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const re = new RegExp(`(^|[^${LET}])(${alt})(?![${LET}])`, "giu");
  const fold = s => String(s).normalize("NFC").toLowerCase();
  let out = "", last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    const start = m.index + m[1].length, word = m[2];
    out += br(raw.slice(last, start));
    const hit = entries.find(e => fold(e.disp) === fold(word));
    out += `<button class="word" type="button" data-g="${esc(hit ? hit.key : word)}">${esc(word)}</button>`;
    last = start + word.length;
    if (re.lastIndex <= last) re.lastIndex = last;
  }
  return out + br(raw.slice(last));
}
function showGloss(id, key) {
  const r = reading(id);
  if (!r) return;
  const src = r.chapters ? (currentChapter(r).gloss || {}) : r.gloss;
  let g = src[key];
  if (!g) { const hit = Object.entries(src).find(([k]) => norm(k) === norm(String(key))); g = hit ? hit[1] : ""; }
  const tip = $("#glosstip");
  tip.innerHTML = g ? `<div class="glosstip"><b lang="grc">${esc(key)}</b> – ${esc(g)}</div>` : "";
  clearTimeout(showGloss.t);
  showGloss.t = setTimeout(() => { tip.innerHTML = ""; }, 5000);
}
let chapNo = 1;
function currentChapter(r) { return r.chapters[Math.min(Math.max(chapNo, 1), r.chapters.length) - 1]; }
function chaptersRead(r) { return Object.keys(store.data.chapterDone[r.id] || {}).length; }
function toggleChapter(id, n) {
  const d = store.data.chapterDone;
  d[id] = d[id] || {};
  if (d[id][n]) delete d[id][n]; else { d[id][n] = true; activity("reading", id, { ch: n }); }
  const r = reading(id);
  if (Object.keys(d[id]).length === r.chapters.length) store.data.readingDone[id] = true;
  else delete store.data.readingDone[id];
  store.save(); render();
}
function goChapter(id, n) { location.hash = "#/read/" + id + "/" + n; }

function viewWork(r) {
  const c = currentChapter(r), n = c.n, total = r.chapters.length;
  const done = !!(store.data.chapterDone[r.id] || {})[n];
  const body = c.sections.map((s, i) =>

  const dots = r.chapters.map(x =>

  return `<span class="pill acc">${r.kind}</span><h1>${r.title}</h1>
<p class="sub">${r.author} · ${r.work} · ${r.level}</p>
<div class="chapbar"><div class="chdots">${dots}</div><span class="chprog">${chaptersRead(r)}/${total} chapters read</span></div>
<h2 class="chtitle">${n}. ${esc(c.title)}</h2>
<div class="aidbar">
<button class="btn small ${aid.gloss ? "on" : ""}" aria-pressed="${aid.gloss}" onclick="aid.gloss=!aid.gloss;render()">Lexical glosses</button>
<button class="btn small ${aid.notes ? "on" : ""}" aria-pressed="${aid.notes}" onclick="aid.notes=!aid.notes;render()">Notes</button>

</div>
<div class="card worktext">${body}</div>
${aid.gloss ? `<div class="aidbox"><b>Glossary – chapter ${n}</b><div class="vocab">${Object.entries(c.gloss).map(([k, v]) => `<div><b lang="grc">${esc(k)}</b><br>${esc(v)}</div>`).join("")}</div><button class="btn small" onclick="addChapterCards('${r.id}',${n})">Add this chapter's glossary to flashcards</button></div>` : ""}
${aid.notes ? `<div class="aidbox notes"><b>Reading notes</b><ul>${c.notes.map(x => `<li>${x}</li>`).join("")}</ul></div>` : ""}
<div class="chapnav">
${n > 1 ? `<button class="btn" onclick="goChapter('${r.id}',${n - 1})">← Chapter ${n - 1}</button>` : `<button class="btn" onclick="go('readings')">← Library</button>`}
<button class="btn primary" onclick="toggleChapter('${r.id}',${n})">${done ? "Chapter read ✓" : "Mark chapter read"}</button>
${n < total ? `<button class="btn" onclick="goChapter('${r.id}',${n + 1})">Chapter ${n + 1} →</button>` : `<button class="btn" onclick="go('readings')">Library →</button>`}
</div>
<div class="source"><b>Source and reuse.</b> ${r.license}${r.source ? ` <a href="${r.source}" target="_blank" rel="noopener">Open source text</a>.` : ""}</div>`;
}

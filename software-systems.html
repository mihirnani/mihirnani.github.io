}
function focusTrace() {
  const el = document.getElementById("trace-in") || document.getElementById("trace-next");
  if (el) el.focus();
}
function traceNext() { labTrace.answered = false; labTrace.i++; render(); focusTrace(); }
function traceFinish() { labComplete(labTrace.def.id, 15); labTrace = null; go("lab/trace"); }

/* measure runner */
function viewMeasureRunner(id) {
  const def = MEASURES.find(m => m.id === id);
  if (!def) return "<p>Experiment not found.</p>";
  if (!labMeasure || labMeasure.id !== id) labMeasure = { id, choice: null, rows: null };
  let body = "";
  if (labMeasure.choice == null) {
    body = `<div class="card"><b>Before you run it — predict:</b><p style="font-size:14.5px;margin:8px 0 10px">${def.predict.q}</p>
      <div class="opts">${def.predict.opts.map((o, i) => `<button class="optbtn" onclick="measureChoose(${i})">${esc(o)}</button>`).join("")}</div></div>`;
  } else if (!labMeasure.rows) {
    const right = labMeasure.choice === def.predict.a;
    body = `<div class="card"><p style="font-size:14.5px;margin:0 0 12px">${right ? "✅ Prediction locked in." : "Prediction locked in — let's see."} The experiment runs synchronously in this tab and usually takes a moment — possibly longer on older devices.</p>
      <button class="btn primary" onclick="measureRun()">▶ Run the experiment</button></div>`;
  } else {
    const right = labMeasure.choice === def.predict.a;
    const series = [...new Set(labMeasure.rows.map(r => r.series))];
    const prev = {};
    const rowsHtml = labMeasure.rows.map(r => {
      const ratio = prev[r.series] ? (r.ms / prev[r.series]).toFixed(1) + "×" : "—";
      prev[r.series] = r.ms;
      return `<tr><td>${esc(r.series)}</td><td>${r.n.toLocaleString()}</td><td style="font-family:ui-monospace,monospace">${r.ms.toFixed(2)} ms</td><td style="font-family:ui-monospace,monospace">${ratio}</td></tr>`;
    }).join("");
    body = `<div class="card">
      <table class="gr"><tr><th>Method</th><th>n</th><th>time</th><th>× previous</th></tr>${rowsHtml}</table>
      <p style="font-size:14px;color:var(--ink-2)"><b>${right ? "✅ Your prediction was right." : "❌ Your prediction: “" + esc(def.predict.opts[labMeasure.choice]) + "” — the data disagrees."}</b> ${def.explain}</p>
      <p style="font-size:13px;color:var(--muted)">Timings vary run to run (JIT warm-up, background load — the benchmarking caveats from L4U1). The <i>ratios</i> are the signal, not the milliseconds.</p>
      <button class="btn" onclick="labMeasure.rows=null;labMeasure.choice=null;render()">↺ Predict &amp; run again</button></div>`;
  }
  return `<p style="margin:0 0 4px"><a href="#/lab/measure" onclick="labMeasure=null">← Measure lab</a></p>
  <h1>${def.icon} ${def.title}</h1>
  <p class="sub">${def.blurb}</p>${body}`;
}
function measureChoose(i) { labMeasure.choice = i; render(); }
function measureRun() {
  const def = MEASURES.find(m => m.id === labMeasure.id);
  labMeasure.rows = def.run();
  labComplete(def.id, labMeasure.choice === def.predict.a ? 15 : 10);
  render();
}

/* code challenge runner */
function viewChallengeBody(ch) {
  const id = ch.id;
  const code = labCode[id] != null ? labCode[id] : ch.starter;
  const res = labResult && labResult.id === id ? labResult.html : "";
  return `<p class="sub">${ch.brief}</p>
  <textarea class="labcode" id="ch-code" spellcheck="false" aria-label="Code editor for ${esc(ch.title)}">${esc(code)}</textarea>
  <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
    <button class="btn primary" onclick="runChallenge('${id}')">▶ Run tests</button>
    <button class="btn small" onclick="labCode['${id}']=null;labResult=null;render()">↺ Reset code</button>
    <span style="font-size:12.5px;color:var(--muted)">${ch.fixed.length} fixed edge cases + 200 randomized differential tests, in an isolated worker</span>
  </div>
  <div id="ch-result" aria-live="polite">${res}</div>`;
}
function viewChallenge(id) {
  const ch = codeSpec(id);
  if (!ch) return "<p>Challenge not found.</p>";
  return `<p style="margin:0 0 4px"><a href="#/lab/code" onclick="labResult=null">← Code lab</a></p>
  <h1>${ch.icon} ${ch.title} ${store.data.lab[id] ? '<span class="pill acc">✓ solved</span>' : ""}</h1>
  ${viewChallengeBody(ch)}`;
}
function fmtVal(v) { try { return JSON.stringify(v); } catch (e) { return String(v); } }
function codeSpec(id) {
  return CHALLENGES.find(c => c.id === id) || CAPSTONES.map(c => c.build).find(b => b.id === id);
}
const CH_META = {
  "ch-reverse": { unit: "l1u1" }, "ch-maxidx": { unit: "l1u1" },
  "ch-binsearch": { unit: "l3u1", trace: "tr-bin" }, "ch-brackets": { unit: "l2u1" },
  "ch-twosum": { unit: "l2u2" }, "ch-merge": { unit: "l3u2", trace: "tr-part" },
  "ch-dedupe": { unit: "l4u1" }, "ch-bfs": { unit: "l2u5", trace: "tr-bfs" },
  "cap-lru-code": { unit: "l4u3" }, "cap-sched-code": { unit: "l3u5", trace: "tr-bfs" },
  "cap-route-code": { unit: "l3u5", trace: "tr-bin" }
};
function remediationLinks(id) {
  const meta = CH_META[id];
  if (!meta) return "";
  const u = unitById(meta.unit);
  const tr = meta.trace ? LAB_TRACES.find(t => t.id === meta.trace) : null;
  return `<p style="font-size:13px;margin:8px 0 0">Review: <a href="#/unit/${meta.unit}/learn">${esc(u.unit.title)} (lesson)</a>${tr ? ` · <a href="#/lab/trace/${tr.id}">${esc(tr.title)} (trace)</a>` : ""}</p>`;
}
function challengeReport(id, ch, r) {
  const meta = CH_META[id];
  if (r.ok) {
    if (meta) recordSkill(meta.unit, true);
    if (ch.cap) capsMark(ch.cap, "c");
    else labComplete(id, 25);
    labResult = { id, html: `<div class="tres ok"><span class="thead">✓ All ${r.passed} tests passed — fixed edge cases and 200 randomized checks.</span><pre>Solved. Try a variant: could you break your own solution with a nastier generator?</pre></div>` };
    render();
    return;
  }
  if (meta && r.compile == null) { recordSkill(meta.unit, false); pullCardForward(meta.unit); }
  let why, head;
  if (r.compile != null) {
    head = "✗ Couldn't run your code";
    why = `<pre>${esc(r.compile)}</pre>`;
  } else {
    head = `✗ ${r.passed} passed, then a ${r.kind} case failed`;
    if (r.err != null) why = `<pre>Input:    ${esc(r.input.map(fmtVal).join(",  "))}\nThrew:    ${esc(r.err)}</pre>`;
    else if (r.mutated) why = `<pre>Input was mutated! The spec said: do not modify the input.\nInput:    ${esc(fmtVal(r.input))}</pre>`;
    else if (r.checkMsg != null && r.checkMsg !== "__mismatch__") why = `<pre>Input:    ${esc(r.input.map(fmtVal).join(",  "))}\nProblem:  ${esc(r.checkMsg)}\nYour answer: ${esc(fmtVal(r.got))}</pre>`;
    else why = `<pre>Input:    ${esc(r.input.map(fmtVal).join(",  "))}\nExpected: ${esc(fmtVal(r.expected))}\nGot:      ${esc(fmtVal(r.got))}</pre>`;
    why += `<pre>Tip from L4U4: this is your shrunk counterexample — trace your code on it by hand.</pre>${remediationLinks(id)}`;
  }
  labResult = { id, html: `<div class="tres bad"><span class="thead">${head}</span>${why}</div>` };
  const el = document.getElementById("ch-result");
  if (el) el.innerHTML = labResult.html;
}

/* The test loop that runs INSIDE the sandboxed worker (stringified below).
   It has no access to the page, the DOM or localStorage. */
function __workerMain(codeStr, fname, fixed, noMutate, refFn, genFn, checkFn, resultPort) {
  // resultPort is a private MessagePort held only in this closure. Submitted
  // code cannot reach it: calling the global postMessage() posts to a channel
  // the page deliberately does not listen on, so results cannot be spoofed.
  var fn;
  try {
    fn = new Function('"use strict";' + codeStr + '\n;return ' + fname + ';')();
    if (typeof fn !== "function") throw new Error(fname + " is not defined as a function");
  } catch (e) { resultPort.postMessage({ ok: false, compile: String(e && e.message || e) }); return; }
  var cases = fixed.map(function (args) { return { args: args, kind: "fixed" }; });
  for (var k = 0; k < 200; k++) cases.push({ args: genFn(), kind: "random" });
  var passed = 0;
  for (var ci = 0; ci < cases.length; ci++) {
    var c = cases[ci];
    var a1 = JSON.parse(JSON.stringify(c.args));
    var a2 = JSON.parse(JSON.stringify(c.args));
    var expected = refFn.apply(null, a1);
    var got, err = null, checkMsg = null;
    try { got = fn.apply(null, a2); } catch (e) { err = String(e && e.message || e); }
    var mutated = noMutate && JSON.stringify(a2) !== JSON.stringify(c.args);
    if (err === null && !mutated) {
      if (checkFn) { try { checkMsg = checkFn(c.args, got, expected); } catch (e) { checkMsg = "checker error: " + String(e && e.message || e); } }
      else if (JSON.stringify(got) !== JSON.stringify(expected)) checkMsg = "__mismatch__";
    }
    if (err !== null || mutated || checkMsg != null) {
      resultPort.postMessage({ ok: false, passed: passed, kind: c.kind, input: c.args, expected: expected, got: got, err: err, mutated: mutated, checkMsg: checkMsg });
      return;
    }
    passed++;
  }
  resultPort.postMessage({ ok: true, passed: passed });
}

function buildWorkerSource(ch, code) {
  const helpers = [randInt, randArr, randSortedDistinct, genBracket, bfsRef, shuffle].map(f => f.toString()).join("\n");
  // The worker waits for one bootstrap message carrying the private result
  // port, captures it in a closure, then runs the harness. Submitted code
  // executes only after self.onmessage is cleared and has no path to the port.
  return helpers + "\nself.onmessage = function (__ev) {\n" +
    "  var __port = __ev.ports[0];\n" +
    "  self.onmessage = null;\n" +
    "  (" + __workerMain.toString() + ")(" +
    JSON.stringify(code) + "," + JSON.stringify(ch.fname) + "," + JSON.stringify(ch.fixed) + "," +
    JSON.stringify(!!ch.noMutate) + ",(" + ch.ref.toString() + "),(" + ch.gen.toString() + ")," +
    (ch.check ? "(" + ch.check.toString() + ")" : "null") + ", __port);\n};";
}

function runChallenge(id) {
  const ch = codeSpec(id);
  const code = document.getElementById("ch-code").value;
  labCode[id] = code;
  const resEl = document.getElementById("ch-result");
  let worker;
  try {
    const blob = new Blob([buildWorkerSource(ch, code)], { type: "application/javascript" });
    const url = URL.createObjectURL(blob);
    worker = new Worker(url);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) {
    // FAIL CLOSED: never run untrusted code in the page context.
    challengeReport(id, ch, { ok: false, compile: "The isolated code runner (Web Worker) is unavailable in this context, so your code was not executed — this app refuses to run submitted code outside the sandbox. Serve the course over http(s) to enable the harness." });
    return;
  }
  resEl.innerHTML = '<div class="tres"><span class="thead">⏳ Running in an isolated worker…</span></div>';
  const timer = setTimeout(() => {
    worker.terminate();
    labResult = { id, html: '<div class="tres bad"><span class="thead">✗ Timed out after 4 seconds — almost certainly an infinite loop.</span><pre>The worker was terminated safely; the page never froze. Check every loop: does each branch make progress toward termination? (Binary search’s hi ← mid bug is the classic culprit.)</pre></div>' };
    const el = document.getElementById("ch-result"); if (el) el.innerHTML = labResult.html;
  }, 4000);
  // Authoritative results arrive ONLY over this private channel; ordinary
  // worker messages (which submitted code could forge via postMessage) are ignored.
  const channel = new MessageChannel();
  let settled = false;
  channel.port1.onmessage = (ev) => {
    if (settled) return;
    settled = true;
    clearTimeout(timer); worker.terminate(); challengeReport(id, ch, ev.data);
  };
  worker.onerror = (ev) => {
    if (settled) return;
    settled = true;
    clearTimeout(timer); worker.terminate(); challengeReport(id, ch, { ok: false, compile: String(ev.message || "Worker error") });
  };
  worker.postMessage(null, [channel.port2]);
}

/* Note: there is deliberately NO in-page fallback runner. If the sandbox
   cannot be constructed, submitted code is not executed at all. */

/* ---------- data & settings ---------- */
function viewData() {
  const s = store.data;
  const size = JSON.stringify(s).length;
  return `<h1>⚙️ Data &amp; settings</h1>
  <p class="sub">Your progress lives in this browser${store.memOnly ? " — <b>but storage is blocked here, so export before closing!</b>" : "'s local storage"}. Export it to move between browsers or devices, or just as a backup.</p>
  <div class="card">
    <b>Backup &amp; restore</b>
    <p style="font-size:14px;color:var(--ink-2)">Export writes a small JSON file (${(size / 1024).toFixed(1)} KB) with your completed units, quiz scores, XP, streak and flashcard schedule. Import it on any other browser to pick up where you left off.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" onclick="exportProgress()">⬇️ Export progress (.json)</button>
      <button class="btn" onclick="document.getElementById('importfile').click()">⬆️ Import progress</button>
    </div>
  </div>
  <div class="card">
    <b>Appearance</b>
    <p style="font-size:14px;color:var(--ink-2);margin:8px 0 6px">Theme:
    <select onchange="setTheme(this.value)" style="font-family:inherit;padding:4px 8px;border-radius:7px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink)">
      ${["auto", "light", "dark"].map(t => `<option ${s.settings.theme === t ? "selected" : ""}>${t}</option>`).join("")}
    </select></p>
  </div>
  <div class="card">
    <b>Danger zone</b>
    <p style="font-size:14px;color:var(--ink-2)">Wipe all progress and start over. This cannot be undone (unless you exported a backup!).</p>
    <button class="btn" style="color:var(--bad);border-color:var(--bad)" onclick="resetAll()">Reset all progress</button>
  </div>
  <div class="card">
    <b>About</b>
    <p style="font-size:14px;color:var(--ink-2)">A self-contained course on algorithms and data structures: ${COURSE.reduce((n, l) => n + l.units.length, 0)} units across 4 levels, ${allCardsCount()} concept flashcards, and a reference library of ${ALGOLIB.length} classic algorithms with pseudocode — from Big-O and arrays through trees and graphs to DP, Dijkstra and the structures inside real systems. Every lesson includes a "Going deeper" section with correctness proofs, worked traces, recurrence solving and production-grade variants, and the Lab adds interactive traces, timing experiments run in this browser, executable coding challenges checked by a differential test harness, three synthesis capstones, and an optional AI studio teaching supervision of generated code. Works offline after its first online load. Keyboard shortcuts in flashcards: <kbd>Space</kbd> reveal, <kbd>1</kbd>–<kbd>4</kbd> grade.</p>
  </div>
  <div class="card">
    <b>Scope, honestly stated</b>
    <p style="font-size:14px;color:var(--ink-2)">This course teaches the algorithmic core of software: data structures, algorithms, complexity and problem-solving, with connections to the systems they power. It does <i>not</i> substantially cover programming language instruction, operating systems, networking or databases as subjects, concurrency, software architecture, or version control and deployment — those are separate subjects. Pair it with the Systems Engineering course for the systems-level view, and with real programming projects for fluency in an executable language.</p>
  </div>`;
}
function allCardsCount() { let n = 0; for (const l of COURSE) for (const u of l.units) n += u.vocab.length; return n; }
function setTheme(t) {
  store.data.settings.theme = t; store.save();
  applyTheme();
}
function applyTheme() {
  const t = store.data.settings.theme;
  const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
if (themeMedia.addEventListener) themeMedia.addEventListener("change", applyTheme);
else if (themeMedia.addListener) themeMedia.addListener(applyTheme);

function exportProgress() {
  const blob = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "software-systems-progress-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Progress exported ⬇️");
}
document.getElementById("importfile").addEventListener("change", function () {
  const f = this.files[0]; this.value = "";
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast("That progress file is too large."); return; }
  const r = new FileReader();
  r.onload = () => {
    try {
      store.data = sanitizeProgress(JSON.parse(r.result));
      store.save(); applyTheme(); render();
      toast("Progress imported ✓");
    } catch (e) { toast("Couldn't read that file — is it an exported progress .json?"); }
  };
  r.onerror = () => toast("Couldn't read that file.");
  r.readAsText(f);
});
function resetAll() {
  if (!confirm("Really wipe ALL progress? Export a backup first if unsure.")) return;
  store.data = cloneDefaults();
  store.save(); applyTheme(); render();
  toast("Progress reset");
}

/* =====================================================================
   BOOT
   ===================================================================== */
store.load();
applyTheme();
render();

/* PWA: register a service worker scoped only to this application page. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(
      "./software-systems-sw.js",
      { scope: "./software-systems.html" }
    ).catch(err => console.warn("Software Systems offline support was not installed:", err));
  });
}

<tr><td>4</td><td>all</td><td>0</td><td>3</td><td>1</td><td>8</td><td>C finalised: s→B→A→C</td></tr>
</table>
<p>Step 2 is the algorithm's whole personality: A's direct estimate (4) is <i>overturned</i> by the detour through B (1+2=3) — tentative labels are hypotheses, demoted the moment a better route relaxes them; only extraction makes a label a fact. Now the correctness proof in one paragraph: induction on extraction order — when u is extracted with label d, suppose some shorter path to u existed. That path leaves the finalised set at some edge (x, y) with x finalised; y's label ≤ dist(x) + w(x,y) ≤ length of that path &lt; d — but then the min-heap would have extracted y before u. Contradiction. The inequality dist(x) + w(x,y) ≤ path length is where non-negativity earns its keep: a negative edge later in the path could undercut it, and the proof — not just the performance — collapses.</p>
<h3>Bellman-Ford: paying for negative edges</h3>
<pre class="code"><b>function</b> bellmanFord(G, s):
    dist[v] ← ∞ for all v;  dist[s] ← 0
    <b>repeat</b> V − 1 <b>times</b>:
        <b>for each</b> edge (u, v, w) <b>in</b> G:        <i>// relax EVERY edge, blindly</i>
            <b>if</b> dist[u] + w &lt; dist[v]: dist[v] ← dist[u] + w
    <b>for each</b> edge (u, v, w) <b>in</b> G:            <i>// one extra pass:</i>
        <b>if</b> dist[u] + w &lt; dist[v]: <b>return</b> "negative cycle"
    <b>return</b> dist</pre>
<p>No priority queue, no finalisation, no cleverness: relax all E edges, V−1 times — O(VE). Why V−1 suffices: after pass k, every shortest path using ≤ k edges is correct (induction), and no simple path uses more than V−1 edges. The final extra pass is elegant: if anything <i>still</i> improves, some cycle has negative total weight — "shortest path" is undefined (loop forever, go to −∞) and the algorithm says so instead of lying. That detection is why currency-arbitrage finders literally run Bellman-Ford on exchange-rate graphs (log-prices make products into sums; a negative cycle IS an arbitrage). Dijkstra vs Bellman-Ford is this course's assumptions lesson in miniature: stronger assumption (non-negative), faster algorithm; weaker assumption, slower but honest everywhere.</p>
<h3>Prim's algorithm, and the MST proof</h3>
<pre class="code"><b>function</b> prim(G):
    pick any start s;  tree ← {s}
    PQ ← edges leaving s, keyed by weight
    <b>while</b> tree lacks vertices:
        (u, v, w) ← extract-min(PQ)      <i>// cheapest edge leaving the tree</i>
        <b>if</b> v <b>in</b> tree: <b>continue</b>          <i>// stale: both ends inside now</i>
        add v to tree;  record edge (u, v)
        <b>for each</b> edge (v, x, w2): <b>if</b> x not in tree: PQ.insert</pre>
<p>Structurally it <i>is</i> Dijkstra with the key changed — cheapest <i>edge</i> leaving the tree, rather than cheapest <i>total distance</i> — one line of difference, entirely different problem solved. Both Prim and Kruskal are justified by the <b>cut property</b>, and its proof is the exchange argument again, in graph costume: let e be the cheapest edge crossing some cut, and T any spanning tree avoiding e. Adding e to T closes a cycle, which must cross the cut at some other edge f with w(f) ≥ w(e); swap — T − f + e is a spanning tree, no heavier. So the cheapest crossing edge is always <i>safe</i>, greedy never regrets, and both algorithms merely choose different orders in which to apply the same safe move. One theorem, two famous algorithms.</p>
<h3>A* in one honest paragraph</h3>
<p>Game pathfinding and map routing rarely run plain Dijkstra — it expands in blind circles. <b>A*</b> orders the priority queue by dist(v) + h(v), where h(v) is a <i>heuristic estimate</i> of remaining distance (straight-line distance, for maps). If h never overestimates (an <b>admissible</b> heuristic), A* is exactly as correct as Dijkstra and expands dramatically fewer vertices — the search flows toward the goal like water downhill. Set h = 0 and A* <i>is</i> Dijkstra; overestimate and it goes fast but can return wrong answers — a knob trading guarantees for speed. It's the perfect closing exhibit for Level 3: the classic algorithms aren't museum pieces but chassis, and one extra term in a priority key is sometimes the whole difference between a textbook and a shipped game.</p>`,

  subtitle: "Complexity in the wild — hidden costs and honest measurements",
  grammar: `
<h3>Start from the operations, not the structure</h3>
<p>Real design runs backwards from the workload: <b>list the operations and their frequencies</b>, then buy the structure whose fast operations match. The core catalogue in one table:</p>
<table class="gr">
<tr><th>Need</th><th>Reach for</th><th>Cost</th></tr>
<tr><td>index lookup, iteration, append</td><td>dynamic array</td><td>O(1), O(n), am. O(1)</td></tr>
<tr><td>membership / key lookup</td><td>hash set / map</td><td>O(1) average</td></tr>
<tr><td>sorted order, ranges, nearest</td><td>balanced BST / sorted structure</td><td>O(log n)</td></tr>
<tr><td>repeated min/max</td><td>heap</td><td>O(log n) per op</td></tr>
<tr><td>LIFO / FIFO discipline</td><td>stack / queue</td><td>O(1)</td></tr>
<tr><td>relationships / reachability</td><td>graph + BFS/DFS</td><td>O(V+E)</td></tr>
</table>
<h3>The hidden O(n) inside innocent code</h3>
<p>The costliest complexity mistakes hide behind pretty syntax. <code>x in myList</code> is an O(n) scan; <code>x in mySet</code> is O(1) — same character count, a factor of n apart. Repeated string concatenation in a loop copies the whole string each time: O(n²) in many languages (hence string builders / join). <code>insert(0, x)</code> on an array shifts everything: O(n) per call. The skill is <b>reading the Big-O of an API call</b>, not just of your own loops — every convenient method has a cost model, documented or not.</p>
<pre class="code"><i>// the classic accidental O(n²): dedup with a list</i>
<b>for</b> x <b>in</b> items:                <i>// n iterations…</i>
    <b>if</b> x <b>not in</b> seenList:      <i>// …× O(n) scan = O(n²)</i>
        seenList.append(x)
<i>// swap seenList for a hash set: O(n) total</i></pre>
<h3>Measure before you optimise</h3>
<p>Knuth: <i>"premature optimization is the root of all evil"</i> — in context: <b>97% of code doesn't matter; find the 3% that does</b>. The tool is a <b class="it">profiler</b>, and its findings are routinely humiliating: the slow part is almost never where you'd have guessed. Discipline: make it correct → measure → optimise the measured <b class="it">hot spot</b> only — usually by fixing an accidental O(n²) or swapping a structure, not by micro-tuning arithmetic. An O(n²)-to-O(n) fix beats any amount of code golf.</p>
<div class="tip"><b>Amortized vs worst case is a product decision:</b> a dynamic array's append is amortized O(1) but occasionally O(n) — fine for a batch job, potentially a dropped frame in a game or a latency spike in a trading system. Latency-critical systems pay for worst-case guarantees (preallocated buffers, real-time-safe structures). Know which bill your users care about: the average or the spike.</div>
<h3>Going deeper: the cost sheet of a standard library</h3>
<p>Memorising this table pays rent daily — it's Level 2 translated into the collections you actually type:</p>
<table class="gr">
<tr><th>Operation</th><th>Dynamic array (list)</th><th>Hash map/set (dict)</th><th>Sorted structure (TreeMap)</th></tr>
<tr><td>x in c</td><td><b>O(n)</b> ⚠️</td><td>O(1) avg</td><td>O(log n)</td></tr>
<tr><td>c[i] / c[key]</td><td>O(1)</td><td>O(1) avg</td><td>O(log n)</td></tr>
<tr><td>append / add</td><td>O(1) amortized</td><td>O(1) avg</td><td>O(log n)</td></tr>
<tr><td>insert(0, x)</td><td><b>O(n)</b> ⚠️</td><td>—</td><td>O(log n)</td></tr>
<tr><td>delete by value</td><td><b>O(n)</b> ⚠️ (find + shift)</td><td>O(1) avg</td><td>O(log n)</td></tr>
<tr><td>min / max</td><td>O(n)</td><td>O(n)</td><td><b>O(1)–O(log n)</b></td></tr>
<tr><td>iterate in sorted order</td><td>O(n log n) (sort first)</td><td>O(n log n) (sort first)</td><td><b>O(n)</b></td></tr>
</table>
<p>The ⚠️ cells are where accidental quadratics are born: each is an innocent-looking call that silently scans or shifts. A related habit — know your language's <i>actual</i> costs, not folklore: Python's list.pop(0) is O(n) (use collections.deque); Java's LinkedList.get(i) is O(n) (people assume list = fast indexing); string += in a loop is quadratic in some runtimes and optimised in others. Thirty seconds in the documentation beats an afternoon in the profiler.</p>
<h3>A refactor, end to end</h3>
<p>Before — matching orders to customers, the way it's naturally first written:</p>
<pre class="code"><b>for</b> order <b>in</b> orders:                       <i>// n orders</i>
    <b>for</b> customer <b>in</b> customers:             <i>// × m customers = O(n·m)</i>
        <b>if</b> customer.id = order.customerId:
            report.append(customer.name, order.total)</pre>
<p>After — one pass to index, one pass to join:</p>
<pre class="code">byId ← empty map                            <i>// O(m) build</i>
<b>for</b> customer <b>in</b> customers: byId[customer.id] ← customer
<b>for</b> order <b>in</b> orders:                       <i>// O(n) probe</i>
    report.append(byId[order.customerId].name, order.total)</pre>
<p>50,000 orders × 20,000 customers: a billion comparisons collapse to 70,000 map operations — four orders of magnitude, from a refactor that took two minutes and made the code <i>clearer</i>. This build-an-index-then-probe move is the single most valuable optimisation in commercial code — it is literally what a database join does, and once you see it you'll find it missing everywhere. General form: any nested loop whose inner body is "find my partner in that collection" wants the inner collection indexed by the lookup key first.</p>
<h3>Benchmarking without fooling yourself</h3>
<p>Measurement has its own failure modes, worth knowing by name. <b>Warm-up:</b> JIT-compiled languages (Java, JS) run code slowly the first thousands of iterations, then compile it — time the warmed state, or you're measuring the compiler. <b>Caching:</b> the second run of anything I/O-ish hits warm caches (OS page cache, CPU cache); decide which state — cold or warm — matches production, and measure that one deliberately. <b>Variance:</b> run repeatedly and look at the distribution — a mean without spread is a guess; prefer medians and p95s, since one background process pollutes a mean for free. <b>Dead code:</b> optimisers delete computations whose results are unused — your 0-nanosecond loop may literally not have run; consume the result. <b>Scale honestly:</b> measure at production-like n, because at toy sizes constants dominate and the O(n²) may win (correctly!). The discipline in one line: benchmarks are experiments — control the variables, or the numbers are anecdotes.</p>
<h3>Memory is a workload too</h3>
<p>Time complexity gets the fame; memory kills quietly. A profiler that shows <i>allocations</i> often explains a "slow" program better than a CPU profile: allocation churn (millions of short-lived objects) taxes the garbage collector until pauses dominate; duplicated copies of big collections (a sort that copies, a slice that retains its giant parent) blow past RAM into swap, where every access is a disk access and Big-O analysis becomes meteorology. The standard repairs mirror the time-side ones: preallocate and reuse buffers in hot loops; stream instead of materialising (process items as they arrive rather than building the full list); choose compact representations (an array of structs over a map of maps) when n is large. Space–time trading runs both directions, and the direction you need depends on which resource your system is actually starving for — which is, once again, a question for measurement, not intuition.</p>`,

  id: "l4u2", title: "Problem-solving patterns",
  subtitle: "Two pointers, sliding window, hash-map tricks & binary search on the answer",
  grammar: `
<h3>Patterns: compressed experience</h3>
<p>Most algorithmic problems are variations on a dozen reusable moves. Learning the patterns — and, crucially, their <b>trigger conditions</b> — converts "impossible" problems into "which pattern is this?".</p>
<h3>Two pointers</h3>
<p><b>Trigger:</b> sorted array, or comparing from both ends. Two indices sweep toward each other, each step eliminating candidates. Pair-sum in a <i>sorted</i> array:</p>
<pre class="code">lo ← 0;  hi ← n−1
<b>while</b> lo &lt; hi:
    s ← A[lo] + A[hi]
    <b>if</b> s = target: <b>return</b> (lo, hi)
    <b>else if</b> s &lt; target: lo ← lo+1     <i>// sum too small: need a bigger element</i>
    <b>else</b>: hi ← hi−1                   <i>// sum too big: need a smaller one</i></pre>
<p>O(n) where all-pairs is O(n²) — sortedness lets each comparison discard a whole line of candidates.</p>
<h3>Sliding window</h3>
<p><b>Trigger:</b> best contiguous run — longest substring, max sum of k consecutive, shortest subarray ≥ target. Maintain a window [left, right] and <b>update incrementally</b>: as the window slides, add the entering element, remove the leaving one — O(1) per move instead of recomputing the window from scratch.</p>
<pre class="code"><i>// max sum of any k consecutive elements — O(n), not O(nk)</i>
sum ← A[0] + … + A[k−1];  best ← sum
<b>for</b> right <b>from</b> k <b>to</b> n−1:
    sum ← sum + A[right] − A[right−k]     <i>// slide: one in, one out</i>
    best ← max(best, sum)</pre>
<h3>The hash-map family</h3>
<p><b>Trigger:</b> "have I seen…", counting, grouping — Level 2's lesson industrialised. Frequency count (word counts, anagram grouping); <b>seen-set</b> (duplicates, cycle detection); <b>complement lookup</b> (pair-sum in <i>unsorted</i> arrays: for each x, is target − x already seen?); <b>prefix-sum + hash map</b> (count subarrays summing to k — the sneaky classic). Each replaces an inner O(n) search with O(1).</p>
<h3>Binary search on the answer</h3>
<p><b>Trigger:</b> "minimise the maximum…" / "can it be done with capacity C?" — where feasibility is <b>monotonic</b> in C (if C works, C+1 works). Then binary search over C itself, running a feasibility check per probe:</p>
<pre class="code"><i>// smallest ship capacity to deliver packages in D days</i>
lo ← max(weights);  hi ← sum(weights)
<b>while</b> lo &lt; hi:
    mid ← ⌊(lo+hi)/2⌋
    <b>if</b> canShipWithin(D, mid): hi ← mid     <i>// feasible: try smaller</i>
    <b>else</b>: lo ← mid + 1                     <i>// infeasible: need bigger</i>
<b>return</b> lo</pre>
<p>Level 3's monotonic-predicate idea at full power: the array being searched is <i>the space of possible answers</i>.</p>
<div class="tip"><b>Pattern-matching, honestly:</b> patterns are hypotheses, not proofs. After matching one, verify its trigger actually holds — two pointers needs the sorted/monotonic structure; sliding window needs contiguity and incremental updates; answer-search needs monotonic feasibility. A pattern applied without its precondition is just a bug with good posture.</div>
<h3>Going deeper: the variable window, fully worked</h3>
<pre class="code"><b>function</b> longestUniqueSubstring(s):
    seen ← empty map                    <i>// char → latest index</i>
    left ← 0;  best ← 0
    <b>for</b> right <b>from</b> 0 <b>to</b> n−1:
        c ← s[right]
        <b>if</b> c <b>in</b> seen <b>and</b> seen[c] ≥ left:
            left ← seen[c] + 1          <i>// jump past the duplicate</i>
        seen[c] ← right
        best ← max(best, right − left + 1)
    <b>return</b> best</pre>

<h3>Prefix sums + hash map: the sneaky classic</h3>
<p>Count subarrays summing exactly to k, with negatives allowed (which kills sliding windows — the window loses monotonicity). Insight: a subarray (i, j] sums to k iff prefix[j] − prefix[i] = k, i.e. <b>prefix[i] = prefix[j] − k</b>. So walk once, counting how often the needed earlier prefix has been seen:</p>
<pre class="code"><b>function</b> countSubarrays(A, k):
    seen ← map {0: 1}                   <i>// empty prefix: sum 0 seen once</i>
    sum ← 0;  count ← 0
    <b>for</b> x <b>in</b> A:
        sum ← sum + x
        count ← count + seen.get(sum − k, 0)   <i>// partners ending here</i>
        seen[sum] ← seen.get(sum, 0) + 1
    <b>return</b> count</pre>

<pre class="code"><b>function</b> hasCycle(head):

<h3>Same ideas, industrial strength</h3>
<p>Everything in Level 2 ships in production — wearing armour. Five structures worth recognising on sight:</p>
<h3>B-trees — the database's tree</h3>
<p>Disks and SSDs read in large blocks, and each read is ~10⁵× slower than RAM. A binary tree wastes a whole block-read per two-way decision; a <b class="it">B-tree</b> node fills the block with <i>hundreds</i> of keys, making the tree hundreds-way branching and therefore <b>shallow</b>: billions of rows in 3–4 levels. Every relational database index (and most filesystems) is a B-tree/B+ tree; "add an index" means "build a B-tree on this column". Same BST logic — rebalanced around the cost of I/O, the true bottleneck.</p>
<h3>LRU cache — composition as design</h3>
<p>A cache with capacity k evicting the <b>least recently used</b> item needs: O(1) lookup, and O(1) move-to-front/evict-oldest. No single structure does both — the classic answer is two: a <b>hash map</b> (key → node) pointing into a <b>doubly linked list</b> kept in recency order. Every operation is a lookup plus a couple of pointer rewires: O(1). This composition runs CDN nodes, database buffer pools, and your browser cache.</p>
<h3>Bloom filters — probabilistic membership</h3>
<p>A <b class="it">bloom filter</b> answers "have I seen this?" using a bit array and several hash functions: set k bits to insert; check k bits to query. Answers are <b>"definitely not"</b> or <b>"probably yes"</b> (false positives possible, false negatives never) — in a few bits per item, versus storing items themselves. Databases use one in front of disk: "definitely not on disk" skips the expensive read entirely. A structure that's <i>allowed to be wrong one way</i> can be magically small.</p>
<h3>Tries — the prefix tree</h3>
<p>A <b class="it">trie</b> stores strings as root-to-node paths, one character per edge: all keys sharing a prefix share a path. Autocomplete is a walk-then-subtree-scan; lookup is O(length of key), independent of how many keys are stored. Routers longest-prefix-match IP addresses in tries; spell-checkers walk them.</p>
<h3>Consistent hashing — hashing that survives change</h3>
<p>Sharding by <code>hash(key) mod N</code> has a fatal flaw: change N (a server dies or is added) and <i>nearly every key remaps</i> — a cache stampede. <b class="it">Consistent hashing</b> places servers and keys on a conceptual ring; each key belongs to the next server clockwise. Adding or removing a server moves only <b>~1/N of keys</b>. This idea (plus virtual nodes to even the load) underpins distributed caches and databases — Level 4 of the systems course waves hello.</p>
<div class="tip"><b>The meta-lesson:</b> real structures are Level-2 primitives, adapted to a dominating cost (disk I/O → B-trees; memory size → bloom filters; churn → consistent hashing) or composed per-operation (LRU = map + list). When you meet an unfamiliar system structure, ask: which primitive is this, and which constraint bent it into this shape?</div>
<h3>Going deeper: inside a B-tree insert</h3>
<p>A B-tree of order m keeps every node between ⌈m/2⌉−1 and m−1 keys (root exempt), all leaves at <i>exactly the same depth</i>. Insertion always lands in a leaf; the interesting moment is a full leaf, which <b>splits</b>: the median key moves up into the parent, and the two halves become siblings. If the parent fills, it splits too — splits cascade <i>upward</i>, and when the root itself splits, the tree grows a new root and gets one level <b>taller from the top</b>. That's the deep contrast with BSTs: a BST grows downward at the leaves and can grow lopsided; a B-tree grows upward at the root and <i>cannot</i> be unbalanced — perfect height balance is a structural inevitability, not a maintained invariant. Deletion mirrors with borrowing from siblings and merging. The practical numbers: order ~200 (a 16 KB page of keys), so height 3 covers ~8 million keys and height 4 covers billions — and the top two levels live permanently in the buffer pool, so a "4-level" lookup usually costs one or two real disk reads.</p>
<h3>The write side: why LSM-trees exist</h3>
<p>B-trees update <i>in place</i> — a write means find the page, modify, write back: random I/O. Write-heavy modern systems (logs, metrics, messaging) instead use the <b>log-structured merge tree</b>: writes append into an in-memory sorted buffer (a balanced tree or skip list); when full, it flushes to disk as an immutable sorted file (SSTable); background <b>compaction</b> merge-sorts files together (Level 3's merge step, industrialised). Reads check the memory buffer, then recent files, then older ones — helped by a bloom filter per file ("definitely not in this one" skips it entirely: the Unit-3 filter earning its keep). The trade is explicit: LSM buys sequential-write throughput by paying <b>read amplification</b> (several places to look) and compaction background work; B-trees buy predictable point reads by paying random-write cost. Cassandra, RocksDB and LevelDB sit on LSM; classic relational engines sit on B-trees; and the choice between them is a workload question — write-mostly vs read-mostly — not a fashion question.</p>
<h3>Bloom filter math you can actually use</h3>
<p>m bits, k hash functions, n inserted items: each insert sets k bits; a query of an absent item false-positives only if all its k probe bits happen to be set, giving rate p ≈ <b>(1 − e^(−kn/m))^k</b>. The design recipe runs backwards from a target: choosing m/n = 10 bits per item and the optimal k = (m/n)·ln 2 ≈ 7 hashes yields p ≈ 1%; ~14.4 bits per item yields 0.1%. Two properties worth quoting in design reviews: the bits-per-item cost is <i>independent of item size</i> (a 10-byte key and a 10 KB document cost the same 10 bits), and classic blooms cannot delete (clearing a bit might erase other items' evidence — counting-bloom and cuckoo-filter variants exist for that). Sizing rule of thumb to keep: <b>10 bits and 7 hashes per item ≈ 1% wrong-yes, 0% wrong-no</b> — small enough to hold membership info for a billion items in ~1.2 GB.</p>
<h3>Consistent hashing, mechanically</h3>
<pre class="code"><i>// the ring is just a sorted array of (position, server) pairs</i>
<b>function</b> lookup(key):
    h ← hash(key)
    <b>return</b> first server at position ≥ h      <i>// binary search! wrap at the end</i>

<b>function</b> addServer(s):
    <b>for</b> i <b>from</b> 1 <b>to</b> 150:                     <i>// 150 virtual nodes</i>
        insert (hash(s.name + ":" + i), s) into the sorted ring</pre>
<p>Note the delicious detail: lookup on the ring is a <b>lower-bound binary search</b> (Level 3's variant, verbatim) over the sorted virtual-node positions. Why 150 virtual nodes? With one point per server, arc lengths vary wildly — one unlucky server owns 3× its share. Scattering each server to ~150 points makes every server's total arc a sum of many small random arcs, and sums of many random pieces concentrate near the mean (the same statistical fact that makes polling work): load evens out to within a few percent. Virtual nodes also let heterogeneous hardware take proportional load — give the big machine 300 points, the small one 75. The whole design is Level 2 hashing + Level 3 binary search + one statistics idea, which is this unit's thesis in a single structure.</p>`,

<h3>Two roads to trust</h3>
<p>You can <b>argue</b> an algorithm correct (invariants, induction — Level 1's tools) and you can <b>test</b> it. They catch different failures: proofs cover all inputs of the cases you reasoned about; tests catch the cases your reasoning forgot. Dijkstra's line — <i>testing shows the presence of bugs, never their absence</i> — cuts both ways: proofs are only as good as their model of the problem. Professionals use both roads.</p>
<h3>The edge-case catechism</h3>
<p>Bugs cluster at boundaries. Before shipping any algorithm, interrogate it with the standard list:</p>
<ul class="checklist">
<li><b>Empty</b> input; <b>single</b> element; <b>two</b> elements (the smallest interesting case).</li>
<li><b>All equal</b> elements; already sorted; reverse sorted; <b>duplicates</b> of the target.</li>
<li>Target <b>absent</b>; target at the <b>first/last</b> position; extremes (0, negatives, maximum values).</li>
<li>For indices: every ±1 — does <code>lo ≤ hi</code> vs <code>lo &lt; hi</code> matter? (In binary search: yes, fatally.)</li>
</ul>
<pre class="code"><i>// the classic: binary search mid computed as (lo+hi)/2</i>
mid ← (lo + hi) / 2        <i>// overflows for huge lo+hi in fixed-width ints!</i>
mid ← lo + (hi − lo) / 2   <i>// the safe form — a real bug in Java's stdlib for 9 years</i></pre>
<h3>Property-based testing — let the machine hunt</h3>
<p>Example tests check hand-picked cases; <b class="it">property-based testing</b> states properties that must hold for <i>all</i> inputs and fires thousands of random ones at them: sort output is ordered and a permutation of the input; reverse(reverse(x)) = x; insert-then-search always finds. When a random monster input fails, the framework <b class="it">shrinks</b> it to a minimal counterexample. A related trick, <b>differential testing</b>: run your clever O(n log n) solution against a dumb-but-obviously-correct O(n²) reference on random inputs and compare — brutal at finding subtle disagreements.</p>
<h3>Assertions — invariants that stay switched on</h3>
<p>An <b class="it">assertion</b> writes an invariant into the code: <code>assert lo ≤ hi</code>, <code>assert isSorted(A)</code> before a binary search. Violations crash <i>at the moment of the lie</i>, near the cause, instead of corrupting quietly for a million more instructions. Preconditions, postconditions and loop invariants as executable claims — Level 1's proof discipline, running in production.</p>
<div class="tip"><b>The honest habit:</b> when a bug is found, first write the failing test, then fix, and keep the test forever (regression). Every bug is a hole in your edge-case imagination — the test is the patch, and the growing suite is your accumulated humility. This is the software-scale version of the systems course's lessons-learned loop.</div>
<h3>Going deeper: a property-based test, written out</h3>
<pre class="code"><b>repeat</b> 10000 <b>times</b>:
    A ← random array (random length 0..1000, random values, with duplicates)
    B ← mySort(copy of A)
    <b>assert</b> length(B) = length(A)
    <b>assert</b> B[i] ≤ B[i+1] for all i               <i>// ordered</i>
    <b>assert</b> multiset(B) = multiset(A)             <i>// permutation — no lost/invented items</i>
    <b>assert</b> mySort(B) = B                         <i>// idempotent: sorting sorted is identity</i>
    <b>assert</b> B = referenceSort(copy of A)          <i>// differential: agree with the oracle</i></pre>
<p>Each assert kills a different class of impostor: "ordered" alone is passed by return []; adding "same length" is passed by return [0,0,…]; the multiset check finally pins the content. Testing <i>stability</i> needs one more trick — tag elements with their original index, sort by value only, and assert equal-valued runs have increasing tags. Note what the random generator must deliberately include: empty arrays, single elements, and <b>duplicates</b> — a naive "random distinct values" generator silently never tests the tie-handling code, which is exactly where stability bugs and three-way-partition bugs live. Generators encode your edge-case imagination just as much as the properties do.</p>
<h3>Metamorphic testing: when you don't know the right answer</h3>
<p>The <b>oracle problem</b>: how do you test a function whose correct output you can't independently compute — a search ranker, a physics simulation, a route planner at scale? <b>Metamorphic testing</b> sidesteps knowing the answer by asserting <i>relations between answers</i>: reversing the input array must reverse a min into a max; adding 10 to every element must add exactly 10 to the returned minimum; adding a new road to the map must never make any shortest route <i>longer</i>; doubling every edge weight must double Dijkstra's distances without changing any chosen path. Each relation is checkable without ever knowing a single true output. This is a genuinely practical technique for algorithmic code — most real-world "we can't test this, it's too complex" claims dissolve into a list of metamorphic relations nobody had written down.</p>
<h3>Structure invariants as executable checks</h3>
<pre class="code"><b>function</b> validateHeap(H):                <i>// run after ops during testing</i>
    <b>for</b> i <b>from</b> 1 <b>to</b> n−1:
        <b>assert</b> H[⌊(i−1)/2⌋] ≤ H[i]       <i>// every parent ≤ child</i>

<b>function</b> validateBST(node, lo, hi):      <i>// bounds tighten as you descend</i>
    <b>if</b> node = ∅: <b>return</b>
    <b>assert</b> lo &lt; node.key &lt; hi
    validateBST(node.left, lo, node.key)
    validateBST(node.right, node.key, hi)</pre>
<p>The BST validator carries this unit's subtlest lesson: the tempting check "each node between its own children" is <b>wrong</b> — a grandchild can violate the global order while every local parent-child pair looks fine. The correct check threads <i>bounds</i> down the tree, tightening at each step, because the BST invariant is a claim about entire subtrees, not about adjacent nodes. Wire validators like these into property-based tests ("after any random sequence of inserts and deletes, validate") and you get a data-structure fuzzer for a dozen lines — the single highest-yield testing setup for anyone implementing Level 2's structures by hand.</p>
<h3>A shrinking session, blow by blow</h3>
<p>Your three-way partition fails on a random 847-element array. The shrinker bisects: does the first half alone still fail? Yes — recurse. Does removing element 12 still fail? Keep removing… Can values shrink toward 0? Try it… Two hundred automatic steps later: <b>minimal counterexample [2, 1, 2]</b>. Now the bug is legible — the equal-region boundary advances wrongly when the pivot value flanks a smaller element — something no human stares out of 847 numbers, and something the minimal case makes almost self-diagnosing. The habit to build: when any test fails on a big input, <i>shrink before debugging</i> — by tooling if you have it, by hand-bisection if you don't. Ten minutes of shrinking routinely saves two hours of stepping through a debugger, because debugging cost scales with input size and shrinking is the only tool that reduces it.</p>`,

  grammar: `
<h3>The new division of labour</h3>
<p>AI assistants have made producing plausible code nearly free. What they have <i>not</i> made free is knowing whether that code is correct — and the two now come apart in a way they never did when a human wrote every line. Generated code is optimised, by construction, to <b>look right</b>: idiomatic naming, tidy structure, confident comments. Its defects are therefore disproportionately of the worst kind — <b class="it">plausible wrongness</b>, the subtle boundary error or quietly wrong assumption wearing excellent formatting. The economic consequence is blunt: <b>as generation gets cheaper, verification becomes the engineer's core output.</b> Everything this course taught — invariants, the edge-case catechism, differential testing, complexity reading — is precisely the audit toolkit for this job.</p>
<h3>The supervision loop</h3>
<table class="gr">
<tr><th>Stage</th><th>You do</th><th>Course tool</th></tr>
<tr><td><b>1. Specify</b></td><td>write pre/postconditions, edge cases and a complexity target <i>before</i> generating</td><td>L1U1's specifications</td></tr>
<tr><td><b>2. Generate</b></td><td>let the assistant produce a candidate</td><td>—</td></tr>
<tr><td><b>3. Audit</b></td><td>read for the invariant: state it, then check every line preserves it</td><td>loop invariants, the ± 1 audit</td></tr>
<tr><td><b>4. Test</b></td><td>edge catechism + property/differential tests the assistant didn't see</td><td>L4U4 entire</td></tr>
<tr><td><b>5. Integrate</b></td><td>accept in small reviewable pieces; you own every accepted line</td><td>small blast radius</td></tr>
</table>
<p>The order matters most at step 1: a specification written <i>after</i> seeing generated code silently mutates to match what was generated — the code becomes its own spec, and verification becomes circular.</p>
<h3>A field guide to generated defects</h3>
<ul>
<li><b class="it">Plausible wrongness</b> — off-by-one boundaries, a <code>&lt;</code> for a <code>≤</code>, the one-element range never checked. Reads perfectly; fails on the catechism's inputs.</li>
<li><b class="it">Hallucinated interfaces</b> — calls to functions, flags or library behaviours that don't exist. Cheapest to catch: run it.</li>
<li><b class="it">Spec drift</b> — a correct solution to a <i>neighbouring</i> problem: first duplicate instead of all duplicates, subarray instead of subsequence. Only your written spec catches this, because the code is internally flawless.</li>
<li><b class="it">Hidden complexity</b> — correct output via an O(n²) scan or an accidental copy-per-iteration. Passes every test; dies at production n. Read the loops, not just the results.</li>
<li><b>Confident error handling of the wrong error</b> — guards for impossible cases while the real edge (empty input, duplicate keys) walks straight through.</li>
</ul>
<h3>The psychology is half the battle</h3>
<p><b class="it">Automation bias</b> is the documented human tendency to under-scrutinise machine output; <b class="it">anchoring</b> means that once you've read a generated solution, your imagination narrows to its approach — auditing someone else's plausible code is genuinely harder than writing your own, because your brain reviews the <i>story</i> of the code instead of its behaviour. The working defences are mechanical, not moral: write the spec and the test list <b>before</b> looking at the candidate; run the edge catechism as a checklist, not from memory; prefer differential tests (generated code vs an obviously-correct reference — even a slow one you write yourself) because they don't require you to imagine the failure. And calibrate trust by consequence: boilerplate and one-off scripts earn light review; anything touching money, safety, security or data integrity earns the full loop, every time.</p>
<div class="tip"><b>The ownership rule:</b> "the AI wrote it" is not a defence available to professionals — you ship it, you own it, exactly as if you'd typed it. The practical corollary: never accept a diff you couldn't explain line-by-line to a colleague. If explaining it would embarrass you, the review isn't finished.</div>
<h3>Going deeper: why your reference implementation is the killer tool</h3>
<p>Of all the audit techniques, <b>differential testing</b> transfers best to supervising assistants, for a structural reason: it splits the work into two tasks of very unequal difficulty. Writing an <i>obviously correct</i> solution (brute force, O(n²), five lines) is easy and stays fully within your understanding; writing a <i>fast</i> solution is what you delegated. Comparing them on thousands of random inputs then requires no imagination at all — the machine finds the disagreement, and shrinking gives you the minimal case. This inverts the asymmetry that makes generated code dangerous: the assistant's advantage is producing sophistication cheaply; your advantage is that correctness of <i>simple</i> code is cheap for you to establish. Differential testing lets your cheap certainty police their cheap sophistication. The same logic powers the metamorphic relations from L4U4 when no reference exists: you don't need to know the right answer, only a property that any right answer must satisfy — and properties are specifications, which is where the loop began.</p>`,

    <b>if</b> key = node.key: <b>return</b> node
    <b>if</b> key &lt; node.key: <b>return</b> search(node.left, key)
    <b>else</b>: <b>return</b> search(node.right, key)`,
  notes: "O(height): log n balanced, n degenerate (sorted inserts!). Self-balancing variants (AVL, red-black) guarantee O(log n) — they power sorted maps in standard libraries. What BSTs give over hashes: order, ranges, nearest-key."
},
{
  id: "heapops", name: "Binary heap operations", cat: "Trees", icon: "🏔️",
  best: "O(1) peek", avg: "O(log n)", worst: "O(log n)", space: "O(1)",
  code: `<i>// array layout: parent ⌊(i−1)/2⌋, children 2i+1, 2i+2</i>
<b>function</b> insert(H, x):
    append x;  sift x <b>up</b> while it beats its parent

<b>function</b> extractMin(H):
    min ← H[0];  move last element to H[0]
    sift it <b>down</b> with the smaller child while larger
    <b>return</b> min`,
  notes: "The priority queue's engine: peek O(1), insert/extract O(log n), heapify O(n). Inside OS schedulers, Dijkstra, timers, top-K streaming. Weaker promise than a BST (only parent-child order) — smaller and faster for its one job."
},
{
  id: "fibdp", name: "Fibonacci (DP)", cat: "Dynamic programming", icon: "🐚",
  best: "O(n)", avg: "O(n)", worst: "O(n)", space: "O(1)",
  code: `<b>function</b> fib(n):              <i>// naive recursion: O(2ⁿ)!</i>
    a ← 0;  b ← 1
    <b>for</b> i <b>from</b> 2 <b>to</b> n:
        a, b ← b, a + b          <i>// only the last two states live</i>
    <b>return</b> b`,
  notes: "The hello-world of DP: overlapping subproblems (fib(3) recomputed millions of times) cached down to O(n), then space-optimised to two variables. Same recurrence as the naive version — plus memory."
},
{
  id: "knapsack", name: "0/1 knapsack (DP)", cat: "Dynamic programming", icon: "🎒",
  best: "O(nW)", avg: "O(nW)", worst: "O(nW)", space: "O(nW)",
  code: `<i>// dp[i][w] = best value using first i items within capacity w</i>
<b>for</b> i <b>from</b> 1 <b>to</b> n:
    <b>for</b> w <b>from</b> 0 <b>to</b> W:
        dp[i][w] ← dp[i−1][w]                       <i>// skip item i</i>
        <b>if</b> weight[i] ≤ w:
            dp[i][w] ← max(dp[i][w],
                dp[i−1][w − weight[i]] + value[i])   <i>// take item i</i>
<b>return</b> dp[n][W]`,
  notes: "Take-or-leave under a capacity — where greedy-by-ratio provably fails. States × work: nW × O(1). The state sentence ('best value from first i items within w') is the whole design; recurrence follows."
},
{
  id: "unionfind", name: "Union-find (disjoint sets)", cat: "Structures", icon: "🤝",
  best: "O(1)", avg: "O(α(n)) amortized", worst: "O(log n) single op", space: "O(n)",
  code: `<b>function</b> find(x):                 <i>// which set is x in?</i>
    <b>while</b> parent[x] ≠ x:
        parent[x] ← parent[parent[x]]   <i>// path compression</i>
        x ← parent[x]
    <b>return</b> x

<b>function</b> union(a, b):             <i>// merge two sets</i>
    ra ← find(a);  rb ← find(b)
    <b>if</b> ra ≠ rb: parent[smaller tree's root] ← other root`,
  notes: "Tracks which items belong to which group. With path compression + union by rank, any sequence of m operations totals O(m·α(n)) — an AMORTISED bound (inverse-Ackermann, ≤ 5 for any feasible n); a single isolated find can still walk O(log n) before compression pays it forward. Kruskal's cycle test, network connectivity, image regions."
},
{
  id: "lru", name: "LRU cache", cat: "Structures", icon: "🧠",
  best: "O(1)", avg: "O(1)", worst: "O(1)", space: "O(capacity)",
  code: `<i>// hash map: key → node in a doubly linked list (recency order)</i>
<b>function</b> get(key):
    <b>if</b> key not in map: <b>return</b> miss
    move map[key]'s node to the front     <i>// most recent</i>
    <b>return</b> node.value

<b>function</b> put(key, value):
    insert/refresh node at front
    <b>if</b> size &gt; capacity: evict the back node (least recent)`,
  notes: "The classic composition: the map gives O(1) lookup, the list gives O(1) reorder and eviction — neither alone suffices. Runs browser caches, database buffer pools, CDN nodes."
}
];

/* =====================================================================
   STORAGE
   ===================================================================== */
const STORE_KEY = "software-systems-v1";
const DEFAULTS = {
  completed: {},
  quizScores: {},
  srs: {},
  xp: 0,
  streak: 0,
  lastDay: null,
  bestStreak: 0,
  reviewsDone: 0,
  settings: { dir: "t2d", newPerDay: 15, theme: "auto", levels: { l1: true, l2: true, l3: false, l4: false, l5: false } },
  newIntro: {},
  lab: {},              // lab item id -> true
  aiText: {},           // AI-studio worksheet fields (bounded free text)
  skill: {},            // unitId -> {ok, bad}  (concept-level mastery signal)
  caps: {},             // capstoneId -> {d, c, a}
  onboarded: null,      // null | "beginner" | "placed" | "revision"
};

function cloneDefaults() { return JSON.parse(JSON.stringify(DEFAULTS)); }
function boundedInt(value, min, max, fallback) {
  return Number.isFinite(value) ? Math.min(max, Math.max(min, Math.floor(value))) : fallback;
}
function validDateKey(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = new Date(value + "T00:00:00");
  return Number.isFinite(d.getTime()) && d.getFullYear() === +value.slice(0, 4)
    && d.getMonth() + 1 === +value.slice(5, 7) && d.getDate() === +value.slice(8, 10);
}
function sanitizeProgress(input) {
  if (!input || typeof input !== "object" || Array.isArray(input)) throw new Error("Invalid progress file");

  const out = cloneDefaults();
  const unitIds = new Set();
  const cardIds = new Set();
  for (const lvl of COURSE) for (const unit of lvl.units) {
    unitIds.add(unit.id);
    unit.vocab.forEach((_, i) => cardIds.add(unit.id + ":" + i));
  }

  const completed = input.completed && typeof input.completed === "object" && !Array.isArray(input.completed) ? input.completed : {};
  for (const id of unitIds) if (completed[id] === true) out.completed[id] = true;

  const scores = input.quizScores && typeof input.quizScores === "object" && !Array.isArray(input.quizScores) ? input.quizScores : {};
  for (const id of unitIds) if (Number.isFinite(scores[id])) out.quizScores[id] = boundedInt(scores[id], 0, 100, 0);

  const incomingSrs = input.srs && typeof input.srs === "object" && !Array.isArray(input.srs) ? input.srs : {};
  const maxDue = Date.UTC(2100, 0, 1);
  for (const id of cardIds) {
    const rec = incomingSrs[id];
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    if (![rec.r, rec.e, rec.i, rec.d].some(Number.isFinite)) continue;
    out.srs[id] = {
      r: boundedInt(rec.r, 0, 1000000, 0),
      e: boundedInt(rec.e, 130, 280, 250),
      i: boundedInt(rec.i, 0, 36500, 0),
      d: boundedInt(rec.d, 0, maxDue, 0)
    };
  }

  out.xp = boundedInt(input.xp, 0, 1000000000, 0);
  out.streak = boundedInt(input.streak, 0, 1000000, 0);
  out.bestStreak = Math.max(out.streak, boundedInt(input.bestStreak, 0, 1000000, 0));
  out.reviewsDone = boundedInt(input.reviewsDone, 0, 1000000000, 0);
  out.lastDay = validDateKey(input.lastDay) ? input.lastDay : null;

  const settings = input.settings && typeof input.settings === "object" && !Array.isArray(input.settings) ? input.settings : {};
  if (["t2d", "d2t", "mix"].includes(settings.dir)) out.settings.dir = settings.dir;
  if ([5, 10, 15, 20, 30, 50].includes(settings.newPerDay)) out.settings.newPerDay = settings.newPerDay;
  if (["auto", "light", "dark"].includes(settings.theme)) out.settings.theme = settings.theme;
  const levels = settings.levels && typeof settings.levels === "object" && !Array.isArray(settings.levels) ? settings.levels : {};
  for (const lvl of COURSE) if (typeof levels[lvl.id] === "boolean") out.settings.levels[lvl.id] = levels[lvl.id];

  const intro = input.newIntro && typeof input.newIntro === "object" && !Array.isArray(input.newIntro) ? input.newIntro : {};
  for (const [day, count] of Object.entries(intro)) {
    if (validDateKey(day) && Number.isFinite(count)) out.newIntro[day] = boundedInt(count, 0, 10000, 0);
  }
  const lab = input.lab && typeof input.lab === "object" && !Array.isArray(input.lab) ? input.lab : {};
  for (const id of LAB_IDS) if (lab[id] === true) out.lab[id] = true;
  const skill = input.skill && typeof input.skill === "object" && !Array.isArray(input.skill) ? input.skill : {};
  for (const id of unitIds) {
    const s = skill[id];
    if (s && typeof s === "object" && !Array.isArray(s)) out.skill[id] = { ok: boundedInt(s.ok, 0, 1000000000, 0), bad: boundedInt(s.bad, 0, 1000000000, 0) };
  }
  const caps = input.caps && typeof input.caps === "object" && !Array.isArray(input.caps) ? input.caps : {};
  for (const c of CAPSTONES) {
    const s = caps[c.id];
    if (s && typeof s === "object" && !Array.isArray(s)) {
      const qs = a => Array.isArray(a) ? a.filter(x => Number.isInteger(x) && x >= 0 && x < 10) : [];
      out.caps[c.id] = { d: s.d === true, c: s.c === true, a: s.a === true, dq: qs(s.dq), aq: qs(s.aq) };
    }
  }
  if (["beginner", "placed", "revision"].includes(input.onboarded)) out.onboarded = input.onboarded;
  const aiText = input.aiText && typeof input.aiText === "object" && !Array.isArray(input.aiText) ? input.aiText : {};
  for (const k of AI_TEXT_KEYS) if (typeof aiText[k] === "string") out.aiText[k] = aiText[k].slice(0, 4000);
  return out;
}

const store = {
  data: cloneDefaults(),
  memOnly: false,
  load() {
    this.data = cloneDefaults();
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        try { this.data = sanitizeProgress(JSON.parse(raw)); }
        catch (e) { localStorage.removeItem(STORE_KEY); }
      }
      localStorage.setItem(STORE_KEY + "-probe", "1");
      localStorage.removeItem(STORE_KEY + "-probe");
    } catch (e) {
      this.memOnly = true;
      this.data = cloneDefaults();
    }
  },
  save() {
    if (this.memOnly) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; }
  }
};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function recordActivity() {
  const t = todayStr();
  const s = store.data;
  if (s.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  s.streak = (s.lastDay === yStr) ? s.streak + 1 : 1;
  s.bestStreak = Math.max(s.bestStreak, s.streak);
  s.lastDay = t;
  store.save();
  renderSidebar();
}
function addXP(n) { store.data.xp += n; recordActivity(); store.save(); }

/* ---------- concept-level mastery ---------- */
function recordSkill(unitId, ok) {
  if (!unitId || !unitById(unitId)) return;
  const s = store.data.skill[unitId] || (store.data.skill[unitId] = { ok: 0, bad: 0 });
  if (ok) s.ok++; else s.bad++;
  store.save();
}
function pullCardForward(unitId) {
  // A miss on this concept pulls one of its scheduled flashcards due NOW.
  const now = Date.now();
  let best = null;
  for (const [cid, s] of Object.entries(store.data.srs)) {
    if (!cid.startsWith(unitId + ":")) continue;
    if (s.d > now && (!best || s.d > best.s.d)) best = { cid, s };
  }
  if (best) { best.s.d = now; store.save(); renderSidebar(); return; }
  // Nothing from this topic is scheduled: introduce one of its unseen cards, due now.
  const u = unitById(unitId);
  if (!u) return;
  for (let i = 0; i < u.unit.vocab.length; i++) {
    const cid = unitId + ":" + i;
    if (!store.data.srs[cid]) { store.data.srs[cid] = { r: 0, e: 250, i: 0, d: now }; store.save(); renderSidebar(); return; }
  }
}
function masteryInfo(unitId) {
  const s = store.data.skill[unitId];
  if (!s) return null;
  const n = s.ok + s.bad;
  if (n < 5) return { n, label: null };
  const pct = s.ok / n;
  return { n, pct, label: pct >= 0.85 ? "Strong" : pct >= 0.6 ? "Developing" : "Needs review" };
}
function masteryCard() {
  const rows = [];
  for (const lvl of COURSE) for (const u of lvl.units) {
    const m = masteryInfo(u.id);
    if (m && m.label) rows.push({ u, lvl, m });
  }
  if (!rows.length) return `<div class="card"><b>🧭 Mastery by topic</b><p class="sub" style="margin:6px 0 0">Answer questions — in quizzes, practice, traces and code challenges — and your per-topic mastery map appears here.</p></div>`;
  rows.sort((a, b) => a.m.pct - b.m.pct);
  const badge = m => m.label === "Strong" ? `<span class="pill acc">✦ Strong</span>`
    : m.label === "Developing" ? `<span class="pill blue">◐ Developing</span>`
    : `<span class="pill" style="color:var(--bad);border:1px solid var(--bad)">▲ Needs review</span>`;
  return `<div class="card"><b>🧭 Mastery by topic</b>
    <p style="font-size:12.5px;color:var(--muted);margin:4px 0 10px">From every answer you give — quizzes, practice, traces, code — aggregated per topic (course unit). Weakest first. A miss pulls one of that topic's flashcards forward, introducing a new one if none is scheduled.</p>
    ${rows.slice(0, 8).map(r => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--hairline);font-size:14px">
      <a href="#/unit/${r.u.id}/learn" style="flex:1;min-width:0">${r.lvl.short} · ${esc(r.u.title)}</a>
      <span style="font-size:11.5px;color:var(--muted)">${r.m.n} answers</span>
      ${badge(r.m)}
    </div>`).join("")}
  </div>`;
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function normAnswer(s) {
  return s.toLowerCase().trim().replace(/[.,!?;:"'’()\-]/g, "").replace(/\s+/g, " ");
}
function matchAnswer(given, answers) {
  const list = Array.isArray(answers) ? answers : [answers];
  for (const a of list) if (normAnswer(given) === normAnswer(a)) return true;
  return false;
}

function unitById(id) {
  for (const lvl of COURSE) for (const u of lvl.units) if (u.id === id) return { lvl, unit: u };
  return null;
}
function levelProgress(lvl) {
  const done = lvl.units.filter(u => store.data.completed[u.id]).length;
  return { done, total: lvl.units.length, pct: Math.round(100 * done / lvl.units.length) };
}
function nextUnfinishedUnit() {
  for (const lvl of COURSE) for (const u of lvl.units) if (!store.data.completed[u.id]) return { lvl, unit: u };
  return null;
}

/* =====================================================================
   SRS ENGINE (SM-2 style, simplified)
   ===================================================================== */
const DAY = 86400000;
function allCards() {
  const cards = [];
  for (const lvl of COURSE) {
    if (!store.data.settings.levels[lvl.id]) continue;
    for (const u of lvl.units) {
      u.vocab.forEach((v, i) => cards.push({ id: u.id + ":" + i, term: v[0], def: v[1], unit: u, lvl }));
    }
  }
  return cards;
}
function srsState(id) { return store.data.srs[id] || null; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => { const s = srsState(c.id); return s && s.d <= now; });
}
function newCards() { return allCards().filter(c => !srsState(c.id)); }
function newBudgetLeft() {
  const t = todayStr();
  const used = store.data.newIntro[t] || 0;
  return Math.max(0, store.data.settings.newPerDay - used);
}
function gradeCard(card, grade) { // 0 again, 1 hard, 2 good, 3 easy
  const s = store.data.srs[card.id] || { r: 0, e: 250, i: 0, d: 0 };
  const isNew = !store.data.srs[card.id];
  if (isNew) {
    const t = todayStr();
    store.data.newIntro[t] = (store.data.newIntro[t] || 0) + 1;
  }
  if (grade === 0) {
    s.r = 0; s.i = 0; s.d = Date.now() + 10 * 60000; s.e = Math.max(130, s.e - 20);
  } else {
    if (grade === 1) { s.i = Math.max(1, Math.round(s.i * 1.2)) || 1; s.e = Math.max(130, s.e - 15); }
    else if (grade === 2) { s.i = s.r === 0 ? 1 : (s.r === 1 ? 3 : Math.round(s.i * s.e / 100)); }
    else { s.i = s.r === 0 ? 4 : Math.round(s.i * s.e / 100 * 1.3); s.e = Math.min(280, s.e + 15); }
    s.r += 1;
    s.d = Date.now() + s.i * DAY;
  }
  store.data.srs[card.id] = s;
  store.data.reviewsDone += 1;
  addXP(grade === 0 ? 1 : 2);
  store.save();
}

/* =====================================================================
   EXERCISE RENDERING
   ===================================================================== */
let EX_SEQ = 0;
const exHandlers = {};
function renderExercise(ex, num, opts) {
  opts = opts || {};
  const id = "ex" + (++EX_SEQ);
  exHandlers[id] = { ex, answered: false, cb: opts.onAnswer || null, concept: opts.concept || null };
  let inner = "";
  const qhtml = `<div class="q"><span class="qnum">${num}</span>${ex.q}</div>`;
  if (ex.t === "mcq") {
    const order = shuffle(ex.opts.map((o, i) => i));
    exHandlers[id].order = order;
    inner = qhtml + `<div class="opts">` + order.map((oi, pos) =>
      `<button class="optbtn" id="${id}-o${pos}" onclick="answerMCQ('${id}',${pos})">${esc(ex.opts[oi])}</button>`
    ).join("") + `</div><div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  } else {
    inner = qhtml + `
      <div class="fillrow">
        <input type="text" id="${id}-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing word…" onkeydown="if(event.key==='Enter')answerFill('${id}')">
        <button class="btn small" onclick="answerFill('${id}')">Check</button>
      </div>
      <div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  }
  return `<div class="exwrap" id="${id}">${inner}</div>`;
}
function finishExercise(id, correct) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  h.answered = true;
  const v = document.getElementById(id + "-v");
  const ex = h.ex;
  if (correct) {
    v.className = "verdict ok";
    v.innerHTML = "✓ Correct!" + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
    addXP(5);
  } else {
    v.className = "verdict no";
    const ans = ex.t === "mcq" ? ex.opts[ex.a] : (Array.isArray(ex.a) ? ex.a[0] : ex.a);
    v.innerHTML = `✗ Not quite. Answer: <b class="it">${esc(ans)}</b>` + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
  }
  if (h.concept) { recordSkill(h.concept, correct); if (!correct) pullCardForward(h.concept); }
  if (h.cb) h.cb(correct);
}
function answerMCQ(id, pos) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const ex = h.ex, chosen = h.order[pos];
  const correct = chosen === ex.a;
  for (let p = 0; p < h.order.length; p++) {
    const b = document.getElementById(id + "-o" + p);
    b.disabled = true;
    if (h.order[p] === ex.a) b.classList.add("right");
    else if (p === pos && !correct) b.classList.add("wrong");
  }
  finishExercise(id, correct);
}
function answerFill(id) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const val = document.getElementById(id + "-in").value;
  if (!val.trim()) return;
  document.getElementById(id + "-in").disabled = true;
  finishExercise(id, matchAnswer(val, h.ex.a));
}

/* ---------- quiz session ---------- */
let quiz = null;
function uniqueTextOptions(correct, candidates) {
  const seen = new Set([String(correct)]);
  const distractors = [];
  for (const candidate of shuffle(candidates)) {
    const text = String(candidate);
    if (seen.has(text)) continue;
    seen.add(text);
    distractors.push(text);
    if (distractors.length === 3) break;
  }
  return shuffle([String(correct), ...distractors]);
}
function buildQuizQuestions(unit) {
  const authored = shuffle(unit.exercises).slice(0, 6);
  const vocabPool = shuffle(unit.vocab.map((v, i) => i)).slice(0, Math.max(0, 10 - authored.length));
  const termCounts = new Map();
  const defCounts = new Map();
  for (const [term, def] of unit.vocab) {
    termCounts.set(term, (termCounts.get(term) || 0) + 1);
    defCounts.set(def, (defCounts.get(def) || 0) + 1);
  }
  const vocabQs = vocabPool.map(idx => {
    const v = unit.vocab[idx];
    const canAskT2D = termCounts.get(v[0]) === 1;
    const canAskD2T = defCounts.get(v[1]) === 1;
    const askT2D = !canAskD2T || (canAskT2D && Math.random() < 0.5);
    if (askT2D) {
      const opts = uniqueTextOptions(v[1], unit.vocab.map(o => o[1]));
      return { t: "mcq", q: `Which of these describes <b class="it">${esc(v[0])}</b>?`, opts, a: opts.indexOf(String(v[1])) };
    }
    const opts = uniqueTextOptions(v[0], unit.vocab.map(o => o[0]));
    return { t: "mcq", q: `Which term matches: “${esc(v[1])}”?`, opts, a: opts.indexOf(String(v[0])) };
  });
  return shuffle(authored.concat(vocabQs));
}
function viewQuizStart(uid) {
  const found = unitById(uid);
  if (!found) { document.getElementById("main").innerHTML = "<p>Unit not found.</p>"; return; }
  quiz = { uid, qs: buildQuizQuestions(found.unit), i: 0, correct: 0 };
  renderQuizQ();
}
function renderQuizQ() {
  const main = document.getElementById("main");
  const found = unitById(quiz.uid);
  if (quiz.i >= quiz.qs.length) { renderQuizResult(); return; }
  EX_SEQ = 0; for (const k in exHandlers) delete exHandlers[k];
  const q = quiz.qs[quiz.i];
  main.innerHTML = `<p style="margin:0 0 4px"><a href="#/unit/${quiz.uid}/quiz" onclick="quiz=null">← Quit quiz</a></p>
    <h1>Quiz: ${found.unit.title}</h1>

    ${renderExercise(q, quiz.i + 1, { concept: quiz.uid, onAnswer: (ok) => { if (ok) quiz.correct++; showQuizNext(); } })}
    <div id="quiznext"></div>`;
}
function showQuizNext() {
  document.getElementById("quiznext").innerHTML =
    `<button class="btn primary" style="margin-top:6px" onclick="quiz.i++;renderQuizQ()">${quiz.i + 1 >= quiz.qs.length ? "See result →" : "Next →"}</button>`;

function renderQuizResult() {

function boxes(arr, marks) {
  marks = marks || {};
  return '<div class="boxrow" role="list" aria-label="Array state, one item per position">' + arr.map((v, i) => {
    const m = marks[i] || {};
    const tagText = m.tag != null ? String(m.tag).replace(/&gt;/g, ">").replace(/&le;/g, "≤") : "";
    const sr = (tagText ? tagText + " marker, " : "") + "index " + i + ", value " + v + (m.cls === "dim" ? ", eliminated" : "");
    return `<span class="bx ${m.cls || ""}" role="listitem" aria-label="${esc(sr)}">${esc(String(v))}<small aria-hidden="true">${m.tag != null ? String(m.tag) : i}</small></span>`;
  }).join("") + "</div>";
}
function searchMarks(len, lo, hi, mid) {
  const m = {};
  for (let i = 0; i < len; i++) {
    if (i < lo || i > hi) m[i] = { cls: "dim" };
    else m[i] = { cls: "hl-b" };
  }
  if (mid != null) m[mid] = { cls: "hl-a", tag: "mid" };
  if (lo <= hi) { m[lo] = { ...(m[lo] || {}), tag: m[lo] && m[lo].tag ? m[lo].tag : "lo" }; m[hi] = { ...(m[hi] || {}), tag: m[hi] && m[hi].tag ? m[hi].tag : "hi" }; }
  return m;
}

function buildTraceBinary() {
  const A = [3, 8, 15, 21, 34, 47, 59, 72, 88], target = 47;
  const steps = [];
  let lo = 0, hi = A.length - 1, probes = 0;
  steps.push({ html: boxes(A), note: `We search this sorted array for <b>${target}</b>. lo = 0, hi = ${hi}. Invariant: if ${target} is present, it lies in A[lo..hi].` });
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    steps.push({ html: boxes(A, searchMarks(A.length, lo, hi)), note: `lo = ${lo}, hi = ${hi}. Next we compute mid = ⌊(lo + hi) / 2⌋.`, ask: { q: `What is mid? (an index)`, a: [String(mid)] } });
    probes++;
    if (A[mid] === target) {
      steps.push({ html: boxes(A, searchMarks(A.length, lo, hi, mid)), note: `A[${mid}] = ${A[mid]} = ${target} — <b>found at index ${mid}</b> in ${probes} probes. A linear scan would have taken ${mid + 1}.` });
      break;
    } else if (A[mid] < target) {
      steps.push({ html: boxes(A, searchMarks(A.length, lo, hi, mid)), note: `A[${mid}] = ${A[mid]} &lt; ${target}: mid and everything left of it are too small — discarded in one comparison. lo ← mid + 1 = ${mid + 1}.` });
      lo = mid + 1;
    } else {
      steps.push({ html: boxes(A, searchMarks(A.length, lo, hi, mid)), note: `A[${mid}] = ${A[mid]} &gt; ${target}: mid and everything right of it are too big. hi ← mid − 1 = ${mid - 1}.` });
      hi = mid - 1;
    }
  }
  return steps;
}

function buildTraceInsertion() {
  const A = [7, 3, 9, 4, 3];
  const steps = [];
  steps.push({ html: boxes(A), note: `Insertion sort: grow a sorted prefix (highlighted) one element at a time. A[0] alone is trivially sorted. (Note the duplicate 3s — watch what happens to their order.)` });
  for (let i = 1; i < A.length; i++) {
    const key = A[i];
    let land = 0;
    for (let j = 0; j < i; j++) if (A[j] <= key) land = j + 1;   // <= : never cross equal elements (stability!)
    const marks = {}; for (let j = 0; j < i; j++) marks[j] = { cls: "hl-b" }; marks[i] = { cls: "hl-a", tag: "key" };
    steps.push({ html: boxes(A, marks), note: `The prefix A[0..${i - 1}] is sorted. The key A[${i}] = <b>${key}</b> slides left past every larger element.`, ask: { q: `At which index will ${key} land?`, a: [String(land)] } });
    for (let j = i; j > land; j--) A[j] = A[j - 1];
    A[land] = key;
    const after = {}; for (let j = 0; j <= i; j++) after[j] = { cls: "hl-b" }; after[land] = { cls: "hl-a" };
    steps.push({ html: boxes(A, after), note: `${key} landed at index ${land}; the sorted prefix now spans A[0..${i}]. Invariant preserved.${land > 0 && A[land - 1] === key ? " And notice: it landed <b>after</b> its equal twin — equal elements are never crossed. That is stability, visible in action." : ""}` });
  }
  steps.push({ html: boxes(A, Object.fromEntries(A.map((_, j) => [j, { cls: "hl-b" }]))), note: `Sorted. Notice the cost profile: nearly-sorted input would have made every slide short — insertion sort's O(n) best case.` });
  return steps;
}

function buildTracePartition() {
  const A = [3, 8, 2, 5, 7, 4];
  const steps = [];
  const hi = A.length - 1;
  steps.push({ html: boxes(A), note: `Lomuto partition, as in the quicksort lesson. The pivot is the last element.`, ask: { q: `Which value is the pivot?`, a: [String(A[hi])] } });
  const pivot = A[hi];
  let i = 0;
  for (let j = 0; j < hi; j++) {
    const marks = { [hi]: { cls: "hl-a", tag: "pivot" }, [j]: { cls: "hl-b", tag: "j" } };
    marks[i] = { ...(marks[i] || { cls: "" }), tag: marks[i] && marks[i].tag ? marks[i].tag + ",i" : "i", cls: (marks[i] && marks[i].cls) || "hl-b" };
    if (A[j] <= pivot) {
      const swapped = i !== j;
      const t = A[i]; A[i] = A[j]; A[j] = t;
      steps.push({ html: boxes(A, marks), note: `A[j=${j}] = ${A[i === j ? j : i]} ≤ pivot ${pivot} → ${swapped ? `swap A[${i}], A[${j}]` : `swap with itself (no-op)`}; i ← ${i + 1}. Everything left of i stays ≤ pivot.` });
      i++;
    } else {
      steps.push({ html: boxes(A, marks), note: `A[j=${j}] = ${A[j]} &gt; pivot ${pivot} → leave it; j advances. The region [i..j] holds the &gt;-pivot elements.` });
    }
  }
  steps.push({ html: boxes(A, { [hi]: { cls: "hl-a", tag: "pivot" }, [i]: { cls: "hl-b", tag: "i" } }), note: `The walk is done; i = ${i}. One final swap puts the pivot at its permanent home.`, ask: { q: `After swapping A[i] and the pivot, at which index does ${pivot} sit?`, a: [String(i)] } });
  const t = A[i]; A[i] = A[hi]; A[hi] = t;
  const marks = {}; for (let j = 0; j < i; j++) marks[j] = { cls: "hl-b", tag: "≤" }; marks[i] = { cls: "hl-a", tag: "final" }; for (let j = i + 1; j <= hi; j++) marks[j] = { tag: "&gt;" };
  steps.push({ html: boxes(A, marks), note: `Partitioned: [≤ pivot | <b>${pivot}</b> | &gt; pivot], pivot final at index ${i}. <b>Partitioned, not sorted</b> — quicksort now recurses on the two sides only.` });
  return steps;
}

function buildTraceBFS() {
  const adj = { A: ["B", "C"], B: ["A", "D"], C: ["A", "D"], D: ["B", "C", "E"], E: ["D"] };
  const steps = [];
  const state = (q, dist, note, ask) => ({ html: `<pre class="code">Edges: A–B, A–C, B–D, C–D, D–E\nQueue:   [${q.join(", ")}]\nDist:    ${Object.entries(dist).map(([k, v]) => k + "=" + v).join("  ")}</pre>`, note, ask });
  const dist = { A: 0 };
  const q = ["A"];
  steps.push(state(q, dist, `BFS from <b>A</b>. The queue holds the frontier; dist records discovery distance. FIFO order is what makes distances come out shortest.`));
  while (q.length) {
    if (steps.length > 1) steps.push(state(q, dist, `The queue's front is dequeued next — FIFO, no exceptions.`, { q: `Which vertex is dequeued next?`, a: [q[0]] }));
    const u = q.shift();
    const found = [];
    for (const v of adj[u]) if (!(v in dist)) { dist[v] = dist[u] + 1; q.push(v); found.push(v); }
    steps.push(state(q, dist, `Dequeued <b>${u}</b> (dist ${dist[u]}). ${found.length ? `Discovered ${found.join(", ")} at dist ${dist[u] + 1} — enqueued.` : `All neighbours already visited — nothing to do. (The visited check is what stops the A–B–D–C–A cycle looping forever.)`}`));
  }
  steps.push({ html: `<pre class="code">Final:  A=0  B=1  C=1  D=2  E=3</pre>`, note: `Every distance is the fewest-edges distance — the queue's ring-by-ring expansion guarantees it. Swap the queue for a stack and re-run this in your head: the distances would be garbage.` });
  return steps;
}

function runSearchExperiment() {
  const rows = [];
  for (const n of [10000, 100000, 1000000]) {
    const A = new Array(n); for (let i = 0; i < n; i++) A[i] = i * 2;
    const targets = []; for (let k = 0; k < 300; k++) targets.push(Math.floor(Math.random() * n) * 2);
    let sink = 0;
    let t0 = performance.now();
    for (const t of targets) { for (let i = 0; i < n; i++) if (A[i] === t) { sink++; break; } }
    rows.push({ series: "linear ×300", n, ms: performance.now() - t0 });
    t0 = performance.now();
    for (const t of targets) { let lo = 0, hi = n - 1; while (lo <= hi) { const m = (lo + hi) >> 1; if (A[m] === t) { sink++; break; } if (A[m] < t) lo = m + 1; else hi = m - 1; } }
    rows.push({ series: "binary ×300", n, ms: performance.now() - t0 });
    if (sink === -1) toast("");
  }
  return rows;
}
function runDedupExperiment() {
  const rows = [];
  for (const n of [1000, 4000, 16000]) {
    const A = new Array(n); for (let i = 0; i < n; i++) A[i] = Math.floor(Math.random() * (n / 2));
    let t0 = performance.now();
    const out1 = []; for (const x of A) if (!out1.includes(x)) out1.push(x);
    rows.push({ series: "list.includes", n, ms: performance.now() - t0 });
    t0 = performance.now();
    const seen = new Set(); const out2 = []; for (const x of A) if (!seen.has(x)) { seen.add(x); out2.push(x); }
    rows.push({ series: "hash set", n, ms: performance.now() - t0 });
  }
  return rows;
}
function runFrontExperiment() {
  const rows = [];
  for (const n of [1000, 4000, 16000]) {
    let t0 = performance.now();
    const a = []; for (let i = 0; i < n; i++) a.unshift(i);
    rows.push({ series: "insert at front", n, ms: performance.now() - t0 });
    t0 = performance.now();
    const b = []; for (let i = 0; i < n; i++) b.push(i);
    rows.push({ series: "append at end", n, ms: performance.now() - t0 });
  }

}

function lruRefRun(capacity, ops) {
  const m = new Map(); const out = [];
  for (const op of ops) {
    if (op[0] === "put") {
      if (m.has(op[1])) m.delete(op[1]);
      m.set(op[1], op[2]);
      if (m.size > capacity) m.delete(m.keys().next().value);
    } else {
      if (m.has(op[1])) { const v = m.get(op[1]); m.delete(op[1]); m.set(op[1], v); out.push(v); }
      else out.push(-1);
    }
  }
  return out;
}
function genLruOps() {
  const cap = randInt(1, 4); const m = randInt(8, 25); const ops = [];
  for (let i = 0; i < m; i++) {
    if (Math.random() < 0.55) ops.push(["put", randInt(0, 6), randInt(1, 99)]);
    else ops.push(["get", randInt(0, 6)]);
  }
  return [cap, ops];
}
function kahnRef(n, prereqs) {
  const adj = Array.from({ length: n }, () => []);
  const indeg = new Array(n).fill(0);
  for (const [a, b] of prereqs) { adj[a].push(b); indeg[b]++; }
  const q = []; for (let v = 0; v < n; v++) if (indeg[v] === 0) q.push(v);
  const order = [];
  for (let h = 0; h < q.length; h++) {
    const u = q[h]; order.push(u);
    for (const v of adj[u]) if (--indeg[v] === 0) q.push(v);
  }
  return order.length === n ? order : null;
}
function scheduleCheck(args, got, expected) {
  const n = args[0], prereqs = args[1];
  if (expected === null) return got === null ? null : "these prerequisites contain a cycle — return null (no valid order exists)";
  if (!Array.isArray(got)) return "return an ordering array (or null only for cycles)";
  if (got.length !== n) return "the order must contain all " + n + " tasks exactly once; yours has length " + got.length;
  const pos = {};
  for (let i = 0; i < got.length; i++) pos[got[i]] = i;
  for (let v = 0; v < n; v++) if (pos[v] === undefined) return "task " + v + " is missing from your order";
  for (const [a, b] of prereqs) if (pos[a] >= pos[b]) return "constraint violated: " + a + " must come before " + b;
  return null;
}
function genSched() {
  const n = randInt(1, 8);
  const perm = shuffle(Array.from({ length: n }, (_, i) => i));
  const edges = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (Math.random() < 0.3) edges.push([perm[i], perm[j]]);
  if (n >= 2 && Math.random() < 0.35) {
    const i = randInt(0, n - 2), j = randInt(i + 1, n - 1);
    edges.push([perm[i], perm[j]]); edges.push([perm[j], perm[i]]);   // guaranteed cycle
  }
  return [n, edges];
}
function dijkRef(n, edges, s, t) {
  const adj = Array.from({ length: n }, () => []);
  for (const [u, v, w] of edges) { adj[u].push([v, w]); adj[v].push([u, w]); }
  const dist = new Array(n).fill(Infinity); dist[s] = 0;
  const parent = new Array(n).fill(-1);
  const done = new Array(n).fill(false);
  for (let it = 0; it < n; it++) {
    let u = -1;
    for (let v = 0; v < n; v++) if (!done[v] && (u === -1 || dist[v] < dist[u])) u = v;
    if (u === -1 || dist[u] === Infinity) break;
    done[u] = true;
    for (const [v, w] of adj[u]) if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; parent[v] = u; }
  }
  if (dist[t] === Infinity) return null;
  const path = []; for (let v = t; v !== -1; v = parent[v]) path.push(v);
  path.reverse();
  return { dist: dist[t], path: path };
}
function routeCheck(args, got, expected) {
  const s = args[2], t = args[3], edges = args[1];
  if (expected === null) return got === null ? null : "t is unreachable from s — return null";
  if (got === null || typeof got !== "object" || !Array.isArray(got.path)) return "return {dist, path} (or null only when unreachable)";
  if (got.dist !== expected.dist) return "dist should be " + expected.dist + ", got " + got.dist;
  const p = got.path;
  if (p[0] !== s) return "path must start at s = " + s;
  if (p[p.length - 1] !== t) return "path must end at t = " + t;
  const W = {};
  for (const [u, v, w] of edges) {
    const a = u + "," + v, b = v + "," + u;
    W[a] = Math.min(W[a] === undefined ? Infinity : W[a], w);
    W[b] = Math.min(W[b] === undefined ? Infinity : W[b], w);
  }
  let total = 0;
  for (let i = 0; i + 1 < p.length; i++) {
    const w = W[p[i] + "," + p[i + 1]];
    if (w === undefined) return "path step " + p[i] + " → " + p[i + 1] + " is not an edge of the graph";
    total += w;
  }
  if (total !== expected.dist) return "your path's weights sum to " + total + ", but the shortest distance is " + expected.dist + " — the path must BE a shortest path";
  return null;
}
function genRoute() {
  const n = randInt(2, 7); const edges = [];
  for (let u = 0; u < n; u++) for (let v = u + 1; v < n; v++) if (Math.random() < 0.4) edges.push([u, v, randInt(1, 9)]);
  return [n, edges, randInt(0, n - 1), randInt(0, n - 1)];
}

function capsMark(capId, k) {
  const st = store.data.caps[capId] || (store.data.caps[capId] = {});
  if (!st[k]) {
    st[k] = true;
    addXP(k === "c" ? 40 : 10);
    toast(k === "d" ? "Design approved ✓ Build unlocked" : k === "c" ? "Implementation passed ✓ Analysis unlocked" : "Analysis complete ✓");
  }
  if (st.d && st.c && st.a && !store.data.lab[capId]) labComplete(capId, 30);
  store.save(); renderSidebar();
}
function capStageQuiz(cap, stage, questions) {
  // Correct answers persist in store.data.caps[capId].dq/.aq — reloads keep them.

        if (ok) {
          const s2 = store.data.caps[cap.id] || (store.data.caps[cap.id] = {});
          const set2 = new Set(s2[key] || []);

}

    `<button class="tab ${s === stage ? "active" : ""}" ${s === stage ? 'aria-current="page"' : ""} ${open ? `onclick="go('lab/caps/${id}/${s}')"` : 'disabled title="Complete the previous stage first"'}>${label}${(s === "design" && st.d) || (s === "build" && st.c) || (s === "analyze" && st.a) ? " ✓" : ""}</button>`).join("")}</div>`;

function aiRunCounter(id) {
  const it = AI_ITEMS.find(x => x.id === id);

  try { args = JSON.parse(document.getElementById("ai-in").value); } catch (e) { out.innerHTML = `<div class="verdict no">✗ Not valid JSON. Example: <code>${esc(it.placeholder)}</code></div>`; return; }
  const v = it.validate(args);
  if (v) { out.innerHTML = `<div class="verdict no">✗ ${esc(v)}</div>`; return; }
  let bad, badErr = null;
  try { bad = it.buggy(...JSON.parse(JSON.stringify(args))); } catch (e) { badErr = String(e && e.message || e); }
  const good = it.ref(...JSON.parse(JSON.stringify(args)));
  const differ = badErr !== null || JSON.stringify(bad) !== JSON.stringify(good);
  if (differ) {
    recordSkill("l5u1", true);
    labComplete(id, 25);

  }
}

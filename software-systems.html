    --blue-soft: #f1eafd;
    --good: #0ca30c;
    --good-text: #006300;
    --bad: #d03b3b;
    --warn: #b97a00;
    --gold: #eda100;

    --page: #0d0d12;

    --accent-soft: #1f1e3a;

  .navsec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 8px 6px; font-weight: 600; }
  .navlink {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px;
    color: var(--ink-2); cursor: pointer; font-size: 14.5px; border: none; background: none;
    width: 100%; text-align: left; font-family: inherit;
  }
  .navlink:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
  .navlink.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .navlink .ic { width: 20px; text-align: center; flex-shrink: 0; font-size: 15px; }
  .navlink .lvlbadge { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; }
  .navlink .donecount { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .main { flex: 1; min-width: 0; padding: 28px 34px 80px; max-width: 980px; margin: 0 auto; }

  #navtoggle { display: none; margin-left: auto; border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); border-radius: 8px; font-size: 18px; padding: 3px 11px; cursor: pointer; }

<script>
"use strict";
/* =====================================================================
   SOFTWARE SYSTEMS ENGINEERING — single-file course
   Algorithms & data structures from first principles, with pseudocode.
   Content data first, then the app engine.
   ===================================================================== */

const COURSE = [];
function levelById(id) { return COURSE.find(l => l.id === id); }

COURSE.push({
  id: "l1", short: "L1", icon: "🧮", label: "Level 1 — Foundations",
  tagline: "Algorithms, Big-O, memory & recursion",
  desc: "The bedrock: what an algorithm actually is, how to read and write pseudocode, how to measure cost with Big-O, how arrays and linked lists really live in memory, and how recursion works under the hood."
, units: [] });

levelById("l1").units.push(
{
  id: "l1u1", title: "What is an algorithm?",
  subtitle: "Precise recipes, pseudocode conventions, and what 'correct' means",
  grammar: `
<h3>A recipe a machine could follow</h3>
<p>An <b class="it">algorithm</b> is a finite, unambiguous, step-by-step procedure that transforms <b>input</b> into <b>output</b>. Every word earns its place: <b>finite</b> — it must terminate; <b>unambiguous</b> — each step has exactly one meaning (no "season to taste"); <b>step-by-step</b> — executable by a mindless mechanism. An algorithm is the <i>idea</i> of a computation; a <b class="it">program</b> is that idea written in a real language for a real machine. Binary search predates every programming language ever invented.</p>
<h3>Pseudocode — this course's notation</h3>
<p><b class="it">Pseudocode</b> is structured English for algorithms: precise enough to reason about, free of any language's ceremony. Our conventions:</p>
<table class="gr">
<tr><th>Notation</th><th>Meaning</th></tr>
<tr><td><code>x ← 5</code></td><td>assignment: x takes the value 5</td></tr>
<tr><td><code>A[i]</code></td><td>the element of array A at index i (indices start at 0)</td></tr>
<tr><td><code>length(A)</code>, <code>n</code></td><td>the number of elements in A (usually called n)</td></tr>
<tr><td><code>if / else</code>, <code>while</code>, <code>for i from 0 to n−1</code></td><td>the usual control flow</td></tr>
<tr><td><code>return v</code></td><td>stop and hand back v as the answer</td></tr>
<tr><td><code>⌊x⌋</code></td><td>floor: round x down (⌊7/2⌋ = 3)</td></tr>
</table>
<p>Our first algorithm — find the largest value in an array:</p>
<pre class="code"><b>function</b> findMax(A):              <i>// A: array of n numbers, n ≥ 1</i>
    best ← A[0]
    <b>for</b> i <b>from</b> 1 <b>to</b> n−1:
        <b>if</b> A[i] &gt; best:
            best ← A[i]
    <b>return</b> best</pre>
<h3>What makes it correct?</h3>
<p>Correctness is a claim with two halves: the algorithm <b>terminates</b>, and on termination its output satisfies the specification <i>for every valid input</i> — not just the ones you tried. The reasoning tool is the <b class="it">loop invariant</b>: a statement true before and after every iteration. For findMax: <i>"after processing index i, best holds the maximum of A[0..i]"</i>. True at the start (best = A[0]), preserved by each step, and at the end it gives exactly the spec. Invariants are how you <i>argue</i> an algorithm into being trusted rather than merely testing it warm.</p>
<div class="tip"><b>Edge cases are the spec's border patrol:</b> the empty array, one element, all elements equal, the target absent, duplicates, already-sorted input. Most bugs live at the borders — a well-specified algorithm says what happens there <i>before</i> the code exists.</div>
<h3>One problem, many algorithms</h3>
<p>A problem is a <i>what</i>; algorithms are <i>hows</i> — and they can differ astronomically. Searching a sorted phone book name by name takes up to n steps; repeatedly halving takes ⌊log₂ n⌋ + 1. For a billion entries that's 1,000,000,000 versus 30. Choosing the algorithm is usually worth more than tuning the code — which is why the next unit builds the measuring instrument.</p>
<h3>Going deeper: proving findMax correct, properly</h3>
<p>The invariant proof has three obligations, exactly like mathematical induction:</p>
<ul>
<li><b>Initialization:</b> before the loop's first iteration, best = A[0], and the invariant "best is the maximum of A[0..0]" is trivially true — a one-element range's maximum is that element.</li>
<li><b>Maintenance:</b> assume the invariant holds entering iteration i: best = max(A[0..i−1]). The body compares A[i] against best and keeps the larger, so afterwards best = max(max(A[0..i−1]), A[i]) = max(A[0..i]). The invariant survives.</li>
<li><b>Termination:</b> the loop counter i increases by 1 each pass and is bounded by n, so the loop ends — after the final iteration, the invariant reads "best = max(A[0..n−1])", which is precisely the specification.</li>
</ul>
<p>Notice what the proof bought you: it covers <i>all</i> arrays of <i>all</i> sizes ≥ 1 at once, including every input no test will ever try. Notice also its precision dividend: writing the maintenance step forces you to confront the <code>&gt;</code> vs <code>≥</code> question. As findMax stands — returning only the <i>value</i> — the two choices are observationally identical: with <code>&gt;</code>, best settles at the first occurrence of the maximum; with <code>≥</code>, it is reassigned at every tie; either way the same number comes back. But the moment the spec grows to "return the <i>index</i> of the maximum", the choice becomes visible — <code>&gt;</code> yields the first occurrence, <code>≥</code> the last — and only the spec can say which is correct. Proofs interrogate specs, sometimes by exposing which distinctions the current spec cannot even observe.</p>
<h3>Specifications: the contract before the code</h3>
<p>A full specification has a <b>precondition</b> (what the algorithm may assume: "A is a non-empty array of numbers") and a <b>postcondition</b> (what it must deliver: "returns m such that m is in A and m ≥ every element of A"). Two subtleties professionals track: <b>total vs partial correctness</b> — partial correctness says <i>if</i> it terminates the answer is right; total correctness adds the termination proof (our loop-counter argument). And the postcondition above deliberately has two clauses: "m ≥ everything" alone would allow returning 10⁹ for [1,2,3]; "m is in A" pins it. Under-specified postconditions are how "correct" code returns nonsense.</p>
<h3>The outer wall: problems with no algorithm</h3>
<p>Not every well-posed problem has an algorithm. Turing proved in 1936 that the <b>halting problem</b> — write halts(P, x) that decides whether program P terminates on input x — is <b class="it">undecidable</b>: no such algorithm can exist, ever, on any hardware. The proof is a one-paragraph mic-drop: suppose halts exists, and build the troll program T(P) = "if halts(P, P) then loop forever else stop". Now ask about T(T): if it halts, it loops; if it loops, it halts. Contradiction — halts cannot exist. So computer science has three tiers: problems with efficient algorithms, problems with only infeasible ones (Level 1 Unit 2 meets O(2ⁿ)), and problems with none at all. Perfect general-purpose infinite-loop detectors, perfect malware detectors, perfect program-equivalence checkers — all provably impossible, which is why real tools for these are approximations by necessity, not by laziness.</p>
<h3>A second worked algorithm: reverse in place</h3>
<pre class="code"><b>function</b> reverse(A):
    i ← 0;  j ← n − 1
    <b>while</b> i &lt; j:
        swap A[i], A[j]
        i ← i + 1;  j ← j − 1
    <i>// invariant: A[0..i−1] and A[j+1..n−1] hold each other's</i>
    <i>// original elements, reversed; A[i..j] is untouched</i></pre>
<p>Trace on [1, 2, 3, 4, 5]: swap(0,4) → [5,2,3,4,1]; swap(1,3) → [5,4,3,2,1]; now i = 2, j = 2, the loop guard i &lt; j fails, and the middle element correctly never moves. Check the edges against the catechism: n = 1 → loop never runs (right); n = 0 → i = 0, j = −1, loop never runs (right); even n → pointers cross without meeting (right). Two pointers, one invariant, all edge cases — this little algorithm previews the two-pointer pattern you'll industrialise in Level 4.</p>`,

<h3>Count steps, not seconds</h3>
<p>Stopwatch timings depend on the machine, the language, the weather. <b class="it">Complexity analysis</b> measures an algorithm by <b>how its step count grows as the input size n grows</b> — a property of the algorithm itself. <b class="it">Big-O notation</b> captures the growth rate while discarding what doesn't matter at scale: constants and lower-order terms. If an algorithm takes 3n² + 20n + 500 steps, it is <b>O(n²)</b>: for large n, the n² term owns the bill.</p>
<h3>The ladder</h3>
<table class="gr">
<tr><th>Class</th><th>Name</th><th>n = 1,000,000 (≈steps)</th><th>Typical example</th></tr>
<tr><td><b>O(1)</b></td><td>constant</td><td>1</td><td>array index, hash lookup</td></tr>
<tr><td><b>O(log n)</b></td><td>logarithmic</td><td>20</td><td>binary search</td></tr>
<tr><td><b>O(n)</b></td><td>linear</td><td>10⁶</td><td>scan an array</td></tr>
<tr><td><b>O(n log n)</b></td><td>linearithmic</td><td>2×10⁷</td><td>merge sort</td></tr>
<tr><td><b>O(n²)</b></td><td>quadratic</td><td>10¹²</td><td>compare all pairs</td></tr>
<tr><td><b>O(2ⁿ)</b></td><td>exponential</td><td>astronomical</td><td>try every subset</td></tr>
</table>
<p>The gaps between rungs are not increments; they are <i>categories of feasibility</i>. At n = 10⁶, an O(n²) algorithm needs ~10¹² steps — minutes-to-hours; O(n log n) needs ~2×10⁷ — milliseconds. The jump from n² to n log n is the difference between "can't ship it" and "nobody notices".</p>
<h3>Reading code for its complexity</h3>
<pre class="code"><b>for</b> i <b>from</b> 0 <b>to</b> n−1:          <i>// runs n times</i>
    <b>for</b> j <b>from</b> 0 <b>to</b> n−1:      <i>// n times per i  → n·n = O(n²)</i>
        doSomething()             <i>// O(1) work</i></pre>
<p>Rules of thumb: sequential blocks <b>add</b> (then keep the biggest); nested loops <b>multiply</b>; halving the input each step gives <b>log n</b>. A loop over n containing a binary search is n × log n = O(n log n).</p>
<h3>Three honest caveats</h3>
<p><b>Best, average, worst:</b> quicksort averages O(n log n) but degrades to O(n²) on adversarial input; binary search's worst case is O(log n) but its best is O(1) — found on the first probe. Unqualified "Big-O" usually means worst case. <b class="it">Space complexity</b> gets the same treatment: merge sort buys its speed with O(n) extra memory; an in-place scan uses O(1). And <b class="it">amortized analysis</b> averages cost over a sequence — a dynamic array's append is occasionally O(n) (resize!) but amortized O(1), as the next unit shows.</p>
<div class="tip"><b>Constants strike back at small n:</b> Big-O reigns asymptotically, but for n = 20 an O(n²) insertion sort with a tiny constant beats merge sort's machinery — which is why production sorts switch to insertion sort for small slices. Know the growth rate <i>and</i> the regime you're in.</div>
<h3>Going deeper: what O(·) formally says</h3>
<p>f(n) is O(g(n)) means: there exist a constant c and a threshold n₀ such that <b>f(n) ≤ c · g(n) for all n ≥ n₀</b>. So 3n² + 20n + 500 is O(n²) because, for n ≥ 35, 3n² + 20n + 500 ≤ 4 · n² (pick c = 4, n₀ = 35 — and check the boundary honestly: at n = 34 the left side is 4648 against 4624, still just failing; at n = 35, 4875 against 4900, holding ever after. Thresholds are computed, not vibed). The definition explains the folklore rules: constants vanish (absorbed into c), lower-order terms vanish (dominated past n₀), and — a fact students find suspicious until they see it — <b>logarithm bases don't matter</b>: log₂ n = log₁₀ n / log₁₀ 2, a constant factor, so O(log n) needs no base. O has siblings: <b>Ω</b> (a lower bound: f grows at least this fast) and <b>Θ</b> (tight: both O and Ω). "Merge sort is O(n³)" is technically true and useless; Θ(n log n) is the honest claim. Colloquially "Big-O" usually means Θ — but when reading papers, the symbols are precise.</p>
<h3>Deriving a quadratic honestly: the triangular loop</h3>
<pre class="code"><b>for</b> i <b>from</b> 0 <b>to</b> n−1:
    <b>for</b> j <b>from</b> i+1 <b>to</b> n−1:      <i>// note: starts at i+1, not 0</i>
        compare A[i], A[j]</pre>
<p>The inner loop runs (n−1) + (n−2) + … + 1 + 0 times — the triangular sum <b>n(n−1)/2 = n²/2 − n/2</b>, which is Θ(n²). This is the single most useful closed form in algorithm analysis: every "all pairs" computation is a triangle, and every triangle is half a square — still quadratic. Corollary worth internalising: "I halved the work by skipping symmetric pairs" never changes the complexity class, only the constant.</p>
<h3>The amortized doubling proof, with actual numbers</h3>
<p>Claim: n appends into an empty dynamic array cost O(n) total, hence O(1) amortized each. Count the copy work: resizes happen at sizes 1, 2, 4, 8, …, so the total elements ever copied is 1 + 2 + 4 + … + n/2 &lt; n. Add the n cheap writes themselves: total &lt; 2n operations for n appends — under 2 per append, forever, regardless of n. Now see why <b>increment growth fails</b>: growing by a fixed 10 slots forces a copy of ~k elements every 10 appends, totalling 10 + 20 + 30 + … ≈ n²/20 — the triangular sum again, quadratic. Doubling's geometric series converges; increments' arithmetic series doesn't. That single distinction is the entire theory of dynamic arrays.</p>
<h3>The wall beyond exponential: P, NP and friends</h3>
<p>Some problems seem to <i>require</i> exponential search: the travelling salesman, optimal scheduling, Boolean satisfiability. Nobody has proven they do — that's the famous <b>P vs NP</b> question (P: solvable in polynomial time; NP: a proposed answer is <i>checkable</i> in polynomial time). What is proven: thousands of these problems are <b>NP-complete</b> — polynomial-time interreducible, so one fast algorithm for any of them cracks them all. Sixty years of failure to find one is why, when your problem smells NP-complete (choose a subset, order things optimally, satisfy all constraints), the professional move is not a faster exact algorithm but a change of terms: approximation, heuristics, or exploiting special structure. Knowing the wall exists is itself an engineering skill — it redirects effort from the impossible to the useful.</p>`,

  id: "l1u3", title: "Arrays, linked lists & memory",
  subtitle: "Contiguous vs linked — why 'where the bytes live' decides the cost",
  grammar: `
<h3>The array: arithmetic as access</h3>
<p>An <b class="it">array</b> stores n elements in one <b>contiguous</b> block of memory. That single fact buys its superpower: the address of A[i] is <i>start + i × elementSize</i> — one multiplication, one addition — so <b>indexing is O(1)</b> regardless of n. The same fact sets its weaknesses: <b>insert or delete in the middle is O(n)</b> (every later element must shift), and growing is awkward because the neighbouring memory may be occupied.</p>
<h3>The dynamic array: growth by doubling</h3>
<p>Real lists (Python's <code>list</code>, Java's <code>ArrayList</code>, JS arrays) are <b class="it">dynamic arrays</b>: an array with spare <b>capacity</b>. Append into spare space: O(1). Out of space? Allocate a block <b>twice</b> the size, copy everything over (O(n)), continue. The doubling trick makes the expensive copies exponentially rare, so append is <b class="it">amortized O(1)</b> — the canonical amortization example, and the reason you may treat append as cheap.</p>
<h3>The linked list: pointers as structure</h3>
<p>A <b class="it">linked list</b> abandons contiguity: each <b>node</b> holds a value and a <b>pointer</b> to the next node, scattered anywhere in memory.</p>
<pre class="code">head → [7 | •] → [3 | •] → [9 | ∅]      <i>// singly linked: value + next-pointer</i></pre>
<p>Now insertion or deletion <i>at a known node</i> is O(1) — rewire two pointers, nothing shifts. The price: <b>no O(1) indexing</b>. Reaching position i means walking i pointers: O(n). The array and the list are perfect mirrors — each is O(1) exactly where the other is O(n).</p>
<table class="gr">
<tr><th>Operation</th><th>Array / dynamic array</th><th>Linked list</th></tr>
<tr><td>Access by index</td><td><b>O(1)</b></td><td>O(n)</td></tr>
<tr><td>Insert/delete at front</td><td>O(n) — shift all</td><td><b>O(1)</b></td></tr>
<tr><td>Insert/delete in middle (node in hand)</td><td>O(n)</td><td><b>O(1)</b></td></tr>
<tr><td>Append at end</td><td><b>amortized O(1)</b></td><td>O(1) with tail pointer</td></tr>
<tr><td>Search unsorted</td><td>O(n)</td><td>O(n)</td></tr>
</table>
<h3>The cache: why arrays win more than the table says</h3>
<p>Modern CPUs fetch memory in blocks and keep recently-used blocks in fast <b class="it">caches</b>. Scanning an array marches through contiguous bytes — nearly every access is a cache hit. Chasing list pointers hops unpredictably — a potential cache miss (~100× slower than a hit) per node. So in wall-clock terms, arrays often beat lists <i>even on the operations where the table calls them equal</i>. The asymptotics are the map; <b class="it">memory locality</b> is the terrain.</p>
<div class="tip"><b>Doubly linked, and why textbooks love lists anyway:</b> a doubly linked list adds a prev-pointer per node, enabling O(1) removal given a node and backward walks — it underlies LRU caches and deques. And linked nodes are the gateway drug to trees and graphs: the same value-plus-pointers pattern, with more pointers.</div>
<h3>Going deeper: where memory actually lives</h3>
<p>A running program's memory has two working regions. The <b>stack</b> holds function frames (Level 1 Unit 4): allocation is "bump a pointer" — effectively free — and everything dies automatically when the function returns. The <b>heap</b> (no relation to the heap data structure!) holds everything whose lifetime outlives a function call: objects, list nodes, dynamic arrays' backing blocks. Heap allocation costs real work (finding space, bookkeeping, eventually garbage collection or free), which is why a linked list — one heap allocation <i>per node</i> — carries overhead an array never pays: n allocations vs 1, plus a pointer (8 bytes) per node, plus allocator metadata. A list of a million 8-byte integers can easily occupy 3–4× the array's memory before you count cache effects.</p>
<h3>The cache picture, quantified</h3>
<p>CPUs fetch memory in <b>cache lines</b> of typically 64 bytes. Scan an array of 8-byte values and one line-fetch delivers 8 elements: 1 miss, then 7 hits, repeating — an effective miss rate of 1/8, with the hardware prefetcher spotting the linear pattern and hiding even those. Chase list pointers and each node is potentially a fresh line from a random address: up to 1 miss per element, unprefetchable because the next address is unknown until the current node arrives. At ~100 cycles per miss vs ~4 per hit, the array's 'identical' O(n) scan wins by an order of magnitude. This is also why <b>struct-of-arrays</b> layouts beat array-of-structs when you scan one field of many records (game engines and analytics databases are built on this), and why B-trees (Level 4) fatten their nodes to line and page sizes.</p>
<h3>Linked-list craft: sentinels and the runner trick</h3>
<pre class="code"><i>// dummy-head sentinel: kills the "is it the first node?" special case</i>
<b>function</b> deleteAll(list, value):
    dummy ← new node;  dummy.next ← list.head
    cur ← dummy
    <b>while</b> cur.next ≠ ∅:
        <b>if</b> cur.next.value = value: cur.next ← cur.next.next
        <b>else</b>: cur ← cur.next
    <b>return</b> dummy.next          <i>// possibly-new head, no branches needed</i></pre>
<p>Without the sentinel, deleting the head is a different code path from deleting mid-list — a classic source of bugs; the dummy node makes every deletion "the node after cur", uniformly. Second staple, the <b>runner</b>: two pointers advancing at different speeds. fast moves two hops per slow's one — when fast hits the end, slow stands at the middle (one pass, no length count); and if the list contains a cycle, fast laps slow and they collide — Floyd's cycle detection, which Level 4 revisits. These two tricks appear in an outsized fraction of linked-list problems.</p>
<h3>Growth factors and the 1.5 vs 2 debate</h3>

<h3>Self-reference, tamed</h3>
<p><b class="it">Recursion</b> solves a problem by solving smaller instances of itself. Every correct recursion has two parts: a <b class="it">base case</b> — an instance so small the answer is immediate — and a <b class="it">recursive case</b> that reduces the problem <i>strictly toward</i> the base. Miss the base case, or fail to shrink, and you recurse forever.</p>
<pre class="code"><b>function</b> factorial(n):
    <b>if</b> n ≤ 1: <b>return</b> 1            <i>// base case</i>
    <b>return</b> n · factorial(n−1)      <i>// recursive case: strictly smaller</i></pre>
<h3>The call stack — recursion's hidden data structure</h3>
<p>Each function call pushes a <b class="it">stack frame</b> (its parameters and locals) onto the <b class="it">call stack</b>; returning pops it. <code>factorial(4)</code> stacks four frames — 4, 3, 2, 1 — then unwinds, multiplying on the way back: 1, 2, 6, 24. Two consequences: recursion depth costs <b>O(depth) memory</b>, and unbounded depth crashes with a <b class="it">stack overflow</b>. Every recursion can be rewritten as a loop with an explicit stack — recursion is a notation, not a magic power.</p>
<h3>The recursion tree — reading the cost</h3>
<p>Draw one node per call and you can <i>see</i> the complexity. For naive Fibonacci:</p>
<pre class="code"><b>function</b> fib(n):
    <b>if</b> n ≤ 1: <b>return</b> n
    <b>return</b> fib(n−1) + fib(n−2)     <i>// two calls per call…</i></pre>
<p>The tree doubles at each level: <b>O(2ⁿ)</b> calls — fib(50) is ~10¹⁵ calls — and the tree is full of <i>repeated</i> subproblems (fib(3) computed millions of times). Caching each result once — <b class="it">memoization</b> — collapses the tree to O(n). That one observation is the seed of dynamic programming (Level 3).</p>
<h3>Divide & conquer — recursion's power move</h3>
<p>The famous pattern: <b>divide</b> the input, <b>conquer</b> the halves recursively, <b>combine</b> the results. Halving yields log n levels; if each level does O(n) combine work, the total is <b>O(n log n)</b> — the shape of merge sort, coming in Level 3. When the pieces are independent (no shared subproblems), divide & conquer wins without memoization.</p>
<div class="tip"><b>The recursive leap of faith:</b> to write the recursive case, <i>assume</i> the recursive call works for smaller inputs and just combine correctly — the same move as mathematical induction. Trust the smaller call; verify only the base case and the combining step. Trying to mentally trace every level is how humans get lost; induction is how they don't.</div>
<h3>Going deeper: recurrences — the algebra of recursion</h3>
<p>A recursive algorithm's cost is naturally a <b>recurrence relation</b>. Merge sort: T(n) = 2T(n/2) + cn ("two half-size calls plus linear merge work"). The recursion-tree method solves it visually: level 0 does cn work; level 1 has two problems of size n/2 doing cn/2 each — cn total; level 2, four quarters — cn again. <b>Every level costs cn</b>, there are log₂ n levels, total Θ(n log n). Now vary the shape and watch the answer change:</p>
<table class="gr">
<tr><th>Recurrence</th><th>Shape</th><th>Solution</th><th>Example</th></tr>
<tr><td>T(n) = T(n/2) + c</td><td>one half-call, constant work</td><td>Θ(log n)</td><td>binary search</td></tr>
<tr><td>T(n) = 2T(n/2) + cn</td><td>two halves, linear combine</td><td>Θ(n log n)</td><td>merge sort</td></tr>
<tr><td>T(n) = 2T(n/2) + c</td><td>two halves, constant combine</td><td>Θ(n)</td><td>tree traversal</td></tr>
<tr><td>T(n) = T(n−1) + c</td><td>one smaller call</td><td>Θ(n)</td><td>factorial</td></tr>
<tr><td>T(n) = T(n−1) + cn</td><td>one smaller call, linear work</td><td>Θ(n²)</td><td>worst-case quicksort</td></tr>
<tr><td>T(n) = 2T(n−1) + c</td><td>two barely-smaller calls</td><td>Θ(2ⁿ)</td><td>naive Fibonacci, Hanoi</td></tr>
</table>
<p>The general tool is the <b>master theorem</b> (for T(n) = aT(n/b) + f(n): compare f(n) against n^(log_b a)), but this table of shapes covers nearly everything you'll meet — and the recursion tree re-derives any of them on a napkin.</p>
<h3>Memoized Fibonacci, written out</h3>
<pre class="code">memo ← empty map
<b>function</b> fib(n):
    <b>if</b> n ≤ 1: <b>return</b> n
    <b>if</b> n <b>in</b> memo: <b>return</b> memo[n]     <i>// answered before: O(1)</i>
    memo[n] ← fib(n−1) + fib(n−2)
    <b>return</b> memo[n]</pre>
<p>Count the real work: each value 2..n is <i>computed</i> exactly once (thereafter served from the map), and each computation does O(1) work beyond its recursive lookups — O(n) total, O(n) space for memo plus O(n) recursion depth. The exponential tree still "exists" conceptually; the cache prunes every repeated branch at the moment it's entered. This is dynamic programming (Level 3) in embryo.</p>
<h3>Recursion made iterative: the explicit stack</h3>
<pre class="code"><b>function</b> traverseIterative(root):     <i>// what the runtime was doing for you</i>
    S ← stack containing root
    <b>while</b> S not empty:
        node ← S.pop()
        <b>if</b> node = ∅: <b>continue</b>
        visit(node)
        S.push(node.right);  S.push(node.left)   <i>// left popped first</i></pre>
<p>This is mechanical proof that recursion is notation, not power: the explicit stack replaces the call stack frame-for-frame. When to actually do it: recursion depth threatens overflow (a degenerate million-node tree at ~10⁴–10⁵ safe frames), or you need to pause/resume traversal (iterators). Special case for free: a <b>tail call</b> — recursion as the function's very last act — needs no frame at all and converts to a plain loop; sum-with-accumulator and gcd(a, b) = gcd(b, a mod b) are the classic examples. Some compilers do this transformation automatically; knowing it exists lets you do it by hand anywhere.</p>
<h3>Choosing recursion honestly</h3>
<p>Recursion wins when the <i>data</i> is recursive (trees, nested structures, divide & conquer) — the code mirrors the shape and the invariants write themselves. Loops win for linear scans and accumulate-as-you-go, where recursion adds frame overhead and overflow risk for zero clarity. The professional failure mode isn't choosing wrong — it's not realising both forms are always available, one transformation apart.</p>`,

<h3>Two disciplines of order</h3>
<p>A <b class="it">stack</b> is last-in, first-out (<b>LIFO</b>): you may only <code>push</code> onto the top and <code>pop</code> from the top — like a stack of plates. A <b class="it">queue</b> is first-in, first-out (<b>FIFO</b>): <code>enqueue</code> at the back, <code>dequeue</code> from the front — like a line at a counter. Both do their core operations in <b>O(1)</b>. Their power is exactly their restriction: by <i>forbidding</i> arbitrary access, they guarantee an order the algorithm can rely on.</p>
<pre class="code">stack: push(x), pop() → newest first      <i>// undo, call stack, DFS</i>
queue: enqueue(x), dequeue() → oldest first   <i>// print jobs, buffering, BFS</i></pre>
<h3>Where they run the world</h3>
<table class="gr">
<tr><th>Structure</th><th>Running inside</th></tr>
<tr><td><b>Stack</b></td><td>the call stack (Level 1!), undo/redo, back button, matching brackets, depth-first search</td></tr>
<tr><td><b>Queue</b></td><td>print/job schedulers, message queues between services, keyboard buffers, breadth-first search</td></tr>
</table>
<h3>Worked example: balanced brackets</h3>
<p>Is <code>{[()()]}</code> balanced? Scan left to right; push every opener; on a closer, the top of the stack must be its matching opener — pop it. Balanced ⇔ never a mismatch and the stack ends empty.</p>
<pre class="code"><b>function</b> balanced(s):
    S ← empty stack
    <b>for</b> ch <b>in</b> s:
        <b>if</b> ch is an opener: S.push(ch)
        <b>else if</b> ch is a closer:
            <b>if</b> S is empty <b>or</b> S.pop() doesn't match ch: <b>return</b> false
    <b>return</b> S is empty      <i>// leftovers mean unclosed openers</i></pre>
<p>The stack works because bracket nesting <i>is</i> LIFO: the most recently opened bracket must close first. Choosing a structure = recognising the problem's inherent discipline.</p>
<h3>Implementations and cousins</h3>
<p>A stack is a dynamic array with push/pop at the end (amortized O(1)). A queue needs care — dequeuing from an array's front is O(n)! Use a linked list with head and tail pointers, or a <b class="it">ring buffer</b>: a fixed array with wrap-around front/back indices, beloved in low-level systems for zero allocation. The <b class="it">deque</b> (double-ended queue) allows O(1) push/pop at <i>both</i> ends and can impersonate either. A <b class="it">priority queue</b> serves "most important first" rather than oldest-first — it needs a cleverer structure (the heap, two units ahead).</p>
<div class="tip"><b>The interview classic:</b> implement a queue from two stacks — push into stack A; to dequeue, if stack B is empty, pour all of A into B (reversing order), then pop B. Each element moves at most twice: amortized O(1). Worth understanding, not memorising: it's amortization made tangible.</div>
<h3>Going deeper: the ring buffer, implemented for real</h3>
<pre class="code"><i>// fixed array B of capacity m; all operations O(1), zero allocation</i>
front ← 0;  count ← 0

<b>function</b> enqueue(x):
    <b>if</b> count = m: <b>return</b> full          <i>// or overwrite oldest — a policy choice</i>
    B[(front + count) mod m] ← x         <i>// back position, wrapped</i>
    count ← count + 1

<b>function</b> dequeue():
    <b>if</b> count = 0: <b>return</b> empty
    x ← B[front]
    front ← (front + 1) mod m            <i>// front advances and wraps</i>
    count ← count − 1
    <b>return</b> x</pre>
<p>The <code>mod m</code> is the whole trick: indices chase each other around a circle instead of marching off the array's end. Two engineering notes worth knowing: real implementations often pick m as a power of two so <code>mod</code> becomes a bit-mask (cheap), and the "full" branch is a genuine <i>policy decision</i> — audio buffers overwrite the oldest sample (freshness matters), job queues reject (losing work is worse). A fixed-size buffer forces the overflow question at design time; an unbounded queue just postpones it until the process dies of memory exhaustion. Bounded is a feature.</p>
<h3>The two-stacks queue, in full</h3>
<pre class="code">inbox ← empty stack;  outbox ← empty stack

<b>function</b> enqueue(x): inbox.push(x)

<b>function</b> dequeue():
    <b>if</b> outbox is empty:
        <b>while</b> inbox not empty:           <i>// pour: reverses order</i>
            outbox.push(inbox.pop())
    <b>return</b> outbox.pop()</pre>
<p>Trace enqueue 1, 2, 3 then dequeue: inbox = [1,2,3] (3 on top); the pour pushes 3, then 2, then 1 onto outbox — outbox = [3,2,1] with <b>1 on top</b>. Two LIFO reversals compose into FIFO. The amortized accounting: each element is pushed to inbox once, poured at most once, popped at most once — ≤ 3 operations per element over its lifetime, so any sequence of n operations costs O(n) even though a single dequeue can occasionally pour thousands. This design is not academic: it's how purely-functional languages implement queues, and the pour-only-when-empty rule is exactly what makes the accounting work.</p>
<h3>An advanced stack pattern: the monotonic stack</h3>
<p>Problem: for each element, find the <b>next greater element</b> to its right ([2, 1, 5, 3] → [5, 5, ∅, ∅]). All-pairs scanning is O(n²). Instead, keep a stack of indices whose answer is still unknown, maintained in decreasing value order:</p>

<p>A <b class="it">hash table</b> stores key→value pairs and answers <code>get</code>, <code>put</code> and <code>delete</code> in <b>O(1) average</b> time. The trick: a <b class="it">hash function</b> converts each key into a number, taken modulo the array size, giving the <b>bucket index</b> where the pair lives. Looking up "alice" doesn't search — it <i>computes</i> where alice must be.</p>

<table class="gr">

<h3>From list to tree</h3>
<p>A <b class="it">tree</b> is nodes and pointers, like a list — but each node may point to several <b>children</b>, and every node has exactly one <b>parent</b> (except the <b class="it">root</b>). No cycles. Trees are how computing represents hierarchy: file systems, HTML's DOM, org charts, JSON, parsed code. Vocabulary that recurs everywhere: <b>leaf</b> (no children), <b>depth</b> (distance from root), <b>height</b> (longest root-to-leaf path), <b>subtree</b> (any node with its descendants — itself a tree, which is why recursion loves trees).</p>
<h3>The binary search tree</h3>
<p>A <b class="it">binary tree</b> allows at most two children: left and right. A <b class="it">binary search tree (BST)</b> adds the ordering <b>invariant</b>: <i>everything in the left subtree &lt; node &lt; everything in the right subtree</i> — at every node. The invariant turns search into descent:</p>
<pre class="code"><b>function</b> search(node, target):
    <b>if</b> node = ∅: <b>return</b> not found
    <b>if</b> target = node.key: <b>return</b> node
    <b>if</b> target &lt; node.key: <b>return</b> search(node.left, target)
    <b>else</b>: <b>return</b> search(node.right, target)</pre>
<p>Each comparison discards an entire subtree — binary search as a structure. Search, insert and delete all cost <b>O(h)</b> where h is the height.</p>
<h3>The balance problem</h3>
<p>Here's the catch: h depends on <i>shape</i>. A <b>balanced</b> tree of n nodes has h ≈ log₂ n — a million keys, ~20 levels. But insert keys in sorted order and each goes right of the last: the "tree" is a chain with h = n, and O(h) = O(n). Everything the BST promises hinges on staying balanced. <b class="it">Self-balancing trees</b> (AVL, red-black) do small local rotations on insert/delete to guarantee h = O(log n) always — they power language library "sorted maps" (C++ <code>std::map</code>, Java <code>TreeMap</code>).</p>
<h3>What trees give that hash tables can't</h3>
<p><b>Order.</b> An <b class="it">in-order traversal</b> (left, node, right) of a BST visits keys in <i>sorted order</i> in O(n). Range queries ("everything from A to C"), min/max, successor, "closest key ≤ x" — all O(log n)-ish. The hash table answers "is it there?" faster; the tree answers "what's near it, before it, between?" at all.</p>
<pre class="code"><b>function</b> inorder(node):            <i>// visits keys in sorted order</i>

<p>Compact, cache-friendly, zero pointer overhead — a tree wearing an array costume.</p>
<h3>The two moves</h3>
<p><b>Insert:</b> append at the end (keeping completeness), then <b class="it">sift up</b> — swap with the parent while smaller. <b>Extract-min:</b> take the root, move the last element to the root, then <b class="it">sift down</b> — swap with the smaller child while larger. Both walk at most the height of a complete tree: <b>O(log n)</b>.</p>
<pre class="code"><b>function</b> siftDown(H, i):
    <b>while</b> i has a child:
        c ← index of smaller child of i
        <b>if</b> H[c] &lt; H[i]: swap H[i], H[c]; i ← c
        <b>else</b>: <b>break</b></pre>
<h3>Where heaps run the world</h3>
<p>OS schedulers picking the next task; Dijkstra's algorithm repeatedly extracting the nearest unvisited node (Level 3); timer wheels firing the soonest deadline; "top-K of a stream" with a heap of size K; merging k sorted lists. And <b class="it">heapsort</b>: build a heap in O(n) (a pleasant surprise — sifting down from the bottom is cheaper than it looks), then extract n times → an in-place, guaranteed <b>O(n log n)</b> sort.</p>
<div class="tip"><b>Heap ≠ BST — know the difference:</b> a BST orders <i>left vs right</i> (full sorted order, ranges, any-key search in O(log n)); a heap orders only <i>parent vs child</i> (just the min/max is instantly known — searching for an arbitrary key is O(n)). The heap's weaker promise is exactly why it's smaller, simpler and faster at its one job. Structures are contracts: buy only the guarantee you need.</div>
<h3>Going deeper: why heapify is O(n), not O(n log n)</h3>
<p>Building a heap by n inserts costs O(n log n). The better way — <b>Floyd's heapify</b> — walks from the last parent down to the root, sifting each node down:</p>
<pre class="code"><b>function</b> heapify(A):
    <b>for</b> i <b>from</b> ⌊n/2⌋ − 1 <b>down to</b> 0:     <i>// indices ⌊n/2⌋..n−1 are leaves</i>
        siftDown(A, i)</pre>
<p>The accounting trick: sift-down's cost is the node's <i>height</i> (distance to the leaves), not its depth — and a complete tree is bottom-heavy in exactly the right way. Half the nodes are leaves (height 0, free); a quarter have height 1; an eighth height 2… Total work ≤ n·(1/2·0 + 1/4·1 + 1/8·2 + 1/16·3 + …) = n·Σ k/2ᵏ⁺¹ = <b>n·1</b>. The series converges: linear. This is why "give me the top-K of n items" via heapify-then-K-extracts costs O(n + K log n) — for small K, essentially linear — beating a full O(n log n) sort. The general lesson: <i>where</i> the work happens in a tree (heavy at the leaves vs heavy at the root) can move a whole log factor.</p>
<h3>Sift up, and a full insert/extract trace</h3>
<pre class="code"><b>function</b> siftUp(H, i):
    <b>while</b> i &gt; 0:
        p ← ⌊(i−1)/2⌋
        <b>if</b> H[i] &lt; H[p]: swap H[i], H[p];  i ← p
        <b>else</b>: <b>break</b></pre>
<p>Trace on min-heap [2, 5, 3, 9, 6]: <b>insert 1</b> → append at index 5: [2,5,3,9,6,1]; parent ⌊(5−1)/2⌋ = 2 holds 3 &gt; 1, swap → [2,5,1,9,6,3]; parent 0 holds 2 &gt; 1, swap → [1,5,2,9,6,3]. Root in two swaps. Now <b>extract-min</b>: return 1; move last (3) to root → [3,5,2,9,6]; sift down: smaller child of {5, 2} is 2 &lt; 3, swap → [2,5,3,9,6]; index 2 has no children — done. Every operation is one walk along a root-leaf path of a <i>complete</i> tree: never more than ⌊log₂ n⌋ steps, with no rebalancing machinery, ever — completeness is maintained by construction (append at the end; fill holes from the end).</p>
<h3>Decrease-key, and the lazy alternative</h3>
<p>Dijkstra (Level 3) repeatedly <i>improves</i> a vertex's tentative distance — a <b>decrease-key</b>: lower the value, then sift up from its position. But finding "its position" needs an auxiliary index map (value → heap index), updated on every swap — invasive. The pragmatic alternative most real implementations choose is <b>lazy deletion</b>: don't update; just insert a fresh (better) copy, and when extracting, discard entries whose value is stale ("already finalised"). The heap grows to O(E) instead of O(V) — usually a fine trade for never writing the index bookkeeping. Two correct designs, chosen by which cost you'd rather carry: memory and skips, or code complexity. (Fibonacci heaps make decrease-key O(1) amortized and look better on paper; their constants keep binary heaps winning in practice — a Big-O-vs-terrain lesson in itself.)</p>
<h3>Variations that earn their keep</h3>
<p>A <b>d-ary heap</b> gives each node d children: shallower (log_d n) so inserts speed up, but sift-down now compares d children per level — a tunable trade that favours d ≈ 4 when memory bandwidth dominates. A <b>max-heap</b> is the same structure with ≥; need both ends cheap? That's a min-max heap or a pair of heaps. And the <b>two-heap median</b> pattern: a max-heap of the lower half, a min-heap of the upper half, sizes kept within one — the running median of a stream in O(log n) per element, peeked in O(1). Once the parent-child contract is in your bones, these are twenty-minute variations, not new structures.</p>`,

<h3>The most general structure</h3>
<p>A <b class="it">graph</b> is a set of <b>vertices</b> (nodes) and <b>edges</b> (connections). Road networks, social graphs, the web's links, dependency charts, circuits, state machines — anything that is <i>things plus relationships</i>. Flavours: <b>directed</b> (edges have direction: follows, links, depends-on) vs <b>undirected</b> (friendship); <b>weighted</b> (edges carry costs: distance, latency) vs unweighted. A tree, it turns out, is just a connected graph with no <b class="it">cycles</b> — graphs are the general case.</p>
<h3>Two representations</h3>
<table class="gr">
<tr><th></th><th>Adjacency list</th><th>Adjacency matrix</th></tr>
<tr><td>Stores</td><td>per vertex: a list of its neighbours</td><td>V×V grid of 0/1 (or weights)</td></tr>
<tr><td>Space</td><td><b>O(V + E)</b></td><td>O(V²)</td></tr>
<tr><td>"Is u→v an edge?"</td><td>O(degree)</td><td><b>O(1)</b></td></tr>
<tr><td>Visit all neighbours</td><td><b>O(degree)</b></td><td>O(V)</td></tr>
</table>
<p>Real graphs are usually <b class="it">sparse</b> (E ≪ V²) — a million users with ~200 friends each — so the adjacency list is the default. The matrix suits small dense graphs and O(1) edge tests.</p>
<h3>BFS — explore in rings</h3>
<p><b class="it">Breadth-first search</b> explores level by level using a <b>queue</b>: visit the start, then all neighbours, then their neighbours. Because it expands in rings, BFS finds the <b>fewest-edges path</b> to every vertex in an unweighted graph.</p>
<pre class="code"><b>function</b> BFS(G, s):
    Q ← queue containing s;  mark s visited
    <b>while</b> Q not empty:
        u ← Q.dequeue()
        <b>for</b> v <b>in</b> G.neighbours(u):
            <b>if</b> v not visited:
                mark v visited;  v.dist ← u.dist + 1;  Q.enqueue(v)</pre>
<h3>DFS — explore by diving</h3>
<p><b class="it">Depth-first search</b> dives as far as possible before backtracking — a <b>stack</b> (or plain recursion: the call stack) instead of a queue. DFS is the engine of: cycle detection, <b class="it">topological sort</b> (ordering dependencies), connected components, maze solving.</p>
<pre class="code"><b>function</b> DFS(G, u):
    mark u visited
    <b>for</b> v <b>in</b> G.neighbours(u):
        <b>if</b> v not visited: DFS(G, v)</pre>
<p>Both run in <b>O(V + E)</b> — each vertex and edge touched a constant number of times. The <b>visited</b> set is not optional: graphs have cycles, and without it both searches loop forever.</p>
<div class="tip"><b>One swap, two algorithms:</b> BFS and DFS are the <i>same</i> skeleton with the frontier structure swapped — queue → rings and shortest hops; stack → deep dives and structural facts. Data structure choice <i>is</i> algorithm design. (Swap in a priority queue keyed by distance and you get Dijkstra — Level 3.)</div>
<h3>Going deeper: why BFS distances are provably shortest</h3>
<p>Claim: when BFS first reaches a vertex v, v.dist is the true minimum edge count from s. Proof by induction on distance d. Base: only s has distance 0, and BFS starts there. Step: assume every vertex at true distance ≤ d is discovered with the correct label. Any vertex v at true distance d+1 has some neighbour u at distance d; when u was dequeued (correctly labelled d, by hypothesis), v was either discovered right then with label d+1, or had already been discovered — and the queue's FIFO discipline guarantees everything discovered earlier carries a label ≤ d+1, never less than the true distance. The key structural fact making this work: <b>the queue's labels are monotone non-decreasing</b> — BFS never dequeues a distance-5 vertex before finishing distance 4. Swap the queue for a stack and this monotonicity dies instantly, which is precisely why DFS distances mean nothing. The proof isn't decoration: it tells you exactly which property (FIFO monotonicity) any BFS-like algorithm must preserve — and Dijkstra's priority queue is that same monotonicity, generalised to weighted distance.</p>
<h3>Iterative DFS, and the edges DFS sees</h3>
<pre class="code"><b>function</b> DFSiterative(G, s):        <i>// explicit stack: no overflow on huge graphs</i>
    S ← stack containing s
    <b>while</b> S not empty:
        u ← S.pop()
        <b>if</b> u visited: <b>continue</b>       <i>// may be stacked twice — check at pop</i>
        mark u visited;  visit(u)
        <b>for</b> v <b>in</b> G.neighbours(u):
            <b>if</b> v not visited: S.push(v)</pre>
<p>During DFS, every graph edge lands in one of a few classes — and the classes are diagnostic instruments. A <b>tree edge</b> leads to an undiscovered vertex (the exploration skeleton). A <b class="it">back edge</b> points from a vertex to one of its <i>ancestors still on the recursion stack</i> — and a back edge is exactly a <b>cycle witness</b>: the cycle detection everyone hand-waves is literally "run DFS; report a back edge". The bookkeeping is three colours: white (unvisited), grey (on the current path), black (finished) — an edge to a <i>grey</i> vertex is a back edge; an edge to a <i>black</i> one is benign. This grey/black distinction is the difference between detecting real cycles and false-alarming on diamonds (two paths to the same node — legal in a DAG). It's also topological sort's second implementation: DFS everything, output vertices in reverse finishing order — reverse post-order is a topological order, no in-degree counting needed.</p>
<h3>Worked patterns: components and bipartiteness</h3>
<pre class="code"><b>function</b> countComponents(G):         <i>// undirected</i>
    c ← 0
    <b>for</b> v <b>in</b> vertices:
        <b>if</b> v not visited:
            c ← c + 1;  BFS(G, v)     <i>// or DFS — floods one island</i>
    <b>return</b> c</pre>
<p>Each search floods exactly one connected island; the loop counts islands — total cost still O(V+E) because visited marks persist across floods. Second pattern, <b>bipartiteness</b> (can vertices be 2-coloured so every edge crosses colours? — the structure of matching problems and conflict scheduling): BFS, colouring each newly discovered vertex opposite its discoverer, and declare failure on any edge joining same-coloured vertices. A graph is bipartite iff it has no odd-length cycle, and this colouring check finds the violation in O(V+E). Both patterns are the plain searches plus three lines — the searches are chassis; the bookkeeping you bolt on is the algorithm.</p>
<h3>Building the graph is part of the algorithm</h3>
<pre class="code"><i>// from an edge list, in O(V + E)</i>
adj ← array of V empty lists
<b>for</b> (u, v) <b>in</b> edges:
    adj[u].append(v)
    adj[v].append(u)      <i>// omit for directed graphs</i></pre>
<p>Unglamorous, and the site of real bugs: forgetting the reverse edge (accidentally directed), duplicate edges inflating degrees, self-loops meeting algorithms that assumed none. Interviewers hand you edge lists; production hands you CSVs of them. The two-line build is also where representation decisions bite — vertices as integers 0..V−1 enable flat arrays everywhere; vertices as strings mean a hash map layer first (Level 2 Unit 2 earning rent). Budget the five minutes; graph algorithms fail at their inputs more often than at their theory.</p>`,

<h3>Binary search — simple idea, famously tricky edges</h3>
<p>On a <b>sorted</b> array, compare the target to the middle element and discard half. O(log n) — a billion elements in ~30 probes.</p>
<pre class="code"><b>function</b> binarySearch(A, target):
    lo ← 0;  hi ← length(A) − 1
    <b>while</b> lo ≤ hi:
        mid ← ⌊(lo + hi) / 2⌋
        <b>if</b> A[mid] = target: <b>return</b> mid
        <b>else if</b> A[mid] &lt; target: lo ← mid + 1
        <b>else</b>: hi ← mid − 1
    <b>return</b> not found</pre>
<p>The invariant: <i>if the target exists, it lies in A[lo..hi]</i>. Every line guards it: <code>lo ≤ hi</code> (a one-element range still needs checking), <code>mid + 1</code> / <code>mid − 1</code> (mid is already ruled out — keep it and you can loop forever). Knuth noted the first binary search was published in 1946; the first <i>correct</i> one for all array sizes took until 1962. Respect the edges.</p>
<h3>The O(n²) sorting family</h3>
<table class="gr">
<tr><th>Sort</th><th>Strategy</th><th>Signature virtue</th></tr>
<tr><td><b>Selection</b></td><td>find the minimum of the rest, swap it into place; repeat</td><td>fewest swaps (n−1) — good when writes are expensive</td></tr>
<tr><td><b>Insertion</b></td><td>take the next element, slide it left into the sorted prefix</td><td><b>O(n) on nearly-sorted input</b> — adaptive</td></tr>
<tr><td><b>Bubble</b></td><td>repeatedly swap adjacent out-of-order pairs</td><td>pedagogical fame; rarely the right choice</td></tr>
</table>
<pre class="code"><b>function</b> insertionSort(A):
    <b>for</b> i <b>from</b> 1 <b>to</b> n−1:
        key ← A[i];  j ← i − 1
        <b>while</b> j ≥ 0 <b>and</b> A[j] &gt; key:      <i>// slide larger elements right</i>
            A[j+1] ← A[j];  j ← j − 1
        A[j+1] ← key
    <i>// invariant: A[0..i] is sorted after iteration i</i></pre>
<p>All three are O(n²) worst case, <b>in place</b>, and fine below ~50 elements. Insertion sort is the family's star: its adaptivity on nearly-sorted data is why production sorts (Timsort, introsort) use it for small runs.</p>
<h3>Stability — the subtle property</h3>
<p>A sort is <b class="it">stable</b> if equal elements keep their original relative order. Sort people by name, then stably by city: within each city, names remain alphabetical — stable sorts <i>compose</i>. Insertion and bubble are stable; selection sort is not (its long-range swaps leapfrog equals). Stability will split the fast sorts in the next unit too.</p>
<div class="tip"><b>Binary search beyond arrays:</b> the pattern is "discard half of a monotonic space", not "look in an array" — it answers 'first version where the test fails' (git bisect), 'smallest capacity that ships in time', square roots to precision. If you can ask a yes/no question whose answer flips once across a range, you can binary search it. Level 4 returns to this.</div>
<h3>Going deeper: the full correctness argument</h3>
<p><b>Invariant:</b> if target is in A, it lies in A[lo..hi]. <i>Initialization:</i> lo = 0, hi = n−1 covers everything — trivially true. <i>Maintenance:</i> when A[mid] &lt; target, sortedness means everything at or before mid is also &lt; target, so shrinking to [mid+1..hi] discards only non-answers; symmetric for the other branch. <i>Termination:</i> each iteration strictly shrinks hi − lo (because mid is excluded from the new range — the +1/−1!), so the range must reach emptiness or a hit. Exit: if the loop ends with lo &gt; hi, the invariant says target was in an empty range — i.e., absent. Every notorious binary-search bug is a violation of exactly one clause: <code>lo &lt; hi</code> guards break termination-with-coverage (one-element ranges never checked); <code>hi ← mid</code> breaks strict shrinking (infinite loop); using it on unsorted data breaks maintenance. The invariant isn't commentary — it's a checklist that mechanically finds the bug.</p>
<h3>The more useful primitive: lower bound</h3>
<pre class="code"><b>function</b> lowerBound(A, target):     <i>// first index with A[i] ≥ target</i>
    lo ← 0;  hi ← n                  <i>// hi = n: "not found" position allowed</i>
    <b>while</b> lo &lt; hi:

        <b>if</b> A[mid] &lt; target: lo ← mid + 1

<h3>Why insertion sort is stable and selection sort is not</h3>
<p>Watch the mechanism, not the slogan. Insertion sort slides an element left only past elements <i>strictly greater</i> — equal elements are never crossed, so original order among equals survives: stable by construction. Selection sort swaps A[i] with the minimum found far to the right; that long-range swap can leapfrog an equal element. Concrete: sort [2ₐ, 2ᵦ, 1] — selection sort's first pass swaps 1 into front position past both 2s: [1, 2ᵦ, 2ₐ]. The subscripts flipped: unstable, demonstrated in three elements. A rescue exists — do insertion-style shifting instead of a swap — but that costs the "fewest writes" property, which was selection sort's only reason to exist. Properties trade against each other even inside one tiny algorithm.</p>

<h3>Merge sort — split blindly, merge cleverly</h3>
<pre class="code"><b>function</b> mergeSort(A):
    <b>if</b> length(A) ≤ 1: <b>return</b> A
    mid ← ⌊n/2⌋
    L ← mergeSort(A[0..mid−1]);  R ← mergeSort(A[mid..n−1])
    <b>return</b> merge(L, R)

<b>function</b> merge(L, R):           <i>// two sorted lists → one, O(n)</i>
    result ← empty;  i ← 0;  j ← 0
    <b>while</b> i &lt; length(L) <b>and</b> j &lt; length(R):
        <b>if</b> L[i] ≤ R[j]: append L[i]; i ← i+1     <i>// ≤ keeps it stable</i>
        <b>else</b>: append R[j]; j ← j+1
    append the leftovers of L and R
    <b>return</b> result</pre>
<p>All the intelligence is in <code>merge</code>: two sorted lists zip together in one linear pass. Halving gives log n levels; each level merges O(n) total → <b>O(n log n), guaranteed, on any input</b>. Stable. The price: <b>O(n) auxiliary memory</b> for the merging.</p>
<h3>Quicksort — split cleverly, combine for free</h3>
<pre class="code"><b>function</b> quickSort(A, lo, hi):
    <b>if</b> lo ≥ hi: <b>return</b>
    p ← partition(A, lo, hi)      <i>// pivot lands at its final index p</i>
    quickSort(A, lo, p−1)
    quickSort(A, p+1, hi)

<b>function</b> partition(A, lo, hi):   <i>// Lomuto scheme, pivot = A[hi]</i>
    pivot ← A[hi];  i ← lo
    <b>for</b> j <b>from</b> lo <b>to</b> hi−1:
        <b>if</b> A[j] ≤ pivot: swap A[i], A[j]; i ← i+1
    swap A[i], A[hi]
    <b>return</b> i</pre>
<p><b class="it">Partition</b> picks a <b class="it">pivot</b> and rearranges in place: smaller elements left, larger right, pivot at its final home — one O(n) pass. Then recurse on each side; no combine step at all. In place, cache-friendly, and on average the fastest comparison sort in practice — but <b>not stable</b>, and with a famous weakness.</p>
<h3>The pivot gamble</h3>
<p>Balanced splits → O(n log n). But if the pivot is always the extreme — e.g. last-element pivot fed <b>already-sorted input</b> — one side is empty, splits are n−1, n−2, … and the total is <b>O(n²)</b>. Defences: random pivots (adversarial cases become astronomically unlikely), median-of-three, or introsort's approach — detect deep recursion and switch to heapsort, capping the worst case at O(n log n).</p>
<h3>The n log n wall — and the way around it</h3>
<p>A comparison sort makes yes/no decisions; distinguishing all n! orderings needs log₂(n!) ≈ <b>n log n comparisons</b>. That's a proven floor for the whole comparison family — merge sort is asymptotically optimal. But sorts that <i>don't compare</i> can beat it: <b class="it">counting sort</b> tallies occurrences of small-range keys in O(n + k); radix sort digit-passes fixed-width keys in O(n·d). Sorting a million bytes? Count them, don't compare them.</p>
<div class="tip"><b>Two philosophies, one bill:</b> merge sort does its thinking on the way <i>up</i> (trivial split, smart merge); quicksort on the way <i>down</i> (smart split, trivial combine). Both n log n — choose by constraints: guaranteed time and stability → merge; in-place speed → quick; both at once is what Timsort and introsort engineer around.</div>
<h3>Going deeper: why random pivots really rescue quicksort</h3>
<p>The average-case claim deserves its argument. With a uniformly random pivot, the chance of a "good" split — pivot in the middle half of the values, leaving both sides ≤ 3n/4 — is exactly 1/2. Levels with good splits shrink the problem geometrically, so you need only O(log n) of them; bad-split levels merely waste O(n) work each without progress, and coin-flip arithmetic says you expect about as many bad levels as good — total expected depth O(log n), total expected work <b>O(n log n) for every input</b>, adversarial or not. The randomisation moved the probability from "over inputs" (where an adversary chooses) to "over coin flips" (where nobody can). Sorted input stops being a threat not because it's rare but because the pivot no longer cares what order you arrived in. This is the cheapest example of a deep idea — <b>randomised algorithms</b> convert worst cases into lottery tickets no one can buy.</p>
<h3>Duplicates, and the Dutch national flag</h3>
<p>Feed classic quicksort an array of a million equal keys: every partition is maximally lopsided (everything ≤ pivot), and you're at O(n²) again — randomisation can't save you because <i>every</i> pivot is the same value. The repair is <b>three-way partitioning</b> (Dijkstra's "Dutch national flag"): split into &lt; pivot | = pivot | &gt; pivot in one pass, then recurse only on the &lt; and &gt; regions — the equal block is finished forever.</p>
<pre class="code"><b>function</b> partition3(A, lo, hi):     <i>// returns (lt, gt)</i>
    p ← A[lo];  lt ← lo;  i ← lo;  gt ← hi
    <b>while</b> i ≤ gt:

        <b>else if</b> A[i] &gt; p: swap A[i], A[gt];  gt ← gt−1     <i>// i stays: new A[i] unseen</i>
        <b>else</b>: i ← i+1

<p>With heavy duplicates the equal block swallows most of the array and quicksort drops toward <b>O(n)</b> — it now adapts to the number of <i>distinct</i> values, not the number of elements. Real-world keys (statuses, categories, dates) are duplicate-heavy constantly; this is why serious quicksorts ship three-way or dual-pivot partitions.</p>
<h3>Quickselect: the sort you don't finish</h3>
<p>Want the median, or the k-th smallest — not the whole ordering? Partition once, then recurse into <b>only the side containing k</b>:</p>
<pre class="code"><b>function</b> quickselect(A, lo, hi, k):
    p ← partition(A, lo, hi)
    <b>if</b> k = p: <b>return</b> A[k]
    <b>if</b> k &lt; p: <b>return</b> quickselect(A, lo, p−1, k)
    <b>return</b> quickselect(A, p+1, hi, k)</pre>
<p>One side instead of two changes the arithmetic from n + n + n… (log n times) to n + n/2 + n/4 + … = <b>expected O(n)</b>. The k-th element of a billion numbers, in linear expected time, in place — the single most useful "partial sorting" tool, and the honest answer to many problems people reflexively full-sort for. (Its guaranteed-O(n) cousin, median-of-medians, exists mostly as a beautiful proof; the randomised version is what runs.)</p>
<h3>Counting sort in full, and why radix needs stability</h3>
<pre class="code"><b>function</b> countingSort(A, k):        <i>// keys in 0..k−1; stable; O(n + k)</i>
    count ← array of k zeros

    <b>for</b> i <b>from</b> 1 <b>to</b> k−1:            <i>// prefix sums → ending positions</i>

<h3>The strategy</h3>
<p>A <b class="it">greedy algorithm</b> builds a solution one step at a time, always taking the <b>locally best</b> option, never reconsidering. No backtracking, no look-ahead — which makes greedy algorithms simple and fast. The entire question is: <i>does local best reach global best?</i> Sometimes provably yes; often provably no. Greedy is a hypothesis, not a default.</p>
<h3>A triumph: interval scheduling</h3>
<p>Given talks with start/end times, attend the maximum number of non-overlapping talks. Greedy by <b>earliest end time</b>:</p>
<pre class="code"><b>function</b> maxTalks(talks):
    sort talks by end time
    count ← 0;  free ← −∞
    <b>for</b> t <b>in</b> talks:
        <b>if</b> t.start ≥ free:      <i>// compatible with what we've chosen</i>
            count ← count + 1;  free ← t.end
    <b>return</b> count</pre>
<p>Why it's optimal — the <b class="it">exchange argument</b>: whatever an optimal schedule picks first, swapping it for the earliest-ending talk can't hurt (it frees the room no later, so everything after still fits). Induct down the line: greedy matches optimal, talk for talk. Note the seductive wrong greedies: shortest talk first — fails; earliest <i>start</i> first — fails. Same instinct, different criterion, opposite result: <b>the proof, not the vibe, does the work</b>.</p>
<h3>A famous failure: coin change</h3>
<p>Make 63 with coins {25, 10, 5, 1} greedily: 25+25+10+1+1+1 — six coins, optimal. Now coins {25, 10, 1}, amount 30: greedy takes 25+1+1+1+1+1 — six coins. Optimal is 10+10+10 — three. Standard currency systems are engineered so greedy works; arbitrary ones break it. When greedy fails, the fix is usually dynamic programming (next unit), which considers what greedy refuses to.</p>
<h3>Greedy's greatest hits</h3>
<table class="gr">

<div class="tip"><b>How to trust a greedy:</b> (1) find an exchange argument — any optimal solution can be morphed, swap by swap, into greedy's without loss; or (2) find a counterexample and reach for DP. Do one or the other <i>before</i> shipping: greedy code is so short that its correctness looks self-evident. It isn't.</div>
<h3>Going deeper: the exchange argument, written out once in full</h3>
<p>Theorem: earliest-end-time greedy attends the maximum possible number of talks. Proof. Let G = g₁, g₂, …, g_k be greedy's talks in order, and let OPT = o₁, o₂, …, o_m be any optimal schedule, both sorted by time. First, a lemma — <b>"greedy stays ahead"</b>: for every i, end(g_i) ≤ end(o_i). Induction: g₁ has the earliest end time of all talks, so end(g₁) ≤ end(o₁). Assume end(g_i) ≤ end(o_i). Talk o_{i+1} starts after end(o_i) ≥ end(g_i), so o_{i+1} was <i>available</i> to greedy when it chose g_{i+1} — and greedy chose the earliest-ending available talk, so end(g_{i+1}) ≤ end(o_{i+1}). Lemma proved. Now suppose OPT has more talks: m &gt; k. Then o_{k+1} starts after end(o_k) ≥ end(g_k) — meaning o_{k+1} was available to greedy after its last pick, and greedy, which only stops when nothing is compatible, would have taken it. Contradiction; so k = m. ∎ Read the proof's skeleton once more — <i>greedy's prefix is never behind; therefore greedy never runs out first</i> — because that skeleton, with "ends earlier" swapped for the appropriate measure, proves half the correct greedies in existence.</p>
<h3>Fractional vs 0/1: the knapsack boundary, precisely</h3>
<p>Why does value/weight-ratio greedy provably work for <b>fractional</b> knapsack (you may take part of an item) yet fail for 0/1? The fractional exchange argument: if an optimal solution carries any amount of a lower-ratio item while some higher-ratio item is not fully taken, swap a sliver of the former for an equal weight of the latter — value strictly rises, contradiction; so optimal = greedy. The argument needs <i>slivers</i>: continuous exchange in arbitrarily small amounts. 0/1 knapsack forbids slivers — items are lumpy — and lumpy exchanges can overshoot the capacity, so the swap step dies. Concrete failure: capacity 10, items A(weight 10, value 60, ratio 6) and two of B(weight 5, value 35, ratio 7). Greedy-by-ratio takes both Bs? — that's 70, fine — now make it capacity 10, A(10, 60) vs B(6, 40) + C(5, 33): ratios favour B (6.67) then nothing fits; greedy gets 40, optimal is A's 60. One blocked sliver, one broken theorem. The moral is sharp: <b>a greedy proof is a property of the problem's exchange structure</b>, and tiny changes to the rules (fractional → integral) flip the verdict. Mathematicians have mapped exactly when greedy is safe — matroid theory — but the working engineer's version is: find the exchange, or find the counterexample.</p>
<h3>Huffman, end to end</h3>
<p>Frequencies: A:45, B:13, C:12, D:16, E:9, F:5. Repeatedly merge the two rarest into a node weighing their sum:</p>
<pre class="code">merge F(5)+E(9) → FE(14)          <i>// pool: A45 B13 C12 D16 FE14</i>
merge C(12)+B(13) → CB(25)        <i>// pool: A45 D16 FE14 CB25</i>
merge FE(14)+D(16) → FED(30)      <i>// pool: A45 CB25 FED30</i>
merge CB(25)+FED(30) → CBFED(55)  <i>// pool: A45 CBFED55</i>
merge A(45)+CBFED(55) → root(100)</pre>
<p>Read codes off the tree (left = 0, right = 1): A gets a 1-bit code; B, C 3 bits; D 3; E, F 4. Weighted average ≈ 2.24 bits/symbol vs 3 bits for fixed-width — a 25% compression from a five-line greedy. Why it's optimal (proof sketch, exchange again): in <i>some</i> optimal tree the two rarest symbols are siblings at maximum depth — if not, swap whatever is down there with a rarer symbol and the average can only improve — and once they're merged, the problem recurses on a smaller alphabet. Priority queue in the pool: heaps (Level 2) making yet another algorithm go. Huffman closes the loop on this unit's thesis: the same greedy instinct that loses coin change wins compression — and only the proof knows the difference in advance.</p>`,

<h3>The two fingerprints</h3>
<p><b class="it">Dynamic programming (DP)</b> applies when a problem has: <b class="it">overlapping subproblems</b> — the naive recursion solves the same instances again and again — and <b class="it">optimal substructure</b> — an optimal answer is composed of optimal answers to subproblems. Fibonacci showed the disease (Level 1: O(2ⁿ) of repeats); DP is the cure: <b>solve each subproblem once, remember it</b>.</p>
<h3>Two mechanical styles, one idea</h3>
<table class="gr">
<tr><th>Style</th><th>How</th><th>Character</th></tr>
<tr><td><b>Memoization</b> (top-down)</td><td>write the recursion; cache each result on first computation</td><td>closest to the math; touches only needed subproblems</td></tr>
<tr><td><b>Tabulation</b> (bottom-up)</td><td>fill a table from base cases upward with a loop</td><td>no recursion depth; often less memory, easily optimised</td></tr>
</table>
<pre class="code"><b>function</b> fib(n):                 <i>// tabulation: O(n) time</i>
    dp[0] ← 0;  dp[1] ← 1
    <b>for</b> i <b>from</b> 2 <b>to</b> n:
        dp[i] ← dp[i−1] + dp[i−2]
    <b>return</b> dp[n]                 <i>// (two variables suffice: O(1) space)</i></pre>
<h3>The craft: define the state</h3>
<p>Every DP is designed by answering four questions: <b>(1)</b> What does <code>dp[state]</code> <i>mean</i>, in one precise sentence? <b>(2)</b> What is the <b class="it">recurrence</b> — how does a state combine smaller ones? <b>(3)</b> What are the base cases? <b>(4)</b> Where does the final answer sit? Get sentence (1) right and the rest usually writes itself.</p>
<p>Worked example — <b class="it">0/1 knapsack</b>: items with weight and value, capacity W, take or leave each item, maximise value. State: <code>dp[i][w]</code> = <i>best value using the first i items within capacity w</i>. Each item is either skipped or (if it fits) taken:</p>
<pre class="code">dp[i][w] ← dp[i−1][w]                                <i>// skip item i</i>
<b>if</b> weight[i] ≤ w:
    dp[i][w] ← max(dp[i][w],
                   dp[i−1][w − weight[i]] + value[i])  <i>// take item i</i></pre>
<p>Table size n×W, O(1) per cell: <b>O(nW)</b> — where greedy-by-ratio provably fails, a table of remembered decisions succeeds. The same skeleton solves edit distance (spell-check), longest common subsequence (diff), coin change (properly), grid paths, scheduling with penalties…</p>
<h3>Reading the cost</h3>
<p>DP complexity = <b>(number of states) × (work per state)</b>. Fibonacci: n states × O(1) = O(n). Knapsack: nW states × O(1) = O(nW). Edit distance on strings of length m, n: mn states × O(1) = O(mn). Counting states is the whole analysis.</p>
<div class="tip"><b>DP is not magic — it's bookkeeping:</b> the naive recursion already contains the answer; it just wastes exponential effort re-deriving known results. A cache (memoization) or a table (tabulation) converts the recursion tree into a DAG of distinct subproblems, each solved once. If you can draw the recursion and spot repeated nodes, you can DP it.</div>
<h3>Going deeper: edit distance, worked to the last cell</h3>
<p>State: dp[i][j] = minimum operations (insert, delete, replace) turning the first i letters of source into the first j letters of target. Bases: dp[i][0] = i (delete everything), dp[0][j] = j (insert everything). Recurrence — enumerate the last operation:</p>
<pre class="code"><b>if</b> source[i] = target[j]:
    dp[i][j] ← dp[i−1][j−1]                  <i>// free: letters already match</i>
<b>else</b>:
    dp[i][j] ← 1 + min(dp[i−1][j],           <i>// delete source's last</i>
                       dp[i][j−1],           <i>// insert target's last</i>
                       dp[i−1][j−1])         <i>// replace</i></pre>
<p>Full table for "cat" → "cut" (rows: "", c, a, t; columns: "", c, u, t):</p>
<table class="gr">
<tr><th></th><th>""</th><th>c</th><th>u</th><th>t</th></tr>
<tr><th>""</th><td>0</td><td>1</td><td>2</td><td>3</td></tr>
<tr><th>c</th><td>1</td><td><b>0</b></td><td>1</td><td>2</td></tr>
<tr><th>a</th><td>2</td><td>1</td><td><b>1</b></td><td>2</td></tr>
<tr><th>t</th><td>3</td><td>2</td><td>2</td><td><b>1</b></td></tr>
</table>
<p>Answer: dp[3][3] = 1 — replace 'a' with 'u', as you'd hope. Trace one interesting cell to make it real: dp[2][2] (turn "ca" into "cu"): 'a' ≠ 'u', so 1 + min(dp[1][2]=1, dp[2][1]=1, dp[1][1]=0) = 1 — the diagonal (replace) wins. O(mn) time; and since each row needs only the previous row, O(min(m,n)) space after the standard optimisation. This one table underlies spell-check suggestions, DNA alignment (with weighted operations), and fuzzy search.</p>
<h3>Getting the answer AND the plan: reconstruction</h3>
<p>dp tables natively answer "how good?"; real uses usually need "which choices?". Two standard mechanics: store a <b>parent pointer</b> per cell (which of the three predecessors won), then walk backwards from dp[m][n] to dp[0][0], emitting operations in reverse — O(m+n) extra walk. Or store nothing and <b>re-derive</b> at walk time: at each cell, recompute which predecessor achieves the stored value and step there — same walk, no extra memory, a few recomputed mins. The same two options apply to knapsack ("which items?"), coin change ("which coins?"), LCS ("which characters?" — that's the diff tool's actual output). A DP without reconstruction is usually half the deliverable.</p>
<h3>A second full design: longest increasing subsequence</h3>
<p>Problem: longest strictly-increasing subsequence (not necessarily contiguous) of A — the canonical "state definition is everything" example. Attempt 1: dp[i] = LIS of A[0..i]... but knowing that length doesn't tell you whether A[i+1] can extend it. The fix — strengthen the state: <b>dp[i] = length of the longest increasing subsequence <i>ending exactly at</i> A[i]</b>. Now dp[i] = 1 + max(dp[j]) over all j &lt; i with A[j] &lt; A[i], answer = max over all i; O(n²). Trace on [3, 1, 4, 1, 5, 9, 2, 6]: dp = [1, 1, 2, 1, 3, 4, 2, 4] — answer 4 (e.g. 1,4,5,9 or 1,4,5,6). The general lesson is the strengthening move itself: when the natural state won't compose, <i>pin the state to a concrete anchor</i> ("ending here", "using item i", "with j capacity left") until the recurrence clicks. (An elegant O(n log n) upgrade exists — maintain the smallest possible tail for each length, binary-searching where each element lands — the patience-sorting trick; worth looking up once the O(n²) version is second nature.)</p>
<h3>When DP does NOT apply</h3>
<p>DP's second fingerprint — optimal substructure — genuinely fails sometimes, and knowing the failure mode inoculates against forced DP. Longest <i>simple</i> path in a general graph (no vertex reuse): a longest path from A to C through B does <b>not</b> decompose into longest A→B plus longest B→C — those two sub-paths may share vertices, and the "used vertices" set would have to become part of the state, exploding it to 2ⁿ. That explosion is the tell: when the state needed to make subproblems independent grows exponentially, DP hasn't failed you — the problem is genuinely hard (this one is NP-hard). Contrast <i>shortest</i> paths, which decompose perfectly (any prefix of a shortest path is a shortest path — that's why Dijkstra and Bellman-Ford exist). Same graph, one word changed, opposite complexity worlds: decomposability is a property theorems live on, not a vibe.</p>`,

<h3>Shortest paths with weights: Dijkstra</h3>
<p>BFS finds fewest-<i>edges</i> paths; with weighted edges (kilometres, milliseconds, rupees) you need <b class="it">Dijkstra's algorithm</b>: keep tentative distances, repeatedly <b>finalise the closest unvisited vertex</b> (greedy!), and <b class="it">relax</b> its outgoing edges — improve any neighbour's tentative distance that this route beats.</p>
<pre class="code"><b>function</b> dijkstra(G, s):
    dist[v] ← ∞ for all v;  dist[s] ← 0
    PQ ← min-priority-queue of (dist, vertex)
    <b>while</b> PQ not empty:
        u ← extract-min(PQ)                 <i>// closest unvisited: finalised</i>
        <b>for</b> edge (u, v, w) <b>in</b> G:
            <b>if</b> dist[u] + w &lt; dist[v]:       <i>// relaxation</i>
                dist[v] ← dist[u] + w;  update v in PQ</pre>
<p>With a binary heap (Level 2!): <b>O((V + E) log V)</b>. Why is finalising the closest vertex safe? Any other route to it would leave through a vertex that is <i>already farther</i> — with non-negative weights, detours can't help. That caveat is real: one <b>negative edge</b> breaks the proof (Bellman-Ford handles those, slower). This runs your map navigation and internet route computation (OSPF).</p>
<h3>Ordering dependencies: topological sort</h3>
<p>A <b>DAG</b> of prerequisites (courses, build targets, spreadsheet cells) has a <b class="it">topological order</b>: every edge points forward. Kahn's algorithm peels vertices with no remaining prerequisites:</p>
<pre class="code"><b>function</b> topoSort(G):
    indegree[v] ← number of incoming edges, for all v
    Q ← all vertices with indegree 0
    order ← empty
    <b>while</b> Q not empty:
        u ← Q.dequeue();  append u to order
        <b>for</b> v <b>in</b> G.neighbours(u):
            indegree[v] ← indegree[v] − 1
            <b>if</b> indegree[v] = 0: Q.enqueue(v)
    <b>if</b> length(order) &lt; V: <b>return</b> "cycle detected"      <i>// no valid order exists</i>
    <b>return</b> order</pre>
<p>O(V + E) — and it doubles as a cycle detector: leftover vertices mean circular dependencies. This is how build systems, package managers and spreadsheets decide what to compute first.</p>
<h3>Connecting everything cheaply: minimum spanning trees</h3>
<p>Connect all vertices with minimum total edge weight — cabling campuses, laying fibre, clustering data. Two greedy classics, both provably optimal via the <b>cut property</b> (the cheapest edge crossing any cut is always safe): <b class="it">Kruskal's</b> — sort edges cheapest-first, take each unless it forms a cycle (detected by a <b class="it">union-find</b> structure); <b class="it">Prim's</b> — grow one tree from a seed, always adding the cheapest edge leaving it (a heap again). Both O(E log E)-ish. An MST has exactly V−1 edges — the minimal skeleton of connectivity.</p>
<div class="tip"><b>The toolbox composes:</b> Dijkstra = BFS's skeleton + a heap + relaxation. Kahn = a queue + in-degree counting. Kruskal = sorting + union-find. Level 3's algorithms are Level 2's structures, assembled. That's the deepest pattern in this course: new algorithms are mostly old structures in new harness.</div>

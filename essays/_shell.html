<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESC}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)">
  <title>{{TITLE}}</title>
  <link rel="canonical" href="{{CANON}}">
  <link rel="alternate" type="application/rss+xml" title="Essays – Curiosities" href="https://naniwadekar.com/essays/feed.xml">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../curiosities-icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../curiosities-icon-180.png">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESC}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{CANON}}">
  <meta property="og:site_name" content="Curiosities">
  <meta name="twitter:card" content="summary">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("root-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="top">
      <nav><a href="https://naniwadekar.com/">Curiosities</a><a href="index.html">Essays</a><a href="feed.xml">RSS</a></nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">Dark</button>
    </header>
    <main>
{{BODY}}
    </main>
    <footer class="bottom"><span class="foot-line">Part of <a href="https://naniwadekar.com/">Curiosities</a>. A non-commercial study collection.</span> <span class="foot-line">Errors may be pointed out by writing to <a class="mail" href="#" data-u="mihir" data-d="naniwadekar.in">mihir [at] naniwadekar [dot] in</a>.</span></footer>
<script>(function(){var l=document.querySelectorAll("a.mail");for(var i=0;i<l.length;i++){var a=l[i],m=a.getAttribute("data-u")+"@"+a.getAttribute("data-d");a.href="mailto:"+m;a.textContent=m;}})();</script>
  </div>
  <script>
    (function () {
      var b = document.getElementById("theme-toggle");
      function u() { var d = document.documentElement.dataset.theme === "dark"; b.textContent = d ? "Light" : "Dark"; b.setAttribute("aria-label", d ? "Switch to light theme" : "Switch to dark theme"); }
      b.addEventListener("click", function () {
        var n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = n; try { localStorage.setItem("root-theme", n); } catch (e) {} u();
      });
      u();
    })();
  </script>
</body>
</html>

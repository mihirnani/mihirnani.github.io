ion—a human being carrying about his mortality and the testimony of his sin.","gloss":{"magnus es":"great are you","Domine":"Lord (voc.)","laudabilis valde":"greatly worthy of praise","virtus":"power / excellence","sapientiae tuae":"of your wisdom","non est numerus":"there is no number","laudare te":"to praise you","aliqua portio":"some portion","creaturae tuae":"of your creation","circumferens":"carrying around","mortalitatem":"mortality","testimonium":"testimony"},"notes":["The opening balances parallel clauses around repeated <b>magnus/magna</b>.","<b>laudare te vult homo</b> places the infinitive phrase first for emphasis.","The present participle <b>circumferens</b> agrees with <b>homo</b>."],"source":"https://la.wikisource.org/wiki/Confessiones_(Augustinus)/Liber_I","license":"The ancient/late-antique text is public domain. Translation and notes are original.","macron":""},{"id":"r10","title":"Judgment by peers","author":"Magna Carta","work":"Clause 39 (1215)","level":"Intermediate","kind":"Medieval legal Latin","text":"Nullus liber homo capiatur vel imprisonetur aut disseisiatur aut utlagetur aut exuletur aut aliquo modo destruatur, nec super eum ibimus nec super eum mittemus, nisi per legale iudicium parium suorum vel per legem terrae.","translation":"No free man shall be seized or imprisoned, dispossessed, outlawed, exiled or in any way destroyed; nor shall we proceed against him or send against him, except by the lawful judgment of his peers or by the law of the land.","gloss":{"nullus liber homo":"no free man","capiatur":"shall be seized","imprisonetur":"shall be imprisoned","disseisiatur":"shall be dispossessed","utlagetur":"shall be outlawed","exuletur":"shall be exiled","destruatur":"shall be destroyed","super eum ibimus":"we shall proceed against him","nisi":"unless / except","legale iudicium":"lawful judgment","parium suorum":"of his peers","lex terrae":"law of the land"},"notes":["The repeated present subjunctives have prescriptive force.","Several terms are medieval Latinisations of legal vocabulary rather than classical usage.","<b>nisi</b> introduces the limiting exception."],"source":"https://la.wikisource.org/wiki/Magna_Carta","license":"The medieval text is public domain. Translation and notes are original.","macron":""},{"id":"r11","title":"Quantity of matter","author":"Isaac Newton","work":"Principia, Definition I","level":"Advanced prose","kind":"Neo-Latin science","text":"Quantitas materiae est mensura eiusdem orta ex illius densitate et magnitudine conjunctim.","translation":"The quantity of matter is a measure of the same arising jointly from its density and magnitude.","gloss":{"quantitas materiae":"quantity of matter","mensura":"measure","eiusdem":"of the same","orta":"arising","illius":"of it / its","densitate":"density","magnitudine":"magnitude / volume","conjunctim":"jointly"},"notes":["<b>orta</b> is a perfect participle agreeing with <b>mensura</b>, but with active sense because <b>orior</b> is deponent.","Newton’s <b>magnitudo</b> here refers to bulk or volume.","Scientific Neo-Latin often uses compact nominal definitions."],"source":"https://la.wikisource.org/wiki/Philosophiae_Naturalis_Principia_Mathematica/Definitiones","license":"Newton’s 1687 Latin text is public domain. Translation and notes are original.","macron":""}];
const REFS=[{"title":"Case functions at a glance","body":"<table class=\"gr\"><tr><th>Case</th><th>Core function</th><th>Example</th></tr>\n<tr><td>Nominative</td><td>subject / predicate</td><td><b>Caesar</b> dux est.</td></tr>\n<tr><td>Accusative</td><td>direct object; motion toward</td><td>urbem videt; Rōmam venit</td></tr>\n<tr><td>Genitive</td><td>possession / description</td><td>liber <b>Caesaris</b></td></tr>\n<tr><td>Dative</td><td>indirect object; reference; agent with gerundive</td><td>puellae dat; mihi faciendum est</td></tr>\n<tr><td>Ablative</td><td>means, manner, separation, circumstance</td><td>gladiō; cum amīcō; ab urbe</td></tr>\n<tr><td>Vocative</td><td>direct address</td><td>Salvē, Marce!</td></tr></table>"},{"title":"Personal endings","body":"<table class=\"gr\"><tr><th>Person</th><th>Active</th><th>Passive</th></tr>\n<tr><td>1 sg.</td><td>-ō / -m</td><td>-r</td></tr><tr><td>2 sg.</td><td>-s</td><td>-ris</td></tr>\n<tr><td>3 sg.</td><td>-t</td><td>-tur</td></tr><tr><td>1 pl.</td><td>-mus</td><td>-mur</td></tr>\n<tr><td>2 pl.</td><td>-tis</td><td>-minī</td></tr><tr><td>3 pl.</td><td>-nt</td><td>-ntur</td></tr></table>"},{"title":"Principal parts and stems","body":"<p>Learn verbs in four principal parts: <b>scrībō, scrībere, scrīpsī, scrīptum</b>.</p>\n<table class=\"gr\"><tr><th>Part</th><th>Supplies</th></tr><tr><td>1st: scrībō</td><td>present 1st singular and dictionary headword</td></tr>\n<tr><td>2nd: scrībere</td><td>present stem and conjugation</td></tr><tr><td>3rd: scrīpsī</td><td>perfect active stem</td></tr>\n<tr><td>4th: scrīptum</td><td>perfect passive participle and future active participle</td></tr></table>"},{"title":"Subjunctive sequence","body":"<table class=\"gr\"><tr><th>Main verb</th><th>Same/later time</th><th>Prior time</th></tr>\n<tr><td>Primary</td><td>present subjunctive</td><td>perfect subjunctive</td></tr>\n<tr><td>Historic</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table>\n<p>This is a default framework, not an iron rule. Authorial viewpoint, repraesentātiō and the independence of a clause can affect sequence.</p>"},{"title":"Reading a periodic sentence","body":"<ol><li>Circle finite verbs.</li><li>Bracket clauses introduced by relative pronouns, conjunctions and interrogatives.</li><li>Identify nominatives and accusatives from morphology.</li><li>Attach adjectives, genitives and participles to their heads.</li><li>Resolve the main clause before polishing the translation.</li></ol>"},{"title":"Classical pronunciation","body":"<table class=\"gr\"><tr><th>Spelling</th><th>Value</th></tr><tr><td>c</td><td>always hard</td></tr>\n<tr><td>g</td><td>always hard</td></tr><tr><td>v</td><td>approximately English w</td></tr>\n<tr><td>ae / oe</td><td>diphthongs</td></tr><tr><td>qu</td><td>kw</td></tr><tr><td>ti</td><td>not “sh” in restored Classical pronunciation</td></tr></table>"}];
const PARADIGMS=[{"id":"puella","name":"puella, puellae — first declension","headers":["Case","Singular","Plural"],"rows":[["Nom.","puella","puellae"],["Gen.","puellae","puellārum"],["Dat.","puellae","puellīs"],["Acc.","puellam","puellās"],["Abl.","puellā","puellīs"],["Voc.","puella","puellae"]]},{"id":"servus","name":"servus, servī — second declension masculine","headers":["Case","Singular","Plural"],"rows":[["Nom.","servus","servī"],["Gen.","servī","servōrum"],["Dat.","servō","servīs"],["Acc.","servum","servōs"],["Abl.","servō","servīs"],["Voc.","serve","servī"]]},{"id":"bellum","name":"bellum, bellī — second declension neuter","headers":["Case","Singular","Plural"],"rows":[["Nom.","bellum","bella"],["Gen.","bellī","bellōrum"],["Dat.","bellō","bellīs"],["Acc.","bellum","bella"],["Abl.","bellō","bellīs"],["Voc.","bellum","bella"]]},{"id":"rex","name":"rēx, rēgis — third declension masculine","headers":["Case","Singular","Plural"],"rows":[["Nom.","rēx","rēgēs"],["Gen.","rēgis","rēgum"],["Dat.","rēgī","rēgibus"],["Acc.","rēgem","rēgēs"],["Abl.","rēge","rēgibus"],["Voc.","rēx","rēgēs"]]},{"id":"nomen","name":"nōmen, nōminis — third declension neuter","headers":["Case","Singular","Plural"],"rows":[["Nom.","nōmen","nōmina"],["Gen.","nōminis","nōminum"],["Dat.","nōminī","nōminibus"],["Acc.","nōmen","nōmina"],["Abl.","nōmine","nōminibus"],["Voc.","nōmen","nōmina"]]},{"id":"qui","name":"quī, quae, quod — relative pronoun singular","headers":["Case","Masculine","Feminine","Neuter"],"rows":[["Nom.","quī","quae","quod"],["Gen.","cuius","cuius","cuius"],["Dat.","cui","cui","cui"],["Acc.","quem","quam","quod"],["Abl.","quō","quā","quō"]]},{"id":"amo","name":"amō — present system active","headers":["Person","Present","Imperfect","Future"],"rows":[["1 sg.","amō","amābam","amābō"],["2 sg.","amās","amābās","amābis"],["3 sg.","amat","amābat","amābit"],["1 pl.","amāmus","amābāmus","amābimus"],["2 pl.","amātis","amābātis","amābitis"],["3 pl.","amant","amābant","amābunt"]]},{"id":"rego","name":"regō — present system active","headers":["Person","Present","Imperfect","Future"],"rows":[["1 sg.","regō","regēbam","regam"],["2 sg.","regis","regēbās","regēs"],["3 sg.","regit","regēbat","reget"],["1 pl.","regimus","regēbāmus","regēmus"],["2 pl.","regitis","regēbātis","regētis"],["3 pl.","regunt","regēbant","regent"]]},{"id":"sum","name":"sum — indicative","headers":["Person","Present","Imperfect","Future"],"rows":[["1 sg.","sum","eram","erō"],["2 sg.","es","erās","eris"],["3 sg.","est","erat","erit"],["1 pl.","sumus","erāmus","erimus"],["2 pl.","estis","erātis","eritis"],["3 pl.","sunt","erant","erunt"]]}];
const KEY="lingua-latina-progress-v1";
const defaults={completed:{},scores:{},readingDone:{},cards:{},extraCards:{},settings:{theme:"system",macrons:true,direction:"mix"},activity:[]};
const store={data:null,memOnly:false,load(){try{this.data=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||"{}"));this.data.settings=Object.assign({},defaults.settings,this.data.settings||{});["completed","scores","readingDone","cards","extraCards"].forEach(k=>this.data[k]=this.data[k]||{});this.data.activity=this.data.activity||[]}catch(e){this.data=JSON.parse(JSON.stringify(defaults));this.memOnly=true}},save(){try{localStorage.setItem(KEY,JSON.stringify(this.data))}catch(e){this.memOnly=true}}};store.load();
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function stripMacrons(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC")}
function norm(s){return stripMacrons(String(s).toLowerCase()).replace(/[.,;:!?“”"'’—–()\[\]]/g,"").replace(/\s+/g," ").trim()}
function route(){return location.hash.replace(/^#\/?/,"")||"home"}function go(r){location.hash="#/"+r}
function allUnits(){return COURSE.flatMap(l=>l.units.map(u=>({...u,level:l})))}function unit(id){return allUnits().find(u=>u.id===id)}function reading(id){return READINGS.find(r=>r.id===id)}
function applyTheme(){let t=store.data.settings.theme;if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}
function doneLevel(l){return l.units.filter(u=>store.data.completed[u.id]).length}
function nav(path,ic,label,badge=""){let a=route().split("/")[0],p=path.split("/")[0];return `<button class="navlink ${a===p?"active":""}" onclick="go('${path}')"><span class="ic">${ic}</span>${label}${badge?`<span class="badge">${badge}</span>`:""}</button>`}
function renderSidebar(){let done=Object.keys(store.data.completed).length;$("#sidebar").innerHTML=`<div class="brand"><span class="seal">L</span><div><b>Lingua Latina</b><small>Grammar → original texts</small></div></div><div class="navsec">Course</div>${nav("home","⌂","Dashboard")}${COURSE.map(l=>nav("level/"+l.id,l.icon,l.short+" · "+l.tagline,doneLevel(l)+"/"+l.units.length)).join("")}<div class="navsec">Read</div>${nav("readings","▤","Reading Room",Object.keys(store.data.readingDone).length+"/"+READINGS.length)}<div class="navsec">Practice</div>${nav("flash","◫","Flashcards",dueCards().length+" due")}${nav("reference","R","Grammar reference")}${nav("lab","▦","Morphology tables")}<div class="navsec">Data</div>${nav("settings","⚙","Settings",done+"/"+allUnits().length)}`}
function render(){applyTheme();renderSidebar();let p=route().split("/"),out="";if(p[0]==="home")out=viewHome();else if(p[0]==="level")out=viewLevel(p[1]);else if(p[0]==="unit")out=viewUnit(p[1],p[2]||"lesson");else if(p[0]==="quiz")out=viewQuiz(p[1]);else if(p[0]==="readings")out=viewReadings();else if(p[0]==="read")out=viewReading(p[1]);else if(p[0]==="flash")out=viewFlash();else if(p[0]==="flashrun"){startFlash();return}else if(p[0]==="reference")out=viewReference();else if(p[0]==="lab")out=viewLab();else if(p[0]==="settings")out=viewSettings();else out=viewHome();$("#main").innerHTML=(store.memOnly?`<div class="banner">Browser storage is unavailable. Export progress before closing.</div>`:"")+out;$("#main").focus({preventScroll:true})}
function activity(type,id){store.data.activity.unshift({type,id,at:Date.now()});store.data.activity=store.data.activity.slice(0,30)}
function viewHome(){let units=allUnits(),done=Object.keys(store.data.completed).length,rd=Object.keys(store.data.readingDone).length,cards=allCards().length;return `<h1>Lingua Latina</h1><p class="sub">A structured path from first principles to increasingly independent reading of Latin prose and poetry.</p><div class="stats"><div class="stat"><b>${done}/${units.length}</b><small>course units complete</small></div><div class="stat"><b>${rd}/${READINGS.length}</b><small>readings completed</small></div><div class="stat"><b>${cards}</b><small>vocabulary cards</small></div><div class="stat"><b>${dueCards().length}</b><small>reviews due</small></div></div><div class="card"><h2 style="margin-top:0">Method</h2><p>Learn the forms, practise the construction, then encounter it in a text. In the Reading Room, begin unaided and reveal glosses, grammatical notes and translation only as needed.</p><button class="btn primary" onclick="go('${done?nextUnitRoute():"level/found"}')">${done?"Continue course":"Begin Stage I"}</button> <button class="btn" onclick="go('readings')">Open Reading Room</button></div><h2>Course</h2>${COURSE.map(l=>`<div class="card levelcard" onclick="go('level/${l.id}')"><div class="leveltop"><b>${l.icon} ${l.label}</b><span>${l.tagline}</span><span class="pct">${doneLevel(l)}/${l.units.length}</span></div><p>${l.desc}</p><div class="progress"><i style="width:${100*doneLevel(l)/l.units.length}%"></i></div></div>`).join("")}<h2>Open readings</h2><div class="card"><p>The library includes controlled Latin written for the course and curated public-domain or openly reusable passages from Caesar, Nepos, Cicero, Catullus, Ovid, Vergil, Horace, Augustine, Magna Carta, the Vulgate and Newton.</p><p class="source">Ancient and historical texts are public domain. Digital transcriptions derived from Perseus/Open Greek and Latin are identified in each reading and retain their stated ShareAlike attribution. English translations and learning notes here are original.</p></div>`}
function nextUnitRoute(){let u=allUnits().find(x=>!store.data.completed[x.id]);return u?"unit/"+u.id+"/lesson":"readings"}
function viewLevel(id){let l=COURSE.find(x=>x.id===id);if(!l)return viewHome();return `<h1>${l.label}</h1><p class="sub">${l.desc}</p>${l.units.map((u,i)=>`<div class="unitrow ${store.data.completed[u.id]?"done":""}" onclick="go('unit/${u.id}/lesson')"><span class="num">${store.data.completed[u.id]?"✓":i+1}</span><span class="t"><b>${u.title}</b><small>${u.subtitle}</small></span><span class="pill">${store.data.scores[u.id]!=null?store.data.scores[u.id]+"%":"unit"}</span></div>`).join("")}`}
function tabs(u,tab){return `<div class="tabs">${["lesson","examples","vocabulary","practice"].map(x=>`<button class="tab ${tab===x?"active":""}" onclick="go('unit/${u.id}/${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>`}
function viewUnit(id,tab){let u=unit(id);if(!u)return viewHome();let body="";if(tab==="lesson")body=`<div class="card grammar">${u.grammar}</div><button class="btn primary" onclick="go('unit/${u.id}/examples')">Continue to examples</button>`;if(tab==="examples")body=`<div class="card">${u.examples.map(e=>`<div class="example"><span class="la">${e[0]}</span><span class="en">${e[1]}</span></div>`).join("")}</div><button class="btn primary" onclick="go('unit/${u.id}/vocabulary')">Study vocabulary</button>`;if(tab==="vocabulary")body=`<div class="card vocab">${u.vocab.map(v=>`<div><b>${v[0]}</b><br><span>${v[1]}</span></div>`).join("")}</div><button class="btn primary" onclick="go('unit/${u.id}/practice')">Practise this unit</button>`;if(tab==="practice")body=`<div class="card"><h2 style="margin-top:0">Unit practice</h2><p>${u.exercises.length} questions. A score of 75% marks the unit complete.</p><button class="btn primary" onclick="go('quiz/${u.id}')">Start practice</button> ${store.data.scores[u.id]!=null?`<span class="pill">${store.data.scores[u.id]}% best</span>`:""}</div>`;return `<span class="pill acc">${u.level.label}</span><h1>${u.title}</h1><p class="sub">${u.subtitle}</p>${tabs(u,tab)}${body}`}
let quiz=null;
function viewQuiz(id){let u=unit(id);if(!u)return viewHome();quiz={u,i:0,score:0};setTimeout(renderQuestion,0);return `<h1>${u.title}</h1><p class="sub">Practice</p><div id="quizbox"></div>`}
function renderQuestion(){if(!quiz)return;let box=$("#quizbox");if(quiz.i>=quiz.u.exercises.length){let pct=Math.round(100*quiz.score/quiz.u.exercises.length);store.data.scores[quiz.u.id]=Math.max(store.data.scores[quiz.u.id]||0,pct);if(pct>=75)store.data.completed[quiz.u.id]=true;activity("unit",quiz.u.id);store.save();box.innerHTML=`<div class="card" style="text-align:center;padding:35px"><div style="font-size:50px;font-weight:850">${pct}%</div><p>${quiz.score} of ${quiz.u.exercises.length} correct.${pct>=75?" Unit marked complete.":" Review and try again."}</p><button class="btn primary" onclick="go('unit/${quiz.u.id}/lesson')">Back to unit</button></div>`;renderSidebar();return}let e=quiz.u.exercises[quiz.i],controls=e.t==="mcq"?`<div class="opts">${e.opts.map((o,i)=>`<button class="opt" onclick="answerMCQ(${i})">${o}</button>`).join("")}</div>`:`<div class="answerrow"><input id="answer" autocomplete="off" placeholder="Type the missing form" onkeydown="if(event.key==='Enter')answerText()"><button class="btn primary" onclick="answerText()">Check</button></div>`;box.innerHTML=`<div class="progress"><i style="width:${100*quiz.i/quiz.u.exercises.length}%"></i></div><div class="exercise"><span class="pill">${quiz.i+1}/${quiz.u.exercises.length}</span><p>${e.q}</p>${controls}<div id="feedback"></div></div><button class="btn" onclick="go('unit/${quiz.u.id}/practice')">End practice</button>`;setTimeout(()=>$("#answer")?.focus(),0)}
function answerMCQ(i){let e=quiz.u.exercises[quiz.i],buttons=[...document.querySelectorAll(".opt")],ok=i===e.a;buttons.forEach((b,j)=>{b.disabled=true;if(j===e.a)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});finishAnswer(ok,e)}
function answerText(){let e=quiz.u.exercises[quiz.i],v=$("#answer").value,ok=e.a.some(a=>norm(a)===norm(v));finishAnswer(ok,e)}
function finishAnswer(ok,e){if(ok)quiz.score++;$("#feedback").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"Correct.":"Not quite. Expected: "+esc(Array.isArray(e.a)?e.a[0]:e.a)}${e.ex?`<br><small>${e.ex}</small>`:""}</div><button class="btn small" style="margin-top:10px" onclick="quiz.i++;renderQuestion()">Next</button>`}
let readQuery="",readKind="all";
function viewReadings(){let list=READINGS.filter(r=>(readKind==="all"||r.kind===readKind)&&(!readQuery||norm(r.title+" "+r.author+" "+r.work+" "+r.text).includes(norm(readQuery))));let kinds=[...new Set(READINGS.map(r=>r.kind))];setTimeout(()=>{let s=$("#readsearch");if(s)s.value=readQuery},0);return `<h1>Reading Room</h1><p class="sub">Controlled readings first; then authentic prose, poetry, legal, Christian and scientific Latin.</p><input id="readsearch" class="search" placeholder="Search title, author or text" oninput="readQuery=this.value;document.querySelector('#main').innerHTML=viewReadings()"><div class="readfilter"><button class="btn small ${readKind==="all"?"primary":""}" onclick="readKind='all';render()">All</button>${kinds.map(k=>`<button class="btn small ${readKind===k?"primary":""}" onclick="readKind=${JSON.stringify(k)};render()">${k}</button>`).join("")}</div>${list.map(r=>`<div class="readingrow ${store.data.readingDone[r.id]?"done":""}" onclick="go('read/${r.id}')"><div><b>${store.data.readingDone[r.id]?"✓ ":""}${r.title}</b><small>${r.author} · ${r.work}</small><div class="readingmeta"><span class="pill">${r.level}</span><span class="pill">${r.kind}</span></div></div><span>Read →</span></div>`).join("")}`}
let aid={gloss:false,notes:false,translation:false};
function glossedText(r){let t=(store.data.settings.macrons&&r.macron)?r.macron:r.text;if(!store.data.settings.macrons)t=stripMacrons(t);if(!aid.gloss)return esc(t).replace(/\n/g,"<br>");let keys=Object.keys(r.gloss).sort((a,b)=>b.length-a.length),map={};keys.forEach(k=>map[k.toLowerCase()]=r.gloss[k]);let re=new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"gi");return esc(t).replace(re,m=>`<button class="word" onclick="showGloss(${JSON.stringify(r.id)},${JSON.stringify(m.toLowerCase())})">${m}</button>`).replace(/\n/g,"<br>")}
function showGloss(id,key){let r=reading(id),g=r.gloss[key]||Object.entries(r.gloss).find(([k])=>k.toLowerCase()===key)?.[1]||"";$("#glosstip").innerHTML=g?`<div class="glosstip">${esc(g)}</div>`:"";clearTimeout(showGloss.t);showGloss.t=setTimeout(()=>$("#glosstip").innerHTML="",3000)}
function viewReading(id){let r=reading(id);if(!r)return viewReadings();let done=!!store.data.readingDone[id];return `<span class="pill acc">${r.kind}</span><h1>${r.title}</h1><p class="sub">${r.author} · ${r.work} · ${r.level}</p><div class="aidbar"><button class="btn small ${aid.gloss?"on":""}" onclick="aid.gloss=!aid.gloss;render()">Lexical glosses</button><button class="btn small ${aid.notes?"on":""}" onclick="aid.notes=!aid.notes;render()">Notes</button><button class="btn small ${aid.translation?"on":""}" onclick="aid.translation=!aid.translation;render()">Translation</button><button class="btn small ${store.data.settings.macrons?"on":""}" onclick="store.data.settings.macrons=!store.data.settings.macrons;store.save();render()">Macrons</button></div><div class="card latintext">${glossedText(r)}</div>${aid.gloss?`<div class="aidbox"><b>Glossary</b><div class="vocab">${Object.entries(r.gloss).map(([k,v])=>`<div><b>${k}</b><br>${v}</div>`).join("")}</div><button class="btn small" onclick="addReadingCards('${r.id}')">Add glossary to flashcards</button></div>`:""}${aid.notes?`<div class="aidbox notes"><b>Reading notes</b><ul>${r.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>`:""}${aid.translation?`<div class="aidbox"><b>Translation</b><p>${r.translation}</p></div>`:""}<button class="btn primary" onclick="toggleRead('${r.id}')">${done?"Marked read ✓":"Mark as read"}</button> <button class="btn" onclick="go('readings')">Back to library</button><div class="source"><b>Source and reuse.</b> ${r.license}${r.source?` <a href="${r.source}" target="_blank" rel="noopener">Open source text</a>.`:""}</div>`}
function toggleRead(id){store.data.readingDone[id]=!store.data.readingDone[id];activity("reading",id);store.save();render()}
function addReadingCards(id){let r=reading(id);Object.entries(r.gloss).forEach(([la,en])=>store.data.extraCards["r:"+id+":"+la]={la,en,source:r.title});store.save();alert("Reading glossary added to flashcards.");renderSidebar()}
function allCards(){let c=[];allUnits().forEach(u=>u.vocab.forEach((v,i)=>c.push({id:"u:"+u.id+":"+i,la:v[0],en:v[1],source:u.title})));Object.entries(store.data.extraCards).forEach(([id,x])=>c.push({id,...x}));return c}
function dueCards(){let now=Date.now();return allCards().filter(c=>!store.data.cards[c.id]||(store.data.cards[c.id].due||0)<=now)}
function viewFlash(){let due=dueCards().length,total=allCards().length;return `<h1>Flashcards</h1><p class="sub">Course vocabulary and any reading glossaries you add.</p><div class="stats"><div class="stat"><b>${due}</b><small>due now</small></div><div class="stat"><b>${total}</b><small>cards available</small></div></div><div class="card"><p>Reviews use a simple expanding interval. “Again” returns the card tomorrow; “Easy” expands the interval fastest.</p><button class="btn primary" ${due?"":"disabled"} onclick="go('flashrun')">Review ${Math.min(due,30)} cards</button></div>`}
let fc=null;
function startFlash(){let q=dueCards().sort(()=>Math.random()-.5).slice(0,30);fc={q,i:0,reveal:false,dir:null};renderFlash()}
function renderFlash(){applyTheme();renderSidebar();let m=$("#main");if(!fc||fc.i>=fc.q.length){m.innerHTML=`<div class="card" style="text-align:center;padding:35px"><h1>Review complete</h1><p>${fc?fc.q.length:0} cards reviewed.</p><button class="btn primary" onclick="go('flash')">Back</button></div>`;return}let c=fc.q[fc.i];if(!fc.dir)fc.dir=store.data.settings.direction==="mix"?(Math.random()<.5?"la":"en"):store.data.settings.direction;let front=fc.dir==="la"?c.la:c.en,back=fc.dir==="la"?c.en:c.la;m.innerHTML=`<div class="flashstage"><p class="sub">${fc.i+1}/${fc.q.length} · ${c.source}</p><div class="flashcard" onclick="fc.reveal=true;renderFlash()"><div class="front">${esc(front)}</div>${fc.reveal?`<div class="back">${esc(back)}</div>`:`<small style="margin-top:18px;color:var(--muted)">tap to reveal</small>`}</div>${fc.reveal?`<div class="grades"><button onclick="grade(0)">Again</button><button onclick="grade(1)">Hard</button><button onclick="grade(2)">Good</button><button onclick="grade(3)">Easy</button></div>`:""}</div>`}
function grade(g){let c=fc.q[fc.i],old=store.data.cards[c.id]||{iv:0,ease:2.3},days=[1,Math.max(2,old.iv*1.4),Math.max(4,old.iv*old.ease),Math.max(7,old.iv*(old.ease+.5))][g];store.data.cards[c.id]={iv:days,ease:Math.max(1.5,old.ease+(g-1.5)*.1),due:Date.now()+days*86400000};store.save();fc.i++;fc.reveal=false;fc.dir=null;renderFlash();renderSidebar()}
function viewReference(){return `<h1>Grammar reference</h1><p class="sub">Compact tables for consultation, not a substitute for the course sequence.</p>${REFS.map(r=>`<details class="card"><summary><b>${r.title}</b></summary><div class="grammar">${r.body}</div></details>`).join("")}`}
let labId=PARADIGMS[0].id;
function viewLab(){let p=PARADIGMS.find(x=>x.id===labId)||PARADIGMS[0];return `<h1>Morphology tables</h1><p class="sub">Inspect complete paradigms and compare endings.</p><select class="select" onchange="labId=this.value;render()">${PARADIGMS.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${x.name}</option>`).join("")}</select><div class="card labtable"><h2 style="margin-top:0">${p.name}</h2><table class="gr"><tr>${p.headers.map(h=>`<th>${h}</th>`).join("")}</tr>${p.rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`}
function viewSettings(){return `<h1>Settings</h1><div class="card"><h2 style="margin-top:0">Appearance</h2><label>Theme<br><select class="select" onchange="store.data.settings.theme=this.value;store.save();render()"><option value="system" ${store.data.settings.theme==="system"?"selected":""}>System</option><option value="light" ${store.data.settings.theme==="light"?"selected":""}>Light</option><option value="dark" ${store.data.settings.theme==="dark"?"selected":""}>Dark</option></select></label><p><label><input type="checkbox" ${store.data.settings.macrons?"checked":""} onchange="store.data.settings.macrons=this.checked;store.save()"> Show macrons where supplied</label></p><label>Flashcard direction<br><select class="select" onchange="store.data.settings.direction=this.value;store.save()"><option value="mix" ${store.data.settings.direction==="mix"?"selected":""}>Mixed</option><option value="la" ${store.data.settings.direction==="la"?"selected":""}>Latin → English</option><option value="en" ${store.data.settings.direction==="en"?"selected":""}>English → Latin</option></select></label></div><div class="card"><h2 style="margin-top:0">Progress data</h2><button class="btn" onclick="exportData()">Export progress</button> <button class="btn" onclick="$('#importfile').click()">Import progress</button> <button class="btn" onclick="resetData()">Reset</button></div><div class="card"><h2 style="margin-top:0">About and sources</h2><p><i>Lingua Latina</i> is a reading-centred course. It does not claim conversational fluency or a CEFR level.</p><p>Grammar explanations, controlled readings, translations and learning notes were prepared for this app with AI assistance and require continued human editorial review. Authentic Latin texts are public domain. Text transcriptions identified as derived from Perseus/Open Greek and Latin retain their Creative Commons ShareAlike attribution. Dickinson College Commentaries and its openly licensed grammar resources informed the architecture of the reference system but their commentaries are not reproduced here.</p></div>`}
function exportData(){let b=new Blob([JSON.stringify(store.data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="lingua-latina-progress.json";a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm("Delete all Latin-course progress on this device?")){store.data=JSON.parse(JSON.stringify(defaults));store.save();render()}}
$("#importfile").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);store.data=Object.assign({},defaults,d);store.data.settings=Object.assign({},defaults.settings,d.settings||{});store.save();render();alert("Progress imported.")}catch(err){alert("That file is not valid progress data.")}};rd.readAsText(f)});
$("#menubtn").onclick=()=>$("#sidebar").classList.toggle("open");
addEventListener("hashchange",()=>{$("#sidebar").classList.remove("open");aid={gloss:false,notes:false,translation:false};render()});
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",()=>{if(store.data.settings.theme==="system")render()});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./lingua-latina-sw.js").catch(()=>{}));
render();
</script>
</body></html>

 (ablative, with magnitudine and specie)","magnitudine":"in size (ablative of respect)","specie":"in appearance (ablative of respect)","Usus":"having enjoyed, having taken (deponent ūtor, with the ablative)","sole":"the sun, i.e. a sunbath (abl.)","frigida":"cold water (abl., with aqua understood)","gustaverat":"had taken a light meal","iacens":"lying down — the Roman way of eating","studebat":"he was studying, working at his books","poscit":"he demands, calls for (historic present)","soleas":"sandals (acc. pl.)","conspici":"to be observed (present passive infinitive)"},"notes":["The subject of <b>Erat</b> and <b>regebat</b> is Pliny the Elder, named earlier in the letter. Latin drops a subject the moment it is established, sometimes for several sentences.","Roman dates count backwards and inclusively from three fixed points. <b>Nonum kal. Septembres</b> is the ninth day before 1 September counted inclusively, which lands on 24 August 79 — the eruption of Vesuvius.","This is the earliest eyewitness account of a volcanic eruption in any literature. The clinical register — a naval command, a date, an hour, a cloud of unusual size — is what makes the rest of the letter land.","The domestic detail is doing the work: sunbath, cold plunge, a snack taken lying down, back to his books. Pliny establishes an utterly ordinary afternoon so that the eruption breaks into it.","<b>Usus ille sole, mox frigida</b> — <b>ūtor</b> takes the ablative, so both <b>sole</b> and <b>frigida</b> are its objects. Reading them as ablatives of means would still give roughly the right sense, but the construction is the deponent’s."],"hasMacrons":false},{"id":"r17","title":"They make a desert","author":"Tacitus","work":"Agricola 30","level":"Advanced prose","kind":"History","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/tacitus/tac.agri.shtml","text":"Raptores orbis, postquam cuncta vastantibus defuere terrae, mare scrutantur: auferre trucidare rapere falsis nominibus imperium, atque ubi solitudinem faciunt, pacem appellant.","translation":"Plunderers of the world, now that the earth has run out for them in their universal devastation, they ransack the sea. To steal, to slaughter, to seize under false names they call empire; and where they make a wilderness, they call it peace.","gloss":{"Raptores orbis":"plunderers of the world (in apposition to the unexpressed subject)","postquam":"after, now that","cuncta":"everything (n. pl.)","vastantibus":"for those laying waste (dative with defuere)","defuere":"have run out, failed (= defuerunt)","scrutantur":"they ransack (deponent)","auferre":"to carry off","trucidare":"to butcher","rapere":"to seize","falsis nominibus":"with false names (ablative of means)","imperium":"empire (predicate accusative with appellant)","solitudinem":"a wilderness, a desert","appellant":"they call"},"notes":["The three bare infinitives <b>auferre trucidare rapere</b>, with no connectives at all, are the objects of <b>appellant</b>: they call stealing, butchering and seizing by the name of empire. Asyndeton makes them land like blows.","Tacitus puts this in the mouth of Calgacus, a British chieftain, addressing his army before a battle against Rome. The most quoted denunciation of Roman imperialism was written by a Roman senator and consul.","<b>defuere</b> is the alternative third-plural perfect for <b>defuerunt</b>. Tacitus uses the short form constantly; do not read it as an infinitive."],"hasMacrons":false},{"id":"r18","title":"These studies","author":"Marcus Tullius Cicero","work":"Pro Archia 16","level":"Advanced prose","kind":"Oratory","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/cicero/arch.shtml","text":"Nam ceterae neque temporum sunt neque aetatum omnium neque locorum; at haec studia adulescentiam alunt, senectutem oblectant, secundas res ornant, adversis perfugium ac solacium praebent, delectant domi, non impediunt foris, pernoctant nobiscum, peregrinantur, rusticantur.","translation":"Other pursuits belong neither to every occasion, nor to every time of life, nor to every place; but these studies nourish youth and delight old age, they adorn prosperity and offer a refuge and a consolation in adversity, they are a pleasure at home and no hindrance abroad, they spend the night with us, they travel with us, they go with us into the country.","gloss":{"ceterae":"the other (pursuits) — feminine, with an understood artēs","temporum":"of all occasions (genitive of characteristic)","aetatum":"of ages, of times of life","at":"but","adulescentiam":"youth (acc.)","alunt":"they nourish","senectutem":"old age (acc.)","oblectant":"they delight","secundas res":"prosperity, favourable circumstances","adversis":"in adversity (dative with praebent)","perfugium":"refuge","solacium":"consolation","domi":"at home (locative)","foris":"out of doors, abroad","pernoctant":"they spend the night","peregrinantur":"they travel abroad (deponent)","rusticantur":"they go to the country (deponent)"},"notes":["Nine verbs in a row, all third person plural, all with <b>haec studia</b> as their subject. The accumulation is the argument: literature is defended by simply listing everywhere it goes with you.","Cicero pairs his clauses — youth against old age, prosperity against adversity, home against abroad — and then abandons the pairing for three bare verbs at the end. The break in the pattern is deliberate.","The genitives <b>temporum</b>, <b>aetatum</b>, <b>locorum</b> are genitives of characteristic: other pursuits are not \"of\" all times, ages and places. English needs a whole clause where Latin needs a case."],"hasMacrons":false},{"id":"r19","title":"I think, therefore I am","author":"René Descartes","work":"Principia Philosophiae 1.7 (1644)","level":"Advanced prose","kind":"Neo-Latin philosophy","license":"Descartes’ 1644 Latin text is public domain. Translation and notes are original.","source":"https://la.wikisource.org/wiki/Principia_philosophiae","text":"Sic autem rejicientes illa omnia, de quibus aliquo modo possumus dubitare, ac etiam falsa esse fingentes, facile quidem supponimus nullum esse Deum, nullum coelum, nulla corpora; nosque etiam ipsos non habere manus, nec pedes, nec denique ullum corpus; non autem ideo nos qui talia cogitamus nihil esse: repugnat enim ut putemus id quod cogitat eo ipso tempore quo cogitat non existere. Ac proinde haec cognitio, ego cogito, ergo sum, est omnium prima et certissima.","translation":"Rejecting in this way everything about which we can in any manner doubt, and even pretending that it is false, we readily suppose that there is no God, no heaven, no bodies; and that we ourselves have no hands, no feet, indeed no body at all — but not, for all that, that we who think such things are nothing. For it is self-contradictory to suppose that what thinks does not, at the very time when it is thinking, exist. And therefore this knowledge, I think therefore I am, is the first and most certain of all.","gloss":{"rejicientes":"rejecting (present participle, agreeing with the subject of supponimus)","aliquo modo":"in any way","dubitare":"to doubt","fingentes":"pretending, imagining","supponimus":"we suppose, we assume","nullum esse Deum":"that there is no God (indirect statement)","coelum":"heaven, the sky (later spelling of caelum)","nosque etiam ipsos":"and that we ourselves (accusative subject)","denique":"finally, in short","non autem ideo":"but not for that reason","talia":"such things (n. pl.)","repugnat":"it is self-contradictory, it clashes","ut putemus":"that we should suppose (substantive clause with the subjunctive)","eo ipso tempore quo":"at the very time at which","existere":"to exist","Ac proinde":"and therefore","cognitio":"piece of knowledge, cognition","certissima":"most certain (superlative)"},"notes":["The whole passage is one long chain of indirect statements after <b>supponimus</b>: <b>nullum esse Deum</b>, <b>nos non habere manus</b>, and then the crucial <b>non ... nos ... nihil esse</b>. Track the accusative-and-infinitive pattern and the argument becomes plain.","Descartes writes classical Latin three centuries after the fact, and it is very close to Cicero's — the visible differences are the spelling <b>coelum</b> for <b>caelum</b>, <b>rejicientes</b> for <b>reicientes</b>, and a vocabulary of philosophical abstractions.","Note that the famous formula is quoted in Latin inside a Latin sentence — <b>haec cognitio, ego cogito, ergo sum, est omnium prima</b>. The subject of <b>est</b> is <b>cognitio</b>, and everything between the commas is in apposition to it."],"hasMacrons":false}];

const REFS=[{"title":"Case functions at a glance","body":"<table class=\"gr\"><tr><th>Case</th><th>Core function</th><th>Example</th></tr>\n<tr><td>Nominative</td><td>subject / predicate</td><td><b>Caesar</b> dux est.</td></tr>\n<tr><td>Accusative</td><td>direct object; motion toward</td><td>urbem videt; Rōmam venit</td></tr>\n<tr><td>Genitive</td><td>possession / description</td><td>liber <b>Caesaris</b></td></tr>\n<tr><td>Dative</td><td>indirect object; reference; agent with gerundive</td><td>puellae dat; mihi faciendum est</td></tr>\n<tr><td>Ablative</td><td>means, manner, separation, circumstance</td><td>gladiō; cum amīcō; ab urbe</td></tr>\n<tr><td>Vocative</td><td>direct address</td><td>Salvē, Marce!</td></tr></table>"},{"title":"Personal endings","body":"<table class=\"gr\"><tr><th>Person</th><th>Active</th><th>Passive</th></tr>\n<tr><td>1 sg.</td><td>-ō / -m</td><td>-r</td></tr><tr><td>2 sg.</td><td>-s</td><td>-ris</td></tr>\n<tr><td>3 sg.</td><td>-t</td><td>-tur</td></tr><tr><td>1 pl.</td><td>-mus</td><td>-mur</td></tr>\n<tr><td>2 pl.</td><td>-tis</td><td>-minī</td></tr><tr><td>3 pl.</td><td>-nt</td><td>-ntur</td></tr></table>"},{"title":"Principal parts and stems","body":"<p>Learn verbs in four principal parts: <b>scrībō, scrībere, scrīpsī, scrīptum</b>.</p>\n<table class=\"gr\"><tr><th>Part</th><th>Supplies</th></tr><tr><td>1st: scrībō</td><td>present 1st singular and dictionary headword</td></tr>\n<tr><td>2nd: scrībere</td><td>present stem and conjugation</td></tr><tr><td>3rd: scrīpsī</td><td>perfect active stem</td></tr>\n<tr><td>4th: scrīptum</td><td>perfect passive participle and future active participle</td></tr></table>"},{"title":"Subjunctive sequence","body":"<table class=\"gr\"><tr><th>Main verb</th><th>Same/later time</th><th>Prior time</th></tr>\n<tr><td>Primary</td><td>present subjunctive</td><td>perfect subjunctive</td></tr>\n<tr><td>Historic</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table>\n<p>This is a default framework, not an iron rule. Authorial viewpoint, repraesentātiō and the independence of a clause can affect sequence.</p>"},{"title":"Reading a periodic sentence","body":"<ol><li>Circle finite verbs.</li><li>Bracket clauses introduced by relative pronouns, conjunctions and interrogatives.</li><li>Identify nominatives and accusatives from morphology.</li><li>Attach adjectives, genitives and participles to their heads.</li><li>Resolve the main clause before polishing the translation.</li></ol>"},{"title":"Classical pronunciation","body":"<table class=\"gr\"><tr><th>Spelling</th><th>Value</th></tr><tr><td>c</td><td>always hard</td></tr>\n<tr><td>g</td><td>always hard</td></tr><tr><td>v</td><td>approximately English w</td></tr>\n<tr><td>ae / oe</td><td>diphthongs</td></tr><tr><td>qu</td><td>kw</td></tr><tr><td>ti</td><td>not “sh” in restored Classical pronunciation</td></tr></table>"},{"title":"Which subjunctive clause is this?","body":"<table class=\"gr\"><tr><th>Clue in the sentence</th><th>Clause</th><th>Negative</th></tr><tr><td><b>ut</b> with no signpost before it</td><td>purpose — “in order that”</td><td><b>nē</b></td></tr><tr><td><b>tam, ita, sīc, tantus, tālis</b> then <b>ut</b></td><td>result — “so that in fact”</td><td><b>ut nōn</b></td></tr><tr><td>verb of asking, knowing, doubting + question word</td><td>indirect question</td><td><b>nōn</b></td></tr><tr><td>verb of ordering, urging, persuading + <b>ut</b></td><td>indirect command</td><td><b>nē</b></td></tr><tr><td><b>quī</b> after a negative or <b>sunt quī</b></td><td>relative of characteristic</td><td><b>nōn</b></td></tr><tr><td><b>cum</b> + subjunctive</td><td>circumstantial, causal or concessive</td><td><b>nōn</b></td></tr></table><p class=\"tip\">Read the introducing word <i>and</i> look back for a signpost before deciding. Purpose and result are told apart by what precedes <b>ut</b>, not by the subjunctive itself.</p>"},{"title":"Conditions","body":"<table class=\"gr\"><tr><th>Type</th><th>Protasis (sī…)</th><th>Apodosis</th></tr><tr><td>Simple fact</td><td>indicative</td><td>indicative</td></tr><tr><td>Future more vivid</td><td>future / future perfect</td><td>future</td></tr><tr><td>Future less vivid (“should… would”)</td><td>present subjunctive</td><td>present subjunctive</td></tr><tr><td>Present contrary to fact</td><td>imperfect subjunctive</td><td>imperfect subjunctive</td></tr><tr><td>Past contrary to fact</td><td>pluperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table>"},{"title":"Sequence of tenses","body":"<table class=\"gr\"><tr><th>Main verb</th><th>Same time as main verb</th><th>Time before main verb</th></tr><tr><td>Primary — present, future, future perfect, perfect with have</td><td>present subjunctive</td><td>perfect subjunctive</td></tr><tr><td>Secondary — imperfect, perfect, pluperfect</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table><p>Subjunctive tense marks time <i>relative</i> to the main verb, never absolute time. This is the single rule behind most reported speech in Latin prose.</p>"},{"title":"A reading procedure for long sentences","body":"<ol><li>Read to the full stop before translating anything.</li><li>Mark every finite verb. Each one is a clause.</li><li>Mark the words that introduce clauses: <b>ut, nē, cum, sī, quī, quod, quam</b>, question words.</li><li>Find the one main verb that is not inside any subordinate clause.</li><li>Attach the nominative to it, then the accusative, then everything else.</li><li>Only now put it into English — and in English word order, not Latin.</li></ol><p class=\"tip\">If you are stuck, you have almost always mis-identified a case ending or missed a clause boundary. Go back to step 2 rather than guessing at vocabulary.</p>"}];
"use strict";
/* ------------------------------------------------------------------ store */
const KEY = "lingua-latina-progress-v1";
const defaults = {
  completed: {}, scores: {}, readingDone: {}, cards: {}, extraCards: {},
  settings: { theme: "system", macrons: true, direction: "mix", cardScope: "reached" },
  activity: []
};
const store = {
  data: null, memOnly: false,
  load() {
    try {
      this.data = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || "{}"));
      this.data.settings = Object.assign({}, defaults.settings, this.data.settings || {});
      ["completed", "scores", "readingDone", "cards", "extraCards"].forEach(k => {
        if (!this.data[k] || typeof this.data[k] !== "object") this.data[k] = {};
      });
      if (!Array.isArray(this.data.activity)) this.data.activity = [];
    } catch (e) { this.data = JSON.parse(JSON.stringify(defaults)); this.memOnly = true; }
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; } }
};
store.load();

/* ------------------------------------------------------------- utilities */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LET = "A-Za-z\\u00C0-\\u00D6\\u00D8-\\u00F6\\u00F8-\\u024F";
function stripMacrons(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").normalize("NFC"); }
function norm(s) { return stripMacrons(String(s).toLowerCase()).replace(/[.,;:!?“”"'’—–()\[\]]/g, "").replace(/\s+/g, " ").trim(); }
function shuffled(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function route() { return location.hash.replace(/^#\/?/, "") || "home"; }
function go(r) { location.hash = "#/" + r; }
function allUnits() { return COURSE.flatMap(l => l.units.map(u => ({ ...u, level: l }))); }
function unit(id) { return allUnits().find(u => u.id === id); }
function reading(id) { return READINGS.find(r => r.id === id); }
function doneLevel(l) { return l.units.filter(u => store.data.completed[u.id]).length; }
function applyTheme() {
  let t = store.data.settings.theme;
  if (t === "system") t = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
}
function activity(type, id, extra) {
  store.data.activity.unshift(Object.assign({ type, id, at: Date.now() }, extra || {}));
  store.data.activity = store.data.activity.slice(0, 40);
}
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
}

/* ------------------------------------------------------- course sequence */
// Units the learner has actually reached: everything completed, plus the next one.
function reachedUnitIds() {
  const ids = [];
  for (const u of allUnits()) { ids.push(u.id); if (!store.data.completed[u.id]) break; }
  return ids;
}
function nextUnitRoute() {
  const u = allUnits().find(x => !store.data.completed[x.id]);
  return u ? "unit/" + u.id + "/lesson" : "readings";
}

/* ------------------------------------------------------------ flashcards */
function allCards() {
  const scope = store.data.settings.cardScope || "reached";
  const reach = new Set(reachedUnitIds());
  const c = [];
  allUnits().forEach(u => {
    if (scope === "all" || reach.has(u.id))
      u.vocab.forEach((v, i) => c.push({ id: "u:" + u.id + ":" + i, la: v[0], en: v[1], source: u.title }));
  });
  Object.entries(store.data.extraCards).forEach(([id, x]) => c.push(Object.assign({ id }, x)));
  return c;
}
function controlledCount() { return READINGS.filter(r => r.kind === "Controlled").length; }
function authenticCount() { return READINGS.length - controlledCount(); }
function totalCourseCards() { return allUnits().reduce((n, u) => n + u.vocab.length, 0) + Object.keys(store.data.extraCards).length; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => !store.data.cards[c.id] || (store.data.cards[c.id].due || 0) <= now);
}

/* ---------------------------------------------------------------- render */
function render() {
  applyTheme();
  renderSidebar();
  const p = route().split("/");
  let out = "";
  if (p[0] === "home") out = viewHome();
  else if (p[0] === "level") out = viewLevel(p[1]);
  else if (p[0] === "unit") out = viewUnit(p[1], p[2] || "lesson");
  else if (p[0] === "quiz") out = viewQuiz(p[1]);
  else if (p[0] === "review") out = viewReview();
  else if (p[0] === "readings") out = viewReadings();
  else if (p[0] === "read") out = viewReading(p[1]);
  else if (p[0] === "flash") out = viewFlash();
  else if (p[0] === "flashrun") { startFlash(); return; }
  else if (p[0] === "reference") out = viewReference();
  else if (p[0] === "lab") out = viewLab();
  else if (p[0] === "settings") out = viewSettings();
  else out = viewHome();

let quiz = null;
const QUIZ_LEN = 8, REVIEW_LEN = 15;
const isChoice = e => e.t === "mcq" || e.t === "parse";
function prepare(exercises, n) {
  return shuffled(exercises).slice(0, n).map(e => {
    if (!isChoice(e)) return Object.assign({}, e);
    const order = shuffled(e.opts.map((_, i) => i));
    return Object.assign({}, e, { opts: order.map(i => e.opts[i]), a: order.indexOf(e.a) });
  });
}
function viewQuiz(id) {

  if (!u) return viewHome();
  quiz = { title: u.title, unitId: u.id, back: "unit/" + u.id + "/practice", kind: "unit", qs: prepare(u.exercises, QUIZ_LEN), i: 0, score: 0, answered: false };

  return `<h1>${u.title}</h1><p class="sub">Practice · ${quiz.qs.length} of ${u.exercises.length} questions, drawn at random</p><div id="quizbox"></div>`;
}
function viewReview() {
  const reach = reachedUnitIds();
  const pool = allUnits().filter(u => reach.includes(u.id))
    .flatMap(u => u.exercises.map(e => Object.assign({}, e, { from: u.title })));

    return `<h1>Mixed review</h1><p class="sub">Cumulative practice across everything you have studied.</p><div class="card"><p>Complete a unit or two first — this pulls its questions from the units you have reached, in random order, so that older material keeps coming back.</p><button class="btn primary" onclick="go('${nextUnitRoute()}')">Go to the next unit</button></div>`;

function renderQuestion() {
  if (!quiz) return;
  const box = $("#quizbox");
  if (!box) return;
  if (quiz.i >= quiz.qs.length) {
    const pct = Math.round(100 * quiz.score / quiz.qs.length);
    if (quiz.kind === "unit") {
      store.data.scores[quiz.unitId] = Math.max(store.data.scores[quiz.unitId] || 0, pct);
      if (pct >= 75) store.data.completed[quiz.unitId] = true;
      activity("unit", quiz.unitId, { pct });
    } else activity("review", null, { pct });
    store.save();
    box.innerHTML = `<div class="card" style="text-align:center;padding:35px"><div style="font-size:50px;font-weight:850">${pct}%</div><p>${quiz.score} of ${quiz.qs.length} correct.${quiz.kind === "unit" ? (pct >= 75 ? " Unit marked complete." : " Review the lesson and try again.") : ""}</p>` +
      (quiz.kind === "unit"
        ? `<button class="btn primary" onclick="go('${quiz.back}')">Back to unit</button> <button class="btn" onclick="go('review')">Mixed review</button>`
        : `<button class="btn primary" onclick="render()">Another round</button> <button class="btn" onclick="go('home')">Done</button>`) + `</div>`;
    renderSidebar();
    return;
  }
  const e = quiz.qs[quiz.i];
  quiz.answered = false;
  let controls;
  if (isChoice(e))
    controls = `<div class="opts">${e.opts.map((o, i) => `<button class="opt" type="button" onclick="answerMCQ(${i})">${o}</button>`).join("")}</div>`;
  else if (e.t === "pick")
    controls = `<div class="picksent" lang="la">${e.s.split(/\s+/).map((w, i) => `<button class="pickword" type="button" onclick="answerPick(${i})">${esc(w)}</button>`).join(" ")}</div>`;
  else
    controls = `<div class="answerrow"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="${e.t === "trans" ? "Type the new form" : "Type the missing form"}" onkeydown="if(event.key==='Enter'){event.preventDefault();answerText()}"><button class="btn primary" id="checkbtn" type="button" onclick="answerText()">Check</button></div>`;
  const label = { parse: "Parse the form", trans: "Transform", pick: "Click the word", fill: "Complete", mcq: "Choose" }[e.t] || "";
  box.innerHTML = `<div class="progress"><i style="width:${100 * quiz.i / quiz.qs.length}%"></i></div>
<div class="exercise"><span class="pill">${quiz.i + 1}/${quiz.qs.length}</span> <span class="pill acc">${label}</span>${e.from ? ` <span class="pill">${esc(e.from)}</span>` : ""}
${e.form ? `<div class="formbox" lang="la">${e.form}</div>` : ""}<p>${e.q}</p>${controls}<div id="feedback" role="status" aria-live="polite"></div></div>
<button class="btn" onclick="go('${quiz.back}')">End practice</button>`;
  setTimeout(() => { const a = $("#answer"); if (a) a.focus(); }, 0);
}
function answerMCQ(i) {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i];
  [...document.querySelectorAll(".opt")].forEach((b, j) => {
    b.disabled = true;
    if (j === e.a) b.classList.add("correct"); else if (j === i) b.classList.add("wrong");
  });
  finishAnswer(i === e.a, e);
}
function answerPick(i) {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i], words = e.s.split(/\s+/);
  const target = words.findIndex(w => norm(w) === norm(e.a));
  [...document.querySelectorAll(".pickword")].forEach((b, j) => {
    b.disabled = true;
    if (j === target) b.classList.add("correct"); else if (j === i) b.classList.add("wrong");
  });
  finishAnswer(norm(words[i]) === norm(e.a), e);
}
function answerText() {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i], input = $("#answer"), v = input ? input.value : "";
  if (!norm(v)) { const f = $("#feedback"); if (f) f.innerHTML = `<div class="feedback no">Type an answer first.</div>`; return; }
  if (input) input.disabled = true;
  const btn = $("#checkbtn"); if (btn) btn.disabled = true;
  finishAnswer(e.a.some(a => norm(a) === norm(v)), e);
}
function finishAnswer(ok, e) {
  quiz.answered = true;
  if (ok) quiz.score++;
  const expected = isChoice(e) ? e.opts[e.a] : esc(Array.isArray(e.a) ? e.a[0] : e.a);
  $("#feedback").innerHTML =
    `<div class="feedback ${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite. Expected: " + expected}</div>` +
    (e.ex ? `<div class="why">${e.ex}</div>` : "") +
    `<button class="btn small" id="nextq" style="margin-top:10px" type="button" onclick="quiz.i++;renderQuestion()">Next</button>`;
  setTimeout(() => { const n = $("#nextq"); if (n) n.focus(); }, 0);
}

let aid = { gloss: false, notes: false, translation: false };
// Match gloss keys on the raw text, escaping each piece afterwards, with real
// word boundaries and tolerance for the enclitics -que, -ve and -ne.
function glossedText(r) {
  const useMacrons = store.data.settings.macrons && r.hasMacrons;
  const raw = useMacrons ? r.text : stripMacrons(r.text);
  const br = s => esc(s).replace(/\n/g, "<br>");
  if (!aid.gloss) return br(raw);
  const entries = Object.keys(r.gloss || {}).map(k => ({ key: k, disp: useMacrons ? k : stripMacrons(k) }))
    .filter(e => e.disp).sort((a, b) => b.disp.length - a.disp.length);
  if (!entries.length) return br(raw);
  const alt = entries.map(e => e.disp.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const enc = `(?:que|ve|ne)?(?![${LET}])`;
  const re = new RegExp(`(^|[^${LET}])(${alt})(?=${enc})`, "gi");
  let out = "", last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    const start = m.index + m[1].length, word = m[2];
    out += br(raw.slice(last, start));
    const hit = entries.find(e => e.disp.toLowerCase() === word.toLowerCase());
    out += `<button class="word" type="button" data-g="${esc(hit ? hit.key : word)}">${esc(word)}</button>`;
    last = start + word.length;
    if (re.lastIndex <= last) re.lastIndex = last;
  }
  return out + br(raw.slice(last));
}
function showGloss(id, key) {

  const tip = $("#glosstip");
  tip.innerHTML = g ? `<div class="glosstip"><b lang="la">${esc(key)}</b> — ${esc(g)}</div>` : "";
  clearTimeout(showGloss.t);
  showGloss.t = setTimeout(() => { tip.innerHTML = ""; }, 5000);
}

  return `<span class="pill acc">${r.kind}</span><h1>${r.title}</h1><p class="sub">${r.author} · ${r.work} · ${r.level}</p>
<div class="aidbar">
<button class="btn small ${aid.gloss ? "on" : ""}" aria-pressed="${aid.gloss}" onclick="aid.gloss=!aid.gloss;render()">Lexical glosses</button>

${aid.gloss ? `<div class="aidbox"><b>Glossary</b><div class="vocab">${Object.entries(r.gloss).map(([k, v]) => `<div><b lang="la">${esc(k)}</b><br>${esc(v)}</div>`).join("")}</div><button class="btn small" onclick="addReadingCards('${r.id}')">Add glossary to flashcards</button></div>` : ""}
${aid.notes ? `<div class="aidbox notes"><b>Reading notes</b><ul>${r.notes.map(n => `<li>${n}</li>`).join("")}</ul></div>` : ""}

  const front = fc.dir === "la" ? c.la : c.en, back = fc.dir === "la" ? c.en : c.la;
  m.innerHTML = `<div class="flashstage"><p class="sub">${fc.i + 1}/${fc.q.length} · ${esc(c.source)}</p>
<button class="flashcard" type="button" id="fcard" onclick="revealCard()"><span class="front" ${fc.dir === "la" ? 'lang="la"' : ""}>${esc(front)}</span>${fc.reveal ? `<span class="back" ${fc.dir === "en" ? 'lang="la"' : ""}>${esc(back)}</span>` : `<small style="margin-top:18px;color:var(--muted)">click, tap, or press Space to reveal</small>`}</button>
${fc.reveal ? `<div class="grades"><button type="button" onclick="grade(0)"><b>Again</b><small>1</small></button><button type="button" onclick="grade(1)"><b>Hard</b><small>2</small></button><button type="button" onclick="grade(2)"><b>Good</b><small>3</small></button><button type="button" onclick="grade(3)"><b>Easy</b><small>4</small></button></div>` : ""}
<p class="sub" style="margin-top:14px"><button class="btn small" onclick="fc=null;go('flash')">End session</button></p></div>`;
  setTimeout(() => { const b = $("#fcard"); if (b) b.focus(); }, 0);
}
function revealCard() { if (fc && !fc.reveal) { fc.reveal = true; renderFlash(); } }
function grade(g) {
  if (!fc || !fc.reveal) return;
  const c = fc.q[fc.i], old = store.data.cards[c.id] || { iv: 0, ease: 2.3 };
  const days = [1, Math.max(2, old.iv * 1.4), Math.max(4, old.iv * old.ease), Math.max(7, old.iv * (old.ease + .5))][g];
  store.data.cards[c.id] = { iv: days, ease: Math.max(1.5, Math.min(3.2, old.ease + (g - 1.5) * .1)), due: Date.now() + days * 86400000 };
  store.save();
  fc.seen++;
  // a lapse should come back before the session ends, at most twice
  if (g === 0 && (fc.again[c.id] || 0) < 2) { fc.again[c.id] = (fc.again[c.id] || 0) + 1; fc.q.push(c); }
  fc.i++; fc.reveal = false; fc.dir = null;
  renderFlash();
}

/* ---------------------------------------------- reference, lab, settings */
function viewReference() {
  return `<h1>Grammar reference</h1><p class="sub">Compact tables for consultation, not a substitute for the course sequence.</p>` +
    REFS.map(r => `<details class="card"><summary><b>${r.title}</b></summary><div class="grammar">${r.body}</div></details>`).join("");
}
let labId = PARADIGMS[0].id;
function viewLab() {
  const p = PARADIGMS.find(x => x.id === labId) || PARADIGMS[0];
  return `<h1>Morphology tables</h1><p class="sub">${PARADIGMS.length} complete paradigms — nouns, adjectives, pronouns, all four verb systems, the subjunctive, deponents and the irregulars.</p>
<label class="visually-hidden" for="labsel">Choose a paradigm</label>
<select class="select" id="labsel" onchange="labId=this.value;render()">${PARADIGMS.map(x => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${x.name}</option>`).join("")}</select>
<div class="card labtable"><h2 style="margin-top:0" lang="la">${p.name}</h2><table class="gr"><tr>${p.headers.map(h => `<th>${h}</th>`).join("")}</tr>${p.rows.map(row => `<tr>${row.map((c, i) => i === 0 ? `<th scope="row">${c}</th>` : `<td lang="la">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function viewSettings() {
  const s = store.data.settings;
  return `<h1>Settings</h1>
<div class="card"><h2 style="margin-top:0">Appearance</h2>
<label>Theme<br><select class="select" onchange="store.data.settings.theme=this.value;store.save();render()">${["system", "light", "dark"].map(t => `<option value="${t}" ${s.theme === t ? "selected" : ""}>${t[0].toUpperCase() + t.slice(1)}</option>`).join("")}</select></label>
<p><label><input type="checkbox" ${s.macrons ? "checked" : ""} onchange="store.data.settings.macrons=this.checked;store.save();render()"> Show macrons where the text supplies them</label></p></div>
<div class="card"><h2 style="margin-top:0">Flashcards</h2>
<label>Direction<br><select class="select" onchange="store.data.settings.direction=this.value;store.save()">${[["mix", "Mixed"], ["la", "Latin → English"], ["en", "English → Latin"]].map(([v, t]) => `<option value="${v}" ${s.direction === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<label style="display:block;margin-top:12px">Deck<br><select class="select" onchange="store.data.settings.cardScope=this.value;store.save();render()">${[["reached", "Only units I have reached"], ["all", "The entire course"]].map(([v, t]) => `<option value="${v}" ${(s.cardScope || "reached") === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<p class="sub" style="margin:10px 0 0">Keeping the deck to units you have reached is what makes the interval scheduling meaningful; the whole course at once is ${totalCourseCards()} cards on day one.</p></div>
<div class="card"><h2 style="margin-top:0">Progress data</h2><p class="sub" style="margin-top:0">Progress lives in this browser only. Export it if you clear site data or move device.</p>
<button class="btn" onclick="exportData()">Export progress</button> <button class="btn" onclick="document.getElementById('importfile').click()">Import progress</button> <button class="btn" onclick="resetData()">Reset</button></div>
<div class="card"><h2 style="margin-top:0">About and sources</h2>
<p><i>Lingua Latina</i> is a reading-centred course. It does not claim conversational fluency or a CEFR level.</p>
<p>The ${controlledCount()} controlled readings are <b>original compositions written for this app</b>, each deliberately restricted to the grammar taught up to its stage. They are not ancient texts and are not presented as such. The ${authenticCount()} authentic passages are transcribed from public-domain editions and are linked individually.</p>
<p>Grammar explanations, translations and learning notes were prepared for this app with AI assistance and remain under human editorial review. If you find an error in the Latin, that is a bug worth reporting.</p></div>`;
}
function exportData() {
  const b = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "lingua-latina-progress.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function resetData() {
  if (confirm("Delete all Latin-course progress on this device?")) {
    store.data = JSON.parse(JSON.stringify(defaults)); store.save(); render();
  }
}

/* ----------------------------------------------------------- wiring, PWA */
document.addEventListener("click", e => {
  const w = e.target.closest && e.target.closest(".word[data-g]");
  if (w) { const p = route().split("/"); if (p[0] === "read") showGloss(p[1], w.dataset.g); }
});
document.addEventListener("keydown", e => {
  if (!fc || route() !== "flashrun") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (!fc.reveal && (e.key === " " || e.key === "Enter")) { e.preventDefault(); revealCard(); return; }
  if (fc.reveal && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); grade(Number(e.key) - 1); }
});
$("#importfile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("shape");
      const clean = JSON.parse(JSON.stringify(defaults));
      ["completed", "scores", "readingDone", "cards", "extraCards"].forEach(k => {
        if (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) clean[k] = d[k];
      });
      if (d.settings && typeof d.settings === "object") clean.settings = Object.assign({}, defaults.settings, d.settings);
      if (Array.isArray(d.activity)) clean.activity = d.activity.slice(0, 40);
      store.data = clean; store.save(); render();
      alert("Progress imported.");
    } catch (err) { alert("That file is not valid progress data."); }
    e.target.value = "";
  };
  rd.readAsText(f);
});
$("#menubtn").onclick = () => {
  const open = $("#sidebar").classList.toggle("open");
  $("#menubtn").setAttribute("aria-expanded", String(open));
};
addEventListener("hashchange", () => {
  $("#sidebar").classList.remove("open");
  $("#menubtn").setAttribute("aria-expanded", "false");
  aid = { gloss: false, notes: false, translation: false };
  render();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change", () => { if (store.data.settings.theme === "system") render(); });

// PWA: the manifest, icons and service worker are shipped as separate files
// alongside this page. Keep them in the same directory.
if ("serviceWorker" in navigator) {
  addEventListener("load", () =>
    navigator.serviceWorker.register("./lingua-latina-sw.js").catch(() => {})
  );
}

render();

</script>
</body>
</html>

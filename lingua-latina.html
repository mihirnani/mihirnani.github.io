ght","mittitur":"is sent (present passive)","immēnsa spatia":"immense spaces","Quō longius":"by how much the farther — first half of a correlative","eō antīquiōrem":"by that much the older — second half, answering Quō","spectantēs":"looking at (participle agreeing with the subject of contemplāmur)","remōta":"distant (n. pl. with loca)","contemplāmur":"we contemplate (deponent: passive form, active sense)"},"notes":["<b>ut ... intellegant</b> is purpose.","<b>quae</b> agrees with <b>lūx</b> and is subject of <b>mittitur</b>.","<b>quō ... eō</b> correlates two comparatives."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c9","title":"Orders from the camp","author":"Controlled Latin","work":"Original bridge reading","level":"Bridge to prose","kind":"Controlled","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","source":"","text":"Caesar, explōrātōribus praemissīs, cognōvit hostēs trāns flūmen castra posuisse. Itaque pontem facere cōnstituit. Mīlitibus imperāvit ut silvam caederent et māteriam ad rīpam portārent. Opere tertiō diē cōnfectō, legiōnēs trādūxit. Hostēs, adventū Rōmānōrum territī, in montēs sē recēpērunt. Caesar, veritus nē in silvīs īnsidiae parārentur, agmen cōnsistere iussit.","translation":"Caesar, having sent scouts ahead, learned that the enemy had pitched camp across the river. And so he decided to build a bridge. He ordered the soldiers to cut down the wood and carry the timber to the bank. When the work was finished on the third day, he led the legions across. The enemy, terrified at the arrival of the Romans, withdrew into the mountains. Caesar, fearing that an ambush was being prepared in the woods, ordered the column to halt.","gloss":{"explōrātōribus praemissīs":"scouts having been sent ahead (ablative absolute)","castra posuisse":"to have pitched camp (perfect infinitive in indirect statement)","cōnstituit":"decided","imperāvit ut":"ordered that — indirect command with the subjunctive","caederent":"should cut down","māteriam":"timber","rīpam":"riverbank (acc.)","Opere tertiō diē cōnfectō":"the work having been finished on the third day (ablative absolute)","trādūxit":"led across","adventū":"at the arrival (ablative of cause)","sē recēpērunt":"withdrew (literally: took themselves back)","veritus":"fearing (perfect participle of the deponent vereor, active in sense)","īnsidiae":"an ambush","agmen":"marching column","cōnsistere iussit":"ordered to halt (iubeō with accusative and infinitive)"},"notes":["This is written deliberately in Caesar's manner: short main verbs at the end, ablative absolutes carrying the subordinate action, and every stage of the operation compressed into a participle. Read <b>r1</b> immediately after.","Three different ways of reporting appear here. <b>cognōvit ... posuisse</b> is indirect statement; <b>imperāvit ut ... caederent</b> is indirect command; <b>iussit ... cōnsistere</b> is <b>iubeō</b> with accusative and infinitive. Latin keeps them strictly apart, and <b>iubeō</b> is the exception that does not take <b>ut</b>.","<b>veritus nē ... parārentur</b>: after a verb of fearing, <b>nē</b> means <i>that</i>, and <b>ut</b> or <b>nē nōn</b> means <i>that not</i> — the reverse of what you would expect from purpose clauses."],"hasMacrons":true},{"id":"c10","title":"A speech in the senate","author":"Controlled Latin","work":"Original bridge reading","level":"Bridge to prose","kind":"Controlled","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","source":"","text":"Quid enim, patrēs cōnscrīptī, exspectāmus? Sī hostis intrā moenia esset, arma statim caperēmus; nunc, cum īnsidiae in ipsā cūriā parentur, tacēmus. Ille vir, quī tot annōs rem pūblicam dēfendit, quī tantum perīculī prō vōbīs adiit, nunc ā vōbīs dēserendus est? Nōn sōlum dē ūnō homine sed etiam dē lībertāte omnium agitur. Quae cum ita sint, cēnseō id nōbīs statim faciendum esse.","translation":"What, senators, are we waiting for? If an enemy were inside the walls we should take up arms at once; as it is, when a plot is being prepared in the senate house itself, we say nothing. Is that man, who defended the state for so many years, who faced so much danger on your behalf, now to be abandoned by you? What is at stake is not one man only, but the freedom of us all. Since this is so, I move that we must act immediately.","gloss":{"patrēs cōnscrīptī":"senators (the formal mode of address)","intrā moenia":"inside the walls","caperēmus":"we would take up (imperfect subjunctive, contrary to fact)","cūriā":"the senate house (abl.)","parentur":"are being prepared (present subjunctive after cum)","tot annōs":"for so many years (accusative of duration)","tantum perīculī":"so much danger (partitive genitive)","adiit":"faced, went to meet (from adeō)","dēserendus est":"is to be abandoned (gerundive of obligation)","agitur":"is at stake (impersonal passive: the matter concerns)","Quae cum ita sint":"since this is so (connecting relative)","cēnseō":"I move, I give it as my opinion","faciendum esse":"must be done (gerundive in indirect statement)"},"notes":["Cicero's architecture in miniature: a rhetorical question, a contrary-to-fact condition, two parallel relative clauses building to a climax, a <b>nōn sōlum ... sed etiam</b>, and a connecting relative to close. Read <b>r4</b> next.","Two conditions of different kinds sit side by side. <b>Sī hostis ... esset ... caperēmus</b> is present contrary to fact; <b>cum ... parentur</b> is a causal <b>cum</b>-clause about what is actually happening. The contrast between the imagined and the real is the whole rhetorical move.","<b>ā vōbīs dēserendus est</b> uses <b>ā</b> with the ablative rather than the usual dative of agent. Latin does this when a dative would be ambiguous or when, as here, the speaker wants to point an accusing finger at a specific group."],"hasMacrons":true},{"id":"c11","title":"A wakeful night","author":"Controlled Latin","work":"Original bridge reading","level":"Bridge to verse","kind":"Controlled","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","source":"","text":"Nox erat. Somnus per fessa vagābātur membra, sed mihi, longīs agitātō cūrīs, quiēs nūlla veniēbat. Lūna per caelum obscūrīs errābat tēcta nūbibus; longē canēbat in silvīs avis sōla. Tum subitō vēnit in mentem carmen illud mihi, quod puer ōlim didiceram, et tot neglēcta per annōs verba redīērunt.","translation":"It was night. Sleep was wandering through weary limbs, but for me, troubled by long anxieties, no rest came. The moon wandered across the sky, veiled by dark clouds; far off in the woods a lone bird was singing. Then suddenly that poem came into my mind, the one I had learned long ago as a boy, and the words, neglected for so many years, came back.","gloss":{"Somnus":"sleep","per fessa":"through weary — agrees with membra three words later","vagābātur":"was wandering (deponent)","membra":"limbs (n. pl.)","longīs":"long — agrees with cūrīs after the participle","agitātō":"troubled — agrees with mihi","quiēs":"rest, quiet","obscūrīs":"dark — agrees with nūbibus at the clause's end","tēcta":"covered, veiled — agrees with Lūna","nūbibus":"clouds (abl.)","canēbat":"was singing","vēnit in mentem":"came to mind (idiom)","puer":"as a boy — nominative in apposition to the subject of didiceram","didiceram":"I had learned","neglēcta":"neglected — agrees with verba at the clause's end","redīērunt":"came back"},"notes":["The grammar here is nothing you have not met; only the <i>word order</i> is new. Four pairs of words that agree have been pulled apart — <b>per fessa ... membra</b>, <b>longīs ... cūrīs</b>, <b>obscūrīs ... nūbibus</b>, <b>tot neglēcta per annōs verba</b>. This is hyperbaton, and it is how Latin verse is normally written.","The technique for reading it: when you meet an adjective with no noun beside it, hold the ending in mind and keep reading. The noun will arrive, and its ending will match. Never assume the next word is the one that agrees.","Read this immediately before <b>r5</b>, <b>r7</b> or <b>r8</b>. The difficulty of real verse is far more often displaced agreement than unknown vocabulary."],"hasMacrons":true},{"id":"r1","title":"Gaul divided","author":"Julius Caesar","work":"De bello Gallico 1.1","level":"Intermediate","kind":"Classical prose","text":"Gallia est omnis divisa in partes tres, quarum unam incolunt Belgae, aliam Aquitani, tertiam qui ipsorum lingua Celtae, nostra Galli appellantur.","translation":"Gaul as a whole is divided into three parts: one of these the Belgae inhabit, another the Aquitani, and the third those who in their own language are called Celts and in ours Gauls.","gloss":{"omnis":"as a whole / all","divisa":"divided","partes":"parts","quarum":"of which","unam":"one (part)","incolunt":"inhabit","aliam":"another","tertiam":"a third","ipsorum":"their own","lingua":"language (abl.)","appellantur":"are called"},"notes":["The main verb is <b>est divisa</b>; <b>Gallia omnis</b> is its subject.","<b>quarum</b> refers to <b>partes</b>.","The verbs <b>incolunt</b> and <b>appellantur</b> have different subjects."],"source":"https://www.thelatinlibrary.com/caesar/gall1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r2","title":"Hannibal judged","author":"Cornelius Nepos","work":"Hannibal 1.1","level":"Advanced prose","kind":"Classical prose","text":"Hannibal, Hamilcaris filius, Carthaginiensis. Si verum est, quod nemo dubitat, ut populus Romanus omnes gentes virtute superarit, non est infitiandum Hannibalem tanto praestitisse ceteros imperatores prudentia, quanto populus Romanus antecedat fortitudine cunctas nationes.","translation":"Hannibal, son of Hamilcar, a Carthaginian. If it is true—as no one doubts—that the Roman people has surpassed all nations in courage, it must be admitted that Hannibal surpassed other commanders in judgment by as much as the Roman people surpasses all nations in bravery.","gloss":{"Hamilcaris filius":"son of Hamilcar","Carthaginiensis":"a Carthaginian","infitiandum":"to be denied (gerundive of obligation)","praestitisse":"to have surpassed (perfect infinitive)","imperatores":"commanders","prudentia":"in judgement (ablative of respect)","tanto":"by so much — looks forward to quanto below","quanto":"by how much — completes the tanto ... quanto comparison","antecedat":"surpasses (subjunctive in a subordinate clause of indirect statement)","fortitudine":"in bravery (ablative of respect)","cunctas":"all","nationes":"nations"},"notes":["The long sentence is framed by a comparison: Rome surpasses nations in courage; Hannibal surpasses generals in prudence.","<b>non est infitiandum</b> is an impersonal passive periphrastic.","<b>Hannibalem ... praestitisse</b> is accusative + infinitive."],"source":"https://www.thelatinlibrary.com/nepos/nepos.hann.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r3","title":"In the beginning","author":"Latin Vulgate","work":"John 1:1–5","level":"Intermediate","kind":"Late / Christian Latin","text":"In principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in principio apud Deum. Omnia per ipsum facta sunt: et sine ipso factum est nihil, quod factum est. In ipso vita erat, et vita erat lux hominum: et lux in tenebris lucet, et tenebrae eam non comprehenderunt.","translation":"In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through him, and without him nothing was made that was made. In him was life, and the life was the light of human beings; and the light shines in the darkness, and the darkness did not overcome it.","gloss":{"in principio":"in the beginning","Verbum":"Word","apud":"with / in the presence of","per ipsum":"through him","facta sunt":"were made","sine ipso":"without him","nihil":"nothing","vita":"life","lux":"light","hominum":"of human beings","tenebris":"darkness","comprehenderunt":"grasped / overcame"},"notes":["The word order <b>Deus erat Verbum</b> is rhetorically marked.","<b>facta sunt</b> agrees with neuter plural <b>omnia</b>.","The final verb can mean “did not grasp,” “did not comprehend,” or “did not overcome,” depending on interpretation."],"source":"https://www.thelatinlibrary.com/bible/john.shtml","license":"Clementine Vulgate (1592), public domain. The Stuttgart critical edition is still in copyright and is deliberately not used here. Translation and notes are original.","hasMacrons":false},{"id":"r4","title":"How long, Catiline?","author":"Marcus Tullius Cicero","work":"In Catilinam 1.1","level":"Advanced prose","kind":"Oratory","text":"Quo usque tandem abutere, Catilina, patientia nostra? Quam diu etiam furor iste tuus nos eludet? Quem ad finem sese effrenata iactabit audacia?","translation":"How long, Catiline, will you abuse our patience? How much longer will that madness of yours mock us? To what limit will your unbridled audacity hurl itself?","gloss":{"quo usque":"how long / to what point","tandem":"at last / then","abutere":"will you abuse (future deponent)","patientia":"patience (abl.)","quam diu":"how long","furor":"madness","iste tuus":"that of yours","eludet":"will mock / evade","quem ad finem":"to what limit","sese":"itself","effrenata":"unbridled","iactabit":"will toss / flaunt"},"notes":["Three questions build pressure through anaphora and escalating vocabulary.","<b>abutere</b> governs the ablative <b>patientia</b>.","<b>iste</b> can carry a dismissive or hostile tone."],"source":"https://www.thelatinlibrary.com/cicero/cat1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r5","title":"Let us live and love","author":"Catullus","work":"Carmina 5.1–6","level":"Intermediate poetry","kind":"Lyric poetry","text":"Vivamus, mea Lesbia, atque amemus,\nrumoresque senum severiorum\nomnes unius aestimemus assis!\nsoles occidere et redire possunt:\nnobis cum semel occidit brevis lux,\nnox est perpetua una dormienda.","translation":"Let us live, my Lesbia, and let us love, and value all the mutterings of sterner old men at a single penny. Suns can set and return; for us, once our brief light has set, one perpetual night must be slept.","gloss":{"Vivamus":"let us live (hortatory subjunctive)","amemus":"let us love","rumores":"rumours, mutterings","senum":"of old men (gen. pl. of senex)","severiorum":"rather stern (comparative)","unius":"of a single — with assis at the line’s end","aestimemus":"let us value","assis":"an as, a penny (genitive of value)","occidere":"to set","semel":"once","brevis lux":"brief light","perpetua":"unbroken, everlasting","dormienda":"must be slept (gerundive of obligation)"},"notes":["The first three verbs are hortatory subjunctives.","<b>unius assis</b> is genitive of value.","<b>nox ... dormienda</b> is a passive periphrastic: literally, “a night must be slept.”"],"source":"https://www.thelatinlibrary.com/catullus.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r6","title":"A poem of transformations","author":"Ovid","work":"Metamorphoses 1.1–4","level":"Advanced poetry","kind":"Epic poetry","text":"In nova fert animus mutatas dicere formas\ncorpora; di, coeptis (nam vos mutastis et illas)\nadspirate meis primaque ab origine mundi\nad mea perpetuum deducite tempora carmen.","translation":"My spirit carries me to tell of forms changed into new bodies. Gods, breathe favourably upon my undertakings—for you changed those too—and draw down my continuous song from the first origin of the world to my own times.","gloss":{"In nova":"into new — agrees with corpora at the start of the next line, a famous hyperbaton","fert animus":"my spirit carries me","mutatas":"changed — agrees with formas later in the line","dicere":"to tell of","formas":"forms, shapes (object of dicere)","corpora":"bodies — the noun that In nova has been waiting for","di":"gods (vocative plural of deus)","coeptis":"undertakings (dative with adspirate); meis follows a line later","mutastis":"you have changed (syncopated for mutavistis)","illas":"those (i.e. the forms)","adspirate":"breathe upon, favour (imperative plural)","origine mundi":"the origin of the world","perpetuum":"continuous — agrees with carmen at the end of the line","deducite":"draw down, spin out (imperative plural)","tempora":"times; ad mea ... tempora, down to my own day","carmen":"song, poem (object of deducite)"},"notes":["The hyperbaton separates <b>mutatas ... formas</b> around <b>dicere</b>.","<b>fert animus</b> takes a complementary infinitive.","The poem announces continuous history from creation to Ovid’s present."],"source":"https://www.thelatinlibrary.com/ovid/ovid.met1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r7","title":"Arms and the man","author":"Vergil","work":"Aeneid 1.1–7","level":"Advanced poetry","kind":"Epic poetry","text":"Arma virumque cano, Troiae qui primus ab oris\nItaliam, fato profugus, Laviniaque venit\nlitora, multum ille et terris iactatus et alto\nvi superum saevae memorem Iunonis ob iram;\nmulta quoque et bello passus, dum conderet urbem,\ninferretque deos Latio, genus unde Latinum,\nAlbanique patres, atque altae moenia Romae.","translation":"I sing of arms and the man who first came from the shores of Troy to Italy and the Lavinian coast, an exile by fate, much tossed on land and sea by the power of the gods because of the mindful anger of savage Juno; and who suffered many things also in war, until he could found a city and bring his gods into Latium—from which came the Latin race, the Alban fathers, and the walls of lofty Rome.","gloss":{"arma virumque":"arms and the man","cano":"I sing","Troiae":"of Troy — with ab oris at the line’s end","ab oris":"from the shores","fato profugus":"an exile by fate","litora":"shores (n. pl., object of venit)","iactatus":"tossed about","alto":"the deep sea (abl.)","vi superum":"by the power of the gods above","memorem":"unforgetting — agrees with iram at the line’s end","ob iram":"because of the anger","passus":"having suffered (perfect participle of the deponent patior)","dum conderet":"until he could found (dum with the subjunctive, of purpose)","inferret":"might bring in","unde":"from which source","moenia":"city walls"},"notes":["The object <b>virum</b> is the antecedent of <b>qui</b>, whose clause runs through <b>inferret</b>.","<b>fato</b>, <b>terris</b>, <b>alto</b> and <b>vi</b> are ablatives with different functions.","The subject of <b>venit</b> and <b>passus</b> is held across several lines."],"source":"https://www.thelatinlibrary.com/vergil/aen1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r8","title":"Seize the day","author":"Horace","work":"Odes 1.11","level":"Advanced poetry","kind":"Lyric poetry","text":"Tu ne quaesieris—scire nefas—quem mihi, quem tibi\nfinem di dederint, Leuconoe, nec Babylonios\ntemptaris numeros. ut melius, quidquid erit, pati!\nseu pluris hiemes seu tribuit Iuppiter ultimam,\nquae nunc oppositis debilitat pumicibus mare\nTyrrhenum: sapias, vina liques, et spatio brevi\nspem longam reseces. dum loquimur, fugerit invida\naetas: carpe diem, quam minimum credula postero.","translation":"Do not ask — it is forbidden to know — what end the gods have assigned to me or to you, Leuconoe, and do not meddle with Babylonian calculations. How much better to endure whatever comes, whether Jupiter has allotted us more winters or this is the last, which now wears down the Tyrrhenian sea on the pumice rocks that face it. Be wise, strain the wine, and cut back long hope into a short span. While we speak, envious time will already have fled: seize the day, trusting as little as possible in tomorrow.","gloss":{"ne quaesieris":"do not ask (perfect subjunctive in a prohibition)","scire nefas":"it is forbidden to know","dederint":"have assigned (perfect subjunctive in an indirect question)","Leuconoe":"Leuconoe (vocative, a Greek name)","Babylonios":"Babylonian — agrees with numeros in the next line","temptaris":"do not try (syncopated for temptaveris)","numeros":"calculations, horoscopes","pluris hiemes":"more winters","tribuit":"has allotted","oppositis":"set against it (with pumicibus)","debilitat":"wears down","pumicibus":"pumice rocks (abl.)","sapias":"be wise (jussive subjunctive)","liques":"strain, filter","spatio brevi":"within a short span","spem longam":"long-reaching hope","reseces":"prune back","fugerit":"will have fled (future perfect)","invida":"envious — agrees with aetas at the start of the next line","aetas":"time, the passing of life","credula":"trusting (f. sg., addressed to Leuconoe)","postero":"to tomorrow (dative)"},"notes":["The poem opens with prohibitive perfect subjunctives.","<b>fugerit</b> is formally future perfect or perfect subjunctive; context gives the famous sense of time already slipping away.","<b>quam minimum credula</b> addresses Leuconoe: “trusting as little as possible.”"],"source":"https://www.thelatinlibrary.com/horace/carm1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r9","title":"The restless heart","author":"Augustine of Hippo","work":"Confessions 1.1","level":"Advanced prose","kind":"Late / Christian Latin","text":"Magnus es, Domine, et laudabilis valde: magna virtus tua, et sapientiae tuae non est numerus. Et laudare te vult homo, aliqua portio creaturae tuae; et homo circumferens mortalitatem suam, circumferens testimonium peccati sui.","translation":"Great are you, Lord, and greatly worthy of praise; great is your power, and of your wisdom there is no number. A human being wishes to praise you, some small portion of your creation—a human being carrying about his mortality and the testimony of his sin.","gloss":{"magnus es":"great are you","Domine":"Lord (voc.)","laudabilis valde":"greatly worthy of praise","virtus":"power / excellence","sapientiae tuae":"of your wisdom","non est numerus":"there is no number","laudare te":"to praise you","aliqua portio":"some portion","creaturae tuae":"of your creation","circumferens":"carrying around","mortalitatem":"mortality","testimonium":"testimony"},"notes":["The opening balances parallel clauses around repeated <b>magnus/magna</b>.","<b>laudare te vult homo</b> places the infinitive phrase first for emphasis.","The present participle <b>circumferens</b> agrees with <b>homo</b>."],"source":"https://www.thelatinlibrary.com/augustine/conf1.shtml","license":"Late-antique text, public domain. Translation and notes are original.","hasMacrons":false},{"id":"r10","title":"Judgment by peers","author":"Magna Carta","work":"Clause 39 (1215)","level":"Intermediate","kind":"Medieval legal Latin","text":"Nullus liber homo capiatur vel imprisonetur aut disseisiatur aut utlagetur aut exuletur aut aliquo modo destruatur, nec super eum ibimus nec super eum mittemus, nisi per legale iudicium parium suorum vel per legem terrae.","translation":"No free man shall be seized or imprisoned, dispossessed, outlawed, exiled or in any way destroyed; nor shall we proceed against him or send against him, except by the lawful judgment of his peers or by the law of the land.","gloss":{"Nullus liber homo":"no free man","capiatur":"shall be seized (jussive subjunctive)","imprisonetur":"shall be imprisoned (medieval Latin)","disseisiatur":"shall be dispossessed of his holding (feudal legal term)","utlagetur":"shall be outlawed","exuletur":"shall be exiled","destruatur":"shall be ruined","nec super eum ibimus":"nor shall we proceed against him","nisi":"except","legale iudicium":"lawful judgement","parium suorum":"of his peers","legem terrae":"the law of the land"},"notes":["The repeated present subjunctives have prescriptive force.","Several terms are medieval Latinisations of legal vocabulary rather than classical usage.","<b>nisi</b> introduces the limiting exception."],"source":"https://www.thelatinlibrary.com/magnacarta.html","license":"Medieval text, public domain. Translation and notes are original.","hasMacrons":false},{"id":"r11","title":"Quantity of matter","author":"Isaac Newton","work":"Principia, Definition I","level":"Advanced prose","kind":"Neo-Latin science","text":"Quantitas materiae est mensura eiusdem orta ex illius densitate et magnitudine conjunctim.","translation":"The quantity of matter is a measure of the same arising jointly from its density and magnitude.","gloss":{"quantitas materiae":"quantity of matter","mensura":"measure","eiusdem":"of the same","orta":"arising","illius":"of it / its","densitate":"density","magnitudine":"magnitude / volume","conjunctim":"jointly"},"notes":["<b>orta</b> is a perfect participle agreeing with <b>mensura</b>, but with active sense because <b>orior</b> is deponent.","Newton’s <b>magnitudo</b> here refers to bulk or volume.","Scientific Neo-Latin often uses compact nominal definitions."],"source":"https://la.wikisource.org/wiki/Philosophiae_Naturalis_Principia_Mathematica/Definitiones","license":"Newton’s 1687 Latin text is public domain. Translation and notes are original.","hasMacrons":false},{"id":"r12","title":"One man on the bridge","author":"Livy","work":"Ab Urbe Condita 2.10","level":"Advanced prose","kind":"History","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/livy/liv.2.shtml","text":"Cum hostes adessent, pro se quisque in urbem ex agris demigrant; urbem ipsam saepiunt praesidiis. Alia muris, alia Tiberi obiecto videbantur tuta: pons sublicius iter paene hostibus dedit, ni unus vir fuisset, Horatius Cocles; id munimentum illo die fortuna urbis Romanae habuit.","translation":"When the enemy drew near, everyone for himself moved into the city from the countryside; they fenced the city itself about with garrisons. Some parts seemed safe behind the walls, others behind the barrier of the Tiber. The pile bridge almost gave the enemy a way in, had there not been one man, Horatius Cocles; that was the defence which the fortune of Rome had on that day.","gloss":{"adessent":"were at hand (imperfect subjunctive after cum)","pro se quisque":"each man for himself","demigrant":"move away (historic present)","saepiunt":"fence in, protect","praesidiis":"with garrisons (ablative of means)","Alia":"some parts ... others — the word appears twice, correlating two halves of the defences","Tiberi obiecto":"the Tiber having been set in the way (ablative absolute)","tuta":"safe (n. pl., agreeing with alia)","pons sublicius":"the pile bridge, Rome's oldest","ni":"if not (archaic for nisi)","fuisset":"there had been (pluperfect subjunctive)","munimentum":"defence, fortification","illo die":"on that day (ablative of time when)"},"notes":["The historic presents <b>demigrant</b> and <b>saepiunt</b> sit beside past tenses without apology. Livy switches into the present at moments of urgency; translate them as past unless you want the same effect in English.","<b>ni unus vir fuisset</b> is an unreal condition with its main clause left as the plain indicative <b>dedit</b>. Latin allows this when the point is that the thing very nearly happened: the bridge <i>did</i> almost let them in.","The last clause is Livy's epitaph on the episode, with <b>id munimentum</b> — one man — placed emphatically first and <b>fortuna urbis Romanae</b> as the subject that follows."],"hasMacrons":false},{"id":"r13","title":"The wolf and the lamb","author":"Phaedrus","work":"Fabulae 1.1.1–4","level":"Intermediate poetry","kind":"Fable","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/phaedrus1.html","text":"Ad rivum eundem lupus et agnus venerant,\nsiti compulsi. Superior stabat lupus,\nlongeque inferior agnus. Tunc fauce improba\nlatro incitatus iurgii causam intulit.","translation":"A wolf and a lamb had come to the same stream, driven by thirst. The wolf was standing higher up, and the lamb a long way below. Then the brigand, spurred on by his shameless gullet, produced a pretext for a quarrel.","gloss":{"rivum":"stream (acc. after Ad)","eundem":"the same (accusative of īdem)","agnus":"lamb","venerant":"had come (pluperfect)","siti":"by thirst (ablative of sitis)","compulsi":"driven (perfect participle, nom. pl., with lupus et agnus)","Superior":"higher up (comparative used of position on the bank)","longe":"far, by a long way","inferior":"lower down","fauce improba":"by his shameless gullet (ablative of cause)","latro":"brigand, robber — the wolf","incitatus":"spurred on","iurgii":"of a quarrel (genitive)","intulit":"brought forward, produced"},"notes":["Phaedrus writes iambic senarii, a conversational metre far easier on the ear than hexameter. Read it aloud and the rhythm carries you.","The whole moral is planted in one word: calling the wolf <b>latro</b> before he has said anything decides the fable in advance. Notice also <b>Superior</b> and <b>inferior</b> doing double duty for physical position and for power.","<b>compulsi</b> is masculine plural because <b>lupus et agnus</b> together are its subject. When a participle serves two nouns of different gender, Latin takes the masculine."],"hasMacrons":false},{"id":"r14","title":"I do not love you","author":"Martial","work":"Epigrammata 1.32","level":"Intermediate poetry","kind":"Epigram","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/martial/mart1.shtml","text":"Non amo te, Sabidi, nec possum dicere quare:\nhoc tantum possum dicere, non amo te.","translation":"I do not love you, Sabidius, and I cannot say why. This much only I can say: I do not love you.","gloss":{"Sabidi":"Sabidius (vocative of Sabidius)","nec":"and not","possum":"I am able","quare":"why","hoc tantum":"this much only","non amo te":"I do not love you — repeated verbatim as the whole point"},"notes":["Two lines: a hexameter and a pentameter, the elegiac couplet. Martial uses the pentameter's built-in break to land the joke.","The vocative of second-declension names in <b>-ius</b> contracts to a single <b>-ī</b>: <b>Sabidius → Sabidī</b>, <b>Vergilius → Vergilī</b>. Nothing else in the language does this.","This is the shortest complete Latin poem in the Reading Room, and worth memorising: it is the ancestor of the English rhyme \"I do not love thee, Doctor Fell.\""],"hasMacrons":false},{"id":"r15","title":"Claim yourself for yourself","author":"Seneca","work":"Epistulae Morales 1.1","level":"Advanced prose","kind":"Letters","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/sen/seneca.ep1.shtml","text":"Ita fac, mi Lucili: vindica te tibi, et tempus quod adhuc aut auferebatur aut subripiebatur aut excidebat collige et serva. Persuade tibi hoc sic esse ut scribo: quaedam tempora eripiuntur nobis, quaedam subducuntur, quaedam effluunt.","translation":"Do just that, my dear Lucilius: claim yourself for yourself, and gather and keep the time that until now was being taken from you, or stolen from you, or slipping away. Convince yourself that it is as I write: some periods of time are snatched from us, some are quietly removed, some simply drain away.","gloss":{"Ita fac":"do so, carry on as you are (imperative of faciō)","mi Lucili":"my dear Lucilius (vocative)","vindica te tibi":"claim yourself for yourself — reflexive accusative and dative together","adhuc":"until now","auferebatur":"was being carried off","subripiebatur":"was being stolen from underneath","excidebat":"was slipping away, falling out","collige":"gather up (imperative)","Persuade tibi":"persuade yourself (persuādeō takes the dative)","quaedam":"certain ones, some (n. pl. of quīdam)","eripiuntur":"are snatched away","subducuntur":"are quietly withdrawn","effluunt":"flow away"},"notes":["Three imperfect passives in a row — <b>auferebatur, subripiebatur, excidebat</b> — then three presents in a row: <b>eripiuntur, subducuntur, effluunt</b>. Seneca argues by triad, and the escalation from violent theft to silent draining is the argument.","<b>persuādeō</b> takes the dative of the person, then an indirect statement for the content: <b>persuade tibi hoc sic esse</b>. Many Latin verbs of speaking and influencing take the dative where English takes an object.","<b>vindica te tibi</b> is untranslatable in a phrase: reclaim yourself, as one reclaims stolen property, and hand yourself back to yourself. Seneca's Latin is at its best when it is at its plainest."],"hasMacrons":false},{"id":"r16","title":"A cloud over the bay","author":"Pliny the Younger","work":"Epistulae 6.16","level":"Advanced prose","kind":"Letters","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/pliny.ep6.html","text":"Erat Miseni classemque imperio praesens regebat. Nonum kal. Septembres hora fere septima mater mea indicat ei apparere nubem inusitata et magnitudine et specie.","translation":"He was at Misenum, in personal command of the fleet. On the twenty-fourth of August, at about the seventh hour, my mother pointed out to him that a cloud was appearing, unusual in both size and shape.","gloss":{"Miseni":"at Misenum (locative)","classem":"fleet (acc.)","imperio praesens":"present in command, holding command in person","regebat":"was commanding","Nonum kal. Septembres":"the ninth day before the Kalends of September, i.e. 24 August","hora fere septima":"at about the seventh hour — roughly one in the afternoon","indicat":"points out (historic present)","ei":"to him (dative of is)","apparere":"to be appearing (infinitive in indirect statement)","nubem":"cloud (accusative subject of apparere)","inusitata":"unusual (ablative, with magnitudine and specie)","magnitudine":"in size (ablative of respect)","specie":"in appearance (ablative of respect)"},"notes":["The subject of <b>Erat</b> and <b>regebat</b> is Pliny the Elder, named earlier in the letter. Latin drops a subject the moment it is established, sometimes for several sentences.","Roman dates count backwards and inclusively from three fixed points. <b>Nonum kal. Septembres</b> is the ninth day before 1 September counted inclusively, which lands on 24 August 79 — the eruption of Vesuvius.","This is the earliest eyewitness account of a volcanic eruption in any literature. The clinical register — a naval command, a date, an hour, a cloud of unusual size — is what makes the rest of the letter land."],"hasMacrons":false},{"id":"r17","title":"They make a desert","author":"Tacitus","work":"Agricola 30","level":"Advanced prose","kind":"History","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/tacitus/tac.agri.shtml","text":"Raptores orbis, postquam cuncta vastantibus defuere terrae, mare scrutantur: auferre trucidare rapere falsis nominibus imperium, atque ubi solitudinem faciunt, pacem appellant.","translation":"Plunderers of the world, now that the earth has run out for them in their universal devastation, they ransack the sea. To steal, to slaughter, to seize under false names they call empire; and where they make a wilderness, they call it peace.","gloss":{"Raptores orbis":"plunderers of the world (in apposition to the unexpressed subject)","postquam":"after, now that","cuncta":"everything (n. pl.)","vastantibus":"for those laying waste (dative with defuere)","defuere":"have run out, failed (= defuerunt)","scrutantur":"they ransack (deponent)","auferre":"to carry off","trucidare":"to butcher","rapere":"to seize","falsis nominibus":"with false names (ablative of means)","imperium":"empire (predicate accusative with appellant)","solitudinem":"a wilderness, a desert","appellant":"they call"},"notes":["The three bare infinitives <b>auferre trucidare rapere</b>, with no connectives at all, are the objects of <b>appellant</b>: they call stealing, butchering and seizing by the name of empire. Asyndeton makes them land like blows.","Tacitus puts this in the mouth of Calgacus, a British chieftain, addressing his army before a battle against Rome. The most quoted denunciation of Roman imperialism was written by a Roman senator and consul.","<b>defuere</b> is the alternative third-plural perfect for <b>defuerunt</b>. Tacitus uses the short form constantly; do not read it as an infinitive."],"hasMacrons":false},{"id":"r18","title":"These studies","author":"Marcus Tullius Cicero","work":"Pro Archia 16","level":"Advanced prose","kind":"Oratory","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/cicero/arch.shtml","text":"Nam ceterae neque temporum sunt neque aetatum omnium neque locorum; at haec studia adulescentiam alunt, senectutem oblectant, secundas res ornant, adversis perfugium ac solacium praebent, delectant domi, non impediunt foris, pernoctant nobiscum, peregrinantur, rusticantur.","translation":"Other pursuits belong neither to every occasion, nor to every time of life, nor to every place; but these studies nourish youth and delight old age, they adorn prosperity and offer a refuge and a consolation in adversity, they are a pleasure at home and no hindrance abroad, they spend the night with us, they travel with us, they go with us into the country.","gloss":{"ceterae":"the other (pursuits) — feminine, with an understood artēs","temporum":"of all occasions (genitive of characteristic)","aetatum":"of ages, of times of life","at":"but","adulescentiam":"youth (acc.)","alunt":"they nourish","senectutem":"old age (acc.)","oblectant":"they delight","secundas res":"prosperity, favourable circumstances","adversis":"in adversity (dative with praebent)","perfugium":"refuge","solacium":"consolation","domi":"at home (locative)","foris":"out of doors, abroad","pernoctant":"they spend the night","peregrinantur":"they travel abroad (deponent)","rusticantur":"they go to the country (deponent)"},"notes":["Nine verbs in a row, all third person plural, all with <b>haec studia</b> as their subject. The accumulation is the argument: literature is defended by simply listing everywhere it goes with you.","Cicero pairs his clauses — youth against old age, prosperity against adversity, home against abroad — and then abandons the pairing for three bare verbs at the end. The break in the pattern is deliberate.","The genitives <b>temporum</b>, <b>aetatum</b>, <b>locorum</b> are genitives of characteristic: other pursuits are not \"of\" all times, ages and places. English needs a whole clause where Latin needs a case."],"hasMacrons":false},{"id":"r19","title":"I think, therefore I am","author":"René Descartes","work":"Principia Philosophiae 1.7 (1644)","level":"Advanced prose","kind":"Neo-Latin philosophy","license":"Descartes’ 1644 Latin text is public domain. Translation and notes are original.","source":"https://la.wikisource.org/wiki/Principia_philosophiae","text":"Sic autem rejicientes illa omnia, de quibus aliquo modo possumus dubitare, ac etiam falsa esse fingentes, facile quidem supponimus nullum esse Deum, nullum coelum, nulla corpora; nosque etiam ipsos non habere manus, nec pedes, nec denique ullum corpus; non autem ideo nos qui talia cogitamus nihil esse: repugnat enim ut putemus id quod cogitat eo ipso tempore quo cogitat non existere. Ac proinde haec cognitio, ego cogito, ergo sum, est omnium prima et certissima.","translation":"Rejecting in this way everything about which we can in any manner doubt, and even pretending that it is false, we readily suppose that there is no God, no heaven, no bodies; and that we ourselves have no hands, no feet, indeed no body at all — but not, for all that, that we who think such things are nothing. For it is self-contradictory to suppose that what thinks does not, at the very time when it is thinking, exist. And therefore this knowledge, I think therefore I am, is the first and most certain of all.","gloss":{"rejicientes":"rejecting (present participle, agreeing with the subject of supponimus)","aliquo modo":"in any way","dubitare":"to doubt","fingentes":"pretending, imagining","supponimus":"we suppose, we assume","nullum esse Deum":"that there is no God (indirect statement)","coelum":"heaven, the sky (later spelling of caelum)","nosque etiam ipsos":"and that we ourselves (accusative subject)","denique":"finally, in short","non autem ideo":"but not for that reason","talia":"such things (n. pl.)","repugnat":"it is self-contradictory, it clashes","ut putemus":"that we should suppose (substantive clause with the subjunctive)","eo ipso tempore quo":"at the very time at which","existere":"to exist","Ac proinde":"and therefore","cognitio":"piece of knowledge, cognition","certissima":"most certain (superlative)"},"notes":["The whole passage is one long chain of indirect statements after <b>supponimus</b>: <b>nullum esse Deum</b>, <b>nos non habere manus</b>, and then the crucial <b>non ... nos ... nihil esse</b>. Track the accusative-and-infinitive pattern and the argument becomes plain.","Descartes writes classical Latin three centuries after the fact, and it is very close to Cicero's — the visible differences are the spelling <b>coelum</b> for <b>caelum</b>, <b>rejicientes</b> for <b>reicientes</b>, and a vocabulary of philosophical abstractions.","Note that the famous formula is quoted in Latin inside a Latin sentence — <b>haec cognitio, ego cogito, ergo sum, est omnium prima</b>. The subject of <b>est</b> is <b>cognitio</b>, and everything between the commas is in apposition to it."],"hasMacrons":false}];
const PARADIGMS=[{"id":"puella","name":"puella, puellae — first declension","headers":["Case","Singular","Plural"],"rows":[["Nom.","puella","puellae"],["Gen.","puellae","puellārum"],["Dat.","puellae","puellīs"],["Acc.","puellam","puellās"],["Abl.","puellā","puellīs"],["Voc.","puella","puellae"]]},{"id":"servus","name":"servus, servī — second declension masculine","headers":["Case","Singular","Plural"],"rows":[["Nom.","servus","servī"],["Gen.","servī","servōrum"],["Dat.","servō","servīs"],["Acc.","servum","servōs"],["Abl.","servō","servīs"],["Voc.","serve","servī"]]},{"id":"bellum","name":"bellum, bellī — second declension neuter","headers":["Case","Singular","Plural"],"rows":[["Nom.","bellum","bella"],["Gen.","bellī","bellōrum"],["Dat.","bellō","bellīs"],["Acc.","bellum","bella"],["Abl.","bellō","bellīs"],["Voc.","bellum","bella"]]},{"id":"rex","name":"rēx, rēgis — third declension masculine","headers":["Case","Singular","Plural"],"rows":[["Nom.","rēx","rēgēs"],["Gen.","rēgis","rēgum"],["Dat.","rēgī","rēgibus"],["Acc.","rēgem","rēgēs"],["Abl.","rēge","rēgibus"],["Voc.","rēx","rēgēs"]]},{"id":"nomen","name":"nōmen, nōminis — third declension neuter","headers":["Case","Singular","Plural"],"rows":[["Nom.","nōmen","nōmina"],["Gen.","nōminis","nōminum"],["Dat.","nōminī","nōminibus"],["Acc.","nōmen","nōmina"],["Abl.","nōmine","nōminibus"],["Voc.","nōmen","nōmina"]]},{"id":"qui","name":"quī, quae, quod — relative pronoun singular","headers":["Case","Masculine","Feminine","Neuter"],"rows":[["Nom.","quī","quae","quod"],["Gen.","cuius","cuius","cuius"],["Dat.","cui","cui","cui"],["Acc.","quem","quam","quod"],["Abl.","quō","quā","quō"]]},{"id":"amo","name":"amō — present system active","headers":["Person","Present","Imperfect","Future"],"rows":[["1 sg.","amō","amābam","amābō"],["2 sg.","amās","amābās","amābis"],["3 sg.","amat","amābat","amābit"],["1 pl.","amāmus","amābāmus","amābimus"],["2 pl.","amātis","amābātis","amābitis"],["3 pl.","amant","amābant","amābunt"]]},{"id":"rego a"],["Gen.","fortis","fortis","fortium","fortium"],["Dat.","fortī","fortī","fortibus","fortibus"],["Acc.","fortem","forte","fortēs","fortia"],["Abl.","fortī","fortī","fortibus","fortibus"]]},{"id":"fortior","name":"fortior, fortius — comparative adjective","headers":["Case","M./F. sg.","N. sg.","M./F. pl.","N. pl."],"rows":[["Nom.","fortior","fortius","fortiōrēs","fortiōra"],["Gen.","fortiōris","fortiōris","fortiōrum","fortiōrum"],["Dat.","fortiōrī","fortiōrī","fortiōribus","fortiōribus"],["Acc.","fortiōrem","fortius","fortiōrēs","fortiōra"],["Abl.","fortiōre","fortiōre","fortiōribus","fortiōribus"]]},{"id":"is","name":"is, ea, id — he, she, it / that","headers":["Case","M. sg.","F. sg.","N. sg.","M. pl.","F. pl.","N. pl."],"rows":[["Nom.","is","ea","id","eī / iī","eae","ea"],["Gen.","eius","eius","eius","eōrum","eārum","eōrum"],["Dat.","eī","eī","eī","eīs","eīs","eīs"],["Acc.","eum","eam","id","eōs","eās","ea"],["Abl.","eō","eā","eō","eīs","eīs","eīs"]]},{"id":"hic","name":"hic, haec, hoc — this","headers":["Case","M. sg.","F. sg.","N. sg.","M. pl.","F. pl.","N. pl."],"rows":[["Nom.","hic","haec","hoc","hī","hae","haec"],["Gen.","huius","huius","huius","hōrum","hārum","hōrum"],["Dat.","huic","huic","huic","hīs","hīs","hīs"],["Acc.","hunc","hanc","hoc","hōs","hās","haec"],["Abl.","hōc","hāc","hōc","hīs","hīs","hīs"]]},{"id":"ille","name":"ille, illa, illud — that","headers":["Case","M. sg.","F. sg.","N. sg.","M. pl.","F. pl.","N. pl."],"rows":[["Nom.","ille","illa","illud","illī","illae","illa"],["Gen.","illīus","illīus","illīus","illōrum","illārum","illōrum"],["Dat.","illī","illī","illī","illīs","illīs","illīs"],["Acc.","illum","illam","illud","illōs","illās","illa"],["Abl.","illō","illā","illō","illīs","illīs","illīs"]]},{"id":"quiplural","name":"quī, quae, quod — relative pronoun plural","headers":["Case","Masculine","Feminine","Neuter"],"rows":[["Nom.","quī","quae","quae"],["Gen.","quōrum","quārum","quōrum"],["Dat.","quibus","quibus","quibus"],["Acc.","quōs","qu 3 pl.","ament","amārent","amāverint","amāvissent"]]},{"id":"regosubj","name":"regō — subjunctive active","headers":["Person","Present","Imperfect","Perfect","Pluperfect"],"rows":[["1 sg.","regam","regerem","rēxerim","rēxissem"],["2 sg.","regās","regerēs","rēxerīs","rēxissēs"],["3 sg.","regat","regeret","rēxerit","rēxisset"],["1 pl.","regāmus","regerēmus","rēxerīmus","rēxissēmus"],["2 pl.","regātis","regerētis","rēxerītis","rēxissētis"],["3 pl.","regant","regerent","rēxerint","rēxissent"]]},{"id":"sumsubj","name":"sum, possum — subjunctive","headers":["Person","sum pres.","sum imperf.","possum pres.","possum imperf."],"rows":[["1 sg.","sim","essem","possim","possem"],["2 sg.","sīs","essēs","possīs","possēs"],["3 sg.","sit","esset","possit","posset"],["1 pl.","sīmus","essēmus","possīmus","possēmus"],["2 pl.","sītis","essētis","possītis","possētis"],["3 pl.","sint","essent","possint","possent"]]},{"id":"sequor","name":"sequor — deponent, indicative","headers":["Person","Present","Imperfect","Future","Perfect"],"rows":[["1 sg.","sequor","sequēbar","sequar","secūtus sum"],["2 sg.","sequeris","sequēbāris","sequēris","secūtus es"],["3 sg.","sequitur","sequēbātur","sequētur","secūtus est"],["1 pl.","sequimur","sequēbāmur","sequēmur","secūtī sumus"],["2 pl.","sequiminī","sequēbāminī","sequēminī","secūtī estis"],["3 pl.","sequuntur","sequēbantur","sequentur","secūtī sunt"]]},{"id":"eofero","name":"eō, ferō, volō — irregular verbs, present","headers":["Person","eō (go)","ferō (carry)","volō (wish)","nōlō (not wish)"],"rows":[["1 sg.","eō","ferō","volō","nōlō"],["2 sg.","īs","fers","vīs","nōn vīs"],["3 sg.","it","fert","vult","nōn vult"],["1 pl.","īmus","ferimus","volumus","nōlumus"],["2 pl.","ītis","fertis","vultis","nōn vultis"],["3 pl.","eunt","ferunt","volunt","nōlunt"]]},{"id":"participles","name":"Participles of amō and sequor","headers":["Participle","amō (regular)","sequor (deponent)","Force"],"rows":[["Present active","amāns, amantis","sequēns, sequentis","simultaneous const REFS=[{"title":"Case functions at a glance","body":"<table class=\"gr\"><tr><th>Case</th><th>Core function</th><th>Example</th></tr>\n<tr><td>Nominative</td><td>subject / predicate</td><td><b>Caesar</b> dux est.</td></tr>\n<tr><td>Accusative</td><td>direct object; motion toward</td><td>urbem videt; Rōmam venit</td></tr>\n<tr><td>Genitive</td><td>possession / description</td><td>liber <b>Caesaris</b></td></tr>\n<tr><td>Dative</td><td>indirect object; reference; agent with gerundive</td><td>puellae dat; mihi faciendum est</td></tr>\n<tr><td>Ablative</td><td>means, manner, separation, circumstance</td><td>gladiō; cum amīcō; ab urbe</td></tr>\n<tr><td>Vocative</td><td>direct address</td><td>Salvē, Marce!</td></tr></table>"},{"title":"Personal endings","body":"<table class=\"gr\"><tr><th>Person</th><th>Active</th><th>Passive</th></tr>\n<tr><td>1 sg.</td><td>-ō / -m</td><td>-r</td></tr><tr><td>2 sg.</td><td>-s</td><td>-ris</td></tr>\n<tr><td>3 sg.</td><td>-t</td><td>-tur</td></tr><tr><td>1 pl.</td><td>-mus</td><td>-mur</td></tr>\n<tr><td>2 pl.</td><td>-tis</td><td>-minī</td></tr><tr><td>3 pl.</td><td>-nt</td><td>-ntur</td></tr></table>"},{"title":"Principal parts and stems","body":"<p>Learn verbs in four principal parts: <b>scrībō, scrībere, scrīpsī, scrīptum</b>.</p>\n<table class=\"gr\"><tr><th>Part</th><th>Supplies</th></tr><tr><td>1st: scrībō</td><td>present 1st singular and dictionary headword</td></tr>\n<tr><td>2nd: scrībere</td><td>present stem and conjugation</td></tr><tr><td>3rd: scrīpsī</td><td>perfect active stem</td></tr>\n<tr><td>4th: scrīptum</td><td>perfect passive participle and future active participle</td></tr></table>"},{"title":"Subjunctive sequence","body":"<table class=\"gr\"><tr><th>Main verb</th><th>Same/later time</th><th>Prior time</th></tr>\n<tr><td>Primary</td><td>present subjunctive</td><td>perfect subjunctive</td></tr>\n<tr><td>Historic</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table>\n<p>This is a default framework, not an iron rule. Authorial viewpoint, repraesentātiō and the independence of a clause can affect sequence.</p>"},{"title":"Reading a periodic sentence","body":"<ol><li>Circle finite verbs.</li><li>Bracket clauses introduced by relative pronouns, conjunctions and interrogatives.</li><li>Identify nominatives and accusatives from morphology.</li><li>Attach adjectives, genitives and participles to their heads.</li><li>Resolve the main clause before polishing the translation.</li></ol>"},{"title":"Classical pronunciation","body":"<table class=\"gr\"><tr><th>Spelling</th><th>Value</th></tr><tr><td>c</td><td>always hard</td></tr>\n<tr><td>g</td><td>always hard</td></tr><tr><td>v</td><td>approximately English w</td></tr>\n<tr><td>ae / oe</td><td>diphthongs</td></tr><tr><td>qu</td><td>kw</td></tr><tr><td>ti</td><td>not “sh” in restored Classical pronunciation</td></tr></table>"},{"title":"Which subjunctive clause is this?","body":"<table class=\"gr\"><tr><th>Clue in the sentence</th><th>Clause</th><th>Negative</th></tr><tr><td><b>ut</b> with no signpost before it</td><td>purpose — “in order that”</td><td><b>nē</b></td></tr><tr><td><b>tam, ita, sīc, tantus, tālis</b> then <b>ut</b></td><td>result — “so that in fact”</td><td><b>ut nōn</b></td></tr><tr><td>verb of asking, knowing, doubting + question word</td><td>indirect question</td><td><b>nōn</b></td></tr><tr><td>verb of ordering, urging, persuading + <b>ut</b></td><td>indirect command</td><td><b>nē</b></td></tr><tr><td><b>quī</b> after a negative or <b>sunt quī</b></td><td>relative of characteristic</td><td><b>nōn</b></td></tr><tr><td><b>cum</b> + subjunctive</td><td>circumstantial, causal or concessive</td><td><b>nōn</b></td></tr></table><p class=\"tip\">Read the introducing word <i>and</i> look back for a signpost before deciding. Purpose and result are told apart by what precedes <b>ut</b>, not by the subjunctive itself.</p>"},{"title":"Conditions","body":"<table class=\"gr\"><tr><th>Type</th><th>Protasis (sī…)</th><th>Apodosis</th></tr><tr><td>Simple fact</td><td>indicative</td><td>indicative</td></tr><tr><td>Future more vivid</td><td>future / future perfect</td><td>future</td></tr><tr><td>Future less vivid (“should… would”)</td><td>present subjunctive</td><td>present subjunctive</td></tr><tr><td>Present contrary to fact</td><td>imperfect subjunctive</td><td>imperfect subjunctive</td></tr><tr><td>Past contrary to fact</td><td>pluperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table>"},{"title":"Sequence of tenses","body":"<table class=\"gr\"><tr><th>Main verb</th><th>Same time as main verb</th><th>Time before main verb</th></tr><tr><td>Primary — present, future, future perfect, perfect with have</td><td>present subjunctive</td><td>perfect subjunctive</td></tr><tr><td>Secondary — imperfect, perfect, pluperfect</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table><p>Subjunctive tense marks time <i>relative</i> to the main verb, never absolute time. This is the single rule behind most reported speech in Latin prose.</p>"},{"title":"A reading procedure for long sentences","body":"<ol><li>Read to the full stop before translating anything.</li><li>Mark every finite verb. Each one is a clause.</li><li>Mark the words that introduce clauses: <b>ut, nē, cum, sī, quī, quod, quam</b>, question words.</li><li>Find the one main verb that is not inside any subordinate clause.</li><li>Attach the nominative to it, then the accusative, then everything else.</li><li>Only now put it into English — and in English word order, not Latin.</li></ol><p class=\"tip\">If you are stuck, you have almost always mis-identified a case ending or missed a clause boundary. Go back to step 2 rather than guessing at vocabulary.</p>"}];
"use strict";
/* ------------------------------------------------------------------ store */
const KEY = "lingua-latina-progress-v1";
const defaults = {
  completed: {}, scores: {}, readingDone: {}, cards: {}, extraCards: {},
  settings: { theme: "system", macrons: true, direction: "mix", cardScope: "reached" },
  activity: []
};
const store = {
  data: null, memOnly: false,
  load() {
    try {
      this.data = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || "{}"));
      this.data.settings = Object.assign({}, defaults.settings, this.data.settings || {});
      ["completed", "scores", "readingDone", "cards", "extraCards"].forEach(k => {
        if (!this.data[k] || typeof this.data[k] !== "object") this.data[k] = {};
      });
      if (!Array.isArray(this.data.activity)) this.data.activity = [];
    } catch (e) { this.data = JSON.parse(JSON.stringify(defaults)); this.memOnly = true; }
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; } }
};
store.load();

/* ------------------------------------------------------------- utilities */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LET = "A-Za-z\\u00C0-\\u00D6\\u00D8-\\u00F6\\u00F8-\\u024F";
function stripMacrons(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").normalize("NFC"); }
function norm(s) { return stripMacrons(String(s).toLowerCase()).replace(/[.,;:!?“”"'’—–()\[\]]/g, "").replace(/\s+/g, " ").trim(); }
function shuffled(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function route() { return location.hash.replace(/^#\/?/, "") || "home"; }
function go(r) { location.hash = "#/" + r; }
function allUnits() { return COURSE.flatMap(l => l.units.map(u => ({ ...u, level: l }))); }
function unit(id) { return allUnits().find(u => u.id === id); }
function reading(id) { return READINGS.find(r => r.id === id); }
function doneLevel(l) { return l.units.filter(u => store.data.completed[u.id]).length; }
function applyTheme() {
  let t = store.data.settings.theme;
  if (t === "system") t = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
}
function activity(type, id, extra) {
  store.data.activity.unshift(Object.assign({ type, id, at: Date.now() }, extra || {}));
  store.data.activity = store.data.activity.slice(0, 40);
}
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
}

/* ------------------------------------------------------- course sequence */
// Units the learner has actually reached: everything completed, plus the next one.
function reachedUnitIds() {
  const ids = [];
  for (const u of allUnits()) { ids.push(u.id); if (!store.data.completed[u.id]) break; }
  return ids;
}
function nextUnitRoute() {
  const u = allUnits().find(x => !store.data.completed[x.id]);
  return u ? "unit/" + u.id + "/lesson" : "readings";
}

/* ------------------------------------------------------------ flashcards */
function allCards() {
  const scope = store.data.settings.cardScope || "reached";
  const reach = new Set(reachedUnitIds());
  const c = [];
  allUnits().forEach(u => {
    if (scope === "all" || reach.has(u.id))
      u.vocab.forEach((v, i) => c.push({ id: "u:" + u.id + ":" + i, la: v[0], en: v[1], source: u.title }));
  });
  Object.entries(store.data.extraCards).forEach(([id, x]) => c.push(Object.assign({ id }, x)));
  return c;
}
function totalCourseCards() { return allUnits().reduce((n, u) => n + u.vocab.length, 0) + Object.keys(store.data.extraCards).length; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => !store.data.cards[c.id] || (store.data.cards[c.id].due || 0) <= now);
}

/* ---------------------------------------------------------------- render */
function render() {
  applyTheme();
  renderSidebar();
  const p = route().split("/");
  let out = "";
  if (p[0] === "home") out = viewHome();
  else if (p[0] === "level") out = viewLevel(p[1]);
  else if (p[0] === "unit") out = viewUnit(p[1], p[2] || "lesson");
  else if (p[0] === "quiz") out = viewQuiz(p[1]);
  else if (p[0] === "review") out = viewReview();
  else if (p[0] === "readings") out = viewReadings();
  else if (p[0] === "read") out = viewReading(p[1]);
  else if (p[0] === "flash") out = viewFlash();
  else if (p[0] === "flashrun") { startFlash(); return; }
  else if (p[0] === "reference") out = viewReference();
  else if (p[0] === "lab") out = viewLab();
  else if (p[0] === "settings") out = viewSettings();
  else out = viewHome();
  $("#main").innerHTML = (store.memOnly ? `<div class="banner">Browser storage is unavailable, so progress will not survive a reload. Export it from Settings before closing.</div>` : "") + out;
  $("#main").focus({ preventScroll: true });
}

function nav(path, ic, label, badge) {
  const a = route().split("/")[0], p = path.split("/")[0], on = a === p;
  return `<button class="navlink ${on ? "active" : ""}" ${on ? 'aria-current="page"' : ""} onclick="go('${path}')"><span class="ic" aria-hidden="true">${ic}</span>${label}${badge ? `<span class="badge">${badge}</span>` : ""}</button>`;
}
function renderSidebar() {
  const done = Object.keys(store.data.completed).length;
  $("#sidebar").innerHTML =
    `<div class="brand"><span class="seal" aria-hidden="true">L</span><div><b>Lingua Latina</b><small>Grammar → original texts</small></div></div>` +
    `<div class="navsec">Course</div>` + nav("home", "⌂", "Dashboard") +
    COURSE.map(l => nav("level/" + l.id, l.icon, l.short + " · " + l.tagline, doneLevel(l) + "/" + l.units.length)).join("") +
    nav("review", "↻", "Mixed review") +
    `<div class="navsec">Read</div>` + nav("readings", "▤", "Reading Room", Object.keys(store.data.readingDone).length + "/" + READINGS.length) +
    `<div class="navsec">Practice</div>` + nav("flash", "◫", "Flashcards", dueCards().length + " due") +
    nav("reference", "R", "Grammar reference") + nav("lab", "▦", "Morphology tables") +
    `<div class="navsec">Data</div>` + nav("settings", "⚙", "Settings", done + "/" + allUnits().length);
}

/* ------------------------------------------------------------------ home */
function viewHome() {
  const units = allUnits(), done = Object.keys(store.data.completed).length;
  const rd = Object.keys(store.data.readingDone).length, cards = allCards().length;
  const acts = store.data.activity.slice(0, 6).map(a => {
    let t = null;
    if (a.type === "unit") { const u = unit(a.id); if (u) t = `Practised <b>${esc(u.title)}</b>${a.pct != null ? ` — ${a.pct}%` : ""}`; }
    else if (a.type === "reading") { const r = reading(a.id); if (r) t = `Read <b>${esc(r.title)}</b>`; }
    else if (a.type === "flash") t = `Reviewed <b>${a.n}</b> flashcard${a.n === 1 ? "" : "s"}`;
    else if (a.type === "review") t = `Mixed review — <b>${a.pct}%</b>`;

let quiz = null;
const QUIZ_LEN = 8, REVIEW_LEN = 15;
const isChoice = e => e.t === "mcq" || e.t === "parse";
function prepare(exercises, n) {
  return shuffled(exercises).slice(0, n).map(e => {
    if (!isChoice(e)) return Object.assign({}, e);
    const order = shuffled(e.opts.map((_, i) => i));
    return Object.assign({}, e, { opts: order.map(i => e.opts[i]), a: order.indexOf(e.a) });
  });
}
function viewQuiz(id) {
  const u = unit(id);
  if (!u) return viewHome();
  quiz = { title: u.title, unitId: u.id, back: "unit/" + u.id + "/practice", kind: "unit", qs: prepare(u.exercises, QUIZ_LEN), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>${u.title}</h1><p class="sub">Practice · ${quiz.qs.length} of ${u.exercises.length} questions, drawn at random</p><div id="quizbox"></div>`;
}
function viewReview() {
  const reach = reachedUnitIds();
  const pool = allUnits().filter(u => reach.includes(u.id))
    .flatMap(u => u.exercises.map(e => Object.assign({}, e, { from: u.title })));
  if (pool.length < 4)
    return `<h1>Mixed review</h1><p class="sub">Cumulative practice across everything you have studied.</p><div class="card"><p>Complete a unit or two first — this pulls its questions from the units you have reached, in random order, so that older material keeps coming back.</p><button class="btn primary" onclick="go('${nextUnitRoute()}')">Go to the next unit</button></div>`;
  quiz = { title: "Mixed review", back: "review", kind: "review", qs: prepare(pool, REVIEW_LEN), i: 0, score: 0, answered: false };

  return `<h1>Mixed review</h1><p class="sub">${quiz.qs.length} questions drawn from the units you have reached</p><div id="quizbox"></div>`;
}
function renderQuestion() {
  if (!quiz) return;
  const box = $("#quizbox");
  if (!box) return;
  if (quiz.i >= quiz.qs.length) {
    const pct = Math.round(100 * quiz.score / quiz.qs.length);
    if (quiz.kind === "unit") {
      store.data.scores[quiz.unitId] = Math.max(store.data.scores[quiz.unitId] || 0, pct);
      if (pct >= 75) store.data.completed[quiz.unitId] = true;
      activity("unit", quiz.unitId, { pct });
    } else activity("review", null, { pct });
    store.save();
    box.innerHTML = `<div class="card" style="text-align:center;padding:35px"><div style="font-size:50px;font-weight:850">${pct}%</div><p>${quiz.score} of ${quiz.qs.length} correct.${quiz.kind === "unit" ? (pct >= 75 ? " Unit marked complete." : " Review the lesson and try again.") : ""}</p>` +
      (quiz.kind === "unit"
        ? `<button class="btn primary" onclick="go('${quiz.back}')">Back to unit</button> <button class="btn" onclick="go('review')">Mixed review</button>`
        : `<button class="btn primary" onclick="render()">Another round</button> <button class="btn" onclick="go('home')">Done</button>`) + `</div>`;
    renderSidebar();
    return;
  }
  const e = quiz.qs[quiz.i];
  quiz.answered = false;
  let controls;
  if (isChoice(e))
    controls = `<div class="opts">${e.opts.map((o, i) => `<button class="opt" type="button" onclick="answerMCQ(${i})">${o}</button>`).join("")}</div>`;
  else if (e.t === "pick")
    controls = `<div class="picksent" lang="la">${e.s.split(/\s+/).map((w, i) => `<button class="pickword" type="button" onclick="answerPick(${i})">${esc(w)}</button>`).join(" ")}</div>`;
  else
    controls = `<div class="answerrow"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="${e.t === "trans" ? "Type the new form" : "Type the missing form"}" onkeydown="if(event.key==='Enter'){event.preventDefault();answerText()}"><button class="btn primary" id="checkbtn" type="button" onclick="answerText()">Check</button></div>`;
  const label = { parse: "Parse the form", trans: "Transform", pick: "Click the word", fill: "Complete", mcq: "Choose" }[e.t] || "";
  box.innerHTML = `<div class="progress"><i style="width:${100 * quiz.i / quiz.qs.length}%"></i></div>
<div class="exercise"><span class="pill">${quiz.i + 1}/${quiz.qs.length}</span> <span class="pill acc">${label}</span>${e.from ? ` <span class="pill">${esc(e.from)}</span>` : ""}
${e.form ? `<div class="formbox" lang="la">${e.form}</div>` : ""}<p>${e.q}</p>${controls}<div id="feedback" role="status" aria-live="polite"></div></div>
<button class="btn" onclick="go('${quiz.back}')">End practice</button>`;
  setTimeout(() => { const a = $("#answer"); if (a) a.focus(); }, 0);
}
function answerMCQ(i) {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i];
  [...document.querySelectorAll(".opt")].forEach((b, j) => {
    b.disabled = true;
    if (j === e.a) b.classList.add("correct"); else if (j === i) b.classList.add("wrong");
  });
  finishAnswer(i === e.a, e);
}
function answerPick(i) {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i], words = e.s.split(/\s+/);
  const target = words.findIndex(w => norm(w) === norm(e.a));
  [...document.querySelectorAll(".pickword")].forEach((b, j) => {
    b.disabled = true;
    if (j === target) b.classList.add("correct"); else if (j === i) b.classList.add("wrong");
  });
  finishAnswer(norm(words[i]) === norm(e.a), e);
}
function answerText() {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i], input = $("#answer"), v = input ? input.value : "";
  if (!norm(v)) { const f = $("#feedback"); if (f) f.innerHTML = `<div class="feedback no">Type an answer first.</div>`; return; }
  if (input) input.disabled = true;
  const btn = $("#checkbtn"); if (btn) btn.disabled = true;

}
function finishAnswer(ok, e) {
  quiz.answered = true;

  const expected = isChoice(e) ? e.opts[e.a] : esc(Array.isArray(e.a) ? e.a[0] : e.a);
  $("#feedback").innerHTML =
    `<div class="feedback ${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite. Expected: " + expected}</div>` +
    (e.ex ? `<div class="why">${e.ex}</div>` : "") +
    `<button class="btn small" id="nextq" style="margin-top:10px" type="button" onclick="quiz.i++;renderQuestion()">Next</button>`;
  setTimeout(() => { const n = $("#nextq"); if (n) n.focus(); }, 0);
}

let aid = { gloss: false, notes: false, translation: false };
// Match gloss keys on the raw text, escaping each piece afterwards, with real
// word boundaries and tolerance for the enclitics -que, -ve and -ne.
function glossedText(r) {
  const useMacrons = store.data.settings.macrons && r.hasMacrons;
  const raw = useMacrons ? r.text : stripMacrons(r.text);
  const br = s => esc(s).replace(/\n/g, "<br>");
  if (!aid.gloss) return br(raw);
  const entries = Object.keys(r.gloss || {}).map(k => ({ key: k, disp: useMacrons ? k : stripMacrons(k) }))
    .filter(e => e.disp).sort((a, b) => b.disp.length - a.disp.length);
  if (!entries.length) return br(raw);
  const alt = entries.map(e => e.disp.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const enc = `(?:que|ve|ne)?(?![${LET}])`;
  const re = new RegExp(`(^|[^${LET}])(${alt})(?=${enc})`, "gi");
  let out = "", last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    const start = m.index + m[1].length, word = m[2];
    out += br(raw.slice(last, start));
    const hit = entries.find(e => e.disp.toLowerCase() === word.toLowerCase());
    out += `<button class="word" type="button" data-g="${esc(hit ? hit.key : word)}">${esc(word)}</button>`;
    last = start + word.length;
    if (re.lastIndex <= last) re.lastIndex = last;
  }
  return out + br(raw.slice(last));
}
function showGloss(id, key) {
  const r = reading(id);

  let g = r.gloss[key];
  if (!g) { const hit = Object.entries(r.gloss).find(([k]) => k.toLowerCase() === String(key).toLowerCase()); g = hit ? hit[1] : ""; }
  const tip = $("#glosstip");
  tip.innerHTML = g ? `<div class="glosstip"><b lang="la">${esc(key)}</b> — ${esc(g)}</div>` : "";
  clearTimeout(showGloss.t);
  showGloss.t = setTimeout(() => { tip.innerHTML = ""; }, 5000);
}
function viewReading(id) {

    : `<button class="btn small" disabled title="This text is printed as the manuscripts have it, without vowel quantities marked">Macrons</button>`;
  return `<span class="pill acc">${r.kind}</span><h1>${r.title}</h1><p class="sub">${r.author} · ${r.work} · ${r.level}</p>
<div class="aidbar">
<button class="btn small ${aid.gloss ? "on" : ""}" aria-pressed="${aid.gloss}" onclick="aid.gloss=!aid.gloss;render()">Lexical glosses</button>
<button class="btn small ${aid.notes ? "on" : ""}" aria-pressed="${aid.notes}" onclick="aid.notes=!aid.notes;render()">Notes</button>

${macronBtn}</div>
<div class="card latintext" lang="la">${glossedText(r)}</div>
${aid.gloss ? `<div class="aidbox"><b>Glossary</b><div class="vocab">${Object.entries(r.gloss).map(([k, v]) => `<div><b lang="la">${esc(k)}</b><br>${esc(v)}</div>`).join("")}</div><button class="btn small" onclick="addReadingCards('${r.id}')">Add glossary to flashcards</button></div>` : ""}
${aid.notes ? `<div class="aidbox notes"><b>Reading notes</b><ul>${r.notes.map(n => `<li>${n}</li>`).join("")}</ul></div>` : ""}

let fc = null;
function startFlash() {
  const q = shuffled(dueCards()).slice(0, 30);
  fc = { q, i: 0, reveal: false, dir: null, seen: 0, again: {} };
  renderFlash();
}
function renderFlash() {
  applyTheme(); renderSidebar();
  const m = $("#main");
  if (!fc || fc.i >= fc.q.length) {
    const n = fc ? fc.seen : 0;
    if (n) { activity("flash", null, { n }); store.save(); }
    m.innerHTML = `<div class="card" style="text-align:center;padding:35px"><h1>Review complete</h1><p>${n} card${n === 1 ? "" : "s"} reviewed.</p><button class="btn primary" onclick="go('flash')">Back</button></div>`;
    fc = null;
    return;
  }
  const c = fc.q[fc.i];
  if (!fc.dir) fc.dir = store.data.settings.direction === "mix" ? (Math.random() < .5 ? "la" : "en") : store.data.settings.direction;
  const front = fc.dir === "la" ? c.la : c.en, back = fc.dir === "la" ? c.en : c.la;
  m.innerHTML = `<div class="flashstage"><p class="sub">${fc.i + 1}/${fc.q.length} · ${esc(c.source)}</p>
<button class="flashcard" type="button" id="fcard" onclick="revealCard()"><span class="front" ${fc.dir === "la" ? 'lang="la"' : ""}>${esc(front)}</span>${fc.reveal ? `<span class="back" ${fc.dir === "en" ? 'lang="la"' : ""}>${esc(back)}</span>` : `<small style="margin-top:18px;color:var(--muted)">click, tap, or press Space to reveal</small>`}</button>
${fc.reveal ? `<div class="grades"><button type="button" onclick="grade(0)"><b>Again</b><small>1</small></button><button type="button" onclick="grade(1)"><b>Hard</b><small>2</small></button><button type="button" onclick="grade(2)"><b>Good</b><small>3</small></button><button type="button" onclick="grade(3)"><b>Easy</b><small>4</small></button></div>` : ""}
<p class="sub" style="margin-top:14px"><button class="btn small" onclick="fc=null;go('flash')">End session</button></p></div>`;
  setTimeout(() => { const b = $("#fcard"); if (b) b.focus(); }, 0);
}
function revealCard() { if (fc && !fc.reveal) { fc.reveal = true; renderFlash(); } }
function grade(g) {
  if (!fc || !fc.reveal) return;
  const c = fc.q[fc.i], old = store.data.cards[c.id] || { iv: 0, ease: 2.3 };
  const days = [1, Math.max(2, old.iv * 1.4), Math.max(4, old.iv * old.ease), Math.max(7, old.iv * (old.ease + .5))][g];
  store.data.cards[c.id] = { iv: days, ease: Math.max(1.5, Math.min(3.2, old.ease + (g - 1.5) * .1)), due: Date.now() + days * 86400000 };
  store.save();
  fc.seen++;
  // a lapse should come back before the session ends, at most twice
  if (g === 0 && (fc.again[c.id] || 0) < 2) { fc.again[c.id] = (fc.again[c.id] || 0) + 1; fc.q.push(c); }
  fc.i++; fc.reveal = false; fc.dir = null;
  renderFlash();
}

  return `<h1>Morphology tables</h1><p class="sub">${PARADIGMS.length} complete paradigms — nouns, adjectives, pronouns, all four verb systems, the subjunctive, deponents and the irregulars.</p>
<label class="visually-hidden" for="labsel">Choose a paradigm</label>
<select class="select" id="labsel" onchange="labId=this.value;render()">${PARADIGMS.map(x => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${x.name}</option>`).join("")}</select>
<div class="card labtable"><h2 style="margin-top:0" lang="la">${p.name}</h2><table class="gr"><tr>${p.headers.map(h => `<th>${h}</th>`).join("")}</tr>${p.rows.map(row => `<tr>${row.map((c, i) => i === 0 ? `<th scope="row">${c}</th>` : `<td lang="la">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function viewSettings() {
  const s = store.data.settings;
  return `<h1>Settings</h1>
<div class="card"><h2 style="margin-top:0">Appearance</h2>
<label>Theme<br><select class="select" onchange="store.data.settings.theme=this.value;store.save();render()">${["system", "light", "dark"].map(t => `<option value="${t}" ${s.theme === t ? "selected" : ""}>${t[0].toUpperCase() + t.slice(1)}</option>`).join("")}</select></label>
<p><label><input type="checkbox" ${s.macrons ? "checked" : ""} onchange="store.data.settings.macrons=this.checked;store.save();render()"> Show macrons where the text supplies them</label></p></div>
<div class="card"><h2 style="margin-top:0">Flashcards</h2>
<label>Direction<br><select class="select" onchange="store.data.settings.direction=this.value;store.save()">${[["mix", "Mixed"], ["la", "Latin → English"], ["en", "English → Latin"]].map(([v, t]) => `<option value="${v}" ${s.direction === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<label style="display:block;margin-top:12px">Deck<br><select class="select" onchange="store.data.settings.cardScope=this.value;store.save();render()">${[["reached", "Only units I have reached"], ["all", "The entire course"]].map(([v, t]) => `<option value="${v}" ${(s.cardScope || "reached") === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<p class="sub" style="margin:10px 0 0">Keeping the deck to units you have reached is what makes the interval scheduling meaningful; the whole course at once is ${totalCourseCards()} cards on day one.</p></div>
<div class="card"><h2 style="margin-top:0">Progress data</h2><p class="sub" style="margin-top:0">Progress lives in this browser only. Export it if you clear site data or move device.</p>
<button class="btn" onclick="exportData()">Export progress</button> <button class="btn" onclick="document.getElementById('importfile').click()">Import progress</button> <button class="btn" onclick="resetData()">Reset</button></div>
<div class="card"><h2 style="margin-top:0">About and sources</h2>
<p><i>Lingua Latina</i> is a reading-centred course. It does not claim conversational fluency or a CEFR level.</p>
<p>The eight controlled readings are <b>original compositions written for this app</b>, each deliberately restricted to the grammar taught up to its stage. They are not ancient texts and are not presented as such. The eleven authentic passages are transcribed from public-domain editions and are linked individually.</p>
<p>Grammar explanations, translations and learning notes were prepared for this app with AI assistance and remain under human editorial review. If you find an error in the Latin, that is a bug worth reporting.</p></div>`;
}
function exportData() {
  const b = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "lingua-latina-progress.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function resetData() {
  if (confirm("Delete all Latin-course progress on this device?")) {
    store.data = JSON.parse(JSON.stringify(defaults)); store.save(); render();
  }
}

/* ----------------------------------------------------------- wiring, PWA */
document.addEventListener("click", e => {
  const w = e.target.closest && e.target.closest(".word[data-g]");
  if (w) { const p = route().split("/"); if (p[0] === "read") showGloss(p[1], w.dataset.g); }
});
document.addEventListener("keydown", e => {
  if (!fc || route() !== "flashrun") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (!fc.reveal && (e.key === " " || e.key === "Enter")) { e.preventDefault(); revealCard(); return; }
  if (fc.reveal && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); grade(Number(e.key) - 1); }
});
$("#importfile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("shape");
      const clean = JSON.parse(JSON.stringify(defaults));
      ["completed", "scores", "readingDone", "cards", "extraCards"].forEach(k => {
        if (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) clean[k] = d[k];
      });
      if (d.settings && typeof d.settings === "object") clean.settings = Object.assign({}, defaults.settings, d.settings);
      if (Array.isArray(d.activity)) clean.activity = d.activity.slice(0, 40);
      store.data = clean; store.save(); render();
      alert("Progress imported.");
    } catch (err) { alert("That file is not valid progress data."); }
    e.target.value = "";
  };
  rd.readAsText(f);
});
$("#menubtn").onclick = () => {
  const open = $("#sidebar").classList.toggle("open");
  $("#menubtn").setAttribute("aria-expanded", String(open));
};
addEventListener("hashchange", () => {
  $("#sidebar").classList.remove("open");
  $("#menubtn").setAttribute("aria-expanded", "false");
  aid = { gloss: false, notes: false, translation: false };
  render();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change", () => { if (store.data.settings.theme === "system") render(); });

if ("serviceWorker" in navigator) {
  addEventListener("load", () =>
    navigator.serviceWorker.register("./lingua-latina-sw.js").catch(() => {})
  );
}


render();

</script>
</body>
</html>

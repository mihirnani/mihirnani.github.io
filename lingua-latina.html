d);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat b{font-size:25px;display:block}.stat small{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}.btn:hover{background:var(--card2)}.btn.primary{background:var(--acc);border-color:var(--acc);color:white}.btn.small{padding:5px 10px;font-size:12.5px}.pill{display:inline-block;border-radius:99px;padding:2px 9px;background:var(--card2);color:var(--muted);font-size:11.5px;font-weight:700}.pill.acc{background:var(--soft);color:var(--acc)}.progress{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.progress i{height:100%;display:block;background:var(--acc);border-radius:99px}.levelcard,.unitrow,.readingrow{display:block;color:inherit;text-decoration:none;cursor:pointer}.levelcard:hover,.unitrow:hover,.readingrow:hover{border-color:var(--muted)}.leveltop{display:flex;gap:10px;align-items:baseline}.leveltop b{font-size:18px}.leveltop span{color:var(--muted)}.leveltop .pct{margin-left:auto}.unitrow,.readingrow{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow)}.unitrow{display:flex;gap:13px;align-items:center}.num{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:var(--card2);font-weight:800;flex:none}.unitrow.done .num{background:var(--acc);color:white}.unitrow .t{flex:1;min-width:0}.unitrow .t b,.readingrow b{display:block}.unitrow small,.readingrow small{color:var(--muted)}.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0}.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:9px 13px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}.tab.active{color:var(--acc);border-color:var(--acc)}.grammar p{margin:9px 0}.grammar ul,.grammar ol{padding-left:23px}.tip{border-left:3px solid var(--gold);background:var(--goldsoft);padding:10px 13px;border-radius:0 9px 9px 0;margin:12px 0}.gr{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}.gr th,.gr td{border:1px solid var(--line);padding:7px 10px;text-align:left}.gr th{background:var(--card2)}.example{border-bottom:1px dashed var(--line);padding:9px 1px}.example .la{font-family:Georgia,serif;font-size:17px}.example .en{display:block;color:var(--muted);font-size:13.5px}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.vocab div{padding:8px 2px;border-bottom:1px solid var(--line)}.vocab b{font-family:Georgia,serif;color:var(--acc)}.exercise{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;margin:15px 0}.opts{display:grid;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 12px;text-align:left;font:inherit;cursor:pointer}.opt:hover{background:var(--card2)}.opt.correct{border-color:var(--good);background:rgba(47,107,60,.1)}.opt.wrong{border-color:var(--bad);background:rgba(162,43,43,.1)}.answerrow{display:flex;gap:8px}.answerrow input,.search,.select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit}.feedback{margin-top:10px;font-weight:650}.ok{color:var(--good)}.no{color:var(--bad)}.readfilter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.readingrow{display:grid;grid-template-columns:1fr auto;gap:15px}.readingmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.latintext{font:20px/1.85 Georgia,"Times New Roman",serif;white-space:pre-line;letter-spacing:.005em}.word{border:0;border-bottom:1px dotted var(--acc);padding:0;background:transparent;color:inherit;font:inherit;cursor:pointer}.word:hover{background:var(--soft)}.aidbar{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.aidbar .btn.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}.glosstip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90%;text-align:center}.aidbox{background:var(--card2);border-radius:10px;padding:13px 15px;margin:13px 0}.notes li{margin:6px 0}.source{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}.flashstage{max-width:590px;margin:0 auto}.flashcard{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:32px;box-shadow:var(--shadow);cursor:pointer}.flashcard .front{font:700 28px/1.25 Georgia,serif}.flashcard .back{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:20px;color:var(--muted)}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.grades button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 5px;border-radius:9px;font-weight:750;cursor:pointer}.labtable{overflow-x:auto}.banner{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px}.menubtn{display:none;position:fixed;right:18px;bottom:18px;z-index:70;width:52px;height:52px;border:0;border-radius:50%;background:var(--acc);color:white;font-size:22px;box-shadow:0 5px 20px rgba(0,0,0,.3)}
@media(max-width:840px){.sidebar{position:fixed;z-index:60;transform:translateX(-105%);transition:.2s;height:100dvh}.sidebar.open{transform:none;box-shadow:0 0 45px rgba(0,0,0,.35)}.menubtn{display:block}.main{padding:20px 15px 90px;max-width:100%}.grid2,.vocab{grid-template-columns:1fr}.readingrow{grid-template-columns:1fr}.gr{display:block;overflow-x:auto}.grades{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
"use strict";
const COURSE=[{"id":"found","short":"I","icon":"Ⅰ","label":"Stage I — Foundations","tagline":"Forms that unlock sentences","desc":"Pronunciation, the case system, first and second declensions, present verbs and essential sentence patterns.","units":[{"id":"f1","title":"Sounds, quantities & the case idea","subtitle":"How Latin encodes meaning in endings","grammar":"<h3>Pronunciation and vowel quantity</h3>\n<p>This course uses a restored Classical pronunciation. <b>c</b> is always hard as in <i>cat</i>; <b>g</b> is always hard; <b>v</b> is approximately English <i>w</i>; <b>ae</b> is a diphthong like “eye.” A macron marks a long vowel: <b>ā ē ī ō ū</b>.</p>\n<p>Vowel length can distinguish words: <b>liber</b> “book” and <b>līber</b> “free”; <b>malum</b> “evil” and <b>mālum</b> “apple.” Many modern editions omit macrons, so the Reading Room can display texts without them.</p>\n<h3>Cases</h3><p>Latin changes noun endings to show function. The principal cases are nominative (subject), accusative (direct object), genitive (possession), dative (indirect object), ablative (means, manner, separation and many prepositions), and vocative (address).</p>\n<div class=\"tip\"><b>Reading habit:</b> find the finite verb, then identify nominatives and accusatives. Do not assume the first noun is the subject.</div>","examples":[["Rōma in Italiā est.","Rome is in Italy."],["Puella poetam videt.","The girl sees the poet."],["Poeta puellam videt.","The poet sees the girl."],["Salvē, amīce!","Hello, friend!"]],"vocab":[["Rōma","Rome"],["Italia","Italy"],["puella","girl"],["poēta","poet"],["amīcus","friend"],["videt","sees"],["est","is"],["in","in / on"],["salvē","hello"],["casus","case"],["nōmen","noun / name"],["verbum","verb / word"]],"exercises":[{"t":"mcq","q":"In restored Classical Latin, <b>c</b> is normally:","opts":["always hard","soft before e and i","silent","pronounced sh"],"a":0,"ex":""},{"t":"mcq","q":"Which case normally marks the direct object?","opts":["accusative","nominative","genitive","vocative"],"a":0,"ex":""},{"t":"fill","q":"Rōma in Italiā ___.","a":["est"],"ex":""},{"t":"mcq","q":"A macron marks:","opts":["a long vowel","stress only","a silent vowel","a diphthong"],"a":0,"ex":""},{"t":"fill","q":"Puella poetam ___.","a":["videt"],"ex":""},{"t":"mcq","q":"In <i>Poeta puellam videt</i>, the object is:","opts":["puellam","poeta","videt","none"],"a":0,"ex":""}]},{"id":"f2","title":"First declension","subtitle":"Subjects, objects and possession","grammar":"<h3>First-declension endings</h3><table class=\"gr\"><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Nominative</td><td>-a</td><td>-ae</td></tr><tr><td>Accusative</td><td>-am</td><td>-ās</td></tr><tr><td>Genitive</td><td>-ae</td><td>-ārum</td></tr><tr><td>Dative</td><td>-ae</td><td>-īs</td></tr><tr><td>Ablative</td><td>-ā</td><td>-īs</td></tr></table>\n<p>Most first-declension nouns are feminine, but words for male persons such as <b>poēta</b>, <b>agricola</b> and <b>nauta</b> are masculine.</p>\n<p>Learn a noun by its nominative and genitive: <b>puella, puellae, f.</b> The genitive identifies the declension and supplies the stem.</p>","examples":[["Puella aquam portat.","The girl carries water."],["Puellae aquam portant.","The girls carry water."],["Fīlia agricolae cantat.","The farmer’s daughter sings."],["Nauta puellae rosam dat.","The sailor gives the girl a rose."]],"vocab":[["puella, -ae f.","girl"],["aqua, -ae f.","water"],["rosa, -ae f.","rose"],["fīlia, -ae f.","daughter"],["terra, -ae f.","land / earth"],["via, -ae f.","road / way"],["porta, -ae f.","gate"],["agricola, -ae m.","farmer"],["nauta, -ae m.","sailor"],["portat","carries"],["cantat","sings"],["dat","gives"]],"exercises":[{"t":"fill","q":"The girl (subject): puell___","a":["a"],"ex":""},{"t":"fill","q":"The girls (subject): puell___","a":["ae"],"ex":""},{"t":"fill","q":"The rose (object): ros___","a":["am"],"ex":""},{"t":"mcq","q":"<i>agricola</i> is:","opts":["masculine despite first declension","always feminine","neuter","indeclinable"],"a":0,"ex":""},{"t":"fill","q":"The farmer’s daughter: fīlia agricol___","a":["ae"],"ex":""},{"t":"fill","q":"The girls carry water: Puellae aquam ___.","a":["portant"],"ex":""}]},{"id":"f3","title":"Second declension & adjectives","subtitle":"Gender and agreement","grammar":"<h3>Second declension</h3><p>Masculine nouns often end in <b>-us</b> or <b>-er</b>; neuters in <b>-um</b>. The genitive singular is <b>-ī</b>.</p>\n<table class=\"gr\"><tr><th></th><th>servus (m.)</th><th>bellum (n.)</th></tr><tr><td>Nom. sg.</td><td>servus</td><td>bellum</td></tr><tr><td>Acc. sg.</td><td>servum</td><td>bellum</td></tr><tr><td>Nom./acc. pl.</td><td>servī / servōs</td><td>bella</td></tr><tr><td>Gen. sg.</td><td>servī</td><td>bellī</td></tr></table>\n<h3>Adjective agreement</h3><p>An adjective agrees with its noun in gender, number and case, not necessarily in visible ending: <b>poēta bonus</b>, <b>puella bona</b>, <b>bellum magnum</b>.</p>\n<div class=\"tip\"><b>Neuter rule:</b> nominative and accusative are identical; their plural ends in <b>-a</b>.</div>","examples":[["Servus bonus labōrat.","The good slave works."],["Dominus servum bonum laudat.","The master praises the good slave."],["Bellum magnum timēmus.","We fear a great war."],["Poēta bonus carmen scrībit.","The good poet writes a poem."]],"vocab":[["servus, -ī m.","slave / servant"],["dominus, -ī m.","master"],["amīcus, -ī m.","friend"],["puer, puerī m.","boy"],["ager, agrī m.","field"],["bellum, -ī n.","war"],["dōnum, -ī n.","gift"],["templum, -ī n.","temple"],["bonus, -a, -um","good"],["magnus, -a, -um","great / large"],["parvus, -a, -um","small"],["laudat","praises"]],"exercises":[{"t":"fill","q":"a great war: bellum magn___","a":["um"],"ex":""},{"t":"fill","q":"good poets: poētae bon___","a":["ī"],"ex":""},{"t":"mcq","q":"Neuter plural nominative normally ends in:","opts":["-a","-ī","-ōs","-ae"],"a":0,"ex":""},{"t":"fill","q":"the master (object): domin___","a":["um"],"ex":""},{"t":"mcq","q":"Correct agreement with <i>poēta</i>:","opts":["poēta bonus","poēta bona","poētam bonum as subject","poēta bonum"],"a":0,"ex":""},{"t":"fill","q":"We fear great wars: Bella magna ___.","a":["timēmus"],"ex":""}]},{"id":"f4","title":"Present active verbs","subtitle":"Person, number and flexible word order","grammar":"<h3>Present active endings</h3><table class=\"gr\"><tr><th></th><th>Ending</th><th>amāre</th></tr><tr><td>I</td><td>-ō / -m</td><td>amō</td></tr><tr><td>you sg.</td><td>-s</td><td>amās</td></tr><tr><td>he/she/it</td><td>-t</td><td>amat</td></tr><tr><td>we</td><td>-mus</td><td>amāmus</td></tr><tr><td>you pl.</td><td>-tis</td><td>amātis</td></tr><tr><td>they</td><td>-nt</td><td>amant</td></tr></table>\n<p>The four conjugations are recognised by the infinitive: <b>amāre, monēre, regere, audīre</b>. The verb ending usually makes a subject pronoun unnecessary.</p>\n<p>Latin word order is flexible, but prose often tends toward subject–object–verb. Emphasis and rhythm frequently alter that order.</p>","examples":[["Latīnam linguam discō.","I learn the Latin language."],["Librum legis.","You read a book."],["Puerī magistrum audiunt.","The boys listen to the teacher."],["Rōmānī urbem regunt.","The Romans rule the city."]],"vocab":[["amō, amāre","love"],["moneō, monēre","warn / advise"],["regō, regere","rule / guide"],["audiō, audīre","hear"],["legō, legere","read / choose"],["scrībō, scrībere","write"],["discō, discere","learn"],["videō, vidēre","see"],["veniō, venīre","come"],["lingua, -ae f.","language"],["liber, librī m.","book"],["magister, -trī m.","teacher"]],"exercises":[{"t":"fill","q":"I love: am___","a":["ō"],"ex":""},{"t":"fill","q":"they hear: audi___","a":["unt"],"ex":""},{"t":"mcq","q":"The ending <b>-mus</b> means:","opts":["we","I","they","you singular"],"a":0,"ex":""},{"t":"fill","q":"You read a book: Librum ___.","a":["legis"],"ex":""},{"t":"mcq","q":"Latin normally needs a separate subject pronoun:","opts":["no, the verb ending often supplies it","always","only in poetry","only with nouns"],"a":0,"ex":""},{"t":"fill","q":"The Romans rule the city: Rōmānī urbem ___.","a":["regunt"],"ex":""}]},{"id":"f5","title":"Ablative & prepositions","subtitle":"Location, means and accompaniment","grammar":"<h3>Core ablative uses</h3><p><b>Means:</b> gladiō pugnat, “he fights with a sword.” <b>Manner:</b> magnā cūrā, “with great care.” <b>Accompaniment:</b> cum amīcō, “with a friend.” <b>Place where:</b> in urbe, “in the city.” <b>Separation:</b> ab urbe, “from the city.”</p>\n<p>Common accusative prepositions include <b>ad, per, post, ante, propter</b>. Common ablative prepositions include <b>ā/ab, cum, dē, ē/ex, sine, prō</b>.</p>\n<h3>in and sub</h3><p>With the ablative they usually answer “where?”; with the accusative, “to where?”: <b>in urbe</b> but <b>in urbem</b>.</p>","examples":[["Cum amīcō ambulō.","I walk with a friend."],["Gladiō pugnant.","They fight with a sword."],["In urbe habitat.","He lives in the city."],["In urbem venit.","He comes into the city."],["Sine aquā vīvere nōn possumus.","We cannot live without water."]],"vocab":[["cum + abl.","with"],["sine + abl.","without"],["ā/ab + abl.","from / by"],["ē/ex + abl.","out of"],["dē + abl.","down from / about"],["in + abl.","in / on"],["in + acc.","into / onto"],["ad + acc.","to / toward"],["per + acc.","through"],["gladius, -ī m.","sword"],["urbs, urbis f.","city"],["ambulō","walk"]],"exercises":[{"t":"mcq","q":"“Into the city” is:","opts":["in urbem","in urbe","ab urbe","cum urbe"],"a":0,"ex":""},{"t":"fill","q":"with a friend: cum amīc___","a":["ō"],"ex":""},{"t":"mcq","q":"Ablative of means usually uses:","opts":["no preposition","cum always","ad","per"],"a":0,"ex":""},{"t":"fill","q":"without water: sine aqu___","a":["ā"],"ex":""},{"t":"fill","q":"They fight with a sword: Gladiō ___.","a":["pugnant"],"ex":""},{"t":"mcq","q":"<i>ad</i> normally governs:","opts":["accusative","ablative","genitive","dative"],"a":0,"ex":""}]},{"id":"f6","title":"sum, questions & possession","subtitle":"Being, having and asking","grammar":"<h3>sum — to be</h3><table class=\"gr\"><tr><td>sum</td><td>sumus</td></tr><tr><td>es</td><td>estis</td></tr><tr><td>est</td><td>sunt</td></tr></table>\n<p>Latin often expresses possession with the dative: <b>Mihi liber est</b>, literally “A book is to me,” meaning “I have a book.”</p>\n<h3>Questions</h3><p><b>-ne</b> asks a neutral yes/no question: <b>Venitne?</b> <b>nōnne</b> expects yes; <b>num</b> expects no. Question words include <b>quis, quid, ubi, cūr, quōmodo, quandō</b>.</p>","examples":[["Rōma magna est.","Rome is great."],["Mihi duo librī sunt.","I have two books."],["Ubi est forum?","Where is the forum?"],["Venitne magister?","Is the teacher coming?"],["Nōnne Latīnam linguam amās?","Surely you love Latin?"]],"vocab":[["sum, esse","be"],["quis?","who?"],["quid?","what?"],["ubi?","where?"],["cūr?","why?"],["quōmodo?","how?"],["quandō?","when?"],["forum, -ī n.","forum / marketplace"],["mihi","to/for me"],["tibi","to/for you"],["duo / duae","two"],["possum, posse","be able"]],"exercises":[{"t":"fill","q":"we are: ___","a":["sumus"],"ex":""},{"t":"fill","q":"they are: ___","a":["sunt"],"ex":""},{"t":"mcq","q":"<i>Mihi liber est</i> means:","opts":["I have a book","The book is me","I am a book","The book is mine only emphatically"],"a":0,"ex":""},{"t":"fill","q":"Where is the forum? ___ est forum?","a":["Ubi"],"ex":""},{"t":"mcq","q":"A neutral yes/no question may use:","opts":["-ne","nōnne only","num only","quod"],"a":0,"ex":""},{"t":"fill","q":"Can we? ___ne?","a":["Possumus"],"ex":""}]}]},{"id":"morph","short":"II","icon":"Ⅱ","label":"Stage II — Core morphology","tagline":"The forms authentic prose assumes","desc":"Third declension, adjectives, pronouns, past and future tenses, and the passive system.","units":[{"id":"m1","title":"Third declension nouns","subtitle":"Use the genitive to find the stem","grammar":"<h3>Dictionary form matters</h3><p>Third-declension nominatives vary widely. The genitive singular ends in <b>-is</b> and reveals the stem: <b>rēx, rēgis</b>; <b>corpus, corporis</b>; <b>cīvitās, cīvitātis</b>.</p>\n<table class=\"gr\"><tr><th></th><th>M./F.</th><th>Neuter</th></tr><tr><td>Acc. sg.</td><td>-em</td><td>same as nom.</td></tr><tr><td>Gen. sg.</td><td>-is</td><td>-is</td></tr><tr><td>Nom. pl.</td><td>-ēs</td><td>-a / -ia</td></tr><tr><td>Gen. pl.</td><td>-um / -ium</td><td>-um / -ium</td></tr></table>\n<p>Some i-stems have <b>-ium</b> in the genitive plural and neuter <b>-ia</b>.</p>","examples":[["Rēx cīvitātem regit.","The king rules the state."],["Mīlitēs urbem dēfendunt.","The soldiers defend the city."],["Nōmen rēgis nōtum est.","The king’s name is known."],["Corpora hominum mortālia sunt.","Human bodies are mortal."]],"vocab":[["rēx, rēgis m.","king"],["mīles, mīlitis m.","soldier"],["cīvitās, -ātis f.","state / citizenship"],["urbs, urbis f.","city"],["nōmen, nōminis n.","name"],["corpus, corporis n.","body"],["homo, hominis m.","human being"],["pāx, pācis f.","peace"],["lēx, lēgis f.","law"],["virtūs, -ūtis f.","courage / excellence"],["dēfendō","defend"],["mortālis, -e","mortal"]],"exercises":[{"t":"fill","q":"the king (genitive): rēg___","a":["is"],"ex":""},{"t":"fill","q":"soldiers (nom. plural): mīlit___","a":["ēs"],"ex":""},{"t":"mcq","q":"The stem of <i>corpus, corporis</i> is:","opts":["corpor-","corp-","corpus-","corpo-"],"a":0,"ex":""},{"t":"fill","q":"bodies (nom./acc. pl.): corpor___","a":["a"],"ex":""},{"t":"fill","q":"The soldiers defend the city: Mīlitēs urbem ___.","a":["dēfendunt"],"ex":""},{"t":"mcq","q":"Third-declension genitive singular ends in:","opts":["-is","-ī","-ae","-ūs"],"a":0,"ex":""}]},{"id":"m2","title":"Third-declension adjectives & comparison","subtitle":"Two-termination adjectives and degrees","grammar":"<h3>Third-declension adjectives</h3><p>Many use two nominative forms: <b>fortis, forte</b> (m./f., n.); <b>ācer, ācris, ācre</b> uses three. Their ablative singular is commonly <b>-ī</b>, neuter plural <b>-ia</b>, genitive plural <b>-ium</b>.</p>\n<h3>Comparison</h3><p>Comparative: stem + <b>-ior</b> (m./f.), <b>-ius</b> (n.); superlative: stem + <b>-issimus</b>. Irregular: <b>bonus, melior, optimus</b>; <b>malus, peior, pessimus</b>; <b>magnus, maior, maximus</b>.</p>\n<p>The standard of comparison may use <b>quam</b> with the same case or the ablative alone.</p>","examples":[["Mīles fortis pugnat.","The brave soldier fights."],["Consilium utile est.","The plan is useful."],["Caesar Pompeio potentior erat.","Caesar was more powerful than Pompey."],["Haec via brevissima est.","This road is the shortest."]],"vocab":[["fortis, forte","brave / strong"],["ūtilis, -e","useful"],["facilis, -e","easy"],["difficilis, -e","difficult"],["celer, celeris, celere","swift"],["maior, maius","greater"],["minor, minus","smaller"],["melior, melius","better"],["optimus, -a, -um","best"],["pessimus, -a, -um","worst"],["brevissimus","shortest"],["potēns, potentis","powerful"]],"exercises":[{"t":"fill","q":"a useful plan: consilium util___","a":["e"],"ex":""},{"t":"fill","q":"brave soldiers: mīlitēs fort___","a":["ēs"],"ex":""},{"t":"mcq","q":"Comparative neuter of <i>maior</i>:","opts":["maius","maior","maximum","magnius"],"a":0,"ex":""},{"t":"fill","q":"the best road: via optim___","a":["a"],"ex":""},{"t":"mcq","q":"Superlatives usually contain:","opts":["-issim-","-ior-","-nt-","-bil-"],"a":0,"ex":""},{"t":"fill","q":"Caesar was greater than Pompey: Caesar Pompeio ___ erat.","a":["maior"],"ex":""}]},{"id":"m3","title":"Pronouns & demonstratives","subtitle":"Track reference without losing the sentence","grammar":"<p><b>is, ea, id</b> often means “he/she/it” or “that.” <b>hic, haec, hoc</b> points to what is near the speaker or present in discourse; <b>ille, illa, illud</b> to what is more remote or notable. <b>ipse</b> is intensive (“himself”); <b>idem</b> means “the same.”</p>\n<p>Pronouns preserve older genitives in <b>-īus</b> and datives in <b>-ī</b>: <b>eius, eī; huius, huic; illīus, illī</b>.</p>\n<div class=\"tip\">In reading, write the antecedent mentally: <b>is</b> = “that man just mentioned,” not merely “he.”</div>","examples":[["Hic liber meus est; ille tuus.","This book is mine; that one is yours."],["Caesar ipse vēnit.","Caesar himself came."],["Eius consilium probāmus.","We approve his/her plan."],["Eādem diē profectī sunt.","They set out on the same day."]],"vocab":[["is, ea, id","he / she / it; that"],["hic, haec, hoc","this"],["ille, illa, illud","that / famous"],["ipse, ipsa, ipsum","self / very"],["idem, eadem, idem","same"],["alius, alia, aliud","other / another"],["alter, altera, alterum","the other (of two)"],["eius","his / her / its"],["huic","to this"],["illō","by/with that"],["meus, -a, -um","my"],["tuus, -a, -um","your"]],"exercises":[{"t":"fill","q":"Caesar himself: Caesar ___","a":["ipse"],"ex":""},{"t":"mcq","q":"<i>eius</i> means:","opts":["his/her/its (of someone else)","his own","to him","with him"],"a":0,"ex":""},{"t":"fill","q":"on the same day: eādem di___","a":["ē"],"ex":""},{"t":"mcq","q":"<i>hic</i> normally points to:","opts":["what is near/present","only a dead person","the future","a question"],"a":0,"ex":""},{"t":"fill","q":"that famous man: ___ vir","a":["ille"],"ex":""},{"t":"mcq","q":"The genitive singular of <i>hic</i> is:","opts":["huius","hī","hōc","hicī"],"a":0,"ex":""}]},{"id":"m4","title":"Imperfect & future","subtitle":"Ongoing past and anticipated action","grammar":"<h3>Imperfect</h3><p>Present stem + <b>-bā-</b> + personal endings: <b>amābam, monēbās</b>. Third and fourth conjugations use <b>-ēbā-</b>: <b>regēbat, audiēbant</b>. It expresses ongoing, repeated or attempted past action.</p>\n<h3>Future</h3><p>First and second conjugations use <b>-bō, -bis, -bit...</b>. Third and fourth use <b>-am, -ēs, -et...</b>: <b>regam, regiēs, regent</b>; <b>audiam</b>.</p>","examples":[["Puer in hortō lūdēbat.","The boy was playing in the garden."],["Cotīdiē librōs legēbāmus.","We used to read books every day."],["Crās ad urbem veniēs.","Tomorrow you will come to the city."],["Rōmānī hostēs vincent.","The Romans will defeat the enemy."]],"vocab":[["lūdō, lūdere","play"],["hortus, -ī m.","garden"],["cotīdiē","every day"],["crās","tomorrow"],["heri","yesterday"],["semper","always"],["saepe","often"],["tum","then"],["hostis, -is m./f.","enemy"],["vincō, vincere","conquer"],["manēō, manēre","remain"],["agō, agere","do / drive"]],"exercises":[{"t":"fill","q":"I was loving: amā___","a":["bam"],"ex":""},{"t":"fill","q":"they were hearing: audi___","a":["ēbant"],"ex":""},{"t":"mcq","q":"The imperfect commonly expresses:","opts":["ongoing or habitual past","completed past only","future command","present fact"],"a":0,"ex":""},{"t":"fill","q":"you will rule: reg___","a":["ēs"],"ex":""},{"t":"fill","q":"The Romans will conquer: Rōmānī ___.","a":["vincent"],"ex":""},{"t":"mcq","q":"Future of <i>amō</i>, 1st singular:","opts":["amābō","amābam","amem","amāvī"],"a":0,"ex":""}]},{"id":"m5","title":"The perfect system","subtitle":"Completed action and anterior time","grammar":"<h3>Principal parts</h3><p>Learn verbs as <b>amō, amāre, amāvī, amātum</b>. The third principal part supplies the perfect active stem.</p>\n<table class=\"gr\"><tr><th>Tense</th><th>Formation</th><th>Example</th></tr><tr><td>Perfect</td><td>perfect stem + ī, istī, it...</td><td>amāvī</td></tr><tr><td>Pluperfect</td><td>perfect stem + eram...</td><td>amāveram</td></tr><tr><td>Future perfect</td><td>perfect stem + erō...</td><td>amāverō</td></tr></table>\n<p>The perfect may be translated “I loved” or “I have loved,” depending on context.</p>","examples":[["Caesar Galliam vīcit.","Caesar conquered Gaul."],["Litterās scrīpsimus.","We wrote / have written the letter."],["Ubi vēnerat, amīcum vīdit.","When he had arrived, he saw his friend."],["Cum librum lēgeris, intellegēs.","When you have read the book, you will understand."]],"vocab":[["amō, amāre, amāvī, amātum","love"],["videō, vidēre, vīdī, vīsum","see"],["scrībō, scrībere, scrīpsī, scrīptum","write"],["legō, legere, lēgī, lēctum","read"],["veniō, venīre, vēnī, ventum","come"],["vincō, vincere, vīcī, victum","conquer"],["faciō, facere, fēcī, factum","do / make"],["dīcō, dīcere, dīxī, dictum","say"],["intellegō","understand"],["litterae, -ārum f.pl.","letter"],["Gallia, -ae f.","Gaul"],["postquam","after"]],"exercises":[{"t":"fill","q":"I loved / have loved: amā___","a":["vī"],"ex":""},{"t":"fill","q":"we wrote: scrīp___","a":["simus"],"ex":""},{"t":"mcq","q":"The perfect active stem comes from:","opts":["the third principal part","the infinitive only","the supine only","the nominative"],"a":0,"ex":""},{"t":"fill","q":"he had come: vēn___","a":["erat"],"ex":""},{"t":"fill","q":"Caesar conquered Gaul: Caesar Galliam ___.","a":["vīcit"],"ex":""},{"t":"mcq","q":"Future perfect 1st singular of <i>amō</i>:","opts":["amāverō","amāveram","amābō","amem"],"a":0,"ex":""}]},{"id":"m6","title":"Passive voice & the fourth principal part","subtitle":"Action received by the subject","grammar":"<h3>Present-system passive</h3><p>Use endings <b>-r, -ris, -tur, -mur, -minī, -ntur</b>: <b>amātur</b>, “he/she is loved”; <b>reguntur</b>, “they are ruled.”</p>\n<h3>Perfect-system passive</h3><p>Perfect passive participle + <b>sum</b>: <b>urbs capta est</b>, “the city was captured.” The participle agrees with the subject: <b>mīlitēs missī sunt</b>.</p>\n<p>The personal agent uses <b>ā/ab + ablative</b>; an instrument uses the ablative alone.</p>","examples":[["Urbs ā mīlitibus dēfenditur.","The city is defended by the soldiers."],["Litterae scrībuntur.","The letter is being written."],["Caesar ā senātū laudātus est.","Caesar was praised by the senate."],["Portae clausae erant.","The gates had been closed."]],"vocab":[["amātur","is loved"],["regitur","is ruled"],["audiuntur","are heard"],["captus, -a, -um","captured"],["missus, -a, -um","sent"],["scrīptus, -a, -um","written"],["laudātus, -a, -um","praised"],["clausus, -a, -um","closed"],["senātus, -ūs m.","senate"],["porta, -ae f.","gate"],["capiō, capere","capture / take"],["mittō, mittere","send"]],"exercises":[{"t":"fill","q":"is loved: amā___","a":["tur"],"ex":""},{"t":"fill","q":"are ruled: regu___","a":["ntur"],"ex":""},{"t":"mcq","q":"A personal agent in a passive sentence uses:","opts":["ā/ab + ablative","ad + accusative","genitive only","dative only"],"a":0,"ex":""},{"t":"fill","q":"The gates were closed: Portae clausae ___.","a":["erant"],"ex":""},{"t":"fill","q":"Caesar was praised: Caesar laudātus ___.","a":["est"],"ex":""},{"t":"mcq","q":"In <i>mīlitēs missī sunt</i>, <i>missī</i> agrees with:","opts":["mīlitēs","an implied object","sunt","no word"],"a":0,"ex":""}]}]},{"id":"syntax","short":"III","icon":"Ⅲ","label":"Stage III — Complex syntax","tagline":"How Latin builds arguments","desc":"Relative clauses, participles, indirect discourse, the subjunctive, purpose, result, conditions and embedded questions.","units":[{"id":"s1","title":"Relative clauses","subtitle":"A complete clause inside a noun phrase","grammar":"<p>The relative pronoun agrees with its antecedent in gender and number, but its case comes from its function inside the relative clause.</p>\n<table class=\"gr\"><tr><th></th><th>M.</th><th>F.</th><th>N.</th></tr><tr><td>Nom. sg.</td><td>quī</td><td>quae</td><td>quod</td></tr><tr><td>Acc. sg.</td><td>quem</td><td>quam</td><td>quod</td></tr><tr><td>Gen. sg.</td><td>cuius</td><td>cuius</td><td>cuius</td></tr><tr><td>Dat. sg.</td><td>cui</td><td>cui</td><td>cui</td></tr></table>\n<p>Latin often places the antecedent inside the relative clause or omits it when clear.</p>","examples":[["Vir quī venit amīcus meus est.","The man who is coming is my friend."],["Librum quem legis scrīpsī.","I wrote the book that you are reading."],["Puella cui librum dedī laeta est.","The girl to whom I gave the book is happy."],["Urbs cuius moenia vidēs antīqua est.","The city whose walls you see is ancient."]],"vocab":[["quī, quae, quod","who / which"],["quem / quam","whom / which (acc.)"],["cuius","whose"],["cui","to whom"],["quō / quā","by/with whom"],["moenia, -ium n.pl.","walls"],["antīquus","ancient"],["laetus","happy"],["dō, dare, dedī, datum","give"],["antecedēns","antecedent"],["clausula","clause"],["relātīvus","relative"]],"exercises":[{"t":"fill","q":"the man who comes: vir ___ venit","a":["quī"],"ex":""},{"t":"fill","q":"the book which you read: librum ___ legis","a":["quem"],"ex":""},{"t":"mcq","q":"The case of a relative pronoun is determined by:","opts":["its function in its own clause","the antecedent’s case","word order","the main verb only"],"a":0,"ex":""},{"t":"fill","q":"the girl to whom: puella ___","a":["cui"],"ex":""},{"t":"fill","q":"the city whose walls: urbs ___ moenia","a":["cuius"],"ex":""},{"t":"mcq","q":"Neuter nominative/accusative singular is:","opts":["quod","quem","quae","cui"],"a":0,"ex":""}]},{"id":"s2","title":"Participles","subtitle":"Verbal adjectives that compress clauses","grammar":"<table class=\"gr\"><tr><th>Participle</th><th>Meaning</th><th>Example</th></tr><tr><td>Present active</td><td>contemporaneous active</td><td>amāns, loving</td></tr><tr><td>Perfect passive</td><td>prior passive</td><td>amātus, having been loved</td></tr><tr><td>Future active</td><td>subsequent/intended active</td><td>amātūrus, about to love</td></tr><tr><td>Gerundive</td><td>necessity / passive potential</td><td>amandus, to be loved</td></tr></table>\n<p>Translate participles according to context: literally, as a relative clause, or as a temporal/causal clause.</p>","examples":[["Mīles fugiēns gladium abiēcit.","The fleeing soldier threw away his sword."],["Urbe captā, dux discessit.","After the city had been captured, the leader departed."],["Caesar profectūrus mīlitēs convocāvit.","Caesar, about to depart, summoned the soldiers."],["Librum legendum habeō.","I have a book that must be read."]],"vocab":[["amāns, amantis","loving"],["fugiēns, fugientis","fleeing"],["captus","captured"],["profectūrus","about to depart"],["legendus","to be read"],["convocō","summon"],["abiciō","throw away"],["discedō","depart"],["dux, ducis m.","leader"],["prior","earlier"],["simultāneus","simultaneous"],["subsequēns","subsequent"]],"exercises":[{"t":"mcq","q":"A perfect passive participle normally denotes:","opts":["prior passive action","simultaneous active action","future action","a command only"],"a":0,"ex":""},{"t":"fill","q":"the fleeing soldier: mīles fugi___","a":["ēns"],"ex":""},{"t":"fill","q":"about to depart: profect___","a":["ūrus"],"ex":""},{"t":"mcq","q":"<i>legendus</i> is a:","opts":["gerundive","present participle","perfect infinitive","supine only"],"a":0,"ex":""},{"t":"fill","q":"After the city was captured: Urbe capt___","a":["ā"],"ex":""},{"t":"fill","q":"Caesar summoned the soldiers: Caesar mīlitēs ___.","a":["convocāvit"],"ex":""}]},{"id":"s3","title":"Infinitives & indirect statement","subtitle":"Latin reports thought through accusative + infinitive","grammar":"<h3>Indirect statement</h3><p>After verbs of saying, thinking, knowing and perceiving, Latin normally uses an accusative subject plus infinitive: <b>Dīcit Caesarem venīre</b>, “He says that Caesar is coming.”</p>\n<table class=\"gr\"><tr><th>Time relative to main verb</th><th>Infinitive</th></tr><tr><td>simultaneous</td><td>present: venīre</td></tr><tr><td>prior</td><td>perfect: vēnisse</td></tr><tr><td>subsequent</td><td>future: ventūrum esse</td></tr></table>\n<p>The reflexive <b>sē</b> normally refers to the subject of the reporting verb.</p>","examples":[["Dīcit Caesarem venīre.","He says that Caesar is coming."],["Dīxit Caesarem vēnisse.","He said that Caesar had come."],["Putāmus eum victūrum esse.","We think that he will win."],["Caesar dīxit sē parātum esse.","Caesar said that he was ready."]],"vocab":[["dīcō","say"],["putō","think"],["sciō","know"],["audiō","hear"],["sentiō","perceive / think"],["crēdō","believe"],["venīre","to come / be coming"],["vēnisse","to have come"],["ventūrum esse","to be about to come"],["sē","himself/herself/themselves"],["parātus","ready"],["ōrātiō oblīqua","indirect discourse"]],"exercises":[{"t":"fill","q":"He says that Caesar is coming: Dīcit Caesarem ___.","a":["venīre"],"ex":""},{"t":"fill","q":"He said Caesar had come: Dīxit Caesarem ___.","a":["vēnisse"],"ex":""},{"t":"mcq","q":"The subject of an indirect statement is normally:","opts":["accusative","nominative","genitive","ablative"],"a":0,"ex":""},{"t":"fill","q":"We think he will win: Putāmus eum victūrum ___.","a":["esse"],"ex":""},{"t":"mcq","q":"<i>sē</i> normally refers to:","opts":["the subject of the reporting verb","the nearest noun always","the speaker only","an impersonal subject"],"a":0,"ex":""},{"t":"fill","q":"Caesar says that he is ready: Caesar dīcit sē parātum ___.","a":["esse"],"ex":""}]},{"id":"s4","title":"The subjunctive system","subtitle":"Potential, desire and subordination","grammar":"<h3>Formation</h3><p>Present subjunctive: first conjugation changes <b>ā → ē</b> (<b>amem</b>); others use <b>ā</b> (<b>moneam, regam, audiam</b>). Imperfect subjunctive is the present infinitive + endings: <b>amārem, monērēs</b>.</p>\n<p>Perfect subjunctive uses perfect stem + <b>-erim</b>; pluperfect uses perfect infinitive + endings: <b>amāvissem</b>.</p>\n<h3>Independent uses</h3><p>Jussive: <b>Veniat!</b> “Let him come.” Deliberative: <b>Quid faciam?</b> Potential: <b>Dīcat aliquis...</b> Wish: <b>Utinam adsit!</b></p>","examples":[["Veniat!","Let him come!"],["Quid faciam?","What am I to do?"],["Utinam adesset!","If only he were here!"],["Nē hoc faciās.","Do not do this."],["Dīcat aliquis haec falsa esse.","Someone might say these things are false."]],"vocab":[["amem","may I love"],["moneam","may I advise"],["regam","may I rule"],["audiam","may I hear"],["amārem","I might/would love"],["amāverim","I may have loved"],["amāvissem","I had/might have loved"],["utinam","if only"],["nē","lest / not"],["adsum, adesse","be present"],["falsus","false"],["coniūnctīvus","subjunctive"]],"exercises":[{"t":"fill","q":"present subjunctive of <i>amō</i>, 1sg: ___","a":["amem"],"ex":""},{"t":"fill","q":"present subjunctive of <i>regō</i>, 1sg: ___","a":["regam"],"ex":""},{"t":"mcq","q":"The imperfect subjunctive is built from:","opts":["the present infinitive","the perfect participle","the nominative","the future stem only"],"a":0,"ex":""},{"t":"fill","q":"Let him come: ___!","a":["Veniat"],"ex":""},{"t":"fill","q":"If only he were here: Utinam ___.","a":["adesset"],"ex":""},{"t":"mcq","q":"<i>Quid faciam?</i> is:","opts":["deliberative subjunctive","indirect statement","ablative absolute","passive periphrastic"],"a":0,"ex":""}]},{"id":"s5","title":"Purpose, result & characteristic","subtitle":"Why an action happens and what follows","grammar":"<h3>Purpose</h3><p><b>ut</b> + subjunctive for positive purpose; <b>nē</b> for negative: <b>Vēnit ut videat</b>, “He comes to see.”</p>\n<h3>Result</h3><p><b>ut</b> + subjunctive follows a signal such as <b>tam, ita, tantus, tot, sīc</b>: <b>Tam fessus erat ut dormīret</b>.</p>\n<h3>Relative clause of characteristic</h3><p><b>Nēmō est quī hoc faciat</b>, “There is no one who would do this / of the sort to do this.”</p>\n<div class=\"tip\">Negative result normally uses <b>ut nōn</b>, not <b>nē</b>.</div>","examples":[["Vēnit ut amīcum videat.","He comes to see his friend."],["Tacuit nē hostēs audīrent.","He was silent so that the enemy would not hear."],["Tam fessus erat ut dormīret.","He was so tired that he slept."],["Nēmō est quī hoc nesciat.","There is no one who does not know this."]],"vocab":[["ut","so that / that"],["nē","so that not / lest"],["tam","so"],["ita","so / in such a way"],["tantus","so great"],["tot","so many"],["taceō","be silent"],["fessus","tired"],["dormiō","sleep"],["nesciō","not know"],["cōnsilium","purpose / plan"],["exitus","result / outcome"]],"exercises":[{"t":"fill","q":"He comes to see: Vēnit ___ videat.","a":["ut"],"ex":""},{"t":"fill","q":"so that the enemy would not hear: ___ hostēs audīrent","a":["nē"],"ex":""},{"t":"mcq","q":"Negative result normally uses:","opts":["ut nōn","nē","num","quin only"],"a":0,"ex":""},{"t":"fill","q":"so tired that: tam fessus ___","a":["ut"],"ex":""},{"t":"mcq","q":"<i>Nēmō est quī...</i> often introduces:","opts":["a relative clause of characteristic","indirect statement","simple possession","a command"],"a":0,"ex":""},{"t":"fill","q":"There is no one who does not know: Nēmō est quī hoc ___.","a":["nesciat"],"ex":""}]},{"id":"s6","title":"cum clauses, conditions & indirect questions","subtitle":"Read the connective before translating it","grammar":"<h3>cum</h3><p>With indicative it can be purely temporal (“when”). With subjunctive it often supplies background, cause or concession: <b>Cum hoc scīret, tacuit</b>, “Since/although he knew this, he was silent.”</p>\n<h3>Conditions</h3><p>Simple factual conditions use indicative. Future more vivid often uses future/future perfect. Contrary-to-fact uses imperfect subjunctive for present and pluperfect for past.</p>\n<h3>Indirect questions</h3><p>A question word + subjunctive follows verbs of asking or knowing: <b>Rogat quid faciās</b>, “He asks what you are doing.”</p>","examples":[["Cum Caesar vēnit, mīlitēs laetī erant.","When Caesar came, the soldiers were happy."],["Cum hoc scīret, tamen tacuit.","Although he knew this, he was nevertheless silent."],["Sī hoc facis, errās.","If you do this, you are wrong."],["Sī adesset, gaudērem.","If he were here, I would rejoice."],["Rogat cūr abeās.","He asks why you are leaving."]],"vocab":[["cum","when / since / although"],["sī","if"],["nisi","unless"],["tamen","nevertheless"],["rogō","ask"],["quaerō","seek / ask"],["gaudeō","rejoice"],["errō","be mistaken"],["abeō","go away"],["adsit","may be present"],["condiciō","condition"],["quaestiō oblīqua","indirect question"]],"exercises":[{"t":"mcq","q":"With subjunctive, <i>cum</i> may mean:","opts":["since or although","only with","only after","never when"],"a":0,"ex":""},{"t":"fill","q":"If he were here, I would rejoice: Sī adesset, ___.","a":["gaudērem"],"ex":""},{"t":"mcq","q":"Present contrary-to-fact normally uses:","opts":["imperfect subjunctive","future indicative","perfect infinitive","imperative"],"a":0,"ex":""},{"t":"fill","q":"He asks why you leave: Rogat cūr ___.","a":["abeās"],"ex":""},{"t":"mcq","q":"Indirect questions use:","opts":["subjunctive","accusative + infinitive only","imperative","ablative absolute"],"a":0,"ex":""},{"t":"fill","q":"Although he knew this: ___ hoc scīret","a":["Cum"],"ex":""}]}]},{"id":"reading","short":"IV","icon":"Ⅳ","label":"Stage IV — Reading Latin","tagline":"From constructions to literature","desc":"Deponents, ablative absolutes, obligation, tense sequence, prose architecture, poetry and a method for independent reading.","units":[{"id":"a1","title":"Deponent verbs","subtitle":"Passive forms with active meaning","grammar":"<p>Deponents look passive but have active meaning: <b>loquor, loquī, locūtus sum</b>, “speak”; <b>sequor, sequī, secūtus sum</b>, “follow.” Their perfect participle is active in meaning: <b>Caesar locūtus</b>, “Caesar, having spoken.”</p>\n<p>They retain some active forms where no passive equivalent exists, including present participles and future infinitives.</p>\n<p>Semi-deponents have active present forms but deponent perfect forms: <b>audeō, audēre, ausus sum</b>.</p>","examples":[["Dux mīlitēs sequitur.","The leader follows the soldiers."],["Caesar locūtus discessit.","Caesar, having spoken, departed."],["Hostēs profectī sunt.","The enemy set out."],["Hoc facere ausus est.","He dared to do this."]],"vocab":[["loquor, loquī, locūtus sum","speak"],["sequor, sequī, secūtus sum","follow"],["proficīscor, proficīscī, profectus sum","set out"],["morior, morī, mortuus sum","die"],["patior, patī, passus sum","suffer"],["ūtor, ūtī, ūsus sum","use (+ abl.)"],["audeō, audēre, ausus sum","dare"],["cōnor, cōnārī","try"],["hortor, hortārī","encourage"],["arbitror, arbitrārī","think / judge"],["dēpōnēns","deponent"],["forma passīva","passive form"]],"exercises":[{"t":"fill","q":"he follows: sequ___","a":["itur"],"ex":""},{"t":"fill","q":"having spoken: locūt___","a":["us"],"ex":""},{"t":"mcq","q":"A deponent verb has:","opts":["passive forms and active meaning","active forms and passive meaning","no perfect tense","no infinitive"],"a":0,"ex":""},{"t":"fill","q":"they set out: profectī ___.","a":["sunt"],"ex":""},{"t":"mcq","q":"<i>ūtor</i> governs:","opts":["ablative","accusative","genitive","nominative"],"a":0,"ex":""},{"t":"fill","q":"he dared: ausus ___.","a":["est"],"ex":""}]},{"id":"a2","title":"Ablative absolute","subtitle":"A detached background clause","grammar":"<p>An ablative noun or pronoun plus an agreeing participle forms a grammatically detached clause: <b>urbe captā</b>, “with the city captured / after the city was captured.”</p>\n<p>Because <b>sum</b> has no present participle, Latin can use two ablatives: <b>Caesare duce</b>, “with Caesar as leader / under Caesar’s leadership.”</p>\n<p>Choose a translation that expresses the relation implied by context: time, cause, concession or circumstance.</p>","examples":[["Sole ortō, profectī sumus.","When the sun had risen, we set out."],["Urbe captā, mīlitēs discessērunt.","After the city was captured, the soldiers departed."],["Caesare duce, Rōmānī vīcērunt.","With Caesar as commander, the Romans won."],["Hostibus appropinquantibus, portae clausae sunt.","As the enemy approached, the gates were closed."]],"vocab":[["sole ortō","when the sun had risen"],["urbe captā","with the city captured"],["Caesare duce","with Caesar as leader"],["hostibus appropinquantibus","as the enemy approached"],["orior, orīrī","rise"],["appropinquō","approach"],["circumstantia","circumstance"],["causa","cause"],["concessiō","concession"],["tempus","time"],["absolūtus","detached / absolute"],["participium","participle"]],"exercises":[{"t":"fill","q":"after the city was captured: urbe capt___","a":["ā"],"ex":""},{"t":"fill","q":"with Caesar as leader: Caesar___ duce","a":["e"],"ex":""},{"t":"mcq","q":"An ablative absolute is:","opts":["grammatically detached from the main clause","the direct object","always a condition","always passive in translation"],"a":0,"ex":""},{"t":"fill","q":"when the sun had risen: sole ___.","a":["ortō"],"ex":""},{"t":"mcq","q":"Two nouns can form an ablative absolute because:","opts":["sum lacks a present participle","Latin has no ablative","all nouns are verbs","it is direct speech"],"a":0,"ex":""},{"t":"fill","q":"as the enemy approached: hostibus appropinquant___","a":["ibus"],"ex":""}]},{"id":"a3","title":"Gerunds, gerundives & obligation","subtitle":"Verbal nouns and the passive periphrastic","grammar":"<h3>Gerund</h3><p>The neuter singular verbal noun appears in oblique cases: <b>ars scrībendī</b>, “the art of writing”; <b>ad scrībendum</b>, “for writing.”</p>\n<h3>Gerundive attraction</h3><p>Latin often replaces a gerund with object by a gerundive agreeing with that object: <b>ad librōs legendōs</b>, “for reading books.”</p>\n<h3>Passive periphrastic</h3><p>Gerundive + <b>sum</b> expresses obligation. The agent is dative: <b>Mihi liber legendus est</b>, “I must read the book.”</p>","examples":[["Ars bene scrībendī difficilis est.","The art of writing well is difficult."],["Ad librōs legendōs tempus mihi deest.","I lack time for reading books."],["Haec lēx omnibus servanda est.","This law must be observed by everyone."],["Nōbīs proficīscendum est.","We must set out."]],"vocab":[["scrībendī","of writing"],["legendōs","to be read"],["servandus","to be observed"],["mihi faciendum est","I must do it"],["nōbīs eundum est","we must go"],["ars, artis f.","art / skill"],["tempus deest","time is lacking"],["omnibus","by everyone / for everyone"],["obligātiō","obligation"],["gerundium","gerund"],["gerundīvum","gerundive"],["periphrasticus","periphrastic"]],"exercises":[{"t":"fill","q":"the art of writing: ars scrībend___","a":["ī"],"ex":""},{"t":"fill","q":"for reading books: ad librōs legend___","a":["ōs"],"ex":""},{"t":"mcq","q":"The agent of a passive periphrastic is usually:","opts":["dative","ā/ab + ablative","accusative","genitive"],"a":0,"ex":""},{"t":"fill","q":"We must go: Nōbīs eundum ___.","a":["est"],"ex":""},{"t":"fill","q":"This law must be observed: Haec lēx servanda ___.","a":["est"],"ex":""},{"t":"mcq","q":"<i>ad scrībendum</i> expresses:","opts":["purpose","possession","comparison","direct address"],"a":0,"ex":""}]},{"id":"a4","title":"Sequence of tenses & reported speech","subtitle":"Keep relative time consistent","grammar":"<p>Primary main verbs (present/future/perfect with present force) normally take present or perfect subjunctive for simultaneous/subsequent or prior action. Historic main verbs normally take imperfect or pluperfect subjunctive.</p>\n<table class=\"gr\"><tr><th>Main sequence</th><th>Simultaneous/subsequent</th><th>Prior</th></tr><tr><td>Primary</td><td>present subj.</td><td>perfect subj.</td></tr><tr><td>Historic</td><td>imperfect subj.</td><td>pluperfect subj.</td></tr></table>\n<p>In extended indirect discourse, principal assertions become infinitives while subordinate clauses generally use the subjunctive.</p>","examples":[["Rogat quid faciās.","He asks what you are doing."],["Rogāvit quid facerēs.","He asked what you were doing."],["Nesciō cūr vēnerit.","I do not know why he came."],["Nesciēbam cūr vēnisset.","I did not know why he had come."]],"vocab":[["tempus prīmārium","primary tense"],["tempus historicum","historic tense"],["simultāneus","simultaneous"],["prior","prior"],["subsequēns","subsequent"],["rogat","asks"],["rogāvit","asked"],["faciās","you are doing"],["facerēs","you were doing"],["vēnerit","he came / has come"],["vēnisset","he had come"],["cōnsecūtiō temporum","sequence of tenses"]],"exercises":[{"t":"fill","q":"He asks what you are doing: Rogat quid ___.","a":["faciās"],"ex":""},{"t":"fill","q":"He asked what you were doing: Rogāvit quid ___.","a":["facerēs"],"ex":""},{"t":"mcq","q":"A historic main verb normally takes for simultaneous action:","opts":["imperfect subjunctive","present subjunctive","future indicative","perfect infinitive"],"a":0,"ex":""},{"t":"fill","q":"I did not know why he had come: Nesciēbam cūr ___.","a":["vēnisset"],"ex":""},{"t":"mcq","q":"In extended indirect discourse, principal assertions are commonly:","opts":["infinitives","imperatives","ablatives absolute","vocatives"],"a":0,"ex":""},{"t":"fill","q":"I do not know why he came: Nesciō cūr ___.","a":["vēnerit"],"ex":""}]},{"id":"a5","title":"Latin prose style","subtitle":"Period, emphasis and the architecture of a sentence","grammar":"<p>Latin prose can postpone the main verb, frame clauses with paired words, and embed participles or subordinate clauses before resolving the sentence. Read by units, not by translating one word at a time.</p>\n<h3>A disciplined reading sequence</h3><ol><li>Mark finite verbs and clause introducers.</li><li>Find subjects and objects from endings.</li><li>Join adjectives, genitives and participles to their heads.</li><li>Resolve subordinate clauses.</li><li>Only then produce idiomatic English.</li></ol>\n<p>Common connective pairs include <b>non solum... sed etiam</b>, <b>ut... ita</b>, <b>cum... tum</b>, <b>tanto... quanto</b>.</p>","examples":[["Nōn sōlum fortis sed etiam prūdēns erat.","He was not only brave but also prudent."],["Ut sēmentem fēceris, ita metēs.","As you have sown, so shall you reap."],["Tantō maior erat glōria, quantō gravius perīculum.","The greater the danger, the greater the glory."],["His rēbus cognītīs, Caesar cōnsilium cēpit.","After learning these things, Caesar formed a plan."]],"vocab":[["nōn sōlum... sed etiam","not only... but also"],["ut... ita","as... so"],["cum... tum","both... and / when... then"],["tantō... quantō","the more... the more"],["prūdēns","prudent"],["glōria","glory"],["perīculum","danger"],["cognōscō","learn / recognise"],["cōnsilium capiō","form a plan"],["periodus","periodic sentence"],["emphasis","emphasis"],["hyperbaton","separation of linked words"]],"exercises":[{"t":"fill","q":"not only... but also: nōn sōlum... sed ___","a":["etiam"],"ex":""},{"t":"mcq","q":"A sound first step in reading a long sentence is to:","opts":["mark finite verbs and clause introducers","translate every word in order","ignore endings","find an English translation"],"a":0,"ex":""},{"t":"fill","q":"the more... the more: tantō... ___","a":["quantō"],"ex":""},{"t":"fill","q":"After these things were learned: His rēbus ___.","a":["cognītīs"],"ex":""},{"t":"mcq","q":"Hyperbaton is:","opts":["separation of words that belong together","a passive verb","a case ending","a prose author"],"a":0,"ex":""},{"t":"fill","q":"Caesar formed a plan: Caesar cōnsilium ___.","a":["cēpit"],"ex":""}]},{"id":"a6","title":"Poetry, metre & reading without a translation","subtitle":"From grammatical decoding to literary attention","grammar":"<h3>Dactylic hexameter</h3><p>Each line has six feet. A foot is usually a dactyl (— ⏑ ⏑) or spondee (— —); the fifth is commonly a dactyl, and the sixth ends — x. Elision and vowel quantity matter.</p>\n<h3>Poetic language</h3><p>Expect freer word order, omitted forms of <b>sum</b>, Greek forms, archaism, and words separated for emphasis or sound. Do not treat prose order as a mechanical key.</p>\n<h3>Graduated assistance</h3><p>In the Reading Room, first read unaided; then reveal lexical glosses, notes and finally the translation. The aim is to remove assistance over repeated readings.</p>","examples":[["Arma virumque canō.","I sing of arms and the man."],["Carpe diem.","Seize the day."],["Omnia vincit Amor.","Love conquers all things."],["Sunt lacrimae rērum.","There are tears for things / the world’s suffering has tears."]],"vocab":[["hexameter","hexameter"],["dactylus","dactyl"],["spondēus","spondee"],["elīsiō","elision"],["caesūra","caesura"],["quantitās","quantity"],["versus","verse / line"],["carmen","poem / song"],["poēta","poet"],["canō","sing"],["lacrimae","tears"],["rēs","thing / circumstance"]],"exercises":[{"t":"mcq","q":"A dactyl is:","opts":["— ⏑ ⏑","— — only","⏑ ⏑ ⏑","x x"],"a":0,"ex":""},{"t":"fill","q":"Seize the day: ___ diem.","a":["Carpe"],"ex":""},{"t":"mcq","q":"The final translation should normally be revealed:","opts":["after attempting the Latin","before looking at the Latin","instead of reading","automatically"],"a":0,"ex":""},{"t":"fill","q":"Love conquers all things: Omnia vincit ___.","a":["Amor"],"ex":""},{"t":"mcq","q":"Poetry often has:","opts":["freer word order and elision","no case endings","only present tense","no subordinate clauses"],"a":0,"ex":""},{"t":"fill","q":"I sing of arms and the man: Arma virumque ___.","a":["canō"],"ex":""}]}]}];
const READINGS=[{"id":"c1","title":"In the villa","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Iūlia in villā habitat. Villa parva est, sed hortum magnum habet. Iūlia rosās amat et aquam ad hortum portat. Fīlia Iūliae cum amīcā ambulat. Sub arbore sedent et librum legunt. Ad vesperum agricola ex agrīs venit. Omnēs in villā cēnam exspectant.","translation":"Julia lives in a country house. The house is small, but it has a large garden. Julia loves roses and carries water to the garden. Julia’s daughter walks with a friend. They sit under a tree and read a book. Toward evening the farmer comes from the fields. Everyone in the house awaits dinner.","gloss":{"villā":"in a villa/country house","hortum":"garden (acc.)","rosās":"roses (acc. pl.)","portat":"carries","sub":"under","arbore":"tree (abl.)","vesperum":"evening","agrīs":"fields (abl. pl.)","cēnam":"dinner","exspectant":"await"},"notes":["Notice the contrast between <b>in villā</b> (place where) and possible <b>in villam</b> (motion into).","<b>Iūliae</b> is genitive: “Julia’s.”","The verbs <b>sedent</b> and <b>legunt</b> have an understood plural subject."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"Iūlia in villā habitat. Villa parva est, sed hortum magnum habet. Iūlia rosās amat et aquam ad hortum portat. Fīlia Iūliae cum amīcā ambulat. Sub arbore sedent et librum legunt. Ad vesperum agricola ex agrīs venit. Omnēs in villā cēnam exspectant."},{"id":"c2","title":"A morning in the Forum","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Mārcus māne ad forum venit. Multōs hominēs videt: mercātōrēs mercēs vēndunt, causidicus clientem monet, puer nuntium portat. Mārcus amīcum salūtat et cum eō ad templum ambulat. Ibi senātor populum alloquitur. Verba senātōris Mārcum movent.","translation":"Marcus comes to the Forum in the morning. He sees many people: merchants sell goods, a lawyer advises a client, and a boy carries a message. Marcus greets a friend and walks with him to the temple. There a senator addresses the people. The senator’s words move Marcus.","gloss":{"māne":"in the morning","forum":"Forum","mercātōrēs":"merchants","mercēs":"goods","vēndunt":"sell","causidicus":"advocate / pleader","clientem":"client (acc.)","nuntium":"message","salūtat":"greets","alloquitur":"addresses (deponent)","movent":"move / affect"},"notes":["<b>Multōs hominēs</b> is accusative after <b>videt</b>.","<b>cum eō</b> means “with him”; <b>eō</b> is ablative.","<b>senātōris</b> is genitive singular."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"Mārcus māne ad forum venit. Multōs hominēs videt: mercātōrēs mercēs vēndunt, causidicus clientem monet, puer nuntium portat. Mārcus amīcum salūtat et cum eō ad templum ambulat. Ibi senātor populum alloquitur. Verba senātōris Mārcum movent."},{"id":"c3","title":"The journey to Rome","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Lūcius multōs annōs in oppidō habitābat. Rōmam tamen vidēre cupiēbat. Itaque cum frātre profectus est. Prīmō diē via facilis erat; deinde magna tempestās orta est. Viātōrēs in caupōnā manserunt. Postrīdiē caelum clārum fuit, et ante noctem moenia Rōmae vīdērunt.","translation":"Lucius had lived for many years in a town, but he wanted to see Rome. And so he set out with his brother. On the first day the road was easy; then a great storm arose. The travellers remained in an inn. The next day the sky was clear, and before night they saw the walls of Rome.","gloss":{"oppidō":"town (abl.)","cupiēbat":"was desiring","itaque":"and so","profectus est":"set out (deponent perfect)","prīmō diē":"on the first day","tempestās":"storm","orta est":"arose","viātōrēs":"travellers","caupōnā":"inn (abl.)","postrīdiē":"the next day","moenia":"walls"},"notes":["<b>Rōmam</b> is accusative of motion toward without a preposition.","The imperfects supply background; the perfects advance the narrative.","<b>Rōmae</b> is genitive after <b>moenia</b>."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"Lūcius multōs annōs in oppidō habitābat. Rōmam tamen vidēre cupiēbat. Itaque cum frātre profectus est. Prīmō diē via facilis erat; deinde magna tempestās orta est. Viātōrēs in caupōnā manserunt. Postrīdiē caelum clārum fuit, et ante noctem moenia Rōmae vīdērunt."},{"id":"c4","title":"A message from the frontier","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Nuntius nocte ad urbem vēnit. Portae iam clausae erant, sed custōs clāmōrem audīvit. “Ā duce missus sum,” inquit nuntius. “Hostēs flūmen trānsiērunt et castra nostra oppugnant.” Custōs portam aperuit; nuntius ad senātum ductus est. Eādem nocte novae cōpiae missae sunt.","translation":"A messenger came to the city at night. The gates had already been closed, but the guard heard shouting. “I have been sent by the commander,” said the messenger. “The enemy have crossed the river and are attacking our camp.” The guard opened the gate; the messenger was led to the senate. That same night new forces were sent.","gloss":{"nuntius":"messenger","custōs":"guard","clāmōrem":"shout / noise","ā duce":"by the commander","missus sum":"I was/have been sent","flūmen":"river","trānsiērunt":"crossed","castra":"camp (neut. pl.)","oppugnant":"attack","ductus est":"was led","cōpiae":"forces / troops"},"notes":["<b>clausae erant</b> is pluperfect passive.","<b>castra</b> is grammatically plural though translated singular.","<b>Eādem nocte</b> is ablative of time when."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"Nuntius nocte ad urbem vēnit. Portae iam clausae erant, sed custōs clāmōrem audīvit. “Ā duce missus sum,” inquit nuntius. “Hostēs flūmen trānsiērunt et castra nostra oppugnant.” Custōs portam aperuit; nuntius ad senātum ductus est. Eādem nocte novae cōpiae missae sunt."},{"id":"c5","title":"The senator’s decision","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Senātor, quī rem pūblicam diū servāverat, cīvēs convocāvit. Dīxit urbem in magnō perīculō esse. Rogāvit quid faciendum esset et quī mīlitēs dūcere posset. Iuvenis quidam surrēxit ut auxilium offerret. Tam fortiter locūtus est ut omnēs eum laudārent. Senātus eum mīsit nē hostēs urbem caperent.","translation":"A senator who had long protected the state summoned the citizens. He said that the city was in great danger. He asked what had to be done and who could lead the soldiers. A certain young man rose to offer help. He spoke so bravely that everyone praised him. The senate sent him so that the enemy would not capture the city.","gloss":{"rem pūblicam":"state / commonwealth","diū":"for a long time","convocāvit":"summoned","in perīculō":"in danger","faciendum esset":"had to be done","iuvenis":"young man","surrēxit":"rose","auxilium":"help","offerret":"might offer","locūtus est":"spoke","laudārent":"praised (subj.)"},"notes":["The relative <b>quī</b> is nominative because it is subject of <b>servāverat</b>.","<b>urbem ... esse</b> is indirect statement.","The final <b>nē</b>-clause expresses negative purpose."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"Senātor, quī rem pūblicam diū servāverat, cīvēs convocāvit. Dīxit urbem in magnō perīculō esse. Rogāvit quid faciendum esset et quī mīlitēs dūcere posset. Iuvenis quidam surrēxit ut auxilium offerret. Tam fortiter locūtus est ut omnēs eum laudārent. Senātus eum mīsit nē hostēs urbem caperent."},{"id":"c6","title":"The storm at sea","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Sole occidente, nāvis portum relīquit. Nautae, quamquam ventum timēbant, cursum tenēbant. Mediā nocte tempestās orta est, fluctibus nāvem pulsantibus. Magister clāmāvit ut vēla contraherentur. Omnibus labōrantibus, nāvis servāta est; lūce ortā, īnsulam procul vīdērunt.","translation":"As the sun was setting, the ship left the harbour. Although the sailors feared the wind, they held their course. At midnight a storm arose, with the waves striking the ship. The captain shouted for the sails to be drawn in. With everyone working, the ship was saved; at dawn they saw an island far away.","gloss":{"sole occidente":"as the sun was setting","nāvis":"ship","portum":"harbour (acc.)","quamquam":"although","cursum tenēbant":"held their course","fluctibus":"waves (abl.)","pulsantibus":"striking","vēla":"sails","contraherentur":"be drawn in","lūce ortā":"when daylight arose","procul":"far away"},"notes":["<b>Sole occidente</b>, <b>fluctibus ... pulsantibus</b>, <b>omnibus labōrantibus</b> and <b>lūce ortā</b> are ablative absolutes.","<b>ut vēla contraherentur</b> is a substantive command after <b>clāmāvit</b>.","The passive <b>servāta est</b> makes <b>nāvis</b> the subject."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"Sole occidente, nāvis portum relīquit. Nautae, quamquam ventum timēbant, cursum tenēbant. Mediā nocte tempestās orta est, fluctibus nāvem pulsantibus. Magister clāmāvit ut vēla contraherentur. Omnibus labōrantibus, nāvis servāta est; lūce ortā, īnsulam procul vīdērunt."},{"id":"c7","title":"The monk and the manuscript","author":"Controlled Latin","work":"Original graded reading","level":"Reading Latin","kind":"Controlled","text":"In monasteriō vetere monachus librum antīquum invēnit. Multae litterae aetāte obscūrātae erant, sed titulus adhūc legī poterat. Monachus putāvit librum ā poētā Rōmānō scrīptum esse. Nē verba perīrent, exemplum facere cōnstituit. Mēnsibus labōrāvit, singulās litterās magnā cūrā trānscrībēns.","translation":"In an old monastery a monk found an ancient book. Many letters had been obscured by age, but the title could still be read. The monk thought that the book had been written by a Roman poet. So that the words would not perish, he decided to make a copy. He worked for months, transcribing each letter with great care.","gloss":{"monasteriō":"monastery","monachus":"monk","invēnit":"found","aetāte":"by age","obscūrātae erant":"had been obscured","titulus":"title","adhūc":"still","legī poterat":"could be read","perīrent":"might perish","exemplum":"copy","singulās":"each individual","trānscrībēns":"transcribing"},"notes":["The passage deliberately uses later Latin subject matter but broadly classical morphology.","<b>librum ... scrīptum esse</b> is perfect passive indirect statement.","<b>trānscrībēns</b> agrees with <b>monachus</b>."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"In monasteriō vetere monachus librum antīquum invēnit. Multae litterae aetāte obscūrātae erant, sed titulus adhūc legī poterat. Monachus putāvit librum ā poētā Rōmānō scrīptum esse. Nē verba perīrent, exemplum facere cōnstituit. Mēnsibus labōrāvit, singulās litterās magnā cūrā trānscrībēns."},{"id":"c8","title":"On the stars","author":"Controlled Latin","work":"Original neo-Latin reading","level":"Reading Latin","kind":"Controlled","text":"Astronomī stellās observant ut nātūram caelī intellegant. Lūx, quae ā stellīs ad terram mittitur, per immēnsa spatia iter facit. Quō longius stella abest, eō antīquiōrem lūcem vidēmus. Itaque caelum spectantēs nōn modo loca remōta sed etiam tempora praeterita contemplāmur.","translation":"Astronomers observe the stars in order to understand the nature of the heavens. Light, which is sent from the stars to Earth, makes a journey through immense spaces. The farther away a star is, the older the light we see. And so, when looking at the sky, we contemplate not only distant places but also past times.","gloss":{"astronomī":"astronomers","stellās":"stars","observant":"observe","nātūram caelī":"nature of the heavens","lūx":"light","mittitur":"is sent","immēnsa spatia":"immense spaces","quō... eō":"the more... the more","antīquiōrem":"older","spectantēs":"looking at","remōta":"distant","contemplāmur":"we contemplate"},"notes":["<b>ut ... intellegant</b> is purpose.","<b>quae</b> agrees with <b>lūx</b> and is subject of <b>mittitur</b>.","<b>quō ... eō</b> correlates two comparatives."],"source":"","license":"Public-domain ancient or historical text; transcription/source linked below.","macron":"Astronomī stellās observant ut nātūram caelī intellegant. Lūx, quae ā stellīs ad terram mittitur, per immēnsa spatia iter facit. Quō longius stella abest, eō antīquiōrem lūcem vidēmus. Itaque caelum spectantēs nōn modo loca remōta sed etiam tempora praeterita contemplāmur."},{"id":"r1","title":"Gaul divided","author":"Julius Caesar","work":"De bello Gallico 1.1","level":"Intermediate","kind":"Classical prose","text":"Gallia est omnis divisa in partes tres, quarum unam incolunt Belgae, aliam Aquitani, tertiam qui ipsorum lingua Celtae, nostra Galli appellantur.","translation":"Gaul as a whole is divided into three parts: one of these the Belgae inhabit, another the Aquitani, and the third those who in their own language are called Celts and in ours Gauls.","gloss":{"omnis":"as a whole / all","divisa":"divided","partes":"parts","quarum":"of which","unam":"one (part)","incolunt":"inhabit","aliam":"another","tertiam":"a third","ipsorum":"their own","lingua":"language (abl.)","appellantur":"are called"},"notes":["The main verb is <b>est divisa</b>; <b>Gallia omnis</b> is its subject.","<b>quarum</b> refers to <b>partes</b>.","The verbs <b>incolunt</b> and <b>appellantur</b> have different subjects."],"source":"https://scaife.perseus.org/reader/urn:cts:latinLit:phi0448.phi001.perseus-lat2:1.1.1/","license":"Reading transcription derived from Perseus/Open Greek and Latin; corpus material is distributed under a Creative Commons ShareAlike licence. Translation and learning notes in this app are original.","macron":""},{"id":"r2","title":"Hannibal judged","author":"Cornelius Nepos","work":"Hannibal 1.1","level":"Advanced prose","kind":"Classical prose","text":"Hannibal, Hamilcaris filius, Carthaginiensis. Si verum est, quod nemo dubitat, ut populus Romanus omnes gentes virtute superarit, non est infitiandum Hannibalem tanto praestitisse ceteros imperatores prudentia, quanto populus Romanus antecedat fortitudine cunctas nationes.","translation":"Hannibal, son of Hamilcar, a Carthaginian. If it is true—as no one doubts—that the Roman people has surpassed all nations in courage, it must be admitted that Hannibal surpassed other commanders in judgment by as much as the Roman people surpasses all nations in bravery.","gloss":{"Hamilcaris filius":"son of Hamilcar","Carthaginiensis":"Carthaginian","si verum est":"if it is true","nemo dubitat":"no one doubts","superarit":"has surpassed (syncopated perfect subj.)","infitiandum":"to be denied","praestitisse":"to have surpassed / excelled","prudentia":"judgment (abl.)","quanto... tanto":"by as much... by so much","antecedat":"surpasses","fortitudine":"bravery"},"notes":["The long sentence is framed by a comparison: Rome surpasses nations in courage; Hannibal surpasses generals in prudence.","<b>non est infitiandum</b> is an impersonal passive periphrastic.","<b>Hannibalem ... praestitisse</b> is accusative + infinitive."],"source":"https://scaife.perseus.org/reader/urn:cts:latinLit:phi0588.abo023.perseus-lat2:1/","license":"Reading transcription derived from Perseus/Open Greek and Latin; corpus material is distributed under a Creative Commons ShareAlike licence. Translation and learning notes in this app are original.","macron":""},{"id":"r3","title":"In the beginning","author":"Latin Vulgate","work":"John 1:1–5","level":"Intermediate","kind":"Late / Christian Latin","text":"In principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in principio apud Deum. Omnia per ipsum facta sunt: et sine ipso factum est nihil, quod factum est. In ipso vita erat, et vita erat lux hominum: et lux in tenebris lucet, et tenebrae eam non comprehenderunt.","translation":"In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through him, and without him nothing was made that was made. In him was life, and the life was the light of human beings; and the light shines in the darkness, and the darkness did not overcome it.","gloss":{"in principio":"in the beginning","Verbum":"Word","apud":"with / in the presence of","per ipsum":"through him","facta sunt":"were made","sine ipso":"without him","nihil":"nothing","vita":"life","lux":"light","hominum":"of human beings","tenebris":"darkness","comprehenderunt":"grasped / overcame"},"notes":["The word order <b>Deus erat Verbum</b> is rhetorically marked.","<b>facta sunt</b> agrees with neuter plural <b>omnia</b>.","The final verb can mean “did not grasp,” “did not comprehend,” or “did not overcome,” depending on interpretation."],"source":"https://la.wikisource.org/wiki/Biblia_Sacra_Vulgata_(Stuttgartensia)/Ioannes","license":"Biblical Latin text is public domain; the linked transcription may have its own site-level reuse terms. Translation and notes are original.","macron":""},{"id":"r4","title":"How long, Catiline?","author":"Marcus Tullius Cicero","work":"In Catilinam 1.1","level":"Advanced prose","kind":"Oratory","text":"Quo usque tandem abutere, Catilina, patientia nostra? Quam diu etiam furor iste tuus nos eludet? Quem ad finem sese effrenata iactabit audacia?","translation":"How long, Catiline, will you abuse our patience? How much longer will that madness of yours mock us? To what limit will your unbridled audacity hurl itself?","gloss":{"quo usque":"how long / to what point","tandem":"at last / then","abutere":"will you abuse (future deponent)","patientia":"patience (abl.)","quam diu":"how long","furor":"madness","iste tuus":"that of yours","eludet":"will mock / evade","quem ad finem":"to what limit","sese":"itself","effrenata":"unbridled","iactabit":"will toss / flaunt"},"notes":["Three questions build pressure through anaphora and escalating vocabulary.","<b>abutere</b> governs the ablative <b>patientia</b>.","<b>iste</b> can carry a dismissive or hostile tone."],"source":"https://scaife.perseus.org/reader/urn:cts:latinLit:phi0474.phi013.perseus-lat2:1.1/","license":"Reading transcription derived from Perseus/Open Greek and Latin; corpus material is distributed under a Creative Commons ShareAlike licence. Translation and learning notes in this app are original.","macron":""},{"id":"r5","title":"Let us live and love","author":"Catullus","work":"Carmina 5.1–6","level":"Intermediate poetry","kind":"Lyric poetry","text":"Vivamus, mea Lesbia, atque amemus,\nrumoresque senum severiorum\nomnes unius aestimemus assis!\nsoles occidere et redire possunt:\nnobis cum semel occidit brevis lux,\nnox est perpetua una dormienda.","translation":"Let us live, my Lesbia, and let us love, and value all the mutterings of sterner old men at a single penny. Suns can set and return; for us, once our brief light has set, one perpetual night must be slept.","gloss":{"vivamus":"let us live","amemus":"let us love","rumores":"mutterings / rumours","senum":"of old men","severiorum":"rather stern","unius assis":"at one as / a penny","aestimemus":"let us value","soles":"suns / days","occidere":"set / fall","semel":"once","brevis lux":"brief light","dormienda":"must be slept"},"notes":["The first three verbs are hortatory subjunctives.","<b>unius assis</b> is genitive of value.","<b>nox ... dormienda</b> is a passive periphrastic: literally, “a night must be slept.”"],"source":"https://scaife.perseus.org/reader/urn:cts:latinLit:phi0472.phi001.perseus-lat2:5/","license":"Reading transcription derived from Perseus/Open Greek and Latin; corpus material is distributed under a Creative Commons ShareAlike licence. Translation and learning notes in this app are original.","macron":""},{"id":"r6","title":"A poem of transformations","author":"Ovid","work":"Metamorphoses 1.1–4","level":"Advanced poetry","kind":"Epic poetry","text":"In nova fert animus mutatas dicere formas\ncorpora; di, coeptis (nam vos mutastis et illas)\nadspirate meis primaque ab origine mundi\nad mea perpetuum deducite tempora carmen.","translation":"My spirit carries me to tell of forms changed into new bodies. Gods, breathe favourably upon my undertakings—for you changed those too—and draw down my continuous song from the first origin of the world to my own times.","gloss":{"in nova corpora":"into new bodies","fert animus":"my spirit impels me","mutatas formas":"changed forms","dicere":"to tell","di":"gods (voc.)","coeptis meis":"my undertakings","adspirate":"breathe upon / favour","illas":"those (undertakings)","origine mundi":"origin of the world","deducite":"draw down / spin out","perpetuum carmen":"continuous poem","tempora mea":"my own times"},"notes":["The hyperbaton separates <b>mutatas ... formas</b> around <b>dicere</b>.","<b>fert animus</b> takes a complementary infinitive.","The poem announces continuous history from creation to Ovid’s present."],"source":"https://scaife.perseus.org/reader/urn:cts:latinLit:phi0959.phi006.perseus-lat2:1.1.6/","license":"Reading transcription derived from Perseus/Open Greek and Latin; corpus material is distributed under a Creative Commons ShareAlike licence. Translation and learning notes in this app are original.","macron":""},{"id":"r7","title":"Arms and the man","author":"Vergil","work":"Aeneid 1.1–7","level":"Advanced poetry","kind":"Epic poetry","text":"Arma virumque cano, Troiae qui primus ab oris\nItaliam, fato profugus, Laviniaque venit\nlitora, multum ille et terris iactatus et alto\nvi superum saevae memorem Iunonis ob iram;\nmulta quoque et bello passus, dum conderet urbem,\ninferretque deos Latio, genus unde Latinum,\nAlbanique patres, atque altae moenia Romae.","translation":"I sing of arms and the man who first came from the shores of Troy to Italy and the Lavinian coast, an exile by fate, much tossed on land and sea by the power of the gods because of the mindful anger of savage Juno; and who suffered many things also in war, until he could found a city and bring his gods into Latium—from which came the Latin race, the Alban fathers, and the walls of lofty Rome.","gloss":{"arma virumque":"arms and the man","cano":"I sing","Troiae ab oris":"from Troy’s shores","fato profugus":"an exile by fate","litora":"shores","iactatus":"tossed","alto":"the deep sea","vi superum":"by the power of the gods","memorem iram":"unforgetting anger","passus":"having suffered","dum conderet":"until he founded","inferret":"brought in","unde":"from which","moenia":"walls"},"notes":["The object <b>virum</b> is the antecedent of <b>qui</b>, whose clause runs through <b>inferret</b>.","<b>fato</b>, <b>terris</b>, <b>alto</b> and <b>vi</b> are ablatives with different functions.","The subject of <b>venit</b> and <b>passus</b> is held across several lines."],"source":"https://scaife.perseus.org/reader/urn:cts:latinLit:phi0690.phi003.perseus-lat2:1.1-1.30/","license":"Reading transcription derived from Perseus/Open Greek and Latin; corpus material is distributed under a Creative Commons ShareAlike licence. Translation and learning notes in this app are original.","macron":""},{"id":"r8","title":"Seize the day","author":"Horace","work":"Odes 1.11","level":"Advanced poetry","kind":"Lyric poetry","text":"Tu ne quaesieris—scire nefas—quem mihi, quem tibi\nfinem di dederint, Leuconoe, nec Babylonios\ntemptaris numeros. ut melius, quidquid erit, pati!\nseu pluris hiemes seu tribuit Iuppiter ultimam,\nquae nunc oppositis debilitat pumicibus mare\nTyrrhenum: sapias, vina liques, et spatio brevi\nspem longam reseces. dum loquimur, fugerit invida\naetas: carpe diem, quam minimum credula postero.","translation":"Do not ask what end the gods have assigned to you or me, and do not consult Babylonian calculations. Endure whatever comes. Be wise, strain the wine, and cut back long hope to a short span. While we speak, envious time has fled: seize the day, trusting as little as possible in tomorrow.","gloss":{"ne quaesieris":"do not ask","scire nefas":"it is forbidden to know","finem":"end / limit","Babylonios numeros":"Babylonian calculations","quidquid erit":"whatever will be","hiemes":"winters","sapias":"be wise","vina liques":"strain the wine","spem reseces":"cut back hope","fugerit":"will have fled / has fled","invida aetas":"envious time","carpe diem":"seize the day","postero":"tomorrow"},"notes":["The poem opens with prohibitive perfect subjunctives.","<b>fugerit</b> is formally future perfect or perfect subjunctive; context gives the famous sense of time already slipping away.","<b>quam minimum credula</b> addresses Leuconoe: “trusting as little as possible.”"],"source":"https://scaife.perseus.org/reader/urn:cts:latinLit:phi0893.phi001.perseus-lat2:1.11/","license":"Reading transcription derived from Perseus/Open Greek and Latin; corpus material is distributed under a Creative Commons ShareAlike licence. Translation and learning notes in this app are original.","macron":""},{"id":"r9","title":"The restless heart","author":"Augustine of Hippo","work":"Confessions 1.1","level":"Advanced prose","kind":"Late / Christian Latin","text":"Magnus es, Domine, et laudabilis valde: magna virtus tua, et sapientiae tuae non est numerus. Et laudare te vult homo, aliqua portio creaturae tuae; et homo circumferens mortalitatem suam, circumferens testimonium peccati sui.","translation":"Great are you, Lord, and greatly worthy of praise; great is your power, and of your wisdom there is no number. A human being wishes to praise you, some small portion of your creat

lūtat, puer epistulam ad tabernam portat. In forō magna turba est. Mārcus cum amīcō ad templum properat. Ibi poēta clārus fābulam nārrat. Verba poētae Mārcum dēlectant.","translation":"Marcus walks to the Forum in the morning. He sees many men: slaves are carrying water, a master greets a friend, a boy carries a letter to a shop. In the Forum there is a great crowd. Marcus hurries with a friend to the temple. There a famous poet is telling a story. The poet’s words delight Marcus.","gloss":{"māne":"in the morning (indeclinable adverb)","forum":"the Forum (acc. after ad)","virōs":"men (acc. pl.)","servī":"slaves (nom. pl., subject of portant)","dominus":"master, owner","epistulam":"letter (acc.)","tabernam":"shop (acc. after ad)","turba":"crowd","properat":"hurries","fābulam":"story (acc.)","nārrat":"tells, relates","dēlectant":"they delight, please"},"notes":["<b>Multōs virōs</b> is accusative plural after <b>videt</b>; the <b>-ōs</b> on both words is the agreement at work.","Three short clauses share one colon. Each has its own nominative subject — <b>servī</b>, <b>dominus</b>, <b>puer</b> — and you can find them by their endings before you translate anything.","<b>poētae</b> is genitive singular, “the poet’s.” Remember that <b>poēta</b> is masculine, which is why the adjective in the previous sentence is <b>clārus</b>."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c3","title":"The journey to Rome","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Lūcius multōs annōs in oppidō parvō habitābat. Rōmam tamen vidēre cupiēbat. Itaque cum frātre iter longum fēcit. Prīmō diē via facilis erat; deinde magna tempestās caelum obscūrāvit. Viātōrēs in caupōnā mānsērunt. Postrīdiē caelum clārum fuit, et ante noctem moenia Rōmae vīdērunt.","translation":"Lucius had been living for many years in a small town, but he wanted to see Rome. And so he made a long journey with his brother. On the first day the road was easy; then a great storm darkened the sky. The travellers stayed in an inn. The next day the sky was clear, and before night they saw the walls of Rome.","gloss":{"oppidō":"town (abl.)","cupiēbat":"he was longing, wanted (imperfect)","itaque":"and so","iter":"journey (n., iter, itineris)","fēcit":"he made (perfect of faciō)","tempestās":"storm","obscūrāvit":"darkened (perfect)","Viātōrēs":"travellers","caupōnā":"inn (abl.)","mānsērunt":"they remained (perfect of maneō)","postrīdiē":"on the next day","moenia":"walls (n. pl.)"},"notes":["<b>Rōmam</b> is accusative of motion toward with no preposition. Names of towns, plus <b>domus</b> and <b>rūs</b>, work this way.","The imperfects <b>habitābat</b> and <b>cupiēbat</b> supply the standing background; the perfects <b>fēcit</b>, <b>obscūrāvit</b>, <b>mānsērunt</b>, <b>vīdērunt</b> move the story forward. Tense choice is narrative structure, not decoration.","<b>Rōmae</b> is genitive after <b>moenia</b> — the walls of Rome, not motion to Rome. Compare <b>Rōmam</b> in the second sentence."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c4","title":"A message from the frontier","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Nuntius nocte ad urbem vēnit. Portae iam clausae erant, sed custōs clāmōrem audīvit. “Ā duce missus sum,” inquit nuntius. “Hostēs flūmen trānsiērunt et castra nostra oppugnant.” Custōs portam aperuit; nuntius ad senātum ductus est. Eādem nocte novae cōpiae missae sunt.","translation":"A messenger came to the city at night. The gates had already been closed, but the guard heard shouting. “I have been sent by the commander,” said the messenger. “The enemy have crossed the river and are attacking our camp.” The guard opened the gate; the messenger was led to the senate. That same night new forces were sent.","gloss":{"nuntius":"messenger","custōs":"guard","clāmōrem":"shout / noise","ā duce":"by the commander","missus sum":"I was/have been sent","flūmen":"river","trānsiērunt":"crossed","castra":"camp (neut. pl.)","oppugnant":"attack","ductus est":"was led","cōpiae":"forces / troops"},"notes":["<b>clausae erant</b> is pluperfect passive.","<b>castra</b> is grammatically plural though translated singular.","<b>Eādem nocte</b> is ablative of time when."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c5","title":"The senator’s decision","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Senātor, quī rem pūblicam diū servāverat, cīvēs convocāvit. Dīxit urbem in magnō perīculō esse. Rogāvit quid cīvēs facere dēbērent et quī mīlitēs dūcere posset. Iuvenis quīdam surrēxit ut auxilium offerret. Tam fortiter dīxit ut omnēs eum laudārent. Senātus eum mīsit nē hostēs urbem caperent.","translation":"A senator who had long protected the state summoned the citizens. He said that the city was in great danger. He asked what the citizens ought to do and who could lead the soldiers. A certain young man rose to offer help. He spoke so bravely that everyone praised him. The senate sent him so that the enemy would not capture the city.","gloss":{"rem pūblicam":"the state, the commonwealth","diū":"for a long time","servāverat":"had preserved (pluperfect)","convocāvit":"summoned","in magnō perīculō":"in great danger","dēbērent":"ought (imperfect subjunctive in an indirect question)","Iuvenis":"young man","surrēxit":"stood up","auxilium":"help","offerret":"might offer (purpose)","laudārent":"praised (result)","caperent":"might capture (negative purpose)"},"notes":["The relative <b>quī</b> is nominative because it is the subject of <b>servāverat</b> inside its own clause, even though its antecedent <b>Senātor</b> is the subject of the main verb.","<b>urbem ... esse</b> is indirect statement: accusative subject plus infinitive after <b>Dīxit</b>.","Three subjunctive clauses do three different jobs here: <b>ut ... offerret</b> is purpose, <b>ut ... laudārent</b> is result after <b>Tam</b>, and <b>nē ... caperent</b> is negative purpose. Read the introducing word and the main-clause signpost before you decide."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c6","title":"The storm at sea","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Nāvis, quae vesperī portum relīquerat, in altum contendēbat. Nautae, quamquam ventum timēbant, cursum tenēbant. Mediā nocte tanta tempestās fuit ut undae nāvem pulsārent. Magister clāmāvit ut vēla contraherentur. Nautae tam fortiter labōrāvērunt ut nāvis servārētur. Cum prīma lūx rediisset, īnsulam procul vīdērunt.","translation":"The ship, which had left harbour in the evening, was making for the open sea. Although the sailors feared the wind, they held their course. At midnight there was so great a storm that the waves battered the ship. The captain shouted for the sails to be drawn in. The sailors worked so bravely that the ship was saved. When first light had returned, they saw an island far off.","gloss":{"vesperī":"in the evening","relīquerat":"had left (pluperfect of relinquō)","in altum":"into the deep, the open sea","contendēbat":"was making for, was straining","quamquam":"although (with the indicative)","cursum":"course (acc.)","undae":"waves","pulsārent":"battered (result)","Magister":"ship’s master, captain","contraherentur":"should be drawn in","servārētur":"was saved (imperfect passive subjunctive)","rediisset":"had returned (pluperfect subjunctive after cum)","procul":"far off"},"notes":["<b>quamquam</b> takes the indicative — a plain statement of fact conceded. Contrast the last sentence, where <b>Cum</b> takes the subjunctive.","<b>tanta ... ut</b> and <b>tam ... ut</b> are result clauses: the main clause plants a signpost, and <b>ut</b> reports what actually followed. A purpose clause has no such signpost.","<b>ut vēla contraherentur</b> after <b>clāmāvit</b> is an indirect command, and the verb inside it is passive: the order is that the sails <i>be</i> drawn in."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c7","title":"The monk and the manuscript","author":"Controlled Latin","work":"Original graded reading","level":"Reading Latin","kind":"Controlled","text":"In monasteriō vetere monachus librum antīquum invēnit. Multae litterae aetāte obscūrātae erant, sed titulus adhūc legī poterat. Monachus putāvit librum ā poētā Rōmānō scrīptum esse. Nē verba perīrent, exemplum facere cōnstituit. Mēnsibus labōrāvit, singulās litterās magnā cūrā trānscrībēns. Opere cōnfectō, exemplum in armāriō posuit.","translation":"In an old monastery a monk found an ancient book. Many letters had been obscured by age, but the title could still be read. The monk thought that the book had been written by a Roman poet. So that the words would not perish, he decided to make a copy. He worked for months, transcribing each letter with great care. When the work was finished, he placed the copy in a cupboard.","gloss":{"monasteriō":"monastery (abl.)","monachus":"monk","invēnit":"found","aetāte":"by age (ablative of cause)","obscūrātae erant":"had been obscured (pluperfect passive)","titulus":"title","adhūc":"still","legī poterat":"could be read (present passive infinitive)","perīrent":"might perish (negative purpose)","exemplum":"copy","Mēnsibus":"for months (ablative of time)","singulās":"each individual","trānscrībēns":"transcribing (present participle)","Opere cōnfectō":"the work having been finished (ablative absolute)","armāriō":"cupboard, book-chest (abl.)"},"notes":["<b>librum ... scrīptum esse</b> is a perfect passive indirect statement after <b>putāvit</b>: accusative subject, perfect passive infinitive.","<b>trānscrībēns</b> is a present participle agreeing with the subject <b>monachus</b>, describing action simultaneous with <b>labōrāvit</b>.","<b>Opere cōnfectō</b> is an ablative absolute. Neither word has any grammatical role in the main clause — that detachment is what “absolute” means."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c8","title":"On the stars","author":"Controlled Latin","work":"Original neo-Latin reading","level":"Reading Latin","kind":"Controlled","text":"Astronomī stellās observant ut nātūram caelī intellegant. Lūx, quae ā stellīs ad terram mittitur, per immēnsa spatia iter facit. Quō longius stella abest, eō antīquiōrem lūcem vidēmus. Itaque caelum spectantēs nōn modo loca remōta sed etiam tempora praeterita contemplāmur.","translation":"Astronomers observe the stars in order to understand the nature of the heavens. Light, which is sent from the stars to Earth, makes a journey through immense spaces. The farther away a star is, the older the light we see. And so, when looking at the sky, we contemplate not only distant places but also past times.","gloss":{"astronomī":"astronomers","stellās":"stars (acc. pl.)","observant":"they observe","nātūram caelī":"the nature of the heavens","lūx":"light","mittitur":"is sent (present passive)","immēnsa spatia":"immense spaces","Quō longius":"by how much the farther — first half of a correlative","eō antīquiōrem":"by that much the older — second half, answering Quō","spectantēs":"looking at (participle agreeing with the subject of contemplāmur)","remōta":"distant (n. pl. with loca)","contemplāmur":"we contemplate (deponent: passive form, active sense)"},"notes":["<b>ut ... intellegant</b> is purpose.","<b>quae</b> agrees with <b>lūx</b> and is subject of <b>mittitur</b>.","<b>quō ... eō</b> correlates two comparatives."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"r1","title":"Gaul divided","author":"Julius Caesar","work":"De bello Gallico 1.1","level":"Intermediate","kind":"Classical prose","text":"Gallia est omnis divisa in partes tres, quarum unam incolunt Belgae, aliam Aquitani, tertiam qui ipsorum lingua Celtae, nostra Galli appellantur.","translation":"Gaul as a whole is divided into three parts: one of these the Belgae inhabit, another the Aquitani, and the third those who in their own language are called Celts and in ours Gauls.","gloss":{"omnis":"as a whole / all","divisa":"divided","partes":"parts","quarum":"of which","unam":"one (part)","incolunt":"inhabit","aliam":"another","tertiam":"a third","ipsorum":"their own","lingua":"language (abl.)","appellantur":"are called"},"notes":["The main verb is <b>est divisa</b>; <b>Gallia omnis</b> is its subject.","<b>quarum</b> refers to <b>partes</b>.","The verbs <b>incolunt</b> and <b>appellantur</b> have different subjects."],"source":"https://www.thelatinlibrary.com/caesar/gall1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r2","title":"Hannibal judged","author":"Cornelius Nepos","work":"Hannibal 1.1","level":"Advanced prose","kind":"Classical prose","text":"Hannibal, Hamilcaris filius, Carthaginiensis. Si verum est, quod nemo dubitat, ut populus Romanus omnes gentes virtute superarit, non est infitiandum Hannibalem tanto praestitisse ceteros imperatores prudentia, quanto populus Romanus antecedat fortitudine cunctas nationes.","translation":"Hannibal, son of Hamilcar, a Carthaginian. If it is true—as no one doubts—that the Roman people has surpassed all nations in courage, it must be admitted that Hannibal surpassed other commanders in judgment by as much as the Roman people surpasses all nations in bravery.","gloss":{"Hamilcaris filius":"son of Hamilcar","Carthaginiensis":"a Carthaginian","infitiandum":"to be denied (gerundive of obligation)","praestitisse":"to have surpassed (perfect infinitive)","imperatores":"commanders","prudentia":"in judgement (ablative of respect)","tanto":"by so much — looks forward to quanto below","quanto":"by how much — completes the tanto ... quanto comparison","antecedat":"surpasses (subjunctive in a subordinate clause of indirect statement)","fortitudine":"in bravery (ablative of respect)","cunctas":"all","nationes":"nations"},"notes":["The long sentence is framed by a comparison: Rome surpasses nations in courage; Hannibal surpasses generals in prudence.","<b>non est infitiandum</b> is an impersonal passive periphrastic.","<b>Hannibalem ... praestitisse</b> is accusative + infinitive."],"source":"https://www.thelatinlibrary.com/nepos/nepos.hann.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r3","title":"In the beginning","author":"Latin Vulgate","work":"John 1:1–5","level":"Intermediate","kind":"Late / Christian Latin","text":"In principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in principio apud Deum. Omnia per ipsum facta sunt: et sine ipso factum est nihil, quod factum est. In ipso vita erat, et vita erat lux hominum: et lux in tenebris lucet, et tenebrae eam non comprehenderunt.","translation":"In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through him, and without him nothing was made that was made. In him was life, and the life was the light of human beings; and the light shines in the darkness, and the darkness did not overcome it.","gloss":{"in principio":"in the beginning","Verbum":"Word","apud":"with / in the presence of","per ipsum":"through him","facta sunt":"were made","sine ipso":"without him","nihil":"nothing","vita":"life","lux":"light","hominum":"of human beings","tenebris":"darkness","comprehenderunt":"grasped / overcame"},"notes":["The word order <b>Deus erat Verbum</b> is rhetorically marked.","<b>facta sunt</b> agrees with neuter plural <b>omnia</b>.","The final verb can mean “did not grasp,” “did not comprehend,” or “did not overcome,” depending on interpretation."],"source":"https://www.thelatinlibrary.com/bible/john.shtml","license":"Clementine Vulgate (1592), public domain. The Stuttgart critical edition is still in copyright and is deliberately not used here. Translation and notes are original.","hasMacrons":false},{"id":"r4","title":"How long, Catiline?","author":"Marcus Tullius Cicero","work":"In Catilinam 1.1","level":"Advanced prose","kind":"Oratory","text":"Quo usque tandem abutere, Catilina, patientia nostra? Quam diu etiam furor iste tuus nos eludet? Quem ad finem sese effrenata iactabit audacia?","translation":"How long, Catiline, will you abuse our patience? How much longer will that madness of yours mock us? To what limit will your unbridled audacity hurl itself?","gloss":{"quo usque":"how long / to what point","tandem":"at last / then","abutere":"will you abuse (future deponent)","patientia":"patience (abl.)","quam diu":"how long","furor":"madness","iste tuus":"that of yours","eludet":"will mock / evade","quem ad finem":"to what limit","sese":"itself","effrenata":"unbridled","iactabit":"will toss / flaunt"},"notes":["Three questions build pressure through anaphora and escalating vocabulary.","<b>abutere</b> governs the ablative <b>patientia</b>.","<b>iste</b> can carry a dismissive or hostile tone."],"source":"https://www.thelatinlibrary.com/cicero/cat1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r5","title":"Let us live and love","author":"Catullus","work":"Carmina 5.1–6","level":"Intermediate poetry","kind":"Lyric poetry","text":"Vivamus, mea Lesbia, atque amemus,\nrumoresque senum severiorum\nomnes unius aestimemus assis!\nsoles occidere et redire possunt:\nnobis cum semel occidit brevis lux,\nnox est perpetua una dormienda.","translation":"Let us live, my Lesbia, and let us love, and value all the mutterings of sterner old men at a single penny. Suns can set and return; for us, once our brief light has set, one perpetual night must be slept.","gloss":{"Vivamus":"let us live (hortatory subjunctive)","amemus":"let us love","rumores":"rumours, mutterings","senum":"of old men (gen. pl. of senex)","severiorum":"rather stern (comparative)","unius":"of a single — with assis at the line’s end","aestimemus":"let us value","assis":"an as, a penny (genitive of value)","occidere":"to set","semel":"once","brevis lux":"brief light","perpetua":"unbroken, everlasting","dormienda":"must be slept (gerundive of obligation)"},"notes":["The first three verbs are hortatory subjunctives.","<b>unius assis</b> is genitive of value.","<b>nox ... dormienda</b> is a passive periphrastic: literally, “a night must be slept.”"],"source":"https://www.thelatinlibrary.com/catullus.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r6","title":"A poem of transformations","author":"Ovid","work":"Metamorphoses 1.1–4","level":"Advanced poetry","kind":"Epic poetry","text":"In nova fert animus mutatas dicere formas\ncorpora; di, coeptis (nam vos mutastis et illas)\nadspirate meis primaque ab origine mundi\nad mea perpetuum deducite tempora carmen.","translation":"My spirit carries me to tell of forms changed into new bodies. Gods, breathe favourably upon my undertakings—for you changed those too—and draw down my continuous song from the first origin of the world to my own times.","gloss":{"In nova":"into new — agrees with corpora at the start of the next line, a famous hyperbaton","fert animus":"my spirit carries me","mutatas":"changed — agrees with formas later in the line","dicere":"to tell of","formas":"forms, shapes (object of dicere)","corpora":"bodies — the noun that In nova has been waiting for","di":"gods (vocative plural of deus)","coeptis":"undertakings (dative with adspirate); meis follows a line later","mutastis":"you have changed (syncopated for mutavistis)","illas":"those (i.e. the forms)","adspirate":"breathe upon, favour (imperative plural)","origine mundi":"the origin of the world","perpetuum":"continuous — agrees with carmen at the end of the line","deducite":"draw down, spin out (imperative plural)","tempora":"times; ad mea ... tempora, down to my own day","carmen":"song, poem (object of deducite)"},"notes":["The hyperbaton separates <b>mutatas ... formas</b> around <b>dicere</b>.","<b>fert animus</b> takes a complementary infinitive.","The poem announces continuous history from creation to Ovid’s present."],"source":"https://www.thelatinlibrary.com/ovid/ovid.met1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r7","title":"Arms and the man","author":"Vergil","work":"Aeneid 1.1–7","level":"Advanced poetry","kind":"Epic poetry","text":"Arma virumque cano, Troiae qui primus ab oris\nItaliam, fato profugus, Laviniaque venit\nlitora, multum ille et terris iactatus et alto\nvi superum saevae memorem Iunonis ob iram;\nmulta quoque et bello passus, dum conderet urbem,\ninferretque deos Latio, genus unde Latinum,\nAlbanique patres, atque altae moenia Romae.","translation":"I sing of arms and the man who first came from the shores of Troy to Italy and the Lavinian coast, an exile by fate, much tossed on land and sea by the power of the gods because of the mindful anger of savage Juno; and who suffered many things also in war, until he could found a city and bring his gods into Latium—from which came the Latin race, the Alban fathers, and the walls of lofty Rome.","gloss":{"arma virumque":"arms and the man","cano":"I sing","Troiae":"of Troy — with ab oris at the line’s end","ab oris":"from the shores","fato profugus":"an exile by fate","litora":"shores (n. pl., object of venit)","iactatus":"tossed about","alto":"the deep sea (abl.)","vi superum":"by the power of the gods above","memorem":"unforgetting — agrees with iram at the line’s end","ob iram":"because of the anger","passus":"having suffered (perfect participle of the deponent patior)","dum conderet":"until he could found (dum with the subjunctive, of purpose)","inferret":"might bring in","unde":"from which source","moenia":"city walls"},"notes":["The object <b>virum</b> is the antecedent of <b>qui</b>, whose clause runs through <b>inferret</b>.","<b>fato</b>, <b>terris</b>, <b>alto</b> and <b>vi</b> are ablatives with different functions.","The subject of <b>venit</b> and <b>passus</b> is held across several lines."],"source":"https://www.thelatinlibrary.com/vergil/aen1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r8","title":"Seize the day","author":"Horace","work":"Odes 1.11","level":"Advanced poetry","kind":"Lyric poetry","text":"Tu ne quaesieris—scire nefas—quem mihi, quem tibi\nfinem di dederint, Leuconoe, nec Babylonios\ntemptaris numeros. ut melius, quidquid erit, pati!\nseu pluris hiemes seu tribuit Iuppiter ultimam,\nquae nunc oppositis debilitat pumicibus mare\nTyrrhenum: sapias, vina liques, et spatio brevi\nspem longam reseces. dum loquimur, fugerit invida\naetas: carpe diem, quam minimum credula postero.","translation":"Do not ask — it is forbidden to know — what end the gods have assigned to me or to you, Leuconoe, and do not meddle with Babylonian calculations. How much better to endure whatever comes, whether Jupiter has allotted us more winters or this is the last, which now wears down the Tyrrhenian sea on the pumice rocks that face it. Be wise, strain the wine, and cut back long hope into a short span. While we speak, envious time will already have fled: seize the day, trusting as little as possible in tomorrow.","gloss":{"ne quaesieris":"do not ask (perfect subjunctive in a prohibition)","scire nefas":"it is forbidden to know","dederint":"have assigned (perfect subjunctive in an indirect question)","Leuconoe":"Leuconoe (vocative, a Greek name)","Babylonios":"Babylonian — agrees with numeros in the next line","temptaris":"do not try (syncopated for temptaveris)","numeros":"calculations, horoscopes","pluris hiemes":"more winters","tribuit":"has allotted","oppositis":"set against it (with pumicibus)","debilitat":"wears down","pumicibus":"pumice rocks (abl.)","sapias":"be wise (jussive subjunctive)","liques":"strain, filter","spatio brevi":"within a short span","spem longam":"long-reaching hope","reseces":"prune back","fugerit":"will have fled (future perfect)","invida":"envious — agrees with aetas at the start of the next line","aetas":"time, the passing of life","credula":"trusting (f. sg., addressed to Leuconoe)","postero":"to tomorrow (dative)"},"notes":["The poem opens with prohibitive perfect subjunctives.","<b>fugerit</b> is formally future perfect or perfect subjunctive; context gives the famous sense of time already slipping away.","<b>quam minimum credula</b> addresses Leuconoe: “trusting as little as possible.”"],"source":"https://www.thelatinlibrary.com/horace/carm1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r9","title":"The restless heart","author":"Augustine of Hippo","work":"Confessions 1.1","level":"Advanced prose","kind":"Late / Christian Latin","text":"Magnus es, Domine, et laudabilis valde: magna virtus tua, et sapientiae tuae non est numerus. Et laudare te vult homo, aliqua portio creaturae tuae; et homo circumferens mortalitatem suam, circumferens testimonium peccati sui.","translation":"Great are you, Lord, and greatly worthy of praise; great is your power, and of your wisdom there is no number. A human being wishes to praise you, some small portion of your creation—a human being carrying about his mortality and the testimony of his sin.","gloss":{"magnus es":"great are you","Domine":"Lord (voc.)","laudabilis valde":"greatly worthy of praise","virtus":"power / excellence","sapientiae tuae":"of your wisdom","non est numerus":"there is no number","laudare te":"to praise you","aliqua portio":"some portion","creaturae tuae":"of your creation","circumferens":"carrying around","mortalitatem":"mortality","testimonium":"testimony"},"notes":["The opening balances parallel clauses around repeated <b>magnus/magna</b>.","<b>laudare te vult homo</b> places the infinitive phrase first for emphasis.","The present participle <b>circumferens</b> agrees with <b>homo</b>."],"source":"https://www.thelatinlibrary.com/augustine/conf1.shtml","license":"Late-antique text, public domain. Translation and notes are original.","hasMacrons":false},{"id":"r10","title":"Judgment by peers","author":"Magna Carta","work":"Clause 39 (1215)","level":"Intermediate","kind":"Medieval legal Latin","text":"Nullus liber homo capiatur vel imprisonetur aut disseisiatur aut utlagetur aut exuletur aut aliquo modo destruatur, nec super eum ibimus nec super eum mittemus, nisi per legale iudicium parium suorum vel per legem terrae.","translation":"No free man shall be seized or imprisoned, dispossessed, outlawed, exiled or in any way destroyed; nor shall we proceed against him or send against him, except by the lawful judgment of his peers or by the law of the land.","gloss":{"Nullus liber homo":"no free man","capiatur":"shall be seized (jussive subjunctive)","imprisonetur":"shall be imprisoned (medieval Latin)","disseisiatur":"shall be dispossessed of his holding (feudal legal term)","utlagetur":"shall be outlawed","exuletur":"shall be exiled","destruatur":"shall be ruined","nec super eum ibimus":"nor shall we proceed against him","nisi":"except","legale iudicium":"lawful judgement","parium suorum":"of his peers","legem terrae":"the law of the land"},"notes":["The repeated present subjunctives have prescriptive force.","Several terms are medieval Latinisations of legal vocabulary rather than classical usage.","<b>nisi</b> introduces the limiting exception."],"source":"https://www.thelatinlibrary.com/magnacarta.html","license":"Medieval text, public domain. Translation and notes are original.","hasMacrons":false},{"id":"r11","title":"Quantity of matter","author":"Isaac Newton","work":"Principia, Definition I","level":"Advanced prose","kind":"Neo-Latin science","text":"Quantitas materiae est mensura eiusdem orta ex illius densitate et magnitudine conjunctim.","translation":"The quantity of matter is a measure of the same arising jointly from its density and magnitude.","gloss":{"quantitas materiae":"quantity of matter","mensura":"measure","eiusdem":"of the same","orta":"arising","illius":"of it / its","densitate":"density","magnitudine":"magnitude / volume","conjunctim":"jointly"},"notes":["<b>orta</b> is a perfect participle agreeing with <b>mensura</b>, but with active sense because <b>orior</b> is deponent.","Newton’s <b>magnitudo</b> here refers to bulk or volume.","Scientific Neo-Latin often uses compact nominal definitions."],"source":"https://la.wikisource.org/wiki/Philosophiae_Naturalis_Principia_Mathematica/Definitiones","license":"Newton’s 1687 Latin text is public domain. Translation and notes are original.","hasMacrons":false}];

3 pl.","ament","amārent","amāverint","amāvissent"]]},{"id":"regosubj","name":"regō — subjunctive active","headers":["Person","Present","Imperfect","Perfect","Pluperfect"],"rows":[["1 sg.","regam","regerem","rēxerim","rēxissem"],["2 sg.","regās","regerēs","rēxerīs","rēxissēs"],["3 sg.","regat","regeret","rēxerit","rēxisset"],["1 pl.","regāmus","regerēmus","rēxerīmus","rēxissēmus"],["2 pl.","regātis","regerētis","rēxerītis","rēxissētis"],["3 pl.","regant","regerent","rēxerint","rēxissent"]]},{"id":"sumsubj","name":"sum, possum — subjunctive","headers":["Person","sum pres.","sum imperf.","possum pres.","possum imperf."],"rows":[["1 sg.","sim","essem","possim","possem"],["2 sg.","sīs","essēs","possīs","possēs"],["3 sg.","sit","esset","possit","posset"],["1 pl.","sīmus","essēmus","possīmus","possēmus"],["2 pl.","sītis","essētis","possītis","possētis"],["3 pl.","sint","essent","possint","possent"]]},{"id":"sequor","name":"sequor — deponent, indicative","headers":["Person","Present","Imperfect","Future","Perfect"],"rows":[["1 sg.","sequor","sequēbar","sequar","secūtus sum"],["2 sg.","sequeris","sequēbāris","sequēris","secūtus es"],["3 sg.","sequitur","sequēbātur","sequētur","secūtus est"],["1 pl.","sequimur","sequēbāmur","sequēmur","secūtī sumus"],["2 pl.","sequiminī","sequēbāminī","sequēminī","secūtī estis"],["3 pl.","sequuntur","sequēbantur","sequentur","secūtī sunt"]]},{"id":"eofero","name":"eō, ferō, volō — irregular verbs, present","headers":["Person","eō (go)","ferō (carry)","volō (wish)","nōlō (not wish)"],"rows":[["1 sg.","eō","ferō","volō","nōlō"],["2 sg.","īs","fers","vīs","nōn vīs"],["3 sg.","it","fert","vult","nōn vult"],["1 pl.","īmus","ferimus","volumus","nōlumus"],["2 pl.","ītis","fertis","vultis","nōn vultis"],["3 pl.","eunt","ferunt","volunt","nōlunt"]]},{"id":"participles","name":"Participles of amō and sequor","headers":["Participle","amō (regular)","sequor (deponent)","Force"],"rows":[["Present active","amāns, amantis","sequēns, sequentis","simultaneous const REFS=[{"title":"Case functions at a glance","body":"<table class=\"gr\"><tr><th>Case</th><th>Core function</th><th>Example</th></tr>\n<tr><td>Nominative</td><td>subject / predicate</td><td><b>Caesar</b> dux est.</td></tr>\n<tr><td>Accusative</td><td>direct object; motion toward</td><td>urbem videt; Rōmam venit</td></tr>\n<tr><td>Genitive</td><td>possession / description</td><td>liber <b>Caesaris</b></td></tr>\n<tr><td>Dative</td><td>indirect object; reference; agent with gerundive</td><td>puellae dat; mihi faciendum est</td></tr>\n<tr><td>Ablative</td><td>means, manner, separation, circumstance</td><td>gladiō; cum amīcō; ab urbe</td></tr>\n<tr><td>Vocative</td><td>direct address</td><td>Salvē, Marce!</td></tr></table>"},{"title":"Personal endings","body":"<table class=\"gr\"><tr><th>Person</th><th>Active</th><th>Passive</th></tr>\n<tr><td>1 sg.</td><td>-ō / -m</td><td>-r</td></tr><tr><td>2 sg.</td><td>-s</td><td>-ris</td></tr>\n<tr><td>3 sg.</td><td>-t</td><td>-tur</td></tr><tr><td>1 pl.</td><td>-mus</td><td>-mur</td></tr>\n<tr><td>2 pl.</td><td>-tis</td><td>-minī</td></tr><tr><td>3 pl.</td><td>-nt</td><td>-ntur</td></tr></table>"},{"title":"Principal parts and stems","body":"<p>Learn verbs in four principal parts: <b>scrībō, scrībere, scrīpsī, scrīptum</b>.</p>\n<table class=\"gr\"><tr><th>Part</th><th>Supplies</th></tr><tr><td>1st: scrībō</td><td>present 1st singular and dictionary headword</td></tr>\n<tr><td>2nd: scrībere</td><td>present stem and conjugation</td></tr><tr><td>3rd: scrīpsī</td><td>perfect active stem</td></tr>\n<tr><td>4th: scrīptum</td><td>perfect passive participle and future active participle</td></tr></table>"},{"title":"Subjunctive sequence","body":"<table class=\"gr\"><tr><th>Main verb</th><th>Same/later time</th><th>Prior time</th></tr>\n<tr><td>Primary</td><td>present subjunctive</td><td>perfect subjunctive</td></tr>\n<tr><td>Historic</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table>\n<p>This is a default framework, not an iron rule. Authorial viewpoint, repraesentātiō and the independence of a clause can affect sequence.</p>"},{"title":"Reading a periodic sentence","body":"<ol><li>Circle finite verbs.</li><li>Bracket clauses introduced by relative pronouns, conjunctions and interrogatives.</li><li>Identify nominatives and accusatives from morphology.</li><li>Attach adjectives, genitives and participles to their heads.</li><li>Resolve the main clause before polishing the translation.</li></ol>"},{"title":"Classical pronunciation","body":"<table class=\"gr\"><tr><th>Spelling</th><th>Value</th></tr><tr><td>c</td><td>always hard</td></tr>\n<tr><td>g</td><td>always hard</td></tr><tr><td>v</td><td>approximately English w</td></tr>\n<tr><td>ae / oe</td><td>diphthongs</td></tr><tr><td>qu</td><td>kw</td></tr><tr><td>ti</td><td>not “sh” in restored Classical pronunciation</td></tr></table>"},{"title":"Which subjunctive clause is this?","body":"<table class=\"gr\"><tr><th>Clue in the sentence</th><th>Clause</th><th>Negative</th></tr><tr><td><b>ut</b> with no signpost before it</td><td>purpose — “in order that”</td><td><b>nē</b></td></tr><tr><td><b>tam, ita, sīc, tantus, tālis</b> then <b>ut</b></td><td>result — “so that in fact”</td><td><b>ut nōn</b></td></tr><tr><td>verb of asking, knowing, doubting + question word</td><td>indirect question</td><td><b>nōn</b></td></tr><tr><td>verb of ordering, urging, persuading + <b>ut</b></td><td>indirect command</td><td><b>nē</b></td></tr><tr><td><b>quī</b> after a negative or <b>sunt quī</b></td><td>relative of characteristic</td><td><b>nōn</b></td></tr><tr><td><b>cum</b> + subjunctive</td><td>circumstantial, causal or concessive</td><td><b>nōn</b></td></tr></table><p class=\"tip\">Read the introducing word <i>and</i> look back for a signpost before deciding. Purpose and result are told apart by what precedes <b>ut</b>, not by the subjunctive itself.</p>"},{"title":"Conditions","body":"<table class=\"gr\"><tr><th>Type</th><th>Protasis (sī…)</th><th>Apodosis</th></tr><tr><td>Simple fact</td><td>indicative</td><td>indicative</td></tr><tr><td>Future more vivid</td><td>future / future perfect</td><td>future</td></tr><tr><td>Future less vivid (“should… would”)</td><td>present subjunctive</td><td>present subjunctive</td></tr><tr><td>Present contrary to fact</td><td>imperfect subjunctive</td><td>imperfect subjunctive</td></tr><tr><td>Past contrary to fact</td><td>pluperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table>"},{"title":"Sequence of tenses","body":"<table class=\"gr\"><tr><th>Main verb</th><th>Same time as main verb</th><th>Time before main verb</th></tr><tr><td>Primary — present, future, future perfect, perfect with have</td><td>present subjunctive</td><td>perfect subjunctive</td></tr><tr><td>Secondary — imperfect, perfect, pluperfect</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table><p>Subjunctive tense marks time <i>relative</i> to the main verb, never absolute time. This is the single rule behind most reported speech in Latin prose.</p>"},{"title":"A reading procedure for long sentences","body":"<ol><li>Read to the full stop before translating anything.</li><li>Mark every finite verb. Each one is a clause.</li><li>Mark the words that introduce clauses: <b>ut, nē, cum, sī, quī, quod, quam</b>, question words.</li><li>Find the one main verb that is not inside any subordinate clause.</li><li>Attach the nominative to it, then the accusative, then everything else.</li><li>Only now put it into English — and in English word order, not Latin.</li></ol><p class=\"tip\">If you are stuck, you have almost always mis-identified a case ending or missed a clause boundary. Go back to step 2 rather than guessing at vocabulary.</p>"}];
"use strict";
/* ------------------------------------------------------------------ store */
const KEY = "lingua-latina-progress-v1";
const defaults = {
  completed: {}, scores: {}, readingDone: {}, cards: {}, extraCards: {},
  settings: { theme: "system", macrons: true, direction: "mix", cardScope: "reached" },
  activity: []
};
const store = {
  data: null, memOnly: false,
  load() {
    try {
      this.data = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || "{}"));
      this.data.settings = Object.assign({}, defaults.settings, this.data.settings || {});
      ["completed", "scores", "readingDone", "cards", "extraCards"].forEach(k => {
        if (!this.data[k] || typeof this.data[k] !== "object") this.data[k] = {};
      });
      if (!Array.isArray(this.data.activity)) this.data.activity = [];
    } catch (e) { this.data = JSON.parse(JSON.stringify(defaults)); this.memOnly = true; }
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; } }
};
store.load();

/* ------------------------------------------------------------- utilities */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LET = "A-Za-z\\u00C0-\\u00D6\\u00D8-\\u00F6\\u00F8-\\u024F";
function stripMacrons(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").normalize("NFC"); }
function norm(s) { return stripMacrons(String(s).toLowerCase()).replace(/[.,;:!?“”"'’—–()\[\]]/g, "").replace(/\s+/g, " ").trim(); }
function shuffled(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function route() { return location.hash.replace(/^#\/?/, "") || "home"; }
function go(r) { location.hash = "#/" + r; }
function allUnits() { return COURSE.flatMap(l => l.units.map(u => ({ ...u, level: l }))); }
function unit(id) { return allUnits().find(u => u.id === id); }
function reading(id) { return READINGS.find(r => r.id === id); }
function doneLevel(l) { return l.units.filter(u => store.data.completed[u.id]).length; }
function applyTheme() {
  let t = store.data.settings.theme;
  if (t === "system") t = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
}
function activity(type, id, extra) {
  store.data.activity.unshift(Object.assign({ type, id, at: Date.now() }, extra || {}));
  store.data.activity = store.data.activity.slice(0, 40);
}
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
}

/* ------------------------------------------------------- course sequence */
// Units the learner has actually reached: everything completed, plus the next one.
function reachedUnitIds() {
  const ids = [];
  for (const u of allUnits()) { ids.push(u.id); if (!store.data.completed[u.id]) break; }
  return ids;
}
function nextUnitRoute() {
  const u = allUnits().find(x => !store.data.completed[x.id]);
  return u ? "unit/" + u.id + "/lesson" : "readings";
}

/* ------------------------------------------------------------ flashcards */
function allCards() {
  const scope = store.data.settings.cardScope || "reached";
  const reach = new Set(reachedUnitIds());
  const c = [];
  allUnits().forEach(u => {
    if (scope === "all" || reach.has(u.id))
      u.vocab.forEach((v, i) => c.push({ id: "u:" + u.id + ":" + i, la: v[0], en: v[1], source: u.title }));
  });
  Object.entries(store.data.extraCards).forEach(([id, x]) => c.push(Object.assign({ id }, x)));
  return c;
}
function totalCourseCards() { return allUnits().reduce((n, u) => n + u.vocab.length, 0) + Object.keys(store.data.extraCards).length; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => !store.data.cards[c.id] || (store.data.cards[c.id].due || 0) <= now);
}

/* ---------------------------------------------------------------- render */
function render() {
  applyTheme();
  renderSidebar();
  const p = route().split("/");
  let out = "";
  if (p[0] === "home") out = viewHome();
  else if (p[0] === "level") out = viewLevel(p[1]);
  else if (p[0] === "unit") out = viewUnit(p[1], p[2] || "lesson");
  else if (p[0] === "quiz") out = viewQuiz(p[1]);
  else if (p[0] === "review") out = viewReview();
  else if (p[0] === "readings") out = viewReadings();
  else if (p[0] === "read") out = viewReading(p[1]);
  else if (p[0] === "flash") out = viewFlash();
  else if (p[0] === "flashrun") { startFlash(); return; }
  else if (p[0] === "reference") out = viewReference();
  else if (p[0] === "lab") out = viewLab();
  else if (p[0] === "settings") out = viewSettings();
  else out = viewHome();
  $("#main").innerHTML = (store.memOnly ? `<div class="banner">Browser storage is unavailable, so progress will not survive a reload. Export it from Settings before closing.</div>` : "") + out;
  $("#main").focus({ preventScroll: true });
}

function nav(path, ic, label, badge) {
  const a = route().split("/")[0], p = path.split("/")[0], on = a === p;
  return `<button class="navlink ${on ? "active" : ""}" ${on ? 'aria-current="page"' : ""} onclick="go('${path}')"><span class="ic" aria-hidden="true">${ic}</span>${label}${badge ? `<span class="badge">${badge}</span>` : ""}</button>`;
}
function renderSidebar() {
  const done = Object.keys(store.data.completed).length;
  $("#sidebar").innerHTML =
    `<div class="brand"><span class="seal" aria-hidden="true">L</span><div><b>Lingua Latina</b><small>Grammar → original texts</small></div></div>` +
    `<div class="navsec">Course</div>` + nav("home", "⌂", "Dashboard") +
    COURSE.map(l => nav("level/" + l.id, l.icon, l.short + " · " + l.tagline, doneLevel(l) + "/" + l.units.length)).join("") +
    nav("review", "↻", "Mixed review") +
    `<div class="navsec">Read</div>` + nav("readings", "▤", "Reading Room", Object.keys(store.data.readingDone).length + "/" + READINGS.length) +
    `<div class="navsec">Practice</div>` + nav("flash", "◫", "Flashcards", dueCards().length + " due") +
    nav("reference", "R", "Grammar reference") + nav("lab", "▦", "Morphology tables") +
    `<div class="navsec">Data</div>` + nav("settings", "⚙", "Settings", done + "/" + allUnits().length);
}

/* ------------------------------------------------------------------ home */
function viewHome() {
  const units = allUnits(), done = Object.keys(store.data.completed).length;
  const rd = Object.keys(store.data.readingDone).length, cards = allCards().length;
  const acts = store.data.activity.slice(0, 6).map(a => {
    let t = null;
    if (a.type === "unit") { const u = unit(a.id); if (u) t = `Practised <b>${esc(u.title)}</b>${a.pct != null ? ` — ${a.pct}%` : ""}`; }
    else if (a.type === "reading") { const r = reading(a.id); if (r) t = `Read <b>${esc(r.title)}</b>`; }
    else if (a.type === "flash") t = `Reviewed <b>${a.n}</b> flashcard${a.n === 1 ? "" : "s"}`;
    else if (a.type === "review") t = `Mixed review — <b>${a.pct}%</b>`;
    return t ? `<li>${t}<small> · ${ago(a.at)}</small></li>` : "";
  }).join("");

  return `<h1>Lingua Latina</h1><p class="sub">A structured path from first principles to increasingly independent reading of Latin prose and poetry.</p>
<div class="stats">
<div class="stat"><b>${done}/${units.length}</b><small>course units complete</small></div>
<div class="stat"><b>${rd}/${READINGS.length}</b><small>readings completed</small></div>
<div class="stat"><b>${cards}</b><small>vocabulary cards unlocked</small></div>
<div class="stat"><b>${dueCards().length}</b><small>reviews due</small></div></div>
<div class="card"><h2 style="margin-top:0">Method</h2>
<p>Learn the forms, practise the construction, then meet it in a text. In the Reading Room, begin unaided and reveal glosses, grammatical notes and translation only as you need them — in that order.</p>
<button class="btn primary" onclick="go('${done ? nextUnitRoute() : "level/found"}')">${done ? "Continue course" : "Begin Stage I"}</button>
<button class="btn" onclick="go('readings')">Open Reading Room</button>
${done ? `<button class="btn" onclick="go('review')">Mixed review</button>` : ""}</div>
${acts ? `<div class="card"><h2 style="margin-top:0">Recent work</h2><ul class="actlist">${acts}</ul></div>` : ""}
<h2>Course</h2>
${COURSE.map(l => `<div class="card levelcard" role="button" tabindex="0" onclick="go('level/${l.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('level/${l.id}')}"><div class="leveltop"><b>${l.icon} ${l.label}</b><span>${l.tagline}</span><span class="pct">${doneLevel(l)}/${l.units.length}</span></div><p>${l.desc}</p><div class="progress"><i style="width:${100 * doneLevel(l) / l.units.length}%"></i></div></div>`).join("")}
<h2>Reading Room</h2><div class="card"><p>Eight controlled readings written for this course, each restricted to the grammar taught up to its stage, then eleven passages of real Latin — Caesar, Cicero, Catullus, Vergil, Ovid, Horace, Nepos, the Vulgate, Augustine, Magna Carta and Newton.</p><button class="btn" onclick="go('readings')">Browse all ${READINGS.length}</button></div>`;
}

/* ----------------------------------------------------------- level, unit */
function viewLevel(id) {
  const l = COURSE.find(x => x.id === id);
  if (!l) return viewHome();
  return `<h1>${l.label}</h1><p class="sub">${l.desc}</p>` + l.units.map((u, i) =>
    `<div class="unitrow ${store.data.completed[u.id] ? "done" : ""}" role="button" tabindex="0" onclick="go('unit/${u.id}/lesson')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('unit/${u.id}/lesson')}"><span class="num" aria-hidden="true">${store.data.completed[u.id] ? "✓" : i + 1}</span><span class="t"><b>${u.title}</b><small>${u.subtitle}</small></span><span class="pill">${store.data.scores[u.id] != null ? store.data.scores[u.id] + "%" : "unit"}</span></div>`).join("");
}
function tabs(u, tab) {
  return `<div class="tabs" role="tablist">${["lesson", "examples", "vocabulary", "practice"].map(x =>
    `<button class="tab ${tab === x ? "active" : ""}" role="tab" aria-selected="${tab === x}" onclick="go('unit/${u.id}/${x}')">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}</div>`;
}
function viewUnit(id, tab) {
  const u = unit(id);
  if (!u) return viewHome();
  let body = "";
  if (tab === "lesson")
    body = `<div class="card grammar">${u.grammar}</div><button class="btn primary" onclick="go('unit/${u.id}/examples')">Continue to examples</button>`;
  if (tab === "examples")
    body = `<div class="card">${u.examples.map(e => `<div class="example"><span class="la" lang="la">${e[0]}</span><span class="en">${e[1]}</span></div>`).join("")}</div><button class="btn primary" onclick="go('unit/${u.id}/vocabulary')">Study vocabulary</button>`;
  if (tab === "vocabulary")
    body = `<div class="card vocab">${u.vocab.map(v => `<div><b lang="la">${v[0]}</b><br><span>${v[1]}</span></div>`).join("")}</div><button class="btn primary" onclick="go('unit/${u.id}/practice')">Practise this unit</button>`;
  if (tab === "practice")
    body = `<div class="card"><h2 style="margin-top:0">Unit practice</h2><p>${u.exercises.length} questions, shuffled each time, with an explanation after every answer. A score of 75% marks the unit complete.</p><button class="btn primary" onclick="go('quiz/${u.id}')">Start practice</button> ${store.data.scores[u.id] != null ? `<span class="pill">${store.data.scores[u.id]}% best</span>` : ""}</div>`;

/* ------------------------------------------------------------------ quiz */
let quiz = null;
function prepare(exercises) {
  return shuffled(exercises).map(e => {
    if (e.t !== "mcq") return Object.assign({}, e);
    const order = shuffled(e.opts.map((_, i) => i));
    return Object.assign({}, e, { opts: order.map(i => e.opts[i]), a: order.indexOf(e.a) });
  });
}
function viewQuiz(id) {
  const u = unit(id);
  if (!u) return viewHome();
  quiz = { title: u.title, unitId: u.id, back: "unit/" + u.id + "/practice", kind: "unit", qs: prepare(u.exercises), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>${u.title}</h1><p class="sub">Practice</p><div id="quizbox"></div>`;
}
function viewReview() {
  const reach = reachedUnitIds();
  const pool = allUnits().filter(u => reach.includes(u.id))
    .flatMap(u => u.exercises.map(e => Object.assign({}, e, { from: u.title })));
  if (pool.length < 4)
    return `<h1>Mixed review</h1><p class="sub">Cumulative practice across everything you have studied.</p><div class="card"><p>Complete a unit or two first — this pulls its questions from the units you have reached, in random order, so that older material keeps coming back.</p><button class="btn primary" onclick="go('${nextUnitRoute()}')">Go to the next unit</button></div>`;
  quiz = { title: "Mixed review", back: "review", kind: "review", qs: prepare(pool).slice(0, 15), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>Mixed review</h1><p class="sub">${quiz.qs.length} questions drawn from the units you have reached</p><div id="quizbox"></div>`;
}
function renderQuestion() {
  if (!quiz) return;
  const box = $("#quizbox");
  if (!box) return;
  if (quiz.i >= quiz.qs.length) {
    const pct = Math.round(100 * quiz.score / quiz.qs.length);
    if (quiz.kind === "unit") {
      store.data.scores[quiz.unitId] = Math.max(store.data.scores[quiz.unitId] || 0, pct);
      if (pct >= 75) store.data.completed[quiz.unitId] = true;
      activity("unit", quiz.unitId, { pct });
    } else activity("review", null, { pct });
    store.save();
    box.innerHTML = `<div class="card" style="text-align:center;padding:35px"><div style="font-size:50px;font-weight:850">${pct}%</div><p>${quiz.score} of ${quiz.qs.length} correct.${quiz.kind === "unit" ? (pct >= 75 ? " Unit marked complete." : " Review the lesson and try again.") : ""}</p>` +
      (quiz.kind === "unit"
        ? `<button class="btn primary" onclick="go('${quiz.back}')">Back to unit</button> <button class="btn" onclick="go('review')">Mixed review</button>`
        : `<button class="btn primary" onclick="render()">Another round</button> <button class="btn" onclick="go('home')">Done</button>`) + `</div>`;
    renderSidebar();
    return;
  }
  const e = quiz.qs[quiz.i];
  quiz.answered = false;
  const controls = e.t === "mcq"
    ? `<div class="opts">${e.opts.map((o, i) => `<button class="opt" type="button" onclick="answerMCQ(${i})">${o}</button>`).join("")}</div>`
    : `<div class="answerrow"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="Type the missing form" onkeydown="if(event.key==='Enter'){event.preventDefault();answerText()}"><button class="btn primary" id="checkbtn" type="button" onclick="answerText()">Check</button></div>`;
  box.innerHTML = `<div class="progress"><i style="width:${100 * quiz.i / quiz.qs.length}%"></i></div>
<div class="exercise"><span class="pill">${quiz.i + 1}/${quiz.qs.length}</span>${e.from ? ` <span class="pill">${esc(e.from)}</span>` : ""}<p>${e.q}</p>${controls}<div id="feedback" role="status" aria-live="polite"></div></div>
<button class="btn" onclick="go('${quiz.back}')">End practice</button>`;
  setTimeout(() => { const a = $("#answer"); if (a) a.focus(); }, 0);
}
function answerMCQ(i) {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i];
  [...document.querySelectorAll(".opt")].forEach((b, j) => {
    b.disabled = true;
    if (j === e.a) b.classList.add("correct"); else if (j === i) b.classList.add("wrong");

  finishAnswer(i === e.a, e);
}
function answerText() {
  if (!quiz || quiz.answered) return;
  const e = quiz.qs[quiz.i], input = $("#answer"), v = input ? input.value : "";
  if (!norm(v)) { const f = $("#feedback"); if (f) f.innerHTML = `<div class="feedback no">Type an answer first.</div>`; return; }
  if (input) input.disabled = true;

  finishAnswer(e.a.some(a => norm(a) === norm(v)), e);
}
function finishAnswer(ok, e) {
  quiz.answered = true;

  $("#feedback").innerHTML =
    `<div class="feedback ${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite. Expected: " + expected}</div>` +
    (e.ex ? `<div class="why">${e.ex}</div>` : "") +
    `<button class="btn small" id="nextq" style="margin-top:10px" type="button" onclick="quiz.i++;renderQuestion()">Next</button>`;
  setTimeout(() => { const n = $("#nextq"); if (n) n.focus(); }, 0);
}

let aid = { gloss: false, notes: false, translation: false };
// Match gloss keys on the raw text, escaping each piece afterwards, with real
// word boundaries and tolerance for the enclitics -que, -ve and -ne.
function glossedText(r) {
  const useMacrons = store.data.settings.macrons && r.hasMacrons;
  const raw = useMacrons ? r.text : stripMacrons(r.text);
  const br = s => esc(s).replace(/\n/g, "<br>");
  if (!aid.gloss) return br(raw);
  const entries = Object.keys(r.gloss || {}).map(k => ({ key: k, disp: useMacrons ? k : stripMacrons(k) }))
    .filter(e => e.disp).sort((a, b) => b.disp.length - a.disp.length);
  if (!entries.length) return br(raw);
  const alt = entries.map(e => e.disp.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  const enc = `(?:que|ve|ne)?(?![${LET}])`;
  const re = new RegExp(`(^|[^${LET}])(${alt})(?=${enc})`, "gi");
  let out = "", last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    const start = m.index + m[1].length, word = m[2];
    out += br(raw.slice(last, start));
    const hit = entries.find(e => e.disp.toLowerCase() === word.toLowerCase());
    out += `<button class="word" type="button" data-g="${esc(hit ? hit.key : word)}">${esc(word)}</button>`;
    last = start + word.length;
    if (re.lastIndex <= last) re.lastIndex = last;
  }
  return out + br(raw.slice(last));
}
function showGloss(id, key) {
  const r = reading(id);
  if (!r) return;
  let g = r.gloss[key];
  if (!g) { const hit = Object.entries(r.gloss).find(([k]) => k.toLowerCase() === String(key).toLowerCase()); g = hit ? hit[1] : ""; }
  const tip = $("#glosstip");
  tip.innerHTML = g ? `<div class="glosstip"><b lang="la">${esc(key)}</b> — ${esc(g)}</div>` : "";
  clearTimeout(showGloss.t);
  showGloss.t = setTimeout(() => { tip.innerHTML = ""; }, 5000);
}
function viewReading(id) {
  const r = reading(id);
  if (!r) return viewReadings();
  const done = !!store.data.readingDone[id];
  const macronBtn = r.hasMacrons
    ? `<button class="btn small ${store.data.settings.macrons ? "on" : ""}" aria-pressed="${!!store.data.settings.macrons}" onclick="store.data.settings.macrons=!store.data.settings.macrons;store.save();render()">Macrons</button>`
    : `<button class="btn small" disabled title="This text is printed as the manuscripts have it, without vowel quantities marked">Macrons</button>`;
  return `<span class="pill acc">${r.kind}</span><h1>${r.title}</h1><p class="sub">${r.author} · ${r.work} · ${r.level}</p>
<div class="aidbar">
<button class="btn small ${aid.gloss ? "on" : ""}" aria-pressed="${aid.gloss}" onclick="aid.gloss=!aid.gloss;render()">Lexical glosses</button>
<button class="btn small ${aid.notes ? "on" : ""}" aria-pressed="${aid.notes}" onclick="aid.notes=!aid.notes;render()">Notes</button>
<button class="btn small ${aid.translation ? "on" : ""}" aria-pressed="${aid.translation}" onclick="aid.translation=!aid.translation;render()">Translation</button>
${macronBtn}</div>
<div class="card latintext" lang="la">${glossedText(r)}</div>
${aid.gloss ? `<div class="aidbox"><b>Glossary</b><div class="vocab">${Object.entries(r.gloss).map(([k, v]) => `<div><b lang="la">${esc(k)}</b><br>${esc(v)}</div>`).join("")}</div><button class="btn small" onclick="addReadingCards('${r.id}')">Add glossary to flashcards</button></div>` : ""}
${aid.notes ? `<div class="aidbox notes"><b>Reading notes</b><ul>${r.notes.map(n => `<li>${n}</li>`).join("")}</ul></div>` : ""}
${aid.translation ? `<div class="aidbox"><b>Translation</b><p>${r.translation}</p></div>` : ""}
<button class="btn primary" onclick="toggleRead('${r.id}')">${done ? "Marked read ✓" : "Mark as read"}</button> <button class="btn" onclick="go('readings')">Back to library</button>
<div class="source"><b>Source and reuse.</b> ${r.license}${r.source ? ` <a href="${r.source}" target="_blank" rel="noopener">Open source text</a>.` : ""}</div>`;
}

}
let fc = null;
function startFlash() {
  const q = shuffled(dueCards()).slice(0, 30);

  renderFlash();
}
function renderFlash() {
  applyTheme(); renderSidebar();
  const m = $("#main");
  if (!fc || fc.i >= fc.q.length) {
    const n = fc ? fc.seen : 0;
    if (n) { activity("flash", null, { n }); store.save(); }
    m.innerHTML = `<div class="card" style="text-align:center;padding:35px"><h1>Review complete</h1><p>${n} card${n === 1 ? "" : "s"} reviewed.</p><button class="btn primary" onclick="go('flash')">Back</button></div>`;
    fc = null;
    return;
  }
  const c = fc.q[fc.i];
  if (!fc.dir) fc.dir = store.data.settings.direction === "mix" ? (Math.random() < .5 ? "la" : "en") : store.data.settings.direction;
  const front = fc.dir === "la" ? c.la : c.en, back = fc.dir === "la" ? c.en : c.la;
  m.innerHTML = `<div class="flashstage"><p class="sub">${fc.i + 1}/${fc.q.length} · ${esc(c.source)}</p>
<button class="flashcard" type="button" id="fcard" onclick="revealCard()"><span class="front" ${fc.dir === "la" ? 'lang="la"' : ""}>${esc(front)}</span>${fc.reveal ? `<span class="back" ${fc.dir === "en" ? 'lang="la"' : ""}>${esc(back)}</span>` : `<small style="margin-top:18px;color:var(--muted)">click, tap, or press Space to reveal</small>`}</button>
${fc.reveal ? `<div class="grades"><button type="button" onclick="grade(0)"><b>Again</b><small>1</small></button><button type="button" onclick="grade(1)"><b>Hard</b><small>2</small></button><button type="button" onclick="grade(2)"><b>Good</b><small>3</small></button><button type="button" onclick="grade(3)"><b>Easy</b><small>4</small></button></div>` : ""}
<p class="sub" style="margin-top:14px"><button class="btn small" onclick="fc=null;go('flash')">End session</button></p></div>`;
  setTimeout(() => { const b = $("#fcard"); if (b) b.focus(); }, 0);
}
function revealCard() { if (fc && !fc.reveal) { fc.reveal = true; renderFlash(); } }
function grade(g) {
  if (!fc || !fc.reveal) return;
  const c = fc.q[fc.i], old = store.data.cards[c.id] || { iv: 0, ease: 2.3 };
  const days = [1, Math.max(2, old.iv * 1.4), Math.max(4, old.iv * old.ease), Math.max(7, old.iv * (old.ease + .5))][g];
  store.data.cards[c.id] = { iv: days, ease: Math.max(1.5, Math.min(3.2, old.ease + (g - 1.5) * .1)), due: Date.now() + days * 86400000 };
  store.save();
  fc.seen++;
  // a lapse should come back before the session ends, at most twice
  if (g === 0 && (fc.again[c.id] || 0) < 2) { fc.again[c.id] = (fc.again[c.id] || 0) + 1; fc.q.push(c); }
  fc.i++; fc.reveal = false; fc.dir = null;
  renderFlash();
}

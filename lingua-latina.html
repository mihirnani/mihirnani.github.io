const READINGS=[{"id":"c1","title":"In the villa","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Iūlia in villā habitat. Villa parva est, sed hortum magnum habet. Iūlia rosās amat et aquam ad hortum portat. Fīlia Iūliae cum amīcā ambulat. In hortō sedent et librum legunt. Ad vesperum agricola ex agrīs venit. Agricola fīliam vocat: “Ubi es, Lūcia?” Fīlia respondet: “In hortō sum, cum amīcā.” Tum ad vīllam ambulant et cēnam exspectant. In mēnsā sunt cibus et aqua et ūvae. Agricolae multae ūvae sunt, nam vīnea magna est. Post cēnam Iūlia fābulam nārrat, et puellae audiunt.","translation":"Julia lives in a country house. The house is small, but it has a large garden. Julia loves roses and carries water to the garden. Julia’s daughter walks with a friend. They sit in the garden and read a book. Toward evening the farmer comes from the fields. The farmer calls his daughter: “Where are you, Lucia?” The daughter answers: “I am in the garden, with my friend.” Then they walk to the house and wait for dinner. On the table there is food and water and grapes. The farmer has many grapes, for his vineyard is large. After dinner Julia tells a story, and the girls listen.","gloss":{"villā":"in a villa / country house (abl. after in)","hortum":"garden (acc.)","rosās":"roses (acc. pl.)","portat":"carries","hortō":"garden (abl. after in, place where)","legunt":"they read","vesperum":"evening (acc. after ad)","agrīs":"fields (abl. pl. after ex)","cēnam":"dinner (acc.)","exspectant":"they await","vocat":"calls","respondet":"answers","mēnsā":"table (abl. after in)","cibus":"food","ūvae":"grapes","vīnea":"vineyard","nārrat":"tells","audiunt":"they listen"},"notes":["Contrast <b>in villā</b> (ablative, place where) with <b>ad hortum</b> and <b>ex agrīs</b>: <b>in</b> plus the ablative means inside, <b>ad</b> plus the accusative means toward, <b>ex</b> plus the ablative means out of.","<b>Iūliae</b> is genitive: “Julia’s daughter.” The same ending would be nominative plural, and only the sentence decides.","<b>sedent</b> and <b>legunt</b> have an understood plural subject — the daughter and her friend. Nothing but the <b>-nt</b> tells you so.","<b>Agricolae multae ūvae sunt</b> is the dative of the possessor from unit <b>f6</b>: literally “to the farmer there are many grapes.” The grammatical subject is <b>ūvae</b>, which is why the verb is plural."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c2","title":"A morning in the Forum","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Mārcus māne ad forum ambulat. Multōs virōs videt: servī aquam portant, dominus amīcum salūtat, puer epistulam ad tabernam portat. In forō magna turba est. Mārcus cum amīcō ad templum properat. Ibi poēta clārus fābulam nārrat. Verba poētae Mārcum dēlectant. Deinde Mārcus ad tabernam properat, ubi librōs et tabulās emit. Taberna parva est, sed multa habet. Dominus tabernae amīcus Mārcī est. “Salvē, Mārce!” inquit. “Quid hodiē quaeris?” “Librum novum quaerō,” respondet Mārcus. Dominus librum dat; Mārcus pecūniam numerat et laetus ad vīllam ambulat.","translation":"Marcus walks to the Forum in the morning. He sees many men: slaves are carrying water, a master greets a friend, a boy carries a letter to a shop. In the Forum there is a great crowd. Marcus hurries with a friend to the temple. There a famous poet is telling a story. The poet’s words delight Marcus. Then Marcus hurries to a shop, where he buys books and writing-tablets. The shop is small, but it has much in it. The shopkeeper is a friend of Marcus. “Hello, Marcus!” he says. “What are you looking for today?” “I am looking for a new book,” answers Marcus. The shopkeeper hands over the book; Marcus counts out his money and walks home happy.","gloss":{"māne":"in the morning (indeclinable adverb)","forum":"the Forum (acc. after ad)","virōs":"men (acc. pl.)","servī":"slaves (nom. pl., subject of portant)","dominus":"master, owner","epistulam":"letter (acc.)","tabernam":"shop (acc. after ad)","turba":"crowd","properat":"hurries","fābulam":"story (acc.)","nārrat":"tells, relates","dēlectant":"they delight, please","tabulās":"writing-tablets (acc. pl.)","emit":"buys","Mārcī":"of Marcus (gen.)","Salvē":"hello! (imperative of salveō)","Mārce":"Marcus! (vocative in -e)","hodiē":"today","quaeris":"you are looking for","inquit":"he says (defective verb, always after the first words quoted)","pecūniam":"money (acc.)","numerat":"counts out","laetus":"happy — nominative, describing Mārcus, not an adverb"},"notes":["<b>Multōs virōs</b> is accusative plural after <b>videt</b>; the <b>-ōs</b> on both words is the agreement at work.","Three short clauses share one colon. Each has its own nominative subject — <b>servī</b>, <b>dominus</b>, <b>puer</b> — and you can find them by their endings before you translate anything.","<b>poētae</b> is genitive singular, “the poet’s.” Remember that <b>poēta</b> is masculine, which is why the adjective in the previous sentence is <b>clārus</b>.","<b>Mārce</b> is the only place in the first two declensions where the vocative differs from the nominative: second-declension nouns in <b>-us</b> take <b>-e</b>. Names in <b>-ius</b> go further and contract to a single <b>-ī</b>: <b>Vergilī</b>."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c3","title":"The journey to Rome","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Lūcius multōs annōs in oppidō parvō habitābat. Rōmam tamen vidēre cupiēbat. Itaque cum frātre iter longum fēcit. Prīmō diē via facilis erat; deinde magna tempestās caelum obscūrāvit. Viātōrēs in caupōnā mānsērunt. Postrīdiē caelum clārum fuit, et ante noctem moenia Rōmae vīdērunt. In urbe Lūcius templa alta et forum magnum spectāvit. Frāter tacēbat; numquam tantam urbem vīderat. Multī hominēs per viās contendēbant; mercātōrēs clāmābant; equī carrōs trahēbant. Vesperī frātrēs in hospitiō manēbant, et Lūcius epistulam ad mātrem scrīpsit. “Rōma,” inquit, “maior est quam omnia oppida nostra.”","translation":"Lucius had been living for many years in a small town, but he wanted to see Rome. And so he made a long journey with his brother. On the first day the road was easy; then a great storm darkened the sky. The travellers stayed in an inn. The next day the sky was clear, and before night they saw the walls of Rome. In the city Lucius gazed at tall temples and the great forum. His brother said nothing; he had never seen so large a city. Many people were hurrying through the streets; merchants were shouting; horses were dragging carts. In the evening the brothers stayed in a lodging-house, and Lucius wrote a letter to his mother. “Rome,” he said, “is bigger than all our towns put together.”","gloss":{"oppidō":"town (abl.)","cupiēbat":"he was longing, wanted (imperfect)","itaque":"and so","iter":"journey (n., iter, itineris)","fēcit":"he made (perfect of faciō)","tempestās":"storm","obscūrāvit":"darkened (perfect)","Viātōrēs":"travellers","caupōnā":"inn (abl.)","mānsērunt":"they remained (perfect of maneō)","postrīdiē":"on the next day","moenia":"walls (n. pl.)","templa alta":"tall temples (n. pl.)","spectāvit":"gazed at","tacēbat":"was silent","tantam":"so great (acc. f. sg.)","hominēs":"people (3rd decl.)","contendēbant":"were hurrying","carrōs trahēbant":"were dragging carts","hospitiō":"lodging-house (abl.)","mātrem":"mother (acc.)","maior":"bigger (comparative of magnus)"},"notes":["<b>Rōmam</b> is accusative of motion toward with no preposition. Names of towns, plus <b>domus</b> and <b>rūs</b>, work this way.","The imperfects <b>habitābat</b> and <b>cupiēbat</b> supply the standing background; the perfects <b>fēcit</b>, <b>obscūrāvit</b>, <b>mānsērunt</b>, <b>vīdērunt</b> move the story forward. Tense choice is narrative structure, not decoration.","<b>Rōmae</b> is genitive after <b>moenia</b> — the walls of Rome, not motion to Rome. Compare <b>Rōmam</b> in the second sentence.","The second half switches almost entirely into imperfects — <b>tacēbat, contendēbant, clāmābant, trahēbant, manēbant</b> — to paint the city as a continuous scene, and then closes with two perfects, <b>vīderat</b> and <b>scrīpsit</b>, for the single events. This is precisely how Livy handles a traveller’s arrival."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c4","title":"A message from the frontier","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Nuntius nocte ad urbem vēnit. Portae iam clausae erant, sed custōs clāmōrem audīvit. “Ā duce missus sum,” inquit nuntius. “Hostēs flūmen trānsiērunt et castra nostra oppugnant.” Custōs portam aperuit; nuntius ad senātum ductus est. Eādem nocte novae cōpiae missae sunt. Prīmā lūce senātōrēs convocātī sunt. Multa dicta sunt, sed cōnsilium nōn statim captum est. Tandem imperātor novus creātus est; is cum tribus legiōnibus ad flūmen missus est. Nuntius tōtam noctem vigilāverat; tandem quiēvit.","translation":"A messenger came to the city at night. The gates had already been closed, but the guard heard shouting. “I have been sent by the commander,” said the messenger. “The enemy have crossed the river and are attacking our camp.” The guard opened the gate; the messenger was led to the senate. That same night new forces were sent. At first light the senators were summoned. Much was said, but no decision was taken at once. At last a new commander was appointed; he was sent to the river with three legions. The messenger had been awake all night; at last he rested.","gloss":{"nuntius":"messenger","custōs":"guard","clāmōrem":"shout / noise","ā duce":"by the commander","missus sum":"I was/have been sent","flūmen":"river","trānsiērunt":"crossed","castra":"camp (neut. pl.)","oppugnant":"attack","ductus est":"was led","cōpiae":"forces / troops","Prīmā lūce":"at first light (ablative of time when)","convocātī sunt":"were summoned (perfect passive)","dicta sunt":"were said (n. pl. participle: many things)","captum est":"was taken (of a cōnsilium: was decided)","creātus est":"was appointed, was elected","tribus legiōnibus":"with three legions","vigilāverat":"had stayed awake (pluperfect)","quiēvit":"he rested"},"notes":["<b>clausae erant</b> is pluperfect passive.","<b>castra</b> is grammatically plural though translated singular.","<b>Eādem nocte</b> is ablative of time when.","Count the passives: <b>missus sum, ductus est, missae sunt, convocātī sunt, dicta sunt, captum est, creātus est, missus est</b>. Official Latin prefers the passive because the agent is either obvious or deliberately left out — and note that each participle tells you the gender and number of its subject before the subject appears."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c5","title":"The senator’s decision","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Senātor, quī rem pūblicam diū servāverat, cīvēs convocāvit. Dīxit urbem in magnō perīculō esse. Rogāvit quid cīvēs facere dēbērent et quī mīlitēs dūcere posset. Iuvenis quīdam surrēxit ut auxilium offerret. Tam fortiter dīxit ut omnēs eum laudārent. Senātus eum mīsit nē hostēs urbem caperent. Postrīdiē iuvenis, cum mīlitēs collēgisset, ex urbe discessit. Senātōrēs, quī domī manēbant, rogābant num satis cōpiārum esset. Nēmō erat quī nōn timēret. Tertiō diē vēnit nuntius quī dīceret hostēs victōs esse. Tanta laetitia fuit ut tōta urbs clāmāret.","translation":"A senator who had long protected the state summoned the citizens. He said that the city was in great danger. He asked what the citizens ought to do and who could lead the soldiers. A certain young man rose to offer help. He spoke so bravely that everyone praised him. The senate sent him so that the enemy would not capture the city. The next day the young man, when he had gathered his soldiers, left the city. The senators, who stayed at home, kept asking whether there were enough troops. There was nobody who was not afraid. On the third day a messenger came to say that the enemy had been beaten. There was such joy that the whole city shouted aloud.","gloss":{"rem pūblicam":"the state, the commonwealth","diū":"for a long time","servāverat":"had preserved (pluperfect)","convocāvit":"summoned","in magnō perīculō":"in great danger","dēbērent":"ought (imperfect subjunctive in an indirect question)","Iuvenis":"young man","surrēxit":"stood up","auxilium":"help","offerret":"might offer (purpose)","laudārent":"praised (result)","caperent":"might capture (negative purpose)","collēgisset":"had gathered (pluperfect subjunctive after cum)","domī":"at home (locative)","num":"whether (introducing an indirect question)","satis cōpiārum":"enough troops (partitive genitive)","Nēmō erat quī":"there was nobody who — takes the subjunctive of characteristic","timēret":"was afraid (subjunctive of characteristic)","quī dīceret":"to say — a relative clause of purpose","victōs esse":"to have been beaten (perfect passive infinitive)","laetitia":"joy","clāmāret":"shouted (result)"},"notes":["The relative <b>quī</b> is nominative because it is the subject of <b>servāverat</b> inside its own clause, even though its antecedent <b>Senātor</b> is the subject of the main verb.","<b>urbem ... esse</b> is indirect statement: accusative subject plus infinitive after <b>Dīxit</b>.","Three subjunctive clauses do three different jobs here: <b>ut ... offerret</b> is purpose, <b>ut ... laudārent</b> is result after <b>Tam</b>, and <b>nē ... caperent</b> is negative purpose. Read the introducing word and the main-clause signpost before you decide.","Seven subjunctives, and every one belongs to a different construction: indirect question (<b>dēbērent, posset, esset</b>), purpose (<b>offerret, caperent</b>), result (<b>laudārent, clāmāret</b>), <b>cum</b>-circumstantial (<b>collēgisset</b>), characteristic (<b>timēret</b>) and relative purpose (<b>dīceret</b>). Identify each by the word in front of it, never by the verb form."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c6","title":"The storm at sea","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Nāvis, quae vesperī portum relīquerat, in altum contendēbat. Nautae, quamquam ventum timēbant, cursum tenēbant. Mediā nocte tanta tempestās fuit ut undae nāvem pulsārent. Magister clāmāvit ut vēla contraherentur. Nautae tam fortiter labōrāvērunt ut nāvis servārētur. Cum prīma lūx rediisset, īnsulam procul vīdērunt. Cum in lītore stārent, nautae dīs grātiās ēgērunt. Magister, quī plūrimās tempestātēs vīderat, dīxit nāvem fortūnā servātam esse. Tam dēfessī erant ut sub arboribus statim dormīrent. Postrīdiē nāvem refēcērunt, ut, sī ventus secundus esset, statim nāvigāre possent.","translation":"The ship, which had left harbour in the evening, was making for the open sea. Although the sailors feared the wind, they held their course. At midnight there was so great a storm that the waves battered the ship. The captain shouted for the sails to be drawn in. The sailors worked so bravely that the ship was saved. When first light had returned, they saw an island far off. When they were standing on the shore, the sailors gave thanks to the gods. The captain, who had seen a great many storms, said that the ship had been saved by luck. They were so exhausted that they fell asleep at once under the trees. The next day they repaired the ship, so that if the wind were favourable they could sail immediately.","gloss":{"vesperī":"in the evening","relīquerat":"had left (pluperfect of relinquō)","in altum":"into the deep, the open sea","contendēbat":"was making for, was straining","quamquam":"although (with the indicative)","cursum":"course (acc.)","undae":"waves","pulsārent":"battered (result)","Magister":"ship’s master, captain","contraherentur":"should be drawn in","servārētur":"was saved (imperfect passive subjunctive)","rediisset":"had returned (pluperfect subjunctive after cum)","procul":"far off","lītore":"shore (abl.)","stārent":"were standing (imperfect subjunctive after cum)","dīs grātiās ēgērunt":"gave thanks to the gods (dīs = deīs, dative)","plūrimās":"very many (superlative of multus)","fortūnā":"by luck (ablative of means)","dēfessī":"worn out","refēcērunt":"they repaired","ventus secundus":"a following, favourable wind","possent":"they might be able (purpose)"},"notes":["<b>quamquam</b> takes the indicative — a plain statement of fact conceded. Contrast the last sentence, where <b>Cum</b> takes the subjunctive.","<b>tanta ... ut</b> and <b>tam ... ut</b> are result clauses: the main clause plants a signpost, and <b>ut</b> reports what actually followed. A purpose clause has no such signpost.","<b>ut vēla contraherentur</b> after <b>clāmāvit</b> is an indirect command, and the verb inside it is passive: the order is that the sails <i>be</i> drawn in.","The last sentence nests a condition inside a purpose clause: <b>ut, sī ventus secundus esset, … possent</b>. The <b>sī</b>-clause takes the subjunctive because it has been drawn into the mood of the clause containing it — an effect grammarians call attraction, and one you will meet constantly in reported speech."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c7","title":"The monk and the manuscript","author":"Controlled Latin","work":"Original graded reading","level":"Reading Latin","kind":"Controlled","text":"In monasteriō vetere monachus librum antīquum invēnit. Multae litterae aetāte obscūrātae erant, sed titulus adhūc legī poterat. Monachus putāvit librum ā poētā Rōmānō scrīptum esse. Nē verba perīrent, exemplum facere cōnstituit. Mēnsibus labōrāvit, singulās litterās magnā cūrā trānscrībēns. Opere cōnfectō, exemplum in armāriō posuit. Aliī monachī, cum opus vīdissent, mīrātī sunt. Abbās iussit exemplum in bibliothēcā pōnī, nē ūnō incendiō omnia perīrent. Multīs post annīs, monasteriō dēlētō, ille liber sōlus superfuit. Itaque verba poētae, quī mīlle annōs ante mortuus erat, hodiē adhūc legimus.","translation":"In an old monastery a monk found an ancient book. Many letters had been obscured by age, but the title could still be read. The monk thought that the book had been written by a Roman poet. So that the words would not perish, he decided to make a copy. He worked for months, transcribing each letter with great care. When the work was finished, he placed the copy in a cupboard. The other monks, when they had seen the work, were amazed. The abbot ordered the copy to be placed in the library, so that a single fire should not destroy everything. Many years later, when the monastery had been destroyed, that book alone survived. And so we still read today the words of a poet who had died a thousand years before.","gloss":{"monasteriō":"monastery (abl.)","monachus":"monk","invēnit":"found","aetāte":"by age (ablative of cause)","obscūrātae erant":"had been obscured (pluperfect passive)","titulus":"title","adhūc":"still","legī poterat":"could be read (present passive infinitive)","perīrent":"might perish (negative purpose)","exemplum":"copy","Mēnsibus":"for months (ablative of time)","singulās":"each individual","trānscrībēns":"transcribing (present participle)","Opere cōnfectō":"the work having been finished (ablative absolute)","armāriō":"cupboard, book-chest (abl.)","mīrātī sunt":"were amazed (deponent perfect, active in sense)","Abbās":"abbot","iussit":"ordered — iubeō takes an accusative and infinitive, not ut","pōnī":"to be placed (present passive infinitive)","bibliothēcā":"library (abl.)","incendiō":"fire, conflagration (abl.)","monasteriō dēlētō":"the monastery having been destroyed (ablative absolute)","superfuit":"survived (from supersum)","mīlle annōs ante":"a thousand years earlier"},"notes":["<b>librum ... scrīptum esse</b> is a perfect passive indirect statement after <b>putāvit</b>: accusative subject, perfect passive infinitive.","<b>trānscrībēns</b> is a present participle agreeing with the subject <b>monachus</b>, describing action simultaneous with <b>labōrāvit</b>.","<b>Opere cōnfectō</b> is an ablative absolute. Neither word has any grammatical role in the main clause — that detachment is what “absolute” means.","<b>Iussit … pōnī</b> shows the exception to the rule of unit <b>s5</b>: verbs of ordering normally take <b>ut</b> with the subjunctive, but <b>iubeō</b> and <b>vetō</b> take an infinitive instead — here a passive one, because nobody is named as the copier."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c8","title":"On the stars","author":"Controlled Latin","work":"Original neo-Latin reading","level":"Reading Latin","kind":"Controlled","text":"Astronomī stellās observant ut nātūram caelī intellegant. Lūx, quae ā stellīs ad terram mittitur, per immēnsa spatia iter facit. Quō longius stella abest, eō antīquiōrem lūcem vidēmus. Itaque caelum spectantēs nōn modo loca remōta sed etiam tempora praeterita contemplāmur. Nam lūx, quamvīs celerrima sit, tempore eget ut ad nōs perveniat. Stella igitur quam hāc nocte spectāmus fortasse iam periit. Astronomīs necesse est haec omnia ratiōne, nōn oculīs, comprehendere. Quō magis mundum intellegimus, eō maior fit admīrātiō.","translation":"Astronomers observe the stars in order to understand the nature of the heavens. Light, which is sent from the stars to Earth, makes a journey through immense spaces. The farther away a star is, the older the light we see. And so, when looking at the sky, we contemplate not only distant places but also past times. For light, however fast it is, needs time to reach us. The star we look at tonight may therefore already have perished. Astronomers must grasp all this by reason and not by eye. The more we understand the universe, the greater our wonder becomes.","gloss":{"astronomī":"astronomers","stellās":"stars (acc. pl.)","observant":"they observe","nātūram caelī":"the nature of the heavens","lūx":"light","mittitur":"is sent (present passive)","immēnsa spatia":"immense spaces","Quō longius":"by how much the farther — first half of a correlative","eō antīquiōrem":"by that much the older — second half, answering Quō","spectantēs":"looking at (participle agreeing with the subject of contemplāmur)","remōta":"distant (n. pl. with loca)","contemplāmur":"we contemplate (deponent: passive form, active sense)","quamvīs celerrima sit":"however fast it is (concessive, with the subjunctive)","tempore eget":"needs time (egeō takes the ablative)","perveniat":"may reach (purpose)","fortasse":"perhaps","periit":"has perished (from pereō)","necesse est":"it is necessary (with the dative of the person)","ratiōne":"by reason (ablative of means)","Quō magis":"by how much the more — first half of a correlative","eō maior":"by that much the greater — second half","admīrātiō":"wonder, astonishment"},"notes":["<b>ut ... intellegant</b> is purpose.","<b>quae</b> agrees with <b>lūx</b> and is subject of <b>mittitur</b>.","<b>quō ... eō</b> correlates two comparatives.","This is neo-Latin: the syntax is classical throughout, but no Roman wrote sentences like these. Latin remained the working language of European science until the eighteenth century, which is why Newton and Descartes are in this Reading Room alongside Cicero."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c9","title":"Orders from the camp","author":"Controlled Latin","work":"Original bridge reading","level":"Bridge to prose","kind":"Controlled","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","source":"","text":"Caesar, explōrātōribus praemissīs, cognōvit hostēs trāns flūmen castra posuisse. Itaque pontem facere cōnstituit. Mīlitibus imperāvit ut silvam caederent et māteriam ad rīpam portārent. Opere tertiō diē cōnfectō, legiōnēs trādūxit. Hostēs, adventū Rōmānōrum territī, in montēs sē recēpērunt. Caesar, veritus nē in silvīs īnsidiae parārentur, agmen cōnsistere iussit. Explōrātōrēs reversī nūntiāvērunt hostēs in silvā trēs cohortēs collocāvisse. Caesar, hāc rē cognitā, equitēs circummittere cōnstituit, ut ā tergō adorīrentur. Ipse cum legiōnibus in aciē mānsit. Proeliō commissō, hostēs undique circumventī arma trādidērunt. Caesar obsidibus acceptīs exercitum in hīberna dēdūxit.","translation":"Caesar, having sent scouts ahead, learned that the enemy had pitched camp across the river. And so he decided to build a bridge. He ordered the soldiers to cut down the wood and carry the timber to the bank. When the work was finished on the third day, he led the legions across. The enemy, terrified at the arrival of the Romans, withdrew into the mountains. Caesar, fearing that an ambush was being prepared in the woods, ordered the column to halt. The scouts returned and reported that the enemy had stationed three cohorts in the forest. Caesar, on discovering this, decided to send the cavalry round, so that they might attack from the rear. He himself remained with the legions in battle line. Once battle was joined, the enemy were surrounded on all sides and handed over their weapons. Caesar took hostages and led the army down into winter quarters.","gloss":{"explōrātōribus praemissīs":"scouts having been sent ahead (ablative absolute)","castra posuisse":"to have pitched camp (perfect infinitive in indirect statement)","cōnstituit":"decided","imperāvit ut":"ordered that — indirect command with the subjunctive","caederent":"should cut down","māteriam":"timber","rīpam":"riverbank (acc.)","Opere tertiō diē cōnfectō":"the work having been finished on the third day (ablative absolute)","trādūxit":"led across","adventū":"at the arrival (ablative of cause)","sē recēpērunt":"withdrew (literally: took themselves back)","veritus":"fearing (perfect participle of the deponent vereor, active in sense)","īnsidiae":"an ambush","agmen":"marching column","cōnsistere iussit":"ordered to halt (iubeō with accusative and infinitive)","reversī":"having returned (semi-deponent revertor)","nūntiāvērunt":"reported","cohortēs":"cohorts","collocāvisse":"to have stationed (perfect infinitive)","hāc rē cognitā":"this having been discovered (ablative absolute)","equitēs":"cavalry","circummittere":"to send round","ā tergō":"from the rear","adorīrentur":"might attack (deponent, purpose)","in aciē":"in battle line","Proeliō commissō":"battle having been joined (ablative absolute)","undique circumventī":"surrounded on all sides","trādidērunt":"handed over","obsidibus acceptīs":"hostages having been received (ablative absolute)","hīberna":"winter quarters (n. pl.)"},"notes":["This is written deliberately in Caesar's manner: short main verbs at the end, ablative absolutes carrying the subordinate action, and every stage of the operation compressed into a participle. Read <b>r1</b> immediately after.","Three different ways of reporting appear here. <b>cognōvit ... posuisse</b> is indirect statement; <b>imperāvit ut ... caederent</b> is indirect command; <b>iussit ... cōnsistere</b> is <b>iubeō</b> with accusative and infinitive. Latin keeps them strictly apart, and <b>iubeō</b> is the exception that does not take <b>ut</b>.","<b>veritus nē ... parārentur</b>: after a verb of fearing, <b>nē</b> means <i>that</i>, and <b>ut</b> or <b>nē nōn</b> means <i>that not</i> — the reverse of what you would expect from purpose clauses.","Five ablative absolutes carry the whole operation: <b>explōrātōribus praemissīs, opere cōnfectō, hāc rē cognitā, proeliō commissō, obsidibus acceptīs</b>. Each marks a completed stage, and the main verbs are left to report only what Caesar decided and did. This is his signature rhythm, and once you hear it a page of the <i>Gallic War</i> becomes navigable."],"hasMacrons":true},{"id":"c10","title":"A speech in the senate","author":"Controlled Latin","work":"Original bridge reading","level":"Bridge to prose","kind":"Controlled","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","source":"","text":"Quid enim, patrēs cōnscrīptī, exspectāmus? Sī hostis intrā moenia esset, arma statim caperēmus; nunc, cum īnsidiae in ipsā cūriā parentur, tacēmus. Ille vir, quī tot annōs rem pūblicam dēfendit, quī tantum perīculī prō vōbīs adiit, nunc ā vōbīs dēserendus est? Nōn sōlum dē ūnō homine sed etiam dē lībertāte omnium agitur. Quid enim est turpius quam tacēre cum loquī oporteat? Māiōrēs nostrī, quī hanc urbem tot bellīs dēfendērunt, nōn dubitāvērunt salūtem commūnem suīs commodīs antepōnere. Nōs autem, quōs nūlla dūra fortūna premit, ipsī nōbīs deesse vidēmur. Quae cum ita sint, cēnseō id nōbīs statim faciendum esse; nam sī nōn nunc, quandō dēnique surgēmus?","translation":"What, senators, are we waiting for? If an enemy were inside the walls we should take up arms at once; as it is, when a plot is being prepared in the senate house itself, we say nothing. Is that man, who defended the state for so many years, who faced so much danger on your behalf, now to be abandoned by you? What is at stake is not one man only, but the freedom of us all. For what is more shameful than silence when one ought to speak? Our ancestors, who defended this city in so many wars, did not hesitate to put the common safety before their own convenience. We, whom no harsh fortune presses, seem to be failing ourselves. Since this is so, I move that we must act at once; for if not now, when in the end shall we rise?","gloss":{"patrēs cōnscrīptī":"senators (the formal mode of address)","intrā moenia":"inside the walls","caperēmus":"we would take up (imperfect subjunctive, contrary to fact)","cūriā":"the senate house (abl.)","parentur":"are being prepared (present subjunctive after cum)","tot annōs":"for so many years (accusative of duration)","tantum perīculī":"so much danger (partitive genitive)","adiit":"faced, went to meet (from adeō)","dēserendus est":"is to be abandoned (gerundive of obligation)","agitur":"is at stake (impersonal passive: the matter concerns)","Quae cum ita sint":"since this is so (connecting relative)","cēnseō":"I move, I give it as my opinion","faciendum esse":"must be done (gerundive in indirect statement)","turpius":"more shameful (comparative neuter)","oporteat":"one ought (impersonal, subjunctive after cum)","Māiōrēs nostrī":"our ancestors","nōn dubitāvērunt":"did not hesitate (with a plain infinitive)","salūtem commūnem":"the common safety","commodīs":"advantages, convenience (dative with antepōnere)","antepōnere":"to put before (takes the accusative and the dative)","premit":"presses, weighs on","deesse":"to fail, to be lacking to (takes the dative)","quandō dēnique":"when at last"},"notes":["Cicero's architecture in miniature: a rhetorical question, a contrary-to-fact condition, two parallel relative clauses building to a climax, a <b>nōn sōlum ... sed etiam</b>, and a connecting relative to close. Read <b>r4</b> next.","Two conditions of different kinds sit side by side. <b>Sī hostis ... esset ... caperēmus</b> is present contrary to fact; <b>cum ... parentur</b> is a causal <b>cum</b>-clause about what is actually happening. The contrast between the imagined and the real is the whole rhetorical move.","<b>ā vōbīs dēserendus est</b> uses <b>ā</b> with the ablative rather than the usual dative of agent. Latin does this when a dative would be ambiguous or when, as here, the speaker wants to point an accusing finger at a specific group.","The close is a rhetorical question with the main clause suppressed — <b>sī nōn nunc, quandō dēnique surgēmus?</b> — and it works because the correlative <b>sī … quandō</b> is enough to hold the sense. Cicero ends periods this way constantly: the argument is finished, so the grammar can be left to the listener."],"hasMacrons":true},{"id":"c11","title":"A wakeful night","author":"Controlled Latin","work":"Original bridge reading","level":"Bridge to verse","kind":"Controlled","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","source":"","text":"Nox erat. Somnus per fessa vagābātur membra, sed mihi, longīs agitātō cūrīs, quiēs nūlla veniēbat. Lūna per caelum obscūrīs errābat tēcta nūbibus; longē canēbat in silvīs avis sōla. Tum subitō vēnit in mentem carmen illud mihi, quod puer ōlim didiceram, et tot neglēcta per annōs verba redīērunt. Surrēxī tandem, et parvā lūcem accendī lucernā. Tum calamum cēramque manū tremente cēpī, et quae longa servāverat memoria scrīpsī. Iam prīma diēs oculōs feriēbat cum calamum posuī. Nox mihi longa fuit, sed nōn, ut anteā, vacua.","translation":"It was night. Sleep was wandering through weary limbs, but for me, troubled by long anxieties, no rest came. The moon wandered across the sky, veiled by dark clouds; far off in the woods a lone bird was singing. Then suddenly that poem came into my mind, the one I had learned long ago as a boy, and the words, neglected for so many years, came back. At last I got up, and lit a light with a small lamp. Then I took up pen and wax tablet with a trembling hand, and wrote down what long memory had kept. Day was already striking my eyes when I laid down the pen. The night had been long for me, but not, as before, empty.","gloss":{"Somnus":"sleep","per fessa":"through weary — agrees with membra three words later","vagābātur":"was wandering (deponent)","membra":"limbs (n. pl.)","longīs":"long — agrees with cūrīs after the participle","agitātō":"troubled — agrees with mihi","quiēs":"rest, quiet","obscūrīs":"dark — agrees with nūbibus at the clause's end","tēcta":"covered, veiled — agrees with Lūna","nūbibus":"clouds (abl.)","canēbat":"was singing","vēnit in mentem":"came to mind (idiom)","puer":"as a boy — nominative in apposition to the subject of didiceram","didiceram":"I had learned","neglēcta":"neglected — agrees with verba at the clause's end","redīērunt":"came back","Surrēxī":"I got up","parvā":"small — agrees with lucernā at the end of the clause","accendī":"I lit (perfect of accendō)","lucernā":"oil lamp (abl. of means)","calamum":"reed pen (acc.)","cēram":"wax tablet (acc.)","manū tremente":"with a trembling hand","longa":"long — agrees with memoria across the verb","memoria":"memory","feriēbat":"was striking","vacua":"empty — agrees with Nox, four words back"},"notes":["The grammar here is nothing you have not met; only the <i>word order</i> is new. Four pairs of words that agree have been pulled apart — <b>per fessa ... membra</b>, <b>longīs ... cūrīs</b>, <b>obscūrīs ... nūbibus</b>, <b>tot neglēcta per annōs verba</b>. This is hyperbaton, and it is how Latin verse is normally written.","The technique for reading it: when you meet an adjective with no noun beside it, hold the ending in mind and keep reading. The noun will arrive, and its ending will match. Never assume the next word is the one that agrees.","Read this immediately before <b>r5</b>, <b>r7</b> or <b>r8</b>. The difficulty of real verse is far more often displaced agreement than unknown vocabulary.","Six pairs are now separated: <b>per fessa … membra</b>, <b>longīs … cūrīs</b>, <b>obscūrīs … nūbibus</b>, <b>tot neglēcta per annōs verba</b>, <b>parvā … lucernā</b>, <b>quae longa servāverat memoria</b>. Read the clause to its end before deciding what agrees with what — and notice that you can now do it, which is the point of the exercise."],"hasMacrons":true},{"id":"r1","title":"Gaul divided","author":"Julius Caesar","work":"De bello Gallico 1.1","level":"Intermediate","kind":"Classical prose","text":"Gallia est omnis divisa in partes tres, quarum unam incolunt Belgae, aliam Aquitani, tertiam qui ipsorum lingua Celtae, nostra Galli appellantur. Hi omnes lingua, institutis, legibus inter se differunt. Gallos ab Aquitanis Garumna flumen, a Belgis Matrona et Sequana dividit. Horum omnium fortissimi sunt Belgae, propterea quod a cultu atque humanitate provinciae longissime absunt, minimeque ad eos mercatores saepe commeant atque ea quae ad effeminandos animos pertinent important.","translation":"Gaul as a whole is divided into three parts: one of these the Belgae inhabit, another the Aquitani, and the third those who in their own language are called Celts and in ours Gauls. All of these differ from one another in language, in institutions and in laws. The river Garonne separates the Gauls from the Aquitani, the Marne and the Seine from the Belgae. Of all these the Belgae are the bravest, because they are furthest away from the civilisation and refinement of the Province, and traders very seldom travel to them or import the things that tend to soften men’s spirits.","gloss":{"omnis":"as a whole / all","divisa":"divided","partes":"parts","quarum":"of which","unam":"one (part)","incolunt":"inhabit","aliam":"another","tertiam":"a third","ipsorum":"their own","lingua":"language (abl.)","appellantur":"are called","institutis":"in institutions, customs (ablative of respect)","inter se differunt":"differ from one another","Garumna":"the river Garonne","dividit":"divides — singular, though it has three subjects","propterea quod":"for the reason that, because","cultu":"civilised life (abl.)","humanitate":"refinement, culture (abl.)","provinciae":"of the Province — Roman Gallia Narbonensis","longissime absunt":"are furthest away","minime":"least of all","commeant":"travel to and fro","effeminandos":"to be made soft (gerundive with ad, expressing purpose)","pertinent":"tend, relate","important":"they bring in"},"notes":["The main verb is <b>est divisa</b>; <b>Gallia omnis</b> is its subject.","<b>quarum</b> refers to <b>partes</b>.","The verbs <b>incolunt</b> and <b>appellantur</b> have different subjects.","<b>ad effeminandos animos</b> is the gerundive purpose construction of unit <b>a3</b>: not <i>ad effeminandum animos</i> but the gerundive agreeing with its noun.","The famous opening is doing propaganda as well as geography. By ranking the Belgae bravest <i>because</i> they are furthest from Roman civilisation, Caesar prepares his reader to accept that conquering them will be difficult — and therefore creditable."],"source":"https://www.thelatinlibrary.com/caesar/gall1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r2","title":"Hannibal judged","author":"Cornelius Nepos","work":"Hannibal 1.1","level":"Advanced prose","kind":"Classical prose","text":"Hannibal, Hamilcaris filius, Carthaginiensis. Si verum est, quod nemo dubitat, ut populus Romanus omnes gentes virtute superarit, non est infitiandum Hannibalem tanto praestitisse ceteros imperatores prudentia, quanto populus Romanus antecedat fortitudine cunctas nationes. Nam quotienscumque cum eo congressus est in Italia, semper discessit superior.","translation":"Hannibal, son of Hamilcar, a Carthaginian. If it is true — as no one doubts — that the Roman people has surpassed all nations in courage, it must be admitted that Hannibal surpassed other commanders in judgment by as much as the Roman people surpasses all nations in bravery. For as often as he engaged with them in Italy, he always came off the better.","gloss":{"Hamilcaris filius":"son of Hamilcar","Carthaginiensis":"a Carthaginian","infitiandum":"to be denied (gerundive of obligation)","praestitisse":"to have surpassed (perfect infinitive)","imperatores":"commanders","prudentia":"in judgement (ablative of respect)","tanto":"by so much — looks forward to quanto below","quanto":"by how much — completes the tanto ... quanto comparison","antecedat":"surpasses (subjunctive in a subordinate clause of indirect statement)","fortitudine":"in bravery (ablative of respect)","cunctas":"all","nationes":"nations","quotienscumque":"as often as, whenever","congressus est":"engaged, joined battle (deponent)","discessit superior":"came away the winner — literally: departed superior"},"notes":["The long sentence is framed by a comparison: Rome surpasses nations in courage; Hannibal surpasses generals in prudence.","<b>non est infitiandum</b> is an impersonal passive periphrastic.","<b>Hannibalem ... praestitisse</b> is accusative + infinitive.","<b>discessit superior</b> uses a predicative adjective where English needs a phrase: he departed <i>as the superior party</i>. Latin does this constantly — <b>vēnit prīmus</b>, he arrived first; <b>morī fēlīx</b>, to die happy."],"source":"https://www.thelatinlibrary.com/nepos/nepos.hann.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r3","title":"In the beginning","author":"Latin Vulgate","work":"John 1:1–9, 14","level":"Intermediate","kind":"Late / Christian Latin","text":"In principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in principio apud Deum. Omnia per ipsum facta sunt: et sine ipso factum est nihil, quod factum est. In ipso vita erat, et vita erat lux hominum: et lux in tenebris lucet, et tenebrae eam non comprehenderunt.\nFuit homo missus a Deo, cui nomen erat Ioannes. Hic venit in testimonium, ut testimonium perhiberet de lumine, ut omnes crederent per illum. Non erat ille lux, sed ut testimonium perhiberet de lumine. Erat lux vera, quae illuminat omnem hominem venientem in hunc mundum.\nEt Verbum caro factum est, et habitavit in nobis.","translation":"In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through him, and without him nothing was made that was made. In him was life, and the life was the light of human beings; and the light shines in the darkness, and the darkness did not overcome it. There was a man sent from God, whose name was John. He came as a witness, to bear witness concerning the light, so that all might believe through him. He was not the light, but came to bear witness concerning the light. There was a true light, which enlightens every person coming into this world. And the Word became flesh, and dwelt among us.","gloss":{"in principio":"in the beginning","Verbum":"Word","apud":"with / in the presence of","per ipsum":"through him","facta sunt":"were made","sine ipso":"without him","nihil":"nothing","vita":"life","lux":"light","hominum":"of human beings","tenebris":"darkness","comprehenderunt":"grasped / overcame","missus":"sent (perfect passive participle)","cui nomen erat":"whose name was — dative of the possessor","in testimonium":"as a witness, for testimony","perhiberet":"might bear (purpose)","lumine":"light (abl. of lumen)","crederent":"might believe (purpose)","illuminat":"enlightens","venientem":"coming (present participle, acc. sg.)","caro":"flesh","habitavit":"dwelt"},"notes":["The word order <b>Deus erat Verbum</b> is rhetorically marked.","<b>facta sunt</b> agrees with neuter plural <b>omnia</b>.","The final verb can mean “did not grasp,” “did not comprehend,” or “did not overcome,” depending on interpretation.","<b>cui nomen erat Ioannes</b> is the dative of the possessor from unit <b>f6</b>, still going strong four centuries after Cicero. Note that the name stays nominative, in apposition to <b>nomen</b>.","Biblical Latin is deliberately plain — short clauses, heavy repetition, <b>et</b> instead of subordination — because Jerome was translating Greek that was itself imitating Hebrew. After Cicero it reads almost like a different language, and it is the easiest classical-era prose in this Reading Room."],"source":"https://www.thelatinlibrary.com/bible/john.shtml","license":"Clementine Vulgate (1592), public domain. The Stuttgart critical edition is still in copyright and is deliberately not used here. Translation and notes are original.","hasMacrons":false},{"id":"r4","title":"How long, Catiline?","author":"Marcus Tullius Cicero","work":"In Catilinam 1.1–2","level":"Advanced prose","kind":"Oratory","text":"Quo usque tandem abutere, Catilina, patientia nostra? Quam diu etiam furor iste tuus nos eludet? Quem ad finem sese effrenata iactabit audacia? Nihilne te nocturnum praesidium Palati, nihil urbis vigiliae, nihil timor populi, nihil concursus bonorum omnium, nihil hic munitissimus habendi senatus locus, nihil horum ora vultusque moverunt? Patere tua consilia non sentis? O tempora, o mores! Senatus haec intellegit, consul videt; hic tamen vivit.","translation":"How long, Catiline, will you abuse our patience? How much longer will that madness of yours mock us? To what limit will your unbridled audacity hurl itself? Has the night guard on the Palatine had no effect on you, nor the watch posted through the city, nor the fear of the people, nor the gathering of all loyal men, nor this most strongly defended place for holding the senate, nor the faces and expressions of these men here? Do you not feel that your plans lie exposed? What an age, what morals! The senate understands these things, the consul sees them; and yet this man is alive.","gloss":{"quo usque":"how long / to what point","tandem":"at last / then","abutere":"will you abuse (future deponent)","patientia":"patience (abl.)","quam diu":"how long","furor":"madness","iste tuus":"that of yours","eludet":"will mock / evade","quem ad finem":"to what limit","sese":"itself","effrenata":"unbridled","iactabit":"will toss / flaunt","Nihilne":"has nothing … ? — the first of six anaphoric nihil","nocturnum praesidium":"the night guard","Palati":"of the Palatine hill (gen.)","vigiliae":"watches, patrols","concursus":"gathering, rallying","bonorum omnium":"of all loyal citizens — Cicero’s term for his own side","munitissimus":"most heavily fortified (superlative)","habendi senatus":"for holding the senate (gerundive with locus)","ora vultusque":"faces and expressions","Patere":"to lie open, be exposed (infinitive in indirect statement)","O tempora, o mores":"what times, what morals! — accusative of exclamation","hic tamen vivit":"and yet this man is alive"},"notes":["Three questions build pressure through anaphora and escalating vocabulary.","<b>abutere</b> governs the ablative <b>patientia</b>.","<b>iste</b> can carry a dismissive or hostile tone.","Six occurrences of <b>nihil</b> in one sentence, each introducing a heavier item than the last, and the verb <b>moverunt</b> withheld until the very end. Anaphora plus a suspended main verb is Cicero at full power, and it is worth reading aloud.","<b>hic tamen vivit</b> — three words after that vast period. The collapse from grandeur to a flat statement of fact is the whole rhetorical point."],"source":"https://www.thelatinlibrary.com/cicero/cat1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r5","title":"Let us live and love","author":"Catullus","work":"Carmina 5","level":"Intermediate poetry","kind":"Lyric poetry","text":"Vivamus, mea Lesbia, atque amemus,\nrumoresque senum severiorum\nomnes unius aestimemus assis!\nsoles occidere et redire possunt:\nnobis cum semel occidit brevis lux,\nnox est perpetua una dormienda.\nda mi basia mille, deinde centum,\ndein mille altera, dein secunda centum,\ndeinde usque altera mille, deinde centum.\ndein, cum milia multa fecerimus,\nconturbabimus illa, ne sciamus,\naut ne quis malus invidere possit,\ncum tantum sciat esse basiorum.","translation":"Let us live, my Lesbia, and let us love, and value all the mutterings of sterner old men at a single penny. Suns can set and return; for us, once our brief light has set, one perpetual night must be slept. Give me a thousand kisses, then a hundred, then another thousand, then a second hundred, then yet another thousand, then a hundred. Then, when we have made up many thousands, we shall jumble the accounts, so as not to know the number — or so that no ill-wisher can put a curse on us, when he knows the sum of our kisses.","gloss":{"Vivamus":"let us live (hortatory subjunctive)","amemus":"let us love","rumores":"rumours, mutterings","senum":"of old men (gen. pl. of senex)","severiorum":"rather stern (comparative)","unius":"of a single — with assis at the line’s end","aestimemus":"let us value","assis":"an as, a penny (genitive of value)","occidere":"to set","semel":"once","brevis lux":"brief light","perpetua":"unbroken, everlasting","dormienda":"must be slept (gerundive of obligation)","da mi basia":"give me kisses (mi = mihi)","dein":"then (shortened from deinde)","usque":"continuously, on and on","milia multa":"many thousands","fecerimus":"we shall have made (future perfect)","conturbabimus":"we shall throw the accounts into confusion — a book-keeping term","ne sciamus":"so that we may not know (purpose)","ne quis malus":"so that no ill-wisher (quis after nē = anyone)","invidere":"to cast the evil eye, to envy","basiorum":"of kisses — partitive genitive after tantum, five words earlier"},"notes":["The first three verbs are hortatory subjunctives.","<b>unius assis</b> is genitive of value.","<b>nox ... dormienda</b> is a passive periphrastic: literally, “a night must be slept.”","The whole poem is built on an accountant’s metaphor: kisses are counted, then the ledger is deliberately jumbled — <b>conturbabimus</b> is the word for a bankrupt confusing his books. The lovers make themselves insolvent so that no one can audit them.","<b>invidere</b> is literal: to look upon, and so to overlook with the evil eye. Knowing an exact number was thought to give a curse purchase, which is why the count must be spoiled."],"source":"https://www.thelatinlibrary.com/catullus.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r6","title":"A poem of transformations","author":"Ovid","work":"Metamorphoses 1.1–9","level":"Advanced poetry","kind":"Epic poetry","text":"In nova fert animus mutatas dicere formas\ncorpora; di, coeptis (nam vos mutastis et illas)\nadspirate meis primaque ab origine mundi\nad mea perpetuum deducite tempora carmen.\nAnte mare et terras et quod tegit omnia caelum\nunus erat toto naturae vultus in orbe,\nquem dixere chaos: rudis indigestaque moles\nnec quicquam nisi pondus iners congestaque eodem\nnon bene iunctarum discordia semina rerum.","translation":"My spirit carries me to tell of forms changed into new bodies. Gods, breathe favourably upon my undertakings — for you changed those too — and draw down my continuous song from the first origin of the world to my own times. Before the sea and the lands and the sky that covers everything, nature wore one single face throughout the whole world, which men called Chaos: a raw and undigested mass, nothing but inert weight, and heaped in the same place the discordant seeds of things not well joined together.","gloss":{"In nova":"into new — agrees with corpora at the start of the next line, a famous hyperbaton","fert animus":"my spirit carries me","mutatas":"changed — agrees with formas later in the line","dicere":"to tell of","formas":"forms, shapes (object of dicere)","corpora":"bodies — the noun that In nova has been waiting for","di":"gods (vocative plural of deus)","coeptis":"undertakings (dative with adspirate); meis follows a line later","mutastis":"you have changed (syncopated for mutavistis)","illas":"those (i.e. the forms)","adspirate":"breathe upon, favour (imperative plural)","origine mundi":"the origin of the world","perpetuum":"continuous — agrees with carmen at the end of the line","deducite":"draw down, spin out (imperative plural)","tempora":"times; ad mea ... tempora, down to my own day","carmen":"song, poem (object of deducite)","tegit":"covers","unus":"one, single — agrees with vultus at the line’s end","vultus":"face, appearance — the subject of erat","toto":"whole — agrees with orbe two words later","in orbe":"in the world","dixere":"they called (= dixerunt)","rudis":"raw, unworked","indigesta":"unsorted, undigested","moles":"mass, bulk","quicquam":"anything","pondus iners":"inert weight","congesta":"heaped together (n. pl.)","eodem":"to the same place","iunctarum":"joined (gen. pl. f., with rerum)","discordia semina":"discordant seeds"},"notes":["The hyperbaton separates <b>mutatas ... formas</b> around <b>dicere</b>.","<b>fert animus</b> takes a complementary infinitive.","The poem announces continuous history from creation to Ovid’s present.","Ovid describes Chaos by making the syntax itself chaotic: <b>non bene iunctarum discordia semina rerum</b> interleaves two agreeing pairs — <b>discordia … semina</b> and <b>iunctarum … rerum</b> — so that the words are as tangled as the matter they describe.","<b>dixere</b> is the alternative third-plural perfect for <b>dixerunt</b>, very common in verse because it scans differently. It is not an infinitive."],"source":"https://www.thelatinlibrary.com/ovid/ovid.met1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r7","title":"Arms and the man","author":"Vergil","work":"Aeneid 1.1–11","level":"Advanced poetry","kind":"Epic poetry","text":"Arma virumque cano, Troiae qui primus ab oris\nItaliam, fato profugus, Laviniaque venit\nlitora, multum ille et terris iactatus et alto\nvi superum saevae memorem Iunonis ob iram;\nmulta quoque et bello passus, dum conderet urbem,\ninferretque deos Latio, genus unde Latinum,\nAlbanique patres, atque altae moenia Romae.\nMusa, mihi causas memora, quo numine laeso\nquidve dolens regina deum tot volvere casus\ninsignem pietate virum, tot adire labores\nimpulerit. tantaene animis caelestibus irae?","translation":"I sing of arms and the man who first came from the shores of Troy to Italy and the Lavinian coast, an exile by fate, much tossed on land and sea by the power of the gods because of the mindful anger of savage Juno; and who suffered many things also in war, until he could found a city and bring his gods into Latium — from which came the Latin race, the Alban fathers, and the walls of lofty Rome. Muse, recall to me the causes: what divine power was slighted, or what grievance made the queen of the gods drive a man renowned for his devotion to endure so many misfortunes and to face so many labours. Can there be such anger in heavenly hearts?","gloss":{"arma virumque":"arms and the man","cano":"I sing","Troiae":"of Troy — with ab oris at the line’s end","ab oris":"from the shores","fato profugus":"an exile by fate","litora":"shores (n. pl., object of venit)","iactatus":"tossed about","alto":"the deep sea (abl.)","vi superum":"by the power of the gods above","memorem":"unforgetting — agrees with iram at the line’s end","ob iram":"because of the anger","passus":"having suffered (perfect participle of the deponent patior)","dum conderet":"until he could found (dum with the subjunctive, of purpose)","inferret":"might bring in","unde":"from which source","moenia":"city walls","Musa":"Muse (vocative)","memora":"recall, tell (imperative)","quo numine laeso":"what divine power having been offended (ablative absolute)","quidve dolens":"or grieving at what","regina deum":"the queen of the gods — Juno; deum = deorum","volvere casus":"to undergo a train of misfortunes","insignem pietate":"distinguished for his devotion","adire labores":"to face hardships","impulerit":"drove, impelled (perfect subjunctive in an indirect question)","tantaene":"so great …? — agrees with irae at the line’s end","irae":"fits of anger (nom. pl.) — with sunt understood","animis caelestibus":"in heavenly hearts (dative of the possessor)"},"notes":["The object <b>virum</b> is the antecedent of <b>qui</b>, whose clause runs through <b>inferret</b>.","<b>fato</b>, <b>terris</b>, <b>alto</b> and <b>vi</b> are ablatives with different functions.","The subject of <b>venit</b> and <b>passus</b> is held across several lines.","The second sentence is one long indirect question depending on <b>memora</b>, and its verb <b>impulerit</b> is held back to the first word of line 11. Everything between is suspended — the classic Latin period, in verse.","<b>tantaene animis caelestibus irae?</b> has no verb at all: a dative of the possessor and a nominative, with <b>sunt</b> left out. Seven words to end the proem, and the shock is that a god should behave like this."],"source":"https://www.thelatinlibrary.com/vergil/aen1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r8","title":"Seize the day","author":"Horace","work":"Odes 1.11","level":"Advanced poetry","kind":"Lyric poetry","text":"Tu ne quaesieris—scire nefas—quem mihi, quem tibi\nfinem di dederint, Leuconoe, nec Babylonios\ntemptaris numeros. ut melius, quidquid erit, pati!\nseu pluris hiemes seu tribuit Iuppiter ultimam,\nquae nunc oppositis debilitat pumicibus mare\nTyrrhenum: sapias, vina liques, et spatio brevi\nspem longam reseces. dum loquimur, fugerit invida\naetas: carpe diem, quam minimum credula postero.","translation":"Do not ask — it is forbidden to know — what end the gods have assigned to me or to you, Leuconoe, and do not meddle with Babylonian calculations. How much better to endure whatever comes, whether Jupiter has allotted us more winters or this is the last, which now wears down the Tyrrhenian sea on the pumice rocks that face it. Be wise, strain the wine, and cut back long hope into a short span. While we speak, envious time will already have fled: seize the day, trusting as little as possible in tomorrow.","gloss":{"ne quaesieris":"do not ask (perfect subjunctive in a prohibition)","scire nefas":"it is forbidden to know","dederint":"have assigned (perfect subjunctive in an indirect question)","Leuconoe":"Leuconoe (vocative, a Greek name)","Babylonios":"Babylonian — agrees with numeros in the next line","temptaris":"do not try (syncopated for temptaveris)","numeros":"calculations, horoscopes","pluris hiemes":"more winters","tribuit":"has allotted","oppositis":"set against it (with pumicibus)","debilitat":"wears down","pumicibus":"pumice rocks (abl.)","sapias":"be wise (jussive subjunctive)","liques":"strain, filter","spatio brevi":"within a short span","spem longam":"long-reaching hope","reseces":"prune back","fugerit":"will have fled (future perfect)","invida":"envious — agrees with aetas at the start of the next line","aetas":"time, the passing of life","credula":"trusting (f. sg., addressed to Leuconoe)","postero":"to tomorrow (dative)"},"notes":["The poem opens with prohibitive perfect subjunctives.","<b>fugerit</b> is formally future perfect or perfect subjunctive; context gives the famous sense of time already slipping away.","<b>quam minimum credula</b> addresses Leuconoe: “trusting as little as possible.”"],"source":"https://www.thelatinlibrary.com/horace/carm1.shtml","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","hasMacrons":false},{"id":"r9","title":"The restless heart","author":"Augustine of Hippo","work":"Confessions 1.1","level":"Advanced prose","kind":"Late / Christian Latin","text":"Magnus es, Domine, et laudabilis valde: magna virtus tua, et sapientiae tuae non est numerus. Et laudare te vult homo, aliqua portio creaturae tuae; et homo circumferens mortalitatem suam, circumferens testimonium peccati sui. Tu excitas ut laudare te delectet, quia fecisti nos ad te et inquietum est cor nostrum donec requiescat in te.","translation":"Great are you, Lord, and greatly worthy of praise; great is your power, and of your wisdom there is no number. A human being wishes to praise you, some small portion of your creation — a human being carrying about his mortality and the testimony of his sin. You stir him so that praising you is a delight, because you made us for yourself, and our heart is restless until it rests in you.","gloss":{"magnus es":"great are you","Domine":"Lord (voc.)","laudabilis valde":"greatly worthy of praise","virtus":"power / excellence","sapientiae tuae":"of your wisdom","non est numerus":"there is no number","laudare te":"to praise you","aliqua portio":"some portion","creaturae tuae":"of your creation","circumferens":"carrying around","mortalitatem":"mortality","testimonium":"testimony","excitas":"you rouse, you stir","delectet":"it delights, it is a delight (subjunctive after ut)","fecisti nos ad te":"you made us towards yourself, for yourself","inquietum":"restless","donec requiescat":"until it comes to rest (subjunctive: until such time as)"},"notes":["The opening balances parallel clauses around repeated <b>magnus/magna</b>.","<b>laudare te vult homo</b> places the infinitive phrase first for emphasis.","The present participle <b>circumferens</b> agrees with <b>homo</b>.","<b>inquietum est cor nostrum donec requiescat in te</b> is the most quoted sentence Augustine ever wrote, and the Latin does something English cannot: <b>inquietum</b> and <b>requiescat</b> share a root, so restlessness and rest are the same word pulling in opposite directions.","<b>donec</b> with the subjunctive means until such time as — the resting is anticipated, not reported. With the indicative it would state a fact about when the restlessness stopped."],"source":"https://www.thelatinlibrary.com/augustine/conf1.shtml","license":"Late-antique text, public domain. Translation and notes are original.","hasMacrons":false},{"id":"r10","title":"Judgment by peers","author":"Magna Carta","work":"Clauses 39–40 (1215)","level":"Intermediate","kind":"Medieval legal Latin","text":"Nullus liber homo capiatur vel imprisonetur aut disseisiatur aut utlagetur aut exuletur aut aliquo modo destruatur, nec super eum ibimus nec super eum mittemus, nisi per legale iudicium parium suorum vel per legem terrae.\nNulli vendemus, nulli negabimus aut differemus rectum aut iustitiam.","translation":"No free man shall be seized or imprisoned, dispossessed, outlawed, exiled or in any way destroyed; nor shall we proceed against him or send against him, except by the lawful judgment of his peers or by the law of the land. To no one will we sell, to no one will we refuse or delay right or justice.","gloss":{"Nullus liber homo":"no free man","capiatur":"shall be seized (jussive subjunctive)","imprisonetur":"shall be imprisoned (medieval Latin)","disseisiatur":"shall be dispossessed of his holding (feudal legal term)","utlagetur":"shall be outlawed","exuletur":"shall be exiled","destruatur":"shall be ruined","nec super eum ibimus":"nor shall we proceed against him","nisi":"except","legale iudicium":"lawful judgement","parium suorum":"of his peers","legem terrae":"the law of the land","Nulli":"to no one (dative)","vendemus":"we shall sell","negabimus":"we shall refuse","differemus":"we shall delay","rectum aut iustitiam":"right or justice"},"notes":["The repeated present subjunctives have prescriptive force.","Several terms are medieval Latinisations of legal vocabulary rather than classical usage.","<b>nisi</b> introduces the limiting exception.","Clause 40 is three futures in the first person plural — the king speaking as <i>we</i> — with <b>nulli</b> repeated at the head of each half. The rhythm is oratory, not legal drafting, and it is why the sentence has survived eight hundred years.","The seven verbs of clause 39 are all present subjunctive: jussive, expressing what shall not be done. Medieval legal Latin keeps classical morphology almost intact while adding feudal vocabulary — <b>disseisiatur</b> and <b>utlagetur</b> would have baffled Cicero."],"source":"https://www.thelatinlibrary.com/magnacarta.html","license":"Medieval text, public domain. Translation and notes are original.","hasMacrons":false},{"id":"r11","title":"Quantity of matter","author":"Isaac Newton","work":"Principia, Definitions I–II","level":"Advanced prose","kind":"Neo-Latin science","text":"Quantitas materiae est mensura eiusdem orta ex illius densitate et magnitudine conjunctim.\nQuantitas motus est mensura eiusdem orta ex velocitate et quantitate materiae conjunctim.","translation":"The quantity of matter is a measure of the same arising jointly from its density and its magnitude. The quantity of motion is a measure of the same arising jointly from the velocity and the quantity of matter.","gloss":{"quantitas materiae":"quantity of matter","mensura":"measure","eiusdem":"of the same","orta":"arising","illius":"of it / its","densitate":"density","magnitudine":"magnitude / volume","conjunctim":"jointly","motus":"of motion (4th declension genitive)","velocitate":"from velocity (abl.)"},"notes":["<b>orta</b> is a perfect participle agreeing with <b>mensura</b>, but with active sense because <b>orior</b> is deponent.","Newton’s <b>magnitudo</b> here refers to bulk or volume.","Scientific Neo-Latin often uses compact nominal definitions.","The two definitions are deliberately identical in structure — <b>quantitas X est mensura eiusdem orta ex A et B conjunctim</b> — so that the second is understood as soon as the first is. Newton is writing in the geometrical manner, where the form of the sentence is part of the argument.","What the second definition defines is momentum: velocity times mass. Reading it in Latin makes plain how much of the conceptual work is done by the single word <b>conjunctim</b>, jointly, meaning multiplied rather than added."],"source":"https://la.wikisource.org/wiki/Philosophiae_Naturalis_Principia_Mathematica/Definitiones","license":"Newton’s 1687 Latin text is public domain. Translation and notes are original.","hasMacrons":false},{"id":"r12","title":"One man on the bridge","author":"Livy","work":"Ab Urbe Condita 2.10","level":"Advanced prose","kind":"History","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/livy/liv.2.shtml","text":"Cum hostes adessent, pro se quisque in urbem ex agris demigrant; urbem ipsam saepiunt praesidiis. Alia muris, alia Tiberi obiecto videbantur tuta: pons sublicius iter paene hostibus dedit, ni unus vir fuisset, Horatius Cocles; id munimentum illo die fortuna urbis Romanae habuit.","translation":"When the enemy drew near, everyone for himself moved into the city from the countryside; they fenced the city itself about with garrisons. Some parts seemed safe behind the walls, others behind the barrier of the Tiber. The pile bridge almost gave the enemy a way in, had there not been one man, Horatius Cocles; that was the defence which the fortune of Rome had on that day.","gloss":{"adessent":"were at hand (imperfect subjunctive after cum)","pro se quisque":"each man for himself","demigrant":"move away (historic present)","saepiunt":"fence in, protect","praesidiis":"with garrisons (ablative of means)","Alia":"some parts ... others — the word appears twice, correlating two halves of the defences","Tiberi obiecto":"the Tiber having been set in the way (ablative absolute)","tuta":"safe (n. pl., agreeing with alia)","pons sublicius":"the pile bridge, Rome's oldest","ni":"if not (archaic for nisi)","fuisset":"there had been (pluperfect subjunctive)","munimentum":"defence, fortification","illo die":"on that day (ablative of time when)"},"notes":["The historic presents <b>demigrant</b> and <b>saepiunt</b> sit beside past tenses without apology. Livy switches into the present at moments of urgency; translate them as past unless you want the same effect in English.","<b>ni unus vir fuisset</b> is an unreal condition with its main clause left as the plain indicative <b>dedit</b>. Latin allows this when the point is that the thing very nearly happened: the bridge <i>did</i> almost let them in.","The last clause is Livy's epitaph on the episode, with <b>id munimentum</b> — one man — placed emphatically first and <b>fortuna urbis Romanae</b> as the subject that follows."],"hasMacrons":false},{"id":"r13","title":"The wolf and the lamb","author":"Phaedrus","work":"Fabulae 1.1.1–8","level":"Intermediate poetry","kind":"Fable","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/phaedrus1.html","text":"Ad rivum eundem lupus et agnus venerant,\nsiti compulsi. Superior stabat lupus,\nlongeque inferior agnus. Tunc fauce improba\nlatro incitatus iurgii causam intulit.\n“Cur” inquit “turbulentam fecisti mihi\naquam bibenti?” Laniger contra timens:\n“Qui possum, quaeso, facere quod quereris, lupe?\nA te decurrit ad meos haustus liquor.”","translation":"A wolf and a lamb had come to the same stream, driven by thirst. The wolf was standing higher up, and the lamb a long way below. Then the brigand, spurred on by his shameless gullet, produced a pretext for a quarrel. “Why,” he said, “have you muddied the water for me while I am drinking?” The woolly one, frightened, replied: “How can I possibly do what you complain of, wolf? The water runs down from you to where I drink.”","gloss":{"rivum":"stream (acc. after Ad)","eundem":"the same (accusative of īdem)","agnus":"lamb","venerant":"had come (pluperfect)","siti":"by thirst (ablative of sitis)","compulsi":"driven (perfect participle, nom. pl., with lupus et agnus)","Superior":"higher up (comparative used of position on the bank)","longe":"far, by a long way","inferior":"lower down","fauce improba":"by his shameless gullet (ablative of cause)","latro":"brigand, robber — the wolf","incitatus":"spurred on","iurgii":"of a quarrel (genitive)","intulit":"brought forward, produced","turbulentam":"muddied, disturbed (agreeing with aquam on the next line)","bibenti":"for me drinking (dative, agreeing with mihi)","Laniger":"the woolly one — a mock-epic name for the lamb","contra":"in reply","Qui possum":"how can I? (quī here is the old ablative: how)","quaeso":"I ask you, please","quereris":"you complain of (deponent)","lupe":"wolf! (vocative)","decurrit":"runs down","haustus":"draughts, drinking (acc. pl., 4th declension)","liquor":"the water, the liquid"},"notes":["Phaedrus writes iambic senarii, a conversational metre far easier on the ear than hexameter. Read it aloud and the rhythm carries you.","The whole moral is planted in one word: calling the wolf <b>latro</b> before he has said anything decides the fable in advance. Notice also <b>Superior</b> and <b>inferior</b> doing double duty for physical position and for power.","<b>compulsi</b> is masculine plural because <b>lupus et agnus</b> together are its subject. When a participle serves two nouns of different gender, Latin takes the masculine.","The lamb wins the argument on the facts — water runs downhill — and is eaten anyway. Phaedrus is writing under Tiberius, and the fable is about power, not hydrology.","<b>Qui possum … facere quod quereris?</b> uses <b>quī</b> as an old ablative meaning <i>how</i>, a form that survives mainly in this phrase and in <b>quīn</b>. Do not read it as the relative pronoun."],"hasMacrons":false},{"id":"r14","title":"I do not love you","author":"Martial","work":"Epigrammata 1.32 and 1.38","level":"Intermediate poetry","kind":"Epigram","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/martial/mart1.shtml","text":"Non amo te, Sabidi, nec possum dicere quare:\nhoc tantum possum dicere, non amo te.\n\nQuem recitas meus est, o Fidentine, libellus:\nsed male cum recitas, incipit esse tuus.","translation":"I do not love you, Sabidius, and I cannot say why. This much only I can say: I do not love you. — The little book you recite, Fidentinus, is mine; but when you recite it badly, it begins to be yours.","gloss":{"Sabidi":"Sabidius (vocative of Sabidius)","nec":"and not","possum":"I am able","quare":"why","hoc tantum":"this much only","non amo te":"I do not love you — repeated verbatim as the whole point","Quem recitas":"the one which you recite — the relative comes first, its antecedent libellus last","Fidentine":"Fidentinus (vocative) — a plagiarist Martial pursues across several poems","libellus":"little book, book of poems","male":"badly","incipit":"it begins","tuus":"yours — the punchline, held to the final word"},"notes":["Two lines: a hexameter and a pentameter, the elegiac couplet. Martial uses the pentameter's built-in break to land the joke.","The vocative of second-declension names in <b>-ius</b> contracts to a single <b>-ī</b>: <b>Sabidius → Sabidī</b>, <b>Vergilius → Vergilī</b>. Nothing else in the language does this.","This is the shortest complete Latin poem in the Reading Room, and worth memorising: it is the ancestor of the English rhyme \"I do not love thee, Doctor Fell.\"","Both epigrams put the point in the last word of the pentameter: <b>te</b> and <b>tuus</b>. The elegiac couplet has a hard break in the middle of its second line, and Martial uses that pause as a comedian uses a beat.","In 1.38 the relative clause <b>Quem recitas</b> comes before its antecedent <b>libellus</b>, which arrives at the end of the line. Latin allows this freely; English cannot, which is why the translation has to reorder."],"hasMacrons":false},{"id":"r15","title":"Claim yourself for yourself","author":"Seneca","work":"Epistulae Morales 1.1–3","level":"Advanced prose","kind":"Letters","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/sen/seneca.ep1.shtml","text":"Ita fac, mi Lucili: vindica te tibi, et tempus quod adhuc aut auferebatur aut subripiebatur aut excidebat collige et serva. Persuade tibi hoc sic esse ut scribo: quaedam tempora eripiuntur nobis, quaedam subducuntur, quaedam effluunt. Turpissima tamen est iactura quae per neglegentiam fit. Et si volueris attendere, magna pars vitae elabitur male agentibus, maxima nihil agentibus, tota vita aliud agentibus. Omnia, Lucili, aliena sunt, tempus tantum nostrum est.","translation":"Do just that, my dear Lucilius: claim yourself for yourself, and gather and keep the time that until now was being taken from you, or stolen from you, or slipping away. Convince yourself that it is as I write: some periods of time are snatched from us, some are quietly removed, some simply drain away. The most shameful loss, though, is the one that happens through carelessness. And if you are willing to pay attention, a great part of life slips away from those doing wrong, the greatest part from those doing nothing, the whole of life from those doing something other than what they should. Everything, Lucilius, belongs to someone else; time alone is ours.","gloss":{"Ita fac":"do so, carry on as you are (imperative of faciō)","mi Lucili":"my dear Lucilius (vocative)","vindica te tibi":"claim yourself for yourself — reflexive accusative and dative together","adhuc":"until now","auferebatur":"was being carried off","subripiebatur":"was being stolen from underneath","excidebat":"was slipping away, falling out","collige":"gather up (imperative)","Persuade tibi":"persuade yourself (persuādeō takes the dative)","quaedam":"certain ones, some (n. pl. of quīdam)","eripiuntur":"are snatched away","subducuntur":"are quietly withdrawn","effluunt":"flow away","Turpissima":"most shameful (superlative)","iactura":"loss, jettisoning","neglegentiam":"carelessness (acc.)","volueris":"you are willing (future perfect of volō)","attendere":"to pay attention","elabitur":"slips away (deponent)","male agentibus":"from those doing badly (dative)","nihil agentibus":"from those doing nothing","aliud agentibus":"from those doing something else","aliena":"belonging to others","tantum":"only"},"notes":["Three imperfect passives in a row — <b>auferebatur, subripiebatur, excidebat</b> — then three presents in a row: <b>eripiuntur, subducuntur, effluunt</b>. Seneca argues by triad, and the escalation from violent theft to silent draining is the argument.","<b>persuādeō</b> takes the dative of the person, then an indirect statement for the content: <b>persuade tibi hoc sic esse</b>. Many Latin verbs of speaking and influencing take the dative where English takes an object.","<b>vindica te tibi</b> is untranslatable in a phrase: reclaim yourself, as one reclaims stolen property, and hand yourself back to yourself. Seneca's Latin is at its best when it is at its plainest.","<b>male agentibus, nihil agentibus, aliud agentibus</b> — the same participle three times, with only the object changing, and the loss growing from <i>magna</i> to <i>maxima</i> to <i>tota</i>. Seneca argues in triads, and the escalation carries the point without an argument being stated.","The closing sentence is six words long after four sprawling ones. <b>Omnia … aliena sunt, tempus tantum nostrum est</b> is balanced, monosyllabic and unanswerable — Seneca’s characteristic move."],"hasMacrons":false},{"id":"r16","title":"A cloud over the bay","author":"Pliny the Younger","work":"Epistulae 6.16","level":"Advanced prose","kind":"Letters","license":"Public-domain text of a standard pre-1928 edition. Translation and learning notes in this app are original.","source":"https://www.thelatinlibrary.com/pliny.ep6.html","text":"Erat Miseni classemque imperio praesens regebat. Nonum kal. Septembres hora fere septima mater mea indicat ei apparere nubem inusitata et magnitudine et specie. Usus ille sole, mox frigida, gustaverat iacens studebatque; poscit soleas, ascendit locum ex quo maxime miraculum illud conspici poterat.","translation":"He was at Misenum, in personal command of the fleet. On the twenty-fourth of August, at about the seventh hour, my mother pointed out to him that a cloud was appearing, unusual in both size and shape. He had taken his sunbath, then a cold plunge, had eaten a snack lying down and was at his books; he called for his sandals and climbed to a place from which that marvel could best be observed.","gloss":{"Miseni":"at Misenum (locative)","classem":"fleet (acc.)","imperio praesens":"present in command, holding command in person","regebat":"was commanding","Nonum kal. Septembres":"the ninth day before the Kalends of September, i.e. 24 August","hora fere septima":"at about the seventh hour — roughly one in the afternoon","indicat":"points out (historic present)","ei":"to him (dative of is)","apparere":"to be appearing (infinitive in indirect statement)","nubem":"cloud (accusative subject of apparere)","inusitata":"unusual

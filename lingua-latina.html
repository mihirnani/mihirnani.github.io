losstip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90%;text-align:center}.aidbox{background:var(--card2);border-radius:10px;padding:13px 15px;margin:13px 0}.notes li{margin:6px 0}.source{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}.flashstage{max-width:590px;margin:0 auto}.flashcard{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:32px;box-shadow:var(--shadow);cursor:pointer}.flashcard .front{font:700 28px/1.25 Georgia,serif}.flashcard .back{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:20px;color:var(--muted)}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.grades button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 5px;border-radius:9px;font-weight:750;cursor:pointer}.labtable{overflow-x:auto}.banner{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px}.menubtn{display:none;position:fixed;right:18px;bottom:18px;z-index:70;width:52px;height:52px;border:0;border-radius:50%;background:var(--acc);color:white;font-size:22px;box-shadow:0 5px 20px rgba(0,0,0,.3)}

<script>
const COURSE=[{"id":"found","short":"I","icon":"Ⅰ","label":"Stage I — Foundations","tagline":"Forms that unlock sentences","desc":"Pronunciation, the case system, first and second declensions, present verbs and essential sentence patterns.","units":[{"id":"f1","title":"Sounds, quantities & the case idea","subtitle":"How Latin encodes meaning in endings","grammar":"<p class=\"lead\">Latin does with word-endings what English does with word-order and prepositions. That single fact governs everything else in the course, so it is worth slowing down over.</p><h3>What an ending does</h3><p>In English, <i>the girl sees the poet</i> and <i>the poet sees the girl</i> use identical words and mean opposite things. Position alone assigns the roles. Latin refuses to work this way. It stamps the role onto the noun itself:</p><table class=\"gr\"><tr><th>Latin</th><th>Ending</th><th>Role</th><th>English</th></tr><tr><td>puell<b>a</b></td><td>-a</td><td>subject</td><td>the girl (does something)</td></tr><tr><td>puell<b>am</b></td><td>-am</td><td>object</td><td>the girl (has something done to her)</td></tr></table><p>So <b>puella poētam videt</b> and <b>poētam puella videt</b> and <b>videt puella poētam</b> all mean the girl sees the poet. The endings never move; only the words do. Roman authors exploited that freedom constantly, and it is why Latin poetry can be so densely packed.</p><h3>The six cases</h3><p>A case is a role. Latin has six, and every noun you meet will be in one of them.</p><table class=\"gr\"><tr><th>Case</th><th>Core job</th><th>Rough English equivalent</th></tr><tr><td>Nominative</td><td>subject</td><td>the man …</td></tr><tr><td>Accusative</td><td>direct object; motion towards</td><td>… the man; to the man</td></tr><tr><td>Genitive</td><td>possession, description</td><td>of the man, the man&#39;s</td></tr><tr><td>Dative</td><td>indirect object, interest</td><td>to/for the man</td></tr><tr><td>Ablative</td><td>means, manner, place, separation</td><td>by/with/from/in the man</td></tr><tr><td>Vocative</td><td>direct address</td><td>O man!</td></tr></table><p>Do not memorise these as a list of translations. Memorise them as <i>questions the sentence is answering</i>: who is doing it, what is it being done to, whose is it, for whom, by what means. Cases are jobs, and translations follow from the job.</p><h3>Sounds and quantities</h3><p>Restored classical pronunciation is close to what an educated Roman of Cicero&#39;s day used. The rules that matter:</p><ul><li><b>c</b> and <b>g</b> are always hard: <b>Cicerō</b> is <i>KEE-ke-ro</i>, <b>gēns</b> is <i>gains</i>.</li><li><b>v</b> is English <i>w</i>: <b>vēnī, vīdī, vīcī</b> is <i>WAY-nee, WEE-dee, WEE-kee</i>.</li><li><b>ae</b> is the vowel of <i>eye</i>; <b>oe</b> is the vowel of <i>boy</i>.</li><li>Double consonants are both sounded: <b>ille</b> is <i>il-le</i>, as in Italian.</li></ul><p>The macron — the bar over <b>ā ē ī ō ū</b> — marks a <i>long</i> vowel, meaning one held roughly twice as long. It is not a stress mark. Length changes meaning: <b>malum</b> is an evil, <b>mālum</b> is an apple; <b>populus</b> is a people, <b>pōpulus</b> is a poplar tree. It also decides where a word is stressed, and it is the entire basis of Latin verse.</p><h3>Where the stress falls</h3><p>Stress depends on the <i>weight</i> of the second-to-last syllable — the penult — not simply on whether its vowel is long. A syllable is <b>heavy</b> if it contains a long vowel or a diphthong, <i>or</i> if its vowel is followed by two or more consonants. Otherwise it is light.</p><table class=\"gr\"><tr><th>Word</th><th>Penult</th><th>Why</th><th>Stress</th></tr><tr><td lang=\"la\">amīcus</td><td>-mī-</td><td>heavy: long vowel</td><td>a-MĪ-cus</td></tr><tr><td lang=\"la\">puella</td><td>-el-</td><td>heavy: short vowel, but closed by two consonants</td><td>pu-EL-la</td></tr><tr><td lang=\"la\">dominus</td><td>-mi-</td><td>light</td><td>DO-mi-nus</td></tr><tr><td lang=\"la\">legere</td><td>-ge-</td><td>light</td><td>LE-ge-re</td></tr></table><p>In a word of three or more syllables, stress the penult if it is heavy and the syllable before it if not. In a word of two syllables, stress the first. Note the second row: the <i>e</i> of <b>puella</b> is short, but the two consonants after it make the syllable heavy all the same. This is the same notion of weight that governs metre in unit <b>a6</b>. Read aloud from the first day; Latin was written for the ear long before it was written for the eye.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Translating word by word from left to right. Read to the full stop first, find the verb, then find the nominative.</li><li>Assuming the first noun is the subject. It very often is not.</li><li>Treating macrons as optional decoration. Most printed Latin omits them, so learn the quantity <i>with</i> the word while you still have the help.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Poētam puella videt.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Poētam</td><td>accusative singular</td><td>object — despite standing first</td></tr><tr><td lang=\"la\">puella</td><td>nominative singular</td><td>subject</td></tr><tr><td lang=\"la\">videt</td><td>3rd person singular</td><td>verb; its <b>-t</b> already agrees with <b>puella</b></td></tr></table><p><b>Sense:</b> the girl sees the poet. An English reader wants <i>the poet sees the girl</i>; the <b>-am</b> forbids it. Trust the ending over the position, every time.</p></div>","examples":[["Rōma in Italiā est.","Rome is in Italy."],["Puella poetam videt.","The girl sees the poet."],["Poeta puellam videt.","The poet sees the girl."],["Salvē, amīce!","Hello, friend!"]],"vocab":[["Rōma","Rome"],["Italia","Italy"],["puella","girl"],["poēta","poet"],["amīcus","friend"],["videt","sees"],["est","is"],["in","in / on"],["salvē","hello"],["casus","case"],["nōmen","noun / name"],["verbum","verb / word"]],"exercises":[{"t":"mcq","q":"In restored Classical Latin, <b>c</b> is normally:","opts":["always hard","soft before e and i","silent","pronounced sh"],"a":0,"ex":"Restored classical pronunciation has no soft <i>c</i>: <b>Cicero</b> is <i>KEE-ke-ro</i>, <b>caelum</b> is <i>KIGH-lum</i>. The soft <i>c</i> you may know from church Latin is a later development."},{"t":"mcq","q":"Which case normally marks the direct object?","opts":["accusative","nominative","genitive","vocative"],"a":0,"ex":"The accusative is the object case. Because Latin marks the object on the noun itself, word order is free: <b>puellam poēta videt</b> and <b>poēta puellam videt</b> both mean the poet sees the girl."},{"t":"fill","q":"Rōma in Italiā ___.","a":["est"],"ex":"<b>est</b> is 3rd singular of <i>sum</i>. Note that <b>Italiā</b> already carries the long <i>-ā</i> of the ablative after <b>in</b> meaning 'in, within'."},{"t":"mcq","q":"A macron marks:","opts":["a long vowel","stress only","a silent vowel","a diphthong"],"a":0,"ex":"A macron marks vowel <i>length</i>, not stress. Length is phonemic: <b>malum</b> (evil) and <b>mālum</b> (apple) are different words, and metre in poetry depends entirely on it."},{"t":"fill","q":"Puella poetam ___.","a":["videt"],"ex":"<b>videt</b> is 3rd singular present. The <b>-t</b> supplies the subject 'she', so no pronoun is needed; <b>poetam</b> is accusative, hence the object."},{"t":"mcq","q":"In <i>Poeta puellam videt</i>, the object is:","opts":["puellam","poeta","videt","none"],"a":0,"ex":"The <b>-am</b> ending identifies <b>puellam</b> as accusative and therefore the object, even though it stands before the verb. Endings, not position, assign roles."},{"t":"parse","form":"puellam","q":"Identify the case and number:","opts":["accusative singular","nominative singular","genitive singular","accusative plural"],"a":0,"ex":"The <b>-am</b> ending is accusative singular in the first declension. That single letter <i>m</i> is doing the work English does with word order."},{"t":"parse","form":"poētae","q":"Which of these can <b>poētae</b> not be?","opts":["accusative singular","nominative plural","genitive singular","dative singular"],"a":0,"ex":"<b>-ae</b> is nominative plural, genitive singular and dative singular all at once. The accusative singular would be <b>poētam</b>. Ambiguous endings are normal; the sentence resolves them."},{"t":"trans","form":"rosa","q":"Put into the accusative singular:","a":["rosam"],"ex":"Nominative <b>-a</b> becomes accusative <b>-am</b>. Changing the ending changes the word's job in the sentence, not its meaning."},{"t":"pick","s":"Poēta puellam videt.","q":"Click the word that is the direct object.","a":"puellam","ex":"<b>puellam</b> is accusative, so it is the object even though it stands before the verb. Latin marks the role on the word; English marks it by position."},{"t":"pick","s":"Rōma in Italiā est.","q":"Click the subject of the sentence.","a":"Rōma","ex":"<b>Rōma</b> is nominative. <b>Italiā</b> has the long ablative <b>-ā</b> after <b>in</b> and cannot be the subject."},{"t":"mcq","q":"Latin word order is:","opts":["flexible, because endings carry the grammar","fixed as subject–verb–object","fixed as subject–object–verb","random"],"a":0,"ex":"Prose tends toward subject–object–verb, but any order is grammatical. Poets exploit this constantly; the endings never stop telling you who does what."},{"t":"mcq","q":"The Latin <i>v</i> in restored pronunciation sounds like:","opts":["English <i>w</i>","English <i>v</i>","English <i>f</i>","it is silent"],"a":0,"ex":"<b>vīdī</b> was <i>WEE-dee</i>. The <i>v</i> sound of modern Italian and church Latin developed later."},{"t":"fill","q":"The poet sees the girl: Poēta puellam ___.","a":["videt"],"ex":"<b>videt</b> is third singular. The <b>-t</b> already contains 'he/she/it', so <b>poēta</b> is added only because we want to name the subject."},{"t":"fill","q":"Give the accusative singular of <i>terra</i>: ___","a":["terram"],"ex":"First-declension accusative singular is always <b>-am</b>, whatever the noun's gender."},{"t":"mcq","q":"Stress in a Latin word of three or more syllables falls on the second-to-last syllable when:","opts":["that syllable is heavy — long vowel, diphthong, or closed by two consonants","its vowel is intrinsically long, and only then","always, regardless of the syllable","the word begins with a consonant"],"a":0,"ex":"Weight, not vowel length alone, decides. <b>Puella</b> has a short <i>e</i>, but the two consonants after it make the penult heavy, so the stress is <b>pu-EL-la</b>. <b>Dominus</b> has a light penult and so is stressed <b>DO-mi-nus</b>."}]},{"id":"f2","title":"First declension","subtitle":"Subjects, objects and possession","grammar":"<p class=\"lead\">The first declension is the smallest set of endings in Latin and the best place to see the case system doing real work.</p><h3>The endings</h3><table class=\"gr\"><tr><th>Case</th><th>Singular</th><th>Plural</th><th>Job</th></tr><tr><td>Nominative</td><td>puell<b>a</b></td><td>puell<b>ae</b></td><td>subject</td></tr><tr><td>Genitive</td><td>puell<b>ae</b></td><td>puell<b>ārum</b></td><td>of …</td></tr><tr><td>Dative</td><td>puell<b>ae</b></td><td>puell<b>īs</b></td><td>to/for …</td></tr><tr><td>Accusative</td><td>puell<b>am</b></td><td>puell<b>ās</b></td><td>object</td></tr><tr><td>Ablative</td><td>puell<b>ā</b></td><td>puell<b>īs</b></td><td>by/with/in …</td></tr><tr><td>Vocative</td><td>puell<b>a</b></td><td>puell<b>ae</b></td><td>address</td></tr></table><h3>Ambiguity is normal</h3><p>Notice that <b>-ae</b> does three jobs and <b>-īs</b> does two. Latin tolerates this cheerfully, because the sentence resolves it. In <b>puellae rosās portant</b>, the verb <b>portant</b> is plural, so <b>puellae</b> must be the nominative plural subject. In <b>fīlia puellae cantat</b>, the verb is singular and <b>fīlia</b> already claims the subject slot, so <b>puellae</b> is genitive: the girl&#39;s daughter.</p><p>Learn to read the verb ending first when a form is ambiguous. That habit will serve you all the way to Tacitus.</p><h3>Why you learn two forms of every noun</h3><p>Dictionaries list <b>puella, puellae, f.</b> — nominative, genitive, gender. The genitive is not decoration. It tells you which declension the noun belongs to and therefore which set of endings to apply, and in the third declension it will also reveal a stem that the nominative hides. Never learn a Latin noun without its genitive; the habit costs nothing now and saves you constantly later.</p><h3>Gender that contradicts the ending</h3><p>Most first-declension nouns are feminine. A handful denoting traditionally male roles are masculine, and their adjectives follow the sense rather than the ending:</p><p><b>agricola</b> farmer · <b>nauta</b> sailor · <b>poēta</b> poet · <b>incola</b> inhabitant · <b>scrība</b> clerk · <b>pīrāta</b> pirate</p><p>So you write <b>poēta bonus</b>, never <i>poēta bona</i>. Grammatical gender, not the shape of the word, controls agreement.</p><div class=\"tip\">Several of these are Greek loanwords. Latin absorbed them into its most convenient declension and then let meaning override form — a reminder that the language grew rather than being designed.</div><h3>The ablative singular</h3><p><b>puellā</b> differs from nominative <b>puella</b> only in vowel length, and most printed Latin does not mark it. In practice you identify the ablative by what it is doing: after a preposition such as <b>in</b>, <b>cum</b>, <b>sine</b>, <b>ex</b>, or standing alone to mean by what means. Unit <b>f5</b> takes this up in full.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Reading every <b>-ae</b> as a plural. It is genitive or dative singular just as often.</li><li>Writing <i>agricola bona</i>. The word is masculine.</li><li>Confusing <b>-ās</b> (accusative plural) with <b>-īs</b> (dative and ablative plural).</li><li>Forgetting that the vocative equals the nominative in this declension — the only oddity is <b>-e</b> in the second.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Fīlia agricolae puellīs rosās dat.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Fīlia</td><td>nominative singular</td><td>subject</td></tr><tr><td lang=\"la\">agricolae</td><td>genitive singular</td><td>whose daughter — attached to <b>Fīlia</b></td></tr><tr><td lang=\"la\">puellīs</td><td>dative plural</td><td>to whom the roses are given</td></tr><tr><td lang=\"la\">rosās</td><td>accusative plural</td><td>what is given</td></tr><tr><td lang=\"la\">dat</td><td>3rd singular</td><td>verb; singular, so the subject is <b>Fīlia</b> and not <b>agricolae</b></td></tr></table><p><b>Sense:</b> the farmer&#39;s daughter gives roses to the girls. Two words end in <b>-ae</b> and <b>-īs</b> shapes that could be several cases; the verb&#39;s number and the presence of a clear accusative settle every one of them.</p></div>","examples":[["Puella aquam portat.","The girl carries water."],["Puellae aquam portant.","The girls carry water."],["Fīlia agricolae cantat.","The farmer’s daughter sings."],["Nauta puellae rosam dat.","The sailor gives the girl a rose."]],"vocab":[["puella, -ae f.","girl"],["aqua, -ae f.","water"],["rosa, -ae f.","rose"],["fīlia, -ae f.","daughter"],["terra, -ae f.","land / earth"],["via, -ae f.","road / way"],["porta, -ae f.","gate"],["agricola, -ae m.","farmer"],["nauta, -ae m.","sailor"],["portat","carries"],["cantat","sings"],["dat","gives"]],"exercises":[{"t":"fill","q":"The girl (subject): puell___","a":["a"],"ex":"The nominative singular of the first declension is <b>-a</b>. It marks the subject, and its short final <i>-a</i> distinguishes it from the ablative <b>-ā</b>."},{"t":"fill","q":"The girls (subject): puell___","a":["ae"],"ex":"Nominative plural is <b>-ae</b>. This ending is ambiguous on its own — it is also genitive and dative singular — so context and the verb ending resolve it."},{"t":"fill","q":"The rose (object): ros___","a":["am"],"ex":"Accusative singular is <b>-am</b>. Compare <b>rosa</b> (subject) with <b>rosam</b> (object); the single consonant is the whole difference in meaning."},{"t":"mcq","q":"<i>agricola</i> is:","opts":["masculine despite first declension","always feminine","neuter","indeclinable"],"a":0,"ex":"A handful of first-declension nouns denoting male roles — <b>agricola</b>, <b>nauta</b>, <b>poēta</b>, <b>incola</b> — are masculine. Their adjectives follow the sense: <b>agricola bonus</b>, never <i>bona</i>."},{"t":"fill","q":"The farmer’s daughter: fīlia agricol___","a":["ae"],"ex":"The genitive singular <b>-ae</b> expresses possession: <b>fīlia agricolae</b>, the daughter <i>of the farmer</i>. It is identical in form to the nominative plural, which is why you learn nouns with the genitive attached."},{"t":"fill","q":"The girls carry water: Puellae aquam ___.","a":["portant"],"ex":"<b>portant</b> is 3rd plural, agreeing with the plural subject <b>puellae</b>. The <b>-nt</b> is what tells you <b>puellae</b> here is nominative plural rather than genitive singular."},{"t":"parse","form":"puellārum","q":"Identify case and number:","opts":["genitive plural","accusative plural","dative plural","ablative singular"],"a":0,"ex":"<b>-ārum</b> is the first-declension genitive plural: 'of the girls'. Every declension marks the genitive plural with <b>-rum</b> or <b>-um</b>."},{"t":"parse","form":"aquā","q":"The long <b>-ā</b> marks this as:","opts":["ablative singular","nominative singular","accusative singular","genitive plural"],"a":0,"ex":"Nominative <b>aqua</b> and ablative <b>aquā</b> differ only in vowel length. In an unmacronised text you must work it out from the sentence — usually from a preposition."},{"t":"trans","form":"puella","q":"Put into the nominative plural:","a":["puellae"],"ex":"<b>-a</b> becomes <b>-ae</b>. The same form is also genitive and dative singular, so the verb ending is what usually tells you which one you are looking at."},{"t":"trans","form":"rosās","q":"Put into the singular, keeping the case:","a":["rosam"],"ex":"<b>-ās</b> is accusative plural, so the singular is accusative <b>-am</b>. Change number without changing case."},{"t":"pick","s":"Nauta puellae rosam dat.","q":"Click the indirect object.","a":"puellae","ex":"<b>puellae</b> is dative here — the person to whom the rose is given. Its form is identical to the genitive and to the nominative plural, and only the sense of <b>dat</b> decides."},{"t":"pick","s":"Fīlia agricolae in viā ambulat.","q":"Click the word in the ablative.","a":"viā","ex":"<b>in</b> with the ablative means 'in, on'. <b>agricolae</b> is genitive — the farmer's daughter."},{"t":"mcq","q":"Why is <b>nauta</b> masculine?","opts":["it names a male role, and gender follows sense","all -a nouns are masculine","its genitive is irregular","it is a Greek loanword and so has no gender"],"a":0,"ex":"A small group — <b>nauta, agricola, poēta, incola, scrība</b> — declines like <b>puella</b> but takes masculine adjectives, because the people they name were men."},{"t":"fill","q":"of the water (genitive singular): aqu___","a":["ae"],"ex":"Genitive singular <b>-ae</b>. Learning the genitive with every noun is what lets you find the stem and the declension."},{"t":"fill","q":"to the girls (dative plural): puell___","a":["is","īs"],"ex":"Dative and ablative plural are both <b>-īs</b> in the first declension. Latin never distinguishes them in the plural, in any declension."},{"t":"mcq","q":"In <i>Puellae rosās portant</i>, <b>Puellae</b> must be:","opts":["nominative plural","genitive singular","dative singular","ablative plural"],"a":0,"ex":"<b>portant</b> is third person plural, so it needs a plural subject. The verb ending disambiguates the noun — this is the normal way Latin resolves its own ambiguities."}]},{"id":"f3","title":"Second declension & adjectives","subtitle":"Gender and agreement","grammar":"<p class=\"lead\">The second declension doubles your vocabulary and introduces the principle that governs half of Latin syntax: agreement.</p><h3>Two patterns and a gender</h3><table class=\"gr\"><tr><th>Case</th><th>servus (m.)</th><th>bellum (n.)</th><th>Plural m.</th><th>Plural n.</th></tr><tr><td>Nom.</td><td>servus</td><td>bellum</td><td>servī</td><td>bella</td></tr><tr><td>Gen.</td><td>servī</td><td>bellī</td><td>servōrum</td><td>bellōrum</td></tr><tr><td>Dat.</td><td>servō</td><td>bellō</td><td>servīs</td><td>bellīs</td></tr><tr><td>Acc.</td><td>servum</td><td>bellum</td><td>servōs</td><td>bella</td></tr><tr><td>Abl.</td><td>servō</td><td>bellō</td><td>servīs</td><td>bellīs</td></tr><tr><td>Voc.</td><td>serve</td><td>bellum</td><td>servī</td><td>bella</td></tr></table><p>Two rules about neuters hold in every declension in the language, so learn them once: <b>the nominative and accusative are always identical</b>, and <b>the nominative and accusative plural always end in -a</b>. If you see a neuter plural you already know it is either the subject or the object, and the verb will tell you which.</p><h3>Nouns that lose a vowel</h3><p><b>Vir</b>, <b>puer</b> and <b>liber</b> have no <b>-us</b> in the nominative but are second declension all the same — their genitives <b>virī, puerī, librī</b> prove it. Note that <b>liber</b> drops its <i>e</i> outside the nominative (stem <b>libr-</b>) while <b>puer</b> keeps it. The genitive, as always, is the reliable witness.</p><h3>Agreement</h3><p>An adjective must match its noun in <b>case, number and gender</b>. It need not match in <i>ending</i>, and this is where beginners come unstuck. <b>Poēta bonus</b> has different endings on the two words and is perfectly correct, because <b>poēta</b> is masculine and <b>bonus</b> is the masculine form. <b>Poēta bona</b> has matching endings and is wrong.</p><table class=\"gr\"><tr><th>Phrase</th><th>Verdict</th><th>Why</th></tr><tr><td lang=\"la\">puella bona</td><td>correct</td><td>fem. nom. sg. throughout</td></tr><tr><td lang=\"la\">poēta bonus</td><td>correct</td><td>masc. noun, masc. adjective</td></tr><tr><td lang=\"la\">bellum magnum</td><td>correct</td><td>neut. nom./acc. sg.</td></tr><tr><td lang=\"la\">bellum magnus</td><td>wrong</td><td>gender mismatch</td></tr><tr><td lang=\"la\">nauta bonus</td><td>correct</td><td>masc. despite the <b>-a</b></td></tr></table><h3>Adjectives are free to roam</h3><p>Because agreement identifies which noun an adjective belongs to, the two need not stand together. <b>Magnās Caesar cōpiās mīsit</b> is ordinary Latin: <b>magnās</b> and <b>cōpiās</b> match in case, number and gender, so they belong together regardless of the four words between them. Poets push this much further — see the reading <i>A wakeful night</i>. Train the habit now: when you meet an adjective with no noun beside it, hold its ending in mind and read on.</p><h3>Adjectives used as nouns</h3><p>Latin freely drops the noun when it is obvious. <b>Bonī</b> means good men, <b>multa</b> means many things, <b>nostrī</b> means our men. Supply the missing word from the gender: masculine plural gives people, neuter plural gives things.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Matching endings instead of matching gender.</li><li>Reading <b>bella</b> as the feminine adjective &#39;beautiful&#39; when it is the neuter plural of <b>bellum</b>, war.</li><li>Assuming an adjective modifies the nearest noun. Check the ending, not the distance.</li><li>Forgetting the vocative <b>serve</b>. Second-declension nouns in <b>-us</b> have the distinctive vocative singular <b>-e</b>; nouns and names in <b>-ius</b> contract further to a single <b>-ī</b> (<b>fīlī</b>, <b>Vergilī</b>), and <b>meus</b> has the irregular vocative <b>mī</b>. Elsewhere the vocative simply equals the nominative.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Magna Rōmānī bella cum multīs populīs gerunt.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Magna</td><td>neut. nom./acc. pl.</td><td>adjective — its noun has not arrived yet</td></tr><tr><td lang=\"la\">Rōmānī</td><td>masc. nom. pl.</td><td>subject; cannot go with <b>Magna</b>, wrong gender</td></tr><tr><td lang=\"la\">bella</td><td>neut. acc. pl.</td><td>object — and the noun <b>Magna</b> was waiting for</td></tr><tr><td lang=\"la\">cum multīs populīs</td><td>abl. pl.</td><td>accompaniment: with many peoples</td></tr><tr><td lang=\"la\">gerunt</td><td>3rd pl.</td><td>verb, agreeing with <b>Rōmānī</b></td></tr></table><p><b>Sense:</b> the Romans wage great wars with many peoples. <b>Magna</b> and <b>bella</b> are separated by the subject, and only the gender tells you they belong together.</p></div>","examples":[["Servus bonus labōrat.","The good slave works."],["Dominus servum bonum laudat.","The master praises the good slave."],["Bellum magnum timēmus.","We fear a great war."],["Poēta bonus carmen scrībit.","The good poet writes a poem."]],"vocab":[["servus, -ī m.","slave / servant"],["dominus, -ī m.","master"],["amīcus, -ī m.","friend"],["puer, puerī m.","boy"],["ager, agrī m.","field"],["bellum, -ī n.","war"],["dōnum, -ī n.","gift"],["templum, -ī n.","temple"],["bonus, -a, -um","good"],["magnus, -a, -um","great / large"],["parvus, -a, -um","small"],["laudat","praises"]],"exercises":[{"t":"fill","q":"a great war: bellum magn___","a":["um"],"ex":"<b>bellum</b> is second-declension neuter, so the adjective takes the neuter singular <b>-um</b>. Adjectives agree in case, number and gender — never simply in ending."},{"t":"fill","q":"good poets: poētae bon___","a":["ī"],"ex":"<b>poētae</b> is masculine despite its first-declension ending, so the adjective is masculine plural <b>bonī</b>, not <i>bonae</i>. This is the agreement trap of the previous unit in reverse."},{"t":"mcq","q":"Neuter plural nominative normally ends in:","opts":["-a","-ī","-ōs","-ae"],"a":0,"ex":"Neuter nominative and accusative plural always end in <b>-a</b>, in every declension. It is also the rule that neuter nominative and accusative are identical to each other."},{"t":"fill","q":"the master (object): domin___","a":["um"],"ex":"Second-declension masculine accusative singular is <b>-um</b>: <b>dominus</b> → <b>dominum</b>. Note it looks identical to the neuter nominative, which is why gender must be learned with the noun."},{"t":"mcq","q":"Correct agreement with <i>poēta</i>:","opts":["poēta bonus","poēta bona","poētam bonum as subject","poēta bonum"],"a":0,"ex":"<b>poēta</b> is masculine, so it takes <b>bonus</b>. Agreement follows grammatical gender, and here that gender contradicts the ending."},{"t":"fill","q":"We fear great wars: Bella magna ___.","a":["timēmus"],"ex":"<b>timēmus</b> is 1st plural of the second conjugation (<i>timeō, timēre</i>), whose stem vowel <b>-ē-</b> is preserved before the ending."},{"t":"parse","form":"bella","q":"Identify the possibilities for <b>bella</b> (from <i>bellum</i>):","opts":["nominative or accusative plural","genitive singular only","ablative singular only","dative plural"],"a":0,"ex":"Neuter nominative and accusative are always identical, and in the plural they always end in <b>-a</b>. That rule holds in every declension."},{"t":"parse","form":"dominōrum","q":"Identify case and number:","opts":["genitive plural","dative plural","accusative plural","ablative plural"],"a":0,"ex":"Second-declension genitive plural is <b>-ōrum</b>, parallel to first-declension <b>-ārum</b>."},{"t":"trans","form":"puer bonus","q":"Put the whole phrase into the accusative singular:","a":["puerum bonum"],"ex":"Both words move together. An adjective agrees in case, number and gender, so it changes whenever its noun does."},{"t":"trans","form":"bellum magnum","q":"Put the whole phrase into the nominative plural:","a":["bella magna"],"ex":"Neuter plural <b>-a</b> on both words. Beware: <b>bella</b> here is not the feminine adjective 'beautiful'."},{"t":"pick","s":"Poēta bonus fābulās longās nārrat.","q":"Click the adjective that agrees with a masculine noun.","a":"bonus","ex":"<b>bonus</b> is masculine because <b>poēta</b> is masculine despite its first-declension ending. <b>longās</b> agrees with the feminine <b>fābulās</b>."},{"t":"pick","s":"Dominus servō librum dat.","q":"Click the word in the dative.","a":"servō","ex":"Second-declension dative singular is <b>-ō</b>, identical to the ablative. The verb <b>dat</b> tells you which one is meant."},{"t":"mcq","q":"<b>Vir</b> and <b>puer</b> belong to:","opts":["the second declension, with no -us in the nominative","the third declension","the first declension","no declension; they are irregular"],"a":0,"ex":"Their genitives <b>virī</b> and <b>puerī</b> place them firmly in the second declension. <b>Ager</b> behaves the same way but drops the <i>e</i>: <b>agrī</b>."},{"t":"mcq","q":"Which phrase is <i>not</i> correctly agreed?","opts":["bellum magnus","liber bonus","puella bona","bella magna"],"a":0,"ex":"<b>bellum</b> is neuter and needs <b>magnum</b>. Agreement errors like this are the fastest way to spot a mis-parsed sentence."},{"t":"fill","q":"of the good master (genitive singular): domin___ bon___","a":["ī ī","i i","ī, ī"],"ex":"<b>dominī bonī</b>. Both words take the second-declension genitive singular <b>-ī</b>."},{"t":"fill","q":"the small books (accusative plural): libr___ parv___","a":["ōs ōs","os os"],"ex":"<b>librōs parvōs</b>. <b>Liber</b> drops its <i>e</i> outside the nominative singular: stem <b>libr-</b>."}]},{"id":"f4","title":"Present active verbs","subtitle":"Person, number and flexible word order","grammar":"<p class=\"lead\">A Latin verb carries its own subject. That is why a complete sentence can be one word long, and why the personal endings are the highest-value six items in the language.</p><h3>The personal endings</h3><table class=\"gr\"><tr><th>Person</th><th>Active</th><th>Meaning</th></tr><tr><td>1 sg.</td><td>-ō / -m</td><td>I</td></tr><tr><td>2 sg.</td><td>-s</td><td>you</td></tr><tr><td>3 sg.</td><td>-t</td><td>he, she, it</td></tr><tr><td>1 pl.</td><td>-mus</td><td>we</td></tr><tr><td>2 pl.</td><td>-tis</td><td>you (pl.)</td></tr><tr><td>3 pl.</td><td>-nt</td><td>they</td></tr></table><p>Learn these once and you have learned them for every tense, every mood and — with a small substitution — the passive voice as well. Almost everything else in the verb system is a marker inserted <i>before</i> these endings.</p><h3>The four conjugations</h3><p>Verbs sort into four families, identified by the present infinitive:</p><table class=\"gr\"><tr><th></th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th></tr><tr><td>Infinitive</td><td>am<b>ā</b>re</td><td>mon<b>ē</b>re</td><td>reg<b>e</b>re</td><td>aud<b>ī</b>re</td></tr><tr><td>1 sg.</td><td>amō</td><td>moneō</td><td>regō</td><td>audiō</td></tr><tr><td>2 sg.</td><td>amās</td><td>monēs</td><td>regis</td><td>audīs</td></tr><tr><td>3 sg.</td><td>amat</td><td>monet</td><td>regit</td><td>audit</td></tr><tr><td>1 pl.</td><td>amāmus</td><td>monēmus</td><td>regimus</td><td>audīmus</td></tr><tr><td>2 pl.</td><td>amātis</td><td>monētis</td><td>regitis</td><td>audītis</td></tr><tr><td>3 pl.</td><td>amant</td><td>monent</td><td>regunt</td><td>audiunt</td></tr></table><p>The second and third are distinguished only by vowel length in the infinitive — <b>monēre</b> against <b>regere</b> — which is one more reason quantities matter. The practical difference shows up everywhere: the second keeps its <b>ē</b>, while the third weakens its vowel to <b>i</b> before most endings and to <b>u</b> before <b>-nt</b>.</p><h3>No pronoun required</h3><p><b>Amō</b> is a complete sentence: I love. <b>Ego amō</b> is also correct but says something extra — <i>I</i> love, as against somebody else. Latin adds a subject pronoun only for emphasis or contrast, so when you meet <b>ego</b>, <b>tū</b> or <b>nōs</b>, ask what is being contrasted. It is almost never idle.</p><h3>Word order</h3><p>Latin prose leans towards subject–object–verb, so the verb often arrives last and you should expect to wait for it. But this is a tendency, not a rule. Emphasis pulls words to the beginning or the end of a clause, both of which are strong positions. A verb placed first is usually being stressed: <b>vēnit Caesar</b> puts the weight on the arrival.</p><div class=\"tip\">A reliable reading habit: scan to the end of the sentence and find the finite verb before you translate anything. It tells you the person and number of the subject, which immediately narrows down which noun can be the nominative.</div><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Writing <i>regēs</i> for &#39;you rule&#39;. The present is <b>regis</b>; <b>regēs</b> is the future.</li><li>Adding <b>-unt</b> to a fourth-conjugation verb without the linking <i>i</i>: it is <b>audiunt</b>, not <i>audunt</i>.</li><li>Supplying an English subject pronoun and then also translating an emphatic Latin one, so that &#39;I love&#39; becomes &#39;I I love&#39;.</li><li>Assuming the sentence has ended because you have met a noun and a verb. Latin often has more to add.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Librōs magistrī in vīllā legimus.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Librōs</td><td>masc. acc. pl.</td><td>object</td></tr><tr><td lang=\"la\">magistrī</td><td>gen. sg.</td><td>whose books — could also be nom. pl., but see the verb</td></tr><tr><td lang=\"la\">in vīllā</td><td>abl. sg.</td><td>place where</td></tr><tr><td lang=\"la\">legimus</td><td>1st pl.</td><td>verb; <b>-mus</b> means the subject is &#39;we&#39;, so no noun is the subject at all</td></tr></table><p><b>Sense:</b> we are reading the teacher&#39;s books in the country house. The verb ending is decisive: because the subject is &#39;we&#39;, <b>magistrī</b> cannot be a nominative plural and must be genitive singular.</p></div>","examples":[["Latīnam linguam discō.","I learn the Latin language."],["Librum legis.","You read a book."],["Puerī magistrum audiunt.","The boys listen to the teacher."],["Rōmānī urbem regunt.","The Romans rule the city."]],"vocab":[["amō, amāre","love"],["moneō, monēre","warn / advise"],["regō, regere","rule / guide"],["audiō, audīre","hear"],["legō, legere","read / choose"],["scrībō, scrībere","write"],["discō, discere","learn"],["videō, vidēre","see"],["veniō, venīre","come"],["lingua, -ae f.","language"],["liber, librī m.","book"],["magister, -trī m.","teacher"]],"exercises":[{"t":"fill","q":"I love: am___","a":["ō"],"ex":"First singular present active is <b>-ō</b>. In the first conjugation the stem vowel contracts into it: <i>amā- + ō</i> gives <b>amō</b>, not <i>amaō</i>."},{"t":"fill","q":"they hear: audi___","a":["unt"],"ex":"Fourth conjugation adds <b>-unt</b> with a linking <i>-u-</i>: <b>audiunt</b>. Compare third conjugation <b>regunt</b>, where no <i>-i-</i> appears."},{"t":"mcq","q":"The ending <b>-mus</b> means:","opts":["we","I","they","you singular"],"a":0,"ex":"<b>-mus</b> is the first person plural ending in every tense and both voices you will meet. Learning the six personal endings once saves memorising each tense separately."},{"t":"fill","q":"You read a book: Librum ___.","a":["legis"],"ex":"<b>legis</b> is 2nd singular of third-conjugation <i>legō, legere</i>. The stem vowel weakens to <i>-i-</i> before <b>-s</b>."},{"t":"mcq","q":"Latin normally needs a separate subject pronoun:","opts":["no, the verb ending often supplies it","always","only in poetry","only with nouns"],"a":0,"ex":"Latin is a pro-drop language: the personal ending is the subject. An explicit <b>tū</b> or <b>ego</b> is added only for emphasis or contrast."},{"t":"fill","q":"The Romans rule the city: Rōmānī urbem ___.","a":["regunt"],"ex":"<b>regunt</b>, third conjugation, 3rd plural. The subject <b>Rōmānī</b> is nominative plural and <b>urbem</b> accusative singular, so the roles are fixed regardless of order."},{"t":"parse","form":"audītis","q":"Identify person, number and tense:","opts":["2nd plural present","3rd plural present","2nd singular present","1st plural present"],"a":0,"ex":"<b>-tis</b> is always second person plural. Learn the six endings once and they serve you in every tense of the language."},{"t":"parse","form":"legimus","q":"Identify person, number and tense:","opts":["1st plural present","1st plural perfect","2nd plural present","3rd plural present"],"a":0,"ex":"<b>legimus</b> is present; the perfect of <b>legō</b> is <b>lēgimus</b>, with a long <i>ē</i>. In an unmacronised text only context separates them — a genuine ambiguity Roman readers lived with."},{"t":"trans","form":"amat","q":"Put into the first person singular:","a":["amo","amō"],"ex":"<b>amō</b>. The stem vowel <b>-ā-</b> is absorbed into the <b>-ō</b>, which is why the first person looks shorter than the rest."},{"t":"trans","form":"venīmus","q":"Put into the third person plural:","a":["veniunt"],"ex":"Fourth conjugation inserts <b>-u-</b> before <b>-nt</b>: <b>veniunt</b>. Third conjugation does not: <b>regunt</b>."},{"t":"pick","s":"Magister discipulōs docet et puerī librōs legunt.","q":"Click the verb with a plural subject.","a":"legunt","ex":"<b>legunt</b> is third plural, matching <b>puerī</b>. <b>docet</b> is singular, matching <b>magister</b>. Two clauses, joined by <b>et</b>, each with its own verb."},{"t":"pick","s":"Linguam Latīnam discimus.","q":"Click the word that supplies the subject 'we'.","a":"discimus","ex":"There is no separate pronoun: the ending <b>-mus</b> is the subject. This is why Latin sentences can be so short."},{"t":"mcq","q":"How do you tell which conjugation a verb belongs to?","opts":["from the present infinitive: -āre, -ēre, -ere, -īre","from the nominative","from its meaning","from the number of syllables"],"a":0,"ex":"<b>amāre, monēre, regere, audīre</b>. The difference between second <b>-ēre</b> and third <b>-ere</b> is vowel length alone, which is why dictionaries mark it."},{"t":"mcq","q":"Which form is <i>not</i> present tense?","opts":["scrīpsī","scrībis","scrībunt","scrībimus"],"a":0,"ex":"<b>scrīpsī</b> is perfect, 'I wrote'. The <b>-s-</b> of the perfect stem and the <b>-ī</b> ending mark it out."},{"t":"fill","q":"we write: scrīb___","a":["imus"],"ex":"<b>scrībimus</b>. In the third conjugation the stem vowel weakens to <i>-i-</i> before most endings, and to <i>-u-</i> before <b>-nt</b>."},{"t":"fill","q":"you (plural) hear: aud___","a":["ītis","itis"],"ex":"<b>audītis</b>. The fourth conjugation keeps its long <b>-ī-</b> almost everywhere, which is what distinguishes it from the third."}]},{"id":"f5","title":"Ablative & prepositions","subtitle":"Location, means and accompaniment","grammar":"<p class=\"lead\">The ablative is the widest-ranging case in Latin. It absorbed three older cases, which is why one ending covers so many unrelated ideas — and why identifying <i>which</i> ablative you are looking at is a real skill.</p><h3>What the ablative does</h3><table class=\"gr\"><tr><th>Use</th><th>Preposition?</th><th>Example</th><th>English</th></tr><tr><td>Means / instrument</td><td>none</td><td lang=\"la\">gladiō pugnat</td><td>he fights with a sword</td></tr><tr><td>Accompaniment</td><td><b>cum</b></td><td lang=\"la\">cum amīcō venit</td><td>he comes with a friend</td></tr><tr><td>Place where</td><td><b>in</b></td><td lang=\"la\">in vīllā manet</td><td>he stays in the house</td></tr><tr><td>Separation / origin</td><td><b>ab, ex, dē</b></td><td lang=\"la\">ab urbe discēdit</td><td>he leaves the city</td></tr><tr><td>Manner</td><td><b>cum</b> (often)</td><td lang=\"la\">cum cūrā scrībit</td><td>he writes with care</td></tr><tr><td>Time when</td><td>none</td><td lang=\"la\">prīmā lūce</td><td>at first light</td></tr></table><p>The distinction to fix first is <b>means against accompaniment</b>. A tool takes the bare ablative; a companion takes <b>cum</b>. <b>Gladiō pugnat</b> is he fights with a sword. <b>Cum gladiō pugnat</b> would mean the sword came along with him and joined in.</p><h3>Prepositions sort themselves by case</h3><p>Almost every Latin preposition takes either the accusative or the ablative, and the choice is not arbitrary — the accusative is the case of motion towards, the ablative of rest and of motion away.</p><table class=\"gr\"><tr><th>With the accusative</th><th>With the ablative</th></tr><tr><td><b>ad</b> to, towards<br><b>per</b> through<br><b>trāns</b> across<br><b>ante / post</b> before / after<br><b>inter</b> among<br><b>apud</b> at the house of, in the works of<br><b>contrā</b> against</td><td><b>ā / ab</b> from, by<br><b>ē / ex</b> out of<br><b>dē</b> down from, about<br><b>cum</b> with<br><b>sine</b> without<br><b>prō</b> in front of, on behalf of<br><b>prae</b> in front of, because of</td></tr></table><h3>Two prepositions that take both</h3><p><b>In</b> and <b>sub</b> take the accusative for motion and the ablative for rest. This is one of the most productive distinctions in the language:</p><ul><li><b>in urbem</b> — into the city (accusative, motion)</li><li><b>in urbe</b> — in the city (ablative, rest)</li><li><b>sub montem</b> — up to the foot of the mountain</li><li><b>sub monte</b> — at the foot of the mountain</li></ul><h3>Towns go without prepositions</h3><p>Names of towns and small islands, plus <b>domus</b> and <b>rūs</b>, drop the preposition entirely: <b>Rōmam</b> to Rome, <b>Rōmā</b> from Rome, <b>Rōmae</b> at Rome. That last form is a survival of an older case, the locative, which otherwise vanished from the language.</p><div class=\"tip\"><b>ā</b> and <b>ē</b> stand before consonants, <b>ab</b> and <b>ex</b> before vowels — the same convenience that gives English &#39;a&#39; and &#39;an&#39;. <b>Ex</b> is also used freely before consonants.</div><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Putting <b>cum</b> in front of an instrument. Never say <i>cum gladiō</i> for &#39;with a sword&#39; as a weapon.</li><li>Using the ablative after <b>in</b> when there is motion: <b>in urbem venit</b>, not <i>in urbe venit</i>.</li><li>Adding a preposition to a town name: <b>Rōmam eō</b>, not <i>ad Rōmam eō</i>.</li><li>Missing an unaccompanied ablative because there is no preposition to flag it. A bare ablative is doing a job; ask which one.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Cum amīcīs ex oppidō ad fluvium equīs contendimus.</p><table class=\"gr\"><tr><th>Phrase</th><th>Case</th><th>Job</th></tr><tr><td lang=\"la\">Cum amīcīs</td><td>ablative</td><td>accompaniment — people we are with</td></tr><tr><td lang=\"la\">ex oppidō</td><td>ablative</td><td>separation — where we come from</td></tr><tr><td lang=\"la\">ad fluvium</td><td>accusative</td><td>motion towards — where we are going</td></tr><tr><td lang=\"la\">equīs</td><td>ablative</td><td>means — how we travel, on horseback</td></tr><tr><td lang=\"la\">contendimus</td><td>—</td><td>1st plural verb: we hurry</td></tr></table><p><b>Sense:</b> with our friends we hurry on horseback from the town to the river. Three ablatives in one sentence, doing three different jobs, and only the prepositions — and the absence of one before <b>equīs</b> — tell them apart.</p></div>","examples":[["Cum amīcō ambulō.","I walk with a friend."],["Gladiō pugnant.","They fight with a sword."],["In urbe habitat.","He lives in the city."],["In urbem venit.","He comes into the city."],["Sine aquā vīvere nōn possumus.","We cannot live without water."]],"vocab":[["cum + abl.","with"],["sine + abl.","without"],["ā/ab + abl.","from / by"],["ē/ex + abl.","out of"],["dē + abl.","down from / about"],["in + abl.","in / on"],["in + acc.","into / onto"],["ad + acc.","to / toward"],["per + acc.","through"],["gladius, -ī m.","sword"],["urbs, urbis f.","city"],["ambulō","walk"]],"exercises":[{"t":"mcq","q":"“Into the city” is:","opts":["in urbem","in urbe","ab urbe","cum urbe"],"a":0,"ex":"<b>in</b> takes the accusative for motion into and the ablative for rest inside. <b>in urbem</b> = into the city; <b>in urbe</b> = in the city."},{"t":"fill","q":"with a friend: cum amīc___","a":["ō"],"ex":"<b>cum</b> always governs the ablative, so second-declension <b>amīcus</b> becomes <b>amīcō</b>. Use <b>cum</b> for accompaniment, never for a tool."},{"t":"mcq","q":"Ablative of means usually uses:","opts":["no preposition","cum always","ad","per"],"a":0,"ex":"Ablative of means takes no preposition at all: <b>gladiō</b> = with a sword. Adding <b>cum</b> would mean the sword accompanied you as a companion."},{"t":"fill","q":"without water: sine aqu___","a":["ā"],"ex":"<b>sine</b> governs the ablative: <b>aqua</b> → <b>aquā</b>. The macron is the only written difference from the nominative, which is why quantities matter."},{"t":"fill","q":"They fight with a sword: Gladiō ___.","a":["pugnant"],"ex":"<b>pugnant</b> is 3rd plural, and the bare ablative <b>gladiō</b> is the instrument. This is the pattern to recognise: an unaccompanied ablative usually answers 'by what means?'"},{"t":"mcq","q":"<i>ad</i> normally governs:","opts":["accusative","ablative","genitive","dative"],"a":0,"ex":"<b>ad</b> governs the accusative and expresses motion toward. Contrast <b>ab</b> and <b>ex</b>, which govern the ablative and express motion away."},{"t":"parse","form":"gladiō","q":"In <i>Mīles gladiō pugnat</i>, <b>gladiō</b> is:","opts":["ablative of means","dative of reference","ablative of accompaniment","genitive of description"],"a":0,"ex":"A bare ablative with no preposition, denoting a thing, is almost always the means. Adding <b>cum</b> would make the sword a companion rather than a tool."},{"t":"parse","form":"cum amīcīs","q":"This phrase expresses:","opts":["accompaniment","means","place where","time when"],"a":0,"ex":"<b>cum</b> plus the ablative is for people you are with. For instruments Latin uses the ablative alone."},{"t":"trans","form":"in urbe","q":"Change it to mean 'into the city':","a":["in urbem"],"ex":"Same preposition, different case, opposite idea: <b>in</b> plus ablative is rest inside, <b>in</b> plus accusative is motion into. <b>Sub</b> works the same way."},{"t":"trans","form":"ex agrō","q":"Change it to mean 'to the field':","a":["ad agrum"],"ex":"<b>ex</b> plus ablative is motion out of; <b>ad</b> plus accusative is motion toward. Prepositions of motion away take the ablative, those of motion toward the accusative."},{"t":"pick","s":"Puella cum amīcā per viam ad templum ambulat.","q":"Click the word governed by <b>per</b>.","a":"viam","ex":"<b>per</b> takes the accusative: through the street. Three prepositional phrases stack here, and each one's case tells you which preposition owns it."},{"t":"pick","s":"Agricola aquam ex fluviō portat.","q":"Click the word in the ablative.","a":"fluviō","ex":"<b>ex</b> governs the ablative. <b>aquam</b> is the accusative object of <b>portat</b>."},{"t":"mcq","q":"Which preposition takes the ablative?","opts":["sine","ad","per","trāns"],"a":0,"ex":"<b>sine, ā/ab, ex/ē, dē, cum, prō, prae</b> take the ablative. <b>ad, per, trāns, ante, post, inter, apud</b> take the accusative."},{"t":"mcq","q":"<i>Rōmā</i> without a preposition most likely means:","opts":["from Rome","to Rome","in Rome","of Rome"],"a":0,"ex":"Names of towns drop the preposition: <b>Rōmā</b> from Rome, <b>Rōmam</b> to Rome, <b>Rōmae</b> at Rome. That last is a surviving locative case."},{"t":"fill","q":"out of the water: ___ aquā","a":["ex","e","ē"],"ex":"<b>ex aquā</b>. Before a consonant Latin often shortens <b>ex</b> to <b>ē</b>, exactly as <b>ab</b> shortens to <b>ā</b>."},{"t":"fill","q":"They walk through the gate: Per port___ ambulant.","a":["am"],"ex":"<b>per portam</b> — accusative after <b>per</b>."}]},{"id":"f6","title":"sum, questions & possession","subtitle":"Being, having and asking","grammar":"<p class=\"lead\">Three things every language needs constantly: a way to say that something is, a way to say that someone has, and a way to ask. Latin does all three in ways that surprise an English speaker.</p><h3>sum, the most irregular verb in Latin</h3><table class=\"gr\"><tr><th>Person</th><th>Present</th><th>Imperfect</th><th>Future</th></tr><tr><td>1 sg.</td><td>sum</td><td>eram</td><td>erō</td></tr><tr><td>2 sg.</td><td>es</td><td>erās</td><td>eris</td></tr><tr><td>3 sg.</td><td>est</td><td>erat</td><td>erit</td></tr><tr><td>1 pl.</td><td>sumus</td><td>erāmus</td><td>erimus</td></tr><tr><td>2 pl.</td><td>estis</td><td>erātis</td><td>eritis</td></tr><tr><td>3 pl.</td><td>sunt</td><td>erant</td><td>erunt</td></tr></table><p>Learn it aloud as a chant. Note how close <b>erat</b> (was) and <b>erit</b> (will be) are — one vowel apart, and a frequent source of misreading. <b>Possum</b>, I am able, is simply <b>pot-</b> attached to <b>sum</b>, with the <i>t</i> assimilating before <i>s</i>: <b>possum, potes, potest, possumus, potestis, possunt</b>.</p><h3>What follows sum stays nominative</h3><p><b>Sum</b> does not take an object. It links two things, and whatever follows is in the same case as the subject: <b>Caesar dux est</b>, Caesar is a leader; <b>puella bona est</b>, the girl is good. Both <b>dux</b> and <b>bona</b> are nominative. This is a genuinely different construction from a transitive verb, and getting it wrong produces Latin that no Roman would recognise.</p><p><b>Sum</b> also means &#39;there is / there are&#39;, usually standing first: <b>sunt in hortō multae rosae</b>, there are many roses in the garden.</p><h3>Having, without a verb for &#39;have&#39;</h3><p>Latin does own the verb <b>habeō</b>, but for simple possession it prefers a different idiom: put the possessor in the <b>dative</b> and make the thing possessed the subject.</p><table class=\"gr\"><tr><th>Latin</th><th>Literally</th><th>Idiomatically</th></tr><tr><td lang=\"la\">Mihi liber est.</td><td>there is a book to me</td><td>I have a book</td></tr><tr><td lang=\"la\">Agricolae multī equī sunt.</td><td>there are many horses to the farmer</td><td>the farmer has many horses</td></tr><tr><td lang=\"la\">Nōmen mihi est Mārcus.</td><td>the name to me is Marcus</td><td>my name is Marcus</td></tr></table><p>The effect is subtly different from <b>habeō</b>: the dative construction presents the thing as existing and the person as the one it belongs to, rather than as something actively held.</p><h3>Asking questions</h3><p>Latin has no equivalent of English &#39;do you …?&#39;. A question is marked by a word, and the choice of word tells you what answer the speaker expects.</p><table class=\"gr\"><tr><th>Marker</th><th>Expects</th><th>Example</th></tr><tr><td><b>-ne</b> attached to the first word</td><td>nothing in particular</td><td lang=\"la\">Estne in vīllā?</td></tr><tr><td><b>nōnne</b></td><td>the answer yes</td><td lang=\"la\">Nōnne vidēs?</td></tr><tr><td><b>num</b></td><td>the answer no</td><td lang=\"la\">Num hoc crēdis?</td></tr></table><p>The interrogative words are worth learning as a block: <b>quis</b> who, <b>quid</b> what, <b>ubi</b> where, <b>quō</b> where to, <b>unde</b> where from, <b>cūr</b> why, <b>quandō</b> when, <b>quōmodo</b> how, <b>quot</b> how many.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Putting a predicate noun in the accusative: <i>Caesar ducem est</i> is wrong.</li><li>Reading a dative of the possessor as an indirect object and producing &#39;a book is to me&#39;.</li><li>Treating <b>nōnne</b> and <b>num</b> as interchangeable with <b>-ne</b>. They carry the speaker&#39;s expectation and change the tone entirely.</li><li>Confusing <b>erat</b> with <b>erit</b>, or <b>est</b> with <b>ēst</b> (he eats — a genuine, if rare, trap).</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Nōnne poētae clārō magna fāma est?</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Nōnne</td><td>question particle</td><td>expects the answer yes</td></tr><tr><td lang=\"la\">poētae</td><td>dative singular</td><td>the possessor</td></tr><tr><td lang=\"la\">clārō</td><td>masc. dat. sg.</td><td>agrees with <b>poētae</b> — and proves it is dative, not genitive</td></tr><tr><td lang=\"la\">magna fāma</td><td>nominative singular</td><td>the thing possessed: the grammatical subject</td></tr><tr><td lang=\"la\">est</td><td>3rd singular</td><td>agrees with <b>fāma</b>, not with <b>poētae</b></td></tr></table><p><b>Sense:</b> surely the famous poet has great renown? Note how <b>clārō</b> settles the ambiguity of <b>poētae</b>: an adjective in the dative can only be modifying a dative.</p></div>","examples":[["Rōma magna est.","Rome is great."],["Mihi duo librī sunt.","I have two books."],["Ubi est forum?","Where is the forum?"],["Venitne magister?","Is the teacher coming?"],["Nōnne Latīnam linguam amās?","Surely you love Latin?"]],"vocab":[["sum, esse","be"],["quis?","who?"],["quid?","what?"],["ubi?","where?"],["cūr?","why?"],["quōmodo?","how?"],["quandō?","when?"],["forum, -ī n.","forum / marketplace"],["mihi","to/for me"],["tibi","to/for you"],["duo / duae","two"],["possum, posse","be able"]],"exercises":[{"t":"fill","q":"we are: ___","a":["sumus"],"ex":"<b>sum</b> is irregular; its first plural is <b>sumus</b>. It is worth learning the whole present out loud as a set: <i>sum, es, est, sumus, estis, sunt</i>."},{"t":"fill","q":"they are: ___","a":["sunt"],"ex":"<b>sunt</b>, 3rd plural. It also does duty for 'there are': <b>sunt multī</b> = there are many."},{"t":"mcq","q":"<i>Mihi liber est</i> means:","opts":["I have a book","The book is me","I am a book","The book is mine only emphatically"],"a":0,"ex":"Latin has no common verb for 'have' in this construction. The dative of the possessor plus <b>est</b> is the idiom: literally 'there is a book to me'."},{"t":"fill","q":"Where is the forum? ___ est forum?","a":["Ubi"],"ex":"<b>Ubi</b> asks 'where', with no motion implied. <b>Quō</b> asks where to, and <b>unde</b> where from."},{"t":"mcq","q":"A neutral yes/no question may use:","opts":["-ne","nōnne only","num only","quod"],"a":0,"ex":"Enclitic <b>-ne</b> attached to the first word asks a neutral question. <b>nōnne</b> expects the answer yes and <b>num</b> expects no — they are not interchangeable."},{"t":"fill","q":"Can we? ___ne?","a":["Possumus"],"ex":"<b>possumus</b> is <i>pos- + sumus</i>: <b>possum</b> is a compound of <b>sum</b>, and the prefix assimilates to <i>pot-/pos-</i> depending on what follows."},{"t":"parse","form":"estis","q":"Identify person and number:","opts":["2nd plural","3rd plural","2nd singular","1st plural"],"a":0,"ex":"<b>estis</b>, 'you (plural) are'. <b>sum</b> is irregular but its endings still follow the familiar personal pattern: <b>-s, -t, -mus, -tis, -nt</b>."},{"t":"parse","form":"mihi","q":"<b>mihi</b> is:","opts":["dative singular of ego","accusative singular of ego","ablative singular of ego","genitive singular of ego"],"a":0,"ex":"<b>ego, meī, mihi, mē, mē</b>. The dative is what makes the possession idiom work: <b>mihi liber est</b>."},{"t":"trans","form":"est","q":"Put into the plural:","a":["sunt"],"ex":"<b>est</b> → <b>sunt</b>. It can also mean 'there is' → 'there are'."},{"t":"trans","form":"Puella bona est.","q":"Rewrite with a plural subject:","a":["Puellae bonae sunt","puellae bonae sunt"],"ex":"All three words change: subject, predicate adjective and verb. A predicate adjective after <b>sum</b> agrees with the subject in the nominative, never in the accusative."},{"t":"pick","s":"Estne magister in villā?","q":"Click the word carrying the question marker.","a":"Estne","ex":"The enclitic <b>-ne</b> attaches to the first word, which is usually the one being questioned. It asks neutrally, expecting no particular answer."},{"t":"pick","s":"Agricolae multī equī sunt.","q":"Click the word in the dative.","a":"Agricolae","ex":"Dative of the possessor: literally 'to the farmer there are many horses' — the farmer has many horses. <b>equī</b> is the grammatical subject."},{"t":"mcq","q":"<i>Nōnne vidēs?</i> expects the answer:","opts":["yes","no","either","it is not a question"],"a":0,"ex":"<b>Nōnne</b> expects yes, <b>num</b> expects no, plain <b>-ne</b> expects nothing. English does this with tone of voice; Latin does it with a particle."},{"t":"mcq","q":"<b>possum</b> is formed from:","opts":["pot- (able) plus sum","por- plus sum","pos- plus habeō","an unrelated root"],"a":0,"ex":"<b>pot-</b> assimilates to <b>pos-</b> before <i>s</i>: <b>possum, potes, potest, possumus, potestis, possunt</b>. The alternation follows a sound rule, not caprice."},{"t":"fill","q":"You (sg.) are a good poet: ___ poēta bonus.","a":["es"],"ex":"<b>es</b>, second singular. Note that <b>poēta bonus</b> is nominative: a predicate noun after <b>sum</b> stays in the same case as the subject."},{"t":"fill","q":"The girls have roses (dative of possessor): Puell___ rosae sunt.","a":["is","īs"],"ex":"<b>Puellīs rosae sunt</b>. The possessor goes into the dative and the thing possessed is the subject."}]}]},{"id":"morph","short":"II","icon":"Ⅱ","label":"Stage II — Core morphology","tagline":"The forms authentic prose assumes","desc":"Third declension, adjectives, pronouns, past and future tenses, and the passive system.","units":[{"id":"m1","title":"Third declension nouns","subtitle":"Use the genitive to find the stem","grammar":"<p class=\"lead\">The third declension holds more nouns than all the others combined, and almost every abstract noun in Latin. It looks irregular. It is not — it simply hides its stem in the nominative and reveals it in the genitive.</p><h3>The stem is the whole secret</h3><p>Take the genitive singular, remove the <b>-is</b>, and what is left is the stem on which every other form is built.</p><table class=\"gr\"><tr><th>Nominative</th><th>Genitive</th><th>Stem</th><th>Why it is hidden</th></tr><tr><td>rēx</td><td>rēg<b>is</b></td><td>rēg-</td><td><i>g</i> + <i>s</i> fused into <i>x</i></td></tr><tr><td>mīles</td><td>mīlit<b>is</b></td><td>mīlit-</td><td><i>t</i> dropped before <i>s</i></td></tr><tr><td>corpus</td><td>corpor<b>is</b></td><td>corpor-</td><td>old <i>s</i> became <i>r</i> between vowels</td></tr><tr><td>nōmen</td><td>nōmin<b>is</b></td><td>nōmin-</td><td>vowel weakened in the interior</td></tr><tr><td>iter</td><td>itiner<b>is</b></td><td>itiner-</td><td>heavy contraction</td></tr></table><p>None of this is arbitrary; it is sound change working over centuries. But you do not need the history. You need the genitive, which is why every dictionary gives it and why you should never learn a third-declension noun without it.</p><h3>The endings</h3><table class=\"gr\"><tr><th>Case</th><th>M./F. sg.</th><th>M./F. pl.</th><th>N. sg.</th><th>N. pl.</th></tr><tr><td>Nom.</td><td>rēx</td><td>rēg<b>ēs</b></td><td>nōmen</td><td>nōmin<b>a</b></td></tr><tr><td>Gen.</td><td>rēg<b>is</b></td><td>rēg<b>um</b></td><td>nōmin<b>is</b></td><td>nōmin<b>um</b></td></tr><tr><td>Dat.</td><td>rēg<b>ī</b></td><td>rēg<b>ibus</b></td><td>nōmin<b>ī</b></td><td>nōmin<b>ibus</b></td></tr><tr><td>Acc.</td><td>rēg<b>em</b></td><td>rēg<b>ēs</b></td><td>nōmen</td><td>nōmin<b>a</b></td></tr><tr><td>Abl.</td><td>rēg<b>e</b></td><td>rēg<b>ibus</b></td><td>nōmin<b>e</b></td><td>nōmin<b>ibus</b></td></tr></table><p>The high-value markers: <b>-em</b> is an unmistakable accusative singular, <b>-ibus</b> is dative or ablative plural, and the neuter rules from the second declension hold here too.</p><h3>i-stems</h3><p>A subgroup keeps an old <i>i</i> in a few places, most visibly in the genitive plural <b>-ium</b> instead of <b>-um</b>. You can spot most of them by two tests: the nominative and genitive have the same number of syllables (<b>cīvis, cīvis</b>; <b>hostis, hostis</b>), or the nominative ends in two consonants (<b>urbs, urbis</b>; <b>pars, partis</b>). Neuter i-stems in <b>-e, -al, -ar</b> go further, with ablative singular <b>-ī</b> and neuter plural <b>-ia</b>: <b>mare, marī, maria, marium</b>.</p><div class=\"tip\">The distinction rarely blocks comprehension while reading, but it matters enormously for metre and for writing Latin — and <b>-ium</b> in a genitive plural is a small clue about which kind of noun you are looking at.</div><h3>Gender must be learned</h3><p>Third-declension gender cannot be read off the ending, but useful patterns exist. Nouns in <b>-tiō, -tūdō, -tās, -tūs</b> are feminine and abstract: <b>nātiō, multitūdō, cīvitās, virtūs</b>. Nouns in <b>-men</b> are neuter: <b>nōmen, flūmen, carmen, agmen</b>. Nouns in <b>-or</b> denoting agents are masculine: <b>imperātor, victor, ōrātor</b>.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Building forms on the nominative rather than the genitive stem: <i>corpusis</i> instead of <b>corporis</b>.</li><li>Reading <b>-ēs</b> as necessarily nominative. It is accusative plural just as often, and the verb decides.</li><li>Confusing third-declension <b>-ī</b> (dative singular) with second-declension <b>-ī</b> (genitive singular). <b>Rēgī</b> is to the king; <b>servī</b> is of the slave.</li><li>Assuming <b>-e</b> means the vocative. In the third declension it is the ablative singular.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Nōmina mīlitum quī urbem servāvērunt in carmine sunt.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Nōmina</td><td>neut. nom. pl.</td><td>subject; neuter plural in <b>-a</b> as always</td></tr><tr><td lang=\"la\">mīlitum</td><td>gen. pl.</td><td>whose names — consonant stem, so <b>-um</b> not <b>-ium</b></td></tr><tr><td lang=\"la\">quī</td><td>masc. nom. pl.</td><td>relative, subject of <b>servāvērunt</b></td></tr><tr><td lang=\"la\">urbem</td><td>acc. sg.</td><td>object; <b>-em</b> is decisive</td></tr><tr><td lang=\"la\">in carmine</td><td>abl. sg.</td><td>place where; stem <b>carmin-</b> from <b>carminis</b></td></tr><tr><td lang=\"la\">sunt</td><td>3rd pl.</td><td>agrees with <b>Nōmina</b></td></tr></table><p><b>Sense:</b> the names of the soldiers who saved the city are in a poem. Four third-declension nouns, four different cases, and the stem of each is visible only because you know its genitive.</p></div>","examples":[["Rēx cīvitātem regit.","The king rules the state."],["Mīlitēs urbem dēfendunt.","The soldiers defend the city."],["Nōmen rēgis nōtum est.","The king’s name is known."],["Corpora hominum mortālia sunt.","Human bodies are mortal."]],"vocab":[["rēx, rēgis m.","king"],["mīles, mīlitis m.","soldier"],["cīvitās, -ātis f.","state / citizenship"],["urbs, urbis f.","city"],["nōmen, nōminis n.","name"],["corpus, corporis n.","body"],["homo, hominis m.","human being"],["pāx, pācis f.","peace"],["lēx, lēgis f.","law"],["virtūs, -ūtis f.","courage / excellence"],["dēfendō","defend"],["mortālis, -e","mortal"]],"exercises":[{"t":"fill","q":"the king (genitive): rēg___","a":["is"],"ex":"The genitive singular of the third declension is <b>-is</b>: <b>rēgis</b>. Strip that ending and you have the stem <b>rēg-</b>, on which every other case is built."},{"t":"fill","q":"soldiers (nom. plural): mīlit___","a":["ēs"],"ex":"Nominative plural of a masculine or feminine third-declension noun is <b>-ēs</b>: <b>mīlitēs</b>. It is identical to the accusative plural, so the verb usually resolves the ambiguity."},{"t":"mcq","q":"The stem of <i>corpus, corporis</i> is:","opts":["corpor-","corp-","corpus-","corpo-"],"a":0,"ex":"The nominative <b>corpus</b> hides the stem; the genitive <b>corporis</b> reveals <b>corpor-</b>. This is exactly why dictionaries list the genitive."},{"t":"fill","q":"bodies (nom./acc. pl.): corpor___","a":["a"],"ex":"Neuter plural is <b>-a</b> here as everywhere: <b>corpora</b>, nominative and accusative alike. Note the stem change from <b>corpus</b>."},{"t":"fill","q":"The soldiers defend the city: Mīlitēs urbem ___.","a":["dēfendunt"],"ex":"<b>dēfendunt</b>, 3rd plural. Both <b>mīlitēs</b> and the third-declension <b>urbem</b> come from this declension, whose accusative singular <b>-em</b> is a reliable object marker."},{"t":"mcq","q":"Third-declension genitive singular ends in:","opts":["-is","-ī","-ae","-ūs"],"a":0,"ex":"<b>-is</b> in the genitive singular is the signature of the third declension, as against <b>-ae</b> (first) and <b>-ī</b> (second). Identifying the declension is the first step to identifying the case."},{"t":"parse","form":"rēgibus","q":"Identify the possibilities:","opts":["dative or ablative plural","genitive plural","accusative plural","dative singular"],"a":0,"ex":"<b>-ibus</b> serves as both dative and ablative plural throughout the third declension. Latin never separates those two cases in the plural."},{"t":"parse","form":"corpore","q":"Identify case and number:","opts":["ablative singular","dative singular","nominative singular","genitive singular"],"a":0,"ex":"Third-declension ablative singular is <b>-e</b> in consonant stems. The stem <b>corpor-</b> comes from the genitive <b>corporis</b>, not from the nominative <b>corpus</b>."},{"t":"trans","form":"mīles","q":"Give the genitive singular:","a":["mīlitis","militis"],"ex":"<b>mīlitis</b>. The nominative hides a <i>t</i> that the genitive restores — which is exactly why you must learn both."},{"t":"trans","form":"urbem","q":"Put into the plural, keeping the case:","a":["urbēs","urbes"],"ex":"Accusative singular <b>-em</b> becomes accusative plural <b>-ēs</b>, which is also the nominative plural. Third-declension plurals are ambiguous in a way the singulars are not."},{"t":"pick","s":"Rēx mīlitibus urbis pecūniam dat.","q":"Click the word in the genitive.","a":"urbis","ex":"<b>urbis</b>, 'of the city', depends on <b>mīlitibus</b> — the soldiers of the city. <b>mīlitibus</b> itself is dative, the indirect object."},{"t":"pick","s":"Nōmina rēgum in librō sunt.","q":"Click the neuter plural.","a":"Nōmina","ex":"<b>nōmina</b> is nominative plural of <b>nōmen</b>. Neuter plural in <b>-a</b> again, and here it is the subject of <b>sunt</b>."},{"t":"mcq","q":"Why can't you predict a third-declension noun's stem from its nominative?","opts":["sound changes reshaped the nominative, and the genitive preserves the stem","the nominative is randomly assigned","third-declension nouns have no stem","the stem changes in every case"],"a":0,"ex":"<b>rēx</b> is <i>rēg-s</i> with the <i>g</i> and <i>s</i> fused; <b>corpus</b> shows an old <i>s</i> that became <i>r</i> between vowels in <b>corporis</b>. The genitive is the reliable witness."},{"t":"mcq","q":"Which noun is neuter?","opts":["nōmen, nōminis","rēx, rēgis","mīles, mīlitis","urbs, urbis"],"a":0,"ex":"Nouns in <b>-men</b> are regularly neuter, with genitive <b>-minis</b>: <b>nōmen, flūmen, carmen, agmen</b>."},{"t":"fill","q":"of the soldiers (genitive plural): mīlit___","a":["um"],"ex":"<b>mīlitum</b>. Consonant stems take <b>-um</b>; i-stems such as <b>cīvis</b> take <b>-ium</b>."},{"t":"fill","q":"The king defends the city: Rēx urb___ dēfendit.","a":["em"],"ex":"<b>urbem</b>, accusative singular. The <b>-em</b> ending is one of the most reliable object markers in Latin."}]},{"id":"m2","title":"Third-declension adjectives & comparison","subtitle":"Two-termination adjectives and degrees","grammar":"<p class=\"lead\">Adjectives of the third declension are what real Latin prose is built from, and comparison — bigger, biggest — turns out to be more regular than in English.</p><h3>Three shapes of third-declension adjective</h3><table class=\"gr\"><tr><th>Type</th><th>Nominative singular</th><th>Example</th></tr><tr><td>Three terminations</td><td>separate m., f., n.</td><td>ācer, ācris, ācre — keen</td></tr><tr><td>Two terminations</td><td>one for m./f., one for n.</td><td>fortis, forte — brave</td></tr><tr><td>One termination</td><td>a single form for all three</td><td>fēlīx, gen. fēlīcis — lucky</td></tr></table><p>All three decline identically once you leave the nominative, and all follow the i-stem pattern: ablative singular <b>-ī</b>, genitive plural <b>-ium</b>, neuter plural <b>-ia</b>.</p><table class=\"gr\"><tr><th>Case</th><th>M./F. sg.</th><th>N. sg.</th><th>M./F. pl.</th><th>N. pl.</th></tr><tr><td>Nom.</td><td>fortis</td><td>forte</td><td>fortēs</td><td>fortia</td></tr><tr><td>Gen.</td><td>fortis</td><td>fortis</td><td>fortium</td><td>fortium</td></tr><tr><td>Dat.</td><td>fortī</td><td>fortī</td><td>fortibus</td><td>fortibus</td></tr><tr><td>Acc.</td><td>fortem</td><td>forte</td><td>fortēs</td><td>fortia</td></tr><tr><td>Abl.</td><td>fortī</td><td>fortī</td><td>fortibus</td><td>fortibus</td></tr></table><p>Remember that an adjective agrees in case, number and gender, never in declension. <b>Mīles fortis</b> pairs a third-declension noun with a third-declension adjective; <b>puella fortis</b> pairs a first-declension noun with the same adjective, and is equally correct.</p><h3>Comparison</h3><table class=\"gr\"><tr><th>Positive</th><th>Comparative</th><th>Superlative</th></tr><tr><td>fortis — brave</td><td>fortior, fortius — braver</td><td>fortissimus — bravest</td></tr><tr><td>clārus — famous</td><td>clārior, clārius</td><td>clārissimus</td></tr><tr><td>pulcher — beautiful</td><td>pulchrior</td><td>pulcherrimus</td></tr><tr><td>facilis — easy</td><td>facilior</td><td>facillimus</td></tr></table><p>Comparatives decline as third-declension <i>consonant</i> stems — ablative <b>-e</b>, genitive plural <b>-um</b>, neuter plural <b>-a</b> — which makes them the exception among third-declension adjectives. Superlatives decline like <b>bonus</b>, in the first and second declension. Adjectives in <b>-er</b> add <b>-rimus</b>; six in <b>-lis</b> (<b>facilis, difficilis, similis, dissimilis, gracilis, humilis</b>) add <b>-limus</b>.</p><h3>The four irregular sets</h3><table class=\"gr\"><tr><th>Positive</th><th>Comparative</th><th>Superlative</th></tr><tr><td>bonus good</td><td>melior</td><td>optimus</td></tr><tr><td>malus bad</td><td>peior</td><td>pessimus</td></tr><tr><td>magnus great</td><td>maior</td><td>maximus</td></tr><tr><td>parvus small</td><td>minor</td><td>minimus</td></tr><tr><td>multus much</td><td>plūs</td><td>plūrimus</td></tr></table><h3>Saying &#39;than&#39;</h3><p>Two constructions, identical in meaning. Either <b>quam</b> with the second item in the same case as the first — <b>Caesar clārior est quam Pompeius</b> — or the bare ablative of comparison: <b>Caesar clārior est Pompeiō</b>. The ablative is more compact and very common in verse.</p><p>The comparative also does duty for &#39;rather&#39; and &#39;too&#39;: <b>audācior</b> can mean braver, rather brave, or too brave, and only the context decides. The superlative likewise means &#39;very&#39; as often as &#39;most&#39;: <b>vir fortissimus</b> is usually a very brave man.</p><h3>Adverbs</h3><p>First- and second-declension adjectives form adverbs in <b>-ē</b> (<b>clārus → clārē</b>); third-declension ones in <b>-iter</b> (<b>fortis → fortiter</b>). The comparative adverb is simply the comparative neuter singular — <b>fortius</b>, <b>clārius</b> — and the superlative adverb ends in <b>-ē</b>: <b>fortissimē</b>.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Giving a comparative the i-stem endings. <b>Fortiōre</b>, not <i>fortiōrī</i>.</li><li>Writing <i>magnior</i>. The comparative of <b>magnus</b> is <b>maior</b>.</li><li>Missing an ablative of comparison and reading it as an ablative of means.</li><li>Translating every superlative as &#39;most&#39;. &#39;Very&#39; is often closer.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Omnium urbium pulcherrima nūllā est clārior.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Omnium urbium</td><td>gen. pl.</td><td>partitive: of all cities — note <b>-ium</b> twice, both i-stems</td></tr><tr><td lang=\"la\">pulcherrima</td><td>fem. nom. sg.</td><td>superlative used as a noun: the most beautiful one, the subject</td></tr><tr><td lang=\"la\">nūllā</td><td>fem. abl. sg.</td><td>ablative of comparison: than none</td></tr><tr><td lang=\"la\">clārior</td><td>fem. nom. sg. comparative</td><td>predicate after <b>est</b>, agreeing with the subject</td></tr></table><p><b>Sense:</b> the most beautiful of all cities is more famous than none — that is, none is more famous than she. The bare ablative <b>nūllā</b> is doing the work of <i>quam nūlla</i>, and spotting it is the whole difficulty of the sentence.</p></div>","examples":[["Mīles fortis pugnat.","The brave soldier fights."],["Consilium utile est.","The plan is useful."],["Caesar Pompeio potentior erat.","Caesar was more powerful than Pompey."],["Haec via brevissima est.","This road is the shortest."]],"vocab":[["fortis, forte","brave / strong"],["ūtilis, -e","useful"],["facilis, -e","easy"],["difficilis, -e","difficult"],["celer, celeris, celere","swift"],["maior, maius","greater"],["minor, minus","smaller"],["melior, melius","better"],["optimus, -a, -um","best"],["pessimus, -a, -um","worst"],["brevissimus","shortest"],["potēns, potentis","powerful"]],"exercises":[{"t":"fill","q":"a useful plan: consilium util___","a":["e"],"ex":"<b>ūtilis</b> is a two-termination adjective: <b>-is</b> for masculine and feminine, <b>-e</b> for neuter. <b>Cōnsilium</b> is neuter, so <b>ūtile</b>."},{"t":"fill","q":"brave soldiers: mīlitēs fort___","a":["ēs"],"ex":"<b>fortis</b> in the masculine plural nominative is <b>fortēs</b>, matching <b>mīlitēs</b>. Third-declension adjectives follow the i-stem pattern, not the pattern of <i>rēx</i>."},{"t":"mcq","q":"Comparative neuter of <i>maior</i>:","opts":["maius","maior","maximum","magnius"],"a":0,"ex":"Comparatives decline as third-declension consonant stems, with the neuter differing: <b>maior</b> (m./f.) but <b>maius</b> (n.). Compare <b>melior / melius</b>."},{"t":"fill","q":"the best road: via optim___","a":["a"],"ex":"<b>optima</b> is the superlative of <b>bonus</b> and is irregular; it agrees with feminine <b>via</b>. Learn <i>bonus, melior, optimus</i> as a set alongside <i>malus, peior, pessimus</i>."},{"t":"mcq","q":"Superlatives usually contain:","opts":["-issim-","-ior-","-nt-","-bil-"],"a":0,"ex":"Regular superlatives insert <b>-issim-</b>: <b>fortissimus</b>, <b>clārissimus</b>. Adjectives in <b>-er</b> use <b>-rim-</b> and those in <b>-lis</b> often <b>-lim-</b>."},{"t":"fill","q":"Caesar was greater than Pompey: Caesar Pompeio ___ erat.","a":["maior"],"ex":"<b>maior</b> is the comparative of <b>magnus</b>. <b>Pompeiō</b> is ablative of comparison, an alternative to <b>quam Pompeius</b> in the nominative."},{"t":"parse","form":"fortiōrem","q":"Identify case, number and degree:","opts":["accusative singular comparative","accusative plural comparative","nominative singular superlative","ablative singular comparative"],"a":0,"ex":"Comparatives decline as third-declension consonant stems: <b>fortior, fortiōris, fortiōrī, fortiōrem, fortiōre</b>."},{"t":"parse","form":"omnia","q":"Identify case, number and gender:","opts":["neuter nominative or accusative plural","feminine nominative singular","masculine accusative plural","neuter genitive plural"],"a":0,"ex":"<b>omnis, omne</b> is an i-stem adjective, so its neuter plural is <b>omnia</b>, not <b>omne</b>. Used alone it means 'all things, everything'."},{"t":"trans","form":"fortis","q":"Give the neuter nominative singular:","a":["forte"],"ex":"Two-termination adjectives have one form for masculine and feminine, another for neuter: <b>fortis / forte</b>, <b>omnis / omne</b>, <b>ūtilis / ūtile</b>."},{"t":"trans","form":"clārus","q":"Give the superlative, masculine nominative singular:","a":["clārissimus","clarissimus"],"ex":"<b>clārissimus</b>, formed with <b>-issimus</b> on the stem. Superlatives then decline like <b>bonus</b>, in the first and second declension."},{"t":"pick","s":"Mīlitēs fortiōrēs urbem celerius cēpērunt.","q":"Click the comparative adverb.","a":"celerius","ex":"The comparative adverb is identical to the comparative neuter singular: <b>celerius</b>, 'rather quickly, more quickly'. <b>fortiōrēs</b> is the adjective agreeing with <b>Mīlitēs</b>."},{"t":"pick","s":"Hic liber ūtilior est quam ille.","q":"Click the word that introduces the comparison.","a":"quam","ex":"<b>quam</b> plus the same case is one way to compare; the bare ablative — <b>illō</b> here — is the other. They mean the same thing."},{"t":"mcq","q":"<b>facilis</b> forms its superlative as:","opts":["facillimus","facilissimus","facilior","maximē facilis"],"a":0,"ex":"Six adjectives in <b>-lis</b> — <b>facilis, difficilis, similis, dissimilis, gracilis, humilis</b> — take <b>-limus</b>. Everything else in <b>-lis</b> is regular."},{"t":"mcq","q":"<b>plūs</b> in the singular is:","opts":["a neuter noun taking a genitive","a normal adjective","an adverb only","indeclinable"],"a":0,"ex":"<b>plūs vīnī</b> is literally 'more of wine'. In the plural <b>plūrēs, plūra</b> behaves as an ordinary adjective."},{"t":"fill","q":"the bravest soldiers (nom. pl.): mīlitēs fort___","a":["issimī","issimi"],"ex":"<b>fortissimī</b>. Note the double <i>s</i>, and note that the superlative declines like <b>bonus</b> even though <b>fortis</b> does not."},{"t":"fill","q":"Complete the irregular set — bonus, melior, ___","a":["optimus"],"ex":"<b>bonus, melior, optimus</b>; also <b>malus, peior, pessimus</b>; <b>magnus, maior, maximus</b>; <b>parvus, minor, minimus</b>. Learn them as four sets."}]},{"id":"m3","title":"Pronouns & demonstratives","subtitle":"Track reference without losing the sentence","grammar":"<p class=\"lead\">Pronouns are how Latin keeps track of who is who across a long sentence. They are irregular, they are short, and they appear on almost every line of real prose — which makes them worth genuine memorisation.</p><h3>Personal pronouns</h3><table class=\"gr\"><tr><th>Case</th><th>I</th><th>you sg.</th><th>we</th><th>you pl.</th></tr><tr><td>Nom.</td><td>ego</td><td>tū</td><td>nōs</td><td>vōs</td></tr><tr><td>Gen.</td><td>meī</td><td>tuī</td><td>nostrum / nostrī</td><td>vestrum / vestrī</td></tr><tr><td>Dat.</td>

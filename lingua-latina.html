*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.58 system-ui,-apple-system,"Segoe UI",sans-serif}.layout{display:flex;min-height:100vh}.sidebar{width:270px;flex:0 0 auto;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:15px 11px 40px}.brand{display:flex;gap:10px;align-items:center;padding:5px 9px 15px}.seal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff7e6;font-family:Georgia,serif;font-weight:700;font-size:20px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}.brand b{font-family:Georgia,serif;font-size:18px}.brand small{display:block;color:var(--muted);font-size:11.5px}.navsec{text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);font-size:10.5px;margin:13px 10px 4px}.navlink{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;font:inherit;font-size:14px;cursor:pointer}.navlink:hover{background:var(--card2)}.navlink.active{background:var(--soft);color:var(--acc);font-weight:700}.navlink .ic{width:21px;text-align:center}.navlink .badge{margin-left:auto;color:var(--muted);font-size:11px}.main{flex:1;min-width:0;max-width:940px;margin:0 auto;padding:28px 34px 90px}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.22}h1{font-size:29px;margin:0 0 6px}h2{font-size:21px;margin:28px 0 11px}h3{font-size:17px;margin:21px 0 8px}.sub{margin:0 0 20px;color:var(--muted)}a{color:var(--acc2)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px 21px;margin-bottom:15px;box-shadow:var(--shadow)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin:17px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat b{font-size:25px;display:block}.stat small{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}.btn:hover{background:var(--card2)}.btn.primary{background:var(--acc);border-color:var(--acc);color:white}.btn.small{padding:5px 10px;font-size:12.5px}.pill{display:inline-block;border-radius:99px;padding:2px 9px;background:var(--card2);color:var(--muted);font-size:11.5px;font-weight:700}.pill.acc{background:var(--soft);color:var(--acc)}.progress{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.progress i{height:100%;display:block;background:var(--acc);border-radius:99px}.levelcard,.unitrow,.readingrow{display:block;color:inherit;text-decoration:none;cursor:pointer}.levelcard:hover,.unitrow:hover,.readingrow:hover{border-color:var(--muted)}.leveltop{display:flex;gap:10px;align-items:baseline}.leveltop b{font-size:18px}.leveltop span{color:var(--muted)}.leveltop .pct{margin-left:auto}.unitrow,.readingrow{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow)}.unitrow{display:flex;gap:13px;align-items:center}.num{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:var(--card2);font-weight:800;flex:none}.unitrow.done .num{background:var(--acc);color:white}.unitrow .t{flex:1;min-width:0}.unitrow .t b,.readingrow b{display:block}.unitrow small,.readingrow small{color:var(--muted)}.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0}.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:9px 13px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}.tab.active{color:var(--acc);border-color:var(--acc)}.grammar p{margin:9px 0}.grammar ul,.grammar ol{padding-left:23px}.tip{border-left:3px solid var(--gold);background:var(--goldsoft);padding:10px 13px;border-radius:0 9px 9px 0;margin:12px 0}.gr{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}.gr th,.gr td{border:1px solid var(--line);padding:7px 10px;text-align:left}.gr th{background:var(--card2)}.example{border-bottom:1px dashed var(--line);padding:9px 1px}.example .la{font-family:Georgia,serif;font-size:17px}.example .en{display:block;color:var(--muted);font-size:13.5px}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.vocab div{padding:8px 2px;border-bottom:1px solid var(--line)}.vocab b{font-family:Georgia,serif;color:var(--acc)}.exercise{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;margin:15px 0}.opts{display:grid;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 12px;text-align:left;font:inherit;cursor:pointer}.opt:hover{background:var(--card2)}.opt.correct{border-color:var(--good);background:rgba(47,107,60,.1)}.opt.wrong{border-color:var(--bad);background:rgba(162,43,43,.1)}.answerrow{display:flex;gap:8px}.answerrow input,.search,.select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit}.feedback{margin-top:10px;font-weight:650}.ok{color:var(--good)}.no{color:var(--bad)}.readfilter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.readingrow{display:grid;grid-template-columns:1fr auto;gap:15px}.readingmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.latintext{font:20px/1.85 Georgia,"Times New Roman",serif;white-space:pre-line;letter-spacing:.005em}.word{border:0;border-bottom:1px dotted var(--acc);padding:0;background:transparent;color:inherit;font:inherit;cursor:pointer}.word:hover{background:var(--soft)}.aidbar{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.aidbar .btn.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}.glosstip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90%;text-align:center}.aidbox{background:var(--card2);border-radius:10px;padding:13px 15px;margin:13px 0}.notes li{margin:6px 0}.source{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}.flashstage{max-width:590px;margin:0 auto}.flashcard{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:32px;box-shadow:var(--shadow);cursor:pointer}.flashcard .front{font:700 28px/1.25 Georgia,serif}.flashcard .back{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:20px;color:var(--muted)}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.grades button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 5px;border-radius:9px;font-weight:750;cursor:pointer}.labtable{overflow-x:auto}.banner{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px}.menubtn{display:none;position:fixed;right:18px;bottom:18px;z-index:70;width:52px;height:52px;border:0;border-radius:50%;background:var(--acc);color:white;font-size:22px;box-shadow:0 5px 20px rgba(0,0,0,.3)}
@media(max-width:840px){.sidebar{position:fixed;z-index:60;transform:translateX(-105%);transition:.2s;height:100dvh}.sidebar.open{transform:none;box-shadow:0 0 45px rgba(0,0,0,.35)}.menubtn{display:block}.main{padding:20px 15px 90px;max-width:100%}.grid2,.vocab{grid-template-columns:1fr}.readingrow{grid-template-columns:1fr}.gr{display:block;overflow-x:auto}.grades{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
const COURSE=[{"id":"found","short":"I","icon":"Ⅰ","label":"Stage I — Foundations","tagline":"Forms that unlock sentences","desc":"Pronunciation, the case system, first and second declensions, present verbs and essential sentence patterns.","units":[{"id":"f1","title":"Sounds, quantities & the case idea","subtitle":"How Latin encodes meaning in endings","grammar":"<h3>Pronunciation and vowel quantity</h3>\n<p>This course uses a restored Classical pronunciation. <b>c</b> is always hard as in <i>cat</i>; <b>g</b> is always hard; <b>v</b> is approximately English <i>w</i>; <b>ae</b> is a diphthong like “eye.” A macron marks a long vowel: <b>ā ē ī ō ū</b>.</p>\n<p>Vowel length can distinguish words: <b>liber</b> “book” and <b>līber</b> “free”; <b>malum</b> “evil” and <b>mālum</b> “apple.” Many modern editions omit macrons, so the Reading Room can display texts without them.</p>\n<h3>Cases</h3><p>Latin changes noun endings to show function. The principal cases are nominative (subject), accusative (direct object), genitive (possession), dative (indirect object), ablative (means, manner, separation and many prepositions), and vocative (address).</p>\n<div class=\"tip\"><b>Reading habit:</b> find the finite verb, then identify nominatives and accusatives. Do not assume the first noun is the subject.</div>","examples":[["Rōma in Italiā est.","Rome is in Italy."],["Puella poetam videt.","The girl sees the poet."],["Poeta puellam videt.","The poet sees the girl."],["Salvē, amīce!","Hello, friend!"]],"vocab":[["Rōma","Rome"],["Italia","Italy"],["puella","girl"],["poēta","poet"],["amīcus","friend"],["videt","sees"],["est","is"],["in","in / on"],["salvē","hello"],["casus","case"],["nōmen","noun / name"],["verbum","verb / word"]],"exercises":[{"t":"mcq","q":"In restored Classical Latin, <b>c</b> is normally:","opts":["always hard","soft before e and i","silent","pronounced sh"],"a":0,"ex":"Restored classical pronunciation has no soft <i>c</i>: <b>Cicero</b> is <i>KEE-ke-ro</i>, <b>caelum</b> is <i>KIGH-lum</i>. The soft <i>c</i> you may know from church Latin is a later development."},{"t":"mcq","q":"Which case normally marks the direct object?","opts":["accusative","nominative","genitive","vocative"],"a":0,"ex":"The accusative is the object case. Because Latin marks the object on the noun itself, word order is free: <b>puellam poēta videt</b> and <b>poēta puellam videt</b> both mean the poet sees the girl."},{"t":"fill","q":"Rōma in Italiā ___.","a":["est"],"ex":"<b>est</b> is 3rd singular of <i>sum</i>. Note that <b>Italiā</b> already carries the long <i>-ā</i> of the ablative after <b>in</b> meaning 'in, within'."},{"t":"mcq","q":"A macron marks:","opts":["a long vowel","stress only","a silent vowel","a diphthong"],"a":0,"ex":"A macron marks vowel <i>length</i>, not stress. Length is phonemic: <b>malum</b> (evil) and <b>mālum</b> (apple) are different words, and metre in poetry depends entirely on it."},{"t":"fill","q":"Puella poetam ___.","a":["videt"],"ex":"<b>videt</b> is 3rd singular present. The <b>-t</b> supplies the subject 'she', so no pronoun is needed; <b>poetam</b> is accusative, hence the object."},{"t":"mcq","q":"In <i>Poeta puellam videt</i>, the object is:","opts":["puellam","poeta","videt","none"],"a":0,"ex":"The <b>-am</b> ending identifies <b>puellam</b> as accusative and therefore the object, even though it stands before the verb. Endings, not position, assign roles."},{"t":"parse","form":"puellam","q":"Identify the case and number:","opts":["accusative singular","nominative singular","genitive singular","accusative plural"],"a":0,"ex":"The <b>-am</b> ending is accusative singular in the first declension. That single letter <i>m</i> is doing the work English does with word order."},{"t":"parse","form":"poētae","q":"Which of these can <b>poētae</b> not be?","opts":["accusative singular","nominative plural","genitive singular","dative singular"],"a":0,"ex":"<b>-ae</b> is nominative plural, genitive singular and dative singular all at once. The accusative singular would be <b>poētam</b>. Ambiguous endings are normal; the sentence resolves them."},{"t":"trans","form":"rosa","q":"Put into the accusative singular:","a":["rosam"],"ex":"Nominative <b>-a</b> becomes accusative <b>-am</b>. Changing the ending changes the word's job in the sentence, not its meaning."},{"t":"pick","s":"Poēta puellam videt.","q":"Click the word that is the direct object.","a":"puellam","ex":"<b>puellam</b> is accusative, so it is the object even though it stands before the verb. Latin marks the role on the word; English marks it by position."},{"t":"pick","s":"Rōma in Italiā est.","q":"Click the subject of the sentence.","a":"Rōma","ex":"<b>Rōma</b> is nominative. <b>Italiā</b> has the long ablative <b>-ā</b> after <b>in</b> and cannot be the subject."},{"t":"mcq","q":"Latin word order is:","opts":["flexible, because endings carry the grammar","fixed as subject–verb–object","fixed as subject–object–verb","random"],"a":0,"ex":"Prose tends toward subject–object–verb, but any order is grammatical. Poets exploit this constantly; the endings never stop telling you who does what."},{"t":"mcq","q":"The Latin <i>v</i> in restored pronunciation sounds like:","opts":["English <i>w</i>","English <i>v</i>","English <i>f</i>","it is silent"],"a":0,"ex":"<b>vīdī</b> was <i>WEE-dee</i>. The <i>v</i> sound of modern Italian and church Latin developed later."},{"t":"fill","q":"The poet sees the girl: Poēta puellam ___.","a":["videt"],"ex":"<b>videt</b> is third singular. The <b>-t</b> already contains 'he/she/it', so <b>poēta</b> is added only because we want to name the subject."},{"t":"fill","q":"Give the accusative singular of <i>terra</i>: ___","a":["terram"],"ex":"First-declension accusative singular is always <b>-am</b>, whatever the noun's gender."},{"t":"mcq","q":"Stress in a Latin word of three or more syllables falls on:","opts":["the second-last syllable if it is long, otherwise the third-last","always the first syllable","always the last syllable","wherever the macron is"],"a":0,"ex":"So <b>amīcus</b> is a-MEE-cus, but <b>dominus</b> is DO-mi-nus. Vowel length decides stress, which is another reason macrons matter."}]},{"id":"f2","title":"First declension","subtitle":"Subjects, objects and possession","grammar":"<h3>First-declension endings</h3><table class=\"gr\"><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Nominative</td><td>-a</td><td>-ae</td></tr><tr><td>Accusative</td><td>-am</td><td>-ās</td></tr><tr><td>Genitive</td><td>-ae</td><td>-ārum</td></tr><tr><td>Dative</td><td>-ae</td><td>-īs</td></tr><tr><td>Ablative</td><td>-ā</td><td>-īs</td></tr></table>\n<p>Most first-declension nouns are feminine, but words for male persons such as <b>poēta</b>, <b>agricola</b> and <b>nauta</b> are masculine.</p>\n<p>Learn a noun by its nominative and genitive: <b>puella, puellae, f.</b> The genitive identifies the declension and supplies the stem.</p>","examples":[["Puella aquam portat.","The girl carries water."],["Puellae aquam portant.","The girls carry water."],["Fīlia agricolae cantat.","The farmer’s daughter sings."],["Nauta puellae rosam dat.","The sailor gives the girl a rose."]],"vocab":[["puella, -ae f.","girl"],["aqua, -ae f.","water"],["rosa, -ae f.","rose"],["fīlia, -ae f.","daughter"],["terra, -ae f.","land / earth"],["via, -ae f.","road / way"],["porta, -ae f.","gate"],["agricola, -ae m.","farmer"],["nauta, -ae m.","sailor"],["portat","carries"],["cantat","sings"],["dat","gives"]],"exercises":[{"t":"fill","q":"The girl (subject): puell___","a":["a"],"ex":"The nominative singular of the first declension is <b>-a</b>. It marks the subject, and its short final <i>-a</i> distinguishes it from the ablative <b>-ā</b>."},{"t":"fill","q":"The girls (subject): puell___","a":["ae"],"ex":"Nominative plural is <b>-ae</b>. This ending is ambiguous on its own — it is also genitive and dative singular — so context and the verb ending resolve it."},{"t":"fill","q":"The rose (object): ros___","a":["am"],"ex":"Accusative singular is <b>-am</b>. Compare <b>rosa</b> (subject) with <b>rosam</b> (object); the single consonant is the whole difference in meaning."},{"t":"mcq","q":"<i>agricola</i> is:","opts":["masculine despite first declension","always feminine","neuter","indeclinable"],"a":0,"ex":"A handful of first-declension nouns denoting male roles — <b>agricola</b>, <b>nauta</b>, <b>poēta</b>, <b>incola</b> — are masculine. Their adjectives follow the sense: <b>agricola bonus</b>, never <i>bona</i>."},{"t":"fill","q":"The farmer’s daughter: fīlia agricol___","a":["ae"],"ex":"The genitive singular <b>-ae</b> expresses possession: <b>fīlia agricolae</b>, the daughter <i>of the farmer</i>. It is identical in form to the nominative plural, which is why you learn nouns with the genitive attached."},{"t":"fill","q":"The girls carry water: Puellae aquam ___.","a":["portant"],"ex":"<b>portant</b> is 3rd plural, agreeing with the plural subject <b>puellae</b>. The <b>-nt</b> is what tells you <b>puellae</b> here is nominative plural rather than genitive singular."},{"t":"parse","form":"puellārum","q":"Identify case and number:","opts":["genitive plural","accusative plural","dative plural","ablative singular"],"a":0,"ex":"<b>-ārum</b> is the first-declension genitive plural: 'of the girls'. Every declension marks the genitive plural with <b>-rum</b> or <b>-um</b>."},{"t":"parse","form":"aquā","q":"The long <b>-ā</b> marks this as:","opts":["ablative singular","nominative singular","accusative singular","genitive plural"],"a":0,"ex":"Nominative <b>aqua</b> and ablative <b>aquā</b> differ only in vowel length. In an unmacronised text you must work it out from the sentence — usually from a preposition."},{"t":"trans","form":"puella","q":"Put into the nominative plural:","a":["puellae"],"ex":"<b>-a</b> becomes <b>-ae</b>. The same form is also genitive and dative singular, so the verb ending is what usually tells you which one you are looking at."},{"t":"trans","form":"rosās","q":"Put into the singular, keeping the case:","a":["rosam"],"ex":"<b>-ās</b> is accusative plural, so the singular is accusative <b>-am</b>. Change number without changing case."},{"t":"pick","s":"Nauta puellae rosam dat.","q":"Click the indirect object.","a":"puellae","ex":"<b>puellae</b> is dative here — the person to whom the rose is given. Its form is identical to the genitive and to the nominative plural, and only the sense of <b>dat</b> decides."},{"t":"pick","s":"Fīlia agricolae in viā ambulat.","q":"Click the word in the ablative.","a":"viā","ex":"<b>in</b> with the ablative means 'in, on'. <b>agricolae</b> is genitive — the farmer's daughter."},{"t":"mcq","q":"Why is <b>nauta</b> masculine?","opts":["it names a male role, and gender follows sense","all -a nouns are masculine","its genitive is irregular","it is a Greek loanword and so has no gender"],"a":0,"ex":"A small group — <b>nauta, agricola, poēta, incola, scrība</b> — declines like <b>puella</b> but takes masculine adjectives, because the people they name were men."},{"t":"fill","q":"of the water (genitive singular): aqu___","a":["ae"],"ex":"Genitive singular <b>-ae</b>. Learning the genitive with every noun is what lets you find the stem and the declension."},{"t":"fill","q":"to the girls (dative plural): puell___","a":["is","īs"],"ex":"Dative and ablative plural are both <b>-īs</b> in the first declension. Latin never distinguishes them in the plural, in any declension."},{"t":"mcq","q":"In <i>Puellae rosās portant</i>, <b>Puellae</b> must be:","opts":["nominative plural","genitive singular","dative singular","ablative plural"],"a":0,"ex":"<b>portant</b> is third person plural, so it needs a plural subject. The verb ending disambiguates the noun — this is the normal way Latin resolves its own ambiguities."}]},{"id":"f3","title":"Second declension & adjectives","subtitle":"Gender and agreement","grammar":"<h3>Second declension</h3><p>Masculine nouns often end in <b>-us</b> or <b>-er</b>; neuters in <b>-um</b>. The genitive singular is <b>-ī</b>.</p>\n<table class=\"gr\"><tr><th></th><th>servus (m.)</th><th>bellum (n.)</th></tr><tr><td>Nom. sg.</td><td>servus</td><td>bellum</td></tr><tr><td>Acc. sg.</td><td>servum</td><td>bellum</td></tr><tr><td>Nom./acc. pl.</td><td>servī / servōs</td><td>bella</td></tr><tr><td>Gen. sg.</td><td>servī</td><td>bellī</td></tr></table>\n<h3>Adjective agreement</h3><p>An adjective agrees with its noun in gender, number and case, not necessarily in visible ending: <b>poēta bonus</b>, <b>puella bona</b>, <b>bellum magnum</b>.</p>\n<div class=\"tip\"><b>Neuter rule:</b> nominative and accusative are identical; their plural ends in <b>-a</b>.</div>","examples":[["Servus bonus labōrat.","The good slave works."],["Dominus servum bonum laudat.","The master praises the good slave."],["Bellum magnum timēmus.","We fear a great war."],["Poēta bonus carmen scrībit.","The good poet writes a poem."]],"vocab":[["servus, -ī m.","slave / servant"],["dominus, -ī m.","master"],["amīcus, -ī m.","friend"],["puer, puerī m.","boy"],["ager, agrī m.","field"],["bellum, -ī n.","war"],["dōnum, -ī n.","gift"],["templum, -ī n.","temple"],["bonus, -a, -um","good"],["magnus, -a, -um","great / large"],["parvus, -a, -um","small"],["laudat","praises"]],"exercises":[{"t":"fill","q":"a great war: bellum magn___","a":["um"],"ex":"<b>bellum</b> is second-declension neuter, so the adjective takes the neuter singular <b>-um</b>. Adjectives agree in case, number and gender — never simply in ending."},{"t":"fill","q":"good poets: poētae bon___","a":["ī"],"ex":"<b>poētae</b> is masculine despite its first-declension ending, so the adjective is masculine plural <b>bonī</b>, not <i>bonae</i>. This is the agreement trap of the previous unit in reverse."},{"t":"mcq","q":"Neuter plural nominative normally ends in:","opts":["-a","-ī","-ōs","-ae"],"a":0,"ex":"Neuter nominative and accusative plural always end in <b>-a</b>, in every declension. It is also the rule that neuter nominative and accusative are identical to each other."},{"t":"fill","q":"the master (object): domin___","a":["um"],"ex":"Second-declension masculine accusative singular is <b>-um</b>: <b>dominus</b> → <b>dominum</b>. Note it looks identical to the neuter nominative, which is why gender must be learned with the noun."},{"t":"mcq","q":"Correct agreement with <i>poēta</i>:","opts":["poēta bonus","poēta bona","poētam bonum as subject","poēta bonum"],"a":0,"ex":"<b>poēta</b> is masculine, so it takes <b>bonus</b>. Agreement follows grammatical gender, and here that gender contradicts the ending."},{"t":"fill","q":"We fear great wars: Bella magna ___.","a":["timēmus"],"ex":"<b>timēmus</b> is 1st plural of the second conjugation (<i>timeō, timēre</i>), whose stem vowel <b>-ē-</b> is preserved before the ending."},{"t":"parse","form":"bella","q":"Identify the possibilities for <b>bella</b> (from <i>bellum</i>):","opts":["nominative or accusative plural","genitive singular only","ablative singular only","dative plural"],"a":0,"ex":"Neuter nominative and accusative are always identical, and in the plural they always end in <b>-a</b>. That rule holds in every declension."},{"t":"parse","form":"dominōrum","q":"Identify case and number:","opts":["genitive plural","dative plural","accusative plural","ablative plural"],"a":0,"ex":"Second-declension genitive plural is <b>-ōrum</b>, parallel to first-declension <b>-ārum</b>."},{"t":"trans","form":"puer bonus","q":"Put the whole phrase into the accusative singular:","a":["puerum bonum"],"ex":"Both words move together. An adjective agrees in case, number and gender, so it changes whenever its noun does."},{"t":"trans","form":"bellum magnum","q":"Put the whole phrase into the nominative plural:","a":["bella magna"],"ex":"Neuter plural <b>-a</b> on both words. Beware: <b>bella</b> here is not the feminine adjective 'beautiful'."},{"t":"pick","s":"Poēta bonus fābulās longās nārrat.","q":"Click the adjective that agrees with a masculine noun.","a":"bonus","ex":"<b>bonus</b> is masculine because <b>poēta</b> is masculine despite its first-declension ending. <b>longās</b> agrees with the feminine <b>fābulās</b>."},{"t":"pick","s":"Dominus servō librum dat.","q":"Click the word in the dative.","a":"servō","ex":"Second-declension dative singular is <b>-ō</b>, identical to the ablative. The verb <b>dat</b> tells you which one is meant."},{"t":"mcq","q":"<b>Vir</b> and <b>puer</b> belong to:","opts":["the second declension, with no -us in the nominative","the third declension","the first declension","no declension; they are irregular"],"a":0,"ex":"Their genitives <b>virī</b> and <b>puerī</b> place them firmly in the second declension. <b>Ager</b> behaves the same way but drops the <i>e</i>: <b>agrī</b>."},{"t":"mcq","q":"Which phrase is <i>not</i> correctly agreed?","opts":["bellum magnus","liber bonus","puella bona","bella magna"],"a":0,"ex":"<b>bellum</b> is neuter and needs <b>magnum</b>. Agreement errors like this are the fastest way to spot a mis-parsed sentence."},{"t":"fill","q":"of the good master (genitive singular): domin___ bon___","a":["ī ī","i i","ī, ī"],"ex":"<b>dominī bonī</b>. Both words take the second-declension genitive singular <b>-ī</b>."},{"t":"fill","q":"the small books (accusative plural): libr___ parv___","a":["ōs ōs","os os"],"ex":"<b>librōs parvōs</b>. <b>Liber</b> drops its <i>e</i> outside the nominative singular: stem <b>libr-</b>."}]},{"id":"f4","title":"Present active verbs","subtitle":"Person, number and flexible word order","grammar":"<h3>Present active endings</h3><table class=\"gr\"><tr><th></th><th>Ending</th><th>amāre</th></tr><tr><td>I</td><td>-ō / -m</td><td>amō</td></tr><tr><td>you sg.</td><td>-s</td><td>amās</td></tr><tr><td>he/she/it</td><td>-t</td><td>amat</td></tr><tr><td>we</td><td>-mus</td><td>amāmus</td></tr><tr><td>you pl.</td><td>-tis</td><td>amātis</td></tr><tr><td>they</td><td>-nt</td><td>amant</td></tr></table>\n<p>The four conjugations are recognised by the infinitive: <b>amāre, monēre, regere, audīre</b>. The verb ending usually makes a subject pronoun unnecessary.</p>\n<p>Latin word order is flexible, but prose often tends toward subject–object–verb. Emphasis and rhythm frequently alter that order.</p>","examples":[["Latīnam linguam discō.","I learn the Latin language."],["Librum legis.","You read a book."],["Puerī magistrum audiunt.","The boys listen to the teacher."],["Rōmānī urbem regunt.","The Romans rule the city."]],"vocab":[["amō, amāre","love"],["moneō, monēre","warn / advise"],["regō, regere","rule / guide"],["audiō, audīre","hear"],["legō, legere","read / choose"],["scrībō, scrībere","write"],["discō, discere","learn"],["videō, vidēre","see"],["veniō, venīre","come"],["lingua, -ae f.","language"],["liber, librī m.","book"],["magister, -trī m.","teacher"]],"exercises":[{"t":"fill","q":"I love: am___","a":["ō"],"ex":"First singular present active is <b>-ō</b>. In the first conjugation the stem vowel contracts into it: <i>amā- + ō</i> gives <b>amō</b>, not <i>amaō</i>."},{"t":"fill","q":"they hear: audi___","a":["unt"],"ex":"Fourth conjugation adds <b>-unt</b> with a linking <i>-u-</i>: <b>audiunt</b>. Compare third conjugation <b>regunt</b>, where no <i>-i-</i> appears."},{"t":"mcq","q":"The ending <b>-mus</b> means:","opts":["we","I","they","you singular"],"a":0,"ex":"<b>-mus</b> is the first person plural ending in every tense and both voices you will meet. Learning the six personal endings once saves memorising each tense separately."},{"t":"fill","q":"You read a book: Librum ___.","a":["legis"],"ex":"<b>legis</b> is 2nd singular of third-conjugation <i>legō, legere</i>. The stem vowel weakens to <i>-i-</i> before <b>-s</b>."},{"t":"mcq","q":"Latin normally needs a separate subject pronoun:","opts":["no, the verb ending often supplies it","always","only in poetry","only with nouns"],"a":0,"ex":"Latin is a pro-drop language: the personal ending is the subject. An explicit <b>tū</b> or <b>ego</b> is added only for emphasis or contrast."},{"t":"fill","q":"The Romans rule the city: Rōmānī urbem ___.","a":["regunt"],"ex":"<b>regunt</b>, third conjugation, 3rd plural. The subject <b>Rōmānī</b> is nominative plural and <b>urbem</b> accusative singular, so the roles are fixed regardless of order."},{"t":"parse","form":"audītis","q":"Identify person, number and tense:","opts":["2nd plural present","3rd plural present","2nd singular present","1st plural present"],"a":0,"ex":"<b>-tis</b> is always second person plural. Learn the six endings once and they serve you in every tense of the language."},{"t":"parse","form":"legimus","q":"Identify person, number and tense:","opts":["1st plural present","1st plural perfect","2nd plural present","3rd plural present"],"a":0,"ex":"<b>legimus</b> is present; the perfect of <b>legō</b> is <b>lēgimus</b>, with a long <i>ē</i>. In an unmacronised text only context separates them — a genuine ambiguity Roman readers lived with."},{"t":"trans","form":"amat","q":"Put into the first person singular:","a":["amo","amō"],"ex":"<b>amō</b>. The stem vowel <b>-ā-</b> is absorbed into the <b>-ō</b>, which is why the first person looks shorter than the rest."},{"t":"trans","form":"venīmus","q":"Put into the third person plural:","a":["veniunt"],"ex":"Fourth conjugation inserts <b>-u-</b> before <b>-nt</b>: <b>veniunt</b>. Third conjugation does not: <b>regunt</b>."},{"t":"pick","s":"Magister discipulōs docet et puerī librōs legunt.","q":"Click the verb with a plural subject.","a":"legunt","ex":"<b>legunt</b> is third plural, matching <b>puerī</b>. <b>docet</b> is singular, matching <b>magister</b>. Two clauses, joined by <b>et</b>, each with its own verb."},{"t":"pick","s":"Linguam Latīnam discimus.","q":"Click the word that supplies the subject 'we'.","a":"discimus","ex":"There is no separate pronoun: the ending <b>-mus</b> is the subject. This is why Latin sentences can be so short."},{"t":"mcq","q":"How do you tell which conjugation a verb belongs to?","opts":["from the present infinitive: -āre, -ēre, -ere, -īre","from the nominative","from its meaning","from the number of syllables"],"a":0,"ex":"<b>amāre, monēre, regere, audīre</b>. The difference between second <b>-ēre</b> and third <b>-ere</b> is vowel length alone, which is why dictionaries mark it."},{"t":"mcq","q":"Which form is <i>not</i> present tense?","opts":["scrīpsī","scrībis","scrībunt","scrībimus"],"a":0,"ex":"<b>scrīpsī</b> is perfect, 'I wrote'. The <b>-s-</b> of the perfect stem and the <b>-ī</b> ending mark it out."},{"t":"fill","q":"we write: scrīb___","a":["imus"],"ex":"<b>scrībimus</b>. In the third conjugation the stem vowel weakens to <i>-i-</i> before most endings, and to <i>-u-</i> before <b>-nt</b>."},{"t":"fill","q":"you (plural) hear: aud___","a":["ītis","itis"],"ex":"<b>audītis</b>. The fourth conjugation keeps its long <b>-ī-</b> almost everywhere, which is what distinguishes it from the third."}]},{"id":"f5","title":"Ablative & prepositions","subtitle":"Location, means and accompaniment","grammar":"<h3>Core ablative uses</h3><p><b>Means:</b> gladiō pugnat, “he fights with a sword.” <b>Manner:</b> magnā cūrā, “with great care.” <b>Accompaniment:</b> cum amīcō, “with a friend.” <b>Place where:</b> in urbe, “in the city.” <b>Separation:</b> ab urbe, “from the city.”</p>\n<p>Common accusative prepositions include <b>ad, per, post, ante, propter</b>. Common ablative prepositions include <b>ā/ab, cum, dē, ē/ex, sine, prō</b>.</p>\n<h3>in and sub</h3><p>With the ablative they usually answer “where?”; with the accusative, “to where?”: <b>in urbe</b> but <b>in urbem</b>.</p>","examples":[["Cum amīcō ambulō.","I walk with a friend."],["Gladiō pugnant.","They fight with a sword."],["In urbe habitat.","He lives in the city."],["In urbem venit.","He comes into the city."],["Sine aquā vīvere nōn possumus.","We cannot live without water."]],"vocab":[["cum + abl.","with"],["sine + abl.","without"],["ā/ab + abl.","from / by"],["ē/ex + abl.","out of"],["dē + abl.","down from / about"],["in + abl.","in / on"],["in + acc.","into / onto"],["ad + acc.","to / toward"],["per + acc.","through"],["gladius, -ī m.","sword"],["urbs, urbis f.","city"],["ambulō","walk"]],"exercises":[{"t":"mcq","q":"“Into the city” is:","opts":["in urbem","in urbe","ab urbe","cum urbe"],"a":0,"ex":"<b>in</b> takes the accusative for motion into and the ablative for rest inside. <b>in urbem</b> = into the city; <b>in urbe</b> = in the city."},{"t":"fill","q":"with a friend: cum amīc___","a":["ō"],"ex":"<b>cum</b> always governs the ablative, so second-declension <b>amīcus</b> becomes <b>amīcō</b>. Use <b>cum</b> for accompaniment, never for a tool."},{"t":"mcq","q":"Ablative of means usually uses:","opts":["no preposition","cum always","ad","per"],"a":0,"ex":"Ablative of means takes no preposition at all: <b>gladiō</b> = with a sword. Adding <b>cum</b> would mean the sword accompanied you as a companion."},{"t":"fill","q":"without water: sine aqu___","a":["ā"],"ex":"<b>sine</b> governs the ablative: <b>aqua</b> → <b>aquā</b>. The macron is the only written difference from the nominative, which is why quantities matter."},{"t":"fill","q":"They fight with a sword: Gladiō ___.","a":["pugnant"],"ex":"<b>pugnant</b> is 3rd plural, and the bare ablative <b>gladiō</b> is the instrument. This is the pattern to recognise: an unaccompanied ablative usually answers 'by what means?'"},{"t":"mcq","q":"<i>ad</i> normally governs:","opts":["accusative","ablative","genitive","dative"],"a":0,"ex":"<b>ad</b> governs the accusative and expresses motion toward. Contrast <b>ab</b> and <b>ex</b>, which govern the ablative and express motion away."},{"t":"parse","form":"gladiō","q":"In <i>Mīles gladiō pugnat</i>, <b>gladiō</b> is:","opts":["ablative of means","dative of reference","ablative of accompaniment","genitive of description"],"a":0,"ex":"A bare ablative with no preposition, denoting a thing, is almost always the means. Adding <b>cum</b> would make the sword a companion rather than a tool."},{"t":"parse","form":"cum amīcīs","q":"This phrase expresses:","opts":["accompaniment","means","place where","time when"],"a":0,"ex":"<b>cum</b> plus the ablative is for people you are with. For instruments Latin uses the ablative alone."},{"t":"trans","form":"in urbe","q":"Change it to mean 'into the city':","a":["in urbem"],"ex":"Same preposition, different case, opposite idea: <b>in</b> plus ablative is rest inside, <b>in</b> plus accusative is motion into. <b>Sub</b> works the same way."},{"t":"trans","form":"ex agrō","q":"Change it to mean 'to the field':","a":["ad agrum"],"ex":"<b>ex</b> plus ablative is motion out of; <b>ad</b> plus accusative is motion toward. Prepositions of motion away take the ablative, those of motion toward the accusative."},{"t":"pick","s":"Puella cum amīcā per viam ad templum ambulat.","q":"Click the word governed by <b>per</b>.","a":"viam","ex":"<b>per</b> takes the accusative: through the street. Three prepositional phrases stack here, and each one's case tells you which preposition owns it."},{"t":"pick","s":"Agricola aquam ex fluviō portat.","q":"Click the word in the ablative.","a":"fluviō","ex":"<b>ex</b> governs the ablative. <b>aquam</b> is the accusative object of <b>portat</b>."},{"t":"mcq","q":"Which preposition takes the ablative?","opts":["sine","ad","per","trāns"],"a":0,"ex":"<b>sine, ā/ab, ex/ē, dē, cum, prō, prae</b> take the ablative. <b>ad, per, trāns, ante, post, inter, apud</b> take the accusative."},{"t":"mcq","q":"<i>Rōmā</i> without a preposition most likely means:","opts":["from Rome","to Rome","in Rome","of Rome"],"a":0,"ex":"Names of towns drop the preposition: <b>Rōmā</b> from Rome, <b>Rōmam</b> to Rome, <b>Rōmae</b> at Rome. That last is a surviving locative case."},{"t":"fill","q":"out of the water: ___ aquā","a":["ex","e","ē"],"ex":"<b>ex aquā</b>. Before a consonant Latin often shortens <b>ex</b> to <b>ē</b>, exactly as <b>ab</b> shortens to <b>ā</b>."},{"t":"fill","q":"They walk through the gate: Per port___ ambulant.","a":["am"],"ex":"<b>per portam</b> — accusative after <b>per</b>."}]},{"id":"f6","title":"sum, questions & possession","subtitle":"Being, having and asking","grammar":"<h3>sum — to be</h3><table class=\"gr\"><tr><td>sum</td><td>sumus</td></tr><tr><td>es</td><td>estis</td></tr><tr><td>est</td><td>sunt</td></tr></table>\n<p>Latin often expresses possession with the dative: <b>Mihi liber est</b>, literally “A book is to me,” meaning “I have a book.”</p>\n<h3>Questions</h3><p><b>-ne</b> asks a neutral yes/no question: <b>Venitne?</b> <b>nōnne</b> expects yes; <b>num</b> expects no. Question words include <b>quis, quid, ubi, cūr, quōmodo, quandō</b>.</p>","examples":[["Rōma magna est.","Rome is great."],["Mihi duo librī sunt.","I have two books."],["Ubi est forum?","Where is the forum?"],["Venitne magister?","Is the teacher coming?"],["Nōnne Latīnam linguam amās?","Surely you love Latin?"]],"vocab":[["sum, esse","be"],["quis?","who?"],["quid?","what?"],["ubi?","where?"],["cūr?","why?"],["quōmodo?","how?"],["quandō?","when?"],["forum, -ī n.","forum / marketplace"],["mihi","to/for me"],["tibi","to/for you"],["duo / duae","two"],["possum, posse","be able"]],"exercises":[{"t":"fill","q":"we are: ___","a":["sumus"],"ex":"<b>sum</b> is irregular; its first plural is <b>sumus</b>. It is worth learning the whole present out loud as a set: <i>sum, es, est, sumus, estis, sunt</i>."},{"t":"fill","q":"they are: ___","a":["sunt"],"ex":"<b>sunt</b>, 3rd plural. It also does duty for 'there are': <b>sunt multī</b> = there are many."},{"t":"mcq","q":"<i>Mihi liber est</i> means:","opts":["I have a book","The book is me","I am a book","The book is mine only emphatically"],"a":0,"ex":"Latin has no common verb for 'have' in this construction. The dative of the possessor plus <b>est</b> is the idiom: literally 'there is a book to me'."},{"t":"fill","q":"Where is the forum? ___ est forum?","a":["Ubi"],"ex":"<b>Ubi</b> asks 'where', with no motion implied. <b>Quō</b> asks where to, and <b>unde</b> where from."},{"t":"mcq","q":"A neutral yes/no question may use:","opts":["-ne","nōnne only","num only","quod"],"a":0,"ex":"Enclitic <b>-ne</b> attached to the first word asks a neutral question. <b>nōnne</b> expects the answer yes and <b>num</b> expects no — they are not interchangeable."},{"t":"fill","q":"Can we? ___ne?","a":["Possumus"],"ex":"<b>possumus</b> is <i>pos- + sumus</i>: <b>possum</b> is a compound of <b>sum</b>, and the prefix assimilates to <i>pot-/pos-</i> depending on what follows."},{"t":"parse","form":"estis","q":"Identify person and number:","opts":["2nd plural","3rd plural","2nd singular","1st plural"],"a":0,"ex":"<b>estis</b>, 'you (plural) are'. <b>sum</b> is irregular but its endings still follow the familiar personal pattern: <b>-s, -t, -mus, -tis, -nt</b>."},{"t":"parse","form":"mihi","q":"<b>mihi</b> is:","opts":["dative singular of ego","accusative singular of ego","ablative singular of ego","genitive singular of ego"],"a":0,"ex":"<b>ego, meī, mihi, mē, mē</b>. The dative is what makes the possession idiom work: <b>mihi liber est</b>."},{"t":"trans","form":"est","q":"Put into the plural:","a":["sunt"],"ex":"<b>est</b> → <b>sunt</b>. It can also mean 'there is' → 'there are'."},{"t":"trans","form":"Puella bona est.","q":"Rewrite with a plural subject:","a":["Puellae bonae sunt","puellae bonae sunt"],"ex":"All three words change: subject, predicate adjective and verb. A predicate adjective after <b>sum</b> agrees with the subject in the nominative, never in the accusative."},{"t":"pick","s":"Estne magister in villā?","q":"Click the word carrying the question marker.","a":"Estne","ex":"The enclitic <b>-ne</b> attaches to the first word, which is usually the one being questioned. It asks neutrally, expecting no particular answer."},{"t":"pick","s":"Agricolae multī equī sunt.","q":"Click the word in the dative.","a":"Agricolae","ex":"Dative of the possessor: literally 'to the farmer there are many horses' — the farmer has many horses. <b>equī</b> is the grammatical subject."},{"t":"mcq","q":"<i>Nōnne vidēs?</i> expects the answer:","opts":["yes","no","either","it is not a question"],"a":0,"ex":"<b>Nōnne</b> expects yes, <b>num</b> expects no, plain <b>-ne</b> expects nothing. English does this with tone of voice; Latin does it with a particle."},{"t":"mcq","q":"<b>possum</b> is formed from:","opts":["pot- (able) plus sum","por- plus sum","pos- plus habeō","an unrelated root"],"a":0,"ex":"<b>pot-</b> assimilates to <b>pos-</b> before <i>s</i>: <b>possum, potes, potest, possumus, potestis, possunt</b>. The alternation follows a sound rule, not caprice."},{"t":"fill","q":"You (sg.) are a good poet: ___ poēta bonus.","a":["es"],"ex":"<b>es</b>, second singular. Note that <b>poēta bonus</b> is nominative: a predicate noun after <b>sum</b> stays in the same case as the subject."},{"t":"fill","q":"The girls have roses (dative of possessor): Puell___ rosae sunt.","a":["is","īs"],"ex":"<b>Puellīs rosae sunt</b>. The possessor goes into the dative and the thing possessed is the subject."}]}]},{"id":"morph","short":"II","icon":"Ⅱ","label":"Stage II — Core morphology","tagline":"The forms authentic prose assumes","desc":"Third declension, adjectives, pronouns, past and future tenses, and the passive system.","units":[{"id":"m1","title":"Third declension nouns","subtitle":"Use the genitive to find the stem","grammar":"<h3>Dictionary form matters</h3><p>Third-declension nominatives vary widely. The genitive singular ends in <b>-is</b> and reveals the stem: <b>rēx, rēgis</b>; <b>corpus, corporis</b>; <b>cīvitās, cīvitātis</b>.</p>\n<table class=\"gr\"><tr><th></th><th>M./F.</th><th>Neuter</th></tr><tr><td>Acc. sg.</td><td>-em</td><td>same as nom.</td></tr><tr><td>Gen. sg.</td><td>-is</td><td>-is</td></tr><tr><td>Nom. pl.</td><td>-ēs</td><td>-a / -ia</td></tr><tr><td>Gen. pl.</td><td>-um / -ium</td><td>-um / -ium</td></tr></table>\n<p>Some i-stems have <b>-ium</b> in the genitive plural and neuter <b>-ia</b>.</p>","examples":[["Rēx cīvitātem regit.","The king rules the state."],["Mīlitēs urbem dēfendunt.","The soldiers defend the city."],["Nōmen rēgis nōtum est.","The king’s name is known."],["Corpora hominum mortālia sunt.","Human bodies are mortal."]],"vocab":[["rēx, rēgis m.","king"],["mīles, mīlitis m.","soldier"],["cīvitās, -ātis f.","state / citizenship"],["urbs, urbis f.","city"],["nōmen, nōminis n.","name"],["corpus, corporis n.","body"],["homo, hominis m.","human being"],["pāx, pācis f.","peace"],["lēx, lēgis f.","law"],["virtūs, -ūtis f.","courage / excellence"],["dēfendō","defend"],["mortālis, -e","mortal"]],"exercises":[{"t":"fill","q":"the king (genitive): rēg___","a":["is"],"ex":"The genitive singular of the third declension is <b>-is</b>: <b>rēgis</b>. Strip that ending and you have the stem <b>rēg-</b>, on which every other case is built."},{"t":"fill","q":"soldiers (nom. plural): mīlit___","a":["ēs"],"ex":"Nominative plural of a masculine or feminine third-declension noun is <b>-ēs</b>: <b>mīlitēs</b>. It is identical to the accusative plural, so the verb usually resolves the ambiguity."},{"t":"mcq","q":"The stem of <i>corpus, corporis</i> is:","opts":["corpor-","corp-","corpus-","corpo-"],"a":0,"ex":"The nominative <b>corpus</b> hides the stem; the genitive <b>corporis</b> reveals <b>corpor-</b>. This is exactly why dictionaries list the genitive."},{"t":"fill","q":"bodies (nom./acc. pl.): corpor___","a":["a"],"ex":"Neuter plural is <b>-a</b> here as everywhere: <b>corpora</b>, nominative and accusative alike. Note the stem change from <b>corpus</b>."},{"t":"fill","q":"The soldiers defend the city: Mīlitēs urbem ___.","a":["dēfendunt"],"ex":"<b>dēfendunt</b>, 3rd plural. Both <b>mīlitēs</b> and the third-declension <b>urbem</b> come from this declension, whose accusative singular <b>-em</b> is a reliable object marker."},{"t":"mcq","q":"Third-declension genitive singular ends in:","opts":["-is","-ī","-ae","-ūs"],"a":0,"ex":"<b>-is</b> in the genitive singular is the signature of the third declension, as against <b>-ae</b> (first) and <b>-ī</b> (second). Identifying the declension is the first step to identifying the case."},{"t":"parse","form":"rēgibus","q":"Identify the possibilities:","opts":["dative or ablative plural","genitive plural","accusative plural","dative singular"],"a":0,"ex":"<b>-ibus</b> serves as both dative and ablative plural throughout the third declension. Latin never separates those two cases in the plural."},{"t":"parse","form":"corpore","q":"Identify case and number:","opts":["ablative singular","dative singular","nominative singular","genitive singular"],"a":0,"ex":"Third-declension ablative singular is <b>-e</b> in consonant stems. The stem <b>corpor-</b> comes from the genitive <b>corporis</b>, not from the nominative <b>corpus</b>."},{"t":"trans","form":"mīles","q":"Give the genitive singular:","a":["mīlitis","militis"],"ex":"<b>mīlitis</b>. The nominative hides a <i>t</i> that the genitive restores — which is exactly why you must learn both."},{"t":"trans","form":"urbem","q":"Put into the plural, keeping the case:","a":["urbēs","urbes"],"ex":"Accusative singular <b>-em</b> becomes accusative plural <b>-ēs</b>, which is also the nominative plural. Third-declension plurals are ambiguous in a way the singulars are not."},{"t":"pick","s":"Rēx mīlitibus urbis pecūniam dat.","q":"Click the word in the genitive.","a":"urbis","ex":"<b>urbis</b>, 'of the city', depends on <b>mīlitibus</b> — the soldiers of the city. <b>mīlitibus</b> itself is dative, the indirect object."},{"t":"pick","s":"Nōmina rēgum in librō sunt.","q":"Click the neuter plural.","a":"Nōmina","ex":"<b>nōmina</b> is nominative plural of <b>nōmen</b>. Neuter plural in <b>-a</b> again, and here it is the subject of <b>sunt</b>."},{"t":"mcq","q":"Why can't you predict a third-declension noun's stem from its nominative?","opts":["sound changes reshaped the nominative, and the genitive preserves the stem","the nominative is randomly assigned","third-declension nouns have no stem","the stem changes in every case"],"a":0,"ex":"<b>rēx</b> is <i>rēg-s</i> with the <i>g</i> and <i>s</i> fused; <b>corpus</b> shows an old <i>s</i> that became <i>r</i> between vowels in <b>corporis</b>. The genitive is the reliable witness."},{"t":"mcq","q":"Which noun is neuter?","opts":["nōmen, nōminis","rēx, rēgis","mīles, mīlitis","urbs, urbis"],"a":0,"ex":"Nouns in <b>-men</b> are regularly neuter, with genitive <b>-minis</b>: <b>nōmen, flūmen, carmen, agmen</b>."},{"t":"fill","q":"of the soldiers (genitive plural): mīlit___","a":["um"],"ex":"<b>mīlitum</b>. Consonant stems take <b>-um</b>; i-stems such as <b>cīvis</b> take <b>-ium</b>."},{"t":"fill","q":"The king defends the city: Rēx urb___ dēfendit.","a":["em"],"ex":"<b>urbem</b>, accusative singular. The <b>-em</b> ending is one of the most reliable object markers in Latin."}]},{"id":"m2","title":"Third-declension adjectives & comparison","subtitle":"Two-termination adjectives and degrees","grammar":"<h3>Third-declension adjectives</h3><p>Many use two nominative forms: <b>fortis, forte</b> (m./f., n.); <b>ācer, ācris, ācre</b> uses three. Their ablative singular is commonly <b>-ī</b>, neuter plural <b>-ia</b>, genitive plural <b>-ium</b>.</p>\n<h3>Comparison</h3><p>Comparative: stem + <b>-ior</b> (m./f.), <b>-ius</b> (n.); superlative: stem + <b>-issimus</b>. Irregular: <b>bonus, melior, optimus</b>; <b>malus, peior, pessimus</b>; <b>magnus, maior, maximus</b>.</p>\n<p>The standard of comparison may use <b>quam</b> with the same case or the ablative alone.</p>","examples":[["Mīles fortis pugnat.","The brave soldier fights."],["Consilium utile est.","The plan is useful."],["Caesar Pompeio potentior erat.","Caesar was more powerful than Pompey."],["Haec via brevissima est.","This road is the shortest."]],"vocab":[["fortis, forte","brave / strong"],["ūtilis, -e","useful"],["facilis, -e","easy"],["difficilis, -e","difficult"],["celer, celeris, celere","swift"],["maior, maius","greater"],["minor, minus","smaller"],["melior, melius","better"],["optimus, -a, -um","best"],["pessimus, -a, -um","worst"],["brevissimus","shortest"],["potēns, potentis","powerful"]],"exercises":[{"t":"fill","q":"a useful plan: consilium util___","a":["e"],"ex":"<b>ūtilis</b> is a two-termination adjective: <b>-is</b> for masculine and feminine, <b>-e</b> for neuter. <b>Cōnsilium</b> is neuter, so <b>ūtile</b>."},{"t":"fill","q":"brave soldiers: mīlitēs fort___","a":["ēs"],"ex":"<b>fortis</b> in the masculine plural nominative is <b>fortēs</b>, matching <b>mīlitēs</b>. Third-declension adjectives follow the i-stem pattern, not the pattern of <i>rēx</i>."},{"t":"mcq","q":"Comparative neuter of <i>maior</i>:","opts":["maius","maior","maximum","magnius"],"a":0,"ex":"Comparatives decline as third-declension consonant stems, with the neuter differing: <b>maior</b> (m./f.) but <b>maius</b> (n.). Compare <b>melior / melius</b>."},{"t":"fill","q":"the best road: via optim___","a":["a"],"ex":"<b>optima</b> is the superlative of <b>bonus</b> and is irregular; it agrees with feminine <b>via</b>. Learn <i>bonus, melior, optimus</i> as a set alongside <i>malus, peior, pessimus</i>."},{"t":"mcq","q":"Superlatives usually contain:","opts":["-issim-","-ior-","-nt-","-bil-"],"a":0,"ex":"Regular superlatives insert <b>-issim-</b>: <b>fortissimus</b>, <b>clārissimus</b>. Adjectives in <b>-er</b> use <b>-rim-</b> and those in <b>-lis</b> often <b>-lim-</b>."},{"t":"fill","q":"Caesar was greater than Pompey: Caesar Pompeio ___ erat.","a":["maior"],"ex":"<b>maior</b> is the comparative of <b>magnus</b>. <b>Pompeiō</b> is ablative of comparison, an alternative to <b>quam Pompeius</b> in the nominative."},{"t":"parse","form":"fortiōrem","q":"Identify case, number and degree:","opts":["accusative singular comparative","accusative plural comparative","nominative singular superlative","ablative singular comparative"],"a":0,"ex":"Comparatives decline as third-declension consonant stems: <b>fortior, fortiōris, fortiōrī, fortiōrem, fortiōre</b>."},{"t":"parse","form":"omnia","q":"Identify case, number and gender:","opts":["neuter nominative or accusative plural","feminine nominative singular","masculine accusative plural","neuter genitive plural"],"a":0,"ex":"<b>omnis, omne</b> is an i-stem adjective, so its neuter plural is <b>omnia</b>, not <b>omne</b>. Used alone it means 'all things, everything'."},{"t":"trans","form":"fortis","q":"Give the neuter nominative singular:","a":["forte"],"ex":"Two-termination adjectives have one form for masculine and feminine, another for neuter: <b>fortis / forte</b>, <b>omnis / omne</b>, <b>ūtilis / ūtile</b>."},{"t":"trans","form":"clārus","q":"Give the superlative, masculine nominative singular:","a":["clārissimus","clarissimus"],"ex":"<b>clārissimus</b>, formed with <b>-issimus</b> on the stem. Superlatives then decline like <b>bonus</b>, in the first and second declension."},{"t":"pick","s":"Mīlitēs fortiōrēs urbem celerius cēpērunt.","q":"Click the comparative adverb.","a":"celerius","ex":"The comparative adverb is identical to the comparative neuter singular: <b>celerius</b>, 'rather quickly, more quickly'. <b>fortiōrēs</b> is the adjective agreeing with <b>Mīlitēs</b>."},{"t":"pick","s":"Hic liber ūtilior est quam ille.","q":"Click the word that introduces the comparison.","a":"quam","ex":"<b>quam</b> plus the same case is one way to compare; the bare ablative — <b>illō</b> here — is the other. They mean the same thing."},{"t":"mcq","q":"<b>facilis</b> forms its superlative as:","opts":["facillimus","facilissimus","facilior","maximē facilis"],"a":0,"ex":"Six adjectives in <b>-lis</b> — <b>facilis, difficilis, similis, dissimilis, gracilis, humilis</b> — take <b>-limus</b>. Everything else in <b>-lis</b> is regular."},{"t":"mcq","q":"<b>plūs</b> in the singular is:","opts":["a neuter noun taking a genitive","a normal adjective","an adverb only","indeclinable"],"a":0,"ex":"<b>plūs vīnī</b> is literally 'more of wine'. In the plural <b>plūrēs, plūra</b> behaves as an ordinary adjective."},{"t":"fill","q":"the bravest soldiers (nom. pl.): mīlitēs fort___","a":["issimī","issimi"],"ex":"<b>fortissimī</b>. Note the double <i>s</i>, and note that the superlative declines like <b>bonus</b> even though <b>fortis</b> does not."},{"t":"fill","q":"Complete the irregular set — bonus, melior, ___","a":["optimus"],"ex":"<b>bonus, melior, optimus</b>; also <b>malus, peior, pessimus</b>; <b>magnus, maior, maximus</b>; <b>parvus, minor, minimus</b>. Learn them as four sets."}]},{"id":"m3","title":"Pronouns & demonstratives","subtitle":"Track reference without losing the sentence","grammar":"<p><b>is, ea, id</b> often means “he/she/it” or “that.” <b>hic, haec, hoc</b> points to what is near the speaker or present in discourse; <b>ille, illa, illud</b> to what is more remote or notable. <b>ipse</b> is intensive (“himself”); <b>idem</b> means “the same.”</p>\n<p>Pronouns preserve older genitives in <b>-īus</b> and datives in <b>-ī</b>: <b>eius, eī; huius, huic; illīus, illī</b>.</p>\n<div class=\"tip\">In reading, write the antecedent mentally: <b>is</b> = “that man just mentioned,” not merely “he.”</div>","examples":[["Hic liber meus est; ille tuus.","This book is mine; that one is yours."],["Caesar ipse vēnit.","Caesar himself came."],["Eius consilium probāmus.","We approve his/her plan."],["Eādem diē profectī sunt.","They set out on the same day."]],"vocab":[["is, ea, id","he / she / it; that"],["hic, haec, hoc","this"],["ille, illa, illud","that / famous"],["ipse, ipsa, ipsum","self / very"],["idem, eadem, idem","same"],["alius, alia, aliud","other / another"],["alter, altera, alterum","the other (of two)"],["eius","his / her / its"],["huic","to this"],["illō","by/with that"],["meus, -a, -um","my"],["tuus, -a, -um","your"]],"exercises":[{"t":"fill","q":"Caesar himself: Caesar ___","a":["ipse"],"ex":"<b>ipse</b> is the intensive pronoun, 'himself, in person'. It emphasises a noun; it does not make the sentence reflexive."},{"t":"mcq","q":"<i>eius</i> means:","opts":["his/her/its (of someone else)","his own","to him","with him"],"a":0,"ex":"<b>eius</b> is the genitive of <b>is, ea, id</b> and refers to someone other than the subject. For 'his own', referring back to the subject, Latin uses <b>suus</b>."},{"t":"fill","q":"on the same day: eādem di___","a":["ē"],"ex":"<b>diēs</b> is fifth declension, ablative <b>diē</b>. <b>Eādem</b> is the feminine ablative of <b>īdem</b>, agreeing with <b>diē</b> in its feminine use for a particular day."},{"t":"mcq","q":"<i>hic</i> normally points to:","opts":["what is near/present","only a dead person","the future","a question"],"a":0,"ex":"The three demonstratives are deictic: <b>hic</b> is near the speaker, <b>iste</b> near the person addressed, <b>ille</b> remote. <b>Ille</b> also picks up 'that famous'."},{"t":"fill","q":"that famous man: ___ vir","a":["ille"],"ex":"<b>ille</b> often carries the sense 'that well-known one'. It later gave rise to the definite article in the Romance languages."},{"t":"mcq","q":"The genitive singular of <i>hic</i> is:","opts":["huius","hī","hōc","hicī"],"a":0,"ex":"<b>hic, haec, hoc</b> has the genitive <b>huius</b> for all three genders, and dative <b>huic</b>. These pronominal genitives in <b>-īus</b> and datives in <b>-ī</b> recur in <b>ille</b>, <b>ipse</b>, <b>tōtus</b> and <b>sōlus</b>."},{"t":"parse","form":"eōrum","q":"Identify:","opts":["genitive plural of is/id","dative plural","accusative plural","ablative plural"],"a":0,"ex":"<b>eōrum</b> means 'of them, their'. Where the possessor is the subject of the sentence, Latin uses <b>suus</b> instead."},{"t":"parse","form":"hōc","q":"Which is <i>not</i> a possible reading of <b>hōc</b>?","opts":["nominative masculine singular","ablative masculine singular","ablative neuter singular","it can be an adverb, 'for this reason'"],"a":0,"ex":"The nominative masculine is <b>hic</b> with a short <i>i</i>; <b>hoc</b> is neuter nominative and accusative, and <b>hōc</b> with a long <i>ō</i> is ablative."},{"t":"trans","form":"is","q":"Give the accusative singular, all three genders:","a":["eum eam id","eum, eam, id"],"ex":"<b>eum, eam, id</b>. The neuter accusative matches its nominative, as always."},{"t":"trans","form":"ille","q":"Give the genitive singular:","a":["illīus","illius"],"ex":"<b>illīus</b> for all three genders. The pronominal genitive in <b>-īus</b> and dative in <b>-ī</b> recur in <b>ipse, tōtus, sōlus, ūnus, alter, uter, nūllus</b>."},{"t":"pick","s":"Caesar mīlitēs suōs laudāvit, sed eōrum ducem nōn laudāvit.","q":"Click the word referring to someone other than Caesar.","a":"eōrum","ex":"<b>suōs</b> points back to the subject Caesar; <b>eōrum</b> deliberately does not. English 'his' is ambiguous where Latin is precise."},{"t":"pick","s":"Ipse rēx hanc epistulam scrīpsit.","q":"Click the intensive pronoun.","a":"Ipse","ex":"<b>ipse</b> emphasises: the king himself, in person. It is not reflexive — that is <b>sē</b> — and not demonstrative."},{"t":"mcq","q":"<b>sē</b> differs from <b>eum</b> because:","opts":["sē refers back to the subject of its clause","sē is plural","sē is nominative","there is no difference"],"a":0,"ex":"<b>Caesar sē laudat</b> — Caesar praises himself. <b>Caesar eum laudat</b> — Caesar praises someone else."},{"t":"mcq","q":"<b>īdem</b> is built from:","opts":["is plus the suffix -dem","īre plus dem","a separate root","hic plus dem"],"a":0,"ex":"<b>is + dem</b> gives <b>īdem, eadem, idem</b>, 'the same'. The <i>m</i> before <i>d</i> becomes <i>n</i>: <b>eundem</b>, <b>eōrundem</b>."},{"t":"fill","q":"to this man (dative singular): ___","a":["huic"],"ex":"<b>huic</b> serves all three genders. Its genitive counterpart is <b>huius</b>."},{"t":"fill","q":"He praises his own book (subject's own): Librum ___ laudat.","a":["suum"],"ex":"<b>suum</b>, reflexive possessive, agreeing with <b>librum</b>. <b>eius librum</b> would mean someone else's book."}]},{"id":"m4","title":"Imperfect & future","subtitle":"Ongoing past and anticipated action","grammar":"<h3>Imperfect</h3><p>Present stem + <b>-bā-</b> + personal endings: <b>amābam, monēbās</b>. Third and fourth conjugations use <b>-ēbā-</b>: <b>regēbat, audiēbant</b>. It expresses ongoing, repeated or attempted past action.</p>\n<h3>Future</h3><p>First and second conjugations use <b>-bō, -bis, -bit...</b>. Third and fourth use <b>-am, -ēs, -et...</b>: <b>regam, regiēs, regent</b>; <b>audiam</b>.</p>","examples":[["Puer in hortō lūdēbat.","The boy was playing in the garden."],["Cotīdiē librōs legēbāmus.","We used to read books every day."],["Crās ad urbem veniēs.","Tomorrow you will come to the city."],["Rōmānī hostēs vincent.","The Romans will defeat the enemy."]],"vocab":[["lūdō, lūdere","play"],["hortus, -ī m.","garden"],["cotīdiē","every day"],["crās","tomorrow"],["heri","yesterday"],["semper","always"],["saepe","often"],["tum","then"],["hostis, -is m./f.","enemy"],["vincō, vincere","conquer"],["manēō, manēre","remain"],["agō, agere","do / drive"]],"exercises":[{"t":"fill","q":"I was loving: amā___","a":["bam"],"ex":"The imperfect sign is <b>-bā-</b> plus a personal ending: <b>amā-bā-m</b>. It is one of the most regular tenses in the language."},{"t":"fill","q":"they were hearing: audi___","a":["ēbant"],"ex":"Third and fourth conjugations insert <b>-ē-</b> before the marker: <b>audi-ē-bant</b>, <b>reg-ē-bant</b>. First and second use plain <b>-bā-</b>."},{"t":"mcq","q":"The imperfect commonly expresses:","opts":["ongoing or habitual past","completed past only","future command","present fact"],"a":0,"ex":"The imperfect views the past as unfinished: was doing, used to do, kept doing, began to do. The perfect, by contrast, reports the act as a completed whole."},{"t":"fill","q":"you will rule: reg___","a":["ēs"],"ex":"Third and fourth conjugations form the future in <b>-am, -ēs, -et</b>: <b>regēs</b>. First and second use <b>-bō, -bis, -bit</b> — mixing the two is the commonest error here."},{"t":"fill","q":"The Romans will conquer: Rōmānī ___.","a":["vincent"],"ex":"<b>vincent</b> is third conjugation, so future is <b>-ent</b>. Watch the contrast with the present <b>vincunt</b>; a single vowel distinguishes them."},{"t":"mcq","q":"Future of <i>amō</i>, 1st singular:","opts":["amābō","amābam","amem","amāvī"],"a":0,"ex":"<b>amābō</b> uses the first-conjugation future in <b>-bō</b>. <b>amābam</b> is imperfect, <b>amem</b> present subjunctive, <b>amāvī</b> perfect."},{"t":"parse","form":"regēbāmus","q":"Identify person, number and tense:","opts":["1st plural imperfect","1st plural future","1st plural present","2nd plural imperfect"],"a":0,"ex":"The marker <b>-bā-</b> is the imperfect, and <b>-mus</b> is first plural. Third conjugation inserts <b>-ē-</b> first: <b>reg-ē-bā-mus</b>."},{"t":"parse","form":"audiet","q":"Identify tense:","opts":["future","present","imperfect","perfect"],"a":0,"ex":"Third and fourth conjugations form the future with <b>-am, -ēs, -et</b>. Compare the present <b>audit</b>: one vowel apart, a whole tense apart."},{"t":"trans","form":"amat","q":"Put into the imperfect:","a":["amābat","amabat"],"ex":"<b>amābat</b>, 'he was loving, he used to love'. Add <b>-bā-</b> to the present stem and keep the same personal ending."},{"t":"trans","form":"regunt","q":"Put into the future:","a":["regent"],"ex":"<b>regent</b>. Do not write <i>regēbunt</i> — the <b>-bō/-bis/-bit</b> future belongs only to the first and second conjugations."},{"t":"pick","s":"Rōmānī urbem oppugnābant sed nōn capient.","q":"Click the future verb.","a":"capient","ex":"<b>capient</b> is future ('they will not take it'), against imperfect <b>oppugnābant</b> ('they were attacking'). The tense contrast is the whole point of the sentence."},{"t":"pick","s":"Erat in oppidō magister quī puerōs docēbat.","q":"Click the imperfect of <b>sum</b>.","a":"Erat","ex":"<b>sum</b> has no <b>-bā-</b>: its imperfect is <b>eram, erās, erat</b>. Note the future <b>erō, eris, erit</b> is only one vowel away."},{"t":"mcq","q":"Which is the future of <b>sum</b>, 3rd singular?","opts":["erit","erat","est","esset"],"a":0,"ex":"<b>erit</b> is future, <b>erat</b> imperfect, <b>esset</b> imperfect subjunctive. These three are confused constantly; the vowel is the whole difference."},{"t":"mcq","q":"The imperfect is the natural tense for:","opts":["description, background and repeated action","a single completed event","a future promise","a general truth"],"a":0,"ex":"Latin narrative alternates: imperfects set the scene, perfects deliver the events. Reading tense as structure is a real skill."},{"t":"fill","q":"they were coming: veni___","a":["ēbant","ebant"],"ex":"<b>veniēbant</b>. The fourth conjugation inserts <b>-ē-</b> before <b>-bā-</b>, exactly as the third does."},{"t":"fill","q":"you (sg.) will love: amā___","a":["bis"],"ex":"<b>amābis</b>. First and second conjugations: <b>-bō, -bis, -bit, -bimus, -bitis, -bunt</b>."}]},{"id":"m5","title":"The perfect system","subtitle":"Completed action and anterior time","grammar":"<h3>Principal parts</h3><p>Learn verbs as <b>amō, amāre, amāvī, amātum</b>. The third principal part supplies the perfect active stem.</p>\n<table class=\"gr\"><tr><th>Tense</th><th>Formation</th><th>Example</th></tr><tr><td>Perfect</td><td>perfect stem + ī, istī, it...</td><td>amāvī</td></tr><tr><td>Pluperfect</td><td>perfect stem + eram...</td><td>amāveram</td></tr><tr><td>Future perfect</td><td>perfect stem + erō...</td><td>amāverō</td></tr></table>\n<p>The perfect may be translated “I loved” or “I have loved,” depending on context.</p>","examples":[["Caesar Galliam vīcit.","Caesar conquered Gaul."],["Litterās scrīpsimus.","We wrote / have written the letter."],["Ubi vēnerat, amīcum vīdit.","When he had arrived, he saw his friend."],["Cum librum lēgeris, intellegēs.","When you have read the book, you will understand."]],"vocab":[["amō, amāre, amāvī, amātum","love"],["videō, vidēre, vīdī, vīsum","see"],["scrībō, scrībere, scrīpsī, scrīptum","write"],["legō, legere, lēgī, lēctum","read"],["veniō, venīre, vēnī, ventum","come"],["vincō, vincere, vīcī, victum","conquer"],["faciō, facere, fēcī, factum","do / make"],["dīcō, dīcere, dīxī, dictum","say"],["intellegō","understand"],["litterae, -ārum f.pl.","letter"],["Gallia, -ae f.","Gaul"],["postquam","after"]],"exercises":[{"t":"fill","q":"I loved / have loved: amā___","a":["vī"],"ex":"The third principal part <b>amāvī</b> supplies the perfect stem <b>amāv-</b>. The perfect endings <b>-ī, -istī, -it, -imus, -istis, -ērunt</b> are the same for every verb in the language."},{"t":"fill","q":"we wrote: scrīp___","a":["simus"],"ex":"<b>scrīpsimus</b> is the perfect stem <b>scrīps-</b> plus <b>-imus</b>. Many perfects are formed with this <i>-s-</i>, often altering the consonant before it: <i>scrībō → scrīpsī</i>."},{"t":"mcq","q":"The perfect active stem comes from:","opts":["the third principal part","the infinitive only","the supine only","the nominative"],"a":0,"ex":"The perfect active system is built entirely on the third principal part; the fourth supplies the passive. This is why verbs are learned in four parts rather than two."},{"t":"fill","q":"he had come: vēn___","a":["erat"],"ex":"The pluperfect is the perfect stem plus the imperfect of <b>sum</b>: <b>vēn-erat</b>. It marks an action prior to another past action."},{"t":"fill","q":"Caesar conquered Gaul: Caesar Galliam ___.","a":["vīcit"],"ex":"<b>vīcit</b> is the perfect of <b>vincō</b>, 3rd singular. The perfect stem <b>vīc-</b> shows lengthening of the root vowel with loss of the nasal."},{"t":"mcq","q":"Future perfect 1st singular of <i>amō</i>:","opts":["amāverō","amāveram","amābō","amem"],"a":0,"ex":"Future perfect is the perfect stem plus <b>-erō, -eris, -erit</b>: <b>amāverō</b>. Latin uses it far more strictly than English, especially in subordinate clauses before a future main verb."},{"t":"parse","form":"vēnerāmus","q":"Identify tense:","opts":["pluperfect","perfect","future perfect","imperfect"],"a":0,"ex":"Perfect stem <b>vēn-</b> plus the imperfect of <b>sum</b> gives the pluperfect: <b>vēneram, vēnerās, vēnerat</b>. 'We had come.'"},{"t":"parse","form":"scrīpsistis","q":"Identify person, number and tense:","opts":["2nd plural perfect","2nd plural present","2nd plural pluperfect","3rd plural perfect"],"a":0,"ex":"<b>-istis</b> is the perfect second plural. The perfect has its own set of endings — <b>-ī, -istī, -it, -imus, -istis, -ērunt</b> — used by every verb without exception."},{"t":"trans","form":"videt","q":"Put into the perfect:","a":["vīdit","vidit"],"ex":"<b>vīdit</b>. The perfect stem here is formed by lengthening the root vowel, one of several perfect patterns you meet in the four principal parts."},{"t":"trans","form":"fēcimus","q":"Put into the pluperfect:","a":["fēcerāmus","feceramus"],"ex":"<b>fēcerāmus</b>. Keep the perfect stem <b>fēc-</b> and swap the ending set."},{"t":"pick","s":"Cum Caesar vēnisset, mīlitēs quī fūgerant redīērunt.","q":"Click the pluperfect indicative.","a":"fūgerant","ex":"<b>fūgerant</b>, 'they had fled', is indicative; <b>vēnisset</b> is pluperfect <i>subjunctive</i> after <b>cum</b>. The endings <b>-erant</b> and <b>-isset</b> keep them apart."},{"t":"pick","s":"Hostēs urbem cēpērunt et incolās necāvērunt.","q":"Click the first perfect verb.","a":"cēpērunt","ex":"Two perfects in sequence carry the narrative forward. <b>cēpērunt</b> comes from <b>capiō, capere, cēpī</b>."},{"t":"mcq","q":"The perfect in Latin can correspond to:","opts":["both 'I did' and 'I have done'","only 'I have done'","only 'I did'","only 'I was doing'"],"a":0,"ex":"Latin's single perfect covers both English forms. Only when the perfect means 'I have done' does it count as a primary tense for sequence purposes."},{"t":"mcq","q":"An alternative third-plural perfect ending, common in verse, is:","opts":["-ēre","-erunt with a short e","-erint","-issent"],"a":0,"ex":"<b>dīxēre</b> for <b>dīxērunt</b>. Vergil, Ovid and Tacitus all use it; do not mistake it for an infinitive."},{"t":"fill","q":"they had written: scrīps___","a":["erant"],"ex":"<b>scrīpserant</b>. Perfect stem plus the imperfect of <b>sum</b>."},{"t":"fill","q":"I shall have seen: vīd___","a":["erō","ero"],"ex":"<b>vīderō</b>. Latin uses the future perfect strictly, especially in a <b>sī</b> or <b>cum</b> clause before a future main verb, where English is content with a present."}]},{"id":"m6","title":"Passive voice & the fourth principal part","subtitle":"Action received by the subject","grammar":"<h3>Present-system passive</h3><p>Use endings <b>-r, -ris, -tur, -mur, -minī, -ntur</b>: <b>amātur</b>, “he/she is loved”; <b>reguntur</b>, “they are ruled.”</p>\n<h3>Perfect-system passive</h3><p>Perfect passive participle + <b>sum</b>: <b>urbs capta est</b>, “the city was captured.” The participle agrees with the subject: <b>mīlitēs missī sunt</b>.</p>\n<p>The personal agent uses <b>ā/ab + ablative</b>; an instrument uses the ablative alone.</p>","examples":[["Urbs ā mīlitibus dēfenditur.","The city is defended by the soldiers."],["Litterae scrībuntur.","The letter is being written."],["Caesar ā senātū laudātus est.","Caesar was praised by the senate."],["Portae clausae erant.","The gates had been closed."]],"vocab":[["amātur","is loved"],["regitur","is ruled"],["audiuntur","are heard"],["captus, -a, -um","captured"],["missus, -a, -um","sent"],["scrīptus, -a, -um","written"],["laudātus, -a, -um","praised"],["clausus, -a, -um","closed"],["senātus, -ūs m.","senate"],["porta, -ae f.","gate"],["capiō, capere","capture / take"],["mittō, mittere","send"]],"exercises":[{"t":"fill","q":"is loved: amā___","a":["tur"],"ex":"Passive endings replace active ones: <b>-r, -ris, -tur, -mur, -minī, -ntur</b>. <b>amātur</b> = he or she is being loved."},{"t":"fill","q":"are ruled: regu___","a":["ntur"],"ex":"<b>reguntur</b> keeps the third-conjugation <b>-u-</b> before <b>-ntur</b>, exactly as the active <b>regunt</b> does."},{"t":"mcq","q":"A personal agent in a passive sentence uses:","opts":["ā/ab + ablative","ad + accusative","genitive only","dative only"],"a":0,"ex":"A living agent takes <b>ā</b> or <b>ab</b> with the ablative; an inanimate means takes the bare ablative. <b>ā mīlitibus interfectus</b> but <b>gladiō interfectus</b>."},{"t":"fill","q":"The gates were closed: Portae clausae ___.","a":["erant"],"ex":"Perfect passives are compound: participle plus <b>sum</b>. With <b>erant</b> the tense is pluperfect — the gates <i>had been</i> closed."},{"t":"fill","q":"Caesar was praised: Caesar laudātus ___.","a":["est"],"ex":"<b>laudātus est</b> is perfect passive. The participle is an adjective and so agrees with the subject; a feminine subject would require <b>laudāta est</b>."},{"t":"mcq","q":"In <i>mīlitēs missī sunt</i>, <i>missī</i> agrees with:","opts":["mīlitēs","an implied object","sunt","no word"],"a":0,"ex":"<b>missī</b> is nominative masculine plural agreeing with <b>mīlitēs</b>. Reading the participle's ending is often the fastest way to identify the subject of a compound passive."},{"t":"parse","form":"laudābantur","q":"Identify person, number, tense and voice:","opts":["3rd plural imperfect passive","3rd plural present passive","3rd plural perfect passive","3rd singular imperfect passive"],"a":0,"ex":"Imperfect marker <b>-bā-</b> plus the passive ending <b>-ntur</b>. Passive endings simply replace the active ones throughout the present system."},{"t":"parse","form":"missa est","q":"Identify tense, voice and the gender of the subject:","opts":["perfect passive, feminine singular","present passive, feminine","perfect active, feminine","pluperfect passive, neuter"],"a":0,"ex":"The participle <b>missa</b> is an adjective and agrees with the subject, so the subject is feminine singular. Reading the participle's ending identifies the subject before you find it."},{"t":"trans","form":"amat","q":"Put into the passive, same person and tense:","a":["amātur","amatur"],"ex":"<b>amātur</b>, 'he/she is loved'. The passive endings are <b>-r, -ris, -tur, -mur, -minī, -ntur</b>."},{"t":"trans","form":"vīdērunt","q":"Put into the passive, same person and tense:","a":["vīsī sunt","visi sunt"],"ex":"<b>vīsī sunt</b>, 'they were seen'. The perfect passive is compound: fourth principal part plus <b>sum</b>."},{"t":"pick","s":"Urbs ā mīlitibus gladiīs dēlēta est.","q":"Click the agent.","a":"mīlitibus","ex":"<b>ā mīlitibus</b> is the personal agent; <b>gladiīs</b> is the bare ablative of means. The same case, two different jobs, told apart by the preposition and by whether the noun is alive."},{"t":"pick","s":"Epistula quae ā rēge scrīpta erat lēcta est.","q":"Click the pluperfect passive participle's auxiliary.","a":"erat","ex":"<b>scrīpta erat</b> is pluperfect passive: 'had been written'. Change <b>erat</b> to <b>est</b> and you have the perfect, 'was written'."},{"t":"mcq","q":"In <i>Liber legitur</i>, the subject is:","opts":["liber","an unnamed agent","legitur","there is no subject"],"a":0,"ex":"The passive promotes the object to subject. <b>Liber legitur</b>: the book is being read, by whoever."},{"t":"mcq","q":"Which cannot be a perfect passive?","opts":["amābat","amātus est","amātī sunt","amāta erat"],"a":0,"ex":"<b>amābat</b> is imperfect <i>active</i>. Compound tenses are the giveaway: participle plus a form of <b>sum</b>."},{"t":"fill","q":"we are ruled: reg___","a":["imur"],"ex":"<b>regimur</b>. The third-conjugation stem vowel weakens to <i>-i-</i> before <b>-mur</b>, just as in the active <b>regimus</b>."},{"t":"fill","q":"The city had been captured: Urbs capta ___.","a":["erat"],"ex":"<b>capta erat</b>, pluperfect passive. <b>capta est</b> would be simple perfect."}]}]},{"id":"syntax","short":"III","icon":"Ⅲ","label":"Stage III — Complex syntax","tagline":"How Latin builds arguments","desc":"Relative clauses, participles, indirect discourse, the subjunctive, purpose, result, conditions and embedded questions.","units":[{"id":"s1","title":"Relative clauses","subtitle":"A complete clause inside a noun phrase","grammar":"<p>The relative pronoun agrees with its antecedent in gender and number, but its case comes from its function inside the relative clause.</p>\n<table class=\"gr\"><tr><th></th><th>M.</th><th>F.</th><th>N.</th></tr><tr><td>Nom. sg.</td><td>quī</td><td>quae</td><td>quod</td></tr><tr><td>Acc. sg.</td><td>quem</td><td>quam</td><td>quod</td></tr><tr><td>Gen. sg.</td><td>cuius</td><td>cuius</td><td>cuius</td></tr><tr><td>Dat. sg.</td><td>cui</td><td>cui</td><td>cui</td></tr></table>\n<p>Latin often places the antecedent inside the relative clause or omits it when clear.</p>","examples":[["Vir quī venit amīcus meus est.","The man who is coming is my friend."],["Librum quem legis scrīpsī.","I wrote the book that you are reading."],["Puella cui librum dedī laeta est.","The girl to whom I gave the book is happy."],["Urbs cuius moenia vidēs antīqua est.","The city whose walls you see is ancient."]],"vocab":[["quī, quae, quod","who / which"],["quem / quam","whom / which (acc.)"],["cuius","whose"],["cui","to whom"],["quō / quā","by/with whom"],["moenia, -ium n.pl.","walls"],["antīquus","ancient"],["laetus","happy"],["dō, dare, dedī, datum","give"],["antecedēns","antecedent"],["clausula","clause"],["relātīvus","relative"]],"exercises":[{"t":"fill","q":"the man who comes: vir ___ venit","a":["quī"],"ex":"<b>quī</b> is nominative because it is the subject of <b>venit</b> inside its own clause. Its masculine singular form comes from the antecedent <b>vir</b>."},{"t":"fill","q":"the book which you read: librum ___ legis","a":["quem"],"ex":"<b>quem</b> takes its gender and number from <b>librum</b>, but its accusative case from being the object of <b>legis</b>. Case and agreement come from two different places."},{"t":"mcq","q":"The case of a relative pronoun is determined by:","opts":["its function in its own clause","the antecedent’s case","word order","the main verb only"],"a":0,"ex":"The relative takes gender and number from the antecedent and case from its own clause. Applying this rule mechanically resolves most relative clauses on sight."},{"t":"fill","q":"the girl to whom: puella ___","a":["cui"],"ex":"<b>cui</b> is the dative singular, used for all three genders. It is the indirect object inside the relative clause."},{"t":"fill","q":"the city whose walls: urbs ___ moenia","a":["cuius"],"ex":"<b>cuius</b> is the genitive singular for all genders: 'whose'. It is possessive within the relative clause and does not agree with <b>moenia</b>."},{"t":"mcq","q":"Neuter nominative/accusative singular is:","opts":["quod","quem","quae","cui"],"a":0,"ex":"<b>quod</b> serves as both nominative and accusative neuter singular, following the neuter rule that those two cases are always identical."},{"t":"parse","form":"quibus","q":"Identify the possibilities:","opts":["dative or ablative plural, any gender","genitive plural","accusative plural masculine","nominative plural feminine"],"a":0,"ex":"<b>quibus</b> covers dative and ablative plural in all three genders. The relative pronoun collapses its plural forms just as nouns do."},{"t":"parse","form":"quae","q":"Which is <i>not</i> a reading of <b>quae</b>?","opts":["masculine nominative singular","feminine nominative singular","neuter nominative plural","feminine nominative plural"],"a":0,"ex":"The masculine nominative singular is <b>quī</b>. <b>quae</b> covers feminine singular, feminine plural and neuter plural — three jobs at once."},{"t":"trans","form":"vir quī venit","q":"Make the antecedent plural, adjusting the relative:","a":["virī quī veniunt","viri qui veniunt"],"ex":"The relative takes number from its antecedent, so <b>quī</b> is now plural — and its verb must follow: <b>veniunt</b>."},{"t":"trans","form":"puella quam videō","q":"Change so that the girl is the one doing the seeing:","a":["puella quae videt"],"ex":"Case comes from the job in

<td>mihi</td><td>tibi</td><td>nōbīs</td><td>vōbīs</td></tr><tr><td>Acc.</td><td>mē</td><td>tē</td><td>nōs</td><td>vōs</td></tr><tr><td>Abl.</td><td>mē</td><td>tē</td><td>nōbīs</td><td>vōbīs</td></tr></table><p>There is no third-person personal pronoun as such; Latin presses <b>is, ea, id</b> into that service. Note also that <b>cum</b> attaches to the end of these: <b>mēcum</b>, <b>tēcum</b>, <b>nōbīscum</b>, <b>sēcum</b>.</p><h3>is, ea, id — the workhorse</h3><table class=\"gr\"><tr><th>Case</th><th>M.</th><th>F.</th><th>N.</th><th>M. pl.</th><th>F. pl.</th><th>N. pl.</th></tr><tr><td>Nom.</td><td>is</td><td>ea</td><td>id</td><td>eī</td><td>eae</td><td>ea</td></tr><tr><td>Gen.</td><td>eius</td><td>eius</td><td>eius</td><td>eōrum</td><td>eārum</td><td>eōrum</td></tr><tr><td>Dat.</td><td>eī</td><td>eī</td><td>eī</td><td>eīs</td><td>eīs</td><td>eīs</td></tr><tr><td>Acc.</td><td>eum</td><td>eam</td><td>id</td><td>eōs</td><td>eās</td><td>ea</td></tr><tr><td>Abl.</td><td>eō</td><td>eā</td><td>eō</td><td>eīs</td><td>eīs</td><td>eīs</td></tr></table><p>It means he, she, it, they — and also &#39;that&#39; in a colourless way, and &#39;the one who&#39; when paired with a relative: <b>is quī</b>, the man who.</p><h3>The reflexive, and why it matters</h3><p><b>Suī, sibi, sē, sē</b> has no nominative, because it always refers back to the subject. The distinction it enables is one English cannot make without extra words:</p><table class=\"gr\"><tr><th>Latin</th><th>Means</th></tr><tr><td lang=\"la\">Caesar sē laudat.</td><td>Caesar praises himself.</td></tr><tr><td lang=\"la\">Caesar eum laudat.</td><td>Caesar praises him — someone else.</td></tr><tr><td lang=\"la\">Caesar librum suum legit.</td><td>Caesar reads his own book.</td></tr><tr><td lang=\"la\">Caesar librum eius legit.</td><td>Caesar reads that man&#39;s book.</td></tr></table><p>Whenever you meet <b>suus</b> or <b>sē</b>, find the subject of the clause. Whenever you meet <b>eius</b> or <b>eum</b>, look somewhere else. This becomes critical in indirect statement, where <b>sē</b> points back to the person doing the reporting.</p><h3>The three demonstratives</h3><p>Latin locates things relative to the people talking. <b>Hic</b> is near me, <b>iste</b> is near you, <b>ille</b> is over there. <b>Iste</b> often carries contempt in oratory — Cicero&#39;s <b>iste furor tuus</b> in the first Catilinarian is dripping with it. <b>Ille</b> after its noun means &#39;that famous&#39;: <b>vir ille</b>, that celebrated man.</p><p>All the demonstratives, plus <b>ipse</b>, <b>īdem</b>, and the pronominal adjectives <b>ūnus, sōlus, tōtus, nūllus, alter, uter</b>, share two irregular endings: genitive singular <b>-īus</b> and dative singular <b>-ī</b>, the same for all three genders. Learn <b>huius / huic</b> and <b>illīus / illī</b> and you have learned the pattern.</p><h3>ipse and īdem</h3><p><b>Ipse</b> intensifies: himself, in person, the very one. It is <i>not</i> reflexive — <b>Caesar ipse vēnit</b> means Caesar came in person. <b>Īdem</b> is <b>is</b> plus the suffix <b>-dem</b>: the same. Watch the sound change where <i>m</i> meets <i>d</i>: <b>eundem</b>, <b>eandem</b>, <b>eōrundem</b>.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Using <b>eius</b> where the sense requires <b>suus</b>, which silently changes who owns what.</li><li>Reading <b>ipse</b> as a reflexive.</li><li>Missing that <b>eī</b> is both dative singular and nominative masculine plural.</li><li>Confusing <b>hic</b> (this man, nominative) with <b>hīc</b> (here, adverb) and <b>hōc</b> (ablative).</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Ille dux mīlitēs suōs laudāvit, sed eōrum ducem ipse numquam vīdit.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Ille dux</td><td>nom. sg.</td><td>subject: that well-known commander</td></tr><tr><td lang=\"la\">suōs</td><td>masc. acc. pl.</td><td>reflexive possessive: <i>his own</i> soldiers</td></tr><tr><td lang=\"la\">eōrum</td><td>gen. pl.</td><td>of <i>them</i> — a different group entirely</td></tr><tr><td lang=\"la\">ipse</td><td>masc. nom. sg.</td><td>intensifies the subject: he himself</td></tr><tr><td lang=\"la\">vīdit</td><td>3rd sg. perfect</td><td>main verb of the second clause</td></tr></table><p><b>Sense:</b> that commander praised his own soldiers, but never saw their leader in person. Three pronoun forms, three different referents — and English needs the phrases &#39;his own&#39;, &#39;their&#39; and &#39;in person&#39; to do what Latin does with endings.</p></div>","examples":[["Hic liber meus est; ille tuus.","This book is mine; that one is yours."],["Caesar ipse vēnit.","Caesar himself came."],["Eius consilium probāmus.","We approve his/her plan."],["Eādem diē profectī sunt.","They set out on the same day."]],"vocab":[["is, ea, id","he / she / it; that"],["hic, haec, hoc","this"],["ille, illa, illud","that / famous"],["ipse, ipsa, ipsum","self / very"],["idem, eadem, idem","same"],["alius, alia, aliud","other / another"],["alter, altera, alterum","the other (of two)"],["eius","his / her / its"],["huic","to this"],["illō","by/with that"],["meus, -a, -um","my"],["tuus, -a, -um","your"]],"exercises":[{"t":"fill","q":"Caesar himself: Caesar ___","a":["ipse"],"ex":"<b>ipse</b> is the intensive pronoun, 'himself, in person'. It emphasises a noun; it does not make the sentence reflexive."},{"t":"mcq","q":"<i>eius</i> means:","opts":["his/her/its (of someone else)","his own","to him","with him"],"a":0,"ex":"<b>eius</b> is the genitive of <b>is, ea, id</b> and refers to someone other than the subject. For 'his own', referring back to the subject, Latin uses <b>suus</b>."},{"t":"fill","q":"on the same day: eādem di___","a":["ē"],"ex":"<b>diēs</b> is fifth declension, ablative <b>diē</b>. <b>Eādem</b> is the feminine ablative of <b>īdem</b>, agreeing with <b>diē</b> in its feminine use for a particular day."},{"t":"mcq","q":"<i>hic</i> normally points to:","opts":["what is near/present","only a dead person","the future","a question"],"a":0,"ex":"The three demonstratives are deictic: <b>hic</b> is near the speaker, <b>iste</b> near the person addressed, <b>ille</b> remote. <b>Ille</b> also picks up 'that famous'."},{"t":"fill","q":"that famous man: ___ vir","a":["ille"],"ex":"<b>ille</b> often carries the sense 'that well-known one'. It later gave rise to the definite article in the Romance languages."},{"t":"mcq","q":"The genitive singular of <i>hic</i> is:","opts":["huius","hī","hōc","hicī"],"a":0,"ex":"<b>hic, haec, hoc</b> has the genitive <b>huius</b> for all three genders, and dative <b>huic</b>. These pronominal genitives in <b>-īus</b> and datives in <b>-ī</b> recur in <b>ille</b>, <b>ipse</b>, <b>tōtus</b> and <b>sōlus</b>."},{"t":"parse","form":"eōrum","q":"Identify:","opts":["genitive plural of is/id","dative plural","accusative plural","ablative plural"],"a":0,"ex":"<b>eōrum</b> means 'of them, their'. Where the possessor is the subject of the sentence, Latin uses <b>suus</b> instead."},{"t":"parse","form":"hōc","q":"Which is <i>not</i> a possible reading of <b>hōc</b>?","opts":["nominative masculine singular","ablative masculine singular","ablative neuter singular","it can be an adverb, 'for this reason'"],"a":0,"ex":"The nominative masculine is <b>hic</b> with a short <i>i</i>; <b>hoc</b> is neuter nominative and accusative, and <b>hōc</b> with a long <i>ō</i> is ablative."},{"t":"trans","form":"is","q":"Give the accusative singular, all three genders:","a":["eum eam id","eum, eam, id"],"ex":"<b>eum, eam, id</b>. The neuter accusative matches its nominative, as always."},{"t":"trans","form":"ille","q":"Give the genitive singular:","a":["illīus","illius"],"ex":"<b>illīus</b> for all three genders. The pronominal genitive in <b>-īus</b> and dative in <b>-ī</b> recur in <b>ipse, tōtus, sōlus, ūnus, alter, uter, nūllus</b>."},{"t":"pick","s":"Caesar mīlitēs suōs laudāvit, sed eōrum ducem nōn laudāvit.","q":"Click the word referring to someone other than Caesar.","a":"eōrum","ex":"<b>suōs</b> points back to the subject Caesar; <b>eōrum</b> deliberately does not. English 'his' is ambiguous where Latin is precise."},{"t":"pick","s":"Ipse rēx hanc epistulam scrīpsit.","q":"Click the intensive pronoun.","a":"Ipse","ex":"<b>ipse</b> emphasises: the king himself, in person. It is not reflexive — that is <b>sē</b> — and not demonstrative."},{"t":"mcq","q":"<b>sē</b> differs from <b>eum</b> because:","opts":["sē refers back to the subject of its clause","sē is plural","sē is nominative","there is no difference"],"a":0,"ex":"<b>Caesar sē laudat</b> — Caesar praises himself. <b>Caesar eum laudat</b> — Caesar praises someone else."},{"t":"mcq","q":"<b>īdem</b> is built from:","opts":["is plus the suffix -dem","īre plus dem","a separate root","hic plus dem"],"a":0,"ex":"<b>is + dem</b> gives <b>īdem, eadem, idem</b>, 'the same'. The <i>m</i> before <i>d</i> becomes <i>n</i>: <b>eundem</b>, <b>eōrundem</b>."},{"t":"fill","q":"to this man (dative singular): ___","a":["huic"],"ex":"<b>huic</b> serves all three genders. Its genitive counterpart is <b>huius</b>."},{"t":"fill","q":"He praises his own book (subject's own): Librum ___ laudat.","a":["suum"],"ex":"<b>suum</b>, reflexive possessive, agreeing with <b>librum</b>. <b>eius librum</b> would mean someone else's book."}]},{"id":"m4","title":"Imperfect & future","subtitle":"Ongoing past and anticipated action","grammar":"<p class=\"lead\">With the present tense you can describe. With the imperfect and future you can narrate. These two tenses are also the most regular in the language, built by slotting one marker in front of endings you already know.</p><h3>The imperfect: -bā-</h3><table class=\"gr\"><tr><th>Person</th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th></tr><tr><td>1 sg.</td><td>amābam</td><td>monēbam</td><td>regēbam</td><td>audiēbam</td></tr><tr><td>2 sg.</td><td>amābās</td><td>monēbās</td><td>regēbās</td><td>audiēbās</td></tr><tr><td>3 sg.</td><td>amābat</td><td>monēbat</td><td>regēbat</td><td>audiēbat</td></tr><tr><td>1 pl.</td><td>amābāmus</td><td>monēbāmus</td><td>regēbāmus</td><td>audiēbāmus</td></tr><tr><td>2 pl.</td><td>amābātis</td><td>monēbātis</td><td>regēbātis</td><td>audiēbātis</td></tr><tr><td>3 pl.</td><td>amābant</td><td>monēbant</td><td>regēbant</td><td>audiēbant</td></tr></table><p>One marker, four conjugations. The third and fourth simply insert <b>-ē-</b> before it. The imperfect of <b>sum</b> is the outlier: <b>eram, erās, erat, erāmus, erātis, erant</b>.</p><h3>What the imperfect means</h3><p>Not simply &#39;past&#39;. The imperfect presents an action as unfinished, and English needs several different phrasings to catch it:</p><table class=\"gr\"><tr><th>Force</th><th>Latin</th><th>English</th></tr><tr><td>Continuous</td><td lang=\"la\">scrībēbat</td><td>he was writing</td></tr><tr><td>Habitual</td><td lang=\"la\">scrībēbat</td><td>he used to write</td></tr><tr><td>Inceptive</td><td lang=\"la\">scrībēbat</td><td>he began to write</td></tr><tr><td>Attempted</td><td lang=\"la\">scrībēbat</td><td>he tried to write</td></tr></table><p>In narrative this is structural. Imperfects paint the standing situation; perfects deliver the events that happen against it. When you read Caesar or Livy, watch the tenses alternate and you will see the shape of the story before you have translated a word.</p><h3>The future: two systems</h3><table class=\"gr\"><tr><th>Person</th><th>1st &amp; 2nd conj.</th><th>3rd &amp; 4th conj.</th></tr><tr><td>1 sg.</td><td>amā<b>bō</b></td><td>reg<b>am</b>, audi<b>am</b></td></tr><tr><td>2 sg.</td><td>amā<b>bis</b></td><td>reg<b>ēs</b>, audi<b>ēs</b></td></tr><tr><td>3 sg.</td><td>amā<b>bit</b></td><td>reg<b>et</b>, audi<b>et</b></td></tr><tr><td>1 pl.</td><td>amā<b>bimus</b></td><td>reg<b>ēmus</b></td></tr><tr><td>2 pl.</td><td>amā<b>bitis</b></td><td>reg<b>ētis</b></td></tr><tr><td>3 pl.</td><td>amā<b>bunt</b></td><td>reg<b>ent</b></td></tr></table><p>This split is the single most common source of error in the Latin verb. First and second conjugations take <b>-bō, -bis, -bit</b>; third and fourth take <b>-am, -ēs, -et</b>. There is no <i>regēbō</i> and no <i>amam</i>.</p><div class=\"tip\">Two ambiguities to notice. <b>Regam</b> is both future indicative and present subjunctive, and only the clause decides — you meet the subjunctive in unit <b>s4</b>. And in the third conjugation the present <b>regis</b> and the future <b>regēs</b> differ by one vowel length, which unmacronised texts do not show.</div><h3>Reading tense as structure</h3><p>Latin uses the future far more strictly than English. Where an English speaker says &#39;when he comes, I will tell him&#39;, Latin insists on the future in both halves: <b>cum veniet, eī dīcam</b>. If the arriving must precede the telling, Latin uses the future perfect: <b>cum vēnerit, eī dīcam</b>. This precision, which unit <b>m5</b> completes, is one of the pleasures of the language.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Mixing the two future systems: <i>audībō</i> and <i>amam</i> are both wrong.</li><li>Confusing <b>erat</b> (was) with <b>erit</b> (will be).</li><li>Translating every imperfect as a simple past and losing the difference between &#39;he wrote&#39; and &#39;he was writing&#39;.</li><li>Forgetting the <b>-ē-</b> in third- and fourth-conjugation imperfects: it is <b>regēbat</b>, not <i>regbat</i>.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Dum Rōmānī urbem oppugnābant, cīvēs mūrōs cotīdiē reficiēbant; crās tamen cadent.</p><table class=\"gr\"><tr><th>Word</th><th>Tense</th><th>Force</th></tr><tr><td lang=\"la\">oppugnābant</td><td>imperfect</td><td>continuous background: were attacking</td></tr><tr><td lang=\"la\">reficiēbant</td><td>imperfect</td><td>habitual, reinforced by <b>cotīdiē</b>: kept repairing</td></tr><tr><td lang=\"la\">cadent</td><td>future, 3rd conj.</td><td>they will fall — note <b>-ent</b>, not <i>-ebunt</i></td></tr></table><p><b>Sense:</b> while the Romans were attacking the city, the citizens repaired the walls every day; tomorrow, though, they will fall. Two imperfects establish a standing situation, and the single future breaks it.</p></div>","examples":[["Puer in hortō lūdēbat.","The boy was playing in the garden."],["Cotīdiē librōs legēbāmus.","We used to read books every day."],["Crās ad urbem veniēs.","Tomorrow you will come to the city."],["Rōmānī hostēs vincent.","The Romans will defeat the enemy."]],"vocab":[["lūdō, lūdere","play"],["hortus, -ī m.","garden"],["cotīdiē","every day"],["crās","tomorrow"],["heri","yesterday"],["semper","always"],["saepe","often"],["tum","then"],["hostis, -is m./f.","enemy"],["vincō, vincere","conquer"],["manēō, manēre","remain"],["agō, agere","do / drive"]],"exercises":[{"t":"fill","q":"I was loving: amā___","a":["bam"],"ex":"The imperfect sign is <b>-bā-</b> plus a personal ending: <b>amā-bā-m</b>. It is one of the most regular tenses in the language."},{"t":"fill","q":"they were hearing: audi___","a":["ēbant"],"ex":"Third and fourth conjugations insert <b>-ē-</b> before the marker: <b>audi-ē-bant</b>, <b>reg-ē-bant</b>. First and second use plain <b>-bā-</b>."},{"t":"mcq","q":"The imperfect commonly expresses:","opts":["ongoing or habitual past","completed past only","future command","present fact"],"a":0,"ex":"The imperfect views the past as unfinished: was doing, used to do, kept doing, began to do. The perfect, by contrast, reports the act as a completed whole."},{"t":"fill","q":"you will rule: reg___","a":["ēs"],"ex":"Third and fourth conjugations form the future in <b>-am, -ēs, -et</b>: <b>regēs</b>. First and second use <b>-bō, -bis, -bit</b> — mixing the two is the commonest error here."},{"t":"fill","q":"The Romans will conquer: Rōmānī ___.","a":["vincent"],"ex":"<b>vincent</b> is third conjugation, so future is <b>-ent</b>. Watch the contrast with the present <b>vincunt</b>; a single vowel distinguishes them."},{"t":"mcq","q":"Future of <i>amō</i>, 1st singular:","opts":["amābō","amābam","amem","amāvī"],"a":0,"ex":"<b>amābō</b> uses the first-conjugation future in <b>-bō</b>. <b>amābam</b> is imperfect, <b>amem</b> present subjunctive, <b>amāvī</b> perfect."},{"t":"parse","form":"regēbāmus","q":"Identify person, number and tense:","opts":["1st plural imperfect","1st plural future","1st plural present","2nd plural imperfect"],"a":0,"ex":"The marker <b>-bā-</b> is the imperfect, and <b>-mus</b> is first plural. Third conjugation inserts <b>-ē-</b> first: <b>reg-ē-bā-mus</b>."},{"t":"parse","form":"audiet","q":"Identify tense:","opts":["future","present","imperfect","perfect"],"a":0,"ex":"Third and fourth conjugations form the future with <b>-am, -ēs, -et</b>. Compare the present <b>audit</b>: one vowel apart, a whole tense apart."},{"t":"trans","form":"amat","q":"Put into the imperfect:","a":["amābat","amabat"],"ex":"<b>amābat</b>, 'he was loving, he used to love'. Add <b>-bā-</b> to the present stem and keep the same personal ending."},{"t":"trans","form":"regunt","q":"Put into the future:","a":["regent"],"ex":"<b>regent</b>. Do not write <i>regēbunt</i> — the <b>-bō/-bis/-bit</b> future belongs only to the first and second conjugations."},{"t":"pick","s":"Rōmānī urbem oppugnābant sed nōn capient.","q":"Click the future verb.","a":"capient","ex":"<b>capient</b> is future ('they will not take it'), against imperfect <b>oppugnābant</b> ('they were attacking'). The tense contrast is the whole point of the sentence."},{"t":"pick","s":"Erat in oppidō magister quī puerōs docēbat.","q":"Click the imperfect of <b>sum</b>.","a":"Erat","ex":"<b>sum</b> has no <b>-bā-</b>: its imperfect is <b>eram, erās, erat</b>. Note the future <b>erō, eris, erit</b> is only one vowel away."},{"t":"mcq","q":"Which is the future of <b>sum</b>, 3rd singular?","opts":["erit","erat","est","esset"],"a":0,"ex":"<b>erit</b> is future, <b>erat</b> imperfect, <b>esset</b> imperfect subjunctive. These three are confused constantly; the vowel is the whole difference."},{"t":"mcq","q":"The imperfect is the natural tense for:","opts":["description, background and repeated action","a single completed event","a future promise","a general truth"],"a":0,"ex":"Latin narrative alternates: imperfects set the scene, perfects deliver the events. Reading tense as structure is a real skill."},{"t":"fill","q":"they were coming: veni___","a":["ēbant","ebant"],"ex":"<b>veniēbant</b>. The fourth conjugation inserts <b>-ē-</b> before <b>-bā-</b>, exactly as the third does."},{"t":"fill","q":"you (sg.) will love: amā___","a":["bis"],"ex":"<b>amābis</b>. First and second conjugations: <b>-bō, -bis, -bit, -bimus, -bitis, -bunt</b>."}]},{"id":"m5","title":"The perfect system","subtitle":"Completed action and anterior time","grammar":"<p class=\"lead\">Latin verbs are learned in four principal parts because they contain three different stems. The third of those parts unlocks a whole half of the verb system.</p><h3>The four principal parts</h3><table class=\"gr\"><tr><th>Part</th><th>Example</th><th>Supplies</th></tr><tr><td>1st — present 1 sg.</td><td>scrībō</td><td>the dictionary headword</td></tr><tr><td>2nd — present infinitive</td><td>scrībere</td><td>the present stem and the conjugation</td></tr><tr><td>3rd — perfect 1 sg.</td><td>scrīpsī</td><td>the perfect stem, for all active perfect tenses</td></tr><tr><td>4th — supine / participle</td><td>scrīptum</td><td>the participial stem, for the passive and the future participle</td></tr></table><p>Remove the <b>-ī</b> from the third part and you have the perfect stem: <b>scrīps-</b>. Every form below is built on it.</p><h3>The three perfect-system tenses</h3><table class=\"gr\"><tr><th>Person</th><th>Perfect</th><th>Pluperfect</th><th>Future perfect</th></tr><tr><td>1 sg.</td><td>scrīps<b>ī</b></td><td>scrīps<b>eram</b></td><td>scrīps<b>erō</b></td></tr><tr><td>2 sg.</td><td>scrīps<b>istī</b></td><td>scrīps<b>erās</b></td><td>scrīps<b>eris</b></td></tr><tr><td>3 sg.</td><td>scrīps<b>it</b></td><td>scrīps<b>erat</b></td><td>scrīps<b>erit</b></td></tr><tr><td>1 pl.</td><td>scrīps<b>imus</b></td><td>scrīps<b>erāmus</b></td><td>scrīps<b>erimus</b></td></tr><tr><td>2 pl.</td><td>scrīps<b>istis</b></td><td>scrīps<b>erātis</b></td><td>scrīps<b>eritis</b></td></tr><tr><td>3 pl.</td><td>scrīps<b>ērunt</b></td><td>scrīps<b>erant</b></td><td>scrīps<b>erint</b></td></tr></table><p>The perfect endings are unique to the perfect and are used by <i>every verb in the language without exception</i>, including <b>sum</b> (<b>fuī, fuistī, fuit</b>…). The pluperfect is the perfect stem plus the imperfect of <b>sum</b>; the future perfect is the perfect stem plus the future of <b>sum</b>, with one small irregularity in the third plural.</p><h3>How perfect stems are formed</h3><table class=\"gr\"><tr><th>Type</th><th>Example</th><th>Note</th></tr><tr><td>-v-</td><td>amō → amāvī</td><td>the regular first-conjugation pattern</td></tr><tr><td>-u-</td><td>moneō → monuī</td><td>common in the second</td></tr><tr><td>-s-</td><td>scrībō → scrīpsī</td><td>the consonant before it often changes</td></tr><tr><td>lengthened vowel</td><td>videō → vīdī; agō → ēgī</td><td>no added suffix at all</td></tr><tr><td>reduplication</td><td>currō → cucurrī; dō → dedī</td><td>an archaic survival</td></tr></table><p>You do not derive these; you learn them with the verb. But recognising the five patterns makes the fourth principal part far less arbitrary than it first appears.</p><h3>The perfect does two jobs</h3><p>Latin has one perfect where English has two. <b>Vēnī</b> means both &#39;I came&#39; and &#39;I have come&#39;. Usually the context is enough, but the distinction matters later: only the &#39;have come&#39; sense counts as a <i>primary</i> tense for the sequence rules in unit <b>a4</b>.</p><h3>Two forms to recognise</h3><p>In verse and in Tacitus you will meet <b>-ēre</b> for <b>-ērunt</b>: <b>dīxēre</b> for <b>dīxērunt</b>. Do not mistake it for an infinitive. You will also meet syncopated perfects, where a syllable drops out: <b>amāstī</b> for <b>amāvistī</b>, <b>mūtāstis</b> for <b>mūtāvistis</b>. Ovid uses the latter in the passage in the Reading Room.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Building the perfect on the present stem: <i>scrībī</i> instead of <b>scrīpsī</b>.</li><li>Reading <b>fēcerit</b> as necessarily future perfect. It is also perfect subjunctive, and only the clause decides.</li><li>Confusing the perfect <b>lēgimus</b> (we read, past) with the present <b>legimus</b> — one long vowel apart.</li><li>Rendering the pluperfect as a simple past. It marks an action prior to another past action and usually needs English &#39;had&#39;.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Postquam hostēs, quī flūmen trānsierant, castra posuērunt, Caesar cōpiās ēdūxit.</p><table class=\"gr\"><tr><th>Word</th><th>Tense</th><th>Job</th></tr><tr><td lang=\"la\">trānsierant</td><td>pluperfect</td><td>earliest event: they <i>had</i> crossed</td></tr><tr><td lang=\"la\">posuērunt</td><td>perfect</td><td>next event, inside the <b>Postquam</b> clause</td></tr><tr><td lang=\"la\">ēdūxit</td><td>perfect</td><td>main verb, the last event</td></tr></table><p><b>Sense:</b> after the enemy, who had crossed the river, pitched camp, Caesar led out his forces. Three events in strict order, and the tenses alone establish the sequence — no adverbs of time are needed.</p></div>","examples":[["Caesar Galliam vīcit.","Caesar conquered Gaul."],["Litterās scrīpsimus.","We wrote / have written the letter."],["Ubi vēnerat, amīcum vīdit.","When he had arrived, he saw his friend."],["Cum librum lēgeris, intellegēs.","When you have read the book, you will understand."]],"vocab":[["amō, amāre, amāvī, amātum","love"],["videō, vidēre, vīdī, vīsum","see"],["scrībō, scrībere, scrīpsī, scrīptum","write"],["legō, legere, lēgī, lēctum","read"],["veniō, venīre, vēnī, ventum","come"],["vincō, vincere, vīcī, victum","conquer"],["faciō, facere, fēcī, factum","do / make"],["dīcō, dīcere, dīxī, dictum","say"],["intellegō","understand"],["litterae, -ārum f.pl.","letter"],["Gallia, -ae f.","Gaul"],["postquam","after"]],"exercises":[{"t":"fill","q":"I loved / have loved: amā___","a":["vī"],"ex":"The third principal part <b>amāvī</b> supplies the perfect stem <b>amāv-</b>. The perfect endings <b>-ī, -istī, -it, -imus, -istis, -ērunt</b> are the same for every verb in the language."},{"t":"fill","q":"we wrote: scrīp___","a":["simus"],"ex":"<b>scrīpsimus</b> is the perfect stem <b>scrīps-</b> plus <b>-imus</b>. Many perfects are formed with this <i>-s-</i>, often altering the consonant before it: <i>scrībō → scrīpsī</i>."},{"t":"mcq","q":"The perfect active stem comes from:","opts":["the third principal part","the infinitive only","the supine only","the nominative"],"a":0,"ex":"The perfect active system is built entirely on the third principal part; the fourth supplies the passive. This is why verbs are learned in four parts rather than two."},{"t":"fill","q":"he had come: vēn___","a":["erat"],"ex":"The pluperfect is the perfect stem plus the imperfect of <b>sum</b>: <b>vēn-erat</b>. It marks an action prior to another past action."},{"t":"fill","q":"Caesar conquered Gaul: Caesar Galliam ___.","a":["vīcit"],"ex":"<b>vīcit</b> is the perfect of <b>vincō</b>, 3rd singular. The perfect stem <b>vīc-</b> shows lengthening of the root vowel with loss of the nasal."},{"t":"mcq","q":"Future perfect 1st singular of <i>amō</i>:","opts":["amāverō","amāveram","amābō","amem"],"a":0,"ex":"Future perfect is the perfect stem plus <b>-erō, -eris, -erit</b>: <b>amāverō</b>. Latin uses it far more strictly than English, especially in subordinate clauses before a future main verb."},{"t":"parse","form":"vēnerāmus","q":"Identify tense:","opts":["pluperfect","perfect","future perfect","imperfect"],"a":0,"ex":"Perfect stem <b>vēn-</b> plus the imperfect of <b>sum</b> gives the pluperfect: <b>vēneram, vēnerās, vēnerat</b>. 'We had come.'"},{"t":"parse","form":"scrīpsistis","q":"Identify person, number and tense:","opts":["2nd plural perfect","2nd plural present","2nd plural pluperfect","3rd plural perfect"],"a":0,"ex":"<b>-istis</b> is the perfect second plural. The perfect has its own set of endings — <b>-ī, -istī, -it, -imus, -istis, -ērunt</b> — used by every verb without exception."},{"t":"trans","form":"videt","q":"Put into the perfect:","a":["vīdit","vidit"],"ex":"<b>vīdit</b>. The perfect stem here is formed by lengthening the root vowel, one of several perfect patterns you meet in the four principal parts."},{"t":"trans","form":"fēcimus","q":"Put into the pluperfect:","a":["fēcerāmus","feceramus"],"ex":"<b>fēcerāmus</b>. Keep the perfect stem <b>fēc-</b> and swap the ending set."},{"t":"pick","s":"Cum Caesar vēnisset, mīlitēs quī fūgerant redīērunt.","q":"Click the pluperfect indicative.","a":"fūgerant","ex":"<b>fūgerant</b>, 'they had fled', is indicative; <b>vēnisset</b> is pluperfect <i>subjunctive</i> after <b>cum</b>. The endings <b>-erant</b> and <b>-isset</b> keep them apart."},{"t":"pick","s":"Hostēs urbem cēpērunt et incolās necāvērunt.","q":"Click the first perfect verb.","a":"cēpērunt","ex":"Two perfects in sequence carry the narrative forward. <b>cēpērunt</b> comes from <b>capiō, capere, cēpī</b>."},{"t":"mcq","q":"The perfect in Latin can correspond to:","opts":["both 'I did' and 'I have done'","only 'I have done'","only 'I did'","only 'I was doing'"],"a":0,"ex":"Latin's single perfect covers both English forms. Only when the perfect means 'I have done' does it count as a primary tense for sequence purposes."},{"t":"mcq","q":"An alternative third-plural perfect ending, common in verse, is:","opts":["-ēre","-erunt with a short e","-erint","-issent"],"a":0,"ex":"<b>dīxēre</b> for <b>dīxērunt</b>. Vergil, Ovid and Tacitus all use it; do not mistake it for an infinitive."},{"t":"fill","q":"they had written: scrīps___","a":["erant"],"ex":"<b>scrīpserant</b>. Perfect stem plus the imperfect of <b>sum</b>."},{"t":"fill","q":"I shall have seen: vīd___","a":["erō","ero"],"ex":"<b>vīderō</b>. Latin uses the future perfect strictly, especially in a <b>sī</b> or <b>cum</b> clause before a future main verb, where English is content with a present."}]},{"id":"m6","title":"Passive voice & the fourth principal part","subtitle":"Action received by the subject","grammar":"<p class=\"lead\">The passive lets Latin talk about an action without naming who did it, and it completes the verb system: with this unit you can recognise any indicative form in the language.</p><h3>Present system: swap the endings</h3><table class=\"gr\"><tr><th>Person</th><th>Active</th><th>Passive</th><th>amō, present passive</th></tr><tr><td>1 sg.</td><td>-ō / -m</td><td>-r</td><td>amor</td></tr><tr><td>2 sg.</td><td>-s</td><td>-ris</td><td>amāris</td></tr><tr><td>3 sg.</td><td>-t</td><td>-tur</td><td>amātur</td></tr><tr><td>1 pl.</td><td>-mus</td><td>-mur</td><td>amāmur</td></tr><tr><td>2 pl.</td><td>-tis</td><td>-minī</td><td>amāminī</td></tr><tr><td>3 pl.</td><td>-nt</td><td>-ntur</td><td>amantur</td></tr></table><p>Everything else stays: the tense markers you learned in <b>m4</b> sit in exactly the same place. <b>Amābātur</b> was being loved; <b>amābitur</b> will be loved; <b>regēbantur</b> were being ruled.</p><h3>Perfect system: two words</h3><p>Here Latin changes strategy entirely. The perfect passive is the fourth principal part — the perfect passive participle — plus a form of <b>sum</b>:</p><table class=\"gr\"><tr><th>Tense</th><th>Form</th><th>English</th></tr><tr><td>Perfect</td><td>amātus est</td><td>he was loved / has been loved</td></tr><tr><td>Pluperfect</td><td>amātus erat</td><td>he had been loved</td></tr><tr><td>Future perfect</td><td>amātus erit</td><td>he will have been loved</td></tr></table><p>The participle is an <i>adjective</i>, so it agrees with the subject in case, number and gender. That is a gift to the reader: <b>missa est</b> tells you the subject is feminine singular before you have found it, and <b>missī sunt</b> tells you it is masculine plural.</p><div class=\"tip\">Watch the auxiliary carefully. <b>Amātus est</b> is perfect, <b>amātus erat</b> is pluperfect. The tense of the whole is carried by <b>sum</b>, not by the participle — and a present <b>est</b> makes a <i>past</i> tense, which feels wrong to an English ear.</div><h3>Who did it: agent against means</h3><table class=\"gr\"><tr><th>Construction</th><th>Use</th><th>Example</th></tr><tr><td><b>ā / ab</b> + ablative</td><td>a person or living agent</td><td lang=\"la\">ā mīlitibus interfectus est</td></tr><tr><td>bare ablative</td><td>a thing, an instrument</td><td lang=\"la\">gladiō interfectus est</td></tr></table><p>Both are ablatives; the preposition is the whole distinction, and it tracks a real difference — between someone who chose to act and something that was used.</p><h3>Why the passive is everywhere</h3><p>Latin reaches for the passive far more readily than English, especially in official and historical prose, where the agent is either obvious or deliberately suppressed. It also produces genuinely impersonal constructions with intransitive verbs: <b>pugnātum est</b>, literally &#39;it was fought&#39;, meaning there was a battle. <b>Ventum est ad urbem</b> — they came to the city, with nobody named at all.</p><h3>A warning about what comes next</h3><p>A whole class of Latin verbs looks passive and is not. <b>Sequitur</b> means he follows, not he is followed; <b>locūtus est</b> means he spoke. These are deponents, and they are the subject of unit <b>a1</b>. For now, if a passive form makes no sense as a passive, suspect one.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Reading <b>amātus est</b> as a present. The compound form is past.</li><li>Failing to make the participle agree: <b>puella laudāta est</b>, not <i>laudātus</i>.</li><li>Using <b>ā</b> with an instrument, or omitting it with a person.</li><li>Confusing the 2nd singular passive <b>amāris</b> with the infinitive <b>amārī</b>.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Litterae ā rēge scrīptae gladiīs custōdītae ad senātum missae erant.</p><table class=\"gr\"><tr><th>Element</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Litterae</td><td>fem. nom. pl.</td><td>subject — the letter (a plural-only noun)</td></tr><tr><td lang=\"la\">ā rēge</td><td>ā + abl.</td><td>personal agent: by the king</td></tr><tr><td lang=\"la\">scrīptae</td><td>fem. nom. pl. participle</td><td>attributive: having been written</td></tr><tr><td lang=\"la\">gladiīs</td><td>bare abl.</td><td>means: by swords, under armed guard</td></tr><tr><td lang=\"la\">custōdītae</td><td>participle</td><td>a second attributive participle</td></tr><tr><td lang=\"la\">missae erant</td><td>pluperfect passive</td><td>the main verb: had been sent</td></tr></table><p><b>Sense:</b> the letter written by the king and guarded by swords had been sent to the senate. Three participial forms end in <b>-ae</b>; only the last has an auxiliary, and that is what makes it the main verb rather than a description.</p></div>","examples":[["Urbs ā mīlitibus dēfenditur.","The city is defended by the soldiers."],["Litterae scrībuntur.","The letter is being written."],["Caesar ā senātū laudātus est.","Caesar was praised by the senate."],["Portae clausae erant.","The gates had been closed."]],"vocab":[["amātur","is loved"],["regitur","is ruled"],["audiuntur","are heard"],["captus, -a, -um","captured"],["missus, -a, -um","sent"],["scrīptus, -a, -um","written"],["laudātus, -a, -um","praised"],["clausus, -a, -um","closed"],["senātus, -ūs m.","senate"],["porta, -ae f.","gate"],["capiō, capere","capture / take"],["mittō, mittere","send"]],"exercises":[{"t":"fill","q":"is loved: amā___","a":["tur"],"ex":"Passive endings replace active ones: <b>-r, -ris, -tur, -mur, -minī, -ntur</b>. <b>amātur</b> = he or she is being loved."},{"t":"fill","q":"are ruled: regu___","a":["ntur"],"ex":"<b>reguntur</b> keeps the third-conjugation <b>-u-</b> before <b>-ntur</b>, exactly as the active <b>regunt</b> does."},{"t":"mcq","q":"A personal agent in a passive sentence uses:","opts":["ā/ab + ablative","ad + accusative","genitive only","dative only"],"a":0,"ex":"A living agent takes <b>ā</b> or <b>ab</b> with the ablative; an inanimate means takes the bare ablative. <b>ā mīlitibus interfectus</b> but <b>gladiō interfectus</b>."},{"t":"fill","q":"The gates were closed: Portae clausae ___.","a":["erant"],"ex":"Perfect passives are compound: participle plus <b>sum</b>. With <b>erant</b> the tense is pluperfect — the gates <i>had been</i> closed."},{"t":"fill","q":"Caesar was praised: Caesar laudātus ___.","a":["est"],"ex":"<b>laudātus est</b> is perfect passive. The participle is an adjective and so agrees with the subject; a feminine subject would require <b>laudāta est</b>."},{"t":"mcq","q":"In <i>mīlitēs missī sunt</i>, <i>missī</i> agrees with:","opts":["mīlitēs","an implied object","sunt","no word"],"a":0,"ex":"<b>missī</b> is nominative masculine plural agreeing with <b>mīlitēs</b>. Reading the participle's ending is often the fastest way to identify the subject of a compound passive."},{"t":"parse","form":"laudābantur","q":"Identify person, number, tense and voice:","opts":["3rd plural imperfect passive","3rd plural present passive","3rd plural perfect passive","3rd singular imperfect passive"],"a":0,"ex":"Imperfect marker <b>-bā-</b> plus the passive ending <b>-ntur</b>. Passive endings simply replace the active ones throughout the present system."},{"t":"parse","form":"missa est","q":"Identify tense, voice and the gender of the subject:","opts":["perfect passive, feminine singular","present passive, feminine","perfect active, feminine","pluperfect passive, neuter"],"a":0,"ex":"The participle <b>missa</b> is an adjective and agrees with the subject, so the subject is feminine singular. Reading the participle's ending identifies the subject before you find it."},{"t":"trans","form":"amat","q":"Put into the passive, same person and tense:","a":["amātur","amatur"],"ex":"<b>amātur</b>, 'he/she is loved'. The passive endings are <b>-r, -ris, -tur, -mur, -minī, -ntur</b>."},{"t":"trans","form":"vīdērunt","q":"Put into the passive, same person and tense, with a masculine plural subject:","a":["vīsī sunt","visi sunt"],"ex":"<b>vīsī sunt</b>, “they were seen”. The perfect passive is compound — fourth principal part plus <b>sum</b> — and because the participle is an adjective it must agree with the subject: <b>vīsae sunt</b> for a feminine plural subject, <b>vīsa sunt</b> for a neuter one. This is why the question had to name the gender."},{"t":"pick","s":"Urbs ā mīlitibus gladiīs dēlēta est.","q":"Click the agent.","a":"mīlitibus","ex":"<b>ā mīlitibus</b> is the personal agent; <b>gladiīs</b> is the bare ablative of means. The same case, two different jobs, told apart by the preposition and by whether the noun is alive."},{"t":"pick","s":"Epistula quae ā rēge scrīpta erat lēcta est.","q":"Click the pluperfect passive participle's auxiliary.","a":"erat","ex":"<b>scrīpta erat</b> is pluperfect passive: 'had been written'. Change <b>erat</b> to <b>est</b> and you have the perfect, 'was written'."},{"t":"mcq","q":"In <i>Liber legitur</i>, the subject is:","opts":["liber","an unnamed agent","legitur","there is no subject"],"a":0,"ex":"The passive promotes the object to subject. <b>Liber legitur</b>: the book is being read, by whoever."},{"t":"mcq","q":"Which cannot be a perfect passive?","opts":["amābat","amātus est","amātī sunt","amāta erat"],"a":0,"ex":"<b>amābat</b> is imperfect <i>active</i>. Compound tenses are the giveaway: participle plus a form of <b>sum</b>."},{"t":"fill","q":"we are ruled: reg___","a":["imur"],"ex":"<b>regimur</b>. The third-conjugation stem vowel weakens to <i>-i-</i> before <b>-mur</b>, just as in the active <b>regimus</b>."},{"t":"fill","q":"The city had been captured: Urbs capta ___.","a":["erat"],"ex":"<b>capta erat</b>, pluperfect passive. <b>capta est</b> would be simple perfect."}]}]},{"id":"syntax","short":"III","icon":"Ⅲ","label":"Stage III — Complex syntax","tagline":"How Latin builds arguments","desc":"Relative clauses, participles, indirect discourse, the subjunctive, purpose, result, conditions and embedded questions.","units":[{"id":"s1","title":"Relative clauses","subtitle":"A complete clause inside a noun phrase","grammar":"<p class=\"lead\">A relative clause is a complete sentence folded inside a noun phrase. Latin manages this with one pronoun that answers to two masters at once.</p><h3>The relative pronoun</h3><table class=\"gr\"><tr><th>Case</th><th>M. sg.</th><th>F. sg.</th><th>N. sg.</th><th>M. pl.</th><th>F. pl.</th><th>N. pl.</th></tr><tr><td>Nom.</td><td>quī</td><td>quae</td><td>quod</td><td>quī</td><td>quae</td><td>quae</td></tr><tr><td>Gen.</td><td>cuius</td><td>cuius</td><td>cuius</td><td>quōrum</td><td>quārum</td><td>quōrum</td></tr><tr><td>Dat.</td><td>cui</td><td>cui</td><td>cui</td><td>quibus</td><td>quibus</td><td>quibus</td></tr><tr><td>Acc.</td><td>quem</td><td>quam</td><td>quod</td><td>quōs</td><td>quās</td><td>quae</td></tr><tr><td>Abl.</td><td>quō</td><td>quā</td><td>quō</td><td>quibus</td><td>quibus</td><td>quibus</td></tr></table><h3>The one rule</h3><p class=\"ruleline\">A relative pronoun takes its <b>gender and number from its antecedent</b>, and its <b>case from its own clause</b>.</p><p>Two sources, one word. Apply the rule mechanically and almost every relative clause in Latin opens up:</p><table class=\"gr\"><tr><th>Latin</th><th>Gender/number from</th><th>Case because</th></tr><tr><td lang=\"la\">vir quī venit</td><td><b>vir</b>, m. sg.</td><td>subject of <b>venit</b> → nominative</td></tr><tr><td lang=\"la\">vir quem videō</td><td><b>vir</b>, m. sg.</td><td>object of <b>videō</b> → accusative</td></tr><tr><td lang=\"la\">vir cui dedī</td><td><b>vir</b>, m. sg.</td><td>indirect object of <b>dedī</b> → dative</td></tr><tr><td lang=\"la\">vir cuius fīlia venit</td><td><b>vir</b>, m. sg.</td><td>possessor inside the clause → genitive</td></tr><tr><td lang=\"la\">urbēs quās vīdī</td><td><b>urbēs</b>, f. pl.</td><td>object of <b>vīdī</b> → accusative</td></tr></table><p>Note the fourth line especially: <b>cuius</b> does not agree with <b>fīlia</b>. It is genitive because it possesses, and masculine singular because the man is the antecedent.</p><h3>Where the antecedent hides</h3><p>Latin often supplies a pronoun antecedent that English would leave out: <b>is quī</b>, the man who; <b>ea quae</b>, the things which; <b>eī quī</b>, those who. Sometimes the antecedent is omitted altogether, and you supply it from the gender: <b>quī hoc dīcit errat</b>, whoever says this is wrong.</p><p>The antecedent can also be pulled <i>into</i> the relative clause, which looks strange until you have seen it a few times: <b>quam urbem vīdimus, magna erat</b> — the city which we saw was large.</p><h3>The connecting relative</h3><p>A sentence can begin with a relative pronoun that refers back to the whole of what came before. It is not a question and not a subordinate clause; it is a linking device, and you translate it as a demonstrative:</p><ul><li><b>Quae cum ita sint</b> — since these things are so</li><li><b>Quibus rēbus cognitīs</b> — when this had been discovered</li><li><b>Quō factō</b> — after this was done</li></ul><p>Cicero and Caesar use this constantly to stitch paragraphs together. If a sentence opens with <b>quī, quae, quod</b> and no question mark follows, this is almost certainly what you are looking at.</p><div class=\"tip\">Latin does not allow a relative pronoun to be dropped. English says &#39;the book I read&#39;; Latin must say <b>liber quem lēgī</b>. So every relative clause in Latin is flagged for you — which is a considerable help when the sentence is long.</div><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Making the relative agree in case with its antecedent. It never does, except by coincidence.</li><li>Reading <b>cuius</b> as agreeing with the noun that follows it.</li><li>Missing that <b>quae</b> is feminine singular, feminine plural <i>and</i> neuter plural.</li><li>Treating a connecting relative as the start of a subordinate clause and then hunting for a main verb that never comes.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Mīlitēs quōrum dux cecidit in eam urbem sē recēpērunt quam prius cēperant.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Mīlitēs</td><td>m. nom. pl.</td><td>subject of the main verb</td></tr><tr><td lang=\"la\">quōrum</td><td>m. gen. pl.</td><td>plural masculine from <b>Mīlitēs</b>; genitive because it possesses <b>dux</b></td></tr><tr><td lang=\"la\">eam urbem</td><td>f. acc. sg.</td><td>the antecedent of the second relative, with motion towards</td></tr><tr><td lang=\"la\">sē recēpērunt</td><td>3rd pl. perfect</td><td>main verb: withdrew</td></tr><tr><td lang=\"la\">quam</td><td>f. acc. sg.</td><td>feminine singular from <b>urbem</b>; accusative as object of <b>cēperant</b></td></tr><tr><td lang=\"la\">cēperant</td><td>pluperfect</td><td>they had captured it earlier</td></tr></table><p><b>Sense:</b> the soldiers whose commander had fallen withdrew into the city which they had earlier captured. Two relatives, each taking gender and number from a different antecedent and case from a different clause.</p></div>","examples":[["Vir quī venit amīcus meus est.","The man who is coming is my friend."],["Librum quem legis scrīpsī.","I wrote the book that you are reading."],["Puella cui librum dedī laeta est.","The girl to whom I gave the book is happy."],["Urbs cuius moenia vidēs antīqua est.","The city whose walls you see is ancient."]],"vocab":[["quī, quae, quod","who / which"],["quem / quam","whom / which (acc.)"],["cuius","whose"],["cui","to whom"],["quō / quā","by/with whom"],["moenia, -ium n.pl.","walls"],["antīquus","ancient"],["laetus","happy"],["dō, dare, dedī, datum","give"],["antecedēns","antecedent"],["clausula","clause"],["relātīvus","relative"]],"exercises":[{"t":"fill","q":"the man who comes: vir ___ venit","a":["quī"],"ex":"<b>quī</b> is nominative because it is the subject of <b>venit</b> inside its own clause. Its masculine singular form comes from the antecedent <b>vir</b>."},{"t":"fill","q":"the book which you read: librum ___ legis","a":["quem"],"ex":"<b>quem</b> takes its gender and number from <b>librum</b>, but its accusative case from being the object of <b>legis</b>. Case and agreement come from two different places."},{"t":"mcq","q":"The case of a relative pronoun is determined by:","opts":["its function in its own clause","the antecedent’s case","word order","the main verb only"],"a":0,"ex":"The relative takes gender and number from the antecedent and case from its own clause. Applying this rule mechanically resolves most relative clauses on sight."},{"t":"fill","q":"the girl to whom: puella ___","a":["cui"],"ex":"<b>cui</b> is the dative singular, used for all three genders. It is the indirect object inside the relative clause."},{"t":"fill","q":"the city whose walls: urbs ___ moenia","a":["cuius"],"ex":"<b>cuius</b> is the genitive singular for all genders: 'whose'. It is possessive within the relative clause and does not agree with <b>moenia</b>."},{"t":"mcq","q":"Neuter nominative/accusative singular is:","opts":["quod","quem","quae","cui"],"a":0,"ex":"<b>quod</b> serves as both nominative and accusative neuter singular, following the neuter rule that those two cases are always identical."},{"t":"parse","form":"quibus","q":"Identify the possibilities:","opts":["dative or ablative plural, any gender","genitive plural","accusative plural masculine","nominative plural feminine"],"a":0,"ex":"<b>quibus</b> covers dative and ablative plural in all three genders. The relative pronoun collapses its plural forms just as nouns do."},{"t":"parse","form":"quae","q":"Which is <i>not</i> a reading of <b>quae</b>?","opts":["masculine nominative singular","feminine nominative singular","neuter nominative plural","feminine nominative plural"],"a":0,"ex":"The masculine nominative singular is <b>quī</b>. <b>quae</b> covers feminine singular, feminine plural and neuter plural — three jobs at once."},{"t":"trans","form":"vir quī venit","q":"Make the antecedent plural, adjusting the relative:","a":["virī quī veniunt","viri qui veniunt"],"ex":"The relative takes number from its antecedent, so <b>quī</b> is now plural — and its verb must follow: <b>veniunt</b>."},{"t":"trans","form":"puella quam videō","q":"Change so that the girl is the one doing the seeing:","a":["puella quae videt"],"ex":"Case comes from the job inside the relative clause: object <b>quam</b> becomes subject <b>quae</b>. Gender and number are untouched, because the antecedent has not changed."},{"t":"pick","s":"Mīlitēs quōs rēx mīsit urbem cēpērunt.","q":"Click the relative pronoun.","a":"quōs","ex":"<b>quōs</b> is accusative — object of <b>mīsit</b> — but masculine plural from its antecedent <b>Mīlitēs</b>. Two sources, one word."},{"t":"pick","s":"Urbs cuius moenia vidēmus antīqua est.","q":"Click the word the relative clause is describing.","a":"Urbs","ex":"The antecedent is <b>Urbs</b>, and <b>cuius</b> is its genitive equivalent inside the clause: the city whose walls we see."},{"t":"mcq","q":"A relative clause beginning a sentence, as in <i>Quae cum ita sint...</i>, is:","opts":["a connecting relative, equivalent to 'and these things'","an error","always a question","always a purpose clause"],"a":0,"ex":"Latin often begins a sentence with a relative that simply picks up what came before. Translate it as a demonstrative: 'Since these things are so...'."},{"t":"mcq","q":"In <i>Is quī hoc dīcit errat</i>, <b>Is</b> is:","opts":["the antecedent, 'the man who'","a mistake for id","the object","an adverb"],"a":0,"ex":"<b>is quī</b> means 'he who, the man who'. Latin routinely supplies a pronoun antecedent where English says 'whoever' or 'the one who'."},{"t":"fill","q":"the books which I read (object): librī ___ legō","a":["quōs","quos"],"ex":"<b>quōs</b>: masculine plural from <b>librī</b>, accusative because it is the object of <b>legō</b>."},{"t":"fill","q":"the woman to whom I gave the letter: fēmina ___ epistulam dedī","a":["cui"],"ex":"<b>cui</b>, dative singular for all genders. Its plural is <b>quibus</b>."}]},{"id":"s2","title":"Participles","subtitle":"Verbal adjectives that compress clauses","grammar":"<p class=\"lead\">A participle is a verb wearing an adjective&#39;s endings. Latin uses them constantly to compress what English would spread across two clauses.</p><h3>The four participles</h3><table class=\"gr\"><tr><th>Participle</th><th>amō</th><th>Time</th><th>Voice</th><th>Declines like</th></tr><tr><td>Present active</td><td>amāns, amantis</td><td>same as main verb</td><td>active</td><td>3rd-decl. i-stem adj.</td></tr><tr><td>Perfect passive</td><td>amātus, -a, -um</td><td>before main verb</td><td>passive</td><td>bonus</td></tr><tr><td>Future active</td><td>amātūrus, -a, -um</td><td>after main verb</td><td>active</td><td>bonus</td></tr><tr><td>Gerundive</td><td>amandus, -a, -um</td><td>—</td><td>passive, with necessity</td><td>bonus</td></tr></table><p>Notice the gap: there is no perfect <i>active</i> participle. Latin simply cannot say &#39;having loved&#39; in one word. Deponent verbs, which you meet in <b>a1</b>, fill that gap, and it is a large part of why authors are so fond of them.</p><h3>Participial time is relative</h3><p>A participle&#39;s tense is measured against the main verb, not against the moment of speaking. <b>Haec dīcēns discessit</b> — the saying and the departing were simultaneous, both in the past. <b>Haec dictūrus surrēxit</b> — the speaking was still to come.</p><h3>Translate them as clauses</h3><p>Literal participles make bad English. Latin leaves the logical relationship implicit and expects you to supply it:</p><table class=\"gr\"><tr><th>Latin</th><th>Literal</th><th>Better</th></tr><tr><td lang=\"la\">Caesar hoc audiēns discessit.</td><td>Caesar, hearing this, left.</td><td>When Caesar heard this, he left.</td></tr><tr><td lang=\"la\">Mīlitēs victī fūgērunt.</td><td>The soldiers, having been beaten, fled.</td><td>Because they had been beaten, the soldiers fled.</td></tr><tr><td lang=\"la\">Moritūrī tē salūtant.</td><td>Those about to die salute you.</td><td>We who are going to die salute you.</td></tr></table><p>Time, cause, concession, condition — the context decides which. Ask what relationship the participle is standing in for.</p><h3>The ablative absolute</h3><p>When the participle&#39;s noun has <i>no role at all</i> in the main clause, both go into the ablative and the phrase stands apart:</p><ul><li><b>urbe captā</b> — the city having been captured</li><li><b>hostibus appropinquantibus</b> — as the enemy approached</li><li><b>Cicerōne cōnsule</b> — in Cicero&#39;s consulship</li></ul><p>That last has no participle at all, because <b>sum</b> has no present participle; Latin simply juxtaposes two nouns in the ablative. The word <i>absolūtus</i> means loosened, and the looseness is the whole construction: if the noun also functions in the main clause, you must use an ordinary participle instead. Unit <b>a2</b> treats this in full.</p><h3>Participles as nouns</h3><p>As with adjectives, the noun can drop away: <b>victī</b>, the conquered; <b>dicta</b>, things said; <b>audiēntēs</b>, the audience. Christian Latin makes heavy use of this.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Reading a perfect passive participle as active. <b>Urbs capta</b> is the city <i>having been</i> captured, not the city having captured.</li><li>Attaching a participle to the nearest noun instead of the one it agrees with.</li><li>Producing an ablative absolute when the noun does have a role in the main clause.</li><li>Confusing the gerundive <b>amandus</b> with the future active <b>amātūrus</b>: one is passive and obligatory, the other active and intended.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Urbe captā, mīlitēs praedam quaerentēs per viās currēbant, moritūrī tamen brevī.</p><table class=\"gr\"><tr><th>Element</th><th>Participle</th><th>Force</th></tr><tr><td lang=\"la\">Urbe captā</td><td>perfect passive, ablative</td><td>ablative absolute: after the city was captured</td></tr><tr><td lang=\"la\">quaerentēs</td><td>present active, nom. pl.</td><td>agrees with <b>mīlitēs</b>: while looking for plunder</td></tr><tr><td lang=\"la\">moritūrī</td><td>future active, nom. pl.</td><td>agrees with <b>mīlitēs</b>: though soon to die</td></tr></table><p><b>Sense:</b> once the city was taken, the soldiers ran through the streets looking for plunder — though they were soon to die. Three participles, three different times relative to <b>currēbant</b>, and no conjunction anywhere.</p></div>","examples":[["Mīles fugiēns gladium abiēcit.","The fleeing soldier threw away his sword."],["Urbe captā, dux discessit.","After the city had been captured, the leader departed."],["Caesar profectūrus mīlitēs convocāvit.","Caesar, about to depart, summoned the soldiers."],["Librum legendum habeō.","I have a book that must be read."]],"vocab":[["amāns, amantis","loving"],["fugiēns, fugientis","fleeing"],["captus","captured"],["profectūrus","about to depart"],["legendus","to be read"],["convocō","summon"],["abiciō","throw away"],["discedō","depart"],["dux, ducis m.","leader"],["prior","earlier"],["simultāneus","simultaneous"],["subsequēns","subsequent"]],"exercises":[{"t":"mcq","q":"A perfect passive participle normally denotes:","opts":["prior passive action","simultaneous active action","future action","a command only"],"a":0,"ex":"The perfect passive participle describes action already completed and received by its noun: <b>urbs capta</b>, the city having been captured. Latin has no perfect <i>active</i> participle except in deponents."},{"t":"fill","q":"the fleeing soldier: mīles fugi___","a":["ēns"],"ex":"The present active participle ends in <b>-ns</b>, genitive <b>-ntis</b>: <b>fugiēns, fugientis</b>. It denotes action simultaneous with the main verb."},{"t":"fill","q":"about to depart: profect___","a":["ūrus"],"ex":"The future active participle is the fourth principal part's stem plus <b>-ūrus</b>: <b>profectūrus</b>, about to set out. Combined with <b>sum</b> it forms the active periphrastic."},{"t":"mcq","q":"<i>legendus</i> is a:","opts":["gerundive","present participle","perfect infinitive","supine only"],"a":0,"ex":"<b>legendus</b> is the gerundive, a future <i>passive</i> participle meaning 'needing to be read'. It looks like a participle but carries obligation."},{"t":"fill","q":"After the city was captured: Urbe capt___","a":["ā"],"ex":"<b>Urbe captā</b> is an ablative absolute: a noun and participle in the ablative, grammatically detached from the main clause. Both words take the ablative ending."},{"t":"fill","q":"Caesar summoned the soldiers: Caesar mīlitēs ___.","a":["convocāvit"],"ex":"<b>convocāvit</b> is the perfect of <b>convocō</b>. First-conjugation perfects are highly regular: stem plus <b>-āv-</b>."},{"t":"parse","form":"amantēs","q":"Identify:","opts":["present active participle, nom./acc. plural","perfect passive participle","future participle","gerundive"],"a":0,"ex":"Present participles decline like third-declension i-stem adjectives: <b>amāns, amantis, amantī, amantem, amante</b>, plural <b>amantēs, amantia</b>."},{"t":"parse","form":"scrīptūrus","q":"Identify participle and force:","opts":["future active — about to write","perfect passive — having been written","present active — writing","gerundive — needing to be written"],"a":0,"ex":"The future active participle is built on the fourth principal part: <b>scrīpt-</b> plus <b>-ūrus</b>. With <b>sum</b> it forms the active periphrastic: <b>scrīptūrus est</b>, he is going to write."},{"t":"trans","form":"mittō","q":"Give the perfect passive participle, masculine nominative singular:","a":["missus"],"ex":"<b>missus</b>, the fourth principal part of <b>mittō, mittere, mīsī, missum</b>. Every compound passive tense is built on it."},{"t":"trans","form":"urbs capta","q":"Turn this into an ablative absolute:","a":["urbe captā","urbe capta"],"ex":"Both words go into the ablative: <b>urbe captā</b>, 'the city having been captured'. The construction only works if the noun has no other role in the main clause."},{"t":"pick","s":"Mīlitēs urbem oppugnantēs ā cīvibus repulsī sunt.","q":"Click the present participle.","a":"oppugnantēs","ex":"<b>oppugnantēs</b> agrees with <b>Mīlitēs</b> and denotes action going on at the same time: 'the soldiers, while attacking the city'. <b>repulsī</b> is the perfect passive participle."},{"t":"pick","s":"Litterae ā rēge scrīptae ad senātum missae sunt.","q":"Click the participle that is <i>not</i> part of a compound verb.","a":"scrīptae","ex":"<b>missae sunt</b> is the main verb, perfect passive. <b>scrīptae</b> stands alone as an attributive participle: 'the letter written by the king'."},{"t":"mcq","q":"Latin lacks which participle for ordinary verbs?","opts":["perfect active","present active","perfect passive","future active"],"a":0,"ex":"There is no way to say 'having loved' with an active participle — only deponents supply one, which is part of why they are so useful to Latin authors."},{"t":"mcq","q":"A participle may often be best translated as:","opts":["a subordinate clause of time, cause or concession","a noun","an imperative","a question"],"a":0,"ex":"<b>Haec dīcēns discessit</b> — 'saying this' but more naturally 'after saying this' or 'because he said this'. Literal participles make clumsy English."},{"t":"fill","q":"about to die: moritūr___ (nom. m. sg.)","a":["us"],"ex":"<b>moritūrus</b>, from the deponent <b>morior</b>: 'about to die'. The gladiators' <i>moritūrī tē salūtant</i> uses the plural."},{"t":"fill","q":"with the leader having been killed: duce interfect___","a":["ō","o"],"ex":"<b>duce interfectō</b>, ablative absolute. Note that both words carry the ablative."}]},{"id":"s3","title":"Infinitives & indirect statement","subtitle":"Latin reports thought through accusative + infinitive","grammar":"<p class=\"lead\">When Latin reports what somebody said or thought, it does not use a &#39;that&#39; clause. It puts the subject into the accusative and the verb into the infinitive — and it does so on nearly every page of prose.</p><h3>The construction</h3><table class=\"gr\"><tr><th>Direct</th><th>Reported</th></tr><tr><td lang=\"la\">Caesar venit.</td><td lang=\"la\">Dīcunt <b>Caesarem venīre</b>.</td></tr><tr><td>Caesar is coming.</td><td>They say that Caesar is coming.</td></tr></table><p>The trigger is any verb of saying, thinking, knowing, perceiving, hoping or denying: <b>dīcō, putō, sciō, videō, audiō, spērō, negō, crēdō, sentiō, nūntiō</b>. When you meet one, expect an accusative with no obvious verb to govern it — that is your signal.</p><h3>The six infinitives</h3><table class=\"gr\"><tr><th>Time relative to main verb</th><th>Active</th><th>Passive</th></tr><tr><td>Same time</td><td>amāre</td><td>amārī</td></tr><tr><td>Earlier</td><td>amāvisse</td><td>amātus esse</td></tr><tr><td>Later</td><td>amātūrus esse</td><td>amātum īrī</td></tr></table><p class=\"ruleline\">Infinitive tense marks time <b>relative to the main verb</b>, never absolute time.</p><p>So <b>dīcit sē venīre</b> and <b>dīxit sē venīre</b> both use the present infinitive, and both mean the coming is contemporaneous with the saying: he says he is coming, he said he was coming. English shifts its tense; Latin does not.</p><p>Where the infinitive is compound, the participle is an adjective and agrees with the accusative subject: <b>dīcit urbem captam esse</b>, <b>dīcit mīlitēs captōs esse</b>.</p><h3>sē, and why it is precise</h3><p>Inside indirect statement, <b>sē</b> refers to the subject of the verb of saying; anything else refers to somebody different.</p><table class=\"gr\"><tr><th>Latin</th><th>Means</th></tr><tr><td lang=\"la\">Caesar dīcit sē vēnisse.</td><td>Caesar says that <i>he himself</i> came.</td></tr><tr><td lang=\"la\">Caesar dīcit eum vēnisse.</td><td>Caesar says that <i>someone else</i> came.</td></tr></table><p>English &#39;he said he came&#39; is ambiguous and Latin is not. When you translate, make the distinction explicit even if it costs you a few words.</p><h3>Two idioms worth knowing</h3><p><b>Negō</b> rather than <b>dīcō … nōn</b>: Latin negates the verb of saying, English negates the reported clause. <b>Negat sē id fēcisse</b> = he says he did not do it.</p><p>Verbs of hoping, promising and threatening — <b>spērō, prōmittō, minor</b> — regularly take a <i>future</i> infinitive, where English is happy with a present: <b>spērō tē ventūrum esse</b>, I hope you will come.</p><h3>Indirect statement against indirect question</h3><p>These are different constructions and confusing them wrecks a sentence. A statement becomes accusative plus infinitive. A <i>question</i> keeps its question word and takes the subjunctive:</p><ul><li><b>Dīcit eum venīre.</b> — He says that he is coming. (statement)</li><li><b>Rogat cūr veniat.</b> — He asks why he is coming. (question, unit <b>s6</b>)</li></ul><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Supplying a Latin word for &#39;that&#39;. There is none in this construction.</li><li>Shifting the infinitive&#39;s tense to match English. <b>Dīxit sē venīre</b>, not <i>dīxit sē vēnisse</i>, for &#39;he said he was coming&#39;.</li><li>Leaving a predicate adjective in the nominative: <b>dīcit sē parātum esse</b>, not <i>parātus</i>.</li><li>Reading an accusative-and-infinitive as a purpose clause.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Nūntius dīxit hostēs flūmen trānsīsse et urbem mox oppugnātum īrī.</p><table class=\"gr\"><tr><th>Element</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">dīxit</td><td>perfect indicative</td><td>the reporting verb</td></tr><tr><td lang=\"la\">hostēs</td><td>acc. pl.</td><td>subject of the first infinitive</td></tr><tr><td lang=\"la\">trānsīsse</td><td>perfect infinitive (syncopated)</td><td>earlier than <b>dīxit</b>: they <i>had</i> crossed</td></tr><tr><td lang=\"la\">urbem</td><td>acc. sg.</td><td>subject of the second infinitive</td></tr><tr><td lang=\"la\">oppugnātum īrī</td><td>future passive infinitive</td><td>later than <b>dīxit</b>: would be attacked</td></tr></table><p><b>Sense:</b> the messenger said that the enemy had crossed the river and that the city would soon be attacked. One reporting verb governs two indirect statements, and their infinitives place the two events on either side of it in time.</p></div>","examples":[["Dīcit Caesarem venīre.","He says that Caesar is coming."],["Dīxit Caesarem vēnisse.","He said that Caesar had come."],["Putāmus eum victūrum esse.","We think that he will win."],["Caesar dīxit sē parātum esse.","Caesar said that he was ready."]],"vocab":[["dīcō","say"],["putō","think"],["sciō","know"],["audiō","hear"],["sentiō","perceive / think"],["crēdō","believe"],["venīre","to come / be coming"],["vēnisse","to have come"],["ventūrum esse","to be about to come"],["sē","himself/herself/themselves"],["parātus","ready"],["ōrātiō oblīqua","indirect discourse"]],"exercises":[{"t":"fill","q":"He says that Caesar is coming: Dīcit Caesarem ___.","a":["venīre"],"ex":"In indirect statement the verb becomes an infinitive and its subject goes into the accusative. The present infinitive <b>venīre</b> shows time simultaneous with <b>dīcit</b>."},{"t":"fill","q":"He said Caesar had come: Dīxit Caesarem ___.","a":["vēnisse"],"ex":"The perfect infinitive <b>vēnisse</b> marks time <i>prior</i> to the main verb. Infinitive tense in Latin is relative, not absolute."},{"t":"mcq","q":"The subject of an indirect statement is normally:","opts":["accusative","nominative","genitive","ablative"],"a":0,"ex":"The accusative-and-infinitive construction is the standard way Latin reports speech and thought. Recognising an accusative with no obvious verb to govern it is usually the clue."},{"t":"fill","q":"We think he will win: Putāmus eum victūrum ___.","a":["esse"],"ex":"The future infinitive is the future participle plus <b>esse</b>: <b>victūrum esse</b>. The participle agrees with the accusative subject <b>eum</b>."},{"t":"mcq","q":"<i>sē</i> normally refers to:","opts":["the subject of the reporting verb","the nearest noun always","the speaker only","an impersonal subject"],"a":0,"ex":"<b>sē</b> refers back to the subject of the verb of saying. <b>eum</b> in the same slot would signal a <i>different</i> person — a distinction English cannot make without extra words."},{"t":"fill","q":"Caesar says that he is ready: Caesar dīcit sē parātum ___.","a":["esse"],"ex":"<b>sē parātum esse</b>: reflexive accusative subject, predicate adjective agreeing with it, and the infinitive of <b>sum</b>. Caesar says that he — Caesar himself — is ready."},{"t":"parse","form":"vēnisse","q":"Identify:","opts":["perfect active infinitive","present active infinitive","perfect passive infinitive","future infinitive"],"a":0,"ex":"Perfect stem <b>vēn-</b> plus <b>-isse</b>. In indirect statement it marks time earlier than the main verb, whatever that verb's own tense."},{"t":"parse","form":"captum esse","q":"Identify:","opts":["perfect passive infinitive","future passive infinitive","present passive infinitive","perfect active infinitive"],"a":0,"ex":"Perfect passive participle plus <b>esse</b>. The participle agrees with the accusative subject, so you may meet <b>captam esse</b> or <b>captōs esse</b>."},{"t":"trans","form":"Caesar venit.","q":"Report it after <i>Dīcunt</i>:","a":["Dīcunt Caesarem venīre","dicunt caesarem venire"],"ex":"The subject goes into the accusative and the verb into the infinitive. Present infinitive because the coming is contemporaneous with the saying."},{"t":"trans","form":"Urbs capta est.","q":"Report it after <i>Audīvimus</i>:","a":["Audīvimus urbem captam esse","audivimus urbem captam esse"],"ex":"<b>urbem captam esse</b> — the participle agrees with the accusative subject <b>urbem</b>, so it is feminine accusative singular."},{"t":"pick","s":"Putō tē errāre sed eum vēra dīcere.","q":"Click the accusative subject of the second infinitive.","a":"eum","ex":"Two indirect statements hang on one <b>Putō</b>: 'that you are wrong but that he is telling the truth'. Each has its own accusative subject."},{"t":"pick","s":"Caesar dīxit sē id nōn fēcisse.","q":"Click the word referring back to Caesar.","a":"sē","ex":"<b>sē</b> in indirect statement refers to the subject of the verb of saying. <b>eum</b> in that slot would mean somebody else did it."},{"t":"mcq","q":"The tense of an infinitive in indirect statement shows:","opts":["time relative to the main verb","absolute time","the speaker's certainty","nothing at all"],"a":0,"ex":"Present = same time, perfect = earlier, future = later. This holds whether the main verb is present or past, which is why English tense-shifting is a bad guide."},{"t":"mcq","q":"After <i>negō</i>, Latin prefers:","opts":["negō with an ordinary indirect statement, rather than dīcō ... nōn","dīcō nōn plus infinitive","a subjunctive clause","nothing follows negō"],"a":0,"ex":"<b>Negat sē id fēcisse</b> — 'he says he did not do it'. Latin puts the negative into the verb of saying; English puts it into the reported clause."},{"t":"fill","q":"They say the city will be captured: Dīcunt urbem captum ___.","a":["īrī","iri"],"ex":"<b>captum īrī</b> is the future passive infinitive — supine plus the passive infinitive of <b>eō</b>. It is rare, indeclinable, and worth recognising rather than producing."},{"t":"fill","q":"He thinks that he himself is brave: Putat sē fort___ esse.","a":["em"],"ex":"<b>fortem</b>, accusative, agreeing with the accusative subject <b>sē</b>. Predicate adjectives inside indirect statement go accusative too."}]},{"id":"s4","title":"The subjunctive system","subtitle":"Potential, desire and subordination","grammar":"<p class=\"lead\">The indicative states what is. The subjunctive handles everything else — what is wished, willed, doubted, imagined or merely possible. Nearly all Latin subordination runs through it.</p><h3>Forming it: four tenses</h3><table class=\"gr\"><tr><th>Tense</th><th>How</th><th>amō</th><th>regō</th><th>sum</th></tr><tr><td>Present</td><td>vowel change</td><td>amem</td><td>regam</td><td>sim</td></tr><tr><td>Imperfect</td><td>present infinitive + endings</td><td>amārem</td><td>regerem</td><td>essem</td></tr><tr><td>Perfect</td><td>perfect stem + -eri-</td><td>amāverim</td><td>rēxerim</td><td>fuerim</td></tr><tr><td>Pluperfect</td><td>perfect infinitive + endings</td><td>amāvissem</td><td>rēxissem</td><td>fuissem</td></tr></table><p>The imperfect is the easiest tense in the language to build: take the present infinitive and add the personal endings. <b>Amāre</b> + <b>m</b> = <b>amārem</b>. <b>Esse</b> + <b>t</b> = <b>esset</b>. It works for every verb, regular or not.</p><p>The present subjunctive changes the stem vowel. The first conjugation, which has <b>-ā-</b>, takes <b>-e-</b>; every other conjugation takes <b>-a-</b>. The old mnemonic is &#39;<b>we beat a liar</b>&#39;: <i>e</i> in the first, <i>a</i> in the rest.</p><table class=\"gr\"><tr><th></th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th></tr><tr><td>Indicative</td><td>amat</td><td>monet</td><td>regit</td><td>audit</td></tr><tr><td>Subjunctive</td><td>am<b>e</b>t</td><td>mon<b>ea</b>t</td><td>reg<b>a</b>t</td><td>audi<b>a</b>t</td></tr></table><h3>The subjunctive on its own</h3><p>In a main clause it carries one of a handful of forces. These are worth recognising instantly, because they need no signposting word at all.</p><table class=\"gr\"><tr><th>Use</th><th>Example</th><th>English</th><th>Negative</th></tr><tr><td>Hortatory / jussive</td><td lang=\"la\">Eāmus. Veniat.</td><td>Let us go. Let him come.</td><td><b>nē</b></td></tr><tr><td>Optative (wish)</td><td lang=\"la\">Utinam adesset!</td><td>If only he were here!</td><td><b>utinam nē</b></td></tr><tr><td>Deliberative</td><td lang=\"la\">Quid faciam?</td><td>What am I to do?</td><td><b>nōn</b></td></tr><tr><td>Potential</td><td lang=\"la\">Dīcat aliquis…</td><td>Someone might say…</td><td><b>nōn</b></td></tr><tr><td>Prohibition</td><td lang=\"la\">Nē hoc fēcerīs.</td><td>Don&#39;t do this.</td><td>—</td></tr></table><p>Wishes are graded by tense: present subjunctive for something still possible, imperfect for an unfulfilled present, pluperfect for an unfulfilled past. <b>Utinam veniat</b> — may he come. <b>Utinam venīret</b> — if only he were coming. <b>Utinam vēnisset</b> — if only he had come.</p><h3>A note on ambiguity</h3><p>Some forms do double duty and only the clause resolves them. <b>Regam</b> is future indicative and present subjunctive. <b>Fēcerit</b> is future perfect indicative and perfect subjunctive. <b>Amāvēris</b> likewise. This is not a defect; it is what happens when a language wears down over centuries, and Roman readers coped with it exactly as you will — by reading the whole clause.</p><div class=\"tip\">Do not try to translate the subjunctive as a mood. In subordinate clauses it usually has no independent English equivalent at all: <b>ut videat</b> is &#39;in order to see&#39;, and the subjunctive contributes nothing you can point at. Learn the constructions, not the mood.</div><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Writing <i>amam</i> for the present subjunctive of <b>amō</b>. It is <b>amem</b>.</li><li>Using <b>nōn</b> where a jussive or optative wants <b>nē</b>.</li><li>Reading <b>essem</b> as an indicative because it looks like <b>esse</b>.</li><li>Trying to force &#39;may&#39; or &#39;might&#39; into every subjunctive. Most subordinate ones are simply required by the construction.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Utinam nē id fēcissēs! Quid nunc faciāmus?</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Force</th></tr><tr><td lang=\"la\">Utinam nē</td><td>wish particle + negative</td><td>introduces an unfulfilled wish</td></tr><tr><td lang=\"la\">fēcissēs</td><td>pluperfect subjunctive</td><td>unfulfilled, and in the past: if only you had not done it</td></tr><tr><td lang=\"la\">faciāmus</td><td>present subjunctive, 1st pl.</td><td>deliberative: what are we to do?</td></tr></table><p><b>Sense:</b> if only you had not done it! What are we to do now? Two subjunctives, no subordinating word between them, and the tense of the first is what places the regret firmly in the past.</p></div>","examples":[["Veniat!","Let him come!"],["Quid faciam?","What am I to do?"],["Utinam adesset!","If only he were here!"],["Nē hoc faciās.","Do not do this."],["Dīcat aliquis haec falsa esse.","Someone might say these things are false."]],"vocab":[["amem","may I love"],["moneam","may I advise"],["regam","may I rule"],["audiam","may I hear"],["amārem","I might/would love"],["amāverim","I may have loved"],["amāvissem","I had/might have loved"],["utinam","if only"],["nē","lest / not"],["adsum, adesse","be present"],["falsus","false"],["coniūnctīvus","subjunctive"]],"exercises":[{"t":"fill","q":"present subjunctive of <i>amō</i>, 1sg: ___","a":["amem"],"ex":"First-conjugation present subjunctive swaps <b>-ā-</b> for <b>-ē-</b>: <b>amō → amem</b>. The old mnemonic is 'we beat a liar': <i>-e-</i> in the first conjugation, <i>-a-</i> in the rest."},{"t":"fill","q":"present subjunctive of <i>regō</i>, 1sg: ___","a":["regam"],"ex":"Third conjugation takes <b>-a-</b>: <b>regam</b>. Note that this is identical to the future indicative in the first person singular — context decides."},{"t":"mcq","q":"The imperfect subjunctive is built from:","opts":["the present infinitive","the perfect participle","the nominative","the future stem only"],"a":0,"ex":"The imperfect subjunctive is simply the present infinitive plus personal endings: <b>amāre + m</b> = <b>amārem</b>, <b>esse + m</b> = <b>essem</b>. It is the easiest subjunctive to form."},{"t":"fill","q":"Let him come: ___!","a":["Veniat"],"ex":"<b>Veniat</b> is a jussive subjunctive expressing a command in the third person, where the imperative cannot reach. Its negative is <b>nē veniat</b>."},{"t":"fill","q":"If only he were here: Utinam ___.","a":["adesset"],"ex":"<b>Utinam</b> plus imperfect subjunctive expresses a wish for the present that is not being fulfilled. The pluperfect would push the unfulfilled wish into the past."},{"t":"mcq","q":"<i>Quid faciam?</i> is:","opts":["deliberative subjunctive","indirect statement","ablative absolute","passive periphrastic"],"a":0,"ex":"The deliberative subjunctive asks a real question about what to do: 'What am I to do?' Compare the indicative <b>quid faciō</b>, 'what am I doing?'"},{"t":"parse","form":"audīrēmus","q":"Identify mood and tense:","opts":["imperfect subjunctive","present subjunctive","imperfect indicative","perfect subjunctive"],"a":0,"ex":"Present infinitive <b>audīre</b> plus <b>-mus</b>. The imperfect subjunctive is the one tense you can always build by eye."},{"t":"parse","form":"fēcerit","q":"This form is:","opts":["either perfect subjunctive or future perfect indicative","perfect subjunctive only","present subjunctive","pluperfect subjunctive"],"a":0,"ex":"<b>fēcerit</b> is genuinely ambiguous in isolation; only the clause it sits in decides. The two differ in the first person: <b>fēcerim</b> subjunctive, <b>fēcerō</b> indicative."},{"t":"trans","form":"regit","q":"Put into the present subjunctive:","a":["regat"],"ex":"Third conjugation takes <b>-a-</b>: <b>regat</b>. Only the first conjugation uses <b>-e-</b>, swapping out its own <b>-ā-</b>."},{"t":"trans","form":"est","q":"Put into the imperfect subjunctive:","a":["esset"],"ex":"<b>esse + t = esset</b>. Even the irregular <b>sum</b> obeys the infinitive rule for the imperfect subjunctive."},{"t":"pick","s":"Utinam nē id fēcissēs!","q":"Click the pluperfect subjunctive.","a":"fēcissēs","ex":"<b>fēcissēs</b> in a wish with <b>utinam</b> makes it unfulfilled and in the past: 'if only you had not done it'. The imperfect would put the regret in the present."},{"t":"pick","s":"Quid dīcam? Nesciō.","q":"Click the deliberative subjunctive.","a":"dīcam","ex":"'What am I to say?' — a real question about what to do, not a statement of fact. The indicative <b>dīcō</b> would simply mean 'I am saying'."},{"t":"mcq","q":"The subjunctive in a main clause can express all of these <i>except</i>:","opts":["a plain statement of fact","a wish","a command in the third person","a doubt or deliberation"],"a":0,"ex":"Plain fact is the indicative's job. The subjunctive handles the willed, the wished, the doubted and the merely possible."},{"t":"mcq","q":"<i>Nē hoc fēcerīs</i> is:","opts":["a prohibition","a purpose clause","an indirect command","a result clause"],"a":0,"ex":"<b>Nē</b> plus the perfect subjunctive is the standard polite prohibition: 'don't do this'. Horace's <b>Tū nē quaesierīs</b> is exactly this construction."},{"t":"fill","q":"Let us go: ___!","a":["Eāmus","eamus"],"ex":"<b>Eāmus</b>, hortatory subjunctive from the irregular <b>eō</b>. Its negative is <b>nē eāmus</b>."},{"t":"fill","q":"present subjunctive of possum, 3rd singular: ___","a":["possit"],"ex":"<b>possit</b>. Built on <b>sim</b>: <b>possim, possīs, possit</b>, exactly as <b>possum</b> is built on <b>sum</b>."}]},{"id":"s5","title":"Purpose, result & characteristic","subtitle":"Why an action happens and what follows","grammar":"<p class=\"lead\">Two constructions look identical on the page — <b>ut</b> plus a subjunctive — and mean opposite things. One states an aim, the other a consequence. Telling them apart is a matter of looking in the right place.</p><h3>Purpose</h3><p>Standard Classical prose does not ordinarily use the infinitive to express purpose. English &#39;he came to see&#39; must become &#39;he came in order that he might see&#39;:</p><ul><li><b>Vēnit ut vidēret.</b> — He came in order to see.</li><li><b>Vēnit nē vidērētur.</b> — He came so as not to be seen.</li></ul><p>The negative is <b>nē</b>. There are three other ways to express purpose, all common:</p><table class=\"gr\"><tr><th>Construction</th><th>Example</th></tr><tr><td><b>ut</b> + subjunctive</td><td lang=\"la\">mīsit lēgātōs ut pācem peterent</td></tr><tr><td>relative + subjunctive</td><td lang=\"la\">mīsit lēgātōs quī pācem peterent</td></tr><tr><td><b>ad</b> + gerundive</td><td lang=\"la\">mīsit lēgātōs ad pācem petendam</td></tr><tr><td>genitive + <b>causā</b></td><td lang=\"la\">mīsit lēgātōs pācis petendae causā</td></tr></table><h3>Result</h3><p>A result clause reports what actually followed, and it is announced in advance by a signpost word in the main clause:</p><p><b>tam</b> so · <b>ita</b> so, in such a way · <b>sīc</b> thus · <b>adeō</b> to such a degree · <b>tantus</b> so great · <b>tālis</b> such · <b>tot</b> so many</p><ul><li><b>Tam fortiter pugnāvit ut omnēs eum laudārent.</b> — He fought so bravely that everyone praised him.</li><li><b>Tanta erat tempestās ut nāvēs nōn exīrent.</b> — The storm was so great that the ships did not leave.</li></ul><p>The negative is <b>ut nōn</b>. This is the single reliable formal difference between the two constructions:</p><table class=\"gr\"><tr><th></th><th>Purpose</th><th>Result</th></tr><tr><td>Signpost before <b>ut</b></td><td>none</td><td><b>tam, ita, tantus…</b></td></tr><tr><td>Negative</td><td><b>nē</b></td><td><b>ut nōn</b></td></tr><tr><td>Reports</td><td>an intention</td><td>an outcome</td></tr><tr><td>Tense</td><td>follows sequence strictly</td><td>may use the perfect for a single past fact</td></tr></table><h3>Relative clauses of

side the relative clause: object <b>quam</b> becomes subject <b>quae</b>. Gender and number are untouched, because the antecedent has not changed."},{"t":"pick","s":"Mīlitēs quōs rēx mīsit urbem cēpērunt.","q":"Click the relative pronoun.","a":"quōs","ex":"<b>quōs</b> is accusative — object of <b>mīsit</b> — but masculine plural from its antecedent <b>Mīlitēs</b>. Two sources, one word."},{"t":"pick","s":"Urbs cuius moenia vidēmus antīqua est.","q":"Click the word the relative clause is describing.","a":"Urbs","ex":"The antecedent is <b>Urbs</b>, and <b>cuius</b> is its genitive equivalent inside the clause: the city whose walls we see."},{"t":"mcq","q":"A relative clause beginning a sentence, as in <i>Quae cum ita sint...</i>, is:","opts":["a connecting relative, equivalent to 'and these things'","an error","always a question","always a purpose clause"],"a":0,"ex":"Latin often begins a sentence with a relative that simply picks up what came before. Translate it as a demonstrative: 'Since these things are so...'."},{"t":"mcq","q":"In <i>Is quī hoc dīcit errat</i>, <b>Is</b> is:","opts":["the antecedent, 'the man who'","a mistake for id","the object","an adverb"],"a":0,"ex":"<b>is quī</b> means 'he who, the man who'. Latin routinely supplies a pronoun antecedent where English says 'whoever' or 'the one who'."},{"t":"fill","q":"the books which I read (object): librī ___ legō","a":["quōs","quos"],"ex":"<b>quōs</b>: masculine plural from <b>librī</b>, accusative because it is the object of <b>legō</b>."},{"t":"fill","q":"the woman to whom I gave the letter: fēmina ___ epistulam dedī","a":["cui"],"ex":"<b>cui</b>, dative singular for all genders. Its plural is <b>quibus</b>."}]},{"id":"s2","title":"Participles","subtitle":"Verbal adjectives that compress clauses","grammar":"<table class=\"gr\"><tr><th>Participle</th><th>Meaning</th><th>Example</th></tr><tr><td>Present active</td><td>contemporaneous active</td><td>amāns, loving</td></tr><tr><td>Perfect passive</td><td>prior passive</td><td>amātus, having been loved</td></tr><tr><td>Future active</td><td>subsequent/intended active</td><td>amātūrus, about to love</td></tr><tr><td>Gerundive</td><td>necessity / passive potential</td><td>amandus, to be loved</td></tr></table>\n<p>Translate participles according to context: literally, as a relative clause, or as a temporal/causal clause.</p><h3>The ablative absolute</h3><p>A noun and a participle, both in the ablative, can form a phrase that is grammatically detached from the main clause: <b>urbe captā</b>, the city having been captured. The noun must have no other role in the main clause — that detachment is what <i>absolūtus</i>, loosened, means. Translate it as a clause of time, cause, or concession, whichever the context wants. Unit <b>a2</b> treats it in full.</p>","examples":[["Mīles fugiēns gladium abiēcit.","The fleeing soldier threw away his sword."],["Urbe captā, dux discessit.","After the city had been captured, the leader departed."],["Caesar profectūrus mīlitēs convocāvit.","Caesar, about to depart, summoned the soldiers."],["Librum legendum habeō.","I have a book that must be read."]],"vocab":[["amāns, amantis","loving"],["fugiēns, fugientis","fleeing"],["captus","captured"],["profectūrus","about to depart"],["legendus","to be read"],["convocō","summon"],["abiciō","throw away"],["discedō","depart"],["dux, ducis m.","leader"],["prior","earlier"],["simultāneus","simultaneous"],["subsequēns","subsequent"]],"exercises":[{"t":"mcq","q":"A perfect passive participle normally denotes:","opts":["prior passive action","simultaneous active action","future action","a command only"],"a":0,"ex":"The perfect passive participle describes action already completed and received by its noun: <b>urbs capta</b>, the city having been captured. Latin has no perfect <i>active</i> participle except in deponents."},{"t":"fill","q":"the fleeing soldier: mīles fugi___","a":["ēns"],"ex":"The present active participle ends in <b>-ns</b>, genitive <b>-ntis</b>: <b>fugiēns, fugientis</b>. It denotes action simultaneous with the main verb."},{"t":"fill","q":"about to depart: profect___","a":["ūrus"],"ex":"The future active participle is the fourth principal part's stem plus <b>-ūrus</b>: <b>profectūrus</b>, about to set out. Combined with <b>sum</b> it forms the active periphrastic."},{"t":"mcq","q":"<i>legendus</i> is a:","opts":["gerundive","present participle","perfect infinitive","supine only"],"a":0,"ex":"<b>legendus</b> is the gerundive, a future <i>passive</i> participle meaning 'needing to be read'. It looks like a participle but carries obligation."},{"t":"fill","q":"After the city was captured: Urbe capt___","a":["ā"],"ex":"<b>Urbe captā</b> is an ablative absolute: a noun and participle in the ablative, grammatically detached from the main clause. Both words take the ablative ending."},{"t":"fill","q":"Caesar summoned the soldiers: Caesar mīlitēs ___.","a":["convocāvit"],"ex":"<b>convocāvit</b> is the perfect of <b>convocō</b>. First-conjugation perfects are highly regular: stem plus <b>-āv-</b>."},{"t":"parse","form":"amantēs","q":"Identify:","opts":["present active participle, nom./acc. plural","perfect passive participle","future participle","gerundive"],"a":0,"ex":"Present participles decline like third-declension i-stem adjectives: <b>amāns, amantis, amantī, amantem, amante</b>, plural <b>amantēs, amantia</b>."},{"t":"parse","form":"scrīptūrus","q":"Identify participle and force:","opts":["future active — about to write","perfect passive — having been written","present active — writing","gerundive — needing to be written"],"a":0,"ex":"The future active participle is built on the fourth principal part: <b>scrīpt-</b> plus <b>-ūrus</b>. With <b>sum</b> it forms the active periphrastic: <b>scrīptūrus est</b>, he is going to write."},{"t":"trans","form":"mittō","q":"Give the perfect passive participle, masculine nominative singular:","a":["missus"],"ex":"<b>missus</b>, the fourth principal part of <b>mittō, mittere, mīsī, missum</b>. Every compound passive tense is built on it."},{"t":"trans","form":"urbs capta","q":"Turn this into an ablative absolute:","a":["urbe captā","urbe capta"],"ex":"Both words go into the ablative: <b>urbe captā</b>, 'the city having been captured'. The construction only works if the noun has no other role in the main clause."},{"t":"pick","s":"Mīlitēs urbem oppugnantēs ā cīvibus repulsī sunt.","q":"Click the present participle.","a":"oppugnantēs","ex":"<b>oppugnantēs</b> agrees with <b>Mīlitēs</b> and denotes action going on at the same time: 'the soldiers, while attacking the city'. <b>repulsī</b> is the perfect passive participle."},{"t":"pick","s":"Litterae ā rēge scrīptae ad senātum missae sunt.","q":"Click the participle that is <i>not</i> part of a compound verb.","a":"scrīptae","ex":"<b>missae sunt</b> is the main verb, perfect passive. <b>scrīptae</b> stands alone as an attributive participle: 'the letter written by the king'."},{"t":"mcq","q":"Latin lacks which participle for ordinary verbs?","opts":["perfect active","present active","perfect passive","future active"],"a":0,"ex":"There is no way to say 'having loved' with an active participle — only deponents supply one, which is part of why they are so useful to Latin authors."},{"t":"mcq","q":"A participle may often be best translated as:","opts":["a subordinate clause of time, cause or concession","a noun","an imperative","a question"],"a":0,"ex":"<b>Haec dīcēns discessit</b> — 'saying this' but more naturally 'after saying this' or 'because he said this'. Literal participles make clumsy English."},{"t":"fill","q":"about to die: moritūr___ (nom. m. sg.)","a":["us"],"ex":"<b>moritūrus</b>, from the deponent <b>morior</b>: 'about to die'. The gladiators' <i>moritūrī tē salūtant</i> uses the plural."},{"t":"fill","q":"with the leader having been killed: duce interfect___","a":["ō","o"],"ex":"<b>duce interfectō</b>, ablative absolute. Note that both words carry the ablative."}]},{"id":"s3","title":"Infinitives & indirect statement","subtitle":"Latin reports thought through accusative + infinitive","grammar":"<h3>Indirect statement</h3><p>After verbs of saying, thinking, knowing and perceiving, Latin normally uses an accusative subject plus infinitive: <b>Dīcit Caesarem venīre</b>, “He says that Caesar is coming.”</p>\n<table class=\"gr\"><tr><th>Time relative to main verb</th><th>Infinitive</th></tr><tr><td>simultaneous</td><td>present: venīre</td></tr><tr><td>prior</td><td>perfect: vēnisse</td></tr><tr><td>subsequent</td><td>future: ventūrum esse</td></tr></table>\n<p>The reflexive <b>sē</b> normally refers to the subject of the reporting verb.</p>","examples":[["Dīcit Caesarem venīre.","He says that Caesar is coming."],["Dīxit Caesarem vēnisse.","He said that Caesar had come."],["Putāmus eum victūrum esse.","We think that he will win."],["Caesar dīxit sē parātum esse.","Caesar said that he was ready."]],"vocab":[["dīcō","say"],["putō","think"],["sciō","know"],["audiō","hear"],["sentiō","perceive / think"],["crēdō","believe"],["venīre","to come / be coming"],["vēnisse","to have come"],["ventūrum esse","to be about to come"],["sē","himself/herself/themselves"],["parātus","ready"],["ōrātiō oblīqua","indirect discourse"]],"exercises":[{"t":"fill","q":"He says that Caesar is coming: Dīcit Caesarem ___.","a":["venīre"],"ex":"In indirect statement the verb becomes an infinitive and its subject goes into the accusative. The present infinitive <b>venīre</b> shows time simultaneous with <b>dīcit</b>."},{"t":"fill","q":"He said Caesar had come: Dīxit Caesarem ___.","a":["vēnisse"],"ex":"The perfect infinitive <b>vēnisse</b> marks time <i>prior</i> to the main verb. Infinitive tense in Latin is relative, not absolute."},{"t":"mcq","q":"The subject of an indirect statement is normally:","opts":["accusative","nominative","genitive","ablative"],"a":0,"ex":"The accusative-and-infinitive construction is the standard way Latin reports speech and thought. Recognising an accusative with no obvious verb to govern it is usually the clue."},{"t":"fill","q":"We think he will win: Putāmus eum victūrum ___.","a":["esse"],"ex":"The future infinitive is the future participle plus <b>esse</b>: <b>victūrum esse</b>. The participle agrees with the accusative subject <b>eum</b>."},{"t":"mcq","q":"<i>sē</i> normally refers to:","opts":["the subject of the reporting verb","the nearest noun always","the speaker only","an impersonal subject"],"a":0,"ex":"<b>sē</b> refers back to the subject of the verb of saying. <b>eum</b> in the same slot would signal a <i>different</i> person — a distinction English cannot make without extra words."},{"t":"fill","q":"Caesar says that he is ready: Caesar dīcit sē parātum ___.","a":["esse"],"ex":"<b>sē parātum esse</b>: reflexive accusative subject, predicate adjective agreeing with it, and the infinitive of <b>sum</b>. Caesar says that he — Caesar himself — is ready."},{"t":"parse","form":"vēnisse","q":"Identify:","opts":["perfect active infinitive","present active infinitive","perfect passive infinitive","future infinitive"],"a":0,"ex":"Perfect stem <b>vēn-</b> plus <b>-isse</b>. In indirect statement it marks time earlier than the main verb, whatever that verb's own tense."},{"t":"parse","form":"captum esse","q":"Identify:","opts":["perfect passive infinitive","future passive infinitive","present passive infinitive","perfect active infinitive"],"a":0,"ex":"Perfect passive participle plus <b>esse</b>. The participle agrees with the accusative subject, so you may meet <b>captam esse</b> or <b>captōs esse</b>."},{"t":"trans","form":"Caesar venit.","q":"Report it after <i>Dīcunt</i>:","a":["Dīcunt Caesarem venīre","dicunt caesarem venire"],"ex":"The subject goes into the accusative and the verb into the infinitive. Present infinitive because the coming is contemporaneous with the saying."},{"t":"trans","form":"Urbs capta est.","q":"Report it after <i>Audīvimus</i>:","a":["Audīvimus urbem captam esse","audivimus urbem captam esse"],"ex":"<b>urbem captam esse</b> — the participle agrees with the accusative subject <b>urbem</b>, so it is feminine accusative singular."},{"t":"pick","s":"Putō tē errāre sed eum vēra dīcere.","q":"Click the accusative subject of the second infinitive.","a":"eum","ex":"Two indirect statements hang on one <b>Putō</b>: 'that you are wrong but that he is telling the truth'. Each has its own accusative subject."},{"t":"pick","s":"Caesar dīxit sē id nōn fēcisse.","q":"Click the word referring back to Caesar.","a":"sē","ex":"<b>sē</b> in indirect statement refers to the subject of the verb of saying. <b>eum</b> in that slot would mean somebody else did it."},{"t":"mcq","q":"The tense of an infinitive in indirect statement shows:","opts":["time relative to the main verb","absolute time","the speaker's certainty","nothing at all"],"a":0,"ex":"Present = same time, perfect = earlier, future = later. This holds whether the main verb is present or past, which is why English tense-shifting is a bad guide."},{"t":"mcq","q":"After <i>negō</i>, Latin prefers:","opts":["negō with an ordinary indirect statement, rather than dīcō ... nōn","dīcō nōn plus infinitive","a subjunctive clause","nothing follows negō"],"a":0,"ex":"<b>Negat sē id fēcisse</b> — 'he says he did not do it'. Latin puts the negative into the verb of saying; English puts it into the reported clause."},{"t":"fill","q":"They say the city will be captured: Dīcunt urbem captum ___.","a":["īrī","iri"],"ex":"<b>captum īrī</b> is the future passive infinitive — supine plus the passive infinitive of <b>eō</b>. It is rare, indeclinable, and worth recognising rather than producing."},{"t":"fill","q":"He thinks that he himself is brave: Putat sē fort___ esse.","a":["em"],"ex":"<b>fortem</b>, accusative, agreeing with the accusative subject <b>sē</b>. Predicate adjectives inside indirect statement go accusative too."}]},{"id":"s4","title":"The subjunctive system","subtitle":"Potential, desire and subordination","grammar":"<h3>Formation</h3><p>Present subjunctive: first conjugation changes <b>ā → ē</b> (<b>amem</b>); others use <b>ā</b> (<b>moneam, regam, audiam</b>). Imperfect subjunctive is the present infinitive + endings: <b>amārem, monērēs</b>.</p>\n<p>Perfect subjunctive uses perfect stem + <b>-erim</b>; pluperfect uses perfect infinitive + endings: <b>amāvissem</b>.</p>\n<h3>Independent uses</h3><p>Jussive: <b>Veniat!</b> “Let him come.” Deliberative: <b>Quid faciam?</b> Potential: <b>Dīcat aliquis...</b> Wish: <b>Utinam adsit!</b></p>","examples":[["Veniat!","Let him come!"],["Quid faciam?","What am I to do?"],["Utinam adesset!","If only he were here!"],["Nē hoc faciās.","Do not do this."],["Dīcat aliquis haec falsa esse.","Someone might say these things are false."]],"vocab":[["amem","may I love"],["moneam","may I advise"],["regam","may I rule"],["audiam","may I hear"],["amārem","I might/would love"],["amāverim","I may have loved"],["amāvissem","I had/might have loved"],["utinam","if only"],["nē","lest / not"],["adsum, adesse","be present"],["falsus","false"],["coniūnctīvus","subjunctive"]],"exercises":[{"t":"fill","q":"present subjunctive of <i>amō</i>, 1sg: ___","a":["amem"],"ex":"First-conjugation present subjunctive swaps <b>-ā-</b> for <b>-ē-</b>: <b>amō → amem</b>. The old mnemonic is 'we beat a liar': <i>-e-</i> in the first conjugation, <i>-a-</i> in the rest."},{"t":"fill","q":"present subjunctive of <i>regō</i>, 1sg: ___","a":["regam"],"ex":"Third conjugation takes <b>-a-</b>: <b>regam</b>. Note that this is identical to the future indicative in the first person singular — context decides."},{"t":"mcq","q":"The imperfect subjunctive is built from:","opts":["the present infinitive","the perfect participle","the nominative","the future stem only"],"a":0,"ex":"The imperfect subjunctive is simply the present infinitive plus personal endings: <b>amāre + m</b> = <b>amārem</b>, <b>esse + m</b> = <b>essem</b>. It is the easiest subjunctive to form."},{"t":"fill","q":"Let him come: ___!","a":["Veniat"],"ex":"<b>Veniat</b> is a jussive subjunctive expressing a command in the third person, where the imperative cannot reach. Its negative is <b>nē veniat</b>."},{"t":"fill","q":"If only he were here: Utinam ___.","a":["adesset"],"ex":"<b>Utinam</b> plus imperfect subjunctive expresses a wish for the present that is not being fulfilled. The pluperfect would push the unfulfilled wish into the past."},{"t":"mcq","q":"<i>Quid faciam?</i> is:","opts":["deliberative subjunctive","indirect statement","ablative absolute","passive periphrastic"],"a":0,"ex":"The deliberative subjunctive asks a real question about what to do: 'What am I to do?' Compare the indicative <b>quid faciō</b>, 'what am I doing?'"},{"t":"parse","form":"audīrēmus","q":"Identify mood and tense:","opts":["imperfect subjunctive","present subjunctive","imperfect indicative","perfect subjunctive"],"a":0,"ex":"Present infinitive <b>audīre</b> plus <b>-mus</b>. The imperfect subjunctive is the one tense you can always build by eye."},{"t":"parse","form":"fēcerit","q":"This form is:","opts":["either perfect subjunctive or future perfect indicative","perfect subjunctive only","present subjunctive","pluperfect subjunctive"],"a":0,"ex":"<b>fēcerit</b> is genuinely ambiguous in isolation; only the clause it sits in decides. The two differ in the first person: <b>fēcerim</b> subjunctive, <b>fēcerō</b> indicative."},{"t":"trans","form":"regit","q":"Put into the present subjunctive:","a":["regat"],"ex":"Third conjugation takes <b>-a-</b>: <b>regat</b>. Only the first conjugation uses <b>-e-</b>, swapping out its own <b>-ā-</b>."},{"t":"trans","form":"est","q":"Put into the imperfect subjunctive:","a":["esset"],"ex":"<b>esse + t = esset</b>. Even the irregular <b>sum</b> obeys the infinitive rule for the imperfect subjunctive."},{"t":"pick","s":"Utinam nē id fēcissēs!","q":"Click the pluperfect subjunctive.","a":"fēcissēs","ex":"<b>fēcissēs</b> in a wish with <b>utinam</b> makes it unfulfilled and in the past: 'if only you had not done it'. The imperfect would put the regret in the present."},{"t":"pick","s":"Quid dīcam? Nesciō.","q":"Click the deliberative subjunctive.","a":"dīcam","ex":"'What am I to say?' — a real question about what to do, not a statement of fact. The indicative <b>dīcō</b> would simply mean 'I am saying'."},{"t":"mcq","q":"The subjunctive in a main clause can express all of these <i>except</i>:","opts":["a plain statement of fact","a wish","a command in the third person","a doubt or deliberation"],"a":0,"ex":"Plain fact is the indicative's job. The subjunctive handles the willed, the wished, the doubted and the merely possible."},{"t":"mcq","q":"<i>Nē hoc fēcerīs</i> is:","opts":["a prohibition","a purpose clause","an indirect command","a result clause"],"a":0,"ex":"<b>Nē</b> plus the perfect subjunctive is the standard polite prohibition: 'don't do this'. Horace's <b>Tū nē quaesierīs</b> is exactly this construction."},{"t":"fill","q":"Let us go: ___!","a":["Eāmus","eamus"],"ex":"<b>Eāmus</b>, hortatory subjunctive from the irregular <b>eō</b>. Its negative is <b>nē eāmus</b>."},{"t":"fill","q":"present subjunctive of possum, 3rd singular: ___","a":["possit"],"ex":"<b>possit</b>. Built on <b>sim</b>: <b>possim, possīs, possit</b>, exactly as <b>possum</b> is built on <b>sum</b>."}]},{"id":"s5","title":"Purpose, result & characteristic","subtitle":"Why an action happens and what follows","grammar":"<h3>Purpose</h3><p><b>ut</b> + subjunctive for positive purpose; <b>nē</b> for negative: <b>Vēnit ut videat</b>, “He comes to see.”</p>\n<h3>Result</h3><p><b>ut</b> + subjunctive follows a signal such as <b>tam, ita, tantus, tot, sīc</b>: <b>Tam fessus erat ut dormīret</b>.</p>\n<h3>Relative clause of characteristic</h3><p><b>Nēmō est quī hoc faciat</b>, “There is no one who would do this / of the sort to do this.”</p>\n<div class=\"tip\">Negative result normally uses <b>ut nōn</b>, not <b>nē</b>.</div>","examples":[["Vēnit ut amīcum videat.","He comes to see his friend."],["Tacuit nē hostēs audīrent.","He was silent so that the enemy would not hear."],["Tam fessus erat ut dormīret.","He was so tired that he slept."],["Nēmō est quī hoc nesciat.","There is no one who does not know this."]],"vocab":[["ut","so that / that"],["nē","so that not / lest"],["tam","so"],["ita","so / in such a way"],["tantus","so great"],["tot","so many"],["taceō","be silent"],["fessus","tired"],["dormiō","sleep"],["nesciō","not know"],["cōnsilium","purpose / plan"],["exitus","result / outcome"]],"exercises":[{"t":"fill","q":"He comes to see: Vēnit ___ videat.","a":["ut"],"ex":"Purpose is expressed by <b>ut</b> plus subjunctive, never by an infinitive as in English. 'He comes to see' must become 'he comes in order that he may see'."},{"t":"fill","q":"so that the enemy would not hear: ___ hostēs audīrent","a":["nē"],"ex":"Negative purpose uses <b>nē</b>, not <b>ut nōn</b>. Keeping this apart from negative result is the whole point of the unit."},{"t":"mcq","q":"Negative result normally uses:","opts":["ut nōn","nē","num","quin only"],"a":0,"ex":"Result clauses negate with <b>ut nōn</b>. A signpost word in the main clause — <b>tam</b>, <b>ita</b>, <b>tantus</b>, <b>sīc</b> — usually announces that a result clause is coming."},{"t":"fill","q":"so tired that: tam fessus ___","a":["ut"],"ex":"<b>tam</b> is the signpost; <b>ut</b> introduces the consequence that actually followed. Purpose states an aim, result states an outcome."},{"t":"mcq","q":"<i>Nēmō est quī...</i> often introduces:","opts":["a relative clause of characteristic","indirect statement","simple possession","a command"],"a":0,"ex":"The relative clause of characteristic describes what <i>kind</i> of person or thing, and takes the subjunctive. It is common after negatives and after <b>sunt quī</b>."},{"t":"fill","q":"There is no one who does not know: Nēmō est quī hoc ___.","a":["nesciat"],"ex":"<b>nesciat</b> is subjunctive because the relative clause is generic: there is no one <i>of the sort who</i> does not know this."},{"t":"parse","form":"ut vidēret","q":"Without further context this could be:","opts":["purpose or result — the main clause decides","purpose only","result only","an indirect question"],"a":0,"ex":"<b>ut</b> plus subjunctive is ambiguous by itself. Look back for <b>tam, ita, sīc, tantus, tālis</b>: a signpost means result, no signpost means purpose."},{"t":"parse","form":"quī audiat","q":"A relative with the subjunctive after a negative usually signals:","opts":["a clause of characteristic","a purpose clause","an indirect question","an error"],"a":0,"ex":"<b>Nēmō est quī audiat</b> — 'there is nobody of the sort who listens'. The subjunctive turns a specific person into a type."},{"t":"trans","form":"Vēnit ut vidēret.","q":"Make it negative purpose ('so as not to see'):","a":["Vēnit nē vidēret","venit ne videret"],"ex":"Purpose negates with <b>nē</b>, never <b>ut nōn</b>. Result does the opposite."},{"t":"trans","form":"Tam fessus erat ut dormīret.","q":"Make it negative result ('that he did not sleep'):","a":["Tam fessus erat ut nōn dormīret","tam fessus erat ut non dormiret"],"ex":"Result negates with <b>ut nōn</b>. The signpost <b>Tam</b> is what tells you this is result and not purpose."},{"t":"pick","s":"Tanta erat tempestās ut nāvēs in portū manērent.","q":"Click the word that announces a result clause.","a":"Tanta","ex":"<b>Tanta</b> is the signpost, planted before <b>ut</b> ever arrives. Trained readers spot it and know what is coming."},{"t":"pick","s":"Mīsit lēgātōs quī pācem peterent.","q":"Click the relative used to express purpose.","a":"quī","ex":"A relative with the subjunctive can carry purpose: 'he sent envoys to seek peace'. Latin has at least four ways to say purpose — <b>ut</b>, a relative, <b>ad</b> with a gerundive, and the genitive with <b>causā</b>."},{"t":"mcq","q":"Purpose clauses in Latin never use:","opts":["an infinitive","ut with the subjunctive","nē with the subjunctive","a relative with the subjunctive"],"a":0,"ex":"'He came to see' cannot be <i>vēnit vidēre</i>. This is one of the most frequent mistakes English speakers make in Latin composition."},{"t":"mcq","q":"A result clause differs from purpose in that it:","opts":["states what actually happened, not what was aimed at","always uses the indicative","cannot be negative","never uses ut"],"a":0,"ex":"Purpose looks forward to an intention; result looks back at a consequence. The mood is the same, so the surrounding words carry the distinction."},{"t":"fill","q":"There are people who think so: Sunt quī ita ___.","a":["putent"],"ex":"<b>putent</b>, subjunctive of characteristic after <b>Sunt quī</b>: 'there are people of the sort who think so'."},{"t":"fill","q":"so brave that he was praised: tam fortis ___ laudārētur","a":["ut"],"ex":"<b>ut</b> after the signpost <b>tam</b>, with a passive imperfect subjunctive inside the result clause."}]},{"id":"s6","title":"cum clauses, conditions & indirect questions","subtitle":"Read the connective before translating it","grammar":"<h3>cum</h3><p>With indicative it can be purely temporal (“when”). With subjunctive it often supplies background, cause or concession: <b>Cum hoc scīret, tacuit</b>, “Since/although he knew this, he was silent.”</p>\n<h3>Conditions</h3><p>Simple factual conditions use indicative. Future more vivid often uses future/future perfect. Contrary-to-fact uses imperfect subjunctive for present and pluperfect for past.</p>\n<h3>Indirect questions</h3><p>A question word + subjunctive follows verbs of asking or knowing: <b>Rogat quid faciās</b>, “He asks what you are doing.”</p>","examples":[["Cum Caesar vēnit, mīlitēs laetī erant.","When Caesar came, the soldiers were happy."],["Cum hoc scīret, tamen tacuit.","Although he knew this, he was nevertheless silent."],["Sī hoc facis, errās.","If you do this, you are wrong."],["Sī adesset, gaudērem.","If he were here, I would rejoice."],["Rogat cūr abeās.","He asks why you are leaving."]],"vocab":[["cum","when / since / although"],["sī","if"],["nisi","unless"],["tamen","nevertheless"],["rogō","ask"],["quaerō","seek / ask"],["gaudeō","rejoice"],["errō","be mistaken"],["abeō","go away"],["adsit","may be present"],["condiciō","condition"],["quaestiō oblīqua","indirect question"]],"exercises":[{"t":"mcq","q":"With subjunctive, <i>cum</i> may mean:","opts":["since or although","only with","only after","never when"],"a":0,"ex":"<b>Cum</b> with the subjunctive is circumstantial, causal ('since') or concessive ('although'). With the indicative it is purely temporal."},{"t":"fill","q":"If he were here, I would rejoice: Sī adesset, ___.","a":["gaudērem"],"ex":"Present contrary-to-fact takes imperfect subjunctive in both halves: <b>sī adesset, gaudērem</b>. Latin marks the unreality in the verb form itself."},{"t":"mcq","q":"Present contrary-to-fact normally uses:","opts":["imperfect subjunctive","future indicative","perfect infinitive","imperative"],"a":0,"ex":"Imperfect subjunctive for the present, pluperfect for the past. Contrast the future-less-vivid, which uses the present subjunctive."},{"t":"fill","q":"He asks why you leave: Rogat cūr ___.","a":["abeās"],"ex":"An indirect question takes the subjunctive, and the tense follows sequence: present <b>rogat</b> gives present <b>abeās</b>. The direct form would be <b>cūr abīs?</b>"},{"t":"mcq","q":"Indirect questions use:","opts":["subjunctive","accusative + infinitive only","imperative","ablative absolute"],"a":0,"ex":"Latin subordinates the question by mood; English does it by word order. Any interrogative word after a verb of asking, knowing or doubting should prompt you to expect a subjunctive."},{"t":"fill","q":"Although he knew this: ___ hoc scīret","a":["Cum"],"ex":"<b>Cum</b> plus the imperfect subjunctive <b>scīret</b> is concessive here. Which of its senses applies is decided by the logic of the sentence, not by the form."},{"t":"parse","form":"cum vēnisset","q":"Identify the construction:","opts":["cum-circumstantial with pluperfect subjunctive","cum-temporal with indicative","a conditional","an indirect question"],"a":0,"ex":"<b>Cum</b> plus the subjunctive sets a circumstance and often shades into 'since' or 'although'. With the indicative it would be purely 'when'."},{"t":"parse","form":"sī adfuisset","q":"This protasis is:","opts":["past contrary to fact","present contrary to fact","future more vivid","simple fact"],"a":0,"ex":"Pluperfect subjunctive puts the unreality in the past: 'if he had been there' — but he was not."},{"t":"trans","form":"Sī adest, gaudeō.","q":"Make it present contrary to fact:","a":["Sī adesset, gaudērem","si adesset, gauderem"],"ex":"Both halves go into the imperfect subjunctive: 'if he were here, I would be glad' — but he is not."},{"t":"trans","form":"Cūr abīs?","q":"Report it after <i>Rogāvit</i>:","a":["Rogāvit cūr abīrēs","rogavit cur abires"],"ex":"An indirect question takes the subjunctive, and a past main verb pulls it into the imperfect. The question word <b>cūr</b> stays."},{"t":"pick","s":"Nesciō quis vēnerit et cūr vēnerit.","q":"Click the interrogative pronoun.","a":"quis","ex":"<b>quis</b> introduces the first indirect question; the perfect subjunctive <b>vēnerit</b> marks prior time in primary sequence after <b>Nesciō</b>."},{"t":"pick","s":"Cum Rōmam vēnissēmus, senātōrem vīdimus.","q":"Click the main verb.","a":"vīdimus","ex":"<b>vīdimus</b> is indicative and stands outside the <b>cum</b>-clause. Finding the one verb not inside a subordinate clause is the reliable first step in any long sentence."},{"t":"mcq","q":"<i>Sī hoc dīcās, errēs</i> is:","opts":["future less vivid — 'should you say... you would be wrong'","present contrary to fact","past contrary to fact","simple fact"],"a":0,"ex":"Present subjunctive in both halves makes the condition hypothetical but still open. English 'should... would' catches the tone."},{"t":"mcq","q":"An indirect question is signalled by:","opts":["a question word plus a subjunctive verb","an accusative plus an infinitive","ut plus subjunctive","a bare infinitive"],"a":0,"ex":"Accusative plus infinitive is indirect <i>statement</i>. Mixing up the two is the most common misreading of reported speech."},{"t":"fill","q":"If you had come, you would have seen him: Sī vēnissēs, eum ___.","a":["vīdissēs","vidisses"],"ex":"<b>vīdissēs</b>: past contrary to fact keeps the pluperfect subjunctive in both halves."},{"t":"fill","q":"Although he was brave, he fled: ___ fortis esset, fūgit.","a":["Cum","cum"],"ex":"<b>Cum</b> plus the subjunctive, here concessive. Only the sense — bravery versus flight — tells you it is 'although' rather than 'since'."}]}]},{"id":"reading","short":"IV","icon":"Ⅳ","label":"Stage IV — Reading Latin","tagline":"From constructions to literature","desc":"Deponents, ablative absolutes, obligation, tense sequence, prose architecture, poetry and a method for independent reading.","units":[{"id":"a1","title":"Deponent verbs","subtitle":"Passive forms with active meaning","grammar":"<p>Deponents look passive but have active meaning: <b>loquor, loquī, locūtus sum</b>, “speak”; <b>sequor, sequī, secūtus sum</b>, “follow.” Their perfect participle is active in meaning: <b>Caesar locūtus</b>, “Caesar, having spoken.”</p>\n<p>They retain some active forms where no passive equivalent exists, including present participles and future infinitives.</p>\n<p>Semi-deponents have active present forms but deponent perfect forms: <b>audeō, audēre, ausus sum</b>.</p>","examples":[["Dux mīlitēs sequitur.","The leader follows the soldiers."],["Caesar locūtus discessit.","Caesar, having spoken, departed."],["Hostēs profectī sunt.","The enemy set out."],["Hoc facere ausus est.","He dared to do this."]],"vocab":[["loquor, loquī, locūtus sum","speak"],["sequor, sequī, secūtus sum","follow"],["proficīscor, proficīscī, profectus sum","set out"],["morior, morī, mortuus sum","die"],["patior, patī, passus sum","suffer"],["ūtor, ūtī, ūsus sum","use (+ abl.)"],["audeō, audēre, ausus sum","dare"],["cōnor, cōnārī","try"],["hortor, hortārī","encourage"],["arbitror, arbitrārī","think / judge"],["dēpōnēns","deponent"],["forma passīva","passive form"]],"exercises":[{"t":"fill","q":"he follows: sequ___","a":["itur"],"ex":"<b>sequitur</b> looks passive but is active in meaning: 'he follows'. Deponents have laid aside their active forms — <i>dēpōnere</i>, to lay aside."},{"t":"fill","q":"having spoken: locūt___","a":["us"],"ex":"<b>locūtus</b> is a perfect participle with <i>active</i> meaning, 'having spoken'. Deponents supply the perfect active participle that regular verbs lack."},{"t":"mcq","q":"A deponent verb has:","opts":["passive forms and active meaning","active forms and passive meaning","no perfect tense","no infinitive"],"a":0,"ex":"Passive in form, active in sense. The one exception is the gerundive, which stays genuinely passive."},{"t":"fill","q":"they set out: profectī ___.","a":["sunt"],"ex":"<b>profectī sunt</b> is the perfect of <b>proficīscor</b>, formed like a passive but translated actively. The participle agrees with the plural subject."},{"t":"mcq","q":"<i>ūtor</i> governs:","opts":["ablative","accusative","genitive","nominative"],"a":0,"ex":"Five deponents govern the ablative: <b>ūtor, fruor, fungor, potior, vescor</b>. <b>gladiō ūtitur</b> = he uses a sword."},{"t":"fill","q":"he dared: ausus ___.","a":["est"],"ex":"<b>ausus est</b>, from <b>audeō</b>, is semi-deponent: regular in the present system, deponent in the perfect. <b>gaudeō</b> and <b>soleō</b> behave the same way."},{"t":"parse","form":"loquēbātur","q":"Identify:","opts":["imperfect of a deponent — 'he was speaking'","imperfect passive — 'he was being spoken'","perfect deponent","present passive"],"a":0,"ex":"<b>loquor</b> is deponent, so a passive-looking form has active meaning throughout."},{"t":"parse","form":"ūsus","q":"Identify the participle and its force:","opts":["perfect participle, active in sense — 'having used'","perfect passive — 'having been used'","present active","future active"],"a":0,"ex":"Deponents supply exactly the participle regular verbs lack. That is why Latin authors reach for them when they need 'having done X'."},{"t":"trans","form":"sequitur","q":"Put into the perfect:","a":["secūtus est","secutus est"],"ex":"<b>secūtus est</b>, 'he followed'. Compound in form, active in meaning, and the participle agrees with the subject."},{"t":"trans","form":"cōnor","q":"Give the present infinitive:","a":["cōnārī","conari"],"ex":"<b>cōnārī</b>. A deponent's infinitive is passive in form: <b>cōnārī, verērī, loquī, blandīrī</b>."},{"t":"pick","s":"Mīlitēs, ducem secūtī, flūmen trānsiērunt.","q":"Click the deponent participle.","a":"secūtī","ex":"<b>secūtī</b> is active in sense — 'having followed the leader' — and agrees with <b>Mīlitēs</b>. A regular verb could not say this in one word."},{"t":"pick","s":"Hostēs pecūniā ūsī bellum parāvērunt.","q":"Click the ablative governed by the deponent.","a":"pecūniā","ex":"<b>ūtor</b> takes the ablative, not the accusative. The five to memorise are <b>ūtor, fruor, fungor, potior, vescor</b>."},{"t":"mcq","q":"Which is a semi-deponent verb?","opts":["audeō, audēre, ausus sum","sequor, sequī, secūtus sum","amō, amāre, amāvī","regō, regere, rēxī"],"a":0,"ex":"Semi-deponents are active in the present system and deponent in the perfect: <b>audeō, gaudeō, soleō, fīdō</b>."},{"t":"mcq","q":"Which form does a deponent still keep with genuine passive force?","opts":["the gerundive","the perfect participle","the present participle","the infinitive"],"a":0,"ex":"<b>sequendus</b> means 'needing to be followed' — passive. Everything else about a deponent is active in sense."},{"t":"fill","q":"we are speaking: loqu___","a":["imur"],"ex":"<b>loquimur</b>. Third-conjugation deponents take exactly the passive endings of <b>regor</b>."},{"t":"fill","q":"having set out (nom. m. pl.): profect___","a":["ī","i"],"ex":"<b>profectī</b>, from <b>proficīscor</b>. Very common in Caesar as the opening word of a march narrative."}]},{"id":"a2","title":"Ablative absolute","subtitle":"A detached background clause","grammar":"<p>An ablative noun or pronoun plus an agreeing participle forms a grammatically detached clause: <b>urbe captā</b>, “with the city captured / after the city was captured.”</p>\n<p>Because <b>sum</b> has no present participle, Latin can use two ablatives: <b>Caesare duce</b>, “with Caesar as leader / under Caesar’s leadership.”</p>\n<p>Choose a translation that expresses the relation implied by context: time, cause, concession or circumstance.</p>","examples":[["Sole ortō, profectī sumus.","When the sun had risen, we set out."],["Urbe captā, mīlitēs discessērunt.","After the city was captured, the soldiers departed."],["Caesare duce, Rōmānī vīcērunt.","With Caesar as commander, the Romans won."],["Hostibus appropinquantibus, portae clausae sunt.","As the enemy approached, the gates were closed."]],"vocab":[["sole ortō","when the sun had risen"],["urbe captā","with the city captured"],["Caesare duce","with Caesar as leader"],["hostibus appropinquantibus","as the enemy approached"],["orior, orīrī","rise"],["appropinquō","approach"],["circumstantia","circumstance"],["causa","cause"],["concessiō","concession"],["tempus","time"],["absolūtus","detached / absolute"],["participium","participle"]],"exercises":[{"t":"fill","q":"after the city was captured: urbe capt___","a":["ā"],"ex":"<b>urbe captā</b>: both noun and participle take the ablative. The phrase sets a circumstance and has no grammatical link to the main clause."},{"t":"fill","q":"with Caesar as leader: Caesar___ duce","a":["e"],"ex":"<b>Caesare duce</b> is a noun-plus-noun ablative absolute, 'with Caesar as leader'. No participle is present at all."},{"t":"mcq","q":"An ablative absolute is:","opts":["grammatically detached from the main clause","the direct object","always a condition","always passive in translation"],"a":0,"ex":"'Absolute' means loosened — <i>absolūtus</i>. The noun in the ablative must not otherwise function in the main clause; if it does, use a plain participle instead."},{"t":"fill","q":"when the sun had risen: sole ___.","a":["ortō"],"ex":"<b>sōle ortō</b> uses the perfect participle of the deponent <b>orior</b>, so the sense is active: the sun having risen."},{"t":"mcq","q":"Two nouns can form an ablative absolute because:","opts":["sum lacks a present participle","Latin has no ablative","all nouns are verbs","it is direct speech"],"a":0,"ex":"<b>sum</b> has no present participle, so Latin simply juxtaposes two ablatives: <b>Cicerōne cōnsule</b>, in Cicero's consulship. Roman dates are routinely written this way."},{"t":"fill","q":"as the enemy approached: hostibus appropinquant___","a":["ibus"],"ex":"<b>appropinquantibus</b> is the present participle in the ablative plural, agreeing with <b>hostibus</b> and marking action simultaneous with the main verb."},{"t":"parse","form":"hīs rēbus cognitīs","q":"Identify the construction and its force:","opts":["ablative absolute, prior time","ablative of means","dative of agent","genitive absolute"],"a":0,"ex":"A perfect participle in an ablative absolute marks time earlier than the main verb: 'when these things had been learned'. It is one of Caesar's standard paragraph hinges."},{"t":"parse","form":"Cicerōne cōnsule","q":"Why is there no participle?","opts":["sum has no present participle, so two nouns stand alone","the participle is understood as captus","it is an error","participles are optional in poetry"],"a":0,"ex":"'In Cicero's consulship' — the noun-plus-noun ablative absolute is how Romans dated events, and the gap where <i>being</i> should stand is a permanent feature of the language."},{"t":"trans","form":"Rēx mortuus est.","q":"Turn it into an ablative absolute meaning 'the king having died':","a":["rēge mortuō","rege mortuo"],"ex":"<b>rēge mortuō</b>. <b>morior</b> is deponent, so its perfect participle is active in sense — the king died, he was not 'died'."},{"t":"trans","form":"hostēs appropinquant","q":"Turn it into an ablative absolute:","a":["hostibus appropinquantibus"],"ex":"<b>hostibus appropinquantibus</b>. A present participle in the absolute marks action going on at the same time as the main verb."},{"t":"pick","s":"Caesar, castrīs mūnītīs, cōpiās ēdūxit.","q":"Click the noun of the ablative absolute.","a":"castrīs","ex":"<b>castrīs mūnītīs</b> sits inside the sentence as an aside. Note that <b>castra</b> has no bearing on <b>ēdūxit</b> — that detachment is what licenses the construction."},{"t":"pick","s":"Urbe captā, mīlitēs eam incendērunt.","q":"Click the word that shows the ablative absolute is being used loosely here.","a":"eam","ex":"Strictly the city should have no role in the main clause, but <b>eam</b> picks it up again. Real authors do bend the rule; recognising the looseness is part of reading them."},{"t":"mcq","q":"An ablative absolute is best translated into English as:","opts":["a subordinate clause of time, cause or concession","a second main clause","a noun phrase","a question"],"a":0,"ex":"'The city having been captured' is not English anyone speaks. 'After the city was captured' or 'once the city fell' is."},{"t":"mcq","q":"Which phrase is <i>not</i> an ablative absolute?","opts":["gladiō interfectus","duce interfectō","sōle oriente","urbe captā"],"a":0,"ex":"<b>gladiō interfectus</b> is an ablative of means plus a participle agreeing with the sentence's subject — 'killed by a sword'. Only one word is in the ablative."},{"t":"fill","q":"with the war finished: bellō confect___","a":["ō","o"],"ex":"<b>bellō cōnfectō</b>. Both words carry the ablative; getting only one of them into the case is the classic slip."},{"t":"fill","q":"with Caesar as commander: Caesare imperātor___","a":["e"],"ex":"<b>Caesare imperātōre</b> — two nouns, no participle, because <b>sum</b> cannot supply one."}]},{"id":"a3","title":"Gerunds, gerundives & obligation","subtitle":"Verbal nouns and the passive periphrastic","grammar":"<h3>Gerund</h3><p>The neuter singular verbal noun appears in oblique cases: <b>ars scrībendī</b>, “the art of writing”; <b>ad scrībendum</b>, “for writing.”</p>\n<h3>Gerundive attraction</h3><p>Latin often replaces a gerund with object by a gerundive agreeing with that object: <b>ad librōs legendōs</b>, “for reading books.”</p>\n<h3>Passive periphrastic</h3><p>Gerundive + <b>sum</b> expresses obligation. The agent is dative: <b>Mihi liber legendus est</b>, “I must read the book.”</p>","examples":[["Ars bene scrībendī difficilis est.","The art of writing well is difficult."],["Ad librōs legendōs tempus mihi deest.","I lack time for reading books."],["Haec lēx omnibus servanda est.","This law must be observed by everyone."],["Nōbīs proficīscendum est.","We must set out."]],"vocab":[["scrībendī","of writing"],["legendōs","to be read"],["servandus","to be observed"],["mihi faciendum est","I must do it"],["nōbīs eundum est","we must go"],["ars, artis f.","art / skill"],["tempus deest","time is lacking"],["omnibus","by everyone / for everyone"],["obligātiō","obligation"],["gerundium","gerund"],["gerundīvum","gerundive"],["periphrasticus","periphrastic"]],"exercises":[{"t":"fill","q":"the art of writing: ars scrībend___","a":["ī"],"ex":"The gerund is a verbal noun, declined in the singular in <b>-ndī, -ndō, -ndum, -ndō</b>. <b>ars scrībendī</b> = the art of writing."},{"t":"fill","q":"for reading books: ad librōs legend___","a":["ōs"],"ex":"With an object, Latin prefers the gerundive construction: not <i>ad legendum librōs</i> but <b>ad librōs legendōs</b>, the gerundive agreeing with the object."},{"t":"mcq","q":"The agent of a passive periphrastic is usually:","opts":["dative","ā/ab + ablative","accusative","genitive"],"a":0,"ex":"The passive periphrastic takes a dative of agent, not <b>ā</b> with the ablative: <b>mihi faciendum est</b>, it must be done by me."},{"t":"fill","q":"We must go: Nōbīs eundum ___.","a":["est"],"ex":"<b>eundum est</b> is an impersonal passive periphrastic from the intransitive <b>eō</b>, with <b>nōbīs</b> as dative of agent. Literally: there must be a going by us."},{"t":"fill","q":"This law must be observed: Haec lēx servanda ___.","a":["est"],"ex":"<b>servanda est</b> is a gerundive plus <b>sum</b>, expressing obligation. The gerundive agrees with <b>lēx</b>, so it is feminine singular."},{"t":"mcq","q":"<i>ad scrībendum</i> expresses:","opts":["purpose","possession","comparison","direct address"],"a":0,"ex":"<b>ad</b> plus the gerund or gerundive is one of Latin's standard purpose constructions, alongside <b>ut</b> plus subjunctive and the genitive with <b>causā</b>."},{"t":"parse","form":"scrībendī","q":"Identify:","opts":["gerund, genitive — 'of writing'","gerundive, genitive singular","present participle","supine"],"a":0,"ex":"The gerund is a neuter verbal noun with no nominative and no plural: <b>scrībendī, scrībendō, ad scrībendum, scrībendō</b>."},{"t":"parse","form":"legenda","q":"Identify:","opts":["gerundive, agreeing with a feminine or neuter plural noun","gerund","perfect participle","present participle"],"a":0,"ex":"A gerundive is an adjective and must agree with something: <b>legenda</b> is feminine singular or neuter plural. A gerund never agrees with anything."},{"t":"trans","form":"Hoc facere dēbēmus.","q":"Rewrite as a passive periphrastic:","a":["Hoc nōbīs faciendum est","hoc nobis faciendum est"],"ex":"Obligation moves into the gerundive, and the person obliged into the dative: 'this must be done by us'."},{"t":"trans","form":"ad legendum librōs","q":"Correct this into the idiomatic construction:","a":["ad librōs legendōs","ad libros legendos"],"ex":"When a gerund would take an object, Latin turns the object into the noun and makes the gerundive agree with it. The meaning is unchanged; the idiom is not optional."},{"t":"pick","s":"Carthāgō dēlenda est.","q":"Click the gerundive.","a":"dēlenda","ex":"Cato's slogan: 'Carthage must be destroyed'. The gerundive agrees with <b>Carthāgō</b>, feminine singular, and <b>est</b> supplies the tense."},{"t":"pick","s":"Mīlitibus pugnandum erat quod fugere nōn poterant.","q":"Click the dative of agent.","a":"Mīlitibus","ex":"Impersonal passive periphrastic: 'the soldiers had to fight'. The agent is dative, not <b>ā</b> with the ablative, precisely so it does not collide with the ablative of means."},{"t":"mcq","q":"<i>causā</i> with a gerund or gerundive in the genitive expresses:","opts":["purpose","means","time","place"],"a":0,"ex":"<b>pācis petendae causā</b>, 'for the sake of seeking peace'. Note <b>causā</b> follows its genitive rather than preceding it."},{"t":"mcq","q":"Which is the gerund rather than the gerundive?","opts":["ars vīvendī","liber legendus","urbs dēlenda","mīlitēs mittendī"],"a":0,"ex":"<b>vīvendī</b> is a bare verbal noun, 'of living', agreeing with nothing. The other three are adjectives agreeing with a noun."},{"t":"fill","q":"by reading (ablative gerund): leg___","a":["endō","endo"],"ex":"<b>legendō</b>, ablative of means: 'by reading'. The gerund's ablative is very common in this sense."},{"t":"fill","q":"These things must be said: Haec dīc___ sunt.","a":["enda"],"ex":"<b>dīcenda sunt</b> — neuter plural gerundive agreeing with <b>Haec</b>."}]},{"id":"a4","title":"Sequence of tenses & reported speech","subtitle":"Keep relative time consistent","grammar":"<p>Primary main verbs (present/future/perfect with present force) normally take present or perfect subjunctive for simultaneous/subsequent or prior action. Historic main verbs normally take imperfect or pluperfect subjunctive.</p>\n<table class=\"gr\"><tr><th>Main sequence</th><th>Simultaneous/subsequent</th><th>Prior</th></tr><tr><td>Primary</td><td>present subj.</td><td>perfect subj.</td></tr><tr><td>Historic</td><td>imperfect subj.</td><td>pluperfect subj.</td></tr></table>\n<p>In extended indirect discourse, principal assertions become infinitives while subordinate clauses generally use the subjunctive.</p>","examples":[["Rogat quid faciās.","He asks what you are doing."],["Rogāvit quid facerēs.","He asked what you were doing."],["Nesciō cūr vēnerit.","I do not know why he came."],["Nesciēbam cūr vēnisset.","I did not know why he had come."]],"vocab":[["tempus prīmārium","primary tense"],["tempus historicum","historic tense"],["simultāneus","simultaneous"],["prior","prior"],["subsequēns","subsequent"],["rogat","asks"],["rogāvit","asked"],["faciās","you are doing"],["facerēs","you were doing"],["vēnerit","he came / has come"],["vēnisset","he had come"],["cōnsecūtiō temporum","sequence of tenses"]],"exercises":[{"t":"fill","q":"He asks what you are doing: Rogat quid ___.","a":["faciās"],"ex":"Primary sequence: a present main verb takes the present subjunctive for action contemporaneous with it."},{"t":"fill","q":"He asked what you were doing: Rogāvit quid ___.","a":["facerēs"],"ex":"Secondary sequence: a past main verb takes the imperfect subjunctive for contemporaneous action. The choice depends on the main verb, not on English tense."},{"t":"mcq","q":"A historic main verb normally takes for simultaneous action:","opts":["imperfect subjunctive","present subjunctive","future indicative","perfect infinitive"],"a":0,"ex":"Historic main verbs use imperfect subjunctive for simultaneous action and pluperfect for prior action; primary verbs use present and perfect respectively."},{"t":"fill","q":"I did not know why he had come: Nesciēbam cūr ___.","a":["vēnisset"],"ex":"<b>vēnisset</b> is pluperfect subjunctive: prior action in secondary sequence after <b>nesciēbam</b>."},{"t":"mcq","q":"In extended indirect discourse, principal assertions are commonly:","opts":["infinitives","imperatives","ablatives absolute","vocatives"],"a":0,"ex":"In extended reported speech main assertions become infinitives while subordinate clauses go into the subjunctive. Caesar and Livy sustain this for whole paragraphs."},{"t":"fill","q":"I do not know why he came: Nesciō cūr ___.","a":["vēnerit"],"ex":"<b>vēnerit</b> is perfect subjunctive: prior action in primary sequence after the present <b>nesciō</b>. Compare it directly with <b>vēnisset</b> above."},{"t":"parse","form":"Rogāvit quid fēcissēs.","q":"Why is <b>fēcissēs</b> pluperfect subjunctive?","opts":["secondary sequence, action prior to the main verb","primary sequence, prior action","secondary sequence, same time","it is a result clause"],"a":0,"ex":"Past main verb plus prior action gives the pluperfect subjunctive. Change <b>Rogāvit</b> to <b>Rogat</b> and you must write <b>fēcerīs</b>."},{"t":"parse","form":"Nesciō quid faciat.","q":"Identify the sequence and the relative time:","opts":["primary sequence, same time as the main verb","secondary sequence, same time","primary sequence, prior time","secondary sequence, prior time"],"a":0,"ex":"Present main verb, present subjunctive: 'I do not know what he is doing.' For 'what he did' you would need <b>fēcerit</b>."},{"t":"trans","form":"Rogat quid agās.","q":"Put the main verb into the past, adjusting sequence:","a":["Rogāvit quid agerēs","rogavit quid ageres"],"ex":"Primary becomes secondary, so the present subjunctive becomes imperfect. The rule is mechanical once you have identified the main verb's tense."},{"t":"trans","form":"Nesciēbam cūr vēnisset.","q":"Put the main verb into the present, adjusting sequence:","a":["Nesciō cūr vēnerit","nescio cur venerit"],"ex":"Secondary becomes primary, so pluperfect subjunctive becomes perfect subjunctive. Prior time is preserved; only the sequence changes."},{"t":"pick","s":"Dīxit sē vēnisse ut urbem vidēret.","q":"Click the verb whose tense is set by sequence rules.","a":"vidēret","ex":"<b>vidēret</b> is imperfect subjunctive because <b>Dīxit</b> is secondary. <b>vēnisse</b> is an infinitive and follows the relative-time rule instead."},{"t":"pick","s":"Caesar dīxit hostēs, quī flūmen trānsīssent, castra posuisse.","q":"Click the subjunctive inside the reported speech.","a":"trānsīssent","ex":"Main assertions in reported speech become infinitives — <b>posuisse</b> — while subordinate clauses inside them go subjunctive: <b>trānsīssent</b>. Both patterns run together for whole paragraphs in Caesar."},{"t":"mcq","q":"Which counts as a primary tense for sequence?","opts":["the perfect meaning 'I have done'","the perfect meaning 'I did'","the imperfect","the pluperfect"],"a":0,"ex":"The Latin perfect does two jobs, and only its 'have done' sense is primary. This is one of the genuinely subtle points in the system."},{"t":"mcq","q":"In extended reported speech, commands become:","opts":["subjunctives","infinitives","imperatives","gerundives"],"a":0,"ex":"Statements become infinitives; questions and commands become subjunctives. Sorting them out is most of the difficulty in a Caesarian speech."},{"t":"fill","q":"He asks who they are: Rogat quī ___.","a":["sint"],"ex":"<b>sint</b>, present subjunctive in primary sequence."},{"t":"fill","q":"He asked who they had been: Rogāvit quī ___.","a":["fuissent"],"ex":"<b>fuissent</b>: secondary sequence, prior time. Compare it directly with <b>sint</b> above."}]},{"id":"a5","title":"Latin prose style","subtitle":"Period, emphasis and the architecture of a sentence","grammar":"<p>Latin prose can postpone the main verb, frame clauses with paired words, and embed participles or subordinate clauses before resolving the sentence. Read by units, not by translating one word at a time.</p>\n<h3>A disciplined reading sequence</h3><ol><li>Mark finite verbs and clause introducers.</li><li>Find subjects and objects from endings.</li><li>Join adjectives, genitives and participles to their heads.</li><li>Resolve subordinate clauses.</li><li>Only then produce idiomatic English.</li></ol>\n<p>Common connective pairs include <b>non solum... sed etiam</b>, <b>ut... ita</b>, <b>cum... tum</b>, <b>tanto... quanto</b>.</p>","examples":[["Nōn sōlum fortis sed etiam prūdēns erat.","He was not only brave but also prudent."],["Ut sēmentem fēceris, ita metēs.","As you have sown, so shall you reap."],["Tantō maior erat glōria, quantō gravius perīculum.","The greater the danger, the greater the glory."],["His rēbus cognītīs, Caesar cōnsilium cēpit.","After learning these things, Caesar formed a plan."]],"vocab":[["nōn sōlum... sed etiam","not only... but also"],["ut... ita","as... so"],["cum... tum","both... and / when... then"],["tantō... quantō","the more... the more"],["prūdēns","prudent"],["glōria","glory"],["perīculum","danger"],["cognōscō","learn / recognise"],["cōnsilium capiō","form a plan"],["periodus","periodic sentence"],["emphasis","emphasis"],["hyperbaton","separation of linked words"]],"exercises":[{"t":"fill","q":"not only... but also: nōn sōlum... sed ___","a":["etiam"],"ex":"<b>nōn sōlum... sed etiam</b> is a correlative pair. Spotting the first member tells you a second is coming and helps you hold a long period together."},{"t":"mcq","q":"A sound first step in reading a long sentence is to:","opts":["mark finite verbs and clause introducers","translate every word in order","ignore endings","find an English translation"],"a":0,"ex":"Find the finite verbs and the words that introduce clauses first; that gives you the skeleton. Translating linearly from the first word is what causes long sentences to collapse."},{"t":"fill","q":"the more... the more: tantō... ___","a":["quantō"],"ex":"<b>quantō... tantō</b> with comparatives means 'the more... the more'. The usual order puts <b>quantō</b> first, as in the Nepos passage in the Reading Room."},{"t":"fill","q":"After these things were learned: His rēbus ___.","a":["cognītīs"],"ex":"<b>Hīs rēbus cognitīs</b> is a formulaic ablative absolute in historical prose, roughly 'this being learned'. Caesar uses it as a paragraph hinge."},{"t":"mcq","q":"Hyperbaton is:","opts":["separation of words that belong together","a passive verb","a case ending","a prose author"],"a":0,"ex":"Hyperbaton separates words that agree, often framing a line or clause between them. It signals emphasis and is pervasive in poetry."},{"t":"fill","q":"Caesar formed a plan: Caesar cōnsilium ___.","a":["cēpit"],"ex":"<b>cōnsilium capere</b> is a fixed idiom, 'to form a plan'. Latin builds many expressions from a colourless verb plus a noun."},{"t":"parse","form":"quō ... eō","q":"With two comparatives this pair means:","opts":["the more ... the more","because ... therefore","although ... nevertheless","when ... then"],"a":0,"ex":"<b>Quō longius, eō melius</b> — 'the further, the better'. The variant <b>quantō ... tantō</b> does the same job."},{"t":"parse","form":"hyperbaton","q":"Which line shows hyperbaton?","opts":["<i>magnum iter</i> ... <i>fēcit</i> ... <i>periculōsum</i>","Caesar mīlitēs convocāvit","in urbe manēbant","hostēs fūgērunt"],"a":0,"ex":"Splitting <b>magnum ... periculōsum</b> away from each other and from their noun frames the line and throws weight onto the separated words. Poets do this constantly; so does Cicero at climaxes."},{"t":"trans","form":"Postquam hoc audīvit, discessit.","q":"Rewrite the first clause as an ablative absolute:","a":["Hōc audītō, discessit","hoc audito, discessit"],"ex":"<b>Hōc audītō</b> compresses a whole clause into two words. Latin prose prefers this compression where English prefers a subordinate clause."},{"t":"trans","form":"Caesar vēnit. Caesar vīdit. Caesar vīcit.","q":"Compress into Caesar's own phrasing:","a":["Vēnī, vīdī, vīcī","veni vidi vici"],"ex":"Asyndeton — no connectives — plus first person and a rising tricolon. The rhetorical effect comes from what is left out."},{"t":"pick","s":"Nōn sōlum urbem cēpit sed etiam incolās servāvit.","q":"Click the second half of the correlative pair.","a":"sed","ex":"<b>Nōn sōlum ... sed etiam</b>. Spotting the first member tells you a second is coming, which is how you hold a long period in your head."},{"t":"pick","s":"Quae cum ita sint, dē bellō dīcam.","q":"Click the connecting relative.","a":"Quae","ex":"A relative opening a sentence refers back to what came before: 'Since these things are so'. Cicero uses this transition constantly."},{"t":"mcq","q":"A Latin 'period' is:","opts":["a long sentence whose sense is suspended until the end","a full stop","a historical era","a metrical unit"],"a":0,"ex":"Subordinate material is stacked first and the main verb withheld, so the sense snaps shut at the close. Reading to the full stop before translating is not optional."},{"t":"mcq","q":"Latin prose tends to place emphatic words:","opts":["first or last in their clause","always second","always next to the verb","at random"],"a":0,"ex":"The two ends of a clause are the strong positions. When a word appears somewhere surprising, that displacement is usually the author's point."},{"t":"fill","q":"Connect two clauses causally: Fūgērunt, ___ hostēs timēbant.","a":["quod","quia","nam"],"ex":"<b>quod</b> or <b>quia</b> with the indicative gives the writer's own reason; <b>quod</b> with the subjunctive would give someone else's alleged reason."},{"t":"fill","q":"and so, therefore (a single connective): ___","a":["itaque","igitur","ergō","ergo"],"ex":"<b>Itaque</b> normally opens its clause; <b>igitur</b> normally stands second. Connectives are how Latin signposts the shape of an argument."}]},{"id":"a6","title":"Poetry, metre & reading without a translation","subtitle":"From grammatical decoding to literary attention","grammar":"<h3>Dactylic hexameter</h3><p>Each line has six feet. A foot is usually a dactyl (— ⏑ ⏑) or spondee (— —); the fifth is commonly a dactyl, and the sixth ends — x. Elision and vowel quantity matter.</p>\n<h3>Poetic language</h3><p>Expect freer word order, omitted forms of <b>sum</b>, Greek forms, archaism, and words separated for emphasis or sound. Do not treat prose order as a mechanical key.</p>\n<h3>Graduated assistance</h3><p>In the Reading Room, first read unaided; then reveal lexical glosses, notes and finally the translation. The aim is to remove assistance over repeated readings.</p>","examples":[["Arma virumque canō.","I sing of arms and the man."],["Carpe diem.","Seize the day."],["Omnia vincit Amor.","Love conquers all things."],["Sunt lacrimae rērum.","There are tears for things / the world’s suffering has tears."]],"vocab":[["hexameter","hexameter"],["dactylus","dactyl"],["spondēus","spondee"],["elīsiō","elision"],["caesūra","caesura"],["quantitās","quantity"],["versus","verse / line"],["carmen","poem / song"],["poēta","poet"],["canō","sing"],["lacrimae","tears"],["rēs","thing / circumstance"]],"exercises":[{"t":"mcq","q":"A dactyl is:","opts":["— ⏑ ⏑","— — only","⏑ ⏑ ⏑","x x"],"a":0,"ex":"A dactyl is one long followed by two shorts. The hexameter line has six feet, with a spondee — two longs — freely substituted in the first four."},{"t":"fill","q":"Seize the day: ___ diem.","a":["Carpe"],"ex":"<b>Carpe</b> is the imperative of <b>carpō</b>, literally to pluck. Horace's metaphor is agricultural rather than military."},{"t":"mcq","q":"The final translation should normally be revealed:","opts":["after attempting the Latin","before looking at the Latin","instead of reading","automatically"],"a":0,"ex":"Attempt the Latin first, then use glosses, then notes, and only then the translation. Reaching for the translation first turns reading into checking."},{"t":"fill","q":"Love conquers all things: Omnia vincit ___.","a":["Amor"],"ex":"<b>Omnia vincit Amor</b>, Vergil, <i>Eclogues</i> 10.69. <b>Omnia</b> is neuter accusative plural, the object, and <b>Amor</b> the nominative subject in final position."},{"t":"mcq","q":"Poetry often has:","opts":["freer word order and elision","no case endings","only present tense","no subordinate clauses"],"a":0,"ex":"Poetic word order serves metre and emphasis, and elision drops a final vowel before a following vowel. Endings, not position, remain your guide."},{"t":"fill","q":"I sing of arms and the man: Arma virumque ___.","a":["canō"],"ex":"<b>canō</b> is present, not future: the poet declares what he is doing now. It opens the <i>Aeneid</i>, which you can read in the Reading Room."},{"t":"parse","form":"Arma virumque canō","q":"Scan the first foot:","opts":["dactyl (— ⏑ ⏑)","spondee (— —)","trochee (— ⏑)","iamb (⏑ —)"],"a":0,"ex":"<b>Ār-ma vi-</b> — long, short, short. Vergil opens on a dactyl, which is what gives the line its forward drive."},{"t":"parse","form":"multum ille et terris","q":"What happens metrically at <b>multum ille</b>?","opts":["elision — the -um is not pronounced","nothing","a caesura","a spondee is forbidden"],"a":0,"ex":"A final vowel or <b>-m</b> before a word beginning with a vowel or <b>h</b> is elided. You must elide when scanning or the line will not resolve."},{"t":"trans","form":"Omnia vincit Amor.","q":"Give the subject:","a":["Amor","amor"],"ex":"<b>Amor</b> is nominative and stands last for emphasis; <b>Omnia</b> is neuter accusative plural. Position is rhetoric, not grammar."},{"t":"trans","form":"Carpe diem.","q":"Put the imperative into the plural:","a":["Carpite diem","carpite diem"],"ex":"<b>Carpite</b>. Third-conjugation imperatives are <b>-e</b> singular and <b>-ite</b> plural; <b>dīc, dūc, fac, fer</b> are the four irregulars."},{"t":"pick","s":"Vīvāmus, mea Lesbia, atque amēmus.","q":"Click the vocative.","a":"Lesbia","ex":"<b>mea Lesbia</b> is direct address, set between the two subjunctives. In the first declension the vocative is identical to the nominative."},{"t":"pick","s":"Tītyre, tū patulae recubāns sub tegmine fāgī.","q":"Click the present participle.","a":"recubāns","ex":"<b>recubāns</b> agrees with <b>tū</b>. Note the hyperbaton: <b>patulae ... fāgī</b> frames the line with three words in between."},{"t":"mcq","q":"The dactylic hexameter's last two feet are almost always:","opts":["dactyl then spondee","two dactyls","two spondees","spondee then dactyl"],"a":0,"ex":"The fixed close gives the line its recognisable cadence — <i>ārmă vĭ | rūmquĕ că | nō</i> and so on to <i>… Rō-mae</i>. Once you hear it, scansion becomes largely a matter of working backwards."},{"t":"mcq","q":"When should you finally read the printed translation?","opts":["after the Latin, the glosses and the notes have all been tried","before starting","instead of the Latin","alongside every line"],"a":0,"ex":"Used first, a translation replaces reading with checking. Used last, it confirms or corrects an understanding you actually built."},{"t":"fill","q":"Happy is he who could learn the causes of things: Fēlīx quī potuit rērum cognōscere ___.","a":["causās","causas"],"ex":"Vergil, <i>Georgics</i> 2.490. <b>causās</b> is the accusative object of <b>cognōscere</b>, held back to the line's end."},{"t":"fill","q":"Vowel length in poetry determines:","a":["metre","the metre","quantity","scansion"],"ex":"Latin verse is quantitative, built on long and short syllables rather than stress. This is why macrons are not decoration but the substance of the metre."}]}]}];
const READINGS=[{"id":"c1","title":"In the villa","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Iūlia in villā habitat. Villa parva est, sed hortum magnum habet. Iūlia rosās amat et aquam ad hortum portat. Fīlia Iūliae cum amīcā ambulat. In hortō sedent et librum legunt. Ad vesperum agricola ex agrīs venit. Tum in villā cēnam exspectant.","translation":"Julia lives in a country house. The house is small, but it has a large garden. Julia loves roses and carries water to the garden. Julia’s daughter walks with a friend. They sit in the garden and read a book. Toward evening the farmer comes from the fields. Then they wait for dinner in the house.","gloss":{"villā":"in a villa / country house (abl. after in)","hortum":"garden (acc.)","rosās":"roses (acc. pl.)","portat":"carries","hortō":"garden (abl. after in, place where)","legunt":"they read","vesperum":"evening (acc. after ad)","agrīs":"fields (abl. pl. after ex)","cēnam":"dinner (acc.)","exspectant":"they await"},"notes":["Contrast <b>in villā</b> (ablative, place where) with <b>ad hortum</b> and <b>ex agrīs</b>: <b>in</b> plus the ablative means inside, <b>ad</b> plus the accusative means toward, <b>ex</b> plus the ablative means out of.","<b>Iūliae</b> is genitive: “Julia’s daughter.” The same ending would be nominative plural, and only the sentence decides.","<b>sedent</b> and <b>legunt</b> have an understood plural subject — the daughter and her friend. Nothing but the <b>-nt</b> tells you so."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c2","title":"A morning in the Forum","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Mārcus māne ad forum ambulat. Multōs virōs videt: servī aquam portant, dominus amīcum salūtat, puer epistulam ad tabernam portat. In forō magna turba est. Mārcus cum amīcō ad templum properat. Ibi poēta clārus fābulam nārrat. Verba poētae Mārcum dēlectant.","translation":"Marcus walks to the Forum in the morning. He sees many men: slaves are carrying water, a master greets a friend, a boy carries a letter to a shop. In the Forum there is a great crowd. Marcus hurries with a friend to the temple. There a famous poet is telling a story. The poet’s words delight Marcus.","gloss":{"māne":"in the morning (indeclinable adverb)","forum":"the Forum (acc. after ad)","virōs":"men (acc. pl.)","servī":"slaves (nom. pl., subject of portant)","dominus":"master, owner","epistulam":"letter (acc.)","tabernam":"shop (acc. after ad)","turba":"crowd","properat":"hurries","fābulam":"story (acc.)","nārrat":"tells, relates","dēlectant":"they delight, please"},"notes":["<b>Multōs virōs</b> is accusative plural after <b>videt</b>; the <b>-ōs</b> on both words is the agreement at work.","Three short clauses share one colon. Each has its own nominative subject — <b>servī</b>, <b>dominus</b>, <b>puer</b> — and you can find them by their endings before you translate anything.","<b>poētae</b> is genitive singular, “the poet’s.” Remember that <b>poēta</b> is masculine, which is why the adjective in the previous sentence is <b>clārus</b>."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c3","title":"The journey to Rome","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Lūcius multōs annōs in oppidō parvō habitābat. Rōmam tamen vidēre cupiēbat. Itaque cum frātre iter longum fēcit. Prīmō diē via facilis erat; deinde magna tempestās caelum obscūrāvit. Viātōrēs in caupōnā mānsērunt. Postrīdiē caelum clārum fuit, et ante noctem moenia Rōmae vīdērunt.","translation":"Lucius had been living for many years in a small town, but he wanted to see Rome. And so he made a long journey with his brother. On the first day the road was easy; then a great storm darkened the sky. The travellers stayed in an inn. The next day the sky was clear, and before night they saw the walls of Rome.","gloss":{"oppidō":"town (abl.)","cupiēbat":"he was longing, wanted (imperfect)","itaque":"and so","iter":"journey (n., iter, itineris)","fēcit":"he made (perfect of faciō)","tempestās":"storm","obscūrāvit":"darkened (perfect)","Viātōrēs":"travellers","caupōnā":"inn (abl.)","mānsērunt":"they remained (perfect of maneō)","postrīdiē":"on the next day","moenia":"walls (n. pl.)"},"notes":["<b>Rōmam</b> is accusative of motion toward with no preposition. Names of towns, plus <b>domus</b> and <b>rūs</b>, work this way.","The imperfects <b>habitābat</b> and <b>cupiēbat</b> supply the standing background; the perfects <b>fēcit</b>, <b>obscūrāvit</b>, <b>mānsērunt</b>, <b>vīdērunt</b> move the story forward. Tense choice is narrative structure, not decoration.","<b>Rōmae</b> is genitive after <b>moenia</b> — the walls of Rome, not motion to Rome. Compare <b>Rōmam</b> in the second sentence."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c4","title":"A message from the frontier","author":"Controlled Latin","work":"Original graded reading","level":"Core morphology","kind":"Controlled","text":"Nuntius nocte ad urbem vēnit. Portae iam clausae erant, sed custōs clāmōrem audīvit. “Ā duce missus sum,” inquit nuntius. “Hostēs flūmen trānsiērunt et castra nostra oppugnant.” Custōs portam aperuit; nuntius ad senātum ductus est. Eādem nocte novae cōpiae missae sunt.","translation":"A messenger came to the city at night. The gates had already been closed, but the guard heard shouting. “I have been sent by the commander,” said the messenger. “The enemy have crossed the river and are attacking our camp.” The guard opened the gate; the messenger was led to the senate. That same night new forces were sent.","gloss":{"nuntius":"messenger","custōs":"guard","clāmōrem":"shout / noise","ā duce":"by the commander","missus sum":"I was/have been sent","flūmen":"river","trānsiērunt":"crossed","castra":"camp (neut. pl.)","oppugnant":"attack","ductus est":"was led","cōpiae":"forces / troops"},"notes":["<b>clausae erant</b> is pluperfect passive.","<b>castra</b> is grammatically plural though translated singular.","<b>Eādem nocte</b> is ablative of time when."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c5","title":"The senator’s decision","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Senātor, quī rem pūblicam diū servāverat, cīvēs convocāvit. Dīxit urbem in magnō perīculō esse. Rogāvit quid cīvēs facere dēbērent et quī mīlitēs dūcere posset. Iuvenis quīdam surrēxit ut auxilium offerret. Tam fortiter dīxit ut omnēs eum laudārent. Senātus eum mīsit nē hostēs urbem caperent.","translation":"A senator who had long protected the state summoned the citizens. He said that the city was in great danger. He asked what the citizens ought to do and who could lead the soldiers. A certain young man rose to offer help. He spoke so bravely that everyone praised him. The senate sent him so that the enemy would not capture the city.","gloss":{"rem pūblicam":"the state, the commonwealth","diū":"for a long time","servāverat":"had preserved (pluperfect)","convocāvit":"summoned","in magnō perīculō":"in great danger","dēbērent":"ought (imperfect subjunctive in an indirect question)","Iuvenis":"young man","surrēxit":"stood up","auxilium":"help","offerret":"might offer (purpose)","laudārent":"praised (result)","caperent":"might capture (negative purpose)"},"notes":["The relative <b>quī</b> is nominative because it is the subject of <b>servāverat</b> inside its own clause, even though its antecedent <b>Senātor</b> is the subject of the main verb.","<b>urbem ... esse</b> is indirect statement: accusative subject plus infinitive after <b>Dīxit</b>.","Three subjunctive clauses do three different jobs here: <b>ut ... offerret</b> is purpose, <b>ut ... laudārent</b> is result after <b>Tam</b>, and <b>nē ... caperent</b> is negative purpose. Read the introducing word and the main-clause signpost before you decide."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c6","title":"The storm at sea","author":"Controlled Latin","work":"Original graded reading","level":"Complex syntax","kind":"Controlled","text":"Nāvis, quae vesperī portum relīquerat, in altum contendēbat. Nautae, quamquam ventum timēbant, cursum tenēbant. Mediā nocte tanta tempestās fuit ut undae nāvem pulsārent. Magister clāmāvit ut vēla contraherentur. Nautae tam fortiter labōrāvērunt ut nāvis servārētur. Cum prīma lūx rediisset, īnsulam procul vīdērunt.","translation":"The ship, which had left harbour in the evening, was making for the open sea. Although the sailors feared the wind, they held their course. At midnight there was so great a storm that the waves battered the ship. The captain shouted for the sails to be drawn in. The sailors worked so bravely that the ship was saved. When first light had returned, they saw an island far off.","gloss":{"vesperī":"in the evening","relīquerat":"had left (pluperfect of relinquō)","in altum":"into the deep, the open sea","contendēbat":"was making for, was straining","quamquam":"although (with the indicative)","cursum":"course (acc.)","undae":"waves","pulsārent":"battered (result)","Magister":"ship’s master, captain","contraherentur":"should be drawn in","servārētur":"was saved (imperfect passive subjunctive)","rediisset":"had returned (pluperfect subjunctive after cum)","procul":"far off"},"notes":["<b>quamquam</b> takes the indicative — a plain statement of fact conceded. Contrast the last sentence, where <b>Cum</b> takes the subjunctive.","<b>tanta ... ut</b> and <b>tam ... ut</b> are result clauses: the main clause plants a signpost, and <b>ut</b> reports what actually followed. A purpose clause has no such signpost.","<b>ut vēla contraherentur</b> after <b>clāmāvit</b> is an indirect command, and the verb inside it is passive: the order is that the sails <i>be</i> drawn in."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c7","title":"The monk and the manuscript","author":"Controlled Latin","work":"Original graded reading","level":"Reading Latin","kind":"Controlled","text":"In monasteriō vetere monachus librum antīquum invēnit. Multae litterae aetāte obscūrātae erant, sed titulus adhūc legī poterat. Monachus putāvit librum ā poētā Rōmānō scrīptum esse. Nē verba perīrent, exemplum facere cōnstituit. Mēnsibus labōrāvit, singulās litterās magnā cūrā trānscrībēns. Opere cōnfectō, exemplum in armāriō posuit.","translation":"In an old monastery a monk found an ancient book. Many letters had been obscured by age, but the title could still be read. The monk thought that the book had been written by a Roman poet. So that the words would not perish, he decided to make a copy. He worked for months, transcribing each letter with great care. When the work was finished, he placed the copy in a cupboard.","gloss":{"monasteriō":"monastery (abl.)","monachus":"monk","invēnit":"found","aetāte":"by age (ablative of cause)","obscūrātae erant":"had been obscured (pluperfect passive)","titulus":"title","adhūc":"still","legī poterat":"could be read (present passive infinitive)","perīrent":"might perish (negative purpose)","exemplum":"copy","Mēnsibus":"for months (ablative of time)","singulās":"each individual","trānscrībēns":"transcribing (present participle)","Opere cōnfectō":"the work having been finished (ablative absolute)","armāriō":"cupboard, book-chest (abl.)"},"notes":["<b>librum ... scrīptum esse</b> is a perfect passive indirect statement after <b>putāvit</b>: accusative subject, perfect passive infinitive.","<b>trānscrībēns</b> is a present participle agreeing with the subject <b>monachus</b>, describing action simultaneous with <b>labōrāvit</b>.","<b>Opere cōnfectō</b> is an ablative absolute. Neither word has any grammatical role in the main clause — that detachment is what “absolute” means."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c8","title":"On the stars","author":"Controlled Latin","work":"Original neo-Latin reading","level":"Reading Latin","kind":"Controlled","text":"Astronomī stellās observant ut nātūram caelī intellegant. Lūx, quae ā stellīs ad terram mittitur, per immēnsa spatia iter facit. Quō longius stella abest, eō antīquiōrem lūcem vidēmus. Itaque caelum spectantēs nōn modo loca remōta sed etiam tempora praeterita contemplāmur.","translation":"Astronomers observe the stars in order to understand the nature of the heavens. Light, which is sent from the stars to Earth, makes a journey through immense spaces. The farther away a star is, the older the light we see. And so, when looking at the sky, we contemplate not only distant places but also past times.","gloss":{"astronomī":"astronomers","stellās":"stars (acc. pl.)","observant":"they observe","nātūram caelī":"the nature of the heavens","lūx":"li

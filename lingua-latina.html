*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.58 system-ui,-apple-system,"Segoe UI",sans-serif}.layout{display:flex;min-height:100vh}.sidebar{width:270px;flex:0 0 auto;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:15px 11px 40px}.brand{display:flex;gap:10px;align-items:center;padding:5px 9px 15px}.seal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff7e6;font-family:Georgia,serif;font-weight:700;font-size:20px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}.brand b{font-family:Georgia,serif;font-size:18px}.brand small{display:block;color:var(--muted);font-size:11.5px}.navsec{text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted);font-size:10.5px;margin:13px 10px 4px}.navlink{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--ink);border-radius:8px;padding:8px 10px;text-align:left;font:inherit;font-size:14px;cursor:pointer}.navlink:hover{background:var(--card2)}.navlink.active{background:var(--soft);color:var(--acc);font-weight:700}.navlink .ic{width:21px;text-align:center}.navlink .badge{margin-left:auto;color:var(--muted);font-size:11px}.main{flex:1;min-width:0;max-width:940px;margin:0 auto;padding:28px 34px 90px}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.22}h1{font-size:29px;margin:0 0 6px}h2{font-size:21px;margin:28px 0 11px}h3{font-size:17px;margin:21px 0 8px}.sub{margin:0 0 20px;color:var(--muted)}a{color:var(--acc2)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px 21px;margin-bottom:15px;box-shadow:var(--shadow)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin:17px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat b{font-size:25px;display:block}.stat small{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}.btn:hover{background:var(--card2)}.btn.primary{background:var(--acc);border-color:var(--acc);color:white}.btn.small{padding:5px 10px;font-size:12.5px}.pill{display:inline-block;border-radius:99px;padding:2px 9px;background:var(--card2);color:var(--muted);font-size:11.5px;font-weight:700}.pill.acc{background:var(--soft);color:var(--acc)}.progress{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.progress i{height:100%;display:block;background:var(--acc);border-radius:99px}.levelcard,.unitrow,.readingrow{display:block;color:inherit;text-decoration:none;cursor:pointer}.levelcard:hover,.unitrow:hover,.readingrow:hover{border-color:var(--muted)}.leveltop{display:flex;gap:10px;align-items:baseline}.leveltop b{font-size:18px}.leveltop span{color:var(--muted)}.leveltop .pct{margin-left:auto}.unitrow,.readingrow{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;box-shadow:var(--shadow)}.unitrow{display:flex;gap:13px;align-items:center}.num{width:35px;height:35px;display:grid;place-items:center;border-radius:50%;background:var(--card2);font-weight:800;flex:none}.unitrow.done .num{background:var(--acc);color:white}.unitrow .t{flex:1;min-width:0}.unitrow .t b,.readingrow b{display:block}.unitrow small,.readingrow small{color:var(--muted)}.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0}.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:9px 13px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}.tab.active{color:var(--acc);border-color:var(--acc)}.grammar p{margin:9px 0}.grammar ul,.grammar ol{padding-left:23px}.tip{border-left:3px solid var(--gold);background:var(--goldsoft);padding:10px 13px;border-radius:0 9px 9px 0;margin:12px 0}.gr{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}.gr th,.gr td{border:1px solid var(--line);padding:7px 10px;text-align:left}.gr th{background:var(--card2)}.example{border-bottom:1px dashed var(--line);padding:9px 1px}.example .la{font-family:Georgia,serif;font-size:17px}.example .en{display:block;color:var(--muted);font-size:13.5px}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.vocab div{padding:8px 2px;border-bottom:1px solid var(--line)}.vocab b{font-family:Georgia,serif;color:var(--acc)}.exercise{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;margin:15px 0}.opts{display:grid;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 12px;text-align:left;font:inherit;cursor:pointer}.opt:hover{background:var(--card2)}.opt.correct{border-color:var(--good);background:rgba(47,107,60,.1)}.opt.wrong{border-color:var(--bad);background:rgba(162,43,43,.1)}.answerrow{display:flex;gap:8px}.answerrow input,.search,.select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 12px;font:inherit}.feedback{margin-top:10px;font-weight:650}.ok{color:var(--good)}.no{color:var(--bad)}.readfilter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.readingrow{display:grid;grid-template-columns:1fr auto;gap:15px}.readingmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.latintext{font:20px/1.85 Georgia,"Times New Roman",serif;white-space:pre-line;letter-spacing:.005em}.word{border:0;border-bottom:1px dotted var(--acc);padding:0;background:transparent;color:inherit;font:inherit;cursor:pointer}.word:hover{background:var(--soft)}.aidbar{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.aidbar .btn.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}.glosstip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90%;text-align:center}.aidbox{background:var(--card2);border-radius:10px;padding:13px 15px;margin:13px 0}.notes li{margin:6px 0}.source{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}.flashstage{max-width:590px;margin:0 auto}.flashcard{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:32px;box-shadow:var(--shadow);cursor:pointer}.flashcard .front{font:700 28px/1.25 Georgia,serif}.flashcard .back{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:20px;color:var(--muted)}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.grades button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 5px;border-radius:9px;font-weight:750;cursor:pointer}.labtable{overflow-x:auto}.banner{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px}.menubtn{display:none;position:fixed;right:18px;bottom:18px;z-index:70;width:52px;height:52px;border:0;border-radius:50%;background:var(--acc);color:white;font-size:22px;box-shadow:0 5px 20px rgba(0,0,0,.3)}
@media(max-width:840px){.sidebar{position:fixed;z-index:60;transform:translateX(-105%);transition:.2s;height:100dvh}.sidebar.open{transform:none;box-shadow:0 0 45px rgba(0,0,0,.35)}.menubtn{display:block}.main{padding:20px 15px 90px;max-width:100%}.grid2,.vocab{grid-template-columns:1fr}.readingrow{grid-template-columns:1fr}.gr{display:block;overflow-x:auto}.grades{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
const COURSE=[{"id":"found","short":"I","icon":"Ⅰ","label":"Stage I — Foundations","tagline":"Forms that unlock sentences","desc":"Pronunciation, the case system, first and second declensions, present verbs and essential sentence patterns.","units":[{"id":"f1","title":"Sounds, quantities & the case idea","subtitle":"How Latin encodes meaning in endings","grammar":"<h3>Pronunciation and vowel quantity</h3>\n<p>This course uses a restored Classical pronunciation. <b>c</b> is always hard as in <i>cat</i>; <b>g</b> is always hard; <b>v</b> is approximately English <i>w</i>; <b>ae</b> is a diphthong like “eye.” A macron marks a long vowel: <b>ā ē ī ō ū</b>.</p>\n<p>Vowel length can distinguish words: <b>liber</b> “book” and <b>līber</b> “free”; <b>malum</b> “evil” and <b>mālum</b> “apple.” Many modern editions omit macrons, so the Reading Room can display texts without them.</p>\n<h3>Cases</h3><p>Latin changes noun endings to show function. The principal cases are nominative (subject), accusative (direct object), genitive (possession), dative (indirect object), ablative (means, manner, separation and many prepositions), and vocative (address).</p>\n<div class=\"tip\"><b>Reading habit:</b> find the finite verb, then identify nominatives and accusatives. Do not assume the first noun is the subject.</div>","examples":[["Rōma in Italiā est.","Rome is in Italy."],["Puella poetam videt.","The girl sees the poet."],["Poeta puellam videt.","The poet sees the girl."],["Salvē, amīce!","Hello, friend!"]],"vocab":[["Rōma","Rome"],["Italia","Italy"],["puella","girl"],["poēta","poet"],["amīcus","friend"],["videt","sees"],["est","is"],["in","in / on"],["salvē","hello"],["casus","case"],["nōmen","noun / name"],["verbum","verb / word"]],"exercises":[{"t":"mcq","q":"In restored Classical Latin, <b>c</b> is normally:","opts":["always hard","soft before e and i","silent","pronounced sh"],"a":0,"ex":"Restored classical pronunciation has no soft <i>c</i>: <b>Cicero</b> is <i>KEE-ke-ro</i>, <b>caelum</b> is <i>KIGH-lum</i>. The soft <i>c</i> you may know from church Latin is a later development."},{"t":"mcq","q":"Which case normally marks the direct object?","opts":["accusative","nominative","genitive","vocative"],"a":0,"ex":"The accusative is the object case. Because Latin marks the object on the noun itself, word order is free: <b>puellam poēta videt</b> and <b>poēta puellam videt</b> both mean the poet sees the girl."},{"t":"fill","q":"Rōma in Italiā ___.","a":["est"],"ex":"<b>est</b> is 3rd singular of <i>sum</i>. Note that <b>Italiā</b> already carries the long <i>-ā</i> of the ablative after <b>in</b> meaning 'in, within'."},{"t":"mcq","q":"A macron marks:","opts":["a long vowel","stress only","a silent vowel","a diphthong"],"a":0,"ex":"A macron marks vowel <i>length</i>, not stress. Length is phonemic: <b>malum</b> (evil) and <b>mālum</b> (apple) are different words, and metre in poetry depends entirely on it."},{"t":"fill","q":"Puella poetam ___.","a":["videt"],"ex":"<b>videt</b> is 3rd singular present. The <b>-t</b> supplies the subject 'she', so no pronoun is needed; <b>poetam</b> is accusative, hence the object."},{"t":"mcq","q":"In <i>Poeta puellam videt</i>, the object is:","opts":["puellam","poeta","videt","none"],"a":0,"ex":"The <b>-am</b> ending identifies <b>puellam</b> as accusative and therefore the object, even though it stands before the verb. Endings, not position, assign roles."}]},{"id":"f2","title":"First declension","subtitle":"Subjects, objects and possession","grammar":"<h3>First-declension endings</h3><table class=\"gr\"><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Nominative</td><td>-a</td><td>-ae</td></tr><tr><td>Accusative</td><td>-am</td><td>-ās</td></tr><tr><td>Genitive</td><td>-ae</td><td>-ārum</td></tr><tr><td>Dative</td><td>-ae</td><td>-īs</td></tr><tr><td>Ablative</td><td>-ā</td><td>-īs</td></tr></table>\n<p>Most first-declension nouns are feminine, but words for male persons such as <b>poēta</b>, <b>agricola</b> and <b>nauta</b> are masculine.</p>\n<p>Learn a noun by its nominative and genitive: <b>puella, puellae, f.</b> The genitive identifies the declension and supplies the stem.</p>","examples":[["Puella aquam portat.","The girl carries water."],["Puellae aquam portant.","The girls carry water."],["Fīlia agricolae cantat.","The farmer’s daughter sings."],["Nauta puellae rosam dat.","The sailor gives the girl a rose."]],"vocab":[["puella, -ae f.","girl"],["aqua, -ae f.","water"],["rosa, -ae f.","rose"],["fīlia, -ae f.","daughter"],["terra, -ae f.","land / earth"],["via, -ae f.","road / way"],["porta, -ae f.","gate"],["agricola, -ae m.","farmer"],["nauta, -ae m.","sailor"],["portat","carries"],["cantat","sings"],["dat","gives"]],"exercises":[{"t":"fill","q":"The girl (subject): puell___","a":["a"],"ex":"The nominative singular of the first declension is <b>-a</b>. It marks the subject, and its short final <i>-a</i> distinguishes it from the ablative <b>-ā</b>."},{"t":"fill","q":"The girls (subject): puell___","a":["ae"],"ex":"Nominative plural is <b>-ae</b>. This ending is ambiguous on its own — it is also genitive and dative singular — so context and the verb ending resolve it."},{"t":"fill","q":"The rose (object): ros___","a":["am"],"ex":"Accusative singular is <b>-am</b>. Compare <b>rosa</b> (subject) with <b>rosam</b> (object); the single consonant is the whole difference in meaning."},{"t":"mcq","q":"<i>agricola</i> is:","opts":["masculine despite first declension","always feminine","neuter","indeclinable"],"a":0,"ex":"A handful of first-declension nouns denoting male roles — <b>agricola</b>, <b>nauta</b>, <b>poēta</b>, <b>incola</b> — are masculine. Their adjectives follow the sense: <b>agricola bonus</b>, never <i>bona</i>."},{"t":"fill","q":"The farmer’s daughter: fīlia agricol___","a":["ae"],"ex":"The genitive singular <b>-ae</b> expresses possession: <b>fīlia agricolae</b>, the daughter <i>of the farmer</i>. It is identical in form to the nominative plural, which is why you learn nouns with the genitive attached."},{"t":"fill","q":"The girls carry water: Puellae aquam ___.","a":["portant"],"ex":"<b>portant</b> is 3rd plural, agreeing with the plural subject <b>puellae</b>. The <b>-nt</b> is what tells you <b>puellae</b> here is nominative plural rather than genitive singular."}]},{"id":"f3","title":"Second declension & adjectives","subtitle":"Gender and agreement","grammar":"<h3>Second declension</h3><p>Masculine nouns often end in <b>-us</b> or <b>-er</b>; neuters in <b>-um</b>. The genitive singular is <b>-ī</b>.</p>\n<table class=\"gr\"><tr><th></th><th>servus (m.)</th><th>bellum (n.)</th></tr><tr><td>Nom. sg.</td><td>servus</td><td>bellum</td></tr><tr><td>Acc. sg.</td><td>servum</td><td>bellum</td></tr><tr><td>Nom./acc. pl.</td><td>servī / servōs</td><td>bella</td></tr><tr><td>Gen. sg.</td><td>servī</td><td>bellī</td></tr></table>\n<h3>Adjective agreement</h3><p>An adjective agrees with its noun in gender, number and case, not necessarily in visible ending: <b>poēta bonus</b>, <b>puella bona</b>, <b>bellum magnum</b>.</p>\n<div class=\"tip\"><b>Neuter rule:</b> nominative and accusative are identical; their plural ends in <b>-a</b>.</div>","examples":[["Servus bonus labōrat.","The good slave works."],["Dominus servum bonum laudat.","The master praises the good slave."],["Bellum magnum timēmus.","We fear a great war."],["Poēta bonus carmen scrībit.","The good poet writes a poem."]],"vocab":[["servus, -ī m.","slave / servant"],["dominus, -ī m.","master"],["amīcus, -ī m.","friend"],["puer, puerī m.","boy"],["ager, agrī m.","field"],["bellum, -ī n.","war"],["dōnum, -ī n.","gift"],["templum, -ī n.","temple"],["bonus, -a, -um","good"],["magnus, -a, -um","great / large"],["parvus, -a, -um","small"],["laudat","praises"]],"exercises":[{"t":"fill","q":"a great war: bellum magn___","a":["um"],"ex":"<b>bellum</b> is second-declension neuter, so the adjective takes the neuter singular <b>-um</b>. Adjectives agree in case, number and gender — never simply in ending."},{"t":"fill","q":"good poets: poētae bon___","a":["ī"],"ex":"<b>poētae</b> is masculine despite its first-declension ending, so the adjective is masculine plural <b>bonī</b>, not <i>bonae</i>. This is the agreement trap of the previous unit in reverse."},{"t":"mcq","q":"Neuter plural nominative normally ends in:","opts":["-a","-ī","-ōs","-ae"],"a":0,"ex":"Neuter nominative and accusative plural always end in <b>-a</b>, in every declension. It is also the rule that neuter nominative and accusative are identical to each other."},{"t":"fill","q":"the master (object): domin___","a":["um"],"ex":"Second-declension masculine accusative singular is <b>-um</b>: <b>dominus</b> → <b>dominum</b>. Note it looks identical to the neuter nominative, which is why gender must be learned with the noun."},{"t":"mcq","q":"Correct agreement with <i>poēta</i>:","opts":["poēta bonus","poēta bona","poētam bonum as subject","poēta bonum"],"a":0,"ex":"<b>poēta</b> is masculine, so it takes <b>bonus</b>. Agreement follows grammatical gender, and here that gender contradicts the ending."},{"t":"fill","q":"We fear great wars: Bella magna ___.","a":["timēmus"],"ex":"<b>timēmus</b> is 1st plural of the second conjugation (<i>timeō, timēre</i>), whose stem vowel <b>-ē-</b> is preserved before the ending."}]},{"id":"f4","title":"Present active verbs","subtitle":"Person, number and flexible word order","grammar":"<h3>Present active endings</h3><table class=\"gr\"><tr><th></th><th>Ending</th><th>amāre</th></tr><tr><td>I</td><td>-ō / -m</td><td>amō</td></tr><tr><td>you sg.</td><td>-s</td><td>amās</td></tr><tr><td>he/she/it</td><td>-t</td><td>amat</td></tr><tr><td>we</td><td>-mus</td><td>amāmus</td></tr><tr><td>you pl.</td><td>-tis</td><td>amātis</td></tr><tr><td>they</td><td>-nt</td><td>amant</td></tr></table>\n<p>The four conjugations are recognised by the infinitive: <b>amāre, monēre, regere, audīre</b>. The verb ending usually makes a subject pronoun unnecessary.</p>\n<p>Latin word order is flexible, but prose often tends toward subject–object–verb. Emphasis and rhythm frequently alter that order.</p>","examples":[["Latīnam linguam discō.","I learn the Latin language."],["Librum legis.","You read a book."],["Puerī magistrum audiunt.","The boys listen to the teacher."],["Rōmānī urbem regunt.","The Romans rule the city."]],"vocab":[["amō, amāre","love"],["moneō, monēre","warn / advise"],["regō, regere","rule / guide"],["audiō, audīre","hear"],["legō, legere","read / choose"],["scrībō, scrībere","write"],["discō, discere","learn"],["videō, vidēre","see"],["veniō, venīre","come"],["lingua, -ae f.","language"],["liber, librī m.","book"],["magister, -trī m.","teacher"]],"exercises":[{"t":"fill","q":"I love: am___","a":["ō"],"ex":"First singular present active is <b>-ō</b>. In the first conjugation the stem vowel contracts into it: <i>amā- + ō</i> gives <b>amō</b>, not <i>amaō</i>."},{"t":"fill","q":"they hear: audi___","a":["unt"],"ex":"Fourth conjugation adds <b>-unt</b> with a linking <i>-u-</i>: <b>audiunt</b>. Compare third conjugation <b>regunt</b>, where no <i>-i-</i> appears."},{"t":"mcq","q":"The ending <b>-mus</b> means:","opts":["we","I","they","you singular"],"a":0,"ex":"<b>-mus</b> is the first person plural ending in every tense and both voices you will meet. Learning the six personal endings once saves memorising each tense separately."},{"t":"fill","q":"You read a book: Librum ___.","a":["legis"],"ex":"<b>legis</b> is 2nd singular of third-conjugation <i>legō, legere</i>. The stem vowel weakens to <i>-i-</i> before <b>-s</b>."},{"t":"mcq","q":"Latin normally needs a separate subject pronoun:","opts":["no, the verb ending often supplies it","always","only in poetry","only with nouns"],"a":0,"ex":"Latin is a pro-drop language: the personal ending is the subject. An explicit <b>tū</b> or <b>ego</b> is added only for emphasis or contrast."},{"t":"fill","q":"The Romans rule the city: Rōmānī urbem ___.","a":["regunt"],"ex":"<b>regunt</b>, third conjugation, 3rd plural. The subject <b>Rōmānī</b> is nominative plural and <b>urbem</b> accusative singular, so the roles are fixed regardless of order."}]},{"id":"f5","title":"Ablative & prepositions","subtitle":"Location, means and accompaniment","grammar":"<h3>Core ablative uses</h3><p><b>Means:</b> gladiō pugnat, “he fights with a sword.” <b>Manner:</b> magnā cūrā, “with great care.” <b>Accompaniment:</b> cum amīcō, “with a friend.” <b>Place where:</b> in urbe, “in the city.” <b>Separation:</b> ab urbe, “from the city.”</p>\n<p>Common accusative prepositions include <b>ad, per, post, ante, propter</b>. Common ablative prepositions include <b>ā/ab, cum, dē, ē/ex, sine, prō</b>.</p>\n<h3>in and sub</h3><p>With the ablative they usually answer “where?”; with the accusative, “to where?”: <b>in urbe</b> but <b>in urbem</b>.</p>","examples":[["Cum amīcō ambulō.","I walk with a friend."],["Gladiō pugnant.","They fight with a sword."],["In urbe habitat.","He lives in the city."],["In urbem venit.","He comes into the city."],["Sine aquā vīvere nōn possumus.","We cannot live without water."]],"vocab":[["cum + abl.","with"],["sine + abl.","without"],["ā/ab + abl.","from / by"],["ē/ex + abl.","out of"],["dē + abl.","down from / about"],["in + abl.","in / on"],["in + acc.","into / onto"],["ad + acc.","to / toward"],["per + acc.","through"],["gladius, -ī m.","sword"],["urbs, urbis f.","city"],["ambulō","walk"]],"exercises":[{"t":"mcq","q":"“Into the city” is:","opts":["in urbem","in urbe","ab urbe","cum urbe"],"a":0,"ex":"<b>in</b> takes the accusative for motion into and the ablative for rest inside. <b>in urbem</b> = into the city; <b>in urbe</b> = in the city."},{"t":"fill","q":"with a friend: cum amīc___","a":["ō"],"ex":"<b>cum</b> always governs the ablative, so second-declension <b>amīcus</b> becomes <b>amīcō</b>. Use <b>cum</b> for accompaniment, never for a tool."},{"t":"mcq","q":"Ablative of means usually uses:","opts":["no preposition","cum always","ad","per"],"a":0,"ex":"Ablative of means takes no preposition at all: <b>gladiō</b> = with a sword. Adding <b>cum</b> would mean the sword accompanied you as a companion."},{"t":"fill","q":"without water: sine aqu___","a":["ā"],"ex":"<b>sine</b> governs the ablative: <b>aqua</b> → <b>aquā</b>. The macron is the only written difference from the nominative, which is why quantities matter."},{"t":"fill","q":"They fight with a sword: Gladiō ___.","a":["pugnant"],"ex":"<b>pugnant</b> is 3rd plural, and the bare ablative <b>gladiō</b> is the instrument. This is the pattern to recognise: an unaccompanied ablative usually answers 'by what means?'"},{"t":"mcq","q":"<i>ad</i> normally governs:","opts":["accusative","ablative","genitive","dative"],"a":0,"ex":"<b>ad</b> governs the accusative and expresses motion toward. Contrast <b>ab</b> and <b>ex</b>, which govern the ablative and express motion away."}]},{"id":"f6","title":"sum, questions & possession","subtitle":"Being, having and asking","grammar":"<h3>sum — to be</h3><table class=\"gr\"><tr><td>sum</td><td>sumus</td></tr><tr><td>es</td><td>estis</td></tr><tr><td>est</td><td>sunt</td></tr></table>\n<p>Latin often expresses possession with the dative: <b>Mihi liber est</b>, literally “A book is to me,” meaning “I have a book.”</p>\n<h3>Questions</h3><p><b>-ne</b> asks a neutral yes/no question: <b>Venitne?</b> <b>nōnne</b> expects yes; <b>num</b> expects no. Question words include <b>quis, quid, ubi, cūr, quōmodo, quandō</b>.</p>","examples":[["Rōma magna est.","Rome is great."],["Mihi duo librī sunt.","I have two books."],["Ubi est forum?","Where is the forum?"],["Venitne magister?","Is the teacher coming?"],["Nōnne Latīnam linguam amās?","Surely you love Latin?"]],"vocab":[["sum, esse","be"],["quis?","who?"],["quid?","what?"],["ubi?","where?"],["cūr?","why?"],["quōmodo?","how?"],["quandō?","when?"],["forum, -ī n.","forum / marketplace"],["mihi","to/for me"],["tibi","to/for you"],["duo / duae","two"],["possum, posse","be able"]],"exercises":[{"t":"fill","q":"we are: ___","a":["sumus"],"ex":"<b>sum</b> is irregular; its first plural is <b>sumus</b>. It is worth learning the whole present out loud as a set: <i>sum, es, est, sumus, estis, sunt</i>."},{"t":"fill","q":"they are: ___","a":["sunt"],"ex":"<b>sunt</b>, 3rd plural. It also does duty for 'there are': <b>sunt multī</b> = there are many."},{"t":"mcq","q":"<i>Mihi liber est</i> means:","opts":["I have a book","The book is me","I am a book","The book is mine only emphatically"],"a":0,"ex":"Latin has no common verb for 'have' in this construction. The dative of the possessor plus <b>est</b> is the idiom: literally 'there is a book to me'."},{"t":"fill","q":"Where is the forum? ___ est forum?","a":["Ubi"],"ex":"<b>Ubi</b> asks 'where', with no motion implied. <b>Quō</b> asks where to, and <b>unde</b> where from."},{"t":"mcq","q":"A neutral yes/no question may use:","opts":["-ne","nōnne only","num only","quod"],"a":0,"ex":"Enclitic <b>-ne</b> attached to the first word asks a neutral question. <b>nōnne</b> expects the answer yes and <b>num</b> expects no — they are not interchangeable."},{"t":"fill","q":"Can we? ___ne?","a":["Possumus"],"ex":"<b>possumus</b> is <i>pos- + sumus</i>: <b>possum</b> is a compound of <b>sum</b>, and the prefix assimilates to <i>pot-/pos-</i> depending on what follows."}]}]},{"id":"morph","short":"II","icon":"Ⅱ","label":"Stage II — Core morphology","tagline":"The forms authentic prose assumes","desc":"Third declension, adjectives, pronouns, past and future tenses, and the passive system.","units":[{"id":"m1","title":"Third declension nouns","subtitle":"Use the genitive to find the stem","grammar":"<h3>Dictionary form matters</h3><p>Third-declension nominatives vary widely. The genitive singular ends in <b>-is</b> and reveals the stem: <b>rēx, rēgis</b>; <b>corpus, corporis</b>; <b>cīvitās, cīvitātis</b>.</p>\n<table class=\"gr\"><tr><th></th><th>M./F.</th><th>Neuter</th></tr><tr><td>Acc. sg.</td><td>-em</td><td>same as nom.</td></tr><tr><td>Gen. sg.</td><td>-is</td><td>-is</td></tr><tr><td>Nom. pl.</td><td>-ēs</td><td>-a / -ia</td></tr><tr><td>Gen. pl.</td><td>-um / -ium</td><td>-um / -ium</td></tr></table>\n<p>Some i-stems have <b>-ium</b> in the genitive plural and neuter <b>-ia</b>.</p>","examples":[["Rēx cīvitātem regit.","The king rules the state."],["Mīlitēs urbem dēfendunt.","The soldiers defend the city."],["Nōmen rēgis nōtum est.","The king’s name is known."],["Corpora hominum mortālia sunt.","Human bodies are mortal."]],"vocab":[["rēx, rēgis m.","king"],["mīles, mīlitis m.","soldier"],["cīvitās, -ātis f.","state / citizenship"],["urbs, urbis f.","city"],["nōmen, nōminis n.","name"],["corpus, corporis n.","body"],["homo, hominis m.","human being"],["pāx, pācis f.","peace"],["lēx, lēgis f.","law"],["virtūs, -ūtis f.","courage / excellence"],["dēfendō","defend"],["mortālis, -e","mortal"]],"exercises":[{"t":"fill","q":"the king (genitive): rēg___","a":["is"],"ex":"The genitive singular of the third declension is <b>-is</b>: <b>rēgis</b>. Strip that ending and you have the stem <b>rēg-</b>, on which every other case is built."},{"t":"fill","q":"soldiers (nom. plural): mīlit___","a":["ēs"],"ex":"Nominative plural of a masculine or feminine third-declension noun is <b>-ēs</b>: <b>mīlitēs</b>. It is identical to the accusative plural, so the verb usually resolves the ambiguity."},{"t":"mcq","q":"The stem of <i>corpus, corporis</i> is:","opts":["corpor-","corp-","corpus-","corpo-"],"a":0,"ex":"The nominative <b>corpus</b> hides the stem; the genitive <b>corporis</b> reveals <b>corpor-</b>. This is exactly why dictionaries list the genitive."},{"t":"fill","q":"bodies (nom./acc. pl.): corpor___","a":["a"],"ex":"Neuter plural is <b>-a</b> here as everywhere: <b>corpora</b>, nominative and accusative alike. Note the stem change from <b>corpus</b>."},{"t":"fill","q":"The soldiers defend the city: Mīlitēs urbem ___.","a":["dēfendunt"],"ex":"<b>dēfendunt</b>, 3rd plural. Both <b>mīlitēs</b> and the third-declension <b>urbem</b> come from this declension, whose accusative singular <b>-em</b> is a reliable object marker."},{"t":"mcq","q":"Third-declension genitive singular ends in:","opts":["-is","-ī","-ae","-ūs"],"a":0,"ex":"<b>-is</b> in the genitive singular is the signature of the third declension, as against <b>-ae</b> (first) and <b>-ī</b> (second). Identifying the declension is the first step to identifying the case."}]},{"id":"m2","title":"Third-declension adjectives & comparison","subtitle":"Two-termination adjectives and degrees","grammar":"<h3>Third-declension adjectives</h3><p>Many use two nominative forms: <b>fortis, forte</b> (m./f., n.); <b>ācer, ācris, ācre</b> uses three. Their ablative singular is commonly <b>-ī</b>, neuter plural <b>-ia</b>, genitive plural <b>-ium</b>.</p>\n<h3>Comparison</h3><p>Comparative: stem + <b>-ior</b> (m./f.), <b>-ius</b> (n.); superlative: stem + <b>-issimus</b>. Irregular: <b>bonus, melior, optimus</b>; <b>malus, peior, pessimus</b>; <b>magnus, maior, maximus</b>.</p>\n<p>The standard of comparison may use <b>quam</b> with the same case or the ablative alone.</p>","examples":[["Mīles fortis pugnat.","The brave soldier fights."],["Consilium utile est.","The plan is useful."],["Caesar Pompeio potentior erat.","Caesar was more powerful than Pompey."],["Haec via brevissima est.","This road is the shortest."]],"vocab":[["fortis, forte","brave / strong"],["ūtilis, -e","useful"],["facilis, -e","easy"],["difficilis, -e","difficult"],["celer, celeris, celere","swift"],["maior, maius","greater"],["minor, minus","smaller"],["melior, melius","better"],["optimus, -a, -um","best"],["pessimus, -a, -um","worst"],["brevissimus","shortest"],["potēns, potentis","powerful"]],"exercises":[{"t":"fill","q":"a useful plan: consilium util___","a":["e"],"ex":"<b>ūtilis</b> is a two-termination adjective: <b>-is</b> for masculine and feminine, <b>-e</b> for neuter. <b>Cōnsilium</b> is neuter, so <b>ūtile</b>."},{"t":"fill","q":"brave soldiers: mīlitēs fort___","a":["ēs"],"ex":"<b>fortis</b> in the masculine plural nominative is <b>fortēs</b>, matching <b>mīlitēs</b>. Third-declension adjectives follow the i-stem pattern, not the pattern of <i>rēx</i>."},{"t":"mcq","q":"Comparative neuter of <i>maior</i>:","opts":["maius","maior","maximum","magnius"],"a":0,"ex":"Comparatives decline as third-declension consonant stems, with the neuter differing: <b>maior</b> (m./f.) but <b>maius</b> (n.). Compare <b>melior / melius</b>."},{"t":"fill","q":"the best road: via optim___","a":["a"],"ex":"<b>optima</b> is the superlative of <b>bonus</b> and is irregular; it agrees with feminine <b>via</b>. Learn <i>bonus, melior, optimus</i> as a set alongside <i>malus, peior, pessimus</i>."},{"t":"mcq","q":"Superlatives usually contain:","opts":["-issim-","-ior-","-nt-","-bil-"],"a":0,"ex":"Regular superlatives insert <b>-issim-</b>: <b>fortissimus</b>, <b>clārissimus</b>. Adjectives in <b>-er</b> use <b>-rim-</b> and those in <b>-lis</b> often <b>-lim-</b>."},{"t":"fill","q":"Caesar was greater than Pompey: Caesar Pompeio ___ erat.","a":["maior"],"ex":"<b>maior</b> is the comparative of <b>magnus</b>. <b>Pompeiō</b> is ablative of comparison, an alternative to <b>quam Pompeius</b> in the nominative."}]},{"id":"m3","title":"Pronouns & demonstratives","subtitle":"Track reference without losing the sentence","grammar":"<p><b>is, ea, id</b> often means “he/she/it” or “that.” <b>hic, haec, hoc</b> points to what is near the speaker or present in discourse; <b>ille, illa, illud</b> to what is more remote or notable. <b>ipse</b> is intensive (“himself”); <b>idem</b> means “the same.”</p>\n<p>Pronouns preserve older genitives in <b>-īus</b> and datives in <b>-ī</b>: <b>eius, eī; huius, huic; illīus, illī</b>.</p>\n<div class=\"tip\">In reading, write the antecedent mentally: <b>is</b> = “that man just mentioned,” not merely “he.”</div>","examples":[["Hic liber meus est; ille tuus.","This book is mine; that one is yours."],["Caesar ipse vēnit.","Caesar himself came."],["Eius consilium probāmus.","We approve his/her plan."],["Eādem diē profectī sunt.","They set out on the same day."]],"vocab":[["is, ea, id","he / she / it; that"],["hic, haec, hoc","this"],["ille, illa, illud","that / famous"],["ipse, ipsa, ipsum","self / very"],["idem, eadem, idem","same"],["alius, alia, aliud","other / another"],["alter, altera, alterum","the other (of two)"],["eius","his / her / its"],["huic","to this"],["illō","by/with that"],["meus, -a, -um","my"],["tuus, -a, -um","your"]],"exercises":[{"t":"fill","q":"Caesar himself: Caesar ___","a":["ipse"],"ex":"<b>ipse</b> is the intensive pronoun, 'himself, in person'. It emphasises a noun; it does not make the sentence reflexive."},{"t":"mcq","q":"<i>eius</i> means:","opts":["his/her/its (of someone else)","his own","to him","with him"],"a":0,"ex":"<b>eius</b> is the genitive of <b>is, ea, id</b> and refers to someone other than the subject. For 'his own', referring back to the subject, Latin uses <b>suus</b>."},{"t":"fill","q":"on the same day: eādem di___","a":["ē"],"ex":"<b>diēs</b> is fifth declension, ablative <b>diē</b>. <b>Eādem</b> is the feminine ablative of <b>īdem</b>, agreeing with <b>diē</b> in its feminine use for a particular day."},{"t":"mcq","q":"<i>hic</i> normally points to:","opts":["what is near/present","only a dead person","the future","a question"],"a":0,"ex":"The three demonstratives are deictic: <b>hic</b> is near the speaker, <b>iste</b> near the person addressed, <b>ille</b> remote. <b>Ille</b> also picks up 'that famous'."},{"t":"fill","q":"that famous man: ___ vir","a":["ille"],"ex":"<b>ille</b> often carries the sense 'that well-known one'. It later gave rise to the definite article in the Romance languages."},{"t":"mcq","q":"The genitive singular of <i>hic</i> is:","opts":["huius","hī","hōc","hicī"],"a":0,"ex":"<b>hic, haec, hoc</b> has the genitive <b>huius</b> for all three genders, and dative <b>huic</b>. These pronominal genitives in <b>-īus</b> and datives in <b>-ī</b> recur in <b>ille</b>, <b>ipse</b>, <b>tōtus</b> and <b>sōlus</b>."}]},{"id":"m4","title":"Imperfect & future","subtitle":"Ongoing past and anticipated action","grammar":"<h3>Imperfect</h3><p>Present stem + <b>-bā-</b> + personal endings: <b>amābam, monēbās</b>. Third and fourth conjugations use <b>-ēbā-</b>: <b>regēbat, audiēbant</b>. It expresses ongoing, repeated or attempted past action.</p>\n<h3>Future</h3><p>First and second conjugations use <b>-bō, -bis, -bit...</b>. Third and fourth use <b>-am, -ēs, -et...</b>: <b>regam, regiēs, regent</b>; <b>audiam</b>.</p>","examples":[["Puer in hortō lūdēbat.","The boy was playing in the garden."],["Cotīdiē librōs legēbāmus.","We used to read books every day."],["Crās ad urbem veniēs.","Tomorrow you will come to the city."],["Rōmānī hostēs vincent.","The Romans will defeat the enemy."]],"vocab":[["lūdō, lūdere","play"],["hortus, -ī m.","garden"],["cotīdiē","every day"],["crās","tomorrow"],["heri","yesterday"],["semper","always"],["saepe","often"],["tum","then"],["hostis, -is m./f.","enemy"],["vincō, vincere","conquer"],["manēō, manēre","remain"],["agō, agere","do / drive"]],"exercises":[{"t":"fill","q":"I was loving: amā___","a":["bam"],"ex":"The imperfect sign is <b>-bā-</b> plus a personal ending: <b>amā-bā-m</b>. It is one of the most regular tenses in the language."},{"t":"fill","q":"they were hearing: audi___","a":["ēbant"],"ex":"Third and fourth conjugations insert <b>-ē-</b> before the marker: <b>audi-ē-bant</b>, <b>reg-ē-bant</b>. First and second use plain <b>-bā-</b>."},{"t":"mcq","q":"The imperfect commonly expresses:","opts":["ongoing or habitual past","completed past only","future command","present fact"],"a":0,"ex":"The imperfect views the past as unfinished: was doing, used to do, kept doing, began to do. The perfect, by contrast, reports the act as a completed whole."},{"t":"fill","q":"you will rule: reg___","a":["ēs"],"ex":"Third and fourth conjugations form the future in <b>-am, -ēs, -et</b>: <b>regēs</b>. First and second use <b>-bō, -bis, -bit</b> — mixing the two is the commonest error here."},{"t":"fill","q":"The Romans will conquer: Rōmānī ___.","a":["vincent"],"ex":"<b>vincent</b> is third conjugation, so future is <b>-ent</b>. Watch the contrast with the present <b>vincunt</b>; a single vowel distinguishes them."},{"t":"mcq","q":"Future of <i>amō</i>, 1st singular:","opts":["amābō","amābam","amem","amāvī"],"a":0,"ex":"<b>amābō</b> uses the first-conjugation future in <b>-bō</b>. <b>amābam</b> is imperfect, <b>amem</b> present subjunctive, <b>amāvī</b> perfect."}]},{"id":"m5","title":"The perfect system","subtitle":"Completed action and anterior time","grammar":"<h3>Principal parts</h3><p>Learn verbs as <b>amō, amāre, amāvī, amātum</b>. The third principal part supplies the perfect active stem.</p>\n<table class=\"gr\"><tr><th>Tense</th><th>Formation</th><th>Example</th></tr><tr><td>Perfect</td><td>perfect stem + ī, istī, it...</td><td>amāvī</td></tr><tr><td>Pluperfect</td><td>perfect stem + eram...</td><td>amāveram</td></tr><tr><td>Future perfect</td><td>perfect stem + erō...</td><td>amāverō</td></tr></table>\n<p>The perfect may be translated “I loved” or “I have loved,” depending on context.</p>","examples":[["Caesar Galliam vīcit.","Caesar conquered Gaul."],["Litterās scrīpsimus.","We wrote / have written the letter."],["Ubi vēnerat, amīcum vīdit.","When he had arrived, he saw his friend."],["Cum librum lēgeris, intellegēs.","When you have read the book, you will understand."]],"vocab":[["amō, amāre, amāvī, amātum","love"],["videō, vidēre, vīdī, vīsum","see"],["scrībō, scrībere, scrīpsī, scrīptum","write"],["legō, legere, lēgī, lēctum","read"],["veniō, venīre, vēnī, ventum","come"],["vincō, vincere, vīcī, victum","conquer"],["faciō, facere, fēcī, factum","do / make"],["dīcō, dīcere, dīxī, dictum","say"],["intellegō","understand"],["litterae, -ārum f.pl.","letter"],["Gallia, -ae f.","Gaul"],["postquam","after"]],"exercises":[{"t":"fill","q":"I loved / have loved: amā___","a":["vī"],"ex":"The third principal part <b>amāvī</b> supplies the perfect stem <b>amāv-</b>. The perfect endings <b>-ī, -istī, -it, -imus, -istis, -ērunt</b> are the same for every verb in the language."},{"t":"fill","q":"we wrote: scrīp___","a":["simus"],"ex":"<b>scrīpsimus</b> is the perfect stem <b>scrīps-</b> plus <b>-imus</b>. Many perfects are formed with this <i>-s-</i>, often altering the consonant before it: <i>scrībō → scrīpsī</i>."},{"t":"mcq","q":"The perfect active stem comes from:","opts":["the third principal part","the infinitive only","the supine only","the nominative"],"a":0,"ex":"The perfect active system is built entirely on the third principal part; the fourth supplies the passive. This is why verbs are learned in four parts rather than two."},{"t":"fill","q":"he had come: vēn___","a":["erat"],"ex":"The pluperfect is the perfect stem plus the imperfect of <b>sum</b>: <b>vēn-erat</b>. It marks an action prior to another past action."},{"t":"fill","q":"Caesar conquered Gaul: Caesar Galliam ___.","a":["vīcit"],"ex":"<b>vīcit</b> is the perfect of <b>vincō</b>, 3rd singular. The perfect stem <b>vīc-</b> shows lengthening of the root vowel with loss of the nasal."},{"t":"mcq","q":"Future perfect 1st singular of <i>amō</i>:","opts":["amāverō","amāveram","amābō","amem"],"a":0,"ex":"Future perfect is the perfect stem plus <b>-erō, -eris, -erit</b>: <b>amāverō</b>. Latin uses it far more strictly than English, especially in subordinate clauses before a future main verb."}]},{"id":"m6","title":"Passive voice & the fourth principal part","subtitle":"Action received by the subject","grammar":"<h3>Present-system passive</h3><p>Use endings <b>-r, -ris, -tur, -mur, -minī, -ntur</b>: <b>amātur</b>, “he/she is loved”; <b>reguntur</b>, “they are ruled.”</p>\n<h3>Perfect-system passive</h3><p>Perfect passive participle + <b>sum</b>: <b>urbs capta est</b>, “the city was captured.” The participle agrees with the subject: <b>mīlitēs missī sunt</b>.</p>\n<p>The personal agent uses <b>ā/ab + ablative</b>; an instrument uses the ablative alone.</p>","examples":[["Urbs ā mīlitibus dēfenditur.","The city is defended by the soldiers."],["Litterae scrībuntur.","The letter is being written."],["Caesar ā senātū laudātus est.","Caesar was praised by the senate."],["Portae clausae erant.","The gates had been closed."]],"vocab":[["amātur","is loved"],["regitur","is ruled"],["audiuntur","are heard"],["captus, -a, -um","captured"],["missus, -a, -um","sent"],["scrīptus, -a, -um","written"],["laudātus, -a, -um","praised"],["clausus, -a, -um","closed"],["senātus, -ūs m.","senate"],["porta, -ae f.","gate"],["capiō, capere","capture / take"],["mittō, mittere","send"]],"exercises":[{"t":"fill","q":"is loved: amā___","a":["tur"],"ex":"Passive endings replace active ones: <b>-r, -ris, -tur, -mur, -minī, -ntur</b>. <b>amātur</b> = he or she is being loved."},{"t":"fill","q":"are ruled: regu___","a":["ntur"],"ex":"<b>reguntur</b> keeps the third-conjugation <b>-u-</b> before <b>-ntur</b>, exactly as the active <b>regunt</b> does."},{"t":"mcq","q":"A personal agent in a passive sentence uses:","opts":["ā/ab + ablative","ad + accusative","genitive only","dative only"],"a":0,"ex":"A living agent takes <b>ā</b> or <b>ab</b> with the ablative; an inanimate means takes the bare ablative. <b>ā mīlitibus interfectus</b> but <b>gladiō interfectus</b>."},{"t":"fill","q":"The gates were closed: Portae clausae ___.","a":["erant"],"ex":"Perfect passives are compound: participle plus <b>sum</b>. With <b>erant</b> the tense is pluperfect — the gates <i>had been</i> closed."},{"t":"fill","q":"Caesar was praised: Caesar laudātus ___.","a":["est"],"ex":"<b>laudātus est</b> is perfect passive. The participle is an adjective and so agrees with the subject; a feminine subject would require <b>laudāta est</b>."},{"t":"mcq","q":"In <i>mīlitēs missī sunt</i>, <i>missī</i> agrees with:","opts":["mīlitēs","an implied object","sunt","no word"],"a":0,"ex":"<b>missī</b> is nominative masculine plural agreeing with <b>mīlitēs</b>. Reading the participle's ending is often the fastest way to identify the subject of a compound passive."}]}]},{"id":"syntax","short":"III","icon":"Ⅲ","label":"Stage III — Complex syntax","tagline":"How Latin builds arguments","desc":"Relative clauses, participles, indirect discourse, the subjunctive, purpose, result, conditions and embedded questions.","units":[{"id":"s1","title":"Relative clauses","subtitle":"A complete clause inside a noun phrase","grammar":"<p>The relative pronoun agrees with its antecedent in gender and number, but its case comes from its function inside the relative clause.</p>\n<table class=\"gr\"><tr><th></th><th>M.</th><th>F.</th><th>N.</th></tr><tr><td>Nom. sg.</td><td>quī</td><td>quae</td><td>quod</td></tr><tr><td>Acc. sg.</td><td>quem</td><td>quam</td><td>quod</td></tr><tr><td>Gen. sg.</td><td>cuius</td><td>cuius</td><td>cuius</td></tr><tr><td>Dat. sg.</td><td>cui</td><td>cui</td><td>cui</td></tr></table>\n<p>Latin often places the antecedent inside the relative clause or omits it when clear.</p>","examples":[["Vir quī venit amīcus meus est.","The man who is coming is my friend."],["Librum quem legis scrīpsī.","I wrote the book that you are reading."],["Puella cui librum dedī laeta est.","The girl to whom I gave the book is happy."],["Urbs cuius moenia vidēs antīqua est.","The city whose walls you see is ancient."]],"vocab":[["quī, quae, quod","who / which"],["quem / quam","whom / which (acc.)"],["cuius","whose"],["cui","to whom"],["quō / quā","by/with whom"],["moenia, -ium n.pl.","walls"],["antīquus","ancient"],["laetus","happy"],["dō, dare, dedī, datum","give"],["antecedēns","antecedent"],["clausula","clause"],["relātīvus","relative"]],"exercises":[{"t":"fill","q":"the man who comes: vir ___ venit","a":["quī"],"ex":"<b>quī</b> is nominative because it is the subject of <b>venit</b> inside its own clause. Its masculine singular form comes from the antecedent <b>vir</b>."},{"t":"fill","q":"the book which you read: librum ___ legis","a":["quem"],"ex":"<b>quem</b> takes its gender and number from <b>librum</b>, but its accusative case from being the object of <b>legis</b>. Case and agreement come from two different places."},{"t":"mcq","q":"The case of a relative pronoun is determined by:","opts":["its function in its own clause","the antecedent’s case","word order","the main verb only"],"a":0,"ex":"The relative takes gender and number from the antecedent and case from its own clause. Applying this rule mechanically resolves most relative clauses on sight."},{"t":"fill","q":"the girl to whom: puella ___","a":["cui"],"ex":"<b>cui</b> is the dative singular, used for all three genders. It is the indirect object inside the relative clause."},{"t":"fill","q":"the city whose walls: urbs ___ moenia","a":["cuius"],"ex":"<b>cuius</b> is the genitive singular for all genders: 'whose'. It is possessive within the relative clause and does not agree with <b>moenia</b>."},{"t":"mcq","q":"Neuter nominative/accusative singular is:","opts":["quod","quem","quae","cui"],"a":0,"ex":"<b>quod</b> serves as both nominative and accusative neuter singular, following the neuter rule that those two cases are always identical."}]},{"id":"s2","title":"Participles","subtitle":"Verbal adjectives that compress clauses","grammar":"<table class=\"gr\"><tr><th>Participle</th><th>Meaning</th><th>Example</th></tr><tr><td>Present active</td><td>contemporaneous active</td><td>amāns, loving</td></tr><tr><td>Perfect passive</td><td>prior passive</td><td>amātus, having been loved</td></tr><tr><td>Future active</td><td>subsequent/intended active</td><td>amātūrus, about to love</td></tr><tr><td>Gerundive</td><td>necessity / passive potential</td><td>amandus, to be loved</td></tr></table>\n<p>Translate participles according to context: literally, as a relative clause, or as a temporal/causal clause.</p><h3>The ablative absolute</h3><p>A noun and a participle, both in the ablative, can form a phrase that is grammatically detached from the main clause: <b>urbe captā</b>, the city having been captured. The noun must have no other role in the main clause — that detachment is what <i>absolūtus</i>, loosened, means. Translate it as a clause of time, cause, or concession, whichever the context wants. Unit <b>a2</b> treats it in full.</p>","examples":[["Mīles fugiēns gladium abiēcit.","The fleeing soldier threw away his sword."],["Urbe captā, dux discessit.","After the city had been captured, the leader departed."],["Caesar profectūrus mīlitēs convocāvit.","Caesar, about to depart, summoned the soldiers."],["Librum legendum habeō.","I have a book that must be read."]],"vocab":[["amāns, amantis","loving"],["fugiēns, fugientis","fleeing"],["captus","captured"],["profectūrus","about to depart"],["legendus","to be read"],["convocō","summon"],["abiciō","throw away"],["discedō","depart"],["dux, ducis m.","leader"],["prior","earlier"],["simultāneus","simultaneous"],["subsequēns","subsequent"]],"exercises":[{"t":"mcq","q":"A perfect passive participle normally denotes:","opts":["prior passive action","simultaneous active action","future action","a command only"],"a":0,"ex":"The perfect passive participle describes action already completed and received by its noun: <b>urbs capta</b>, the city having been captured. Latin has no perfect <i>active</i> participle except in deponents."},{"t":"fill","q":"the fleeing soldier: mīles fugi___","a":["ēns"],"ex":"The present active participle ends in <b>-ns</b>, genitive <b>-ntis</b>: <b>fugiēns, fugientis</b>. It denotes action simultaneous with the main verb."},{"t":"fill","q":"about to depart: profect___","a":["ūrus"],"ex":"The future active participle is the fourth principal part's stem plus <b>-ūrus</b>: <b>profectūrus</b>, about to set out. Combined with <b>sum</b> it forms the active periphrastic."},{"t":"mcq","q":"<i>legendus</i> is a:","opts":["gerundive","present participle","perfect infinitive","supine only"],"a":0,"ex":"<b>legendus</b> is the gerundive, a future <i>passive</i> participle meaning 'needing to be read'. It looks like a participle but carries obligation."},{"t":"fill","q":"After the city was captured: Urbe capt___","a":["ā"],"ex":"<b>Urbe captā</b> is an ablative absolute: a noun and participle in the ablative, grammatically detached from the main clause. Both words take the ablative ending."},{"t":"fill","q":"Caesar summoned the soldiers: Caesar mīlitēs ___.","a":["convocāvit"],"ex":"<b>convocāvit</b> is the perfect of <b>convocō</b>. First-conjugation perfects are highly regular: stem plus <b>-āv-</b>."}]},{"id":"s3","title":"Infinitives & indirect statement","subtitle":"Latin reports thought through accusative + infinitive","grammar":"<h3>Indirect statement</h3><p>After verbs of saying, thinking, knowing and perceiving, Latin normally uses an accusative subject plus infinitive: <b>Dīcit Caesarem venīre</b>, “He says that Caesar is coming.”</p>\n<table class=\"gr\"><tr><th>Time relative to main verb</th><th>Infinitive</th></tr><tr><td>simultaneous</td><td>present: venīre</td></tr><tr><td>prior</td><td>perfect: vēnisse</td></tr><tr><td>subsequent</td><td>future: ventūrum esse</td></tr></table>\n<p>The reflexive <b>sē</b> normally refers to the subject of the reporting verb.</p>","examples":[["Dīcit Caesarem venīre.","He says that Caesar is coming."],["Dīxit Caesarem vēnisse.","He said that Caesar had come."],["Putāmus eum victūrum esse.","We think that he will win."],["Caesar dīxit sē parātum esse.","Caesar said that he was ready."]],"vocab":[["dīcō","say"],["putō","think"],["sciō","know"],["audiō","hear"],["sentiō","perceive / think"],["crēdō","believe"],["venīre","to come / be coming"],["vēnisse","to have come"],["ventūrum esse","to be about to come"],["sē","himself/herself/themselves"],["parātus","ready"],["ōrātiō oblīqua","indirect discourse"]],"exercises":[{"t":"fill","q":"He says that Caesar is coming: Dīcit Caesarem ___.","a":["venīre"],"ex":"In indirect statement the verb becomes an infinitive and its subject goes into the accusative. The present infinitive <b>venīre</b> shows time simultaneous with <b>dīcit</b>."},{"t":"fill","q":"He said Caesar had come: Dīxit Caesarem ___.","a":["vēnisse"],"ex":"The perfect infinitive <b>vēnisse</b> marks time <i>prior</i> to the main verb. Infinitive tense in Latin is relative, not absolute."},{"t":"mcq","q":"The subject of an indirect statement is normally:","opts":["accusative","nominative","genitive","ablative"],"a":0,"ex":"The accusative-and-infinitive construction is the standard way Latin reports speech and thought. Recognising an accusative with no obvious verb to govern it is usually the clue."},{"t":"fill","q":"We think he will win: Putāmus eum victūrum ___.","a":["esse"],"ex":"The future infinitive is the future participle plus <b>esse</b>: <b>victūrum esse</b>. The participle agrees with the accusative subject <b>eum</b>."},{"t":"mcq","q":"<i>sē</i> normally refers to:","opts":["the subject of the reporting verb","the nearest noun always","the speaker only","an impersonal subject"],"a":0,"ex":"<b>sē</b> refers back to the subject of the verb of saying. <b>eum</b> in the same slot would signal a <i>different</i> person — a distinction English cannot make without extra words."},{"t":"fill","q":"Caesar says that he is ready: Caesar dīcit sē parātum ___.","a":["esse"],"ex":"<b>sē parātum esse</b>: reflexive accusative subject, predicate adjective agreeing with it, and the infinitive of <b>sum</b>. Caesar says that he — Caesar himself — is ready."}]},{"id":"s4","title":"The subjunctive system","subtitle":"Potential, desire and subordination","grammar":"<h3>Formation</h3><p>Present subjunctive: first conjugation changes <b>ā → ē</b> (<b>amem</b>); others use <b>ā</b> (<b>moneam, regam, audiam</b>). Imperfect subjunctive is the present infinitive + endings: <b>amārem, monērēs</b>.</p>\n<p>Perfect subjunctive uses perfect stem + <b>-erim</b>; pluperfect uses perfect infinitive + endings: <b>amāvissem</b>.</p>\n<h3>Independent uses</h3><p>Jussive: <b>Veniat!</b> “Let him come.” Deliberative: <b>Quid faciam?</b> Potential: <b>Dīcat aliquis...</b> Wish: <b>Utinam adsit!</b></p>","examples":[["Veniat!","Let him come!"],["Quid faciam?","What am I to do?"],["Utinam adesset!","If only he were here!"],["Nē hoc faciās.","Do not do this."],["Dīcat aliquis haec falsa esse.","Someone might say these things are false."]],"vocab":[["amem","may I love"],["moneam","may I advise"],["regam","may I rule"],["audiam","may I hear"],["amārem","I might/would love"],["amāverim","I may have loved"],["amāvissem","I had/might have loved"],["utinam","if only"],["nē","lest / not"],["adsum, adesse","be present"],["falsus","false"],["coniūnctīvus","subjunctive"]],"exercises":[{"t":"fill","q":"present subjunctive of <i>amō</i>, 1sg: ___","a":["amem"],"ex":"First-conjugation present subjunctive swaps <b>-ā-</b> for <b>-ē-</b>: <b>amō → amem</b>. The old mnemonic is 'we beat a liar': <i>-e-</i> in the first conjugation, <i>-a-</i> in the rest."},{"t":"fill","q":"present subjunctive of <i>regō</i>, 1sg: ___","a":["regam"],"ex":"Third conjugation takes <b>-a-</b>: <b>regam</b>. Note that this is identical to the future indicative in the first person singular — context decides."},{"t":"mcq","q":"The imperfect subjunctive is built from:","opts":["the present infinitive","the perfect participle","the nominative","the future stem only"],"a":0,"ex":"The imperfect subjunctive is simply the present infinitive plus personal endings: <b>amāre + m</b> = <b>amārem</b>, <b>esse + m</b> = <b>essem</b>. It is the easiest subjunctive to form."},{"t":"fill","q":"Let him come: ___!","a":["Veniat"],"ex":"<b>Veniat</b> is a jussive subjunctive expressing a command in the third person, where the imperative cannot reach. Its negative is <b>nē veniat</b>."},{"t":"fill","q":"If only he were here: Utinam ___.","a":["adesset"],"ex":"<b>Utinam</b> plus imperfect subjunctive expresses a wish for the present that is not being fulfilled. The pluperfect would push the unfulfilled wish into the past."},{"t":"mcq","q":"<i>Quid faciam?</i> is:","opts":["deliberative subjunctive","indirect statement","ablative absolute","passive periphrastic"],"a":0,"ex":"The deliberative subjunctive asks a real question about what to do: 'What am I to do?' Compare the indicative <b>quid faciō</b>, 'what am I doing?'"}]},{"id":"s5","title":"Purpose, result & characteristic","subtitle":"Why an action happens and what follows","grammar":"<h3>Purpose</h3><p><b>ut</b> + subjunctive for positive purpose; <b>nē</b> for negative: <b>Vēnit ut videat</b>, “He comes to see.”</p>\n<h3>Result</h3><p><b>ut</b> + subjunctive follows a signal such as <b>tam, ita, tantus, tot, sīc</b>: <b>Tam fessus erat ut dormīret</b>.</p>\n<h3>Relative clause of characteristic</h3><p><b>Nēmō est quī hoc faciat</b>, “There is no one who would do this / of the sort to do this.”</p>\n<div class=\"tip\">Negative result normally uses <b>ut nōn</b>, not <b>nē</b>.</div>","examples":[["Vēnit ut amīcum videat.","He comes to see his friend."],["Tacuit nē hostēs audīrent.","He was silent so that the enemy would not hear."],["Tam fessus erat ut dormīret.","He was so tired that he slept."],["Nēmō est quī hoc nesciat.","There is no one who does not know this."]],"vocab":[["ut","so that / that"],["nē","so that not / lest"],["tam","so"],["ita","so / in such a way"],["tantus","so great"],["tot","so many"],["taceō","be silent"],["fessus","tired"],["dormiō","sleep"],["nesciō","not know"],["cōnsilium","purpose / plan"],["exitus","result / outcome"]],"exercises":[{"t":"fill","q":"He comes to see: Vēnit ___ videat.","a":["ut"],"ex":"Purpose is expressed by <b>ut</b> plus subjunctive, never by an infinitive as in English. 'He comes to see' must become 'he comes in order that he may see'."},{"t":"fill","q":"so that the enemy would not hear: ___ hostēs audīrent","a":["nē"],"ex":"Negative purpose uses <b>nē</b>, not <b>ut nōn</b>. Keeping this apart from negative result is the whole point of the unit."},{"t":"mcq","q":"Negative result normally uses:","opts":["ut nōn","nē","num","quin only"],"a":0,"ex":"Result clauses negate with <b>ut nōn</b>. A signpost word in the main clause — <b>tam</b>, <b>ita</b>, <b>tantus</b>, <b>sīc</b> — usually announces that a result clause is coming."},{"t":"fill","q":"so tired that: tam fessus ___","a":["ut"],"ex":"<b>tam</b> is the signpost; <b>ut</b> introduces the consequence that actually followed. Purpose states an aim, result states an outcome."},{"t":"mcq","q":"<i>Nēmō est quī...</i> often introduces:","opts":["a relative clause of characteristic","indirect statement","simple possession","a command"],"a":0,"ex":"The relative clause of characteristic describes what <i>kind</i> of person or thing, and takes the subjunctive. It is common after negatives and after <b>sunt quī</b>."},{"t":"fill","q":"There is no one who does not know: Nēmō est quī hoc ___.","a":["nesciat"],"ex":"<b>nesciat</b> is subjunctive because the relative clause is generic: there is no one <i>of the sort who</i> does not know this."}]},{"id":"s6","title":"cum clauses, conditions & indirect questions","subtitle":"Read the connective before translating it","grammar":"<h3>cum</h3><p>With indicative it can be purely temporal (“when”). With subjunctive it often supplies background, cause or concession: <b>Cum hoc scīret, tacuit</b>, “Since/although he knew this, he was silent.”</p>\n<h3>Conditions</h3><p>Simple factual conditions use indicative. Future more vivid often uses future/future perfect. Contrary-to-fact uses imperfect subjunctive for present and pluperfect for past.</p>\n<h3>Indirect questions</h3><p>A question word + subjunctive follows verbs of asking or knowing: <b>Rogat quid faciās</b>, “He asks what you are doing.”</p>","examples":[["Cum Caesar vēnit, mīlitēs laetī erant.","When Caesar came, the soldiers were happy."],["Cum hoc scīret, tamen tacuit.","Although he knew this, he was nevertheless silent."],["Sī hoc facis, errās.","If you do this, you are wrong."],["Sī adesset, gaudērem.","If he were here, I would rejoice."],["Rogat cūr abeās.","He asks why you are leaving."]],"vocab":[["cum","when / since / although"],["sī","if"],["nisi","unless"],["tamen","nevertheless"],["rogō","ask"],["quaerō","seek / ask"],["gaudeō","rejoice"],["errō","be mistaken"],["abeō","go away"],["adsit","may be present"],["condiciō","condition"],["quaestiō oblīqua","indirect question"]],"exercises":[{"t":"mcq","q":"With subjunctive, <i>cum</i> may mean:","opts":["since or although","only with","only after","never when"],"a":0,"ex":"<b>Cum</b> with the subjunctive is circumstantial, causal ('since') or concessive ('although'). With the indicative it is purely temporal."},{"t":"fill","q":"If he were here, I would rejoice: Sī adesset, ___.","a":["gaudērem"],"ex":"Present contrary-to-fact takes imperfect subjunctive in both halves: <b>sī adesset, gaudērem</b>. Latin marks the unreality in the verb form itself."},{"t":"mcq","q":"Present contrary-to-fact normally uses:","opts":["imperfect subjunctive","future indicative","perfect infinitive","imperative"],"a":0,"ex":"Imperfect subjunctive for the present, pluperfect for the past. Contrast the future-less-vivid, which uses the present subjunctive."},{"t":"fill","q":"He asks why you leave: Rogat cūr ___.","a":["abeās"],"ex":"An indirect question takes the subjunctive, and the tense follows sequence: present <b>rogat</b> gives present <b>abeās</b>. The direct form would be <b>cūr abīs?</b>"},{"t":"mcq","q":"Indirect questions use:","opts":["subjunctive","accusative + infinitive only","imperative","ablative absolute"],"a":0,"ex":"Latin subordinates the question by mood; English does it by word order. Any interrogative word after a verb of asking, knowing or doubting should prompt you to expect a subjunctive."},{"t":"fill","q":"Although he knew this: ___ hoc scīret","a":["Cum"],"ex":"<b>Cum</b> plus the imperfect subjunctive <b>scīret</b> is concessive here. Which of its senses applies is decided by the logic of the sentence, not by the form."}]}]},{"id":"reading","short":"IV","icon":"Ⅳ","label":"Stage IV — Reading Latin","tagline":"From constructions to literature","desc":"Deponents, ablative absolutes, obligation, tense sequence, prose architecture, poetry and a method for independent reading.","units":[{"id":"a1","title":"Deponent verbs","subtitle":"Passive forms with active meaning","grammar":"<p>Deponents look passive but have active meaning: <b>loquor, loquī, locūtus sum</b>, “speak”; <b>sequor, sequī, secūtus sum</b>, “follow.” Their perfect participle is active in meaning: <b>Caesar locūtus</b>, “Caesar, having spoken.”</p>\n<p>They retain some active forms where no passive equivalent exists, including present participles and future infinitives.</p>\n<p>Semi-deponents have active present forms but deponent perfect forms: <b>audeō, audēre, ausus sum</b>.</p>","examples":[["Dux mīlitēs sequitur.","The leader follows the soldiers."],["Caesar locūtus discessit.","Caesar, having spoken, departed."],["Hostēs profectī sunt.","The enemy set out."],["Hoc facere ausus est.","He dared to do this."]],"vocab":[["loquor, loquī, locūtus sum","speak"],["sequor, sequī, secūtus sum","follow"],["proficīscor, proficīscī, profectus sum","set out"],["morior, morī, mortuus sum","die"],["patior, patī, passus sum","suffer"],["ūtor, ūtī, ūsus sum","use (+ abl.)"],["audeō, audēre, ausus sum","dare"],["cōnor, cōnārī","try"],["hortor, hortārī","encourage"],["arbitror, arbitrārī","think / judge"],["dēpōnēns","deponent"],["forma passīva","passive form"]],"exercises":[{"t":"fill","q":"he follows: sequ___","a":["itur"],"ex":"<b>sequitur</b> looks passive but is active in meaning: 'he follows'. Deponents have laid aside their active forms — <i>dēpōnere</i>, to lay aside."},{"t":"fill","q":"having spoken: locūt___","a":["us"],"ex":"<b>locūtus</b> is a perfect participle with <i>active</i> meaning, 'having spoken'. Deponents supply the perfect active participle that regular verbs lack."},{"t":"mcq","q":"A deponent verb has:","opts":["passive forms and active meaning","active forms and passive meaning","no perfect tense","no infinitive"],"a":0,"ex":"Passive in form, active in sense. The one exception is the gerundive, which stays genuinely passive."},{"t":"fill","q":"they set out: profectī ___.","a":["sunt"],"ex":"<b>profectī sunt</b> is the perfect of <b>proficīscor</b>, formed like a passive but translated actively. The participle agrees with the plural subject."},{"t":"mcq","q":"<i>ūtor</i> governs:","opts":["ablative","accusative","genitive","nominative"],"a":0,"ex":"Five deponents govern the ablative: <b>ūtor, fruor, fungor, potior, vescor</b>. <b>gladiō ūtitur</b> = he uses a sword."},{"t":"fill","q":"he dared: ausus ___.","a":["est"],"ex":"<b>ausus est</b>, from <b>audeō</b>, is semi-deponent: regular in the present system, deponent in the perfect. <b>gaudeō</b> and <b>soleō</b> behave the same way."}]},{"id":"a2","title":"Ablative absolute","subtitle":"A detached background clause","grammar":"<p>An ablative noun or pronoun plus an agreeing participle forms a grammatically detached clause: <b>urbe captā</b>, “with the city captured / after the city was captured.”</p>\n<p>Because <b>sum</b> has no present participle, Latin can use two ablatives: <b>Caesare duce</b>, “with Caesar as leader / under Caesar’s leadership.”</p>\n<p>Choose a translation that expresses the relation implied by context: time, cause, concession or circumstance.</p>","examples":[["Sole ortō, profectī sumus.","When the sun had risen, we set out."],["Urbe captā, mīlitēs discessērunt.","After the city was captured, the soldiers departed."],["Caesare duce, Rōmānī vīcērunt.","With Caesar as commander, the Romans won."],["Hostibus appropinquantibus, portae clausae sunt.","As the enemy approached, the gates were closed."]],"vocab":[["sole ortō","when the sun had risen"],["urbe captā","with the city captured"],["Caesare duce","with Caesar as leader"],["hostibus appropinquantibus","as the enemy approached"],["orior, orīrī","rise"],["appropinquō","approach"],["circumstantia","circumstance"],["causa","cause"],["concessiō","concession"],["tempus","time"],["absolūtus","detached / absolute"],["participium","participle"]],"exercises":[{"t":"fill","q":"after the city was captured: urbe capt___","a":["ā"],"ex":"<b>urbe captā</b>: both noun and participle take the ablative. The phrase sets a circumstance and has no grammatical link to the main clause."},{"t":"fill","q":"with Caesar as leader: Caesar___ duce","a":["e"],"ex":"<b>Caesare duce</b> is a noun-plus-noun ablative absolute, 'with Caesar as leader'. No participle is present at all."},{"t":"mcq","q":"An ablative absolute is:","opts":["grammatically detached from the main clause","the direct object","always a condition","always passive in translation"],"a":0,"ex":"'Absolute' means loosened — <i>absolūtus</i>. The noun in the ablative must not otherwise function in the main clause; if it does, use a plain participle instead."},{"t":"fill","q":"when the sun had risen: sole ___.","a":["ortō"],"ex":"<b>sōle ortō</b> uses the perfect participle of the deponent <b>orior</b>, so the sense is active: the sun having risen."},{"t":"mcq","q":"Two nouns can form an ablative absolute because:","opts":["sum lacks a present participle","Latin has no ablative","all nouns are verbs","it is direct speech"],"a":0,"ex":"<b>sum</b> has no present participle, so Latin simply juxtaposes two ablatives: <b>Cicerōne cōnsule</b>, in Cicero's consulship. Roman dates are routinely written this way."},{"t":"fill","q":"as the enemy approached: hostibus appropinquant___","a":["ibus"],"ex":"<b>appropinquantibus</b> is the present participle in the ablative plural, agreeing with <b>hostibus</b> and marking action simultaneous with the main verb."}]},{"id":"a3","title":"Gerunds, gerundives & obligation","subtitle":"Verbal nouns and the passive periphrastic","grammar":"<h3>Gerund</h3><p>The neuter singular verbal noun appears in oblique cases: <b>ars scrībendī</b>, “the art of writing”; <b>ad scrībendum</b>, “for writing.”</p>\n<h3>Gerundive attraction</h3><p>Latin often replaces a gerund with object by a gerundive agreeing with that object: <b>ad librōs legendōs</b>, “for reading books.”</p>\n<h3>Passive periphrastic</h3><p>Gerundive + <b>sum</b> expresses obligation. The agent is dative: <b>Mihi liber legendus est</b>, “I must read the book.”</p>","examples":[["Ars bene scrībendī difficilis est.","The art of writing well is difficult."],["Ad librōs legendōs tempus mihi deest.","I lack time for reading books."],["Haec lēx omnibus servanda est.","This law must be observed by everyone."],["Nōbīs proficīscendum est.","We must set out."]],"vocab":[["scrībendī","of writing"],["legendōs","to be read"],["servandus","to be observed"],["mihi faciendum est","I must do it"],["nōbīs eundum est","we must go"],["ars, artis f.","art / skill"],["tempus deest","time is lacking"],["omnibus","by everyone / for everyone"],["obligātiō","obligation"],["gerundium","gerund"],["gerundīvum","gerundive"],["periphrasticus","periphrastic"]],"exercises":[{"t":"fill","q":"the art of writing: ars scrībend___","a":["ī"],"ex":"The gerund is a verbal noun, declined in the singular in <b>-ndī, -ndō, -ndum, -ndō</b>. <b>ars scrībendī</b> = the art of writing."},{"t":"fill","q":"for reading books: ad librōs legend___","a":["ōs"],"ex":"With an object, Latin prefers the gerundive construction: not <i>ad legendum librōs</i> but <b>ad librōs legendōs</b>, the gerundive agreeing with the object."},{"t":"mcq","q":"The agent of a passive periphrastic is usually:","opts":["dative","ā/ab + ablative","accusative","genitive"],"a":0,"ex":"The passive periphrastic takes a dative of agent, not <b>ā</b> with the ablative: <b>mihi faciendum est</b>, it must be done by me."},{"t":"fill","q":"We must go: Nōbīs eundum ___.","a":["est"],"ex":"<b>eundum est</b> is an impersonal passive periphrastic from the intransitive <b>eō</b>, with <b>nōbīs</b> as dative of agent. Literally: there must be a going by us."},{"t":"fill","q":"This law must be observed: Haec lēx servanda ___.","a":["est"],"ex":"<b>servanda est</b> is a gerundive plus <b>sum</b>, expressing obligation. The gerundive agrees with <b>lēx</b>, so it is feminine singular."},{"t":"mcq","q":"<i>ad scrībendum</i> expresses:","opts":["purpose","possession","comparison","direct address"],"a":0,"ex":"<b>ad</b> plus the gerund or gerundive is one of Latin's standard purpose constructions, alongside <b>ut</b> plus subjunctive and the genitive with <b>causā</b>."}]},{"id":"a4","title":"Sequence of tenses & reported speech","subtitle":"Keep relative time consistent","grammar":"<p>Primary main verbs (present/future/perfect with present force) normally take present or perfect subjunctive for simultaneous/subsequent or prior action. Historic main verbs normally take imperfect or pluperfect subjunctive.</p>\n<table class=\"gr\"><tr><th>Main sequence</th><th>Simultaneous/subsequent</th><th>Prior</th></tr><tr><td>Primary</td><td>present subj.</td><td>perfect subj.</td></tr><tr><td>Historic</td><td>imperfect subj.</td><td>pluperfect subj.</td></tr></table>\n<p>In extended indirect discourse, principal assertions become infinitives while subordinate clauses generally use the subjunctive.</p>","examples":[["Rogat quid faciās.","He asks what you are doing."],["Rogāvit quid facerēs.","He asked what you were doing."],["Nesciō cūr vēnerit.","I do not know why he came."],["Nesciēbam cūr vēnisset.","I did not know why he had come."]],"vocab":[["tempus prīmārium","primary tense"],["tempus historicum","historic tense"],["simultāneus","simultaneous"],["prior","prior"],["subsequēns","subsequent"],["rogat","asks"],["rogāvit","asked"],["faciās","you are doing"],["facerēs","you were doing"],["vēnerit","he came / has come"],["vēnisset","he had come"],["cōnsecūtiō temporum","sequence of tenses"]],"exercises":[{"t":"fill","q":"He asks what you are doing: Rogat quid ___.","a":["faciās"],"ex":"Primary sequence: a present main verb takes the present subjunctive for action contemporaneous with it."},{"t":"fill","q":"He asked what you were doing: Rogāvit quid ___.","a":["facerēs"],"ex":"Secondary sequence: a past main verb takes the imperfect subjunctive for contemporaneous action. The choice depends on the main verb, not on English tense."},{"t":"mcq","q":"A historic main verb normally takes for simultaneous action:","opts":["imperfect subjunctive","present subjunctive","future indicative","perfect infinitive"],"a":0,"ex":"Historic main verbs use imperfect subjunctive for simultaneous action and pluperfect for prior action; primary verbs use present and perfect respectively."},{"t":"fill","q":"I did not know why he had come: Nesciēbam cūr ___.","a":["vēnisset"],"ex":"<b>vēnisset</b> is pluperfect subjunctive: prior action in secondary sequence after <b>nesciēbam</b>."},{"t":"mcq","q":"In extended indirect discourse, principal assertions are commonly:","opts":["infinitives","imperatives","ablatives absolute","vocatives"],"a":0,"ex":"In extended reported speech main assertions become infinitives while subordinate clauses go into the subjunctive. Caesar and Livy sustain this for whole paragraphs."},{"t":"fill","q":"I do not know why he came: Nesciō cūr ___.","a":["vēnerit"],"ex":"<b>vēnerit</b> is perfect subjunctive: prior action in primary sequence after the present <b>nesciō</b>. Compare it directly with <b>vēnisset</b> above."}]},{"id":"a5","title":"Latin prose style","subtitle":"Period, emphasis and the architecture of a sentence","grammar":"<p>Latin prose can postpone the main verb, frame clauses with paired words, and embed participles or subordinate clauses before resolving the sentence. Read by units, not by translating one word at a time.</p>\n<h3>A disciplined reading sequence</h3><ol><li>Mark finite verbs and clause introducers.</li><li>Find subjects and objects from endings.</li><li>Join adjectives, genitives and participles to their heads.</li><li>Resolve subordinate clauses.</li><li>Only then produce idiomatic English.</li></ol>\n<p>Common connective pairs include <b>non solum... sed etiam</b>, <b>ut... ita</b>, <b>cum... tum</b>, <b>tanto... quanto</b>.</p>","examples":[["Nōn sōlum fortis sed etiam prūdēns erat.","He was not only brave but also prudent."],["Ut sēmentem fēceris, ita metēs.","As you have sown, so shall you reap."],["Tantō maior erat glōria, quantō gravius perīculum.","The greater the danger, the greater the glory."],["His rēbus cognītīs, Caesar cōnsilium cēpit.","After learning these things, Caesar formed a plan."]],"vocab":[["nōn sōlum... sed etiam","not only... but also"],["ut... ita","as... so"],["cum... tum","both... and / when... then"],["tantō... quantō","the more... the more"],["prūdēns","prudent"],["glōria","glory"],["perīculum","danger"],["cognōscō","learn / recognise"],["cōnsilium capiō","form a plan"],["periodus","periodic sentence"],["emphasis","emphasis"],["hyperbaton","separation of linked words"]],"exercises":[{"t":"fill","q":"not only... but also: nōn sōlum... sed ___","a":["etiam"],"ex":"<b>nōn sōlum... sed etiam</b> is a correlative pair. Spotting the first member tells you a second is coming and helps you hold a long period together."},{"t":"mcq","q":"A sound first step in reading a long sentence is to:","opts":["mark finite verbs and clause introducers","translate every word in order","ignore endings","find an English translation"],"a":0,"ex":"Find the finite verbs and the words that introduce clauses first; that gives you the skeleton. Translating linearly from the first word is what causes long sentences to collapse."},{"t":"fill","q":"the more... the more: tantō... ___","a":["quantō"],"ex":"<b>quantō... tantō</b> with comparatives means 'the more... the more'. The usual order puts <b>quantō</b> first, as in the Nepos passage in the Reading Room."},{"t":"fill","q":"After these things were learned: His rēbus ___.","a":["cognītīs"],"ex":"<b>Hīs rēbus cognitīs</b> is a formulaic ablative absolute in historical prose, roughly 'this being learned'. Caesar uses it as a paragraph hinge."},{"t":"mcq","q":"Hyperbaton is:","opts":["separation of words that belong together","a passive verb","a case ending","a prose author"],"a":0,"ex":"Hyperbaton separates words that agree, often framing a line or clause between them. It signals emphasis and is pervasive in poetry."},{"t":"fill","q":"Caesar formed a plan: Caesar cōnsilium ___.","a":["cēpit"],"ex":"<b>cōnsilium capere</b> is a fixed idiom, 'to form a plan'. Latin builds many expressions from a colourless verb plus a noun."}]},{"id":"a6","title":"Poetry, metre & reading without a translation","subtitle":"From grammatical decoding to literary attention","grammar":"<h3>Dactylic hexameter</h3><p>Each line has six feet. A foot is usually a dactyl (— ⏑ ⏑) or spondee (— —); the fifth is commonly a dactyl, and the sixth ends — x. Elision and vowel quantity matter.</p>\n<h3>Poetic language</h3><p>Expect freer word order, omitted forms of <b>sum</b>, Greek forms, archaism, and words separated for emphasis or sound. Do not treat prose order as a mechanical key.</p>\n<h3>Graduated assistance</h3><p>In the Reading Room, first read unaided; then reveal lexical glosses, notes and finally the translation. The aim is to remove assistance over repeated readings.</p>","examples":[["Arma virumque canō.","I sing of arms and the man."],["Carpe diem.","Seize the day."],["Omnia vincit Amor.","Love conquers all things."],["Sunt lacrimae rērum.","There are tears for things / the world’s suffering has tears."]],"vocab":[["hexameter","hexameter"],["dactylus","dactyl"],["spondēus","spondee"],["elīsiō","elision"],["caesūra","caesura"],["quantitās","quantity"],["versus","verse / line"],["carmen","poem / song"],["poēta","poet"],["canō","sing"],["lacrimae","tears"],["rēs","thing / circumstance"]],"exercises":[{"t":"mcq","q":"A dactyl is:","opts":["— ⏑ ⏑","— — only","⏑ ⏑ ⏑","x x"],"a":0,"ex":"A dactyl is one long followed by two shorts. The hexameter line has six feet, with a spondee — two longs — freely substituted in the first four."},{"t":"fill","q":"Seize the day: ___ diem.","a":["Carpe"],"ex":"<b>Carpe</b> is the imperative of <b>carpō</b>, literally to pluck. Horace's metaphor is agricultural rather than military."},{"t":"mcq","q":"The final translation should normally be revealed:","opts":["after attempting the Latin","before looking at the Latin","instead of reading","automatically"],"a":0,"ex":"Attempt the Latin first, then use glosses, then notes, and only then the translation. Reaching for the translation first turns reading into checking."},{"t":"fill","q":"Love conquers all things: Omnia vincit ___.","a":["Amor"],"ex":"<b>Omnia vincit Amor</b>, Vergil, <i>Eclogues</i> 10.69. <b>Omnia</b> is neuter accusative plural, the object, and <b>Amor</b> the nominative subject in final position."},{"t":"mcq","q":"Poetry often has:","opts":["freer word order and elision","no case endings","only present tense","no subordinate clauses"],"a":0,"ex":"Poetic word order serves metre and emphasis, and elision drops a final vowel before a following vowel. Endings, not position, remain your guide."},{"t":"fill","q":"I sing of arms and the man: Arma virumque ___.","a":["canō"],"ex":"<b>canō</b> is present, not future: the poet declares what he is doing now. It opens the <i>Aeneid</i>, which you can read in the Reading Room."}]}]}];
const READINGS=[{"id":"c1","title":"In the villa","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Iūlia in villā habitat. Villa parva est, sed hortum magnum habet. Iūlia rosās amat et aquam ad hortum portat. Fīlia Iūliae cum amīcā ambulat. In hortō sedent et librum legunt. Ad vesperum agricola ex agrīs venit. Tum in villā cēnam exspectant.","translation":"Julia lives in a country house. The house is small, but it has a large garden. Julia loves roses and carries water to the garden. Julia’s daughter walks with a friend. They sit in the garden and read a book. Toward evening the farmer comes from the fields. Then they wait for dinner in the house.","gloss":{"villā":"in a villa / country house (abl. after in)","hortum":"garden (acc.)","rosās":"roses (acc. pl.)","portat":"carries","hortō":"garden (abl. after in, place where)","legunt":"they read","vesperum":"evening (acc. after ad)","agrīs":"fields (abl. pl. after ex)","cēnam":"dinner (acc.)","exspectant":"they await"},"notes":["Contrast <b>in villā</b> (ablative, place where) with <b>ad hortum</b> and <b>ex agrīs</b>: <b>in</b> plus the ablative means inside, <b>ad</b> plus the accusative means toward, <b>ex</b> plus the ablative means out of.","<b>Iūliae</b> is genitive: “Julia’s daughter.” The same ending would be nominative plural, and only the sentence decides.","<b>sedent</b> and <b>legunt</b> have an understood plural subject — the daughter and her friend. Nothing but the <b>-nt</b> tells you so."],"source":"","license":"These readings were composed for this app to control the grammar a learner meets at each stage. They are original text, not ancient sources, and are released for free reuse.","hasMacrons":true},{"id":"c2","title":"A morning in the Forum","author":"Controlled Latin","work":"Original graded reading","level":"Foundations","kind":"Controlled","text":"Mārcus māne ad forum ambulat. Multōs virōs videt: servī aquam portant, dominus amīcum sa

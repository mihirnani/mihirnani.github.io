characteristic</h3><p>A relative with the subjunctive describes what <i>kind</i> of person or thing, rather than identifying a particular one:</p><ul><li><b>Nēmō est quī hoc nesciat.</b> — There is nobody <i>of the sort who</i> does not know this.</li><li><b>Sunt quī ita putent.</b> — There are people who think so.</li><li><b>Dignus est quī laudētur.</b> — He is worthy to be praised.</li></ul><p>It is especially common after negatives (<b>nēmō est quī</b>, <b>nihil est quod</b>), after <b>sunt quī</b>, and after <b>dignus</b>, <b>indignus</b>, <b>idōneus</b>. Compare the plain indicative: <b>sunt quī ita putant</b> would mean there are specific, identifiable people who think so.</p><h3>Indirect command</h3><p>Verbs of ordering, urging, persuading and begging — <b>imperō, moneō, hortor, persuādeō, rogō, petō</b> — take <b>ut</b> or <b>nē</b> with the subjunctive:</p><p><b>Imperāvit ut pontem facerent.</b> — He ordered them to build a bridge.</p><p>The great exception is <b>iubeō</b>, which takes accusative and infinitive instead: <b>iussit eōs pontem facere</b>. So does <b>vetō</b>, forbid.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Using an infinitive for purpose in prose. <i>Vēnit vidēre</i> is not Ciceronian Latin — though infinitival purpose does occur in verse, in early Latin and in later authors, largely on the Greek model, so you will meet it in Vergil and in the Vulgate.</li><li>Negating purpose with <b>ut nōn</b> or result with <b>nē</b>.</li><li>Missing the signpost and reading a result clause as purpose.</li><li>Putting <b>ut</b> after <b>iubeō</b>.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Tantum perīculum erat ut dux mīsit quī auxilium peterent nē urbs caperētur.</p><table class=\"gr\"><tr><th>Clause</th><th>Type</th><th>Clue</th></tr><tr><td lang=\"la\">Tantum … ut … mīsit</td><td>result</td><td>the signpost <b>Tantum</b> stands before <b>ut</b></td></tr><tr><td lang=\"la\">quī auxilium peterent</td><td>purpose</td><td>relative + subjunctive, no signpost</td></tr><tr><td lang=\"la\">nē urbs caperētur</td><td>negative purpose</td><td><b>nē</b>, not <b>ut nōn</b></td></tr></table><p><b>Sense:</b> the danger was so great that the commander sent men to seek help, so that the city should not be captured. Three subjunctive clauses in one sentence, doing three different jobs — and each is identified by what stands in front of it, not by the verb form.</p></div>","examples":[["Vēnit ut amīcum videat.","He comes to see his friend."],["Tacuit nē hostēs audīrent.","He was silent so that the enemy would not hear."],["Tam fessus erat ut dormīret.","He was so tired that he slept."],["Nēmō est quī hoc nesciat.","There is no one who does not know this."]],"vocab":[["ut","so that / that"],["nē","so that not / lest"],["tam","so"],["ita","so / in such a way"],["tantus","so great"],["tot","so many"],["taceō","be silent"],["fessus","tired"],["dormiō","sleep"],["nesciō","not know"],["cōnsilium","purpose / plan"],["exitus","result / outcome"]],"exercises":[{"t":"fill","q":"He comes to see: Vēnit ___ videat.","a":["ut"],"ex":"Purpose is expressed by <b>ut</b> plus subjunctive, never by an infinitive as in English. 'He comes to see' must become 'he comes in order that he may see'."},{"t":"fill","q":"so that the enemy would not hear: ___ hostēs audīrent","a":["nē"],"ex":"Negative purpose uses <b>nē</b>, not <b>ut nōn</b>. Keeping this apart from negative result is the whole point of the unit."},{"t":"mcq","q":"Negative result normally uses:","opts":["ut nōn","nē","num","quin only"],"a":0,"ex":"Result clauses negate with <b>ut nōn</b>. A signpost word in the main clause — <b>tam</b>, <b>ita</b>, <b>tantus</b>, <b>sīc</b> — usually announces that a result clause is coming."},{"t":"fill","q":"so tired that: tam fessus ___","a":["ut"],"ex":"<b>tam</b> is the signpost; <b>ut</b> introduces the consequence that actually followed. Purpose states an aim, result states an outcome."},{"t":"mcq","q":"<i>Nēmō est quī...</i> often introduces:","opts":["a relative clause of characteristic","indirect statement","simple possession","a command"],"a":0,"ex":"The relative clause of characteristic describes what <i>kind</i> of person or thing, and takes the subjunctive. It is common after negatives and after <b>sunt quī</b>."},{"t":"fill","q":"There is no one who does not know: Nēmō est quī hoc ___.","a":["nesciat"],"ex":"<b>nesciat</b> is subjunctive because the relative clause is generic: there is no one <i>of the sort who</i> does not know this."},{"t":"parse","form":"ut vidēret","q":"Without further context this could be:","opts":["purpose or result — the main clause decides","purpose only","result only","an indirect question"],"a":0,"ex":"<b>ut</b> plus subjunctive is ambiguous by itself. Look back for <b>tam, ita, sīc, tantus, tālis</b>: a signpost means result, no signpost means purpose."},{"t":"parse","form":"quī audiat","q":"A relative with the subjunctive after a negative usually signals:","opts":["a clause of characteristic","a purpose clause","an indirect question","an error"],"a":0,"ex":"<b>Nēmō est quī audiat</b> — 'there is nobody of the sort who listens'. The subjunctive turns a specific person into a type."},{"t":"trans","form":"Vēnit ut vidēret.","q":"Make it negative purpose ('so as not to see'):","a":["Vēnit nē vidēret","venit ne videret"],"ex":"Purpose negates with <b>nē</b>, never <b>ut nōn</b>. Result does the opposite."},{"t":"trans","form":"Tam fessus erat ut dormīret.","q":"Make it negative result ('that he did not sleep'):","a":["Tam fessus erat ut nōn dormīret","tam fessus erat ut non dormiret"],"ex":"Result negates with <b>ut nōn</b>. The signpost <b>Tam</b> is what tells you this is result and not purpose."},{"t":"pick","s":"Tanta erat tempestās ut nāvēs in portū manērent.","q":"Click the word that announces a result clause.","a":"Tanta","ex":"<b>Tanta</b> is the signpost, planted before <b>ut</b> ever arrives. Trained readers spot it and know what is coming."},{"t":"pick","s":"Mīsit lēgātōs quī pācem peterent.","q":"Click the relative used to express purpose.","a":"quī","ex":"A relative with the subjunctive can carry purpose: 'he sent envoys to seek peace'. Latin has at least four ways to say purpose — <b>ut</b>, a relative, <b>ad</b> with a gerundive, and the genitive with <b>causā</b>."},{"t":"mcq","q":"In standard Classical prose, purpose is <i>not</i> expressed by:","opts":["a bare infinitive","ut with the subjunctive","a relative with the subjunctive","ad with the gerundive"],"a":0,"ex":"&#39;He came to see&#39; cannot be <i>vēnit vidēre</i> in Ciceronian prose — this is the commonest mistake English speakers make in Latin composition. Infinitival purpose is not unknown in Latin: it appears in verse, in early Latin and in later authors, on the Greek model. Treat it as something to recognise in Vergil, not to write yourself."},{"t":"mcq","q":"A result clause differs from purpose in that it:","opts":["states what actually happened, not what was aimed at","always uses the indicative","cannot be negative","never uses ut"],"a":0,"ex":"Purpose looks forward to an intention; result looks back at a consequence. The mood is the same, so the surrounding words carry the distinction."},{"t":"fill","q":"There are people who think so: Sunt quī ita ___.","a":["putent"],"ex":"<b>putent</b>, subjunctive of characteristic after <b>Sunt quī</b>: 'there are people of the sort who think so'."},{"t":"fill","q":"so brave that he was praised: tam fortis ___ laudārētur","a":["ut"],"ex":"<b>ut</b> after the signpost <b>tam</b>, with a passive imperfect subjunctive inside the result clause."}]},{"id":"s6","title":"cum clauses, conditions & indirect questions","subtitle":"Read the connective before translating it","grammar":"<p class=\"lead\">This unit collects the three constructions that most often stop a reader in real prose: <b>cum</b> clauses, conditions, and indirect questions. Each has a small rule that solves it.</p><h3>cum: read the mood</h3><table class=\"gr\"><tr><th>Mood</th><th>Sense</th><th>Example</th></tr><tr><td>Indicative</td><td>purely temporal: when</td><td lang=\"la\">cum Rōmam vēnī, eum vīdī</td></tr><tr><td>Subjunctive</td><td>circumstantial: when, since, although</td><td lang=\"la\">cum haec audīvisset, discessit</td></tr></table><p>With the subjunctive, <b>cum</b> supplies a circumstance and shades into cause (&#39;since&#39;) or concession (&#39;although&#39;). Nothing in the form tells you which; the logic of the sentence does. If the two halves agree, it is causal; if they pull against each other, it is concessive:</p><ul><li><b>Cum aeger esset, nōn vēnit.</b> — <i>Since</i> he was ill, he did not come.</li><li><b>Cum aeger esset, tamen vēnit.</b> — <i>Although</i> he was ill, he still came.</li></ul><p>The word <b>tamen</b> in the main clause is a strong hint that the <b>cum</b> was concessive.</p><h3>Conditions</h3><table class=\"gr\"><tr><th>Type</th><th>Protasis (sī…)</th><th>Apodosis</th><th>English</th></tr><tr><td>Simple fact</td><td>indicative</td><td>indicative</td><td>if he is here, I am glad</td></tr><tr><td>Future more vivid</td><td>fut. / fut. perf.</td><td>future</td><td>if he comes, I shall be glad</td></tr><tr><td>Future less vivid</td><td>pres. subj.</td><td>pres. subj.</td><td>should he come, I would be glad</td></tr><tr><td>Present contrary to fact</td><td>imperf. subj.</td><td>imperf. subj.</td><td>if he were here, I would be glad</td></tr><tr><td>Past contrary to fact</td><td>pluperf. subj.</td><td>pluperf. subj.</td><td>if he had been here, I would have been glad</td></tr></table><p>The pattern is regular and worth memorising as a block: indicative for the real, present subjunctive for the hypothetical-but-open, imperfect and pluperfect for the definitely-not-so. Note that Latin marks the unreality in the verb itself, where English needs &#39;would&#39;.</p><p><b>Nisi</b> is the negative of <b>sī</b>: unless, if not. <b>Sī nōn</b> negates a single word rather than the whole condition.</p><h3>Indirect questions</h3><p>Any question reported after a verb of asking, knowing, doubting, wondering or telling takes the <b>subjunctive</b>, and the tense follows the sequence rules:</p><table class=\"gr\"><tr><th>Direct</th><th>Reported</th></tr><tr><td lang=\"la\">Quid facis?</td><td lang=\"la\">Rogat quid faciās. / Rogāvit quid facerēs.</td></tr><tr><td lang=\"la\">Cūr vēnit?</td><td lang=\"la\">Nesciō cūr vēnerit. / Nesciēbam cūr vēnisset.</td></tr></table><p>The question word survives — <b>quis, quid, cūr, ubi, quandō, quōmodo, num, utrum … an</b> — and it is your signal. When a question word follows a verb of asking or knowing, expect a subjunctive.</p><div class=\"tip\">Do not confuse this with indirect statement. <b>Nesciō eum vēnisse</b> is &#39;I do not know that he came&#39;. <b>Nesciō cūr vēnerit</b> is &#39;I do not know why he came&#39;. The first reports a fact, the second a question, and Latin uses entirely different machinery for each.</div><h3>Fearing clauses</h3><p>Verbs of fearing invert the expected particles, which catches out almost everyone the first time: <b>timeō nē veniat</b> means I am afraid <i>that</i> he will come, and <b>timeō ut veniat</b> means I am afraid that he will <i>not</i> come. Think of it as an old wish: &#39;may he not come — I am afraid&#39;.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Translating every <b>cum</b> + subjunctive as &#39;when&#39; and losing the causal or concessive force.</li><li>Using the indicative in an indirect question.</li><li>Mixing tenses across the halves of a contrary-to-fact condition.</li><li>Reading <b>nē</b> after a verb of fearing as a negative.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Cum nescīret quid hostēs parārent, timēbat nē, sī noctū vēnissent, urbs caperētur.</p><table class=\"gr\"><tr><th>Clause</th><th>Construction</th><th>Note</th></tr><tr><td lang=\"la\">Cum nescīret</td><td>cum + imperf. subj.</td><td>causal: since he did not know</td></tr><tr><td lang=\"la\">quid hostēs parārent</td><td>indirect question</td><td>question word + subjunctive, secondary sequence</td></tr><tr><td lang=\"la\">timēbat nē … caperētur</td><td>fearing clause</td><td><b>nē</b> here means <i>that</i>, not <i>that not</i></td></tr><tr><td lang=\"la\">sī noctū vēnissent</td><td>pluperf. subj. protasis</td><td>inside the fear, attracted into the subjunctive</td></tr></table><p><b>Sense:</b> since he did not know what the enemy were preparing, he was afraid that the city would be captured if they came by night. Four subordinate clauses, each nested inside the last — and finding the one main verb, <b>timēbat</b>, is the first move.</p></div>","examples":[["Cum Caesar vēnit, mīlitēs laetī erant.","When Caesar came, the soldiers were happy."],["Cum hoc scīret, tamen tacuit.","Although he knew this, he was nevertheless silent."],["Sī hoc facis, errās.","If you do this, you are wrong."],["Sī adesset, gaudērem.","If he were here, I would rejoice."],["Rogat cūr abeās.","He asks why you are leaving."]],"vocab":[["cum","when / since / although"],["sī","if"],["nisi","unless"],["tamen","nevertheless"],["rogō","ask"],["quaerō","seek / ask"],["gaudeō","rejoice"],["errō","be mistaken"],["abeō","go away"],["adsit","may be present"],["condiciō","condition"],["quaestiō oblīqua","indirect question"]],"exercises":[{"t":"mcq","q":"With subjunctive, <i>cum</i> may mean:","opts":["since or although","only with","only after","never when"],"a":0,"ex":"<b>Cum</b> with the subjunctive is circumstantial, causal ('since') or concessive ('although'). With the indicative it is purely temporal."},{"t":"fill","q":"If he were here, I would rejoice: Sī adesset, ___.","a":["gaudērem"],"ex":"Present contrary-to-fact takes imperfect subjunctive in both halves: <b>sī adesset, gaudērem</b>. Latin marks the unreality in the verb form itself."},{"t":"mcq","q":"Present contrary-to-fact normally uses:","opts":["imperfect subjunctive","future indicative","perfect infinitive","imperative"],"a":0,"ex":"Imperfect subjunctive for the present, pluperfect for the past. Contrast the future-less-vivid, which uses the present subjunctive."},{"t":"fill","q":"He asks why you leave: Rogat cūr ___.","a":["abeās"],"ex":"An indirect question takes the subjunctive, and the tense follows sequence: present <b>rogat</b> gives present <b>abeās</b>. The direct form would be <b>cūr abīs?</b>"},{"t":"mcq","q":"Indirect questions use:","opts":["subjunctive","accusative + infinitive only","imperative","ablative absolute"],"a":0,"ex":"Latin subordinates the question by mood; English does it by word order. Any interrogative word after a verb of asking, knowing or doubting should prompt you to expect a subjunctive."},{"t":"fill","q":"Although he knew this: ___ hoc scīret","a":["Cum"],"ex":"<b>Cum</b> plus the imperfect subjunctive <b>scīret</b> is concessive here. Which of its senses applies is decided by the logic of the sentence, not by the form."},{"t":"parse","form":"cum vēnisset","q":"Identify the construction:","opts":["cum-circumstantial with pluperfect subjunctive","cum-temporal with indicative","a conditional","an indirect question"],"a":0,"ex":"<b>Cum</b> plus the subjunctive sets a circumstance and often shades into 'since' or 'although'. With the indicative it would be purely 'when'."},{"t":"parse","form":"sī adfuisset","q":"This protasis is:","opts":["past contrary to fact","present contrary to fact","future more vivid","simple fact"],"a":0,"ex":"Pluperfect subjunctive puts the unreality in the past: 'if he had been there' — but he was not."},{"t":"trans","form":"Sī adest, gaudeō.","q":"Make it present contrary to fact:","a":["Sī adesset, gaudērem","si adesset, gauderem"],"ex":"Both halves go into the imperfect subjunctive: 'if he were here, I would be glad' — but he is not."},{"t":"trans","form":"Cūr abīs?","q":"Report it after <i>Rogāvit</i>:","a":["Rogāvit cūr abīrēs","rogavit cur abires"],"ex":"An indirect question takes the subjunctive, and a past main verb pulls it into the imperfect. The question word <b>cūr</b> stays."},{"t":"pick","s":"Nesciō quis vēnerit et cūr vēnerit.","q":"Click the interrogative pronoun.","a":"quis","ex":"<b>quis</b> introduces the first indirect question; the perfect subjunctive <b>vēnerit</b> marks prior time in primary sequence after <b>Nesciō</b>."},{"t":"pick","s":"Cum Rōmam vēnissēmus, senātōrem vīdimus.","q":"Click the main verb.","a":"vīdimus","ex":"<b>vīdimus</b> is indicative and stands outside the <b>cum</b>-clause. Finding the one verb not inside a subordinate clause is the reliable first step in any long sentence."},{"t":"mcq","q":"<i>Sī hoc dīcās, errēs</i> is:","opts":["future less vivid — 'should you say... you would be wrong'","present contrary to fact","past contrary to fact","simple fact"],"a":0,"ex":"Present subjunctive in both halves makes the condition hypothetical but still open. English 'should... would' catches the tone."},{"t":"mcq","q":"An indirect question is signalled by:","opts":["a question word plus a subjunctive verb","an accusative plus an infinitive","ut plus subjunctive","a bare infinitive"],"a":0,"ex":"Accusative plus infinitive is indirect <i>statement</i>. Mixing up the two is the most common misreading of reported speech."},{"t":"fill","q":"If you had come, you would have seen him: Sī vēnissēs, eum ___.","a":["vīdissēs","vidisses"],"ex":"<b>vīdissēs</b>: past contrary to fact keeps the pluperfect subjunctive in both halves."},{"t":"fill","q":"Although he was brave, he fled: ___ fortis esset, fūgit.","a":["Cum","cum"],"ex":"<b>Cum</b> plus the subjunctive, here concessive. Only the sense — bravery versus flight — tells you it is 'although' rather than 'since'."}]}]},{"id":"reading","short":"IV","icon":"Ⅳ","label":"Stage IV — Reading Latin","tagline":"From constructions to literature","desc":"Deponents, ablative absolutes, obligation, tense sequence, prose architecture, poetry and a method for independent reading.","units":[{"id":"a1","title":"Deponent verbs","subtitle":"Passive forms with active meaning","grammar":"<p class=\"lead\">Some Latin verbs are passive in every form and active in every meaning. They are called deponent because they have <i>laid aside</i> — <b>dēposuērunt</b> — their active forms, and they are far too common to treat as a curiosity.</p><h3>What a deponent looks like</h3><table class=\"gr\"><tr><th>Form</th><th>Looks like</th><th>Actually means</th></tr><tr><td lang=\"la\">sequitur</td><td>he is followed</td><td>he follows</td></tr><tr><td lang=\"la\">loquēbātur</td><td>he was being spoken</td><td>he was speaking</td></tr><tr><td lang=\"la\">secūtus est</td><td>he was followed</td><td>he followed</td></tr><tr><td lang=\"la\">cōnārī</td><td>to be tried</td><td>to try</td></tr></table><p>There is nothing to learn about the endings: they are exactly the passive endings of <b>m6</b>. What you learn is the vocabulary, because only the dictionary tells you a verb is deponent — its principal parts are given in passive form: <b>sequor, sequī, secūtus sum</b>.</p><h3>Deponents worth knowing on sight</h3><table class=\"gr\"><tr><th>Verb</th><th>Meaning</th><th>Verb</th><th>Meaning</th></tr><tr><td>sequor</td><td>follow</td><td>loquor</td><td>speak</td></tr><tr><td>proficīscor</td><td>set out</td><td>morior</td><td>die</td></tr><tr><td>ūtor</td><td>use</td><td>patior</td><td>suffer, allow</td></tr><tr><td>vereor</td><td>fear</td><td>orior</td><td>rise, arise</td></tr><tr><td>cōnor</td><td>try</td><td>hortor</td><td>urge</td></tr><tr><td>nāscor</td><td>be born</td><td>arbitror</td><td>think</td></tr><tr><td>ēgredior</td><td>go out</td><td>ingredior</td><td>enter</td></tr></table><h3>The one real gift they bring</h3><p>Regular Latin has no perfect active participle. It cannot say &#39;having spoken&#39; in one word. Deponents can:</p><ul><li><b>locūtus</b> — having spoken</li><li><b>secūtus</b> — having followed</li><li><b>profectus</b> — having set out</li><li><b>veritus</b> — having feared, fearing</li></ul><p>This is why Caesar and Livy reach for them so often at the start of a sentence: <b>Mīlitēs, ducem secūtī, flūmen trānsiērunt</b> compresses an entire clause into two words. Watch for the pattern; it is everywhere in narrative prose.</p><h3>The one form that stays passive</h3><p>A deponent&#39;s gerundive keeps genuine passive force: <b>sequendus</b> means &#39;needing to be followed&#39;, and <b>hortandus</b> means &#39;needing to be urged&#39;. Everything else about the verb is active in sense.</p><h3>Deponents that take the ablative</h3><p>Five common deponents govern the ablative rather than the accusative: <b>ūtor</b> use, <b>fruor</b> enjoy, <b>fungor</b> perform, <b>potior</b> gain possession of, <b>vescor</b> feed on. <b>Gladiō ūtitur</b> — he uses a sword. If you read this as an ablative of means you will get the sense right by accident, but the construction wrong.</p><h3>Semi-deponents</h3><p>Four verbs are active in the present system and deponent in the perfect: <b>audeō, audēre, ausus sum</b> dare; <b>gaudeō, gaudēre, gāvīsus sum</b> rejoice; <b>soleō, solēre, solitus sum</b> be accustomed; <b>fīdō, fīdere, fīsus sum</b> trust. And a few verbs go the other way — <b>revertor</b> is deponent in the present and active in the perfect, <b>revertī</b>.</p><div class=\"tip\">The practical rule while reading: if a passive form makes no sense as a passive, you are looking at a deponent. <b>Profectī sunt</b> cannot mean &#39;they were set out&#39;, so it means &#39;they set out&#39;.</div><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Translating <b>locūtus est</b> as &#39;he was spoken&#39;.</li><li>Giving <b>ūtor</b> an accusative object.</li><li>Trying to form an active <b>sequit</b>. It does not exist.</li><li>Forgetting that the perfect participle of a deponent still agrees with its subject like any adjective: <b>profecta est</b> for a feminine subject.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Ducem veritī, mīlitēs quī proficīscī cōnātī erant castrīs ūsī sunt.</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Sense</th></tr><tr><td lang=\"la\">veritī</td><td>perfect participle, deponent</td><td>active: <i>having feared</i>, agreeing with <b>mīlitēs</b></td></tr><tr><td lang=\"la\">Ducem</td><td>accusative</td><td>object of <b>veritī</b> — a participle still governs its verb&#39;s case</td></tr><tr><td lang=\"la\">proficīscī</td><td>present infinitive, deponent</td><td>active: <i>to set out</i>, despite the passive shape</td></tr><tr><td lang=\"la\">cōnātī erant</td><td>pluperfect, deponent</td><td>they had tried</td></tr><tr><td lang=\"la\">castrīs ūsī sunt</td><td>perfect + ablative</td><td>they used the camp — <b>ūtor</b> takes the ablative</td></tr></table><p><b>Sense:</b> fearing their commander, the soldiers who had tried to set out made use of the camp. Five deponent forms, every one of them active in meaning, and one governing an ablative where you would expect an object.</p></div>","examples":[["Dux mīlitēs sequitur.","The leader follows the soldiers."],["Caesar locūtus discessit.","Caesar, having spoken, departed."],["Hostēs profectī sunt.","The enemy set out."],["Hoc facere ausus est.","He dared to do this."]],"vocab":[["loquor, loquī, locūtus sum","speak"],["sequor, sequī, secūtus sum","follow"],["proficīscor, proficīscī, profectus sum","set out"],["morior, morī, mortuus sum","die"],["patior, patī, passus sum","suffer"],["ūtor, ūtī, ūsus sum","use (+ abl.)"],["audeō, audēre, ausus sum","dare"],["cōnor, cōnārī","try"],["hortor, hortārī","encourage"],["arbitror, arbitrārī","think / judge"],["dēpōnēns","deponent"],["forma passīva","passive form"]],"exercises":[{"t":"fill","q":"he follows: sequ___","a":["itur"],"ex":"<b>sequitur</b> looks passive but is active in meaning: 'he follows'. Deponents have laid aside their active forms — <i>dēpōnere</i>, to lay aside."},{"t":"fill","q":"having spoken: locūt___","a":["us"],"ex":"<b>locūtus</b> is a perfect participle with <i>active</i> meaning, 'having spoken'. Deponents supply the perfect active participle that regular verbs lack."},{"t":"mcq","q":"A deponent verb has:","opts":["passive forms and active meaning","active forms and passive meaning","no perfect tense","no infinitive"],"a":0,"ex":"Passive in form, active in sense. The one exception is the gerundive, which stays genuinely passive."},{"t":"fill","q":"they set out: profectī ___.","a":["sunt"],"ex":"<b>profectī sunt</b> is the perfect of <b>proficīscor</b>, formed like a passive but translated actively. The participle agrees with the plural subject."},{"t":"mcq","q":"<i>ūtor</i> governs:","opts":["ablative","accusative","genitive","nominative"],"a":0,"ex":"Five deponents govern the ablative: <b>ūtor, fruor, fungor, potior, vescor</b>. <b>gladiō ūtitur</b> = he uses a sword."},{"t":"fill","q":"he dared: ausus ___.","a":["est"],"ex":"<b>ausus est</b>, from <b>audeō</b>, is semi-deponent: regular in the present system, deponent in the perfect. <b>gaudeō</b> and <b>soleō</b> behave the same way."},{"t":"parse","form":"loquēbātur","q":"Identify:","opts":["imperfect of a deponent — 'he was speaking'","imperfect passive — 'he was being spoken'","perfect deponent","present passive"],"a":0,"ex":"<b>loquor</b> is deponent, so a passive-looking form has active meaning throughout."},{"t":"parse","form":"ūsus","q":"Identify the participle and its force:","opts":["perfect participle, active in sense — 'having used'","perfect passive — 'having been used'","present active","future active"],"a":0,"ex":"Deponents supply exactly the participle regular verbs lack. That is why Latin authors reach for them when they need 'having done X'."},{"t":"trans","form":"sequitur","q":"Put into the perfect:","a":["secūtus est","secutus est"],"ex":"<b>secūtus est</b>, 'he followed'. Compound in form, active in meaning, and the participle agrees with the subject."},{"t":"trans","form":"cōnor","q":"Give the present infinitive:","a":["cōnārī","conari"],"ex":"<b>cōnārī</b>. A deponent's infinitive is passive in form: <b>cōnārī, verērī, loquī, blandīrī</b>."},{"t":"pick","s":"Mīlitēs, ducem secūtī, flūmen trānsiērunt.","q":"Click the deponent participle.","a":"secūtī","ex":"<b>secūtī</b> is active in sense — 'having followed the leader' — and agrees with <b>Mīlitēs</b>. A regular verb could not say this in one word."},{"t":"pick","s":"Hostēs pecūniā ūsī bellum parāvērunt.","q":"Click the ablative governed by the deponent.","a":"pecūniā","ex":"<b>ūtor</b> takes the ablative, not the accusative. The five to memorise are <b>ūtor, fruor, fungor, potior, vescor</b>."},{"t":"mcq","q":"Which is a semi-deponent verb?","opts":["audeō, audēre, ausus sum","sequor, sequī, secūtus sum","amō, amāre, amāvī","regō, regere, rēxī"],"a":0,"ex":"Semi-deponents are active in the present system and deponent in the perfect: <b>audeō, gaudeō, soleō, fīdō</b>."},{"t":"mcq","q":"Which form does a deponent still keep with genuine passive force?","opts":["the gerundive","the perfect participle","the present participle","the infinitive"],"a":0,"ex":"<b>sequendus</b> means 'needing to be followed' — passive. Everything else about a deponent is active in sense."},{"t":"fill","q":"we are speaking: loqu___","a":["imur"],"ex":"<b>loquimur</b>. Third-conjugation deponents take exactly the passive endings of <b>regor</b>."},{"t":"fill","q":"having set out (nom. m. pl.): profect___","a":["ī","i"],"ex":"<b>profectī</b>, from <b>proficīscor</b>. Very common in Caesar as the opening word of a march narrative."}]},{"id":"a2","title":"Ablative absolute","subtitle":"A detached background clause","grammar":"<p class=\"lead\">The ablative absolute is the single most characteristic construction of Latin prose. Caesar uses it to open paragraphs; Cicero uses it to fold whole clauses into two words. It has one rule, and one common misunderstanding.</p><h3>The construction</h3><p>A noun and a participle, both in the ablative, standing apart from the main clause:</p><ul><li><b>urbe captā</b> — the city having been captured</li><li><b>hīs rēbus cognitīs</b> — these things having been learned</li><li><b>hostibus appropinquantibus</b> — the enemy approaching</li><li><b>Caesare duce</b> — Caesar being leader</li></ul><p class=\"ruleline\">The noun must have <b>no other grammatical role</b> in the main clause. That detachment is what <i>absolūtus</i> — loosened — means.</p><p>If the noun does have a role, use an ordinary participle instead. <b>Caesar, urbe captā, discessit</b> is correct because the city plays no part in Caesar&#39;s departure. <b>Caesar urbem captam incendit</b> is correct because the city is the object of <b>incendit</b> — you cannot say <i>urbe captā incendit</i> and mean he burned it.</p><h3>Which participle, and what it tells you</h3><table class=\"gr\"><tr><th>Participle</th><th>Time</th><th>Example</th><th>English</th></tr><tr><td>Perfect passive</td><td>before the main verb</td><td lang=\"la\">signō datō</td><td>once the signal had been given</td></tr><tr><td>Present active</td><td>same time as the main verb</td><td lang=\"la\">mīlitibus pugnantibus</td><td>while the soldiers fought</td></tr><tr><td>none (two nouns)</td><td>state of affairs</td><td lang=\"la\">Cicerōne cōnsule</td><td>in Cicero&#39;s consulship</td></tr></table><p>The third row exists because <b>sum</b> has no present participle. Latin simply sets two ablatives side by side and lets you supply the &#39;being&#39;. This is how the Romans dated events, and you will meet it in every historian: <b>M. Messālā et M. Pīsōne cōnsulibus</b>.</p><h3>Translating it</h3><p>&#39;The city having been captured&#39; is not English anyone speaks. The construction is deliberately vague about the logical relationship, and your job is to choose the one the context wants:</p><table class=\"gr\"><tr><th>Force</th><th>English</th></tr><tr><td>Time</td><td>after the city was captured / once the city fell</td></tr><tr><td>Cause</td><td>because the city had been captured</td></tr><tr><td>Concession</td><td>although the city had been captured</td></tr><tr><td>Condition</td><td>if the city were captured</td></tr><tr><td>Attendant circumstance</td><td>with the city captured</td></tr></table><h3>Why Latin likes it so much</h3><p>Compression. <b>Hīs rēbus cognitīs, Caesar cōpiās ēdūxit</b> would need a full subordinate clause in English — &#39;when Caesar had found this out, he led out his forces&#39; — and even then English has to repeat the subject. Latin does it in three words and keeps the main clause clean. In Caesar the phrase functions almost as punctuation, marking the transition from one stage of an operation to the next.</p><div class=\"tip\">Deponent participles inside an absolute are active in sense: <b>sōle ortō</b> is the sun <i>having risen</i>, not having been risen. <b>Orior</b> is deponent.</div><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Putting only one of the two words into the ablative.</li><li>Using an absolute when the noun already has a job in the main clause. Real authors do bend this, but learn the rule before you break it.</li><li>Translating it literally and producing English nobody would write.</li><li>Missing a two-noun absolute because there is no participle to alert you.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Signō datō, mīlitibus fortiter pugnantibus, Caesare ipsō imperātōre, hostēs pulsī sunt.</p><table class=\"gr\"><tr><th>Phrase</th><th>Type</th><th>Force</th></tr><tr><td lang=\"la\">Signō datō</td><td>perfect participle</td><td>prior: once the signal had been given</td></tr><tr><td lang=\"la\">mīlitibus … pugnantibus</td><td>present participle</td><td>simultaneous: while the soldiers fought bravely</td></tr><tr><td lang=\"la\">Caesare ipsō imperātōre</td><td>two nouns, no participle</td><td>circumstance: with Caesar himself in command</td></tr><tr><td lang=\"la\">hostēs pulsī sunt</td><td>main clause</td><td>perfect passive: the enemy were driven back</td></tr></table><p><b>Sense:</b> once the signal had been given, while the soldiers fought bravely and with Caesar himself in command, the enemy were driven back. Three absolutes stacked before a five-word main clause — and none of the ablative nouns has any role in it.</p></div>","examples":[["Sole ortō, profectī sumus.","When the sun had risen, we set out."],["Urbe captā, mīlitēs discessērunt.","After the city was captured, the soldiers departed."],["Caesare duce, Rōmānī vīcērunt.","With Caesar as commander, the Romans won."],["Hostibus appropinquantibus, portae clausae sunt.","As the enemy approached, the gates were closed."]],"vocab":[["sole ortō","when the sun had risen"],["urbe captā","with the city captured"],["Caesare duce","with Caesar as leader"],["hostibus appropinquantibus","as the enemy approached"],["orior, orīrī","rise"],["appropinquō","approach"],["circumstantia","circumstance"],["causa","cause"],["concessiō","concession"],["tempus","time"],["absolūtus","detached / absolute"],["participium","participle"]],"exercises":[{"t":"fill","q":"after the city was captured: urbe capt___","a":["ā"],"ex":"<b>urbe captā</b>: both noun and participle take the ablative. The phrase sets a circumstance and has no grammatical link to the main clause."},{"t":"fill","q":"with Caesar as leader: Caesar___ duce","a":["e"],"ex":"<b>Caesare duce</b> is a noun-plus-noun ablative absolute, 'with Caesar as leader'. No participle is present at all."},{"t":"mcq","q":"An ablative absolute is:","opts":["grammatically detached from the main clause","the direct object","always a condition","always passive in translation"],"a":0,"ex":"'Absolute' means loosened — <i>absolūtus</i>. The noun in the ablative must not otherwise function in the main clause; if it does, use a plain participle instead."},{"t":"fill","q":"when the sun had risen: sole ___.","a":["ortō"],"ex":"<b>sōle ortō</b> uses the perfect participle of the deponent <b>orior</b>, so the sense is active: the sun having risen."},{"t":"mcq","q":"Two nouns can form an ablative absolute because:","opts":["sum lacks a present participle","Latin has no ablative","all nouns are verbs","it is direct speech"],"a":0,"ex":"<b>sum</b> has no present participle, so Latin simply juxtaposes two ablatives: <b>Cicerōne cōnsule</b>, in Cicero's consulship. Roman dates are routinely written this way."},{"t":"fill","q":"as the enemy approached: hostibus appropinquant___","a":["ibus"],"ex":"<b>appropinquantibus</b> is the present participle in the ablative plural, agreeing with <b>hostibus</b> and marking action simultaneous with the main verb."},{"t":"parse","form":"hīs rēbus cognitīs","q":"Identify the construction and its force:","opts":["ablative absolute, prior time","ablative of means","dative of agent","genitive absolute"],"a":0,"ex":"A perfect participle in an ablative absolute marks time earlier than the main verb: 'when these things had been learned'. It is one of Caesar's standard paragraph hinges."},{"t":"parse","form":"Cicerōne cōnsule","q":"Why is there no participle?","opts":["sum has no present participle, so two nouns stand alone","the participle is understood as captus","it is an error","participles are optional in poetry"],"a":0,"ex":"'In Cicero's consulship' — the noun-plus-noun ablative absolute is how Romans dated events, and the gap where <i>being</i> should stand is a permanent feature of the language."},{"t":"trans","form":"Rēx mortuus est.","q":"Turn it into an ablative absolute meaning 'the king having died':","a":["rēge mortuō","rege mortuo"],"ex":"<b>rēge mortuō</b>. <b>morior</b> is deponent, so its perfect participle is active in sense — the king died, he was not 'died'."},{"t":"trans","form":"hostēs appropinquant","q":"Turn it into an ablative absolute:","a":["hostibus appropinquantibus"],"ex":"<b>hostibus appropinquantibus</b>. A present participle in the absolute marks action going on at the same time as the main verb."},{"t":"pick","s":"Caesar, castrīs mūnītīs, cōpiās ēdūxit.","q":"Click the noun of the ablative absolute.","a":"castrīs","ex":"<b>castrīs mūnītīs</b> sits inside the sentence as an aside. Note that <b>castra</b> has no bearing on <b>ēdūxit</b> — that detachment is what licenses the construction."},{"t":"pick","s":"Urbe captā, mīlitēs eam incendērunt.","q":"Click the word that shows the ablative absolute is being used loosely here.","a":"eam","ex":"Strictly the city should have no role in the main clause, but <b>eam</b> picks it up again. Real authors do bend the rule; recognising the looseness is part of reading them."},{"t":"mcq","q":"An ablative absolute is best translated into English as:","opts":["a subordinate clause of time, cause or concession","a second main clause","a noun phrase","a question"],"a":0,"ex":"'The city having been captured' is not English anyone speaks. 'After the city was captured' or 'once the city fell' is."},{"t":"mcq","q":"Which phrase is <i>not</i> an ablative absolute?","opts":["gladiō interfectus","duce interfectō","sōle oriente","urbe captā"],"a":0,"ex":"<b>gladiō interfectus</b> is an ablative of means plus a participle agreeing with the sentence's subject — 'killed by a sword'. Only one word is in the ablative."},{"t":"fill","q":"with the war finished: bellō confect___","a":["ō","o"],"ex":"<b>bellō cōnfectō</b>. Both words carry the ablative; getting only one of them into the case is the classic slip."},{"t":"fill","q":"with Caesar as commander: Caesare imperātor___","a":["e"],"ex":"<b>Caesare imperātōre</b> — two nouns, no participle, because <b>sum</b> cannot supply one."}]},{"id":"a3","title":"Gerunds, gerundives & obligation","subtitle":"Verbal nouns and the passive periphrastic","grammar":"<p class=\"lead\">Latin needs a way to use a verb as a noun — &#39;the art of writing&#39;, &#39;for the sake of seeing&#39; — and a way to say that something must be done. Both run through the same set of endings in <b>-nd-</b>.</p><h3>Gerund and gerundive: the distinction</h3><table class=\"gr\"><tr><th></th><th>Gerund</th><th>Gerundive</th></tr><tr><td>What it is</td><td>a verbal <b>noun</b></td><td>a verbal <b>adjective</b></td></tr><tr><td>Agrees with</td><td>nothing</td><td>a noun, in case, number and gender</td></tr><tr><td>Meaning</td><td>the act of doing</td><td>needing to be done</td></tr><tr><td>Forms</td><td>neuter singular only, no nominative</td><td>full set like <b>bonus</b></td></tr><tr><td>Example</td><td lang=\"la\">ars scrībendī</td><td lang=\"la\">liber legendus</td></tr></table><p>The gerund has four forms and no plural: genitive <b>scrībendī</b>, dative <b>scrībendō</b>, accusative <b>scrībendum</b> (only after a preposition), ablative <b>scrībendō</b>. Its nominative slot is filled by the infinitive: <b>scrībere est difficile</b>.</p><h3>The swap that trips everyone</h3><p>When a gerund would take a direct object, Latin almost always avoids it. Instead the object becomes the noun, and the gerundive agrees with it. The meaning is identical; the idiom is not optional.</p><table class=\"gr\"><tr><th>Avoided</th><th>Preferred</th><th>Meaning</th></tr><tr><td lang=\"la\">ad legendum librōs</td><td lang=\"la\">ad librōs legendōs</td><td>for reading books</td></tr><tr><td lang=\"la\">cupiditās videndī urbem</td><td lang=\"la\">cupiditās urbis videndae</td><td>a desire of seeing the city</td></tr><tr><td lang=\"la\">pācem petendī causā</td><td lang=\"la\">pācis petendae causā</td><td>for the sake of seeking peace</td></tr></table><p>Reading it is easier than writing it: when you see a noun and a <b>-nd-</b> word agreeing, translate the noun as the object of the verbal idea.</p><h3>The passive periphrastic</h3><p>A gerundive plus a form of <b>sum</b> expresses obligation or necessity:</p><ul><li><b>Carthāgō dēlenda est.</b> — Carthage must be destroyed.</li><li><b>Haec lēx servanda erat.</b> — This law had to be observed.</li><li><b>Hoc faciendum erit.</b> — This will have to be done.</li></ul><p>The person under the obligation goes into the <b>dative of agent</b>, not <b>ā</b> with the ablative:</p><p><b>Mihi hoc faciendum est.</b> — This must be done by me; I must do this.</p><p>The dative is used precisely so that it does not collide with an ablative of means already in the sentence. Where ambiguity would arise anyway, authors switch to <b>ā</b> with the ablative.</p><h3>The impersonal version</h3><p>Intransitive verbs have no object to agree with, so the gerundive goes into the neuter singular and the whole thing becomes impersonal:</p><ul><li><b>Nōbīs eundum est.</b> — literally &#39;there must be a going by us&#39;: we must go.</li><li><b>Mīlitibus pugnandum erat.</b> — the soldiers had to fight.</li><li><b>Mihi persuādendum est tibi.</b> — I must persuade you (<b>persuādeō</b> takes the dative, so it cannot be personal).</li></ul><h3>Expressing purpose with -nd-</h3><p>Two of the four purpose constructions from unit <b>s5</b> live here: <b>ad</b> with the accusative gerundive, and the genitive with <b>causā</b> or <b>grātiā</b>. Note that <b>causā</b> <i>follows</i> its genitive — <b>pācis petendae causā</b>, never <i>causā pācis petendae</i>.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Using <b>ā</b> with the ablative for the agent of a passive periphrastic instead of the dative.</li><li>Letting a gerund take a direct object where Latin wants the gerundive construction.</li><li>Reading a gerundive as an ordinary future passive participle and losing the sense of obligation.</li><li>Putting <b>causā</b> before its genitive.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Cīvibus, urbis dēfendendae causā, arma capienda erant; nam fugiendī nūlla spēs erat.</p><table class=\"gr\"><tr><th>Element</th><th>Form</th><th>Job</th></tr><tr><td lang=\"la\">Cīvibus</td><td>dative plural</td><td>dative of agent: by the citizens</td></tr><tr><td lang=\"la\">urbis dēfendendae causā</td><td>gen. gerundive + causā</td><td>purpose: for the sake of defending the city</td></tr><tr><td lang=\"la\">arma capienda erant</td><td>gerundive + <b>sum</b></td><td>obligation, agreeing with neuter plural <b>arma</b>: had to be taken up</td></tr><tr><td lang=\"la\">fugiendī</td><td>genitive gerund</td><td>a true gerund — no noun to agree with: of fleeing</td></tr></table><p><b>Sense:</b> the citizens had to take up arms in order to defend the city, for there was no hope of escape. One gerundive of purpose, one of obligation, and one plain gerund — all three in <b>-nd-</b>, told apart by whether they agree with anything.</p></div>","examples":[["Ars bene scrībendī difficilis est.","The art of writing well is difficult."],["Ad librōs legendōs tempus mihi deest.","I lack time for reading books."],["Haec lēx omnibus servanda est.","This law must be observed by everyone."],["Nōbīs proficīscendum est.","We must set out."]],"vocab":[["scrībendī","of writing"],["legendōs","to be read"],["servandus","to be observed"],["mihi faciendum est","I must do it"],["nōbīs eundum est","we must go"],["ars, artis f.","art / skill"],["tempus deest","time is lacking"],["omnibus","by everyone / for everyone"],["obligātiō","obligation"],["gerundium","gerund"],["gerundīvum","gerundive"],["periphrasticus","periphrastic"]],"exercises":[{"t":"fill","q":"the art of writing: ars scrībend___","a":["ī"],"ex":"The gerund is a verbal noun, declined in the singular in <b>-ndī, -ndō, -ndum, -ndō</b>. <b>ars scrībendī</b> = the art of writing."},{"t":"fill","q":"for reading books: ad librōs legend___","a":["ōs"],"ex":"With an object, Latin prefers the gerundive construction: not <i>ad legendum librōs</i> but <b>ad librōs legendōs</b>, the gerundive agreeing with the object."},{"t":"mcq","q":"The agent of a passive periphrastic is usually:","opts":["dative","ā/ab + ablative","accusative","genitive"],"a":0,"ex":"The passive periphrastic takes a dative of agent, not <b>ā</b> with the ablative: <b>mihi faciendum est</b>, it must be done by me."},{"t":"fill","q":"We must go: Nōbīs eundum ___.","a":["est"],"ex":"<b>eundum est</b> is an impersonal passive periphrastic from the intransitive <b>eō</b>, with <b>nōbīs</b> as dative of agent. Literally: there must be a going by us."},{"t":"fill","q":"This law must be observed: Haec lēx servanda ___.","a":["est"],"ex":"<b>servanda est</b> is a gerundive plus <b>sum</b>, expressing obligation. The gerundive agrees with <b>lēx</b>, so it is feminine singular."},{"t":"mcq","q":"<i>ad scrībendum</i> expresses:","opts":["purpose","possession","comparison","direct address"],"a":0,"ex":"<b>ad</b> plus the gerund or gerundive is one of Latin's standard purpose constructions, alongside <b>ut</b> plus subjunctive and the genitive with <b>causā</b>."},{"t":"parse","form":"scrībendī","q":"Identify:","opts":["gerund, genitive — 'of writing'","gerundive, genitive singular","present participle","supine"],"a":0,"ex":"The gerund is a neuter verbal noun with no nominative and no plural: <b>scrībendī, scrībendō, ad scrībendum, scrībendō</b>."},{"t":"parse","form":"legenda","q":"Identify:","opts":["gerundive, agreeing with a feminine or neuter plural noun","gerund","perfect participle","present participle"],"a":0,"ex":"A gerundive is an adjective and must agree with something: <b>legenda</b> is feminine singular or neuter plural. A gerund never agrees with anything."},{"t":"trans","form":"Hoc facere dēbēmus.","q":"Rewrite as a passive periphrastic:","a":["Hoc nōbīs faciendum est","hoc nobis faciendum est"],"ex":"Obligation moves into the gerundive, and the person obliged into the dative: 'this must be done by us'."},{"t":"trans","form":"ad legendum librōs","q":"Correct this into the idiomatic construction:","a":["ad librōs legendōs","ad libros legendos"],"ex":"When a gerund would take an object, Latin turns the object into the noun and makes the gerundive agree with it. The meaning is unchanged; the idiom is not optional."},{"t":"pick","s":"Carthāgō dēlenda est.","q":"Click the gerundive.","a":"dēlenda","ex":"Cato's slogan: 'Carthage must be destroyed'. The gerundive agrees with <b>Carthāgō</b>, feminine singular, and <b>est</b> supplies the tense."},{"t":"pick","s":"Mīlitibus pugnandum erat quod fugere nōn poterant.","q":"Click the dative of agent.","a":"Mīlitibus","ex":"Impersonal passive periphrastic: 'the soldiers had to fight'. The agent is dative, not <b>ā</b> with the ablative, precisely so it does not collide with the ablative of means."},{"t":"mcq","q":"<i>causā</i> with a gerund or gerundive in the genitive expresses:","opts":["purpose","means","time","place"],"a":0,"ex":"<b>pācis petendae causā</b>, 'for the sake of seeking peace'. Note <b>causā</b> follows its genitive rather than preceding it."},{"t":"mcq","q":"Which is the gerund rather than the gerundive?","opts":["ars vīvendī","liber legendus","urbs dēlenda","mīlitēs mittendī"],"a":0,"ex":"<b>vīvendī</b> is a bare verbal noun, 'of living', agreeing with nothing. The other three are adjectives agreeing with a noun."},{"t":"fill","q":"by reading (ablative gerund): leg___","a":["endō","endo"],"ex":"<b>legendō</b>, ablative of means: 'by reading'. The gerund's ablative is very common in this sense."},{"t":"fill","q":"These things must be said: Haec dīc___ sunt.","a":["enda"],"ex":"<b>dīcenda sunt</b> — neuter plural gerundive agreeing with <b>Haec</b>."}]},{"id":"a4","title":"Sequence of tenses & reported speech","subtitle":"Keep relative time consistent","grammar":"<p class=\"lead\">Latin&#39;s subjunctive tenses do not mark absolute time. They mark time <i>relative to the main verb</i>, and the rule that governs this — sequence of tenses — is the last major system in the language.</p><h3>The rule</h3><table class=\"gr\"><tr><th>Main verb</th><th>Same time as main verb</th><th>Time before main verb</th></tr><tr><td><b>Primary</b><br>present, future, future perfect,<br>perfect meaning &#39;have done&#39;</td><td>present subjunctive</td><td>perfect subjunctive</td></tr><tr><td><b>Secondary</b><br>imperfect, perfect meaning &#39;did&#39;,<br>pluperfect</td><td>imperfect subjunctive</td><td>pluperfect subjunctive</td></tr></table><p>Four combinations, and the whole of reported speech falls out of them:</p><table class=\"gr\"><tr><th>Latin</th><th>English</th></tr><tr><td lang=\"la\">Rogat quid faciās.</td><td>He asks what you are doing.</td></tr><tr><td lang=\"la\">Rogat quid fēcerīs.</td><td>He asks what you did.</td></tr><tr><td lang=\"la\">Rogāvit quid facerēs.</td><td>He asked what you were doing.</td></tr><tr><td lang=\"la\">Rogāvit quid fēcissēs.</td><td>He asked what you had done.</td></tr></table><p>Notice that the choice depends on the <i>Latin</i> main verb, not on what English wants. Do not translate into English first and then work backwards.</p><h3>The perfect&#39;s double life</h3><p>The Latin perfect does two jobs, and only one of them is primary. <b>Vēnit</b> meaning &#39;he has come&#39; is primary and takes present or perfect subjunctive after it. <b>Vēnit</b> meaning &#39;he came&#39; is secondary and takes imperfect or pluperfect. This is a genuine subtlety, and good authors use it deliberately.</p><h3>Extended reported speech</h3><p>When an author reports a long speech — Caesar does this for pages at a time — two patterns run in parallel:</p><ul><li>Main assertions become <b>infinitives</b> with accusative subjects (unit <b>s3</b>).</li><li>Subordinate clauses inside them go into the <b>subjunctive</b>, following sequence.</li><li>Commands and questions become <b>subjunctives</b> too.</li></ul><p><b>Caesar dīxit hostēs, quī flūmen trānsīssent, castra posuisse.</b> — Caesar said that the enemy, who had crossed the river, had pitched camp. <b>posuisse</b> is the reported assertion; <b>trānsīssent</b> is subjunctive because it sits inside reported speech.</p><p>This is why a page of Caesar can run for a paragraph without a single indicative verb. Once you spot the opening <b>dīxit</b> and the first accusative-and-infinitive, expect the pattern to continue until an indicative breaks it.</p><h3>Where sequence bends</h3><p>Result clauses are the main exception: they may use the perfect subjunctive after a secondary main verb, to stress that the result actually occurred as a single fact. <b>Tam graviter vulnerātus est ut mortuus sit</b> — he was so badly wounded that he died. Strict sequence would give <b>morerētur</b>; the perfect insists on the event.</p><div class=\"tip\">When you meet a subjunctive and cannot see why it is there, run through the checklist: purpose, result, indirect question, indirect command, relative of characteristic, <b>cum</b>-clause, condition, fearing clause, or subordinate clause inside reported speech. It will be one of those. The Grammar reference has this as a table.</div><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Choosing the subjunctive tense from the English rather than the Latin main verb.</li><li>Treating every perfect as secondary.</li><li>Using a perfect subjunctive after a past main verb where the pluperfect is wanted.</li><li>Reading a subjunctive inside reported speech as if the author were vouching for it — often the point is precisely that he is not.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Nescīvit cūr eī quī prius vēnissent nunc discēderent, neque rogāvit quid factūrī essent.</p><table class=\"gr\"><tr><th>Verb</th><th>Form</th><th>Why</th></tr><tr><td lang=\"la\">Nescīvit</td><td>perfect indicative</td><td>main verb, secondary sequence</td></tr><tr><td lang=\"la\">vēnissent</td><td>pluperfect subjunctive</td><td>prior time in secondary sequence</td></tr><tr><td lang=\"la\">discēderent</td><td>imperfect subjunctive</td><td>same time as the main verb</td></tr><tr><td lang=\"la\">factūrī essent</td><td>future participle + <b>essent</b></td><td>the periphrastic that supplies a &#39;future subjunctive&#39;, which Latin lacks</td></tr></table><p><b>Sense:</b> he did not know why those who had come earlier were now leaving, nor did he ask what they were going to do. Three subjunctives, three different relative times, all decided by one perfect main verb.</p></div>","examples":[["Rogat quid faciās.","He asks what you are doing."],["Rogāvit quid facerēs.","He asked what you were doing."],["Nesciō cūr vēnerit.","I do not know why he came."],["Nesciēbam cūr vēnisset.","I did not know why he had come."]],"vocab":[["tempus prīmārium","primary tense"],["tempus historicum","historic tense"],["simultāneus","simultaneous"],["prior","prior"],["subsequēns","subsequent"],["rogat","asks"],["rogāvit","asked"],["faciās","you are doing"],["facerēs","you were doing"],["vēnerit","he came / has come"],["vēnisset","he had come"],["cōnsecūtiō temporum","sequence of tenses"]],"exercises":[{"t":"fill","q":"He asks what you are doing: Rogat quid ___.","a":["faciās"],"ex":"Primary sequence: a present main verb takes the present subjunctive for action contemporaneous with it."},{"t":"fill","q":"He asked what you were doing: Rogāvit quid ___.","a":["facerēs"],"ex":"Secondary sequence: a past main verb takes the imperfect subjunctive for contemporaneous action. The choice depends on the main verb, not on English tense."},{"t":"mcq","q":"A historic main verb normally takes for simultaneous action:","opts":["imperfect subjunctive","present subjunctive","future indicative","perfect infinitive"],"a":0,"ex":"Historic main verbs use imperfect subjunctive for simultaneous action and pluperfect for prior action; primary verbs use present and perfect respectively."},{"t":"fill","q":"I did not know why he had come: Nesciēbam cūr ___.","a":["vēnisset"],"ex":"<b>vēnisset</b> is pluperfect subjunctive: prior action in secondary sequence after <b>nesciēbam</b>."},{"t":"mcq","q":"In extended indirect discourse, principal assertions are commonly:","opts":["infinitives","imperatives","ablatives absolute","vocatives"],"a":0,"ex":"In extended reported speech main assertions become infinitives while subordinate clauses go into the subjunctive. Caesar and Livy sustain this for whole paragraphs."},{"t":"fill","q":"I do not know why he came: Nesciō cūr ___.","a":["vēnerit"],"ex":"<b>vēnerit</b> is perfect subjunctive: prior action in primary sequence after the present <b>nesciō</b>. Compare it directly with <b>vēnisset</b> above."},{"t":"parse","form":"Rogāvit quid fēcissēs.","q":"Why is <b>fēcissēs</b> pluperfect subjunctive?","opts":["secondary sequence, action prior to the main verb","primary sequence, prior action","secondary sequence, same time","it is a result clause"],"a":0,"ex":"Past main verb plus prior action gives the pluperfect subjunctive. Change <b>Rogāvit</b> to <b>Rogat</b> and you must write <b>fēcerīs</b>."},{"t":"parse","form":"Nesciō quid faciat.","q":"Identify the sequence and the relative time:","opts":["primary sequence, same time as the main verb","secondary sequence, same time","primary sequence, prior time","secondary sequence, prior time"],"a":0,"ex":"Present main verb, present subjunctive: 'I do not know what he is doing.' For 'what he did' you would need <b>fēcerit</b>."},{"t":"trans","form":"Rogat quid agās.","q":"Put the main verb into the past, adjusting sequence:","a":["Rogāvit quid agerēs","rogavit quid ageres"],"ex":"Primary becomes secondary, so the present subjunctive becomes imperfect. The rule is mechanical once you have identified the main verb's tense."},{"t":"trans","form":"Nesciēbam cūr vēnisset.","q":"Put the main verb into the present, adjusting sequence:","a":["Nesciō cūr vēnerit","nescio cur venerit"],"ex":"Secondary becomes primary, so pluperfect subjunctive becomes perfect subjunctive. Prior time is preserved; only the sequence changes."},{"t":"pick","s":"Dīxit sē vēnisse ut urbem vidēret.","q":"Click the verb whose tense is set by sequence rules.","a":"vidēret","ex":"<b>vidēret</b> is imperfect subjunctive because <b>Dīxit</b> is secondary. <b>vēnisse</b> is an infinitive and follows the relative-time rule instead."},{"t":"pick","s":"Caesar dīxit hostēs, quī flūmen trānsīssent, castra posuisse.","q":"Click the subjunctive inside the reported speech.","a":"trānsīssent","ex":"Main assertions in reported speech become infinitives — <b>posuisse</b> — while subordinate clauses inside them go subjunctive: <b>trānsīssent</b>. Both patterns run together for whole paragraphs in Caesar."},{"t":"mcq","q":"Which counts as a primary tense for sequence?","opts":["the perfect meaning 'I have done'","the perfect meaning 'I did'","the imperfect","the pluperfect"],"a":0,"ex":"The Latin perfect does two jobs, and only its 'have done' sense is primary. This is one of the genuinely subtle points in the system."},{"t":"mcq","q":"In extended reported speech, commands become:","opts":["subjunctives","infinitives","imperatives","gerundives"],"a":0,"ex":"Statements become infinitives; questions and commands become subjunctives. Sorting them out is most of the difficulty in a Caesarian speech."},{"t":"fill","q":"He asks who they are: Rogat quī ___.","a":["sint"],"ex":"<b>sint</b>, present subjunctive in primary sequence."},{"t":"fill","q":"He asked who they had been: Rogāvit quī ___.","a":["fuissent"],"ex":"<b>fuissent</b>: secondary sequence, prior time. Compare it directly with <b>sint</b> above."}]},{"id":"a5","title":"Latin prose style","subtitle":"Period, emphasis and the architecture of a sentence","grammar":"<p class=\"lead\">You now know the grammar. What remains is the architecture: how a Roman builds a sentence that runs for eight lines and still lands, and how to read one without drowning.</p><h3>The period</h3><p>A Latin period stacks its subordinate material first and withholds the main verb until the end, so the sense snaps shut at the close. Cicero can sustain this for a hundred words. The reader is meant to hold everything in suspension — which is exactly what makes reading to the full stop before translating not a nicety but a requirement.</p><div class=\"tip\"><b>The procedure.</b> 1. Read to the full stop. 2. Mark every finite verb — each is a clause. 3. Mark the clause introducers: <b>ut, nē, cum, sī, quī, quod, quam</b>, question words. 4. Find the one verb <i>not</i> inside any subordinate clause: that is the main verb. 5. Attach its nominative, then its accusative, then everything else. 6. Only now write English, and write it in English word order.</div><h3>Emphasis is positional</h3><p>The two ends of a clause are the strong positions. A word that turns up somewhere unexpected is usually being stressed:</p><ul><li><b>Vēnit Caesar.</b> — the arrival is the news.</li><li><b>Caesarem vīdī.</b> — it was Caesar I saw.</li><li><b>Magnās Caesar cōpiās mīsit.</b> — the size of the force is the point.</li></ul><h3>Hyperbaton</h3><p>Words that agree are pulled apart, often framing the clause between them. <b>Magnam Caesar in Galliam dūxit exercitum</b> — <b>magnam</b> and <b>exercitum</b> agree across five words. Prose uses this for weight; verse uses it constantly. When you meet an adjective with no noun beside it, hold the ending and read on.</p><h3>Figures you will meet on every page</h3><table class=\"gr\"><tr><th>Figure</th><th>What it is</th><th>Example</th></tr><tr><td>Asyndeton</td><td>connectives omitted</td><td lang=\"la\">vēnī, vīdī, vīcī</td></tr><tr><td>Polysyndeton</td><td>connectives piled up</td><td lang=\"la\">et terrā et marī et caelō</td></tr><tr><td>Chiasmus</td><td>ABBA ordering</td><td lang=\"la\">ratiō mea, tua voluntās</td></tr><tr><td>Anaphora</td><td>repeated opening word</td><td lang=\"la\">nihil … nihil … nihil</td></tr><tr><td>Tricolon</td><td>three members, often rising</td><td lang=\"la\">abiit, excessit, ēvāsit, ērūpit</td></tr><tr><td>Litotes</td><td>understatement by negation</td><td lang=\"la\">nōn ignōrō</td></tr></table><p>These are not ornaments bolted on afterwards. Tacitus&#39;s <b>auferre trucidare rapere</b> — three infinitives with no connectives — is asyndeton doing the argument&#39;s work, and Cicero&#39;s anaphora of <b>nihil</b> in the first Catilinarian is how he builds pressure. Both are in the Reading Room.</p><h3>Connectives are signposts</h3><p>Latin marks the logical shape of an argument explicitly. Learn these as a set and long paragraphs become navigable: <b>itaque, igitur, ergō</b> therefore · <b>nam, enim</b> for · <b>autem, vērō, at, sed, tamen</b> but · <b>quoque, etiam</b> also · <b>praetereā</b> besides · <b>dēnique</b> finally · <b>quārē, quam ob rem</b> for which reason. Note that <b>enim, autem, vērō, igitur, quidem</b> stand <i>second</i> in their clause, never first.</p><h3>Idioms built from colourless verbs</h3><p>A great deal of Latin prose is <b>faciō, agō, capiō, gerō, habeō</b> plus a noun: <b>cōnsilium capere</b> form a plan · <b>bellum gerere</b> wage war · <b>iter facere</b> march · <b>grātiās agere</b> give thanks · <b>ōrātiōnem habēre</b> deliver a speech · <b>certiōrem facere</b> inform. Look up the noun, not the verb.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Translating linearly from the first word. This is what makes long sentences collapse.</li><li>Assuming the first noun is the subject of the main verb.</li><li>Putting <b>enim</b> or <b>autem</b> first in a clause when writing Latin.</li><li>Looking up every word before finding the clause structure. Structure first, vocabulary second.</li></ul></div><div class=\"worked\"><b>Worked sentence</b><p class=\"wl\" lang=\"la\">Quae cum ita sint, nōn sōlum quod fēcistī reprehendendum est, sed etiam, id quod gravius est, quod facere cōnātus es.</p><table class=\"gr\"><tr><th>Element</th><th>Function</th></tr><tr><td lang=\"la\">Quae cum ita sint</td><td>connecting relative + causal <b>cum</b>: since this is so</td></tr><tr><td lang=\"la\">nōn sōlum … sed etiam</td><td>correlative frame — signals a second member is coming</td></tr><tr><td lang=\"la\">quod fēcistī</td><td>substantive clause: the thing you did (subject of the periphrastic)</td></tr><tr><td lang=\"la\">reprehendendum est</td><td>passive periphrastic: must be censured</td></tr><tr><td lang=\"la\">id quod gravius est</td><td>parenthesis: which is more serious</td></tr><tr><td lang=\"la\">quod facere cōnātus es</td><td>the second member: what you attempted to do</td></tr></table><p><b>Sense:</b> since this is so, not only what you did must be censured but also — and this is the graver matter — what you tried to do. Find the correlative frame first and the sentence has a shape before you have translated a word of it.</p></div>","examples":[["Nōn sōlum fortis sed etiam prūdēns erat.","He was not only brave but also prudent."],["Ut sēmentem fēceris, ita metēs.","As you have sown, so shall you reap."],["Tantō maior erat glōria, quantō gravius perīculum.","The greater the danger, the greater the glory."],["His rēbus cognītīs, Caesar cōnsilium cēpit.","After learning these things, Caesar formed a plan."]],"vocab":[["nōn sōlum... sed etiam","not only... but also"],["ut... ita","as... so"],["cum... tum","both... and / when... then"],["tantō... quantō","the more... the more"],["prūdēns","prudent"],["glōria","glory"],["perīculum","danger"],["cognōscō","learn / recognise"],["cōnsilium capiō","form a plan"],["periodus","periodic sentence"],["emphasis","emphasis"],["hyperbaton","separation of linked words"]],"exercises":[{"t":"fill","q":"not only... but also: nōn sōlum... sed ___","a":["etiam"],"ex":"<b>nōn sōlum... sed etiam</b> is a correlative pair. Spotting the first member tells you a second is coming and helps you hold a long period together."},{"t":"mcq","q":"A sound first step in reading a long sentence is to:","opts":["mark finite verbs and clause introducers","translate every word in order","ignore endings","find an English translation"],"a":0,"ex":"Find the finite verbs and the words that introduce clauses first; that gives you the skeleton. Translating linearly from the first word is what causes long sentences to collapse."},{"t":"fill","q":"the more... the more: tantō... ___","a":["quantō"],"ex":"<b>quantō... tantō</b> with comparatives means 'the more... the more'. The usual order puts <b>quantō</b> first, as in the Nepos passage in the Reading Room."},{"t":"fill","q":"After these things were learned: His rēbus ___.","a":["cognītīs"],"ex":"<b>Hīs rēbus cognitīs</b> is a formulaic ablative absolute in historical prose, roughly 'this being learned'. Caesar uses it as a paragraph hinge."},{"t":"mcq","q":"Hyperbaton is:","opts":["separation of words that belong together","a passive verb","a case ending","a prose author"],"a":0,"ex":"Hyperbaton separates words that agree, often framing a line or clause between them. It signals emphasis and is pervasive in poetry."},{"t":"fill","q":"Caesar formed a plan: Caesar cōnsilium ___.","a":["cēpit"],"ex":"<b>cōnsilium capere</b> is a fixed idiom, 'to form a plan'. Latin builds many expressions from a colourless verb plus a noun."},{"t":"parse","form":"quō ... eō","q":"With two comparatives this pair means:","opts":["the more ... the more","because ... therefore","although ... nevertheless","when ... then"],"a":0,"ex":"<b>Quō longius, eō melius</b> — 'the further, the better'. The variant <b>quantō ... tantō</b> does the same job."},{"t":"parse","form":"hyperbaton","q":"Which line shows hyperbaton?","opts":["<i>magnum iter</i> ... <i>fēcit</i> ... <i>periculōsum</i>","Caesar mīlitēs convocāvit","in urbe manēbant","hostēs fūgērunt"],"a":0,"ex":"Splitting <b>magnum ... periculōsum</b> away from each other and from their noun frames the line and throws weight onto the separated words. Poets do this constantly; so does Cicero at climaxes."},{"t":"trans","form":"Postquam hoc audīvit, discessit.","q":"Rewrite the first clause as an ablative absolute:","a":["Hōc audītō, discessit","hoc audito, discessit"],"ex":"<b>Hōc audītō</b> compresses a whole clause into two words. Latin prose prefers this compression where English prefers a subordinate clause."},{"t":"trans","form":"Caesar vēnit. Caesar vīdit. Caesar vīcit.","q":"Compress into Caesar's own phrasing:","a":["Vēnī, vīdī, vīcī","veni vidi vici"],"ex":"Asyndeton — no connectives — plus first person and a rising tricolon. The rhetorical effect comes from what is left out."},{"t":"pick","s":"Nōn sōlum urbem cēpit sed etiam incolās servāvit.","q":"Click the second half of the correlative pair.","a":"sed","ex":"<b>Nōn sōlum ... sed etiam</b>. Spotting the first member tells you a second is coming, which is how you hold a long period in your head."},{"t":"pick","s":"Quae cum ita sint, dē bellō dīcam.","q":"Click the connecting relative.","a":"Quae","ex":"A relative opening a sentence refers back to what came before: 'Since these things are so'. Cicero uses this transition constantly."},{"t":"mcq","q":"A Latin 'period' is:","opts":["a long sentence whose sense is suspended until the end","a full stop","a historical era","a metrical unit"],"a":0,"ex":"Subordinate material is stacked first and the main verb withheld, so the sense snaps shut at the close. Reading to the full stop before translating is not optional."},{"t":"mcq","q":"Latin prose tends to place emphatic words:","opts":["first or last in their clause","always second","always next to the verb","at random"],"a":0,"ex":"The two ends of a clause are the strong positions. When a word appears somewhere surprising, that displacement is usually the author's point."},{"t":"fill","q":"Connect two clauses causally: Fūgērunt, ___ hostēs timēbant.","a":["quod","quia","nam"],"ex":"<b>quod</b> or <b>quia</b> with the indicative gives the writer's own reason; <b>quod</b> with the subjunctive would give someone else's alleged reason."},{"t":"fill","q":"and so, therefore (a single connective): ___","a":["itaque","igitur","ergō","ergo"],"ex":"<b>Itaque</b> normally opens its clause; <b>igitur</b> normally stands second. Connectives are how Latin signposts the shape of an argument."}]},{"id":"a6","title":"Poetry, metre & reading without a translation","subtitle":"From grammatical decoding to literary attention","grammar":"<p class=\"lead\">Latin verse is not prose with the words shuffled. It is built on a different principle from English poetry, and once you hear it the word order stops looking arbitrary.</p><h3>Quantity, not stress</h3><p>English metre counts stressed and unstressed syllables. Latin metre counts <b>long and short</b> ones. A syllable is long if it contains a long vowel or a diphthong, or if its vowel is followed by two consonants — even across a word boundary. Everything else is short.</p><table class=\"gr\"><tr><th>Foot</th><th>Pattern</th><th>Where</th></tr><tr><td>Dactyl</td><td>— ⏑ ⏑</td><td>hexameter, feet 1–5</td></tr><tr><td>Spondee</td><td>— —</td><td>substitutes for a dactyl; fixed in foot 6</td></tr><tr><td>Iamb</td><td>⏑ —</td><td>the metre of fable and drama</td></tr></table><h3>The dactylic hexameter</h3><p>Six feet. The first four are dactyls or spondees freely. The fifth is normally a dactyl — a spondaic fifth foot is rare and deliberately heavy. The sixth foot is always two syllables, <b>— x</b>: a long followed by an <i>anceps</i>, a final syllable that counts as long whatever its own quantity, because the pause at the end of the line supplies the missing weight. So the close is <b>— ⏑ ⏑ | — x</b> rather than a true dactyl-plus-spondee, and that fixed shape is what gives the line its cadence. It also means you can usually scan a hexameter backwards from the end more easily than forwards.</p><p class=\"wl\" lang=\"la\">Ārmă vĭ | rūmquĕ că | nō, Trō | iāe quī | prīmŭs ăb | ōrīs</p><p>Read it aloud. The two dactyls at the start drive the line forward, the spondees in the middle slow it, and the fifth-foot dactyl launches you into the close.</p><h3>Elision</h3><p>A word ending in a vowel or in <b>-m</b> loses that ending before a word beginning with a vowel or <b>h</b>. <b>multum ille et terris</b> is read as <i>mult(um) ill(e) et terris</i>. You must elide when scanning, or the line will not resolve — and elision is often expressive in itself, running two words together at a moment of urgency.</p><h3>The elegiac couplet</h3><p>A hexameter followed by a pentameter, which has a hard break in the middle and two half-lines of two and a half feet each. Catullus and Martial use it, and the built-in pause is what makes it so good for a punchline: the epigram sets up in the hexameter and lands in the pentameter.</p><h3>Why the word order</h3><p>Three pressures, all pulling at once: metre, emphasis, and the framing of the line. Because case endings hold the grammar in place, the poet is free to put a word wherever the sound and the sense want it. So <b>Troiae … ab oris</b> stretches across a whole line, and <b>memorem Iunonis ob iram</b> buries the adjective four words from its noun. This is not difficulty for its own sake; it is the medium.</p><div class=\"tip\">The practical consequence: in verse, <b>never</b> assume the next word is the one that agrees. Read the whole line, gather the endings, and let agreement — not proximity — tell you what belongs to what. The reading <i>A wakeful night</i> in the Reading Room is written to drill exactly this.</div><h3>Reading without a translation</h3><p>The final skill this course is aiming at. A working method:</p><ol><li>Read the passage aloud, twice, before looking anything up. Hear the rhythm.</li><li>Find the finite verbs and the clause boundaries.</li><li>Gather the agreements — every adjective has a noun somewhere.</li><li>Now look up what you genuinely do not know, and no more.</li><li>Only then reveal the notes, and last of all the translation.</li></ol><p>A translation consulted first turns reading into checking. Consulted last, it confirms or corrects an understanding you actually built — and that is the difference between decoding Latin and reading it.</p><div class=\"pitfall\"><b>Common mistakes</b><ul><li>Scanning by English stress instead of by quantity.</li><li>Forgetting to elide, and concluding the line is unmetrical.</li><li>Treating hyperbaton as an error or a corruption.</li><li>Reaching for the translation at the first difficulty. Give it three real attempts first.</li></ul></div><div class=\"worked\"><b>Worked line</b><p class=\"wl\" lang=\"la\">vī superum saevae memorem Iūnōnis ob īram</p><table class=\"gr\"><tr><th>Word</th><th>Form</th><th>Belongs to</th></tr><tr><td lang=\"la\">vī</td><td>abl. sg.</td><td>ablative of cause: by the power</td></tr><tr><td lang=\"la\">superum</td><td>gen. pl. (for <i>superōrum</i>)</td><td>of the gods above — with <b>vī</b></td></tr><tr><td lang=\"la\">saevae</td><td>gen. sg. f.</td><td><b>Iūnōnis</b>, two words later</td></tr><tr><td lang=\"la\">memorem</td><td>acc. sg. f.</td><td><b>īram</b>, at the line&#39;s end</td></tr><tr><td lang=\"la\">Iūnōnis</td><td>gen. sg.</td><td>depends on <b>īram</b></td></tr><tr><td lang=\"la\">ob īram</td><td>acc. after <b>ob</b></td><td>because of the anger</td></tr></table><p><b>Sense:</b> by the power of the gods above, because of the unforgetting anger of cruel Juno. Two pairs interlock — <b>saevae … Iūnōnis</b> and <b>memorem … īram</b> — and nothing but the endings tells you which adjective goes with which noun. This is Vergil&#39;s normal practice, and it is line 4 of the <i>Aeneid</i>.</p></div>","examples":[["Arma virumque canō.","I sing of arms and the man."],["Carpe diem.","Seize the day."],["Omnia vincit Amor.","Love conquers all things."],["Sunt lacrimae rērum.","There are tears for things / the world’s suffering has tears."]],"vocab":[["hexameter","hexameter"],["dactylus","dactyl"],["spondēus","spondee"],["elīsiō","elision"],["caesūra","caesura"],["quantitās","quantity"],["versus","verse / line"],["carmen","poem / song"],["poēta","poet"],["canō","sing"],["lacrimae","tears"],["rēs","thing / circumstance"]],"exercises":[{"t":"mcq","q":"A dactyl is:","opts":["— ⏑ ⏑","— — only","⏑ ⏑ ⏑","x x"],"a":0,"ex":"A dactyl is one long followed by two shorts. The hexameter line has six feet, with a spondee — two longs — freely substituted in the first four."},{"t":"fill","q":"Seize the day: ___ diem.","a":["Carpe"],"ex":"<b>Carpe</b> is the imperative of <b>carpō</b>, literally to pluck. Horace's metaphor is agricultural rather than military."},{"t":"mcq","q":"The final translation should normally be revealed:","opts":["after attempting the Latin","before looking at the Latin","instead of reading","automatically"],"a":0,"ex":"Attempt the Latin first, then use glosses, then notes, and only then the translation. Reaching for the translation first turns reading into checking."},{"t":"fill","q":"Love conquers all things: Omnia vincit ___.","a":["Amor"],"ex":"<b>Omnia vincit Amor</b>, Vergil, <i>Eclogues</i> 10.69. <b>Omnia</b> is neuter accusative plural, the object, and <b>Amor</b> the nominative subject in final position."},{"t":"mcq","q":"Poetry often has:","opts":["freer word order and elision","no case endings","only present tense","no subordinate clauses"],"a":0,"ex":"Poetic word order serves metre and emphasis, and elision drops a final vowel before a following vowel. Endings, not position, remain your guide."},{"t":"fill","q":"I sing of arms and the man: Arma virumque ___.","a":["canō"],"ex":"<b>canō</b> is present, not future: the poet declares what he is doing now. It opens the <i>Aeneid</i>, which you can read in the Reading Room."},{"t":"parse","form":"Arma virumque canō","q":"Scan the first foot:","opts":["dactyl (— ⏑ ⏑)","spondee (— —)","trochee (— ⏑)","iamb (⏑ —)"],"a":0,"ex":"<b>Ār-ma vi-</b> — long, short, short. Vergil opens on a dactyl, which is what gives the line its forward drive."},{"t":"parse","form":"multum ille et terris","q":"What happens metrically at <b>multum ille</b>?","opts":["elision — the -um is not pronounced","nothing","a caesura","a spondee is forbidden"],"a":0,"ex":"A final vowel or <b>-m</b> before a word beginning with a vowel or <b>h</b> is elided. You must elide when scanning or the line will not resolve."},{"t":"trans","form":"Omnia vincit Amor.","q":"Give the subject:","a":["Amor","amor"],"ex":"<b>Amor</b> is nominative and stands last for emphasis; <b>Omnia</b> is neuter accusative plural. Position is rhetoric, not grammar."},{"t":"trans","form":"Carpe diem.","q":"Put the imperative into the plural:","a":["Carpite diem","carpite diem"],"ex":"<b>Carpite</b>. Third-conjugation imperatives are <b>-e</b> singular and <b>-ite</b> plural; <b>dīc, dūc, fac, fer</b> are the four irregulars."},{"t":"pick","s":"Vīvāmus, mea Lesbia, atque amēmus.","q":"Click the vocative.","a":"Lesbia","ex":"<b>mea Lesbia</b> is direct address, set between the two subjunctives. In the first declension the vocative is identical to the nominative."},{"t":"pick","s":"Tītyre, tū patulae recubāns sub tegmine fāgī.","q":"Click the present participle.","a":"recubāns","ex":"<b>recubāns</b> agrees with <b>tū</b>. Note the hyperbaton: <b>patulae ... fāgī</b> frames the line with three words in between."},{"t":"mcq","q":"In the dactylic hexameter, the fifth and sixth feet are normally:","opts":["a dactyl, then — x with an anceps final syllable","two full spondees","two dactyls","freely either, like the first four feet"],"a":0,"ex":"The fifth foot is normally a dactyl; a spondaic fifth foot is rare and deliberately weighty. The sixth is <b>— x</b>: the final syllable is <i>anceps</i> and counts as long whatever its own quantity, because the line-end pause makes up the weight. Calling it a spondee is a useful shorthand, not the rule."},{"t":"mcq","q":"When should you finally read the printed translation?","opts":["after the Latin, the glosses and the notes have all been tried","before starting","instead of the Latin","alongside every line"],"a":0,"ex":"Used first, a translation replaces reading with checking. Used last, it confirms or corrects an understanding you actually built."},{"t":"fill","q":"Happy is he who could learn the causes of things: Fēlīx quī potuit rērum cognōscere ___.","a":["causās","causas"],"ex":"Vergil, <i>Georgics</i> 2.490. <b>causās</b> is the accusative object of <b>cognōscere</b>, held back to the line's end."},{"t":"fill","q":"Vowel length in poetry determines:","a":["metre","the metre","quantity","scansion"],"ex":"Latin verse is quantitative, built on long and short syllables rather than stress. This is why macrons are not decoration but the substance of the metre."}]}]}];

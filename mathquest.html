<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quest 🚀</title>
<style>
:root{
  --bg1:#c7e9ff; --bg2:#e8d5ff;
  --ink:#2d2a4a; --ink-soft:#6b6890;
  --card:#ffffff;
  --accent:#7c4dff; --accent2:#ff6d9d; --gold:#ffb300;
  --good:#2eb872; --bad:#ff5964;
  --radius:22px;
  --shadow:0 6px 20px rgba(60,40,120,.13);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 60%,#ffe3ec 100%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  font-size:17px;
}
h1,h2,h3,.fun{font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Segoe UI",cursive;}
#app{max-width:920px;margin:0 auto;padding:12px 14px 80px;}
button{font-family:inherit;font-size:1em;cursor:pointer;border:none;}
input,select{font-family:inherit;font-size:1em;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border-radius:var(--radius);
  padding:10px 16px;margin:10px 0 16px;box-shadow:var(--shadow);
}
.topbar .avatar{font-size:2rem;line-height:1;cursor:pointer;}
.topbar .who{display:flex;flex-direction:column;min-width:90px;}
.topbar .who b{font-size:1.02rem;}
.topbar .who span{font-size:.78rem;color:var(--ink-soft);}
.xpwrap{flex:1;min-width:140px;}
.xpbar{height:14px;background:#eee8ff;border-radius:9px;overflow:hidden;}
.xpbar>div{height:100%;background:linear-gradient(90deg,#7c4dff,#b388ff);border-radius:9px;transition:width .6s ease;}
.xpwrap small{color:var(--ink-soft);font-size:.75rem;}
.chip{
  background:#fff4d6;border-radius:999px;padding:6px 12px;font-weight:700;
  font-size:.92rem;white-space:nowrap;box-shadow:inset 0 0 0 2px #ffe3a1;
}
.chip.purple{background:#efe8ff;box-shadow:inset 0 0 0 2px #d6c6ff;}
.iconbtn{
  background:#f1eefe;border-radius:14px;padding:8px 11px;font-size:1.15rem;
  transition:transform .12s;box-shadow:var(--shadow);
}
.iconbtn:hover{transform:scale(1.08);}

/* ---------- Cards & buttons ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
.btn{
  display:inline-block;background:linear-gradient(135deg,#7c4dff,#9b6bff);color:#fff;
  padding:12px 26px;border-radius:999px;font-weight:700;font-size:1.05rem;
  box-shadow:0 4px 14px rgba(124,77,255,.35);transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-2px) scale(1.02);}
.btn:active{transform:scale(.97);}
.btn.pink{background:linear-gradient(135deg,#ff6d9d,#ff8fb3);box-shadow:0 4px 14px rgba(255,109,157,.35);}
.btn.green{background:linear-gradient(135deg,#2eb872,#4fd394);box-shadow:0 4px 14px rgba(46,184,114,.35);}
.btn.ghost{background:#f1eefe;color:var(--accent);box-shadow:none;}
.btn.small{padding:8px 16px;font-size:.92rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.backrow{margin:2px 0 12px;}
.backrow .btn{font-size:.9rem;padding:8px 18px;}

/* ---------- World map ---------- */
.hero{text-align:center;padding:8px 0 4px;}
.hero h1{font-size:2rem;margin:.2em 0;}
.hero p{color:var(--ink-soft);margin:.2em 0 .8em;}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.world{
  border-radius:var(--radius);padding:18px;color:#fff;position:relative;overflow:hidden;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;min-height:120px;
  display:flex;flex-direction:column;justify-content:space-between;border:none;text-align:left;
}
.world:hover{transform:translateY(-3px) scale(1.015);}
.world .wemoji{font-size:2.2rem;position:absolute;top:12px;right:14px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
.world h3{margin:0 0 4px;font-size:1.22rem;text-shadow:0 1px 2px rgba(0,0,0,.18);}
.world .wdesc{font-size:.83rem;opacity:.94;margin-bottom:10px;max-width:85%;}
.world .wprog{background:rgba(255,255,255,.3);height:10px;border-radius:6px;overflow:hidden;}
.world .wprog>div{background:#fff;height:100%;border-radius:6px;}
.world .wmeta{font-size:.78rem;margin-top:5px;opacity:.95;font-weight:700;}
.world.locked{filter:grayscale(.75) brightness(.82);cursor:not-allowed;}
.world.locked:hover{transform:none;}
.world .lockico{position:absolute;bottom:12px;right:14px;font-size:1.5rem;}

/* ---------- Topic list ---------- */
.topics{display:flex;flex-direction:column;gap:10px;}
.topic{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .13s;border:none;text-align:left;width:100%;font-size:1em;color:var(--ink);
}
.topic:hover{transform:translateX(4px);}
.topic .temoji{font-size:1.7rem;}
.topic .tinfo{flex:1;}
.topic .tinfo b{display:block;font-size:1.05rem;}
.topic .tinfo span{font-size:.8rem;color:var(--ink-soft);}
.topic .stars{font-size:1.05rem;letter-spacing:2px;white-space:nowrap;}
.topic.locked{opacity:.55;cursor:not-allowed;}
.topic.locked:hover{transform:none;}

/* ---------- Topic screen / tabs ---------- */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab{
  flex:1;min-width:100px;background:#ffffffb0;border-radius:16px;padding:10px 6px;text-align:center;
  font-weight:700;color:var(--ink-soft);transition:all .15s;font-size:.98rem;
}
.tab.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px);}

/* ---------- Lesson ---------- */
.lesson h2{margin-top:0;color:var(--accent);}
.lesson p{line-height:1.65;}
.lesson .big{font-size:1.35rem;}
.speech{
  background:#f3edff;border-radius:16px;padding:12px 16px;margin:12px 0;
  border-left:6px solid var(--accent);line-height:1.6;
}
.speech.pink{background:#ffeef4;border-left-color:var(--accent2);}
.speech.gold{background:#fff7e0;border-left-color:var(--gold);}
.speech.green{background:#e8f9f0;border-left-color:var(--good);}
.exbox{
  background:#f8f7ff;border:2px dashed #c9bcff;border-radius:16px;
  padding:12px 16px;margin:12px 0;font-size:1.05rem;line-height:1.7;
}
.lessonnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;}
.dots{display:flex;gap:6px;}
.dots span{width:10px;height:10px;border-radius:50%;background:#ddd4f8;}
.dots span.on{background:var(--accent);}
.bigmath{font-size:1.5rem;text-align:center;margin:14px 0;font-weight:700;letter-spacing:1px;}

/* ---------- Place value table & math visuals ---------- */
.pvtable{border-collapse:collapse;margin:10px auto;width:auto;}
.pvtable th{background:var(--accent);color:#fff;padding:7px 10px;font-size:.75rem;border-radius:6px 6px 0 0;border:2px solid #fff;}
.pvtable td{
  border:2px solid #e3dcff;padding:8px 14px;text-align:center;font-size:1.35rem;font-weight:700;background:#faf8ff;
}
.pvtable td.hl{background:#fff1c9;color:#b07400;}
.fracbar{display:flex;height:44px;border-radius:12px;overflow:hidden;border:3px solid var(--ink);margin:10px auto;max-width:340px;}
.fracbar>div{flex:1;border-right:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;}
.fracbar>div:last-child{border-right:none;}
.fracbar .fill{background:#ffd166;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-weight:700;line-height:1.15;}
.frac span:first-child{border-bottom:2.5px solid currentColor;padding:0 7px;}
.frac span:last-child{padding:0 7px;}
.gridbox{display:inline-grid;gap:2px;margin:8px;}
.gridbox i{width:26px;height:26px;background:#f0ecff;border:1.5px solid #b9a8f5;border-radius:4px;display:block;}
.gridbox i.on{background:#7c4dff;border-color:#5f35d8;}

/* ---------- Practice / quiz ---------- */
.qcard{text-align:center;}
.qtext{font-size:1.3rem;line-height:1.65;margin:6px 0 18px;font-weight:600;}
.qtext .small{font-size:.95rem;color:var(--ink-soft);font-weight:400;}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;max-width:560px;margin:0 auto;}
.choice{
  background:#f5f2ff;border:3px solid #ddd2ff;border-radius:16px;padding:14px 10px;
  font-size:1.15rem;font-weight:700;color:var(--ink);transition:all .12s;
}
.choice:hover{border-color:var(--accent);transform:scale(1.03);}
.choice.correct{background:#d9f7e7;border-color:var(--good);color:#14683f;}
.choice.wrong{background:#ffe1e3;border-color:var(--bad);color:#a1232c;animation:shake .35s;}
.choice:disabled{cursor:default;transform:none;}
.answerrow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0;}
.answerrow input{
  font-size:1.35rem;padding:10px 14px;border-radius:14px;border:3px solid #ddd2ff;
  width:170px;text-align:center;font-weight:700;color:var(--ink);outline:none;
}
.answerrow input:focus{border-color:var(--accent);}
.answerrow input.correct{border-color:var(--good);background:#d9f7e7;}
.answerrow input.wrong{border-color:var(--bad);background:#ffe1e3;animation:shake .35s;}
.feedback{min-height:34px;font-weight:700;font-size:1.1rem;margin:10px 0 4px;}
.feedback .exp{font-weight:400;font-size:.95rem;color:var(--ink-soft);display:block;margin-top:6px;line-height:1.55;}
.hintbox{
  background:#fff7e0;border-radius:14px;padding:10px 16px;margin:10px auto;max-width:560px;
  font-size:.95rem;line-height:1.55;border:2px solid #ffe3a1;text-align:left;
}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.qmeta .streakfire{font-weight:800;color:#e65100;font-size:1.05rem;}
.progressdots{display:flex;gap:5px;flex-wrap:wrap;}
.progressdots span{width:13px;height:13px;border-radius:50%;background:#e2daf8;}
.progressdots span.ok{background:var(--good);}
.progressdots span.no{background:var(--bad);}
.progressdots span.cur{background:var(--gold);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Results ---------- */
.results{text-align:center;padding:10px 0;}
.results .bigstars{font-size:3rem;letter-spacing:6px;margin:10px 0;}
.results h2{margin:.3em 0;}
.results .scoreline{font-size:1.2rem;margin:8px 0;}

/* ---------- Badges ---------- */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.badge{
  background:var(--card);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);
}
.badge .bico{font-size:2.3rem;}
.badge b{display:block;font-size:.92rem;margin-top:6px;}
.badge span{font-size:.75rem;color:var(--ink-soft);display:block;margin-top:3px;line-height:1.4;}
.badge.off{opacity:.38;filter:grayscale(1);}

/* ---------- Parent corner ---------- */
.ptable{width:100%;border-collapse:collapse;font-size:.9rem;}
.ptable th{background:#efe9ff;padding:8px;text-align:left;position:sticky;top:0;}
.ptable td{padding:7px 8px;border-bottom:1px solid #eee;}
.ptable tr:hover td{background:#faf8ff;}
.minibar{background:#eee;border-radius:5px;height:9px;width:90px;overflow:hidden;display:inline-block;vertical-align:middle;}
.minibar>div{height:100%;background:var(--good);border-radius:5px;}
.statrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.stat{background:var(--card);border-radius:16px;padding:12px 20px;box-shadow:var(--shadow);text-align:center;flex:1;min-width:110px;}
.stat b{font-size:1.5rem;display:block;color:var(--accent);}
.stat span{font-size:.78rem;color:var(--ink-soft);}

/* ---------- Modal / overlays ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(45,42,74,.45);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:16px;
}
.modal{background:var(--card);border-radius:24px;padding:26px;max-width:460px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:88vh;overflow:auto;}
.modal h2{margin-top:0;}
.avatarpick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.avatarpick button{font-size:1.7rem;background:#f4f1ff;border-radius:14px;padding:8px 10px;transition:transform .1s;border:3px solid transparent;}
.avatarpick button.sel{border-color:var(--accent);background:#e8e0ff;}
.avatarpick button:hover{transform:scale(1.12);}
.nameinput{width:100%;padding:12px 14px;border-radius:14px;border:3px solid #ddd2ff;font-size:1.1rem;margin:6px 0 14px;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:99;}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:999px;font-weight:700;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);
  animation:toastin .3s ease;font-size:.95rem;max-width:90vw;text-align:center;
}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.clockface{display:block;margin:6px auto;}
.anglesvg{display:block;margin:6px auto;}
.pictorow{font-size:1.5rem;letter-spacing:3px;}
.bargraph{display:flex;align-items:flex-end;gap:18px;justify-content:center;height:170px;margin:12px 0 4px;}
.bargraph .bar{width:52px;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;padding-top:4px;}
.bargraph-labels{display:flex;gap:18px;justify-content:center;font-size:.85rem;font-weight:700;}
.bargraph-labels span{width:52px;text-align:center;}
.tallybox{font-family:monospace;font-size:1.3rem;letter-spacing:1px;}

.footer-note{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:30px;}
@media (max-width:520px){
  .qtext{font-size:1.12rem;}
  .hero h1{font-size:1.5rem;}
  .topbar .who{min-width:70px;}
  .pvtable th{padding:4px 5px;font-size:.58rem;}
  .pvtable td{padding:5px 8px;font-size:1.05rem;}
  .lesson{overflow-x:auto;}
  .exbox{overflow-x:auto;}
  .qtext{overflow-x:auto;}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app"></div>
<script>
'use strict';
/* ================= UTILITIES ================= */
const $ = sel => document.querySelector(sel);
const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[ri(0,arr.length-1)];
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmtIN(n){ return Number(n).toLocaleString('en-IN'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a||1; }
function frac(n,d){ return `<span class="frac"><span>${n}</span><span>${d}</span></span>`; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Build MC choices: correct answer + unique distractors
function mkChoices(answer, distractors){
  const seen = new Set([String(answer)]);
  const out = [answer];
  for(const d of distractors){
    if(!seen.has(String(d))){ seen.add(String(d)); out.push(d); }
    if(out.length>=4) break;
  }
  return shuffle(out);
}
function normAns(s){
  return String(s).trim().toLowerCase().replace(/[,\s]/g,'').replace(/^₹/,'').replace(/^rs\.?/,'');
}
function answersMatch(user, q){
  const u = normAns(user);
  if(u==='') return false;
  const cands = [q.answer].concat(q.alt||[]);
  return cands.some(c => normAns(c)===u);
}

/* ================= STATE & STORAGE ================= */
const SAVE_KEY = 'mathquest_save_v1';
let state = null;
let storageOK = true;

function freshState(){
  return {
    version:1,
    profile:{ name:'', avatar:'🦄' },
    xp:0,
    bestStreak:0,
    deep:{c:0,t:0},
    daily:{ last:'', days:0, best:0 },
    topics:{},   // tid -> {stars,best,attempts,pc,pt}  pc/pt = practice correct/total
    badges:{},   // id -> dateStr
    log:{},      // dateStr -> {xp,c,t}  (correct answers, total answered)
    settings:{ sound:true, unlockAll:false },
    created: new Date().toISOString()
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ state = sanitizeSave(JSON.parse(raw)); return; }
  }catch(e){ if(!(e instanceof SyntaxError) && e.name!=='BadSave') storageOK = false; state = freshState(); return; }
  state = freshState();
}
/* Rebuild a save field-by-field with type checks — never trust imported JSON. */
function sanitizeSave(data){
  const bad = () => { const e=new Error('bad save'); e.name='BadSave'; throw e; };
  if(!data || typeof data!=='object' || typeof data.xp!=='number' || !data.topics || typeof data.topics!=='object') bad();
  const num = (v,max)=> (typeof v==='number' && isFinite(v) && v>0)? Math.min(max, Math.floor(v)) : 0;
  const s = freshState();
  s.xp = num(data.xp, 99999999);
  s.bestStreak = num(data.bestStreak, 999999);
  const p = (data.profile && typeof data.profile==='object')? data.profile : {};
  s.profile.name = typeof p.name==='string'? p.name.slice(0,20) : '';
  s.profile.avatar = AVATARS.includes(p.avatar)? p.avatar : '🦄';
  const d = (data.daily && typeof data.daily==='object')? data.daily : {};
  s.daily = { last: (typeof d.last==='string'? d.last:'').replace(/[^0-9-]/g,'').slice(0,10),
              days: num(d.days,99999), best: num(d.best,99999) };
  const dp = (data.deep && typeof data.deep==='object')? data.deep : {};
  s.deep = { c:num(dp.c,9999999), t:num(dp.t,9999999) };
  Object.keys(data.topics).forEach(k=>{
    if(!/^w\d{1,2}t\d{1,2}$/.test(k)) return;
    const v = (data.topics[k] && typeof data.topics[k]==='object')? data.topics[k] : {};
    s.topics[k] = { stars:num(v.stars,3), best:num(v.best,QUIZ_LEN), attempts:num(v.attempts,999999),
                    pc:num(v.pc,9999999), pt:num(v.pt,9999999) };
  });
  if(data.badges && typeof data.badges==='object')
    BADGES.forEach(b=>{ if(data.badges[b.id]) s.badges[b.id] = String(data.badges[b.id]).replace(/[^0-9-]/g,'').slice(0,10); });
  if(data.log && typeof data.log==='object') Object.keys(data.log).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const v = (data.log[k] && typeof data.log[k]==='object')? data.log[k] : {};
    s.log[k] = { xp:num(v.xp,9999999), c:num(v.c,9999999), t:num(v.t,9999999) };
  });
  const st = (data.settings && typeof data.settings==='object')? data.settings : {};
  s.settings.sound = st.sound!==false;
  if(typeof data.created==='string') s.created = data.created.slice(0,40);
  return s;
}
function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; }
}
function topicStat(tid){
  if(!state.topics[tid]) state.topics[tid] = {stars:0,best:0,attempts:0,pc:0,pt:0};
  return state.topics[tid];
}
function exportSave(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const name = (state.profile.name||'player').replace(/[^a-z0-9]/gi,'_');
  a.download = `mathquest_${name}_${todayStr()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('💾 Progress file downloaded! Keep it safe.');
}
function importSave(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      state = sanitizeSave(data);
      saveState(); render();
      toast('✅ Progress loaded — welcome back, '+(state.profile.name||'friend')+'!');
    }catch(e){ toast('❌ That file does not look like a Math Quest save.'); }
  };
  r.readAsText(file);
}

/* ================= XP / LEVELS ================= */
function levelInfo(xp){
  let level=1, need=150, floor=0;
  while(xp >= floor+need){ floor+=need; level++; need=150+(level-1)*60; }
  return {level, into:xp-floor, need, pct:Math.min(100,Math.round((xp-floor)/need*100))};
}
const LEVEL_TITLES = ['Explorer','Adventurer','Puzzle Solver','Number Ninja','Math Wizard','Brainiac','Math Champion','Grand Master','Math Legend'];
function levelTitle(l){ return LEVEL_TITLES[Math.min(LEVEL_TITLES.length-1, Math.floor((l-1)/2))]; }

function addXP(n){
  const before = levelInfo(state.xp).level;
  state.xp += n;
  const after = levelInfo(state.xp).level;
  const d = todayStr();
  if(!state.log[d]) state.log[d]={xp:0,c:0,t:0};
  state.log[d].xp += n;
  if(after>before){
    setTimeout(()=>{ bigConfetti(); toast(`🎉 LEVEL UP! You are now Level ${after} — ${levelTitle(after)}!`); playSound('level'); }, 350);
  }
  touchDaily();
  saveState();
}
function recordAnswer(tid, correct, isQuiz){
  const t = topicStat(tid);
  const d = todayStr();
  if(!state.log[d]) state.log[d]={xp:0,c:0,t:0};
  state.log[d].t++; if(correct) state.log[d].c++;
  if(!isQuiz){ t.pt++; if(correct) t.pc++; }
  touchDaily(); // practising counts for the daily streak even when answers are wrong
  saveState();
}
function touchDaily(){
  const d = todayStr();
  if(state.daily.last === d) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  state.daily.days = (state.daily.last===yStr) ? state.daily.days+1 : 1;
  state.daily.last = d;
  state.daily.best = Math.max(state.daily.best, state.daily.days);
}

function checkBadges(ctx){
  const earned = [];
  const has = id => !!state.badges[id];
  const give = id => { state.badges[id]=todayStr(); earned.push(BADGES.find(b=>b.id===id)); };
  if(!has('first') && ctx.correct) give('first');
  if(!has('streak5') && ctx.streak>=5) give('streak5');

  if(!has('streak20') && ctx.streak>=20) give('streak20');
  if(!has('quiz1') && ctx.quizDone) give('quiz1');
  if(!has('deep10') && state.deep && state.deep.c>=10) give('deep10');
  if(!has('deep50') && state.deep && state.deep.c>=50) give('deep50');
  if(!has('perfect') && ctx.perfect) give('perfect');
  if(!has('xp500') && state.xp>=500) give('xp500');
  if(!has('xp2000') && state.xp>=2000) give('xp2000');
  if(!has('days3') && state.daily.days>=3) give('days3');

    const id = 'w'+(i+1);

/* ================= SOUND ================= */
let audioCtx = null;
function playSound(kind){
  if(!state.settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = {
      good:[[523,0,.12],[659,.1,.12],[784,.2,.18]],
      bad:[[220,0,.2],[185,.15,.25]],
      level:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.3]],
      badge:[[659,0,.1],[784,.1,.1],[988,.2,.25]],
      star:[[784,0,.1],[988,.12,.1],[1175,.24,.3]]
    }[kind]||[];
    notes.forEach(([f,t,d])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.001, audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.18, audioCtx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+t+d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+d+.05);
    });
  }catch(e){}
}

/* ================= CONFETTI ================= */
const confettiBits = [];
function spawnConfetti(n, spread){
  const cv = $('#confetti');
  const colors = ['#ff6d9d','#7c4dff','#ffb300','#2eb872','#29b6f6','#ff7043'];
  for(let i=0;i<n;i++){
    confettiBits.push({
      x: cv.width/2 + (Math.random()-0.5)*spread, y: cv.height*0.35,
      vx:(Math.random()-.5)*11, vy:-Math.random()*9-3,
      s:Math.random()*7+4, c:pick(colors), r:Math.random()*6.28, vr:(Math.random()-.5)*.3, life:110
    });
  }
}
function bigConfetti(){ spawnConfetti(120, $('#confetti').width); }
function confettiLoop(){
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  if(cv.width!==innerWidth||cv.height!==innerHeight){ cv.width=innerWidth; cv.height=innerHeight; }
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let i=confettiBits.length-1;i>=0;i--){
    const b = confettiBits[i];
    b.x+=b.vx; b.y+=b.vy; b.vy+=.25; b.r+=b.vr; b.life--;
    if(b.life<=0||b.y>cv.height+20){ confettiBits.splice(i,1); continue; }
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.r);
    ctx.fillStyle=b.c; ctx.globalAlpha=Math.min(1,b.life/30);
    ctx.fillRect(-b.s/2,-b.s/2,b.s,b.s*0.6); ctx.restore();
  }
  requestAnimationFrame(confettiLoop);
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .4s'; }, 2600);
  setTimeout(()=> t.remove(), 3100);
}

  });

function submitPractice(val, chosenIdx){

/* ---------- Quiz ---------- */
const QUIZ_LEN = 10;
function startQuiz(){
  const t = CURRICULUM[view.w].topics[view.t];
  const qs = [];
  let guard = 0;
  const seen = new Set();
  while(qs.length<QUIZ_LEN && guard<200){
    guard++;
    const q = t.gen('quiz');
    const key = q.text.replace(/<[^>]+>/g,'');
    if(seen.has(key)) continue;
    seen.add(key); qs.push(q);
  }
  while(qs.length<QUIZ_LEN) qs.push(t.gen('quiz')); // topic pool exhausted — allow repeats rather than a short quiz
  quiz = { qs, i:0, score:0, answered:false, results:[], done:false };
  render();
}
function quizHTML(t){
  const st = topicStat(t.id);
  if(!quiz){
    return `<div class="card qcard">
      <div style="font-size:3rem;">🏁</div>
      <h2 class="fun">Ready for the ${t.name} quiz?</h2>
      <p style="color:var(--ink-soft);max-width:480px;margin:8px auto 4px;line-height:1.6;">
        ${QUIZ_LEN} questions · no hints · earn stars!<br>
        ⭐ 6+ correct &nbsp; ⭐⭐ 8+ correct &nbsp; ⭐⭐⭐ all ${QUIZ_LEN}!
      </p>
      ${st.attempts? `<p class="small" style="color:var(--ink-soft)">Your best so far: <b>${st.best}/${QUIZ_LEN}</b> · ${starStr(st.stars)}</p>`:''}
      <button class="btn pink" style="font-size:1.15rem;" onclick="startQuiz()">Start Quiz 🚀</button>
    </div>`;
  }
  if(quiz.done) return quizResultsHTML(t);
  const q = quiz.qs[quiz.i];
  let h = `<div class="card qcard">
    <div class="qmeta">
      <b>Question ${quiz.i+1} of ${QUIZ_LEN}</b>
      <div class="progressdots">${quiz.qs.map((_,i)=>{
        if(i<quiz.results.length) return `<span class="${quiz.results[i]?'ok':'no'}"></span>`;
        return `<span class="${i===quiz.i?'cur':''}"></span>`;
      }).join('')}</div>
    </div>
    <div class="qtext">${q.text}</div>`;
  h += answerAreaHTML(q, quiz.answered, 'submitQuiz');
  h += `<div class="feedback" id="feedback"></div><div id="nextrow"></div></div>`;
  return h;
}
function submitQuiz(val, chosenIdx){
  const qz = quiz; if(!qz || qz.answered || qz.done) return;
  const q = qz.qs[qz.i];
  const ok = answersMatch(val, q);
  const t = CURRICULUM[view.w].topics[view.t];
  qz.answered = true; qz.results.push(ok);
  if(q.type==='mc') markMC(q, chosenIdx);
  else { const inp=$('#ansin'); if(inp){ inp.disabled=true; inp.classList.add(ok?'correct':'wrong'); } }
  recordAnswer(t.id, ok, true);
  const fb = $('#feedback');
  if(ok){
    qz.score++; addXP(10); spawnConfetti(18,260); playSound('good');
    fb.innerHTML = `<span style="color:var(--good)">Correct! +10 XP 🎉</span>`;
  }else{
    playSound('bad');
    fb.innerHTML = `<span style="color:var(--bad)">The answer is <u>${q.answerText||q.answer}</u>.</span>`
      + (q.explain? `<span class="exp">${q.explain}</span>`:'');
  }
  const last = qz.i===QUIZ_LEN-1;
  $('#nextrow').innerHTML = `<button class="btn" onclick="nextQuizQ()">${last?'See results 🏆':'Next →'}</button>`;
  const nb = $('#nextrow button'); if(nb) nb.focus();
}
function nextQuizQ(){
  const qz = quiz;
  if(qz.i < QUIZ_LEN-1){ qz.i++; qz.answered=false; render(); return; }
  qz.done = true;
  const t = CURRICULUM[view.w].topics[view.t];
  const st = topicStat(t.id);

/* ---- Static visual helpers used inside questions & lessons ---- */
function fractionBar(n, d){
  let cells='';
  for(let i=0;i<d;i++) cells += `<div class="${i<n?'fill':''}"></div>`;
  return `<div class="fracbar">${cells}</div>`;
}
function fractionPie(n, d, size){
  size = size||110;
  const r = size/2-4, cx=size/2, cy=size/2;
  let paths='';
  for(let i=0;i<d;i++){
    const a0 = (i/d)*2*Math.PI - Math.PI/2;
    const a1 = ((i+1)/d)*2*Math.PI - Math.PI/2;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large = (1/d)>0.5?1:0;
    paths += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z"
      fill="${i<n?'#ffd166':'#ffffff'}" stroke="#2d2a4a" stroke-width="2"/>`;
  }
  return `<svg width="${size}" height="${size}" style="vertical-align:middle;margin:4px;">${paths}</svg>`;
}
function shadedGrid(rows, cols, shaded){
  let cells='';
  for(let i=0;i<rows*cols;i++) cells += `<i class="${i<shaded?'on':''}"></i>`;
  return `<span class="gridbox" style="grid-template-columns:repeat(${cols},26px)">${cells}</span>`;
}
function clockSVG(h, m, size){
  size = size||150;
  const cx=size/2, cy=size/2, r=size/2-6;
  let ticks='';
  for(let i=1;i<=12;i++){
    const a = i/12*2*Math.PI - Math.PI/2;
    const x = cx + (r-15)*Math.cos(a), y = cy + (r-15)*Math.sin(a);
    ticks += `<text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-size="${size*0.1}" font-weight="700" fill="#2d2a4a">${i}</text>`;
  }
  const ha = ((h%12)+m/60)/12*2*Math.PI - Math.PI/2;
  const ma = m/60*2*Math.PI - Math.PI/2;
  const hx = cx + r*0.45*Math.cos(ha), hy = cy + r*0.45*Math.sin(ha);
  const mx = cx + r*0.68*Math.cos(ma), my = cy + r*0.68*Math.sin(ma);
  return `<svg class="clockface" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffbea" stroke="#2d2a4a" stroke-width="4"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#2d2a4a" stroke-width="5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#ff6d9d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#2d2a4a"/>
  </svg>`;
}
function angleSVG(deg, size){
  size = size||150;
  const W = size+40;
  const cx = W/2, cy = size-24, len = W/2-12; // vertex centred so both rays always fit, 0°–180°
  const a = -deg*Math.PI/180;
  const x2 = cx+len*Math.cos(a), y2 = cy+len*Math.sin(a);
  const arcR = 26;
  const ax0 = cx+arcR, ay0 = cy;
  const ax1 = cx+arcR*Math.cos(a), ay1 = cy+arcR*Math.sin(a);
  const large = deg>180?1:0;
  return `<svg class="anglesvg" width="${W}" height="${size}">
    <line x1="${cx}" y1="${cy}" x2="${cx+len}" y2="${cy}" stroke="#2d2a4a" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#7c4dff" stroke-width="4" stroke-linecap="round"/>
    <path d="M${ax0},${ay0} A${arcR},${arcR} 0 ${large} 0 ${ax1.toFixed(1)},${ay1.toFixed(1)}" fill="none" stroke="#ff6d9d" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#2d2a4a"/>
  </svg>`;
}
function barGraphHTML(data, unit){
  const max = Math.max(...data.map(d=>d.v));
  const colors = ['#7c4dff','#ff6d9d','#2eb872','#ffb300','#29b6f6'];

  data.forEach((d,i)=>{
    const hpx = Math.max(22, Math.round(d.v/max*150));
    bars += `<div class="bar" style="height:${hpx}px;background:${colors[i%colors.length]}">${d.v}</div>`;
    labels += `<span>${d.k}</span>`;
  });
  return `<div class="bargraph">${bars}</div><div class="bargraph-labels">${labels}</div>
    <p class="small" style="text-align:center;color:var(--ink-soft);margin:4px 0 0;">(numbers show ${unit||'the count'})</p>`;
}
function tallyHTML(n){

        <div data-widget="placevalue"></div>

/* ---- number to Indian words (for reading practice) ---- */
function numToIndianWords(n){
  const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  function two(x){ return x<20? ones[x] : (tens[Math.floor(x/10)] + (x%10? '-'+ones[x%10]:'')); }
  function three(x){
    const h=Math.floor(x/100), r=x%100;
    return (h? ones[h]+' hundred'+(r?' ':''):'') + (r? two(r):'');
  }
  if(n===0) return 'zero';
  let out='';
  const crore=Math.floor(n/10000000); n%=10000000;
  const lakh=Math.floor(n/100000); n%=100000;
  const th=Math.floor(n/1000); n%=1000;
  if(crore) out += two(crore)+' crore ';
  if(lakh) out += two(lakh)+' lakh ';
  if(th) out += two(th)+' thousand ';
  if(n) out += three(n);
  return out.trim();
}

          explain:`Multiply top and bottom by ${k}: ${n}/${d} = ${good}. (Adding 1 to both does NOT work!)`};
      }
      const base=[[1,2],[1,3],[2,3],[3,4],[2,5]];
      const [n,d]=pick(base); const k=pick([2,3,4]);
      return {type:'input', text:`Simplify to its smallest form — fill in the top: <div class="bigmath">${frac(n*k,d*k)} = ${frac('?',d)}</div>`,
        answer:n, hint:`The bottom was divided by ${k}. Divide the top by ${k} too.`,

    }
  },

  /* ---------- w5t3 Comparing fractions ---------- */
  { id:'w5t3', name:'Comparing Fractions', emoji:'🥊', blurb:'Which piece is bigger? Not always obvious!',

        <p>When denominators are the SAME, the pieces are the same size — so more pieces = bigger fraction:</p>

        <p>When the NUMERATORS are the same, the fraction with the <b>smaller</b> denominator is BIGGER!</p>
        <div class="exbox">${frac(1,3)} &gt; ${frac(1,8)} — cutting a cake into 3 gives big slices; into 8 gives small ones.</div>
        <p style="text-align:center;">${fractionBar(1,3)}${fractionBar(1,8)}</p>
        <div class="speech pink">This trips up a LOT of people. The bigger the bottom, the smaller each piece. Sharing with more friends = smaller share! 🎂</div>`},
      {title:'The half-benchmark 🎯', html:`
        <div class="speech gold">Quick compare trick: is each fraction more or less than a <b>half</b>?<br>

    gen(mode){

          hint:'Same number of pieces — but which pieces are larger? Fewer cuts = bigger pieces!',

      }

      const [n,d,side]=pick(halves);
      return {type:'mc', text:`Is ${frac(n,d)} more or less than <b>a half</b>?`,

    }

  /* ---------- w5t4 Add & subtract like fractions ---------- */
  { id:'w5t4', name:'Adding Fractions', emoji:'🧮', blurb:'Add and subtract fractions with the same bottom',
    lesson:[
      {title:'Adding pieces of the same size ➕', html:`
        <p>When denominators match, the pieces are the same size — so just add the tops!</p>

        <div class="exbox">2${'¼'} means 2 wholes + ${frac(1,4)}</div>
        <div class="speech">Fractions with a top ≥ bottom (like ${frac(7,4)}) are called <b>improper fractions</b> — they are worth one whole or more, so they look "top-heavy"! 🏋️</div>`},

          answer:imp, hint:`(${w} × ${d}) + ${r} = ?`,
          explain:`${w} wholes = ${w*d} ${d==='2'?'halves':'parts'}, plus ${r} more = ${imp}. So ${w} ${r}/${d} = ${imp}/${d}.`};

          explain:`${imp} ÷ ${d} = ${w} remainder ${r} → ${w} wholes and ${r}/${d}.`};
      }
      const d=pick([2,3,4,5]);
      const imp = `${d+ri(1,5)}/${d}`;
      const wrongs = [`${ri(1,d-1)}/${d}`, `${ri(1,2)}/${d+2}`, `${ri(1,d-1)}/${d+3}`].filter(x=>x!==imp);
      return {type:'mc', text:`Which of these is an <b>improper</b> fraction? <span class="small">(worth 1 whole or more)</span>`,
        choices:mkChoices(imp, wrongs), answer:imp,
        hint:'Improper fractions are "top-heavy": the top number is as big as, or bigger than, the bottom.',
        explain:`In ${imp} the top is bigger than the bottom — it is worth more than 1 whole.`};

function permutations(arr){
  if(arr.length<=1) return [arr];
  const out=[];
  arr.forEach((x,i)=>{
    permutations(arr.slice(0,i).concat(arr.slice(i+1))).forEach(p=>out.push([x].concat(p)));
  });
  return out;
}

    return {type:'input', text:`🧠 ${graph}What is the DIFFERENCE between the tallest and the shortest bar?`,
      answer:hi-lo,
      hint:`Find the biggest value and the smallest value first.`,
      explain:`Tallest: ${hi}, shortest: ${lo}. Difference: ${hi} − ${lo} = ${hi-lo}.`};
  }
  const iMax=vals.indexOf(Math.max(...vals));
  let ix=ri(0,3); while(ix===iMax) ix=ri(0,3);
  const k=ri(1,6);
  const beats = vals[ix]+k>vals[iMax];
  return {type:'mc', text:`🧠 ${graph}Imagine <b>${labels[ix]}</b> gets <b>${k} more</b>. Would it then BEAT <b>${labels[iMax]}</b> (the current tallest)?`,
    choices:['Yes','No'], answer: beats?'Yes':'No',
    hint:`Compute the new value: ${vals[ix]} + ${k}. Compare with ${vals[iMax]}.`,
    explain:`${vals[ix]} + ${k} = ${vals[ix]+k}, which is ${beats? 'more than':'not more than'} ${vals[iMax]}. ${beats?'Yes!':'Not quite.'}`};
},
};

window.addEventListener('DOMContentLoaded', () => {

  confettiLoop();
  render();

});

-size:14.5px}table.gr th,table.gr td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}table.gr th{background:var(--surface2)}.tip{border-left:3px solid var(--gold);background:var(--goldsoft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14.5px}.example{padding:9px 0;border-bottom:1px dashed var(--line)}.example .en{display:block;color:var(--muted);font-size:13.5px}.vocab{width:100%;border-collapse:collapse}.vocab td{padding:8px 9px;border-bottom:1px solid var(--line)}.vocab td:first-child{width:44%;font-weight:700;color:var(--accent)}.speak{border:0;background:none;cursor:pointer;padding:2px 5px;border-radius:5px}.speak:hover{background:var(--surface2)}.exercise{border:1px solid var(--line);border-radius:11px;padding:15px 16px;margin:11px 0;background:var(--surface)}.opts{display:grid;gap:7px;margin-top:10px}.opt{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;color:var(--ink);cursor:pointer}.opt:hover{background:var(--surface2)}.opt.correct{border-color:var(--good);background:var(--goodsoft)}.opt.wrong{border-color:var(--bad);background:var(--soft)}.answerrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.answerrow input{flex:1;min-width:190px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink)}.feedback{margin-top:9px;font-size:14px;font-weight:700}.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}.feedback small{display:block;color:var(--ink2);font-weight:400}.orderbank,.orderanswer{display:flex;gap:7px;flex-wrap:wrap;min-height:47px;padding:8px;border:1px dashed var(--line);border-radius:9px;margin-top:9px}.token{border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:6px 9px;cursor:pointer;color:var(--ink)}.pill{display:inline-block;border-radius:99px;background:var(--surface2);padding:2px 9px;font-size:11.5px;color:var(--ink2);font-weight:700}.pill.acc{background:var(--soft);color:var(--accent)}.search{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:14px}.flashstage{max-width:580px;margin:0 auto}.flashcard{min-height:245px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:var(--shadow);cursor:pointer}.flashcard .front{font-size:29px;font-weight:800}.flashcard .back{font-size:20px;color:var(--ink2);margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);width:85%}.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.grades button{padding:10px 4px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:800;cursor:pointer}.grades small{display:block;color:var(--muted);font-weight:400}.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.labgrid label{font-size:12.5px;color:var(--muted)}.labgrid select,.labgrid input{display:block;width:100%;padding:8px 10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}.resultbox{margin-top:15px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);text-align:center}.resultbox .big{font-size:25px;font-weight:800}.matrix{overflow-x:auto}.matrix table{min-width:620px}.banner{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:15px;font-size:13.5px}.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1}.menu{display:none;position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:21px;z-index:70;box-shadow:0 4px 13px rgba(0,0,0,.28)}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:840px){.sidebar{position:fixed;z-index:60;transform:translateX(-105%);transition:.24s;height:100dvh}.sidebar.open{transform:none;box-shadow:0 0 35px rgba(0,0,0,.3)}.menu{display:block}.main{padding:19px 16px 85px;width:100%;max-width:100%;overflow-x:hidden}.grades{grid-template-columns:repeat(2,1fr)}table.gr{display:block;overflow-x:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

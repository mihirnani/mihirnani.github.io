<script>
"use strict";
const COURSE=[{"id":"a1","short":"A1","icon":"🌱","label":"A1 — Foundations","tagline":"Build the sentence","desc":"Pronunciation, core verbs, noun gender, the accusative, questions and modal verbs.","units":[{"id":"a1u1","title":"Hallo! Sounds & greetings","subtitle":"German spelling, greetings and polite first encounters","grammar":"<h3>German spelling is unusually dependable<\/h3>\n<p>Most letters are pronounced, and the same spelling usually gives the same sound. The main combinations are:<\/p>\n<table class=\"gr\"><tr><th>Spelling<\/th><th>Approximate sound<\/th><th>Example<\/th><\/tr>\n<tr><td><b>ei<\/b><\/td><td>“eye”<\/td><td>m<b>ei<\/b>n, dr<b>ei<\/b><\/td><\/tr>\n<tr><td><b>ie<\/b><\/td><td>long “ee”<\/td><td>w<b>ie<\/b>, L<b>ie<\/b>be<\/td><\/tr>\n<tr><td><b>eu / äu<\/b><\/td><td>“oy”<\/td><td>n<b>eu<\/b>, H<b>äu<\/b>ser<\/td><\/tr>\n<tr><td><b>z<\/b><\/td><td>“ts”<\/td><td><b>Z<\/b>eit<\/td><\/tr>\n<tr><td><b>w<\/b><\/td><td>English “v”<\/td><td><b>w<\/b>ir<\/td><\/tr>\n<tr><td><b>v<\/b><\/td><td>often “f”<\/td><td><b>V<\/b>ater<\/td><\/tr>\n<tr><td><b>ch<\/b><\/td><td>soft after front vowels; rough after a/o/u<\/td><td>i<b>ch<\/b>, Bu<b>ch<\/b><\/td><\/tr>\n<tr><td><b>sp / st<\/b> initially<\/td><td>“shp / sht”<\/td><td><b>Sp<\/b>ort, <b>St<\/b>adt<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Capital letters carry information:<\/b> every noun begins with a capital letter: <b>die Sprache<\/b>, <b>das Haus<\/b>, <b>der Mann<\/b>.<\/div>\n<h3>du or Sie?<\/h3><p><b>du<\/b> is informal singular; <b>ihr<\/b> is informal plural; <b>Sie<\/b> is formal singular or plural and is always capitalised. Begin with <b>Sie<\/b> in professional or unfamiliar settings.<\/p>","examples":[["Guten Morgen!","Good morning!"],["Hallo, wie geht es Ihnen?","Hello, how are you? (formal)"],["Mir geht es gut, danke.","I am well, thank you."],["Ich heiße Anna. Freut mich.","My name is Anna. Pleased to meet you."],["Sprechen Sie Englisch?","Do you speak English?"],["Auf Wiedersehen!","Goodbye!"]],"vocab":[["hallo","hello"],["guten Morgen","good morning"],["guten Abend","good evening"],["gute Nacht","good night"],["tschüss","bye"],["auf Wiedersehen","goodbye"],["bitte","please / you’re welcome"],["danke","thank you"],["Entschuldigung","excuse me / sorry"],["ja / nein","yes / no"],["wie geht es dir?","how are you? informal"],["wie geht es Ihnen?","how are you? formal"],["ich heiße …","my name is …"],["freut mich","pleased to meet you"],["bis bald","see you soon"]],"exercises":[{"t":"mcq","q":"<b>ei<\/b> in <i>mein<\/i> sounds like:","opts":["eye","ee","oy","ay"],"a":0,"ex":""},{"t":"mcq","q":"The German letter <b>w<\/b> is usually pronounced like English:","opts":["v","w","f","b"],"a":0,"ex":""},{"t":"mcq","q":"Which pronoun is formal?","opts":["Sie","du","ihr","wir"],"a":0,"ex":""},{"t":"fill","q":"Guten ___! (good morning)","a":["Morgen"],"ex":""},{"t":"fill","q":"Auf ___! (goodbye)","a":["Wiedersehen"],"ex":""},{"t":"tr","q":"Thank you very much.","a":["Danke sehr.","Vielen Dank."],"ex":""},{"t":"order","q":"Arrange: “How are you?” (formal)","tokens":["geht","wie","Ihnen","es"],"a":["Wie","geht","es","Ihnen"],"ex":""},{"t":"mcq","q":"Which words are capitalised in German?","opts":["All nouns","All verbs","Only names","All adjectives"],"a":0,"ex":""}]},{"id":"a1u2","title":"sein, haben & pronouns","subtitle":"The two essential verbs and simple descriptions","grammar":"<h3>Subject pronouns<\/h3><table class=\"gr\"><tr><td><b>ich<\/b> I<\/td><td><b>wir<\/b> we<\/td><\/tr><tr><td><b>du<\/b> you informal<\/td><td><b>ihr<\/b> you informal plural<\/td><\/tr><tr><td><b>er / sie / es<\/b> he / she / it<\/td><td><b>sie / Sie<\/b> they / you formal<\/td><\/tr><\/table>\n<h3>sein — to be<\/h3><table class=\"gr\"><tr><td>ich <b>bin<\/b><\/td><td>wir <b>sind<\/b><\/td><\/tr><tr><td>du <b>bist<\/b><\/td><td>ihr <b>seid<\/b><\/td><\/tr><tr><td>er/sie/es <b>ist<\/b><\/td><td>sie/Sie <b>sind<\/b><\/td><\/tr><\/table>\n<h3>haben — to have<\/h3><table class=\"gr\"><tr><td>ich <b>habe<\/b><\/td><td>wir <b>haben<\/b><\/td><\/tr><tr><td>du <b>hast<\/b><\/td><td>ihr <b>habt<\/b><\/td><\/tr><tr><td>er/sie/es <b>hat<\/b><\/td><td>sie/Sie <b>haben<\/b><\/td><\/tr><\/table>\n<p>Negation normally uses <b>nicht<\/b>: Ich bin <b>nicht<\/b> müde. To negate an indefinite noun, use <b>kein<\/b>: Ich habe <b>kein<\/b> Auto.<\/p>","examples":[["Ich bin aus Indien.","I am from India."],["Sie ist Ärztin.","She is a doctor."],["Wir sind heute müde.","We are tired today."],["Ich habe zwei Kinder.","I have two children."],["Er hat keine Zeit.","He has no time."],["Das ist nicht schwer.","That is not difficult."]],"vocab":[["sein","to be"],["haben","to have"],["müde","tired"],["glücklich","happy"],["krank","ill"],["bereit","ready"],["Zeit","time"],["Arbeit","work"],["Familie","family"],["Freund / Freundin","friend"],["kein / keine","no / not any"],["nicht","not"],["heute","today"],["hier","here"],["dort","there"]],"exercises":[{"t":"fill","q":"Ich ___ müde.","a":["bin"],"ex":""},{"t":"fill","q":"Du ___ Zeit.","a":["hast"],"ex":""},{"t":"mcq","q":"“They are here” is:","opts":["Sie sind hier.","Sie ist hier.","Ihr seid hier.","Wir bin hier."],"a":0,"ex":""},{"t":"mcq","q":"Negate an indefinite noun: Ich habe ___ Auto.","opts":["kein","nicht","keinen nicht","nichts"],"a":0,"ex":""},{"t":"tr","q":"We are ready.","a":["Wir sind bereit."],"ex":""},{"t":"order","q":"Arrange: “She is not ill.”","tokens":["nicht","ist","sie","krank"],"a":["Sie","ist","nicht","krank"],"ex":""},{"t":"fill","q":"Ihr ___ sehr freundlich.","a":["seid"],"ex":""},{"t":"mcq","q":"Formal “you have” is:","opts":["Sie haben","Sie hat","du haben","ihr habe"],"a":0,"ex":""}]},{"id":"a1u3","title":"Present tense & the verb-second rule","subtitle":"Regular verbs, stem changes and German sentence architecture","grammar":"<h3>Regular present tense<\/h3><p>Remove <b>-en<\/b> and add: <b>-e, -st, -t, -en, -t, -en<\/b>.<\/p>\n<table class=\"gr\"><tr><th><\/th><th>lernen<\/th><th>machen<\/th><\/tr><tr><td>ich<\/td><td>lerne<\/td><td>mache<\/td><\/tr><tr><td>du<\/td><td>lernst<\/td><td>machst<\/td><\/tr><tr><td>er/sie/es<\/td><td>lernt<\/td><td>macht<\/td><\/tr><tr><td>wir/Sie/sie<\/td><td>lernen<\/td><td>machen<\/td><\/tr><tr><td>ihr<\/td><td>lernt<\/td><td>macht<\/td><\/tr><\/table>\n<h3>The finite verb occupies position 2<\/h3><p><b>Ich lerne heute Deutsch.<\/b> If another element comes first, the verb remains second and the subject moves: <b>Heute lerne ich Deutsch.<\/b> “Position” means a sentence constituent, not necessarily one word.<\/p>\n<div class=\"tip\"><b>Stem-changing verbs:<\/b> du/er forms may change: fahren → du <b>fährst<\/b>; lesen → du <b>liest<\/b>; sprechen → er <b>spricht<\/b>.<\/div>","examples":[["Ich lerne jeden Tag Deutsch.","I learn German every day."],["Heute arbeitet er zu Hause.","Today he works at home."],["Du sprichst sehr gut Englisch.","You speak English very well."],["Sie liest am Abend.","She reads in the evening."],["Am Wochenende fahren wir nach Berlin.","At the weekend we travel to Berlin."],["Warum kommst du so spät?","Why are you coming so late?"]],"vocab":[["lernen","to learn"],["machen","to do / make"],["arbeiten","to work"],["wohnen","to live / reside"],["kommen","to come"],["gehen","to go"],["fahren","to travel / drive"],["lesen","to read"],["sprechen","to speak"],["schreiben","to write"],["jeden Tag","every day"],["am Wochenende","at the weekend"],["morgens","in the mornings"],["abends","in the evenings"],["spät","late"]],"exercises":[{"t":"fill","q":"Ich ___ Deutsch. (lernen)","a":["lerne"],"ex":""},{"t":"fill","q":"Du ___ ein Buch. (lesen)","a":["liest"],"ex":""},{"t":"mcq","q":"Choose the correct word order.","opts":["Heute arbeitet er zu Hause.","Heute er arbeitet zu Hause.","Heute zu Hause er arbeitet.","Arbeitet heute er zu Hause."],"a":0,"ex":""},{"t":"order","q":"Arrange: “Tomorrow we are going to Munich.”","tokens":["wir","morgen","nach München","fahren"],"a":["Morgen","fahren","wir","nach München"],"ex":""},{"t":"fill","q":"Er ___ Englisch. (sprechen)","a":["spricht"],"ex":""},{"t":"tr","q":"I work at home.","a":["Ich arbeite zu Hause.","Ich arbeite zuhause."],"ex":""},{"t":"mcq","q":"In a statement, the finite verb is normally in:","opts":["position 2","position 1","the final position","any position"],"a":0,"ex":""},{"t":"fill","q":"Ihr ___ viel. (machen)","a":["macht"],"ex":""}]},{"id":"a1u4","title":"Nouns, gender & plurals","subtitle":"Learn every noun as a grammatical package","grammar":"<h3>Three genders<\/h3><p>German nouns are masculine <b>der<\/b>, feminine <b>die<\/b>, or neuter <b>das<\/b>. Gender is not reliably predictable, so learn the article with the noun.<\/p>\n<p>Learn plurals too: <b>der Tisch · die Tische<\/b>; <b>die Stadt · die Städte<\/b>; <b>das Kind · die Kinder<\/b>.<\/p>\n<table class=\"gr\"><tr><th>Useful tendencies<\/th><th>Usually<\/th><th>Examples<\/th><\/tr><tr><td>-ung, -heit, -keit, -schaft, -ion<\/td><td>feminine<\/td><td>die Zeitung, die Freiheit<\/td><\/tr><tr><td>-chen, -lein<\/td><td>neuter<\/td><td>das Mädchen, das Büchlein<\/td><\/tr><tr><td>days, months, seasons<\/td><td>masculine<\/td><td>der Montag, der Sommer<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Plural article:<\/b> all plural nouns use <b>die<\/b> in the nominative and accusative, regardless of singular gender.<\/div>","examples":[["Der Tisch ist neu.","The table is new."],["Die Zeitung ist interessant.","The newspaper is interesting."],["Das Kind spielt.","The child is playing."],["Die Bücher sind teuer.","The books are expensive."],["Das Mädchen kommt aus Wien.","The girl comes from Vienna."],["Die Städte sind groß.","The cities are large."]],"vocab":[["der Mann · Männer","man · men"],["die Frau · Frauen","woman · women"],["das Kind · Kinder","child · children"],["der Tisch · Tische","table · tables"],["die Stadt · Städte","city · cities"],["das Haus · Häuser","house · houses"],["das Buch · Bücher","book · books"],["die Zeitung · Zeitungen","newspaper · newspapers"],["der Tag · Tage","day · days"],["die Sprache · Sprachen","language · languages"],["das Jahr · Jahre","year · years"],["der Sommer · Sommer","summer · summers"],["die Freiheit","freedom"],["das Mädchen · Mädchen","girl · girls"],["neu","new"]],"exercises":[{"t":"mcq","q":"Which is correct?","opts":["das Mädchen","die Mädchen","der Mädchen","den Mädchen"],"a":0,"ex":"The diminutive ending -chen is always neuter."},{"t":"fill","q":"___ Zeitung (the newspaper)","a":["die"],"ex":""},{"t":"fill","q":"___ Haus (the house)","a":["das"],"ex":""},{"t":"mcq","q":"The nominative plural article is:","opts":["die","der","das","den"],"a":0,"ex":""},{"t":"tr","q":"The books are new.","a":["Die Bücher sind neu."],"ex":""},{"t":"mcq","q":"Which ending strongly signals a feminine noun?","opts":["-ung","-chen","-lein","-um"],"a":0,"ex":""},{"t":"fill","q":"der Tisch · die ___","a":["Tische"],"ex":""},{"t":"order","q":"Arrange: “The cities are large.”","tokens":["groß","die Städte","sind"],"a":["Die Städte","sind","groß"],"ex":""}]},{"id":"a1u5","title":"The accusative case","subtitle":"Direct objects and the first visible case change","grammar":"<h3>What the accusative marks<\/h3><p>The accusative usually marks the direct object—the person or thing directly affected by the verb.<\/p>\n<table class=\"gr\"><tr><th><\/th><th>Masculine<\/th><th>Feminine<\/th><th>Neuter<\/th><th>Plural<\/th><\/tr><tr><td>Nominative<\/td><td>der / ein<\/td><td>die / eine<\/td><td>das / ein<\/td><td>die<\/td><\/tr><tr><td>Accusative<\/td><td><b>den / einen<\/b><\/td><td>die / eine<\/td><td>das / ein<\/td><td>die<\/td><\/tr><\/table>\n<p>Only masculine articles visibly change: <b>Der Mann<\/b> sieht <b>den Hund<\/b>. Pronouns change too: ich → <b>mich<\/b>; du → <b>dich<\/b>; er → <b>ihn<\/b>.<\/p>\n<p>Common accusative prepositions: <b>durch, für, gegen, ohne, um<\/b>.<\/p>","examples":[["Ich sehe den Mann.","I see the man."],["Sie kauft einen Kaffee.","She buys a coffee."],["Wir besuchen unsere Freunde.","We visit our friends."],["Das Geschenk ist für dich.","The present is for you."],["Er geht ohne seinen Mantel.","He goes without his coat."],["Kennst du ihn?","Do you know him?"]],"vocab":[["sehen","to see"],["kaufen","to buy"],["brauchen","to need"],["besuchen","to visit"],["finden","to find"],["kennen","to know / be acquainted with"],["der Hund","dog"],["der Kaffee","coffee"],["der Mantel","coat"],["das Geschenk","gift"],["für","for + accusative"],["ohne","without + accusative"],["durch","through + accusative"],["mich / dich","me / you"],["ihn / sie / es","him / her / it"]],"exercises":[{"t":"fill","q":"Ich sehe ___ Mann. (the)","a":["den"],"ex":""},{"t":"fill","q":"Sie kauft ___ Kaffee. (a)","a":["einen"],"ex":""},{"t":"mcq","q":"Which preposition always takes the accusative?","opts":["für","mit","bei","aus"],"a":0,"ex":""},{"t":"tr","q":"Do you know him?","a":["Kennst du ihn?"],"ex":""},{"t":"mcq","q":"Direct object pronoun for <i>du<\/i>:","opts":["dich","dir","dein","du"],"a":0,"ex":""},{"t":"order","q":"Arrange: “The present is for you.”","tokens":["für dich","ist","das Geschenk"],"a":["Das Geschenk","ist","für dich"],"ex":""},{"t":"fill","q":"Wir besuchen ___ Freunde. (our)","a":["unsere"],"ex":""},{"t":"mcq","q":"Which article changes visibly in the accusative?","opts":["masculine","feminine","neuter","plural only"],"a":0,"ex":""}]},{"id":"a1u6","title":"Questions, modals & time","subtitle":"Ask for information and express ability, obligation and desire","grammar":"<h3>Questions<\/h3><p>Yes/no questions put the finite verb first: <b>Kommst du morgen?<\/b> W-questions begin with the question word, followed by the verb: <b>Wann kommst du?<\/b><\/p>\n<h3>Modal verbs<\/h3><p>The modal is conjugated in position 2; the other verb goes to the end as an infinitive: <b>Ich kann heute nicht kommen.<\/b><\/p>\n<table class=\"gr\"><tr><th>Modal<\/th><th>Meaning<\/th><th>ich / er<\/th><\/tr><tr><td>können<\/td><td>can<\/td><td>kann<\/td><\/tr><tr><td>müssen<\/td><td>must<\/td><td>muss<\/td><\/tr><tr><td>wollen<\/td><td>want<\/td><td>will<\/td><\/tr><tr><td>dürfen<\/td><td>may / be allowed<\/td><td>darf<\/td><\/tr><tr><td>sollen<\/td><td>should / be supposed to<\/td><td>soll<\/td><\/tr><tr><td>mögen / möchten<\/td><td>like / would like<\/td><td>mag / möchte<\/td><\/tr><\/table>","examples":[["Wann beginnt der Film?","When does the film begin?"],["Kannst du mir helfen?","Can you help me?"],["Ich muss morgen arbeiten.","I must work tomorrow."],["Wir möchten zwei Karten.","We would like two tickets."],["Darf ich hier sitzen?","May I sit here?"],["Um wie viel Uhr kommst du?","At what time are you coming?"]],"vocab":[["wer / was","who / what"],["wo / wohin / woher","where / where to / where from"],["wann / warum / wie","when / why / how"],["können","can / be able"],["müssen","must / have to"],["wollen","to want"],["dürfen","may / be allowed"],["sollen","should / be supposed to"],["möchten","would like"],["beginnen","to begin"],["helfen","to help"],["die Uhr","clock / o’clock"],["halb drei","half past two"],["Viertel nach drei","quarter past three"],["Viertel vor drei","quarter to three"]],"exercises":[{"t":"order","q":"Arrange: “I can come tomorrow.”","tokens":["morgen","ich","kommen","kann"],"a":["Ich","kann","morgen","kommen"],"ex":""},{"t":"mcq","q":"In a yes/no question, the finite verb is normally:","opts":["first","second","last","omitted"],"a":0,"ex":""},{"t":"fill","q":"Ich ___ arbeiten. (must)","a":["muss"],"ex":""},{"t":"fill","q":"Wir ___ zwei Kaffee. (would like)","a":["möchten"],"ex":""},{"t":"tr","q":"When does the film begin?","a":["Wann beginnt der Film?"],"ex":""},{"t":"mcq","q":"“half past two” in standard German is:","opts":["halb drei","halb zwei","zwei halb","dreißig nach zwei"],"a":0,"ex":""},{"t":"order","q":"Arrange: “May I sit here?”","tokens":["ich","hier","darf","sitzen"],"a":["Darf","ich","hier","sitzen"],"ex":""},{"t":"fill","q":"Warum ___ du nicht kommen? (can)","a":["kannst"],"ex":""}]}]},{"id":"a2","short":"A2","icon":"🧭","label":"A2 — Everyday structure","tagline":"Cases in motion","desc":"Dative relationships, two-way prepositions, the perfect tense, separable verbs and adjective endings.","units":[{"id":"a2u1","title":"The dative case","subtitle":"Recipients, locations and fixed dative prepositions","grammar":"<h3>The dative marks an indirect relationship<\/h3><p>It often identifies the recipient: Ich gebe <b>dem Kind<\/b> das Buch. It is also required after certain verbs and prepositions.<\/p>\n<table class=\"gr\"><tr><th><\/th><th>Masc.<\/th><th>Fem.<\/th><th>Neut.<\/th><th>Plural<\/th><\/tr><tr><td>Definite<\/td><td><b>dem<\/b><\/td><td><b>der<\/b><\/td><td><b>dem<\/b><\/td><td><b>den + -n<\/b><\/td><\/tr><tr><td>Indefinite<\/td><td>einem<\/td><td>einer<\/td><td>einem<\/td><td>—<\/td><\/tr><\/table>\n<p>Dative pronouns: mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen.<\/p>\n<p>Always dative: <b>aus, außer, bei, mit, nach, seit, von, zu, gegenüber<\/b>.<\/p>","examples":[["Ich gebe dem Kind ein Buch.","I give the child a book."],["Kannst du mir helfen?","Can you help me?"],["Wir fahren mit dem Zug.","We travel by train."],["Sie wohnt bei ihren Eltern.","She lives with her parents."],["Nach der Arbeit gehe ich nach Hause.","After work I go home."],["Ich spreche mit den Kindern.","I speak with the children."]],"vocab":[["geben","to give"],["helfen + Dat.","to help"],["danken + Dat.","to thank"],["gefallen + Dat.","to please / appeal to"],["mit","with + dative"],["nach","after / to + dative"],["bei","at / with + dative"],["von","from / of + dative"],["zu","to + dative"],["aus","from / out of + dative"],["der Zug","train"],["die Eltern","parents"],["mir / dir","to me / to you"],["ihm / ihr","to him / to her"],["den Kindern","to the children"]],"exercises":[{"t":"fill","q":"mit ___ Zug (the)","a":["dem"],"ex":""},{"t":"fill","q":"bei ___ Eltern (my)","a":["meinen"],"ex":""},{"t":"mcq","q":"Which is always dative?","opts":["mit","für","ohne","durch"],"a":0,"ex":""},{"t":"tr","q":"Can you help me?","a":["Kannst du mir helfen?"],"ex":""},{"t":"fill","q":"Ich gebe ___ Frau das Buch. (the)","a":["der"],"ex":""},{"t":"mcq","q":"Dative plural normally uses:","opts":["den + noun -n","die + unchanged noun","der + noun -s","dem + noun -e"],"a":0,"ex":""},{"t":"order","q":"Arrange: “I speak with the children.”","tokens":["mit den Kindern","ich","spreche"],"a":["Ich","spreche","mit den Kindern"],"ex":""},{"t":"fill","q":"Das gefällt ___. (me)","a":["mir"],"ex":""}]},{"id":"a2u2","title":"Two-way prepositions","subtitle":"Distinguish location from destination","grammar":"<h3>Accusative for destination; dative for location<\/h3><p>The two-way prepositions are <b>an, auf, hinter, in, neben, über, unter, vor, zwischen<\/b>.<\/p>\n<table class=\"gr\"><tr><th>Question<\/th><th>Case<\/th><th>Example<\/th><\/tr><tr><td><b>Wohin?<\/b> where to?<\/td><td>accusative<\/td><td>Ich gehe <b>in die<\/b> Küche.<\/td><\/tr><tr><td><b>Wo?<\/b> where?<\/td><td>dative<\/td><td>Ich bin <b>in der<\/b> Küche.<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Motion alone is not enough.<\/b> The distinction is change of location versus location: Ich laufe <b>im Park<\/b> (running within the park, dative).<\/div>","examples":[["Ich stelle die Tasse auf den Tisch.","I put the cup onto the table."],["Die Tasse steht auf dem Tisch.","The cup is on the table."],["Wir gehen in die Stadt.","We are going into town."],["Wir sind in der Stadt.","We are in town."],["Das Bild hängt an der Wand.","The picture hangs on the wall."],["Ich hänge das Bild an die Wand.","I hang the picture onto the wall."]],"vocab":[["in","in / into"],["auf","on / onto"],["an","at / on to a vertical surface"],["unter","under"],["über","over / above"],["vor","in front of / before"],["hinter","behind"],["neben","beside"],["zwischen","between"],["stellen","to put upright"],["stehen","to stand"],["legen","to lay"],["liegen","to lie"],["hängen","to hang"],["die Wand","wall"]],"exercises":[{"t":"mcq","q":"Ich gehe ___ Küche.","opts":["in die","in der","im","ins der"],"a":0,"ex":""},{"t":"mcq","q":"Ich bin ___ Küche.","opts":["in der","in die","an den","auf das"],"a":0,"ex":""},{"t":"fill","q":"Die Tasse steht auf ___ Tisch.","a":["dem"],"ex":""},{"t":"fill","q":"Ich stelle die Tasse auf ___ Tisch.","a":["den"],"ex":""},{"t":"tr","q":"The picture hangs on the wall.","a":["Das Bild hängt an der Wand."],"ex":""},{"t":"mcq","q":"Running within a park normally takes:","opts":["dative","accusative","genitive","no case"],"a":0,"ex":""},{"t":"order","q":"Arrange: “We are going into town.”","tokens":["in die Stadt","wir","gehen"],"a":["Wir","gehen","in die Stadt"],"ex":""},{"t":"fill","q":"Das Kind sitzt zwischen ___ Eltern.","a":["den"],"ex":""}]},{"id":"a2u3","title":"The perfect tense","subtitle":"Talk about completed past events in everyday German","grammar":"<h3>haben/sein + past participle<\/h3><p>Spoken German usually uses the <b>Perfekt<\/b>: Ich <b>habe<\/b> gearbeitet. Wir <b>sind<\/b> gefahren.<\/p>\n<p>Regular participles: <b>ge-<\/b> + stem + <b>-t<\/b>: machen → gemacht. Many strong verbs end in <b>-en<\/b>: schreiben → geschrieben.<\/p>\n<p>Use <b>sein<\/b> mainly with intransitive movement or change of state: gehen, kommen, fahren, werden, bleiben, sterben.<\/p>\n<div class=\"tip\">In a main clause the auxiliary is finite in position 2; the participle closes the clause: <b>Gestern habe ich lange gearbeitet.<\/b><\/div>","examples":[["Ich habe gestern gearbeitet.","I worked yesterday."],["Wir sind nach Hamburg gefahren.","We travelled to Hamburg."],["Sie hat das Buch gelesen.","She read the book."],["Er ist spät gekommen.","He came late."],["Was hast du gemacht?","What did you do?"],["Ich bin zu Hause geblieben.","I stayed at home."]],"vocab":[["gemacht","done / made"],["gearbeitet","worked"],["gelernt","learned"],["gekauft","bought"],["gesehen","seen"],["gelesen","read"],["geschrieben","written"],["gesprochen","spoken"],["gefahren","travelled / driven"],["gegangen","gone"],["gekommen","come"],["geblieben","stayed"],["gestern","yesterday"],["letzte Woche","last week"],["schon","already"]],"exercises":[{"t":"fill","q":"Ich ___ gearbeitet.","a":["habe"],"ex":""},{"t":"fill","q":"Wir ___ nach Berlin gefahren.","a":["sind"],"ex":""},{"t":"mcq","q":"The participle of <i>machen<\/i> is:","opts":["gemacht","gemachen","machtge","gemachenst"],"a":0,"ex":""},{"t":"mcq","q":"Which usually takes <i>sein<\/i>?","opts":["gehen","kaufen","lesen","machen"],"a":0,"ex":""},{"t":"order","q":"Arrange: “Yesterday I read the book.”","tokens":["das Buch","gestern","gelesen","ich","habe"],"a":["Gestern","habe","ich","das Buch","gelesen"],"ex":""},{"t":"tr","q":"What did you do?","a":["Was hast du gemacht?"],"ex":""},{"t":"fill","q":"Sie hat den Film ___. (see)","a":["gesehen"],"ex":""},{"t":"fill","q":"Er ist zu Hause ___. (stay)","a":["geblieben"],"ex":""}]},{"id":"a2u4","title":"Separable verbs","subtitle":"Keep the prefix in mind until the clause closes","grammar":"<h3>Main clauses split the verb<\/h3><p>With a separable prefix, the conjugated stem takes position 2 and the prefix goes to the end: <b>Ich stehe um sieben Uhr auf.<\/b><\/p>\n<p>With a modal, the infinitive remains together: Ich muss früh <b>aufstehen<\/b>. In the perfect, <b>ge<\/b> usually enters between prefix and stem: <b>aufgestanden<\/b>, <b>eingekauft<\/b>.<\/p>\n<table class=\"gr\"><tr><th>Verb<\/th><th>Meaning<\/th><th>Main clause<\/th><\/tr><tr><td>anrufen<\/td><td>call<\/td><td>Ich rufe dich an.<\/td><\/tr><tr><td>einkaufen<\/td><td>shop<\/td><td>Wir kaufen heute ein.<\/td><\/tr><tr><td>mitkommen<\/td><td>come along<\/td><td>Kommst du mit?<\/td><\/tr><\/table>","examples":[["Ich stehe jeden Tag um sechs auf.","I get up at six every day."],["Rufst du mich später an?","Will you call me later?"],["Wir kaufen am Samstag ein.","We shop on Saturday."],["Der Zug kommt um neun an.","The train arrives at nine."],["Ich habe die Tür zugemacht.","I closed the door."],["Willst du mitkommen?","Do you want to come along?"]],"vocab":[["aufstehen","to get up"],["anrufen","to call"],["einkaufen","to shop"],["ankommen","to arrive"],["abfahren","to depart"],["mitkommen","to come along"],["zumachen","to close"],["aufmachen","to open"],["fernsehen","to watch television"],["anfangen","to begin"],["vorbereiten","to prepare"],["einladen","to invite"],["später","later"],["früh","early"],["pünktlich","punctual / on time"]],"exercises":[{"t":"order","q":"Arrange: “I call you later.”","tokens":["später","ich","dich","an","rufe"],"a":["Ich","rufe","dich","später","an"],"ex":""},{"t":"fill","q":"Der Zug kommt um neun ___.","a":["an"],"ex":""},{"t":"mcq","q":"With a modal, separable verbs:","opts":["remain together as an infinitive","split around the modal","lose the prefix","take the dative"],"a":0,"ex":""},{"t":"fill","q":"Ich bin um sechs ___. (get up)","a":["aufgestanden"],"ex":""},{"t":"tr","q":"Do you want to come along?","a":["Willst du mitkommen?"],"ex":""},{"t":"order","q":"Arrange: “We shop on Saturday.”","tokens":["am Samstag","wir","ein","kaufen"],"a":["Wir","kaufen","am Samstag","ein"],"ex":""},{"t":"fill","q":"Bitte mach die Tür ___. (close)","a":["zu"],"ex":""},{"t":"mcq","q":"The perfect participle of <i>einkaufen<\/i> is:","opts":["eingekauft","geeinkauft","einkaufenge","einkauft"],"a":0,"ex":""}]},{"id":"a2u5","title":"Reflexive verbs & commands","subtitle":"Daily routines, body care and the imperative","grammar":"<h3>Reflexive pronouns<\/h3><table class=\"gr\"><tr><td>ich <b>mich<\/b><\/td><td>wir <b>uns<\/b><\/td><\/tr><tr><td>du <b>dich<\/b><\/td><td>ihr <b>euch<\/b><\/td><\/tr><tr><td>er/sie/es <b>sich<\/b><\/td><td>sie/Sie <b>sich<\/b><\/td><\/tr><\/table>\n<p>Some verbs are inherently reflexive: <b>sich erinnern an<\/b>, <b>sich freuen auf/über<\/b>, <b>sich interessieren für<\/b>.<\/p>\n<h3>Imperative<\/h3><p><b>du:<\/b> Komm! / Lies! &nbsp; <b>ihr:<\/b> Kommt! &nbsp; <b>Sie:<\/b> Kommen Sie!<\/p>","examples":[["Ich interessiere mich für Geschichte.","I am interested in history."],["Sie erinnert sich an den Termin.","She remembers the appointment."],["Wir freuen uns auf die Reise.","We look forward to the trip."],["Setz dich bitte!","Please sit down!"],["Warten Sie einen Moment!","Please wait a moment!"],["Wascht euch die Hände!","Wash your hands!"]],"vocab":[["sich erinnern an","to remember"],["sich freuen auf","to look forward to"],["sich freuen über","to be pleased about"],["sich interessieren für","to be interested in"],["sich beeilen","to hurry"],["sich setzen","to sit down"],["sich waschen","to wash oneself"],["sich anziehen","to get dressed"],["der Termin","appointment"],["die Reise","trip"],["die Hände","hands"],["warten","to wait"],["beeil dich!","hurry up!"],["kommen Sie!","come! formal"],["setzt euch!","sit down! plural"]],"exercises":[{"t":"fill","q":"Ich interessiere ___ für Musik.","a":["mich"],"ex":""},{"t":"fill","q":"Wir freuen ___ auf die Reise.","a":["uns"],"ex":""},{"t":"mcq","q":"Formal command:","opts":["Kommen Sie!","Kommst Sie!","Kommt du!","Sie kommen?"],"a":0,"ex":""},{"t":"tr","q":"Please sit down! (informal)","a":["Setz dich bitte!"],"ex":""},{"t":"fill","q":"Er erinnert ___ an den Termin.","a":["sich"],"ex":""},{"t":"mcq","q":"The <i>ihr<\/i> reflexive pronoun is:","opts":["euch","uns","sich","ihnen"],"a":0,"ex":""},{"t":"order","q":"Arrange: “Wash your hands!” (plural)","tokens":["die Hände","euch","wascht"],"a":["Wascht","euch","die Hände"],"ex":""},{"t":"fill","q":"Beeil ___!","a":["dich"],"ex":""}]},{"id":"a2u6","title":"Adjectives: the first pattern","subtitle":"Predicative adjectives and basic attributive endings","grammar":"<h3>After sein, adjectives do not decline<\/h3><p>Das Haus ist <b>alt<\/b>. Die Häuser sind <b>alt<\/b>.<\/p>\n<h3>Before a noun, adjectives carry endings<\/h3><p>After a definite article, the adjective usually takes <b>-e<\/b> or <b>-en<\/b>: der neu<b>e<\/b> Film; den neu<b>en<\/b> Film; mit dem neu<b>en<\/b> Film.<\/p>\n<table class=\"gr\"><tr><th>Definite article<\/th><th>Nom.<\/th><th>Acc.<\/th><th>Dat.<\/th><\/tr><tr><td>masc.<\/td><td>der gut<b>e<\/b> Mann<\/td><td>den gut<b>en<\/b> Mann<\/td><td>dem gut<b>en<\/b> Mann<\/td><\/tr><tr><td>fem.<\/td><td>die gut<b>e<\/b> Frau<\/td><td>die gut<b>e<\/b> Frau<\/td><td>der gut<b>en<\/b> Frau<\/td><\/tr><tr><td>neut.<\/td><td>das gut<b>e<\/b> Buch<\/td><td>das gut<b>e<\/b> Buch<\/td><td>dem gut<b>en<\/b> Buch<\/td><\/tr><\/table>\n<div class=\"tip\">At this stage, master the high-frequency rule: after <b>der/die/das<\/b>, use <b>-e<\/b> in the “plain” nominative forms and feminine/neuter accusative; use <b>-en<\/b> almost everywhere else.<\/div>","examples":[["Das ist ein interessantes Buch.","That is an interesting book."],["Der alte Mann wartet.","The old man is waiting."],["Ich sehe den alten Mann.","I see the old man."],["Sie trägt ein rotes Kleid.","She is wearing a red dress."],["Wir wohnen in einer kleinen Wohnung.","We live in a small flat."],["Das Essen ist sehr gut.","The food is very good."]],"vocab":[["alt","old"],["jung","young"],["groß","large / tall"],["klein","small"],["neu","new"],["interessant","interesting"],["langweilig","boring"],["schön","beautiful"],["teuer","expensive"],["billig","cheap"],["rot","red"],["blau","blue"],["die Wohnung","flat / apartment"],["das Kleid","dress"],["das Essen","food"]],"exercises":[{"t":"fill","q":"der alt___ Mann","a":["e"],"ex":""},{"t":"fill","q":"den alt___ Mann","a":["en"],"ex":""},{"t":"fill","q":"mit der nett___ Frau","a":["en"],"ex":""},{"t":"mcq","q":"After <i>sein<\/i>, an adjective:","opts":["has no ending","always takes -e","always takes -en","takes a case ending"],"a":0,"ex":""},{"t":"tr","q":"an interesting book","a":["ein interessantes Buch"],"ex":""},{"t":"fill","q":"das rot___ Kleid","a":["e"],"ex":""},{"t":"order","q":"Arrange: “We live in a small flat.”","tokens":["in einer kleinen Wohnung","wir","wohnen"],"a":["Wir","wohnen","in einer kleinen Wohnung"],"ex":""},{"t":"mcq","q":"Which is correct?","opts":["Das Essen ist gut.","Das Essen ist gutes.","Das gute Essen ist gute.","Das Essen gut ist."],"a":0,"ex":""}]}]},{"id":"b1","short":"B1","icon":"🧩","label":"B1 — Connected German","tagline":"Build complex clauses","desc":"Subordination, relative clauses, narration, passive voice and hypothetical meaning.","units":[{"id":"b1u1","title":"Subordinate clauses","subtitle":"Send the finite verb to the end","grammar":"<h3>Subordinating conjunctions<\/h3><p><b>weil, dass, obwohl, wenn, als, bevor, nachdem, während, damit<\/b> introduce subordinate clauses. The finite verb goes to the end:<\/p>\n<p>Ich bleibe zu Hause, <b>weil ich krank bin<\/b>.<\/p>\n<p>If the subordinate clause comes first, the whole clause occupies position 1; the main-clause verb follows immediately: <b>Weil ich krank bin, bleibe ich zu Hause.<\/b><\/p>\n<div class=\"tip\">In a perfect subordinate clause, the participle precedes the auxiliary: weil ich das Buch <b>gelesen habe<\/b>.<\/div>","examples":[["Ich lerne Deutsch, weil ich in Berlin arbeite.","I learn German because I work in Berlin."],["Sie sagt, dass sie morgen kommt.","She says that she is coming tomorrow."],["Obwohl es regnet, gehen wir spazieren.","Although it is raining, we go for a walk."],["Wenn ich Zeit habe, lese ich.","When/if I have time, I read."],["Als ich jung war, wohnte ich in Köln.","When I was young, I lived in Cologne."],["Nachdem wir gegessen hatten, gingen wir nach Hause.","After we had eaten, we went home."]],"vocab":[["weil","because"],["dass","that"],["obwohl","although"],["wenn","if / whenever"],["als","when (single past event)"],["bevor","before"],["nachdem","after"],["während","while / during"],["damit","so that"],["deshalb","therefore"],["trotzdem","nevertheless"],["spazieren gehen","to go for a walk"],["regnen","to rain"],["jung","young"],["Zeit haben","to have time"]],"exercises":[{"t":"order","q":"Arrange the subordinate clause: “because I am tired”","tokens":["ich","müde","weil","bin"],"a":["weil","ich","müde","bin"],"ex":""},{"t":"mcq","q":"After <i>weil<\/i>, the finite verb goes:","opts":["to the end","to position 2","first","before the subject"],"a":0,"ex":""},{"t":"fill","q":"Sie sagt, dass sie morgen ___. (come)","a":["kommt"],"ex":""},{"t":"tr","q":"Although it is raining, we go for a walk.","a":["Obwohl es regnet, gehen wir spazieren."],"ex":""},{"t":"order","q":"Arrange: “Because I am ill, I stay home.”","tokens":["bleibe","weil ich krank bin","ich","zu Hause"],"a":["Weil ich krank bin","bleibe","ich","zu Hause"],"ex":""},{"t":"mcq","q":"<i>als<\/i> is used for:","opts":["a single past occasion","all future conditions","repeated present actions only","questions"],"a":0,"ex":""},{"t":"fill","q":"weil ich das Buch gelesen ___","a":["habe"],"ex":""},{"t":"mcq","q":"Which is a coordinating adverb, not a subordinating conjunction?","opts":["deshalb","weil","obwohl","dass"],"a":0,"ex":""}]},{"id":"b1u2","title":"Relative clauses","subtitle":"Add precise information without starting a new sentence","grammar":"<h3>Relative pronouns combine gender and case<\/h3><p>The pronoun agrees in gender and number with its antecedent, but its case comes from its function inside the relative clause.<\/p>\n<table class=\"gr\"><tr><th><\/th><th>Masc.<\/th><th>Fem.<\/th><th>Neut.<\/th><th>Plural<\/th><\/tr><tr><td>Nom.<\/td><td>der<\/td><td>die<\/td><td>das<\/td><td>die<\/td><\/tr><tr><td>Acc.<\/td><td>den<\/td><td>die<\/td><td>das<\/td><td>die<\/td><\/tr><tr><td>Dat.<\/td><td>dem<\/td><td>der<\/td><td>dem<\/td><td>denen<\/td><\/tr><tr><td>Gen.<\/td><td>dessen<\/td><td>deren<\/td><td>dessen<\/td><td>deren<\/td><\/tr><\/table>\n<p>The finite verb goes to the end: Das ist der Mann, <b>den ich gestern gesehen habe<\/b>.<\/p>","examples":[["Das ist die Frau, die nebenan wohnt.","That is the woman who lives next door."],["Der Mann, den du siehst, ist mein Chef.","The man whom you see is my boss."],["Das Kind, dem ich helfe, ist acht Jahre alt.","The child whom I help is eight years old."],["Die Leute, mit denen wir sprechen, sind nett.","The people with whom we are speaking are nice."],["Der Autor, dessen Buch ich lese, lebt in Wien.","The author whose book I am reading lives in Vienna."],["Das ist alles, was ich weiß.","That is everything I know."]],"vocab":[["der Nachbar / die Nachbarin","neighbour"],["der Chef / die Chefin","boss"],["der Autor / die Autorin","author"],["dessen / deren","whose"],["denen","to whom / with whom plural"],["nebenan","next door"],["alles, was","everything that"],["etwas, das","something that"],["jemand, der","someone who"],["kennenlernen","to get to know"],["erklären","to explain"],["gehören + Dat.","to belong to"],["der Kollege","colleague"],["das Gebäude","building"],["die Leute","people"]],"exercises":[{"t":"fill","q":"Der Mann, ___ du siehst, ist mein Chef.","a":["den"],"ex":""},{"t":"fill","q":"Die Frau, ___ hier wohnt, ist nett.","a":["die"],"ex":""},{"t":"mcq","q":"The case of a relative pronoun is determined by:","opts":["its role inside the relative clause","the case of the antecedent","the main verb only","word order"],"a":0,"ex":""},{"t":"tr","q":"The people with whom we speak are nice.","a":["Die Leute, mit denen wir sprechen, sind nett."],"ex":""},{"t":"fill","q":"Das Kind, ___ ich helfe, ist acht.","a":["dem"],"ex":""},{"t":"order","q":"Arrange relative clause: “whom I saw yesterday”","tokens":["gestern","den","gesehen habe","ich"],"a":["den","ich","gestern","gesehen habe"],"ex":""},{"t":"fill","q":"Der Autor, ___ Buch ich lese, lebt in Wien.","a":["dessen"],"ex":""},{"t":"mcq","q":"Relative-clause verb position:","opts":["final","second","first","before the relative pronoun"],"a":0,"ex":""}]},{"id":"b1u3","title":"Past narration","subtitle":"Präteritum for stories, reports and common verbs","grammar":"<h3>Perfekt versus Präteritum<\/h3><p>Conversation favours the perfect, but written narratives use the simple past. <b>sein, haben<\/b> and modal verbs commonly appear in the simple past even in speech.<\/p>\n<table class=\"gr\"><tr><th>Infinitive<\/th><th>Präteritum<\/th><th>Meaning<\/th><\/tr><tr><td>sein<\/td><td>war<\/td><td>was<\/td><\/tr><tr><td>haben<\/td><td>hatte<\/td><td>had<\/td><\/tr><tr><td>können<\/td><td>konnte<\/td><td>could<\/td><\/tr><tr><td>gehen<\/td><td>ging<\/td><td>went<\/td><\/tr><tr><td>kommen<\/td><td>kam<\/td><td>came<\/td><\/tr><tr><td>sehen<\/td><td>sah<\/td><td>saw<\/td><\/tr><\/table>\n<p>Regular verbs add <b>-te<\/b>: machen → machte; arbeiten → arbeitete.<\/p>","examples":[["Früher wohnte ich in Bonn.","I used to live in Bonn."],["Es war ein kalter Abend.","It was a cold evening."],["Plötzlich hörte er ein Geräusch.","Suddenly he heard a noise."],["Sie ging zur Tür und sah hinaus.","She went to the door and looked outside."],["Wir konnten nicht schlafen.","We could not sleep."],["Am Ende hatte alles gut funktioniert.","In the end everything had worked well."]],"vocab":[["früher","formerly / in the past"],["plötzlich","suddenly"],["damals","at that time"],["zuerst","first"],["dann","then"],["schließlich","finally"],["war / waren","was / were"],["hatte / hatten","had"],["ging","went"],["kam","came"],["sah","saw"],["hörte","heard"],["dachte","thought"],["wusste","knew"],["das Geräusch","noise"]],"exercises":[{"t":"fill","q":"Es ___ ein kalter Abend.","a":["war"],"ex":""},{"t":"fill","q":"Wir ___ nicht schlafen. (could)","a":["konnten"],"ex":""},{"t":"mcq","q":"The Präteritum of <i>gehen<\/i> is:","opts":["ging","gehte","gegangen","gang"],"a":0,"ex":""},{"t":"tr","q":"Suddenly he heard a noise.","a":["Plötzlich hörte er ein Geräusch."],"ex":""},{"t":"fill","q":"Früher ___ ich in Bonn. (live)","a":["wohnte"],"ex":""},{"t":"mcq","q":"Even in conversation, which commonly uses Präteritum?","opts":["sein","einkaufen","fotografieren","reparieren"],"a":0,"ex":""},{"t":"order","q":"Arrange: “Then she went to the door.”","tokens":["zur Tür","dann","sie","ging"],"a":["Dann","ging","sie","zur Tür"],"ex":""},{"t":"fill","q":"Ich ___ die Antwort nicht. (knew)","a":["wusste"],"ex":""}]},{"id":"b1u4","title":"The passive voice","subtitle":"Focus on the event rather than the actor","grammar":"<h3>Process passive: werden + participle<\/h3><p>Das Haus <b>wird gebaut<\/b>. The house is being built. Past: Das Haus <b>wurde gebaut<\/b>.<\/p>\n<h3>State passive: sein + participle<\/h3><p>Die Tür <b>ist geschlossen<\/b>. The door is closed—the resulting state matters.<\/p>\n<p>The actor may be added with <b>von + dative<\/b>: Das Gesetz wurde <b>vom Parlament<\/b> beschlossen.<\/p>","examples":[["Das Essen wird vorbereitet.","The food is being prepared."],["Die Brücke wurde 1990 gebaut.","The bridge was built in 1990."],["Der Vertrag wird morgen unterschrieben.","The contract will be signed tomorrow."],["Die Tür ist geschlossen.","The door is closed."],["Das Problem muss gelöst werden.","The problem must be solved."],["Das Buch wurde von einer Historikerin geschrieben.","The book was written by a historian."]],"vocab":[["bauen","to build"],["vorbereiten","to prepare"],["unterschreiben","to sign"],["lösen","to solve"],["entscheiden","to decide"],["beschließen","to decide / enact"],["veröffentlichen","to publish"],["herstellen","to manufacture"],["der Vertrag","contract"],["das Gesetz","law"],["die Brücke","bridge"],["geschlossen","closed"],["geöffnet","open"],["von + Dat.","by"],["werden","to become / passive auxiliary"]],"exercises":[{"t":"fill","q":"Das Essen ___ vorbereitet.","a":["wird"],"ex":""},{"t":"fill","q":"Die Brücke ___ 1990 gebaut.","a":["wurde"],"ex":""},{"t":"mcq","q":"State passive uses:","opts":["sein + participle","werden + infinitive","haben + participle","sein + infinitive"],"a":0,"ex":""},{"t":"tr","q":"The problem must be solved.","a":["Das Problem muss gelöst werden."],"ex":""},{"t":"order","q":"Arrange: “The contract will be signed tomorrow.”","tokens":["morgen","unterschrieben","der Vertrag","wird"],"a":["Der Vertrag","wird","morgen","unterschrieben"],"ex":""},{"t":"fill","q":"Das Buch wurde ___ einer Historikerin geschrieben.","a":["von"],"ex":""},{"t":"mcq","q":"“Die Tür ist geschlossen” describes:","opts":["a resulting state","an ongoing closing process","a future action","the actor"],"a":0,"ex":""},{"t":"fill","q":"Die Ergebnisse werden morgen ___. (publish)","a":["veröffentlicht"],"ex":""}]},{"id":"b1u5","title":"Konjunktiv II","subtitle":"Politeness, wishes and unreal situations","grammar":"<h3>würde + infinitive<\/h3><p>The common analytical form expresses hypotheticals: Ich <b>würde<\/b> mehr reisen, wenn ich Zeit hätte.<\/p>\n<h3>Frequent synthetic forms<\/h3><table class=\"gr\"><tr><td>haben → <b>hätte<\/b><\/td><td>sein → <b>wäre<\/b><\/td><\/tr><tr><td>können → <b>könnte<\/b><\/td><td>müssen → <b>müsste<\/b><\/td><\/tr><tr><td>dürfen → <b>dürfte<\/b><\/td><td>werden → <b>würde<\/b><\/td><\/tr><\/table>\n<p>Polite requests: <b>Könnten Sie mir helfen?<\/b> Advice: <b>Du solltest früher schlafen.<\/b><\/p>","examples":[["Ich hätte gern einen Kaffee.","I would like a coffee."],["Könnten Sie das wiederholen?","Could you repeat that?"],["Wenn ich mehr Zeit hätte, würde ich Deutsch lernen.","If I had more time, I would learn German."],["An deiner Stelle würde ich warten.","In your position I would wait."],["Es wäre besser, früher zu gehen.","It would be better to leave earlier."],["Ich wünschte, ich wäre dort.","I wish I were there."]],"vocab":[["hätte","would have"],["wäre","would be"],["würde","would"],["könnte","could"],["müsste","would have to"],["sollte","should"],["an deiner Stelle","in your position"],["ich wünschte","I wish"],["wenn","if"],["wiederholen","to repeat"],["vorschlagen","to suggest"],["raten","to advise"],["lieber","rather / preferably"],["möglich","possible"],["unwirklich","unreal"]],"exercises":[{"t":"fill","q":"Ich ___ gern einen Kaffee.","a":["hätte"],"ex":""},{"t":"fill","q":"Wenn ich Zeit hätte, ___ ich reisen.","a":["würde"],"ex":""},{"t":"mcq","q":"Most polite:","opts":["Könnten Sie mir helfen?","Hilf mir.","Sie helfen mir.","Du musst helfen."],"a":0,"ex":""},{"t":"tr","q":"It would be better to leave earlier.","a":["Es wäre besser, früher zu gehen."],"ex":""},{"t":"order","q":"Arrange: “If I had more time, I would read more.”","tokens":["würde ich mehr lesen","wenn ich mehr Zeit hätte"],"a":["Wenn ich mehr Zeit hätte","würde ich mehr lesen"],"ex":""},{"t":"fill","q":"An deiner Stelle ___ ich warten.","a":["würde"],"ex":""},{"t":"mcq","q":"Konjunktiv II of <i>sein<\/i>:","opts":["wäre","sei","war","würde sein only"],"a":0,"ex":""},{"t":"fill","q":"Du ___ früher schlafen. (should)","a":["solltest"],"ex":""}]},{"id":"b1u6","title":"Genitive & noun classes","subtitle":"Possession, formal prepositions and weak masculine nouns","grammar":"<h3>Genitive articles<\/h3><table class=\"gr\"><tr><th>Masc./neut.<\/th><th>Fem./plural<\/th><\/tr><tr><td><b>des<\/b> + noun -(e)s<\/td><td><b>der<\/b><\/td><\/tr><\/table>\n<p>das Ende <b>des Jahres<\/b>; die Meinung <b>der Autorin<\/b>. In speech, <b>von + dative<\/b> often replaces the genitive.<\/p>\n<p>Common genitive prepositions in formal language: <b>wegen, trotz, während, innerhalb, außerhalb<\/b>.<\/p>\n<h3>Weak masculine nouns<\/h3><p>Many masculine human/animal nouns take <b>-n/-en<\/b> in every case except nominative singular: der Student, den Studenten, dem Studenten.<\/p>","examples":[["Das ist das Auto meines Bruders.","That is my brother’s car."],["Wegen des Wetters bleiben wir zu Hause.","Because of the weather we are staying home."],["Trotz der Probleme machen wir weiter.","Despite the problems we continue."],["Ich spreche mit dem Studenten.","I am speaking with the student."],["Der Name des Kunden fehlt.","The customer’s name is missing."],["Während der Reise habe ich viel gelesen.","During the trip I read a lot."]],"vocab":[["wegen + Gen.","because of"],["trotz + Gen.","despite"],["während + Gen.","during"],["innerhalb + Gen.","within"],["außerhalb + Gen.","outside"],["der Student · Studenten","student"],["der Kunde · Kunden","customer"],["der Mensch · Menschen","human being"],["der Name · Namen","name"],["der Kollege · Kollegen","colleague"],["das Ende","end"],["die Meinung","opinion"],["das Wetter","weather"],["fehlen","to be missing"],["weitermachen","to continue"]],"exercises":[{"t":"fill","q":"das Ende ___ Jahres","a":["des"],"ex":""},{"t":"fill","q":"die Meinung ___ Autorin","a":["der"],"ex":""},{"t":"mcq","q":"Genitive masculine/neuter nouns often add:","opts":["-(e)s","-n only","-e always","no ending"],"a":0,"ex":""},{"t":"tr","q":"Because of the weather we are staying home.","a":["Wegen des Wetters bleiben wir zu Hause."],"ex":""},{"t":"fill","q":"mit dem Student___","a":["en"],"ex":""},{"t":"mcq","q":"Which is a weak masculine noun?","opts":["der Student","der Tisch","der Sommer","der Kaffee"],"a":0,"ex":""},{"t":"order","q":"Arrange: “Despite the problems we continue.”","tokens":["machen wir weiter","trotz der Probleme"],"a":["Trotz der Probleme","machen wir weiter"],"ex":""},{"t":"fill","q":"Der Name des Kund___ fehlt.","a":["en"],"ex":""}]}]},{"id":"b2","short":"B2","icon":"🧠","label":"B2 — Precision","tagline":"Control the system","desc":"Full adjective declension, governed prepositions, reporting, particles and formal written German.","units":[{"id":"b2u1","title":"Adjective declension mastered","subtitle":"Strong, weak and mixed endings as a system","grammar":"<h3>The principle<\/h3><p>A German noun phrase must display gender, case and number somewhere. If the article already displays the information, the adjective takes a weak ending. If not, the adjective carries more of the load.<\/p>\n<table class=\"gr\"><tr><th>Pattern<\/th><th>Trigger<\/th><th>Example<\/th><\/tr><tr><td>weak<\/td><td>der-word<\/td><td>mit <b>dem alten<\/b> Haus<\/td><\/tr><tr><td>mixed<\/td><td>ein-word<\/td><td><b>ein altes<\/b> Haus; mit <b>einem alten<\/b> Haus<\/td><\/tr><tr><td>strong<\/td><td>no article<\/td><td><b>kaltes<\/b> Wasser; mit <b>kaltem<\/b> Wasser<\/td><\/tr><\/table>\n<div class=\"tip\">Use the Ending Lab to generate and inspect every combination. Learn the logic rather than memorising three unrelated tables.<\/div>","examples":[["frischer Kaffee","fresh coffee"],["ein neuer Computer","a new computer"],["keine einfache Lösung","no simple solution"],["mit kaltem Wasser","with cold water"],["wegen starken Regens","because of heavy rain"],["die wichtigsten politischen Fragen","the most important political questions"]],"vocab":[["frisch","fresh"],["kalt","cold"],["stark","strong"],["wichtig","important"],["politisch","political"],["wirtschaftlich","economic"],["öffentlich","public"],["privat","private"],["einfach","simple"],["kompliziert","complicated"],["der Regen","rain"],["die Lösung","solution"],["die Frage","question"],["das Wasser","water"],["der Computer","computer"]],"exercises":[{"t":"fill","q":"frisch___ Kaffee (nom. masc., no article)","a":["er"],"ex":""},{"t":"fill","q":"mit kalt___ Wasser","a":["em"],"ex":""},{"t":"fill","q":"ein neu___ Computer","a":["er"],"ex":""},{"t":"fill","q":"keine einfach___ Lösung","a":["e"],"ex":""},{"t":"mcq","q":"After a definite article, adjective endings are mainly:","opts":["weak","strong","absent","genitive only"],"a":0,"ex":""},{"t":"tr","q":"because of heavy rain","a":["wegen starken Regens"],"ex":""},{"t":"fill","q":"die wichtigst___ politischen Fragen","a":["en"],"ex":""},{"t":"mcq","q":"The adjective carries the clearest case signal when there is:","opts":["no article","a definite article","a possessive article only","a pronoun"],"a":0,"ex":""}]},{"id":"b2u2","title":"Verb–preposition government","subtitle":"Learn verbs with their case and pronominal compounds","grammar":"<h3>The preposition belongs to the verb<\/h3><p>Learn the whole package: <b>warten auf + Akk.<\/b>; <b>teilnehmen an + Dat.<\/b>; <b>abhängen von + Dat.<\/b>.<\/p>\n<h3>da- and wo-compounds<\/h3><p>For things and ideas, German normally uses <b>darauf, daran, davon<\/b> and questions <b>worauf, woran, wovon<\/b>: Worauf wartest du? — Ich warte darauf.<\/p>\n<p>For people, use preposition + pronoun: Auf wen wartest du? — Auf meine Kollegin.<\/p>","examples":[["Ich warte auf den Bus.","I am waiting for the bus."],["Worauf freust du dich?","What are you looking forward to?"],["Ich denke oft daran.","I often think about it."],["Das hängt von den Umständen ab.","That depends on the circumstances."],["Sie nimmt an der Konferenz teil.","She is taking part in the conference."],["Mit wem sprichst du?","Who are you speaking with?"]],"vocab":[["warten auf + Akk.","to wait for"],["denken an + Akk.","to think of"],["sich freuen auf + Akk.","to look forward to"],["teilnehmen an + Dat.","to participate in"],["abhängen von + Dat.","to depend on"],["sprechen über + Akk.","to speak about"],["sich beschäftigen mit + Dat.","to engage with"],["bestehen aus + Dat.","to consist of"],["darauf / worauf","on it / on what"],["daran / woran","about it / about what"],["davon / wovon","of it / of what"],["die Umstände","circumstances"],["die Konferenz","conference"],["der Bus","bus"],["teilnehmen","to participate"]],"exercises":[{"t":"fill","q":"Ich warte ___ den Bus.","a":["auf"],"ex":""},{"t":"mcq","q":"Question about a thing:","opts":["Worauf wartest du?","Auf wen wartest du?","Werauf wartest du?","Womit wen?"],"a":0,"ex":""},{"t":"fill","q":"Das hängt ___ den Umständen ab.","a":["von"],"ex":""},{"t":"tr","q":"I often think about it.","a":["Ich denke oft daran."],"ex":""},{"t":"mcq","q":"For a person, use:","opts":["preposition + pronoun","da-compound","wo-compound","no preposition"],"a":0,"ex":""},{"t":"fill","q":"Sie nimmt ___ der Konferenz teil.","a":["an"],"ex":""},{"t":"order","q":"Arrange: “What are you looking forward to?”","tokens":["du","worauf","freust","dich"],"a":["Worauf","freust","du","dich"],"ex":""},{"t":"fill","q":"Die Gruppe besteht ___ fünf Personen.","a":["aus"],"ex":""}]},{"id":"b2u3","title":"Infinitive clauses","subtitle":"zu, um…zu, ohne…zu and compact sentence design","grammar":"<h3>zu + infinitive<\/h3><p>Many verbs, nouns and adjectives take a <b>zu<\/b>-infinitive: Ich versuche, früher <b>zu kommen<\/b>. With separable verbs, <b>zu<\/b> enters the verb: <b>anzufangen<\/b>.<\/p>\n<h3>Purpose and accompanying circumstances<\/h3><p><b>um … zu<\/b> expresses purpose when both clauses share a subject. <b>ohne … zu<\/b> means without doing; <b>statt … zu<\/b> means instead of doing.<\/p>\n<p>Use <b>damit<\/b> when the subjects differ: Ich erkläre es langsam, damit alle es verstehen.<\/p>","examples":[["Ich versuche, früher zu kommen.","I am trying to come earlier."],["Sie hat vergessen, mich anzurufen.","She forgot to call me."],["Wir sparen, um ein Haus zu kaufen.","We are saving in order to buy a house."],["Er ging, ohne sich zu verabschieden.","He left without saying goodbye."],["Statt zu arbeiten, sah er fern.","Instead of working, he watched TV."],["Ich spreche langsam, damit alle mich verstehen.","I speak slowly so that everyone understands me."]],"vocab":[["versuchen","to try"],["vergessen","to forget"],["hoffen","to hope"],["planen","to plan"],["beschließen","to decide"],["anfangen","to begin"],["aufhören","to stop"],["um … zu","in order to"],["ohne … zu","without doing"],["statt … zu","instead of doing"],["damit","so that"],["sich verabschieden","to say goodbye"],["sparen","to save"],["erlauben","to allow"],["vermeiden","to avoid"]],"exercises":[{"t":"fill","q":"Ich versuche, früher ___ kommen.","a":["zu"],"ex":""},{"t":"fill","q":"Sie hat vergessen, mich ___. (call)","a":["anzurufen"],"ex":""},{"t":"mcq","q":"Use <i>damit<\/i> when:","opts":["the subjects differ","the subjects are always the same","there is no verb","the clause is a question"],"a":0,"ex":""},{"t":"tr","q":"We are saving in order to buy a house.","a":["Wir sparen, um ein Haus zu kaufen."],"ex":""},{"t":"order","q":"Arrange: “He left without saying goodbye.”","tokens":["ging","er","ohne sich zu verabschieden"],"a":["Er","ging","ohne sich zu verabschieden"],"ex":""},{"t":"fill","q":"Statt ___ arbeiten, sah er fern.","a":["zu"],"ex":""},{"t":"mcq","q":"In a separable infinitive, <i>zu<\/i>:","opts":["goes between prefix and stem","goes before the prefix","is omitted always","goes after the verb"],"a":0,"ex":""},{"t":"fill","q":"Ich spreche langsam, ___ alle mich verstehen.","a":["damit"],"ex":""}]},{"id":"b2u4","title":"Indirect speech & Konjunktiv I","subtitle":"Report claims while preserving distance","grammar":"<h3>Journalistic distance<\/h3><p>Konjunktiv I reports another person’s words without endorsing them: Der Minister sagt, die Lage <b>sei<\/b> stabil.<\/p>\n<table class=\"gr\"><tr><th>Verb<\/th><th>Key forms<\/th><\/tr><tr><td>sein<\/td><td>ich sei, er sei, wir seien<\/td><\/tr><tr><td>haben<\/td><td>er habe, sie hätten when K I is indistinct<\/td><\/tr><tr><td>werden<\/td><td>er werde, sie würden<\/td><\/tr><\/table>\n<p>Where Konjunktiv I is identical to the indicative, writers often use Konjunktiv II or <b>würde<\/b> forms to preserve reported distance.<\/p>","examples":[["Er sagt, er sei krank.","He says that he is ill."],["Die Sprecherin erklärte, man habe alles geprüft.","The spokesperson stated that everything had been checked."],["Der Bericht behauptet, die Zahlen seien korrekt.","The report claims the figures are correct."],["Sie sagte, sie werde später kommen.","She said she would come later."],["Die Zeugen gaben an, sie hätten nichts gesehen.","The witnesses stated they had seen nothing."],["Nach eigenen Angaben sei das Unternehmen profitabel.","According to its own statement, the company is profitable."]],"vocab":[["behaupten","to claim"],["erklären","to state / explain"],["angeben","to state / indicate"],["berichten","to report"],["bestätigen","to confirm"],["bestreiten","to deny / dispute"],["sei / seien","is / are (reported)"],["habe","has (reported)"],["werde","will / would (reported)"],["der Bericht","report"],["die Zahlen","figures"],["der Zeuge","witness"],["die Sprecherin","spokesperson"],["nach eigenen Angaben","according to one’s own statement"],["angeblich","allegedly"]],"exercises":[{"t":"fill","q":"Er sagt, er ___ krank.","a":["sei"],"ex":""},{"t":"fill","q":"Sie sagte, sie ___ später kommen.","a":["werde"],"ex":""},{"t":"mcq","q":"Konjunktiv I primarily signals:","opts":["reported distance","past time","a command","a direct question"],"a":0,"ex":""},{"t":"tr","q":"The report claims the figures are correct.","a":["Der Bericht behauptet, die Zahlen seien korrekt."],"ex":""},{"t":"fill","q":"Man ___ alles geprüft.","a":["habe"],"ex":""},{"t":"mcq","q":"If Konjunktiv I is indistinguishable from indicative, writers may use:","opts":["Konjunktiv II","imperative","infinitive only","passive only"],"a":0,"ex":""},{"t":"order","q":"Arrange: “He says he is ill.”","tokens":["er sei krank","er sagt"],"a":["Er sagt","er sei krank"],"ex":""},{"t":"fill","q":"Die Zeugen sagten, sie ___ nichts gesehen.","a":["hätten"],"ex":""}]},{"id":"b2u5","title":"Modal particles","subtitle":"The small words that make spoken German sound natural","grammar":"<h3>Meaning through attitude<\/h3><p>Modal particles do not change the factual proposition; they signal assumptions, tone and interpersonal stance.<\/p>\n<table class=\"gr\"><tr><th>Particle<\/th><th>Typical effect<\/th><th>Example<\/th><\/tr><tr><td>doch<\/td><td>contradicts or reminds<\/td><td>Komm doch mit!<\/td><\/tr><tr><td>mal<\/td><td>softens a request<\/td><td>Schau mal.<\/td><\/tr><tr><td>ja<\/td><td>marks shared knowledge<\/td><td>Das ist ja klar.<\/td><\/tr><tr><td>wohl<\/td><td>probability<\/td><td>Er ist wohl zu Hause.<\/td><\/tr><tr><td>eben / halt<\/td><td>resigned obviousness<\/td><td>Dann ist es eben so.<\/td><\/tr><tr><td>denn<\/td><td>warms a question<\/td><td>Was machst du denn?<\/td><\/tr><\/table>\n<div class=\"tip\">Particles are highly context-sensitive. Learn them through whole utterances rather than one-word translations.<\/div>","examples":[["Komm doch mit!","Why don’t you come along!"],["Warte mal einen Moment.","Just wait a moment."],["Das weißt du ja.","You know that, of course."],["Er ist wohl schon gegangen.","He has probably already left."],["Was machst du denn hier?","What are you doing here, then?"],["Dann müssen wir eben warten.","Then we simply have to wait."]],"vocab":[["doch","after all / contrary to expectation"],["mal","just / once, softener"],["ja","as you know / indeed"],["wohl","probably"],["eben","simply / that’s how it is"],["halt","simply, colloquial"],["denn","question softener"],["eigentlich","actually"],["bloß","just / whatever"],["schon","indeed / already"],["immerhin","after all / at least"],["offenbar","apparently"],["vermutlich","presumably"],["wahrscheinlich","probably"],["anscheinend","seemingly"]],"exercises":[{"t":"mcq","q":"Which particle commonly softens a request?","opts":["mal","wohl","eben","ja"],"a":0,"ex":""},{"t":"fill","q":"Was machst du ___ hier?","a":["denn"],"ex":""},{"t":"mcq","q":"<i>wohl<\/i> often expresses:","opts":["probability","a command","past tense","possession"],"a":0,"ex":""},{"t":"tr","q":"Then we simply have to wait.","a":["Dann müssen wir eben warten.","Dann müssen wir halt warten."],"ex":""},{"t":"fill","q":"Komm ___ mit! (encouraging contradiction/reminder)","a":["doch"],"ex":""},{"t":"mcq","q":"Modal particles primarily change:","opts":["tone and stance","the grammatical case","the tense","the dictionary meaning of the verb"],"a":0,"ex":""},{"t":"order","q":"Arrange: “He has probably already left.”","tokens":["schon gegangen","er ist","wohl"],"a":["Er ist","wohl","schon gegangen"],"ex":""},{"t":"fill","q":"Das weißt du ___. (shared knowledge)","a":["ja"],"ex":""}]},{"id":"b2u6","title":"Nominal style & formal writing","subtitle":"Recognise dense institutional German and rewrite it clearly","grammar":"<h3>Verbal versus nominal style<\/h3><p>Formal German often compresses actions into nouns: <b>Nach Prüfung des Antrags erfolgt die Entscheidung.<\/b> A clearer verbal version is: <b>Nachdem wir den Antrag geprüft haben, entscheiden wir.<\/b><\/p>\n<p>Common nominalisations: entscheiden → <b>die Entscheidung<\/b>; prüfen → <b>die Prüfung<\/b>; durchführen → <b>die Durchführung<\/b>.<\/p>\n<h3>Functional verb constructions<\/h3><p><b>eine Entscheidung treffen<\/b>, <b>in Betracht ziehen<\/b>, <b>zur Verfügung stellen<\/b>, <b>Kenntnis nehmen<\/b>. These are conventional and often more formal than the simple verb.<\/p>","examples":[["Nach Prüfung des Antrags erhalten Sie eine Antwort.","After examination of the application, you will receive an answer."],["Wir ziehen mehrere Möglichkeiten in Betracht.","We are considering several possibilities."],["Die Unterlagen stehen Ihnen zur Verfügung.","The documents are available to you."],["Die Maßnahme tritt morgen in Kraft.","The measure enters into force tomorrow."],["Bitte nehmen Sie davon Kenntnis.","Please take note of this."],["Wir führen eine Untersuchung durch.","We conduct an investigation."]],"vocab":[["die Prüfung","examination"],["die Entscheidung","decision"],["die Durchführung","implementation / conduct"],["der Antrag","application"],["die Unterlagen","documents"],["in Betracht ziehen","to consider"],["zur Verfügung stehen","to be available"],["in Kraft treten","to enter into force"],["Kenntnis nehmen","to take note"],["eine Entscheidung treffen","to make a decision"],["eine Untersuchung durchführen","to conduct an investigation"],["die Maßnahme","measure"],["erfolgen","to take place / ensue"],["hinsichtlich","with regard to"],["gemäß + Dat.","in accordance with"]],"exercises":[{"t":"mcq","q":"Nominal style typically:","opts":["compresses actions into nouns","avoids all nouns","uses only questions","eliminates cases"],"a":0,"ex":""},{"t":"fill","q":"eine Entscheidung ___","a":["treffen"],"ex":""},{"t":"fill","q":"in Betracht ___","a":["ziehen"],"ex":""},{"t":"tr","q":"The measure enters into force tomorrow.","a":["Die Maßnahme tritt morgen in Kraft."],"ex":""},{"t":"mcq","q":"Clearer verbal rewrite of “nach Prüfung” begins with:","opts":["nachdem … geprüft","obwohl … prüft","weil … prüfen","um … Prüfung"],"a":0,"ex":""},{"t":"fill","q":"Die Unterlagen stehen Ihnen zur ___.","a":["Verfügung"],"ex":""},{"t":"order","q":"Arrange: “We conduct an investigation.”","tokens":["eine Untersuchung","wir","durch","führen"],"a":["Wir","führen","eine Untersuchung","durch"],"ex":""},{"t":"fill","q":"Bitte nehmen Sie davon ___.","a":["Kenntnis"],"ex":""}]}]},{"id":"c1","short":"C1","icon":"🏛️","label":"C1 — Advanced control","tagline":"Think in German","desc":"Sentence fields, information structure, logical connectors, register and evidence-sensitive argument.","units":[{"id":"c1u1","title":"Clause architecture","subtitle":"Manage long sentences without losing the grammatical spine","grammar":"<h3>The German sentence field<\/h3><p>Think in structural fields: <b>Vorfeld | linke Klammer | Mittelfeld | rechte Klammer | Nachfeld<\/b>.<\/p>\n<p><b>Heute | hat | der Ausschuss nach langer Beratung dem geänderten Vorschlag | zugestimmt |, obwohl mehrere Mitglieder Bedenken hatten.<\/b><\/p>\n<p>The left and right brackets form a frame. Readers hold the middle field in suspension until the final verb element closes the structure.<\/p>\n<h3>Extraposition<\/h3><p>Heavy clauses are often placed in the <b>Nachfeld<\/b>: Es ist überraschend, <b>dass der Antrag angenommen wurde<\/b>.<\/p>","examples":[["Der Ausschuss hat dem Vorschlag nach langer Beratung zugestimmt.","The committee approved the proposal after lengthy deliberation."],["Nach langer Beratung hat der Ausschuss dem Vorschlag zugestimmt.","After lengthy deliberation the committee approved the proposal."],["Es ist bemerkenswert, dass niemand widersprochen hat.","It is remarkable that nobody objected."],["Der Plan hätte, wenn alle Beteiligten früher informiert worden wären, geändert werden können.","The plan could have been changed if all parties had been informed earlier."],["Was dabei übersehen wurde, war die finanzielle Folge.","What was overlooked was the financial consequence."],["Dem Vorschlag zugestimmt hat der Ausschuss dennoch nicht.","The committee nevertheless did not approve the proposal."]],"vocab":[["das Vorfeld","prefield"],["die linke Klammer","left sentence bracket"],["das Mittelfeld","middle field"],["die rechte Klammer","right sentence bracket"],["das Nachfeld","postfield"],["der Ausschuss","committee"],["die Beratung","deliberation"],["zustimmen + Dat.","to approve / agree with"],["widersprechen + Dat.","to contradict / object"],["übersehen","to overlook"],["die Folge","consequence"],["die Beteiligten","parties involved"],["dennoch","nevertheless"],["bemerkenswert","remarkable"],["insofern","to that extent"]],"exercises":[{"t":"mcq","q":"The verbal frame is formed by:","opts":["left and right sentence brackets","subject and object only","two nouns","the prefield and postfield"],"a":0,"ex":""},{"t":"fill","q":"Der Ausschuss hat dem Vorschlag ___.","a":["zugestimmt"],"ex":""},{"t":"mcq","q":"A heavy subordinate clause may be placed in the:","opts":["Nachfeld","article field","case slot","prefix only"],"a":0,"ex":""},{"t":"tr","q":"It is remarkable that nobody objected.","a":["Es ist bemerkenswert, dass niemand widersprochen hat."],"ex":""},{"t":"order","q":"Arrange: “After lengthy deliberation the committee approved the proposal.”","tokens":["dem Vorschlag","nach langer Beratung","hat","der Ausschuss","zugestimmt"],"a":["Nach langer Beratung","hat","der Ausschuss","dem Vorschlag","zugestimmt"],"ex":""},{"t":"fill","q":"Was dabei ___ wurde, war die Folge.","a":["übersehen"],"ex":""},{"t":"mcq","q":"German readers often wait for the right bracket to learn:","opts":["the completing verb element","the noun gender","the speaker’s name","the punctuation rule"],"a":0,"ex":""},{"t":"fill","q":"Der Plan hätte geändert werden ___.","a":["können"],"ex":""}]},{"id":"c1u2","title":"Information structure","subtitle":"Use word order to control topic, focus and contrast","grammar":"<h3>The first position is discourse, not merely grammar<\/h3><p>The Vorfeld typically presents the topic, frame or contrast. Compare:<\/p><p><b>Der Vorstand<\/b> hat den Plan abgelehnt. — neutral actor topic<br><b>Den Plan<\/b> hat der Vorstand abgelehnt. — contrastive object<br><b>Gestern<\/b> hat der Vorstand den Plan abgelehnt. — temporal frame<\/p>\n<h3>Middle-field ordering<\/h3><p>Pronouns tend to precede full noun phrases; given information tends to precede new information. The mnemonic <b>TeKaMoLo<\/b>—temporal, causal, modal, local—is a useful default, not an iron law.<\/p>","examples":[["Den Vorschlag hat niemand ernst genommen.","Nobody took the proposal seriously."],["Gestern hat sie ihm das Ergebnis ausführlich erklärt.","Yesterday she explained the result to him in detail."],["Das wusste ich allerdings nicht.","That, however, I did not know."],["Nur unter dieser Voraussetzung ist eine Einigung möglich.","Only under this condition is agreement possible."],["Was die Kosten betrifft, müssen wir neu rechnen.","As far as costs are concerned, we must recalculate."],["Nicht der Preis, sondern die Qualität ist entscheidend.","It is not the price but the quality that is decisive."]],"vocab":[["der Vorstand","board / executive committee"],["ablehnen","to reject"],["ernst nehmen","to take seriously"],["ausführlich","in detail"],["allerdings","however / admittedly"],["die Voraussetzung","precondition"],["die Einigung","agreement"],["betreffen","to concern"],["entscheidend","decisive"],["sondern","but rather"],["hervorheben","to emphasise"],["der Schwerpunkt","focus / emphasis"],["gegeben","given"],["neu","new"],["kontrastiv","contrastive"]],"exercises":[{"t":"mcq","q":"The Vorfeld often signals:","opts":["topic, frame or contrast","only the subject","only time","the direct object always"],"a":0,"ex":""},{"t":"order","q":"Arrange with object contrast: “The plan, the board rejected.”","tokens":["hat","der Vorstand","den Plan","abgelehnt"],"a":["Den Plan","hat","der Vorstand","abgelehnt"],"ex":""},{"t":"fill","q":"Nicht der Preis, ___ die Qualität ist entscheidend.","a":["sondern"],"ex":""},{"t":"tr","q":"Only under this condition is agreement possible.","a":["Nur unter dieser Voraussetzung ist eine Einigung möglich."],"ex":""},{"t":"mcq","q":"TeKaMoLo is:","opts":["a useful default, not an absolute law","an exceptionless law","a tense system","a declension table"],"a":0,"ex":""},{"t":"fill","q":"Was die Kosten ___, müssen wir neu rechnen.","a":["betrifft"],"ex":""},{"t":"mcq","q":"Pronouns in the middle field tend to come:","opts":["before full noun phrases","after every noun","at the very end always","only in questions"],"a":0,"ex":""},{"t":"fill","q":"Das wusste ich ___ nicht. (however)","a":["allerdings"],"ex":""}]},{"id":"c1u3","title":"Advanced connectors","subtitle":"Express concession, limitation, consequence and reformulation","grammar":"<h3>Choose connectors by logic and syntax<\/h3><table class=\"gr\"><tr><th>Relation<\/th><th>Connector<\/th><th>Syntax<\/th><\/tr><tr><td>concession<\/td><td>obwohl / wenngleich<\/td><td>verb-final clause<\/td><\/tr><tr><td>concession<\/td><td>zwar … aber<\/td><td>paired main-clause elements<\/td><\/tr><tr><td>consequence<\/td><td>sodass<\/td><td>verb-final clause<\/td><\/tr><tr><td>restriction<\/td><td>insofern … als<\/td><td>correlative<\/td><\/tr><tr><td>reformulation<\/td><td>mit anderen Worten<\/td><td>sentence adverbial<\/td><\/tr><tr><td>addition<\/td><td>darüber hinaus<\/td><td>verb-second adverb<\/td><\/tr><\/table>\n<p>Advanced writing depends less on rare vocabulary than on making the logical relation between propositions exact.<\/p>","examples":[["Die Lösung ist zwar teuer, aber zuverlässig.","The solution is expensive, but reliable."],["Wenngleich die Daten begrenzt sind, lässt sich eine Tendenz erkennen.","Although the data are limited, a tendency can be identified."],["Die Frist wurde verlängert, sodass genügend Zeit blieb.","The deadline was extended, so sufficient time remained."],["Die Kritik ist insofern berechtigt, als der Bericht unvollständig ist.","The criticism is justified insofar as the report is incomplete."],["Darüber hinaus fehlen belastbare Zahlen.","Moreover, reliable figures are missing."],["Mit anderen Worten: Der Plan ist nicht finanzierbar.","In other words, the plan cannot be financed."]],"vocab":[["wenngleich","although"],["zwar … aber","admittedly … but"],["sodass","so that / with the result that"],["insofern … als","insofar as"],["darüber hinaus","moreover"],["mit anderen Worten","in other words"],["hingegen","by contrast"],["demgegenüber","in contrast"],["folglich","consequently"],["somit","thus"],["nichtsdestotrotz","nevertheless"],["berechtigt","justified"],["belastbar","robust / reliable"],["die Frist","deadline"],["finanzierbar","financially feasible"]],"exercises":[{"t":"fill","q":"Die Lösung ist ___ teuer, aber zuverlässig.","a":["zwar"],"ex":""},{"t":"fill","q":"Die Frist wurde verlängert, ___ genügend Zeit blieb.","a":["sodass"],"ex":""},{"t":"mcq","q":"<i>darüber hinaus<\/i> normally triggers:","opts":["verb-second main-clause order","verb-final order","no verb","imperative only"],"a":0,"ex":""},{"t":"tr","q":"In other words, the plan cannot be financed.","a":["Mit anderen Worten: Der Plan ist nicht finanzierbar."],"ex":""},{"t":"fill","q":"Die Kritik ist insofern berechtigt, ___ der Bericht unvollständig ist.","a":["als"],"ex":""},{"t":"mcq","q":"Advanced connectors chiefly make what precise?","opts":["the logical relation between propositions","noun gender","pronunciation","plural formation"],"a":0,"ex":""},{"t":"order","q":"Arrange: “Moreover, reliable figures are missing.”","tokens":["fehlen","darüber hinaus","belastbare Zahlen"],"a":["Darüber hinaus","fehlen","belastbare Zahlen"],"ex":""},{"t":"fill","q":"___ die Daten begrenzt sind, lässt sich eine Tendenz erkennen.","a":["Wenngleich"],"ex":""}]},{"id":"c1u4","title":"Collocations & idiomatic precision","subtitle":"Move from grammatical German to conventional German","grammar":"<h3>Words select partners<\/h3><p>Advanced fluency depends on collocations: German says <b>eine Entscheidung treffen<\/b>, <b>Zweifel äußern<\/b>, <b>Verantwortung übernehmen<\/b>, <b>eine Rolle spielen<\/b>.<\/p>\n<p>Literal translation often produces grammatical but non-idiomatic German. Record vocabulary as phrases and syntactic frames, not isolated words.<\/p>\n<h3>Idioms and register<\/h3><p>Idioms such as <b>den Nagel auf den Kopf treffen<\/b> are vivid but register-sensitive. In formal analysis, prefer precise collocations over decorative idioms.<\/p>","examples":[["Die Frage spielt eine zentrale Rolle.","The question plays a central role."],["Sie äußerte Zweifel an der Methode.","She expressed doubts about the method."],["Der Staat übernimmt Verantwortung.","The state assumes responsibility."],["Wir müssen Konsequenzen ziehen.","We must draw consequences."],["Damit triffst du den Nagel auf den Kopf.","You have hit the nail on the head."],["Die Untersuchung kommt zu dem Ergebnis, dass …","The study reaches the conclusion that …"]],"vocab":[["eine Rolle spielen","to play a role"],["Zweifel äußern","to express doubts"],["Verantwortung übernehmen","to assume responsibility"],["Konsequenzen ziehen","to draw consequences"],["zu einem Ergebnis kommen","to reach a conclusion"],["eine Frage aufwerfen","to raise a question"],["Maßnahmen ergreifen","to take measures"],["in Kauf nehmen","to accept / take into account as a cost"],["zur Sprache bringen","to raise for discussion"],["den Nagel auf den Kopf treffen","to hit the nail on the head"],["in den sauren Apfel beißen","to bite the bullet"],["der Zweifel","doubt"],["die Verantwortung","responsibility"],["die Konsequenz","consequence"],["die Maßnahme","measure"]],"exercises":[{"t":"fill","q":"eine zentrale Rolle ___","a":["spielen"],"ex":""},{"t":"fill","q":"Zweifel an der Methode ___","a":["äußern"],"ex":""},{"t":"tr","q":"We must draw consequences.","a":["Wir müssen Konsequenzen ziehen."],"ex":""},{"t":"mcq","q":"Advanced vocabulary is best recorded as:","opts":["phrases and syntactic frames","isolated translations only","alphabetical letters","pronunciation without meaning"],"a":0,"ex":""},{"t":"fill","q":"Verantwortung ___","a":["übernehmen"],"ex":""},{"t":"order","q":"Arrange: “The study reaches the conclusion that …”","tokens":["kommt","die Untersuchung","zu dem Ergebnis"],"a":["Die Untersuchung","kommt","zu dem Ergebnis"],"ex":""},{"t":"mcq","q":"Idioms are especially sensitive to:","opts":["register and context","grammatical gender only","plural endings only","capitalisation only"],"a":0,"ex":""},{"t":"fill","q":"eine Frage ___","a":["aufwerfen"],"ex":""}]},{"id":"c1u5","title":"Register and varieties","subtitle":"Navigate formal, colloquial, Austrian and Swiss usage","grammar":"<h3>Standard German is pluricentric<\/h3><p>Germany, Austria and Switzerland share Standard German but differ in vocabulary, pronunciation and some conventions.<\/p>\n<table class=\"gr\"><tr><th>Germany<\/th><th>Austria<\/th><th>Switzerland<\/th><\/tr><tr><td>Brötchen<\/td><td>Semmel<\/td><td>Brötli<\/td><\/tr><tr><td>Januar<\/td><td>Jänner<\/td><td>Januar<\/td><\/tr><tr><td>Fahrrad<\/td><td>Fahrrad<\/td><td>Velo<\/td><\/tr><\/table>\n<p>Swiss Standard German normally writes <b>ss<\/b> instead of <b>ß<\/b>. Spoken Swiss German dialects differ substantially from the written standard.<\/p>\n<h3>Register choices<\/h3><p><b>kriegen<\/b> is colloquial where <b>bekommen/erhalten<\/b> may be neutral or formal. <b>wegen dem<\/b> is widespread colloquially; formal edited prose generally prefers <b>wegen des<\/b>.<\/p>","examples":[["Ich habe die Unterlagen erhalten.","I have received the documents. formal"],["Ich hab die Sachen gekriegt.","I got the things. colloquial"],["In Österreich sagt man oft Jänner.","In Austria people often say Jänner."],["In der Schweiz fährt man mit dem Velo.","In Switzerland one rides a bicycle."],["Bitte teilen Sie uns Ihre Entscheidung mit.","Please inform us of your decision. formal"],["Sag mir einfach Bescheid.","Just let me know. informal"]],"vocab":[["erhalten","to receive formal"],["bekommen","to receive neutral"],["kriegen","to get colloquial"],["Bescheid sagen","to let someone know"],["mitteilen","to communicate / inform"],["das Brötchen","bread roll Germany"],["die Semmel","bread roll Austria"],["das Velo","bicycle Switzerland"],["Jänner","January Austria"],["ß / ss","orthographic variants"],["umgangssprachlich","colloquial"],["formell","formal"],["neutral","neutral"],["die Standardsprache","standard language"],["der Dialekt","dialect"]],"exercises":[{"t":"mcq","q":"Swiss Standard German normally uses:","opts":["ss instead of ß","ß instead of ss","no capital nouns","English spelling"],"a":0,"ex":""},{"t":"fill","q":"In Österreich sagt man oft ___.","a":["Jänner"],"ex":""},{"t":"mcq","q":"Most formal for “receive”:","opts":["erhalten","kriegen","abkriegen","schnappen"],"a":0,"ex":""},{"t":"tr","q":"Just let me know.","a":["Sag mir einfach Bescheid."],"ex":""},{"t":"fill","q":"In der Schweiz fährt man mit dem ___.","a":["Velo"],"ex":""},{"t":"mcq","q":"Standard German is:","opts":["pluricentric","identical everywhere","spoken only in Germany","without regional vocabulary"],"a":0,"ex":""},{"t":"order","q":"Arrange: “Please inform us of your decision.”","tokens":["Ihre Entscheidung","bitte","teilen Sie","uns","mit"],"a":["Bitte","teilen Sie","uns","Ihre Entscheidung","mit"],"ex":""},{"t":"fill","q":"Ich habe die Unterlagen ___. (formal)","a":["erhalten"],"ex":""}]},{"id":"c1u6","title":"Argument and analysis","subtitle":"Write measured, structured and evidence-sensitive German","grammar":"<h3>Structure an argument<\/h3><p>A strong analytical paragraph often moves through: <b>These — Begründung — Beleg — Einschränkung — Schlussfolgerung<\/b>.<\/p>\n<p>Useful frames:<\/p><ul><li><b>Es spricht vieles dafür, dass …<\/b><\/li><li><b>Dem lässt sich entgegenhalten, dass …<\/b><\/li><li><b>Die vorliegenden Daten legen nahe, dass …<\/b><\/li><li><b>Daraus folgt jedoch nicht zwingend, dass …<\/b><\/li><li><b>Unter der Voraussetzung, dass …<\/b><\/li><\/ul>\n<h3>Calibrated claims<\/h3><p>Distinguish <b>beweisen<\/b> (prove), <b>belegen<\/b> (substantiate), <b>darauf hindeuten<\/b> (indicate) and <b>nahelegen<\/b> (suggest). Advanced prose earns trust by matching the strength of the verb to the evidence.<\/p>","examples":[["Es spricht vieles dafür, dass die Reform wirksam war.","There is much to suggest that the reform was effective."],["Dem lässt sich entgegenhalten, dass die Stichprobe klein war.","It can be objected that the sample was small."],["Die Daten legen einen Zusammenhang nahe.","The data suggest a relationship."],["Daraus folgt nicht zwingend eine Kausalität.","Causation does not necessarily follow from this."],["Unter dieser Voraussetzung ist die Schlussfolgerung plausibel.","Under this assumption, the conclusion is plausible."],["Die Behauptung ist bislang nicht hinreichend belegt.","The claim has not yet been sufficiently substantiated."]],"vocab":[["die These","thesis / proposition"],["die Begründung","reasoning / justification"],["der Beleg","evidence / substantiation"],["die Einschränkung","qualification / limitation"],["die Schlussfolgerung","conclusion"],["beweisen","to prove"],["belegen","to substantiate"],["darauf hindeuten","to indicate"],["nahelegen","to suggest"],["zwingend","compelling / necessarily"],["hinreichend","sufficient"],["die Stichprobe","sample"],["der Zusammenhang","relationship"],["die Kausalität","causation"],["plausibel","plausible"]],"exercises":[{"t":"fill","q":"Die Daten ___ einen Zusammenhang nahe.","a":["legen"],"ex":""},{"t":"mcq","q":"Which is the strongest evidential verb?","opts":["beweisen","nahelegen","darauf hindeuten","vermuten"],"a":0,"ex":""},{"t":"tr","q":"Causation does not necessarily follow from this.","a":["Daraus folgt nicht zwingend eine Kausalität."],"ex":""},{"t":"fill","q":"Dem lässt sich ___, dass die Stichprobe klein war.","a":["entgegenhalten"],"ex":""},{"t":"mcq","q":"A calibrated claim should:","opts":["match the verb’s strength to the evidence","always say “prove”","avoid qualifications","use the longest sentence possible"],"a":0,"ex":""},{"t":"order","q":"Arrange: “The claim is not sufficiently substantiated.”","tokens":["nicht hinreichend","die Behauptung","belegt","ist"],"a":["Die Behauptung","ist","nicht hinreichend","belegt"],"ex":""},{"t":"fill","q":"Unter dieser ___ ist die Schlussfolgerung plausibel.","a":["Voraussetzung"],"ex":""},{"t":"mcq","q":"<i>belegen<\/i> is best translated as:","opts":["substantiate","guess","deny","command"],"a":0,"ex":""}]}]}];

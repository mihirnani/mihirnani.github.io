function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function allUnits(){return COURSE.flatMap(l=>l.units.map(u=>({...u,level:l})))}
function allCards(){return COURSE.flatMap(l=>l.units.flatMap(u=>u.vocab.map((v,i)=>({id:u.id+":"+i,de:v[0],en:v[1],level:l,unit:u}))))}
const unitIds=new Set(allUnits().map(u=>u.id)),cardIds=new Set(allCards().map(c=>c.id));
function sanitize(x){const o=clone(DEFAULTS);if(!x||typeof x!=="object")return o;for(const id of unitIds)if(x.completed&&x.completed[id]===true)o.completed[id]=true;for(const id of unitIds)if(x.scores&&Number.isFinite(x.scores[id]))o.scores[id]=Math.max(0,Math.min(100,Math.round(x.scores[id])));for(const id of cardIds){const r=x.srs&&x.srs[id];if(r&&typeof r==="object")o.srs[id]={rep:Math.max(0,Math.min(99999,+r.rep||0)),ease:Math.max(1.3,Math.min(3,+r.ease||2.5)),int:Math.max(0,Math.min(36500,+r.int||0)),due:Math.max(0,+r.due||0)}}o.reviews=Math.max(0,+x.reviews||0);o.streak=Math.max(0,+x.streak||0);o.bestStreak=Math.max(o.streak,+x.bestStreak||0);o.lastDay=/^\d{4}-\d{2}-\d{2}$/.test(x.lastDay||"")?x.lastDay:null;if(x.settings){if(["auto","light","dark"].includes(x.settings.theme))o.settings.theme=x.settings.theme;if(["de2en","en2de","mix"].includes(x.settings.dir))o.settings.dir=x.settings.dir;if([5,10,15,20,30,50].includes(+x.settings.newPerDay))o.settings.newPerDay=+x.settings.newPerDay;for(const l of COURSE)if(typeof x.settings.levels?.[l.id]==="boolean")o.settings.levels[l.id]=x.settings.levels[l.id]}if(x.newIntro&&typeof x.newIntro==="object")for(const[k,v]of Object.entries(x.newIntro))if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isFinite(v))o.newIntro[k]=Math.max(0,Math.min(1000,v));return o}
const store={data:clone(DEFAULTS),memOnly:false,load(){try{const r=localStorage.getItem(STORE_KEY);if(r)this.data=sanitize(JSON.parse(r));localStorage.setItem(STORE_KEY+"-probe","1");localStorage.removeItem(STORE_KEY+"-probe")}catch(e){this.memOnly=true}},save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(this.data))}catch(e){this.memOnly=true}}};store.load();
function activity(){const t=today(),last=store.data.lastDay;if(last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");store.data.streak=last===ys?store.data.streak+1:1;store.data.bestStreak=Math.max(store.data.bestStreak,store.data.streak);store.data.lastDay=t;store.save()}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
function speak(text){if(!("speechSynthesis" in window))return toast("Speech is unavailable in this browser.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.88;speechSynthesis.speak(u)}
function sp(text){const arg=JSON.stringify(text).replace(/&/g,'&amp;').replace(/\"/g,'&quot;');return `<button class="speak" title="Listen" aria-label="Listen to German" onclick="speak(${arg})">🔊</button>`}
function route(){return location.hash.replace(/^#\/?/,"")||"home"}function go(r){location.hash="#/"+r;document.getElementById("sidebar").classList.remove("open")}
function activePrefix(r,p){return r===p||r.startsWith(p+"/")}
function renderSidebar(){const r=route(),done=Object.keys(store.data.completed).length,total=allUnits().length;document.getElementById("sidebar").innerHTML=`<div class="brand"><span class="flag"><i></i><i></i><i></i></span><div><b>Deutsch lernen</b><small>A1 foundations → C1 topics</small></div></div><div class="navsec">Course</div>${nav("home","⌂","Dashboard")}${COURSE.map(l=>nav("level/"+l.id,l.icon,l.short+" · "+l.tagline,levelDone(l)+"/"+l.units.length)).join("")}<div class="navsec">Practice</div>${nav("flash","◫","Flashcards",dueCards().length+" due")}${nav("labs","⚙","Grammar labs")}${nav("verbs","V","Verb tables")}${nav("phrases","💬","Phrasebook")}<div class="navsec">Data</div>${nav("settings","⚙","Settings",done+"/"+total)}`}
function nav(r,ic,label,badge=""){const a=activePrefix(route(),r)?" active":"";return `<button class="navlink${a}" onclick="go('${r}')"><span class="ic">${ic}</span>${label}${badge?`<span class="badge">${badge}</span>`:""}</button>`}
function levelDone(l){return l.units.filter(u=>store.data.completed[u.id]).length}
function render(){applyTheme();renderSidebar();const r=route().split("/");let out="";if(r[0]==="home")out=viewHome();else if(r[0]==="level")out=viewLevel(r[1]);else if(r[0]==="unit")out=viewUnit(r[1],r[2]||"lesson");else if(r[0]==="quiz")out=viewQuiz(r[1]);else if(r[0]==="flash")out=viewFlash();else if(r[0]==="flashrun"){startFlash();return}else if(r[0]==="labs")out=viewLabs(r[1]||"case");else if(r[0]==="verbs")out=viewVerbs();else if(r[0]==="phrases")out=viewPhrases();else if(r[0]==="settings")out=viewSettings();else out=viewHome();document.getElementById("main").innerHTML=(store.memOnly?`<div class="banner">Storage is blocked. Export progress before closing this page.</div>`:"")+out;document.getElementById("main").focus({preventScroll:true});if(r[0]==="labs")updateLab(r[1]||"case")}
function viewHome(){const done=Object.keys(store.data.completed).length,total=allUnits().length,due=dueCards().length;return `<h1>Deutsch lernen</h1><p class="sub">A structured German course built around the features that make German intellectually distinctive: case, agreement, verbal brackets and clause architecture.</p><div class="statrow"><div class="stat"><div class="v">${done}/${total}</div><div class="l">units completed</div></div><div class="stat"><div class="v">${due}</div><div class="l">flashcards due</div></div><div class="stat"><div class="v">${store.data.streak}</div><div class="l">day streak</div></div><div class="stat"><div class="v">${store.data.reviews}</div><div class="l">reviews completed</div></div></div>${COURSE.map(l=>{const d=levelDone(l),p=Math.round(100*d/l.units.length);return `<div class="card levelcard" onclick="go('level/${l.id}')"><div class="leveltop"><b>${l.icon} ${l.label}</b><span>${l.tagline}</span><span class="pct">${p}%</span></div><p class="sub" style="margin:5px 0 10px">${l.desc}</p><div class="progress"><i style="width:${p}%"></i></div></div>`}).join("")}<div class="card"><b>Why this course is different</b><p style="margin-bottom:0;color:var(--ink2)">The dedicated laboratories generate case forms, adjective endings and sentence order. Every noun is taught with its article and plural; governed verbs are taught with their preposition and case.</p></div>`}
function findLevel(id){return COURSE.find(l=>l.id===id)}function findUnit(id){for(const l of COURSE){const u=l.units.find(x=>x.id===id);if(u)return{...u,level:l}}}
function viewLevel(id){const l=findLevel(id);if(!l)return viewHome();return `<h1>${l.icon} ${l.label}</h1><p class="sub">${l.desc}</p>${l.units.map((u,i)=>`<div class="unitrow ${store.data.completed[u.id]?"done":""}" onclick="go('unit/${u.id}/lesson')"><span class="unitnum">${store.data.completed[u.id]?"✓":i+1}</span><span class="unittxt"><b>${u.title}</b><small>${u.subtitle}</small></span>${store.data.scores[u.id]!=null?`<span class="score">${store.data.scores[u.id]}%</span>`:""}</div>`).join("")}`}
function viewUnit(id,tab){const u=findUnit(id);if(!u)return viewHome();const tabs=[['lesson','Lesson'],['vocab','Vocabulary'],['examples','Examples'],['practice','Practice']];let body="";if(tab==='lesson')body=`<div class="card">${u.grammar}</div>`;if(tab==='vocab')body=`<div class="card"><table class="vocab">${u.vocab.map(v=>`<tr><td>${esc(v[0])} ${sp(v[0].replace(/ ·.*/,""))}</td><td>${esc(v[1])}</td></tr>`).join("")}</table></div>`;if(tab==='examples')body=`<div class="card">${u.examples.map(x=>`<div class="example"><b>${esc(x[0])}</b> ${sp(x[0])}<span class="en">${esc(x[1])}</span></div>`).join("")}</div>`;if(tab==='practice')body=`<div class="card"><p>${u.exercises.length} mixed exercises test structure, form and translation.</p><button class="btn primary" onclick="go('quiz/${u.id}')">Start unit practice →</button>${store.data.scores[u.id]!=null?` <span class="pill">best ${store.data.scores[u.id]}%</span>`:""}</div>`;return `<span class="pill acc">${u.level.short}</span><h1 style="margin-top:8px">${u.title}</h1><p class="sub">${u.subtitle}</p><div class="tabs">${tabs.map(t=>`<button class="tab ${tab===t[0]?"active":""}" onclick="go('unit/${u.id}/${t[0]}')">${t[1]}</button>`).join("")}</div>${body}<div style="display:flex;justify-content:space-between;gap:10px;margin-top:20px"><button class="btn" onclick="go('level/${u.level.id}')">← Level</button><button class="btn primary" onclick="toggleDone('${u.id}')">${store.data.completed[u.id]?"Completed ✓":"Mark complete"}</button></div>`}
function toggleDone(id){if(store.data.completed[id])delete store.data.completed[id];else{store.data.completed[id]=true;activity()}store.save();render()}
let quiz=null;function viewQuiz(id){const u=findUnit(id);if(!u)return viewHome();quiz={u,i:0,score:0,answered:false,order:[]};setTimeout(renderQuestion,0);return `<h1>${u.title}</h1><div id="quizbox"></div>`}
function renderQuestion(){if(!quiz)return;const box=document.getElementById("quizbox");if(quiz.i>=quiz.u.exercises.length){const pct=Math.round(100*quiz.score/quiz.u.exercises.length);store.data.scores[quiz.u.id]=Math.max(store.data.scores[quiz.u.id]||0,pct);if(pct>=75)store.data.completed[quiz.u.id]=true;activity();store.save();box.innerHTML=`<div class="card" style="text-align:center;padding:32px"><div style="font-size:52px;font-weight:850">${pct}%</div><p>${quiz.score} of ${quiz.u.exercises.length} correct.${pct>=75?" Unit marked complete.":" Review the lesson and try again."}</p><button class="btn primary" onclick="go('unit/${quiz.u.id}/lesson')">Back to unit</button></div>`;renderSidebar();return}const e=quiz.u.exercises[quiz.i],n=quiz.i+1;let controls="";if(e.t==='mcq')controls=`<div class="opts">${e.opts.map((o,i)=>`<button class="opt" onclick="answerMCQ(${i})">${o}</button>`).join("")}</div>`;else if(e.t==='order'){quiz.order=[];controls=`<div class="orderanswer" id="orderanswer"></div><div class="orderbank" id="orderbank">${shuffle(e.tokens).map((t,i)=>`<button class="token" data-token="${esc(t)}" onclick="moveToken(this)">${esc(t)}</button>`).join("")}</div><button class="btn small" style="margin-top:9px" onclick="checkOrder()">Check order</button>`}else controls=`<div class="answerrow"><input id="textans" autocomplete="off" placeholder="Type your answer" onkeydown="if(event.key==='Enter')answerText()"><button class="btn primary" onclick="answerText()">Check</button></div>`;box.innerHTML=`<div class="progress"><i style="width:${100*quiz.i/quiz.u.exercises.length}%"></i></div><div class="exercise"><span class="pill">${n}/${quiz.u.exercises.length}</span><p style="font-size:16.5px">${e.q}</p>${controls}<div id="fb"></div></div><button class="btn" onclick="go('unit/${quiz.u.id}/practice')">End practice</button>`;if(e.t==='fill'||e.t==='tr')setTimeout(()=>document.getElementById('textans')?.focus(),0)}
function norm(s){return String(s).toLowerCase().trim().replace(/[.!?;,]/g,"").replace(/\s+/g," ").replace(/[’]/g,"'")}
function finishAnswer(ok,correct,ex=""){if(quiz.answered)return;quiz.answered=true;if(ok)quiz.score++;activity();const fb=document.getElementById("fb");fb.innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}${!ok&&correct?` Correct: <b>${esc(correct)}</b>`:""}${ex?`<small>${ex}</small>`:""}</div><button class="btn primary small" style="margin-top:9px" onclick="nextQuestion()">Next →</button>`}
function answerMCQ(i){if(quiz.answered)return;const e=quiz.u.exercises[quiz.i];document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===e.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});finishAnswer(i===e.a,e.opts[e.a],e.ex)}
function answerText(){if(quiz.answered)return;const e=quiz.u.exercises[quiz.i],v=document.getElementById('textans').value,ok=e.a.some(a=>norm(a)===norm(v));finishAnswer(ok,e.a[0],e.ex)}
function moveToken(btn){const a=document.getElementById('orderanswer'),b=document.getElementById('orderbank');if(btn.parentElement===b){a.appendChild(btn);quiz.order.push(btn.dataset.token)}else{b.appendChild(btn);quiz.order=quiz.order.filter((_,i)=>i!==Array.from(a.children).indexOf(btn))}}
function checkOrder(){if(quiz.answered)return;const e=quiz.u.exercises[quiz.i];const got=Array.from(document.getElementById('orderanswer').children).map(x=>x.dataset.token);finishAnswer(norm(got.join(' '))===norm(e.a.join(' ')),e.a.join(' '),e.ex)}
function nextQuestion(){quiz.i++;quiz.answered=false;renderQuestion()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function srsState(id){return store.data.srs[id]}function enabledCards(){return allCards().filter(c=>store.data.settings.levels[c.level.id])}function dueCards(){const now=Date.now();return enabledCards().filter(c=>srsState(c.id)&&srsState(c.id).due<=now)}function freshCards(){return enabledCards().filter(c=>!srsState(c.id))}function newLeft(){return Math.max(0,store.data.settings.newPerDay-(store.data.newIntro[today()]||0))}
function viewFlash(){const due=dueCards().length,fresh=Math.min(newLeft(),freshCards().length);return `<h1>◫ Spaced-repetition flashcards</h1><p class="sub">German nouns include article and plural; governed verbs include their preposition and case.</p><div class="statrow"><div class="stat"><div class="v">${due}</div><div class="l">due now</div></div><div class="stat"><div class="v">${fresh}</div><div class="l">new today</div></div><div class="stat"><div class="v">${enabledCards().length}</div><div class="l">enabled cards</div></div></div><div class="card"><b>Direction</b><p><select onchange="store.data.settings.dir=this.value;store.save();render()">${[['de2en','German → English'],['en2de','English → German'],['mix','Mixed']].map(x=>`<option value="${x[0]}" ${store.data.settings.dir===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select> &nbsp; New/day: <select onchange="store.data.settings.newPerDay=+this.value;store.save();render()">${[5,10,15,20,30,50].map(n=>`<option ${store.data.settings.newPerDay===n?'selected':''}>${n}</option>`).join('')}</select></p><p>${COURSE.map(l=>`<label style="margin-right:12px"><input type="checkbox" ${store.data.settings.levels[l.id]?'checked':''} onchange="store.data.settings.levels['${l.id}']=this.checked;store.save();render()"> ${l.short}</label>`).join('')}</p><button class="btn primary" onclick="go('flashrun')" ${due+fresh===0?'disabled':''}>${due+fresh?`Study ${due+fresh} cards →`:'All done for today'}</button></div>`}
let fc=null;function startFlash(){const due=shuffle(dueCards()),fresh=shuffle(freshCards()).slice(0,newLeft());const q=due.concat(fresh);if(!q.length){go('flash');return}fc={q,i:0,reveal:false,newIds:new Set(fresh.map(x=>x.id))};renderFlashCard()}
function renderFlashCard(){const m=document.getElementById('main');if(fc.i>=fc.q.length){m.innerHTML=`<div class="card" style="text-align:center;padding:35px"><div style="font-size:45px">✓</div><h1>${fc.q.length} reviews</h1><p>Session complete.</p><button class="btn primary" onclick="fc=null;go('flash')">Back</button></div>`;renderSidebar();return}const c=fc.q[fc.i];if(!fc.dir)fc.dir=store.data.settings.dir==='mix'?(Math.random()<.5?'de2en':'en2de'):store.data.settings.dir;const dir=fc.dir,front=dir==='de2en'?c.de:c.en,back=dir==='de2en'?c.en:c.de;m.innerHTML=`<div class="flashstage"><p class="sub">${fc.i+1}/${fc.q.length} · ${c.level.short} · ${c.unit.title}</p><div class="progress" style="margin-bottom:13px"><i style="width:${100*fc.i/fc.q.length}%"></i></div><div class="flashcard" tabindex="0" onclick="fc.reveal=true;renderFlashCard()"><div class="front">${esc(front)} ${dir==='de2en'?sp(c.de.replace(/ ·.*/,'')):''}</div>${fc.reveal?`<div class="back">${esc(back)} ${dir==='en2de'?sp(c.de.replace(/ ·.*/,'')):''}</div>`:`<small style="color:var(--muted);margin-top:18px">tap to reveal</small>`}</div>${fc.reveal?`<div class="grades"><button onclick="grade(0)">Again<small>1</small></button><button onclick="grade(1)">Hard<small>2</small></button><button onclick="grade(2)">Good<small>3</small></button><button onclick="grade(3)">Easy<small>4</small></button></div>`:''}<p style="text-align:center"><a href="#/flash" onclick="fc=null">End session</a></p></div>`}
function grade(g){const c=fc.q[fc.i],s=srsState(c.id)||{rep:0,ease:2.5,int:0,due:0};if(fc.newIds.has(c.id)){store.data.newIntro[today()]=(store.data.newIntro[today()]||0)+1;fc.newIds.delete(c.id)}if(g===0){s.rep=0;s.int=0;s.due=Date.now()+10*60*1000;fc.q.push(c)}else{s.rep++;s.ease=Math.max(1.3,s.ease+(g===1?-.15:g===3?.15:0));s.int=s.rep===1?(g===1?1:g===3?4:2):Math.max(1,Math.round((s.int||1)*s.ease*(g===1?.7:g===3?1.3:1)));s.due=Date.now()+s.int*86400000}store.data.srs[c.id]=s;store.data.reviews++;activity();store.save();fc.i++;fc.reveal=false;fc.dir=null;renderFlashCard()}
document.addEventListener('keydown',e=>{if(!fc||route()!=='flashrun')return;if(e.code==='Space'&&!fc.reveal){e.preventDefault();fc.reveal=true;renderFlashCard()}else if(fc.reveal&&['1','2','3','4'].includes(e.key))grade(+e.key-1)});
const articles={def:{nom:{m:'der',f:'die',n:'das',p:'die'},acc:{m:'den',f:'die',n:'das',p:'die'},dat:{m:'dem',f:'der',n:'dem',p:'den'},gen:{m:'des',f:'der',n:'des',p:'der'}},ind:{nom:{m:'ein',f:'eine',n:'ein',p:'keine'},acc:{m:'einen',f:'eine',n:'ein',p:'keine'},dat:{m:'einem',f:'einer',n:'einem',p:'keinen'},gen:{m:'eines',f:'einer',n:'eines',p:'keiner'}},none:{nom:{m:'',f:'',n:'',p:''},acc:{m:'',f:'',n:'',p:''},dat:{m:'',f:'',n:'',p:''},gen:{m:'',f:'',n:'',p:''}}};
const adjEnd={def:{nom:{m:'e',f:'e',n:'e',p:'en'},acc:{m:'en',f:'e',n:'e',p:'en'},dat:{m:'en',f:'en',n:'en',p:'en'},gen:{m:'en',f:'en',n:'en',p:'en'}},ind:{nom:{m:'er',f:'e',n:'es',p:'en'},acc:{m:'en',f:'e',n:'es',p:'en'},dat:{m:'en',f:'en',n:'en',p:'en'},gen:{m:'en',f:'en',n:'en',p:'en'}},none:{nom:{m:'er',f:'e',n:'es',p:'e'},acc:{m:'en',f:'e',n:'es',p:'e'},dat:{m:'em',f:'er',n:'em',p:'en'},gen:{m:'en',f:'er',n:'en',p:'er'}}};
function viewLabs(which){const tabs=[['case','Case explorer'],['ending','Ending generator'],['order','Word-order lab']];let body=which==='case'?caseLab():which==='ending'?endingLab():orderLab();return `<h1>⚙ Grammar laboratories</h1><p class="sub">Generate forms and manipulate structures instead of merely rereading rules.</p><div class="tabs">${tabs.map(t=>`<button class="tab ${which===t[0]?'active':''}" onclick="go('labs/${t[0]}')">${t[1]}</button>`).join('')}</div>${body}`}
function caseLab(){return `<div class="card"><h2 style="margin-top:0">Article and case explorer</h2><div class="labgrid"><label>Case<select id="cl-case" onchange="updateLab('case')"><option value="nom">Nominative</option><option value="acc">Accusative</option><option value="dat">Dative</option><option value="gen">Genitive</option></select></label><label>Gender / number<select id="cl-gender" onchange="updateLab('case')"><option value="m">Masculine</option><option value="f">Feminine</option><option value="n">Neuter</option><option value="p">Plural</option></select></label><label>Article system<select id="cl-art" onchange="updateLab('case')"><option value="def">Definite</option><option value="ind">ein-word / kein</option></select></label><label>Noun<input id="cl-noun" value="Mann" oninput="updateLab('case')"></label></div><div class="resultbox" id="labresult"></div></div><div class="card matrix"><h3 style="margin-top:0">Core article matrix</h3><table class="gr"><tr><th></th><th>Masculine</th><th>Feminine</th><th>Neuter</th><th>Plural</th></tr><tr><th>Nominative</th><td>der / ein</td><td>die / eine</td><td>das / ein</td><td>die</td></tr><tr><th>Accusative</th><td>den / einen</td><td>die / eine</td><td>das / ein</td><td>die</td></tr><tr><th>Dative</th><td>dem / einem</td><td>der / einer</td><td>dem / einem</td><td>den + -n</td></tr><tr><th>Genitive</th><td>des / eines + -(e)s</td><td>der / einer</td><td>des / eines + -(e)s</td><td>der</td></tr></table></div>`}
function endingLab(){return `<div class="card"><h2 style="margin-top:0">Adjective-ending generator</h2><div class="labgrid"><label>Case<select id="el-case" onchange="updateLab('ending')"><option value="nom">Nominative</option><option value="acc">Accusative</option><option value="dat">Dative</option><option value="gen">Genitive</option></select></label><label>Gender / number<select id="el-gender" onchange="updateLab('ending')"><option value="m">Masculine</option><option value="f">Feminine</option><option value="n">Neuter</option><option value="p">Plural</option></select></label><label>Article type<select id="el-art" onchange="updateLab('ending')"><option value="def">der-word</option><option value="ind">ein-word</option><option value="none">no article</option></select></label><label>Adjective<input id="el-adj" value="gut" oninput="updateLab('ending')"></label><label>Noun<input id="el-noun" value="Mann" oninput="updateLab('ending')"></label></div><div class="resultbox" id="labresult"></div></div><div class="card"><p><b>Diagnostic rule:</b> the noun phrase must visibly mark case, gender and number. A fully informative article permits a weak adjective ending; without an article, the adjective carries the signal.</p></div>`}
const orderTasks=[['Heute','arbeitet','sie','zu Hause'],['Weil es regnet','bleiben','wir','zu Hause'],['Ich','habe','das Buch','gestern','gelesen'],['Morgen','muss','ich','früh','aufstehen'],['Den Vorschlag','hat','der Ausschuss','abgelehnt'],['Obwohl er müde war','arbeitete','er','weiter']];let oi=0,ob=[];
function orderLab(){const t=orderTasks[oi];return `<div class="card"><h2 style="margin-top:0">Build the sentence</h2><p>Click the blocks in the correct order.</p><div class="orderanswer" id="olabans"></div><div class="orderbank" id="olabbank">${shuffle(t).map(x=>`<button class="token" data-token="${esc(x)}" onclick="olabMove(this)">${esc(x)}</button>`).join('')}</div><div id="olabfb"></div><button class="btn small" style="margin-top:10px" onclick="olabCheck()">Check</button> <button class="btn small" style="margin-top:10px" onclick="oi=(oi+1)%orderTasks.length;render()">Next sentence</button></div><div class="card"><p><b>Question to ask:</b> Where is the finite verb? Where is the right bracket? Does an entire subordinate clause occupy position 1?</p></div>`}
function updateLab(which){const r=document.getElementById('labresult');if(!r)return;if(which==='case'){const c=document.getElementById('cl-case').value,g=document.getElementById('cl-gender').value,a=document.getElementById('cl-art').value,n=document.getElementById('cl-noun').value||'Nomen';const note=c==='dat'&&g==='p'?'Dative plural usually adds <b>-n</b> to the noun when possible.':c==='gen'&&(g==='m'||g==='n')?'Masculine and neuter genitive nouns usually add <b>-(e)s</b>.':'';r.innerHTML=`<div class="big">${articles[a][c][g]} ${esc(n)}</div><p>${({nom:'subject / predicate noun',acc:'direct object or accusative preposition',dat:'recipient, location or dative government',gen:'possession or genitive government'})[c]}${note?' · '+note:''}</p>`}else{const c=document.getElementById('el-case').value,g=document.getElementById('el-gender').value,a=document.getElementById('el-art').value,adj=document.getElementById('el-adj').value||'gut',n=document.getElementById('el-noun').value||'Nomen',art=articles[a][c][g],end=adjEnd[a][c][g];r.innerHTML=`<div class="big">${art?art+' ':''}${esc(adj)}<span style="color:var(--accent)">${end}</span> ${esc(n)}</div><p>${a==='def'?'weak':a==='ind'?'mixed':'strong'} declension · ending <b>-${end}</b></p>`}}
function olabMove(btn){const a=document.getElementById('olabans'),b=document.getElementById('olabbank');(btn.parentElement===b?a:b).appendChild(btn)}function olabCheck(){const got=Array.from(document.getElementById('olabans').children).map(x=>x.dataset.token),ok=norm(got.join(' '))===norm(orderTasks[oi].join(' '));document.getElementById('olabfb').innerHTML=`<div class="feedback ${ok?'ok':'no'}">${ok?'Correct.':'Correct order: '+esc(orderTasks[oi].join(' '))}</div>`}
function viewVerbs(){return `<h1>V Verb tables</h1><p class="sub">Present forms, narrative past, participle, auxiliary, Konjunktiv II and imperative.</p><input class="search" placeholder="Search verbs…" oninput="filterVerbs(this.value)"><div id="verblist">${verbList('')}</div>`}
function verbList(q){q=q.toLowerCase().trim();const pron=['ich','du','er/sie/es','wir','ihr','sie/Sie'];return VERBS.filter(v=>!q||v.inf.includes(q)||v.en.toLowerCase().includes(q)).map(v=>`<div class="card"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><b style="font-size:19px;color:var(--accent)">${v.inf}</b>${sp(v.inf)}<span>${v.en}</span><span class="pill">Prät. ${v.pret}</span><span class="pill">Part. ${v.pp}</span><span class="pill">${v.aux}</span></div><table class="gr"><tr><th></th><th>Present</th></tr>${pron.map((p,i)=>`<tr><th>${p}</th><td>${v.pres[i]}</td></tr>`).join('')}<tr><th>Konjunktiv II</th><td>${v.k2}</td></tr><tr><th>Imperative</th><td>${v.imp}</td></tr></table></div>`).join('')||'<p>No match.</p>'}function filterVerbs(q){document.getElementById('verblist').innerHTML=verbList(q)}
function viewPhrases(){return `<h1>💬 Phrasebook</h1><p class="sub">Practical phrases for travel, work and everyday life.</p><input class="search" placeholder="Search phrases…" oninput="filterPhrases(this.value)"><div id="plist">${phraseList('')}</div>`}function phraseList(q){q=q.toLowerCase().trim();return PHRASES.map(c=>{const it=c.items.filter(x=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));return it.length?`<h3>${c.cat}</h3><div class="card">${it.map(x=>`<div class="example"><b>${esc(x[0])}</b> ${sp(x[0])}<span class="en">${esc(x[1])}</span></div>`).join('')}</div>`:''}).join('')||'<p>No match.</p>'}function filterPhrases(q){document.getElementById('plist').innerHTML=phraseList(q)}
function viewSettings(){const size=(JSON.stringify(store.data).length/1024).toFixed(1);return `<h1>⚙ Settings & data</h1><div class="card"><b>Appearance</b><p>Theme: <select onchange="store.data.settings.theme=this.value;store.save();render()">${['auto','light','dark'].map(t=>`<option ${store.data.settings.theme===t?'selected':''}>${t}</option>`).join('')}</select></p></div><div class="card"><b>Backup & restore</b><p>Your progress is stored locally. The backup file is about ${size} KB.</p><button class="btn primary" onclick="exportData()">Export progress</button> <button class="btn" onclick="document.getElementById('importfile').click()">Import progress</button></div><div class="card"><b>About</b><p>${allUnits().length} units across A1–C1, ${allCards().length} vocabulary cards, ${allUnits().reduce((n,u)=>n+u.exercises.length,0)} exercises, ${VERBS.length} verb tables, three grammar laboratories and a phrasebook. Pronunciation uses the device’s installed German voice. This course covers advanced C1 topics; genuine CEFR proficiency also requires extensive authentic listening, reading, writing and conversation.</p></div><div class="card"><b>Reset</b><p>This permanently removes local progress.</p><button class="btn" style="color:var(--bad)" onclick="resetData()">Reset all progress</button></div>`}
function exportData(){const b=new Blob([JSON.stringify(store.data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='deutsch-lernen-progress-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importfile').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;store.data=sanitize(JSON.parse(await f.text()));store.save();toast('Progress imported.');render()}catch(err){alert('That file is not a valid Deutsch lernen progress backup.')}e.target.value=''})
function resetData(){if(confirm('Delete all German-course progress?')){store.data=clone(DEFAULTS);store.save();render()}}
function applyTheme(){const t=store.data.settings.theme,d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',applyTheme);window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./deutsch-lernen-sw.js').catch(()=>{}));
render();
</script></body></html>

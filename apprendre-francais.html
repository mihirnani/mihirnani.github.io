    --blue-soft: #e6f0fb;
    --good: #0ca30c;
    --good-text: #006300;
    --bad: #d03b3b;
    --warn: #b97a00;
    --gold: #eda100;
    --shadow: 0 1px 3px rgba(11,11,11,0.06), 0 4px 14px rgba(11,11,11,0.05);
    --radius: 12px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;

    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --accent: #5598e7;
    --accent-soft: #16243a;
    --blue: #3987e5;
    --blue-soft: #16243a;
    --good: #0ca30c;
    --good-text: #2fc32f;
    --bad: #e66767;
    --warn: #c98500;
    --gold: #c98500;

  * { box-sizing: border-box; }

  .logo b { font-size: 17px; letter-spacing: -0.01em; }

  /* ---------- generic components ---------- */

  .lvlcard { display: block; color: inherit; cursor: pointer; }

  .tab { padding: 9px 15px; border: none; background: none; font-family: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }

  .vocabtable { width: 100%; border-collapse: collapse; }
  .vocabtable td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); font-size: 15px; }

  .example { padding: 9px 0; border-bottom: 1px dashed var(--hairline); font-size: 15px; }

  /* flashcards */
  .fcstage { max-width: 560px; margin: 0 auto; }
  .fcard { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow); min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; cursor: pointer; }

  .fcgrades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .fcgrades button { padding: 11px 6px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--ink); }
  .fcgrades button small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .fcgrades button:hover { background: var(--surface-2); }
  .fcgrades .g-again { border-bottom: 3px solid var(--bad); }
  .fcgrades .g-hard { border-bottom: 3px solid var(--gold); }
  .fcgrades .g-good { border-bottom: 3px solid var(--blue); }
  .fcgrades .g-easy { border-bottom: 3px solid var(--good); }
  .fcmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  /* quiz */
  .quizhead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .quizhead .progressbar { flex: 1; }
  .bigresult { text-align: center; padding: 30px 20px; }
  .bigresult .pct { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; }
  .bigresult .msg { font-size: 17px; color: var(--ink-2); margin: 6px 0 20px; }

  /* toast + banner */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 20px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
  #toast.show { opacity: 1; }
  .banner { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 16px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 16px; }
  .searchbox { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); font-size: 15px; font-family: inherit; margin-bottom: 14px; }
  .phrase-cat h3 { margin-top: 24px; }
  kbd { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 5px; padding: 1px 6px; font-size: 12.5px; font-family: inherit; }
  .footer-note { color: var(--muted); font-size: 12.5px; margin-top: 40px; text-align: center; }
  .grammar-body p { margin: 9px 0; }
  .grammar-body ul { margin: 8px 0; padding-left: 22px; }
  .grammar-body li { margin: 4px 0; }
  .checklist { list-style: none; padding: 0; }
  .checklist li { padding: 4px 0 4px 26px; position: relative; }
  .checklist li::before { content: "✓"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }

<script>

/* =====================================================================

const COURSE = [];
COURSE.push({
  id: "a1", short: "A1", icon: "🌱", label: "Level A1 — Beginner",
  tagline: "First words & survival basics",
  desc: "Start from zero: French sounds, greetings, essential verbs and the grammar you need to introduce yourself, order a coffee and get by in France."
, units: [] });

levelById("a1").units.push(
{
  id: "a1u1", title: "Salut ! Sounds & greetings",
  subtitle: "French pronunciation survival kit, greetings and politeness",
  grammar: `
<h3>The big secret of French spelling</h3>
<p>French looks scarier than it sounds. Two rules unlock most of it: <b>final consonants are usually silent</b> (peti<i>t</i>, troi<i>s</i>, ver<i>t</i> — but final c, r, f, l often sound: "CaReFuL"), and <b>letter groups have fixed sounds</b>:</p>
<table class="gr">
<tr><th>Spelling</th><th>Sound</th><th>Example</th></tr>
<tr><td><b>ou</b></td><td>"oo" as in <i>food</i></td><td><b>bonjour</b>, vous</td></tr>
<tr><td><b>u</b></td><td>tight "ee" with rounded lips (no English equivalent!)</td><td>t<b>u</b>, sal<b>u</b>t</td></tr>
<tr><td><b>oi</b></td><td>"wa"</td><td>m<b>oi</b>, tr<b>oi</b>s</td></tr>
<tr><td><b>au / eau / o</b></td><td>"oh"</td><td>b<b>eau</b>, ch<b>au</b>d</td></tr>
<tr><td><b>ai / è / ê</b></td><td>"eh" as in <i>bed</i></td><td>fr<b>ai</b>s, m<b>è</b>re</td></tr>
<tr><td><b>é / -er / -ez</b></td><td>closed "ay" (short)</td><td>caf<b>é</b>, parl<b>er</b>, all<b>ez</b></td></tr>
<tr><td><b>ch</b></td><td>"sh"</td><td><b>ch</b>at, <b>ch</b>ocolat</td></tr>
<tr><td><b>gn</b></td><td>"ny" as in <i>canyon</i></td><td>monta<b>gn</b>e</td></tr>
<tr><td><b>j / g+e,i</b></td><td>soft "zh" as in <i>vision</i></td><td><b>j</b>e, man<b>g</b>er</td></tr>
<tr><td><b>qu</b></td><td>"k"</td><td><b>qu</b>i, <b>qu</b>atre</td></tr>
<tr><td><b>h</b></td><td>always silent</td><td><b>h</b>ôtel, <b>h</b>omme</td></tr>
</table>
<h3>The nasal vowels — air through the nose</h3>
<p><b>on</b> (b<b>on</b>, n<b>on</b>) · <b>an/en</b> (Fr<b>an</b>ce, comm<b>en</b>t) · <b>in/ain/ein</b> (v<b>in</b>, p<b>ain</b>) · <b>un</b> (l<b>un</b>di). The n itself isn't pronounced — the vowel goes nasal.</p>
<div class="tip"><b>Liaison & elision:</b> a silent final consonant wakes up before a vowel: vous_avez ("vou-za-vé"), les_amis ("lé-za-mi"). And je/le/la/de/ne shrink before vowels: <b>j'ai</b>, <b>l'ami</b>, <b>d'accord</b>. These aren't optional — they're built into the language.</div>
<h3>Tu or vous?</h3>
<p><b>Tu</b> = friends, family, children, fellow students. <b>Vous</b> = strangers, shops, work, older people — and any group. When unsure, use vous; the French will offer "on peut se tutoyer" when it's time to switch.</p>
<div class="tip"><b>Politeness is grammar in France:</b> walk into any shop and say <b>Bonjour</b> before anything else, and leave with <b>Merci, au revoir</b>. Skipping the bonjour genuinely reads as rude.</div>`,
  examples: [
    ["Bonjour, comment allez-vous ?", "Hello, how are you? (formal)"],
    ["Salut, ça va ? — Ça va bien, merci. Et toi ?", "Hi, how's it going? — Fine, thanks. And you?"],
    ["Je m'appelle Mihir. Enchanté !", "My name is Mihir. Nice to meet you!"],
    ["Excusez-moi, parlez-vous anglais ?", "Excuse me, do you speak English?"],
    ["Merci beaucoup ! — De rien !", "Thanks a lot! — You're welcome!"],
    ["Au revoir, à demain !", "Goodbye, see you tomorrow!"]
  ],
  vocab: [
    ["bonjour", "hello / good day"],
    ["bonsoir", "good evening"],
    ["bonne nuit", "good night"],
    ["salut", "hi / bye (informal)"],
    ["au revoir", "goodbye"],
    ["à bientôt", "see you soon"],
    ["à demain", "see you tomorrow"],
    ["merci (beaucoup)", "thank you (very much)"],
    ["de rien", "you're welcome"],
    ["s'il vous plaît", "please (formal)"],
    ["s'il te plaît", "please (informal)"],
    ["excusez-moi", "excuse me"],
    ["pardon", "sorry / pardon"],
    ["désolé(e)", "sorry"],
    ["oui", "yes"],
    ["non", "no"],
    ["enchanté(e)", "nice to meet you"],
    ["je m'appelle…", "my name is…"],
    ["comment ça va ?", "how's it going?"],
    ["ça va bien", "it's going well"],
    ["comme ci comme ça", "so-so"],
    ["monsieur / madame", "sir / madam"],
    ["bienvenue", "welcome"],
    ["bonne journée !", "have a nice day!"]
  ],

<h3>Possessive adjectives</h3>
<table class="gr">

<p>Both go before the verb, in this fixed order:</p>
<table class="gr">
<tr><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th><th>5th</th></tr>
<tr><td>me<br>te<br>se<br>nous<br>vous</td><td>le<br>la<br>les</td><td>lui<br>leur</td><td>y</td><td>en</td></tr>
</table>
<ul>
<li>Tu me prêtes ta voiture ? — Oui, je <b>te la</b> prête.</li>
<li>Tu donnes le livre à Marc ? — Oui, je <b>le lui</b> donne.</li>
<li>Tu envoies la photo à tes parents ? — Je <b>la leur</b> envoie.</li>
<li>Il y a du pain ? — Oui, il y <b>en</b> a. (y before en!)</li>
<li>Tu m'offres des fleurs ? — Je <b>t'en</b> offre souvent !</li>

<div class="tip"><b>The pattern to memorize:</b> me/te/nous/vous come BEFORE le/la/les — but lui/leur come AFTER: je <b>te le</b> donne, but je <b>le lui</b> donne. Say "je le lui donne" out loud ten times; it's the one everyone trips on.</div>
<h3>In the passé composé</h3>
<p>Both pronouns go before the helper — and agreement still applies: Tu as donné les clés à Léa ? — Oui, je <b>les lui ai données</b>.</p>

<p>Irregulars: être → <b>sois, soyons, soyez</b> (Sois sage ! Be good!) · avoir → <b>aie, ayons, ayez</b> (N'aie pas peur !) · savoir → <b>sache</b> (Sache que… Know that…)</p>

<h3>A mood for what's in your head</h3>
<p>Facts take the indicative; wishes, fears, doubts and demands take the <b>subjunctive</b> — almost always after <b>que</b>:</p>
<p style="text-align:center;font-size:16.5px">Je sais que tu <b>viens</b>. (fact)<br>Je veux que tu <b>viennes</b>. (wish — subjunctive)</p>
<h3>Forming it</h3>
<p>Stem = ils-form minus -ent, endings <b>-e, -es, -e, -ions, -iez, -ent</b>:</p>
<table class="gr">
<tr><th></th><th>parler (ils parl-)</th><th>finir (ils finiss-)</th><th>prendre (ils prenn-)</th></tr>
<tr><td>que je</td><td>parl<b>e</b></td><td>finiss<b>e</b></td><td>prenn<b>e</b></td></tr>
<tr><td>que tu</td><td>parl<b>es</b></td><td>finiss<b>es</b></td><td>prenn<b>es</b></td></tr>
<tr><td>qu'il/elle</td><td>parl<b>e</b></td><td>finiss<b>e</b></td><td>prenn<b>e</b></td></tr>
<tr><td>que nous</td><td>parl<b>ions</b></td><td>finiss<b>ions</b></td><td>pren<b>ions</b></td></tr>
<tr><td>que vous</td><td>parl<b>iez</b></td><td>finiss<b>iez</b></td><td>pren<b>iez</b></td></tr>
<tr><td>qu'ils/elles</td><td>parl<b>ent</b></td><td>finiss<b>ent</b></td><td>prenn<b>ent</b></td></tr>

<table class="gr">

  grammar: `
<h3>The core four</h3>
<table class="gr">
<tr><th>Pronoun</th><th>Role</th><th>Example</th></tr>
<tr><td><b>qui</b></td><td>subject of the relative clause</td><td>l'homme <b>qui</b> parle (the man who speaks)</td></tr>
<tr><td><b>que</b></td><td>direct object</td><td>le livre <b>que</b> je lis (the book that I read)</td></tr>
<tr><td><b>dont</b></td><td>replaces de + noun</td><td>le film <b>dont</b> je parle (the film I'm talking about)</td></tr>
<tr><td><b>où</b></td><td>place or time</td><td>la ville <b>où</b> j'habite · le jour <b>où</b> tu es né</td></tr>
</table>
<div class="tip"><b>qui or que? Look right.</b> If a verb follows immediately → <b>qui</b> (it's the subject). If a new subject follows → <b>que</b>: la femme <b>qui</b> chante / la chanson <b>que</b> la femme chante. And que elides (l'ami qu'on adore) but <b>qui never elides</b>: l'ami qui arrive.</div>
<h3>Dont — the elegant one</h3>
<p>Any verb or expression built with <b>de</b> uses dont: parler de → ce <b>dont</b> je parle · avoir besoin de → tout ce <b>dont</b> j'ai besoin · être fier de → le fils <b>dont</b> elle est fière · Also possession: l'homme <b>dont</b> la voiture est rouge (whose car…).</p>
<h3>After prepositions: lequel & friends</h3>
<p><b>lequel / laquelle / lesquels / lesquelles</b> — la table <b>sur laquelle</b>… · le projet <b>auquel</b> je pense (à + lequel = auquel) · les amis <b>avec lesquels</b> je voyage. For people you can use <b>qui</b>: l'amie <b>avec qui</b> je voyage.</p>
<h3>Ce qui / ce que / ce dont — "what"</h3>
<ul>
<li><b>Ce qui</b> m'intéresse, c'est l'histoire. (What interests me…)</li>
<li>Je ne comprends pas <b>ce que</b> tu dis. (…what you're saying.)</li>
<li>C'est exactement <b>ce dont</b> j'ai besoin ! (…what I need!)</li>
<li><b>Tout ce que</b> je veux… (Everything I want…)</li>
</ul>`,

<h3>Superlatives</h3>
<p><b>le/la/les plus (moins)</b> …: C'est <b>la plus</b> belle ville <b>du</b> monde. Adjective after the noun keeps its article: le restaurant <b>le plus</b> cher. "In" after a superlative = <b>de</b>: le meilleur <b>de la</b> classe.</p>
<h3>The irregular family</h3>
<table class="gr">
<tr><th></th><th>comparative</th><th>superlative</th></tr>
<tr><td>bon (good, adj.)</td><td><b>meilleur(e)</b></td><td><b>le/la meilleur(e)</b></td></tr>
<tr><td>bien (well, adv.)</td><td><b>mieux</b></td><td><b>le mieux</b></td></tr>
<tr><td>mauvais</td><td><b>pire</b> (or plus mauvais)</td><td><b>le pire</b></td></tr>
</table>
<div class="tip"><b>meilleur vs mieux</b> = better(adj.) vs better(adv.): Ce café est <b>meilleur</b> (the coffee is better) · Je dors <b>mieux</b> (I sleep better). Never "plus bon", never "plus bien".</div>
<h3>Making adverbs</h3>
<p>Feminine adjective + <b>-ment</b>: lent → lente → lente<b>ment</b> · heureux → heureuse<b>ment</b>. Shortcuts: -ant → -amment (courant → cour<b>amment</b>, fluently), -ent → -emment (récent → réc<b>emment</b>). Irregulars: bien, mal, vite (fast — no -ment needed!).</p>`,

  grammar: `
<h3>Subjonctif passé — for completed actions</h3>
<p>Subjunctive of avoir/être + participle. Use it when the que-action happened BEFORE the main verb:</p>
<ul>
<li>Je suis content que tu <b>sois venu</b>. (I'm glad you came.)</li>
<li>C'est dommage qu'elle <b>ait raté</b> le concert. (…that she missed it.)</li>
<li>Bien qu'il <b>ait fini</b>, il reste au bureau. (Although he's finished…)</li>
</ul>
<p>(French once had an imperfect subjunctive — <i>qu'il parlât, qu'il fût</i> — but today it's literary only. Modern French uses présent/passé du subjonctif even after past main verbs: Je voulais que tu <b>viennes</b>.)</p>
<h3>Subjunctive vs indicative vs infinitive — the decision tree</h3>
<table class="gr">
<tr><th>Situation</th><th>Choose</th><th>Example</th></tr>

<h3>Subjunctive conjunctions worth owning at B2</h3>

<h3>Type 1 — real and likely</h3>
<p><b>Si + présent → futur (or présent / impératif)</b></p>

<h3>Type 2 — hypothetical now</h3>
<p><b>Si + imparfait → conditionnel présent</b></p>
<ul>
<li>Si j'<b>avais</b> plus de temps, je <b>voyagerais</b> davantage.</li>
<li>Si j'<b>étais</b> toi, je <b>refuserais</b>. (If I were you…)</li>

<h3>Mise en relief — putting the spotlight where you want it</h3>

<h3>Stylistic inversion — written French's elegance</h3>
<ul>
<li>After quoted speech: « Bonjour », <b>dit-elle</b>. · « Partez ! », <b>cria-t-il</b>.</li>
<li>After certain adverbs sentence-initially: <b>Peut-être</b> viendra-t-il. · <b>À peine</b> était-il arrivé <b>que</b>… · <b>Sans doute</b> a-t-elle raison. · <b>Encore faut-il</b> le prouver. (Then again, it must be proven.)</li>
<li>In relatives, subject-noun inversion: la maison <b>qu'a achetée mon frère</b>.</li>
</ul>
<div class="tip"><b>Peut-être at the front = inversion or que:</b> Peut-être viendra-t-il / Peut-être <b>qu'</b>il viendra — both fine. Plain "Peut-être il viendra" marks you as a learner.</div>
<h3>The two ghost ne's</h3>
<ul>
<li><b>Ne explétif</b> — not a negation! After craindre que, avant que, à moins que, plus…que: Je crains qu'il <b>ne</b> soit trop tard. (= I fear it IS too late.) · Partons avant qu'il <b>ne</b> pleuve.</li>

<h3>Cohesion — never repeat, always thread</h3>
<table class="gr">
<tr><th>Tool</th><th>Example</th></tr>

<tr><td>Possessive pronouns</td><td>mon avis et <b>le vôtre</b> · leurs résultats et <b>les nôtres</b></td></tr>
<tr><td><b>y compris / notamment</b></td><td>tous les pays, <b>y compris</b> la France · les jeunes, <b>notamment</b> les étudiants</td></tr>
</table>
<h3>The nominal style — verbs become nouns</h3>
<p>Academic French compresses clauses into noun phrases:</p>
<ul>
<li>Quand il est arrivé → <b>À son arrivée</b>…</li>
<li>Parce que les prix ont augmenté → <b>En raison de la hausse des prix</b>…</li>
<li>Avant que le projet soit lancé → <b>Avant le lancement du projet</b>…</li>
<li>Le fait qu'il ait démissionné → <b>Sa démission</b>…</li>
</ul>
<h3>Impersonal scaffolding</h3>
<p><b>Il convient de</b> noter que… (one should note) · <b>Il s'agit de</b>… (this is about / the point is) · <b>Il en va de même pour</b>… (the same goes for) · <b>Il n'en reste pas moins que</b>… (the fact remains that) · <b>Reste à savoir si</b>… (it remains to be seen whether) · <b>Force est de constater que</b>…</p>

<h3>Punctuation & typographic Frenchness</h3>
<p>French puts a space before <b>: ; ! ?</b> · quotation marks are <b>« guillemets »</b> · numbers use commas for decimals (3,14) and spaces for thousands (10 000) · capital letters lose their accents less often than you think (État ≠ etat).</p>`,

<h3>Participle agreement — the final boss</h3>
<ul>
<li>Avoir + COD before → agree: les fleurs que j'ai <b>achetées</b>. You know this. Now the fine print:</li>
<li><b>+ infinitive:</b> agree only if the pronoun DOES the action: la pianiste que j'ai <b>entendue</b> jouer (she plays → agree) vs la sonate que j'ai <b>entendu</b> jouer (someone else plays it → no agreement).</li>
<li><b>fait + infinitive: never agrees:</b> la maison qu'il a <b>fait</b> construire.</li>
<li><b>en</b> never triggers agreement: Des pommes ? J'en ai <b>mangé</b>.</li>
<li>Reflexive + body part: elle s'est lavé <b>les mains</b> (no agreement) · but elle s'est <b>lavée</b> (agreement). And <b>elles se sont parlé</b> — no agreement, because parler À (indirect).</li>

<h3>The moves of French debate</h3>

<h3>300 million speakers, one grammar, many flavors</h3>
<p>French is co-owned: France (~65m), DR Congo (the largest francophone city is Kinshasa!), Canada, Belgium, Switzerland, Maghreb, West Africa, the Caribbean… At C2 you hear where someone is from and adjust your ear.</p>
<h3>Le québécois — the big one</h3>
<table class="gr">
<tr><th>Québec</th><th>France</th><th>Means</th></tr>
<tr><td><b>le déjeuner / dîner / souper</b></td><td>petit déjeuner / déjeuner / dîner</td><td>the three meals (shifted!)</td></tr>
<tr><td><b>la blonde / le chum</b></td><td>la copine / le copain</td><td>girlfriend / boyfriend</td></tr>
<tr><td><b>le char</b></td><td>la voiture</td><td>car</td></tr>
<tr><td><b>magasiner</b></td><td>faire du shopping</td><td>to shop</td></tr>
<tr><td><b>le courriel / clavarder</b></td><td>le mail / chatter</td><td>email / to chat (Québec resists anglicisms!)</td></tr>
<tr><td><b>C'est plate</b></td><td>C'est ennuyeux</td><td>it's boring</td></tr>
<tr><td><b>-tu</b> question particle</td><td>est-ce que</td><td>Tu viens<b>-tu</b> ? = are you coming?</td></tr>
</table>
<h3>Belgique & Suisse — the sane numbers</h3>
<p><b>septante</b> (70) and <b>nonante</b> (90) in both; Switzerland adds <b>huitante</b> (80) in some cantons. Belgium: <b>une chique</b> (candy), <b>savoir</b> for pouvoir (Je ne saurai pas venir = I can't come), <b>s'il vous plaît</b> to mean "here you go". Switzerland: <b>le natel</b> (mobile phone), <b>poutzer</b> (to clean).</p>
<h3>Afrique francophone</h3>
<p><b>présentement</b> (right now — also Québec) · <b>le taxi-brousse</b> (bush taxi) · <b>une essencerie</b> (petrol station, Senegal) · <b>caillou</b> (tough exam) · rich oral rhetoric traditions and their own fast-evolving urban slang (nouchi in Abidjan, camfranglais in Cameroon).</p>
<div class="tip"><b>C2 etiquette:</b> never "correct" a Québécois's déjeuner or a Belgian's septante — their forms are older French, not errors (France abandoned septante; they kept it). The Académie française describes ONE standard; the language belongs to everyone who speaks it.</div>`,

<h3>Proverbs everyone knows (and deploys)</h3>

<tr><td><b>Il ne faut pas vendre la peau de l'ours…</b></td><td>Don't count your chickens… (…avant de l'avoir tué)</td></tr>
<tr><td><b>Les absents ont toujours tort.</b></td><td>The absent are always wrong.</td></tr>
<tr><td><b>Chacun voit midi à sa porte.</b></td><td>Everyone sees noon at their own door (judges by their own situation).</td></tr>
<tr><td><b>Impossible n'est pas français.</b></td><td>Impossible isn't French. (attributed to Napoléon)</td></tr>
<tr><td><b>Revenons à nos moutons.</b></td><td>Back to our sheep (= back to the point — from a medieval farce).</td></tr>
<tr><td><b>L'habit ne fait pas le moine.</b></td><td>The habit doesn't make the monk.</td></tr>
<tr><td><b>Mieux vaut tard que jamais.</b></td><td>Better late than never.</td></tr>
<tr><td><b>C'est la goutte d'eau qui fait déborder le vase.</b></td><td>The straw that broke the camel's back.</td></tr>
</table>
<h3>Cultural shorthand you're expected to catch</h3>
<p><b>l'esprit de l'escalier</b> (thinking of the retort too late) · <b>la madeleine de Proust</b> (a memory-triggering taste/smell) · <b>le quart d'heure de politesse</b> (the polite 15-minute lateness) · <b>le système D</b> (débrouille — resourceful workaround culture) · <b>la trêve des confiseurs</b> (the year-end political truce) · <b>« Liberté, Égalité, Fraternité »</b> · references to La Fontaine's fables (<i>rien ne sert de courir…</i>), Molière (<i>le français = la langue de Molière</i>), Astérix, and the sacred <b>apéro</b>.</p>
<h3>Staying at C2 — the maintenance plan</h3>
<ul>
<li><b>Read wide:</b> Le Monde diplomatique for argument, San-Antonio or Despentes for register, La Fontaine for the canon.</li>
<li><b>Listen daily:</b> France Inter, France Culture podcasts, Québécois series for ear-stretching.</li>
<li><b>Write & speak:</b> keep a French journal; argue both sides of a dissertation topic monthly; find a tandem partner.</li>
<li><b>Play:</b> do dictées (Bernard Pivot's are legendary), crosswords (mots croisés / fléchés), Scrabble francophone.</li>
</ul>
<div class="tip"><b>Félicitations !</b> If you've worked through all six levels, you now hold more explicit French grammar than most natives ever study. What remains isn't grammar — it's mileage: books, films, arguments, dinners, and the ten thousand hours of delightful French conversation ahead. Bonne route !</div>`,

/* =====================================================================
   STORAGE
   ===================================================================== */
const STORE_KEY = "apprendre-francais-v1";
const DEFAULTS = {
  completed: {},        // unitId -> true
  quizScores: {},       // unitId -> best %
  srs: {},              // cardId -> {r: reps, e: ease*100, i: interval days, d: due ts}
  xp: 0,
  streak: 0,
  lastDay: null,        // "YYYY-MM-DD" of last activity
  bestStreak: 0,
  reviewsDone: 0,
  settings: { dir: "it2en", newPerDay: 15, theme: "auto", levels: { a1: true, a2: true, b1: false, b2: false, c1: false, c2: false } },
  newIntro: {},         // "YYYY-MM-DD" -> count of new cards introduced
};

function cloneDefaults() { return JSON.parse(JSON.stringify(DEFAULTS)); }
function boundedInt(value, min, max, fallback) {
  return Number.isFinite(value) ? Math.min(max, Math.max(min, Math.floor(value))) : fallback;
}
function validDateKey(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = new Date(value + "T00:00:00");
  return Number.isFinite(d.getTime()) && d.getFullYear() === +value.slice(0, 4)
    && d.getMonth() + 1 === +value.slice(5, 7) && d.getDate() === +value.slice(8, 10);
}
function sanitizeProgress(input) {
  if (!input || typeof input !== "object" || Array.isArray(input)) throw new Error("Invalid progress file");

  const out = cloneDefaults();
  const unitIds = new Set();
  const cardIds = new Set();
  for (const lvl of COURSE) for (const unit of lvl.units) {
    unitIds.add(unit.id);
    unit.vocab.forEach((_, i) => cardIds.add(unit.id + ":" + i));
  }

  const completed = input.completed && typeof input.completed === "object" && !Array.isArray(input.completed) ? input.completed : {};
  for (const id of unitIds) if (completed[id] === true) out.completed[id] = true;

  const scores = input.quizScores && typeof input.quizScores === "object" && !Array.isArray(input.quizScores) ? input.quizScores : {};
  for (const id of unitIds) if (Number.isFinite(scores[id])) out.quizScores[id] = boundedInt(scores[id], 0, 100, 0);

  const incomingSrs = input.srs && typeof input.srs === "object" && !Array.isArray(input.srs) ? input.srs : {};
  const maxDue = Date.UTC(2100, 0, 1);
  for (const id of cardIds) {
    const rec = incomingSrs[id];
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    if (![rec.r, rec.e, rec.i, rec.d].some(Number.isFinite)) continue;
    out.srs[id] = {
      r: boundedInt(rec.r, 0, 1000000, 0),
      e: boundedInt(rec.e, 130, 280, 250),
      i: boundedInt(rec.i, 0, 36500, 0),
      d: boundedInt(rec.d, 0, maxDue, 0)
    };
  }

  out.xp = boundedInt(input.xp, 0, 1000000000, 0);
  out.streak = boundedInt(input.streak, 0, 1000000, 0);
  out.bestStreak = Math.max(out.streak, boundedInt(input.bestStreak, 0, 1000000, 0));
  out.reviewsDone = boundedInt(input.reviewsDone, 0, 1000000000, 0);
  out.lastDay = validDateKey(input.lastDay) ? input.lastDay : null;

  const settings = input.settings && typeof input.settings === "object" && !Array.isArray(input.settings) ? input.settings : {};
  if (["it2en", "en2it", "mix"].includes(settings.dir)) out.settings.dir = settings.dir;
  if ([5, 10, 15, 20, 30, 50].includes(settings.newPerDay)) out.settings.newPerDay = settings.newPerDay;
  if (["auto", "light", "dark"].includes(settings.theme)) out.settings.theme = settings.theme;
  const levels = settings.levels && typeof settings.levels === "object" && !Array.isArray(settings.levels) ? settings.levels : {};
  for (const lvl of COURSE) if (typeof levels[lvl.id] === "boolean") out.settings.levels[lvl.id] = levels[lvl.id];

  const intro = input.newIntro && typeof input.newIntro === "object" && !Array.isArray(input.newIntro) ? input.newIntro : {};
  for (const [day, count] of Object.entries(intro)) {
    if (validDateKey(day) && Number.isFinite(count)) out.newIntro[day] = boundedInt(count, 0, 10000, 0);
  }
  return out;
}

const store = {
  data: cloneDefaults(),
  memOnly: false,
  load() {
    this.data = cloneDefaults();
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        try { this.data = sanitizeProgress(JSON.parse(raw)); }
        catch (e) { localStorage.removeItem(STORE_KEY); }
      }
      localStorage.setItem(STORE_KEY + "-probe", "1");
      localStorage.removeItem(STORE_KEY + "-probe");
    } catch (e) {
      this.memOnly = true;
      this.data = cloneDefaults();
    }
  },
  save() {
    if (this.memOnly) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; }
  }
};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function recordActivity() {
  const t = todayStr();
  const s = store.data;
  if (s.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  s.streak = (s.lastDay === yStr) ? s.streak + 1 : 1;
  s.bestStreak = Math.max(s.bestStreak, s.streak);
  s.lastDay = t;
  store.save();
  renderSidebar();
}
function addXP(n) { store.data.xp += n; recordActivity(); store.save(); }

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function stripDiacritics(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function normAnswer(s, keepAccents) {
  let x = s.toLowerCase().trim().replace(/[.,!?;:"«»]/g, "").replace(/’/g, "'").replace(/\s+/g, " ");
  if (!keepAccents) x = stripDiacritics(x);
  return x;
}
// returns: 2 exact, 1 correct-but-accent-slip, 0 wrong
function matchAnswer(given, answers) {
  const list = Array.isArray(answers) ? answers : [answers];
  for (const a of list) if (normAnswer(given, true) === normAnswer(a, true)) return 2;
  for (const a of list) if (normAnswer(given, false) === normAnswer(a, false)) return 1;
  return 0;
}

let voicesReady = false;
if ("speechSynthesis" in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
}
function speak(text) {
  if (!("speechSynthesis" in window)) { toast("Speech not supported in this browser"); return; }
  const clean = text.replace(/\(.*?\)/g, "").replace(/\/.*$/, "");
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "fr-FR"; u.rate = 0.92;
  const v = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
  if (v.length) u.voice = v.find(x => x.localService) || v[0];
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function speakBtn(text) { return `<button class="speakbtn" type="button" title="Listen" aria-label="Listen to French pronunciation" onclick="speak(${JSON.stringify(text).replace(/"/g, "&quot;")});event.stopPropagation()">🔊</button>`; }

const ACCENT_CHARS = ["é", "è", "ê", "à", "â", "ç", "î", "ï", "ô", "û", "ù", "œ"];
function accentBar(inputId) {
  return `<div class="accents">` + ACCENT_CHARS.map(c =>
    `<button type="button" tabindex="-1" onclick="insAccent('${inputId}','${c}')">${c}</button>`).join("") + `</div>`;
}
function insAccent(id, ch) {
  const el = document.getElementById(id);
  if (!el) return;
  const s = el.selectionStart || el.value.length;
  el.value = el.value.slice(0, s) + ch + el.value.slice(el.selectionEnd || s);
  el.focus(); el.selectionStart = el.selectionEnd = s + 1;
}

function unitById(id) {
  for (const lvl of COURSE) for (const u of lvl.units) if (u.id === id) return { lvl, unit: u };
  return null;
}
function levelById(id) { return COURSE.find(l => l.id === id); }
function levelProgress(lvl) {
  const done = lvl.units.filter(u => store.data.completed[u.id]).length;
  return { done, total: lvl.units.length, pct: Math.round(100 * done / lvl.units.length) };
}
function nextUnfinishedUnit() {
  for (const lvl of COURSE) for (const u of lvl.units) if (!store.data.completed[u.id]) return { lvl, unit: u };
  return null;
}

/* =====================================================================
   SRS ENGINE (SM-2 style, simplified)
   ===================================================================== */
const DAY = 86400000;
function allCards() {
  const cards = [];
  for (const lvl of COURSE) {
    if (!store.data.settings.levels[lvl.id]) continue;
    for (const u of lvl.units) {
      u.vocab.forEach((v, i) => cards.push({ id: u.id + ":" + i, it: v[0], en: v[1], unit: u, lvl }));
    }
  }
  return cards;
}
function srsState(id) { return store.data.srs[id] || null; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => { const s = srsState(c.id); return s && s.d <= now; });
}
function newCards() { return allCards().filter(c => !srsState(c.id)); }
function newBudgetLeft() {
  const t = todayStr();
  const used = store.data.newIntro[t] || 0;
  return Math.max(0, store.data.settings.newPerDay - used);
}
function gradeCard(card, grade) { // 0 again, 1 hard, 2 good, 3 easy
  const s = store.data.srs[card.id] || { r: 0, e: 250, i: 0, d: 0 };
  const isNew = !store.data.srs[card.id];
  if (isNew) {
    const t = todayStr();
    store.data.newIntro[t] = (store.data.newIntro[t] || 0) + 1;
  }
  if (grade === 0) {
    s.r = 0; s.i = 0; s.d = Date.now() + 10 * 60000; s.e = Math.max(130, s.e - 20);
  } else {
    if (grade === 1) { s.i = Math.max(1, Math.round(s.i * 1.2)) || 1; s.e = Math.max(130, s.e - 15); }
    else if (grade === 2) { s.i = s.r === 0 ? 1 : (s.r === 1 ? 3 : Math.round(s.i * s.e / 100)); }
    else { s.i = s.r === 0 ? 4 : Math.round(s.i * s.e / 100 * 1.3); s.e = Math.min(280, s.e + 15); }
    s.r += 1;
    s.d = Date.now() + s.i * DAY;
  }
  store.data.srs[card.id] = s;
  store.data.reviewsDone += 1;
  addXP(grade === 0 ? 1 : 2);
  store.save();
}

/* =====================================================================
   EXERCISE RENDERING
   Exercise types:
     {t:'mcq', q, opts:[...], a: idx, ex?}      — multiple choice
     {t:'fill', q (use ___), a: [answers], ex?} — type the missing word(s)
     {t:'tr', q (english), a: [answers], ex?}   — translate into French
   ===================================================================== */
let EX_SEQ = 0;
const exHandlers = {};       // id -> {onAnswer(correct)}
function renderExercise(ex, num, opts) {
  opts = opts || {};
  const id = "ex" + (++EX_SEQ);
  exHandlers[id] = { ex, answered: false, cb: opts.onAnswer || null };
  let inner = "";
  const qhtml = `<div class="q"><span class="qnum">${num}</span>${ex.q}</div>`;
  if (ex.t === "mcq") {
    const order = shuffle(ex.opts.map((o, i) => i));
    exHandlers[id].order = order;
    inner = qhtml + `<div class="opts">` + order.map((oi, pos) =>
      `<button class="optbtn" id="${id}-o${pos}" onclick="answerMCQ('${id}',${pos})">${esc(ex.opts[oi])}</button>`
    ).join("") + `</div><div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  } else {
    const label = ex.t === "tr" ? "Translate into French:" : "";
    inner = `<div class="q"><span class="qnum">${num}</span>${label ? label + " " : ""}${ex.t === "tr" ? "<b>" + esc(ex.q) + "</b>" : ex.q}</div>
      <div class="fillrow">
        <input type="text" id="${id}-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ex.t === "tr" ? "Type the French…" : "Type the missing word…"}" onkeydown="if(event.key==='Enter')answerFill('${id}')">
        <button class="btn small" onclick="answerFill('${id}')">Check</button>
      </div>
      ${accentBar(id + "-in")}
      <div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  }
  return `<div class="exwrap" id="${id}">${inner}</div>`;
}
function finishExercise(id, correct, extraMsg) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  h.answered = true;
  const v = document.getElementById(id + "-v");
  const ex = h.ex;
  if (correct) {
    v.className = "verdict ok";
    v.innerHTML = "✓ Correct!" + (extraMsg ? ` <span class="expl">${extraMsg}</span>` : "") + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
    addXP(5);
  } else {
    v.className = "verdict no";
    const ans = ex.t === "mcq" ? ex.opts[ex.a] : (Array.isArray(ex.a) ? ex.a[0] : ex.a);
    v.innerHTML = `✗ Not quite. Answer: <b class="it">${esc(ans)}</b>` + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
  }
  if (h.cb) h.cb(correct);
}
function answerMCQ(id, pos) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const ex = h.ex, chosen = h.order[pos];
  const correct = chosen === ex.a;
  for (let p = 0; p < h.order.length; p++) {
    const b = document.getElementById(id + "-o" + p);
    b.disabled = true;
    if (h.order[p] === ex.a) b.classList.add("right");
    else if (p === pos && !correct) b.classList.add("wrong");
  }
  finishExercise(id, correct);
}
function answerFill(id) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const val = document.getElementById(id + "-in").value;
  if (!val.trim()) return;
  const m = matchAnswer(val, h.ex.a);
  document.getElementById(id + "-in").disabled = true;
  finishExercise(id, m > 0, m === 1 ? `Watch the accents: <b class="it">${esc(Array.isArray(h.ex.a) ? h.ex.a[0] : h.ex.a)}</b>` : null);
}

/* ---------- quiz session ---------- */
let quiz = null;
function uniqueTextOptions(correct, candidates) {
  const seen = new Set([String(correct)]);
  const distractors = [];
  for (const candidate of shuffle(candidates)) {
    const text = String(candidate);
    if (seen.has(text)) continue;
    seen.add(text);
    distractors.push(text);
    if (distractors.length === 3) break;
  }
  return shuffle([String(correct), ...distractors]);
}
function buildQuizQuestions(unit) {
  const authored = shuffle(unit.exercises).slice(0, 6);
  const vocabPool = shuffle(unit.vocab.map((v, i) => i)).slice(0, 10 - authored.length);
  const italianCounts = new Map();
  const englishCounts = new Map();
  for (const [it, en] of unit.vocab) {
    italianCounts.set(it, (italianCounts.get(it) || 0) + 1);
    englishCounts.set(en, (englishCounts.get(en) || 0) + 1);
  }
  const vocabQs = vocabPool.map(idx => {
    const v = unit.vocab[idx];
    const canAskItToEn = italianCounts.get(v[0]) === 1;
    const canAskEnToIt = englishCounts.get(v[1]) === 1;
    const askItToEn = !canAskEnToIt || (canAskItToEn && Math.random() < 0.5);
    if (askItToEn) {
      const opts = uniqueTextOptions(v[1], unit.vocab.map(o => o[1]));
      return { t: "mcq", q: `What does <b class="it">${esc(v[0])}</b> mean?`, opts, a: opts.indexOf(String(v[1])) };
    }
    const opts = uniqueTextOptions(v[0], unit.vocab.map(o => o[0]));
    return { t: "mcq", q: `How do you say “${esc(v[1])}” in French?`, opts, a: opts.indexOf(String(v[0])) };
  });
  return shuffle(authored.concat(vocabQs));
}
function viewQuizStart(uid) {
  const found = unitById(uid);
  if (!found) { document.getElementById("main").innerHTML = "<p>Unit not found.</p>"; return; }
  quiz = { uid, qs: buildQuizQuestions(found.unit), i: 0, correct: 0 };
  renderQuizQ();
}
function renderQuizQ() {
  const main = document.getElementById("main");
  const found = unitById(quiz.uid);
  if (quiz.i >= quiz.qs.length) { renderQuizResult(); return; }
  EX_SEQ = 0; for (const k in exHandlers) delete exHandlers[k];
  const q = quiz.qs[quiz.i];
  main.innerHTML = `<p style="margin:0 0 4px"><a href="#/unit/${quiz.uid}/quiz" onclick="quiz=null">← Quit quiz</a></p>
    <h1>Quiz: ${found.unit.title}</h1>
    <div class="quizhead"><span style="font-size:13.5px;color:var(--muted);font-weight:600">${quiz.i + 1} / ${quiz.qs.length}</span>
      <div class="progressbar blue"><i style="width:${Math.round(100 * quiz.i / quiz.qs.length)}%"></i></div></div>
    ${renderExercise(q, quiz.i + 1, { onAnswer: (ok) => { if (ok) quiz.correct++; showQuizNext(); } })}
    <div id="quiznext"></div>`;
}
function showQuizNext() {
  document.getElementById("quiznext").innerHTML =
    `<button class="btn primary" style="margin-top:6px" onclick="quiz.i++;renderQuizQ()">${quiz.i + 1 >= quiz.qs.length ? "See result →" : "Next →"}</button>`;
  document.getElementById("quiznext").querySelector("button").focus();
}
function renderQuizResult() {
  const pct = Math.round(100 * quiz.correct / quiz.qs.length);
  const uid = quiz.uid;
  const passed = pct >= 70;
  const prev = store.data.quizScores[uid];
  if (prev == null || pct > prev) store.data.quizScores[uid] = pct;
  if (passed && !store.data.completed[uid]) {
    store.data.completed[uid] = true;
    addXP(50);
  }
  store.save();
  const found = unitById(uid);
  const lvl = found.lvl;
  const idx = lvl.units.indexOf(found.unit);
  const nextU = lvl.units[idx + 1];
  document.getElementById("main").innerHTML = `<div class="card bigresult">
    <div style="font-size:44px">${passed ? "🎉" : "💪"}</div>
    <div class="pct" style="color:${passed ? "var(--good-text)" : "var(--bad)"}">${pct}%</div>
    <div class="msg">${passed ? (pct === 100 ? "Parfait ! Flawless." : "Bravo ! Unit complete.") : "Almost — you need 70%. Review the lesson and try again."}</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${passed ? "" : `<button class="btn" onclick="go('unit/${uid}/learn')">Review lesson</button>`}
      <button class="btn" onclick="go('quiz/${uid}')">Retry quiz</button>
      ${passed && nextU ? `<button class="btn primary" onclick="go('unit/${nextU.id}')">Next unit →</button>` : `<button class="btn primary" onclick="go('level/${lvl.id}')">Back to ${lvl.short}</button>`}

  quiz = null;
  renderSidebar();
}

let fc = null;
function startFlashSession() {
  const due = shuffle(dueCards());
  const fresh = shuffle(newCards()).slice(0, newBudgetLeft());
  const queue = due.concat(fresh);
  if (!queue.length) { go("flash"); return; }
  fc = { queue, i: 0, revealed: false, done: 0, total: queue.length };
  renderFlashCard();
}
function renderFlashCard() {
  const main = document.getElementById("main");
  if (!fc || fc.i >= fc.queue.length) {
    main.innerHTML = `<div class="card bigresult"><div style="font-size:44px">🌟</div>
      <div class="pct" style="color:var(--good-text)">${fc ? fc.done : 0}</div>
      <div class="msg">reviews completed. À demain !</div>
      <button class="btn primary" onclick="go('flash')">Back to flashcards</button></div>`;
    fc = null; renderSidebar(); return;
  }
  const card = fc.queue[fc.i];
  const dirSetting = store.data.settings.dir;
  if (card._dir == null) card._dir = dirSetting === "mix" ? (Math.random() < 0.5 ? "it2en" : "en2it") : dirSetting;
  const front = card._dir === "it2en" ? card.it : card.en;
  const back = card._dir === "it2en" ? card.en : card.it;
  const isNew = !srsState(card.id);
  main.innerHTML = `<div class="fcstage">
    <div class="fcmeta"><span>${fc.i + 1} / ${fc.queue.length} ${isNew ? '· <b style="color:var(--blue)">new</b>' : ""}</span><span>${card.lvl.short} · ${card.unit.title}</span></div>
    <div class="progressbar blue" style="margin-bottom:14px"><i style="width:${Math.round(100 * fc.i / fc.queue.length)}%"></i></div>
    <div class="fcard" role="button" tabindex="0" aria-label="Flashcard. Activate to reveal the answer." onclick="flipCard()" onkeydown="if(event.key==='Enter'&&!fc.revealed)flipCard()">
      <div class="big">${esc(front)} ${card._dir === "it2en" ? speakBtn(card.it) : ""}</div>
      ${fc.revealed ? `<div class="ans">${esc(back)} ${card._dir === "en2it" ? speakBtn(card.it) : ""}</div>` : `<div class="hintline">tap to reveal · or press <kbd>Space</kbd></div>`}
    </div>
    ${fc.revealed ? `<div class="fcgrades">
      <button class="g-again" onclick="gradeFlash(0)">Again<small>&lt;10 min · 1</small></button>
      <button class="g-hard" onclick="gradeFlash(1)">Hard<small>~1 day · 2</small></button>
      <button class="g-good" onclick="gradeFlash(2)">Good<small>${nextIntPreview(card, 2)} · 3</small></button>
      <button class="g-easy" onclick="gradeFlash(3)">Easy<small>${nextIntPreview(card, 3)} · 4</small></button>
    </div>` : ""}
    <p style="text-align:center;margin-top:16px"><a href="#/flash" onclick="fc=null">End session</a></p></div>`;
}
function nextIntPreview(card, grade) {
  const s = store.data.srs[card.id] || { r: 0, e: 250, i: 0 };
  let days;
  if (grade === 2) days = s.r === 0 ? 1 : (s.r === 1 ? 3 : Math.round(s.i * s.e / 100));
  else days = s.r === 0 ? 4 : Math.round(s.i * s.e / 100 * 1.3);
  return days >= 30 ? Math.round(days / 30) + " mo" : days + " d";
}
function flipCard() { if (fc) { fc.revealed = true; renderFlashCard(); } }
function gradeFlash(g) {
  const card = fc.queue[fc.i];
  gradeCard(card, g);
  if (g === 0) fc.queue.push(card); // see it again this session
  fc.done++; fc.i++; fc.revealed = false;
  renderFlashCard();
}
document.addEventListener("keydown", (e) => {
  if (!fc || currentRoute() !== "flashrun") return;
  if (e.target.closest("input, select, textarea, a")) return;
  if (e.code === "Space" && !fc.revealed) { e.preventDefault(); flipCard(); }
  else if (fc.revealed && ["1", "2", "3", "4"].includes(e.key)) { gradeFlash(+e.key - 1); }
});

    <b>Danger zone</b>
    <p style="font-size:14px;color:var(--ink-2)">Wipe all progress and start over. This cannot be undone (unless you exported a backup!).</p>
    <button class="btn" style="color:var(--bad);border-color:var(--bad)" onclick="resetAll()">Reset all progress</button>
  </div>
  <div class="card">
    <b>About</b>
    <p style="font-size:14px;color:var(--ink-2)">A self-contained French course: ${COURSE.reduce((n, l) => n + l.units.length, 0)} units across A1–C2, ${allCardsCount()} vocabulary cards, ${VERBS.length} conjugated verbs and a phrasebook. The course works offline after its first online load. Pronunciation uses your browser\'s built-in French voice and is available offline where that voice is installed locally. Keyboard shortcuts in flashcards: <kbd>Space</kbd> reveal, <kbd>1</kbd>–<kbd>4</kbd> grade.</p>
  </div>`;
}
function allCardsCount() { let n = 0; for (const l of COURSE) for (const u of l.units) n += u.vocab.length; return n; }
function setTheme(t) {
  store.data.settings.theme = t; store.save();
  applyTheme();
}
function applyTheme() {
  const t = store.data.settings.theme;
  const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
if (themeMedia.addEventListener) themeMedia.addEventListener("change", applyTheme);
else if (themeMedia.addListener) themeMedia.addListener(applyTheme);

function exportProgress() {
  const blob = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "apprendre-francais-progress-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Progress exported ⬇️");
}
document.getElementById("importfile").addEventListener("change", function () {
  const f = this.files[0]; this.value = "";
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast("That progress file is too large."); return; }
  const r = new FileReader();
  r.onload = () => {
    try {
      store.data = sanitizeProgress(JSON.parse(r.result));
      store.save(); applyTheme(); render();
      toast("Progress imported ✓");
    } catch (e) { toast("Couldn't read that file — is it an exported progress .json?"); }
  };
  r.onerror = () => toast("Couldn't read that file.");
  r.readAsText(f);
});
function resetAll() {
  if (!confirm("Really wipe ALL progress? Export a backup first if unsure.")) return;
  store.data = cloneDefaults();
  store.save(); applyTheme(); render();
  toast("Progress reset");
}

/* =====================================================================
   BOOT
   ===================================================================== */
store.load();
applyTheme();
render();

/* PWA: register a service worker scoped only to this application page. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(
      "./apprendre-francais-sw.js",
      { scope: "./apprendre-francais.html" }
    ).catch(err => console.warn("Français offline support was not installed:", err));
  });
}

</script>
</body>
</html>

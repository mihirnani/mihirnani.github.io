<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impara l'Italiano — A1 to B2 Italian Course</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f0efec;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --accent: #008300;
    --accent-soft: #e3f2e3;
    --blue: #2a78d6;
    --blue-soft: #e6f0fb;
    --good: #0ca30c;
    --good-text: #006300;
    --bad: #d03b3b;
    --warn: #b97a00;
    --gold: #eda100;
    --shadow: 0 1px 3px rgba(11,11,11,0.06), 0 4px 14px rgba(11,11,11,0.05);
    --radius: 12px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --accent: #1baf7a;
    --accent-soft: #12291e;
    --blue: #3987e5;
    --blue-soft: #16243a;
    --good: #0ca30c;
    --good-text: #2fc32f;
    --bad: #e66767;
    --warn: #c98500;
    --gold: #c98500;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.55;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- layout ---------- */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 250px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--hairline); padding: 18px 14px 30px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .logo { display:flex; align-items:center; gap:10px; padding: 4px 8px 14px; }
  .logo .flag { width: 30px; height: 21px; border-radius: 4px; overflow: hidden; display:flex; box-shadow: 0 0 0 1px var(--border); flex-shrink:0; }
  .logo .flag i { flex: 1; }
  .logo .flag i:nth-child(1){ background:#008C45; } .logo .flag i:nth-child(2){ background:#fff; } .logo .flag i:nth-child(3){ background:#CD212A; }
  .logo b { font-size: 17px; letter-spacing: -0.01em; }
  .logo small { display:block; color: var(--muted); font-weight: 400; font-size: 11.5px; margin-top:-2px; }
  .navsec { margin-top: 10px; }
  .navsec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 8px 6px; font-weight: 600; }
  .navlink {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px;
    color: var(--ink-2); cursor: pointer; font-size: 14.5px; border: none; background: none;
    width: 100%; text-align: left; font-family: inherit;
  }
  .navlink:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
  .navlink.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .navlink .ic { width: 20px; text-align: center; flex-shrink: 0; font-size: 15px; }
  .navlink .lvlbadge { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; }
  .navlink .donecount { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .main { flex: 1; min-width: 0; padding: 28px 34px 80px; max-width: 980px; margin: 0 auto; }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--hairline); padding: 12px 14px; }
    .navwrap { display: flex; flex-wrap: wrap; gap: 4px; }
    .navsec h4 { display: none; }
    .navlink { width: auto; padding: 6px 10px; }
    .navlink .donecount, .navlink .lvlbadge { display:none; }
    .main { padding: 20px 16px 70px; width: 100%; max-width: 100%; min-width: 0; overflow-x: hidden; }
    .grammar-body, #verblist, #verblist .card, .vocabtable { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.gr { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .fcgrades { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- generic components ---------- */
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  h2 { font-size: 20px; letter-spacing: -0.01em; margin: 26px 0 10px; }
  h3 { font-size: 16.5px; margin: 20px 0 8px; }
  .sub { color: var(--ink-2); margin: 0 0 20px; font-size: 15px; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); letter-spacing: 0.03em; }
  .pill.acc { background: var(--accent-soft); color: var(--accent); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 9px;
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
    font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.subtle { border: none; background: none; color: var(--blue); padding: 6px 8px; }
  .btn.small { padding: 5px 11px; font-size: 13px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .progressbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .progressbar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.4s ease; }
  .progressbar.blue > i { background: var(--blue); }
  table.gr { border-collapse: collapse; width: 100%; max-width: 100%; margin: 10px 0 14px; font-size: 14.5px; }
  table.gr th, table.gr td { border: 1px solid var(--hairline); padding: 7px 11px; text-align: left; }
  table.gr th { background: var(--surface-2); font-weight: 600; font-size: 13.5px; }
  table.gr td b, .it { color: var(--accent); font-style: normal; }
  .tip { border-left: 3px solid var(--gold); background: var(--surface-2); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; font-size: 14.5px; }
  .tip b:first-child { color: var(--warn); }
  .exwrap { border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; margin: 10px 0; background: var(--surface); }
  .exwrap .q { font-size: 15.5px; margin-bottom: 10px; }
  .exwrap .qnum { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-right: 6px; }
  .opts { display: flex; flex-direction: column; gap: 7px; }
  .optbtn { text-align: left; padding: 9px 13px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface); cursor: pointer; font-size: 14.5px; font-family: inherit; color: var(--ink); }
  .optbtn:hover { background: var(--surface-2); }
  .optbtn.right { border-color: var(--good); background: var(--accent-soft); font-weight: 600; }
  .optbtn.wrong { border-color: var(--bad); opacity: 0.85; }
  .optbtn:disabled { cursor: default; }
  .fillrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fillrow input { flex: 1; min-width: 180px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--page); color: var(--ink); font-size: 15px; font-family: inherit; }
  .fillrow input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .verdict { margin-top: 9px; font-size: 14px; font-weight: 600; }
  .verdict.ok { color: var(--good-text); }
  .verdict.no { color: var(--bad); }
  .verdict .expl { font-weight: 400; color: var(--ink-2); display: block; margin-top: 2px; }
  .speakbtn { border: none; background: none; cursor: pointer; font-size: 15px; padding: 2px 5px; border-radius: 6px; }
  .speakbtn:hover { background: var(--surface-2); }
  .accents { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .accents button { border: 1px solid var(--hairline); background: var(--surface-2); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 14px; color: var(--ink); font-family: inherit; }
  .accents button:hover { background: var(--hairline); }

  /* dashboard */
  .statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 15px 17px; box-shadow: var(--shadow); }
  .stat .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .lvlcard { display: block; color: inherit; cursor: pointer; }
  .lvlcard:hover { text-decoration: none; border-color: var(--muted); }
  .lvlcard .top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .lvlcard .top b { font-size: 17px; }
  .lvlcard .top span { color: var(--muted); font-size: 13.5px; }
  .lvlcard .pct { margin-left: auto; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }

  /* unit list */
  .unitrow { display: flex; align-items: center; gap: 13px; padding: 13px 16px; border: 1px solid var(--hairline); border-radius: 10px; margin-bottom: 9px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow); }
  .unitrow:hover { border-color: var(--muted); text-decoration: none; }
  .unitrow .num { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--ink-2); flex-shrink: 0; }
  .unitrow.done .num { background: var(--accent); color: #fff; }
  .unitrow .t { flex: 1; min-width: 0; }
  .unitrow .t b { display: block; font-size: 15.5px; color: var(--ink); }
  .unitrow .t small { color: var(--muted); font-size: 13px; }
  .unitrow .score { font-size: 13px; color: var(--good-text); font-weight: 600; white-space: nowrap; }

  /* unit page tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin: 18px 0 20px; flex-wrap: wrap; }
  .tab { padding: 9px 15px; border: none; background: none; font-family: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .vocabtable { width: 100%; border-collapse: collapse; }
  .vocabtable td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); font-size: 15px; }
  .vocabtable td:first-child { font-weight: 600; color: var(--accent); width: 42%; }
  .vocabtable tr:hover td { background: var(--surface-2); }
  .example { padding: 9px 0; border-bottom: 1px dashed var(--hairline); font-size: 15px; }
  .example .en { color: var(--muted); font-size: 13.5px; display: block; }

  /* flashcards */
  .fcstage { max-width: 560px; margin: 0 auto; }
  .fcard { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow); min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; cursor: pointer; }
  .fcard .big { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .fcard .ans { font-size: 21px; color: var(--ink-2); margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--hairline); width: 80%; }
  .fcard .hintline { color: var(--muted); font-size: 13px; margin-top: 18px; }
  .fcgrades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .fcgrades button { padding: 11px 6px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--ink); }
  .fcgrades button small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .fcgrades button:hover { background: var(--surface-2); }
  .fcgrades .g-again { border-bottom: 3px solid var(--bad); }
  .fcgrades .g-hard { border-bottom: 3px solid var(--gold); }
  .fcgrades .g-good { border-bottom: 3px solid var(--blue); }
  .fcgrades .g-easy { border-bottom: 3px solid var(--good); }
  .fcmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  /* quiz */
  .quizhead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .quizhead .progressbar { flex: 1; }
  .bigresult { text-align: center; padding: 30px 20px; }
  .bigresult .pct { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; }
  .bigresult .msg { font-size: 17px; color: var(--ink-2); margin: 6px 0 20px; }

  /* toast + banner */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 20px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
  #toast.show { opacity: 1; }
  .banner { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 16px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 16px; }
  .searchbox { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); font-size: 15px; font-family: inherit; margin-bottom: 14px; }
  .phrase-cat h3 { margin-top: 24px; }
  kbd { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 5px; padding: 1px 6px; font-size: 12.5px; font-family: inherit; }
  .footer-note { color: var(--muted); font-size: 12.5px; margin-top: 40px; text-align: center; }
  .grammar-body p { margin: 9px 0; }
  .grammar-body ul { margin: 8px 0; padding-left: 22px; }
  .grammar-body li { margin: 4px 0; }
  .checklist { list-style: none; padding: 0; }
  .checklist li { padding: 4px 0 4px 26px; position: relative; }
  .checklist li::before { content: "✓"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Course navigation"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="importfile" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* =====================================================================
   IMPARA L'ITALIANO — single-file Italian course, A1 → B2
   Content data first, then the app engine.
   ===================================================================== */

const COURSE = [];
COURSE.push({
  id: "a1", short: "A1", icon: "🌱", label: "Level A1 — Beginner",
  tagline: "First words & survival basics",
  desc: "Start from absolute zero: pronunciation, greetings, essential verbs, and the grammar you need to introduce yourself, order a coffee and get around."
, units: [] });

levelById("a1").units.push(
{
  id: "a1u1", title: "Ciao! Sounds & greetings",
  subtitle: "Italian pronunciation, greetings and courtesy — your first conversation",
  grammar: `
<h3>The good news about Italian</h3>
<p>Italian is written almost exactly as it sounds. Once you learn a handful of rules, you can pronounce <i>any</i> word you read — no surprises like English "though / tough / through".</p>
<h3>Vowels — always pure, always pronounced</h3>
<table class="gr">
<tr><th>Letter</th><th>Sound</th><th>Example</th></tr>
<tr><td><b>a</b></td><td>like "a" in <i>father</i></td><td><b>casa</b> (house)</td></tr>
<tr><td><b>e</b></td><td>like "e" in <i>bed</i></td><td><b>bene</b> (well)</td></tr>
<tr><td><b>i</b></td><td>like "ee" in <i>see</i></td><td><b>vino</b> (wine)</td></tr>
<tr><td><b>o</b></td><td>like "o" in <i>sort</i> (short)</td><td><b>otto</b> (eight)</td></tr>
<tr><td><b>u</b></td><td>like "oo" in <i>moon</i></td><td><b>uno</b> (one)</td></tr>
</table>
<h3>The consonant rules that matter</h3>
<table class="gr">
<tr><th>Spelling</th><th>Sound</th><th>Example</th></tr>
<tr><td><b>c</b> + a/o/u</td><td>hard "k"</td><td><b>casa</b>, <b>come</b></td></tr>
<tr><td><b>c</b> + e/i</td><td>"ch" as in <i>church</i></td><td><b>ciao</b>, <b>cena</b> (dinner)</td></tr>
<tr><td><b>ch</b> + e/i</td><td>hard "k"</td><td><b>che</b>, <b>chi</b></td></tr>
<tr><td><b>g</b> + a/o/u</td><td>hard "g" as in <i>go</i></td><td><b>gatto</b> (cat)</td></tr>
<tr><td><b>g</b> + e/i</td><td>"j" as in <i>jelly</i></td><td><b>gelato</b></td></tr>
<tr><td><b>gh</b> + e/i</td><td>hard "g"</td><td><b>spaghetti</b></td></tr>
<tr><td><b>gn</b></td><td>"ny" as in <i>canyon</i></td><td><b>gnocchi</b>, <b>signore</b></td></tr>
<tr><td><b>gli</b></td><td>"lli" as in <i>million</i></td><td><b>famiglia</b> (family)</td></tr>
<tr><td><b>sc</b> + e/i</td><td>"sh"</td><td><b>pesce</b> (fish)</td></tr>
<tr><td><b>z</b></td><td>"ts" or "dz"</td><td><b>pizza</b>, <b>zero</b></td></tr>
<tr><td>double letters</td><td>held longer — it matters!</td><td><b>pala</b> (shovel) vs <b>palla</b> (ball)</td></tr>
</table>
<div class="tip"><b>Stress tip:</b> most words are stressed on the second-to-last syllable: par-<b>LA</b>-re, ra-<b>GAZ</b>-zo. A final accented vowel (città, caffè) means the stress falls there — and the accent is part of the spelling.</div>
<h3>Greeting people</h3>
<p>Italian has an informal register (friends, family, young people — <b>tu</b>) and a formal one (strangers, older people, shops and offices — <b>Lei</b>). The safest all-day greeting with strangers is <b>buongiorno</b>; switch to <b>buonasera</b> from late afternoon. <b>Ciao</b> is informal — both "hi" and "bye".</p>
<div class="tip"><b>Culture note:</b> <b>Come stai?</b> (how are you, informal) vs <b>Come sta?</b> (formal). A typical reply: <b>Bene, grazie. E tu? / E Lei?</b></div>`,
  examples: [
    ["Buongiorno! Come sta?", "Good morning! How are you? (formal)"],
    ["Ciao, come stai? — Bene, grazie, e tu?", "Hi, how are you? — Fine, thanks, and you?"],
    ["Mi chiamo Marco. Piacere!", "My name is Marco. Nice to meet you!"],
    ["Scusi, parla inglese?", "Excuse me, do you speak English? (formal)"],
    ["Grazie mille! — Prego!", "Thanks a lot! — You're welcome!"],
    ["Arrivederci, a domani!", "Goodbye, see you tomorrow!"]
  ],
  vocab: [
    ["ciao", "hi / bye (informal)"],
    ["buongiorno", "good morning / good day"],
    ["buonasera", "good evening"],
    ["buonanotte", "good night"],
    ["arrivederci", "goodbye (polite)"],
    ["salve", "hello (neutral)"],
    ["grazie", "thank you"],
    ["grazie mille", "thanks a lot"],
    ["prego", "you're welcome / please, go ahead"],
    ["per favore", "please"],
    ["scusa / scusi", "excuse me (informal / formal)"],
    ["mi dispiace", "I'm sorry"],
    ["sì", "yes"],
    ["no", "no"],
    ["piacere", "nice to meet you"],
    ["mi chiamo…", "my name is…"],
    ["come stai?", "how are you? (informal)"],
    ["come sta?", "how are you? (formal)"],
    ["bene", "well / fine"],
    ["molto bene", "very well"],
    ["così così", "so-so"],
    ["a domani", "see you tomorrow"],
    ["a presto", "see you soon"],
    ["benvenuto", "welcome"]
  ],
  exercises: [
    { t: "mcq", q: "How is the <b class='it'>c</b> in <b class='it'>ciao</b> pronounced?", opts: ["like 'ch' in church", "like 'k' in kite", "like 's' in sun", "silent"], a: 0, ex: "c + i/e = the 'ch' sound. c + a/o/u = hard 'k'." },
    { t: "mcq", q: "How is <b class='it'>chiesa</b> (church) pronounced at the start?", opts: ["KYE-za (hard k)", "CHE-za (like church)", "SHE-za", "HYE-za"], a: 0, ex: "The 'h' hardens the c: ch + e/i = 'k' sound." },
    { t: "mcq", q: "It's 8 pm and you meet your elderly neighbour. You say:", opts: ["Buonasera!", "Ciao!", "Buonanotte!", "Pronto!"], a: 0, ex: "Buonasera = evening greeting. Buonanotte is only for saying goodbye at bedtime; ciao is too informal." },

<div class="tip"><b>Key habit:</b> Italian usually <b>drops the pronoun</b> — the verb ending already tells you who. <b>Sono italiano</b> = I am Italian. Use the pronoun only for emphasis or contrast: <i>io sono italiano, lei è francese</i>.</div>

<h3>One pattern, hundreds of verbs</h3>
<p>Italian verbs come in three families, named after their infinitive endings: <b>-are</b> (parlare), <b>-ere</b> (scrivere), <b>-ire</b> (dormire). Chop off the ending, add the right suffix:</p>

<h3>Adjectives agree with their noun</h3>
<p>An adjective changes its ending to match the gender and number of the noun it describes:</p>
<table class="gr">
<tr><th>Type</th><th>masc. sing.</th><th>fem. sing.</th><th>masc. pl.</th><th>fem. pl.</th></tr>
<tr><td>-o adjectives</td><td>ragazzo alt<b>o</b></td><td>ragazza alt<b>a</b></td><td>ragazzi alt<b>i</b></td><td>ragazze alt<b>e</b></td></tr>
<tr><td>-e adjectives</td><td>libro grand<b>e</b></td><td>casa grand<b>e</b></td><td>libri grand<b>i</b></td><td>case grand<b>i</b></td></tr>
</table>
<div class="tip"><b>Mixed groups are masculine:</b> Marco e Anna sono simpatic<b>i</b>. And some colors never change: <b>rosa, blu, viola</b> — una macchina blu, due macchine blu.</div>
<h3>Position: usually AFTER the noun</h3>
<p>Unlike English: <b>una casa grande</b>, <b>un vino rosso</b>. A few very common adjectives often go before: bello, brutto, buono, bravo, grande, piccolo, nuovo, vecchio, giovane — <b>una bella casa</b>.</p>
<h3>Molto — two jobs</h3>
<ul>
<li>Before an adjective = "very", <b>never changes</b>: sono molto stanch<b>e</b> (they f. are very tired)</li>
<li>Before a noun = "a lot of", <b>agrees</b>: molt<b>i</b> libri, molt<b>a</b> pasta</li>
</ul>
<h3>Describing people</h3>
<p><b>Com'è?</b> = What's he/she/it like? — È alto, simpatico e un po' timido. Use <b>essere</b> + adjective for qualities; remember <b>avere</b> for features: <b>ha i capelli neri</b> (has black hair), <b>ha gli occhi verdi</b> (has green eyes).</p>`,

  grammar: `
<h3>Possessives — article + possessive</h3>
<p>Italian says "the my book": <b>il mio libro</b>. The possessive agrees with the <i>thing owned</i>, not the owner:</p>
<table class="gr">
<tr><th></th><th>masc. sing.</th><th>fem. sing.</th><th>masc. pl.</th><th>fem. pl.</th></tr>
<tr><td>my</td><td>il mio</td><td>la mia</td><td>i miei</td><td>le mie</td></tr>
<tr><td>your (tu)</td><td>il tuo</td><td>la tua</td><td>i tuoi</td><td>le tue</td></tr>
<tr><td>his / her</td><td>il suo</td><td>la sua</td><td>i suoi</td><td>le sue</td></tr>
<tr><td>our</td><td>il nostro</td><td>la nostra</td><td>i nostri</td><td>le nostre</td></tr>
<tr><td>your (voi)</td><td>il vostro</td><td>la vostra</td><td>i vostri</td><td>le vostre</td></tr>
<tr><td>their</td><td>il loro</td><td>la loro</td><td>i loro</td><td>le loro</td></tr>
</table>
<div class="tip"><b>The family exception:</b> with <i>singular</i> family members, drop the article: <b>mia madre</b>, <b>tuo fratello</b>, <b>sua sorella</b>. But keep it in the plural (<b>i miei fratelli</b>) and always with <b>loro</b> (<b>la loro madre</b>).</div>
<div class="tip"><b>His or her?</b> <b>il suo libro</b> can mean his book OR her book — suo agrees with <i>libro</i>, not with the owner. Context does the rest.</div>
<h3>C'è / Ci sono — there is / there are</h3>
<p><b>C'è un problema</b> (there's a problem) · <b>Ci sono due bagni</b> (there are two bathrooms) · <b>Non c'è tempo</b> (there's no time). Question: <b>C'è un bar qui vicino?</b></p>
<h3>The core prepositions</h3>
<table class="gr">
<tr><td><b>di</b></td><td>of / from</td><td>il libro di Anna, sono di Roma</td></tr>

<tr><td><b>con</b></td><td>with</td><td>esco con gli amici</td></tr>
<tr><td><b>per</b></td><td>for</td><td>un regalo per te</td></tr>
</table>`,

<h3>The everyday past tense</h3>
<p>The <b>passato prossimo</b> is how spoken Italian says "I ate", "I have eaten", "I did eat" — all three. It's built with a helper (usually <b>avere</b>) + the <b>past participle</b>:</p>

  grammar: `
<h3>Some verbs take essere instead</h3>
<p>Verbs of <b>movement</b> (andare, venire, arrivare, partire, uscire, entrare, tornare), <b>change or state</b> (nascere, morire, diventare, restare, stare) and <b>all reflexive verbs</b> build the passato prossimo with <b>essere</b>. And then something special happens:</p>
<p style="text-align:center;font-size:17px">the participle <b>agrees like an adjective</b></p>
<table class="gr">
<tr><td>Marco è andat<b>o</b> a Roma.</td><td>Marco went to Rome.</td></tr>
<tr><td>Anna è andat<b>a</b> a Roma.</td><td>Anna went to Rome.</td></tr>
<tr><td>I ragazzi sono andat<b>i</b> a Roma.</td><td>The boys went to Rome.</td></tr>
<tr><td>Le ragazze sono andat<b>e</b> a Roma.</td><td>The girls went to Rome.</td></tr>
</table>
<h3>Essere-verb participles worth memorizing</h3>
<table class="gr">
<tr><td>venire → <b>venuto</b></td><td>nascere → <b>nato</b></td><td>morire → <b>morto</b></td></tr>
<tr><td>rimanere → <b>rimasto</b></td><td>essere/stare → <b>stato</b></td><td>succedere → <b>successo</b></td></tr>
</table>
<div class="tip"><b>How to decide avere vs essere?</b> If the verb can take a direct object (eat <i>what?</i>, read <i>what?</i>) → avere. If it describes the subject moving or changing state (go, arrive, become, be born) → essere. <b>Essere itself takes essere:</b> Sono stato a Roma = I've been to Rome.</div>
<div class="tip"><b>Trap:</b> some motion-ish verbs take avere because they act on an object or describe the manner of motion: ho <b>camminato</b>, ho <b>viaggiato</b>, ho <b>ballato</b>. But with essere-verbs the rule is firm: <i>Siamo arrivati!</i></div>`,

<h3>Indirect + direct, in that order</h3>
<p>When an indirect pronoun (mi, ti, gli, le, ci, vi) meets a direct one (lo, la, li, le, ne), they combine — and the indirect one changes its i to e:</p>

<h3>Informal commands (tu, noi, voi)</h3>
<table class="gr">
<tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th><th>finire</th></tr>
<tr><th>tu!</th><td>parl<b>a</b>!</td><td>prend<b>i</b>!</td><td>dorm<b>i</b>!</td><td>fin<b>isci</b>!</td></tr>
<tr><th>noi!</th><td>parliamo!</td><td>prendiamo!</td><td>dormiamo!</td><td>finiamo!</td></tr>
<tr><th>voi!</th><td>parlate!</td><td>prendete!</td><td>dormite!</td><td>finite!</td></tr>
</table>
<p>Note the -are twist: tu parl<b>a</b>! (though the present is "parli"). Noi-imperative = "let's": <b>Andiamo!</b> (Let's go!)</p>
<h3>Five tiny irregulars</h3>
<p><b>va'!</b> (go!) · <b>fa'!</b> (do!) · <b>da'!</b> (give!) · <b>sta'!</b> (stay!) · <b>di'!</b> (say!) — plus <b>sii!</b> (be!) and <b>abbi!</b> (have!)</p>

<p><b>Non parlare!</b> (Don't talk!) · <b>Non ti preoccupare!</b> (Don't worry!) — but voi: <b>Non parlate!</b></p>
<h3>Pronouns stick to the end (informal)</h3>

<h3>A mood, not a tense</h3>
<p>The <b>congiuntivo</b> appears after verbs of opinion, doubt, emotion and desire — where you present something as <i>thought</i> rather than fact:</p>
<p style="text-align:center;font-size:16.5px">So che Marco <b>è</b> stanco. (fact — indicative)<br>Penso che Marco <b>sia</b> stanco. (opinion — subjunctive)</p>
<h3>Forming the congiuntivo presente</h3>
<table class="gr">
<tr><th></th><th>parlare</th><th>prendere</th><th>dormire</th><th>finire</th></tr>
<tr><th>io/tu/lui</th><td>parl<b>i</b></td><td>prend<b>a</b></td><td>dorm<b>a</b></td><td>finisc<b>a</b></td></tr>
<tr><th>noi</th><td>parl<b>iamo</b></td><td>prend<b>iamo</b></td><td>dorm<b>iamo</b></td><td>fin<b>iamo</b></td></tr>
<tr><th>loro</th><td>parl<b>ino</b></td><td>prend<b>ano</b></td><td>dorm<b>ano</b></td><td>finisc<b>ano</b></td></tr>
</table>
<p>Singular forms are all identical, so add the pronoun if unclear: <i>penso che <b>tu</b> parli troppo</i>.</p>
<h3>Irregulars you'll need immediately</h3>
<table class="gr">
<tr><td>essere → <b>sia</b></td><td>avere → <b>abbia</b></td><td>andare → <b>vada</b></td><td>fare → <b>faccia</b></td></tr>

<h3>Comparing things</h3>
<table class="gr">
<tr><td>more … than</td><td><b>più … di</b></td><td>Roma è <b>più</b> grande <b>di</b> Firenze.</td></tr>
<tr><td>less … than</td><td><b>meno … di</b></td><td>Il treno è <b>meno</b> caro <b>dell'</b>aereo.</td></tr>
<tr><td>as … as</td><td><b>(così) … come / (tanto) … quanto</b></td><td>Anna è alta <b>come</b> Marco.</td></tr>
</table>
<div class="tip"><b>di or che?</b> Use <b>di</b> before nouns/pronouns (più alto di me). Use <b>che</b> when comparing two adjectives, verbs or prepositional phrases: È più furbo <b>che</b> intelligente · Mi piace più leggere <b>che</b> guardare la TV.</div>
<h3>Superlatives</h3>
<ul>
<li>Relative: <b>il più / il meno</b> … di — È <b>il</b> ristorante <b>più</b> buono <b>della</b> città. (the best in town)</li>
<li>Absolute: <b>-issimo</b> — buon<b>issimo</b>, bell<b>issima</b>, stanch<b>issimi</b> (extremely…)</li>
</ul>
<h3>The famous irregulars</h3>
<table class="gr">
<tr><th>adjective</th><th>comparative</th><th>superlative</th></tr>
<tr><td>buono</td><td><b>migliore</b> (better)</td><td><b>il migliore / ottimo</b></td></tr>
<tr><td>cattivo</td><td><b>peggiore</b> (worse)</td><td><b>il peggiore / pessimo</b></td></tr>
<tr><td>bene (adv.)</td><td><b>meglio</b></td><td>benissimo</td></tr>
<tr><td>male (adv.)</td><td><b>peggio</b></td><td>malissimo</td></tr>
</table>
<div class="tip"><b>meglio vs migliore:</b> migliore describes nouns (un vino migliore); meglio modifies verbs (canti meglio di me). Same split as good/better vs well/better in careful English.</div>
<h3>Relative pronouns — joining sentences</h3>
<ul>
<li><b>che</b> = who/which/that (subject or object): il libro <b>che</b> leggo · la ragazza <b>che</b> parla</li>

<li><b>il/la quale</b> — formal alternative: la signora <b>la quale</b>… (recognize it, use che/cui)</li>
<li><b>quello che / ciò che</b> = what (the thing that): Non capisco <b>quello che</b> dici.</li>
</ul>`,

<h3>The full passive — essere + participle</h3>
<p>Like English, with agreement everywhere:</p>

<p>Italian's favorite trick: <b>si</b> + active verb, agreeing with the noun:</p>

<p>When the reporting verb is past (ha detto / disse), everything steps back:</p>

<tr><td>«Ho vinto!»</td><td>Ha detto che <b>aveva vinto</b></td></tr>
<tr><td>«Verrò domani»</td><td>Ha detto che <b>sarebbe venuto</b> il giorno dopo</td></tr>
<tr><td>«Vieni!»</td><td>Ha detto <b>di venire</b></td></tr>
</table>

<tr><td>Ti ringrazio!</td><td>La ringrazio per la Sua disponibilità.</td></tr>
<tr><td>Un abbraccio / A presto</td><td>Cordiali saluti / Distinti saluti</td></tr>
</table>
<p>In formal letters, capitalize the formal pronouns: <b>Le</b> scrivo, la <b>Sua</b> richiesta, ringraziando<b>La</b>.</p>
<h3>Structuring an argument (essay & speaking exam gold)</h3>
<ul>
<li><b>Opening:</b> Al giorno d'oggi… (nowadays) · Si discute spesso di… · Per quanto riguarda… (as far as X is concerned)</li>
<li><b>Ordering:</b> In primo luogo… in secondo luogo… (firstly… secondly) · Da un lato… dall'altro… (on one hand… on the other)</li>
<li><b>Conceding:</b> Bisogna ammettere che… (one must admit) · È vero che…, tuttavia…</li>
<li><b>Opinion:</b> A mio avviso / A mio parere (in my view) · Sono convinto che + subj. · Ritengo che + subj.</li>
<li><b>Concluding:</b> In conclusione… · Tutto sommato… (all things considered) · Insomma…</li>
</ul>
<h3>Nouns from verbs — the abstract register</h3>
<p>Formal Italian loves nouns: crescere → <b>la crescita</b> (growth), scegliere → <b>la scelta</b>, sviluppare → <b>lo sviluppo</b> (development), migliorare → <b>il miglioramento</b>, aumentare → <b>l'aumento</b>, diminuire → <b>la diminuzione</b>.</p>

<div class="tip"><b>Keep going after B2:</b> read Italian news (ANSA, Il Post), watch films with Italian subtitles, and switch your phone to Italian. Comprehensible input + the grammar you now have = C1.</div>`,

const STORE_KEY = "impara-italiano-v1";
const DEFAULTS = {
  completed: {},        // unitId -> true
  quizScores: {},       // unitId -> best %
  srs: {},              // cardId -> {r: reps, e: ease*100, i: interval days, d: due ts}
  xp: 0,
  streak: 0,
  lastDay: null,        // "YYYY-MM-DD" of last activity
  bestStreak: 0,
  reviewsDone: 0,
  settings: { dir: "it2en", newPerDay: 15, theme: "auto", levels: { a1: true, a2: true, b1: false, b2: false } },
  newIntro: {},         // "YYYY-MM-DD" -> count of new cards introduced
};

function cloneDefaults() { return JSON.parse(JSON.stringify(DEFAULTS)); }
function boundedInt(value, min, max, fallback) {
  return Number.isFinite(value) ? Math.min(max, Math.max(min, Math.floor(value))) : fallback;
}
function validDateKey(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = new Date(value + "T00:00:00");
  return Number.isFinite(d.getTime()) && d.getFullYear() === +value.slice(0, 4)
    && d.getMonth() + 1 === +value.slice(5, 7) && d.getDate() === +value.slice(8, 10);
}
function sanitizeProgress(input) {
  if (!input || typeof input !== "object" || Array.isArray(input)) throw new Error("Invalid progress file");

  const out = cloneDefaults();
  const unitIds = new Set();
  const cardIds = new Set();
  for (const lvl of COURSE) for (const unit of lvl.units) {
    unitIds.add(unit.id);
    unit.vocab.forEach((_, i) => cardIds.add(unit.id + ":" + i));
  }

  const completed = input.completed && typeof input.completed === "object" && !Array.isArray(input.completed) ? input.completed : {};
  for (const id of unitIds) if (completed[id] === true) out.completed[id] = true;

  const scores = input.quizScores && typeof input.quizScores === "object" && !Array.isArray(input.quizScores) ? input.quizScores : {};
  for (const id of unitIds) if (Number.isFinite(scores[id])) out.quizScores[id] = boundedInt(scores[id], 0, 100, 0);

  const incomingSrs = input.srs && typeof input.srs === "object" && !Array.isArray(input.srs) ? input.srs : {};
  const maxDue = Date.UTC(2100, 0, 1);
  for (const id of cardIds) {
    const rec = incomingSrs[id];
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    if (![rec.r, rec.e, rec.i, rec.d].some(Number.isFinite)) continue;
    out.srs[id] = {
      r: boundedInt(rec.r, 0, 1000000, 0),
      e: boundedInt(rec.e, 130, 280, 250),
      i: boundedInt(rec.i, 0, 36500, 0),
      d: boundedInt(rec.d, 0, maxDue, 0)
    };
  }

  out.xp = boundedInt(input.xp, 0, 1000000000, 0);
  out.streak = boundedInt(input.streak, 0, 1000000, 0);
  out.bestStreak = Math.max(out.streak, boundedInt(input.bestStreak, 0, 1000000, 0));
  out.reviewsDone = boundedInt(input.reviewsDone, 0, 1000000000, 0);
  out.lastDay = validDateKey(input.lastDay) ? input.lastDay : null;

  const settings = input.settings && typeof input.settings === "object" && !Array.isArray(input.settings) ? input.settings : {};
  if (["it2en", "en2it", "mix"].includes(settings.dir)) out.settings.dir = settings.dir;
  if ([5, 10, 15, 20, 30, 50].includes(settings.newPerDay)) out.settings.newPerDay = settings.newPerDay;
  if (["auto", "light", "dark"].includes(settings.theme)) out.settings.theme = settings.theme;
  const levels = settings.levels && typeof settings.levels === "object" && !Array.isArray(settings.levels) ? settings.levels : {};
  for (const lvl of COURSE) if (typeof levels[lvl.id] === "boolean") out.settings.levels[lvl.id] = levels[lvl.id];

  const intro = input.newIntro && typeof input.newIntro === "object" && !Array.isArray(input.newIntro) ? input.newIntro : {};
  for (const [day, count] of Object.entries(intro)) {
    if (validDateKey(day) && Number.isFinite(count)) out.newIntro[day] = boundedInt(count, 0, 10000, 0);
  }
  return out;
}

const store = {
  data: cloneDefaults(),
  memOnly: false,
  load() {
    this.data = cloneDefaults();
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        try { this.data = sanitizeProgress(JSON.parse(raw)); }
        catch (e) { localStorage.removeItem(STORE_KEY); }
      }
      localStorage.setItem(STORE_KEY + "-probe", "1");
      localStorage.removeItem(STORE_KEY + "-probe");
    } catch (e) {
      this.memOnly = true;
      this.data = cloneDefaults();
    }
  },
  save() {
    if (this.memOnly) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; }
  }
};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function recordActivity() {
  const t = todayStr();
  const s = store.data;
  if (s.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  s.streak = (s.lastDay === yStr) ? s.streak + 1 : 1;
  s.bestStreak = Math.max(s.bestStreak, s.streak);
  s.lastDay = t;
  store.save();
  renderSidebar();
}
function addXP(n) { store.data.xp += n; recordActivity(); store.save(); }

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function stripDiacritics(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function normAnswer(s, keepAccents) {
  let x = s.toLowerCase().trim().replace(/[.,!?;:"«»]/g, "").replace(/’/g, "'").replace(/\s+/g, " ");
  if (!keepAccents) x = stripDiacritics(x);
  return x;
}
// returns: 2 exact, 1 correct-but-accent-slip, 0 wrong
function matchAnswer(given, answers) {
  const list = Array.isArray(answers) ? answers : [answers];
  for (const a of list) if (normAnswer(given, true) === normAnswer(a, true)) return 2;
  for (const a of list) if (normAnswer(given, false) === normAnswer(a, false)) return 1;
  return 0;
}

let voicesReady = false;
if ("speechSynthesis" in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
}
function speak(text) {
  if (!("speechSynthesis" in window)) { toast("Speech not supported in this browser"); return; }
  const clean = text.replace(/\(.*?\)/g, "").replace(/\/.*$/, "");
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "it-IT"; u.rate = 0.92;
  const v = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("it"));
  if (v.length) u.voice = v.find(x => x.localService) || v[0];
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function speakBtn(text) { return `<button class="speakbtn" type="button" title="Listen" aria-label="Listen to Italian pronunciation" onclick="speak(${JSON.stringify(text).replace(/"/g, "&quot;")});event.stopPropagation()">🔊</button>`; }

const ACCENT_CHARS = ["à", "è", "é", "ì", "ò", "ù"];
function accentBar(inputId) {
  return `<div class="accents">` + ACCENT_CHARS.map(c =>
    `<button type="button" tabindex="-1" onclick="insAccent('${inputId}','${c}')">${c}</button>`).join("") + `</div>`;
}
function insAccent(id, ch) {
  const el = document.getElementById(id);
  if (!el) return;
  const s = el.selectionStart || el.value.length;
  el.value = el.value.slice(0, s) + ch + el.value.slice(el.selectionEnd || s);
  el.focus(); el.selectionStart = el.selectionEnd = s + 1;
}

function unitById(id) {
  for (const lvl of COURSE) for (const u of lvl.units) if (u.id === id) return { lvl, unit: u };
  return null;
}
function levelById(id) { return COURSE.find(l => l.id === id); }
function levelProgress(lvl) {
  const done = lvl.units.filter(u => store.data.completed[u.id]).length;
  return { done, total: lvl.units.length, pct: Math.round(100 * done / lvl.units.length) };
}
function nextUnfinishedUnit() {
  for (const lvl of COURSE) for (const u of lvl.units) if (!store.data.completed[u.id]) return { lvl, unit: u };
  return null;
}

/* =====================================================================
   SRS ENGINE (SM-2 style, simplified)
   ===================================================================== */
const DAY = 86400000;
function allCards() {
  const cards = [];
  for (const lvl of COURSE) {
    if (!store.data.settings.levels[lvl.id]) continue;
    for (const u of lvl.units) {
      u.vocab.forEach((v, i) => cards.push({ id: u.id + ":" + i, it: v[0], en: v[1], unit: u, lvl }));
    }
  }
  return cards;
}
function srsState(id) { return store.data.srs[id] || null; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => { const s = srsState(c.id); return s && s.d <= now; });
}
function newCards() { return allCards().filter(c => !srsState(c.id)); }
function newBudgetLeft() {
  const t = todayStr();
  const used = store.data.newIntro[t] || 0;
  return Math.max(0, store.data.settings.newPerDay - used);
}
function gradeCard(card, grade) { // 0 again, 1 hard, 2 good, 3 easy
  const s = store.data.srs[card.id] || { r: 0, e: 250, i: 0, d: 0 };
  const isNew = !store.data.srs[card.id];
  if (isNew) {
    const t = todayStr();
    store.data.newIntro[t] = (store.data.newIntro[t] || 0) + 1;
  }
  if (grade === 0) {
    s.r = 0; s.i = 0; s.d = Date.now() + 10 * 60000; s.e = Math.max(130, s.e - 20);
  } else {
    if (grade === 1) { s.i = Math.max(1, Math.round(s.i * 1.2)) || 1; s.e = Math.max(130, s.e - 15); }
    else if (grade === 2) { s.i = s.r === 0 ? 1 : (s.r === 1 ? 3 : Math.round(s.i * s.e / 100)); }
    else { s.i = s.r === 0 ? 4 : Math.round(s.i * s.e / 100 * 1.3); s.e = Math.min(280, s.e + 15); }
    s.r += 1;
    s.d = Date.now() + s.i * DAY;
  }
  store.data.srs[card.id] = s;
  store.data.reviewsDone += 1;
  addXP(grade === 0 ? 1 : 2);
  store.save();
}

/* =====================================================================
   EXERCISE RENDERING
   Exercise types:
     {t:'mcq', q, opts:[...], a: idx, ex?}      — multiple choice
     {t:'fill', q (use ___), a: [answers], ex?} — type the missing word(s)
     {t:'tr', q (english), a: [answers], ex?}   — translate into Italian
   ===================================================================== */
let EX_SEQ = 0;
const exHandlers = {};       // id -> {onAnswer(correct)}
function renderExercise(ex, num, opts) {
  opts = opts || {};
  const id = "ex" + (++EX_SEQ);
  exHandlers[id] = { ex, answered: false, cb: opts.onAnswer || null };
  let inner = "";
  const qhtml = `<div class="q"><span class="qnum">${num}</span>${ex.q}</div>`;
  if (ex.t === "mcq") {
    const order = shuffle(ex.opts.map((o, i) => i));
    exHandlers[id].order = order;
    inner = qhtml + `<div class="opts">` + order.map((oi, pos) =>
      `<button class="optbtn" id="${id}-o${pos}" onclick="answerMCQ('${id}',${pos})">${esc(ex.opts[oi])}</button>`
    ).join("") + `</div><div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  } else {
    const label = ex.t === "tr" ? "Translate into Italian:" : "";
    inner = `<div class="q"><span class="qnum">${num}</span>${label ? label + " " : ""}${ex.t === "tr" ? "<b>" + esc(ex.q) + "</b>" : ex.q}</div>
      <div class="fillrow">
        <input type="text" id="${id}-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ex.t === "tr" ? "Type the Italian…" : "Type the missing word…"}" onkeydown="if(event.key==='Enter')answerFill('${id}')">
        <button class="btn small" onclick="answerFill('${id}')">Check</button>
      </div>
      ${accentBar(id + "-in")}
      <div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  }
  return `<div class="exwrap" id="${id}">${inner}</div>`;
}
function finishExercise(id, correct, extraMsg) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  h.answered = true;
  const v = document.getElementById(id + "-v");
  const ex = h.ex;
  if (correct) {
    v.className = "verdict ok";
    v.innerHTML = "✓ Correct!" + (extraMsg ? ` <span class="expl">${extraMsg}</span>` : "") + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
    addXP(5);
  } else {
    v.className = "verdict no";
    const ans = ex.t === "mcq" ? ex.opts[ex.a] : (Array.isArray(ex.a) ? ex.a[0] : ex.a);
    v.innerHTML = `✗ Not quite. Answer: <b class="it">${esc(ans)}</b>` + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
  }
  if (h.cb) h.cb(correct);
}
function answerMCQ(id, pos) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const ex = h.ex, chosen = h.order[pos];
  const correct = chosen === ex.a;
  for (let p = 0; p < h.order.length; p++) {
    const b = document.getElementById(id + "-o" + p);
    b.disabled = true;
    if (h.order[p] === ex.a) b.classList.add("right");
    else if (p === pos && !correct) b.classList.add("wrong");
  }
  finishExercise(id, correct);
}
function answerFill(id) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const val = document.getElementById(id + "-in").value;
  if (!val.trim()) return;
  const m = matchAnswer(val, h.ex.a);
  document.getElementById(id + "-in").disabled = true;
  finishExercise(id, m > 0, m === 1 ? `Watch the accents: <b class="it">${esc(Array.isArray(h.ex.a) ? h.ex.a[0] : h.ex.a)}</b>` : null);
}

/* ---------- quiz session ---------- */
let quiz = null;
function uniqueTextOptions(correct, candidates) {
  const seen = new Set([String(correct)]);
  const distractors = [];
  for (const candidate of shuffle(candidates)) {
    const text = String(candidate);
    if (seen.has(text)) continue;
    seen.add(text);
    distractors.push(text);
    if (distractors.length === 3) break;
  }
  return shuffle([String(correct), ...distractors]);
}
function buildQuizQuestions(unit) {
  const authored = shuffle(unit.exercises).slice(0, 6);
  const vocabPool = shuffle(unit.vocab.map((v, i) => i)).slice(0, 10 - authored.length);
  const italianCounts = new Map();
  const englishCounts = new Map();
  for (const [it, en] of unit.vocab) {
    italianCounts.set(it, (italianCounts.get(it) || 0) + 1);
    englishCounts.set(en, (englishCounts.get(en) || 0) + 1);
  }
  const vocabQs = vocabPool.map(idx => {
    const v = unit.vocab[idx];
    const canAskItToEn = italianCounts.get(v[0]) === 1;
    const canAskEnToIt = englishCounts.get(v[1]) === 1;
    const askItToEn = !canAskEnToIt || (canAskItToEn && Math.random() < 0.5);
    if (askItToEn) {
      const opts = uniqueTextOptions(v[1], unit.vocab.map(o => o[1]));
      return { t: "mcq", q: `What does <b class="it">${esc(v[0])}</b> mean?`, opts, a: opts.indexOf(String(v[1])) };
    }
    const opts = uniqueTextOptions(v[0], unit.vocab.map(o => o[0]));
    return { t: "mcq", q: `How do you say “${esc(v[1])}” in Italian?`, opts, a: opts.indexOf(String(v[0])) };
  });
  return shuffle(authored.concat(vocabQs));
}
function viewQuizStart(uid) {
  const found = unitById(uid);
  if (!found) { document.getElementById("main").innerHTML = "<p>Unit not found.</p>"; return; }
  quiz = { uid, qs: buildQuizQuestions(found.unit), i: 0, correct: 0 };
  renderQuizQ();
}
function renderQuizQ() {
  const main = document.getElementById("main");
  const found = unitById(quiz.uid);
  if (quiz.i >= quiz.qs.length) { renderQuizResult(); return; }
  EX_SEQ = 0; for (const k in exHandlers) delete exHandlers[k];
  const q = quiz.qs[quiz.i];
  main.innerHTML = `<p style="margin:0 0 4px"><a href="#/unit/${quiz.uid}/quiz" onclick="quiz=null">← Quit quiz</a></p>
    <h1>Quiz: ${found.unit.title}</h1>
    <div class="quizhead"><span style="font-size:13.5px;color:var(--muted);font-weight:600">${quiz.i + 1} / ${quiz.qs.length}</span>
      <div class="progressbar blue"><i style="width:${Math.round(100 * quiz.i / quiz.qs.length)}%"></i></div></div>
    ${renderExercise(q, quiz.i + 1, { onAnswer: (ok) => { if (ok) quiz.correct++; showQuizNext(); } })}
    <div id="quiznext"></div>`;
}
function showQuizNext() {
  document.getElementById("quiznext").innerHTML =
    `<button class="btn primary" style="margin-top:6px" onclick="quiz.i++;renderQuizQ()">${quiz.i + 1 >= quiz.qs.length ? "See result →" : "Next →"}</button>`;
  document.getElementById("quiznext").querySelector("button").focus();
}
function renderQuizResult() {
  const pct = Math.round(100 * quiz.correct / quiz.qs.length);
  const uid = quiz.uid;
  const passed = pct >= 70;
  const prev = store.data.quizScores[uid];
  if (prev == null || pct > prev) store.data.quizScores[uid] = pct;
  if (passed && !store.data.completed[uid]) {
    store.data.completed[uid] = true;
    addXP(50);
  }
  store.save();
  const found = unitById(uid);
  const lvl = found.lvl;
  const idx = lvl.units.indexOf(found.unit);
  const nextU = lvl.units[idx + 1];
  document.getElementById("main").innerHTML = `<div class="card bigresult">
    <div style="font-size:44px">${passed ? "🎉" : "💪"}</div>
    <div class="pct" style="color:${passed ? "var(--good-text)" : "var(--bad)"}">${pct}%</div>
    <div class="msg">${passed ? (pct === 100 ? "Perfetto! Flawless." : "Bravissimo! Unit complete.") : "Almost — you need 70%. Review the lesson and try again."}</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${passed ? "" : `<button class="btn" onclick="go('unit/${uid}/learn')">Review lesson</button>`}
      <button class="btn" onclick="go('quiz/${uid}')">Retry quiz</button>
      ${passed && nextU ? `<button class="btn primary" onclick="go('unit/${nextU.id}')">Next unit →</button>` : `<button class="btn primary" onclick="go('level/${lvl.id}')">Back to ${lvl.short}</button>`}
    </div></div>`;
  quiz = null;
  renderSidebar();
}

/* ---------- flashcards ---------- */
function viewFlashHome() {
  const s = store.data.settings;
  const due = dueCards().length;
  const fresh = newCards().length;
  const budget = Math.min(newBudgetLeft(), fresh);
  const total = allCards().length;
  const learned = Object.keys(store.data.srs).filter(id => allCards().some(c => c.id === id)).length;
  return `<h1>🃏 Flashcards</h1>
  <p class="sub">Spaced repetition over every vocabulary word in the course — cards come back right before you'd forget them.</p>
  <div class="statrow">
    <div class="stat"><div class="v">${due}</div><div class="l">due for review</div></div>
    <div class="stat"><div class="v">${budget}</div><div class="l">new cards today</div></div>
    <div class="stat"><div class="v">${learned}/${total}</div><div class="l">cards started</div></div>
    <div class="stat"><div class="v">${store.data.reviewsDone}</div><div class="l">reviews all-time</div></div>
  </div>
  <div class="card">
    <b>Deck settings</b>
    <p style="font-size:14px;color:var(--ink-2);margin:8px 0 6px">Levels in your deck:</p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px">
      ${COURSE.map(l => `<label style="font-size:14.5px;cursor:pointer"><input type="checkbox" ${s.levels[l.id] ? "checked" : ""} onchange="store.data.settings.levels['${l.id}']=this.checked;store.save();render()"> ${l.short}</label>`).join("")}
    </div>
    <p style="font-size:14px;color:var(--ink-2);margin:8px 0 6px">Direction:
      <select onchange="store.data.settings.dir=this.value;store.save()" style="font-family:inherit;padding:4px 8px;border-radius:7px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink)">
        <option value="it2en" ${s.dir === "it2en" ? "selected" : ""}>Italian → English</option>
        <option value="en2it" ${s.dir === "en2it" ? "selected" : ""}>English → Italian</option>
        <option value="mix" ${s.dir === "mix" ? "selected" : ""}>Mixed</option>
      </select>
      &nbsp;&nbsp;New cards/day:
      <select onchange="store.data.settings.newPerDay=+this.value;store.save();render()" style="font-family:inherit;padding:4px 8px;border-radius:7px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink)">
        ${[5, 10, 15, 20, 30, 50].map(n => `<option ${s.newPerDay === n ? "selected" : ""}>${n}</option>`).join("")}
      </select></p>
    <button class="btn primary" style="margin-top:10px" onclick="go('flashrun')" ${due + budget === 0 ? "disabled" : ""}>
      ${due + budget === 0 ? "All done for today 🎉" : `Study ${due + budget} cards →`}</button>
  </div>`;
}

let fc = null;
function startFlashSession() {
  const due = shuffle(dueCards());
  const fresh = shuffle(newCards()).slice(0, newBudgetLeft());
  const queue = due.concat(fresh);
  if (!queue.length) { go("flash"); return; }
  fc = { queue, i: 0, revealed: false, done: 0, total: queue.length };
  renderFlashCard();
}
function renderFlashCard() {
  const main = document.getElementById("main");
  if (!fc || fc.i >= fc.queue.length) {
    main.innerHTML = `<div class="card bigresult"><div style="font-size:44px">🌟</div>
      <div class="pct" style="color:var(--good-text)">${fc ? fc.done : 0}</div>
      <div class="msg">reviews completed. A domani!</div>
      <button class="btn primary" onclick="go('flash')">Back to flashcards</button></div>`;
    fc = null; renderSidebar(); return;
  }
  const card = fc.queue[fc.i];
  const dirSetting = store.data.settings.dir;
  if (card._dir == null) card._dir = dirSetting === "mix" ? (Math.random() < 0.5 ? "it2en" : "en2it") : dirSetting;
  const front = card._dir === "it2en" ? card.it : card.en;
  const back = card._dir === "it2en" ? card.en : card.it;
  const isNew = !srsState(card.id);
  main.innerHTML = `<div class="fcstage">
    <div class="fcmeta"><span>${fc.i + 1} / ${fc.queue.length} ${isNew ? '· <b style="color:var(--blue)">new</b>' : ""}</span><span>${card.lvl.short} · ${card.unit.title}</span></div>
    <div class="progressbar blue" style="margin-bottom:14px"><i style="width:${Math.round(100 * fc.i / fc.queue.length)}%"></i></div>
    <div class="fcard" role="button" tabindex="0" aria-label="Flashcard. Activate to reveal the answer." onclick="flipCard()" onkeydown="if(event.key==='Enter'&&!fc.revealed)flipCard()">
      <div class="big">${esc(front)} ${card._dir === "it2en" ? speakBtn(card.it) : ""}</div>
      ${fc.revealed ? `<div class="ans">${esc(back)} ${card._dir === "en2it" ? speakBtn(card.it) : ""}</div>` : `<div class="hintline">tap to reveal · or press <kbd>Space</kbd></div>`}
    </div>
    ${fc.revealed ? `<div class="fcgrades">
      <button class="g-again" onclick="gradeFlash(0)">Again<small>&lt;10 min · 1</small></button>
      <button class="g-hard" onclick="gradeFlash(1)">Hard<small>~1 day · 2</small></button>
      <button class="g-good" onclick="gradeFlash(2)">Good<small>${nextIntPreview(card, 2)} · 3</small></button>
      <button class="g-easy" onclick="gradeFlash(3)">Easy<small>${nextIntPreview(card, 3)} · 4</small></button>
    </div>` : ""}
    <p style="text-align:center;margin-top:16px"><a href="#/flash" onclick="fc=null">End session</a></p></div>`;
}
function nextIntPreview(card, grade) {
  const s = store.data.srs[card.id] || { r: 0, e: 250, i: 0 };
  let days;
  if (grade === 2) days = s.r === 0 ? 1 : (s.r === 1 ? 3 : Math.round(s.i * s.e / 100));
  else days = s.r === 0 ? 4 : Math.round(s.i * s.e / 100 * 1.3);
  return days >= 30 ? Math.round(days / 30) + " mo" : days + " d";
}
function flipCard() { if (fc) { fc.revealed = true; renderFlashCard(); } }
function gradeFlash(g) {
  const card = fc.queue[fc.i];
  gradeCard(card, g);
  if (g === 0) fc.queue.push(card); // see it again this session
  fc.done++; fc.i++; fc.revealed = false;
  renderFlashCard();
}
document.addEventListener("keydown", (e) => {
  if (!fc || currentRoute() !== "flashrun") return;
  if (e.target.closest("input, select, textarea, a")) return;
  if (e.code === "Space" && !fc.revealed) { e.preventDefault(); flipCard(); }
  else if (fc.revealed && ["1", "2", "3", "4"].includes(e.key)) { gradeFlash(+e.key - 1); }
});

/* ---------- verbs reference ---------- */
function viewVerbs() {
  return `<h1>📖 Verb tables</h1>
  <p class="sub">The workhorse verbs of Italian, fully conjugated. Search, browse, listen.</p>
  <input class="searchbox" placeholder="Search verbs… (e.g. andare, to go)" oninput="filterVerbs(this.value)">
  <div id="verblist">${renderVerbList("")}</div>`;
}
function renderVerbList(filter) {
  const f = filter.toLowerCase().trim();
  const list = VERBS.filter(v => !f || v.inf.includes(f) || v.en.toLowerCase().includes(f));
  if (!list.length) return `<p class="sub">No verbs match “${esc(filter)}”.</p>`;
  return list.map((v, i) => `
    <div class="card">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <b style="font-size:18px" class="it">${v.inf}</b> ${speakBtn(v.inf)}
        <span style="color:var(--ink-2)">${v.en}</span>
        ${v.irr ? '<span class="pill">irregular</span>' : ""}
        ${v.aux === "essere" ? '<span class="pill blue">essere in compound tenses</span>' : ""}
        <span class="pill">p.p. <b>${v.pp}</b></span>
      </div>
      <table class="gr" style="margin-top:12px">
        <tr><th></th><th>Presente</th><th>Imperfetto</th><th>Futuro</th><th>Condizionale</th><th>Cong. presente</th></tr>
        ${["io", "tu", "lui/lei", "noi", "voi", "loro"].map((p, r) =>
          `<tr><th>${p}</th>${[0, 1, 2, 3, 4].map(c => `<td>${v.f[c][r]}</td>`).join("")}</tr>`).join("")}
      </table>
    </div>`).join("");
}
function filterVerbs(v) { document.getElementById("verblist").innerHTML = renderVerbList(v); }

/* ---------- phrasebook ---------- */
function viewPhrases() {
  return `<h1>💬 Phrasebook</h1>
  <p class="sub">Practical, ready-to-use phrases for real situations. Tap 🔊 to hear them.</p>
  <input class="searchbox" placeholder="Search phrases…" oninput="filterPhrases(this.value)">
  <div id="phraselist">${renderPhraseList("")}</div>`;
}
function renderPhraseList(filter) {
  const f = filter.toLowerCase().trim();
  return PHRASES.map(cat => {
    const items = cat.items.filter(p => !f || p[0].toLowerCase().includes(f) || p[1].toLowerCase().includes(f));
    if (!items.length) return "";
    return `<div class="phrase-cat"><h3>${cat.cat}</h3>
      ${items.map(p => `<div class="example"><b class="it">${esc(p[0])}</b> ${speakBtn(p[0])}<span class="en">${esc(p[1])}</span></div>`).join("")}</div>`;
  }).join("") || `<p class="sub">No phrases match “${esc(filter)}”.</p>`;
}
function filterPhrases(v) { document.getElementById("phraselist").innerHTML = renderPhraseList(v); }

/* ---------- data & settings ---------- */
function viewData() {
  const s = store.data;
  const size = JSON.stringify(s).length;
  return `<h1>⚙️ Data &amp; settings</h1>
  <p class="sub">Your progress lives in this browser${store.memOnly ? " — <b>but storage is blocked here, so export before closing!</b>" : "'s local storage"}. Export it to move between browsers or devices, or just as a backup.</p>
  <div class="card">
    <b>Backup &amp; restore</b>
    <p style="font-size:14px;color:var(--ink-2)">Export writes a small JSON file (${(size / 1024).toFixed(1)} KB) with your completed units, quiz scores, XP, streak and flashcard schedule. Import it on any other browser to pick up where you left off.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" onclick="exportProgress()">⬇️ Export progress (.json)</button>
      <button class="btn" onclick="document.getElementById('importfile').click()">⬆️ Import progress</button>
    </div>
  </div>
  <div class="card">
    <b>Appearance</b>
    <p style="font-size:14px;color:var(--ink-2);margin:8px 0 6px">Theme:
    <select onchange="setTheme(this.value)" style="font-family:inherit;padding:4px 8px;border-radius:7px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink)">
      ${["auto", "light", "dark"].map(t => `<option ${s.settings.theme === t ? "selected" : ""}>${t}</option>`).join("")}
    </select></p>
  </div>
  <div class="card">
    <b>Danger zone</b>
    <p style="font-size:14px;color:var(--ink-2)">Wipe all progress and start over. This cannot be undone (unless you exported a backup!).</p>
    <button class="btn" style="color:var(--bad);border-color:var(--bad)" onclick="resetAll()">Reset all progress</button>
  </div>
  <div class="card">
    <b>About</b>
    <p style="font-size:14px;color:var(--ink-2)">A self-contained Italian course: ${COURSE.reduce((n, l) => n + l.units.length, 0)} units across A1–B2, ${allCardsCount()} vocabulary cards, ${VERBS.length} conjugated verbs and a phrasebook. Works fully offline — audio uses your browser's built-in Italian voice. Keyboard shortcuts in flashcards: <kbd>Space</kbd> reveal, <kbd>1</kbd>–<kbd>4</kbd> grade.</p>
  </div>`;
}
function allCardsCount() { let n = 0; for (const l of COURSE) for (const u of l.units) n += u.vocab.length; return n; }
function setTheme(t) {
  store.data.settings.theme = t; store.save();
  applyTheme();
}
function applyTheme() {
  const t = store.data.settings.theme;
  const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
if (themeMedia.addEventListener) themeMedia.addEventListener("change", applyTheme);
else if (themeMedia.addListener) themeMedia.addListener(applyTheme);

function exportProgress() {
  const blob = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "impara-italiano-progress-" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast("Progress exported ⬇️");
}
document.getElementById("importfile").addEventListener("change", function () {
  const f = this.files[0]; this.value = "";
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast("That progress file is too large."); return; }
  const r = new FileReader();
  r.onload = () => {
    try {
      store.data = sanitizeProgress(JSON.parse(r.result));
      store.save(); applyTheme(); render();
      toast("Progress imported ✓");
    } catch (e) { toast("Couldn't read that file — is it an exported progress .json?"); }
  };
  r.onerror = () => toast("Couldn't read that file.");
  r.readAsText(f);
});
function resetAll() {
  if (!confirm("Really wipe ALL progress? Export a backup first if unsure.")) return;
  store.data = cloneDefaults();
  store.save(); applyTheme(); render();
  toast("Progress reset");
}

/* =====================================================================
   BOOT
   ===================================================================== */
store.load();
applyTheme();
render();
</script>
</body>
</html>

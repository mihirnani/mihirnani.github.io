}
function sandhiSplitQs() {
  return shuffled(SANDHI.splits).slice(0, 10).map(p =>
    ({ t: "fill", form: p[0], q: "Split this into its two words (IAST, with a space).", a: p[1], ex: p[2] }));
}
function viewSandhiQuiz(mode) {
  const banks = { join: sandhiJoinQs, split: sandhiSplitQs, rules: () => prepare(SANDHI.rules, 10) };
  const label = { join: "Join", split: "Split", rules: "Rules" }[mode] || "Join";
  quiz = { title: "Sandhi — " + label, back: "sandhi", kind: "sandhi", qs: (banks[mode] || banks.join)(), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>Sandhi — ${label}</h1><p class="sub">${quiz.qs.length} questions · ${strictOn() ? "exact IAST diacritics required" : "plain letters accepted for diacritics"}</p><div id="quizbox"></div>`;
}

/* ----------------------------------------------------------- dhātu lab */
function viewDhatu() {
  return `<h1>Dhātu lab</h1><p class="sub">Sanskrit organises its verbs by root — the dhātu. Learn a root's five key forms and you own most of what real prose does with it: present, past participle, gerund, infinitive, future. These ${DHATU.length} roots carry an enormous share of classical text.</p>
<div class="card"><p>The drill asks one form at a time; ${strictOn() ? "Strict mode requires exact IAST diacritics or Devanagari." : "Loose mode accepts plain-letter IAST."} The <b>kta-participle + gerund</b> pair matters most — classical narrative runs on them.</p>
<button class="btn primary" onclick="go('dhatuquiz')">Drill the roots</button>
<button class="btn" onclick="addDhatuCards()">Add all ${DHATU.length} roots to flashcards</button></div>
<div class="card labtable"><table class="gr pptable"><tr><th>Root</th><th>Meaning</th><th>Present (laṭ)</th><th>Kta-participle</th><th>Gerund (-tvā)</th><th>Infinitive</th><th>Future (lṛṭ)</th></tr>
${DHATU.map(v => `<tr><td lang="sa"><b>${v.d}</b> ${v.r}</td><td>${v.en}</td>${v.p.map(x => `<td>${x || "—"}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
const DHATU_NAMES = ["present (laṭ)", "kta-participle", "gerund (-tvā)", "infinitive (-tum)", "future (lṛṭ)"];
function dhatuQs() {
  const qs = [];
  shuffled(DHATU.filter(v => v.p.every(x => x))).slice(0, 10).forEach(v => {
    const idx = Math.floor(Math.random() * 5);
    if (Math.random() < 0.35) {
      const wrong = shuffled(DHATU.filter(x => x !== v && x.p[idx])).slice(0, 3);
      qs.push({ t: "mcq", form: v.d + " " + v.r, q: `Which is the <b>${DHATU_NAMES[idx]}</b> of ${v.r} (${v.en})?`, opts: [v.p[idx], ...wrong.map(w => w.p[idx])], a: 0, ex: `${v.r} (${v.en}): ${v.p.join(", ")}.` });
    } else {
      // Accept either script: the display string holds both, so split into tokens.
      qs.push({ t: "fill", form: v.d + " " + v.r, q: `Type the <b>${DHATU_NAMES[idx]}</b> of ${v.r} (${v.en}).`, a: v.p[idx].split(/[()\s]+/).filter(Boolean), ex: `${v.r} (${v.en}): ${v.p.join(", ")}.` });
    }
  });
  return qs;
}
function viewDhatuQuiz() {
  quiz = { title: "Dhātu drill", back: "dhatu", kind: "dhatu", qs: dhatuQs(), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>Dhātu drill</h1><p class="sub">${quiz.qs.length} questions · ${strictOn() ? "exact IAST or Devanagari required" : "plain-letter IAST accepted"}</p><div id="quizbox"></div>`;
}
function addDhatuCards() {
  DHATU.forEach(v => { store.data.extraCards["dh:" + v.r] = { la: v.d + " " + v.r, en: v.en + " — " + v.p.join(", "), source: "Dhātu lab" }; });
  store.save(); renderSidebar();
  const tip = $("#glosstip");
  tip.innerHTML = `<div class="glosstip">${DHATU.length} dhātu cards added to your deck.</div>`;
  clearTimeout(showGloss.t); showGloss.t = setTimeout(() => { tip.innerHTML = ""; }, 4000);
}

/* ------------------------------------------------------------ flashcards */
function viewFlash() {
  const due = dueCards().length, total = allCards().length, whole = totalCourseCards();
  const scope = store.data.settings.cardScope || "reached";
  return `<h1>Flashcards</h1><p class="sub">Course vocabulary, reading glossaries you add, and the dhātu rows if you add them.</p>
<div class="stats"><div class="stat"><b>${due}</b><small>due now</small></div><div class="stat"><b>${total}</b><small>cards in your deck</small></div><div class="stat"><b>${whole}</b><small>cards in the whole course</small></div></div>
<div class="card"><p>Reviews use an expanding interval. <b>Again</b> brings the card back later in this same session and resets it to tomorrow; <b>Easy</b> expands the interval fastest.</p>
<p class="scopeline">Deck: <b>${scope === "all" ? "the entire course" : "units you have reached"}</b> — <button class="btn small" onclick="store.data.settings.cardScope='${scope === "all" ? "reached" : "all"}';store.save();render()">switch to ${scope === "all" ? "units reached" : "the whole course"}</button></p>
<button class="btn primary" ${due ? "" : "disabled"} onclick="go('flashrun')">Review ${Math.min(due, 30)} card${Math.min(due, 30) === 1 ? "" : "s"}</button></div>
<div class="card"><h2 style="margin-top:0">Keyboard</h2><p><b>Space</b> or <b>Enter</b> reveals the answer; <b>1</b> Again, <b>2</b> Hard, <b>3</b> Good, <b>4</b> Easy.</p></div>`;
}
let fc = null;
function startFlash() {
  const q = shuffled(dueCards()).slice(0, 30);
  fc = { q, i: 0, reveal: false, dir: null, seen: 0, again: {} };
  renderFlash();
}
function renderFlash() {
  applyTheme(); renderSidebar();
  const m = $("#main");
  if (!fc || fc.i >= fc.q.length) {
    const n = fc ? fc.seen : 0;
    if (n) { activity("flash", null, { n }); store.save(); }
    m.innerHTML = `<div class="card" style="text-align:center;padding:35px"><h1>Review complete</h1><p>${n} card${n === 1 ? "" : "s"} reviewed.</p><button class="btn primary" onclick="go('flash')">Back</button></div>`;
    fc = null;
    return;
  }
  const c = fc.q[fc.i];
  if (!fc.dir) fc.dir = store.data.settings.direction === "mix" ? (Math.random() < .5 ? "la" : "en") : store.data.settings.direction;
  const front = fc.dir === "la" ? c.la : c.en, back = fc.dir === "la" ? c.en : c.la;
  m.innerHTML = `<div class="flashstage"><p class="sub">${fc.i + 1}/${fc.q.length} · ${esc(c.source)}</p>
<button class="flashcard" type="button" id="fcard" onclick="revealCard()"><span class="front" ${fc.dir === "la" ? 'lang="sa"' : ""}>${esc(front)}</span>${fc.reveal ? `<span class="back" ${fc.dir === "en" ? 'lang="sa"' : ""}>${esc(back)}</span>` : `<small style="margin-top:18px;color:var(--muted)">click, tap, or press Space to reveal</small>`}</button>
${fc.reveal ? `<div class="grades"><button type="button" onclick="grade(0)"><b>Again</b><small>1</small></button><button type="button" onclick="grade(1)"><b>Hard</b><small>2</small></button><button type="button" onclick="grade(2)"><b>Good</b><small>3</small></button><button type="button" onclick="grade(3)"><b>Easy</b><small>4</small></button></div>` : ""}
<p class="sub" style="margin-top:14px"><button class="btn small" onclick="fc=null;go('flash')">End session</button></p></div>`;
  setTimeout(() => { const b = $("#fcard"); if (b) b.focus(); }, 0);
}
function revealCard() { if (fc && !fc.reveal) { fc.reveal = true; renderFlash(); } }
function grade(g) {
  if (!fc || !fc.reveal) return;
  const c = fc.q[fc.i], old = store.data.cards[c.id] || { iv: 0, ease: 2.3 };
  const days = [1, Math.max(2, old.iv * 1.4), Math.max(4, old.iv * old.ease), Math.max(7, old.iv * (old.ease + .5))][g];
  store.data.cards[c.id] = { iv: days, ease: Math.max(1.5, Math.min(3.2, old.ease + (g - 1.5) * .1)), due: Date.now() + days * 86400000 };
  store.save();
  fc.seen++;
  if (g === 0 && (fc.again[c.id] || 0) < 2) { fc.again[c.id] = (fc.again[c.id] || 0) + 1; fc.q.push(c); }
  fc.i++; fc.reveal = false; fc.dir = null;
  renderFlash();
}

/* ---------------------------------------------- reference, lab, settings */
function viewReference() {
  return `<h1>Grammar reference</h1><p class="sub">Compact tables for consultation, not a substitute for the course sequence.</p>` +
    REFS.map(r => `<details class="card"><summary><b>${r.title}</b></summary><div class="grammar">${r.body}</div></details>`).join("");
}
let labId = PARADIGMS[0].id;
function viewLab() {
  const p = PARADIGMS.find(x => x.id === labId) || PARADIGMS[0];
  return `<h1>Morphology tables</h1><p class="sub">${PARADIGMS.length} paradigms — the main declensions in all eight vibhaktis and three numbers, the pronouns, and the verb across its lakāras.</p>
<label class="visually-hidden" for="labsel">Choose a paradigm</label>
<select class="select" id="labsel" onchange="labId=this.value;render()">${PARADIGMS.map(x => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${x.name}</option>`).join("")}</select>
<div class="card labtable"><h2 style="margin-top:0" lang="sa">${p.name}</h2><table class="gr"><tr>${p.headers.map(h => `<th>${h}</th>`).join("")}</tr>${p.rows.map(row => `<tr>${row.map((c, i) => i === 0 ? `<th scope="row">${c}</th>` : `<td lang="sa">${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function viewSettings() {
  const s = store.data.settings;
  return `<h1>Settings</h1>
<div class="card"><h2 style="margin-top:0">Appearance</h2>
<label>Theme<br><select class="select" onchange="store.data.settings.theme=this.value;store.save();render()">${["system", "light", "dark"].map(t => `<option value="${t}" ${s.theme === t ? "selected" : ""}>${t[0].toUpperCase() + t.slice(1)}</option>`).join("")}</select></label></div>
<div class="card"><h2 style="margin-top:0">Flashcards</h2>
<label>Direction<br><select class="select" onchange="store.data.settings.direction=this.value;store.save()">${[["mix", "Mixed"], ["la", "Sanskrit → English"], ["en", "English → Sanskrit"]].map(([v, t]) => `<option value="${v}" ${s.direction === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<label style="display:block;margin-top:12px">Deck<br><select class="select" onchange="store.data.settings.cardScope=this.value;store.save();render()">${[["reached", "Only units I have reached"], ["all", "The entire course"]].map(([v, t]) => `<option value="${v}" ${(s.cardScope || "reached") === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<p class="sub" style="margin:10px 0 0">Keeping the deck to units you have reached is what makes the interval scheduling meaningful; the whole course at once is ${totalCourseCards()} cards on day one.</p></div>
<div class="card"><h2 style="margin-top:0">Answer checking</h2>
<label>Typed answers<br><select class="select" onchange="store.data.settings.strict=this.value==='strict';store.save();render()">${[["loose", "Loose — plain letters accepted for IAST"], ["strict", "Strict — full IAST diacritics (or Devanagari) required"]].map(([v, t]) => `<option value="${v}" ${(s.strict ? "strict" : "loose") === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
<p class="sub" style="margin:10px 0 0">Loose mode folds macrons and dots away, so srnoti passes for śṛṇoti and janati for jānāti — right while the keyboard is still the enemy. Strict mode requires either correct Devanagari or exact IAST — ā against a, ṛ against r, ś ṣ s all distinct — using the diacritic keypad under the answer box. Vowel length and retroflexion are meaning-bearing in Sanskrit; switch to strict as soon as the training wheels start to chafe.</p></div>
<div class="card"><h2 style="margin-top:0">Audio</h2>
<p class="sub" style="margin-top:0">This course ships no audio, deliberately. Browser and operating-system text-to-speech cannot be relied on to provide a trustworthy model of Classical Sanskrit pronunciation; nearby Indic voices may neutralise or alter exactly what matters here — vowel quantity, retroflexion, visarga, and the quality of short a. Rather than train errors, the course treats IAST as a precise pronunciation score (Stage ० tells you the value of every sign) and the śloka unit teaches rhythm from the metre itself. For a human model, recordings of Gītā chanting — chapter 2 especially — are abundant and pair naturally with the final stage.</p></div>
<div class="card"><h2 style="margin-top:0">Progress data</h2><p class="sub" style="margin-top:0">Progress lives in this browser only. Export it if you clear site data or move device.</p>
<button class="btn" onclick="exportData()">Export progress</button> <button class="btn" onclick="document.getElementById('importfile').click()">Import progress</button> <button class="btn" onclick="resetData()">Reset</button></div>
<div class="card"><h2 style="margin-top:0">About and sources</h2>
<p><i>Saṃskṛtam</i> is a complete, self-contained reading course in Classical Sanskrit: it begins at the first letter of Devanagari, teaches Classical Sanskrit grammar with traditional Pāṇinian terminology alongside the Western labels, and ends with epic Sanskrit and a guided reader of selected Gītā passages. It is a school-grammar course, not Pāṇini's own derivational system, and it does not claim conversational fluency.</p>
<p>The ${controlledCount()} controlled readings and the Pañcatantra chapters are <b>original or adapted compositions written for this app</b>, graded to their stage (early ones deliberately printed sandhi-dissolved). They are not ancient texts and are not presented as such. The authentic verses are drawn from public-domain editions and identified individually.</p>
<p>Grammar explanations, translations and learning notes were prepared for this app with AI assistance and remain under human editorial review. If you find an error in the Sanskrit, that is a bug worth reporting.</p></div>`;
}
function exportData() {
  const b = new Blob([JSON.stringify(store.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "samskrtam-progress.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function resetData() {
  if (confirm("Delete all Sanskrit-course progress on this device?")) {
    store.data = JSON.parse(JSON.stringify(defaults)); store.save(); render();
  }
}

/* ----------------------------------------------------------- wiring, PWA */
document.addEventListener("click", e => {
  const w = e.target.closest && e.target.closest(".word[data-g]");
  if (w) { const p = route().split("/"); if (p[0] === "read") showGloss(p[1], w.dataset.g); }
});
document.addEventListener("keydown", e => {
  if (!fc || route() !== "flashrun") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (!fc.reveal && (e.key === " " || e.key === "Enter")) { e.preventDefault(); revealCard(); return; }
  if (fc.reveal && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); grade(Number(e.key) - 1); }
});
$("#importfile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("shape");
      const clean = JSON.parse(JSON.stringify(defaults));
      ["completed", "scores", "readingDone", "chapterDone", "cards", "extraCards"].forEach(k => {
        if (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) clean[k] = d[k];
      });
      if (d.settings && typeof d.settings === "object") clean.settings = Object.assign({}, defaults.settings, d.settings);
      if (Array.isArray(d.activity)) clean.activity = d.activity.slice(0, 40);
      store.data = clean; store.save(); render();
      alert("Progress imported.");
    } catch (err) { alert("That file is not valid progress data."); }
    e.target.value = "";
  };
  rd.readAsText(f);
});
$("#menubtn").onclick = () => {
  const open = $("#sidebar").classList.toggle("open");
  $("#menubtn").setAttribute("aria-expanded", String(open));
};
let lastRead = null;
addEventListener("hashchange", () => {
  $("#sidebar").classList.remove("open");
  $("#menubtn").setAttribute("aria-expanded", "false");
  const p = route().split("/");
  const here = p[0] === "read" ? p[1] : null;
  if (here !== lastRead) aid = { gloss: false, notes: false, translation: false, iast: false };
  lastRead = here;
  render();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change", () => { if (store.data.settings.theme === "system") render(); });

// PWA: the manifest, icons and service worker are shipped as separate files
// alongside this page. Keep them in the same directory.
if ("serviceWorker" in navigator) {
  addEventListener("load", async () => {
    try {
      await navigator.serviceWorker.register(
        "/sanskrit-sw.js",
        { scope: "/sanskrit.html" }
      );
    } catch (error) {
      console.warn("Saṃskṛtam offline support was not installed:", error);
    }
  });
}

render();
</script>
</body>
</html>

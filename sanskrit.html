  id: "r5", title: "Derived verbs — causative, desiderative & co.", subtitle: "gamayati, jijñāsate, kartavya: the root's extended family",
  grammar: `<p class="lead">From any root, Sanskrit systematically derives new verbs: the <b>causative</b> ("make X do"), the <b>desiderative</b> ("want to do"), and a set of verbal adjectives — above all the <b>gerundive</b> of obligation ("to-be-done"). These formations are perfectly regular in meaning; learn the markers and whole word-families unlock at sight.</p>
<h3>The causative — ṇijanta</h3>
<p>Marker <b>-aya-</b> (with strengthened root):</p>
<table class="gr"><tr><th>Simple</th><th>Causative</th><th></th></tr>
<tr><td lang="sa">गच्छति goes</td><td lang="sa">गमयति gamayati</td><td>makes go, sends</td></tr>
<tr><td lang="sa">पश्यति sees</td><td lang="sa">दर्शयति darśayati</td><td>shows</td></tr>
<tr><td lang="sa">वेत्ति knows</td><td lang="sa">वेदयति vedayati</td><td>makes known</td></tr>
<tr><td lang="sa">पतति falls</td><td lang="sa">पातयति pātayati</td><td>fells</td></tr>
<tr><td lang="sa">स्थास्यति? तिष्ठति stands</td><td lang="sa">स्थापयति sthāpayati</td><td>establishes</td></tr></table>
<p>The causer's causee goes accusative (or instrumental): <b lang="sa">गुरुः शिष्यं ग्रामं गमयति</b> — "the guru sends the pupil to the village". Class-10 verbs (corayati) simply ARE causative-shaped — the -aya- is one machine throughout.</p>
<h3>The desiderative — sannanta</h3>
<p>Reduplication + <b>-sa-</b>: "want to X":</p>
<p class="ruleline" lang="sa">जिज्ञासते jijñāsate — wants to know · पिपासति pipāsati — is thirsty (wants to drink) · मुमुक्षते mumukṣate — longs for release</p>
<p>Its abstract nouns name whole disciplines: <b lang="sa">जिज्ञासा</b> jijñāsā "the desire to know" (the Brahmasūtra's first word: athāto brahmajijñāsā), <b lang="sa">मुमुक्षा</b> the longing for mokṣa, and पिपासा thirst.</p>
<h3>The gerundive — kṛtya</h3>
<p>"To-be-X-ed": <b>-tavya, -anīya, -ya</b>:</p>
<p class="ruleline" lang="sa">कर्तव्यम् kartavyam — to be done; duty · श्रोतव्यम् śrotavyam — to be heard · पूजनीयः pūjanīyaḥ — venerable · पेयम् peyam — drinkable</p>
<p>With an instrumental agent it is the polite imperative of śāstra: <b lang="sa">त्वया गन्तव्यम्</b> — "you should go" (lit. by-you to-be-gone). किं कर्तव्यम्? — "what is to be done?" — is the eternal question, and a single gerundive.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">आत्मा वा अरे द्रष्टव्यः श्रोतव्यो मन्तव्यो निदिध्यासितव्यः।</div><p>The Bṛhadāraṇyaka's program (2.4.5, abridged): "the Self is to be seen, to be heard, to be thought on, to be meditated upon" — four gerundives in -tavya carrying an entire spiritual method. Formation-knowledge IS reading-knowledge here.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>गमयति (causative 'sends') vs गच्छति ('goes'): the -aya- of causation vs the plain stem. Class-10 look-alikes resolve in the dictionary — and usually in context.</li><li>Desideratives reduplicate with i: jijñāsate, pipāsati, cikīrṣati ('wants to do').</li><li>कर्तव्य the adjective became कर्तव्यम् the noun 'duty' — many gerundives nominalised; Hindi kartavya keeps it alive.</li></ul></div>`,

  grammar: `<p class="lead">You now hold all the machinery classical prose uses. This unit assembles it into a <b>procedure</b> — the fixed sequence of moves that turns an opaque line into a parsed one — and closes Stage ४ with the habits that separate decoders from readers.</p>
<h3>The five moves</h3>
<ol><li><b>Read aloud, whole.</b> Devanāgarī rewards the ear; sandhi was made by mouths.</li>
<li><b>Split the sandhi.</b> Undo visarga-changes (-o → -aḥ), vowel fusions, t/d assimilations. Every seam you learned in Stage २ now runs backwards.</li>
<li><b>Find the verb-word.</b> A finite verb (-ti, -te, uvāca…), a kta/tavat participle, or a gerundive — usually late in the clause. It fixes voice and construction.</li>
<li><b>Sort the cases from the endings outward.</b> Agent (instrumental in kta/passive frames; nominative otherwise), patient, datives, locatives; genitives attach to their nouns.</li>
<li><b>Open the arches.</b> ya-words wait for ta-words; gerunds chain onto the agent; iti closes quotations; compounds split right-to-left.</li></ol>
<h3>A worked sentence, by the method</h3>
<p class="ruleline" lang="sa">तच्छ्रुत्वा राजा मुनिं प्रणम्य किं मया कर्तव्यमित्यपृच्छत्।</p>
<ol><li>Aloud. 2. Split: tat śrutvā rājā muniṃ praṇamya kiṃ mayā kartavyam iti apṛcchat.</li>
<li>Verb-word: अपृच्छत् (laṅ, 'asked') — plus an embedded gerundive kartavyam inside iti.</li>
<li>Cases: rājā nom. subject; muniṃ acc.; mayā instr. agent (of the gerundive); kim its patient.</li>
<li>Arches: two gerunds (śrutvā, praṇamya) chain onto rājā; iti seals the quoted question.</li></ol>
<p><i>"Hearing that, the king, bowing to the sage, asked: 'What should I do?'"</i> — Twelve words, five constructions, zero mysteries.</p>
<h3>Habits of the fluent</h3>
<ul><li>Particles are road-signs: hi explains, tu turns, eva pins, iti closes. Track them like Greek's μέν/δέ.</li><li>Expect verb-lessness: nominal sentences and participles carry most classical prose.</li><li>Compounds: last member first, then ask 'whose? which? what kind?' leftwards.</li><li>Twenty minutes daily beats three hours weekly — sandhi-splitting is muscle, and muscles like rhythm.</li></ul>
<div class="tip"><b>Stage ५ awaits.</b> Everything after this is application: the śloka metre, the epic's formulas, and the Gītā itself. The grammar mountain is climbed; what remains is the view.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Resist translating word-by-word left to right; Sanskrit sentences resolve endings-first, order-second.</li><li>An unfamiliar long word is almost always a compound or a sandhi-chain: split before dictionary-diving.</li><li>When two parses survive, prefer the one the particles and context bless — and remember the commentators lived exactly here.</li></ul></div>`,

  id: "e1", title: "The śloka", subtitle: "Thirty-two syllables that carried a civilisation",
  grammar: `<p class="lead">Nearly everything you will now read — Gītā, epics, purāṇas, subhāṣitas — is poured into one mould: the <b>anuṣṭubh śloka</b>, two lines of sixteen syllables, each line two pādas of eight. It is less a metre than a heartbeat; learn its lilt once and a hundred thousand verses scan themselves.</p>
<h3>The shape</h3>
<p class="ruleline">8 + 8 syllables ‖ 8 + 8 syllables — four pādas, a verse.</p>
<p>Constraints are light (unlike the Greek hexameter's strict feet): the cadence of the even pādas runs ⏑ – ⏑ ×, the odd pādas avoid that cadence, and syllables count long (guru) or short (laghu) exactly as your Stage-0 rules said: long vowel, or short vowel before a cluster.</p>
<h3>Hear it in the invocation every reciter learns first</h3>
<p class="ruleline" lang="sa">धर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः ।<br>मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय ॥</p>
<p>dhar-ma-kṣe-tre ku-ru-kṣe-tre (8) ‖ sa-ma-ve-tā yu-yut-sa-vaḥ (8) — ma-ma-kāḥ pāṇ-ḍa-vāś-cai-va (8) ‖ ki-ma-kur-va-ta sañ-ja-ya (8). Count on your fingers once; after ten verses your ear will count for you.</p>
<h3>Reciting</h3>
<ul><li>Long syllables take roughly double time — length, not stress, is the rhythm.</li><li>Break at pāda-ends (a breath at ।, a full stop at ॥); never mid-word.</li><li>The traditional sing-song (pāṭha) rocks between two or three pitches; any steady chant that honours length is authentic practice.</li></ul>
<h3>Other metres, for recognition</h3>
<p>The Gītā occasionally lifts into the 11-syllable <b>triṣṭubh</b> (chapter 11's cosmic vision — the metre literally expands with the theophany); kāvya loves longer metres (vasantatilakā, mandākrāntā). Count syllables per pāda and consult the Reference table when a verse feels differently shaped.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">विद्या ददाति विनयं विनयाद्याति पात्रताम् ।</div><p>vid-yā da-dā-ti vi-na-yaṃ (8) ‖ vi-na-yād-yā-ti pāt-ra-tām (8): the subhāṣita from your Reading Room, revealing itself as a śloka half. You have been reading this metre all along; now you can hear it.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Scan the FUSED text, not the word-list: metre operates on the saṃhitā string as actually pronounced. Vowel sandhi can merge two syllables into one (tava + iha → taveha: four syllables become three; ca + api → cāpi), so always count what stands on the page after sandhi, never a mental padapāṭha.</li><li>e and o are ALWAYS long (Stage 0's rule) — the commonest scanning slip.</li><li>The ॥ divides verses, the । half-verses: recitation's punctuation, not grammar's.</li></ul></div>`,

  id: "e2", title: "Epic idiom & the dialogue frame", subtitle: "uvāca-tags, vocative garlands, and the sa-connectives of story",
  grammar: `<p class="lead">Epic Sanskrit is easier than classical prose — shorter compounds, familiar formulas, generous repetition — but it has its own idiom. Learn the machinery of the frame-dialogue, the epithet-vocatives, and a handful of epic habits, and the Gītā's narrative surface becomes transparent.</p>
<h3>The dialogue frame</h3>
<p>The Mahābhārata is storytelling nested three deep: Sañjaya reports the battlefield to the blind king Dhṛtarāṣṭra; inside his report, Kṛṣṇa and Arjuna speak. The frame is held by speaker-tags in the perfect:</p>
<p class="ruleline" lang="sa">धृतराष्ट्र उवाच । सञ्जय उवाच । अर्जुन उवाच । श्रीभगवानुवाच ।</p>
<p>Learn to see these as stage-directions, outside the verse-count of what follows. एवम् उक्त्वा ("having spoken thus") and इत्युक्त्वा close speeches; ततः ("then") advances scenes.</p>
<h3>The vocative garland</h3>
<p>Epic conversation strews epithets in the vocative — metrical filler, courtesy and characterisation at once. Kṛṣṇa to Arjuna:</p>
<table class="gr"><tr><th lang="sa">पार्थ</th><th lang="sa">कौन्तेय</th><th lang="sa">भारत</th><th lang="sa">महाबाहो</th><th lang="sa">परन्तप</th></tr>
<tr><td>son of Pṛthā</td><td>son of Kuntī</td><td>descendant of Bharata</td><td>mighty-armed</td><td>scorcher of foes</td></tr></table>
<p>Arjuna back: केशव (fair-haired one), मधुसूदन (slayer of Madhu), जनार्दन, गोविन्द, हृषीकेश. Each is a patronymic (-eya: kaunteya from kuntī), a bahuvrīhi (mahābāho), or a myth in miniature (madhusūdana) — Stage ३/४ grammar wearing garlands.</p>
<h3>Epic habits to expect</h3>
<ul><li><b>sa-connectives:</b> स tu, स एव, ततः, तदा — pronoun-led sentence openings stitching the narrative.</li><li><b>Particles as mortar:</b> हि, च, एव, वै, खलु fill metre and shade meaning; read them lightly.</li><li><b>Flexible sandhi & word-order:</b> verse bends prose rules gently; endings, as always, are the truth.</li><li><b>पुरा + perfect:</b> 'once upon a time' openings; इतिहासं पुरातनम् — 'an ancient tale'.</li></ul>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">तं तथा कृपयाविष्टम् अश्रुपूर्णाकुलेक्षणम् ।<br>विषीदन्तम् इदं वाक्यम् उवाच मधुसूदनः ॥</div><p>Gītā 2.1 — "To him, thus overcome by pity, his troubled eyes brimming with tears, despairing — Madhusūdana spoke this word." tam … āviṣṭam … viṣīdantam: accusatives stacking description of Arjuna; aśru-pūrṇa-ākula-īkṣaṇam a four-member bahuvrīhi ('whose eyes were tear-filled-and-troubled'); uvāca the frame-verb; madhusūdanaḥ the epithet as subject. Every tool is yours already.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>उवाच-tags stand OUTSIDE the śloka being introduced — don't scan them into the verse.</li><li>Epithet-vocatives are grammatically loose garnish: park them ('O Pārtha') and parse the clause around them.</li><li>वै is an emphatic particle (Vedic flavour) — register and release, like hi.</li></ul></div>`,
  examples: [
    ["अर्जुन उवाच …", "arjuna uvāca — the tag before every Arjuna speech: perfect tense as stage-direction."],
    ["एवमुक्त्वा हृषीकेशः …", "evam uktvā hṛṣīkeśaḥ — 'having spoken thus, Hṛṣīkeśa…': the gerund closing one speech, the epithet opening the next move."],
    ["कुतस्त्वा कश्मलमिदं … क्लैब्यं मा स्म गमः पार्थ", "Gītā 2.2–3: 'whence this faintness… yield not to unmanliness, O Pārtha' — reproach delivered through a vocative."],

    ["इतिहासं पुरातनम्", "itihāsaṃ purātanam — 'an ancient tale': the epics' name for themselves (iti-ha-āsa: 'thus indeed it was')."]

    { t: "mcq", q: "Why do epic speeches drip with vocatives (pārtha! mahābāho!)?", opts: ["metrical convenience + courtesy + characterisation, all at once", "printers' errors", "to confuse readers", "legal requirement"], a: 0, ex: "An 8-syllable pāda often needs exactly a pārtha or bhārata to complete it — and the choice among epithets colours the moment (kaunteya appeals to family; parantapa to valour)." },
    { t: "fill", q: "___ उक्त्वा स ययौ (HAVING SPOKEN THUS, he departed).", a: ["एवम्", "एवं", "evam", "evaṃ"], ex: "evam uktvā — the speech-closing formula. (yayau: perfect of √yā 'go' — another liṭ shape your eye now files calmly.)" },
    { t: "fill", q: "क्लैब्यं मा स्म गमः ___ (Gītā 2.3 — supply the vocative 'O son of Pṛthā').", a: ["पार्थ", "pārtha", "partha"], ex: "mā sma gamaḥ pārtha — 'yield not, O Pārtha': prohibition (mā + augmentless form, your Stage-२ rule) + the epic vocative. Kṛṣṇa's first command in the poem." },
    { t: "pick", q: "Click the speaker-tag verb.", s: "श्रीभगवानुवाच इति ग्रन्थे लिख्यते", a: "श्रीभगवानुवाच", ex: "śrībhagavān uvāca — fused in print (n+u). 'Thus is written in the book': the tag itself quoted with iti and a passive — three course-threads braided." },
    { t: "pick", q: "Click the present participle describing Arjuna.", s: "विषीदन्तम् इदं वाक्यम् उवाच", a: "विषीदन्तम्", ex: "viṣīdantam — accusative of viṣīdan 'despairing', agreeing with the (elided) tam: 'to him, despairing, he spoke this word'. The -at participle from Stage ४, in Gītā 2.1." },
    { t: "mcq", form: "अश्रुपूर्णाकुलेक्षणम्", q: "This four-part compound (Gītā 2.1) is:", opts: ["a bahuvrīhi: 'whose eyes were filled with tears and troubled'", "a dvandva of four nouns", "a verb", "unparseable"], a: 0, ex: "aśru-pūrṇa-ākula-īkṣaṇa + m: tear-filled-troubled-eyed, describing Arjuna in the accusative. Split at the seams, rebuild rightward: your Stage-३ method conquering its first epic monster." },
    { t: "mcq", q: "स तु, ततः, तदा opening epic sentences serve as:", opts: ["narrative stitches — 'but he', 'then', 'at that point'", "questions", "negations", "vocatives"], a: 0, ex: "The ta-words as discourse-thread: each sentence hooks the last. You built this machinery in Stage १ (tad) and ३ (correlatives); the epic simply runs it at length." },
    { t: "mcq", q: "इतिहास (itihāsa), the epics' genre-name, literally means:", opts: ["'thus indeed it was' — iti + ha + āsa", "'old book'", "'war story'", "'sacred song'"], a: 0, ex: "iti (thus) + ha (indeed) + āsa (it was — the perfect of √as you met in Stage ४): history as attested telling. The genre's name is a sentence, and you can parse it." },
    { t: "mcq", q: "Compared with classical prose, epic Sanskrit is:", opts: ["grammatically gentler — shorter compounds, formulaic repetition, familiar vocabulary", "far harder", "a different language", "unreadable without commentary"], a: 0, ex: "The epics were composed for listening audiences; clarity was survival. That is why this course can end at the Gītā: the summit text is also a kind text." }

  id: "e3", title: "The Gītā's lexicon", subtitle: "dharma, karma, yoga, ātman: the load-bearing words",
  grammar: `<p class="lead">A dozen Sanskrit words carry the Gītā's whole argument — and most resist one-word translation, which is precisely why you are learning to read them in the original. This unit maps the load-bearing lexicon: root-meanings, grammatical behaviour, and the semantic range each word actually spans in the text.</p>
<h3>The core seven</h3>
<table class="gr"><tr><th>Word</th><th>Root-sense</th><th>Range in the Gītā</th></tr>
<tr><td lang="sa">धर्मः dharmaḥ</td><td>√dhṛ 'uphold'</td><td>what upholds: duty, law, right order, one's own calling (svadharma)</td></tr>
<tr><td lang="sa">कर्म karma (n.)</td><td>√kṛ 'do'</td><td>action; ritual act; the deed-and-consequence chain</td></tr>
<tr><td lang="sa">योगः yogaḥ</td><td>√yuj 'yoke'</td><td>discipline, method, disciplined union: karma-, jñāna-, bhakti-yoga</td></tr>
<tr><td lang="sa">आत्मा ātmā</td><td>—</td><td>self: body, mind, soul, Self — the word's ambiguity IS chapter 6's subject</td></tr>
<tr><td lang="sa">ज्ञानम् jñānam</td><td>√jñā 'know'</td><td>knowledge, insight (vijñāna: discerning knowledge)</td></tr>
<tr><td lang="sa">भक्तिः bhaktiḥ</td><td>√bhaj 'share, love'</td><td>devotion, participation in the divine</td></tr>
<tr><td lang="sa">मोक्षः mokṣaḥ</td><td>√muc 'release'</td><td>liberation — the summum bonum behind every chapter</td></tr></table>
<h3>The supporting cast</h3>
<p><b lang="sa">बुद्धिः</b> buddhi (discerning intellect — buddhi-yoga is 2.49's key), <b lang="sa">मनः</b> manas (the restless mind of 6.34), <b lang="sa">प्रकृतिः / पुरुषः</b> prakṛti/puruṣa (nature/spirit — the Sāṅkhya pair of ch. 13), <b lang="sa">गुणाः</b> the three guṇas — sattva, rajas, tamas (ch. 14 entire), <b lang="sa">श्रद्धा</b> śraddhā (faith, 17.3), <b lang="sa">संन्यासः / त्यागः</b> renunciation vs relinquishment (ch. 18 opens by distinguishing them), <b lang="sa">स्थितप्रज्ञः</b> sthitaprajñaḥ — 'one whose wisdom stands firm' (the bahuvrīhi that names the ideal of ch. 2).</p>
<h3>Reading untranslatables</h3>
<p>Treat each as a WORD-FIELD, not a gloss: dharma in 1.1 (dharmakṣetre) is not quite dharma in 2.7 (dharmasaṃmūḍhacetāḥ) nor in 18.66 (sarvadharmān parityajya). The discipline is to hold the root-sense (√dhṛ: what upholds) and let each verse specify. This is exactly why translations disagree — and why you are here.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">योगः कर्मसु कौशलम् (2.50)</div><p>"Yoga is skill in actions." yogaḥ nominative subject; karmasu — locative PLURAL of karman ('in actions', Stage ४'s n-stem); kauśalam — 'skilfulness', predicate. Three words. A definition an entire management-literature has quoted — and you just parsed it, cases and all.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>कर्म is the n-stem NOUN (karma, karmaṇā, karmasu); the -aḥ nominative pattern does not apply. karmaṇy (2.47) = karmaṇi, locative singular, with y-sandhi.</li><li>योग never means physical postures in the Gītā — āsana appears once, as 'seat'.</li><li>आत्मन् is reflexive pronoun AND metaphysical Self — often deliberately both: uddharet ātmanā ātmānam (6.5).</li></ul></div>`,
  examples: [
    ["स्वधर्मे निधनं श्रेयः परधर्मो भयावहः।", "svadharme nidhanaṃ śreyaḥ — 'better death in one's own dharma; another's dharma brings fear' (3.35): sva- and para- compounds on the core word."],
    ["योगस्थः कुरु कर्माणि", "yogasthaḥ kuru karmāṇi — 'established in yoga, perform actions' (2.48): the bahuvrīhi yoga-stha + imperative + n-stem plural."],
    ["ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः", "jñānena … ajñānam — knowledge vs its a-privative negation (5.16): the alpha-privative works in Sanskrit exactly as in Greek."],
    ["श्रद्धावाँल्लभते ज्ञानम्", "śraddhāvān labhate jñānam — 'the one who has faith obtains knowledge' (4.39): a -vat possessive + your ātmanepada labhate."],

    { t: "parse", form: "स्थितप्रज्ञः", q: "Classify the compound:", opts: ["bahuvrīhi: 'whose wisdom stands firm'", "tatpuruṣa: 'the wisdom of standing'", "dvandva", "avyayībhāva"], a: 0, ex: "sthita (kta of √sthā) + prajñā, owned: the steady-wisdomed one. The Gītā's ideal human is named by a compound-type — and ch. 2.54–72 unpacks the name verse by verse." },

  grammar: `<p class="lead">Now the summit ridge: the Gītā's most quoted verse, parsed with everything you own. Slowly, clause by clause — this unit is a guided climb, and the view is the point.</p>
<h3>2.47 — the verse itself</h3>
<p class="ruleline" lang="sa">कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।<br>मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥</p>
<h3>Pāda by pāda</h3>
<table class="gr"><tr><th>Text</th><th>Split</th><th>Parse</th></tr>
<tr><td lang="sa">कर्मण्येवाधिकारस्ते</td><td>karmaṇi eva adhikāraḥ te</td><td>loc. of karman + eva (pin) + 'right/claim' + te (gen. enclitic 'your'): "your claim is to the action alone"</td></tr>
<tr><td lang="sa">मा फलेषु कदाचन</td><td>mā phaleṣu kadācana</td><td>prohibitive mā + loc. pl. 'in the fruits' + 'ever': "never to its fruits"</td></tr>
<tr><td lang="sa">मा कर्मफलहेतुर्भूः</td><td>mā karma-phala-hetuḥ bhūḥ</td><td>mā + augmentless aorist of √bhū + a 3-member tatpuruṣa: "do not become one whose motive is action's fruit"</td></tr>
<tr><td lang="sa">मा ते सङ्गोऽस्त्वकर्मणि</td><td>mā te saṅgaḥ astu akarmaṇi</td><td>mā + imperative astu + loc.: "nor let your attachment be to inaction"</td></tr></table>
<p>Every element is course-grammar: the locatives (Stage १), sandhi throughout (karmaṇi+eva → karmaṇyeva; saṅgaḥ+astu → saṅgo'stu — Stage २), mā + aorist (Stage २/४), the compound (Stage ३), a-privative akarman (Stage ५). The verse balances four mā/eva beams into perfect symmetry: claim to act — no claim to fruit — no fruit-motive — no inaction either. Grammar IS the argument.</p>
<h3>2.48 — the companion</h3>
<p class="ruleline" lang="sa">योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय ।<br>सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते ॥</p>
<p>yogasthaḥ (bahuvrīhi: standing-in-yoga) kuru (imperative of √kṛ!) karmāṇi (n-stem plural) — saṅgaṃ tyaktvā (gerund) dhanañjaya (vocative epithet) — siddhy-asiddhyoḥ (dvandva in the GENITIVE-LOCATIVE DUAL: 'in success-and-failure, the two') samaḥ bhūtvā — samatvaṃ yoga ucyate (your definitional passive): "Established in yoga act, having dropped attachment, O Dhanañjaya — equal in success and failure both: equanimity is what yoga is called."</p>
<div class="tip"><b>The famous dual.</b> siddhyasiddhyoḥ — one word holding success and failure in the two-case: the dual number itself preaching equanimity. Untranslatable machinery; visible only in the original. This is why you learned Sanskrit.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>ते here is the enclitic GENITIVE of tvam ('your'), not 'they': context and accentlessness decide.</li><li>भूः is the mā-governed aorist (2nd sg.), not a noun: mā bhūḥ 'become not'.</li><li>योग उच्यते = yogaḥ ucyate with visarga dropped before u-: the definitional formula again.</li></ul></div>`,
  examples: [
    ["कर्मण्येवाधिकारस्ते", "karmaṇy evādhikāras te — 'your right is to the work alone': the clause that launched a thousand commentaries."],
    ["मा फलेषु कदाचन", "mā phaleṣu kadācana — 'never to the fruits': the locative of what you may not claim."],

  id: "e5", title: "Gītā grammar II — the soul & the avatāra verses", subtitle: "2.20 and 4.7–8: eternity and descent, parsed",
  grammar: `<p class="lead">Two more famous passages under the microscope: the deathlessness verse (2.20) with its rolling negations, and the avatāra proclamation (4.7–8) built on the yad-tad frame you know. After these, the First Gītā Reader holds no surprises — only pleasures.</p>
<h3>2.20 — the soul unborn</h3>
<p class="ruleline" lang="sa">न जायते म्रियते वा कदाचिन्<br>नायं भूत्वा भविता वा न भूयः ।<br>अजो नित्यः शाश्वतोऽयं पुराणो<br>न हन्यते हन्यमाने शरीरे ॥</p>
<table class="gr"><tr><th>Clause</th><th>Parse</th></tr>
<tr><td lang="sa">न जायते म्रियते वा कदाचित्</td><td>two deponents (jāyate, mriyate — is born, dies) + vā 'or' + 'ever': "it is never born nor ever dies"</td></tr>
<tr><td lang="sa">नायं भूत्वा भविता वा न भूयः</td><td>na ayam … : gerund bhūtvā + periphrastic future bhavitā (the -tṛ agent-noun as future!): "nor, having once been, will it again cease to be"</td></tr>
<tr><td lang="sa">अजो नित्यः शाश्वतोऽयं पुराणः</td><td>four nominative adjectives on ayam: unborn (a-ja: the privative on √jan!), eternal, perpetual, primeval</td></tr>
<tr><td lang="sa">न हन्यते हन्यमाने शरीरे</td><td>passive hanyate + LOCATIVE ABSOLUTE hanyamāne śarīre: "it is not slain when the body is slain"</td></tr></table>
<p>The last pāda is a construction-jewel: passive verb + present-passive participle in the locative absolute — the śarīra dies around the ātman, grammatically as well as doctrinally. This verse echoes Kaṭha Upaniṣad 2.18 nearly verbatim: you are reading the Gītā quoting its own tradition.</p>
<h3>4.7–8 — whenever dharma declines</h3>
<p class="ruleline" lang="sa">यदा यदा हि धर्मस्य ग्लानिर्भवति भारत ।<br>अभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम् ॥<br>परित्राणाय साधूनां विनाशाय च दुष्कृताम् ।<br>धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ॥</p>
<ul><li><b lang="sa">यदा यदा … तदा</b> — the doubled temporal frame (Stage ३): "whenever… then".</li><li><b lang="sa">धर्मस्य ग्लानिः / अभ्युत्थानम् अधर्मस्य</b> — chiasmus of genitives: dharma's decline, adharma's rise.</li><li><b lang="sa">आत्मानं सृजामि अहम्</b> — "I emit/create myself": ātman as pure reflexive + an expressed aham for emphasis.</li><li><b lang="sa">परित्राणाय … विनाशाय … -अर्थाय</b> — three DATIVES of purpose: for protection of the good, destruction of evildoers, establishment of dharma. (sādhūnām, duṣkṛtām: genitive plurals.)</li><li><b lang="sa">युगे युगे</b> — locative doubled: "in age after age". Iteration by repetition — a Vedic inheritance.</li></ul>
<div class="tip"><b>Notice what carries the theology:</b> a relative frame, four genitives, three purpose-datives, one reflexive accusative, a doubled locative. No exotic grammar at all — the most quoted proclamation in Hindu scripture is Stage-१-through-३ material, perfectly deployed. You were ready pages ago.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>भविता is the periphrastic future ('will be'), formally the agent-noun bhavitṛ: recognise, don't panic.</li><li>अजः = a + ja (unborn), not 'goat' (ajaḥ!) — context makes theology, homonymy makes jokes.</li><li>सृजामि — √sṛj 'emit, send forth': the avatāra 'descends' by self-emission; the verb matters to the doctrine.</li></ul></div>`,
  examples: [
    ["न जायते म्रियते वा कदाचित्", "na jāyate mriyate vā kadācit — never born, never dying: the two deponents of Stage २ bearing eternity."],
    ["अजो नित्यः शाश्वतोऽयं पुराणः", "ajo nityaḥ śāśvato 'yaṃ purāṇaḥ — unborn, eternal, perpetual, primeval: four predicates, three sandhis."],
    ["न हन्यते हन्यमाने शरीरे", "na hanyate hanyamāne śarīre — 'not slain when the body is slain': passive + locative absolute in a single pāda."],
    ["यदा यदा … तदा …", "yadā yadā … tadā: the correlative frame as prophetic clock."],
    ["सम्भवामि युगे युगे", "sambhavāmi yuge yuge — 'I come into being age after age': doubled locative, present tense — the descent is standing policy, not past event."]

    { t: "mcq", q: "भविता in 2.20 is:", opts: ["the periphrastic future — agent-noun bhavitṛ as 'will be'", "a feminine noun", "an imperative", "a gerund"], a: 0, ex: "The -tṛ agent noun (Stage ४: kartā 'doer') doubles as a future: bhavitā 'he-will-be'. na bhūtvā bhavitā vā na bhūyaḥ — 'nor having-been will it ever not-be again'." },
    { t: "mcq", form: "अजः", q: "In 2.20 this means:", opts: ["'unborn' — a-privative + √jan", "'goat'", "'ancient'", "'strong'"], a: 0, ex: "a + ja: not-born. The homonym ajaḥ 'goat' (√aj, drive) delights Sanskrit punsters; the Gītā's context leaves no doubt — and now neither does your parsing." },
    { t: "fill", q: "न ___ हन्यमाने शरीरे (it IS NOT SLAIN when the body is slain — passive of √han).", a: ["हन्यते", "hanyate"], ex: "na hanyate — the plain -ya- passive beside its own participle: √han twice, active nowhere. The verse kills the killing, grammatically." },

  id: "e6", title: "Reading onward", subtitle: "मा शुचः: the last verse, and the road after the course",
  grammar: `<p class="lead">One verse remains — the Gītā's final teaching, which happens to be a final exam in everything this course taught. Then: how to keep reading, with real texts, real editions, and a sustainable practice. संस्कृतस्य अध्ययनं दीर्घा यात्रा — the study of Sanskrit is a long journey, and you are now equipped for it.</p>
<h3>18.66 — the caraṇa-śaraṇa verse</h3>
<p class="ruleline" lang="sa">सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज ।<br>अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः ॥</p>
<table class="gr"><tr><th>Element</th><th>Parse</th></tr>
<tr><td lang="sa">सर्वधर्मान् परित्यज्य</td><td>sarva-dharmān (acc. pl. of a karmadhāraya) + preverb-gerund: "abandoning all dharmas"</td></tr>
<tr><td lang="sa">मामेकं शरणं व्रज</td><td>mām ekam (acc. + 'alone') śaraṇaṃ ('refuge' — predicative acc.) vraja (imperative): "come to me alone as refuge"</td></tr>
<tr><td lang="sa">अहं त्वा सर्वपापेभ्यः</td><td>ahaṃ tvā (enclitic acc. 'you') sarva-pāpebhyaḥ (ablative pl.: 'from all evils')</td></tr>
<tr><td lang="sa">मोक्षयिष्यामि मा शुचः</td><td>CAUSATIVE FUTURE of √muc ('I will cause you to be freed') + mā + aorist: "I will liberate you — do not grieve"</td></tr></table>
<p>Look at मोक्षयिष्यामि: root muc + causative -aya- + future -iṣya- + 1sg -mi — four morphemes you learned in four different stages, stacked in one word of scripture. And मा शुचः — the prohibition that has consoled readers for two thousand years — is your Stage-२ grammar, two syllables long.</p>
<h3>Where to go from here</h3>
<ol><li><b>Finish the Reading Room</b> — then re-read it all fast: fluency is re-reading's child.</li>
<li><b>A full Gītā with apparatus:</b> Winthrop Sargeant's word-by-word edition, or the Gita Press editions with anvaya (prose word-order); Śaṅkara's commentary when you want the tradition's own voice.</li>
<li><b>Narrative practice:</b> Lanman's Sanskrit Reader (Nala from the Mahābhārata, Hitopadeśa) — the classic ladder, free online; Pañcatantra continues what your fable-chapters began.</li>
<li><b>Tools:</b> the Monier-Williams dictionary (online at Cologne), the Learn Sanskrit app ecosystem, GRETIL for e-texts; sanskritdictionary.com for quick splits.</li>
<li><b>Practice rhythm:</b> twenty minutes daily — ten of reading, five of sandhi/dhātu drills, five of chanting. अभ्यासेन तु कौन्तेय (6.35): by practice alone.</li></ol>
<div class="tip"><b>The end that is a beginning.</b> The course ends where it aimed: you, reading the Gītā's Sanskrit with your own eyes, weighing what the translators had to decide for you. श्रेयो हि ज्ञानम् — knowledge is the better path. मा शुचः — and keep reading.</div>
<div class="pitfall"><b>Last pitfalls, for the road</b><ul><li>त्वा is the enclitic accusative of tvam (= tvām): the Gītā uses both.</li><li>शरणं व्रज: predicative accusative — 'come-to me AS refuge', not two objects.</li><li>Never let a long compound bluff you again: split at the seams, rebuild from the right, and remember the commentators are your colleagues, not your judges.</li></ul></div>`,

  text: "रामः ग्रामे वसति। ग्रामः अल्पः अस्ति। ग्रामे वृक्षाः सन्ति। रामः प्रातः क्षेत्रम् गच्छति। सः क्षेत्रे कर्म करोति। मध्याह्ने सः वृक्षस्य छायायाम् विश्रामम् करोति।\nरामस्य पुत्रः बालः अस्ति। बालः गुरोः गृहम् गच्छति। तत्र सः पठति। सायम् पिता पुत्रः च गृहम् आगच्छतः। माता अन्नम् यच्छति। ते सुखेन खादन्ति। रात्रौ बालः कथाम् पृच्छति। पिता कथाम् वदति। बालः शृणोति। ततः सर्वे स्वपन्ति।",

{

  text: "पुरा वने गुरुकुलम् आसीत्। तत्र गुरुः शिष्याः च अवसन्। शिष्याः प्रातः स्नानम् अकुर्वन्। ततः ते वेदम् अपठन्। मध्याह्ने ते फलानि अखादन्।\nएकः शिष्यः अलसः आसीत्। सः न अपठत्। गुरुः तम् अवदत् — पुत्र, विद्याम् लभस्व। विद्या धनम् यच्छति। विद्या सुखम् यच्छति इति। शिष्यः गुरोः वचनम् अशृणोत्। ततः सः प्रतिदिनम् अपठत्। सः पण्डितः अभवत्।",

{
  id: "c4", title: "चतुरः काकः — The clever crow", author: "Controlled Sanskrit", work: "Original graded reading", level: "Sandhi & the Verb", kind: "Controlled", sandhi: "Sandhi applied",
  text: "एकदा काकस्तृषितोऽभवत्। स जलं पातुमैच्छत्। स इतस्ततोऽभ्रमत्, किन्तु कुत्रापि जलं नापश्यत्। ततः स घटमपश्यत्। घटे किञ्चिज्जलमासीत्, किन्तु जलमधोऽतिष्ठत्।\nकाकश्चतुर आसीत्। सोऽचिन्तयत् — उपायं करिष्यामीति। स पाषाणान् घटेऽक्षिपत्। जलमुपर्यागच्छत्। काकः सुखेन जलमपिबत्। ततः सोऽगच्छत्।\nउपायेन सर्वं सिध्यति।",
  iast: "ekadā kākas tṛṣito 'bhavat. sa jalaṃ pātum aicchat. sa itas tato 'bhramat, kintu kutrāpi jalaṃ nāpaśyat. tataḥ sa ghaṭam apaśyat. ghaṭe kiñcij jalam āsīt, kintu jalam adho 'tiṣṭhat.\nkākaś catura āsīt. so 'cintayat — upāyaṃ kariṣyāmīti. sa pāṣāṇān ghaṭe 'kṣipat. jalam upary āgacchat. kākaḥ sukhena jalam apibat. tataḥ so 'gacchat.\nupāyena sarvaṃ sidhyati.",

{
  id: "c5", title: "नद्याः तीरे — On the riverbank", author: "Controlled Sanskrit", work: "Original graded reading", level: "The Classical Style", kind: "Controlled", sandhi: "Sandhi applied",
  text: "कश्चिन्मुनिर्नद्यास्तीरेऽवसत्। तेन तत्र पर्णशाला कृता। स प्रातरुत्थाय स्नात्वा सूर्याय नमस्कृत्य ध्यानमकरोत्।\nएकदा ग्रामान्नरा आगताः। तैर्मुनिः पृष्टः — भगवन्, सुखं किमिति। मुनिना स्मित्वोक्तम् — सन्तोष एव सुखम्। यस्य सन्तोषोऽस्ति, स धनवान्। यस्य सन्तोषो नास्ति, तस्य सर्वं धनमपि अल्पमिति।\nतच्छ्रुत्वा नराः सन्तुष्टा गृहं गताः।",
  iast: "kaścin munir nadyās tīre 'vasat. tena tatra parṇaśālā kṛtā. sa prātar utthāya snātvā sūryāya namaskṛtya dhyānam akarot.\nekadā grāmān narā āgatāḥ. tair muniḥ pṛṣṭaḥ — bhagavan, sukhaṃ kim iti. muninā smitvā uktam — santoṣa eva sukham. yasya santoṣo 'sti, sa dhanavān. yasya santoṣo nāsti, tasya sarvaṃ dhanam api alpam iti.\ntac chrutvā narāḥ santuṣṭā gṛhaṃ gatāḥ.",
  translation: "A certain sage lived on the bank of a river. He built himself a leaf-hut there. Rising at dawn, bathing, bowing to the sun, he practised meditation. One day people came from the village. They asked the sage: 'Blessed one, what is happiness?' The sage smiled and said: 'Contentment alone is happiness. Whoever has contentment is rich. Whoever lacks contentment — for him even all wealth is little.' Hearing that, the people went home satisfied.",
  gloss: { "कश्चित्": "a certain (indefinite)", "तीरे": "on the bank", "पर्णशाला": "leaf-hut", "उत्थाय": "having risen (gerund)", "स्नात्वा": "having bathed", "नमस्कृत्य": "having bowed (namas+kṛ gerund)", "ध्यानम्": "meditation", "पृष्टः": "was asked (kta of √prach)", "स्मित्वा": "having smiled", "सन्तोषः": "contentment", "धनवान्": "wealthy (-vat possessive)", "सन्तुष्टाः": "satisfied", "गताः": "went (kta plural)" },
  notes: ["Stage-३ machinery end to end: gerund chains (utthāya snātvā namaskṛtya), kta-constructions (tena … kṛtā; tair muniḥ pṛṣṭaḥ; muninā uktam), and the yasya … sa frame twice.",

{
  id: "c6", title: "राजा च शुकः च — The king and the parrot", author: "Controlled Sanskrit", work: "Original graded reading", level: "The Classical Style", kind: "Controlled", sandhi: "Sandhi applied",
  text: "कस्मिंश्चिन्नगरे राजाभवत्। तस्य सुवर्णपञ्जरे शुकोऽवसत्। शुकः सुन्दरं वचनमभाषत, तेन राजा तस्मै स्निह्यति स्म।\nएकदा शुकेनोक्तम् — राजन्, अहं वने जातः। तत्र मम माता वसति। तां द्रष्टुमिच्छामीति। राज्ञोक्तम् — त्वं मम प्रियः। कथं त्वां त्यजामीति। शुकेनोक्तम् — यः प्रियं बध्नाति, स प्रियं न जानाति। यदि तव स्नेहः सत्यः, मां मुञ्चेति।\nतच्छ्रुत्वा राज्ञा पञ्जरं मुक्तम्। शुक आकाशमुत्पत्य वनं गतः। राजा तु सत्यं स्नेहं ज्ञातवान्।",
  iast: "kasmiṃś cin nagare rājābhavat. tasya suvarṇapañjare śuko 'vasat. śukaḥ sundaraṃ vacanam abhāṣata, tena rājā tasmai snihyati sma.\nekadā śukenoktam — rājan, ahaṃ vane jātaḥ. tatra mama mātā vasati. tāṃ draṣṭum icchāmīti. rājñoktam — tvaṃ mama priyaḥ. kathaṃ tvāṃ tyajāmīti. śukenoktam — yaḥ priyaṃ badhnāti, sa priyaṃ na jānāti. yadi tava snehaḥ satyaḥ, māṃ muñceti.\ntac chrutvā rājñā pañjaraṃ muktam. śuka ākāśam utpatya vanaṃ gataḥ. rājā tu satyaṃ snehaṃ jñātavān.",
  translation: "In a certain city there was a king. In his golden cage lived a parrot. The parrot spoke beautiful words, and so the king was fond of him. One day the parrot said: 'O king, I was born in the forest. My mother lives there. I wish to see her.' The king said: 'You are dear to me. How can I let you go?' The parrot said: 'Who cages what he loves does not know love. If your affection is true — release me.' Hearing that, the king opened the cage. The parrot flew up into the sky and went to the forest. And the king had learned what true affection is.",
  gloss: { "सुवर्णपञ्जरे": "in a golden cage (compound + loc.)", "शुकः": "parrot", "अभाषत": "spoke (ātm. laṅ)", "स्निह्यति स्म": "was fond of (sma makes present past)", "जातः": "born (kta of √jan)", "द्रष्टुम्": "to see (infinitive)", "बध्नाति": "binds, cages (√bandh)", "स्नेहः": "affection, love", "मुञ्च": "release! (imperative)", "मुक्तम्": "opened, freed (kta)", "उत्पत्य": "having flown up (gerund)", "ज्ञातवान्": "came to know (-tavat active past)" },
  notes: ["The -tavat active past (jñātavān) beside kta-constructions (rājñā … muktam): the two past strategies of Stage ४, sharing one story.",
    "स्म after a present (snihyati sma) throws it into the past — a idiom worth collecting.",
    "The yaḥ…sa frame carries the parrot's aphorism; yadi + present + imperative makes his plea.",

{
  id: "c7", title: "सुभाषितानि त्रीणि — Three wisdom verses", author: "Traditional (subhāṣita)", work: "Nīti anthology verses", level: "Reading Sanskrit", kind: "Verse", sandhi: "Sandhi applied",
  text: "विद्या ददाति विनयं विनयाद्याति पात्रताम् ।\nपात्रत्वाद्धनमाप्नोति धनाद्धर्मं ततः सुखम् ॥\n\nअयं निजः परो वेति गणना लघुचेतसाम् ।\nउदारचरितानां तु वसुधैव कुटुम्बकम् ॥\n\nउद्यमेन हि सिध्यन्ति कार्याणि न मनोरथैः ।\nन हि सुप्तस्य सिंहस्य प्रविशन्ति मुखे मृगाः ॥",

  translation: "Learning gives humility; from humility comes worthiness; from worthiness one gains wealth; from wealth, dharma — and from that, happiness. — 'This one is my own, that one a stranger' is the counting of small minds; for those of noble conduct, the whole earth is one family. — By effort do works succeed, not by daydreams: no deer walk into the mouth of a sleeping lion.",
  gloss: { "विनयम्": "humility, discipline", "पात्रताम्": "worthiness, fitness", "आप्नोति": "obtains (√āp)", "निजः": "one's own", "परः": "a stranger, another", "गणना": "reckoning, counting", "लघुचेतसाम्": "of the small-minded (gen. pl.)", "उदारचरितानाम्": "of those of noble conduct", "वसुधा": "the earth", "कुटुम्बकम्": "family", "उद्यमेन": "by effort", "मनोरथैः": "by daydreams ('mind-chariots')", "सुप्तस्य": "of a sleeping (kta gen.)", "प्रविशन्ति": "enter", "मृगाः": "deer, beasts" },

{
  id: "c8", title: "उपनिषद्वचनानि — Three Upaniṣadic sayings", author: "Upaniṣads", work: "Bṛhadāraṇyaka 1.3.28 · Muṇḍaka 3.1.6 · Īśā 1", level: "Reading Sanskrit", kind: "Scripture", sandhi: "Sandhi applied",
  text: "असतो मा सद्गमय ।\nतमसो मा ज्योतिर्गमय ।\nमृत्योर्मामृतं गमय ॥\n\nसत्यमेव जयते नानृतम् ।\n\nईशा वास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् ।\nतेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥",
  iast: "asato mā sad gamaya,\ntamaso mā jyotir gamaya,\nmṛtyor mā amṛtaṃ gamaya.\n\nsatyam eva jayate nānṛtam.\n\nīśā vāsyam idaṃ sarvaṃ yat kiñca jagatyāṃ jagat,\ntena tyaktena bhuñjīthā mā gṛdhaḥ kasya svid dhanam.",
  translation: "From the unreal lead me to the real; from darkness lead me to light; from death lead me to immortality. — Truth alone conquers, not untruth. — All this, whatever moves in this moving world, is to be dwelt in by the Lord; enjoy by that renouncing — do not covet: whose indeed is wealth?",
  gloss: { "असतः": "from the unreal (a-sat, abl.)", "गमय": "lead! (causative imperative of √gam!)", "तमसः": "from darkness (s-stem abl.)", "ज्योतिः": "light", "मृत्योः": "from death", "अमृतम्": "immortality (a + mṛta: the un-dead)", "जयते": "conquers", "अनृतम्": "untruth", "ईशा": "by the Lord (instr.)", "वास्यम्": "to be dwelt in / clothed (gerundive)", "जगत्याम्": "in the moving world", "त्यक्तेन": "by what is renounced (kta instr.)", "भुञ्जीथाः": "you should enjoy (ātm. optative)", "मा गृधः": "do not covet (mā + aorist)", "कस्यस्वित्": "whose indeed?" },
  notes: ["Three of the most recited sentences in Sanskrit. The pavamāna mantra (asato mā…) is a triple ablative-to-accusative movement with gamaya — the CAUSATIVE imperative of √gam: 'make me go' = lead me.",

<tr><td lang="sa">तु</td><td>'but' — turns (like δέ)</td></tr>

<tr><td lang="sa">वा</td><td>'or' (enclitic)</td></tr>
<tr><td lang="sa">इति</td><td>closes quotation/thought/name</td></tr>
<tr><td lang="sa">इव</td><td>'like, as' (after its word)</td></tr>
<tr><td lang="sa">खलु · किल · वै · नाम</td><td>indeed · they-say · truly · namely</td></tr>
<tr><td lang="sa">स्म</td><td>after a present: makes it past-habitual</td></tr></table>` },
{ title: "Ten everyday idioms", body: `<ol><li lang="sa">रामस्य पुस्तकमस्ति — Rāma HAS a book (genitive + asti).</li>
<li lang="sa">तेन किम् — what's the point? ('what by that?')</li>
<li lang="sa">किं नाम — what indeed? really?</li>
<li lang="sa">तथास्तु — so be it.</li>
<li lang="sa">कृतं कार्यम् — the task is done (kta as sentence).</li>
<li lang="sa">को दोषः — what's the harm?</li>
<li lang="sa">यथाशक्ति — as best one can.</li>
<li lang="sa">चिरं जीव — live long! (blessing imperative)</li>
<li lang="sa">दिष्ट्या — thank heavens! (instrumental of luck)</li>
<li lang="sa">अलं विवादेन — enough of quarrelling (अलम् + instrumental).</li></ol>` },
{ title: "IAST ↔ Devanagari key", body: `<p><b>Vowels:</b> अ a · आ ā · इ i · ई ī · उ u · ऊ ū · ऋ ṛ · ए e · ऐ ai · ओ o · औ au · ं ṃ · ः ḥ</p>
<p><b>Stops by varga:</b> क k ख kh ग g घ gh ङ ṅ · च c छ ch ज j झ jh ञ ñ · ट ṭ ठ ṭh ड ḍ ढ ḍh ण ṇ · त t थ th द d ध dh न n · प p फ ph ब b भ bh म m</p>
<p><b>Others:</b> य y र r ल l व v · श ś ष ṣ स s · ह h · क्ष kṣ · ज्ञ jñ</p>
<p>Macron = length; under-dot = retroflex (or ṛ ḥ ṃ); ś/ñ/ṅ = palatal & guttural specials. One sign, one sound, both directions — IAST is lossless.</p>` },
{ title: "The śloka in one box", body: `<p>Anuṣṭubh: 4 pādas × 8 syllables. Weight: long vowel OR short vowel + cluster = guru; else laghu. Even pādas cadence ⏑ – ⏑ ×. Break only at pāda ends (।, ॥). e and o always count long. The Gītā's triṣṭubh passages run 11 per pāda.</p>
<p class="ruleline" lang="sa">धर्मक्षेत्रे कुरुक्षेत्रे ‖ समवेता युयुत्सवः ।</p>
<p>Chant honouring length and the metre teaches itself within a week.</p>` },
{ title: "A reading procedure (the five moves)", body: `<ol><li>Read the sentence aloud, whole.</li>
<li>Split the sandhi (restore -aḥ from -o, undo fusions, unglue t/d).</li>
<li>Find the verb-word: finite, kta/tavat, or gerundive — it fixes the construction.</li>
<li>Sort cases from endings: agent, patient, datives, locatives; genitives to their nouns.</li>
<li>Open the arches: ya→ta, gerunds→agent, iti closes, compounds split right-to-left.</li></ol>
<p>Then — and only then — produce English. Twenty minutes daily; fluency is rhythm, not heroics.</p>` }
];

"use strict";
/* ------------------------------------------------------------------ store */
const KEY = "samskrtam-progress-v1";
const defaults = {
  completed: {}, scores: {}, readingDone: {}, chapterDone: {}, cards: {}, extraCards: {},
  settings: { theme: "system", direction: "mix", cardScope: "reached", strict: false },
  activity: []
};
const store = {
  data: null, memOnly: false,
  load() {
    try {
      this.data = Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || "{}"));
      this.data.settings = Object.assign({}, defaults.settings, this.data.settings || {});
      ["completed", "scores", "readingDone", "chapterDone", "cards", "extraCards"].forEach(k => {
        if (!this.data[k] || typeof this.data[k] !== "object") this.data[k] = {};
      });
      if (!Array.isArray(this.data.activity)) this.data.activity = [];
    } catch (e) { this.data = JSON.parse(JSON.stringify(defaults)); this.memOnly = true; }
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; } }
};
store.load();

/* ------------------------------------------------------------- utilities */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LET = "A-Za-z\\u00C0-\\u024F\\u1E00-\\u1EFF\\u0900-\\u097F";
// Fold IAST diacritics (ā→a, ṛ→r, ś→s, ṃ→m …) so typed answers need no
// special keyboard; Devanagari strings pass through unchanged.
function plain(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "")
    .normalize("NFC").replace(/[ʼ’']/g, "'");
}
function norm(s) { return plain(String(s).toLowerCase()).replace(/[.,;:!?“”"«»’—–()\[\]।॥|/]/g, "").replace(/\s+/g, " ").trim(); }
/* Strict-orthography mode: typed IAST must carry its full diacritics. */
function strictOn() { return !!(store.data && store.data.settings && store.data.settings.strict); }
// Strict normalisation keeps every macron and dot; it only levels case,
// apostrophes, punctuation and whitespace. Devanagari passes through as ever.
function snorm(s) {
  return String(s).normalize("NFC").toLowerCase().normalize("NFC")
    .replace(/[ʼ’']/g, "'").replace(/[.,;:!?“”"«»—–()\[\]।॥|/]/g, "").replace(/\s+/g, " ").trim();
}
const isDev = s => /[ऀ-ॿ]/.test(String(s));
// An answer is "bare" if diacritic-folding leaves it unchanged.
function bareAns(s) { const t = String(s).normalize("NFC"); return plain(t) === t; }
// In strict mode, drop ASCII convenience spellings whenever a properly
// marked IAST sibling exists; Devanagari answers are always kept.
function answerSet(arr) {
  if (!strictOn()) return arr;
  const keep = arr.filter(a => isDev(a) || !(bareAns(a) && arr.some(b => !isDev(b) && !bareAns(b))));
  return keep.length ? keep : arr;
}
function anorm(s) { return strictOn() ? snorm(s) : norm(s); }
function shuffled(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function route() { return location.hash.replace(/^#\/?/, "") || "home"; }
function go(r) { location.hash = "#/" + r; }
function allUnits() { return COURSE.flatMap(l => l.units.map(u => ({ ...u, level: l }))); }
function unit(id) { return allUnits().find(u => u.id === id); }
function reading(id) { return READINGS.find(r => r.id === id); }
function doneLevel(l) { return l.units.filter(u => store.data.completed[u.id]).length; }
function applyTheme() {
  let t = store.data.settings.theme;
  if (t === "system") t = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
}
function activity(type, id, extra) {
  store.data.activity.unshift(Object.assign({ type, id, at: Date.now() }, extra || {}));
  store.data.activity = store.data.activity.slice(0, 40);
}
function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
}

/* ------------------------------------------------------- course sequence */
function reachedUnitIds() {
  const ids = [];
  for (const u of allUnits()) { ids.push(u.id); if (!store.data.completed[u.id]) break; }
  return ids;
}
function nextUnitRoute() {
  const u = allUnits().find(x => !store.data.completed[x.id]);
  return u ? "unit/" + u.id + "/lesson" : "readings";
}

/* ------------------------------------------------------------ flashcards */
function allCards() {
  const scope = store.data.settings.cardScope || "reached";
  const reach = new Set(reachedUnitIds());
  const c = [];
  allUnits().forEach(u => {
    if (scope === "all" || reach.has(u.id))
      u.vocab.forEach((v, i) => c.push({ id: "u:" + u.id + ":" + i, la: v[0], en: v[1], source: u.title }));
  });
  Object.entries(store.data.extraCards).forEach(([id, x]) => c.push(Object.assign({ id }, x)));
  return c;
}
function controlledCount() { return READINGS.filter(r => r.kind === "Controlled").length; }
function authenticCount() { return READINGS.length - controlledCount(); }
function totalCourseCards() { return allUnits().reduce((n, u) => n + u.vocab.length, 0) + Object.keys(store.data.extraCards).length; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => !store.data.cards[c.id] || (store.data.cards[c.id].due || 0) <= now);
}

/* ---------------------------------------------------------------- render */
function render() {
  applyTheme();
  renderSidebar();
  const p = route().split("/");
  let out = "";
  if (p[0] === "home") out = viewHome();
  else if (p[0] === "level") out = viewLevel(p[1]);
  else if (p[0] === "unit") out = viewUnit(p[1], p[2] || "lesson");
  else if (p[0] === "quiz") out = viewQuiz(p[1]);
  else if (p[0] === "review") out = viewReview();
  else if (p[0] === "readings") out = viewReadings();
  else if (p[0] === "read") out = viewReading(p[1], p[2]);
  else if (p[0] === "flash") out = viewFlash();
  else if (p[0] === "flashrun") { startFlash(); return; }
  else if (p[0] === "script") out = viewScript();
  else if (p[0] === "scriptquiz") out = viewScriptQuiz(p[1] || "letters");
  else if (p[0] === "sandhi") out = viewSandhi();
  else if (p[0] === "sandhiquiz") out = viewSandhiQuiz(p[1] || "join");
  else if (p[0] === "dhatu") out = viewDhatu();
  else if (p[0] === "dhatuquiz") out = viewDhatuQuiz();
  else if (p[0] === "reference") out = viewReference();
  else if (p[0] === "lab") out = viewLab();
  else if (p[0] === "settings") out = viewSettings();
  else out = viewHome();
  $("#main").innerHTML = (store.memOnly ? `<div class="banner">Browser storage is unavailable, so progress will not survive a reload. Export it from Settings before closing.</div>` : "") + out;
  $("#main").focus({ preventScroll: true });
}

function nav(path, ic, label, badge) {
  const a = route().split("/")[0], p = path.split("/")[0],
    on = a === p || (p === "script" && a === "scriptquiz") || (p === "sandhi" && a === "sandhiquiz") || (p === "dhatu" && a === "dhatuquiz");
  return `<button class="navlink ${on ? "active" : ""}" ${on ? 'aria-current="page"' : ""} onclick="go('${path}')"><span class="ic" aria-hidden="true">${ic}</span>${label}${badge ? `<span class="badge">${badge}</span>` : ""}</button>`;
}
function renderSidebar() {
  const done = Object.keys(store.data.completed).length;
  $("#sidebar").innerHTML =
    `<div class="brand"><span class="seal" aria-hidden="true" lang="sa">सं</span><div><b>Saṃskṛtam</b><small>Script → Gītā</small></div></div>` +
    `<div class="navsec">Course</div>` + nav("home", "⌂", "Dashboard") +
    COURSE.map(l => nav("level/" + l.id, l.icon, l.short + " · " + l.tagline, doneLevel(l) + "/" + l.units.length)).join("") +
    nav("review", "↻", "Mixed review") +
    `<div class="navsec">Read</div>` + nav("readings", "▤", "Reading Room", Object.keys(store.data.readingDone).length + "/" + READINGS.length) +
    `<div class="navsec">Practice</div>` + nav("script", "अ", "Devanagari trainer") +
    nav("sandhi", "∿", "Sandhi trainer") +
    nav("flash", "◫", "Flashcards", dueCards().length + " due") +
    nav("dhatu", "√", "Dhātu lab") +
    nav("reference", "R", "Grammar reference") + nav("lab", "▦", "Morphology tables") +
    `<div class="navsec">Data</div>` + nav("settings", "⚙", "Settings", done + "/" + allUnits().length);

/* ------------------------------------------------------------------ home */
function viewHome() {
  const units = allUnits(), done = Object.keys(store.data.completed).length;
  const rd = Object.keys(store.data.readingDone).length, cards = allCards().length;
  const acts = store.data.activity.slice(0, 6).map(a => {
    let t = null;
    if (a.type === "unit") { const u = unit(a.id); if (u) t = `Practised <b>${esc(u.title)}</b>${a.pct != null ? ` — ${a.pct}%` : ""}`; }

    else if (a.type === "flash") t = `Reviewed <b>${a.n}</b> flashcard${a.n === 1 ? "" : "s"}`;

    else if (a.type === "script") t = `Devanagari drill — <b>${a.pct}%</b>`;

<div class="stats">
<div class="stat"><b>${done}/${units.length}</b><small>course units complete</small></div>
<div class="stat"><b>${rd}/${READINGS.length}</b><small>readings completed</small></div>
<div class="stat"><b>${cards}</b><small>vocabulary cards unlocked</small></div>
<div class="stat"><b>${dueCards().length}</b><small>reviews due</small></div></div>
<div class="card"><h2 style="margin-top:0">Method</h2>
<p>Master the script, then the sound-laws, then the forms — in that order, because in Sanskrit each layer literally contains the next. Early readings are printed <i>sandhi-dissolved</i> (each word separate, as in the ancient padapāṭha recitation); later ones fuse their words as real texts do, and the Sandhi trainer bridges the two. Every Sanskrit text carries an IAST transliteration toggle. In <b>Loose</b> answer mode, plain-letter IAST such as <b>dharmah</b> is accepted for <b>dharmaḥ</b>; <b>Strict</b> mode requires exact IAST diacritics or correct Devanagari.</p>
<button class="btn primary" onclick="go('${done ? nextUnitRoute() : "level/lipi"}')">${done ? "Continue course" : "Start with the script"}</button>
<button class="btn" onclick="go('script')">Devanagari trainer</button>
<button class="btn" onclick="go('sandhi')">Sandhi trainer</button>
<button class="btn" onclick="go('readings')">Open Reading Room</button>
${done ? `<button class="btn" onclick="go('review')">Mixed review</button>` : ""}</div>
${acts ? `<div class="card"><h2 style="margin-top:0">Recent work</h2><ul class="actlist">${acts}</ul></div>` : ""}
<h2>Course</h2>
${COURSE.map(l => `<div class="card levelcard" role="button" tabindex="0" onclick="go('level/${l.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('level/${l.id}')}"><div class="leveltop"><b>${l.icon} ${l.label}</b><span>${l.tagline}</span><span class="pct">${doneLevel(l)}/${l.units.length}</span></div><p>${l.desc}</p><div class="progress"><i style="width:${100 * doneLevel(l) / l.units.length}%"></i></div></div>`).join("")}
<h2>Reading Room</h2><div class="card"><p>${controlledCount()} controlled readings written for this course — the early ones sandhi-dissolved, the later ones fused — then authentic Sanskrit: subhāṣita wisdom-verses, the Upaniṣads, Vālmīki's first śloka, Kālidāsa, a chaptered book of Pañcatantra fables, and the course's summit, a guided First Gītā Reader.</p><button class="btn" onclick="go('readings')">Browse all ${READINGS.length}</button></div>`;
}

/* ----------------------------------------------------------- level, unit */
function viewLevel(id) {
  const l = COURSE.find(x => x.id === id);
  if (!l) return viewHome();
  return `<h1>${l.label}</h1><p class="sub">${l.desc}</p>` + l.units.map((u, i) =>
    `<div class="unitrow ${store.data.completed[u.id] ? "done" : ""}" role="button" tabindex="0" onclick="go('unit/${u.id}/lesson')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('unit/${u.id}/lesson')}"><span class="num" aria-hidden="true">${store.data.completed[u.id] ? "✓" : i + 1}</span><span class="t"><b>${u.title}</b><small>${u.subtitle}</small></span><span class="pill">${store.data.scores[u.id] != null ? store.data.scores[u.id] + "%" : "unit"}</span></div>`).join("");
}
function tabs(u, tab) {

    `<button class="tab ${tab === x ? "active" : ""}" role="tab" aria-selected="${tab === x}" onclick="go('unit/${u.id}/${x}')">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}</div>`;
}
function viewUnit(id, tab) {
  const u = unit(id);
  if (!u) return viewHome();
  let body = "";
  if (tab === "lesson")
    body = `<div class="card grammar">${u.grammar}</div><button class="btn primary" onclick="go('unit/${u.id}/examples')">Continue to examples</button>`;
  if (tab === "examples")
    body = `<div class="card">${u.examples.map(e => `<div class="example"><span class="la" lang="sa">${e[0]}</span><span class="en">${e[1]}</span></div>`).join("")}</div><button class="btn primary" onclick="go('unit/${u.id}/vocabulary')">Study vocabulary</button>`;
  if (tab === "vocabulary")
    body = `<div class="card vocab">${u.vocab.map(v => `<div><b lang="sa">${v[0]}</b><br><span>${v[1]}</span></div>`).join("")}</div><button class="btn primary" onclick="go('unit/${u.id}/practice')">Practise this unit</button>`;
  if (tab === "practice")
    body = `<div class="card"><h2 style="margin-top:0">Unit practice</h2><p>A bank of <b>${u.exercises.length}</b> questions — choose, complete, parse, transform and click-the-word. Each round draws a random ${Math.min(QUIZ_LEN, u.exercises.length)}, with an explanation after every answer. A score of 75% marks the unit complete. ${strictOn() ? "Strict mode is on: use exact IAST diacritics or Devanagari." : "Loose mode is on: plain-letter IAST is accepted (a for ā, s for ś/ṣ…)."}</p><button class="btn primary" onclick="go('quiz/${u.id}')">Start practice</button> ${store.data.scores[u.id] != null ? `<span class="pill">${store.data.scores[u.id]}% best</span>` : ""}</div>`;
  return `<span class="pill acc">${u.level.label}</span><h1>${u.title}</h1><p class="sub">${u.subtitle}</p>${tabs(u, tab)}${body}`;
}

/* ------------------------------------------------------------------ quiz */
let quiz = null;
const QUIZ_LEN = 8, REVIEW_LEN = 15;
const isChoice = e => e.t === "mcq" || e.t === "parse";
function prepare(exercises, n) {
  return shuffled(exercises).slice(0, n).map(e => {
    if (!isChoice(e)) return Object.assign({}, e);
    const order = shuffled(e.opts.map((_, i) => i));
    return Object.assign({}, e, { opts: order.map(i => e.opts[i]), a: order.indexOf(e.a) });
  });
}
function viewQuiz(id) {
  const u = unit(id);
  if (!u) return viewHome();
  quiz = { title: u.title, unitId: u.id, back: "unit/" + u.id + "/practice", kind: "unit", qs: prepare(u.exercises, QUIZ_LEN), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>${u.title}</h1><p class="sub">Practice · ${quiz.qs.length} of ${u.exercises.length} questions, drawn at random</p><div id="quizbox"></div>`;
}
function viewReview() {
  const reach = reachedUnitIds();
  const pool = allUnits().filter(u => reach.includes(u.id))
    .flatMap(u => u.exercises.map(e => Object.assign({}, e, { from: u.title })));
  if (pool.length < 4)
    return `<h1>Mixed review</h1><p class="sub">Cumulative practice across everything you have studied.</p><div class="card"><p>Complete a unit or two first — this pulls its questions from the units you have reached, in random order, so that older material keeps coming back.</p><button class="btn primary" onclick="go('${nextUnitRoute()}')">Go to the next unit</button></div>`;
  quiz = { title: "Mixed review", back: "review", kind: "review", qs: prepare(pool, REVIEW_LEN), i: 0, score: 0, answered: false };
  setTimeout(renderQuestion, 0);
  return `<h1>Mixed review</h1><p class="sub">${quiz.qs.length} questions drawn from the units you have reached</p><div id="quizbox"></div>`;
}
function quizEndButtons() {
  if (quiz.kind === "unit")
    return `<button class="btn primary" onclick="go('${quiz.back}')">Back to unit</button> <button class="btn" onclick="go('review')">Mixed review</button>`;
  if (["script", "sandhi", "dhatu"].includes(quiz.kind))

function renderQuestion() {

    } else if (["script", "sandhi", "dhatu"].includes(quiz.kind)) activity(quiz.kind, null, { pct });

  const e = quiz.qs[quiz.i];

  box.innerHTML = `<div class="progress"><i style="width:${100 * quiz.i / quiz.qs.length}%"></i></div>
<div class="exercise"><span class="pill">${quiz.i + 1}/${quiz.qs.length}</span> <span class="pill acc">${label}</span>${e.from ? ` <span class="pill">${esc(e.from)}</span>` : ""}
${e.form ? `<div class="formbox" lang="sa">${e.form}</div>` : ""}<p>${e.q}</p>${controls}<div id="feedback" role="status" aria-live="polite"></div></div>

function keypad() {

function typeChar(c) {

function answerMCQ(i) {

}
function answerPick(i) {
  if (!quiz || quiz.answered) return;

  const target = words.findIndex(w => norm(w) === norm(e.a));
  [...document.querySelectorAll(".pickword")].forEach((b, j) => {
    b.disabled = true;
    if (j === target) b.classList.add("correct"); else if (j === i) b.classList.add("wrong");

  if (!quiz || quiz.answered) return;

}

    `<div class="feedback ${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite. Expected: " + expected}</div>` +
    (e.ex ? `<div class="why">${e.ex}</div>` : "") +
    `<button class="btn small" id="nextq" style="margin-top:10px" type="button" onclick="quiz.i++;renderQuestion()">Next</button>`;

let aid = { gloss: false, notes: false, translation: false, iast: false };
function glossedText(r) { return glossify(r.text, r.gloss); }
function glossify(text, gloss) {
  const raw = text;
  const br = s => esc(s).replace(/\n/g, "<br>");
  if (!aid.gloss) return br(raw);
  // Sandhi changes word-endings at the surface (rāmaḥ → rāmo, vanam → vanaṃ),
  // so each gloss key also matches as a stem-prefix with its final ḥ/m adjusted.
  const entries = [];
  Object.keys(gloss || {}).forEach(k => {
    const variants = new Set([k, k.replace(/ः$/, ""), k.replace(/म्$/, "ं"), k.replace(/त्$/, "द"), k.replace(/्$/, "")]);
    variants.forEach(v => { if (v && v.length >= 2) entries.push({ key: k, disp: v }); });
  });
  entries.sort((a, b) => b.disp.length - a.disp.length);
  if (!entries.length) return br(raw);
  const alt = entries.map(e => e.disp.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  // Leading word-boundary required; trailing left open so fused continuations
  // (case endings swallowed by sandhi chains) still light up.
  const re = new RegExp(`(^|[^${LET}])(${alt})`, "g");
  let out = "", last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    const start = m.index + m[1].length, word = m[2];
    out += br(raw.slice(last, start));
    const hit = entries.find(e => e.disp === word);
    out += `<button class="word" type="button" data-g="${esc(hit ? hit.key : word)}">${esc(word)}</button>`;
    last = start + word.length;
    if (re.lastIndex <= last) re.lastIndex = last;
  }
  return out + br(raw.slice(last));
}

/* ------------------------------------------------------ sandhi trainer */
function viewSandhi() {
  return `<h1>Sandhi trainer</h1><p class="sub">Sandhi — "junction" — is the system of sound-fusions at word boundaries. It is not decoration: written Sanskrit applies it obligatorily, so reading fluency <i>is</i> sandhi fluency. Drill joining first, then the harder art of splitting.</p>
<div class="card"><h2 style="margin-top:0">Drills</h2>
<p><b>Join</b> gives you two words to fuse; <b>Split</b> gives you a fused phrase to cut; <b>Rules</b> quizzes the system itself.</p>
<button class="btn primary" onclick="go('sandhiquiz/join')">Join — saṃdhāna</button>
<button class="btn primary" onclick="go('sandhiquiz/split')">Split — viccheda</button>
<button class="btn primary" onclick="go('sandhiquiz/rules')">Rules</button></div>
<div class="card grammar"><h3 style="margin-top:0">The three families</h3>
<p><b>Vowel sandhi (ac-sandhi).</b> Like vowels merge long (a/ā + a/ā → ā); unlike vowels glide or fuse: a + i → e (deva + indraḥ → devendraḥ), a + u → o, i + vowel → y (iti + api → ity api), u + vowel → v.</p>
<p><b>Visarga sandhi.</b> Final -aḥ before voiced sounds → -o (rāmaḥ + gacchati → rāmo gacchati); before vowels other than a it drops (-ā ca); before unvoiced stops it assimilates (-aś ca, -as ti…).</p>
<p><b>Consonant sandhi (hal-sandhi).</b> Final -t voices before voiced sounds (tat + eva → tad eva), nasalises before nasals (tat + na → tan na); final -m before consonants → anusvāra (gṛham + gacchati → gṛhaṃ gacchati).</p>
<p>The complete tables live in the Grammar reference; the trainer teaches the frequent cases until they are reflexes.</p></div>`;
}

<script>
const STAGE0 = {
  id: "lipi", short: "अ", icon: "अ", label: "The Script — Devanāgarī",
  tagline: "Every letter, from zero",
  desc: "Four units that assume nothing: the vowels and the inherent a, the consonant grid that is really a map of the mouth, the mātrās and conjuncts, and then real reading practice with IAST alongside. Finish this stage and the script is simply how you read.",
  units: [
{
  id: "z1", title: "Vowels & the inherent a", subtitle: "The svaras — and the one idea that unlocks the whole script",
  grammar: `<p class="lead">Devanāgarī is not an alphabet like the Latin one — it is an <b>abugida</b>: every consonant sign carries a built-in vowel <i>a</i>, and other vowels are written as attachments. Grasp that single idea and the script's logic opens at once.</p>
<h3>The independent vowels — स्वराः svarāḥ</h3>
<table class="gr"><tr><th>Letter</th><th>IAST</th><th>Sound</th></tr>
<tr><td lang="sa">अ</td><td>a</td><td>u in <i>but</i> (never a in <i>cat</i>)</td></tr>
<tr><td lang="sa">आ</td><td>ā</td><td>a in <i>father</i> — long</td></tr>
<tr><td lang="sa">इ</td><td>i</td><td>i in <i>bit</i></td></tr>
<tr><td lang="sa">ई</td><td>ī</td><td>ee in <i>see</i> — long</td></tr>
<tr><td lang="sa">उ</td><td>u</td><td>u in <i>put</i></td></tr>
<tr><td lang="sa">ऊ</td><td>ū</td><td>oo in <i>food</i> — long</td></tr>
<tr><td lang="sa">ऋ</td><td>ṛ</td><td>vocalic r — the r of <i>Kṛṣṇa</i>, a vowel!</td></tr>
<tr><td lang="sa">ए</td><td>e</td><td>ay in <i>they</i> — always long</td></tr>
<tr><td lang="sa">ऐ</td><td>ai</td><td>i in <i>time</i></td></tr>
<tr><td lang="sa">ओ</td><td>o</td><td>o in <i>go</i> — always long</td></tr>
<tr><td lang="sa">औ</td><td>au</td><td>ow in <i>cow</i></td></tr></table>
<p>Length is grammar, not nuance: <b lang="sa">कल</b> <i>kala</i> and <b lang="sa">काल</b> <i>kāla</i> (time) are different words. e and o count as long always — they descend from old diphthongs. The macron in IAST marks exactly this length; write it and you are already thinking in Sanskrit phonology.</p>
<h3>The inherent a</h3>
<p><b lang="sa">क</b> alone reads <i>ka</i>. <b lang="sa">न</b> reads <i>na</i>. So the two-sign word <b lang="sa">वन</b> is <i>vana</i> (forest) — four sounds from two letters, because each consonant brings its own <i>a</i>. This is why Devanāgarī words look shorter than their IAST: the commonest vowel in the language is invisible.</p>
<h3>First words from vowels alone</h3>
<p class="ruleline" lang="sa">अ + इति ! — try: इति iti (thus) · अपि api (also) · इह iha (here) · उत uta (or)</p>
<div class="tip"><b>Do this now.</b> Copy each vowel by hand — headstroke first, then the body. Then open the <b>Devanagari trainer</b> and run the Letters drill. The vowels are eleven signs; they will be yours before dinner.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>अ is the <i>u</i> of <i>but</i>, not the <i>a</i> of <i>cat</i>. Saying it wrong warps every single word.</li><li>ऋ is a vowel: कृ is one syllable, <i>kṛ</i>. For the reconstructed Classical target of this course, do not insert a full <i>i</i>-vowel; modern recitation traditions often realise ऋ differently.</li><li>ए and ओ have no short partners; they are always long, whatever IAST's bare letters suggest.</li></ul></div>`,
  examples: [
    ["इति", "iti — 'thus, so': the little word that closes every Sanskrit quotation."],
    ["अपि", "api — 'also, even'. Two vowel-signs + the inherent a of प."],
    ["वन", "vana — 'forest': two consonant signs, four sounds; the inherent a doing silent work twice."],
    ["आम्", "ām — 'yes'. The म् with the slanting stroke is a bare m: next units explain the stroke."],
    ["ऋषि", "ṛṣi — 'seer': the vocalic ṛ opening a word you already know in English (rishi)."]

  id: "z2", title: "The consonant grid", subtitle: "Twenty-five stops in five perfect rows — a map of the mouth",
  grammar: `<p class="lead">The consonants are not a list but a <b>table</b>, arranged by the ancient grammarians with a precision phonetics did not match again until the nineteenth century. Five rows (vargas) by place in the mouth, five columns by manner. Learn the grid, not the letters, and twenty-five signs cost five ideas.</p>
<h3>The five vargas</h3>
<table class="gr"><tr><th>Row</th><th>voiceless</th><th>+breath</th><th>voiced</th><th>+breath</th><th>nasal</th></tr>
<tr><th scope="row">throat (ka-varga)</th><td lang="sa">क ka</td><td lang="sa">ख kha</td><td lang="sa">ग ga</td><td lang="sa">घ gha</td><td lang="sa">ङ ṅa</td></tr>
<tr><th scope="row">palate (ca-varga)</th><td lang="sa">च ca</td><td lang="sa">छ cha</td><td lang="sa">ज ja</td><td lang="sa">झ jha</td><td lang="sa">ञ ña</td></tr>
<tr><th scope="row">roof (ṭa-varga)</th><td lang="sa">ट ṭa</td><td lang="sa">ठ ṭha</td><td lang="sa">ड ḍa</td><td lang="sa">ढ ḍha</td><td lang="sa">ण ṇa</td></tr>
<tr><th scope="row">teeth (ta-varga)</th><td lang="sa">त ta</td><td lang="sa">थ tha</td><td lang="sa">द da</td><td lang="sa">ध dha</td><td lang="sa">न na</td></tr>
<tr><th scope="row">lips (pa-varga)</th><td lang="sa">प pa</td><td lang="sa">फ pha</td><td lang="sa">ब ba</td><td lang="sa">भ bha</td><td lang="sa">म ma</td></tr></table>
<p>Two contrasts English speakers must build: <b>aspiration</b> — ख/घ/थ/ध etc. add a real puff of breath (th is t+breath, never the th of <i>thin</i>); and <b>retroflex vs dental</b> — ट-row curls the tongue-tip back to the roof, त-row touches the teeth. Hindi and other Indian languages keep both contrasts; if you have them, you are ahead.</p>
<h3>The rest of the family</h3>
<table class="gr"><tr><th>Semivowels</th><th lang="sa">य ya · र ra · ल la · व va</th></tr>
<tr><th>Sibilants</th><td lang="sa">श śa (palatal sh) · ष ṣa (retroflex sh) · स sa</td></tr>
<tr><th>Breath</th><td lang="sa">ह ha</td></tr></table>
<p>श and ष both sound like English <i>sh</i> to begin with — palatal vs retroflex; the distinction matters to sandhi and will grow real with practice. And note the famous pair the grid explains: प pha is an aspirated p (as in <i>uphill</i>), not an f.</p>
<div class="tip"><b>Why the grid matters beyond reading.</b> Sandhi — the sound-fusion system of Stage २ — operates entirely in the grid's terms: voiceless becomes voiced, stops meet their own nasal, rows attract. Every hour spent on the varga table is an hour of sandhi pre-paid.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>थ is aspirated t (as in <i>anthill</i>), never English <i>th</i>. धर्म is <i>dh</i>arma with a breathy d.</li><li>च is the ch of <i>chair</i> (unaspirated); छ is the same with extra breath.</li><li>व is between English v and w — soft, no lower-lip bite.</li></ul></div>`,

  id: "z3", title: "Mātrās, virāma & conjuncts", subtitle: "Attaching vowels, cancelling them, and fusing consonants",
  grammar: `<p class="lead">Three mechanisms complete the script: the <b>mātrās</b> that attach every non-a vowel to a consonant, the <b>virāma</b> that cancels the inherent a, and the <b>conjuncts</b> that fuse consonant clusters into single signs. With them — plus two dots and a bar — you can write anything the language says.</p>
<h3>Mātrās on क</h3>
<table class="gr"><tr><th lang="sa">क</th><th lang="sa">का</th><th lang="sa">कि</th><th lang="sa">की</th><th lang="sa">कु</th><th lang="sa">कू</th><th lang="sa">कृ</th><th lang="sa">के</th><th lang="sa">कै</th><th lang="sa">को</th><th lang="sa">कौ</th></tr>
<tr><td>ka</td><td>kā</td><td>ki</td><td>kī</td><td>ku</td><td>kū</td><td>kṛ</td><td>ke</td><td>kai</td><td>ko</td><td>kau</td></tr></table>
<p>One genuine trap: the <b>i-mātrā is written before</b> its consonant though pronounced after — कि is <i>ki</i>, not <i>ik</i>. The stroke loops leftward over the letter it follows in sound.</p>
<h3>Virāma — the vowel-killer</h3>
<p>A small slant under a consonant cancels its a: <b lang="sa">क्</b> = bare k. Word-final consonants wear it: <b lang="sa">वनम्</b> vanam, <b lang="sa">तत्</b> tat. Inside words, clusters prefer fusion instead —</p>
<h3>Conjuncts — saṃyuktākṣara</h3>
<p>Most conjuncts are transparent: the first consonant loses its vertical stem and welds on: स्त sta, न्त nta, त्व tva, न्द nda, ग्न gna. र is special: <i>before</i> a consonant it becomes a hook above (र्म rma — as in धर्म); <i>after</i> one, a slash below (त्र tra, प्र pra). And a few fusions became new signs you simply learn:</p>
<table class="gr"><tr><th lang="sa">क्ष</th><th lang="sa">ज्ञ</th><th lang="sa">श्र</th><th lang="sa">त्त</th><th lang="sa">द्ध</th><th lang="sa">द्य</th></tr>
<tr><td>kṣa</td><td>jña</td><td>śra</td><td>tta</td><td>ddha</td><td>dya</td></tr></table>
<h3>Two dots and a bar</h3>
<p><b>Anusvāra</b> ं — a dot above: a nasal, IAST ṃ (संस्कृतम् saṃskṛtam). <b>Visarga</b> ः — two dots after: a breath, IAST ḥ, everywhere in endings (रामः rāmaḥ). <b>Daṇḍa</b> । ends a sentence; double daṇḍa ॥ ends a verse. Numerals, for completeness: १ २ ३ ४ ५ ६ ७ ८ ९ ०.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">संस्कृतम्</div><p>स sa + anusvāra (ṃ) + स्कृ (s+k conjunct with ṛ-mātrā) + त ta + म् (m with virāma): <i>saṃskṛtam</i> — "the perfected, the refined (speech)". The language's own name uses every mechanism of this unit.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>कि: the i-stroke stands left of क but sounds after it. Reading order ≠ writing order, once.</li><li>ज्ञ (jña) hides both j and ñ completely; traditional pronunciations vary (gya-, dnya-) — the classical value is jña.</li><li>The visarga ḥ is a real sound — a light echo of breath — not silent decoration: रामः is <i>rāmaḥ</i>.</li></ul></div>`,
  examples: [

    { t: "mcq", form: "ं vs ः", q: "Anusvāra vs visarga:", opts: ["nasal dot (ṃ) vs breath dots (ḥ)", "both nasals", "both silent", "long vs short"], a: 0, ex: "ं above = ṃ, a nasal (संसार saṃsāra); ः after = ḥ, an echo of breath (नमः namaḥ). Two of the highest-frequency signs in any Sanskrit page." },
    { t: "mcq", form: "त्र", q: "This conjunct is:", opts: ["tra — r written as a slash below", "ta-ra as two syllables", "ṭa", "tya"], a: 0, ex: "त + र → त्र: mantra, mitra, putra. When r comes FIRST in a cluster it instead flies above as a hook: धर्म dharma, कर्म karma." },

{
  id: "z4", title: "Reading practice — words, names, a first sentence", subtitle: "From deciphering to reading, with IAST as your parallel track",
  grammar: `<p class="lead">You now hold the complete script. This unit turns it into fluency: syllable-reading, names you already know, the IAST conventions used by every dictionary and scholarly text — and your first real Sanskrit sentence, which is also the course's next doorstep.</p>
<h3>Read by akṣara</h3>
<p>Devanāgarī divides naturally into akṣaras — written syllables: सं-स्कृ-त-म्. Read akṣara by akṣara, aloud. Speed follows accuracy; the script rewards patience for about three days and then suddenly feels native.</p>
<h3>Names and words you already own</h3>
<table class="gr"><tr><th>Devanāgarī</th><th>IAST</th><th></th></tr>
<tr><td lang="sa">योग</td><td>yoga</td><td>yoking, union — yes, that yoga</td></tr>
<tr><td lang="sa">कर्म</td><td>karma</td><td>action, deed</td></tr>
<tr><td lang="sa">गुरु</td><td>guru</td><td>heavy; venerable; teacher</td></tr>
<tr><td lang="sa">मन्त्र</td><td>mantra</td><td>instrument of thought</td></tr>
<tr><td lang="sa">अवतार</td><td>avatāra</td><td>descent</td></tr>
<tr><td lang="sa">हिमालय</td><td>himālaya</td><td>hima + ālaya: 'abode of snow'</td></tr>
<tr><td lang="sa">भगवद्गीता</td><td>bhagavadgītā</td><td>'the Lord's song' — this course's summit</td></tr></table>
<h3>IAST in one box</h3>
<p>Macron = length (ā ī ū). Under-dot = retroflex (ṭ ḍ ṇ ṣ) or the vowels/breath (ṛ ḥ) and nasal (ṃ). Over-marks: ś (palatal sh), ñ (palatal nasal), ṅ (guttural nasal). That is the practical system: a compact set of diacritics that makes IAST reversible back into Sanskrit spelling. This course prints Devanāgarī first and offers IAST everywhere at a toggle; use both until both are transparent.</p>

<h3>The present tense — laṭ-lakāra</h3>
<p>√गम् gam "go" uses the present stem गच्छ- gaccha-:</p>
<table class="gr"><tr><th></th><th>singular</th><th>dual</th><th>plural</th></tr>

<p>Yes — a <b>dual</b>: Sanskrit keeps a full set of forms for exactly two. (Greek had traces; Sanskrit has the complete system, in nouns too.) Note the traditional order: Indian grammar counts the 3rd person as FIRST (prathama) — this course lists it first for that reason.</p>

<h3>The nominal sentence</h3>
<p>As in Greek and Latin, "is" may vanish: <b lang="sa">रामः नरः।</b> rāmaḥ naraḥ — "Rāma is a man." अस्ति asti (is) appears for existence or emphasis: <b lang="sa">ग्रामे जलम् अस्ति</b> — "there is water in the village."</p>
<h3>Negation and 'and'</h3>
<p><b lang="sa">न</b> na before the verb negates: न गच्छामि, "I don't go". <b lang="sa">च</b> ca means "and" but stands AFTER its word (like Latin -que): रामः सीता च — "Rāma and Sītā".</p>

<h3>The eight vibhaktis in one glance</h3>
<table class="gr"><tr><th>Traditional name</th><th>Western name</th><th>Core job</th></tr>
<tr><td lang="sa">प्रथमा prathamā</td><td>nominative</td><td>subject</td></tr>

<tr><td lang="sa">तृतीया tṛtīyā</td><td>instrumental</td><td>by, with</td></tr>
<tr><td lang="sa">चतुर्थी caturthī</td><td>dative</td><td>to, for</td></tr>
<tr><td lang="sa">पञ्चमी pañcamī</td><td>ablative</td><td>from, than</td></tr>
<tr><td lang="sa">षष्ठी ṣaṣṭhī</td><td>genitive</td><td>of</td></tr>
<tr><td lang="sa">सप्तमी saptamī</td><td>locative</td><td>in, on, at</td></tr>
<tr><td lang="sa">सम्बोधन sambodhana</td><td>vocative</td><td>address</td></tr></table>
<p>The tradition numbers them — "the second" (dvitīyā) simply <i>means</i> the accusative — and the numbering is worth adopting: it is how every Sanskrit dictionary, commentary and teacher speaks.</p>
<h3>देव deva, the a-stem masculine — prathamā & dvitīyā</h3>

<p>The -aḥ / -am opposition will carry your first hundred sentences: rāmaḥ (subject) vs rāmam (object). The dual -au serves both cases — context decides, exactly as with Greek's dual.</p>

<div class="worked"><b>Worked example</b><div class="wl" lang="sa">नरः ग्रामम् गच्छति। नरम् बालः पश्यति।</div><p>First sentence: naraḥ (subject) goes to grāmam (goal). Second: the ENDINGS flip the roles — naram is now object, bālaḥ subject: "the boy sees the man", although 'man' stands first. Order is rhetoric; vibhakti is grammar.</p></div>

  grammar: `<p class="lead">Three cases with vivid, physical meanings: the instrumental (by/with), the dative (to/for) and the ablative (from). Each will later grow syntactic superpowers — the instrumental above all, which becomes the agent of classical Sanskrit's favourite construction. Plant them well.</p>
<h3>The forms on देव</h3>
<table class="gr"><tr><th></th><th>singular</th><th>dual</th><th>plural</th></tr>
<tr><th scope="row">tṛtīyā (by/with)</th><td lang="sa">देवेन devena</td><td lang="sa">देवाभ्याम् devābhyām</td><td lang="sa">देवैः devaiḥ</td></tr>
<tr><th scope="row">caturthī (to/for)</th><td lang="sa">देवाय devāya</td><td lang="sa">देवाभ्याम्</td><td lang="sa">देवेभ्यः devebhyaḥ</td></tr>
<tr><th scope="row">pañcamī (from)</th><td lang="sa">देवात् devāt</td><td lang="sa">देवाभ्याम्</td><td lang="sa">देवेभ्यः</td></tr></table>
<p>Note the economies: the dual -ābhyām serves three cases; the plural -ebhyaḥ serves dative and ablative both. The system is big but thrifty.</p>
<h3>tṛtīyā — the by/with case</h3>
<p class="ruleline" lang="sa">बालः हस्तेन फलम् गृह्णाति। — The boy takes the fruit with his hand.</p>
<p>Instrument (hastena, by hand), accompaniment with सह saha (रामेण सह, together with Rāma — saha FOLLOWS its noun), manner (सुखेन sukhena, happily). Remember this case: in Stage ३ it will name the doer of past-participle sentences — the single most classical construction in the language.</p>
<h3>caturthī — the to/for case</h3>
<p class="ruleline" lang="sa">गुरुः बालाय फलम् यच्छति। — The teacher gives the boy a fruit.</p>
<p>Recipient and purpose; also the idiom of salutation: <b lang="sa">रामाय नमः</b> — "homage TO Rāma" (the नमः of namaste governs a dative).</p>
<h3>pañcamī — the from case</h3>
<p class="ruleline" lang="sa">नरः ग्रामात् आगच्छति। — The man comes from the village.</p>
<p>Source, separation, cause — and later, the second term of comparison ("than"). वनात् from the forest; वृक्षात् फलम् पतति, "the fruit falls from the tree".</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">गुरुः ग्रामात् आगच्छति, बालाय ज्ञानम् यच्छति, बालः च आनन्देन पठति।</div><p>Three cases in one breath: ग्रामात् (from the village), बालाय (to the boy), आनन्देन (with joy — manner). <i>The teacher comes from the village, gives knowledge to the boy, and the boy studies with delight.</i></p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>देवेन (instr. sg.) vs देवेभ्यः (dat./abl. pl.): -ena is singular only.</li><li>सह follows: रामेण सह, not सह रामेण (prose norm).</li><li>-āt of the ablative is a real dental t: ग्रामात्; sandhi will sometimes voice it to -ād (Stage २).</li></ul></div>`,

  grammar: `<p class="lead">The remaining three cases complete the vibhakti wheel: the genitive of possession, the locative of place (a case Latin lost and Sanskrit kept in full health), and the vocative of address. With them comes the neuter a-stem — and with THAT, the whole a-declension is yours.</p>
<h3>The forms on देव</h3>
<table class="gr"><tr><th></th><th>singular</th><th>dual</th><th>plural</th></tr>
<tr><th scope="row">ṣaṣṭhī (of)</th><td lang="sa">देवस्य devasya</td><td lang="sa">देवयोः devayoḥ</td><td lang="sa">देवानाम् devānām</td></tr>
<tr><th scope="row">saptamī (in/at)</th><td lang="sa">देवे deve</td><td lang="sa">देवयोः</td><td lang="sa">देवेषु deveṣu</td></tr>
<tr><th scope="row">sambodhana (O!)</th><td lang="sa">देव deva</td><td lang="sa">देवौ</td><td lang="sa">देवाः</td></tr></table>
<h3>ṣaṣṭhī — of</h3>
<p class="ruleline" lang="sa">नरस्य पुत्रः ग्रामे वसति। — The man's son lives in the village.</p>
<p>Possession and relation; the possessor normally precedes: rāmasya putraḥ, "Rāma's son". Sanskrit also loves the genitive with 'to be' for having: <b lang="sa">नरस्य पुत्रः अस्ति</b> — "the man has a son" (lit. "of-the-man a son is").</p>
<h3>saptamī — in, on, at, among</h3>
<p class="ruleline" lang="sa">ग्रामे वसति · वने चरति · देवेषु विश्वासः</p>
<p>Place where (grāme, in the village), surface (bhūmau, on the ground — i-stem preview), circumstance and reference (deveṣu viśvāsaḥ, "trust in the gods"). Later it will stage the 'locative absolute' — Sanskrit's version of the construction you know from both Latin and Greek.</p>
<h3>sambodhana — address</h3>
<p>Usually the bare stem: <b lang="sa">हे राम!</b> he rāma! "O Rāma!" — with हे as the calling particle. The Gītā will address Arjuna in a fresh vocative every few verses (pārtha! kaunteya! bhārata!) — the case earns its keep in epic.</p>
<h3>फलम् — the neuter</h3>
<table class="gr"><tr><th></th><th>singular</th><th>dual</th><th>plural</th></tr>
<tr><th scope="row">prathamā/dvitīyā</th><td lang="sa">फलम् phalam</td><td lang="sa">फले phale</td><td lang="sa">फलानि phalāni</td></tr></table>
<p>Identical nominative and accusative (the pan-Indo-European neuter rule you know from Greek and Latin), and elsewhere the neuter simply borrows देव's endings: phalena, phalāya, phalasya, phale…</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">हे पुत्र, वृक्षस्य फलानि बालेभ्यः यच्छ।</div><p> "Son, give the tree's fruits to the boys." Vocative (he putra), genitive (vṛkṣasya), neuter plural object (phalāni), dative of recipients (bālebhyaḥ), and an imperative (yaccha — Stage २'s business, given here on account).</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>देवयोः is genitive AND locative dual — context decides, as with देवौ.</li><li>ṣaṣṭhī plural देवानाम् lengthens the a: -ānām.</li><li>The vocative of -a stems is the bare stem: राम! — not रामः.</li></ul></div>`,

  id: "g5", title: "The feminine in ā", subtitle: "सीता, माला, विद्या — and adjective agreement",
  grammar: `<p class="lead">The feminine ā-stems are the a-stems' mirror: same architecture, feminine gender, a few endings of their own. With them arrives agreement — adjectives matching their nouns in gender, case and number — and Sanskrit's noun-phrase machinery is complete for everyday purposes.</p>
<h3>सीता sītā declined</h3>
<table class="gr"><tr><th></th><th>singular</th><th>dual</th><th>plural</th></tr>
<tr><th scope="row">prathamā</th><td lang="sa">सीता sītā</td><td lang="sa">सीते sīte</td><td lang="sa">सीताः sītāḥ</td></tr>
<tr><th scope="row">dvitīyā</th><td lang="sa">सीताम् sītām</td><td lang="sa">सीते</td><td lang="sa">सीताः</td></tr>
<tr><th scope="row">tṛtīyā</th><td lang="sa">सीतया sītayā</td><td lang="sa">सीताभ्याम्</td><td lang="sa">सीताभिः sītābhiḥ</td></tr>
<tr><th scope="row">caturthī</th><td lang="sa">सीतायै sītāyai</td><td lang="sa">सीताभ्याम्</td><td lang="sa">सीताभ्यः sītābhyaḥ</td></tr>
<tr><th scope="row">pañcamī</th><td lang="sa">सीतायाः sītāyāḥ</td><td lang="sa">सीताभ्याम्</td><td lang="sa">सीताभ्यः</td></tr>
<tr><th scope="row">ṣaṣṭhī</th><td lang="sa">सीतायाः</td><td lang="sa">सीतयोः</td><td lang="sa">सीतानाम् sītānām</td></tr>
<tr><th scope="row">saptamī</th><td lang="sa">सीतायाम् sītāyām</td><td lang="sa">सीतयोः</td><td lang="sa">सीतासु sītāsu</td></tr>
<tr><th scope="row">sambodhana</th><td lang="sa">सीते! site!</td><td lang="sa">सीते</td><td lang="sa">सीताः</td></tr></table>
<p>Like सीता decline: माला mālā (garland), विद्या vidyā (learning), कथा kathā (story), भाषा bhāṣā (language), सेना senā (army), कन्या kanyā (girl).</p>
<h3>Agreement</h3>
<p>An adjective takes its noun's gender, case and number, choosing the matching declension: masculine/neuter like देव/फल, feminine like सीता.</p>
<p class="ruleline" lang="sa">सुन्दरः बालः · सुन्दरम् फलम् · सुन्दरा कन्या</p>
<p>So: <b lang="sa">रामः सुन्दराम् मालाम् पश्यति</b> — "Rāma sees a beautiful garland": adjective in feminine dvitīyā, marching in step. Common adjectives: प्रिय priya (dear), शुभ śubha (auspicious), दीर्घ dīrgha (long), अल्प alpa (small), बहु bahu (much/many — an u-stem, previewed), सर्व sarva (all — declines pronominally, later).</p>
<h3>iti — the quotation-closer</h3>
<p>Sanskrit quotes by putting the words first and <b lang="sa">इति</b> after them — a spoken close-quote:</p>
<p class="ruleline" lang="sa">रामः वनम् गच्छामि इति वदति। — Rāma says, "I am going to the forest."</p>
<p>Inside the quotation the speaker's own 1st person stays (gacchāmi, "I go") — Sanskrit strongly prefers direct speech. iti will scale up later to mark thoughts, reasons and titles; it is among the language's most elegant machines.</p>

<h3>tad in the three genders (singular)</h3>
<table class="gr"><tr><th></th><th>masc.</th><th>fem.</th><th>neut.</th></tr>
<tr><th scope="row">prathamā</th><td lang="sa">सः saḥ</td><td lang="sa">सा sā</td><td lang="sa">तत् tat</td></tr>
<tr><th scope="row">dvitīyā</th><td lang="sa">तम् tam</td><td lang="sa">ताम् tām</td><td lang="sa">तत्</td></tr>
<tr><th scope="row">tṛtīyā</th><td lang="sa">तेन tena</td><td lang="sa">तया tayā</td><td lang="sa">तेन</td></tr>
<tr><th scope="row">ṣaṣṭhī</th><td lang="sa">तस्य tasya</td><td lang="sa">तस्याः tasyāḥ</td><td lang="sa">तस्य</td></tr>
<tr><th scope="row">saptamī</th><td lang="sa">तस्मिन् tasmin</td><td lang="sa">तस्याम् tasyām</td><td lang="sa">तस्मिन्</td></tr></table>
<p>Plural nominatives: ते te (m.), ताः tāḥ (f.), तानि tāni (n.). The same skeleton will serve for etad (this), yad (the relative 'who/which' — Stage ३'s hinge) and kim (who? what?): learn tad and you have pre-learned three more paradigms.</p>
<h3>Deixis in action</h3>
<p class="ruleline" lang="sa">रामः ग्रामे वसति। सः अद्य वनम् गच्छति। तस्य पुत्रः अपि गच्छति।</p>
<p>"Rāma lives in the village. HE goes to the forest today. HIS son goes too." — saḥ picks up the subject, tasya possesses, अपि api adds 'too' (after its word, like ca). This is how Sanskrit paragraphs breathe.</p>
<h3>Asking</h3>
<table class="gr"><tr><th lang="sa">कः? का? किम्?</th><th lang="sa">कुत्र?</th><th lang="sa">कदा?</th><th lang="sa">कथम्?</th><th lang="sa">कुतः?</th><th lang="sa">किमर्थम्?</th></tr>

<p class="ruleline" lang="sa">कः त्वम्? — अहम् रामः। · कुत्र गच्छसि? — वनम् गच्छामि।</p>
<p>And the personal pronouns: अहम् aham (I), त्वम् tvam (you) — with the enclitic possessives मम mama / तव tava (my / your): <b lang="sa">मम पुस्तकम् अस्ति</b>, "I have a book".</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">कः वने वसति इति बालः पृच्छति। तत्र मुनिः वसति इति नरः वदति।</div><p>Question quoted with iti, answer likewise: "'Who lives in the forest?' asks the boy. 'A sage lives there,' says the man." Two sentences, two quotations, one pronoun-question — and you are reading dialogue. (मुनिः muniḥ, an i-stem, slips in as preview.)</p></div>

  id: "m1", title: "Vowel sandhi", subtitle: "ac-sandhi: what happens when vowels meet",
  grammar: `<p class="lead">Sanskrit refuses hiatus: when a word ending in a vowel meets a word beginning with one, the vowels <b>must</b> combine, and the combination is written. These are not stylistic options but laws — and they are few, symmetrical, and learnable in an afternoon.</p>
<h3>Law 1 — like + like = long</h3>
<table class="gr"><tr><th>Meeting</th><th>Result</th><th>Example</th></tr>
<tr><td>a/ā + a/ā</td><td lang="sa">ā</td><td lang="sa">न + अस्ति → नास्ति nāsti (is not)</td></tr>
<tr><td>i/ī + i/ī</td><td lang="sa">ī</td><td lang="sa">गच्छति + इति → गच्छतीति gacchatīti</td></tr>
<tr><td>u/ū + u/ū</td><td lang="sa">ū</td><td lang="sa">साधु + उक्तम् → साधूक्तम् sādhūktam (well said)</td></tr></table>
<h3>Law 2 — a/ā + unlike vowel = guṇa</h3>
<table class="gr"><tr><th>Meeting</th><th>Result</th><th>Example</th></tr>
<tr><td>a/ā + i/ī</td><td lang="sa">e</td><td lang="sa">देव + इन्द्रः → देवेन्द्रः devendraḥ</td></tr>
<tr><td>a/ā + u/ū</td><td lang="sa">o</td><td lang="sa">सूर्य + उदयः → सूर्योदयः sūryodayaḥ (sunrise)</td></tr>
<tr><td>a/ā + ṛ</td><td lang="sa">ar</td><td lang="sa">महा + ऋषिः → महर्षिः maharṣiḥ</td></tr>
<tr><td>a/ā + e/ai</td><td lang="sa">ai</td><td lang="sa">च + एव → चैव caiva</td></tr>
<tr><td>a/ā + o/au</td><td lang="sa">au</td><td>rare in practice — recognise when met</td></tr></table>
<h3>Law 3 — i/u/ṛ + unlike vowel = glide</h3>
<p>High vowels turn into their semivowels: i→y, u→v, ṛ→r:</p>
<p class="ruleline" lang="sa">इति + अपि → इत्यपि ity api · मधु + अत्र → मध्वत्र madhv atra · गच्छति + एव → गच्छत्येव</p>
<h3>Law 4 — e/o before a vowel</h3>
<p>Final e and o usually drop their second element before a- (which itself vanishes, marked by avagraha ऽ): <b lang="sa">ते + अपि → तेऽपि te'pi</b>. Before other vowels they open to a: वने + इव → वन इव vana iva.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">इति + उक्त्वा + अगच्छत् → इत्युक्त्वागच्छत्</div><p>i + u → yu (glide); ā + a → ā (like+like): <i>ity uktvāgacchat</i>, "having spoken thus, he went". Three words fused into one written chain — this is what every classical page does, and why the Sandhi trainer drills join and split as separate skills.</p></div>
<div class="tip"><b>From here on, the readings fuse.</b> Controlled readings from c4 onward are printed with sandhi applied, as real texts are. When stuck, run the rules backwards: see e, guess a+i; see o, guess a+u; see y before a vowel, guess i.</div>

  id: "m2", title: "Visarga sandhi", subtitle: "The shape-shifting ḥ: rāmaḥ, rāmo, rāmas, rāma",
  grammar: `<p class="lead">The visarga -ḥ — which ends half the words in your readings so far — is a chameleon: before different sounds it becomes o, s, ś, r, or vanishes. Master its three main habits and the fused texts of the Reading Room open at once, because <b>nothing changes the look of a Sanskrit sentence more than visarga sandhi</b>.</p>
<h3>Habit 1 — -aḥ before voiced sounds → -o</h3>
<p class="ruleline" lang="sa">रामः + गच्छति → रामो गच्छति rāmo gacchati</p>
<p>Before any voiced consonant (g, j, d, b, n, m, y, r, l, v, h…) the ending -aḥ becomes -o. Before voiced vowels? Before a- specifically: -aḥ + a- → -o ऽ: रामः + अपि → रामोऽपि. Before other vowels it simply drops: रामः + इति → राम इति rāma iti.</p>
<h3>Habit 2 — before voiceless stops: assimilate</h3>
<table class="gr"><tr><th>Before</th><th>-ḥ becomes</th><th>Example</th></tr>
<tr><td>c/ch</td><td lang="sa">ś</td><td lang="sa">रामः + च → रामश्च rāmaś ca</td></tr>
<tr><td>t/th</td><td lang="sa">s</td><td lang="sa">रामः + तत्र → रामस्तत्र rāmas tatra</td></tr>
<tr><td>k/kh, p/ph</td><td>stays ḥ</td><td lang="sa">रामः करोति rāmaḥ karoti</td></tr></table>
<h3>Habit 3 — -āḥ and others</h3>
<p>Long -āḥ before voiced sounds just drops the ḥ: <b lang="sa">नराः + गच्छन्ति → नरा गच्छन्ति narā gacchanti</b>. Other-vowel + ḥ (iḥ, uḥ…) before voiced becomes r: <b lang="sa">मुनिः + अपि → मुनिरपि munir api; कविः + वदति → कविर्वदति kavir vadati.</p>
<p>Before a pause (end of sentence), ḥ stays: …गच्छति रामः।</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">रामो वनं गच्छति। सीता च तेन सह गच्छति।</div><p>rāmo (rāmaḥ before voiced v-) vanaṃ (vanam's m → anusvāra before g — next unit's rule, met here in the wild) gacchati. <i>Rāma goes to the forest, and Sītā goes with him.</i> The sentence you have known since Stage 0 — now wearing its true classical face.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>रामो is not a new word or an o-stem: it is रामः in a voiced neighbourhood. When you see -o where you expect a subject, restore -aḥ mentally.</li><li>-aś ca, -as tatra: the sibilant matches the following stop's row — the varga grid at work again.</li><li>The ḥ survives only utterance-finally and before k/kh/p/ph (and in a few s-clusters). Everywhere else it is in disguise.</li></ul></div>`,

  id: "m3", title: "Consonant sandhi & anusvāra", subtitle: "tat → tad, vanam → vanaṃ: the last set of fusions",
  grammar: `<p class="lead">The third and last sandhi family: what final consonants — in practice mostly -t and -m — do before the next word. Two rules cover the vast majority of cases; the leftovers are recognition-only. After this unit, no fused sentence in the course can surprise you.</p>
<h3>Final -m → anusvāra</h3>
<p>Before any consonant, word-final m is written as the dot:</p>
<p class="ruleline" lang="sa">वनम् + गच्छति → वनं गच्छति vanaṃ gacchati · फलम् + च → फलं च phalaṃ ca</p>
<p>Before a vowel it stays m: वनम् आगच्छति vanam āgacchati. So the accusatives you have written as -म् will appear as -ं almost always in real text — same ending, new clothes.</p>
<h3>Final -t assimilates</h3>
<table class="gr"><tr><th>Before</th><th>-t becomes</th><th>Example</th></tr>
<tr><td>voiced sound</td><td lang="sa">d</td><td lang="sa">तत् + एव → तदेव tad eva</td></tr>
<tr><td>nasal (n/m)</td><td lang="sa">n</td><td lang="sa">तत् + न → तन्न tan na</td></tr>
<tr><td>c/ch</td><td lang="sa">c</td><td lang="sa">तत् + च → तच्च tac ca</td></tr>
<tr><td>j</td><td lang="sa">j</td><td lang="sa">तत् + जलम् → तज्जलम् taj jalam</td></tr>
<tr><td>l</td><td lang="sa">l</td><td lang="sa">तत् + लभते → तल्लभते tal labhate</td></tr></table>
<p>The logic is pure varga-grid: t moves to its neighbour's row (c, j), voices before voice (d), nasalises before nasals (n). One consonant, one map.</p>
<h3>Final -n: one famous rule</h3>
<p>-n after a short vowel doubles before an initial vowel: <b lang="sa">गच्छन् + अस्ति? → गच्छन्नस्ति</b>; and देवान् + अपि? behaves by fuller rules met case-by-case in readings. Recognition suffices at this stage.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">तद् एव सत्यम् · written: तदेव सत्यम्</div><p>tat + eva → tad eva, "that alone is the truth" — the t voicing before the vowel of eva. You will read this exact fusion in the Upaniṣad texts of the Reading Room: sandhi is not an exercise, it is the surface of scripture.</p></div>
<div class="tip"><b>The complete sandhi kit.</b> Vowels (unit १), visarga (unit २), consonants (this unit): three families, perhaps twenty everyday rules. The Grammar reference holds the full tables; the Sandhi trainer drills them mixed. From here the course reads like Sanskrit — because it now is.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>वनं and वनम् are the same word: anusvāra before consonants, m before vowels and pause.</li><li>तद् in isolation is really तत्: dictionaries cite tat; texts show tad when voiced context follows.</li><li>Doubled forms like तच्च, तज्ज्ञानम् unglue as tat + ca, tat + jñānam — restore the t and split.</li></ul></div>`,

    { t: "fill", form: "तत् + न", q: "Join by sandhi.", a: ["तन्न", "tan na", "tanna"], ex: "Before a nasal, t becomes the nasal of its own row: tan na. The rule that turns crisp endings into the doubled letters that once looked so alien." },

    { t: "mcq", q: "Dictionaries cite तत् but texts often print तद् because:", opts: ["the citation form is pre-sandhi; texts show the sandhied surface", "they disagree", "tad is a different word", "printing errors"], a: 0, ex: "tat is the word; tad its voiced-context face. The same doubleness you know from rāmaḥ/rāmo — lexicon stores the deep form, the page shows the surface." },

    { t: "mcq", q: "Why does consonant sandhi feel familiar already?", opts: ["it re-runs the varga grid: voicing, row-matching, nasal-matching", "the rules were designed to be easy", "most pairs simply stay unchanged", "it doesn't"], a: 0, ex: "Every rule is a move on the Stage-0 consonant table: t→d (voice), t→c (row), t→n (nasal). The grid was never just an alphabet — it was the sandhi engine in disguise." },

{
  id: "m4", title: "The dhātu & the ten gaṇas", subtitle: "Roots, classes, and the ātmanepada voice",
  grammar: `<p class="lead">Sanskrit's verbs grow from about two thousand <b>dhātus</b> — roots — organised by the tradition into ten <b>gaṇas</b> (classes) according to how each builds its present stem. Four thematic classes cover most of what you will read; and alongside the active endings you know runs a second set, the <b>ātmanepada</b>, the middle voice of Greek reborn.</p>
<h3>The four everyday gaṇas</h3>
<table class="gr"><tr><th>Gaṇa</th><th>Stem recipe</th><th>Example</th></tr>
<tr><td>1 (bhvādi)</td><td>guṇa + a</td><td lang="sa">√भू → भवति bhavati · √गम् → गच्छति</td></tr>
<tr><td>4 (divādi)</td><td>root + ya</td><td lang="sa">√दिव् → दीव्यति dīvyati (plays) · √नृत् → नृत्यति (dances)</td></tr>
<tr><td>6 (tudādi)</td><td>bare root + a</td><td lang="sa">√तुद् → तुदति tudati (strikes) · √लिख् → लिखति</td></tr>
<tr><td>10 (curādi)</td><td>root + aya</td><td lang="sa">√चुर् → चोरयति corayati (steals) · √चिन्त् → चिन्तयति (thinks)</td></tr></table>
<p>All four conjugate exactly like गच्छति — once the stem is built, the endings you know take over. The remaining classes (5, 8, 9: सु-नो-ति, कृ → करोति, ज्ञा → जानाति; 2, 3, 7 athematic: अस्ति, ददाति, युनक्ति) are met as vocabulary now and systematised in Stage ४.</p>
<h3>Ātmanepada — the 'word for oneself'</h3>
<p>Parasmaipada ('word for another') is the active set: -ति, -तः, -न्ति. Ātmanepada endings mirror them with e-coloured vowels — in the singular: -ए (1st), -से (2nd), -ते (3rd):</p>
<table class="gr"><tr><th></th><th>singular</th><th>dual</th><th>plural</th></tr>
<tr><th scope="row">3rd</th><td lang="sa">लभते labhate</td><td lang="sa">लभेते labhete</td><td lang="sa">लभन्ते labhante</td></tr>
<tr><th scope="row">2nd</th><td lang="sa">लभसे labhase</td><td lang="sa">लभेथे labhethe</td><td lang="sa">लभध्वे labhadhve</td></tr>
<tr><th scope="row">1st</th><td lang="sa">लभे labhe</td><td lang="sa">लभावहे labhāvahe</td><td lang="sa">लभामहे labhāmahe</td></tr></table>
<p>Some verbs are ātmanepada-only (deponent-like): लभते obtains, मन्यते thinks, जायते is born, वर्धते grows, ईक्षते beholds. A few use both voices with the old 'for-oneself' nuance still visible — यजति 'officiates a sacrifice (for another)' vs यजते 'has a sacrifice performed for his own benefit' is the textbook pair. But be warned: in classical Sanskrit the choice of pada is mostly a <b>lexical fact about each verb</b>, learned with the word like gender with a noun — do not try to infer a self-benefit meaning from every -te you meet, and do not be surprised when the epics swap padas for the metre's sake. And सेवते, भाषते speak the everyday ātmanepada of conversation.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">बालो विद्यां लभते, ततश्च वर्धते।</div><p>bālo (sandhi!) vidyāṃ labhate — "the boy gains learning" (ātmanepada: gain accrues to the gainer) — tataś ca vardhate, "and thereupon grows". The voice-system and your fresh sandhi rules, working one sentence together.</p></div>

  id: "m5", title: "Past & command", subtitle: "laṅ the imperfect, loṭ the imperative — and mā",
  grammar: `<p class="lead">Two lakāras (tense-moods) enter: <b>laṅ</b>, the storytelling past, marked — like Greek's imperfect, its exact cousin — by an a-prefix (the augment!) and secondary endings; and <b>loṭ</b>, the imperative of command, request and blessing. With them, narrative and dialogue both open.</p>
<h3>laṅ — the imperfect</h3>
<table class="gr"><tr><th></th><th>singular</th><th>dual</th><th>plural</th></tr>
<tr><th scope="row">3rd</th><td lang="sa">अगच्छत् agacchat</td><td lang="sa">अगच्छताम्</td><td lang="sa">अगच्छन् agacchan</td></tr>
<tr><th scope="row">2nd</th><td lang="sa">अगच्छः agacchaḥ</td><td lang="sa">अगच्छतम्</td><td lang="sa">अगच्छत agacchata</td></tr>
<tr><th scope="row">1st</th><td lang="sa">अगच्छम् agaccham</td><td lang="sa">अगच्छाव</td><td lang="sa">अगच्छाम agacchāma</td></tr></table>
<p>Ātmanepada: अलभत alabhata (he obtained), अलभन्त (they obtained). The अ- augment + shortened endings: precisely Greek ἔ-φερε beside Sanskrit अभरत् abharat — the same machine, twice inherited. In classical prose the laṅ serves as a general past: अगच्छत् = went / was going; aspectual finesse belongs to context and to other constructions you will meet.</p>
<h3>loṭ — the imperative</h3>
<table class="gr"><tr><th></th><th>2nd ('do!')</th><th>3rd ('let him do')</th><th>1st ('let me')</th></tr>
<tr><th scope="row">singular</th><td lang="sa">गच्छ gaccha</td><td lang="sa">गच्छतु gacchatu</td><td lang="sa">गच्छानि gacchāni</td></tr>
<tr><th scope="row">plural</th><td lang="sa">गच्छत gacchata</td><td lang="sa">गच्छन्तु gacchantu</td><td lang="sa">गच्छाम gacchāma</td></tr></table>
<p>Ātmanepada 2sg: लभस्व labhasva ('obtain!'). The 3rd person imperative blesses and legislates: <b lang="sa">शिवम् अस्तु</b> "let there be welfare"; <b lang="sa">सत्यं वदतु</b> "let him speak truth". And the benediction plural अस्तु… सन्तु: <b lang="sa">सर्वे भवन्तु सुखिनः</b> — "may all be happy" — is a loṭ form the whole world has heard.</p>
<h3>Prohibition — mā</h3>
<p>Commands negate with <b lang="sa">मा mā</b>, not na — usually with the bare augmentless aorist (recognition now, system later): <b lang="sa">मा गमः</b> "don't go!"; <b lang="sa">मा शुचः</b> "do not grieve" — the Gītā's final consolation (18.66) uses exactly this form.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">गुरुरवदत् — पुत्र, सत्यं वद, धर्मं चर, विद्यां च लभस्व इति।</div><p>gurur avadat (visarga→r before a vowel + laṅ): "the guru said:" — then three imperatives quoted with iti: vada (speak!), cara (walk!), labhasva (ātmanepada: gain!). <i>"Son: speak the truth, practise dharma, and get yourself learning."</i> The Taittirīya Upaniṣad's graduation speech runs on precisely these forms.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>अगच्छन् is 3rd plural imperfect; गच्छन्तु is 3rd plural imperative: augment past vs -tu command.</li><li>मा with an augmented form is wrong: मा अगमः ✗; मा गमः ✓ — the augment marks assertion, which prohibition suspends. (Greek does the identical thing: μὴ + augmentless aorist subjunctive.)</li><li>2sg imperative = bare stem: गच्छ, वद, पश्य — the shortest words in the paradigm carry the most force.</li></ul></div>`,

  id: "m6", title: "Future & wish", subtitle: "lṛṭ 'will' and vidhiliṅ 'should' — the verb's forward gears",
  grammar: `<p class="lead">Two final lakāras complete the everyday verb: <b>lṛṭ</b>, the future in -iṣya/-sya, and <b>vidhiliṅ</b>, the optative of should, would, may and if — the mood in which Sanskrit's law-books, fables and philosophy conduct almost all their business.</p>
<h3>lṛṭ — the future</h3>
<table class="gr"><tr><th>Root</th><th>Future</th><th></th></tr>
<tr><td lang="sa">√गम्</td><td lang="sa">गमिष्यति gamiṣyati</td><td>will go</td></tr>
<tr><td lang="sa">√वद्</td><td lang="sa">वदिष्यति vadiṣyati</td><td>will say</td></tr>
<tr><td lang="sa">√कृ</td><td lang="sa">करिष्यति kariṣyati</td><td>will do</td></tr>
<tr><td lang="sa">√दा</td><td lang="sa">दास्यति dāsyati</td><td>will give</td></tr>
<tr><td lang="sa">√लभ्</td><td lang="sa">लप्स्यते lapsyate</td><td>will obtain (ātm.)</td></tr>
<tr><td lang="sa">√भू</td><td lang="sa">भविष्यति bhaviṣyati</td><td>will be</td></tr></table>
<p>Sya/iṣya + the present endings you already own: gamiṣyāmi, gamiṣyasi, gamiṣyati… The σ-future of Greek (λύσω) is this same formation — daughter languages agreeing across four thousand kilometres. भविष्यति even became a noun: bhaviṣyat, 'the future'.</p>
<h3>vidhiliṅ — the optative</h3>
<table class="gr"><tr><th></th><th>singular</th><th>plural</th></tr>
<tr><th scope="row">3rd</th><td lang="sa">गच्छेत् gacchet</td><td lang="sa">गच्छेयुः gaccheyuḥ</td></tr>
<tr><th scope="row">2nd</th><td lang="sa">गच्छेः gaccheḥ</td><td lang="sa">गच्छेत gaccheta</td></tr>
<tr><th scope="row">1st</th><td lang="sa">गच्छेयम् gaccheyam</td><td lang="sa">गच्छेम gacchema</td></tr></table>
<p>The -e- (from -ī/-yā-) is the badge; ātmanepada: लभेत labheta. Its uses map onto Greek's optative and subjunctive combined:</p>
<table class="gr"><tr><th>Use</th><th>Example</th></tr>
<tr><td>should / ought (vidhi: injunction)</td><td lang="sa">सत्यं वदेत् — one should speak truth</td></tr>
<tr><td>polite request</td><td lang="sa">भवान् आगच्छेत् — would you come, sir</td></tr>
<tr><td>possibility</td><td lang="sa">एवं भवेत् — it might be so</td></tr>
<tr><td>condition (with यदि)</td><td lang="sa">यदि गच्छेत्, तर्हि पश्येत् — if he should go, he would see</td></tr></table>
<p>Śāstra style runs on the injunctive optative: the Dharmaśāstras' "a king should protect", the fables' "one should never trust a flatterer" — all gacchet-forms. Hitopadeśa morals will supply your daily dose.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">यदि सत्यं वदेः, सर्वे तव वचने विश्वसिष्यन्ति।</div><p> "If you should (always) speak truth, all will trust your word." Optative in the if-clause, future in the consequence: the mixed conditional that Sanskrit prose actually favours.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>गच्छेत् (optative) vs अगच्छत् (imperfect): the -e- vs the augment. One letter-family apart, a world of meaning apart.</li><li>√कृ and √दा change shape before -sya: kariṣyati, dāsyati — learn futures as vocabulary alongside roots (the Dhātu lab drills exactly this).</li><li>यदि + optative is 'should…would'; यदि + present states an open condition: यदि वर्षति, न गच्छामः — 'if it rains, we don't go'.</li></ul></div>`,

  grammar: `<p class="lead">Here is the single most important fact of classical Sanskrit style: the everyday past is usually not a verb at all, but the past participle in <b>-ta</b> (the kta-suffix), used as a one-word sentence. Where English says "Rāma said", the classical page says <b lang="sa">रामेण उक्तम्</b> — "by-Rāma said". Master this and you can read; miss it and every text is a wall.</p>
<h3>Forming the kta-participle</h3>
<table class="gr"><tr><th>Root</th><th>kta</th><th></th></tr>
<tr><td lang="sa">√गम्</td><td lang="sa">गत gata</td><td>gone</td></tr>
<tr><td lang="sa">√कृ</td><td lang="sa">कृत kṛta</td><td>done, made</td></tr>
<tr><td lang="sa">√वच्</td><td lang="sa">उक्त ukta</td><td>said</td></tr>
<tr><td lang="sa">√दृश्</td><td lang="sa">दृष्ट dṛṣṭa</td><td>seen</td></tr>
<tr><td lang="sa">√श्रु</td><td lang="sa">श्रुत śruta</td><td>heard</td></tr>

<tr><td lang="sa">√लभ्</td><td lang="sa">लब्ध labdha</td><td>obtained</td></tr>
<tr><td lang="sa">√त्यज्</td><td lang="sa">त्यक्त tyakta</td><td>abandoned</td></tr></table>
<p>It declines like any a-stem adjective (gataḥ, gatā, gatam) and agrees with its noun. The forms are irregular enough that the Dhātu lab drills them as vocabulary — ukta and dṛṣṭa must simply be known.</p>
<h3>The construction</h3>
<p>With a TRANSITIVE root, the participle is passive: the <b>object</b> takes the nominative and agrees; the <b>agent</b> takes the tṛtīyā:</p>
<p class="ruleline" lang="sa">रामेण ग्रामो दृष्टः। — The village was seen by Rāma = Rāma saw the village.</p>
<p class="ruleline" lang="sa">तेन कथा उक्ता। — By him the story (f.) was told = he told the story.</p>
<p>With an INTRANSITIVE root (go, stand, be born), the participle is active and agrees with the subject: <b lang="sa">रामो वनं गतः</b> — "Rāma (is) gone to the forest" = Rāma went. No auxiliary verb needed in either pattern: the participle IS the sentence.</p>
<h3>Why Sanskrit prefers it</h3>
<p>Economy and chain-ability: participles decline, so they clip into compounds and absolutives; and the agent-in-instrumental pattern generalises perfectly to every tense of the passive (next units). Historically, this construction — not the laṅ — became the past tense of the daughter languages: Hindi's ne-construction (rām ne kahā) is रामेण उक्तम् wearing modern clothes.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">मुनिना बालाय फलं दत्तम्, बालेन च तत् खादितम्।</div><p>muninā (agent) … phalaṃ dattam (neuter object, neuter participle): "by the sage a fruit was given to the boy" — then bālena ca tat khāditam: "and by the boy it was eaten." Two complete past sentences, zero finite verbs. This is the default melody of classical narrative.</p></div>

  id: "y2", title: "Gerund & infinitive", subtitle: "-tvā chains and -tum purposes: the connective tissue of narrative",
  grammar: `<p class="lead">Sanskrit narrative moves by chains: "having-risen, having-bathed, having-eaten, he went." The chain-link is the <b>gerund</b> (absolutive) in -tvā — invariable, tireless, everywhere. Its partner the <b>infinitive</b> in -tum expresses purpose and complements verbs of wishing and ability. Between them they replace most of the subordinate clauses European languages lean on.</p>
<h3>The gerund — क्त्वा ktvā</h3>
<table class="gr"><tr><th>Root</th><th>Gerund</th><th></th></tr>
<tr><td lang="sa">√गम्</td><td lang="sa">गत्वा gatvā</td><td>having gone</td></tr>
<tr><td lang="sa">√कृ</td><td lang="sa">कृत्वा kṛtvā</td><td>having done</td></tr>
<tr><td lang="sa">√श्रु</td><td lang="sa">श्रुत्वा śrutvā</td><td>having heard</td></tr>
<tr><td lang="sa">√दृश्</td><td lang="sa">दृष्ट्वा dṛṣṭvā</td><td>having seen</td></tr>
<tr><td lang="sa">√त्यज्</td><td lang="sa">त्यक्त्वा tyaktvā</td><td>having abandoned</td></tr>
<tr><td lang="sa">√वच्</td><td lang="sa">उक्त्वा uktvā</td><td>having said</td></tr></table>
<p>With a preverb, -tvā becomes <b>-ya</b>: आगम्य āgamya (having come), विहाय vihāya (having left behind), उपविश्य upaviśya (having sat down). The gerund's subject is the sentence's agent, and it never changes form: one shape, infinite service.</p>
<p class="ruleline" lang="sa">बालः फलं दृष्ट्वा गृहीत्वा खादित्वा अगच्छत्। — The boy, having seen, taken and eaten the fruit, left.</p>
<h3>The infinitive — तुम् tum</h3>
<table class="gr"><tr><th lang="sa">गन्तुम् gantum</th><th lang="sa">कर्तुम् kartum</th><th lang="sa">द्रष्टुम् draṣṭum</th><th lang="sa">श्रोतुम् śrotum</th><th lang="sa">वक्तुम् vaktum</th><th lang="sa">दातुम् dātum</th></tr>
<tr><td>to go</td><td>to do</td><td>to see</td><td>to hear</td><td>to say</td><td>to give</td></tr></table>
<p>Purpose with motion: <b lang="sa">फलानि क्रेतुं ग्रामं गच्छति</b> — "goes to the village to buy fruit". With wish and ability: <b lang="sa">इच्छति गन्तुम्</b> (wants to go), <b lang="sa">शक्नोति कर्तुम्</b> (can do). With time: <b lang="sa">कालोऽयं गन्तुम्</b> — "it is time to go".</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">गुरोर्वचनं श्रुत्वा, ग्रामं त्यक्त्वा, सत्यं ज्ञातुं मुनिर्वनं गतः।</div><p>Two gerunds set the stage (having heard the guru's word, having left the village), an infinitive gives the aim (to know the truth), and one kta-participle lands the past (the sage went to the forest). <i>Gerund, gerund, infinitive, participle</i> — this four-beat bar is the rhythm of the entire classical corpus.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>The gerund's doer = the main clause's agent. In kta-sentences that agent is instrumental: तेन फलं दृष्ट्वा गृहीतम् — 'he, having seen the fruit, took it'.</li><li>-tvā only without preverb; with preverb, -ya: gatvā but āgamya, uktvā but pratyucya.</li><li>The gerund is past-relative: 'having done', never 'while doing' (that is the present participle, Stage ४'s -at forms in passing).</li></ul></div>`,

  grammar: `<p class="lead">The present-tense passive completes the pattern the kta-participle began: patient in the nominative, agent in the instrumental, verb marked with <b>-ya-</b> and ātmanepada endings. Sanskrit uses it far more than English — even from intransitive verbs — and formal prose can float along in it for pages.</p>
<h3>Formation</h3>
<table class="gr"><tr><th>Active</th><th>Passive</th><th></th></tr>
<tr><td lang="sa">वदति</td><td lang="sa">उच्यते ucyate</td><td>is said (√vac's weak grade!)</td></tr>
<tr><td lang="sa">करोति</td><td lang="sa">क्रियते kriyate</td><td>is done</td></tr>
<tr><td lang="sa">पश्यति</td><td lang="sa">दृश्यते dṛśyate</td><td>is seen; seems</td></tr>
<tr><td lang="sa">शृणोति</td><td lang="sa">श्रूयते śrūyate</td><td>is heard</td></tr>
<tr><td lang="sa">जानाति</td><td lang="sa">ज्ञायते jñāyate</td><td>is known</td></tr>
<tr><td lang="sa">यच्छति</td><td lang="sa">दीयते dīyate</td><td>is given</td></tr>
<tr><td lang="sa">लभते</td><td lang="sa">लभ्यते labhyate</td><td>is obtained</td></tr></table>
<p>Root (often in weak grade: vac→uc, kṛ→kri) + ya + te. The endings run exactly like labhate's set: ucyate, ucyete, ucyante…</p>
<h3>The construction — and its famous uses</h3>
<p class="ruleline" lang="sa">रामेण कथा उच्यते। — The story is being told by Rāma.</p>
<p>Definition and citation lean on it: <b lang="sa">…इति उच्यते</b>, "…is (what is) said/called"; <b lang="sa">तत् सत्यम् इत्युच्यते</b> — "that is called truth". The Gītā defines with it constantly: <b lang="sa">समत्वं योग उच्यते</b> — "equanimity is called yoga" (2.48). श्रूयते opens legends ("it is heard that…" = tradition says); दृश्यते shades into "it appears".</p>
<h3>The impersonal passive — bhāve prayoga</h3>
<p>Even intransitives passivise, impersonally, third-singular neuter in sense: <b lang="sa">मया गम्यते</b> — "by me it-is-gone" = I go (stately); <b lang="sa">अत्र स्थीयताम्</b> — "let it be stood here" = please stay. Politeness and officialese love this turn; recognise it and smile.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">धर्मेण जगद्धार्यते इति ऋषिभिरुच्यते।</div><p>dharmeṇa jagad dhāryate — "by dharma the world is upheld" (passive of the causative √dhṛ) — iti ṛṣibhir ucyate, "thus it is said by the seers". Passive inside the quote, passive outside it, agents in the instrumental throughout: one voice, wielded twice.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Class-4 actives also show -ya- (नृत्यति dances): the passive's -ya- takes ātmanepada (-te) and often a weak root — नृत्यति vs उच्यते. Stem + voice together decide.</li><li>उच्यते is from √vac (u-grade), not from a root uc: several passives look nothing like their actives. The table above is vocabulary; learn it as such.</li><li>दृश्यते 'is seen' does double duty as 'seems': तत् साधु दृश्यते, 'that looks good'.</li></ul></div>`,

  grammar: `<p class="lead">Stage १ gave you tad and the personal pronouns. Classical prose deploys a fuller set — this, that-yonder, who?, all, other — and they share a special <b>pronominal declension</b> whose hallmark forms (-smai, -smāt, -smin; -eṣām) you must recognise on sight, because the commonest words in the language wear them.</p>
<h3>The pronominal endings (masc. sg. on tad)</h3>
<table class="gr"><tr><th>caturthī</th><th>pañcamī</th><th>saptamī</th><th>ṣaṣṭhī pl.</th></tr>
<tr><td lang="sa">तस्मै tasmai</td><td lang="sa">तस्मात् tasmāt</td><td lang="sa">तस्मिन् tasmin</td><td lang="sa">तेषाम् teṣām</td></tr></table>
<p>Where nouns say -āya, -āt, -e, -ānām, pronouns say -smai, -smāt, -smin, -eṣām. तस्मात् as a fossil means "therefore" — the Gītā's favourite pivot-word (tasmāt sarveṣu kāleṣu…, 8.7).</p>
<h3>The demonstrative trio</h3>
<table class="gr"><tr><th></th><th>masc.</th><th>fem.</th><th>neut.</th><th>Feel</th></tr>
<tr><td>idam-series</td><td lang="sa">अयम् ayam</td><td lang="sa">इयम् iyam</td><td lang="sa">इदम् idam</td><td>this (here, near me)</td></tr>
<tr><td>etad-series</td><td lang="sa">एषः eṣaḥ</td><td lang="sa">एषा eṣā</td><td lang="sa">एतत् etat</td><td>this (just mentioned)</td></tr>
<tr><td>tad-series</td><td lang="sa">सः saḥ</td><td lang="sa">सा sā</td><td lang="sa">तत् tat</td><td>that; he/she/it</td></tr></table>
<p>अयम् bends irregularly (asya, asmai, anena, asmin…) — high-frequency forms to absorb from reading. The distal असौ asau ('that yonder') exists; meet it in texts.</p>
<h3>kim and the ka-words</h3>
<p>किम् declines like tad (kaḥ, kā, kim; kasya, kasmai, kasmin…). From it grow the indefinites with -cit / -api: <b lang="sa">कश्चित्</b> someone, <b lang="sa">किञ्चित्</b> something, <b lang="sa">कदाचित्</b> ever/sometimes, <b lang="sa">न कश्चित्</b> no one. The Gītā's <b lang="sa">मा फलेषु कदाचन</b> uses the rarer -cana variant: "never in the fruits".</p>
<h3>sarva and friends</h3>
<p>सर्व (all), अन्य (other), एक (one), स्व (one's own) decline pronominally too: sarvasmai, anyasmin, sarveṣām. Hence the grammarians' name sarvanāman — "sarva-type words" — for the whole pronoun class.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">अयं लोकः, एषा विद्या, तत् फलम् — अस्मिन् लोके यः विद्यां लभते, तस्मै सर्वं दीयते।</div><p>The trio in a row (this world, this learning, that fruit), then pronominal cases in action: asmin loke "in this world", yaḥ … tasmai "who(ever) … to him" — the relative-correlative frame that the NEXT unit makes yours. The pronouns are the sentence's skeleton; everything else hangs on them.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>एषः behaves like सः: एष गच्छति (visarga dropped before consonants) — same sandhi habit.</li><li>अस्य/अस्मै (of-this/to-this) belong to ayam — don't hunt for a root as-.</li><li>कश्चित् is kaḥ + cit fused by sandhi (ś before c): 'someone'. Its negative needs na: न कश्चित्, 'no one at all'.</li></ul></div>`,

  id: "y5", title: "The relative-correlative frame", subtitle: "यः … सः: the yad-tad architecture of every complex Sanskrit sentence",
  grammar: `<p class="lead">Sanskrit does not embed relative clauses the English way ("the man <i>who came</i>"). It sets two clauses side by side, the first opened by a <b>ya-</b> word, the second answered by its <b>ta-</b> partner: "WHO came, HE is my friend." This relative-correlative frame is the load-bearing arch of all complex Sanskrit — learn to see both pillars and no sentence can maze you.</p>
<h3>The pairs</h3>
<table class="gr"><tr><th>Relative (ya-)</th><th>Correlative (ta-)</th><th></th></tr>
<tr><td lang="sa">यः yaḥ</td><td lang="sa">सः saḥ</td><td>who … he</td></tr>
<tr><td lang="sa">यत् yat</td><td lang="sa">तत् tat</td><td>what … that</td></tr>
<tr><td lang="sa">यत्र yatra</td><td lang="sa">तत्र tatra</td><td>where … there</td></tr>
<tr><td lang="sa">यदा yadā</td><td lang="sa">तदा tadā</td><td>when … then</td></tr>
<tr><td lang="sa">यथा yathā</td><td lang="sa">तथा tathā</td><td>as … so</td></tr>
<tr><td lang="sa">यावत् yāvat</td><td lang="sa">तावत् tāvat</td><td>as long as … so long</td></tr>
<tr><td lang="sa">यादृशः yādṛśaḥ</td><td lang="sa">तादृशः tādṛśaḥ</td><td>of which sort … of that sort</td></tr></table>
<p>यद् declines exactly like tad with y-: yaḥ, yā, yat; yasya, yasmai, yasmin, yeṣām…</p>
<h3>The frame in action</h3>
<p class="ruleline" lang="sa">यो धर्मं रक्षति, स धर्मेण रक्ष्यते। — Who guards dharma, he is guarded by dharma.</p>
<p>Compare Manu's lapidary casting of the same thought without the frame: <b lang="sa">धर्मो रक्षति रक्षितः</b> — "dharma, protected, protects."</p>
<p>Each pronoun takes the case its OWN clause requires — the yaḥ from its verb, the saḥ from its. Doubling generalises: <b lang="sa">यो यः</b> "whoever", <b lang="sa">यदा यदा</b> "whenever" — as in the Gītā's यदा यदा हि धर्मस्य ग्लानिर्भवति… तदात्मानं सृजाम्यहम् (4.7): "WHENEVER dharma decays… THEN I send myself forth."</p>
<h3>yathā … tathā and the comparison frame</h3>
<p class="ruleline" lang="sa">यथा राजा तथा प्रजा। — As the king, so the people.</p>
<p>The proverb-mould of the whole culture; the Gītā's great similes (2.22: यथा वासांसि… तथा शरीराणि, "as worn-out garments… so bodies") stand in it.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">यत्र धर्मस्तत्र जयः।</div><p>yatra dharmas tatra jayaḥ — "where dharma is, there is victory": the Mahābhārata's own moral (yato dharmas tato jayaḥ in its other casting). Two clauses, no verb in either, the frame alone carrying the logic. Read the ya-, hold your breath, land on the ta-: that is the Sanskrit sentence-arc in miniature.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>Never translate यः as a question — questions use k-words. y-words subordinate.</li><li>The ya-clause usually comes first, but inversion happens in verse: hold the frame, not the order.</li><li>यत् also means 'that/because' introducing content-clauses; context (and a governing verb) signals it.</li></ul></div>`,
  examples: [

<h3>tatpuruṣa — the case-compound</h3>
<p>The first member relates to the second by an implied case:</p>
<table class="gr"><tr><th>Compound</th><th>Analysis</th><th></th></tr>

<tr><td lang="sa">देवदत्तः devadattaḥ</td><td>devair dattaḥ (instr.)</td><td>god-given (a classic name)</td></tr>

<h3>dvandva — the and-compound</h3>
<p>Members coordinate; the compound takes plural (or dual) and, in one lovely variant, neuter singular for a closed pair-set:</p>
<p class="ruleline" lang="sa">रामलक्ष्मणौ rāmalakṣmaṇau — Rāma-and-Lakṣmaṇa (dual!) · सुखदुःखे sukhaduḥkhe — pleasure-and-pain (the Gītā's constant pair) · मातापितरौ mātāpitarau — mother-and-father</p>
<h3>karmadhāraya — the adjective-compound</h3>
<p>First member describes the second:</p>
<p class="ruleline" lang="sa">महाराजः mahārājaḥ — great king (mahat → mahā- in compounds) · सज्जनः sajjanaḥ — good person (sat+jana) · नीलोत्पलम् nīlotpalam — blue lotus</p>
<h3>How to read ANY compound</h3>

  id: "r1", title: "Samāsa II — bahuvrīhi & the indeclinables", subtitle: "The 'much-rice' compound: possession by description",
  grammar: `<p class="lead">The fourth compound family is Sanskrit's cleverest: the <b>bahuvrīhi</b>, which describes its owner rather than itself. bahu-vrīhi is literally "much-rice" — but it names not rice, rather a man <i>whose rice is much</i>: a rich man. Every bahuvrīhi is an adjective meaning "whose X is Y"; the epics and the Gītā run on them.</p>
<h3>How to spot one</h3>
<p>A compound that OUGHT to name a thing but is agreeing, as an adjective, with something else — that is a bahuvrīhi:</p>
<table class="gr"><tr><th>Compound</th><th>As tatpuruṣa/karmadhāraya would say</th><th>As bahuvrīhi means</th></tr>
<tr><td lang="sa">महाबाहुः mahābāhuḥ</td><td>a great arm</td><td>(a hero) WHOSE arms are mighty</td></tr>
<tr><td lang="sa">दीर्घकेशा dīrghakeśā</td><td>long hair</td><td>(a woman) whose hair is long</td></tr>
<tr><td lang="sa">चक्रपाणिः cakrapāṇiḥ</td><td>wheel-hand</td><td>(Viṣṇu) in whose hand is the discus</td></tr>
<tr><td lang="sa">प्रसन्नात्मा prasannātmā</td><td>a calm self</td><td>(one) whose self is serene</td></tr></table>
<p>The god-names are a bahuvrīhi museum: Nīlakaṇṭha "whose throat is blue" (Śiva), Gajānana "elephant-faced" (Gaṇeśa), Daśaratha "of-ten-chariots", Pītāmbara "yellow-clad". So are the Gītā's addresses: <b lang="sa">महाबाहो</b> "O mighty-armed one!"</p>
<h3>The avyayībhāva — the adverb-compound</h3>
<p>Small and tidy: an indeclinable + noun frozen into a neuter adverb: <b lang="sa">यथाशक्ति</b> yathāśakti "according to ability", <b lang="sa">प्रतिदिनम्</b> pratidinam "daily", <b lang="sa">निर्जनम्</b> nirjanam "in solitude", <b lang="sa">यावज्जीवम्</b> yāvajjīvam "lifelong".</p>
<h3>The indeclinables themselves — avyaya</h3>
<table class="gr"><tr><th lang="sa">अपि</th><th lang="sa">एव</th><th lang="sa">इव</th><th lang="sa">तु</th><th lang="sa">हि</th><th lang="sa">खलु</th><th lang="sa">किल</th><th lang="sa">नाम</th></tr>
<tr><td>also, even</td><td>just, only</td><td>like, as</td><td>but</td><td>for, indeed</td><td>indeed (mild)</td><td>they say</td><td>namely; indeed</td></tr></table>
<p>These little words are Sanskrit's particles — the Greek γε/δή/τοι family reborn. एव pins ("just this, precisely"); हि explains like γάρ; तु turns like δέ; खलु softens assertions; किल marks hearsay. Watching them is watching the author think.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">प्रसन्नात्मा मुनिर्यथाशक्ति सर्वेभ्य एव धर्मं वदति हि।</div><p>prasannātmā (bahuvrīhi: serene-selfed) munir … yathāśakti (avyayībhāva: as-per-ability) sarvebhya eva (to absolutely all) … hi (for, you see): "For the sage of serene spirit teaches dharma to all, as his strength allows." Two compound-families and two particles, one limpid sentence.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>A bahuvrīhi's gender follows its OWNER, not its members: dīrghakeśā (fem.) of a woman, though keśa is masculine.</li><li>Many compounds are ambiguous between readings; mahāratha = 'great chariot' or 'having a great chariot' (= a champion). Context — and the epic's formulae — decide.</li><li>एव follows the word it pins: राम एव — 'Rāma precisely'.</li></ul></div>`,

  id: "r2", title: "i-, u- and ṛ-stems", subtitle: "agni, guru, pitṛ: the second great declension family",
  grammar: `<p class="lead">After the a/ā-stems, three related families cover most remaining nouns: i-stems (agni fire, mati thought), u-stems (guru, madhu honey) and the ṛ-stems of kinship and agency (pitṛ father, mātṛ mother, kartṛ doer). They share one architecture — guṇa-strengthening in key cases — so learn agni well and the rest rhyme.</p>
<h3>अग्निः agniḥ (m.) and गुरुः guruḥ (m.)</h3>
<table class="gr"><tr><th></th><th>agni sg.</th><th>guru sg.</th><th>agni pl.</th><th>guru pl.</th></tr>
<tr><th scope="row">prathamā</th><td lang="sa">अग्निः</td><td lang="sa">गुरुः</td><td lang="sa">अग्नयः</td><td lang="sa">गुरवः</td></tr>
<tr><th scope="row">dvitīyā</th><td lang="sa">अग्निम्</td><td lang="sa">गुरुम्</td><td lang="sa">अग्नीन्</td><td lang="sa">गुरून्</td></tr>
<tr><th scope="row">tṛtīyā</th><td lang="sa">अग्निना</td><td lang="sa">गुरुणा</td><td lang="sa">अग्निभिः</td><td lang="sa">गुरुभिः</td></tr>
<tr><th scope="row">caturthī</th><td lang="sa">अग्नये</td><td lang="sa">गुरवे</td><td lang="sa">अग्निभ्यः</td><td lang="sa">गुरुभ्यः</td></tr>
<tr><th scope="row">ṣaṣṭhī</th><td lang="sa">अग्नेः</td><td lang="sa">गुरोः</td><td lang="sa">अग्नीनाम्</td><td lang="sa">गुरूणाम्</td></tr>
<tr><th scope="row">saptamī</th><td lang="sa">अग्नौ</td><td lang="sa">गुरौ</td><td lang="sa">अग्निषु</td><td lang="sa">गुरुषु</td></tr></table>
<p>Feminines मतिः mati (thought) and धेनुः dhenu (cow) decline almost identically. Neuters वारि (water) and मधु (honey) take -ī̆ni/-ūni plurals: मधूनि. The guṇa-grades e/o surface in the dative/genitive (agnaye, agneḥ; gurave, guroḥ) — the same strengthening you saw building present-stems.</p>
<h3>The ṛ-stems — kinship and agents</h3>
<table class="gr"><tr><th></th><th lang="sa">पितृ father</th><th lang="sa">मातृ mother</th><th lang="sa">कर्तृ doer</th></tr>
<tr><th scope="row">prathamā sg.</th><td lang="sa">पिता pitā</td><td lang="sa">माता mātā</td><td lang="sa">कर्ता kartā</td></tr>
<tr><th scope="row">dvitīyā sg.</th><td lang="sa">पितरम् pitaram</td><td lang="sa">मातरम्</td><td lang="sa">कर्तारम् kartāram</td></tr>
<tr><th scope="row">tṛtīyā sg.</th><td lang="sa">पित्रा pitrā</td><td lang="sa">मात्रा</td><td lang="sa">कर्त्रा</td></tr>
<tr><th scope="row">ṣaṣṭhī sg.</th><td lang="sa">पितुः pituḥ</td><td lang="sa">मातुः</td><td lang="sa">कर्तुः</td></tr>
<tr><th scope="row">prathamā pl.</th><td lang="sa">पितरः pitaraḥ</td><td lang="sa">मातरः</td><td lang="sa">कर्तारः kartāraḥ</td></tr></table>
<p>pitā, mātā, bhrātā (brother), duhitā (daughter) — set them beside pater, māter, frāter, daughter and the Indo-European family reunion is complete. The agent-nouns in -tṛ (kartṛ doer, dātṛ giver, netṛ leader) built with -tāram grades became the model for the 'periphrastic future' kartā 'he shall do' — grammar recycling its own parts.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">गुरोर्वचनं श्रुत्वा शिष्योऽग्नौ हविर्जुहोति।</div><p>guror vacanaṃ śrutvā — "having heard the guru's word" (u-stem genitive + sandhi) — śiṣyo 'gnau havir juhoti — "the pupil offers the oblation in the fire" (i-stem locative agnau). Vedic ritual's whole vocabulary lives in these declensions; so does the Gītā's guru-language.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>गुरो! (vocative) vs गुरोः (genitive): one visarga apart. he guro! — 'O teacher!'</li><li>पिता lost its r in the nominative but keeps it everywhere else (pitaram, pitari…): cite kinship nouns from the accusative to see their true stem.</li><li>अग्नौ, गुरौ — the -au locative singular looks like a dual; it is not. Case-feel and context disambiguate instantly.</li></ul></div>`,

{
  id: "r3", title: "Consonant stems & the -at participles", subtitle: "rājan, nāman, manas, bhagavat: the last declensional frontier",
  grammar: `<p class="lead">The remaining nouns end in consonants — n-stems (rājan king, nāman name, ātman self), s-stems (manas mind, tapas austerity), and the great -at/-vat/-mat adjectives (bhagavat blessed, dhīmat wise) whose type also supplies the present participle. Recognition is the goal: these forms saturate philosophical and epic texts.</p>
<h3>राजन् rājan (m.) and नामन् nāman (n.)</h3>
<table class="gr"><tr><th></th><th>rājan sg.</th><th>nāman sg.</th></tr>
<tr><th scope="row">prathamā</th><td lang="sa">राजा rājā</td><td lang="sa">नाम nāma</td></tr>
<tr><th scope="row">dvitīyā</th><td lang="sa">राजानम् rājānam</td><td lang="sa">नाम</td></tr>
<tr><th scope="row">tṛtīyā</th><td lang="sa">राज्ञा rājñā</td><td lang="sa">नाम्ना nāmnā</td></tr>
<tr><th scope="row">ṣaṣṭhī</th><td lang="sa">राज्ञः rājñaḥ</td><td lang="sa">नाम्नः</td></tr>
<tr><th scope="row">saptamī</th><td lang="sa">राज्ञि / राजनि</td><td lang="sa">नाम्नि</td></tr></table>
<p>आत्मन् ātman (self) declines like rājan: ātmā, ātmānam, ātmanā, ātmanaḥ, ātmani — memorise this row entire; the Gītā's sixth chapter is built from it (uddhared ātmanātmānam…).</p>
<h3>मनस् manas and the -as neuters</h3>
<p>manaḥ (nom.), manasā (instr.), manasaḥ (gen.), manasi (loc.); so tapas, tejas, vacas, namas. In compounds they show -o-: मनोरथः manorathaḥ 'mind-chariot' = a wish; नमस्ते namas+te. The visarga/o alternation is your Stage-२ sandhi, frozen into morphology.</p>
<h3>भगवत् bhagavat and the -at family</h3>
<table class="gr"><tr><th>prathamā sg.</th><th>dvitīyā sg.</th><th>tṛtīyā sg.</th><th>voc. sg.</th></tr>
<tr><td lang="sa">भगवान् bhagavān</td><td lang="sa">भगवन्तम् bhagavantam</td><td lang="sa">भगवता bhagavatā</td><td lang="sa">भगवन् bhagavan!</td></tr></table>
<p>So dhīmān (wise), balavān (strong), hanumān (large-jawed — yes, a bahuvrīhi-flavoured -mat name). The PRESENT PARTICIPLE declines the same way: गच्छन् gacchan 'going', गच्छन्तम्, गच्छता — and its locative builds the <b>sati saptamī</b>, Sanskrit's locative absolute: <b lang="sa">उदिते सूर्ये</b> udite sūrye, "the sun having risen" — the same absolute construction you know from Latin (ablative) and Greek (genitive), here in the seventh case.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">श्रीभगवानुवाच — the Gītā's speaker-tag</div><p>śrī-bhagavān uvāca: "the Blessed Lord said". bhagavān — the -vat nominative; uvāca — the perfect of √vac, next unit's star. You have read this line before every Kṛṣṇa-speech ever printed; now it parses.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>राजा looks like a feminine ā-stem; it is the n-stem masculine nominative. The oblique राज्ञ- forms reveal the truth.</li><li>नाम is both 'name' (noun) and 'namely/indeed' (particle): rāmo nāma muniḥ — 'a sage, Rāma by name'.</li><li>In compounds rājan drops its n: राजपुत्रः, महाराजः — you have been using n-stems all along.</li></ul></div>`,

  id: "r7", title: "The athematic gaṇas", subtitle: "asti, dadāti, karoti, jānāti: classes 2, 3, 5, 7, 8, 9 — the promise of Stage २ kept",
  grammar: `<p class="lead">Stage २ taught you the four thematic gaṇas and promised the rest. Here they are: the six <b>athematic</b> classes, which attach endings directly to the stem with no -a- buffer. They contain few roots but mighty ones — <i>be, go, kill, give, put, offer, press, hear, obtain, join, do, stretch, know, buy</i> — and they all obey one master rule you already own from the -मि story: <b>strong stem in the three active singulars, weak stem everywhere else</b>.</p>
<h3>The one rule, six costumes</h3>
<table class="gr"><tr><th>Gaṇa</th><th>Recipe (strong / weak)</th><th>Flagships</th></tr>
<tr><td>2 (adādi)</td><td>bare root, guṇa / zero</td><td lang="sa">√अस् → अस्ति/सन्ति · √इ → एति/यन्ति · √हन् → हन्ति/घ्नन्ति</td></tr>
<tr><td>3 (juhotyādi)</td><td>reduplicated root</td><td lang="sa">√दा → ददाति/ददति · √धा → दधाति · √हु → जुहोति/जुह्वति</td></tr>
<tr><td>5 (svādi)</td><td>root + नो / नु</td><td lang="sa">√सु → सुनोति · √श्रु → शृणोति · √आप् → आप्नोति</td></tr>
<tr><td>7 (rudhādi)</td><td>nasal INSIDE the root: -न-/-न्-</td><td lang="sa">√युज् → युनक्ति/युञ्जन्ति · √रुध् → रुणद्धि</td></tr>
<tr><td>8 (tanādi)</td><td>root + ओ / उ</td><td lang="sa">√कृ → करोति/कुर्वन्ति · √तन् → तनोति</td></tr>
<tr><td>9 (kryādi)</td><td>root + ना / नी</td><td lang="sa">√ज्ञा → जानाति/जानन्ति · √क्री → क्रीणाति</td></tr></table>
<h3>Three paradigms to anchor the system</h3>
<table class="gr"><tr><th></th><th lang="sa">√अस् be (2)</th><th lang="sa">√दा give (3)</th><th lang="sa">√कृ do (8)</th></tr>
<tr><th scope="row">3 sg.</th><td lang="sa">अस्ति asti</td><td lang="sa">ददाति dadāti</td><td lang="sa">करोति karoti</td></tr>
<tr><th scope="row">3 du.</th><td lang="sa">स्तः staḥ</td><td lang="sa">दत्तः dattaḥ</td><td lang="sa">कुरुतः kurutaḥ</td></tr>
<tr><th scope="row">3 pl.</th><td lang="sa">सन्ति santi</td><td lang="sa">ददति dadati</td><td lang="sa">कुर्वन्ति kurvanti</td></tr>
<tr><th scope="row">1 sg.</th><td lang="sa">अस्मि asmi</td><td lang="sa">ददामि dadāmi</td><td lang="sa">करोमि karomi</td></tr>
<tr><th scope="row">1 pl.</th><td lang="sa">स्मः smaḥ</td><td lang="sa">दद्मः dadmaḥ</td><td lang="sa">कुर्मः kurmaḥ</td></tr></table>
<p>Watch अस्ति/सन्ति: the strong stem as- keeps its vowel, the weak s- loses it — asti but santi, asmi but smaḥ. That single alternation, repeated with each class's costume, IS athematic conjugation. Greek students will feel at home: Sanskrit अस्ति / Greek ἐστί show the corresponding singular, while Sanskrit सन्ति and Greek εἰσί continue the inherited plural *s-enti pattern; ददाति and δίδωσι likewise preserve cognate reduplicated athematic presents.</p>
<h3>Class 7's party trick</h3>
<p>The nasal goes <i>inside</i> the root, and it is the nasal that alternates: strong -na-, weak -n-: <b lang="sa">युनक्ति</b> yunakti "joins" (yu-na-k-ti) but <b lang="sa">युञ्जन्ति</b> yuñjanti "they join" (yu-ñ-j-anti). English <i>yoke</i>, Latin <i>iungō</i> (same infixed nasal!), and the noun <b lang="sa">योगः</b> yoga are all this root's family.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">ये धर्मं जानन्ति ते सुखम् आप्नुवन्ति।</div><p>ye dharmaṃ jānanti (weak jān- before -anti: class 9) te sukham āpnuvanti (class 5's -nu- expanding to -nuv- before a vowel): "those who know dharma obtain happiness". Two athematic classes, one correlative sentence — and every ending already yours.</p></div>
<div class="tip"><b>Reading strategy.</b> As with the Greek -μι verbs, recognition beats generation. See a stem in -no-/-nu- → class 5; reduplication with -ā- → give or put; -nā-/-nī- → class 9; a nasal wedged in a familiar root → class 7. The endings then read themselves. The Gītā will hand you jānāti, karoti, śṛṇoti and dadāti on nearly every page.</div>
<div class="pitfall"><b>Pitfalls</b><ul><li>ददति (3 pl.) is NOT a typo for ददाति (3 sg.): the plural is weak — dad-ati vs dadā-ti. Class 3 is the one class whose 3rd plural active drops the n as well.</li><li>करोति's weak stem is कुरु/कुर्: kurutaḥ, kurvanti, kurmaḥ — the u-form also hiding in कुरु 'do!' and in the compounds of everyday speech (नमस्कुरु).</li><li>√श्रु <i>śru</i> has the class-5 present stem <i>śṛṇo-/śṛṇu-</i>: शृणोति <i>śṛṇoti</i>, शृणु <i>śṛṇu</i> “listen!”. Learn that present-stem shape as a unit rather than trying to derive the ṛ afresh each time.</li></ul></div>`,

{
  id: "r4", title: "uvāca — the perfect & the other pasts", subtitle: "liṭ in narrative, luṅ in the corner, and the -tavat escape hatch",
  grammar: `<p class="lead">Classical Sanskrit keeps three past tenses beside the kta-construction. One of them you must know intimately — the reduplicated <b>perfect (liṭ)</b>, because epic narration runs on उवाच "said". The others need recognition: the aorist (luṅ), mostly met after mā; and the active past participle in -tavat, prose's convenient alternative.</p>
<h3>The perfect — liṭ</h3>
<p>Reduplication + special endings, exactly as in Greek:</p>
<table class="gr"><tr><th>Root</th><th>Perfect 3sg</th><th></th></tr>
<tr><td lang="sa">√वच्</td><td lang="sa">उवाच uvāca</td><td>said</td></tr>
<tr><td lang="sa">√कृ</td><td lang="sa">चकार cakāra</td><td>did</td></tr>
<tr><td lang="sa">√गम्</td><td lang="sa">जगाम jagāma</td><td>went</td></tr>
<tr><td lang="sa">√भू</td><td lang="sa">बभूव babhūva</td><td>became</td></tr>
<tr><td lang="sa">√दृश्</td><td lang="sa">ददर्श dadarśa</td><td>saw</td></tr>
<tr><td lang="sa">√श्रु</td><td lang="sa">शुश्राव śuśrāva</td><td>heard</td></tr>
<tr><td lang="sa">√अस्</td><td lang="sa">आस āsa</td><td>was</td></tr></table>
<p>3rd plural: ऊचुः ūcuḥ (they said), चक्रुः cakruḥ, जग्मुः jagmuḥ, बभूवुः. Pāṇini's grammatical rule associates the liṭ with what is beyond direct perception (parokṣe liṭ), and some Classical usage reflects that distinction. But actual literary usage is not mechanical; above all in the epics, the perfect functions freely as a <b>narrative past</b>, alternating with the imperfect and aorist as metre and idiom dictate: Sañjaya reports with उवाच events he watches unfold. Read the liṭ as 'storytelling past' and let the grammarians' distinction be a flavour, not a law. Hence the epics' speaker-tags: <b lang="sa">अर्जुन उवाच… श्रीभगवानुवाच…</b> The Gītā's dialogue frame is a perfect-tense picture gallery.</p>
<h3>The aorist — luṅ, at recognition level</h3>
<p>A sigmatic past (अकार्षीत् akārṣīt 'he did', अभूत् abhūt 'he became', अवोचत् avocat 'he said') that classical prose uses sparingly — EXCEPT augmentless after mā, where you already know it: मा भूत् 'let it not be!', मा शुचः. File the shapes; texts will do the rest.</p>
<h3>The -tavat active participle</h3>
<p>Prose wanting an ACTIVE past without the instrumental turn simply adds -vat to the kta: <b lang="sa">रामः उक्तवान्</b> rāmaḥ uktavān — "Rāma said" (nominative agent!). Feminine uktavatī. It declines like bhagavat. Choose your past: rāmeṇa uktam (agent-instrumental) or rāmaḥ uktavān (agent-nominative) — classical authors use both freely.</p>
<div class="worked"><b>Worked example</b><div class="wl" lang="sa">कश्चिद्राजा बभूव। स वनं जगाम। तत्र मुनिं ददर्श। मुनिरुवाच — किमिच्छसि राजन् इति।</div><p>"There was a king (babhūva). He went to the forest (jagāma). There he saw a sage (dadarśa). The sage said (uvāca): 'What do you desire, O king?'" — four perfects, one vocative, and you have the skeleton of every framed tale in Sanskrit literature.</p></div>
<div class="pitfall"><b>Pitfalls</b><ul><li>उवाच is 3rd singular; ऊचुः its plural — reduplication syllable u-, root-grade shifts: learn the pairs as vocabulary.</li><li>बभूव often means simply 'was/there was' in narrative openings: कश्चिद्राजा बभूव — 'once there was a king'.</li><li>-tavat gives an ACTIVE construction: रामः उक्तवान् (Rāma nominative). Do not mix it with the instrumental agent.</li></ul></div>`,

    camTarget=null;
  }
});
window.addEventListener("mouseup",()=>{ dragging=false; cv.classList.remove("drag"); });
cv.addEventListener("mouseleave",()=>{ hoverCell=null; previewPath=selected?previewPath:null; tipHide(); });

cv.addEventListener("mousemove",e=>{
  if(!W||S.over) return;
  const rct=cv.getBoundingClientRect();
  const wpt=screenToWorld(e.clientX-rct.left, e.clientY-rct.top);
  const h=pxToHex(wpt.x,wpt.y);
  const c=cellAt(h.q,h.r);
  hoverCell=c||null;
  updateHoverPreview(e.clientX-rct.left, e.clientY-rct.top);
});

cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.89;
  cam.zoom=Math.min(2.6,Math.max(.45,cam.zoom*f));
},{passive:false});

cv.addEventListener("click",e=>{
  // A handled touch already performs selection/travel in touchend. Ignore the
  // compatibility mouse click Safari may emit afterwards, otherwise one physical
  // tap can become "select" + "fly".
  if(performance.now()<suppressCanvasClickUntil) return;
  if(dragMoved||!W||S.over&&!S.freePlay) return;
  resize();
  const rct=cv.getBoundingClientRect();
  const wpt=screenToWorld(e.clientX-rct.left, e.clientY-rct.top);
  const h=pxToHex(wpt.x,wpt.y);
  const c=cellAt(h.q,h.r);
  if(!c||!isScanned(c)) { selected=null; previewPath=null; renderHere(); return; }
  if(c.q===S.pos.q&&c.r===S.pos.r){ selected=null; previewPath=null; renderHere(); return; }
  const path=findPath(S.pos,c);
  if(!path){ toast("No charted route – scan closer first."); return; }
  if(selected && selected.q===c.q && selected.r===c.r){
    travelTo(c,path);
  }else{
    selected={q:c.q,r:c.r};
    previewPath=path;
    sfx("click");
    renderHere();
  }
});

/* touch: single-finger pan + tap, pinch zoom */
let touchState=null;
let suppressCanvasClickUntil=0; // iOS/Safari may synthesize a click after touchend
cv.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    const t=e.touches[0];
    touchState={mode:"pan", x:t.clientX, y:t.clientY, moved:false};
  }else if(e.touches.length===2){
    const [a,b]=e.touches;
    touchState={mode:"pinch", d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), z:cam.zoom};
  }
},{passive:true});
cv.addEventListener("touchmove",e=>{
  if(!touchState) return;
  if(touchState.mode==="pan"&&e.touches.length===1){
    const t=e.touches[0];
    const dx=t.clientX-touchState.x, dy=t.clientY-touchState.y;
    if(Math.abs(dx)+Math.abs(dy)>6) touchState.moved=true;
    cam.x-=dx/cam.zoom; cam.y-=dy/cam.zoom;
    touchState.x=t.clientX; touchState.y=t.clientY;
    camTarget=null;
  }else if(touchState.mode==="pinch"&&e.touches.length===2){
    const [a,b]=e.touches;
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    cam.zoom=Math.min(2.6,Math.max(.45,touchState.z*d/touchState.d));
  }
  e.preventDefault();
},{passive:false});
cv.addEventListener("touchend",e=>{
  if(touchState&&touchState.mode==="pan"&&!touchState.moved&&e.changedTouches.length===1){
    // The portrait sheet may have changed the canvas height since touchstart. Sync
    // against the *current* rendered rectangle before converting this tap to a hex.
    resize();
    const t=e.changedTouches[0];
    const rct=cv.getBoundingClientRect();
    const wpt=screenToWorld(t.clientX-rct.left,t.clientY-rct.top);
    const h=pxToHex(wpt.x,wpt.y);
    const c=cellAt(h.q,h.r);
    if(c&&isScanned(c)&&!(c.q===S.pos.q&&c.r===S.pos.r)){
      const path=findPath(S.pos,c);
      if(path){
        if(selected&&selected.q===c.q&&selected.r===c.r) travelTo(c,path);
        else{ selected={q:c.q,r:c.r}; previewPath=path; sfx("click"); renderHere(); }
      }
    }else if(!c||!isScanned(c)){
      selected=null; previewPath=null; renderHere();
    }
    // Prevent a synthetic click from immediately executing the newly selected route.
    suppressCanvasClickUntil=performance.now()+800;
    e.preventDefault();
  }
  touchState=null;
},{passive:false});

const tip=document.getElementById("hoverTip");
function tipHide(){ tip.style.display="none"; }
function updateHoverPreview(mx,my){
  if(!hoverCell||!isScanned(hoverCell)){ tipHide(); if(!selected) previewPath=null; return; }
  const c=hoverCell;
  let html="";
  if(c.type==="star") html=`<b>${c.name}</b> – ${c.astro?c.astro.spectralClass+"-type ":""}${c.color.name} star, ${c.planets.length} planet${c.planets.length>1?"s":""}${c.hasStation?", station":""}`;
  else if(c.type==="nebula") html=`<b>${c.regionName||"Nebula"}</b> – nebula terrain, costs 2 fuel to cross`;
  else if(c.type==="asteroid") html=`<b>${c.regionName||"Asteroid field"}</b>${S.upgrades.mining?" – mineable":""}`;
  else if(c.type==="ruin") html=`<b>${isVisited(c)?c.ruinName:"Ancient ruin"}</b>${S.ruinsDone.has(hk(c.q,c.r))?" – explored":""}`;
  else if(c.type==="anomaly") html=S.anomsDone.has(hk(c.q,c.r))?`<b>${c.anomalyName||"Anomaly"}</b> – resolved`:`<b>${c.anomalyName||"Anomaly"}</b> – something shimmers here`;
  else if(c.type==="gate"&&S.gateRevealed) html=`<b>The Celestial Gate</b>`;
  else html=`<b>Open space</b>`;
  if(!(c.q===S.pos.q&&c.r===S.pos.r)){
    const path=findPath(S.pos,c);
    if(path){
      if(!selected) previewPath=path;
      const fc=pathFuel(path), dc=pathDays(path);
      const bad=fc>S.fuel;
      html+=`<br><span class="cost">Route: ${path.length} jump${path.length>1?"s":""} · ${fc} fuel · ${dc} day${dc>1?"s":""}</span>`;
      if(bad) html+=`<br><span class="warn">Not enough fuel!</span>`;
      html+=`<br><span style="color:#8d9ac0">${selected&&selected.q===c.q&&selected.r===c.r?"Click again to travel":"Click to plot course"}</span>`;
    }else{
      html+=`<br><span class="warn">No charted route</span>`;
    }
  }else html+=`<br><span style="color:#8d9ac0">Your position</span>`;
  tip.innerHTML=html;
  tip.style.display="block";
  const wrap=document.getElementById("mapWrap").getBoundingClientRect();
  tip.style.left=Math.min(mx+16, wrap.width-tip.offsetWidth-8)+"px";
  tip.style.top=Math.min(my+16, wrap.height-tip.offsetHeight-8)+"px";
}

/* ---------- A* over scanned cells ---------- */
function hullCritical(){return !!S&&S.hull<=2;}
function moveCost(c){ return (c.type==="nebula"?2:1)+(hullCritical()?1:0); }
function findPath(from,to){
  const toC=cellAt(to.q,to.r);
  if(!toC||!isScanned(toC)) return null;
  const open=new Map(), came=new Map(), gScore=new Map(), stepCount=new Map();
  const sk=hk(from.q,from.r), tk=hk(to.q,to.r);
  gScore.set(sk,0); stepCount.set(sk,0);
  open.set(sk,hexDist(from,to));
  while(open.size){
    let bestK=null,bestF=1e9;
    for(const [k,f] of open){ if(f<bestF){bestF=f;bestK=k;} }
    if(bestK===tk){
      const path=[]; let k=tk;
      while(k!==sk){ const [q,r]=k.split(",").map(Number); path.unshift({q,r}); k=came.get(k); }
      return path;
    }
    open.delete(bestK);
    const [cq,cr]=bestK.split(",").map(Number);
    for(const d of DIRS){
      const nq=cq+d[0], nr=cr+d[1], nk=hk(nq,nr);
      const nc=cellAt(nq,nr);
      if(!nc||!isScanned(nc)) continue;
      const g=gScore.get(bestK)+moveCost(nc);
      const steps=(stepCount.get(bestK)||0)+1;
      /* secondary key: at equal fuel cost, prefer the route with fewer jumps (days) */
      const oldG=gScore.get(nk)??1e9;
      if(g<oldG || (g===oldG && steps<(stepCount.get(nk)??1e9))){
        came.set(nk,bestK); gScore.set(nk,g); stepCount.set(nk,steps);
        open.set(nk,g+hexDist({q:nq,r:nr},to));
      }
    }
  }
  return null;
}
function pathFuel(path){ return path.reduce((a,c)=>a+moveCost(cellAt(c.q,c.r)),0); }
function pathDays(path){ return Math.max(1,Math.ceil(path.length/S.speed)); }

/* ============================================================
   TRAVEL & TURNS
   ============================================================ */
function travelTo(dest,path){
  /* A long plotted course pauses at the first unexplored ruin/anomaly it crosses.
     This makes discoveries on the map physically matter instead of being silently flown through. */
  let route=path, interrupted=false;
  for(let i=0;i<path.length-1;i++){
    const c=cellAt(path[i].q,path[i].r);
    const stop=(c.type==="ruin"&&!S.ruinsDone.has(hk(c.q,c.r))) ||
               (c.type==="anomaly"&&!S.anomsDone.has(hk(c.q,c.r))) ||
               (c.type==="gate"&&S.gateRevealed);
    if(stop){ route=path.slice(0,i+1); dest=c; interrupted=true; break; }
  }
  const fc=pathFuel(route);
  if(fc>S.fuel){ toast("Not enough fuel for that route."); sfx("bad"); return; }
  const origin={q:S.pos.q,r:S.pos.r};
  selected=null; previewPath=null; tipHide();
  S.fuel-=fc;
  const days=pathDays(route);
  for(const step of route){
    S.pos={q:step.q,r:step.r};
    scanAround(S.pos,S.scanRange);
    visit(S.pos);
  }
  advanceDays(days);
  recentRoute=[origin,...route.map(x=>({q:x.q,r:x.r}))]; routeTrailUntil=performance.now()+(REDUCED_MOTION?250:1800);
  scanPulse={q:S.pos.q,r:S.pos.r,t:performance.now()};
  centerOnShip(true);
  sfx("engine");
  if(S.over&&!S.freePlay) return;
  if(interrupted) log(`<b>Course paused.</b> Your route crossed something worth investigating.`);
  onArrive();
  refreshAll();
  if(interrupted && !shade.classList.contains("on")) toast("Course paused – you have found something. Plot a new route when ready.");
}

function advanceDays(n){
  S.day+=n;
  if(S.mission && S.day>S.mission.due){
    log(`The delivery window for <b>${S.mission.star}</b> has closed. The contract lapsed.`);
    S.mission=null;
    toast("Delivery contract expired.");
  }
  if(!S.freePlay && S.day>S.dayLimit && !S.won){
    charterExpires();
  }
}

function onArrive(){
  const c=curCell();
  const ck=hk(c.q,c.r);
  if(!S.discoveries) S.discoveries=new Set();
  const firstDiscovery=!S.discoveries.has(ck);
  S.discoveries.add(ck);
  if(firstDiscovery) announceDiscovery(c);
  discoverScienceAt(c,!firstDiscovery,firstDiscovery);
  if(S.eventCooldown>0) S.eventCooldown--;
  if(c.type==="anomaly" && !S.anomsDone.has(hk(c.q,c.r))){
    S.anomsDone.add(hk(c.q,c.r));
    fireEvent(true);
    return;
  }
  if(c.type==="gate" && S.gateRevealed){ winGame(); return; }
  if(c.type==="star"){
    log(`Arrived at <b>${c.name}</b>.`);
    if(S.mission && S.mission.star===c.name) checkMissionDelivery(c);
  }
  if(c.type==="ruin" && !S.ruinsDone.has(hk(c.q,c.r))){
    log(`You've reached the <b>${c.ruinName}</b> – an ancient ruin drifts silently here.`);
  }
  /* random travel encounter in open space */
  if((c.type==="space"||c.type==="asteroid"||c.type==="nebula") && S.eventCooldown===0 && dchance((W.profile&&W.profile.eventRate)||0.16)){
    S.eventCooldown=3;
    fireEvent(false);
  }
}

/* ---------- fuel emergency: stranded ---------- */
let discoveryTimer=null;
function announceDiscovery(c){
  let title="",sub="";
  if(c.type==="star"){title=c.name;sub=c.systemFlavor+(c.hasStation?` ${c.stationName} · ${c.stationRole}.`:"");}
  else if(c.type==="ruin"){title=c.ruinName;sub=`An ancient ${c.ruinMood||"silent"} structure: ${c.ruinMotif||"unknown architecture"}.`;}
  else if(c.type==="anomaly"){title=c.anomalyName||"Uncatalogued anomaly";sub="The survey computer cannot reconcile this region with ordinary navigation data.";}
  else if(c.type==="nebula"){title=c.regionName||"Nebula";sub="A named dust-and-gas region enters your working chart.";}
  else if(c.type==="asteroid"){title=c.regionName||"Asteroid field";sub="A compact game-map shorthand for a much more diffuse population of small bodies.";}
  else return;
  const box=$("discoveryBanner"); if(!box)return;
  $("discoveryTitle").textContent=title; $("discoverySub").textContent=sub; box.classList.add("on");
  $("a11yLive").textContent=`New discovery: ${title}. ${sub}`;
  clearTimeout(discoveryTimer);discoveryTimer=setTimeout(()=>box.classList.remove("on"),REDUCED_MOTION?1800:3300);
  sfx("discover");
}
function checkStranded(){
  const c=curCell();
  if(c.type==="star"&&c.hasStation) return;      // can buy fuel here
  const neighbours=DIRS.map(d=>cellAt(S.pos.q+d[0],S.pos.r+d[1])).filter(Boolean);
  if(neighbours.some(n=>isScanned(n)&&moveCost(n)<=S.fuel)) return;
  /* If an adjacent hex is still unknown and we have fuel, a deep scan remains a meaningful option. */
  if(S.fuel>0&&neighbours.some(n=>!isScanned(n))) return;
  /* No currently possible move: tow to nearest visited station. */
  const st=W.stars.filter(s=>s.hasStation&&isVisited(s)).sort((a,b)=>hexDist(a,S.pos)-hexDist(b,S.pos))[0]||W.start;
  const fee=Math.min(S.credits,90);
  S.credits-=fee;
  S.pos={q:st.q,r:st.r};
  S.fuel=4;
  S.hull=Math.max(S.hull,3);
  advanceDays(4);
  visit(S.pos);
  log(`<b>You cannot reach any charted hex on your own.</b> A tug from ${st.name} hauled you in. Fee ◈${fee}, 4 days lost, 4 emergency fuel aboard; hull patched to at least 3.`);
  centerOnShip(true);
  if(S.over&&!S.freePlay){ refreshAll(); return; }
  modalInfo("Stranded!", `No charted neighbouring jump was within your remaining fuel. A friendly tug from <b>${st.name}</b> answered your beacon.<br><br>They towed you to their station – it cost <b>◈${fee}</b> and <b>4 days</b>, but they topped you up with a little emergency fuel and patched the hull to a safe minimum. Watch that fuel gauge, captain!`);
}

/* ---------- endings ---------- */
function calcScore(){
  /* Charter Score: mission completion and efficiency only – exploring after the win cannot farm it */
  const daysLeft=Math.max(0,S.dayLimit-S.day);
  const sysV=W.stars.filter(s=>isVisited(s)).length;
  const parts=[
    ["Star Keys", S.keys.filter(Boolean).length+" × 600", S.keys.filter(Boolean).length*600],
    ["Days to spare", daysLeft+" × 12", daysLeft*12],
  ];
  if(S.won) parts.unshift(["Gate reached","",1500]);
  /* Survey Record: what you charted and found – listed for the record, not added to the Charter Score */
  const charted=Math.round(100*S.scanned.size/W.cells.size);
  const survey=[
    ["Systems visited", sysV+" of "+W.stars.length],
    ["Space charted", charted+"%"],
    ["Atlas entries", String(S.atlasSeen?S.atlasSeen.size:0)],
    ["Named discoveries", String(S.discoveries?S.discoveries.size:0)],
    ["Credits", "◈"+S.credits],
  ];
  return {parts, total:parts.reduce((a,p)=>a+p[2],0), survey};
}
function rankFor(sc){
  /* Rank depends on the Charter Score and, for a won charter, on the fraction of the allotted days still in hand,
     so Relaxed, Standard and Challenge voyages are judged on the same footing. */
  const won=!!S.won, keys=S.keys.filter(Boolean).length;
  const frac=S.dayLimit?Math.max(0,S.dayLimit-S.day)/S.dayLimit:0;
  if(won&&frac>=0.5)  return "Legendary StarWeaver";   // Gate reached with half the charter to spare
  if(won&&frac>=0.27) return "Master Cartographer";     // Gate reached with about a quarter to spare
  if(won)             return "Renowned Navigator";      // reached the Gate
  if(keys>=3||sc>=1800) return "Seasoned Captain";      // all three Keys
  if(sc>=600)  return "Promising Pilot";
  return "Bold Apprentice";
}
function winGame(){
  S.won=true; S.over=true;
  sfx("fanfare");
  const sc=calcScore();
  log(`<b>You sailed through the Celestial Gate!</b> The cluster is charted and the ancients' road lies open.`);
  modalHtml(`
    <h2>🌌 Through the Gate!</h2>
    <div class="msub">Day ${S.day} · ${clusterDisplayName(S.seed)} · ${DIFF[S.diff].label}</div>
    <p class="flavor">The three Star Keys turn as one. The great ring wakes, spilling light older than any sun, and your little ship glides through to skies no chart has ever named.</p>
    <p><b>${rankFor(sc.total)}</b></p>
    ${scoreTable(sc)}
    <div class="mrow">
      <button class="mbtn2 primary" onclick="closeModal(); showNewGame();">New voyage</button>
      <button class="mbtn2" onclick="closeModal(); S.freePlay=true; S.over=false; refreshAll();">Keep exploring this cluster</button>
    </div>`,true);
}
function charterExpires(){
  S.over=true;
  sfx("bad");
  const sc=calcScore();
  log(`<b>Day ${S.dayLimit} has passed.</b> The charter expires – but the stars aren't going anywhere.`);
  modalHtml(`
    <h2>⏳ The Charter Expires</h2>
    <div class="msub">${clusterDisplayName(S.seed)} · ${DIFF[S.diff].label}</div>
    <p class="flavor">The Cartographers' Guild recalls its commission. You found ${S.keys.filter(Boolean).length} of 3 Star Keys – the Gate keeps its secret a little longer. Every great captain has a voyage like this one; the next chart is always the finest.</p>
    <p><b>${rankFor(sc.total)}</b></p>
    ${scoreTable(sc)}
    <div class="mrow">
      <button class="mbtn2 primary" onclick="closeModal(); showNewGame();">New voyage</button>
      <button class="mbtn2" onclick="closeModal(); S.freePlay=true; S.over=false; refreshAll(); toast('Free play – no clock, just stars.');">Keep exploring anyway</button>
    </div>`,true);
}
function scoreTable(sc){

function renderHere(){
  const c=curCell();

function observationFor(c){
  if(c.type==="nebula") return {q:"Dust obscures part of this nebula in visible light. Which band is generally better at seeing through dusty regions?",a:["Infrared","Blue visible light","Ultraviolet"],correct:0,why:"Infrared wavelengths can penetrate dust more effectively than visible light, revealing embedded stars and structures.",unlock:["infrared","nebulae"]};
  if(c.type==="asteroid") return {q:"Your navigation computer projects a real asteroid belt at Solar-System scale. What should you expect between most large objects?",a:["Huge stretches of empty space","Continuous walls of rock","A dense atmosphere"],correct:0,why:"Asteroid belts are overwhelmingly empty space; StarWeaver’s dense-looking field is a gameplay compression.",unlock:["asteroid_belts","galactic_scale"]};
  if(c.type==="star"&&c.astro){
    const f=c.astro.family;
    if(f==="O"||f==="B") return {q:`${c.name} is a hot ${c.astro.spectralClass}-type star. Compared with a Sun-like star, its main-sequence lifetime is generally…`,a:["Much shorter","Much longer","About identical"],correct:0,why:"High-mass stars burn fuel vastly faster, so despite having more fuel they live much shorter lives.",unlock:["stellar_lifetimes","spectral_types"]};
    if(f==="K"||f==="M") return {q:`${c.name} is orange/red and comparatively cool. Which statement best follows?`,a:["Its surface is cooler than a blue star’s","It must be physically colder than space","Colour tells us nothing about stellar temperature"],correct:0,why:"For ordinary stars, colour is strongly related to surface temperature: redder stars are cooler, bluer stars hotter.",unlock:["star_colour","spectral_types"]};
    return {q:"The survey computer wants more than a photograph. Which technique can reveal a star’s chemical fingerprints and temperature?",a:["Spectroscopy","A louder radio transmitter","Counting its planets by eye"],correct:0,why:"Spectroscopy separates light by wavelength; spectral lines encode composition and physical conditions.",unlock:["spectroscopy","spectral_types"]};
  }
  return null;
}
let currentObservation=null;
function surveyObservation(){
  const c=curCell();
  if(S.surveysDone instanceof Set&&S.surveysDone.has(hk(c.q,c.r))) return;
  const ob=observationFor(c); if(!ob) return;
  const rr=mulberry32(hashStr(S.seed+"|ob-order|"+hk(c.q,c.r)));
  const order=ob.a.map((_,i)=>i); for(let j=order.length-1;j>0;j--){const k=Math.floor(rr()*(j+1));[order[j],order[k]]=[order[k],order[j]];}
  const shuffled={...ob,a:order.map(i=>ob.a[i]),correct:order.indexOf(ob.correct)};
  currentObservation={...shuffled,key:hk(c.q,c.r)};
  modalHtml(`<h2>🔬 Survey Observation</h2><div class="msub">${c.type==="star"?c.name:c.type==="nebula"?"Nebula":"Asteroid field"}</div><p>${shuffled.q}</p><div class="mrow">${shuffled.a.map((x,i)=>`<button class="mbtn2" onclick="answerObservation(${i})">${x}</button>`).join("")}</div><p class="small">Optional fieldwork: a correct interpretation earns ◈25 and lets the survey computer prioritise nearby chart data. A wrong answer has no penalty.</p>`);
}
function answerObservation(i){
  const ob=currentObservation; if(!ob) return;
  if(!(S.surveysDone instanceof Set)) S.surveysDone=new Set(S.surveysDone||[]);
  S.surveysDone.add(ob.key); unlockAtlas([...initialAtlasForContext(W.context),...(ob.unlock||[])],true);
  const ok=i===ob.correct;
  if(ok){S.credits+=25;scanAround(S.pos,S.scanRange+1);log(`<b>Survey interpretation accepted.</b> Research stipend +◈25; nearby chart priorities updated.`);sfx("good");}
  else{sfx("bad");log(`<b>Survey interpretation reviewed.</b> No penalty; the Atlas records the explanation.`);}
  currentObservation=null;
  autoSave(); refreshAll();
  modalHtml(`<h2>${ok?"✓ Observation logged":"Observation reviewed"}</h2><div class="obsAnswer">${ob.why}</div><p>${ok?"The Research Guild transfers <b>◈25</b>, and your survey computer reveals a little more nearby chart data.":"No resources were lost. The point of fieldwork is to improve the model, not punish a wrong inference."}</p><div class="mrow"><button class="mbtn2 primary" onclick="closeModal()">Back to chart</button><button class="mbtn2" onclick="closeModal();document.querySelector('.tab[data-p=\"atlas\"]').click();">Open Captain's Atlas</button></div>`);
}

function giveClue(source){
  /* pick an unfound clue for an unfound key */
  const opts=[];
  for(let i=0;i<3;i++){
    if(S.keys[i]) continue;
    for(let ci=0;ci<W.clues[i].length;ci++){
      if(!S.foundClues[i].includes(ci)) opts.push([i,ci]);
    }
  }
  if(!opts.length) return null;
  const [i,ci]=dpick(opts);
  S.foundClues[i].push(ci);
  document.querySelector('.tab[data-p="clues"]').classList.add("alert");
  renderClues();
  return {key:i, text:`The ${["First","Second","Third"][i]} Key ${W.clues[i][ci]}.`};
}

function waitDay(){ advanceDays(1); log("You hold position and watch the stars turn."); refreshAll(); }
function scoopFuel(){
  const c=curCell(),k=hk(c.q,c.r);
  if(!(S.gasScooped instanceof Set)) S.gasScooped=new Set(S.gasScooped||[]);
  if(!c.gasGiant||S.fuel>=S.fuelMax||S.gasScooped.has(k)) return;
  S.gasScooped.add(k);
  S.fuel=Math.min(S.fuelMax,S.fuel+5);
  unlockAtlas([...initialAtlasForContext(W.context),"gas_giants"],false);
  advanceDays(1);

function mineHere(){

/* ---------- ruins & keys ---------- */
function exploreRuin(){
  const c=curCell();
  if(c.type!=="ruin"||S.ruinsDone.has(hk(c.q,c.r))) return;
  advanceDays(1);
  if(S.over&&!S.freePlay){ refreshAll(); return; }
  if(c.keyIndex!==undefined && !S.keys[c.keyIndex]){
    keyPuzzle(c);
    return;
  }else{
    S.ruinsDone.add(hk(c.q,c.r));
    /* a clue, and sometimes a small treasure */
    const clue=giveClue("ruin");
    let extra="";
    if(dchance(.5)){
      const cr=dri(30,90); S.credits+=cr;
      extra=`<p>Among the dust you also find old trade tokens worth <b>◈${cr}</b>.</p>`;
    }else if(dchance(.5)&&cargoCount()<S.cargoMax){
      S.cargo.dust=(S.cargo.dust||0)+1;
      extra=`<p>A sealed vial glimmers on an altar: <b>+1 Stardust</b>.</p>`;
    }
    log(`Explored the ${c.ruinName}.${clue?" A carving speaks: <i>"+clue.text+"</i>":""}`);
    modalHtml(`
      <h2>🏛 ${c.ruinName}</h2>
      <p class="flavor">The ${c.ruinMood||"silent"} complex opens around you: ${c.ruinMotif||"old star-charts cover its walls"}. ${dpick([
        "Your bootsteps return from passages too long to fit the exterior.",
        "A patient mechanism wakes somewhere below and then decides you are not a threat.",
        "Dust rises in your lamp-beam and settles in precise concentric rings.",
        "One corridor still carries a line of cold blue guide-lights, each one dimmer than the last."

      ${clue?`<div class="clue" style="margin:10px 0">${clue.text}</div>`:"<p>The carvings here have faded beyond reading – but the ruin feels peaceful.</p>"}
      ${extra}

    sfx("event");
    refreshAll();

}

function keyPuzzle(c){
  const i=c.keyIndex;
  const pid=(W.puzzleIds&&W.puzzleIds[i]!==undefined)?W.puzzleIds[i]:i%KEY_PUZZLES.length;
  const pz=KEY_PUZZLES[pid];
  modalHtml(`
    <h2>🗝️ ${c.ruinName}</h2>
    <p class="flavor">Deep in the ruin, a vault door of black glass. Behind it, unmistakable: the glow of a <b>Star Key</b>.</p>
    <p>${pz.q}</p>
    <div class="mrow">${pz.a.map((a,ix)=>`<button class="mbtn2" onclick="keyAnswer(${i},${ix},${pz.correct},${pid})">${a}</button>`).join("")}</div>
    <p class="small" style="margin-top:10px">A wrong answer costs one day while the patient old vault resets. It will not take the Key away.</p>`,true);
}
function keyAnswer(i,ix,correct,pid){
  const right=ix===correct;
  if(!right){
    advanceDays(1);
    if(S.over&&!S.freePlay){ refreshAll(); return; }
  }
  const keyRuin=W.keyRuins[i]; if(keyRuin) S.ruinsDone.add(hk(keyRuin.q,keyRuin.r));
  S.keys[i]=true;
  const bonus=right?dri(60,120):0;
  if(bonus) S.credits+=bonus;
  const got=S.keys.filter(Boolean).length;
  const unseenPort=W.stars.filter(st=>st.hasStation&&!isScanned(st)).sort((a,b)=>hexDist(a,S.pos)-hexDist(b,S.pos))[0];
  if(unseenPort){scanAround(unseenPort,1);log(`The Key resonates with a Guild relay; a distant port at <b>${unseenPort.name}</b> resolves on your chart.`);}
  if(got>=3&&!S.gateRevealed){
    S.gateRevealed=true;
    S.scanned.add(hk(W.gate.q,W.gate.r));
  }
  const pz=KEY_PUZZLES[pid]||KEY_PUZZLES[0];
  log(`<b>You hold the ${["First","Second","Third"][i]} Star Key!</b>${right?" The vault opened at your first touch – the keepers left a gift of ◈"+bonus+".":" (The vault took a day to forgive your guess.)"}`);
  sfx("fanfare");
  modalHtml(`
    <h2>🗝️ The ${["First","Second","Third"][i]} Star Key!</h2>
    <p class="flavor">${right?
      "The door drinks your answer and sighs open. On a plinth of frozen light rests the Star Key – warm, humming, glad to be found. The keepers' gift of <b>◈"+bonus+"</b> rests beside it.":
      "The door dims… then, patient as tide, resets and opens anyway. The ancients built for wonder, not punishment. The Star Key is yours – though the vault kept you a day."}</p>
    <div class="tipbox"><b>Why:</b> ${pz.why}</div>
    ${got>=3?`<p><b>All three Keys sing together – and far away, something answers. The CELESTIAL GATE has appeared on your chart!</b> Reach it to complete your charter.</p>`:
      `<p>${3-got} Key${3-got>1?"s":""} remain${3-got>1?"":"s"} hidden among the ruins.</p>`}
    <div class="mrow"><button class="mbtn2 primary" onclick="closeModal()">Onward!</button></div>`);
  refreshAll();
}

/* ---------- missions ---------- */
function offerMission(star){
  if(S.mission) return null;
  const others=W.stars.filter(s=>s!==star&&s.hasStation);
  if(!others.length) return null;
  const dest=dpick(others);
  const good=dpick(GOODS).id;
  const qty=dri(2,4);
  const dist=hexDist(star,dest);
  const due=S.day+dist*2+dri(8,14);
  const reward=Math.round((GOOD[good].base*qty*1.6+dist*22)/10)*10;
  const px=axialPx(dest.q,dest.r,1), here=axialPx(star.q,star.r,1);
  let ang=Math.atan2(-(px.y-here.y),px.x-here.x)*180/Math.PI; if(ang<0)ang+=360;
  const oct=["east","northeast","north","northwest","west","southwest","south","southeast"][Math.round(ang/45)%8];
  const hint=isVisited(dest)?`${dest.name} is already on your charts.`:`${dest.name} lies roughly ${dist} jumps to the ${oct}.`;
  return {star:dest.name, good, qty, due, reward, hint};
}
function checkMissionDelivery(star){
  const m=S.mission;
  if(!m||m.star!==star.name) return;
  if((S.cargo[m.good]||0)>=m.qty){
    S.cargo[m.good]-=m.qty;
    S.credits+=m.reward;
    log(`Delivered ${m.qty} ${GOOD[m.good].name} to ${star.name}. <b>+◈${m.reward}</b>!`);
    toast(`Mission complete! +◈${m.reward}`);
    sfx("coin");
    S.mission=null;
  }else{
    toast(`Mission: need ${m.qty} ${GOOD[m.good].name} aboard to deliver here.`);
  }
}

function trade(gid,dir){
  const c=curCell();
  const pr=dir>0?buyPriceOf(c,gid):sellPriceOf(c,gid);
  if(dir>0){
    if(S.credits<pr||cargoCount()>=S.cargoMax) return;
    S.credits-=pr; S.cargo[gid]=(S.cargo[gid]||0)+1;
    if(S.mission&&S.mission.star===c.name&&(S.cargo[S.mission.good]||0)>=S.mission.qty) checkMissionDelivery(c);
  }else{
    if(!(S.cargo[gid]>0)) return;
    S.credits+=pr; S.cargo[gid]--;
  }
  sfx("coin");
  openStation("market"); renderStatus(); renderCargo();
}
function buyFuel(n){
  const c=curCell();
  n=Math.min(n, S.fuelMax-S.fuel, Math.floor(S.credits/c.fuelPrice));
  if(n<=0) return;
  S.credits-=n*c.fuelPrice; S.fuel+=n;
  sfx("coin");
  openStation("market"); renderStatus();
}
function repairHull(){

function fireEvent(isAnomaly,forcedIndex=null){
  const list=isAnomaly?ANOMALY_EVENTS:SPACE_EVENTS;
  let idx=forcedIndex;
  if(idx===null){
    const recent=new Set((S.seenEvents||[]).slice(-5));
    let eligible=list.map((ev,i)=>({ev,i})).filter(x=>(!x.ev.contexts||x.ev.contexts.includes(W.context.id))&&(!x.ev.terrain||x.ev.terrain.includes(curCell().type)));
    let fresh=eligible.filter(x=>!recent.has(x.ev.id||x.ev.title)); if(fresh.length)eligible=fresh;
    idx=eligible.length?dpick(eligible).i:Math.floor(drand()*list.length);
  }
  const ev=list[idx];
  currentEvent=ev;
  S.pendingEvent={isAnomaly:!!isAnomaly,index:idx};
  let h=`<h2>${ev.title}</h2><p class="flavor">${ev.text()}</p><div class="mrow">`;
  ev.choices.forEach((ch,i)=>{
    const ok=!ch.cond||ch.cond();
    h+=`<button class="mbtn2" ${ok?"":"disabled"} onclick="eventChoice(${i})">${ch.label()}</button>`;
  });
  h+=`</div>`;
  modalHtml(h,true);
  autoSave();
  sfx("event");
}
function restorePendingEvent(){
  if(!S||!S.pendingEvent) return;
  const pe=S.pendingEvent;
  fireEvent(pe.isAnomaly,pe.index);
}
let currentEvent=null;
function eventChoice(i){
  if(!currentEvent) return;
  const title=currentEvent.title;
  const ch=currentEvent.choices[i];
  const out=ch.effect();
  if(!S.seenEvents)S.seenEvents=[]; const eid=currentEvent.id||currentEvent.title;S.seenEvents.push(eid);if(S.seenEvents.length>18)S.seenEvents.shift();
  log(out);
  currentEvent=null;
  S.pendingEvent=null;
  if(S.over&&!S.freePlay){ refreshAll(); return; }
  modalHtml(`<h2>${title}</h2><p class="flavor">${out}</p>
    <div class="mrow"><button class="mbtn2 primary" onclick="continueAfterEvent()">Continue</button></div>`,!!S.pendingArrival);
  refreshAll();
}

  closeModal();
  if(S&&S.pendingArrival){S.pendingArrival=false;onArrive();refreshAll();}
}

const shade=$("shade"), modalEl=$("modal");
let modalLocked=false;
function modalHtml(h,locked){ modalEl.innerHTML=h; shade.classList.add("on"); modalLocked=!!locked; }
function modalInfo(title,body){ modalHtml(`<h2>${title}</h2><p>${body}</p><div class="mrow"><button class="mbtn2 primary" onclick="closeModal()">OK</button></div>`); }
function closeModal(){ shade.classList.remove("on"); modalLocked=false; }
shade.addEventListener("click",e=>{ if(e.target===shade&&!modalLocked) closeModal(); });

let toastTimer=null;
function toast(msg){
  const t=$("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("on"),2600);
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt));
  return Promise.resolve(fallbackCopy(txt));
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea");
  ta.value=txt; document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");}catch(e){}
  ta.remove();
}

/* ---------- sound: short WebAudio effects only ---------- */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(freq,dur,type,vol,when){
  const a=ac(); if(!a||muted) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0,a.currentTime+(when||0));
  g.gain.linearRampToValueAtTime(vol||.12,a.currentTime+(when||0)+.01);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(when||0)+dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime+(when||0)); o.stop(a.currentTime+(when||0)+dur+.05);
}
// Deliberately no continuous ambient drone: audio is event/SFX-only.
function stopAmbient(){}
function startAmbient(){}
function sfx(kind){
  if(muted) return;
  switch(kind){
    case "click": tone(660,.06,"sine",.06); break;
    case "coin": tone(880,.07,"triangle",.1); tone(1320,.09,"triangle",.08,.06); break;
    case "engine": tone(120,.25,"sawtooth",.05); tone(180,.2,"sawtooth",.04,.05); break;
    case "scan": tone(440,.1,"sine",.07); tone(660,.1,"sine",.06,.09); tone(880,.12,"sine",.05,.18); break;
    case "good": tone(523,.1,"triangle",.09); tone(784,.14,"triangle",.08,.09); break;
    case "bad": tone(220,.18,"square",.06); tone(165,.22,"square",.05,.12); break;
    case "event": tone(392,.12,"sine",.08); tone(494,.12,"sine",.07,.1); tone(587,.16,"sine",.07,.2); break;
    case "fanfare": [523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.09,i*.11)); break;
    case "discover": tone(330,.10,"sine",.045);tone(495,.16,"triangle",.04,.08);tone(660,.22,"sine",.035,.15);break;
  }
}

/* ---------- save / load + automatic local resume ---------- */
const AUTO_KEY="starweaver.autosave.v2";
function saveCode(){
  const state={...S, dramaCalls:rdCalls, visited:[...S.visited], scanned:[...S.scanned], ruinsDone:[...S.ruinsDone], anomsDone:[...S.anomsDone], gasScooped:[...(S.gasScooped||[])], atlasSeen:[...(S.atlasSeen||[])], surveysDone:[...(S.surveysDone||[])], discoveries:[...(S.discoveries||[])]};
  return "SW2."+btoa(unescape(encodeURIComponent(JSON.stringify(state))));
}
function autoSave(){
  if(!S) return;
  try{ localStorage.setItem(AUTO_KEY,saveCode()); }catch(e){}
}
function hasAutoSave(){
  try{ return !!localStorage.getItem(AUTO_KEY); }catch(e){ return false; }
}
function loadAutoSave(){
  try{ const code=localStorage.getItem(AUTO_KEY); return code?loadCode(code):false; }catch(e){ return false; }
}
function clearAutoSave(){ try{localStorage.removeItem(AUTO_KEY);}catch(e){} }
function loadCode(code){
  try{
    const prefix=code.startsWith("SW2.")?"SW2.":code.startsWith("SW1.")?"SW1.":null;
    if(!prefix) throw 0;
    const state=JSON.parse(decodeURIComponent(escape(atob(code.slice(prefix.length)))));
    const worldVersion=Number(state.worldVersion)||2;
    W=worldVersion>=3?genGalaxy(state.seed,worldVersion):decorateLegacyWorld(genGalaxyLegacy(state.seed));
    RD=mulberry32(hashStr(state.seed+"::drama")^0x9e3779b9);
    rdCalls=0;
    const targetCalls=Number.isFinite(state.dramaCalls)?state.dramaCalls:0;
    for(let i=0;i<targetCalls;i++) RD();
    rdCalls=targetCalls;
    S=state;
    S.visited=new Set(state.visited||[]); S.scanned=new Set(state.scanned||[]);
    S.ruinsDone=new Set(state.ruinsDone||[]); S.anomsDone=new Set(state.anomsDone||[]); S.gasScooped=new Set(state.gasScooped||[]);
    S.atlasSeen=new Set(state.atlasSeen||[]); S.surveysDone=new Set(state.surveysDone||[]);
    S.discoveries=new Set(state.discoveries||state.visited||[]); if(!Array.isArray(S.seenEvents))S.seenEvents=[];
    if(!S.ruinMarks) S.ruinMarks={};
    if(S.pendingEvent===undefined) S.pendingEvent=null;
    if(S.pendingArrival===undefined) S.pendingArrival=false;
    cam.zoom=initialChartZoom();
    centerOnShip(false);
    refreshAll();
    closeModal();
    stopAmbient();startAmbient();
    if(S.pendingEvent) restorePendingEvent();
    else if(S.pendingArrival){S.pendingArrival=false;onArrive();refreshAll();}
    toast(prefix==="SW2."?"Voyage restored. Welcome back, captain.":"Older voyage restored. Future chance events may differ from the original run.");
    return true;
  }catch(e){ toast("That save code didn't parse – check it and try again."); return false; }
}
$("btnSave").addEventListener("click",()=>{
  autoSave();
  const code=saveCode();
  modalHtml(`<h2>💾 Save & Resume</h2>
    <p><b>${clusterDisplayName(S.seed)}</b> · cluster code <b>${S.seed}</b></p>
    <p><b>Your voyage is saved automatically on this device.</b> The long code below is a portable <em>save</em> backup containing your exact progress; the short cluster code above only recreates the starting cluster.</p>
    <textarea id="saveTa" style="width:100%;height:90px;background:#0a0f1e;color:#9fe;border:1px solid var(--edge);border-radius:8px;padding:8px;font-size:11px;word-break:break-all">${code}</textarea>
    <div class="mrow">
      <button class="mbtn2 primary" onclick="copyText(document.getElementById('saveTa').value).then(()=>toast('Save code copied!'))">Copy backup code</button>
      <button class="mbtn2" onclick="loadCode(document.getElementById('saveTa').value.trim())">Load pasted code</button>
      <button class="mbtn2" onclick="closeModal()">Close</button>
    </div>
    <p class="small">Backup codes preserve your map, cargo, upgrades, clues, Atlas discoveries, survey observations and log – and the voyage’s upcoming random events, so a restored game plays out the same way.</p>`);
});

function randomSeed(){
  const words=["comet","nova","lyra","orion","zephyr","aurora","quasar","vega","halley","cosmo","stellar","nimbus","astra","borealis","meteor","pulsar"];
  return words[Math.floor(Math.random()*words.length)]+"-"+Math.floor(Math.random()*900+100);
}
function clusterDisplayName(seed){
  const first=["Vesper","Aurora","Cinder","Sapphire","Halcyon","Peregrine","Lantern","Aster","Silver","Ember","Velvet","Lyra","Morrow","Echo","Solstice","Zephyr","Cerulean","Starfall","Quiet","Orion","Indigo","Luminous","Wayfarer","Amber"];
  const last=["Reach","Expanse","Drift","March","Veil","Basin","Hollows","Crossing","Fields","Crown","Arc","Wilds","Current","Frontier","Span","Reaches","Garden","Passage","Shallows","Marches"];
  const rr=mulberry32(hashStr("cluster-name|"+seed));
  return "The "+first[Math.floor(rr()*first.length)]+" "+last[Math.floor(rr()*last.length)];
}
function updateContextPreview(seed){
  const ctx=galacticContext(seed),profile=clusterProfile(seed,ctx);
  const a=$("sectorPreview"),b=$("distancePreview"),c=$("sectorSummaryPreview"),d=$("profilePreview");
  if(a) a.textContent=ctx.place;
  if(b) b.textContent=`About ${ctx.distanceLy.toLocaleString()} light-years from the Solar System · ${ctx.focus}`;
  if(c) c.textContent=ctx.summary;
  if(d) d.textContent=profile.name+" – "+profile.blurb;
}
function rerollCluster(){
  const seed=randomSeed();
  const input=$("seedInput");
  if(input) input.value=seed;
  const n=$("clusterNamePreview");
  if(n) n.textContent=clusterDisplayName(seed);
  const c=$("clusterCodePreview");
  if(c) c.textContent="Cluster code: "+seed;
  updateContextPreview(seed);
}
function useSharedCluster(){
  const shared=$("sharedCodeInput");
  const code=(shared&&shared.value.trim()).slice(0,40);
  if(!code){ toast("Enter a cluster code first."); return; }
  $("seedInput").value=code;
  $("clusterNamePreview").textContent=clusterDisplayName(code);
  $("clusterCodePreview").textContent="Cluster code: "+code;
  updateContextPreview(code);
  toast("Shared cluster selected. Choose a difficulty to begin.");
}

        <div class="clusterSub" style="margin-top:6px"><span class="fictionTag">Fictional chart</span> The generated systems are not real catalogued stars. <span class="truthTag">Real astronomy</span> Field Notes explain the actual Galactic context and phenomena.</div>
      </div>
      </details>
      <input id="seedInput" type="hidden" value="${seed}">

function startFrom(diffKey){
  const seed=($("seedInput").value.trim()||randomSeed()).slice(0,40);
  closeModal();
  newGame(seed,diffKey);
  if(!seenHelp){ seenHelp=true; showHelp(true); }
}
function showAbout(fromWelcome){
  modalHtml(`
    <h2>✦ About StarWeaver</h2>
    <p class="flavor">StarWeaver is a small exploration-strategy game. Each voyage generates a fictional survey cluster – a hex chart of stars, nebulae, ports and ruins – and places it somewhere real in the Milky Way. You chart the cluster, gather clues, recover three Star Keys and open the Celestial Gate before your days run out.</p>
    <div class="tipbox"><b>What is real and what is not.</b> The Galactic setting of each voyage (the Perseus Arm, the Local Arm, the halo, the outer disk) is real, and the Field Notes at each location describe real astronomy: star classes, nebulae, how distances are measured, why gas giants matter for refuelling. The individual stars, ports and ruins are invented. A <span class="fictionTag">Fictional chart</span> tag marks the first; a <span class="truthTag">Real astronomy</span> tag marks the second.</div>
    <div class="tipbox"><b>Your voyage stays on your device.</b> Progress is saved automatically in this browser. A short <b>cluster code</b> lets a friend play the same starting chart; a longer <b>save code</b> (Save menu) moves a voyage in progress to another device. Nothing is sent anywhere.</div>
    <div class="tipbox"><b>Playing it well.</b> Clues beat wandering; fuel is the real currency; trading is optional. The game is designed to be finished in a sitting or two, and a new cluster is one click away.</div>
    <p class="small" style="margin-top:10px;opacity:.75">Part of <a href="https://naniwadekar.com/" style="color:var(--gold)">Curiosities</a>. Works offline once opened, and can be added to a phone's Home Screen as an app.</p>
    <div class="mrow">${fromWelcome?"":'<button class="mbtn2" onclick="showHelp(false)">📖 How to Play</button>'}<button class="mbtn2 primary" onclick="${fromWelcome?"showNewGame(true)":"closeModal()"}">${fromWelcome?"Back to the charter":"Back"}</button></div>
  `, !!fromWelcome);
}
let seenHelp=false;
function showHelp(first){
  modalHtml(`
    <h2>📖 How to Play</h2>
    ${first?`<p class="flavor">You can learn everything while playing. This is the whole game in about a minute:</p>`:""}

    <div class="tipbox"><b>Your objective:</b> find <b>3 Star Keys</b> hidden in 3 of the 9 ancient ruins. Once you have all three, the <b>Celestial Gate</b> appears. Reach it before the day counter runs out.</div>

    <div class="tipbox"><b>About the setting:</b> StarWeaver generates a fictional survey cluster for each voyage and places it in a real Milky Way context – the Perseus Arm, the Local (Orion) Arm, the Galactic halo. That context shapes the chart: halo voyages are quieter and heavy with cool stars; gas-rich arm voyages hold more nebulae and luminous stars. These are procedural biases, not a catalogue of real systems, and the Field Notes always say what is real and what is fiction.<br><br><b>About cluster codes:</b> StarWeaver generates a fresh cluster for each voyage. <b>Another cluster</b> generates a different one. A short <b>cluster code</b> recreates the same starting galaxy for a friend; a long <b>save code</b> restores your actual progress.</div>

    <div class="howstep"><span class="n">1</span><div><b>Reveal the map.</b><br>Flying automatically scans nearby hexes. Use <b>Deep scan</b> when you want to reveal a wider area; it costs 1 fuel and 1 day.</div></div>
    <div class="howstep"><span class="n">2</span><div><b>Move your ship.</b><br>Tap or click a revealed hex <b>once</b> to plot a route. The map shows the fuel and time cost. Tap the large <b>Fly</b> button (or tap/click the same hex again) to travel. Nebula hexes cost 2 fuel instead of 1.</div></div>
    <div class="howstep"><span class="n">3</span><div><b>Look for ancient ruins.</b><br>Only 3 ruins hold Keys. The others usually give money, rare cargo or – most importantly – <b>clues</b> about the Key ruins.</div></div>
    <div class="howstep"><span class="n">4</span><div><b>Use clues instead of guessing.</b><br>Open the <b>Clues</b> tab. Combine clues such as direction, distance from the centre, nearby star colour and terrain. Use ★ <b>Suspect</b> and × <b>Ruled out</b> notes on charted ruins.</div></div>
    <div class="howstep"><span class="n">5</span><div><b>Keep fuel in reserve.</b><br>Buy fuel at stations or take one 5-fuel scoop from each gas-giant system you discover. If you cannot make any charted neighbouring jump, a rescue tug will tow you – but it costs credits and days. Hull 2 or below is critical and adds 1 fuel to every jump until repaired.</div></div>
    <div class="howstep"><span class="n">6</span><div><b>Stations make the voyage easier.</b><br><b>Market:</b> buy ▼ goods cheaply and sell them where they show ▲. <b>Shipyard:</b> improve tank, hold, scanner, hull and engine. <b>Lounge:</b> buy rumours about Key locations or take delivery contracts.</div></div>
    <div class="howstep"><span class="n">7</span><div><b>Learn from what you find – optionally.</b><br>Each location has short <b>Field Notes</b> distinguishing real astronomy from game fiction. The <b>Atlas</b> fills as you explore. Some locations offer an optional observation: interpret it correctly for a small research grant and extra chart data.</div></div>
    <div class="howstep"><span class="n">8</span><div><b>Open the Gate.</b><br>Recover all 3 Keys and the Celestial Gate is revealed automatically. Fly to it to finish the charter and receive your score.</div></div>

    <h3 style="color:var(--gold);font-size:13px;letter-spacing:1.5px;margin:14px 0 6px">FIRST-VOYAGE TIPS</h3>
    <div class="tipbox">• You do <b>not</b> need to explore every hex or every ruin.<br>• A few good clues can save many days of wandering.<br>• Gas giants are valuable fuel stops.<br>• Trading is optional, but profits buy upgrades that make exploration much easier.<br>• A long route pauses automatically if it crosses an unexplored ruin or anomaly, so you won't silently fly past something important.<br>• There is no permadeath. Wrong vault answers and bad events cost resources or time, not your entire voyage.<br>• The astronomy is <b>not compulsory coursework</b>: you can ignore observations and still complete the Charter.<br>• Keyboard: <b>1–5</b> change sidebar tabs, <b>S</b> deep-scans, <b>H</b> centres the ship, <b>M</b> toggles sound, arrow keys pan, and +/− zoom. The Here tab also has a text list of charted destinations.</div>

    <p class="small" style="margin-top:10px;opacity:.75"><a href="#" onclick="showAbout();return false" style="color:var(--gold)">About StarWeaver</a> · part of <a href="https://naniwadekar.com/" style="color:var(--gold)">Curiosities</a>.</p>
    <div class="mrow"><button class="mbtn2 primary" onclick="closeModal()">${first?"Cast off!":"Back to the stars"}</button></div>
  `);
}
$("btnHelp").addEventListener("click",()=>showHelp(false));
$("btnNew").addEventListener("click",()=>showNewGame(false));
$("btnZin").addEventListener("click",()=>{cam.zoom=Math.min(2.6,cam.zoom*1.2);});
$("btnZout").addEventListener("click",()=>{cam.zoom=Math.max(.45,cam.zoom/1.2);});
$("btnHome").addEventListener("click",()=>centerOnShip(true));
window.addEventListener("keydown",e=>{
  const tag=(e.target&&e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea")return;
  if(e.key==="Escape"&&$("headerMenu").classList.contains("on")){closeHeaderMenu();return;}
  if(e.key==="Escape"&&!modalLocked){closeModal();cancelRoute();return;}
  if(shade.classList.contains("on"))return;
  if(e.key==="+"||e.key==="="){cam.zoom=Math.min(2.6,cam.zoom*1.15);e.preventDefault();}
  else if(e.key==="-"){cam.zoom=Math.max(.45,cam.zoom/1.15);e.preventDefault();}
  else if(e.key.toLowerCase()==="h")centerOnShip(true);
  else if(e.key.toLowerCase()==="m")$("btnMute").click();
  else if(e.key.toLowerCase()==="s"&&S&&S.fuel>=1)deepScan();
  else if(e.key>="1"&&e.key<="5"){const tabs=[...document.querySelectorAll("#tabs .tab")];const t=tabs[Number(e.key)-1];if(t)t.click();}
  else if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){const d=60/cam.zoom;if(e.key==="ArrowLeft")cam.x-=d;if(e.key==="ArrowRight")cam.x+=d;if(e.key==="ArrowUp")cam.y-=d;if(e.key==="ArrowDown")cam.y+=d;camTarget=null;e.preventDefault();}
});
function wakeAudio(){const a=ac();if(a&&a.state==="suspended")a.resume();}
document.body.addEventListener("pointerdown",wakeAudio,{once:true});
document.body.addEventListener("keydown",wakeAudio,{once:true});
window.addEventListener("beforeunload",autoSave);

requestAnimationFrame(draw);
showNewGame(true);

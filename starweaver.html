<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StarWeaver – The Cluster Charter</title>
<meta name="description" content="Explore a fictional survey cluster set in the real Milky Way, learn some astronomy along the way, recover three Star Keys, and reach the Celestial Gate.">
<meta name="theme-color" content="#070a14">
<meta name="application-name" content="StarWeaver">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StarWeaver">
<link rel="manifest" href="/starweaver-manifest.json">
<link rel="apple-touch-icon" href="/starweaver-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/starweaver-icon-192.png">
<link rel="canonical" href="https://naniwadekar.com/starweaver.html">
<meta property="og:title" content="StarWeaver – The Cluster Charter"><meta name="twitter:card" content="summary_large_image"><meta property="og:site_name" content="Curiosities">
<meta property="og:description" content="Explore a fictional survey cluster set in the real Milky Way, learn astronomy through field notes and observations, recover three Star Keys, and reach the Celestial Gate.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://naniwadekar.com/starweaver.html">
<meta property="og:image" content="https://naniwadekar.com/starweaver-icon-512.png">
<style>
:root{
  --bg:#070a14; --panel:#0e1424; --panel2:#141c33; --edge:#26314f;
  --ink:#dfe7ff; --dim:#8d9ac0; --gold:#ffcf6b; --cyan:#5fd6e8; --green:#7fe0a0;
  --red:#ff8080; --violet:#b79bff; --accent:#3b6ef5;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden;}
@supports (height:100dvh){html,body{height:100dvh;}}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  font-size:15px; display:flex; flex-direction:column;
  min-height:100%;
}
@supports (height:100dvh){body{min-height:100dvh;}}
button{font-family:inherit;}
/* ---------- header ---------- */
#hdr{
  display:flex; align-items:center; gap:10px;
  padding:calc(7px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 7px calc(14px + env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#101731,#0b1122); border-bottom:1px solid var(--edge);
  flex:0 0 auto; z-index:20;
}
#hdr h1{font-size:17px; letter-spacing:3px; color:var(--gold); font-weight:700; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;}
#hdr h1 span{color:var(--cyan); font-weight:400;}
#seedTag{font-size:12px; color:var(--dim); cursor:pointer; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;}
#seedTag:hover{color:var(--cyan);}
#hdr .spacer{flex:1;}
.hbtn{
  background:var(--panel2); color:var(--ink); border:1px solid var(--edge);
  border-radius:8px; padding:5px 11px; font-size:13px; cursor:pointer; white-space:nowrap;
}
.hbtn:hover{border-color:var(--cyan); color:var(--cyan);}
a.hbtn{text-decoration:none; display:inline-flex; align-items:center;}
#btnMenu{display:none;font-size:20px;line-height:1;padding:7px 10px;min-width:44px;min-height:44px;text-align:center;}
#headerMenu{display:none;position:absolute;right:calc(8px + env(safe-area-inset-right,0px));top:calc(100% + 6px);z-index:35;width:min(240px,calc(100vw - 20px));padding:7px;background:#101831;border:1px solid #34406b;border-radius:11px;box-shadow:0 16px 44px rgba(0,0,0,.5);}
#headerMenu.on{display:block;}
#headerMenu button{display:block;width:100%;min-height:44px;padding:9px 11px;border:0;border-bottom:1px solid rgba(38,49,79,.75);background:transparent;color:var(--ink);text-align:left;font:inherit;font-size:14px;cursor:pointer;}
#headerMenu button:last-child{border-bottom:0;}
#headerMenu button:hover,#headerMenu button:focus-visible{background:var(--panel2);outline:none;}
/* ---------- layout ---------- */
#main{flex:1; display:flex; min-height:0;}
#mapWrap{flex:1; position:relative; min-width:0; background:#04060d;}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none;}
#cv.drag{cursor:grabbing;}
#mapBtns{position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; z-index:5;}
.mbtn{
  width:44px; height:44px; border-radius:10px; border:1px solid var(--edge);
  background:rgba(14,20,36,.88); color:var(--ink); font-size:17px; cursor:pointer;
}
.mbtn:hover{border-color:var(--cyan); color:var(--cyan);}
#hoverTip{
  position:absolute; pointer-events:none; z-index:6; display:none;
  background:rgba(10,15,30,.94); border:1px solid var(--edge); border-radius:8px;
  padding:6px 10px; font-size:12.5px; max-width:230px; line-height:1.45;
}
#hoverTip b{color:var(--gold);}
#hoverTip .cost{color:var(--cyan);}
#hoverTip .warn{color:var(--red);}
#mapWrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 100px rgba(0,0,0,.48);}
#discoveryBanner{position:absolute;left:16px;top:16px;z-index:8;max-width:min(410px,72%);padding:10px 13px;border:1px solid rgba(95,214,232,.34);border-left:3px solid var(--cyan);border-radius:10px;background:rgba(8,14,30,.91);box-shadow:0 10px 32px rgba(0,0,0,.35);backdrop-filter:blur(6px);opacity:0;transform:translateY(-8px);transition:opacity .28s,transform .28s;pointer-events:none;}
#discoveryBanner.on{opacity:1;transform:translateY(0);}
#discoveryBanner .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--cyan);}
#discoveryBanner b{display:block;margin-top:1px;color:var(--gold);font-size:15px;}
#discoveryBanner span{display:block;margin-top:2px;color:var(--dim);font-size:11.8px;line-height:1.35;}
.routeCard{margin:0 0 10px;padding:9px 10px;border:1px solid rgba(95,214,232,.32);border-radius:9px;background:rgba(95,214,232,.055);}
.routeCard .routeTitle{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--cyan);margin-bottom:4px;}
.routeCard b{color:var(--gold);}
.routeActions{display:flex;gap:7px;margin-top:8px;}
.routeActions .flyBtn{flex:1;min-height:44px;padding:9px 12px;margin:0;border-radius:8px;border:1px solid #4a72e8;background:linear-gradient(180deg,#2b55c9,#1d3d9e);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
.routeActions .flyBtn:disabled{opacity:.4;cursor:default;}
.routeActions .cancelBtn{min-height:44px;padding:9px 12px;margin:0;}
.destList{margin-top:8px;border-top:1px solid var(--edge);padding-top:7px;}
.destList summary{cursor:pointer;color:var(--dim);font-size:12px;user-select:none;}
.destRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(38,49,79,.55);}
.destRow:last-child{border-bottom:0;}
.destRow .dn{font-size:12.5px;color:var(--ink);}.destRow .dd{font-size:10.8px;color:var(--dim);}
.profilePill{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid rgba(255,207,107,.28);background:rgba(255,207,107,.06);color:var(--gold);font-size:10.5px;margin-top:4px;}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
canvas:focus-visible{outline:2px solid var(--cyan);outline-offset:-3px;}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.tab,.abtn,.mbtn2,#toast,#discoveryBanner{transition:none!important;}}
/* ---------- sidebar ---------- */
#side{
  flex:0 0 330px; background:var(--panel); border-left:1px solid var(--edge);
  display:flex; flex-direction:column; min-height:0;
}
#sheetHandle{display:none;align-items:center;justify-content:center;gap:7px;width:100%;min-height:32px;border:0;border-bottom:1px solid var(--edge);background:var(--panel);color:var(--dim);font:inherit;font-size:11px;letter-spacing:.6px;cursor:pointer;}
#sheetHandle::before{content:"";width:36px;height:4px;border-radius:99px;background:#405070;}
#sheetHandle:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px;}
#statusBox{padding:10px 12px 8px; border-bottom:1px solid var(--edge); flex:0 0 auto;}
#dayRow{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
#dayRow .day{font-size:15px; color:var(--gold); font-weight:600;}
#dayRow .keys{font-size:15px; letter-spacing:2px;}
.bar{height:15px; border-radius:8px; background:#0a0f1e; border:1px solid var(--edge);
  position:relative; overflow:hidden; margin-bottom:6px;}
.bar .fill{position:absolute; inset:0; border-radius:7px; transition:width .3s;}
.bar .lbl{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:10.5px; letter-spacing:1px; color:#eaf0ff; text-shadow:0 1px 2px #000; font-weight:600;}
#fuelFill{background:linear-gradient(90deg,#1f7fe0,#5fd6e8);}
#hullFill{background:linear-gradient(90deg,#2e9e63,#7fe0a0);}
#credRow{display:flex; justify-content:space-between; font-size:14px; margin-top:2px;}
#credRow .cr{color:var(--gold); font-weight:600;}
#credRow .cargo{color:var(--dim);}
/* ---------- tabs ---------- */
#tabs{display:flex; border-bottom:1px solid var(--edge); flex:0 0 auto;}
.tab{flex:1; min-height:44px; padding:7px 0; display:flex;align-items:center;justify-content:center; text-align:center; font-size:12.5px; letter-spacing:.5px;
  color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; user-select:none;}
.tab.on{color:var(--cyan); border-bottom-color:var(--cyan); background:rgba(95,214,232,.05);}
.tab .dot{display:none; color:var(--gold);}
.tab.alert .dot{display:inline;}
#panels{flex:1; overflow-y:auto; min-height:0; scrollbar-width:thin; scrollbar-color:#26314f transparent;}
.panel{display:none; padding:10px 12px 20px;}
.panel.on{display:block;}
.panel h3{font-size:13px; letter-spacing:1.5px; color:var(--gold); margin:10px 0 6px; text-transform:uppercase;}
.panel h3:first-child{margin-top:0;}
.small{font-size:12.5px; color:var(--dim); line-height:1.5;}
/* here panel */
#hereName{font-size:16.5px; font-weight:700; margin-bottom:2px;}
#hereSub{font-size:12.5px; color:var(--dim); margin-bottom:8px; line-height:1.5;}
.abtn{
  display:block; width:100%; margin:6px 0; padding:9px 12px; text-align:left;
  background:var(--panel2); border:1px solid var(--edge); border-radius:9px;
  color:var(--ink); font-size:13.5px; cursor:pointer; line-height:1.35; min-height:44px;
}
.abtn:hover:not(:disabled){border-color:var(--cyan);}
.abtn:disabled{opacity:.45; cursor:default;}
.abtn .sub{display:block; font-size:11.5px; color:var(--dim); margin-top:1px;}
.abtn.gold{border-color:#6b5a2a;} .abtn.gold:hover:not(:disabled){border-color:var(--gold);}
/* planets list */
.planet{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px;}
.planet .pd{color:var(--dim); font-size:12px;}
.pdot{width:11px; height:11px; border-radius:50%; flex:0 0 auto;}
/* cargo */
#cargoList{display:flex; flex-direction:column; gap:4px;}
.cargoRow{display:flex; justify-content:space-between; padding:5px 8px; background:var(--panel2);
  border-radius:7px; font-size:13px;}
.cargoRow .q{color:var(--gold);}
/* clues */
.clueGroup{margin-bottom:12px;}
.clueGroup h4{font-size:13px; color:var(--violet); margin-bottom:4px;}
.clue{font-size:12.8px; color:var(--ink); padding:5px 8px; background:var(--panel2);
  border-left:3px solid var(--violet); border-radius:0 7px 7px 0; margin-bottom:4px; line-height:1.45;}
.clue.done{opacity:.5; border-left-color:var(--green);}
/* log */
#logList{display:flex; flex-direction:column-reverse; gap:5px;}
.logRow{font-size:12.5px; color:var(--dim); line-height:1.45; padding:4px 8px;
  background:var(--panel2); border-radius:7px;}
.logRow b{color:var(--ink); font-weight:600;}
.logRow .d{color:var(--cyan); font-size:11px; margin-right:5px;}
/* mission */
.missionBox{background:var(--panel2); border:1px solid var(--edge); border-radius:9px;
  padding:9px 11px; font-size:13px; line-height:1.5; margin-bottom:8px;}
.missionBox b{color:var(--gold);}
/* ---------- modal ---------- */
#shade{position:fixed; inset:0; background:rgba(3,5,12,.72); z-index:40; display:none;
  align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(3px);}
#shade.on{display:flex;}
#modal{
  width:min(560px,96vw); max-height:88vh; overflow-y:auto; scrollbar-width:thin;
  background:linear-gradient(180deg,#131b34,#0d1326); border:1px solid #34406b;
  border-radius:16px; padding:22px 24px; box-shadow:0 18px 60px rgba(0,0,0,.6);
}
#modal h2{font-size:19px; color:var(--gold); margin-bottom:4px; letter-spacing:.5px;}
#modal .msub{font-size:12.5px; color:var(--dim); margin-bottom:12px;}
#modal p{font-size:14px; line-height:1.6; margin-bottom:10px; color:var(--ink);}
#modal p.flavor{color:#c6d2f5;}
.mrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.mbtn2{
  flex:1 1 auto; min-width:130px; min-height:44px; padding:10px 14px; border-radius:10px; cursor:pointer;
  background:var(--panel2); border:1px solid var(--edge); color:var(--ink);
  font-size:13.5px; text-align:left; line-height:1.35;
}
.mbtn2:hover:not(:disabled){border-color:var(--cyan);}
.mbtn2:disabled{opacity:.4; cursor:default;}
.mbtn2 .sub{display:block; font-size:11.5px; color:var(--dim); margin-top:2px;}
.mbtn2.primary{background:linear-gradient(180deg,#2b55c9,#1d3d9e); border-color:#4a72e8;}
.mbtn2.primary:hover{border-color:#8fb0ff;}
/* market table */
table.mkt{width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 10px;}
table.mkt th{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px;
  text-align:left; padding:4px 6px; border-bottom:1px solid var(--edge);}
table.mkt td{padding:6px 6px; border-bottom:1px solid #1b2440;}
table.mkt .pr{color:var(--gold);} table.mkt .lo{color:var(--green);} table.mkt .hi{color:var(--red);}
 .marketCards{display:none;}
.marketCard{padding:10px 11px;margin:7px 0;background:var(--panel2);border:1px solid var(--edge);border-radius:10px;}
.marketCardTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
.marketCardName{font-weight:700;font-size:14px;}
.marketCardHeld{font-size:12px;color:var(--dim);white-space:nowrap;}
.marketCardPrice{font-size:12.5px;color:var(--gold);margin-bottom:8px;}
.marketCardPrice.lo{color:var(--green)}.marketCardPrice.hi{color:var(--red)}
.marketCardActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.marketCardActions .tbtn{margin:0;min-height:44px;}
.tbtn{min-height:40px; min-width:40px; padding:7px 11px; margin-left:4px; border-radius:6px; border:1px solid var(--edge);
  background:var(--panel2); color:var(--ink); cursor:pointer; font-size:12px;}
.tbtn:hover:not(:disabled){border-color:var(--cyan);}
.tbtn:disabled{opacity:.35; cursor:default;}
/* shop */
.shopItem{display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:8px 10px; background:var(--panel2); border:1px solid var(--edge); border-radius:9px; margin-bottom:7px;}
.shopItem .si-l{font-size:13.5px; line-height:1.4;}
.shopItem .si-l .sub{display:block; font-size:11.5px; color:var(--dim);}
/* ---------- astronomy / atlas ---------- */
.contextCard,.scienceCard,.atlasCard{
  background:linear-gradient(180deg,rgba(20,28,51,.96),rgba(14,20,36,.96));
  border:1px solid var(--edge); border-radius:10px; padding:10px 11px; margin:8px 0;
}
.contextCard{border-left:3px solid var(--cyan);}
.scienceCard{border-left:3px solid var(--cyan);}
.fieldNotesDetails{margin-top:10px;}
.fieldNotesDetails>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--edge);border-radius:9px;background:rgba(95,214,232,.05);color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;}
.fieldNotesDetails>summary::-webkit-details-marker{display:none;}
.fieldNotesDetails>summary::after{content:"▾";color:var(--cyan);font-size:14px;}
.fieldNotesDetails:not([open])>summary::after{content:"▸";}
.fieldNotesDetails[open]>summary{border-bottom-left-radius:6px;border-bottom-right-radius:6px;}
.fieldNotesDetails .scienceCard{margin-top:7px;}
.scienceCard .stitle,.atlasCard .stitle{font-size:13.5px;font-weight:700;color:var(--cyan);margin-bottom:4px;}
.scienceCard p,.atlasCard p{font-size:12.7px;line-height:1.52;margin:5px 0;color:var(--ink);}
.scienceMeta{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
.sciencePill{font-size:10.8px;padding:2px 7px;border-radius:999px;border:1px solid var(--edge);background:#0b1122;color:var(--dim);}
.truthTag,.simTag,.fictionTag{display:inline-block;font-size:10px;letter-spacing:.65px;text-transform:uppercase;font-weight:700;border-radius:5px;padding:2px 6px;margin-right:4px;}
.truthTag{color:var(--green);background:rgba(127,224,160,.09);border:1px solid rgba(127,224,160,.28);}
.simTag{color:var(--cyan);background:rgba(95,214,232,.08);border:1px solid rgba(95,214,232,.25);}
.fictionTag{color:var(--violet);background:rgba(183,155,255,.08);border:1px solid rgba(183,155,255,.25);}
.sourceLink{color:var(--cyan);font-size:11.5px;text-decoration:none;}
.sourceLink:hover{text-decoration:underline;}
.atlasProgress{height:7px;border-radius:99px;background:#080d1b;overflow:hidden;border:1px solid var(--edge);margin:5px 0 9px;}
.atlasProgress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));}
.atlasGrid{display:grid;grid-template-columns:1fr;gap:7px;}
.atlasLocked{opacity:.48;border-style:dashed;}
.atlasCat{display:flex;justify-content:space-between;align-items:baseline;margin:13px 0 5px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1.1px;}
.atlasCat span{color:var(--dim);font-size:10.5px;letter-spacing:0;text-transform:none;}
.scienceContext{margin-top:10px;padding:9px 10px;border:1px solid #2b4964;border-radius:9px;background:rgba(95,214,232,.05);}
.scienceContext b{color:var(--cyan);}
.observationBox{padding:10px 11px;border-radius:9px;background:#101a31;border:1px solid #294d67;margin:8px 0;}
.obsAnswer{border-left:3px solid var(--green);padding-left:9px;margin:8px 0;font-size:13px;line-height:1.5;}
.atlasBadge{font-size:11px;color:var(--gold);}
/* toast */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
  background:#182246; border:1px solid #3a4a80; color:var(--ink); padding:9px 18px;
  border-radius:10px; font-size:13.5px; opacity:0; transition:all .3s; z-index:60;
  pointer-events:none; max-width:80vw; text-align:center;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
/* key pips */
.keypip{opacity:.25; filter:grayscale(1);}
.keypip.got{opacity:1; filter:none; text-shadow:0 0 8px var(--gold);}
.howstep{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin:7px 0;background:var(--panel2);border:1px solid var(--edge);border-radius:9px;line-height:1.45;}
.howstep .n{flex:0 0 24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#223767;color:var(--cyan);font-weight:700;font-size:12px;}
.howstep b{color:var(--gold);}
.tipbox{padding:9px 11px;margin:9px 0;background:rgba(95,214,232,.06);border:1px solid rgba(95,214,232,.25);border-radius:9px;font-size:12.8px;line-height:1.5;}
.onboardDetails{margin:8px 0;text-align:left;}
.onboardDetails>summary{cursor:pointer;color:var(--dim);font-size:12px;padding:6px 0;list-style:none;}
.onboardDetails>summary::before{content:"▸ ";color:var(--gold);}
.onboardDetails[open]>summary::before{content:"▾ ";}
.clusterCard{padding:14px 15px;margin:10px 0 12px;background:linear-gradient(180deg,rgba(255,207,107,.08),rgba(95,214,232,.04));border:1px solid #4b4660;border-radius:12px;text-align:center;}
.clusterCard .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:1.7px;color:var(--dim);margin-bottom:4px;}
.clusterCard .clusterName{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:.3px;margin-bottom:3px;}
.clusterCard .clusterSub{font-size:12px;color:var(--dim);line-height:1.4;}
.clusterTools{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
.clusterTools .mbtn2{flex:0 1 auto;min-width:150px;text-align:center;}
.sharedBox{margin-top:12px;padding-top:10px;border-top:1px solid var(--edge);}
.sharedRow{display:flex;gap:7px;align-items:stretch;margin-top:6px;}
.sharedRow input{min-width:0;flex:1;padding:9px 11px;background:#0a0f1e;color:var(--ink);border:1px solid var(--edge);border-radius:8px;font-size:13px;}

<body>
<div id="hdr">
  <h1>StarWeaver <span>· The Cluster Charter</span></h1>
  <div id="seedTag" title="Click to copy this cluster code"></div>
  <div class="spacer"></div>

  <button class="hbtn" id="btnHelp">How to Play</button>
  <button class="hbtn" id="btnSave">Save</button>
  <button class="hbtn" id="btnNew">New Voyage</button>
  <button class="hbtn" id="btnMute" title="Toggle sound" aria-label="Toggle sound">🔊</button>
  <button class="hbtn" id="btnMenu" title="More options" aria-label="More options" aria-expanded="false">⋯</button>
  <div id="headerMenu" role="menu" aria-label="StarWeaver options">
    <button type="button" id="menuHelp">How to Play</button>
    <button type="button" id="menuSave">Save voyage</button>
    <button type="button" id="menuNew">New Voyage</button>
    <button type="button" id="menuAbout">About</button>
    <a href="https://naniwadekar.com/" role="menuitem" style="display:block;min-height:44px;padding:12px 11px;color:var(--ink);text-decoration:none;font-size:14px">← Curiosities</a>
  </div>
</div>

<div id="main">
  <div id="mapWrap">
    <canvas id="cv" tabindex="0" role="application" aria-label="StarWeaver cluster chart. Use mouse or touch to pan and select destinations; use the nearby destinations list in the Here panel for keyboard navigation."></canvas>
    <div id="discoveryBanner" aria-hidden="true"><div class="eyebrow">New discovery</div><b id="discoveryTitle"></b><span id="discoverySub"></span></div>
    <div id="mapBtns">
      <button class="mbtn" id="btnZin" title="Zoom in">+</button>
      <button class="mbtn" id="btnZout" title="Zoom out">−</button>
      <button class="mbtn" id="btnHome" title="Center on ship">◎</button>
    </div>
    <div id="hoverTip"></div>
  </div>

  <div id="side">
    <button id="sheetHandle" type="button" aria-expanded="false" aria-label="Expand information panel"><span id="sheetHandleText">Expand panel</span></button>
    <div id="statusBox">
      <div id="dayRow">
        <span class="day" id="dayLbl">Day 1 / 110</span>
        <span class="keys" id="keyLbl"></span>
      </div>
      <div class="bar"><div class="fill" id="fuelFill"></div><div class="lbl" id="fuelLbl">FUEL</div></div>
      <div class="bar"><div class="fill" id="hullFill"></div><div class="lbl" id="hullLbl">HULL</div></div>

      <div class="tab" data-p="cargo">Cargo</div>

      <div class="tab" data-p="atlas">Atlas <span class="dot">●</span></div>
      <div class="tab" data-p="log">Log</div>

    <div id="panels">
      <div class="panel on" id="p-here"></div>
      <div class="panel" id="p-cargo"></div>
      <div class="panel" id="p-clues"></div>
      <div class="panel" id="p-atlas"></div>
      <div class="panel" id="p-log"><div id="logList"></div></div>
    </div>
  </div>
</div>

<div id="shade"><div id="modal"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="a11yLive" class="sr-only" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   StarWeaver – a procedurally generated exploration strategy game
   with an optional contextual astronomy layer. Every seed weaves a fictional
   survey cluster inside a real Milky Way setting.
   ============================================================ */

/* ---------- seeded RNG ---------- */
function hashStr(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19);}
  h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909);
  return (h^(h>>>16))>>>0;
}
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
let R=mulberry32(1);                     // world-gen rng (re-seeded per game)
let RD=mulberry32(2);                    // drama rng – separate, tracked stream
let rdCalls=0;                           // saved so future events resume exactly
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=arr=>arr[Math.floor(R()*arr.length)];
const shuffle=arr=>{const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const drand=()=>{ rdCalls++; return RD(); };
const dpick=arr=>arr[Math.floor(drand()*arr.length)];
const dri=(a,b)=>a+Math.floor(drand()*(b-a+1));
const dchance=p=>drand()<p;

/* ---------- hex math (axial, pointy-top) ---------- */
const SQ3=Math.sqrt(3);
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hk=(q,r)=>q+","+r;
function hexDist(a,b){
  return (Math.abs(a.q-b.q)+Math.abs(a.q+a.r-b.q-b.r)+Math.abs(a.r-b.r))/2;
}
function axialPx(q,r,s){ return {x:s*SQ3*(q+r/2), y:s*1.5*r}; }

/* ---------- static data ---------- */
const MAP_R=8;                 // hex radius of the cluster
const WORLD_VERSION=4;         // bumped when cluster generation changes, so older saves restore unchanged
const GOODS=[
  {id:"ore",   name:"Ore",        icon:"⛏", base:28,  col:"#b8a98f"},
  {id:"bot",   name:"Botanicals", icon:"🌿", base:46,  col:"#7fe0a0"},
  {id:"med",   name:"Medicine",   icon:"⚕", base:74,  col:"#8fd0ff"},
  {id:"tech",  name:"Tech Parts", icon:"⚙", base:105, col:"#c9d4e8"},
  {id:"cry",   name:"Crystals",   icon:"◆", base:150, col:"#b79bff"},
  {id:"dust",  name:"Stardust",   icon:"✦", base:215, col:"#ffcf6b"},
];
const GOOD=Object.fromEntries(GOODS.map(g=>[g.id,g]));
const STAR_COLORS=[
  {id:"red",    name:"red",    col:"#ff7b6b", glow:"#ff4830"},
  {id:"orange", name:"orange", col:"#ffb35c", glow:"#ff9020"},
  {id:"yellow", name:"yellow-white", col:"#ffe08a", glow:"#ffcc40"},
  {id:"white",  name:"white",  col:"#eef2ff", glow:"#c8d6ff"},
  {id:"blue",   name:"blue-white", col:"#9cc4ff", glow:"#5f9dff"},
];

/* Procedural identity: the Galactic setting now changes the generated cluster as well as its explanatory text.
   These are game-generation biases, not claims about a real named cluster. */
const SECTOR_RULES={
  orion:{nebula:[3,4],asteroids:12,stationRate:.61,minStations:9,eventRate:.15,weights:{red:24,orange:23,yellow:21,white:19,blue:13},tone:"mixed stellar neighbourhood"},
  perseus:{nebula:[4,6],asteroids:12,stationRate:.62,minStations:9,eventRate:.18,weights:{red:18,orange:18,yellow:18,white:24,blue:22},tone:"bright, gas-rich frontier"},
  sagittarius:{nebula:[5,7],asteroids:13,stationRate:.63,minStations:9,eventRate:.19,weights:{red:18,orange:18,yellow:17,white:24,blue:23},tone:"dust-rich star-forming lane"},
  scutum:{nebula:[4,6],asteroids:15,stationRate:.67,minStations:10,eventRate:.19,weights:{red:19,orange:18,yellow:18,white:24,blue:21},tone:"crowded inner-disk crossing"},
  outer:{nebula:[2,3],asteroids:11,stationRate:.53,minStations:8,eventRate:.14,weights:{red:34,orange:28,yellow:20,white:12,blue:6},tone:"sparse outer-disk frontier"},
  halo:{nebula:[0,1],asteroids:8,stationRate:.46,minStations:7,eventRate:.13,weights:{red:39,orange:31,yellow:20,white:8,blue:2},tone:"quiet old-star halo survey"}
};
const PROFILE_VARIANTS={
  orion:[["Lantern Roads","A balanced chart of mixed stars, active ports and short survey lanes."],["Local Meridian","A well-trafficked fictional survey pocket with varied stellar colours and reliable stations."]],
  perseus:[["Blue Frontier","Young-looking luminous systems and bright dust complexes are unusually common on this chart."],["Nursery Reach","A lively spiral-arm survey with more hot stars and nebular terrain than average."]],
  sagittarius:[["Dustglass Passage","Dense dust lanes make scanning valuable and nebular routes expensive."],["Ember Veil","A luminous, gas-rich fictional sector where clear routes are worth planning."]],
  scutum:[["Crowded Meridian","Stations are common, but the chart is busy with dust, rock and overlapping routes."],["Inner Lanterns","A dense trade-and-survey crossing toward the inner Galactic disk."]],

function weightedStarColor(weights){
  let total=0; for(const c of STAR_COLORS) total+=(weights[c.id]||0);
  let x=R()*total; for(const c of STAR_COLORS){x-=weights[c.id]||0;if(x<=0)return c;}
  return STAR_COLORS[2];
}
function clusterProfile(seed,ctx){
  const rr=mulberry32(hashStr("cluster-profile|"+seed));
  const v=(PROFILE_VARIANTS[ctx.id]||PROFILE_VARIANTS.orion);
  const chosen=v[Math.floor(rr()*v.length)];
  const rules=SECTOR_RULES[ctx.id]||SECTOR_RULES.orion;
  return {name:chosen[0],blurb:chosen[1],tone:rules.tone,eventRate:rules.eventRate};
}

/* Astronomy layer. The game map remains fictional; these contexts and notes are grounded in real astronomy. */
const GALACTIC_SECTORS=[

   focus:"our local Galactic neighbourhood",summary:"The Sun lies in the Local Arm (also called the Orion Arm or Orion Spur), between the Sagittarius and Perseus arms. Your charter is fictional, but this placement is in the same broad Milky Way neighbourhood."},
  {id:"perseus",name:"Perseus Arm frontier",place:"Perseus Arm",distance:[5600,9800],atlas:"spiral_arms",
   focus:"spiral-arm structure and young stars",summary:"The Perseus Arm is one of the Milky Way’s major spiral arms. Spiral arms contain concentrations of gas, dust and star-forming regions as well as older stars."},
  {id:"sagittarius",name:"Sagittarius Arm lane",place:"Sagittarius Arm",distance:[4200,8200],atlas:"spiral_arms",
   focus:"gas, dust and star formation",summary:"The Sagittarius Arm is a gas-rich region of the Galactic disk with prominent star-forming complexes. Dust can hide visible-light objects while infrared observations reveal more."},
  {id:"scutum",name:"Inner-disk expedition",place:"Scutum–Centaurus Arm region",distance:[10500,18500],atlas:"spiral_arms",
   focus:"the crowded inner Galactic disk",summary:"Toward the inner Milky Way, stars, gas and dust become more crowded along our line of sight. Astronomers often combine infrared and radio observations to study obscured regions."},
  {id:"outer",name:"Outer-disk frontier",place:"Outer Milky Way disk",distance:[15000,30000],atlas:"galactic_disk",
   focus:"the thin stellar disk far from the Galactic centre",summary:"The Milky Way’s disk extends far beyond the Sun. The outer disk is more sparsely populated than the inner Galaxy and is useful for studying how the disk changes with distance from the centre."},
  {id:"halo",name:"Halo crossing",place:"Galactic halo",distance:[18000,48000],atlas:"galactic_halo",
   focus:"the Milky Way beyond its bright disk",summary:"The Galactic halo is a vast, diffuse region surrounding the disk. It contains old stars and globular clusters and sits inside a much larger halo dominated by dark matter."}
];
const SPECTRAL_BY_COLOR={
  blue:[
    {cls:"O",temps:[45000,42000,40000,38000,36000,34500,33250,32000,31000,30000],mass:[40,16],lifeGyr:[0.003,0.010],desc:"extremely hot, massive and short-lived"},
    {cls:"B",temps:[30000,25000,22000,19000,17000,15000,14000,13000,11500,10500],mass:[16,2.1],lifeGyr:[0.010,1.1],desc:"hot, blue-white and generally much more massive than the Sun"}
  ],
  white:[
    {cls:"A",temps:[10000,9500,9000,8600,8300,8100,7900,7700,7600,7500],mass:[2.1,1.4],lifeGyr:[0.7,3],desc:"hotter and more massive than the Sun"},
    {cls:"F",temps:[7400,7200,7000,6800,6600,6450,6300,6200,6100,6000],mass:[1.4,1.04],lifeGyr:[3,8],desc:"somewhat hotter and more massive than the Sun"}
  ],
  yellow:[{cls:"G",temps:[5950,5860,5770,5680,5590,5500,5420,5350,5280,5200],mass:[1.04,0.8],lifeGyr:[8,20],desc:"Sun-like in temperature and mass"}],
  orange:[{cls:"K",temps:[5100,4950,4800,4600,4400,4200,4050,3900,3800,3700],mass:[0.8,0.45],lifeGyr:[15,45],desc:"cooler, smaller and longer-lived than the Sun"}],
  red:[{cls:"M",temps:[3700,3550,3400,3250,3100,2950,2800,2650,2500,2400],mass:[0.45,0.08],lifeGyr:[50,14000],desc:"cool, low-mass and exceptionally long-lived"}]
};
function interpSubtype(range,subtype){return range[0]+(range[1]-range[0])*(subtype/9);}
function interpLogSubtype(range,subtype){
  const a=Math.log10(range[0]),b=Math.log10(range[1]);
  return Math.pow(10,a+(b-a)*(subtype/9));
}
function formatLifetimeGyr(gyr){
  if(gyr<1){const myr=gyr*1000;return `${myr<10?Math.round(myr*10)/10:Math.round(myr)} million years`;}
  if(gyr>=1000){const t=gyr/1000;return `${t<10?Math.round(t*10)/10:Math.round(t)} trillion years`;}
  const rounded=gyr<10?Math.round(gyr*10)/10:gyr<100?Math.round(gyr):Math.round(gyr/10)*10;
  return `${rounded.toLocaleString()} billion years`;
}
const SCIENCE_SOURCES={
  milky:{name:"NASA Science · The Milky Way Galaxy",url:"https://science.nasa.gov/resource/the-milky-way-galaxy/"},
  stars:{name:"NASA Science · Stars",url:"https://science.nasa.gov/universe/stars/"},
  worlds:{name:"NASA Science · Exoplanets",url:"https://science.nasa.gov/exoplanets/"},
  asteroids:{name:"NASA Science · Asteroids",url:"https://science.nasa.gov/solar-system/asteroids/"},
  nebula:{name:"NASA Science · Nebulae",url:"https://science.nasa.gov/mission/hubble/science/universe-uncovered/hubble-nebulae/"}
};
const ASTRO_ATLAS=[
  {id:"milky_way",cat:"Galaxy",title:"The Milky Way",src:"milky",body:"The Milky Way is our barred spiral galaxy, containing well over 100 billion stars. The Solar System lies in the disk, not at the centre."},
  {id:"spiral_arms",cat:"Galaxy",title:"Spiral arms",src:"milky",body:"Spiral arms are regions of enhanced stellar density, gas and dust. They often contain active star formation. The Sun lies in the Local Arm (Orion Arm/Orion Spur), between the Sagittarius and Perseus arms."},
  {id:"galactic_disk",cat:"Galaxy",title:"The Galactic disk",src:"milky",body:"Most visible stars, gas and dust in the Milky Way occupy a flattened disk. The disk extends tens of thousands of light-years from the Galactic centre."},
  {id:"galactic_halo",cat:"Galaxy",title:"The Galactic halo",src:"milky",body:"A diffuse halo surrounds the Milky Way’s disk. It contains old stars and globular clusters and is embedded in a much larger dark-matter halo."},

  {id:"star_colour",cat:"Stars",title:"Star colour and temperature",src:"stars",body:"A star’s colour is related to its surface temperature: blue-white stars are hotter, red stars cooler. The map exaggerates colour for readability; the Sun’s combined visible light appears white."},
  {id:"spectral_types",cat:"Stars",title:"OBAFGKM spectral classes",src:"stars",body:"Astronomers classify ordinary stars by spectra and temperature. From hottest to coolest, the familiar sequence is O, B, A, F, G, K, M. The Sun is a G-type star."},

];
const ATLAS_BY_ID=Object.fromEntries(ASTRO_ATLAS.map(x=>[x.id,x]));
function seededUnit(seed,key){return mulberry32(hashStr(seed+"|astro|"+key))();}
function galacticContext(seed){
  const r=mulberry32(hashStr("galactic-context|"+seed));
  const base=GALACTIC_SECTORS[Math.floor(r()*GALACTIC_SECTORS.length)];
  const d=Math.round((base.distance[0]+r()*(base.distance[1]-base.distance[0]))/50)*50;
  return {...base,distanceLy:d};
}
function initialAtlasForContext(ctx){
  const ids=["milky_way"];
  if(ctx.atlas==="spiral_arms") ids.push("galactic_disk","spiral_arms");
  else ids.push(ctx.atlas);
  return ids;
}
function atlasEntriesForWorld(){
  if(!W||!W.context) return ASTRO_ATLAS;
  const relevantGalaxy=new Set(["milky_way","galactic_scale"]);
  if(W.context.atlas==="spiral_arms"){relevantGalaxy.add("galactic_disk");relevantGalaxy.add("spiral_arms");}
  else relevantGalaxy.add(W.context.atlas);
  const hasNebula=[...W.cells.values()].some(c=>c.type==="nebula");
  const hasAsteroids=[...W.cells.values()].some(c=>c.type==="asteroid");
  const hasGasGiant=W.stars.some(st=>st.planets.some(p=>p.kind==="gas giant"));
  const hasRocky=W.stars.some(st=>st.planets.some(p=>p.kind!=="gas giant"));
  return ASTRO_ATLAS.filter(e=>{
    if(e.cat==="Galaxy") return relevantGalaxy.has(e.id);
    if(["nebulae","molecular_clouds","infrared"].includes(e.id)) return hasNebula;
    if(e.id==="asteroid_belts") return hasAsteroids;
    if(e.id==="gas_giants") return hasGasGiant;

  });
}
function attachStarAstronomy(world){
  if(!world.context) world.context=galacticContext(world.seed);
  world.stars.forEach((st,i)=>{
    const rr=mulberry32(hashStr(world.seed+"|star-astro|"+i+"|"+st.name));
    const options=SPECTRAL_BY_COLOR[st.color.id]||SPECTRAL_BY_COLOR.yellow;
    const spec=options[Math.floor(rr()*options.length)];
    const subtype=Math.max(0,Math.min(9,Math.floor(rr()*10)));
    const temp=spec.temps[subtype];
    const massRaw=interpSubtype(spec.mass,subtype);
    const mass=massRaw<1?Math.round(massRaw*100)/100:Math.round(massRaw*10)/10;

    st.astro={spectralClass:spec.cls+subtype, family:spec.cls, tempK:temp, massSolar:mass, lifetime:formatLifetimeGyr(lifeGyr), desc:spec.desc};
  });
}

let W=null;   // world (immutable per seed)
let S=null;   // mutable game state

/* Legacy generator retained so automatic/portable SW2 saves created before the richer
   procedural-environment update still restore against the exact chart they were playing. */
function genGalaxyLegacy(seedStr){
  R=mulberry32(hashStr(seedStr));
  const cells=new Map();
  for(let q=-MAP_R;q<=MAP_R;q++){
    for(let r=Math.max(-MAP_R,-q-MAP_R); r<=Math.min(MAP_R,-q+MAP_R); r++){
      cells.set(hk(q,r),{q,r,type:"space"});
    }
  }
  const all=[...cells.values()];
  const at=(q,r)=>cells.get(hk(q,r));
  const center={q:0,r:0};

  /* nebula blobs – drifting random walks */
  const nebCount=ri(3,4);
  for(let n=0;n<nebCount;n++){
    let c=pick(all.filter(c=>hexDist(c,center)>=3));
    const len=ri(5,9);
    for(let i=0;i<len;i++){
      if(c && c.type==="space") c.type="nebula";
      const d=pick(DIRS);
      const nx=at(c.q+d[0], c.r+d[1]);
      if(nx) c=nx;
    }
  }
  /* asteroid fields */
  let empt=shuffle(all.filter(c=>c.type==="space" && hexDist(c,center)>=2));
  for(let i=0;i<13 && empt.length;i++){ empt.pop().type="asteroid"; }

  /* star systems – spaced out */
  const stars=[];
  const usedNames=new Set();
  const mkName=()=>{
    for(let t=0;t<40;t++){
      const n=pick(SYL1)+pick(SYL2)+(R()<.22?pick(SUFFIX):"");
      if(!usedNames.has(n)){usedNames.add(n); return n;}
    }
    return "Star-"+ri(100,999);
  };
  let cand=shuffle(all.filter(c=>c.type==="space"));
  for(const c of cand){
    if(stars.length>=26) break;
    if(stars.some(s=>hexDist(s,c)<2)) continue;
    c.type="star";
    c.name=mkName();
    c.color=pick(STAR_COLORS);
    c.planets=[];
    const np=ri(1,3);
    const goodPool=shuffle(GOODS.map(g=>g.id));
    for(let p=0;p<np;p++){
      c.planets.push({
        name:c.name+" "+["I","II","III"][p],
        kind:pick(["rocky","oceanic","gas giant","frozen","verdant","desert"]),
      });
    }
    /* economy: produces are cheap here, wants are pricey */
    c.produces=goodPool.slice(0,ri(1,2));
    c.wants=goodPool.slice(3,3+ri(1,2)).filter(g=>!c.produces.includes(g));
    c.hasStation=R()<.6;
    c.fuelPrice=ri(7,13);          // per unit
    c.gasGiant=c.planets.some(p=>p.kind==="gas giant");
    stars.push(c);
  }
  /* guarantee a healthy station count */
  const stationStars=stars.filter(s=>s.hasStation);
  if(stationStars.length<9){
    for(const s of shuffle(stars.filter(s=>!s.hasStation)).slice(0,9-stationStars.length)) s.hasStation=true;
  }

  /* start: station system nearest center */
  const start=stars.filter(s=>s.hasStation).sort((a,b)=>hexDist(a,center)-hexDist(b,center))[0];

  /* ruins – 9, spread out, 3 hide the Star Keys */
  const ruins=[];
  cand=shuffle(all.filter(c=>c.type==="space" && hexDist(c,start)>=3));
  for(const c of cand){
    if(ruins.length>=9) break;
    if(ruins.some(rr=>hexDist(rr,c)<3)) continue;
    c.type="ruin";
    c.ruinName=pick(["Halls","Spire","Vault","Archive","Sanctum","Beacon","Temple","Orrery","Bastion"])+" of "+pick(["Ael","Vor","Ish","Ka","Ther","Om","Ryn","Zha"])+pick(["dun","reth","mai","sol","vek","ora","ith"]);
    ruins.push(c);
  }
  /* key ruins: far from start & in different thirds of the compass */
  const scored=ruins.slice().sort((a,b)=>hexDist(b,start)-hexDist(a,start));
  const keyRuins=[];
  for(const rn of scored){
    if(keyRuins.length>=3) break;
    const ang=Math.atan2(axialPx(rn.q,rn.r,1).y, axialPx(rn.q,rn.r,1).x);
    if(keyRuins.every(k=>{
      const ka=Math.atan2(axialPx(k.q,k.r,1).y, axialPx(k.q,k.r,1).x);
      let d=Math.abs(ang-ka); if(d>Math.PI) d=2*Math.PI-d;
      return d>1.1;
    })) keyRuins.push(rn);
  }
  while(keyRuins.length<3){ const rn=scored.find(r=>!keyRuins.includes(r)); keyRuins.push(rn); }
  keyRuins.forEach((rn,i)=>{ rn.keyIndex=i; });

  /* anomalies */
  cand=shuffle(all.filter(c=>c.type==="space" && hexDist(c,start)>=2));
  const anomalies=[];
  for(const c of cand){
    if(anomalies.length>=10) break;
    if(anomalies.some(a=>hexDist(a,c)<2)) continue;
    c.type="anomaly";
    anomalies.push(c);
  }

  /* the Celestial Gate – a far rim hex, hidden until 3 keys are found */
  const rim=all.filter(c=>hexDist(c,center)>=MAP_R-1 && c.type==="space")
               .sort((a,b)=>hexDist(b,start)-hexDist(a,start));
  const gate=rim[ri(0,Math.min(4,rim.length-1))];
  gate.type="gate";

  /* starfield backdrop (deterministic pretty dots) */
  const bgStars=[];
  for(let i=0;i<420;i++){
    bgStars.push({x:R()*2-1, y:R()*2-1, s:R()*1.6+.4, a:R()*.5+.15, tw:R()*6.28});
  }

  const puzzleIds=shuffle(KEY_PUZZLES.map((_,i)=>i)).slice(0,3);
  const world={seed:seedStr, cells, stars, ruins, keyRuins, anomalies, gate, start, bgStars, puzzleIds};
  attachStarAstronomy(world);
  world.clues=genClues(world);
  return world;
}

/* key ruins: distance-weighted random draw (outer ruins likelier, any reasonably distant ruin possible),
   keeping the angular-separation rule and relaxing it progressively if the draw makes it impossible.
   Uses its own seeded stream so the rest of the cluster is unaffected and stays deterministic per code. */
function chooseKeyRuins(ruins,start,rng){
  const maxDist=Math.max(1,...ruins.map(r=>hexDist(r,start)));
  const angleOf=c=>{const p=axialPx(c.q,c.r,1); return Math.atan2(p.y,p.x);};
  const angSep=(a,b)=>{let d=Math.abs(angleOf(a)-angleOf(b)); if(d>Math.PI) d=2*Math.PI-d; return d;};
  const weight=r=>Math.pow(hexDist(r,start)/maxDist,2)+0.1;
  if(ruins.length<=3) return ruins.slice();
  /* enumerate every triple that honours the separation rule (relaxing it only if none does),
     then draw one triple with probability proportional to the product of its distance weights */
  let minSep=1.1, triples=[];
  while(!triples.length && minSep>=0){
    for(let a=0;a<ruins.length;a++) for(let b=a+1;b<ruins.length;b++){
      if(angSep(ruins[a],ruins[b])<=minSep) continue;
      for(let c=b+1;c<ruins.length;c++){
        if(angSep(ruins[a],ruins[c])<=minSep||angSep(ruins[b],ruins[c])<=minSep) continue;
        triples.push([ruins[a],ruins[b],ruins[c]]);
      }
    }
    minSep-=0.2;
  }
  const weights=triples.map(t=>weight(t[0])*weight(t[1])*weight(t[2]));
  const total=weights.reduce((a,b)=>a+b,0);
  let x=rng()*total, picked=triples[triples.length-1];
  for(let i=0;i<triples.length;i++){ x-=weights[i]; if(x<0){ picked=triples[i]; break; } }
  /* order the three keys randomly so the First Key is not always the same member of the triple */
  return shuffleWith(picked.slice(),rng);
}
function shuffleWith(a,rng){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function genGalaxy(seedStr,worldVersion){
  worldVersion=Number(worldVersion)||WORLD_VERSION;
  R=mulberry32(hashStr(seedStr));
  const context=galacticContext(seedStr);
  const rules=SECTOR_RULES[context.id]||SECTOR_RULES.orion;
  const profile=clusterProfile(seedStr,context);
  const cells=new Map();
  for(let q=-MAP_R;q<=MAP_R;q++){
    for(let r=Math.max(-MAP_R,-q-MAP_R); r<=Math.min(MAP_R,-q+MAP_R); r++){
      cells.set(hk(q,r),{q,r,type:"space"});
    }
  }
  const all=[...cells.values()];
  const at=(q,r)=>cells.get(hk(q,r));
  const center={q:0,r:0};

  /* nebula blobs – drifting random walks */
  const nebCount=ri(rules.nebula[0],rules.nebula[1]);
  for(let n=0;n<nebCount;n++){
    let c=pick(all.filter(c=>hexDist(c,center)>=3));
    const len=ri(5,9);
    const nebName=regionName(seedStr,"nebula-"+n,"nebula");
    for(let i=0;i<len;i++){

      const nx=at(c.q+d[0], c.r+d[1]);
      if(nx) c=nx;
    }
  }
  /* asteroid fields */
  let empt=shuffle(all.filter(c=>c.type==="space" && hexDist(c,center)>=2));
  for(let i=0;i<rules.asteroids && empt.length;i++){ const a=empt.pop(); a.type="asteroid"; a.regionName=regionName(seedStr,"asteroid-"+i,"asteroid"); }

  /* star systems – spaced out */
  const stars=[];
  const usedNames=new Set();
  const mkName=()=>{
    for(let t=0;t<40;t++){
      const n=pick(SYL1)+pick(SYL2)+(R()<.22?pick(SUFFIX):"");
      if(!usedNames.has(n)){usedNames.add(n); return n;}
    }
    return "Star-"+ri(100,999);
  };
  let cand=shuffle(all.filter(c=>c.type==="space"));
  for(const c of cand){
    if(stars.length>=26) break;
    if(stars.some(s=>hexDist(s,c)<2)) continue;
    c.type="star";
    c.name=mkName();
    c.color=weightedStarColor(rules.weights);
    c.planets=[];
    const np=ri(1,3);
    const goodPool=shuffle(GOODS.map(g=>g.id));
    for(let p=0;p<np;p++){
      c.planets.push({
        name:c.name+" "+["I","II","III"][p],
        kind:pick(["rocky","oceanic","gas giant","frozen","verdant","desert"]),
      });
    }
    /* economy: produces are cheap here, wants are pricey */
    c.produces=goodPool.slice(0,ri(1,2));
    c.wants=goodPool.slice(3,3+ri(1,2)).filter(g=>!c.produces.includes(g));
    c.hasStation=R()<rules.stationRate;
    c.fuelPrice=ri(7,13);          // per unit
    c.gasGiant=c.planets.some(p=>p.kind==="gas giant");
    stars.push(c);
  }
  /* guarantee a healthy station count */
  const stationStars=stars.filter(s=>s.hasStation);
  if(stationStars.length<rules.minStations){
    for(const s of shuffle(stars.filter(s=>!s.hasStation)).slice(0,rules.minStations-stationStars.length)) s.hasStation=true;
  }

  /* start: station system nearest center */
  const start=stars.filter(s=>s.hasStation).sort((a,b)=>hexDist(a,center)-hexDist(b,center))[0];

  /* ruins – 9, spread out, 3 hide the Star Keys */
  const ruins=[];
  cand=shuffle(all.filter(c=>c.type==="space" && hexDist(c,start)>=3));
  for(const c of cand){
    if(ruins.length>=9) break;
    if(ruins.some(rr=>hexDist(rr,c)<3)) continue;
    c.type="ruin";
    c.ruinName=pick(["Halls","Spire","Vault","Archive","Sanctum","Beacon","Temple","Orrery","Bastion"])+" of "+pick(["Ael","Vor","Ish","Ka","Ther","Om","Ryn","Zha"])+pick(["dun","reth","mai","sol","vek","ora","ith"]);
    c.ruinMotif=pick(["a ceiling mapped with extinct constellations","doorways cut in repeating prime-number intervals","walls patterned with handprints from several unknown species","a silent orrery whose planets still turn","black-glass corridors that reflect stars not on your chart","carvings of ships crossing a many-armed spiral"]);
    c.ruinMood=pick(["solemn","luminous","windless","strangely welcoming","mathematically precise","half-buried in silver dust"]);

  /* key ruins: distance-weighted random draw & in different thirds of the compass
     (worlds saved before version 4 keep the old farthest-first rule so they restore unchanged) */
  let keyRuins;

  cand=shuffle(all.filter(c=>c.type==="space" && hexDist(c,start)>=2));

  for(const c of cand){

    anomalies.push(c);
  }

  /* the Celestial Gate – a far rim hex, hidden until 3 keys are found */
  const rim=all.filter(c=>hexDist(c,center)>=MAP_R-1 && c.type==="space")
               .sort((a,b)=>hexDist(b,start)-hexDist(a,start));
  const gate=rim[ri(0,Math.min(4,rim.length-1))];
  gate.type="gate";

  /* starfield backdrop (deterministic pretty dots) */
  const bgStars=[];
  for(let i=0;i<420;i++){
    bgStars.push({x:R()*2-1, y:R()*2-1, s:R()*1.6+.4, a:R()*.5+.15, tw:R()*6.28});
  }

  const puzzleIds=shuffle(KEY_PUZZLES.map((_,i)=>i)).slice(0,3);
  const world={seed:seedStr, cells, stars, ruins, keyRuins, anomalies, gate, start, bgStars, puzzleIds, context, profile};
  attachStarAstronomy(world);
  attachLocalIdentity(world);
  world.clues=genClues(world);
  return world;
}

/* ---------- clue engine: true statements about each key ruin ---------- */
/* the properties every clue describes, computed for any ruin so Key ruins can be checked for uniqueness */
function ruinSignature(ruin,world){
  const {cells, stars}=world;
  const all=[...cells.values()];
  const px=axialPx(ruin.q,ruin.r,1);
  let ang=Math.atan2(-px.y,px.x)*180/Math.PI; if(ang<0)ang+=360;
  const quarter=["east","north","west","south"][Math.round(ang/90)%4];
  const d=hexDist(ruin,{q:0,r:0});
  const ring=d>=6?"outer":d<=3?"heart":"middle";
  const near=stars.slice().sort((a,b)=>hexDist(a,ruin)-hexDist(b,ruin))[0];
  const nd=hexDist(near,ruin);
  const starJumps=nd<=3?nd:"deep";
  const nearNeb=all.some(c=>c.type==="nebula" && hexDist(c,ruin)<=2);
  const nearAst=all.some(c=>c.type==="asteroid" && hexDist(c,ruin)<=2);
  const feature=nearNeb?"nebula":nearAst?"asteroid":"clear";
  return {quarter, ring, starJumps, feature, starColour:near.color.name, station:!!near.hasStation, near, centreDist:d};
}
function sameSignature(a,b){
  return a.quarter===b.quarter && a.ring===b.ring && a.starJumps===b.starJumps &&
         a.feature===b.feature && a.starColour===b.starColour && a.station===b.station;
}
/* one extra clue that tells a Key ruin apart from every ruin sharing its signature – deterministic, first rule that works */
function fallbackClue(kr,others,world){
  const centre={q:0,r:0};
  const d=hexDist(kr,centre);
  if(others.every(o=>hexDist(o,centre)!==d)) return `lies exactly ${d} jump${d===1?"":"s"} from the cluster's centre`;
  const stations=world.stars.filter(s=>s.hasStation);
  if(stations.length){
    const stDist=c=>Math.min(...stations.map(s=>hexDist(s,c)));
    const sd=stDist(kr);
    if(others.every(o=>stDist(o)!==sd)) return `lies ${sd} jump${sd===1?"":"s"} from the nearest station`;
  }
  for(const a of world.stars){
    for(const b of world.stars){
      if(a===b) continue;
      if(hexDist(a,kr)<hexDist(b,kr) && others.every(o=>hexDist(a,o)>=hexDist(b,o)))
        return `lies closer to ${a.name} than to ${b.name}`;
    }
  }
  const sd=hexDist(kr,world.start);
  if(others.every(o=>hexDist(o,world.start)!==sd)) return `lies exactly ${sd} jump${sd===1?"":"s"} from ${world.start.name}, where your voyage began`;
  /* last resort – name the exact direction from the centre in degrees (unique unless two ruins share a hex) */
  const px=axialPx(kr.q,kr.r,1); let ang=Math.round(Math.atan2(-px.y,px.x)*180/Math.PI); if(ang<0)ang+=360;
  return `lies ${d} jump${d===1?"":"s"} from the centre at a bearing of ${ang}°`;
}
function genClues(world){
  const clues=[[],[],[]];
  const sigs=new Map(world.ruins.map(r=>[r,ruinSignature(r,world)]));
  world.keyRuins.forEach((kr,i)=>{
    const sig=sigs.get(kr)||ruinSignature(kr,world);
    const near=sig.near;
    /* direction clue */
    clues[i].push(`lies in the broad ${sig.quarter}ern quarter of the cluster`);
    /* ring clue */
    clues[i].push(sig.ring==="outer"?`rests far from the cluster's heart – the outer reaches`:
                  sig.ring==="heart"?`rests near the cluster's bright heart`:
                  `rests in the middle rings, neither heart nor rim`);
    /* nearest star clue */
    if(sig.starJumps!=="deep") clues[i].push(`waits ${sig.starJumps} jump${sig.starJumps>1?"s":""} from its nearest star`);
    else clues[i].push(`hides in deep space, no star within 3 jumps`);
    /* feature clue */
    if(sig.feature==="nebula") clues[i].push(`is veiled – a nebula drifts within 2 jumps`);
    else if(sig.feature==="asteroid") clues[i].push(`is guarded – an asteroid field tumbles within 2 jumps`);
    else clues[i].push(`sits in clear, open space – no nebula or asteroids within 2 jumps`);
    /* nearest-star character clue – useful in combination, not a direct name reveal */
    clues[i].push(`has a ${near.color.name} star as its nearest sun, ${near.hasStation?"with a station in that system":"with no station in that system"}`);
    /* uniqueness: if another ruin would answer to the same description, add one clue that separates them */
    const twins=world.ruins.filter(o=>o!==kr && sameSignature(sigs.get(o)||ruinSignature(o,world),sig));
    if(twins.length) clues[i].push(fallbackClue(kr,twins,world));
  });
  return clues;
}

function newGame(seedStr, diffKey){
  W=genGalaxy(seedStr);
  RD=mulberry32(hashStr(seedStr+"::drama")^0x9e3779b9);
  rdCalls=0;
  const D=DIFF[diffKey];
  S={
    seed:seedStr, diff:diffKey, worldVersion:WORLD_VERSION,
    day:1, dayLimit:D.days,
    fuel:D.fuel, fuelMax:D.fuelMax,
    hull:10, hullMax:10,
    credits:D.credits,
    cargo:{}, cargoMax:6,
    scanRange:2, speed:1,
    upgrades:{tank:0,cargo:0,scanner:0,engine:0,mining:false,hull:0},
    pos:{q:W.start.q, r:W.start.r},
    visited:new Set(), scanned:new Set(),
    keys:[false,false,false],
    foundClues:[[],[],[]],           // indices into W.clues[i]
    ruinsDone:new Set(),             // hk of explored ruins
    anomsDone:new Set(),
    gasScooped:new Set(),
    atlasSeen:new Set(),
    surveysDone:new Set(),
    discoveries:new Set([hk(W.start.q,W.start.r)]),
    seenEvents:[],

    gateRevealed:false,

    log:[],
    eventCooldown:0,
    pendingEvent:null,              // lets autosave restore an unresolved encounter
    pendingArrival:false,            // processes Fold-in-Space landing after its event modal
    marketMemory:{},                 // per-star daily wiggles are derived, not stored
  };
  scanAround(S.pos, S.scanRange);
  visit(S.pos);
  log(`Charter granted. The <b>${W.start.name}</b> station wishes you fair skies.`);
  log(`Scientific setting: <b>${W.context.place}</b>, about <b>${W.context.distanceLy.toLocaleString()} light-years</b> from the Solar System (fictional survey chart in a real Galactic context).`);
  log(`Survey character: <b>${W.profile.name}</b> – ${W.profile.blurb}`);
  log(`Find the <b>3 Star Keys</b> hidden in ancient ruins, then reach the <b>Celestial Gate</b> – all before day ${S.dayLimit}.`);
  cam.x=0; cam.y=0; cam.zoom=initialChartZoom();
  centerOnShip(false);
  selected=null;
  refreshAll();
  stopAmbient(); startAmbient();
}

function cellAt(q,r){ return W.cells.get(hk(q,r)); }
function curCell(){ return cellAt(S.pos.q,S.pos.r); }
function scanAround(pos,rad){
  for(const c of W.cells.values()){
    if(hexDist(c,pos)<=rad) S.scanned.add(hk(c.q,c.r));
  }
}
function visit(pos){ S.visited.add(hk(pos.q,pos.r)); }
function isScanned(c){ return S.scanned.has(hk(c.q,c.r)); }
function isVisited(c){ return S.visited.has(hk(c.q,c.r)); }
function cargoCount(){ return Object.values(S.cargo).reduce((a,b)=>a+b,0); }
function log(msg){
  S.log.push({d:S.day, msg});
  if(S.log.length>80) S.log.shift();
  renderLog();
}

/* ---------- prices: deterministic per star per day ---------- */
function priceOf(star, goodId){
  const g=GOOD[goodId];
  let m=1;
  if(star.produces.includes(goodId)) m=0.55+0.1*wiggle(star.name+goodId,0);
  else if(star.wants.includes(goodId)) m=1.55+0.35*wiggle(star.name+goodId,1);
  else m=0.92+0.22*wiggle(star.name+goodId,2);
  const w=0.9+0.2*wiggle(star.name+goodId+Math.floor(S.day/3),3);
  return Math.max(4, Math.round(g.base*m*w));
}
function buyPriceOf(star,goodId){return Math.max(4,Math.ceil(priceOf(star,goodId)*1.06));}
function sellPriceOf(star,goodId){return Math.max(3,Math.floor(priceOf(star,goodId)*0.94));}
function wiggle(str,salt){ return mulberry32(hashStr(str+"|"+salt))(); }

   RENDERING

const cv=document.getElementById("cv");
const cx=cv.getContext("2d");
const cam={x:0,y:0,zoom:1};
const HEX=34;                       // base hex size in world units
let DPR=1, cw=0, ch=0;
let selected=null;                  // {q,r} selected target cell
let hoverCell=null;
let animT=0, lastFrame=0;
let recentRoute=null, routeTrailUntil=0, scanPulse=null;
const REDUCED_MOTION=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function initialChartZoom(){
  const w=window.innerWidth||1024,h=window.innerHeight||768;
  if(w<=600) return .78;
  if(w<=900 || (w<=1100&&h>w)) return .90;
  return 1;
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  const rct=cv.getBoundingClientRect();
  cw=rct.width; ch=rct.height;
  const bw=Math.round(cw*DPR), bh=Math.round(ch*DPR);
  // Avoid clearing/reallocating the canvas when only a ResizeObserver callback repeats
  // the same dimensions during a responsive layout transition.
  if(cv.width!==bw) cv.width=bw;
  if(cv.height!==bh) cv.height=bh;
}
window.addEventListener("resize",()=>{resize();if(!isSheetUI())setSheetExpanded(false);});
if(window.visualViewport) window.visualViewport.addEventListener("resize",resize);
// The portrait information sheet animates its flex-basis. Window resize does not fire
// for each intermediate size, so keep the canvas backing store and hit-test metrics in
// lockstep with its actual rendered dimensions throughout that animation.
if(window.ResizeObserver){
  const mapResizeObserver=new ResizeObserver(()=>resize());
  mapResizeObserver.observe(document.getElementById("mapWrap"));
}

function worldToScreen(wx,wy){
  return {x:(wx-cam.x)*cam.zoom + cw/2, y:(wy-cam.y)*cam.zoom + ch/2};
}
function screenToWorld(sx,sy){
  return {x:(sx-cw/2)/cam.zoom + cam.x, y:(sy-ch/2)/cam.zoom + cam.y};
}
function pxToHex(wx,wy){
  const q=(SQ3/3*wx - 1/3*wy)/HEX, r=(2/3*wy)/HEX;
  /* cube round */
  let x=q, z=r, y=-x-z;
  let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
  const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
  if(dx>dy&&dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
  return {q:rx,r:rz};
}
function hexCorners(cxp,cyp,s){
  const pts=[];
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-30);
    pts.push([cxp+s*Math.cos(a), cyp+s*Math.sin(a)]);
  }
  return pts;
}
function tracePoly(pts){
  cx.beginPath(); cx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) cx.lineTo(pts[i][0],pts[i][1]);
  cx.closePath();
}

function centerOnShip(smooth){
  const p=axialPx(S.pos.q,S.pos.r,HEX);
  if(smooth){ camTarget={x:p.x,y:p.y}; } else { cam.x=p.x; cam.y=p.y; camTarget=null; }
}
let camTarget=null;

function draw(ts){
  const frameInterval=REDUCED_MOTION?100:33.333;
  if(document.hidden){requestAnimationFrame(draw);return;}
  if(lastFrame&&ts-lastFrame<frameInterval){requestAnimationFrame(draw);return;}
  lastFrame=ts;
  animT=ts/1000;
  if(camTarget){
    cam.x+=(camTarget.x-cam.x)*.12; cam.y+=(camTarget.y-cam.y)*.12;
    if(Math.abs(camTarget.x-cam.x)<0.5 && Math.abs(camTarget.y-cam.y)<0.5) camTarget=null;
  }
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.clearRect(0,0,cw,ch);
  /* backdrop */
  const bg=cx.createRadialGradient(cw/2,ch/2,60,cw/2,ch/2,Math.max(cw,ch)*.75);
  bg.addColorStop(0,"#0a1024"); bg.addColorStop(.55,"#060a18"); bg.addColorStop(1,"#03040a");
  cx.fillStyle=bg; cx.fillRect(0,0,cw,ch);
  if(W){
    /* parallax starfield */
    for(const st of W.bgStars){
      const px=((st.x*900 - cam.x*.25)%1800+1800)%1800-900;
      const py=((st.y*900 - cam.y*.25)%1800+1800)%1800-900;
      const sx=px+cw/2, sy=py+ch/2;
      if(sx<-5||sy<-5||sx>cw+5||sy>ch+5) continue;
      const tw=.6+.4*Math.sin(animT*1.3+st.tw);
      cx.globalAlpha=st.a*tw;
      cx.fillStyle="#cdd8ff";
      cx.fillRect(sx,sy,st.s,st.s);
    }
    cx.globalAlpha=1;
    drawCluster();
  }
  requestAnimationFrame(draw);
}

function drawCluster(){
  const hs=HEX*cam.zoom;
  const pathSet=previewPath? new Set(previewPath.map(c=>hk(c.q,c.r))) : null;
  if(previewPath&&previewPath.length){
    const allPts=[S.pos,...previewPath]; cx.save();cx.beginPath();
    allPts.forEach((pt,i)=>{const p=axialPx(pt.q,pt.r,HEX),sp=worldToScreen(p.x,p.y);if(i===0)cx.moveTo(sp.x,sp.y);else cx.lineTo(sp.x,sp.y);});
    cx.strokeStyle="rgba(95,214,232,.38)";cx.lineWidth=1.5;cx.setLineDash([4,5]);cx.stroke();cx.setLineDash([]);cx.restore();
  }
  for(const c of W.cells.values()){
    const p=axialPx(c.q,c.r,HEX);
    const s=worldToScreen(p.x,p.y);
    if(s.x<-hs*2||s.y<-hs*2||s.x>cw+hs*2||s.y>ch+hs*2) continue;
    const scanned=isScanned(c), visited=isVisited(c);
    const pts=hexCorners(s.x,s.y,hs*.96);
    /* fill */
    if(!scanned){
      tracePoly(pts); cx.fillStyle="rgba(16,22,44,.42)"; cx.fill();
      cx.strokeStyle="rgba(52,66,110,.28)"; cx.lineWidth=1; cx.stroke();
      continue;
    }
    tracePoly(pts);
    let fill="rgba(22,32,62,.55)";
    if(c.type==="nebula") fill="rgba(120,80,200,.30)";
    cx.fillStyle=fill; cx.fill();
    cx.strokeStyle=visited?"rgba(95,150,220,.55)":"rgba(60,80,140,.5)";
    cx.lineWidth=visited?1.4:1;
    cx.stroke();
    /* path highlight */
    if(pathSet && pathSet.has(hk(c.q,c.r))){
      tracePoly(hexCorners(s.x,s.y,hs*.82));
      cx.strokeStyle="rgba(95,214,232,.85)"; cx.lineWidth=2; cx.stroke();
    }
    /* selected */
    if(selected && selected.q===c.q && selected.r===c.r){
      tracePoly(hexCorners(s.x,s.y,hs*.9));
      cx.strokeStyle="#ffcf6b"; cx.lineWidth=2.2; cx.stroke();
    }
    drawFeature(c,s,hs,visited);
  }
  drawRouteTrail();
  drawScanPulse();
  /* the ship */
  const sp=axialPx(S.pos.q,S.pos.r,HEX);
  const ss=worldToScreen(sp.x,sp.y);
  const pulse=1+0.08*Math.sin(animT*3);
  cx.save();
  cx.translate(ss.x,ss.y);
  cx.scale(cam.zoom*pulse,cam.zoom*pulse);
  cx.shadowColor="#5fd6e8"; cx.shadowBlur=14;
  cx.fillStyle="#eaf6ff";
  cx.beginPath();
  cx.moveTo(0,-12); cx.lineTo(9,10); cx.lineTo(0,5); cx.lineTo(-9,10); cx.closePath();
  cx.fill();
  cx.shadowBlur=0;
  cx.fillStyle="#5fd6e8";
  cx.beginPath(); cx.arc(0,0,3,0,7); cx.fill();
  cx.restore();
}

function drawRouteTrail(){
  if(!recentRoute||recentRoute.length<2||performance.now()>routeTrailUntil){recentRoute=null;return;}
  const remain=Math.max(0,(routeTrailUntil-performance.now())/1800);
  cx.save(); cx.lineCap="round"; cx.lineJoin="round";
  cx.beginPath();
  recentRoute.forEach((pt,i)=>{const p=axialPx(pt.q,pt.r,HEX),s=worldToScreen(p.x,p.y); if(i===0)cx.moveTo(s.x,s.y); else cx.lineTo(s.x,s.y);});
  cx.strokeStyle=`rgba(95,214,232,${.18+.45*remain})`; cx.lineWidth=3; cx.shadowColor="#5fd6e8";cx.shadowBlur=9;cx.stroke();
  cx.shadowBlur=0; cx.restore();
}
function drawScanPulse(){
  if(!scanPulse||REDUCED_MOTION)return;
  const age=performance.now()-scanPulse.t; if(age>900){scanPulse=null;return;}
  const p=axialPx(scanPulse.q,scanPulse.r,HEX),s=worldToScreen(p.x,p.y);
  const k=age/900,rad=(18+120*k)*cam.zoom;
  cx.save();cx.globalAlpha=(1-k)*.55;cx.strokeStyle="#5fd6e8";cx.lineWidth=1.5;cx.beginPath();cx.arc(s.x,s.y,rad,0,Math.PI*2);cx.stroke();cx.restore();
}
function drawFeature(c,s,hs,visited){
  const dim=visited?1:.62;
  cx.save();
  cx.translate(s.x,s.y);
  cx.globalAlpha=dim;
  if(c.type==="star"){
    const grad=cx.createRadialGradient(0,0,1,0,0,hs*.55);
    grad.addColorStop(0,c.color.col); grad.addColorStop(.45,c.color.col+"");
    grad.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=grad;
    cx.beginPath(); cx.arc(0,0,hs*.55,0,7); cx.fill();
    cx.fillStyle="#fff";
    cx.beginPath(); cx.arc(0,0,hs*.16,0,7); cx.fill();
    if(c.hasStation){
      cx.strokeStyle="#dfe7ff"; cx.lineWidth=1.4*cam.zoom;
      cx.strokeRect(hs*.28,-hs*.5,hs*.24,hs*.24);
    }
    if(visited || hexDist(c,S.pos)<=S.scanRange+1){
      cx.fillStyle="rgba(223,231,255,.85)";
      cx.font=`${Math.max(9,10*cam.zoom)}px sans-serif`;
      cx.textAlign="center";
      cx.fillText(c.name, 0, hs*.85);
    }
  }else if(c.type==="nebula"){
    for(let i=0;i<3;i++){
      const a=i*2.1+ (c.q*3+c.r*7)%6;
      cx.fillStyle=`rgba(${150+i*20},${90+i*15},${220},${.14})`;
      cx.beginPath(); cx.arc(Math.cos(a)*hs*.25, Math.sin(a)*hs*.22, hs*.38,0,7); cx.fill();
    }
  }else if(c.type==="asteroid"){
    cx.fillStyle="#9aa2b5";
    const seedn=(c.q*31+c.r*17);
    for(let i=0;i<5;i++){
      const a=i*1.256+seedn, rr=hs*(.12+.22*((seedn+i*7)%10)/10);
      cx.beginPath(); cx.arc(Math.cos(a)*rr, Math.sin(a)*rr, hs*.07+((i%3))*hs*.02,0,7); cx.fill();
    }
  }else if(c.type==="ruin"){
    const done=S.ruinsDone.has(hk(c.q,c.r));
    cx.strokeStyle=done?"#8d9ac0":"#b79bff";
    cx.lineWidth=2*cam.zoom;
    cx.beginPath();
    cx.moveTo(-hs*.26,hs*.28); cx.lineTo(-hs*.26,-hs*.18);
    cx.moveTo(0,hs*.28); cx.lineTo(0,-hs*.34);
    cx.moveTo(hs*.26,hs*.28); cx.lineTo(hs*.26,-hs*.18);
    cx.stroke();
    cx.beginPath(); cx.moveTo(-hs*.36,hs*.3); cx.lineTo(hs*.36,hs*.3); cx.stroke();
    if(!done){
      cx.fillStyle="rgba(183,155,255,.85)";
      const tw=.5+.5*Math.sin(animT*2.2+c.q);
      cx.globalAlpha=dim*tw;
      cx.beginPath(); cx.arc(0,-hs*.44,hs*.07,0,7); cx.fill();
      cx.globalAlpha=dim;
    }
    const mark=S.ruinMarks&&S.ruinMarks[hk(c.q,c.r)];
    if(mark){
      cx.globalAlpha=1;
      cx.font=`${Math.max(11,14*cam.zoom)}px sans-serif`;
      cx.textAlign="center";
      cx.fillStyle=mark==="suspect"?"#ffcf6b":"#ff8080";
      cx.fillText(mark==="suspect"?"★":"×", hs*.42,-hs*.38);
    }
  }else if(c.type==="anomaly"){
    if(!S.anomsDone.has(hk(c.q,c.r))){
      const tw=.55+.45*Math.sin(animT*2.6+c.r);
      cx.globalAlpha=dim*tw;
      cx.strokeStyle="#5fd6e8"; cx.lineWidth=1.6*cam.zoom;
      cx.beginPath();
      cx.moveTo(0,-hs*.3); cx.lineTo(hs*.26,0); cx.lineTo(0,hs*.3); cx.lineTo(-hs*.26,0);
      cx.closePath(); cx.stroke();
      cx.fillStyle="#5fd6e8";
      cx.beginPath(); cx.arc(0,0,hs*.06,0,7); cx.fill();
    }
  }else if(c.type==="gate"){
    if(S.gateRevealed){
      const tw=1+.12*Math.sin(animT*2);
      cx.strokeStyle="#ffcf6b"; cx.lineWidth=3*cam.zoom;
      cx.shadowColor="#ffcf6b"; cx.shadowBlur=16;
      cx.beginPath(); cx.arc(0,0,hs*.42*tw,0,7); cx.stroke();
      cx.beginPath(); cx.arc(0,0,hs*.2,0,7);
      cx.strokeStyle="#fff"; cx.lineWidth=1.5*cam.zoom; cx.stroke();
      cx.shadowBlur=0;
    }
  }
  /* key glint on visited-but-undone key ruins is intentionally hidden – clues guide you */
  cx.restore();
}

   INPUT: pan / zoom / hover / select
   ============================================================ */
let dragging=false, dragMoved=false, lastMx=0, lastMy=0;
let previewPath=null;

cv.addEventListener("mousedown",e=>{ dragging=true; dragMoved=false; lastMx=e.clientX; lastMy=e.clientY; cv.classList.add("drag"); });
window.addEventListener("mousemove",e=>{
  if(dragging){
    const dx=e.clientX-lastMx, dy=e.clientY-lastMy;
    if(Math.abs(dx)+Math.abs(dy)>3) dragMoved=true;
    cam.x-=dx/cam.zoom; cam.y-=dy/cam.zoom;

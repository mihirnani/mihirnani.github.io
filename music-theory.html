<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmonia — Interactive Music Theory & Ear Training</title>
<meta name="description" content="An interactive music theory course with adaptive ear training, rhythm practice, notation, harmony labs, public-domain musical examples, quizzes and spaced repetition.">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Harmonia">
<link rel="manifest" href="./music-theory-manifest.json">
<link rel="apple-touch-icon" href="./music-theory-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./music-theory-icon-192.png">

<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f0efec;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --accent: #6d28d9;
    --accent-soft: #efe9fb;
    --blue: #2a78d6;
    --blue-soft: #e6f0fb;
    --good: #0ca30c;
    --good-text: #006300;
    --bad: #d03b3b;
    --warn: #b97a00;
    --gold: #eda100;
    --shadow: 0 1px 3px rgba(11,11,11,0.06), 0 4px 14px rgba(11,11,11,0.05);
    --radius: 12px;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --accent: #a78bfa;
    --accent-soft: #2a2140;
    --blue: #3987e5;
    --blue-soft: #16243a;
    --good: #0ca30c;
    --good-text: #2fc32f;
    --bad: #e66767;
    --warn: #c98500;
    --gold: #c98500;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.55;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- layout ---------- */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 250px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--hairline); padding: 18px 14px 30px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .logo { display:flex; align-items:center; gap:10px; padding: 4px 8px 14px; }
  .logo .flag { width: 30px; height: 21px; border-radius: 4px; overflow: hidden; display:flex; box-shadow: 0 0 0 1px var(--border); flex-shrink:0; }
  .logo .flag i { flex: 1; }
  .logo .flag i:nth-child(1){ background:#fdfdfb; } .logo .flag i:nth-child(2){ background:#191919; } .logo .flag i:nth-child(3){ background:#fdfdfb; }
  .logo b { font-size: 17px; letter-spacing: -0.01em; }
  .logo small { display:block; color: var(--muted); font-weight: 400; font-size: 11.5px; margin-top:-2px; }
  .navsec { margin-top: 10px; }
  .navsec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 8px 6px; font-weight: 600; }
  .navlink {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px;
    color: var(--ink-2); cursor: pointer; font-size: 14.5px; border: none; background: none;
    width: 100%; text-align: left; font-family: inherit;
  }
  .navlink:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
  .navlink.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .navlink .ic { width: 20px; text-align: center; flex-shrink: 0; font-size: 15px; }
  .navlink .lvlbadge { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; }
  .navlink .donecount { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .main { flex: 1; min-width: 0; padding: 28px 34px 80px; max-width: 980px; margin: 0 auto; }

  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--hairline); padding: 12px 14px; }
    .navwrap { display: flex; flex-wrap: wrap; gap: 4px; }
    .navsec h4 { display: none; }
    .navlink { width: auto; padding: 6px 10px; }
    .navlink .donecount, .navlink .lvlbadge { display:none; }
    .main { padding: 20px 16px 70px; width: 100%; max-width: 100%; min-width: 0; overflow-x: hidden; }
    .grammar-body, .vocabtable { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.gr { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .fcgrades { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- generic components ---------- */
  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  h2 { font-size: 20px; letter-spacing: -0.01em; margin: 26px 0 10px; }
  h3 { font-size: 16.5px; margin: 20px 0 8px; }
  .sub { color: var(--ink-2); margin: 0 0 20px; font-size: 15px; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); letter-spacing: 0.03em; }
  .pill.acc { background: var(--accent-soft); color: var(--accent); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 9px;
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
    font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.subtle { border: none; background: none; color: var(--blue); padding: 6px 8px; }
  .btn.small { padding: 5px 11px; font-size: 13px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .progressbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .progressbar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.4s ease; }
  .progressbar.blue > i { background: var(--blue); }
  table.gr { border-collapse: collapse; width: 100%; max-width: 100%; margin: 10px 0 14px; font-size: 14.5px; }
  table.gr th, table.gr td { border: 1px solid var(--hairline); padding: 7px 11px; text-align: left; }
  table.gr th { background: var(--surface-2); font-weight: 600; font-size: 13.5px; }
  table.gr td b, .it { color: var(--accent); font-style: normal; }
  .tip { border-left: 3px solid var(--gold); background: var(--surface-2); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; font-size: 14.5px; }
  .tip b:first-child { color: var(--warn); }
  .exwrap { border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; margin: 10px 0; background: var(--surface); }
  .exwrap .q { font-size: 15.5px; margin-bottom: 10px; }
  .exwrap .qnum { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-right: 6px; }
  .opts { display: flex; flex-direction: column; gap: 7px; }
  .optbtn { text-align: left; padding: 9px 13px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--surface); cursor: pointer; font-size: 14.5px; font-family: inherit; color: var(--ink); }
  .optbtn:hover { background: var(--surface-2); }
  .optbtn.right { border-color: var(--good); background: var(--accent-soft); font-weight: 600; }
  .optbtn.wrong { border-color: var(--bad); opacity: 0.85; }
  .optbtn:disabled { cursor: default; }
  .fillrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fillrow input { flex: 1; min-width: 180px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--hairline); background: var(--page); color: var(--ink); font-size: 15px; font-family: inherit; }
  .fillrow input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .verdict { margin-top: 9px; font-size: 14px; font-weight: 600; }
  .verdict.ok { color: var(--good-text); }
  .verdict.no { color: var(--bad); }
  .verdict .expl { font-weight: 400; color: var(--ink-2); display: block; margin-top: 2px; }
  .speakbtn { border: none; background: none; cursor: pointer; font-size: 15px; padding: 2px 5px; border-radius: 6px; }
  .speakbtn:hover { background: var(--surface-2); }
  .accents { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .accents button { border: 1px solid var(--hairline); background: var(--surface-2); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 14px; color: var(--ink); font-family: inherit; }
  .accents button:hover { background: var(--hairline); }

  /* dashboard */
  .statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 15px 17px; box-shadow: var(--shadow); }
  .stat .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .lvlcard { display: block; color: inherit; cursor: pointer; }
  .lvlcard:hover { text-decoration: none; border-color: var(--muted); }
  .lvlcard .top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .lvlcard .top b { font-size: 17px; }
  .lvlcard .top span { color: var(--muted); font-size: 13.5px; }
  .lvlcard .pct { margin-left: auto; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }

  /* unit list */
  .unitrow { display: flex; align-items: center; gap: 13px; padding: 13px 16px; border: 1px solid var(--hairline); border-radius: 10px; margin-bottom: 9px; background: var(--surface); cursor: pointer; box-shadow: var(--shadow); }
  .unitrow:hover { border-color: var(--muted); text-decoration: none; }
  .unitrow .num { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--ink-2); flex-shrink: 0; }
  .unitrow.done .num { background: var(--accent); color: #fff; }
  .unitrow .t { flex: 1; min-width: 0; }
  .unitrow .t b { display: block; font-size: 15.5px; color: var(--ink); }
  .unitrow .t small { color: var(--muted); font-size: 13px; }
  .unitrow .score { font-size: 13px; color: var(--good-text); font-weight: 600; white-space: nowrap; }

  /* unit page tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin: 18px 0 20px; flex-wrap: wrap; }
  .tab { padding: 9px 15px; border: none; background: none; font-family: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .vocabtable { width: 100%; border-collapse: collapse; }
  .vocabtable td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); font-size: 15px; }
  .vocabtable td:first-child { font-weight: 600; color: var(--accent); width: 42%; }
  .vocabtable tr:hover td { background: var(--surface-2); }
  .example { padding: 9px 0; border-bottom: 1px dashed var(--hairline); font-size: 15px; }
  .example .en { color: var(--muted); font-size: 13.5px; display: block; }

  /* flashcards */
  .fcstage { max-width: 560px; margin: 0 auto; }
  .fcard { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow); min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; cursor: pointer; }
  .fcard .big { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .fcard .ans { font-size: 21px; color: var(--ink-2); margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--hairline); width: 80%; }
  .fcard .hintline { color: var(--muted); font-size: 13px; margin-top: 18px; }
  .fcgrades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .fcgrades button { padding: 11px 6px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--ink); }
  .fcgrades button small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .fcgrades button:hover { background: var(--surface-2); }
  .fcgrades .g-again { border-bottom: 3px solid var(--bad); }
  .fcgrades .g-hard { border-bottom: 3px solid var(--gold); }
  .fcgrades .g-good { border-bottom: 3px solid var(--blue); }
  .fcgrades .g-easy { border-bottom: 3px solid var(--good); }
  .fcmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  /* quiz */
  .quizhead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .quizhead .progressbar { flex: 1; }
  .bigresult { text-align: center; padding: 30px 20px; }
  .bigresult .pct { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; }
  .bigresult .msg { font-size: 17px; color: var(--ink-2); margin: 6px 0 20px; }

  /* toast + banner */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 20px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 50; }
  #toast.show { opacity: 1; }
  .banner { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 16px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 16px; }
  .searchbox { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); font-size: 15px; font-family: inherit; margin-bottom: 14px; }
  .phrase-cat h3 { margin-top: 24px; }
  kbd { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 5px; padding: 1px 6px; font-size: 12.5px; font-family: inherit; }
  .footer-note { color: var(--muted); font-size: 12.5px; margin-top: 40px; text-align: center; }
  .playbtn { border: 1px solid var(--hairline); background: var(--surface-2); cursor: pointer; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; color: var(--accent); font-family: inherit; vertical-align: middle; }
  .playbtn:hover { background: var(--hairline); }
  .exmedia { margin: 8px 0 12px; }
  .pianowrap { overflow-x: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
  .staffwrap { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; overflow-x: auto; }
  .staffsvg { display: block; }
  .grammar-body .pianowrap, .grammar-body .staffwrap { margin: 10px 0; }
  .grammar-body p { margin: 9px 0; }
  .grammar-body ul { margin: 8px 0; padding-left: 22px; }
  .grammar-body li { margin: 4px 0; }
  .checklist { list-style: none; padding: 0; }
  .checklist li { padding: 4px 0 4px 26px; position: relative; }
  .checklist li::before { content: "✓"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }


  /* ---------- interactive laboratories ---------- */
  .labgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin:14px 0 22px; }
  .labcard { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); padding:17px 18px; box-shadow:var(--shadow); }
  .labcard h3 { margin:0 0 5px; }
  .labcard p { margin:0 0 12px; color:var(--ink-2); font-size:14px; }
  .labcontrols { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0 16px; }
  .labcontrols label { font-size:14px; color:var(--ink-2); }
  .labcontrols select, .labcontrols input[type="range"] { font:inherit; }
  .labselect { padding:6px 9px; border:1px solid var(--hairline); border-radius:8px; background:var(--surface); color:var(--ink); }
  .weakrow { display:grid; grid-template-columns:minmax(140px,1fr) 80px minmax(140px,1fr); gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--hairline); font-size:14px; }
  .weakbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .weakbar i { display:block; height:100%; background:var(--accent); }
  .confusion-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border:1px solid var(--hairline); border-radius:99px; margin:3px 4px 3px 0; background:var(--surface-2); font-size:13px; }

  .rhythm-visual { display:grid; gap:4px; margin:14px 0; }
  .rhythm-slots { display:grid; grid-template-columns:repeat(var(--slots),1fr); gap:3px; min-height:50px; align-items:end; }
  .rhythm-slot { min-height:42px; border-left:1px dashed var(--hairline); position:relative; }
  .rhythm-slot.strong { border-left:2px solid var(--ink-2); }
  .rhythm-hit { position:absolute; left:-6px; bottom:2px; width:12px; height:28px; border-radius:6px 6px 3px 3px; background:var(--accent); }
  .rhythm-count { display:grid; grid-template-columns:repeat(var(--slots),1fr); gap:3px; color:var(--muted); font-size:10.5px; text-align:center; }
  .tap-pad { width:100%; min-height:120px; border:2px solid var(--accent); border-radius:18px; background:var(--accent-soft); color:var(--accent); font:700 23px system-ui; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .tap-pad:active, .tap-pad.hit { transform:scale(.99); filter:brightness(.96); }
  .timing-score { font-size:42px; font-weight:800; letter-spacing:-.03em; }
  .pulse-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--hairline); margin:0 3px; }
  .pulse-dot.on { background:var(--accent); }

  .notation-stage { overflow-x:auto; padding:4px 0 10px; }
  .notation-svg { display:block; max-width:none; background:var(--surface); border:1px solid var(--hairline); border-radius:12px; }
  .notation-toolbar { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0; }
  .accbtn.active { background:var(--accent); color:white; border-color:var(--accent); }
  .notation-prompt { font-size:18px; margin:4px 0 10px; }
  .notation-answer { font-size:14px; color:var(--ink-2); }

  .progression { display:grid; grid-template-columns:repeat(4,minmax(125px,1fr)); gap:9px; margin:14px 0; }
  .progchord { border:1px solid var(--hairline); border-radius:11px; padding:12px; background:var(--surface); min-width:0; }
  .progchord select { width:100%; }
  .progchord .roman { font-size:23px; font-weight:750; color:var(--accent); }
  .progchord .actual { font-size:14px; font-weight:650; margin-top:3px; }
  .progchord .notes { font-size:12px; color:var(--muted); word-break:break-word; }
  .voice-line { display:grid; grid-template-columns:90px 1fr; gap:8px; font-size:13px; padding:5px 0; border-bottom:1px solid var(--hairline); }
  .voice-arrow { letter-spacing:.04em; }

  .excerpt-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .excerpt-meta { color:var(--muted); font-size:12.5px; }
  .analysis-points { margin:10px 0 0; padding-left:20px; }
  .analysis-points li { margin:5px 0; }
  .badge-pd { display:inline-block; padding:2px 7px; border-radius:99px; background:var(--surface-2); color:var(--muted); font-size:11px; font-weight:650; }

  @media (max-width:700px) {
    .progression { grid-template-columns:repeat(2,minmax(120px,1fr)); }
    .weakrow { grid-template-columns:1fr 62px; }
    .weakrow .weakbar { grid-column:1 / -1; }
  }

</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Course navigation"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="importfile" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* =====================================================================
   HARMONIA — single-file music theory course, foundations → advanced harmony
   Content data first, then the app engine.
   ===================================================================== */

const COURSE = [];
COURSE.push({
  id: "l1", short: "L1", icon: "🎵", label: "Level 1 — Foundations",
  tagline: "Notes, the staff, rhythm & your first scale",
  desc: "Start from silence: what notes are, how the keyboard is laid out, how written music works, and how rhythm is counted — ending with your first scale."
, units: [] });

levelById("l1").units.push(
{
  id: "l1u1", title: "Notes & the keyboard",
  subtitle: "Pitch, the musical alphabet, and why the piano looks like that",
  grammar: `
<h3>Pitch is just fast and slow wiggling</h3>
<p>Every sound is vibration. Faster vibration = <b>higher pitch</b>, slower = lower. Music picks out specific pitches, gives them names, and builds everything else from them. Western music uses just <b>seven letter names</b> — A B C D E F G — then starts over.</p>
<h3>The keyboard is the map</h3>
<p>Look at the pattern: black keys in groups of <b>two</b> and <b>three</b>. Find any group of two black keys — the white key just to their left is always <b>C</b>. That pattern repeats forever:</p>
{{piano:C@48-72}}
<p>From one C to the next C is an <b>octave</b>. Two notes an octave apart sound "the same, but higher" — that's why they share a name. {{play:seq:60,72:Hear an octave}}</p>
<h3>Naming the white keys</h3>
<p>From C going right: <b>C D E F G A B</b>, then C again. Here's a full run: {{play:seq:60,62,64,65,67,69,71,72:Play C to C}}</p>
{{piano:C,D,E,F,G,A,B@60-72}}
<h3>Octave numbers</h3>
<p>To say <i>which</i> C, we number octaves: <b>C4</b> is "middle C" (the C nearest the middle of a piano). A4 — the A above it — is the tuning reference: <b>440 Hz</b>, the note an orchestra tunes to. {{play:seq:69:Hear A440}}</p>
<div class="tip"><b>Do–re–mi?</b> Many countries name notes do, re, mi, fa, sol, la, si instead of C D E F G A B. Same notes, different labels — this course uses letters, but if you grew up with sargam (sa re ga ma), the idea of movable syllables will feel familiar when we reach scale degrees.</div>
<div class="tip"><b>Tap every piano you see in this course</b> — every key plays. The fastest way to learn the keyboard is to poke it.</div>`,

<p>Written music lives on a <b>staff</b>: five lines and four spaces. Higher on the staff = higher in pitch. A <b>clef</b> at the start tells you which notes the lines mean.</p>
<h3>The treble clef 𝄞</h3>
<p>The treble (or G) clef curls around the second line from the bottom — marking it as <b>G4</b>. From there, every line and space is one letter step:</p>
{{staff:treble:E4,F4,G4,A4,B4,C5,D5,E5,F5:labels}}
<h3>Two famous mnemonics</h3>
<table class="gr">
<tr><th>Lines (bottom → top)</th><td>E – G – B – D – F</td><td><b>E</b>very <b>G</b>ood <b>B</b>oy <b>D</b>eserves <b>F</b>udge</td></tr>
<tr><th>Spaces (bottom → top)</th><td>F – A – C – E</td><td>they spell <b>FACE</b></td></tr>
</table>
<h3>Ledger lines — extending the staff</h3>
<p>Notes above or below the staff ride on little line fragments called <b>ledger lines</b>. Middle C (C4) sits on one ledger line below the treble staff:</p>

<h3>The bass clef 𝄢</h3>
<p>Low notes get their own staff. The bass (or F) clef's two dots surround the second line from the top, marking it as <b>F3</b>:</p>

</table>
<h3>The grand staff — two hands, one system</h3>
<p>Piano music joins treble and bass staves into the <b>grand staff</b>. They meet in the middle — literally at <b>middle C</b>, which sits one ledger line below the treble staff and one ledger line <i>above</i> the bass staff. Same note, two addresses:</p>

  id: "l1u4", title: "Rhythm — counting time",
  subtitle: "Note values, beats, time signatures and how to count out loud",
  grammar: `
<h3>The beat — music's pulse</h3>
<p>Underneath every song is a steady pulse, the <b>beat</b> — the thing you nod to. <b>Tempo</b> is how fast it goes, measured in beats per minute (<b>BPM</b>). Rhythm is how notes divide up that pulse.</p>
<h3>The family of note values</h3>
<table class="gr">
<tr><th>Note</th><th>Name (US / UK)</th><th>Length in 4/4</th></tr>
<tr><td>𝅝</td><td>whole note / semibreve</td><td>4 beats</td></tr>
<tr><td>𝅗𝅥</td><td>half note / minim</td><td>2 beats</td></tr>
<tr><td>♩</td><td>quarter note / crotchet</td><td>1 beat</td></tr>
<tr><td>♪</td><td>eighth note / quaver</td><td>½ beat</td></tr>
<tr><td>𝅘𝅥𝅯</td><td>sixteenth / semiquaver</td><td>¼ beat</td></tr>
</table>
<p>Each value is exactly <b>half</b> the one above it. Silence has the same arithmetic: every note value has a matching <b>rest</b>.</p>
<h3>Time signatures — how beats are bundled</h3>
<p>Beats group into <b>measures</b>. The <b>time signature</b> at the start says how: the top number = beats per measure, the bottom = which note value gets the beat.</p>
<ul>
<li><b>4/4</b> — four quarter-note beats. "Common time," most pop and rock. Count: <b>1 2 3 4</b>.</li>
<li><b>3/4</b> — three beats: the waltz. Count: <b>1 2 3, 1 2 3</b>.</li>
<li><b>2/4</b> — two beats: marches.</li>
<li><b>6/8</b> — six eighth notes felt as <b>two</b> lilting groups of three: <b>1</b>-2-3-<b>4</b>-5-6. (More in Level 2!)</li>
</ul>
<h3>Counting eighths: "1 & 2 & 3 & 4 &"</h3>
<p>Split each beat with "and": say it out loud — this is a real musician's habit, not a beginner's crutch. These two examples occupy the same four-beat span: {{play:rhythm:96|60/1/0.22,60/1/0.22,60/1/0.22,60/1/0.22:Four quarters}} {{play:rhythm:96|67/0.5/0.17,67/0.5/0.17,67/0.5/0.17,67/0.5/0.17,67/0.5/0.17,67/0.5/0.17,67/0.5/0.17,67/0.5/0.17:Eight eighths}}</p>
<div class="tip"><b>Dots and ties (preview):</b> a dot after a note adds half its value (dotted half = 3 beats); a tie joins two notes into one longer sound. Full workout in Level 2.</div>`,

<h3>The half step — music's smallest unit</h3>
<p>On the keyboard, a <b>half step</b> (semitone) is the distance to the <i>very next</i> key, black or white. Two half steps make a <b>whole step</b> (tone). Listen: {{play:seq:60,61:half step}} vs {{play:seq:60,62:whole step}}</p>
<h3>The black keys finally get names</h3>
<p>A <b>sharp (♯)</b> raises a note one half step; a <b>flat (♭)</b> lowers it one half step. The black key between C and D is both <b>C♯</b> and <b>D♭</b>:</p>
{{piano:C#@60-72}}
<p>Two names, one key — such pairs are called <b>enharmonic equivalents</b>. Which name you use depends on musical context (coming in Level 2 with keys).</p>
<h3>Watch the gaps: E–F and B–C</h3>
<p>Look at the keyboard: there's <b>no black key</b> between E and F, or between B and C. Those pairs are already a half step apart. This irregularity is why keys and scales have personalities — remember it!</p>
<h3>The chromatic scale — all twelve</h3>
<p>Playing every key in order gives the <b>chromatic scale</b>: twelve different notes before the octave returns. {{play:seq:60,61,62,63,64,65,66,67,68,69,70,71,72:Play it}}</p>
<div class="tip"><b>Natural (♮)</b> cancels a sharp or flat. In written music, an accidental lasts until the end of the measure — the bar line washes it away.</div>
<div class="tip"><b>Why 12?</b> Dividing the octave into 12 equal half steps ("equal temperament") lets every key sound equally in tune — the compromise modern instruments are built on. Bach wrote a whole songbook to celebrate it.</div>`,

<h3>The key signature — accidentals, prepaid</h3>
<p>Rather than writing F♯ hundreds of times in a G major piece, music states it once at the start: the <b>key signature</b>. Every F on any staff is then automatically sharp.</p>
<h3>The circle of fifths</h3>
<p>Go up a perfect fifth from any tonic and you get the key with <b>one more sharp</b>: C→G→D→A→E→B→F♯. Go DOWN a fifth for one more flat: C→F→B♭→E♭→A♭→D♭→G♭. Arranged in a circle, all twelve keys hold hands. {{play:seq:60,67,62,69,64,71,66:tonics marching in fifths}}</p>

<tr><th>Flats</th><td>F: 1♭</td><td>B♭: 2♭</td><td>E♭: 3♭</td><td>A♭: 4♭</td><td>D♭: 5♭</td><td>G♭: 6♭</td></tr>

<h3>The order of sharps & flats — always the same</h3>
<p>Sharps arrive in the order <b>F♯ C♯ G♯ D♯ A♯ E♯</b> ("Father Charles Goes Down And Ends Battle"); flats arrive in the exact mirror: <b>B♭ E♭ A♭ D♭ G♭ C♭</b> ("Battle Ends And Down Goes Charles' Father").</p>

<ul>
<li><b>Sharp keys:</b> the LAST sharp is the leading tone — go up a half step for the tonic. Last sharp C♯? Key of D.</li>

<p>Its relative twin, the <b>minor pentatonic</b> (A C D E G from A), is the mother tongue of rock and blues guitar: {{play:seq:57,60,62,64,67,69:A minor pentatonic}}</p>
<h3>The blues scale — one note changes everything</h3>
<p>Add the ♭5 "blue note" to the minor pentatonic: A C D <b>E♭</b> E G. That chromatic pinch between 4 and 5 is the sound of the blues: {{play:seq:57,60,62,63,64,67,69:A blues scale}}</p>

<h3>Rhythm II — dots, ties & 6/8</h3>
<ul>
<li><b>Dotted note</b> = itself + half again. Dotted quarter = 1½ beats. The dotted-quarter-plus-eighth is pop's favorite cell.</li>
<li><b>Tie</b> = two written notes, one continuous sound — for lengths that cross a bar line.</li>

<h3>Chords have jobs, not just names</h3>

  grammar: `
<h3>Think in voices, not blocks</h3>
<p>Treat a chord progression as three or four singers (soprano–alto–tenor–bass), each walking their own path. Harmony is what their paths make together. The craft rules:</p>
<ul>
<li><b>1. Keep common tones.</b> If two chords share a note, let the same voice hold it.</li>
<li><b>2. Move by step where possible.</b> Small motions; the bass may leap.</li>
<li><b>3. Resolve tendency tones.</b> The leading tone rises to the tonic ({{play:seq:71,72:ti→do}}); a chordal 7th falls by step ({{play:seq:65,64:fa→mi}}).</li>
<li><b>4. Don't march in parallel 5ths/octaves.</b> Two voices moving in locked perfect intervals fuse and destroy independence — the great classical taboo. {{play:seq:60,67,62,69,64,71:parallel 5ths — hear the fusing}}</li>
</ul>
<h3>Worked example: I → V7 → I done right</h3>
<p>C(C-E-G) → G7(B-D-F +G in bass) → C: hold nothing? No — G holds; E steps to D or F; leading tone B rises to C; F falls to E: {{play:seq:60,64,67,59,62,65,60,64,72:each voice glides}}</p>
<h3>Contrary motion — the composer's polish</h3>
<p>When the bass rises, let upper voices fall (and vice versa) — outer voices in <b>contrary motion</b> sound instantly professional: {{play:seq:48,64,67,72,50,62,65,71,52,60,64,67:bass up, treble down}}</p>
<div class="tip"><b>Why the parallel-fifths taboo?</b> Perfect intervals blend so completely that two "independent" voices collapse into one thick voice. Organum wanted that in 900 AD; four-part chorale style in 1750 didn't; power-chord rock re-embraced it in 1970. Rules are style descriptions, not laws of physics — but you must be able to HEAR the difference to choose.</div>`,

<h3>Melodies are built, not found</h3>
<p>A <b>motif</b> is a short idea (Beethoven's da-da-da-DUM: {{play:seq:67,67,67,63:play}}); a <b>phrase</b> is a full musical sentence, typically four or eight bars, ending in a cadence. Composers develop motifs by <b>repetition</b>, <b>sequence</b> (repeating higher or lower: {{play:seq:60,62,64,62,64,65,64,65,67:rising sequence}}) and <b>inversion</b> (upside down).</p>
<h3>Non-chord tones — legal trespassing</h3>
<p>Melodies constantly touch notes OUTSIDE the current chord. Each trespass has a name, defined by how it enters and leaves:</p>
<table class="gr">
<tr><th>NCT</th><th>Enter → leave</th><th>Sound</th></tr>
<tr><td><b>Passing tone</b></td><td>step → step, same direction</td><td>{{play:seq:60,62,64:C–D–E over C chord}}</td></tr>
<tr><td><b>Neighbor tone</b></td><td>step up/down → step back</td><td>{{play:seq:64,65,64:E–F–E}}</td></tr>
<tr><td><b>Suspension</b></td><td>held over → resolves down</td><td>{{play:seq:65,64:the 4–3 sigh}}</td></tr>
<tr><td><b>Anticipation</b></td><td>arrives early</td><td>{{play:seq:71,72,72:early tonic}}</td></tr>
<tr><td><b>Appoggiatura</b></td><td>leap in → step out</td><td>{{play:seq:60,69,67:leap to the ache, step to rest}}</td></tr>
<tr><td><b>Escape tone</b></td><td>step in → leap out</td><td>{{play:seq:64,65,60:play}}</td></tr>
</table>
<h3>The suspension — harmony's sigh</h3>
<p>Hold a note from the old chord while the new chord arrives; it clashes deliciously, then resolves down. The <b>4–3 suspension</b> is centuries of sacred music in two notes: {{play:seq:60,65,69,60,64,69:sus4 melting to the 3rd}} — pop knows it as the <b>sus4 chord</b> (Csus4→C).</p>

<h3>Any chord can have its own dominant</h3>
<p>V→I is the strongest pull in music. The trick of <b>secondary dominants</b>: aim that pull at chords other than the tonic. Want to spotlight the V chord (G, in C major)? Precede it with ITS dominant — D major, written <b>V/V</b> ("five of five"):</p>
<p>{{play:seq:60,64,67,62,66,69,67,71,74,60,64,72:I → V/V → V → I}}</p>
<p>Hear the F♯? That's the tell: a note from OUTSIDE the key, borrowed to create a leading tone into G.</p>
<h3>The family</h3>
<table class="gr">
<tr><th>Symbol</th><th>In C major</th><th>Targets</th><th></th></tr>
<tr><td>V7/V</td><td>D7</td><td>G</td><td>{{play:seq:62,66,69,72,67,71,74:play}}</td></tr>

<tr><td>V7/ii</td><td>A7</td><td>Dm</td><td>{{play:seq:57,61,64,67,62,65,69:play}}</td></tr>
</table>
<h3>Tonicization vs modulation</h3>
<p>A secondary dominant makes its target feel like a mini-tonic for a moment — <b>tonicization</b>. If the music actually stays there, that's <b>modulation</b> (next unit). One chord of D7 in C major is spice, not relocation.</p>

<h3>Why music moves house</h3>
<p><b>Modulation</b> — actually changing key — is how longer music breathes: verses in one key, a bridge that lifts, a finale that arrives somewhere new. The ear registers it as travel.</p>
<h3>Method 1: the pivot chord (smoothest)</h3>
<p>Find a chord that exists in BOTH keys and swing through it like a revolving door. C major and G major share Am (vi in C, ii in G): C → <b>Am</b> → D7 → G — by the time you hear D7, you've already left: {{play:seq:60,64,67,57,60,64,62,66,69,72,55,59,62,67:C → Am → D7 → G}}</p>
<h3>Method 2: direct (phrase) modulation</h3>
<p>Just… start the next section in the new key. Bold, cinematic, common at verse→chorus boundaries.</p>
<h3>Method 3: the pop-up half step</h3>
<p>The famous final-chorus lift — everything up a half or whole step, often via the new key's V7. Affectionately, the "truck driver's gear change": {{play:seq:60,64,67,60,64,67,68,72,75,61,65,68:C…then suddenly D♭!}}</p>
<h3>Where music usually goes</h3>
<ul>
<li><b>To the dominant</b> (C→G): the classical default for first movements.</li>
<li><b>To the relative</b> major/minor (C→Am, Am→C): the emotional flip that shares every note.</li>
<li><b>To the parallel</b> (C→Cm): same home, new weather — dramatic in film scores.</li>
</ul>

  grammar: `
<h3>The tritone substitution</h3>
<p>Two dominant 7ths a tritone apart share the same shell: G7's 3rd+7th (B, F) are D♭7's 7th+3rd. So wherever V7 goes, <b>♭II7</b> can go instead — same engine, chromatic bass: ii–V–I becomes ii–<b>♭II7</b>–I with the bass sliding D→D♭→C:</p>
<p>{{play:seq:62,65,69,72,61,65,68,71,60,64,67,71:Dm7 – D♭7 – Cmaj7}}</p>
<h3>Altered dominants — maximum push</h3>
<p>On a dominant chord, tensions can be bent: ♭9, ♯9, ♭5/♯11, ♯5/♭13. The more altered, the harder the resolution hits. Hear G7 plain, then G7♭9, then the full <b>altered</b> crunch resolving to C:</p>
<p>{{play:seq:55,59,62,65,60,64,67:G7 → C}} {{play:seq:55,59,65,68,60,64,67:G7♭9 → C}} {{play:seq:55,59,65,68,73,60,64,67,72:G7alt → C}}</p>
<h3>The 12-bar blues — the people's form</h3>
<table class="gr">
<tr><td>Bars 1–4</td><td><b>I7</b> · I7 · I7 · I7</td></tr>
<tr><td>Bars 5–8</td><td><b>IV7</b> · IV7 · <b>I7</b> · I7</td></tr>
<tr><td>Bars 9–12</td><td><b>V7</b> · <b>IV7</b> · <b>I7</b> · V7 (turnaround)</td></tr>
</table>
<p>Note the scandal: EVERY chord is a dominant 7th — blues treats the unstable dom7 as home. That's why blues sounds both restless and rooted: {{play:seq:60,64,70,65,69,75,60,64,70,67,71,77,65,69,75,60,64,70:a mini blues tour}}</p>

<h3>The Neapolitan — ♭II in first inversion</h3>
<p>A major triad on the lowered 2nd degree, classically in first inversion (<b>N6</b>). In A minor: B♭ major over D. It approaches V with tragic grandeur — opera's favorite dark red curtain: {{play:seq:62,65,70,64,68,71,57,60,64:N6 → V → i}}</p>
<h3>Augmented sixth chords — the chromatic pincer</h3>
<p>Two voices a compressed sixth apart (F and D♯ in C) squeeze outward by half steps onto the dominant's octave — a two-sided leading tone:</p>
<ul>
<li><b>Italian</b> +6: three notes {{play:seq:53,60,63,55,59,62:It6 → V… wait, hear the pincer}}</li>
<li><b>German</b> +6: adds a fifth — richer, resolves via cadential motion {{play:seq:56,60,63,66,55,59,62,67:Ger6 → V}}</li>
<li><b>French</b> +6: adds a whole-toney ♯4 tang {{play:seq:56,60,62,66,55,59,62,67:Fr6 → V}}</li>
</ul>
<h3>The diminished 7th — universal trapdoor</h3>
<p>Fully symmetrical (0-3-6-9), any note can be its root — so it resolves convincingly in four directions. Romantic composers used it as a smoke bomb: strike it, and reappear in any key: {{play:seq:59,62,65,68,60,64,67,72:vii°7 → C}} {{play:seq:59,62,65,68,63,66,70,75:same chord → E♭!}}</p>
<h3>Chromatic mediants — the film-score teleport</h3>
<p>Major chords whose roots sit a third apart with no shared key — C→E, C→A♭ — bypass function entirely for pure color. This is the sound of sails filling, planets rising, superheroes deciding: {{play:seq:60,64,67,64,68,71,60,64,67,56,60,63:C → E … C → A♭}}</p>
<div class="tip"><b>The Tristan chord</b> (F–B–D♯–G♯: {{play:chord:53,59,63,68:play}}) opened Wagner's Tristan in 1859 and arguably cracked tonality itself — a dissonance that resolves into another dissonance, deferring resolution for four hours of opera. Analysts still argue about its spelling. Play it and feel the ground tilt.</div>`,

<h3>The lead sheet — music's shorthand contract</h3>
<p>One staff of melody, chord symbols above, maybe lyrics. Everything else — voicing, rhythm, bass — is YOUR job. Reading one fluently means: recognize the key from the signature; scan symbols into Roman numerals; find the ii–V–Is; spot the form's seams.</p>
<h3>Roman-numeral analysis, step by step</h3>
<ol style="padding-left:22px">
<li><b>Find the key</b> — signature plus final cadence beats first-bar guessing.</li>
<li><b>Label each chord</b> relative to that key (C–Am–F–G in C = I–vi–IV–V).</li>
<li><b>Bracket the functions</b> — T, PD, D — and mark cadences.</li>
<li><b>Flag the strangers</b> — accidentals signal secondary dominants, mixture, or modulation. Ask: where does this chord want to go?</li>
</ol>
<p>Worked mini-example: C – E7 – Am – F – C/G – G7 – C reads I – <b>V7/vi</b> – vi – IV – I6-4 – V7 – I: {{play:seq:60,64,67,64,68,71,57,60,64,53,57,60,55,60,64,55,59,65,60,64,72:hear the analysis}}</p>
<h3>Form — the architecture layer</h3>
<table class="gr">
<tr><td><b>AABA</b> (32-bar)</td><td>verse ×2, bridge, verse — the jazz-standard chassis</td></tr>
<tr><td><b>Verse–chorus</b></td><td>pop's engine: chorus = home key + hook</td></tr>
<tr><td><b>12-bar blues</b></td><td>you know this one now</td></tr>
<tr><td><b>Binary / ternary</b></td><td>AB and ABA — the classical miniatures</td></tr>
<tr><td><b>Sonata form</b></td><td>exposition (I→V), development (chaos abroad), recapitulation (home, reconciled)</td></tr>
</table>
<div class="tip"><b>Analysis is listening slowed down.</b> The point isn't labels — it's noticing: the borrowed iv that makes the bridge ache, the deceptive cadence stalling the final chorus, the modulation hiding at the key change. Analyze one song you love per week; after ten, you'll hear structurally forever.</div>`,

function earActive() { return EAR_ITEMS.filter(it => store.data.settings.earCats[it.cat]); }

      if (actual !== chosen && count > 0 && earItem(actual) && earItem(chosen)) rows.push({ actual, chosen, count });

function earPriority(item) {
  const s = earState(item.id), st = store.data.earStats[item.id];

  let score = Math.random() * 8;
  if (!s) score += 72;
  else if (s.d <= now) score += 110 + Math.min(30, (now - s.d) / DAY);
  if (st && st.tot) score += (1 - st.ok / st.tot) * 70 + Math.min(20, st.tot / 3);

  if (!ok) { s.r = 0; s.i = 0; s.d = Date.now() + 10 * 60000; s.e = Math.max(130, s.e - 20); }

  const st = store.data.earStats[item.id] || { ok: 0, tot: 0, modes: {} };

  if (!st.modes || typeof st.modes !== "object") st.modes = {};

  ms.tot += 1; if (ok) ms.ok += 1;

const STORE_KEY = "harmonia-music-v1";
const DEFAULTS = {
  completed: {},        // unitId -> true
  quizScores: {},       // unitId -> best %
  srs: {},              // cardId -> {r: reps, e: ease*100, i: interval days, d: due ts}
  xp: 0,
  streak: 0,
  lastDay: null,        // "YYYY-MM-DD" of last activity
  bestStreak: 0,
  reviewsDone: 0,
  settings: { dir: "term2def", newPerDay: 15, theme: "auto", earMode: "mixed", earDirection: "mixed", earFocus: "adaptive", earCats: { "Intervals": true, "Triads": true, "Seventh chords": true, "Scales": true }, levels: { l1: true, l2: true, l3: false, l4: false, l5: false } },
  newIntro: {},         // "YYYY-MM-DD" -> count of new cards introduced
  earSrs: {},           // ear item id -> SRS state
  earStats: {},         // ear item id -> {ok, tot, modes}
  earConfusions: {},    // actual item -> chosen item -> count
  rhythmStats: {},      // pattern id -> timing results
  rhythmQuizStats: { ok: 0, tot: 0 },
  notationStats: { single: {ok:0,tot:0}, interval: {ok:0,tot:0}, triad: {ok:0,tot:0} },
  harmonyStats: { ok: 0, tot: 0 }
};

function cloneDefaults() { return JSON.parse(JSON.stringify(DEFAULTS)); }
function boundedInt(value, min, max, fallback) {
  return Number.isFinite(value) ? Math.min(max, Math.max(min, Math.floor(value))) : fallback;
}
function validDateKey(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = new Date(value + "T00:00:00");
  return Number.isFinite(d.getTime()) && d.getFullYear() === +value.slice(0, 4)
    && d.getMonth() + 1 === +value.slice(5, 7) && d.getDate() === +value.slice(8, 10);
}
function sanitizeProgress(input) {
  if (!input || typeof input !== "object" || Array.isArray(input)) throw new Error("Invalid progress file");

  const out = cloneDefaults();
  const unitIds = new Set();
  const cardIds = new Set();
  for (const lvl of COURSE) for (const unit of lvl.units) {
    unitIds.add(unit.id);
    unit.vocab.forEach((_, i) => cardIds.add(unit.id + ":" + i));
  }

  const completed = input.completed && typeof input.completed === "object" && !Array.isArray(input.completed) ? input.completed : {};
  for (const id of unitIds) if (completed[id] === true) out.completed[id] = true;

  const scores = input.quizScores && typeof input.quizScores === "object" && !Array.isArray(input.quizScores) ? input.quizScores : {};
  for (const id of unitIds) if (Number.isFinite(scores[id])) out.quizScores[id] = boundedInt(scores[id], 0, 100, 0);

  const incomingSrs = input.srs && typeof input.srs === "object" && !Array.isArray(input.srs) ? input.srs : {};
  const maxDue = Date.UTC(2100, 0, 1);
  for (const id of cardIds) {
    const rec = incomingSrs[id];
    if (!rec || typeof rec !== "object" || Array.isArray(rec)) continue;
    if (![rec.r, rec.e, rec.i, rec.d].some(Number.isFinite)) continue;
    out.srs[id] = {
      r: boundedInt(rec.r, 0, 1000000, 0),
      e: boundedInt(rec.e, 130, 280, 250),
      i: boundedInt(rec.i, 0, 36500, 0),
      d: boundedInt(rec.d, 0, maxDue, 0)
    };
  }

  const incomingEar = input.earSrs && typeof input.earSrs === "object" && !Array.isArray(input.earSrs) ? input.earSrs : {};
  const incomingEarStats = input.earStats && typeof input.earStats === "object" && !Array.isArray(input.earStats) ? input.earStats : {};
  for (const item of EAR_ITEMS) {
    const rec = incomingEar[item.id];
    if (rec && typeof rec === "object" && !Array.isArray(rec) && [rec.r, rec.e, rec.i, rec.d].some(Number.isFinite)) {
      out.earSrs[item.id] = { r: boundedInt(rec.r, 0, 1000000, 0), e: boundedInt(rec.e, 130, 280, 250), i: boundedInt(rec.i, 0, 36500, 0), d: boundedInt(rec.d, 0, maxDue, 0) };
    }
    const st = incomingEarStats[item.id];
    if (st && typeof st === "object" && Number.isFinite(st.tot)) {
      const tot = boundedInt(st.tot, 0, 1000000000, 0);
      const clean = { ok: boundedInt(st.ok, 0, tot, 0), tot, modes: {} };
      const modes = st.modes && typeof st.modes === "object" && !Array.isArray(st.modes) ? st.modes : {};
      for (const [name, ms] of Object.entries(modes)) if (ms && typeof ms === "object" && Number.isFinite(ms.tot)) {
        const mt = boundedInt(ms.tot, 0, 1000000000, 0); clean.modes[name] = { ok: boundedInt(ms.ok, 0, mt, 0), tot: mt };
      }
      out.earStats[item.id] = clean;
    }
  }
  const incomingConf = input.earConfusions && typeof input.earConfusions === "object" && !Array.isArray(input.earConfusions) ? input.earConfusions : {};
  for (const item of EAR_ITEMS) {
    const map = incomingConf[item.id]; if (!map || typeof map !== "object" || Array.isArray(map)) continue;
    for (const other of EAR_ITEMS) if (other.cat === item.cat && Number.isFinite(map[other.id]) && map[other.id] > 0) {
      if (!out.earConfusions[item.id]) out.earConfusions[item.id] = {};
      out.earConfusions[item.id][other.id] = boundedInt(map[other.id], 0, 1000000000, 0);
    }
  }
  const rstats = input.rhythmStats && typeof input.rhythmStats === "object" && !Array.isArray(input.rhythmStats) ? input.rhythmStats : {};
  for (const p of RHYTHM_PATTERNS) { const x=rstats[p.id]; if(x&&typeof x==="object") out.rhythmStats[p.id]={attempts:boundedInt(x.attempts,0,1000000,0),best:boundedInt(x.best,0,100,0),avg:boundedInt(x.avg,0,10000,0)}; }
  for (const field of ["rhythmQuizStats","harmonyStats"]) { const x=input[field]; if(x&&typeof x==="object"){const tot=boundedInt(x.tot,0,1000000000,0);out[field]={ok:boundedInt(x.ok,0,tot,0),tot};} }
  const nstats=input.notationStats&&typeof input.notationStats==="object"?input.notationStats:{};
  for(const mode of ["single","interval","triad"]){const x=nstats[mode];if(x&&typeof x==="object"){const tot=boundedInt(x.tot,0,1000000000,0);out.notationStats[mode]={ok:boundedInt(x.ok,0,tot,0),tot};}}

  out.xp = boundedInt(input.xp, 0, 1000000000, 0);
  out.streak = boundedInt(input.streak, 0, 1000000, 0);
  out.bestStreak = Math.max(out.streak, boundedInt(input.bestStreak, 0, 1000000, 0));
  out.reviewsDone = boundedInt(input.reviewsDone, 0, 1000000000, 0);
  out.lastDay = validDateKey(input.lastDay) ? input.lastDay : null;

  const settings = input.settings && typeof input.settings === "object" && !Array.isArray(input.settings) ? input.settings : {};
  const directionAliases = {
    term2def: "term2def",
    def2term: "def2term",
    mix: "mix",
    it2en: "term2def",
    en2it: "def2term"
  };
  if (directionAliases[settings.dir]) out.settings.dir = directionAliases[settings.dir];
  if ([5, 10, 15, 20, 30, 50].includes(settings.newPerDay)) out.settings.newPerDay = settings.newPerDay;
  if (["auto", "light", "dark"].includes(settings.theme)) out.settings.theme = settings.theme;
  if (["mixed", "melodic", "harmonic"].includes(settings.earMode)) out.settings.earMode = settings.earMode;
  if (["mixed", "ascending", "descending"].includes(settings.earDirection)) out.settings.earDirection = settings.earDirection;
  if (["adaptive", "due", "all"].includes(settings.earFocus)) out.settings.earFocus = settings.earFocus;
  const earCats = settings.earCats && typeof settings.earCats === "object" && !Array.isArray(settings.earCats) ? settings.earCats : {};
  for (const cat of EAR_CATS) if (typeof earCats[cat] === "boolean") out.settings.earCats[cat] = earCats[cat];
  const levels = settings.levels && typeof settings.levels === "object" && !Array.isArray(settings.levels) ? settings.levels : {};
  for (const lvl of COURSE) if (typeof levels[lvl.id] === "boolean") out.settings.levels[lvl.id] = levels[lvl.id];

  const intro = input.newIntro && typeof input.newIntro === "object" && !Array.isArray(input.newIntro) ? input.newIntro : {};
  for (const [day, count] of Object.entries(intro)) {
    if (validDateKey(day) && Number.isFinite(count)) out.newIntro[day] = boundedInt(count, 0, 10000, 0);
  }
  return out;
}

const store = {
  data: cloneDefaults(),
  memOnly: false,
  load() {
    this.data = cloneDefaults();
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        try { this.data = sanitizeProgress(JSON.parse(raw)); }
        catch (e) { localStorage.removeItem(STORE_KEY); }
      }
      localStorage.setItem(STORE_KEY + "-probe", "1");
      localStorage.removeItem(STORE_KEY + "-probe");
    } catch (e) {
      this.memOnly = true;
      this.data = cloneDefaults();
    }
  },
  save() {
    if (this.memOnly) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) { this.memOnly = true; }
  }
};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function recordActivity() {
  const t = todayStr();
  const s = store.data;
  if (s.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  s.streak = (s.lastDay === yStr) ? s.streak + 1 : 1;
  s.bestStreak = Math.max(s.bestStreak, s.streak);
  s.lastDay = t;
  store.save();
  renderSidebar();
}
function addXP(n) { store.data.xp += n; recordActivity(); store.save(); }

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function stripDiacritics(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function normAnswer(s, keepAccents) {
  let x = s.toLowerCase().trim().replace(/♯/g, "#").replace(/♭/g, "b").replace(/[.,!?;:"«»]/g, "").replace(/’/g, "'").replace(/\s+/g, " ");
  if (!keepAccents) x = stripDiacritics(x);
  return x;
}
// returns: 2 exact, 1 correct-but-accent-slip, 0 wrong
function matchAnswer(given, answers) {
  const list = Array.isArray(answers) ? answers : [answers];
  for (const a of list) if (normAnswer(given, true) === normAnswer(a, true)) return 2;
  for (const a of list) if (normAnswer(given, false) === normAnswer(a, false)) return 1;
  return 0;
}

let _actx = null;
function actx() {
  if (!_actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    _actx = new AC();
  }
  if (_actx.state === "suspended") _actx.resume();
  return _actx;
}
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function tonePlay(m, t0, dur, gain) {
  const ctx = actx(); if (!ctx) return;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = midiFreq(m);
  const g2 = ctx.createGain(); g2.gain.value = 0.22;
  const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = midiFreq(m) * 2;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(ctx.destination);
  o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
}
// Supported forms:
//   "seq:60,62,64"
//   "chord:60,64,67"
//   "arpchord:60,64,67"
//   "rhythm:96|60/1/0.22,60/0.5/0.16"  (BPM | note/beats/gain)
//   "poly:78|60x3,67x2"                (two simultaneous rhythmic tracks)
// or an equivalent object.
function parsePlaySpec(spec) {
  if (!spec || typeof spec !== "string") return spec;

  const trimmed = spec.trim();
  if (trimmed.startsWith("{")) {
    try { return JSON.parse(trimmed); } catch (e) {}
  }

  const cut = trimmed.indexOf(":");
  if (cut < 0) return null;
  const type = trimmed.slice(0, cut);
  const body = trimmed.slice(cut + 1);

  if (type === "rhythm") {
    const split = body.split("|");
    const bpm = Number(split.length > 1 ? split.shift() : 96) || 96;
    const tokens = split.join("|").split(",").map(s => s.trim()).filter(Boolean);
    const events = tokens.map(token => {
      const parts = token.split("/");
      const noteText = (parts[0] || "").trim();
      const beats = Math.max(0.0625, Number(parts[1]) || 1);
      const gain = Math.max(0.03, Math.min(0.3, Number(parts[2]) || 0.18));
      return {
        notes: noteText.toLowerCase() === "r" ? [] : [noteNum(noteText)],
        beats,
        gain
      };
    });
    return { type, bpm, events };
  }

  if (type === "poly") {
    const split = body.split("|");
    const bpm = Number(split.length > 1 ? split.shift() : 78) || 78;
    const tracks = split.join("|").split(",").map(s => s.trim()).filter(Boolean).map(token => {
      const match = /^(.+?)x(\d+)$/.exec(token);
      return match
        ? { note: noteNum(match[1].trim()), count: Math.max(1, +match[2]) }
        : { note: noteNum(token), count: 1 };
    });
    return { type, bpm, measureBeats: 2, cycles: 2, tracks };
  }

  return {
    type,
    notes: body.split(",").map(s => noteNum(s.trim())).filter(Number.isFinite)
  };
}

function playSpec(spec) {
  if (!spec) return;
  const ctx = actx();
  if (!ctx) { toast("Audio not supported in this browser"); return; }

  spec = parsePlaySpec(spec);
  if (!spec) return;

  const t = ctx.currentTime + 0.06;
  const n = Array.isArray(spec.notes) ? spec.notes : [];

  if (spec.type === "chord") {
    n.forEach(m => tonePlay(m, t, 1.7, 0.15));
    return;
  }

  if (spec.type === "arpchord") {
    n.forEach((m, i) => tonePlay(m, t + i * 0.42, 0.5, 0.2));
    n.forEach(m => tonePlay(m, t + n.length * 0.42 + 0.18, 1.7, 0.13));
    return;
  }

  if (spec.type === "rhythm") {
    const beatSeconds = 60 / Math.max(30, Math.min(240, spec.bpm || 96));
    let cursor = t;
    for (const event of spec.events || []) {
      const beats = Math.max(0.0625, Number(event.beats) || 1);
      const duration = Math.max(0.06, beatSeconds * beats * 0.88);
      const notes = Array.isArray(event.notes) ? event.notes : [];
      notes.filter(Number.isFinite).forEach(m =>
        tonePlay(m, cursor, duration, event.gain || 0.18)
      );
      cursor += beatSeconds * beats;
    }
    return;
  }

  if (spec.type === "poly") {
    const beatSeconds = 60 / Math.max(30, Math.min(240, spec.bpm || 78));
    const measureSeconds = beatSeconds * Math.max(1, spec.measureBeats || 2);
    const cycles = Math.max(1, Math.min(4, spec.cycles || 2));
    const tracks = Array.isArray(spec.tracks) ? spec.tracks : [];

    for (let cycle = 0; cycle < cycles; cycle++) {
      const base = t + cycle * measureSeconds;
      tracks.forEach((track, trackIndex) => {
        const count = Math.max(1, Math.min(12, track.count || 1));
        const spacing = measureSeconds / count;
        for (let i = 0; i < count; i++) {
          tonePlay(
            track.note,
            base + i * spacing,
            Math.min(0.22, spacing * 0.55),
            trackIndex === 0 ? 0.19 : 0.14
          );
        }
      });
    }
    return;
  }

  // Ordinary melodic sequence.
  const step = spec.dur || 0.42;
  n.forEach((m, i) =>
    tonePlay(m, t + i * step, Math.min(step * 1.9, 0.85), 0.2)
  );
}

function playBtn(spec, label) {
  // Embed the original string or object directly. The previous double
  // serialization turned object specifications into malformed strings.
  const argument = JSON.stringify(spec);
  return `<button class="playbtn" type="button" title="Play" aria-label="Play audio" onclick='playSpec(${argument});event.stopPropagation()'>▶${label ? "&nbsp;" + label : ""}</button>`;
}

/* =====================================================================
   MUSIC THEORY HELPERS
   ===================================================================== */
const PC_OF_LETTER = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const SHARP_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const FLAT_NAMES = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];
function pcName(pc, flats) { return (flats ? FLAT_NAMES : SHARP_NAMES)[((pc % 12) + 12) % 12]; }
const IV_LETTER_STEPS = { 0: 0, 1: 1, 2: 1, 3: 2, 4: 2, 5: 3, 6: 4, 7: 4, 8: 4, 9: 5, 10: 6, 11: 6, 12: 7, 13: 8, 14: 8, 17: 10, 21: 12 };
const ACC_SYMS = { "-2": "𝄫", "-1": "♭", "0": "", "1": "♯", "2": "𝄪" };
function spellFromRoot(rootName, iv, letterStep) {
  const m = /^([A-G])([♯♭#b]?)/.exec(rootName.trim());
  if (!m) return pcName(noteNum(rootName) + iv);
  const rootLetterIdx = LETTERS.indexOf(m[1]);
  const rootPc = noteNum(rootName);
  const step = letterStep != null ? letterStep : (IV_LETTER_STEPS[iv] != null ? IV_LETTER_STEPS[iv] : Math.round(iv * 7 / 12));
  const letter = LETTERS[(rootLetterIdx + step) % 7];
  const naturalPc = PC_OF_LETTER[letter];
  let diff = (((rootPc + iv) % 12) - naturalPc + 12) % 12;
  if (diff > 6) diff -= 12;
  if (diff < -2 || diff > 2) return pcName(rootPc + iv);
  return letter + ACC_SYMS[String(diff)];
}
// "C4" / "F#3" / "Eb" / "62" → midi number (or pitch class 0-11 if no octave given)
function noteNum(s) {
  s = String(s).trim();
  if (/^\d+$/.test(s)) return +s;
  const m = /^([A-Ga-g])([#♯b♭]?)(-?\d)?$/.exec(s);
  if (!m) return 60;
  let v = PC_OF_LETTER[m[1].toUpperCase()];
  if (m[2] === "#" || m[2] === "♯") v += 1;
  else if (m[2] === "b" || m[2] === "♭") v -= 1;
  v = ((v % 12) + 12) % 12;
  return m[3] != null ? v + (parseInt(m[3], 10) + 1) * 12 : v;
}
function isBlackKey(m) { return [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12); }

/* =====================================================================
   PIANO SVG (clickable, highlightable)
   ===================================================================== */
let PIANO_SEQ = 0;
const pianoSel = {}; // wrapId -> Set of selected midis
function pianoSVG(o) {
  o = o || {};
  const lo = o.lo != null ? o.lo : 60, hi = o.hi != null ? o.hi : 84;
  const hlRaw = (o.hl || []).map(x => noteNum(String(x)));
  const hlSet = new Set();
  for (let m = lo; m <= hi; m++) {
    if (hlRaw.includes(m) || hlRaw.some(h => h < 12 && ((m % 12) + 12) % 12 === h)) hlSet.add(m);
  }
  const wW = o.small ? 24 : 28, wH = o.small ? 82 : 104;
  const bW = Math.round(wW * 0.62), bH = Math.round(wH * 0.6);
  const whites = [];
  for (let m = lo; m <= hi; m++) if (!isBlackKey(m)) whites.push(m);
  const xOf = {};
  whites.forEach((m, i) => { xOf[m] = i * wW; });
  const W = whites.length * wW + 1;
  const id = o.id || ("pno" + (++PIANO_SEQ));
  let svg = `<svg class="pianosvg" width="${W}" height="${wH + 2}" viewBox="0 0 ${W} ${wH + 2}" xmlns="http://www.w3.org/2000/svg">`;
  for (const m of whites) {
    svg += `<rect data-m="${m}" x="${xOf[m] + 0.5}" y="1" width="${wW - 1}" height="${wH}" rx="3" fill="${hlSet.has(m) ? "var(--accent)" : "#fdfdfb"}" stroke="#43413d" stroke-width="1" style="cursor:pointer" onclick="pianoKeyClick('${id}',${m},this)"/>`;
    if (((m % 12) + 12) % 12 === 0) svg += `<text x="${xOf[m] + wW / 2}" y="${wH - 6}" font-size="9.5" text-anchor="middle" fill="${hlSet.has(m) ? "#fff" : "#a7a49d"}" pointer-events="none">C${Math.floor(m / 12) - 1}</text>`;
  }
  for (let m = lo; m <= hi; m++) {
    if (!isBlackKey(m)) continue;
    const wl = m - 1;
    if (xOf[wl] == null) continue;
    svg += `<rect data-m="${m}" x="${xOf[wl] + wW - bW / 2}" y="1" width="${bW}" height="${bH}" rx="2.5" fill="${hlSet.has(m) ? "var(--accent)" : "#191919"}" stroke="#000" style="cursor:pointer" onclick="pianoKeyClick('${id}',${m},this)"/>`;
  }
  svg += `</svg>`;
  return `<div class="pianowrap" id="${id}" data-sel="${o.sel ? 1 : 0}" role="group" aria-label="Piano keyboard">${svg}</div>`;
}
function pianoKeyClick(id, m, el) {
  playSpec("seq:" + m);
  const wrap = document.getElementById(id);
  if (!wrap || wrap.dataset.sel !== "1") return;
  const st = pianoSel[id] || (pianoSel[id] = new Set());
  if (st.has(m)) { st.delete(m); el.setAttribute("fill", isBlackKey(m) ? "#191919" : "#fdfdfb"); }
  else { st.add(m); el.setAttribute("fill", "var(--blue)"); }
}

/* =====================================================================
   STAFF NOTATION SVG (whole-note style, treble & bass)
   ===================================================================== */
const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
function diatonicOf(midi) { // returns {di, acc} using sharp spelling
  const pc = ((midi % 12) + 12) % 12, oct = Math.floor(midi / 12) - 1;
  const natural = { 0: 0, 2: 1, 4: 2, 5: 3, 7: 4, 9: 5, 11: 6 };
  if (natural[pc] != null) return { di: oct * 7 + natural[pc], acc: "" };
  return { di: oct * 7 + natural[pc - 1], acc: "♯" };
}
function staffSVG(o) {
  const clef = o.clef || "treble";
  const notes = (o.notes || []).map(n => noteNum(String(n)));
  const gap = 12, half = gap / 2;
  const topY = 30, bottomY = topY + 4 * gap;
  const refDi = clef === "treble" ? 30 /* E4 */ : 18 /* G2 */;
  const x0 = 64, step = 46;
  const W = Math.max(180, x0 + notes.length * step + 20), H = bottomY + 42;
  let svg = `<svg class="staffsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Music notation">`;
  for (let i = 0; i < 5; i++) svg += `<line x1="8" y1="${topY + i * gap}" x2="${W - 8}" y2="${topY + i * gap}" stroke="var(--ink-2)" stroke-width="1"/>`;
  svg += clef === "treble"
    ? `<text x="12" y="${bottomY + 12}" font-size="58" fill="var(--ink)">𝄞</text>`
    : `<text x="12" y="${bottomY + 2}" font-size="44" fill="var(--ink)">𝄢</text>`;
  notes.forEach((m, i) => {
    const { di, acc } = diatonicOf(m);
    const pos = di - refDi; // 0 = bottom line
    const y = bottomY - pos * half;
    const x = x0 + i * step;
    for (let p = -2; p >= pos; p -= 2) svg += `<line x1="${x - 13}" y1="${bottomY - p * half}" x2="${x + 13}" y2="${bottomY - p * half}" stroke="var(--ink-2)" stroke-width="1"/>`;
    for (let p = 10; p <= pos; p += 2) svg += `<line x1="${x - 13}" y1="${bottomY - p * half}" x2="${x + 13}" y2="${bottomY - p * half}" stroke="var(--ink-2)" stroke-width="1"/>`;
    if (acc) svg += `<text x="${x - 22}" y="${y + 5}" font-size="17" fill="var(--ink)">${acc}</text>`;
    svg += `<ellipse cx="${x}" cy="${y}" rx="8.2" ry="6" fill="var(--ink)" transform="rotate(-14 ${x} ${y})"/>`;
    if (o.labels) svg += `<text x="${x}" y="${H - 6}" font-size="11" text-anchor="middle" fill="var(--muted)">${pcName(m % 12)}${Math.floor(m / 12) - 1}</text>`;
  });
  svg += `</svg>`;
  return `<span class="staffwrap">${svg}${o.play === false ? "" : playBtn("seq:" + notes.join(","))}</span>`;
}

/* =====================================================================
   LESSON TOKENS — {{piano:C,E,G@48-72}} {{staff:treble:C4,E4,G4}} {{play:seq:60,64,67:label}}
   ===================================================================== */
function musicHTML(html) {
  return html
    .replace(/\{\{piano:([^}@]*)(?:@(\d+)-(\d+))?\}\}/g, (_, hl, lo, hi) =>
      pianoSVG({ hl: hl.trim() ? hl.split(",").map(s => s.trim()) : [], lo: lo ? +lo : 60, hi: hi ? +hi : 84, small: true }))
    .replace(/\{\{staff:(treble|bass):([^}:]+)(?::(labels))?\}\}/g, (_, clef, ns, lab) =>
      staffSVG({ clef, notes: ns.split(",").map(s => s.trim()), labels: !!lab }))
    .replace(/\{\{play:(seq|chord|arpchord|rhythm|poly):([^}:]+)(?::([^}]+))?\}\}/g, (_, t, body, label) =>
      playBtn(t + ":" + body, label || "Play"));
}

const ACCENT_CHARS = ["♯", "♭"];
function accentBar(inputId) {
  return `<div class="accents">` + ACCENT_CHARS.map(c =>
    `<button type="button" tabindex="-1" onclick="insAccent('${inputId}','${c}')">${c}</button>`).join("") + `</div>`;
}
function insAccent(id, ch) {
  const el = document.getElementById(id);
  if (!el) return;
  const s = el.selectionStart || el.value.length;
  el.value = el.value.slice(0, s) + ch + el.value.slice(el.selectionEnd || s);
  el.focus(); el.selectionStart = el.selectionEnd = s + 1;
}

function unitById(id) {
  for (const lvl of COURSE) for (const u of lvl.units) if (u.id === id) return { lvl, unit: u };
  return null;
}
function levelById(id) { return COURSE.find(l => l.id === id); }
function levelProgress(lvl) {
  const done = lvl.units.filter(u => store.data.completed[u.id]).length;
  return { done, total: lvl.units.length, pct: Math.round(100 * done / lvl.units.length) };
}
function nextUnfinishedUnit() {
  for (const lvl of COURSE) for (const u of lvl.units) if (!store.data.completed[u.id]) return { lvl, unit: u };
  return null;
}

/* =====================================================================
   SRS ENGINE (SM-2 style, simplified)
   ===================================================================== */
const DAY = 86400000;
function allCards() {
  const cards = [];
  for (const lvl of COURSE) {
    if (!store.data.settings.levels[lvl.id]) continue;
    for (const u of lvl.units) {
      u.vocab.forEach((v, i) => cards.push({ id: u.id + ":" + i, term: v[0], definition: v[1], spec: v[2] || null, unit: u, lvl }));
    }
  }
  return cards;
}
function srsState(id) { return store.data.srs[id] || null; }
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => { const s = srsState(c.id); return s && s.d <= now; });
}
function newCards() { return allCards().filter(c => !srsState(c.id)); }
function newBudgetLeft() {
  const t = todayStr();
  const used = store.data.newIntro[t] || 0;
  return Math.max(0, store.data.settings.newPerDay - used);
}
function gradeCard(card, grade) { // 0 again, 1 hard, 2 good, 3 easy
  const s = store.data.srs[card.id] || { r: 0, e: 250, i: 0, d: 0 };
  const isNew = !store.data.srs[card.id];
  if (isNew) {
    const t = todayStr();
    store.data.newIntro[t] = (store.data.newIntro[t] || 0) + 1;
  }
  if (grade === 0) {
    s.r = 0; s.i = 0; s.d = Date.now() + 10 * 60000; s.e = Math.max(130, s.e - 20);
  } else {
    if (grade === 1) { s.i = Math.max(1, Math.round(s.i * 1.2)) || 1; s.e = Math.max(130, s.e - 15); }
    else if (grade === 2) { s.i = s.r === 0 ? 1 : (s.r === 1 ? 3 : Math.round(s.i * s.e / 100)); }
    else { s.i = s.r === 0 ? 4 : Math.round(s.i * s.e / 100 * 1.3); s.e = Math.min(280, s.e + 15); }
    s.r += 1;
    s.d = Date.now() + s.i * DAY;
  }
  store.data.srs[card.id] = s;
  store.data.reviewsDone += 1;
  addXP(grade === 0 ? 1 : 2);
  store.save();
}

/* =====================================================================
   EXERCISE RENDERING
   Exercise types:
     {t:'mcq', q, opts:[...], a: idx, ex?}      — multiple choice
     {t:'fill', q (use ___), a: [answers], ex?} — type the missing word(s)
     {t:'tr', q, a: [answers], ex?}             — short free-response item
   ===================================================================== */
let EX_SEQ = 0;
const exHandlers = {};       // id -> {onAnswer(correct)}
function renderExercise(ex, num, opts) {
  opts = opts || {};
  const id = "ex" + (++EX_SEQ);
  exHandlers[id] = { ex, answered: false, cb: opts.onAnswer || null };
  let inner = "";
  const media =
    (ex.play ? `<div class="exmedia">${playBtn(ex.play, "Play")}${playBtn(ex.play, "again")}</div>` : "") +
    (ex.staff ? `<div class="exmedia">${staffSVG(Object.assign({ play: false }, ex.staff))}</div>` : "") +
    (ex.pianoShow ? `<div class="exmedia">${pianoSVG({ hl: ex.pianoShow, lo: ex.lo || 60, hi: ex.hi || 72, small: true })}</div>` : "");
  const qhtml = `<div class="q"><span class="qnum">${num}</span>${ex.q}</div>` + media;
  if (ex.t === "piano") {
    const pid = id + "-p";
    pianoSel[pid] = new Set();
    inner = qhtml + `<div class="exmedia">${pianoSVG({ lo: ex.lo || 60, hi: ex.hi || 72, sel: true, id: pid })}</div>
      <button class="btn small" onclick="answerPiano('${id}')">Check</button>
      <div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  } else if (ex.t === "mcq") {
    const order = shuffle(ex.opts.map((o, i) => i));
    exHandlers[id].order = order;
    inner = qhtml + `<div class="opts">` + order.map((oi, pos) =>
      `<button class="optbtn" id="${id}-o${pos}" onclick="answerMCQ('${id}',${pos})">${esc(ex.opts[oi])}</button>`
    ).join("") + `</div><div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  } else {
    const label = ex.t === "tr" ? "Answer:" : "";
    inner = `<div class="q"><span class="qnum">${num}</span>${label ? label + " " : ""}${ex.t === "tr" ? "<b>" + esc(ex.q) + "</b>" : ex.q}</div>${media}
      <div class="fillrow">
        <input type="text" id="${id}-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ex.t === "tr" ? "Type your answer…" : "Type your answer…"}" onkeydown="if(event.key==='Enter')answerFill('${id}')">
        <button class="btn small" onclick="answerFill('${id}')">Check</button>
      </div>
      ${accentBar(id + "-in")}
      <div class="verdict" id="${id}-v" role="status" aria-live="polite"></div>`;
  }
  return `<div class="exwrap" id="${id}">${inner}</div>`;
}
function finishExercise(id, correct, extraMsg) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  h.answered = true;
  const v = document.getElementById(id + "-v");
  const ex = h.ex;
  if (correct) {
    v.className = "verdict ok";
    v.innerHTML = "✓ Correct!" + (extraMsg ? ` <span class="expl">${extraMsg}</span>` : "") + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
    addXP(5);
  } else {
    v.className = "verdict no";
    const ans = ex.t === "mcq" ? ex.opts[ex.a] : (ex.t === "piano" ? ex.a.join(" – ") : (Array.isArray(ex.a) ? ex.a[0] : ex.a));
    v.innerHTML = `✗ Not quite. Answer: <b class="it">${esc(ans)}</b>` + (ex.ex ? ` <span class="expl">${ex.ex}</span>` : "");
  }
  if (h.cb) h.cb(correct);
}
function answerMCQ(id, pos) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const ex = h.ex, chosen = h.order[pos];
  const correct = chosen === ex.a;
  for (let p = 0; p < h.order.length; p++) {
    const b = document.getElementById(id + "-o" + p);
    b.disabled = true;
    if (h.order[p] === ex.a) b.classList.add("right");
    else if (p === pos && !correct) b.classList.add("wrong");
  }
  finishExercise(id, correct);
}
function answerFill(id) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const val = document.getElementById(id + "-in").value;
  if (!val.trim()) return;
  const m = matchAnswer(val, h.ex.a);
  document.getElementById(id + "-in").disabled = true;
  finishExercise(id, m > 0, m === 1 ? `Watch the spelling: <b class="it">${esc(Array.isArray(h.ex.a) ? h.ex.a[0] : h.ex.a)}</b>` : null);
}
function answerPiano(id) {
  const h = exHandlers[id];
  if (!h || h.answered) return;
  const sel = pianoSel[id + "-p"] || new Set();
  if (!sel.size) { toast("Tap some keys first!"); return; }
  const want = new Set(h.ex.a.map(n => ((noteNum(String(n)) % 12) + 12) % 12));
  const got = new Set([...sel].map(m => ((m % 12) + 12) % 12));
  const ok = want.size === got.size && [...want].every(x => got.has(x));
  finishExercise(id, ok);
  if (ok) playSpec({ type: "chord", notes: [...sel].sort((a, b) => a - b) });
}

/* ---------- quiz session ---------- */
let quiz = null;
function uniqueTextOptions(correct, candidates) {
  const seen = new Set([String(correct)]);
  const distractors = [];
  for (const candidate of shuffle(candidates)) {
    const text = String(candidate);
    if (seen.has(text)) continue;
    seen.add(text);
    distractors.push(text);
    if (distractors.length === 3) break;
  }
  return shuffle([String(correct), ...distractors]);
}
function buildQuizQuestions(unit) {
  const authored = shuffle(unit.exercises).slice(0, 6);
  const vocabPool = shuffle(unit.vocab.map((v, i) => i)).slice(0, 10 - authored.length);
  const italianCounts = new Map();
  const englishCounts = new Map();
  for (const [it, en] of unit.vocab) {
    italianCounts.set(it, (italianCounts.get(it) || 0) + 1);
    englishCounts.set(en, (englishCounts.get(en) || 0) + 1);
  }
  const vocabQs = vocabPool.map(idx => {
    const v = unit.vocab[idx];
    const canAskItToEn = italianCounts.get(v[0]) === 1;
    const canAskEnToIt = englishCounts.get(v[1]) === 1;
    const askItToEn = !canAskEnToIt || (canAskItToEn && Math.random() < 0.5);
    if (askItToEn) {
      const opts = uniqueTextOptions(v[1], unit.vocab.map(o => o[1]));
      return { t: "mcq", q: `What does <b class="it">${esc(v[0])}</b> mean?`, opts, a: opts.indexOf(String(v[1])) };
    }
    const opts = uniqueTextOptions(v[0], unit.vocab.map(o => o[0]));
    return { t: "mcq", q: `Which term matches: “${esc(v[1])}”?`, opts, a: opts.indexOf(String(v[0])) };
  });
  return shuffle(authored.concat(vocabQs));
}
function viewQuizStart(uid) {
  const found = unitById(uid);
  if (!found) { document.getElementById("main").innerHTML = "<p>Unit not found.</p>"; return; }
  quiz = { uid, qs: buildQuizQuestions(found.unit), i: 0, correct: 0 };
  renderQuizQ();
}
function renderQuizQ() {
  const main = document.getElementById("main");
  const found = unitById(quiz.uid);
  if (quiz.i >= quiz.qs.length) { renderQuizResult(); return; }
  EX_SEQ = 0; for (const k in exHandlers) delete exHandlers[k];
  const q = quiz.qs[quiz.i];
  main.innerHTML = `<p style="margin:0 0 4px"><a href="#/unit/${quiz.uid}/quiz" onclick="quiz=null">← Quit quiz</a></p>
    <h1>Quiz: ${found.unit.title}</h1>

    ${renderExercise(q, quiz.i + 1, { onAnswer: (ok) => { if (ok) quiz.correct++; showQuizNext(); } })}
    <div id="quiznext"></div>`;
}
function showQuizNext() {
  document.getElementById("quiznext").innerHTML =
    `<button class="btn primary" style="margin-top:6px" onclick="quiz.i++;renderQuizQ()">${quiz.i + 1 >= quiz.qs.length ? "See result →" : "Next →"}</button>`;

function renderQuizResult() {
  const pct = Math.round(100 * quiz.correct / quiz.qs.length);
  const uid = quiz.uid;
